<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1680" viewBox="0 0 360 1680" role="img" aria-labelledby="title desc"><title id="title">研究怎样接到下一轮</title><desc id="desc">任务和本轮输入进入助手比较与研究员取材，形成候选底稿。顾问取舍、研究员形成采用版本，再投递到约定渠道。结果不明先查状态，渠道接收只证明到达该环节。客户是否使用需另取事实，本例负责人据建议选例，带回原有工作的记录。研究员连回原判断，助手准备更新，顾问作取舍。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#35634e"/></marker></defs><rect width="360" height="1680" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="40" font-size="24" font-weight="600" text-anchor="start" fill="#273b31">一项研究怎样接到下一轮</text><text x="24" y="74" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">采用、送达、使用各有依据</text><path d="M24 104 H318 L336 122 V214 H24 Z" fill="white" stroke="#35634e" stroke-width="2"/><path d="M318 104 V122 H336" fill="none" stroke="#35634e" stroke-width="2"/><text x="42" y="144" font-size="20" font-weight="600" text-anchor="start" fill="#273b31">任务与本轮输入</text><text x="42" y="183" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">客户目的、原文与当前事实</text><path d="M180 214 V266" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="24" y="266" width="312" height="110" rx="8" fill="#edf1e9" stroke="#35634e" stroke-width="2"/><text x="42" y="306" font-size="20" font-weight="600" text-anchor="start" fill="#273b31">助手阅读与比较</text><text x="42" y="345" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">研究员联系取材与核查</text><path d="M180 376 V428" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M24 428 H318 L336 446 V538 H24 Z" fill="white" stroke="#35634e" stroke-width="2"/><path d="M318 428 V446 H336" fill="none" stroke="#35634e" stroke-width="2"/><text x="42" y="468" font-size="20" font-weight="600" text-anchor="start" fill="#273b31">候选底稿</text><text x="42" y="507" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">依据、比较和待查问题</text><path d="M180 538 V590" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M24 590 H318 L336 608 V710 H24 Z" fill="white" stroke="#35634e" stroke-width="2"/><path d="M318 590 V608 H336" fill="none" stroke="#35634e" stroke-width="2"/><text x="42" y="630" font-size="20" font-weight="600" text-anchor="start" fill="#273b31">顾问取舍，研究员定稿</text><text x="42" y="670" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">本轮采用版本与采用理由</text><path d="M180 710 V762" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="24" y="762" width="312" height="110" rx="8" fill="#edf1e9" stroke="#35634e" stroke-width="2"/><text x="42" y="802" font-size="20" font-weight="600" text-anchor="start" fill="#273b31">投递当前采用版本</text><text x="42" y="841" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">核对接收人与约定渠道</text><path d="M180 872 V896 H94 V924" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M180 896 H266 V924" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="24" y="924" width="140" height="134" rx="8" fill="#fbf2e6" stroke="#805126" stroke-width="2"/><text x="36" y="964" font-size="20" font-weight="600" text-anchor="start" fill="#273b31">结果不明</text><text x="36" y="1003" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">先查状态</text><text x="36" y="1038" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">保留原请求</text><path d="M196 924 H318 L336 942 V1058 H196 Z" fill="white" stroke="#35634e" stroke-width="2"/><path d="M318 924 V942 H336" fill="none" stroke="#35634e" stroke-width="2"/><text x="208" y="964" font-size="20" font-weight="600" text-anchor="start" fill="#273b31">渠道接收</text><text x="208" y="1003" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">只知送达</text><text x="208" y="1038" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">此环节</text><path d="M94 1058 V1082" fill="none" stroke="#805126" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M82 1082 H106" fill="none" stroke="#805126" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M266 1058 V1088 H180 V1120" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="24" y="1120" width="312" height="116" rx="8" fill="white" stroke="#35634e" stroke-width="2"/><text x="42" y="1160" font-size="20" font-weight="600" text-anchor="start" fill="#273b31">另取客户使用事实</text><text x="42" y="1201" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">本例：负责人按建议选例</text><path d="M180 1236 V1280" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M24 1280 H318 L336 1298 V1396 H24 Z" fill="white" stroke="#35634e" stroke-width="2"/><path d="M318 1280 V1298 H336" fill="none" stroke="#35634e" stroke-width="2"/><text x="42" y="1320" font-size="20" font-weight="600" text-anchor="start" fill="#273b31">客户原工作记录返回</text><text x="42" y="1361" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">仍需工程师确认适用性</text><path d="M180 1396 V1440" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="24" y="1440" width="312" height="116" rx="8" fill="#edf1e9" stroke="#35634e" stroke-width="2"/><text x="42" y="1480" font-size="20" font-weight="600" text-anchor="start" fill="#273b31">研究员连回原判断</text><text x="42" y="1521" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">助手准备更新，顾问作取舍</text><path d="M24 1498 H6 V160 H24" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="24" y="1622" font-size="18" font-weight="400" text-anchor="start" fill="#805126">记录原工作，不等于问答效果</text></g></svg>