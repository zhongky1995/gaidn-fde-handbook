<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1390" width="360" height="1390" role="img" aria-labelledby="title desc"><title id="title">方法、事实与责任怎样配合</title><desc id="desc">同一还原工作的方法帮助研究员与AI研究助手比较本次手册和服务单，找出设备配置未知。客户工程师对照本台记录：领用只证明组件发出，不能确认完成；本台加装完成确认才使其能够确认已加装及适用说明。顾问和研究员据已确认关系选择调查方向；方法不代替客户事实。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#35634e"/></marker></defs><rect width="360" height="1390" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="40" font-size="24" font-weight="600" fill="#273b31" text-anchor="start">同一方法，怎样进入新任务</text><text x="24" y="74" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">沿用方法，重取事实，接好责任</text><path d="M24 104 H318 L336 122 V200 H24 Z" fill="white" stroke="#35634e" stroke-width="2"/><path d="M318 104 V122 H336" fill="none" stroke="#35634e" stroke-width="2"/><text x="42" y="142" font-size="20" font-weight="600" fill="#273b31" text-anchor="start">沿用的方法</text><text x="42" y="178" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">还原工作，辨认阻塞</text><path d="M180 200 V246" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M24 246 H318 L336 264 V370 H24 Z" fill="white" stroke="#35634e" stroke-width="2"/><path d="M318 246 V264 H336" fill="none" stroke="#35634e" stroke-width="2"/><text x="42" y="284" font-size="20" font-weight="600" fill="#273b31" text-anchor="start">本次服务单与两份说明</text><text x="42" y="321" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">问题已明确，配置尚待确认</text><text x="42" y="351" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">标准配置与加装配置适用不同</text><path d="M180 370 V420" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="24" y="420" width="312" height="118" rx="8" fill="#edf1e9" stroke="#35634e" stroke-width="2"/><text x="42" y="460" font-size="20" font-weight="600" fill="#273b31" text-anchor="start">研究员＋AI研究助手</text><text x="42" y="501" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">并列适用条件，找出缺口</text><path d="M180 538 V586" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="24" y="586" width="312" height="118" rx="8" fill="white" stroke="#35634e" stroke-width="2"/><text x="42" y="626" font-size="20" font-weight="600" fill="#273b31" text-anchor="start">客户工程师</text><text x="42" y="667" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">对照本台设备的相关记录</text><path d="M180 704 V740 H94 V790" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M180 740 H266 V790" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M24 790 H146 L164 808 V924 H24 Z" fill="white" stroke="#35634e" stroke-width="2"/><path d="M146 790 V808 H164" fill="none" stroke="#35634e" stroke-width="2"/><text x="36" y="830" font-size="20" font-weight="600" fill="#273b31" text-anchor="start">组件领用</text><text x="36" y="868" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">只知已发出</text><text x="36" y="903" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">不能确认完成</text><path d="M196 790 H318 L336 808 V924 H196 Z" fill="white" stroke="#35634e" stroke-width="2"/><path d="M318 790 V808 H336" fill="none" stroke="#35634e" stroke-width="2"/><text x="208" y="830" font-size="18" font-weight="600" fill="#273b31" text-anchor="start">本台完成确认</text><text x="208" y="868" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">确认已加装</text><text x="208" y="903" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">可定适用说明</text><path d="M94 924 V950" fill="none" stroke="#805126" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M82 950 H106" fill="none" stroke="#805126" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M266 924 V990 H180 V1038" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="24" y="1038" width="312" height="130" rx="8" fill="#edf1e9" stroke="#35634e" stroke-width="2"/><text x="42" y="1080" font-size="20" font-weight="600" fill="#273b31" text-anchor="start">顾问与研究员</text><text x="42" y="1118" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">据已确认关系选择调查方向</text><text x="42" y="1151" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">再看问答能帮助哪段准备</text><text x="24" y="1230" font-size="18" font-weight="400" fill="#805126" text-anchor="start">工具帮助比较，工程师确认事实</text><text x="24" y="1267" font-size="18" font-weight="400" fill="#805126" text-anchor="start">方法引导查什么，不代替事实</text><text x="24" y="1334" font-size="18" font-weight="400" fill="#805126" text-anchor="start">领用记录不通向“已完成”</text></g></svg>