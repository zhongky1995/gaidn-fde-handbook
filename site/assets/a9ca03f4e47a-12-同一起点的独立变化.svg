<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1170" viewBox="0 0 360 1170" role="img" aria-labelledby="title desc"><title id="title">同一起点的三条独立变化分支</title><desc id="desc">从已经能做限定事项研究、重要取舍仍需顾问的共同起点，分别只改变技术、客户任务或内部能力。技术改善跨资料比较，可以重新考察原来难常做的研究或停止普通摘要投入；客户已选工具后要看采用，可转向复核或收窄停止；内部更多人能准备较复杂条件比较、解释方法调整，内部工程能维护取材版本联系后，可深化或尝试相邻领域，但新事实仍需取得，维护过重可收缩。三分支不累计成成长史。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#35634e"/></marker></defs><rect width="360" height="1170" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="40" font-size="24" font-weight="600" text-anchor="start" fill="#273b31">同一起点，三种独立变化</text><text x="24" y="74" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">每条分支只改变一类条件</text><rect x="24" y="104" width="312" height="134" rx="8" fill="#edf1e9" stroke="#35634e" stroke-width="2"/><text x="42" y="145" font-size="20" font-weight="600" text-anchor="start" fill="#273b31">共同起点</text><text x="42" y="184" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">已有一类事项研究可运行</text><text x="42" y="219" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">重要判断仍需顾问，事实要取得</text><path d="M180 238 V272 H68 V318" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M180 272 V318" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M180 272 H292 V318" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M20 318 H98 L116 336 V466 H20 Z" fill="white" stroke="#35634e" stroke-width="2"/><path d="M98 318 V336 H116" fill="none" stroke="#35634e" stroke-width="2"/><text x="32" y="354" font-size="18" font-weight="600" text-anchor="start" fill="#273b31">只变技术</text><text x="32" y="397" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">跨资料</text><text x="32" y="433" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">比较更强</text><path d="M68 466 V518" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="20" y="518" width="96" height="174" rx="8" fill="#edf1e9" stroke="#35634e" stroke-width="2"/><text x="32" y="559" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">重看原来</text><text x="32" y="597" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">难常做的</text><text x="32" y="635" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">变化研究</text><path d="M68 692 V744" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="20" y="744" width="96" height="210" rx="8" fill="white" stroke="#35634e" stroke-width="2"/><text x="32" y="785" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">可以深化</text><text x="32" y="823" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">或停止</text><text x="32" y="861" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">普通摘要</text><path d="M132 318 H210 L228 336 V466 H132 Z" fill="white" stroke="#35634e" stroke-width="2"/><path d="M210 318 V336 H228" fill="none" stroke="#35634e" stroke-width="2"/><text x="144" y="354" font-size="18" font-weight="600" text-anchor="start" fill="#273b31">只变客户</text><text x="144" y="397" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">已选工具</text><text x="144" y="433" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">转向采用</text><path d="M180 466 V518" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="132" y="518" width="96" height="174" rx="8" fill="#edf1e9" stroke="#35634e" stroke-width="2"/><text x="144" y="559" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">先取一段</text><text x="144" y="597" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">试用过程</text><text x="144" y="635" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">研究扩大</text><path d="M180 692 V744" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="132" y="744" width="96" height="210" rx="8" fill="white" stroke="#35634e" stroke-width="2"/><text x="144" y="785" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">转向复核</text><text x="144" y="823" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">或收窄</text><text x="144" y="861" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">停止服务</text><path d="M244 318 H322 L340 336 V466 H244 Z" fill="white" stroke="#35634e" stroke-width="2"/><path d="M322 318 V336 H340" fill="none" stroke="#35634e" stroke-width="2"/><text x="256" y="354" font-size="18" font-weight="600" text-anchor="start" fill="#273b31">只变能力</text><path d="M292 466 V518" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="244" y="518" width="96" height="174" rx="8" fill="#edf1e9" stroke="#35634e" stroke-width="2"/><path d="M292 692 V744" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="244" y="744" width="96" height="210" rx="8" fill="white" stroke="#35634e" stroke-width="2"/><text x="256" y="785" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">深化当前</text><text x="256" y="823" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">或试相邻</text><text x="256" y="861" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">维护过重</text><text x="256" y="899" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">则可收缩</text><text x="24" y="1038" font-size="18" font-weight="400" text-anchor="start" fill="#805126">三次都从共同起点重新比较</text><text x="24" y="1078" font-size="18" font-weight="400" text-anchor="start" fill="#805126">分支不相加，也不规定必经路线</text><text x="24" y="1124" font-size="18" font-weight="400" text-anchor="start" fill="#805126">新技术、用途与能力均为教学条件</text><text x="256" y="391" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">多人准备</text><text x="256" y="421" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">更复杂的</text><text x="256" y="451" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">条件比较</text><text x="256" y="551" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">解释方法</text><text x="256" y="585" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">调整理由</text><text x="256" y="619" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">工程维护</text><text x="256" y="653" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">取材版本</text></g></svg>