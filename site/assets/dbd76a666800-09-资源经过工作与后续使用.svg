<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1180" viewBox="0 0 360 1180" role="img" aria-labelledby="title desc"><title id="title">资源消耗与可再用能力</title><desc id="desc">模型能力与本轮用量、当前材料工具和人及工程共同进入研究劳动。token计量部分处理消耗。研究产物成为本次可用结果仍需核查与采用；留下的依据与方法需要选择、检验、保持适用且实际再用，才支持下一轮能力，消耗量不直接成为经验存量。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#35634e"/></marker></defs><rect width="360" height="1180" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="40" font-size="24" font-weight="600" text-anchor="start" fill="#273b31">用量怎样经过工作起作用</text><text x="24" y="74" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">消耗记录与可再用能力分开</text><path d="M24 112 H146 L164 130 V262 H24 Z" fill="white" stroke="#35634e" stroke-width="2"/><path d="M146 112 V130 H164" fill="none" stroke="#35634e" stroke-width="2"/><text x="36" y="152" font-size="20" font-weight="600" text-anchor="start" fill="#273b31">模型能力</text><text x="36" y="194" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">本轮用量</text><text x="36" y="233" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">token等计量</text><path d="M196 112 H318 L336 130 V262 H196 Z" fill="white" stroke="#35634e" stroke-width="2"/><path d="M318 112 V130 H336" fill="none" stroke="#35634e" stroke-width="2"/><text x="208" y="152" font-size="20" font-weight="600" text-anchor="start" fill="#273b31">当前条件</text><text x="208" y="194" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">材料与工具</text><text x="208" y="233" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">人和工程</text><path d="M94 262 V300 H180 V346" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M266 262 V300 H180" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="346" width="312" height="130" rx="8" fill="#edf1e9" stroke="#35634e" stroke-width="2"/><text x="42" y="387" font-size="20" font-weight="600" text-anchor="start" fill="#273b31">本轮研究劳动</text><text x="42" y="426" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">读入、比较、准备与修订</text><text x="42" y="459" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">不同资源在具体工作中配合</text><path d="M180 476 V520 H94 V564" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M180 520 H266 V564" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M24 564 H146 L164 582 V728 H24 Z" fill="white" stroke="#35634e" stroke-width="2"/><path d="M146 564 V582 H164" fill="none" stroke="#35634e" stroke-width="2"/><text x="36" y="604" font-size="20" font-weight="600" text-anchor="start" fill="#273b31">本次结果</text><text x="36" y="646" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">核查与采用</text><text x="36" y="685" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">各取依据</text><path d="M196 564 H318 L336 582 V728 H196 Z" fill="white" stroke="#35634e" stroke-width="2"/><path d="M318 564 V582 H336" fill="none" stroke="#35634e" stroke-width="2"/><text x="208" y="604" font-size="20" font-weight="600" text-anchor="start" fill="#273b31">留存产物</text><text x="208" y="646" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">依据与方法</text><text x="208" y="685" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">选择与检验</text><path d="M266 728 V790" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="196" y="790" width="140" height="164" rx="8" fill="white" stroke="#35634e" stroke-width="2" stroke-dasharray="6 4"/><text x="208" y="831" font-size="18" font-weight="600" text-anchor="start" fill="#273b31">适用且再用</text><text x="208" y="871" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">才支持</text><text x="208" y="911" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">下一轮能力</text><rect x="24" y="790" width="140" height="164" rx="8" fill="#fbf2e6" stroke="#805126" stroke-width="2"/><text x="36" y="831" font-size="20" font-weight="600" text-anchor="start" fill="#273b31">本轮消耗</text><text x="36" y="871" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">已经发生</text><text x="36" y="911" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">如实计入</text><text x="24" y="1040" font-size="18" font-weight="400" text-anchor="start" fill="#805126">token记录部分处理消耗</text><text x="24" y="1080" font-size="18" font-weight="400" text-anchor="start" fill="#805126">经验的用途要在后续工作中检验</text><text x="24" y="1138" font-size="18" font-weight="400" text-anchor="start" fill="#805126">虚线：后续适用与使用仍需成立</text></g></svg>