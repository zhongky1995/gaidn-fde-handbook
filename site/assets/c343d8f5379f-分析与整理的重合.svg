<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1318" width="360" height="1318" role="img" aria-labelledby="title desc"><title id="title">当下分析与后续整理，可以共用一部分产物</title><desc id="desc">咨询公司的研究助手帮助把客户委托、产品原文与访谈组织成分析。人准备材料、核对取舍，并选留采用的底稿。中央同一份底稿跨在当前分析和后续接续两个阶段之间：已用于本次建议的背景、证据关系和采用理由，可成为下一次补充、更新和再用的起点，可能减少重复恢复。传统完整底稿也能这样接续；新事实、选择保存和维护仍需劳动，准备与检查也计入投入，图不表示时间、比例或净节省。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#35634e"/></marker></defs><rect width="360" height="1318" fill="white"/><g font-family="'PingFang SC','Microsoft YaHei',sans-serif"><text x="24" y="38" font-size="24" font-weight="600" fill="#273b31" text-anchor="start">当下分析与后续整理</text><text x="24" y="72" font-size="24" font-weight="600" fill="#273b31" text-anchor="start">可以共用一部分产物</text><rect x="12" y="98" width="336" height="82" rx="8" fill="#f7f8f4" stroke="#6d8274" stroke-width="2"/><text x="24" y="132" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">原团队已有档案、底稿与复盘</text><text x="24" y="164" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">完整底稿同样可以支持接续</text><rect x="12" y="216" width="336" height="420" rx="8" fill="#edf1e9" stroke="#35634e" stroke-width="2"/><rect x="12" y="636" width="336" height="376" rx="8" fill="#f7f8f4" stroke="#6d8274" stroke-width="2"/><text x="24" y="252" font-size="20" font-weight="600" fill="#273b31" text-anchor="start">当下：为客户形成建议</text><path d="M24 280 H102 L120 298 V354 H24 Z" fill="white" stroke="#6d8274" stroke-width="2"/><path d="M102 280 V298 H120" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M132 280 H210 L228 298 V354 H132 Z" fill="white" stroke="#6d8274" stroke-width="2"/><path d="M210 280 V298 H228" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M240 280 H318 L336 298 V354 H240 Z" fill="white" stroke="#6d8274" stroke-width="2"/><path d="M318 280 V298 H336" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="325" font-size="18" font-weight="400" fill="#273b31" text-anchor="middle">客户委托</text><text x="180" y="325" font-size="18" font-weight="400" fill="#273b31" text-anchor="middle">产品原文</text><text x="288" y="325" font-size="18" font-weight="400" fill="#273b31" text-anchor="middle">访谈材料</text><path d="M72 354 V378 H180 V406" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M180 354 V378" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M288 354 V378 H180" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="406" width="312" height="112" rx="8" fill="white" stroke="#35634e" stroke-width="2"/><text x="42" y="446" font-size="20" font-weight="600" fill="#273b31" text-anchor="start">研究助手整理与比较</text><text x="42" y="490" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">研究员准备材料，顾问核对取舍</text><path d="M180 518 V564" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="198" y="548" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">研究员选留</text><path d="M36 564 H306 L324 582 V780 H36 Z" fill="white" stroke="#6d8274" stroke-width="2"/><path d="M306 564 V582 H324" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="54" y="603" font-size="20" font-weight="600" fill="#273b31" text-anchor="start">已采用的分析底稿</text><text x="54" y="642" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">背景与证据关系</text><text x="54" y="681" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">比较、待查与重要修订</text><text x="54" y="720" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">采用理由与原文入口</text><text x="54" y="756" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">本次建议已使用这些内容</text><text x="24" y="824" font-size="20" font-weight="600" fill="#273b31" text-anchor="start">继续研究时</text><path d="M180 780 V864" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="198" y="841" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">底稿可用时</text><rect x="24" y="864" width="312" height="126" rx="8" fill="white" stroke="#35634e" stroke-width="2"/><text x="42" y="902" font-size="20" font-weight="600" fill="#273b31" text-anchor="start">沿底稿补充、更新和再用</text><text x="42" y="943" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">可少一些重复恢复背景和依据</text><text x="42" y="977" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">再用仍需专业取舍与检验</text><rect x="12" y="1048" width="336" height="200" rx="8" fill="#fbf2e6" stroke="#805126" stroke-width="2"/><text x="24" y="1086" font-size="20" font-weight="600" fill="#273b31" text-anchor="start">仍需计入的投入</text><text x="24" y="1128" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">电话目标、新记录与结果要取得</text><text x="24" y="1166" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">选择保存、追溯说明和维护</text><text x="24" y="1204" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">任务准备与检查也计入本次投入</text><text x="24" y="1290" font-size="18" font-weight="400" fill="#805126" text-anchor="start">不表示总成本必然更低</text></g></svg>