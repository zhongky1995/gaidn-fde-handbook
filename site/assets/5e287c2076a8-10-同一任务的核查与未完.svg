<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1260" viewBox="0 0 360 1260" role="img" aria-labelledby="title desc"><title id="title">同一批任务的核查队列</title><desc id="desc">拥堵教学变式中20项均已准备，每项5分钟，共100分钟。核查每项30分钟，当月容量480分钟，最多核查16项。本例另设16项已通过并跟进，4项底稿待核查，已占20分钟准备。剩余核查120分钟和跟进40分钟。本期发生860人工分钟，仍待160分钟，完整计划1020分钟；劳动折算1340元和280元，计划1620元。外付和采用数未给出。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#35634e"/></marker></defs><rect width="360" height="1260" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="40" font-size="24" font-weight="600" text-anchor="start" fill="#273b31">准备更快，核查仍会堵</text><text x="24" y="74" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">同一20项，按本期状态分开</text><path d="M24 104 H318 L336 122 V220 H24 Z" fill="white" stroke="#35634e" stroke-width="2"/><path d="M318 104 V122 H336" fill="none" stroke="#35634e" stroke-width="2"/><text x="42" y="145" font-size="20" font-weight="600" text-anchor="start" fill="#273b31">20项都已准备</text><text x="42" y="187" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">每项5分钟，共100分钟</text><path d="M180 220 V266" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="24" y="266" width="312" height="146" rx="8" fill="#edf1e9" stroke="#35634e" stroke-width="2"/><text x="42" y="307" font-size="20" font-weight="600" text-anchor="start" fill="#273b31">核查容量480分钟</text><text x="42" y="347" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">每项30分钟，20项需600分钟</text><text x="42" y="383" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">本月最多核查16项</text><path d="M180 412 V456 H94 V500" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M180 456 H266 V500" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M24 500 H146 L164 518 V688 H24 Z" fill="white" stroke="#35634e" stroke-width="2"/><path d="M146 500 V518 H164" fill="none" stroke="#35634e" stroke-width="2"/><text x="36" y="544" font-size="20" font-weight="600" text-anchor="start" fill="#273b31">本例16项</text><text x="36" y="588" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">已核查通过</text><text x="36" y="626" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">且完成跟进</text><rect x="196" y="500" width="140" height="188" rx="8" fill="#fbf2e6" stroke="#805126" stroke-width="2"/><text x="208" y="544" font-size="24" font-weight="600" text-anchor="start" fill="#273b31">4项</text><text x="208" y="588" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">底稿待核查</text><text x="208" y="626" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">已占准备</text><text x="208" y="661" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">20分钟</text><path d="M266 688 V730 H180 V774" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="24" y="774" width="312" height="118" rx="8" fill="#fbf2e6" stroke="#805126" stroke-width="2"/><text x="42" y="815" font-size="20" font-weight="600" text-anchor="start" fill="#273b31">仍待完成的劳动</text><text x="42" y="857" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">核查120分钟＋跟进40分钟</text><rect x="24" y="944" width="312" height="192" rx="8" fill="white" stroke="#35634e" stroke-width="2"/><text x="42" y="984" font-size="18" font-weight="600" text-anchor="start" fill="#273b31">本期发生＋仍待＝完整计划</text><text x="42" y="1024" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">人工分钟：860＋160＝1020</text><text x="42" y="1065" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">劳动折算（元）：</text><text x="42" y="1105" font-size="18" font-weight="400" text-anchor="start" fill="#273b31">1340＋280＝1620</text><text x="24" y="1206" font-size="18" font-weight="400" text-anchor="start" fill="#805126">本例外付与客户采用数尚未给出</text></g></svg>