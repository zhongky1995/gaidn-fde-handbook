<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1490" width="360" height="1490" role="img" aria-labelledby="title desc"><title id="title">新条件怎样改变研究范围</title><desc id="desc">同一事项的原观察范围中，标准配置和资料关系已确认；新安排只让其中一组计划加装，尚未完成。研究员与AI助手对照受影响对象，顾问修订范围：未改装且适用关系明确的组继续当前观察；计划加装组先由客户技术资料负责人补完成记录及适用说明，具备并核对后再讨论改装后任务，图中没有把这个待做条件画成完成。服务负责人接回修订并带回实际记录，支持下一轮判断。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#35634e"/></marker></defs><rect width="360" height="1490" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="24" y="40" font-size="24" font-weight="600" fill="#273b31" text-anchor="start">新安排改变哪部分研究</text><text x="24" y="74" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">同一事项，按受影响范围修订</text><path d="M24 104 H318 L336 122 V216 H24 Z" fill="white" stroke="#35634e" stroke-width="2"/><path d="M318 104 V122 H336" fill="none" stroke="#35634e" stroke-width="2"/><text x="42" y="143" font-size="20" font-weight="600" fill="#273b31" text-anchor="start">原观察范围</text><text x="42" y="181" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">标准配置与适用资料已确认</text><path d="M180 216 V254" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="24" y="254" width="312" height="130" rx="8" fill="#fbf2e6" stroke="#805126" stroke-width="2"/><text x="42" y="295" font-size="20" font-weight="600" fill="#273b31" text-anchor="start">新安排：其中一组计划加装</text><text x="42" y="334" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">加装尚未完成</text><text x="42" y="367" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">客户希望观察改装后的答复</text><path d="M180 384 V426" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="24" y="426" width="312" height="114" rx="8" fill="#edf1e9" stroke="#35634e" stroke-width="2"/><text x="42" y="465" font-size="20" font-weight="600" fill="#273b31" text-anchor="start">研究员＋AI研究助手</text><text x="42" y="505" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">对照对象、原依据与新条件</text><path d="M180 540 V582" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="24" y="582" width="312" height="104" rx="8" fill="white" stroke="#35634e" stroke-width="2"/><text x="42" y="621" font-size="20" font-weight="600" fill="#273b31" text-anchor="start">顾问判断本轮研究范围</text><text x="42" y="660" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">保留仍成立的，分开待证的</text><path d="M180 686 V724 H94 V774" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M180 724 H266 V774" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M24 774 H146 L164 792 V948 H24 Z" fill="white" stroke="#35634e" stroke-width="2"/><path d="M146 774 V792 H164" fill="none" stroke="#35634e" stroke-width="2"/><text x="36" y="814" font-size="20" font-weight="600" fill="#273b31" text-anchor="start">未改装组</text><text x="36" y="851" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">适用关系</text><text x="36" y="884" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">仍然明确</text><text x="36" y="926" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">继续当前观察</text><rect x="196" y="774" width="140" height="174" rx="8" fill="#fbf2e6" stroke="#805126" stroke-width="2"/><text x="208" y="814" font-size="20" font-weight="600" fill="#273b31" text-anchor="start">计划加装组</text><text x="208" y="851" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">改装后条件</text><text x="208" y="884" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">仍然待证</text><text x="208" y="926" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">先补相应依据</text><path d="M266 948 V1000" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="196" y="1000" width="140" height="152" rx="8" fill="white" stroke="#35634e" stroke-width="2"/><text x="208" y="1039" font-size="18" font-weight="600" fill="#273b31" text-anchor="start">待客户技术</text><text x="208" y="1074" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">资料负责人</text><text x="208" y="1110" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">补完成记录</text><text x="208" y="1139" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">及适用依据</text><path d="M266 1152 V1220" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="196" y="1220" width="140" height="120" rx="8" fill="white" stroke="#805126" stroke-width="2" stroke-dasharray="6 4"/><text x="208" y="1259" font-size="18" font-weight="600" fill="#273b31" text-anchor="start">若依据已核对</text><text x="208" y="1295" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">再讨论改装后</text><text x="208" y="1325" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">相应任务</text><path d="M94 948 V1000" fill="none" stroke="#35634e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="24" y="1000" width="140" height="152" rx="8" fill="#edf1e9" stroke="#35634e" stroke-width="2"/><text x="36" y="1039" font-size="18" font-weight="600" fill="#273b31" text-anchor="start">服务负责人</text><text x="36" y="1074" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">按修订选取</text><text x="36" y="1110" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">观察对象</text><text x="36" y="1139" font-size="18" font-weight="400" fill="#273b31" text-anchor="start">带回过程记录</text><text x="24" y="1394" font-size="18" font-weight="400" fill="#805126" text-anchor="start">虚线框：仍待条件具备后讨论</text><text x="24" y="1431" font-size="18" font-weight="400" fill="#805126" text-anchor="start">计划加装不能当作当前已完成</text></g></svg>