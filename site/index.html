yJ5oiQ5pys77yM5LiN55u05o6l6KGl5Ye66ZyA5rGCPC90ZXh0Pjwvc3ZnPg==\" alt=\"少配限制可见销量，旧记录支持继续少配；售罄与询问暴露缺项，受控改变供给并观察，才能取得原循环外的证据。\">\u003c/p>\n\u003ch2 id=\"lesson-32-section-2\">需要新的观察，不能只把旧记录整理得更好\u003c/h2>\n\u003cp>售罄后有人问，首先说明有未观察需求，并没有给出数量。可以在资源允许范围内追加供给、开放预订、跟踪未买到后的行为。每种方法都有成本和偏差，也可能影响其他门店。\u003c/p>\n\u003cp>这些投入的理由，是让新观察有机会不同于原安排制造的数据。始终只给80份，又只用成交评价原需求，难以认识上限以外的部分。\u003c/p>\n\u003ch2 id=\"lesson-32-section-3\">一个有效方案，也会遇到失效条件\u003c/h2>\n\u003cp>改用\u003ca href=\"#case-a\">连锁案例\u003c/a>的独立变化情景：交通入口关闭，需求变为X50、Y90，价格、变动成本及扩产费用仍相同。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>供货安排\u003c/th>\n\u003cth>售出/剩余\u003c/th>\n\u003cth align=\"right\">列示贡献\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>原80/80，生产160\u003c/td>\n\u003ctd>130/30\u003c/td>\n\u003ctd align=\"right\">920元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>改100/60，生产160\u003c/td>\n\u003ctd>110/50\u003c/td>\n\u003ctd align=\"right\">680元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>仍扩160/60，生产220\u003c/td>\n\u003ctd>110/110\u003c/td>\n\u003ctd align=\"right\">360元\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>继续扩大旧数量，比原安排少560元。这里应调整的，是需求认识与当期方案。若交通在决定前已知却没被使用，改资料调用；若事后突变，则改响应和资源，而不是用事后事实指责事前所有判断。\u003c/p>\n\u003ch2 id=\"lesson-32-section-4\">修订要改变后续行为\u003c/h2>\n\u003cp>设备工单把“换件”纠正为“未换件”，最终原件改了，旧总结若仍主动推荐，错误还会继续。需要明确哪条事实保留、哪项解释变化、当前入口显示什么，并把反例放入代表任务。\u003c/p>\n\u003cp>停止采用不等于删除历史。保留依据有助于理解为什么改变，当前工作则应知道什么已经不适用。旧成功吸引资源和注意力，探索与利用研究也提醒我们这种惯性。\u003ca href=\"https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003cp>积累越多，更新越重要。一家能够把反例变成方法变化的企业，才有机会让经验增长继续帮助经营，而非让AI把过去的错误讲得更有把握。\u003c/p>\n","headings":[{"id":"lesson-32-section-1","label":"行动会决定未来看见什么"},{"id":"lesson-32-section-2","label":"需要新的观察，不能只把旧记录整理得更好"},{"id":"lesson-32-section-3","label":"一个有效方案，也会遇到失效条件"},{"id":"lesson-32-section-4","label":"修订要改变后续行为"}],"exportMd":"# 第32章｜为什么企业会用越来越多的数据，证明旧判断正确\n\nX店长期少配，早早售罄，系统反复记录80份。总部据此继续按80安排；门店认为推介没有意义，需求线索更少。每条销售记录都真实，组合起来却可能把企业困在旧上限。\n\n经验更新既要吸收新内容，也要能改变当前采用的方法。\n\n## 行动会决定未来看见什么\n\n不服务某类客户，就缺少其后续需求；工单提前关闭，复发又建新单，就难看见问题延续；只存已采用方案，未采用理由就不会帮助下一次。\n\nAI进入生产后可能更快复制这种选择，也可能帮助发现循环。关键是哪些反馈进入模型与人员判断，哪些被工作安排遮住。[系统反馈研究](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n![少配限制可见销量，旧记录支持继续少配；售罄与询问暴露缺项，受控改变供给并观察，才能取得原循环外的证据。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNjUwIiB2aWV3Qm94PSIwIDAgMzYwIDY1MCIgcm9sZT0iaW1nIj48dGl0bGU+5Y+N6aaI5Lmf5Y+v6IO95Zu65YyW5YGP5beuPC90aXRsZT48ZGVzYz7lsJHphY3pmZDliLbplIDph4/vvIzlj5fpmZDplIDph4/mlK/mjIHnu6fnu63lsJHphY3jgILllK7nvYTkv6Hmga/mmrTpnLLnvLrpobnvvIzlj5fmjqfmlLnlj5jkvpvnu5nlubbop4Llr5/miY3og73lj5blvpfljp/lvqrnjq/lpJbnmoTmlrDor4Hmja7jgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjY1MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7lj43ppojkuZ/lj6/og73lm7rljJblgY/lt648L3RleHQ+PHJlY3QgeD0iMzAiIHk9Ijg4IiB3aWR0aD0iMTU0IiBoZWlnaHQ9IjY3IiByeD0iNiIgZmlsbD0iI2VkZjNlZCIgc3Ryb2tlPSIjNjA3MzZjIiBzdHJva2Utd2lkdGg9IjEuNSIvPjx0ZXh0IHg9IjEwNy4wIiB5PSIxMTUuMCIgZm9udC1mYW1pbHk9IlBpbmdGYW5nIFNDLE1pY3Jvc29mdCBZYUhlaSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmaWxsPSIjMjEzND 决定未来看见什么\n\n不服务某类客户，就缺少其后续需求；工单提前关闭，复发又建新单，就难看见问题延续；只存已采用方案，未采用理由就不会帮助下一次。\n\nAI进入生产后可能更快复制这种选择，也可能帮助发现循环。关键是哪些反馈进入模型与人员判断，哪些被工作安排遮住。[系统反馈研究](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n![少配限制可见销量，旧记录支持继续少配；售罄与询问暴露缺项，受控改变供给并观察，才能取得原循环外的证据。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNjUwIiB2aWV3Qm94PSIwIDAgMzYwIDY1MCIgcm9sZT0iaW1nIj48dGl0bGU+5Y+N6aaI5Lmf5Y+v6IO95Zu65YyW5YGP5beuPC90aXRsZT48ZGVzYz7lsJHphY3pmZDliLbplIDph4/vvIzlj5fpmZDplIDph4/mlK/mjIHnu6fnu63lsJHphY3jgILllK7nvYTkv6Hmga/mmrTpnLLnvLrpobnvvIzlj5fmjqfmlLnlj5jkvpvnu5nlubbop4Llr5/miY3og73lj5blvpfljp/lvqrnjq/lpJbnmoTmlrDor4Hmja7jgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjY1MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7lj43ppojkuZ/lj6/og73lm7rljJblgY/lt648L3RleHQ+PHJlY3QgeD0iMzAiIHk9Ijg4IiB3aWR0aD0iMTU0IiBoZWlnaHQ9IjY3IiByeD0iNiIgZmlsbD0iI2VkZjNlZCIgc3Ryb2tlPSIjNjA3MzZjIiBzdHJva2Utd2lkdGg9IjEuNSIvPjx0ZXh0IHg9IjEwNy4wIiB5PSIxMTUuMCIgZm9udC1mYW1pbHk9IlBpbmdGYW5nIFNDLE1pY3Jvc29mdCBZYUhlaSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmaWxsPSIjMjEzNDJmIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXdlaWdodD0iNDAwIj7lsJHphY08L3RleHQ+PHRleHQgeD0iMTA3LjAiIHk9IjE0MC4wIiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyMTM0MmYiIHRleHQtYW5jaG9 lIiBmb250LXdlaWdodD0iNDAwIj7llK7nvYTkuI7or6Lpl67vvJrnnIvop4HnvLrpobk8L3RleHQ+PHRleHQgeD0iMTgwIiB5PSI1MzIiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxOCIgZmlsbD0iIzg3NWQyMiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC13ZWlnaHQ9IjQwMCI+6K+V5pS55L6b57uZ77yM6KeC5a+f5YWo572R57uT5p6cPC90ZXh0PjxwYXRoIGQ9Ik0zMzIgNTE2SDM0OFYyNDlIMzMyIiBmaWxsPSJub25lIiBzdHJva2U9IiMxNjVkNTIiIHN0cm9rZS13aWR0aD0iMiIgbWFya2VyLWVuZD0idXJsKCNhcnJvdykiLz48dGV4dCB4PSIyNCIgeT0iNjIwIiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM4NzVkMjIiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjQwMCI+5o6i57Si5pyJ5oiQ5pys77yM5LiN55u05o6l6KGl5Ye66ZyA5rGCPC90ZXh0Pjwvc3ZnPg==)\n\n## 需要新的观察，不能只把旧记录整理得更好\n\n售罄后有人问，首先说明有未观察需求，并没有给出数量。可以在资源允许范围内追加供给、开放预订、跟踪未买到后的行为。每种方法都有成本和偏差，也可能影响其他门店。\n\n这些投入的理由，是让新观察有机会不同于原安排制造的数据。始终只给80份，又只用成交评价原需求，难以认识上限以外的部分。\n\n## 一个有效方案，也会遇到失效条件\n\n改用[连锁案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-a)的独立变化情景：交通入口关闭，需求变为X50、Y90，价格、变动成本及扩产费用仍相同。\n\n| 供货安排 | 售出/剩余 | 列示贡献 |\n|---|---|---:|\n| 原80/80，生产160 | 130/30 | 920元 |\n| 改100/60，生产160 | 110/50 | 680元 |\n| 仍扩160/60，生产220 | 110/110 | 360元 |\n\n继续扩大旧数量，比原安排少560元。这里应调整的，是需求认识与当期方案。若交通在决定前已知却没被使用，改资料调用；若事后突变，则改响应和资源，而不是用事后事实指责事前所有判断。\n\n## 修订要改变后续行为\n\n设备工单把“换件”纠正为“未换件”，最终原件改了，旧总结若仍主动推荐，错误还会继续。需要明确哪条事实保留、哪项解释变化、当前入口显示什么，并把反例放入代表任务。\n\n停止采用不等于删除历史。保留依据有助于理解为什么改变，当前工作则应知道什么已经不适用。旧成功吸引资源和注意力，探索与利用研究也提醒我们这种惯性。[原始研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)\n\n积累越多，更新越重要。一家能够把反例变成方法变化的企业，才有机会让经验增长继续帮助经营，而非让AI把过去的错误讲得更有把握。\n","text":"# 第32章｜为什么企业会用越来越多的数据，证明旧判断正确\n\nX店长期少配，早早售罄，系统反复记录80份。总部据此继续按80安排；门店认为推介没有意义，需求线索更少。每条销售记录都真实，组合起来却可能把企业困在旧上限。\n\n经验更新既要吸收新内容，也要能改变当前采用的方法。\n\n## 行动会决定未来看见什么\n\n不服务某类客户，就缺少其后续需求；工单提前关闭，复发又建新单，就难看见问题延续；只存已采用方案，未采用理由就不会帮助下一次。\n\nAI进入生产后可能更快复制这种选择，也可能帮助发现循环。关键是哪些反馈进入模型与人员判断，哪些被工作安排遮住。系统反馈研究\n\n \n\n## 需要新的观察，不能只把旧记录整理得更好\n\n售罄后有人问，首先说明有未观察需求，并没有给出数量。可以在资源允许范围内追加供给、开放预订、跟踪未买到后的行为。每种方法都有成本和偏差，也可能影响其他门店。\n\n这些投入的理由，是让新观察有机会不同于原安排制造的数据。始终只给80份，又只用成交评价原需求，难以认识上限以外的部分。\n\n## 一个有效方案，也会遇到失效条件\n\n改用连锁案例的独立变化情景：交通入口关闭，需求变为X50、Y90，价格、变动成本及扩产费用仍相同。\n\n| 供货安排 | 售出/剩余 | 列示贡献 |\n|---|---|---:|\n| 原80/80，生产160 | 130/30 | 920元 |\n| 改100/60，生产160 | 110/50 | 680元 |\n| 仍扩160/60，生产220 | 110/110 | 360元 |\n\n继续扩大旧数量，比原安排少560元。这里应调整的，是需求认识与当期方案。若交通在决定前已知却没被使用，改资料调用；若事后突变，则改响应和资源，而不是用事后事实指责事前所有判断。\n\n## 修订要改变后续行为\n\n设备工单把“换件”纠正为“未换件”，最终原件改了，旧总结若仍主动推荐，错误还会继续。需要明确哪条事实保留、哪项解释变化、当前入口显示什么，并把反例放入代表任务。\n\n停止采用不等于删除历史。保留依据有助于理解为什么改变，当前工作则应知道什么已经不适用。旧成功吸引资源和注意力，探索与利用研究也提醒我们这种惯性。原始研究\n\n积累越多，更新越重要。一家能够把反例变成方法变化的企业，才有机会让经验增长继续帮助经营，而非让AI把过去的错误讲得更有把握。\n"},{"file":"33-岗位权责与激励.md","id":"lesson-33","number":33,"role":"核心课","part":6,"title":"第33章｜系统已经给出好建议，员工为什么还会按旧方式工作","md":"# 第33章｜系统已经给出好建议，员工为什么还会按旧方式工作\n\nX店没货后不再推介，工坊按成交量排产，门店又因剩余被追问。若增加AI，却继续让每个岗位承担原来的局部目标，建议可能依然进不了生产。\n\n技术使关系更可见，岗位目标、时间和决定权则影响关系能不能改变。\n\n## 局部指标怎样塑造行为\n\n只看剩余，店长有理由少配；只看关单数，技术员可能先结束状态；只看稿件数，团队会扩大生成。人员在多项任务之间分配注意力，容易被可计量部分牵引。多任务激励研究解释了这一机制。[原始研究](https://web.stanford.edu/~milgrom/publishedarticles/Multitask%20Principal%20Agent.pdf)\n\n在[连锁案例](案例A-连锁备货.md)里，需要把商品可得性、剩余、实际贡献与重要例外联系起来。不是给员工堆更多指标，而是让评价接近他能够影响的真实结果。\n\n如果供给由总部限制，不能只责怪门店没有做推广；如果推广带来新需求，生产与配送也要有相应响应。责任与可用资源要放在同一条业务里安排。\n\n## 留下经验，也是在重新安排劳动\n\n要求专家事后写长文，会与交付争时间。可以让AI从自然材料起草，专家确认关键事实和差别，由内部维护者与FDE把纠正组织进方法和工具。\n\n贡献若只是被用来提高次日任务量，员工未必愿意持续解释和报告异常。必要时间、角色发展和改进的收益需要被看见。经验贡献应成为正式工作，而不只依赖热情。\n\n设备案例的“未换件”纠正，既修当前工单，也暴露一类共同错误；让它进入系统修订和带教，是有用判断的贡献。按条目数量奖励，反而可能鼓励更多无效文字。\n\n## 谁有权改变，谁需要参与\n\n| 工作 | 需要有人实际承担 |\n|---|---|\n| 客户价值和资源取舍 | 业务负责人 |\n| 专业方法与适用判断 | 相应专业人员 |\n| 资料、工具与系统改变 | FDE及工程力量 |\n| 正式采用、执行和结果 | 实际业务岗位 |\n| 后续维护与接任 | 内部承担者与持续支持 |\n\n角色可以由多人或同一人组合，重要的是动作有对应责任。FDE不能独自承诺产量，员工也不应承担自己无权改变的规则后果。\n\n经营上的目标，是让报告坏结果、指出不适用和提出改法也能成为正常生产。只有真实反馈愿意进入系统，AI才能帮助企业越做越懂自己的业务。\n","html":"\u003ch1>第33章｜系统已经给出好建议，员工为什么还会按旧方式工作\u003c/h1>\n\u003cp>X店没货后不再推介，工坊按成交量排产，门店又因剩余被追问。若增加AI，却继续让每个岗位承担原来的局部目标，建议可能依然进不了生产。\u003c/p>\n\u003cp>技术使关系更可见，岗位目标、时间和决定权则影响关系能不能改变。\u003c/p>\n\u003ch2 id=\"lesson-33-section-1\">局部指标怎样塑造行为\u003c/h2>\n\u003cp>只看剩余，店长有理由少配；只看关单数，技术员可能先结束状态；只看稿件数，团队会扩大生成。人员在多项任务之间分配注意力，容易被可计量部分牵引。多任务激励研究解释了这一机制。\u003ca href=\"https://web.stanford.edu/~milgrom/publishedarticles/Multitask%20Principal%20Agent.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003cp>在\u003ca href=\"#case-a\">连锁案例\u003c/a>里，需要把商品可得性、剩余、实际贡献与重要例外联系起来。不是给员工堆更多指标，而是让评价接近他能够影响的真实结果。\u003c/p>\n\u003cp>如果供给由总部限制，不能只责怪门店没有做推广；如果推广带来新需求，生产与配送也要有相应响应。责任与可用资源要放在同一条业务里安排。\u003c/p>\n\u003ch2 id=\"lesson-33-section-2\">留下经验，也是在重新安排劳动\u003c/h2>\n\u003cp>要求专家事后写长文，会与交付争时间。可以让AI从自然材料起草，专家确认关键事实和差别，由内部维护者与FDE把纠正组织进方法和工具。\u003c/p>\n\u003cp>贡献若只是被用来提高次日任务量，员工未必愿意持续解释和报告异常。必要时间、角色发展和改进的收益需要被看见。经验贡献应成为正式工作，而不只依赖热情。\u003c/p>\n\u003cp>设备案例的“未换件”纠正，既修当前工单，也暴露一类共同错误；让它进入系统修订和带教，是有用判断的贡献。按条目数量奖励，反而可能鼓励更多无效文字。\u003c/p>\n\u003ch2 id=\"lesson-33-section-3\">谁有权改变，谁需要参与\u003c/h2>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>工作\u003c/th>\n\u003cth>需要有人实际承担\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>客户价值和资源取舍\u003c/td>\n\u003ctd>业务负责人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>专业方法与适用判断\u003c/td>\n\u003ctd>相应专业人员\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>资料、工具与系统改变\u003c/td>\n\u003ctd>FDE及工程力量\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>正式采用、执行和结果\u003c/td>\n\u003ctd>实际业务岗位\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>后续维护与接任\u003c/td>\n\u003ctd>内部承担者与持续支持\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>角色可以由多人或同一人组合，重要的是动作有对应责任。FDE不能独自承诺产量，员工也不应承担自己无权改变的规则后果。\u003c/p>\n\u003cp>经营上的目标，是让报告坏结果、指出不适用和提出改法也能成为正常生产。只有真实反馈愿意进入系统，AI才能帮助企业越做越懂自己的业务。\u003c/p>\n","headings":[{"id":"lesson-33-section-1","label":"局部指标怎样塑造行为"},{"id":"lesson-33-section-2","label":"留下经验，也是在重新安排劳动"},{"id":"lesson-33-section-3","label":"谁有权改变，谁需要参与"}],"exportMd":"# 第33章｜系统已经给出好建议，员工为什么还会按旧方式工作\n\nX店没货后不再推介，工坊按成交量排产，门店又因剩余被追问。若增加AI，却继续让每个岗位承担原来的局部目标，建议可能依然进不了生产。\n\n技术使关系更可见，岗位目标、时间和决定权则影响关系能不能改变。\n\n## 局部指标怎样塑造行为\n\n只看剩余，店长有理由少配；只看关单数，技术员可能先结束状态；只看稿件数，团队会扩大生成。人员在多项任务之间分配注意力，容易被可计量部分牵引。多任务激励研究解释了这一机制。[原始研究](https://web.stanford.edu/~milgrom/publishedarticles/Multitask%20Principal%20Agent.pdf)\n\n在[连锁案例](#case-a)里，需要把商品可得性、剩余、实际贡献与重要例外联系起来。不是给员工堆更多指标，而是让评价接近他能够影响的真实结果。\n\n如果供给由总部限制，不能只责怪门店没有做推广；如果推广带来新需求，生产与配送也要有相应响应。责任与可用资源要放在同一条业务里安排。\n\n## 留下经验，也是在重新安排劳动\n\n要求专家事后写长文，会与交付争时间。可以让AI从自然材料起草，专家确认关键事实和差别，由内部维护者与FDE把纠正组织进方法和工具。\n\n贡献若只是被用来提高次日任务量，员工未必愿意持续解释和报告异常。必要时间、角色发展和改进的收益需要被看见。经验贡献应成为正式工作，而不只依赖热情。\n\n设备案例的“未换件”纠正，既修当前工单，也暴露一类共同错误；让它进入系统修订和带教，是有用判断的贡献。按条目数量奖励，反而可能鼓励更多无效文字。\n\n## 谁有权改变，谁需要参与\n\n| 工作 | 需要有人实际承担 |\n|---|---|\n| 客户价值和资源取舍 | 业务负责人 |\n| 专业方法与适用判断 | 相应专业人员 |\n| 资料、工具与系统改变 | FDE及工程力量 |\n| 正式采用、执行和结果 | 实际业务岗位 |\n| 后续维护与接任 | 内部承担者与持续支持 |\n\n角色可以由多人或同一人组合，重要的是动作有对应责任。FDE不能独自承诺产量，员工也不应承担自己无权改变的规则后果。\n\n经营上的目标，是让报告坏结果、指出不适用和提出改法也能成为正常生产。只有真实反馈愿意进入系统，AI才能帮助企业越做越懂自己的业务。\n","exportSingleMd":"# 第33章｜系统已经给出好建议，员工为什么还会按旧方式工作\n\nX店没货后不再推介，工坊按成交量排产，门店又因剩余被追问。若增加AI，却继续让每个岗位承担原来的局部目标，建议可能依然进不了生产。\n\n技术使关系更可见，岗位目标、时间和决定权则影响关系能不能改变。\n\n## 局部指标怎样塑造行为\n\n只看剩余，店长有理由少配；只看关单数，技术员可能先结束状态；只看稿件数，团队会扩大生成。人员在多项任务之间分配注意力，容易被可计量部分牵引。多任务激励研究解释了这一机制。[原始研究](https://web.stanford.edu/~milgrom/publishedarticles/Multitask%20Principal%20Agent.pdf)\n\n在[连锁案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-a)里，需要把商品可得性、剩余、实际贡献与重要例外联系起来。不是给员工堆更多指标，而是让评价接近他能够影响的真实结果。\n\n如果供给由总部限制，不能只责怪门店没有做推广；如果推广带来新需求，生产与配送也要有相应响应。责任与可用资源要放在同一条业务里安排。\n\n## 留下经验，也是在重新安排劳动\n\n要求专家事后写长文，会与交付争时间。可以让AI从自然材料起草，专家确认关键事实和差别，由内部维护者与FDE把纠正组织进方法和工具。\n\n贡献若只是被用来提高次日任务量，员工未必愿意持续解释和报告异常。必要时间、角色发展和改进的收益需要被看见。经验贡献应成为正式工作，而不只依赖热情。\n\n设备案例的“未换件”纠正，既修当前工单，也暴露一类共同错误；让它进入系统修订和带教，是有用判断的贡献。按条目数量奖励，反而可能鼓励更多无效文字。\n\n## 谁有权改变，谁需要参与\n\n| 工作 | 需要有人实际承担 |\n|---|---|\n| 客户价值和资源取舍 | 业务负责人 |\n| 专业方法与适用判断 | 相应专业人员 |\n| 资料、工具与系统改变 | FDE及工程力量 |\n| 正式采用、执行和结果 | 实际业务岗位 |\n| 后续维护与接任 | 内部承担者与持续支持 |\n\n角色可以由多人或同一人组合，重要的是动作有对应责任。FDE不能独自承诺产量，员工也不应承担自己无权改变的规则后果。\n\n经营上的目标，是让报告坏结果、指出不适用和提出改法也能成为正常生产。只有真实反馈愿意进入系统，AI才能帮助企业越做越懂自己的业务。\n","text":"# 第33章｜系统已经给出好建议，员工为什么还会按旧方式工作\n\nX店没货后不再推介，工坊按成交量排产，门店又因剩余被追问。若增加AI，却继续让每个岗位承担原来的局部目标，建议可能依然进不了生产。\n\n技术使关系更可见，岗位目标、时间和决定权则影响关系能不能改变。\n\n## 局部指标怎样塑造行为\n\n只看剩余，店长有理由少配；只看关单数，技术员可能先结束状态；只看稿件数，团队会扩大生成。人员在多项任务之间分配注意力，容易被可计量部分牵引。多任务激励研究解释了这一机制。原始研究\n\n在连锁案例里，需要把商品可得性、剩余、实际贡献与重要例外联系起来。不是给员工堆更多指标，而是让评价接近他能够影响的真实结果。\n\n如果供给由总部限制，不能只责怪门店没有做推广；如果推广带来新需求，生产与配送也要有相应响应。责任与可用资源要放在同一条业务里安排。\n\n## 留下经验，也是在重新安排劳动\n\n要求专家事后写长文，会与交付争时间。可以让AI从自然材料起草，专家确认关键事实和差别，由内部维护者与FDE把纠正组织进方法和工具。\n\n贡献若只是被用来提高次日任务量，员工未必愿意持续解释和报告异常。必要时间、角色发展和改进的收益需要被看见。经验贡献应成为正式工作，而不只依赖热情。\n\n设备案例的“未换件”纠正，既修当前工单，也暴露一类共同错误；让它进入系统修订和带教，是有用判断的贡献。按条目数量奖励，反而可能鼓励更多无效文字。\n\n## 谁有权改变，谁需要参与\n\n| 工作 | 需要有人实际承担 |\n|---|---|\n| 客户价值和资源取舍 | 业务负责人 |\n| 专业方法与适用判断 | 相应专业人员 |\n| 资料、工具与系统改变 | FDE及工程力量 |\n| 正式采用、执行和结果 | 实际业务岗位 |\n| 后续维护与接任 | 内部承担者与持续支持 |\n\n角色可以由多人或同一人组合，重要的是动作有对应责任。FDE不能独自承诺产量，员工也不应承担自己无权改变的规则后果。\n\n经营上的目标，是让报告坏结果、指出不适用和提出改法也能成为正常生产。只有真实反馈愿意进入系统，AI才能帮助企业越做越懂自己的业务。\n"},{"file":"34-长期FDE共建.md","id":"lesson-34","number":34,"role":"核心课","part":6,"title":"第34章｜长期FDE共建，企业持续购买的究竟是什么","md":"# 第34章｜长期FDE共建，企业持续购买的究竟是什么\n\n第一次工单项目解决了记录，运行以后发现重复报修；追到复访结构，又看到版本核对和配套准备；客户希望更少停机，企业开始考虑怎样组织持续服务。\n\n这些变化来自同一条业务不断深入。每次都重新找人、重新解释，会重复支付认识成本；只维持第一次功能，又无法承担后面的发展。\n\n## 连续性怎样产生价值\n\n长期参与的团队了解原选择、例外、失效方法和系统依赖。新结果返回时，它更容易判断要改资料、工具、方法还是岗位安排，并迅速做出可用变化。\n\n这是一种推进力量。跨岗位问题常没有自然负责者，业务忙于生产，技术收到分散需求；FDE可以把它们连成可执行改造，使通用智能持续进入企业的真实生产。\n\n一次培训提高理解，一次上线提供当时能力。后续每轮发现仍需要工程行动和业务决定，连续能力因此有独立用途。\n\n## 用设备案例看三次相连交付\n\n第一次使设备、实际动作、纠正和结果对应，让AI总结不再把未换件写成换件。检验的是事实质量、记录负担和当前采用。\n\n第二次把重复报修接回设备，分析月30次复访：教学条件中，12次配套与版本问题、8次材料或客户准备不足，另10次必要分阶段服务。于是改造机会聚焦前20次，而非承诺消除全部复访。\n\n第三次根据认识改变派工前准备、专业支持和方法调用，再看实际复访与恢复。若每月新费用6000元、每次可取消外协500元，减少12次才持平；若减少20次，列示支出改善4000元。连续工作有具体价值对象，也有经济约束。\n\n如果发现真正需要的是其他服务安排，第三次就应改方向。所谓持续发展，不是第一次合同预定所有未来功能，而是每阶段都有可用改变和下一项有依据的选择。\n\n## 为什么合作关系也需要设计\n\n有些质量与适应要求很难事先写全，持续合作可以让双方利用共同认识响应新信息。关系合作研究讨论了这种机制，也关注约束与激励。[原始研究](https://faculty.washington.edu/mfan/is582/articles/Baker2002.pdf)\n\nFDE对本企业例外和协作的理解，不能全部原样用于下一家客户；若只按一次功能计价，持续认识容易无人投入。稳定关系可以支持这种投入，阶段成果、接续和可调整安排则使它接受经营评价。\n\n| 企业应能够看见 | 具体检查 |\n|---|---|\n| 现场认识在发展 | 新事实怎样改变问题与方法 |\n| 工程持续有交付 | 真实任务是否使用，错误能否恢复 |\n| 内部能力在形成 | 人员能否判断、维护和接任 |\n| 投入保持相关 | 下一阶段解决什么，为什么值得 |\n\n## 连续合作与企业自立怎样同时成立\n\n内部负责人持续承担客户价值和资源判断，专业人员判断方法，FDE推动工程与采用，内部运行者逐步接住资料和评价。企业不必内建所有技术，但需要知道系统为什么存在、效果怎样解释、下一步为何改变。\n\n业务稳定，可以减少高强度现场参与，保留维护；新产品和新场景打开，再增加共建。关键入口、原件、方法和运行认识应能接续，避免理解全部留在某个外部个人手里。\n\n长期稳定的支柱，是企业持续把认识转成生产能力的机制。合作年限只是条件，真正的积累是下一轮更快、更准确地改变自己的能力。\n","html":"\u003ch1>第34章｜长期FDE共建，企业持续购买的究竟是什么\u003c/h1>\n\u003cp>第一次工单项目解决了记录，运行以后发现重复报修；追到复访结构，又看到版本核对和配套准备；客户希望更少停机，企业开始考虑怎样组织持续服务。\u003c/p>\n\u003cp>这些变化来自同一条业务不断深入。每次都重新找人、重新解释，会重复支付认识成本；只维持第一次功能，又无法承担后面的发展。\u003c/p>\n\u003ch2 id=\"lesson-34-section-1\">连续性怎样产生价值\u003c/h2>\n\u003cp>长期参与的团队了解原选择、例外、失效方法和系统依赖。新结果返回时，它更容易判断要改资料、工具、方法还是岗位安排，并迅速做出可用变化。\u003c/p>\n\u003cp>这是一种推进力量。跨岗位问题常没有自然负责者，业务忙于生产，技术收到分散需求；FDE可以把它们连成可执行改造，使通用智能持续进入企业的真实生产。\u003c/p>\n\u003cp>一次培训提高理解，一次上线提供当时能力。后续每轮发现仍需要工程行动和业务决定，连续能力因此有独立用途。\u003c/p>\n\u003ch2 id=\"lesson-34-section-2\">用设备案例看三次相连交付\u003c/h2>\n\u003cp>第一次使设备、实际动作、纠正和结果对应，让AI总结不再把未换件写成换件。检验的是事实质量、记录负担和当前采用。\u003c/p>\n\u003cp>第二次把重复报修接回设备，分析月30次复访：教学条件中，12次配套与版本问题、8次材料或客户准备不足，另10次必要分阶段服务。于是改造机会聚焦前20次，而非承诺消除全部复访。\u003c/p>\n\u003cp>第三次根据认识改变派工前准备、专业支持和方法调用，再看实际复访与恢复。若每月新费用6000元、每次可取消外协500元，减少12次才持平；若减少20次，列示支出改善4000元。连续工作有具体价值对象，也有经济约束。\u003c/p>\n\u003cp>如果发现真正需要的是其他服务安排，第三次就应改方向。所谓持续发展，不是第一次合同预定所有未来功能，而是每阶段都有可用改变和下一项有依据的选择。\u003c/p>\n\u003ch2 id=\"lesson-34-section-3\">为什么合作关系也需要设计\u003c/h2>\n\u003cp>有些质量与适应要求很难事先写全，持续合作可以让双方利用共同认识响应新信息。关系合作研究讨论了这种机制，也关注约束与激励。\u003ca href=\"https://faculty.washington.edu/mfan/is582/articles/Baker2002.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003cp>FDE对本企业例外和协作的理解，不能全部原样用于下一家客户；若只按一次功能计价，持续认识容易无人投入。稳定关系可以支持这种投入，阶段成果、接续和可调整安排则使它接受经营评价。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>企业应能够看见\u003c/th>\n\u003cth>具体检查\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>现场认识在发展\u003c/td>\n\u003ctd>新事实怎样改变问题与方法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工程持续有交付\u003c/td>\n\u003ctd>真实任务是否使用，错误能否恢复\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>内部能力在形成\u003c/td>\n\u003ctd>人员能否判断、维护和接任\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>投入保持相关\u003c/td>\n\u003ctd>下一阶段解决什么，为什么值得\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"lesson-34-section-4\">连续合作与企业自立怎样同时成立\u003c/h2>\n\u003cp>内部负责人持续承担客户价值和资源判断，专业人员判断方法，FDE推动工程与采用，内部运行者逐步接住资料和评价。企业不必内建所有技术，但需要知道系统为什么存在、效果怎样解释、下一步为何改变。\u003c/p>\n\u003cp>业务稳定，可以减少高强度现场参与，保留维护；新产品和新场景打开，再增加共建。关键入口、原件、方法和运行认识应能接续，避免理解全部留在某个外部个人手里。\u003c/p>\n\u003cp>长期稳定的支柱，是企业持续把认识转成生产能力的机制。合作年限只是条件，真正的积累是下一轮更快、更准确地改变自己的能力。\u003c/p>\n","headings":[{"id":"lesson-34-section-1","label":"连续性怎样产生价值"},{"id":"lesson-34-section-2","label":"用设备案例看三次相连交付"},{"id":"lesson-34-section-3","label":"为什么合作关系也需要设计"},{"id":"lesson-34-section-4","label":"连续合作与企业自立怎样同时成立"}],"exportMd":"# 第34章｜长期FDE共建，企业持续购买的究竟是什么\n\n第一次工单项目解决了记录，运行以后发现重复报修；追到复访结构，又看到版本核对和配套准备；客户希望更少停机，企业开始考虑怎样组织持续服务。\n\n这些变化来自同一条业务不断深入。每次都重新找人、重新解释，会重复支付认识成本；只维持第一次功能，又无法承担后面的发展。\n\n## 连续性怎样产生价值\n\n长期参与的团队了解原选择、例外、失效方法和系统依赖。新结果返回时，它更容易判断要改资料、工具、方法还是岗位安排，并迅速做出可用变化。\n\n这是一种推进力量。跨岗位问题常没有自然负责者，业务忙于生产，技术收到分散需求；FDE可以把它们连成可执行改造，使通用智能持续进入企业的真实生产。\n\n一次培训提高理解，一次上线提供当时能力。后续每轮发现仍需要工程行动和业务决定，连续能力因此有独立用途。\n\n## 用设备案例看三次相连交付\n\n第一次使设备、实际动作、纠正和结果对应，让AI总结不再把未换件写成换件。检验的是事实质量、记录负担和当前采用。\n\n第二次把重复报修接回设备，分析月30次复访：教学条件中，12次配套与版本问题、8次材料或客户准备不足，另10次必要分阶段服务。于是改造机会聚焦前20次，而非承诺消除全部复访。\n\n第三次根据认识改变派工前准备、专业支持和方法调用，再看实际复访与恢复。若每月新费用6000元、每次可取消外协500元，减少12次才持平；若减少20次，列示支出改善4000元。连续工作有具体价值对象，也有经济约束。\n\n如果发现真正需要的是其他服务安排，第三次就应改方向。所谓持续发展，不是第一次合同预定所有未来功能，而是每阶段都有可用改变和下一项有依据的选择。\n\n## 为什么合作关系也需要设计\n\n有些质量与适应要求很难事先写全，持续合作可以让双方利用共同认识响应新信息。关系合作研究讨论了这种机制，也关注约束与激励。[原始研究](https://faculty.washington.edu/mfan/is582/articles/Baker2002.pdf)\n\nFDE对本企业例外和协作的理解，不能全部原样用于下一家客户；若只按一次功能计价，持续认识容易无人投入。稳定关系可以支持这种投入，阶段成果、接续和可调整安排则使它接受经营评价。\n\n| 企业应能够看见 | 具体检查 |\n|---|---|\n| 现场认识在发展 | 新事实怎样改变问题与方法 |\n| 工程持续有交付 | 真实任务是否使用，错误能否恢复 |\n| 内部能力在形成 | 人员能否判断、维护和接任 |\n| 投入保持相关 | 下一阶段解决什么，为什么值得 |\n\n## 连续合作与企业自立怎样同时成立\n\n内部负责人持续承担客户价值和资源判断，专业人员判断方法，FDE推动工程与采用，内部运行者逐步接住资料和评价。企业不必内建所有技术，但需要知道系统为什么存在、效果怎样解释、下一步为何改变。\n\n业务稳定，可以减少高强度现场参与，保留维护；新产品和新场景打开，再增加共建。关键入口、原件、方法和运行认识应能接续，避免理解全部留在某个外部个人手里。\n\n长期稳定的支柱，是企业持续把认识转成生产能力的机制。合作年限只是条件，真正的积累是下一轮更快、更准确地改变自己的能力。\n","exportSingleMd":"# 第34章｜长期FDE共建，企业持续购买的究竟是什么\n\n第一次工单项目解决了记录，运行以后发现重复报修；追到复访结构，又看到版本核对和配套准备；客户希望更少停机，企业开始考虑怎样组织持续服务。\n\n这些变化来自同一条业务不断深入。每次都重新找人、重新解释，会重复支付认识成本；只维持第一次功能，又无法承担后面的发展。\n\n## 连续性怎样产生价值\n\n长期参与的团队了解原选择、例外、失效方法和系统依赖。新结果返回时，它更容易判断要改资料、工具、方法还是岗位安排，并迅速做出可用变化。\n\n这是一种推进力量。跨岗位问题常没有自然负责者，业务忙于生产，技术收到分散需求；FDE可以把它们连成可执行改造，使通用智能持续进入企业的真实生产。\n\n一次培训提高理解，一次上线提供当时能力。后续每轮发现仍需要工程行动和业务决定，连续能力因此有独立用途。\n\n## 用设备案例看三次相连交付\n\n第一次使设备、实际动作、纠正和结果对应，让AI总结不再把未换件写成换件。检验的是事实质量、记录负担和当前采用。\n\n第二次把重复报修接回设备，分析月30次复访：教学条件中，12次配套与版本问题、8次材料或客户准备不足，另10次必要分阶段服务。于是改造机会聚焦前20次，而非承诺消除全部复访。\n\n第三次根据认识改变派工前准备、专业支持和方法调用，再看实际复访与恢复。若每月新费用6000元、每次可取消外协500元，减少12次才持平；若减少20次，列示支出改善4000元。连续工作有具体价值对象，也有经济约束。\n\n如果发现真正需要的是其他服务安排，第三次就应改方向。所谓持续发展，不是第一次合同预定所有未来功能，而是每阶段都有可用改变和下一项有依据的选择。\n\n## 为什么合作关系也需要设计\n\n有些质量与适应要求很难事先写全，持续合作可以让双方利用共同认识响应新信息。关系合作研究讨论了这种机制，也关注约束与激励。[原始研究](https://faculty.washington.edu/mfan/is582/articles/Baker2002.pdf)\n\nFDE对本企业例外和协作的理解，不能全部原样用于下一家客户；若只按一次功能计价，持续认识容易无人投入。稳定关系可以支持这种投入，阶段成果、接续和可调整安排则使它接受经营评价。\n\n| 企业应能够看见 | 具体检查 |\n|---|---|\n| 现场认识在发展 | 新事实怎样改变问题与方法 |\n| 工程持续有交付 | 真实任务是否使用，错误能否恢复 |\n| 内部能力在形成 | 人员能否判断、维护和接任 |\n| 投入保持相关 | 下一阶段解决什么，为什么值得 |\n\n## 连续合作与企业自立怎样同时成立\n\n内部负责人持续承担客户价值和资源判断，专业人员判断方法，FDE推动工程与采用，内部运行者逐步接住资料和评价。企业不必内建所有技术，但需要知道系统为什么存在、效果怎样解释、下一步为何改变。\n\n业务稳定，可以减少高强度现场参与，保留维护；新产品和新场景打开，再增加共建。关键入口、原件、方法和运行认识应能接续，避免理解全部留在某个外部个人手里。\n\n长期稳定的支柱，是企业持续把认识转成生产能力的机制。合作年限只是条件，真正的积累是下一轮更快、更准确地改变自己的能力。\n","text":"# 第34章｜长期FDE共建，企业持续购买的究竟是什么\n\n第一次工单项目解决了记录，运行以后发现重复报修；追到复访结构，又看到版本核对和配套准备；客户希望更少停机，企业开始考虑怎样组织持续服务。\n\n这些变化来自同一条业务不断深入。每次都重新找人、重新解释，会重复支付认识成本；只维持第一次功能，又无法承担后面的发展。\n\n## 连续性怎样产生价值\n\n长期参与的团队了解原选择、例外、失效方法和系统依赖。新结果返回时，它更容易判断要改资料、工具、方法还是岗位安排，并迅速做出可用变化。\n\n这是一种推进力量。跨岗位问题常没有自然负责者，业务忙于生产，技术收到分散需求；FDE可以把它们连成可执行改造，使通用智能持续进入企业的真实生产。\n\n一次培训提高理解，一次上线提供当时能力。后续每轮发现仍需要工程行动和业务决定，连续能力因此有独立用途。\n\n## 用设备案例看三次相连交付\n\n第一次使设备、实际动作、纠正和结果对应，让AI总结不再把未换件写成换件。检验的是事实质量、记录负担和当前采用。\n\n第二次把重复报修接回设备，分析月30次复访：教学条件中，12次配套与版本问题、8次材料或客户准备不足，另10次必要分阶段服务。于是改造机会聚焦前20次，而非承诺消除全部复访。\n\n第三次根据认识改变派工前准备、专业支持和方法调用，再看实际复访与恢复。若每月新费用6000元、每次可取消外协500元，减少12次才持平；若减少20次，列示支出改善4000元。连续工作有具体价值对象，也有经济约束。\n\n如果发现真正需要的是其他服务安排，第三次就应改方向。所谓持续发展，不是第一次合同预定所有未来功能，而是每阶段都有可用改变和下一项有依据的选择。\n\n## 为什么合作关系也需要设计\n\n有些质量与适应要求很难事先写全，持续合作可以让双方利用共同认识响应新信息。关系合作研究讨论了这种机制，也关注约束与激励。原始研究\n\nFDE对本企业例外和协作的理解，不能全部原样用于下一家客户；若只按一次功能计价，持续认识容易无人投入。稳定关系可以支持这种投入，阶段成果、接续和可调整安排则使它接受经营评价。\n\n| 企业应能够看见 | 具体检查 |\n|---|---|\n| 现场认识在发展 | 新事实怎样改变问题与方法 |\n| 工程持续有交付 | 真实任务是否使用，错误能否恢复 |\n| 内部能力在形成 | 人员能否判断、维护和接任 |\n| 投入保持相关 | 下一阶段解决什么，为什么值得 |\n\n## 连续合作与企业自立怎样同时成立\n\n内部负责人持续承担客户价值和资源判断，专业人员判断方法，FDE推动工程与采用，内部运行者逐步接住资料和评价。企业不必内建所有技术，但需要知道系统为什么存在、效果怎样解释、下一步为何改变。\n\n业务稳定，可以减少高强度现场参与，保留维护；新产品和新场景打开，再增加共建。关键入口、原件、方法和运行认识应能接续，避免理解全部留在某个外部个人手里。\n\n长期稳定的支柱，是企业持续把认识转成生产能力的机制。合作年限只是条件，真正的积累是下一轮更快、更准确地改变自己的能力。\n"},{"file":"35-内部吸收与接续.md","id":"lesson-35","number":35,"role":"核心课","part":6,"title":"第35章｜企业自己的AI能力，怎样从共同工作里长出来","md":"# 第35章｜企业自己的AI能力，怎样从共同工作里长出来\n\n学过模型、知识库和Agent，仍可能不知道一项业务变化该改哪里。设备增加V2，内部负责人至少要能解释旧经验是否还能采用、资料由谁确认、哪些任务需专业支持，才能真正控制自己的使用范围。\n\n这项能力不要求他亲自写检索代码，却比会操作界面多了一层业务判断。\n\n## 内部需要接住哪些工作\n\n客户价值由谁判断，方法与事实由谁确认，系统怎样运行，资源和结果怎样解释，这些责任可以分散在多人之间。组织吸收能力依赖相关认识及内部沟通，不是个人术语知识的简单相加。[原始研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n企业不必理解每种模型内部原理，但要掌握到能够作选择、识别重要缺口、协调正确支持的程度。\n\n## 用一项真实责任逐步培养\n\n在[报价案例](案例B-智能资源成本.md)里，内部成员可以先追一次客户期限是否完整进入候选。随后与工程师维护适配条件和反例，知道一项修订该进入原件、方法还是工具。\n\n再组织一次方案变更比较：选择代表询价，说明哪些材料不参与调试，核对质量、人工与实际采用，解释结果为何支持某种范围。工程仍可负责具体实现。\n\n最后由原承担者暂时退出一项工作，观察其他人能否继续。交接应表现为工作真的接续，而不仅是收到了文档。\n\n| 发展阶段 | 可观察的内部能力 |\n|---|---|\n| 理解 | 说清输出用于谁的什么决定 |\n| 判断 | 识别关键缺项、冲突与不适用 |\n| 改变 | 说明改什么、为什么、怎样比较 |\n| 接续 | 换人后正常工作与必要异常仍能处理 |\n\n## 共建怎样避免变成旁观\n\n外部团队独自处理全部材料和评价，内部只看演示，很难形成相关认识。更有效的参与，是共同处理一次版本冲突、解释一次失败、改变一项真实工作。\n\n参与也需要有用途。长期旁听所有技术会议，未必比独立追完一笔询价更有学习价值。FDE解释技术取舍，业务人员提供现场判断，双方用真实结果建立共同语言。\n\nAWS的共建自述提出生产部署与客户接续目标，可作为目标参照；企业仍要用自己的任务观察是否接住。[官方材料](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)\n\n## 小企业也可以有合理组合\n\n任务量不足以养完整技术部门时，可使用外部专业力量。内部保留客户理解、关键事实、价值判断与资源安排，专业技术由合适团队持续支持。\n\n培训因此应围绕这种承担设计：追材料和执行，判断方法，比较资源，维护一次经验，再作阶段选择。当能力在企业内部逐渐分布、可以接任，外部共建才开始成为企业自己的支撑。\n","html":"\u003ch1>第35章｜企业自己的AI能力，怎样从共同工作里长出来\u003c/h1>\n\u003cp>学过模型、知识库和Agent，仍可能不知道一项业务变化该改哪里。设备增加V2，内部负责人至少要能解释旧经验是否还能采用、资料由谁确认、哪些任务需专业支持，才能真正控制自己的使用范围。\u003c/p>\n\u003cp>这项能力不要求他亲自写检索代码，却比会操作界面多了一层业务判断。\u003c/p>\n\u003ch2 id=\"lesson-35-section-1\">内部需要接住哪些工作\u003c/h2>\n\u003cp>客户价值由谁判断，方法与事实由谁确认，系统怎样运行，资源和结果怎样解释，这些责任可以分散在多人之间。组织吸收能力依赖相关认识及内部沟通，不是个人术语知识的简单相加。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003cp>企业不必理解每种模型内部原理，但要掌握到能够作选择、识别重要缺口、协调正确支持的程度。\u003c/p>\n\u003ch2 id=\"lesson-35-section-2\">用一项真实责任逐步培养\u003c/h2>\n\u003cp>在\u003ca href=\"#case-b\">报价案例\u003c/a>里，内部成员可以先追一次客户期限是否完整进入候选。随后与工程师维护适配条件和反例，知道一项修订该进入原件、方法还是工具。\u003c/p>\n\u003cp>再组织一次方案变更比较：选择代表询价，说明哪些材料不参与调试，核对质量、人工与实际采用，解释结果为何支持某种范围。工程仍可负责具体实现。\u003c/p>\n\u003cp>最后由原承担者暂时退出一项工作，观察其他人能否继续。交接应表现为工作真的接续，而不仅是收到了文档。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>发展阶段\u003c/th>\n\u003cth>可观察的内部能力\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>理解\u003c/td>\n\u003ctd>说清输出用于谁的什么决定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>判断\u003c/td>\n\u003ctd>识别关键缺项、冲突与不适用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>改变\u003c/td>\n\u003ctd>说明改什么、为什么、怎样比较\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接续\u003c/td>\n\u003ctd>换人后正常工作与必要异常仍能处理\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"lesson-35-section-3\">共建怎样避免变成旁观\u003c/h2>\n\u003cp>外部团队独自处理全部材料和评价，内部只看演示，很难形成相关认识。更有效的参与，是共同处理一次版本冲突、解释一次失败、改变一项真实工作。\u003c/p>\n\u003cp>参与也需要有用途。长期旁听所有技术会议，未必比独立追完一笔询价更有学习价值。FDE解释技术取舍，业务人员提供现场判断，双方用真实结果建立共同语言。\u003c/p>\n\u003cp>AWS的共建自述提出生产部署与客户接续目标，可作为目标参照；企业仍要用自己的任务观察是否接住。\u003ca href=\"https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers\" target=\"_blank\" rel=\"noopener noreferrer\">官方材料\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-35-section-4\">小企业也可以有合理组合\u003c/h2>\n\u003cp>任务量不足以养完整技术部门时，可使用外部专业力量。内部保留客户理解、关键事实、价值判断与资源安排，专业技术由合适团队持续支持。\u003c/p>\n\u003cp>培训因此应围绕这种承担设计：追材料和执行，判断方法，比较资源，维护一次经验，再作阶段选择。当能力在企业内部逐渐分布、可以接任，外部共建才开始成为企业自己的支撑。\u003c/p>\n","headings":[{"id":"lesson-35-section-1","label":"内部需要接住哪些工作"},{"id":"lesson-35-section-2","label":"用一项真实责任逐步培养"},{"id":"lesson-35-section-3","label":"共建怎样避免变成旁观"},{"id":"lesson-35-section-4","label":"小企业也可以有合理组合"}],"exportMd":"# 第35章｜企业自己的AI能力，怎样从共同工作里长出来\n\n学过模型、知识库和Agent，仍可能不知道一项业务变化该改哪里。设备增加V2，内部负责人至少要能解释旧经验是否还能采用、资料由谁确认、哪些任务需专业支持，才能真正控制自己的使用范围。\n\n这项能力不要求他亲自写检索代码，却比会操作界面多了一层业务判断。\n\n## 内部需要接住哪些工作\n\n客户价值由谁判断，方法与事实由谁确认，系统怎样运行，资源和结果怎样解释，这些责任可以分散在多人之间。组织吸收能力依赖相关认识及内部沟通，不是个人术语知识的简单相加。[原始研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n企业不必理解每种模型内部原理，但要掌握到能够作选择、识别重要缺口、协调正确支持的程度。\n\n## 用一项真实责任逐步培养\n\n在[报价案例](#case-b)里，内部成员可以先追一次客户期限是否完整进入候选。随后与工程师维护适配条件和反例，知道一项修订该进入原件、方法还是工具。\n\n再组织一次方案变更比较：选择代表询价，说明哪些材料不参与调试，核对质量、人工与实际采用，解释结果为何支持某种范围。工程仍可负责具体实现。\n\n最后由原承担者暂时退出一项工作，观察其他人能否继续。交接应表现为工作真的接续，而不仅是收到了文档。\n\n| 发展阶段 | 可观察的内部能力 |\n|---|---|\n| 理解 | 说清输出用于谁的什么决定 |\n| 判断 | 识别关键缺项、冲突与不适用 |\n| 改变 | 说明改什么、为什么、怎样比较 |\n| 接续 | 换人后正常工作与必要异常仍能处理 |\n\n## 共建怎样避免变成旁观\n\n外部团队独自处理全部材料和评价，内部只看演示，很难形成相关认识。更有效的参与，是共同处理一次版本冲突、解释一次失败、改变一项真实工作。\n\n参与也需要有用途。长期旁听所有技术会议，未必比独立追完一笔询价更有学习价值。FDE解释技术取舍，业务人员提供现场判断，双方用真实结果建立共同语言。\n\nAWS的共建自述提出生产部署与客户接续目标，可作为目标参照；企业仍要用自己的任务观察是否接住。[官方材料](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)\n\n## 小企业也可以有合理组合\n\n任务量不足以养完整技术部门时，可使用外部专业力量。内部保留客户理解、关键事实、价值判断与资源安排，专业技术由合适团队持续支持。\n\n培训因此应围绕这种承担设计：追材料和执行，判断方法，比较资源，维护一次经验，再作阶段选择。当能力在企业内部逐渐分布、可以接任，外部共建才开始成为企业自己的支撑。\n","exportSingleMd":"# 第35章｜企业自己的AI能力，怎样从共同工作里长出来\n\n学过模型、知识库和Agent，仍可能不知道一项业务变化该改哪里。设备增加V2，内部负责人至少要能解释旧经验是否还能采用、资料由谁确认、哪些任务需专业支持，才能真正控制自己的使用范围。\n\n这项能力不要求他亲自写检索代码，却比会操作界面多了一层业务判断。\n\n## 内部需要接住哪些工作\n\n客户价值由谁判断，方法与事实由谁确认，系统怎样运行，资源和结果怎样解释，这些责任可以分散在多人之间。组织吸收能力依赖相关认识及内部沟通，不是个人术语知识的简单相加。[原始研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n企业不必理解每种模型内部原理，但要掌握到能够作选择、识别重要缺口、协调正确支持的程度。\n\n## 用一项真实责任逐步培养\n\n在[报价案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-b)里，内部成员可以先追一次客户期限是否完整进入候选。随后与工程师维护适配条件和反例，知道一项修订该进入原件、方法还是工具。\n\n再组织一次方案变更比较：选择代表询价，说明哪些材料不参与调试，核对质量、人工与实际采用，解释结果为何支持某种范围。工程仍可负责具体实现。\n\n最后由原承担者暂时退出一项工作，观察其他人能否继续。交接应表现为工作真的接续，而不仅是收到了文档。\n\n| 发展阶段 | 可观察的内部能力 |\n|---|---|\n| 理解 | 说清输出用于谁的什么决定 |\n| 判断 | 识别关键缺项、冲突与不适用 |\n| 改变 | 说明改什么、为什么、怎样比较 |\n| 接续 | 换人后正常工作与必要异常仍能处理 |\n\n## 共建怎样避免变成旁观\n\n外部团队独自处理全部材料和评价，内部只看演示，很难形成相关认识。更有效的参与，是共同处理一次版本冲突、解释一次失败、改变一项真实工作。\n\n参与也需要有用途。长期旁听所有技术会议，未必比独立追完一笔询价更有学习价值。FDE解释技术取舍，业务人员提供现场判断，双方用真实结果建立共同语言。\n\nAWS的共建自述提出生产部署与客户接续目标，可作为目标参照；企业仍要用自己的任务观察是否接住。[官方材料](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)\n\n## 小企业也可以有合理组合\n\n任务量不足以养完整技术部门时，可使用外部专业力量。内部保留客户理解、关键事实、价值判断与资源安排，专业技术由合适团队持续支持。\n\n培训因此应围绕这种承担设计：追材料和执行，判断方法，比较资源，维护一次经验，再作阶段选择。当能力在企业内部逐渐分布、可以接任，外部共建才开始成为企业自己的支撑。\n","text":"# 第35章｜企业自己的AI能力，怎样从共同工作里长出来\n\n学过模型、知识库和Agent，仍可能不知道一项业务变化该改哪里。设备增加V2，内部负责人至少要能解释旧经验是否还能采用、资料由谁确认、哪些任务需专业支持，才能真正控制自己的使用范围。\n\n这项能力不要求他亲自写检索代码，却比会操作界面多了一层业务判断。\n\n## 内部需要接住哪些工作\n\n客户价值由谁判断，方法与事实由谁确认，系统怎样运行，资源和结果怎样解释，这些责任可以分散在多人之间。组织吸收能力依赖相关认识及内部沟通，不是个人术语知识的简单相加。原始研究\n\n企业不必理解每种模型内部原理，但要掌握到能够作选择、识别重要缺口、协调正确支持的程度。\n\n## 用一项真实责任逐步培养\n\n在报价案例里，内部成员可以先追一次客户期限是否完整进入候选。随后与工程师维护适配条件和反例，知道一项修订该进入原件、方法还是工具。\n\n再组织一次方案变更比较：选择代表询价，说明哪些材料不参与调试，核对质量、人工与实际采用，解释结果为何支持某种范围。工程仍可负责具体实现。\n\n最后由原承担者暂时退出一项工作，观察其他人能否继续。交接应表现为工作真的接续，而不仅是收到了文档。\n\n| 发展阶段 | 可观察的内部能力 |\n|---|---|\n| 理解 | 说清输出用于谁的什么决定 |\n| 判断 | 识别关键缺项、冲突与不适用 |\n| 改变 | 说明改什么、为什么、怎样比较 |\n| 接续 | 换人后正常工作与必要异常仍能处理 |\n\n## 共建怎样避免变成旁观\n\n外部团队独自处理全部材料和评价，内部只看演示，很难形成相关认识。更有效的参与，是共同处理一次版本冲突、解释一次失败、改变一项真实工作。\n\n参与也需要有用途。长期旁听所有技术会议，未必比独立追完一笔询价更有学习价值。FDE解释技术取舍，业务人员提供现场判断，双方用真实结果建立共同语言。\n\nAWS的共建自述提出生产部署与客户接续目标，可作为目标参照；企业仍要用自己的任务观察是否接住。官方材料\n\n## 小企业也可以有合理组合\n\n任务量不足以养完整技术部门时，可使用外部专业力量。内部保留客户理解、关键事实、价值判断与资源安排，专业技术由合适团队持续支持。\n\n培训因此应围绕这种承担设计：追材料和执行，判断方法，比较资源，维护一次经验，再作阶段选择。当能力在企业内部逐渐分布、可以接任，外部共建才开始成为企业自己的支撑。\n"},{"file":"36-复用与迁移.md","id":"lesson-36","number":36,"role":"核心课","part":6,"title":"第36章｜扩到第九家店，复制什么，重新学习什么","md":"# 第36章｜扩到第九家店，复制什么，重新学习什么\n\n原店是通勤客流，新店以社区预订为主。把同一界面和配货数复制过去，系统很快能打开，业务却可能完全用不对。\n\n扩张应减少重复建设，同时保留认识新条件的工作。能复制结构，不等于已经复制结果。\n\n## 共同基础可以省掉哪些准备\n\n[连锁案例](案例A-连锁备货.md)已经形成商品与营业日含义、售罄和事件记录、候选与实际到店区分、结果反馈与评价方法。新店不用重新发明这些共同语言。\n\n工具连接、资料关联和带教材料也可能复用。它们使新店更快进入可比较生产，但客群、需求、配送时段与商品偏好仍需取得本地证据。\n\n![共同身份、事件、建议执行结果结构与工具支持多店；每家店保留自己的客群、时段与配送条件。](assets/36-共性与迁移.svg)\n\n## 新条件会改变怎样观察需求\n\n通勤店在售罄后追未买到的顾客，社区预订店则可能更早取得约定取货需求。两者都关心可靠供给，但记录入口、安排生产和观察未满足需求的方式不同。\n\n原方法若帮助新店更快发现这些差别，就发挥了作用；若它诱导所有门店每天配160，则可能扩散错误。\n\n| 可共同使用 | 需要适配 | 要重新认识 |\n|---|---|---|\n| 事实与状态含义 | 本地资料和工具入口 | 客户处境和需求 |\n| 评价与代表任务的设计 | 人员、节奏与支持 | 新约束和例外 |\n| 经验证的通用组件 | 方法采用条件 | 新服务价值 |\n\n相关积累有助于取得新认识，资源也需要在变化中重组。[吸收能力](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)、[动态能力](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)\n\n## 复用也要有经济比较\n\n与新店从头采用合理方案相比，少做哪些准备，又新增多少理解、集成、带教与维护？不能把复制按钮本身当全部成本，也不能因需要适配就否认旧基础价值。\n\n如果为了沿用旧系统不断加例外，共同维护被单一老场景牵制，拆出本地部分或替换组件可能更经济。平台化的依据是多场景总负担下降，不是所有入口看起来相同。\n\n设备进入另一系列也可共享工单链，技术方法重新检查；经销商进入新行业可共享询价协作，却要重新理解客户工况。企业真正可扩展的，是带着已有基础继续学习和交付。\n","html":"\u003ch1>第36章｜扩到第九家店，复制什么，重新学习什么\u003c/h1>\n\u003cp>原店是通勤客流，新店以社区预订为主。把同一界面和配货数复制过去，系统很快能打开，业务却可能完全用不对。\u003c/p>\n\u003cp>扩张应减少重复建设，同时保留认识新条件的工作。能复制结构，不等于已经复制结果。\u003c/p>\n\u003ch2 id=\"lesson-36-section-1\">共同基础可以省掉哪些准备\u003c/h2>\n\u003cp>\u003ca href=\"#case-a\">连锁案例\u003c/a>已经形成商品与营业日含义、售罄和事件记录、候选与实际到店区分、结果反馈与评价方法。新店不用重新发明这些共同语言。\u003c/p>\n\u003cp>工具连接、资料关联和带教材料也可能复用。它们使新店更快进入可比较生产，但客群、需求、配送时段与商品偏好仍需取得本地证据。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNDgwIiB2aWV3Qm94PSIwIDAgMzYwIDQ4MCIgcm9sZT0iaW1nIj48dGl0bGU+5aSN5Yi257uT5p6E77yM6YeN5a2m5p2h5Lu2PC90aXRsZT48ZGVzYz7lhbHlkIzouqvku73jgIHkuovku7bjgIHmiafooYznu5PmnoTkuI7lt6XlhbfmlK/mjIHlpJrlupfvvJvlkITlupflrqLnvqTml7bmrrXphY3pgIHku43pnIDlsYDpg6jorqTor4bjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjQ4MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7lpI3liLbnu5PmnoTvvIzph43lrabmnaHku7Y8L3RleHQ+PHJlY3QgeD0iNjIiIHk9IjgyIiB3aWR0aD0iMjM2IiBoZWlnaHQ9IjExOSIgcng9IjYiIGZpbGw9IndoaXRlIiBzdHJva2U9IiMxNjVkNTIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PHRleHQgeD0iMTgwIiB5PSIxMTMiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyMSIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC13ZWlnaHQ9IjYwMCI+5YWx5ZCM57uT5p6E5LiO5bel5YW3PC90ZXh0Pjx0ZXh0IHg9IjE4MCIgeT0iMTQzIiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyMTM0MmYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSI0MDAiPui6q+S7v 原方法若帮助新店更快发现这些差别，就发挥了作用；若它诱导所有门店每天配160，则可能扩散错误。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可共同使用\u003c/th>\n\u003cth>需要适配\u003c/th>\n\u003cth>要重新认识\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>事实与状态含义\u003c/td>\n\u003ctd>本地资料和工具入口\u003c/td>\n\u003ctd>客户处境和需求\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>评价与代表任务的设计\u003c/td>\n\u003ctd>人员、节奏与支持\u003c/td>\n\u003ctd>新约束和例外\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>经验证的通用组件\u003c/td>\n\u003ctd>方法采用条件\u003c/td>\n\u003ctd>新服务价值\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>相关积累有助于取得新认识，资源也需要在变化中重组。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">吸收能力\u003c/a>、\u003ca href=\"https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">动态能力\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-36-section-3\">复用也要有经济比较\u003c/h2>\n\u003cp>与新店从头采用合理方案相比，少做哪些准备，又新增多少理解、集成、带教与维护？不能把复制按钮本身当全部成本，也不能因需要适配就否认旧基础价值。\u003c/p>\n\u003cp>如果为了沿用旧系统不断加例外，共同维护被单一老场景牵制，拆出本地部分或替换组件可能更经济。平台化的依据是多场景总负担下降，不是所有入口看起来相同。\u003c/p>\n\u003cp>设备进入另一系列也可共享工单链，技术方法重新检查；经销商进入新行业可共享询价协作，却要重新理解客户工况。企业真正可扩展的，是带着已有基础继续学习和交付。\u003c/p>\n","headings":[{"id":"lesson-36-section-1","label":"共同基础可以省掉哪些准备"},{"id":"lesson-36-section-2","label":"新条件会改变怎样观察需求"},{"id":"lesson-36-section-3","label":"复用也要有经济比较"}],"exportMd":"# 第36章｜扩到第九家店，复制什么，重新学习什么\n\n原店是通勤客流，新店以社区预订为主。把同一界面和配货数复制过去，系统很快能打开，业务却可能完全用不对。\n\n扩张应减少重复建设，同时保留认识新条件的工作。能复制结构，不等于已经复制结果。\n\n## 共同基础可以省掉哪些准备\n\n[连锁案例](#case-a)已经形成商品与营业日含义、售罄和事件记录、候选与实际到店区分、结果反馈与评价方法。新店不用重新发明这些共同语言。\n\n工具连接、资料关联和带教材料也可能复用。它们使新店更快进入可比较生产，但客群、需求、配送时段与商品偏好仍需取得本地证据。\n\n![共同身份、事件、建议执行结果结构与工具支持多店；每家店保留自己的客群、时段与配送条件。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNDgwIiB2aWV3Qm94PSIwIDAgMzYwIDQ4MCIgcm9sZT 链，技术方法重新检查；经销商进入新行业可共享询价协作，却要重新理解客户工况。企业真正可扩展的，是带着已有基础继续学习和交付。\n","exportSingleMd":"# 第36章｜扩到第九家店，复制什么，重新学习什么\n\n原店是通勤客流，新店以社区预订为主。把同一界面和配货数复制过去，系统很快能打开，业务却可能完全用不对。\n\n扩张应减少重复建设，同时保留认识新条件的工作。能复制结构，不等于已经复制结果。\n\n## 共同基础可以省掉哪些准备\n\n[连锁案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-a)已经形成商品与营业日含义、售罄和事件记录、候选与实际到店区分、结果反馈与评价方法。新店不用重新发明这些共同语言。\n\n工具连接、资料关联和带教材料也可能复用。它们使新店更快进入可比较生产，但客群、需求、配送时段与商品偏好仍需取得本地证据。\n\n![共同身份、事件、建议执行结果结构与工具支持多店；每家店保留自己的客群、时段与配送条件。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNDgwIiB2aWV3Qm94PSIwIDAgMzYwIDQ4MCIgcm9sZT0iaW1nIj48dGl0bGU+5aSN5Yi257uT5p6E77yM6YeN5a2m5p2h5Lu2PC90aXRsZT48ZGVzYz7lhbHlkIzouqvku73jgIHkuovku7bjgIHmiafooYznu5PmnoTkuI7lt6XlhbfmlK/mjIHlpJrlupfvvJvlkITlupflrqLnvqTml7bmrrXphY3pgIHku43pnIDlsYDpg6jorqTor4bjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjQ4MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7lpI3liLbnu5PmnoTvvIzph43lrabmnaHku7Y8L3RleHQ+PHJlY3QgeD0iNjIiIHk9IjgyIiB3aWR0aD0iMjM2IiBoZWlnaHQ9IjExOSIgcng9IjYiIGZpbGw9IndoaXRlIiBzdHJva2U9IiMxNjVkNTIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PHRleHQgeD0iMTgwIiB5PSIxMTMiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyMSIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC13ZWlnaHQ9IjYwMCI+5YWx5ZCM57uT5p6E5LiO5bel5YW3PC90ZXh0Pjx0ZXh0IHg9IjE4MCIgeT0iMTQzIiBmb250LWZhb 关心可靠供给，但记录入口、安排生产和观察未满足需求的方式不同。\n\n原方法若帮助新店更快发现这些差别，就发挥了作用；若它诱导所有门店每天配160，则可能扩散错误。\n\n| 可共同使用 | 需要适配 | 要重新认识 |\n|---|---|---|\n| 事实与状态含义 | 本地资料和工具入口 | 客户处境和需求 |\n| 评价与代表任务的设计 | 人员、节奏与支持 | 新约束和例外 |\n| 经验证的通用组件 | 方法采用条件 | 新服务价值 |\n\n相关积累有助于取得新认识，资源也需要在变化中重组。[吸收能力](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)、[动态能力](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)\n\n## 复用也要有经济比较\n\n与新店从头采用合理方案相比，少做哪些准备，又新增多少理解、集成、带教与维护？不能把复制按钮本身当全部成本，也不能因需要适配就否认旧基础价值。\n\n如果为了沿用旧系统不断加例外，共同维护被单一老场景牵制，拆出本地部分或替换组件可能更经济。平台化的依据是多场景总负担下降，不是所有入口看起来相同。\n\n设备进入另一系列也可共享工单链，技术方法重新检查；经销商进入新行业可共享询价协作，却要重新理解客户工况。企业真正可扩展的，是带着已有基础继续学习和交付。\n","text":"# 第36章｜扩到第九家店，复制什么，重新学习什么\n\n原店是通勤客流，新店以社区预订为主。把同一界面和配货数复制过去，系统很快能打开，业务却可能完全用不对。\n\n扩张应减少重复建设，同时保留认识新条件的工作。能复制结构，不等于已经复制结果。\n\n## 共同基础可以省掉哪些准备\n\n连锁案例已经形成商品与营业日含义、售罄和事件记录、候选与实际到店区分、结果反馈与评价方法。新店不用重新发明这些共同语言。\n\n工具连接、资料关联和带教材料也可能复用。它们使新店更快进入可比较生产，但客群、需求、配送时段与商品偏好仍需取得本地证据。\n\n \n\n## 新条件会改变怎样观察需求\n\n通勤店在售罄后追未买到的顾客，社区预订店则可能更早取得约定取货需求。两者都关心可靠供给，但记录入口、安排生产和观察未满足需求的方式不同。\n\n原方法若帮助新店更快发现这些差别，就发挥了作用；若它诱导所有门店每天配160，则可能扩散错误。\n\n| 可共同使用 | 需要适配 | 要重新认识 |\n|---|---|---|\n| 事实与状态含义 | 本地资料和工具入口 | 客户处境和需求 |\n| 评价与代表任务的设计 | 人员、节奏与支持 | 新约束和例外 |\n| 经验证的通用组件 | 方法采用条件 | 新服务价值 |\n\n相关积累有助于取得新认识，资源也需要在变化中重组。吸收能力、动态能力\n\n## 复用也要有经济比较\n\n与新店从头采用合理方案相比，少做哪些准备，又新增多少理解、集成、带教与维护？不能把复制按钮本身当全部成本，也不能因需要适配就否认旧基础价值。\n\n如果为了沿用旧系统不断加例外，共同维护被单一老场景牵制，拆出本地部分或替换组件可能更经济。平台化的依据是多场景总负担下降，不是所有入口看起来相同。\n\n设备进入另一系列也可共享工单链，技术方法重新检查；经销商进入新行业可共享询价协作，却要重新理解客户工况。企业真正可扩展的，是带着已有基础继续学习和交付。\n"},{"file":"37-阶段发展路线.md","id":"lesson-37","number":37,"role":"核心课","part":7,"title":"第37章｜怎样安排一条有方向、又能被证据改变的路线","md":"# 第37章｜怎样安排一条有方向、又能被证据改变的路线\n\n“先建知识库，再上Agent，最后自动化”，是技术顺序，还不是经营路线。企业需要知道每项投入解决什么、结束后怎样决定下一步，以及不成立时改向哪里。\n\n路线应由客户价值、能力和阶段证据连接。日期帮助执行，不能替代这条关系。\n\n## 让方向比工具稳定\n\n连锁的方向是使顾客更可靠买到新鲜商品、控制剩余，并把有效判断留下；设备服务是更可靠恢复、减少可避免复访；报价企业是形成可履约路线并保住贡献。\n\n这些目标可以持续，采用的模型、界面和分工则会改变。动态能力研究关心资源持续适应和重组，支持这种路线观。[原始研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)\n\n## 用具体证据连接阶段\n\n在[连锁案例](案例A-连锁备货.md)里，先核对受限销量、生产窗口、顾客行为和补货条件，才能比较扩大供给。正常日算例给出的关键差别是：相对100/60，只扩大供给要新增至少27份销售才更好。\n\n| 阶段要回答的问题 | 能影响的后续投入 |\n|---|---|\n| 事实与实际结果能否对应 | 采集、关联和运行入口 |\n| 需求和履约是否支持候选 | 改分配、扩产或先改配送 |\n| 相对合理替代是否有增量 | 扩大、改法或结束 |\n| 接任者和新店能否用对 | 内部能力、适配与迁移 |\n| 出现了什么新客户需要 | 新服务的小范围探索 |\n\n它不是所有企业必须依次走完的五步。已有资料链就直接试价值；若客户根本不需要目标结果，继续补数据库也不能救回方向。起点由当前最能改变选择的缺口决定。\n\n## 每阶段都要有当前交付\n\n产物可以是可用工作入口、一项经过比较的方法，或有依据地停止一个方向；也要有资源、承担者与复查时点。只有“获得认识”而说不出改变了什么选择，容易变成无限探索。\n\n内容团队先验证20分钟核验能否保持质量，再对外承诺每天6篇；设备团队先辨认哪些复访可避免，再按成本覆盖点安排投入。不同业务有不同依赖，不能用统一功能清单代替。\n\n## 新技术怎样进入路线\n\n新供给可能改善旧任务，也可能使新服务可行。用本企业代表任务比较其作用；若客户与生产条件没变，可以只换一部分；若服务边界改变，就重新研究客户、交付与收益。\n\n连续FDE和内部负责人共同保持这条链：现场变化进入工程，工程接受实际采用，结果改变下一笔资源。路线的连续性在于持续改善客户结果与企业能力，而不在于组件只增不减。\n","html":"\u003ch1>第37章｜怎样安排一条有方向、又能被证据改变的路线\u003c/h1>\n\u003cp>“先建知识库，再上Agent，最后自动化”，是技术顺序，还不是经营路线。企业需要知道每项投入解决什么、结束后怎样决定下一步，以及不成立时改向哪里。\u003c/p>\n\u003cp>路线应由客户价值、能力和阶段证据连接。日期帮助执行，不能替代这条关系。\u003c/p>\n\u003ch2 id=\"lesson-37-section-1\">让方向比工具稳定\u003c/h2>\n\u003cp>连锁的方向是使顾客更可靠买到新鲜商品、控制剩余，并把有效判断留下；设备服务是更可靠恢复、减少可避免复访；报价企业是形成可履约路线并保住贡献。\u003c/p>\n\u003cp>这些目标可以持续，采用的模型、界面和分工则会改变。动态能力研究关心资源持续适应和重组，支持这种路线观。\u003ca href=\"https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-37-section-2\">用具体证据连接阶段\u003c/h2>\n\u003cp>在\u003ca href=\"#case-a\">连锁案例\u003c/a>里，先核对受限销量、生产窗口、顾客行为和补货条件，才能比较扩大供给。正常日算例给出的关键差别是：相对100/60，只扩大供给要新增至少27份销售才更好。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>阶段要回答的问题\u003c/th>\n\u003cth>能影响的后续投入\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>事实与实际结果能否对应\u003c/td>\n\u003ctd>采集、关联和运行入口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>需求和履约是否支持候选\u003c/td>\n\u003ctd>改分配、扩产或先改配送\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>相对合理替代是否有增量\u003c/td>\n\u003ctd>扩大、改法或结束\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接任者和新店能否用对\u003c/td>\n\u003ctd>内部能力、适配与迁移\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>出现了什么新客户需要\u003c/td>\n\u003ctd>新服务的小范围探索\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>它不是所有企业必须依次走完的五步。已有资料链就直接试价值；若客户根本不需要目标结果，继续补数据库也不能救回方向。起点由当前最能改变选择的缺口决定。\u003c/p>\n\u003ch2 id=\"lesson-37-section-3\">每阶段都要有当前交付\u003c/h2>\n\u003cp>产物可以是可用工作入口、一项经过比较的方法，或有依据地停止一个方向；也要有资源、承担者与复查时点。只有“获得认识”而说不出改变了什么选择，容易变成无限探索。\u003c/p>\n\u003cp>内容团队先验证20分钟核验能否保持质量，再对外承诺每天6篇；设备团队先辨认哪些复访可避免，再按成本覆盖点安排投入。不同业务有不同依赖，不能用统一功能清单代替。\u003c/p>\n\u003ch2 id=\"lesson-37-section-4\">新技术怎样进入路线\u003c/h2>\n\u003cp>新供给可能改善旧任务，也可能使新服务可行。用本企业代表任务比较其作用；若客户与生产条件没变，可以只换一部分；若服务边界改变，就重新研究客户、交付与收益。\u003c/p>\n\u003cp>连续FDE和内部负责人共同保持这条链：现场变化进入工程，工程接受实际采用，结果改变下一笔资源。路线的连续性在于持续改善客户结果与企业能力，而不在于组件只增不减。\u003c/p>\n","headings":[{"id":"lesson-37-section-1","label":"让方向比工具稳定"},{"id":"lesson-37-section-2","label":"用具体证据连接阶段"},{"id":"lesson-37-section-3","label":"每阶段都要有当前交付"},{"id":"lesson-37-section-4","label":"新技术怎样进入路线"}],"exportMd":"# 第37章｜怎样安排一条有方向、又能被证据改变的路线\n\n“先建知识库，再上Agent，最后自动化”，是技术顺序，还不是经营路线。企业需要知道每项投入解决什么、结束后怎样决定下一步，以及不成立时改向哪里。\n\n路线应由客户价值、能力和阶段证据连接。日期帮助执行，不能替代这条关系。\n\n## 让方向比工具稳定\n\n连锁的方向是使顾客更可靠买到新鲜商品、控制剩余，并把有效判断留下；设备服务是更可靠恢复、减少可避免复访；报价企业是形成可履约路线并保住贡献。\n\n这些目标可以持续，采用的模型、界面和分工则会改变。动态能力研究关心资源持续适应和重组，支持这种路线观。[原始研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)\n\n## 用具体证据连接阶段\n\n在[连锁案例](#case-a)里，先核对受限销量、生产窗口、顾客行为和补货条件，才能比较扩大供给。正常日算例给出的关键差别是：相对100/60，只扩大供给要新增至少27份销售才更好。\n\n| 阶段要回答的问题 | 能影响的后续投入 |\n|---|---|\n| 事实与实际结果能否对应 | 采集、关联和运行入口 |\n| 需求和履约是否支持候选 | 改分配、扩产或先改配送 |\n| 相对合理替代是否有增量 | 扩大、改法或结束 |\n| 接任者和新店能否用对 | 内部能力、适配与迁移 |\n| 出现了什么新客户需要 | 新服务的小范围探索 |\n\n它不是所有企业必须依次走完的五步。已有资料链就直接试价值；若客户根本不需要目标结果，继续补数据库也不能救回方向。起点由当前最能改变选择的缺口决定。\n\n## 每阶段都要有当前交付\n\n产物可以是可用工作入口、一项经过比较的方法，或有依据地停止一个方向；也要有资源、承担者与复查时点。只有“获得认识”而说不出改变了什么选择，容易变成无限探索。\n\n内容团队先验证20分钟核验能否保持质量，再对外承诺每天6篇；设备团队先辨认哪些复访可避免，再按成本覆盖点安排投入。不同业务有不同依赖，不能用统一功能清单代替。\n\n## 新技术怎样进入路线\n\n新供给可能改善旧任务，也可能使新服务可行。用本企业代表任务比较其作用；若客户与生产条件没变，可以只换一部分；若服务边界改变，就重新研究客户、交付与收益。\n\n连续FDE和内部负责人共同保持这条链：现场变化进入工程，工程接受实际采用，结果改变下一笔资源。路线的连续性在于持续改善客户结果与企业能力，而不在于组件只增不减。\n","exportSingleMd":"# 第37章｜怎样安排一条有方向、又能被证据改变的路线\n\n“先建知识库，再上Agent，最后自动化”，是技术顺序，还不是经营路线。企业需要知道每项投入解决什么、结束后怎样决定下一步，以及不成立时改向哪里。\n\n路线应由客户价值、能力和阶段证据连接。日期帮助执行，不能替代这条关系。\n\n## 让方向比工具稳定\n\n连锁的方向是使顾客更可靠买到新鲜商品、控制剩余，并把有效判断留下；设备服务是更可靠恢复、减少可避免复访；报价企业是形成可履约路线并保住贡献。\n\n这些目标可以持续，采用的模型、界面和分工则会改变。动态能力研究关心资源持续适应和重组，支持这种路线观。[原始研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)\n\n## 用具体证据连接阶段\n\n在[连锁案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-a)里，先核对受限销量、生产窗口、顾客行为和补货条件，才能比较扩大供给。正常日算例给出的关键差别是：相对100/60，只扩大供给要新增至少27份销售才更好。\n\n| 阶段要回答的问题 | 能影响的后续投入 |\n|---|---|\n| 事实与实际结果能否对应 | 采集、关联和运行入口 |\n| 需求和履约是否支持候选 | 改分配、扩产或先改配送 |\n| 相对合理替代是否有增量 | 扩大、改法或结束 |\n| 接任者和新店能否用对 | 内部能力、适配与迁移 |\n| 出现了什么新客户需要 | 新服务的小范围探索 |\n\n它不是所有企业必须依次走完的五步。已有资料链就直接试价值；若客户根本不需要目标结果，继续补数据库也不能救回方向。起点由当前最能改变选择的缺口决定。\n\n## 每阶段都要有当前交付\n\n产物可以是可用工作入口、一项经过比较的方法，或有依据地停止一个方向；也要有资源、承担者与复查时点。只有“获得认识”而说不出改变了什么选择，容易变成无限探索。\n\n内容团队先验证20分钟核验能否保持质量，再对外承诺每天6篇；设备团队先辨认哪些复访可避免，再按成本覆盖点安排投入。不同业务有不同依赖，不能用统一功能清单代替。\n\n## 新技术怎样进入路线\n\n新供给可能改善旧任务，也可能使新服务可行。用本企业代表任务比较其作用；若客户与生产条件没变，可以只换一部分；若服务边界改变，就重新研究客户、交付与收益。\n\n连续FDE和内部负责人共同保持这条链：现场变化进入工程，工程接受实际采用，结果改变下一笔资源。路线的连续性在于持续改善客户结果与企业能力，而不在于组件只增不减。\n","text":"# 第37章｜怎样安排一条有方向、又能被证据改变的路线\n\n“先建知识库，再上Agent，最后自动化”，是技术顺序，还不是经营路线。企业需要知道每项投入解决什么、结束后怎样决定下一步，以及不成立时改向哪里。\n\n路线应由客户价值、能力和阶段证据连接。日期帮助执行，不能替代这条关系。\n\n## 让方向比工具稳定\n\n连锁的方向是使顾客更可靠买到新鲜商品、控制剩余，并把有效判断留下；设备服务是更可靠恢复、减少可避免复访；报价企业是形成可履约路线并保住贡献。\n\n这些目标可以持续，采用的模型、界面和分工则会改变。动态能力研究关心资源持续适应和重组，支持这种路线观。原始研究\n\n## 用具体证据连接阶段\n\n在连锁案例里，先核对受限销量、生产窗口、顾客行为和补货条件，才能比较扩大供给。正常日算例给出的关键差别是：相对100/60，只扩大供给要新增至少27份销售才更好。\n\n| 阶段要回答的问题 | 能影响的后续投入 |\n|---|---|\n| 事实与实际结果能否对应 | 采集、关联和运行入口 |\n| 需求和履约是否支持候选 | 改分配、扩产或先改配送 |\n| 相对合理替代是否有增量 | 扩大、改法或结束 |\n| 接任者和新店能否用对 | 内部能力、适配与迁移 |\n| 出现了什么新客户需要 | 新服务的小范围探索 |\n\n它不是所有企业必须依次走完的五步。已有资料链就直接试价值；若客户根本不需要目标结果，继续补数据库也不能救回方向。起点由当前最能改变选择的缺口决定。\n\n## 每阶段都要有当前交付\n\n产物可以是可用工作入口、一项经过比较的方法，或有依据地停止一个方向；也要有资源、承担者与复查时点。只有“获得认识”而说不出改变了什么选择，容易变成无限探索。\n\n内容团队先验证20分钟核验能否保持质量，再对外承诺每天6篇；设备团队先辨认哪些复访可避免，再按成本覆盖点安排投入。不同业务有不同依赖，不能用统一功能清单代替。\n\n## 新技术怎样进入路线\n\n新供给可能改善旧任务，也可能使新服务可行。用本企业代表任务比较其作用；若客户与生产条件没变，可以只换一部分；若服务边界改变，就重新研究客户、交付与收益。\n\n连续FDE和内部负责人共同保持这条链：现场变化进入工程，工程接受实际采用，结果改变下一笔资源。路线的连续性在于持续改善客户结果与企业能力，而不在于组件只增不减。\n"},{"file":"38-新产品与服务.md","id":"lesson-38","number":38,"role":"核心课","part":7,"title":"第38章｜企业自己的AI，怎样帮助创造原来没有的生意","md":"# 第38章｜企业自己的AI，怎样帮助创造原来没有的生意\n\n工业品牌客户原来按篇买内容，后来可能自己用AI起稿。他仍有问题：哪些内容在回应真正的采购顾虑，来询价的人合不合适，销售拿到线索后为什么没有成交？\n\n这个变化既可能压低旧服务的价格，也可能打开新的服务空间。企业要从持续生产中找到新需求，再验证能否交付和收费。\n\n## 从“客户要更多文章”，追到他要解决什么\n\n在[内容服务案例](案例D-专业服务.md)里，一篇文章规格不准确，客户不能发；另一篇语气流畅却没有回应工况和交期，销售仍需重写。初稿数量没有回答客户的采购沟通问题。\n\nAI可以比较产品资料、客户修改、销售常见问题与未成交理由，提出一项候选认识：某类采购者反复关心能否替代旧型号，以及交期和适用条件。团队再与实际客户材料核对，判断这是稳定需要，还是某次任务的偶然现象。\n\n新know-how就在这种往返中产生。企业并不是先拥有所有分类，AI也不是只从旧库挑答案；它帮助把过去分开的线索组织成新的问题，人员和实际结果决定哪些认识值得留下。\n\n## 把新价值做成一项可试交付\n\n候选服务可以从“按篇写产品文”扩为“围绕关键采购问题组织材料、连接询价与持续改进”。先选一个客户、一类产品和一个可观察问题，不承诺全面代管获客。\n\n| 服务单元 | 需要发生的工作 | 可交付结果 |\n|---|---|---|\n| 辨认采购问题 | 对照询价、产品和销售材料，区分常见顾虑与缺项 | 一组有依据、能讨论的问题 |\n| 制作可用回应 | AI构思，专业核验，形成适合客户场景的内容与销售资料 | 客户可采用的材料 |\n| 连接后续行动 | 记录内容引来的询价质量、销售采用和跟进 | 识别在哪一段有效或受阻 |\n| 更新方法 | 把实际结果与反例带回下一轮 | 更好的问题、材料和工作安排 |\n\nFDE需要实现资料与实际行动连接，专业人员承担事实判断，客户销售提供后续信息和执行。若只交更多推送，责任关系并没有形成。\n\n## 收费方式必须与交付能力一起改变\n\n按篇收费简单，持续服务则要约定范围、资料更新、专业支持与结果解释。按期收费可以支持连续投入，也可能让企业承担超过容量的责任，不能只把旧交付换成订阅名目。\n\n案例月账已经说明，核验能力从4篇到6篇也需要真实付费需求；客户只买80篇，新开支可能降低贡献。新服务的选择同样要问：谁愿意为什么付费，需要多少持续人工和工具，收入能否支持这些工作。\n\nTeece的商业模式研究连接客户价值、交付和获取。[原始研究](https://www.sciencedirect.com/science/article/pii/S002463010900051X) 宝洁研究则提供AI参与跨专业构思的参照，并没有替任何新产品证明市场收入。[创新研究](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n## 哪些结果会让团队改变产品\n\n若客户只缺准确材料，技术内容交付已经足够；若询价质量提高但销售无人跟进，服务边界需要重新讨论；若客户不愿提供后续记录，就难以承担完整获客判断。\n\n烘焙预订、设备持续服务、工业品适配支持也有相似机会：原有能力提供基础，新的客户处境和交付组合仍需重新认识。AI既可以帮助企业把旧事做好，也可以帮助它发现下一种值得做的事。后者依靠的，正是连续生产、系统关联与实际检验。\n","html":"\u003ch1>第38章｜企业自己的AI，怎样帮助创造原来没有的生意\u003c/h1>\n\u003cp>工业品牌客户原来按篇买内容，后来可能自己用AI起稿。他仍有问题：哪些内容在回应真正的采购顾虑，来询价的人合不合适，销售拿到线索后为什么没有成交？\u003c/p>\n\u003cp>这个变化既可能压低旧服务的价格，也可能打开新的服务空间。企业要从持续生产中找到新需求，再验证能否交付和收费。\u003c/p>\n\u003ch2 id=\"lesson-38-section-1\">从“客户要更多文章”，追到他要解决什么\u003c/h2>\n\u003cp>在\u003ca href=\"#case-d\">内容服务案例\u003c/a>里，一篇文章规格不准确，客户不能发；另一篇语气流畅却没有回应工况和交期，销售仍需重写。初稿数量没有回答客户的采购沟通问题。\u003c/p>\n\u003cp>AI可以比较产品资料、客户修改、销售常见问题与未成交理由，提出一项候选认识：某类采购者反复关心能否替代旧型号，以及交期和适用条件。团队再与实际客户材料核对，判断这是稳定需要，还是某次任务的偶然现象。\u003c/p>\n\u003cp>新know-how就在这种往返中产生。企业并不是先拥有所有分类，AI也不是只从旧库挑答案；它帮助把过去分开的线索组织成新的问题，人员和实际结果决定哪些认识值得留下。\u003c/p>\n\u003ch2 id=\"lesson-38-section-2\">把新价值做成一项可试交付\u003c/h2>\n\u003cp>候选服务可以从“按篇写产品文”扩为“围绕关键采购问题组织材料、连接询价与持续改进”。先选一个客户、一类产品和一个可观察问题，不承诺全面代管获客。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>服务单元\u003c/th>\n\u003cth>需要发生的工作\u003c/th>\n\u003cth>可交付结果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>辨认采购问题\u003c/td>\n\u003ctd>对照询价、产品和销售材料，区分常见顾虑与缺项\u003c/td>\n\u003ctd>一组有依据、能讨论的问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>制作可用回应\u003c/td>\n\u003ctd>AI构思，专业核验，形成适合客户场景的内容与销售资料\u003c/td>\n\u003ctd>客户可采用的材料\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>连接后续行动\u003c/td>\n\u003ctd>记录内容引来的询价质量、销售采用和跟进\u003c/td>\n\u003ctd>识别在哪一段有效或受阻\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>更新方法\u003c/td>\n\u003ctd>把实际结果与反例带回下一轮\u003c/td>\n\u003ctd>更好的问题、材料和工作安排\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>FDE需要实现资料与实际行动连接，专业人员承担事实判断，客户销售提供后续信息和执行。若只交更多推送，责任关系并没有形成。\u003c/p>\n\u003ch2 id=\"lesson-38-section-3\">收费方式必须与交付能力一起改变\u003c/h2>\n\u003cp>按篇收费简单，持续服务则要约定范围、资料更新、专业支持与结果解释。按期收费可以支持连续投入，也可能让企业承担超过容量的责任，不能只把旧交付换成订阅名目。\u003c/p>\n\u003cp>案例月账已经说明，核验能力从4篇到6篇也需要真实付费需求；客户只买80篇，新开支可能降低贡献。新服务的选择同样要问：谁愿意为什么付费，需要多少持续人工和工具，收入能否支持这些工作。\u003c/p>\n\u003cp>Teece的商业模式研究连接客户价值、交付和获取。\u003ca href=\"https://www.sciencedirect.com/science/article/pii/S002463010900051X\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a> 宝洁研究则提供AI参与跨专业构思的参照，并没有替任何新产品证明市场收入。\u003ca href=\"https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702\" target=\"_blank\" rel=\"noopener noreferrer\">创新研究\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-38-section-4\">哪些结果会让团队改变产品\u003c/h2>\n\u003cp>若客户只缺准确材料，技术内容交付已经足够；若询价质量提高但销售无人跟进，服务边界需要重新讨论；若客户不愿提供后续记录，就难以承担完整获客判断。\u003c/p>\n\u003cp>烘焙预订、设备持续服务、工业品适配支持也有相似机会：原有能力提供基础，新的客户处境和交付组合仍需重新认识。AI既可以帮助企业把旧事做好，也可以帮助它发现下一种值得做的事。后者依靠的，正是连续生产、系统关联与实际检验。\u003c/p>\n","headings":[{"id":"lesson-38-section-1","label":"从“客户要更多文章”，追到他要解决什么"},{"id":"lesson-38-section-2","label":"把新价值做成一项可试交付"},{"id":"lesson-38-section-3","label":"收费方式必须与交付能力一起改变"},{"id":"lesson-38-section-4","label":"哪些结果会让团队改变产品"}],"exportMd":"# 第38章｜企业自己的AI，怎样帮助创造原来没有的生意\n\n工业品牌客户原来按篇买内容，后来可能自己用AI起稿。他仍有问题：哪些内容在回应真正的采购顾虑，来询价的人合不合适，销售拿到线索后为什么没有成交？\n\n这个变化既可能压低旧服务的价格，也可能打开新的服务空间。企业要从持续生产中找到新需求，再验证能否交付和收费。\n\n## 从“客户要更多文章”，追到他要解决什么\n\n在[内容服务案例](#case-d)里，一篇文章规格不准确，客户不能发；另一篇语气流畅却没有回应工况和交期，销售仍需重写。初稿数量没有回答客户的采购沟通问题。\n\nAI可以比较产品资料、客户修改、销售常见问题与未成交理由，提出一项候选认识：某类采购者反复关心能否替代旧型号，以及交期和适用条件。团队再与实际客户材料核对，判断这是稳定需要，还是某次任务的偶然现象。\n\n新know-how就在这种往返中产生。企业并不是先拥有所有分类，AI也不是只从旧库挑答案；它帮助把过去分开的线索组织成新的问题，人员和实际结果决定哪些认识值得留下。\n\n## 把新价值做成一项可试交付\n\n候选服务可以从“按篇写产品文”扩为“围绕关键采购问题组织材料、连接询价与持续改进”。先选一个客户、一类产品和一个可观察问题，不承诺全面代管获客。\n\n| 服务单元 | 需要发生的工作 | 可交付结果 |\n|---|---|---|\n| 辨认采购问题 | 对照询价、产品和销售材料，区分常见顾虑与缺项 | 一组有依据、能讨论的问题 |\n| 制作可用回应 | AI构思，专业核验，形成适合客户场景的内容与销售资料 | 客户可采用的材料 |\n| 连接后续行动 | 记录内容引来的询价质量、销售采用和跟进 | 识别在哪一段有效或受阻 |\n| 更新方法 | 把实际结果与反例带回下一轮 | 更好的问题、材料和工作安排 |\n\nFDE需要实现资料与实际行动连接，专业人员承担事实判断，客户销售提供后续信息和执行。若只交更多推送，责任关系并没有形成。\n\n## 收费方式必须与交付能力一起改变\n\n按篇收费简单，持续服务则要约定范围、资料更新、专业支持与结果解释。按期收费可以支持连续投入，也可能让企业承担超过容量的责任，不能只把旧交付换成订阅名目。\n\n案例月账已经说明，核验能力从4篇到6篇也需要真实付费需求；客户只买80篇，新开支可能降低贡献。新服务的选择同样要问：谁愿意为什么付费，需要多少持续人工和工具，收入能否支持这些工作。\n\nTeece的商业模式研究连接客户价值、交付和获取。[原始研究](https://www.sciencedirect.com/science/article/pii/S002463010900051X) 宝洁研究则提供AI参与跨专业构思的参照，并没有替任何新产品证明市场收入。[创新研究](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n## 哪些结果会让团队改变产品\n\n若客户只缺准确材料，技术内容交付已经足够；若询价质量提高但销售无人跟进，服务边界需要重新讨论；若客户不愿提供后续记录，就难以承担完整获客判断。\n\n烘焙预订、设备持续服务、工业品适配支持也有相似机会：原有能力提供基础，新的客户处境和交付组合仍需重新认识。AI既可以帮助企业把旧事做好，也可以帮助它发现下一种值得做的事。后者依靠的，正是连续生产、系统关联与实际检验。\n","exportSingleMd":"# 第38章｜企业自己的AI，怎样帮助创造原来没有的生意\n\n工业品牌客户原来按篇买内容，后来可能自己用AI起稿。他仍有问题：哪些内容在回应真正的采购顾虑，来询价的人合不合适，销售拿到线索后为什么没有成交？\n\n这个变化既可能压低旧服务的价格，也可能打开新的服务空间。企业要从持续生产中找到新需求，再验证能否交付和收费。\n\n## 从“客户要更多文章”，追到他要解决什么\n\n在[内容服务案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-d)里，一篇文章规格不准确，客户不能发；另一篇语气流畅却没有回应工况和交期，销售仍需重写。初稿数量没有回答客户的采购沟通问题。\n\nAI可以比较产品资料、客户修改、销售常见问题与未成交理由，提出一项候选认识：某类采购者反复关心能否替代旧型号，以及交期和适用条件。团队再与实际客户材料核对，判断这是稳定需要，还是某次任务的偶然现象。\n\n新know-how就在这种往返中产生。企业并不是先拥有所有分类，AI也不是只从旧库挑答案；它帮助把过去分开的线索组织成新的问题，人员和实际结果决定哪些认识值得留下。\n\n## 把新价值做成一项可试交付\n\n候选服务可以从“按篇写产品文”扩为“围绕关键采购问题组织材料、连接询价与持续改进”。先选一个客户、一类产品和一个可观察问题，不承诺全面代管获客。\n\n| 服务单元 | 需要发生的工作 | 可交付结果 |\n|---|---|---|\n| 辨认采购问题 | 对照询价、产品和销售材料，区分常见顾虑与缺项 | 一组有依据、能讨论的问题 |\n| 制作可用回应 | AI构思，专业核验，形成适合客户场景的内容与销售资料 | 客户可采用的材料 |\n| 连接后续行动 | 记录内容引来的询价质量、销售采用和跟进 | 识别在哪一段有效或受阻 |\n| 更新方法 | 把实际结果与反例带回下一轮 | 更好的问题、材料和工作安排 |\n\nFDE需要实现资料与实际行动连接，专业人员承担事实判断，客户销售提供后续信息和执行。若只交更多推送，责任关系并没有形成。\n\n## 收费方式必须与交付能力一起改变\n\n按篇收费简单，持续服务则要约定范围、资料更新、专业支持与结果解释。按期收费可以支持连续投入，也可能让企业承担超过容量的责任，不能只把旧交付换成订阅名目。\n\n案例月账已经说明，核验能力从4篇到6篇也需要真实付费需求；客户只买80篇，新开支可能降低贡献。新服务的选择同样要问：谁愿意为什么付费，需要多少持续人工和工具，收入能否支持这些工作。\n\nTeece的商业模式研究连接客户价值、交付和获取。[原始研究](https://www.sciencedirect.com/science/article/pii/S002463010900051X) 宝洁研究则提供AI参与跨专业构思的参照，并没有替任何新产品证明市场收入。[创新研究](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n## 哪些结果会让团队改变产品\n\n若客户只缺准确材料，技术内容交付已经足够；若询价质量提高但销售无人跟进，服务边界需要重新讨论；若客户不愿提供后续记录，就难以承担完整获客判断。\n\n烘焙预订、设备持续服务、工业品适配支持也有相似机会：原有能力提供基础，新的客户处境和交付组合仍需重新认识。AI既可以帮助企业把旧事做好，也可以帮助它发现下一种值得做的事。后者依靠的，正是连续生产、系统关联与实际检验。\n","text":"# 第38章｜企业自己的AI，怎样帮助创造原来没有的生意\n\n工业品牌客户原来按篇买内容，后来可能自己用AI起稿。他仍有问题：哪些内容在回应真正的采购顾虑，来询价的人合不合适，销售拿到线索后为什么没有成交？\n\n这个变化既可能压低旧服务的价格，也可能打开新的服务空间。企业要从持续生产中找到新需求，再验证能否交付和收费。\n\n## 从“客户要更多文章”，追到他要解决什么\n\n在内容服务案例里，一篇文章规格不准确，客户不能发；另一篇语气流畅却没有回应工况和交期，销售仍需重写。初稿数量没有回答客户的采购沟通问题。\n\nAI可以比较产品资料、客户修改、销售常见问题与未成交理由，提出一项候选认识：某类采购者反复关心能否替代旧型号，以及交期和适用条件。团队再与实际客户材料核对，判断这是稳定需要，还是某次任务的偶然现象。\n\n新know-how就在这种往返中产生。企业并不是先拥有所有分类，AI也不是只从旧库挑答案；它帮助把过去分开的线索组织成新的问题，人员和实际结果决定哪些认识值得留下。\n\n## 把新价值做成一项可试交付\n\n候选服务可以从“按篇写产品文”扩为“围绕关键采购问题组织材料、连接询价与持续改进”。先选一个客户、一类产品和一个可观察问题，不承诺全面代管获客。\n\n| 服务单元 | 需要发生的工作 | 可交付结果 |\n|---|---|---|\n| 辨认采购问题 | 对照询价、产品和销售材料，区分常见顾虑与缺项 | 一组有依据、能讨论的问题 |\n| 制作可用回应 | AI构思，专业核验，形成适合客户场景的内容与销售资料 | 客户可采用的材料 |\n| 连接后续行动 | 记录内容引来的询价质量、销售采用和跟进 | 识别在哪一段有效或受阻 |\n| 更新方法 | 把实际结果与反例带回下一轮 | 更好的问题、材料和工作安排 |\n\nFDE需要实现资料与实际行动连接，专业人员承担事实判断，客户销售提供后续信息和执行。若只交更多推送，责任关系并没有形成。\n\n## 收费方式必须与交付能力一起改变\n\n按篇收费简单，持续服务则要约定范围、资料更新、专业支持与结果解释。按期收费可以支持连续投入，也可能让企业承担超过容量的责任，不能只把旧交付换成订阅名目。\n\n案例月账已经说明，核验能力从4篇到6篇也需要真实付费需求；客户只买80篇，新开支可能降低贡献。新服务的选择同样要问：谁愿意为什么付费，需要多少持续人工和工具，收入能否支持这些工作。\n\nTeece的商业模式研究连接客户价值、交付和获取。原始研究 宝洁研究则提供AI参与跨专业构思的参照，并没有替任何新产品证明市场收入。创新研究\n\n## 哪些结果会让团队改变产品\n\n若客户只缺准确材料，技术内容交付已经足够；若询价质量提高但销售无人跟进，服务边界需要重新讨论；若客户不愿提供后续记录，就难以承担完整获客判断。\n\n烘焙预订、设备持续服务、工业品适配支持也有相似机会：原有能力提供基础，新的客户处境和交付组合仍需重新认识。AI既可以帮助企业把旧事做好，也可以帮助它发现下一种值得做的事。后者依靠的，正是连续生产、系统关联与实际检验。\n"},{"file":"39-行业与竞争节奏.md","id":"lesson-39","number":39,"role":"核心课","part":7,"title":"第39章｜同一种AI，为什么会以不同速度改变企业","md":"# 第39章｜同一种AI，为什么会以不同速度改变企业\n\n内容可以迅速生成，顾客还要选择；报价可以更快形成，供应仍要兑现；备货判断变好，工坊和门店需要配合；远程分析更充分，设备有时仍要上门。智能改变的环节不同，经营变化就不会同步。\n\n判断紧迫性要追传导路径，而不只看行业是否数字化。\n\n## 先看客户和竞争者会怎样改变选择\n\n通用起草更容易取得，客户可能自做初稿、拆开采购或要求降价。旧服务的收费理由减弱，专业核验、客户理解和实际推进可能变得更重要。\n\n实物业务也不会因此拥有无限准备时间。能够更快理解需求、减少复访或组织可靠供给的竞争者，可能先取得客户信任和使用入口；现场约束只改变作用路径，不会自动免除竞争。\n\n| 业务 | 智能可能较快改变什么 | 变化要继续经过什么 |\n|---|---|---|\n| 连锁 | 需求线索、排产和顾客触达 | 品质、生产、配送与门店 |\n| 工业品 | 材料理解、适配比较和响应 | 供货、价格、工程与交付 |\n| 设备服务 | 经验调用、准备和跟进 | 专业支持、配套与现场 |\n| 内容服务 | 构思、资料和核验支持 | 客户接受、发布、询价与销售 |\n\n## 再看本企业形成能力需要多久\n\n外部产品以后可以买到，本企业却需要通过任务和反馈认识客户、方法与协作。反馈慢、工作复杂的业务，反而可能需要更早建立相关学习条件。\n\n吸收能力解释相关知识如何帮助应用新知识，动态能力关注能力在变化中保持相关。[吸收能力](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)、[动态能力](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf) 如果客户很快改变购买，而企业还不能组织一项有结果的试做，学习和工程就是当前的重要缺口。\n\n## 价值变大以后，企业能否留下它\n\n通用能力普及，竞争可能把部分改善让给客户；客户入口由平台掌握，又可能改变议价；真正稀缺的履约与专业资源，则影响谁能持续取得收益。\n\n报价案例中，订单从200变250，但单均贡献500降到400，新增费用前的贡献总额仍相同。规模变化不自动保护利润。企业应建设有客户依据的组合，也要理解价格、渠道与供给关系。\n\n## 研究结果应该帮助辨条件\n\n客服、创新、办公和开发研究观察不同任务、时期和结果，不能平均成一个通用提效率。某项反向结果也不应永久冻结技术判断。回到研究处理什么、比较什么，再看哪些条件与自身相似，才有迁移价值。[研究与延伸阅读](延伸阅读.md)\n\n这不削弱主动建设。它使紧迫感有具体对象：哪项客户选择正在变化，企业哪种能力来不及形成，眼下什么投入可以缩短差距。\n\n下一周期能否发展，仍受很多因素影响；在自己能改变的部分，持续建立客户理解、工程、智能资源经营和学习能力，是企业可以主动采取的路线。\n","html":"\u003ch1>第39章｜同一种AI，为什么会以不同速度改变企业\u003c/h1>\n\u003cp>内容可以迅速生成，顾客还要选择；报价可以更快形成，供应仍要兑现；备货判断变好，工坊和门店需要配合；远程分析更充分，设备有时仍要上门。智能改变的环节不同，经营变化就不会同步。\u003c/p>\n\u003cp>判断紧迫性要追传导路径，而不只看行业是否数字化。\u003c/p>\n\u003ch2 id=\"lesson-39-section-1\">先看客户和竞争者会怎样改变选择\u003c/h2>\n\u003cp>通用起草更容易取得，客户可能自做初稿、拆开采购或要求降价。旧服务的收费理由减弱，专业核验、客户理解和实际推进可能变得更重要。\u003c/p>\n\u003cp>实物业务也不会因此拥有无限准备时间。能够更快理解需求、减少复访或组织可靠供给的竞争者，可能先取得客户信任和使用入口；现场约束只改变作用路径，不会自动免除竞争。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>业务\u003c/th>\n\u003cth>智能可能较快改变什么\u003c/th>\n\u003cth>变化要继续经过什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>连锁\u003c/td>\n\u003ctd>需求线索、排产和顾客触达\u003c/td>\n\u003ctd>品质、生产、配送与门店\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工业品\u003c/td>\n\u003ctd>材料理解、适配比较和响应\u003c/td>\n\u003ctd>供货、价格、工程与交付\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>设备服务\u003c/td>\n\u003ctd>经验调用、准备和跟进\u003c/td>\n\u003ctd>专业支持、配套与现场\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>内容服务\u003c/td>\n\u003ctd>构思、资料和核验支持\u003c/td>\n\u003ctd>客户接受、发布、询价与销售\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"lesson-39-section-2\">再看本企业形成能力需要多久\u003c/h2>\n\u003cp>外部产品以后可以买到，本企业却需要通过任务和反馈认识客户、方法与协作。反馈慢、工作复杂的业务，反而可能需要更早建立相关学习条件。\u003c/p>\n\u003cp>吸收能力解释相关知识如何帮助应用新知识，动态能力关注能力在变化中保持相关。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">吸收能力\u003c/a>、\u003ca href=\"https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">动态能力\u003c/a> 如果客户很快改变购买，而企业还不能组织一项有结果的试做，学习和工程就是当前的重要缺口。\u003c/p>\n\u003ch2 id=\"lesson-39-section-3\">价值变大以后，企业能否留下它\u003c/h2>\n\u003cp>通用能力普及，竞争可能把部分改善让给客户；客户入口由平台掌握，又可能改变议价；真正稀缺的履约与专业资源，则影响谁能持续取得收益。\u003c/p>\n\u003cp>报价案例中，订单从200变250，但单均贡献500降到400，新增费用前的贡献总额仍相同。规模变化不自动保护利润。企业应建设有客户依据的组合，也要理解价格、渠道与供给关系。\u003c/p>\n\u003ch2 id=\"lesson-39-section-4\">研究结果应该帮助辨条件\u003c/h2>\n\u003cp>客服、创新、办公和开发研究观察不同任务、时期和结果，不能平均成一个通用提效率。某项反向结果也不应永久冻结技术判断。回到研究处理什么、比较什么，再看哪些条件与自身相似，才有迁移价值。\u003ca href=\"#reading\">研究与延伸阅读\u003c/a>\u003c/p>\n\u003cp>这不削弱主动建设。它使紧迫感有具体对象：哪项客户选择正在变化，企业哪种能力来不及形成，眼下什么投入可以缩短差距。\u003c/p>\n\u003cp>下一周期能否发展，仍受很多因素影响；在自己能改变的部分，持续建立客户理解、工程、智能资源经营和学习能力，是企业可以主动采取的路线。\u003c/p>\n","headings":[{"id":"lesson-39-section-1","label":"先看客户和竞争者会怎样改变选择"},{"id":"lesson-39-section-2","label":"再看本企业形成能力需要多久"},{"id":"lesson-39-section-3","label":"价值变大以后，企业能否留下它"},{"id":"lesson-39-section-4","label":"研究结果应该帮助辨条件"}],"exportMd":"# 第39章｜同一种AI，为什么会以不同速度改变企业\n\n内容可以迅速生成，顾客还要选择；报价可以更快形成，供应仍要兑现；备货判断变好，工坊和门店需要配合；远程分析更充分，设备有时仍要上门。智能改变的环节不同，经营变化就不会同步。\n\n判断紧迫性要追传导路径，而不只看行业是否数字化。\n\n## 先看客户和竞争者会怎样改变选择\n\n通用起草更容易取得，客户可能自做初稿、拆开采购或要求降价。旧服务的收费理由减弱，专业核验、客户理解和实际推进可能变得更重要。\n\n实物业务也不会因此拥有无限准备时间。能够更快理解需求、减少复访或组织可靠供给的竞争者，可能先取得客户信任和使用入口；现场约束只改变作用路径，不会自动免除竞争。\n\n| 业务 | 智能可能较快改变什么 | 变化要继续经过什么 |\n|---|---|---|\n| 连锁 | 需求线索、排产和顾客触达 | 品质、生产、配送与门店 |\n| 工业品 | 材料理解、适配比较和响应 | 供货、价格、工程与交付 |\n| 设备服务 | 经验调用、准备和跟进 | 专业支持、配套与现场 |\n| 内容服务 | 构思、资料和核验支持 | 客户接受、发布、询价与销售 |\n\n## 再看本企业形成能力需要多久\n\n外部产品以后可以买到，本企业却需要通过任务和反馈认识客户、方法与协作。反馈慢、工作复杂的业务，反而可能需要更早建立相关学习条件。\n\n吸收能力解释相关知识如何帮助应用新知识，动态能力关注能力在变化中保持相关。[吸收能力](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)、[动态能力](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf) 如果客户很快改变购买，而企业还不能组织一项有结果的试做，学习和工程就是当前的重要缺口。\n\n## 价值变大以后，企业能否留下它\n\n通用能力普及，竞争可能把部分改善让给客户；客户入口由平台掌握，又可能改变议价；真正稀缺的履约与专业资源，则影响谁能持续取得收益。\n\n报价案例中，订单从200变250，但单均贡献500降到400，新增费用前的贡献总额仍相同。规模变化不自动保护利润。企业应建设有客户依据的组合，也要理解价格、渠道与供给关系。\n\n## 研究结果应该帮助辨条件\n\n客服、创新、办公和开发研究观察不同任务、时期和结果，不能平均成一个通用提效率。某项反向结果也不应永久冻结技术判断。回到研究处理什么、比较什么，再看哪些条件与自身相似，才有迁移价值。[研究与延伸阅读](#reading)\n\n这不削弱主动建设。它使紧迫感有具体对象：哪项客户选择正在变化，企业哪种能力来不及形成，眼下什么投入可以缩短差距。\n\n下一周期能否发展，仍受很多因素影响；在自己能改变的部分，持续建立客户理解、工程、智能资源经营和学习能力，是企业可以主动采取的路线。\n","exportSingleMd":"# 第39章｜同一种AI，为什么会以不同速度改变企业\n\n内容可以迅速生成，顾客还要选择；报价可以更快形成，供应仍要兑现；备货判断变好，工坊和门店需要配合；远程分析更充分，设备有时仍要上门。智能改变的环节不同，经营变化就不会同步。\n\n判断紧迫性要追传导路径，而不只看行业是否数字化。\n\n## 先看客户和竞争者会怎样改变选择\n\n通用起草更容易取得，客户可能自做初稿、拆开采购或要求降价。旧服务的收费理由减弱，专业核验、客户理解和实际推进可能变得更重要。\n\n实物业务也不会因此拥有无限准备时间。能够更快理解需求、减少复访或组织可靠供给的竞争者，可能先取得客户信任和使用入口；现场约束只改变作用路径，不会自动免除竞争。\n\n| 业务 | 智能可能较快改变什么 | 变化要继续经过什么 |\n|---|---|---|\n| 连锁 | 需求线索、排产和顾客触达 | 品质、生产、配送与门店 |\n| 工业品 | 材料理解、适配比较和响应 | 供货、价格、工程与交付 |\n| 设备服务 | 经验调用、准备和跟进 | 专业支持、配套与现场 |\n| 内容服务 | 构思、资料和核验支持 | 客户接受、发布、询价与销售 |\n\n## 再看本企业形成能力需要多久\n\n外部产品以后可以买到，本企业却需要通过任务和反馈认识客户、方法与协作。反馈慢、工作复杂的业务，反而可能需要更早建立相关学习条件。\n\n吸收能力解释相关知识如何帮助应用新知识，动态能力关注能力在变化中保持相关。[吸收能力](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)、[动态能力](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf) 如果客户很快改变购买，而企业还不能组织一项有结果的试做，学习和工程就是当前的重要缺口。\n\n## 价值变大以后，企业能否留下它\n\n通用能力普及，竞争可能把部分改善让给客户；客户入口由平台掌握，又可能改变议价；真正稀缺的履约与专业资源，则影响谁能持续取得收益。\n\n报价案例中，订单从200变250，但单均贡献500降到400，新增费用前的贡献总额仍相同。规模变化不自动保护利润。企业应建设有客户依据的组合，也要理解价格、渠道与供给关系。\n\n## 研究结果应该帮助辨条件\n\n客服、创新、办公和开发研究观察不同任务、时期和结果，不能平均成一个通用提效率。某项反向结果也不应永久冻结技术判断。回到研究处理什么、比较什么，再看哪些条件与自身相似，才有迁移价值。[研究与延伸阅读](https://zhongky1995.github.io/gaidn-fde-handbook/#reading)\n\n这不削弱主动建设。它使紧迫感有具体对象：哪项客户选择正在变化，企业哪种能力来不及形成，眼下什么投入可以缩短差距。\n\n下一周期能否发展，仍受很多因素影响；在自己能改变的部分，持续建立客户理解、工程、智能资源经营和学习能力，是企业可以主动采取的路线。\n","text":"# 第39章｜同一种AI，为什么会以不同速度改变企业\n\n内容可以迅速生成，顾客还要选择；报价可以更快形成，供应仍要兑现；备货判断变好，工坊和门店需要配合；远程分析更充分，设备有时仍要上门。智能改变的环节不同，经营变化就不会同步。\n\n判断紧迫性要追传导路径，而不只看行业是否数字化。\n\n## 先看客户和竞争者会怎样改变选择\n\n通用起草更容易取得，客户可能自做初稿、拆开采购或要求降价。旧服务的收费理由减弱，专业核验、客户理解和实际推进可能变得更重要。\n\n实物业务也不会因此拥有无限准备时间。能够更快理解需求、减少复访或组织可靠供给的竞争者，可能先取得客户信任和使用入口；现场约束只改变作用路径，不会自动免除竞争。\n\n| 业务 | 智能可能较快改变什么 | 变化要继续经过什么 |\n|---|---|---|\n| 连锁 | 需求线索、排产和顾客触达 | 品质、生产、配送与门店 |\n| 工业品 | 材料理解、适配比较和响应 | 供货、价格、工程与交付 |\n| 设备服务 | 经验调用、准备和跟进 | 专业支持、配套与现场 |\n| 内容服务 | 构思、资料和核验支持 | 客户接受、发布、询价与销售 |\n\n## 再看本企业形成能力需要多久\n\n外部产品以后可以买到，本企业却需要通过任务和反馈认识客户、方法与协作。反馈慢、工作复杂的业务，反而可能需要更早建立相关学习条件。\n\n吸收能力解释相关知识如何帮助应用新知识，动态能力关注能力在变化中保持相关。吸收能力、动态能力 如果客户很快改变购买，而企业还不能组织一项有结果的试做，学习和工程就是当前的重要缺口。\n\n## 价值变大以后，企业能否留下它\n\n通用能力普及，竞争可能把部分改善让给客户；客户入口由平台掌握，又可能改变议价；真正稀缺的履约与专业资源，则影响谁能持续取得收益。\n\n报价案例中，订单从200变250，但单均贡献500降到400，新增费用前的贡献总额仍相同。规模变化不自动保护利润。企业应建设有客户依据的组合，也要理解价格、渠道与供给关系。\n\n## 研究结果应该帮助辨条件\n\n客服、创新、办公和开发研究观察不同任务、时期和结果，不能平均成一个通用提效率。某项反向结果也不应永久冻结技术判断。回到研究处理什么、比较什么，再看哪些条件与自身相似，才有迁移价值。研究与延伸阅读\n\n这不削弱主动建设。它使紧迫感有具体对象：哪项客户选择正在变化，企业哪种能力来不及形成，眼下什么投入可以缩短差距。\n\n下一周期能否发展，仍受很多因素影响；在自己能改变的部分，持续建立客户理解、工程、智能资源经营和学习能力，是企业可以主动采取的路线。\n"},{"file":"40-完整改造提案.md","id":"lesson-40","number":40,"role":"核心课","part":7,"title":"第40章｜把案例推导成一份真正可以决定投入的提案","md":"# 第40章｜把案例推导成一份真正可以决定投入的提案\n\n一份提案若只写“建设知识库、提升效率、形成壁垒”，经营、业务与工程会各自补一套想象。完整表达要让别人看懂为什么值得、什么机制起作用、如何实现、怎样比较，以及条件变了怎么办。\n\n用[连锁案例](案例A-连锁备货.md)把这些内容连成一项候选决定。\n\n## 背景要把经营矛盾讲完整\n\n企业有8店与中央工坊。X店主打点心18点卖完80份，晚间仍有人问；Y配80售60。其他六店订单安排后，这两店可用窗口能做320份，目前只排160。原配送上午一次，追加补货需新路线；该商品售罄后，门店停止推介和持续预订登记。\n\n这说明值得研究的不是日报速度，而是需求、排产、配送和需求获取共同形成的限制。目标是更可靠地满足有价值需求，同时控制剩余并留下有效判断。顾客究竟因何选择、需求有多大，仍要由实际行为核对。\n\n## 主张需要一条作用路径\n\nAI组织受限销量、店长说明、排产和推广材料，提出可检验关系；FDE把关键事实与候选、正式安排、实际到店、销售和剩余对应起来。负责人据此比较改分配、增加供给或先改其他环节。\n\n企业同时得到两类产出：当前更有依据的经营动作，和带着条件、反例与结果的可再用方法。工坊产能、配送和门店工作需要真实安排，模型不能独自完成这些承诺。\n\n## 收益要比最合理的替代\n\n给定正常需求X160/Y60，售价12、生产变动成本4，扩产新增日常支出80元。\n\n| 候选 | 日列示贡献 | 选择含义 |\n|---|---:|---|\n| 原80/80 | 1040元 | 当前比较起点 |\n| 只改100/60 | 1280元 | 现有方式也可做的简单改善 |\n| 扩产补货160/60 | 1680元 | 比改分配再多400元 |\n\nX单品可以翻倍，但全网、收入和利润是不同口径。扩产相对只改分配，需要覆盖多生产60份的240元和80元日支出，至少新增销售27份才更好；一次接入6000元再进入项目账。相同正常条件20日，相对原安排增量扣接入后6800元。\n\n对经营决定，首先比较完整可实施方案是否值得；要判断继续升级模型还是改流程，再研究各组件增量。无需等每一元收益都精确归到模型才开始，但也不能把普通改配本就能取得的作用全部称为AI成果。\n\n## 第一阶段怎样取得会改变投资的证据\n\n先核对可用产能、品质和补货，取得售罄后的顾客行为，在有限范围试追加供给与相应推介。实际负责人、工时和复查日期应在开工前确定，案例不替真实企业填写。\n\n| 需要验证 | 观察如何影响选择 |\n|---|---|\n| 事实与方案质量 | 重要条件是否被保留，未知是否被补成确定 |\n| 实际业务作用 | 供给、销售、剩余和全网相关成本是否改善 |\n| 可接续能力 | 换店长、换日期、新店是否会用对条件 |\n\n新增销售不足以覆盖最好替代，保留简单方案；需求成立但配送阻碍，先改履约；记录与实际不能对应，先修采用链。持续合作应根据这些发现改变下一阶段，而不是预定一路扩成全网自动化。\n\n## 说明谁承担、怎样纠错\n\n门店确认现场事实并执行相应销售动作；中央负责人决定产量、跨店资源与取舍；FDE实现材料、工具、状态和评价；内部人员逐步维护与接任。评价要允许真实例外进入，不能因报告坏结果而让反馈消失。\n\n交通变化为X50/Y90时，仍扩产会比原安排少560元列示贡献。新事实需要进入当前决定，方法状态与代表任务随之更新。保留历史依据，停止照搬旧数量。\n\n## 换一种业务，再检查是否真的理解\n\n工业品的结果是可履约替代和订单贡献，不能把“门店”机械换成“客户”；设备服务要辨可避免复访，客户停机损失与服务商现金分开；内容服务要连接核验、实际付费需求与后续行动，初稿量不是收入。\n\n同样的提案逻辑，进入不同业务会改变事实、资源、收益与验证。能完成这种重建，才说明课程方法已经开始转成经营判断。\n\n配套[工作簿](工作簿-改造提案.md)帮助把自己的材料写成可讨论的决定。提案允许未知，但每个重要未知应有名字、取得依据的办法，以及会因此改变的选择。\n","html":"\u003ch1>第40章｜把案例推导成一份真正可以决定投入的提案\u003c/h1>\n\u003cp>一份提案若只写“建设知识库、提升效率、形成壁垒”，经营、业务与工程会各自补一套想象。完整表达要让别人看懂为什么值得、什么机制起作用、如何实现、怎样比较，以及条件变了怎么办。\u003c/p>\n\u003cp>用\u003ca href=\"#case-a\">连锁案例\u003c/a>把这些内容连成一项候选决定。\u003c/p>\n\u003ch2 id=\"lesson-40-section-1\">背景要把经营矛盾讲完整\u003c/h2>\n\u003cp>企业有8店与中央工坊。X店主打点心18点卖完80份，晚间仍有人问；Y配80售60。其他六店订单安排后，这两店可用窗口能做320份，目前只排160。原配送上午一次，追加补货需新路线；该商品售罄后，门店停止推介和持续预订登记。\u003c/p>\n\u003cp>这说明值得研究的不是日报速度，而是需求、排产、配送和需求获取共同形成的限制。目标是更可靠地满足有价值需求，同时控制剩余并留下有效判断。顾客究竟因何选择、需求有多大，仍要由实际行为核对。\u003c/p>\n\u003ch2 id=\"lesson-40-section-2\">主张需要一条作用路径\u003c/h2>\n\u003cp>AI组织受限销量、店长说明、排产和推广材料，提出可检验关系；FDE把关键事实与候选、正式安排、实际到店、销售和剩余对应起来。负责人据此比较改分配、增加供给或先改其他环节。\u003c/p>\n\u003cp>企业同时得到两类产出：当前更有依据的经营动作，和带着条件、反例与结果的可再用方法。工坊产能、配送和门店工作需要真实安排，模型不能独自完成这些承诺。\u003c/p>\n\u003ch2 id=\"lesson-40-section-3\">收益要比最合理的替代\u003c/h2>\n\u003cp>给定正常需求X160/Y60，售价12、生产变动成本4，扩产新增日常支出80元。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>候选\u003c/th>\n\u003cth align=\"right\">日列示贡献\u003c/th>\n\u003cth>选择含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>原80/80\u003c/td>\n\u003ctd align=\"right\">1040元\u003c/td>\n\u003ctd>当前比较起点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>只改100/60\u003c/td>\n\u003ctd align=\"right\">1280元\u003c/td>\n\u003ctd>现有方式也可做的简单改善\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>扩产补货160/60\u003c/td>\n\u003ctd align=\"right\">1680元\u003c/td>\n\u003ctd>比改分配再多400元\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>X单品可以翻倍，但全网、收入和利润是不同口径。扩产相对只改分配，需要覆盖多生产60份的240元和80元日支出，至少新增销售27份才更好；一次接入6000元再进入项目账。相同正常条件20日，相对原安排增量扣接入后6800元。\u003c/p>\n\u003cp>对经营决定，首先比较完整可实施方案是否值得；要判断继续升级模型还是改流程，再研究各组件增量。无需等每一元收益都精确归到模型才开始，但也不能把普通改配本就能取得的作用全部称为AI成果。\u003c/p>\n\u003ch2 id=\"lesson-40-section-4\">第一阶段怎样取得会改变投资的证据\u003c/h2>\n\u003cp>先核对可用产能、品质和补货，取得售罄后的顾客行为，在有限范围试追加供给与相应推介。实际负责人、工时和复查日期应在开工前确定，案例不替真实企业填写。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>需要验证\u003c/th>\n\u003cth>观察如何影响选择\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>事实与方案质量\u003c/td>\n\u003ctd>重要条件是否被保留，未知是否被补成确定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>实际业务作用\u003c/td>\n\u003ctd>供给、销售、剩余和全网相关成本是否改善\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可接续能力\u003c/td>\n\u003ctd>换店长、换日期、新店是否会用对条件\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>新增销售不足以覆盖最好替代，保留简单方案；需求成立但配送阻碍，先改履约；记录与实际不能对应，先修采用链。持续合作应根据这些发现改变下一阶段，而不是预定一路扩成全网自动化。\u003c/p>\n\u003ch2 id=\"lesson-40-section-5\">说明谁承担、怎样纠错\u003c/h2>\n\u003cp>门店确认现场事实并执行相应销售动作；中央负责人决定产量、跨店资源与取舍；FDE实现材料、工具、状态和评价；内部人员逐步维护与接任。评价要允许真实例外进入，不能因报告坏结果而让反馈消失。\u003c/p>\n\u003cp>交通变化为X50/Y90时，仍扩产会比原安排少560元列示贡献。新事实需要进入当前决定，方法状态与代表任务随之更新。保留历史依据，停止照搬旧数量。\u003c/p>\n\u003ch2 id=\"lesson-40-section-6\">换一种业务，再检查是否真的理解\u003c/h2>\n\u003cp>工业品的结果是可履约替代和订单贡献，不能把“门店”机械换成“客户”；设备服务要辨可避免复访，客户停机损失与服务商现金分开；内容服务要连接核验、实际付费需求与后续行动，初稿量不是收入。\u003c/p>\n\u003cp>同样的提案逻辑，进入不同业务会改变事实、资源、收益与验证。能完成这种重建，才说明课程方法已经开始转成经营判断。\u003c/p>\n\u003cp>配套\u003ca href=\"#workbook\">工作簿\u003c/a>帮助把自己的材料写成可讨论的决定。提案允许未知，但每个重要未知应有名字、取得依据的办法，以及会因此改变的选择。\u003c/p>\n","headings":[{"id":"lesson-40-section-1","label":"背景要把经营矛盾讲完整"},{"id":"lesson-40-section-2","label":"主张需要一条作用路径"},{"id":"lesson-40-section-3","label":"收益要比最合理的替代"},{"id":"lesson-40-section-4","label":"第一阶段怎样取得会改变投资的证据"},{"id":"lesson-40-section-5","label":"说明谁承担、怎样纠错"},{"id":"lesson-40-section-6","label":"换一种业务，再检查是否真的理解"}],"exportMd":"# 第40章｜把案例推导成一份真正可以决定投入的提案\n\n一份提案若只写“建设知识库、提升效率、形成壁垒”，经营、业务与工程会各自补一套想象。完整表达要让别人看懂为什么值得、什么机制起作用、如何实现、怎样比较，以及条件变了怎么办。\n\n用[连锁案例](#case-a)把这些内容连成一项候选决定。\n\n## 背景要把经营矛盾讲完整\n\n企业有8店与中央工坊。X店主打点心18点卖完80份，晚间仍有人问；Y配80售60。其他六店订单安排后，这两店可用窗口能做320份，目前只排160。原配送上午一次，追加补货需新路线；该商品售罄后，门店停止推介和持续预订登记。\n\n这说明值得研究的不是日报速度，而是需求、排产、配送和需求获取共同形成的限制。目标是更可靠地满足有价值需求，同时控制剩余并留下有效判断。顾客究竟因何选择、需求有多大，仍要由实际行为核对。\n\n## 主张需要一条作用路径\n\nAI组织受限销量、店长说明、排产和推广材料，提出可检验关系；FDE把关键事实与候选、正式安排、实际到店、销售和剩余对应起来。负责人据此比较改分配、增加供给或先改其他环节。\n\n企业同时得到两类产出：当前更有依据的经营动作，和带着条件、反例与结果的可再用方法。工坊产能、配送和门店工作需要真实安排，模型不能独自完成这些承诺。\n\n## 收益要比最合理的替代\n\n给定正常需求X160/Y60，售价12、生产变动成本4，扩产新增日常支出80元。\n\n| 候选 | 日列示贡献 | 选择含义 |\n|---|---:|---|\n| 原80/80 | 1040元 | 当前比较起点 |\n| 只改100/60 | 1280元 | 现有方式也可做的简单改善 |\n| 扩产补货160/60 | 1680元 | 比改分配再多400元 |\n\nX单品可以翻倍，但全网、收入和利润是不同口径。扩产相对只改分配，需要覆盖多生产60份的240元和80元日支出，至少新增销售27份才更好；一次接入6000元再进入项目账。相同正常条件20日，相对原安排增量扣接入后6800元。\n\n对经营决定，首先比较完整可实施方案是否值得；要判断继续升级模型还是改流程，再研究各组件增量。无需等每一元收益都精确归到模型才开始，但也不能把普通改配本就能取得的作用全部称为AI成果。\n\n## 第一阶段怎样取得会改变投资的证据\n\n先核对可用产能、品质和补货，取得售罄后的顾客行为，在有限范围试追加供给与相应推介。实际负责人、工时和复查日期应在开工前确定，案例不替真实企业填写。\n\n| 需要验证 | 观察如何影响选择 |\n|---|---|\n| 事实与方案质量 | 重要条件是否被保留，未知是否被补成确定 |\n| 实际业务作用 | 供给、销售、剩余和全网相关成本是否改善 |\n| 可接续能力 | 换店长、换日期、新店是否会用对条件 |\n\n新增销售不足以覆盖最好替代，保留简单方案；需求成立但配送阻碍，先改履约；记录与实际不能对应，先修采用链。持续合作应根据这些发现改变下一阶段，而不是预定一路扩成全网自动化。\n\n## 说明谁承担、怎样纠错\n\n门店确认现场事实并执行相应销售动作；中央负责人决定产量、跨店资源与取舍；FDE实现材料、工具、状态和评价；内部人员逐步维护与接任。评价要允许真实例外进入，不能因报告坏结果而让反馈消失。\n\n交通变化为X50/Y90时，仍扩产会比原安排少560元列示贡献。新事实需要进入当前决定，方法状态与代表任务随之更新。保留历史依据，停止照搬旧数量。\n\n## 换一种业务，再检查是否真的理解\n\n工业品的结果是可履约替代和订单贡献，不能把“门店”机械换成“客户”；设备服务要辨可避免复访，客户停机损失与服务商现金分开；内容服务要连接核验、实际付费需求与后续行动，初稿量不是收入。\n\n同样的提案逻辑，进入不同业务会改变事实、资源、收益与验证。能完成这种重建，才说明课程方法已经开始转成经营判断。\n\n配套[工作簿](#workbook)帮助把自己的材料写成可讨论的决定。提案允许未知，但每个重要未知应有名字、取得依据的办法，以及会因此改变的选择。\n","exportSingleMd":"# 第40章｜把案例推导成一份真正可以决定投入的提案\n\n一份提案若只写“建设知识库、提升效率、形成壁垒”，经营、业务与工程会各自补一套想象。完整表达要让别人看懂为什么值得、什么机制起作用、如何实现、怎样比较，以及条件变了怎么办。\n\n用[连锁案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-a)把这些内容连成一项候选决定。\n\n## 背景要把经营矛盾讲完整\n\n企业有8店与中央工坊。X店主打点心18点卖完80份，晚间仍有人问；Y配80售60。其他六店订单安排后，这两店可用窗口能做320份，目前只排160。原配送上午一次，追加补货需新路线；该商品售罄后，门店停止推介和持续预订登记。\n\n这说明值得研究的不是日报速度，而是需求、排产、配送和需求获取共同形成的限制。目标是更可靠地满足有价值需求，同时控制剩余并留下有效判断。顾客究竟因何选择、需求有多大，仍要由实际行为核对。\n\n## 主张需要一条作用路径\n\nAI组织受限销量、店长说明、排产和推广材料，提出可检验关系；FDE把关键事实与候选、正式安排、实际到店、销售和剩余对应起来。负责人据此比较改分配、增加供给或先改其他环节。\n\n企业同时得到两类产出：当前更有依据的经营动作，和带着条件、反例与结果的可再用方法。工坊产能、配送和门店工作需要真实安排，模型不能独自完成这些承诺。\n\n## 收益要比最合理的替代\n\n给定正常需求X160/Y60，售价12、生产变动成本4，扩产新增日常支出80元。\n\n| 候选 | 日列示贡献 | 选择含义 |\n|---|---:|---|\n| 原80/80 | 1040元 | 当前比较起点 |\n| 只改100/60 | 1280元 | 现有方式也可做的简单改善 |\n| 扩产补货160/60 | 1680元 | 比改分配再多400元 |\n\nX单品可以翻倍，但全网、收入和利润是不同口径。扩产相对只改分配，需要覆盖多生产60份的240元和80元日支出，至少新增销售27份才更好；一次接入6000元再进入项目账。相同正常条件20日，相对原安排增量扣接入后6800元。\n\n对经营决定，首先比较完整可实施方案是否值得；要判断继续升级模型还是改流程，再研究各组件增量。无需等每一元收益都精确归到模型才开始，但也不能把普通改配本就能取得的作用全部称为AI成果。\n\n## 第一阶段怎样取得会改变投资的证据\n\n先核对可用产能、品质和补货，取得售罄后的顾客行为，在有限范围试追加供给与相应推介。实际负责人、工时和复查日期应在开工前确定，案例不替真实企业填写。\n\n| 需要验证 | 观察如何影响选择 |\n|---|---|\n| 事实与方案质量 | 重要条件是否被保留，未知是否被补成确定 |\n| 实际业务作用 | 供给、销售、剩余和全网相关成本是否改善 |\n| 可接续能力 | 换店长、换日期、新店是否会用对条件 |\n\n新增销售不足以覆盖最好替代，保留简单方案；需求成立但配送阻碍，先改履约；记录与实际不能对应，先修采用链。持续合作应根据这些发现改变下一阶段，而不是预定一路扩成全网自动化。\n\n## 说明谁承担、怎样纠错\n\n门店确认现场事实并执行相应销售动作；中央负责人决定产量、跨店资源与取舍；FDE实现材料、工具、状态和评价；内部人员逐步维护与接任。评价要允许真实例外进入，不能因报告坏结果而让反馈消失。\n\n交通变化为X50/Y90时，仍扩产会比原安排少560元列示贡献。新事实需要进入当前决定，方法状态与代表任务随之更新。保留历史依据，停止照搬旧数量。\n\n## 换一种业务，再检查是否真的理解\n\n工业品的结果是可履约替代和订单贡献，不能把“门店”机械换成“客户”；设备服务要辨可避免复访，客户停机损失与服务商现金分开；内容服务要连接核验、实际付费需求与后续行动，初稿量不是收入。\n\n同样的提案逻辑，进入不同业务会改变事实、资源、收益与验证。能完成这种重建，才说明课程方法已经开始转成经营判断。\n\n配套[工作簿](https://zhongky1995.github.io/gaidn-fde-handbook/#workbook)帮助把自己的材料写成可讨论的决定。提案允许未知，但每个重要未知应有名字、取得依据的办法，以及会因此改变的选择。\n","text":"# 第40章｜把案例推导成一份真正可以决定投入的提案\n\n一份提案若只写“建设知识库、提升效率、形成壁垒”，经营、业务与工程会各自补一套想象。完整表达要让别人看懂为什么值得、什么机制起作用、如何实现、怎样比较，以及条件变了怎么办。\n\n用连锁案例把这些内容连成一项候选决定。\n\n## 背景要把经营矛盾讲完整\n\n企业有8店与中央工坊。X店主打点心18点
