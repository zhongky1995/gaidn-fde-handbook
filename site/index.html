const COURSE={"pages":[{"file":"00-导学.md","id":"intro","number":0,"role":"导学","part":-1,"title":"企业 AI 转型与 FDE","md":"# 企业 AI 转型与 FDE\n\n## 技术变化、业务重构与组织能力\n\n企业正在获得一种新的能力供给：阅读非标准材料，解释复杂条件，生成方案，编写软件，并通过工具参与实际工作。这些能力进入经营活动以后，首先改变的是一项工作怎样完成，随后才可能改变成本、交付方式、服务范围和竞争位置。\n\n中间这段路值得认真研究。报价准备加快，可能让企业接住原先放弃的小订单；也可能把更多不完整的需求送进本已拥堵的技术部门。报告写得更快，可能释放专业人员的时间；也可能让团队花更多精力核对缺少依据的结论。要判断哪一种情况会发生，需要同时理解技术、业务和组织。\n\n这门课围绕一个问题展开：**企业怎样把通用 AI 能力，转化为能够反复使用、有人负责、可以持续改进的经营能力？**\n\nFDE是其中一条重要线索。Forward Deployed Engineer通常译为前线部署工程师，核心工作是进入业务现场，参与问题发现、实现与部署，并根据使用反馈改进。企业引入这类工作方式，既要理解其工程价值，也要安排业务决策、数据、权限、采用与交接。课程将沿这条完整关系展开。\n\n## 五部分怎样连起来\n\n第一部分解释AI发展与数字化怎样改变企业，包括能力成本、任务结构、流程瓶颈及商业价值。理解这些关系，才有依据选择改造方向。\n\n第二部分研究FDE的发展与作用，并把企业方向落实到一条实际业务链：从经营结果追到现场，选择试点，再设计新的分工与承诺规则。\n\n第三部分把实施过程展开。模型怎样使用企业资料，工作流和Agent怎样安排任务，系统怎样保存状态并执行动作，原型怎样变成可以接手的生产系统。这里的技术解释服务于方案判断，也给出足够的机制，便于与实施团队共同工作。\n\n第四部分回答如何证明能够采用：测什么、跟什么比较、怎样计算投入，以及上线后怎样面对变化。\n\n第五部分讨论岗位、合作、知识积累和阶段路线。课程最终形成一份能够拿到项目会上讨论的改造提案，包含价值假设、业务设计、系统边界、验证办法和接手安排。\n\n## 阅读和使用\n\n从第1课开始，可逐步建立完整判断。已经在推进项目，可以从第6课的现场诊断进入，再根据问题回查前四课；正在评估实施团队，可以连读第5、12、13、16课。各课提供必要前提，跳读也能知道当前问题处在整条链的哪里。\n\n案例区提供三份完整卷宗。工业服务案例贯穿“非标询价到履约承诺”，专业服务和多门店案例检验相同方法在不同约束下怎样变化。它们采用明确的教学输入和假设数据，供推演与练习使用；正文引用的研究发现会交代任务与样本范围。\n\n工作簿承载你对自己企业的分析。没有现成资料，也可先使用案例卷宗完成一次，再换成自己的业务材料。练习均可自由跳过，不影响阅读；参考判断解释依据，保留不同方案成立的条件。\n\n开始时只需带着一项你熟悉的业务：它为客户提供什么、最近一笔任务怎样完成、哪里让团队反复付出代价。读到后面，你应能重新解释这个问题，并知道下一步需要取得什么证据。\n\n下一课从能力供给出发，解释这一轮AI发展为何会进入如此多的企业工作。\n","html":"\u003ch1>企业 AI 转型与 FDE\u003c/h1>\n\u003ch2>技术变化、业务重构与组织能力\u003c/h2>\n\u003cp>企业正在获得一种新的能力供给：阅读非标准材料，解释复杂条件，生成方案，编写软件，并通过工具参与实际工作。这些能力进入经营活动以后，首先改变的是一项工作怎样完成，随后才可能改变成本、交付方式、服务范围和竞争位置。\u003c/p>\n\u003cp>中间这段路值得认真研究。报价准备加快，可能让企业接住原先放弃的小订单；也可能把更多不完整的需求送进本已拥堵的技术部门。报告写得更快，可能释放专业人员的时间；也可能让团队花更多精力核对缺少依据的结论。要判断哪一种情况会发生，需要同时理解技术、业务和组织。\u003c/p>\n\u003cp>这门课围绕一个问题展开：\u003cstrong>企业怎样把通用 AI 能力，转化为能够反复使用、有人负责、可以持续改进的经营能力？\u003c/strong>\u003c/p>\n\u003cp>FDE是其中一条重要线索。Forward Deployed Engineer通常译为前线部署工程师，核心工作是进入业务现场，参与问题发现、实现与部署，并根据使用反馈改进。企业引入这类工作方式，既要理解其工程价值，也要安排业务决策、数据、权限、采用与交接。课 FDE是其中一条重要线索。Forward Deployed Engineer通常译为前线部署工程师，核心工作是进入业务现场，参与问题发现、实现与部署，并根据使用反馈改进。企业引入这类工作方式，既要理解其工程价值，也要安排业务决策、数据、权限、采用与交接。课程将沿这条完整关系展开。\n\n## 五部分怎样连起来\n\n第一部分解释AI发展与数字化怎样改变企业，包括能力成本、任务结构、流程瓶颈及商业价值。理解这些关系，才有依据选择改造方向。\n\n第二部分研究FDE的发展与作用，并把企业方向落实到一条实际业务链：从经营结果追到现场，选择试点，再设计新的分工与承诺规则。\n\n第三部分把实施过程展开。模型怎样使用企业资料，工作流和Agent怎样安排任务，系统怎样保存状态并执行动作，原型怎样变成可以接手的生产系统。这里的技术解释服务于方案判断，也给出足够的机制，便于与实施团队共同工作。\n\n第四部分回答如何证明能够采用：测什么、跟什么比较、怎样计算投入，以及上线后怎样面对变化。\n\n第五部分讨论岗位、合作、知识积累和阶段路线。课程最终形成一份能够拿到项目会上讨论的改造提案，包含价值假设、业务设计、系统边界、验证办法和接手安排。\n\n## 阅读和使用\n\n从第1课开始，可逐步建立完整判断。已经在推进项目，可以从第6课的现场诊断进入，再根据问题回查前四课；正在评估实施团队，可以连读第5、12、13、16课。各课提供必要前提，跳读也能知道当前问题处在整条链的哪里。\n\n案例区提供三份完整卷宗。工业服务案例贯穿“非标询价到履约承诺”，专业服务和多门店案例检验相同方法在不同约束下怎样变化。它们采用明确的教学输入和假设数据，供推演与练习使用；正文引用的研究发现会交代任务与样本范围。\n\n工作簿承载你对自己企业的分析。没有现成资料，也可先使用案例卷宗完成一次，再换成自己的业务材料。练习均可自由跳过，不影响阅读；参考判断解释依据，保留不同方案成立的条件。\n\n开始时只需带着一项你熟悉的业务：它为客户提供什么、最近一笔任务怎样完成、哪里让团队反复付出代价。读到后面，你应能重新解释这个问题，并知道下一步需要取得什么证据。\n\n下一课从能力供给出发，解释这一轮AI发展为何会进入如此多的企业工作。\n"},{"file":"01-AI改变了什么.md","id":"lesson-01","number":1,"role":"核心课","part":0,"title":"第1课｜AI 改变了企业的哪些条件","md":"# 第1课｜AI 改变了企业的哪些条件\n\n同样一份客户需求，过去可能需要销售整理、技术人员理解、文员录入，才能进入正式流程。现在，通用模型可以承担其中一部分阅读、解释和整理，甚至生成处理这些材料的软件。企业因此获得了新的分工空间。\n\n要判断这种变化的分量，先看能力是怎样供应的。\n\n## 从为一个任务开发，到复用通用能力\n\n企业长期使用规则程序和专用机器学习。前者把已知规则写成明确步骤，例如按价目表计算金额；后者从样本中学习特定模式，例如预测设备故障。二者都可能很有价值，也都要求对目标任务进行相当程度的专门准备。\n\n基础模型带来的变化，是先在广泛材料上训练一种可迁移的能力，再将同一个模型用于多类任务。理解一封邮件、归纳一份报告、比较方案、生成代码，可以共享部分底层能力。具体任务仍要适配，但企业不必每遇到一种文字处理需求，就从零训练一种模型。\n\n这条路径降低了尝试的起点。团队可以先提供一组材料和任务要求，观察是否有帮助，再决定是否建设系统连接。原来只有高频、大规模任务才值得开发的功能，一部分开始进入中小规模业务。\n\n“基础”同时说明其未完成性。模型的广泛能力，尚未包含当前客户是谁、价格哪个版本有效、什么人可以承诺交期。企业专属能力仍需要资料、规则、工具和责任安排。第9课将把这些部分逐一拆开。\n\n## 生成为什么能够承担工作，又为什么会出错\n\n语言模型通过训练调整内部参数，学会处理文字及其关系；运行时，根据当前输入和已经生成的内容，逐步产生后续内容。后训练可以进一步改善遵循要求、解决问题和使用工具的表现。这里发生的是从材料中学习并应用模式，企业仍需用新任务检验其是否真正适用。\n\n能够生成并不只意味着写文章。把“要耐高温、下周停机时换、尽量沿用旧型号”整理成需求条件，本身就是在生成一种新的工作表示。生成计算代码、查询语句和操作计划，也能帮助完成后续任务。模型还可以与图像、声音等输入配合，使原本需要人工转录的现场信息更容易被利用。\n\n训练时，模型可能学习预测后续文字，也可能根据示范、偏好或可验证结果改善回答。它由此学到的，是在这些训练条件下更好地生成和解决任务。企业要求的“使用此刻有效的库存作出承诺”，还包含当前事实与业务授权；这些信息如果没有进入本次任务，生成过程就没有取得它们的依据。\n\n因此，训练目标与企业目标之间有距离。一个合理的回答，可能没有使用有效库存；一份连贯的分析，可能遗漏决定性条件；正确的操作计划，也可能在执行时失败。企业关心的是承诺能否兑现、结果能否追溯，必须在模型外安排事实取得、规则校验和执行确认。\n\n这种差距解释了一个常见现象：展示时令人印象深刻，进入日常流程后仍有大量工作。展示通常证明“有能力做出一次”；经营需要知道“哪些任务能够稳定做、失败怎样处理、总成本多少”。两种问题所需的证据不同。\n\n## 这一轮发展同时改变了四个变量\n\n**覆盖范围扩大。** 通用语言与多模态能力，使非标准材料也能成为处理对象。机会不仅在已经填好的表格中，也在邮件、图片、说明和经验判断中。\n\n**复杂任务的组织方式变化。** 一个任务可以被拆成查资料、比较、计算、生成和核对，由模型与程序交替完成。允许使用更多计算、工具或更好的任务设计，可能提高结果质量，同时增加费用和等待。复杂度的上限，需要在实际工作中验证。\n\n**软件供给方式变化。** AI编程使一部分定制功能更容易制作，企业可以更早看到能操作的原型。业务提出问题、团队尝试实现、使用者反馈之间的周期可能缩短；运行维护、权限和集成仍有自己的成本。\n\n**经济上的可行范围变化。** 当一部分认知工作的处理成本下降，以前因单笔金额小、需求分散、表达不标准而被放弃的任务，可能值得重新评估。真正要比较的是“取得合格结果的全部成本”，包括核对、返工、系统与维护。\n\n这四个变量相互影响。例如，更容易制作的软件，可以把模型接到业务数据旁；更丰富的数据，又可能使模型在该任务上更有用。因此，企业面对的变化超出了给现有员工增加一个聊天窗口。\n\n## 用一类询价判断影响落在哪里\n\n设想一家工业服务企业，收到客户的文字、铭牌照片和旧采购记录。过去人工把它们整理成技术人员可判断的需求单。AI有可能更快地提取型号候选、工况和缺项。\n\n这项能力至少可以沿三条路径影响企业：相同询价量下减少准备工时；相同人员下处理更多询价；以更低成本服务原来不愿承接的小客户。三条路径需要不同条件。第一条要确认核对和返工没有吞掉节省；第二条要确认技术确认及履约还有容量；第三条要确认这些客户愿意购买、交付成本可以覆盖。\n\n一个技术效果，由此产生三个经营假设。企业应先选择想检验的假设，再组织实施。否则，团队很容易一边报告节省时间，另一边期待收入增长，中间没有共同的价值逻辑。\n\n## 发展速度快，企业怎样保持判断\n\n模型和工具会更新，今天困难的任务以后可能变容易，已经改善的任务也可能因输入变化再次失败。课程不把某个品牌或能力排名当长期前提。\n\n可以持续保留三类记录：本企业的代表任务与合格结果；当前方案的实际错误与完整成本；企业希望扩大或改善的服务。新能力出现时，用同一组任务重新比较，就能判断它改变了哪一条约束。\n\n请先选择一项熟悉的工作，写下它依赖的阅读、判断、制作与执行各是什么，再选出其中最可能变化的一段。把“AI可以帮助报价”改写成“AI可以把非标准需求整理到何种程度，因而使哪个岗位、哪种服务或哪项成本发生变化”。这句话将成为后面分析的起点。\n\n接下来需要理解另一层条件：企业现有的数字化系统，究竟为这种变化准备了什么。\n","html":"\u003ch1>第1课｜AI 改变了企业的哪些条件\u003c/h1>\n\u003cp>同样一份客户需求，过去可能需要销售整理、技术人员理解、文员录入，才能进入正式流程。现在，通用模型可以承担其中一部分阅读、解释和整理，甚至生成处理这些材料的软件。企业因此获得了新的分工空间。\u003c/p>\n\u003cp>要判断这种变化的分量，先看能力是怎样供应的。\u003c/p>\n\u003ch2>从为一个任务开发，到复用通用能力\u003c/h2>\n\u003cp>企业长期使用规则程序和专用机器学习。前者把已知规则写成明确步骤，例如按价目表计算金额；后者从样本中学习特定模式，例如预测设备故障。二者都可能很有价值，也都要求对目标任务进行相当程度的专门准备。\u003c/p>\n\u003cp>基础模型带来的变化，是先在广泛材料上训练一种可迁移的能力，再将同一个模型用于多类任务。理解一封邮件、归纳一份报告、比较方案、生成代码，可以共享部分底层能力。具体任务仍要适配，但企业不必每遇到一种文字处理需求，就从零训练一种模型。\u003c/p>\n\u003cp>这条路径降低了尝试的起点。团队可以先提供一组材料和任务要求，观察是否有帮助，再决定是否建设系统连接。原来只有高频、大规模任务才值得开发的功能，一部分开始进入中小规模业务。\u003c/p>\n\u003cp>“基础”同时说明其未完成性。模型的广泛能力，尚未包含当前客户是谁、价格哪个版本有效、什么人可以承诺交期。企业专属能力仍需要资料、规则、工具和责任安排。第9课将把这些部分逐一拆开。\u003c/p>\n\u003ch2>生成为什么能够承担工作，又为什么会出错\u003c/h2>\n\u003cp>语言模型通过训练调整内部参数，学会处理文字及其关系；运行时，根据当前输入和已经生成的内容，逐步产生后续内容。后训练可以进一步改善遵循要求、解决问题和使用工具的表现。这里发生的是从材料中学习并应用模式，企业仍需用新任务检验其是否真正适用。\u003c/p>\n\u003cp>能够生成并不只意味着写文章。把“要耐高温、下周停机时换、尽量沿用旧型号”整理成需求条件，本身就是在生成一种新的工作表示。生成计算代码、查询语句和操作计划，也能帮助完成后续任务。模型还可以与图像、声音等输入配合，使原本需要人工转录的现场信息更容易被利用。\u003c/p>\n\u003cp>训练时，模型可能学习预测后续文字，也可能根据示范、偏好或可验证结果改善回答。它由此学到的，是在这些训练条件下更好地生成和解决任务。企业要求的“使用此刻有效的库存作出承诺”，还包含当前事实与业务授权；这些信息如果没有进入本次任务，生成过程就没有取得它们的依据。\u003c/p>\n\u003cp>因此，训练目标与企业目标之间有距离。一个合理的回答，可能没有使用有效库存；一份连贯的分析，可能遗漏决定性条件；正确的操作计划，也可能在执行时失败。企业关心的是承诺能否兑现、结果能否追溯，必须在模型外安排事实取得、规则校验和执行确认。\u003c/p>\n\u003cp>这种差距解释了一个常见现象：展示时令人印象深刻，进入日常流程后仍有大量工作。展示通常证明“有能力做出一次”；经营需要知道“哪些任务能够稳定做、失败怎样处理、总成本多少”。两种问题所需的证据不同。\u003c/p>\n\u003ch2>这一轮发展同时改变了四个变量\u003c/h2>\n\u003cp>\u003cstrong>覆盖范围扩大。\u003c/strong> 通用语言与多模态能力，使非标准材料也能成为处理对象。机会不仅在已经填好的表格中，也在邮件、图片、说明和经验判断中。\u003c/p>\n\u003cp>\u003cstrong>复杂任务的组织方式变化。\u003c/strong> 一个任务可以被拆成查资料、比较、计算、生成和核对，由模型与程序交替完成。允许使用更多计算、工具或更好的任务设计，可能提高结果质量，同时增加费用和等待。复杂度的上限，需要在实际工作中验证。\u003c/p>\n\u003cp>\u003cstrong>软件供给方式变化。\u003c/strong> AI编程使一部分定制功能更容易制作，企业可以更早看到能操作的原型。业务提出问题、团队尝试实现、使用者反馈之间的周期可能缩短；运行维护、权限和集成仍有自己的成本。\u003c/p>\n\u003cp>\u003cstrong>经济上的可行范围变化。\u003c/strong> 当一部分认知工作的处理成本下降，以前因单笔金额小、需求分散、表达不标准而被放弃的任务，可能值得重新评估。真正要比较的是“取得合格结果的全部成本”，包括核对、返工、系统与维护。\u003c/p>\n\u003cp>这四个变量相互影响。例如，更容易制作的软件，可以把模型接到业务数据旁；更丰富的数据，又可能使模型在该任务上更有用。因此，企业面对的变化超出了给现有员工增加一个聊天窗口。\u003c/p>\n\u003ch2>用一类询价判断影响落在哪里\u003c/h2>\n\u003cp>设想一家工业服务企业，收到客户的文字、铭牌照片和旧采购记录。过去人工把它们整理成技术人员可判断的需求单。AI有可能更快地提取型号候选、工况和缺项。\u003c/p>\n\u003cp>这项能力至少可以沿三条路径影响企业：相同询价量下减少准备工时；相同人员下处理更多询价；以更低成本服务原来不愿承接的小客户。三条路径需要不同条件。第一条要确认核对和返工没有吞掉节省；第二条要确认技术确认及履约还有容量；第三条要确认这些客户愿意购买、交付成本可以覆盖。\u003c/p>\n\u003cp>一个技术效果，由此产生三个经营假设。企业应先选择想检验的假设，再组织实施。否则，团队很容易一边报告节省时间，另一边期待收入增长，中间没有共同的价值逻辑。\u003c/p>\n\u003ch2>发展速度快，企业怎样保持判断\u003c/h2>\n\u003cp>模型和工具会更新，今天困难的任务以后可能变容易，已经改善的任务也可能因输入变化再次失败。课程不把某个品牌或能力排名当长 ，企业面对的变化超出了给现有员工增加一个聊天窗口。\n\n## 用一类询价判断影响落在哪里\n\n设想一家工业服务企业，收到客户的文字、铭牌照片和旧采购记录。过去人工把它们整理成技术人员可判断的需求单。AI有可能更快地提取型号候选、工况和缺项。\n\n这项能力至少可以沿三条路径影响企业：相同询价量下减少准备工时；相同人员下处理更多询价；以更低成本服务原来不愿承接的小客户。三条路径需要不同条件。第一条要确认核对和返工没有吞掉节省；第二条要确认技术确认及履约还有容量；第三条要确认这些客户愿意购买、交付成本可以覆盖。\n\n一个技术效果，由此产生三个经营假设。企业应先选择想检验的假设，再组织实施。否则，团队很容易一边报告节省时间，另一边期待收入增长，中间没有共同的价值逻辑。\n\n## 发展速度快，企业怎样保持判断\n\n模型和工具会更新，今天困难的任务以后可能变容易，已经改善的任务也可能因输入变化再次失败。课程不把某个品牌或能力排名当长期前提。\n\n可以持续保留三类记录：本企业的代表任务与合格结果；当前方案的实际错误与完整成本；企业希望扩大或改善的服务。新能力出现时，用同一组任务重新比较，就能判断它改变了哪一条约束。\n\n请先选择一项熟悉的工作，写下它依赖的阅读、判断、制作与执行各是什么，再选出其中最可能变化的一段。把“AI可以帮助报价”改写成“AI可以把非标准需求整理到何种程度，因而使哪个岗位、哪种服务或哪项成本发生变化”。这句话将成为后面分析的起点。\n\n接下来需要理解另一层条件：企业现有的数字化系统，究竟为这种变化准备了什么。\n","exportSingleMd":"# 第1课｜AI 改变了企业的哪些条件\n\n同样一份客户需求，过去可能需要销售整理、技术人员理解、文员录入，才能进入正式流程。现在，通用模型可以承担其中一部分阅读、解释和整理，甚至生成处理这些材料的软件。企业因此获得了新的分工空间。\n\n要判断这种变化的分量，先看能力是怎样供应的。\n\n## 从为一个任务开发，到复用通用能力\n\n企业长期使用规则程序和专用机器学习。前者把已知规则写成明确步骤，例如按价目表计算金额；后者从样本中学习特定模式，例如预测设备故障。二者都可能很有价值，也都要求对目标任务进行相当程度的专门准备。\n\n基础模型带来的变化，是先在广泛材料上训练一种可迁移的能力，再将同一个模型用于多类任务。理解一封邮件、归纳一份报告、比较方案、生成代码，可以共享部分底层能力。具体任务仍要适配，但企业不必每遇到一种文字处理需求，就从零训练一种模型。\n\n这条路径降低了尝试的起点。团队可以先提供一组材料和任务要求，观察是否有帮助，再决定是否建设系统连接。原来只有高频、大规模任务才值得开发的功能，一部分开始进入中小规模业务。\n\n“基础”同时说明其未完成性。模型的广泛能力，尚未包含当前客户是谁、价格哪个版本有效、什么人可以承诺交期。企业专属能力仍需要资料、规则、工具和责任安排。第9课将把这些部分逐一拆开。\n\n## 生成为什么能够承担工作，又为什么会出错\n\n语言模型通过训练调整内部参数，学会处理文字及其关系；运行时，根据当前输入和已经生成的内容，逐步产生后续内容。后训练可以进一步改善遵循要求、解决问题和使用工具的表现。这里发生的是从材料中学习并应用模式，企业仍需用新任务检验其是否真正适用。\n\n能够生成并不只意味着写文章。把“要耐高温、下周停机时换、尽量沿用旧型号”整理成需求条件，本身就是在生成一种新的工作表示。生成计算代码、查询语句和操作计划，也能帮助完成后续任务。模型还可以与图像、声音等输入配合，使原本需要人工转录的现场信息更容易被利用。\n\n训练时，模型可能学习预测后续文字，也可能根据示范、偏好或可验证结果改善回答。它由此学到的，是在这些训练条件下更好地生成和解决任务。企业要求的“使用此刻有效的库存作出承诺”，还包含当前事实与业务授权；这些信息如果没有进入本次任务，生成过程就没有取得它们的依据。\n\n因此，训练目标与企业目标之间有距离。一个合理的回答，可能没有使用有效库存；一份连贯的分析，可能遗漏决定性条件；正确的操作计划，也可能在执行时失败。企业关心的是承诺能否兑现、结果能否追溯，必须在模型外安排事实取得、规则校验和执行确认。\n\n这种差距解释了一个常见现象：展示时令人印象深刻，进入日常流程后仍有大量工作。展示通常证明“有能力做出一次”；经营需要知道“哪些任务能够稳定做、失败怎样处理、总成本多少”。两种问题所需的证据不同。\n\n## 这一轮发展同时改变了四个变量\n\n**覆盖范围扩大。** 通用语言与多模态能力，使非标准材料也能成为处理对象。机会不仅在已经填好的表格中，也在邮件、图片、说明和经验判断中。\n\n**复杂 含当前事实与业务授权；这些信息如果没有进入本次任务，生成过程就没有取得它们的依据。\n\n因此，训练目标与企业目标之间有距离。一个合理的回答，可能没有使用有效库存；一份连贯的分析，可能遗漏决定性条件；正确的操作计划，也可能在执行时失败。企业关心的是承诺能否兑现、结果能否追溯，必须在模型外安排事实取得、规则校验和执行确认。\n\n这种差距解释了一个常见现象：展示时令人印象深刻，进入日常流程后仍有大量工作。展示通常证明“有能力做出一次”；经营需要知道“哪些任务能够稳定做、失败怎样处理、总成本多少”。两种问题所需的证据不同。\n\n## 这一轮发展同时改变了四个变量\n\n**覆盖范围扩大。** 通用语言与多模态能力，使非标准材料也能成为处理对象。机会不仅在已经填好的表格中，也在邮件、图片、说明和经验判断中。\n\n**复杂任务的组织方式变化。** 一个任务可以被拆成查资料、比较、计算、生成和核对，由模型与程序交替完成。允许使用更多计算、工具或更好的任务设计，可能提高结果质量，同时增加费用和等待。复杂度的上限，需要在实际工作中验证。\n\n**软件供给方式变化。** AI编程使一部分定制功能更容易制作，企业可以更早看到能操作的原型。业务提出问题、团队尝试实现、使用者反馈之间的周期可能缩短；运行维护、权限和集成仍有自己的成本。\n\n**经济上的可行范围变化。** 当一部分认知工作的处理成本下降，以前因单笔金额小、需求分散、表达不标准而被放弃的任务，可能值得重新评估。真正要比较的是“取得合格结果的全部成本”，包括核对、返工、系统与维护。\n\n这四个变量相互影响。例如，更容易制作的软件，可以把模型接到业务数据旁；更丰富的数据，又可能使模型在该任务上更有用。因此，企业面对的变化超出了给现有员工增加一个聊天窗口。\n\n## 用一类询价判断影响落在哪里\n\n设想一家工业服务企业，收到客户的文字、铭牌照片和旧采购记录。过去人工把它们整理成技术人员可判断的需求单。AI有可能更快地提取型号候选、工况和缺项。\n\n这项能力至少可以沿三条路径影响企业：相同询价量下减少准备工时；相同人员下处理更多询价；以更低成本服务原来不愿承接的小客户。三条路径需要不同条件。第一条要确认核对和返工没有吞掉节省；第二条要确认技术确认及履约还有容量；第三条要确认这些客户愿意购买、交付成本可以覆盖。\n\n一个技术效果，由此产生三个经营假设。企业应先选择想检验的假设，再组织实施。否则，团队很容易一边报告节省时间，另一边期待收入增长，中间没有共同的价值逻辑。\n\n## 发展速度快，企业怎样保持判断\n\n模型和工具会更新，今天困难的任务以后可能变容易，已经改善的任务也可能因输入变化再次失败。课程不把某个品牌或能力排名当长期前提。\n\n可以持续保留三类记录：本企业的代表任务与合格结果；当前方案的实际错误与完整成本；企业希望扩大或改善的服务。新能力出现时，用同一组任务重新比较，就能判断它改变了哪一条约束。\n\n请先选择一项熟悉的工作，写下它依赖的阅读、判断、制作与执行各是什么，再选出其中最可能变化的一段。把“AI可以帮助报价”改写成“AI可以把非标准需求整理到何种程度，因而使哪个岗位、哪种服务或哪项成本发生变化”。这句话将成为后面分析的起点。\n\n接下来需要理解另一层条件：企业现有的数字化系统，究竟为这种变化准备了什么。\n"},{"file":"02-数字化与AI怎样连接.md","id":"lesson-02","number":2,"role":"核心课","part":0,"title":"第2课｜数字化与 AI 怎样共同改变企业","md":"# 第2课｜数字化与 AI 怎样共同改变企业\n\n一家企业已经有客户管理、库存和审批系统，员工仍每天在聊天里找信息；另一家只有表格和共享文档，却能稳定处理一类业务。两者的AI起点，很难只用“数字化程度高低”解释。\n\n更有用的分析，是看企业怎样表示事实、传递工作和作出决定。\n\n## 数字化先把什么变得可管理\n\n把纸张扫描成文件，改变了信息的载体。给客户、产品和订单建立记录，改变了信息的组织方式。再把接单、审批、库存与交付连起来，改变了工作的协调方式。数字技术还可以进一步改变服务渠道、产品和商业模式。\n\n这些变化常被统称为数字化转型。中文业务语境中的用法不完全一致，因此讨论项目时，应直接说清究竟改变了什么：是资料能搜索了，订单可以追踪了，还是业务规则和工作方式改变了。\n\n以询价为例，客户说“还是上次那种”。员工必须先确定它对应哪位客户、哪一笔历史记录、哪个产品版本。建立稳定身份和关联，使这种查询可以反复完成。再区分“客户期望周五到货”与“企业已确认周五交货”，组织才能知道该按哪种承诺行动。\n\n软件里的字段和状态，是企业对业务世界的共同表示。表示清楚，下游才能据此继续；表示模糊，系统会更快地传播模糊。\n\n## AI改变了信息进入流程的方式\n\n许多软件要求人先把信息整理成规定格式。AI能够处理一部分未经这种整理的文字和图像，帮助提取条件、发现矛盾、比较记录，也能把系统数据解释成不同岗位能使用的说明。\n\n因此，它可以降低业务现场与正式记录之间的转换成本。销售可以先用自然语言描述客户要求，模型整理出候选需求单，再由有责任的人确认。技术人员也可以先写出判断依据，由系统帮助形成交付给销售的说明。\n\n转换成本下降，并不消除业务含义的决定。客户照片上的旧铭牌、仓库里相近的型号、技术部门批准的替代品，可能长得很像，却承担不同责任。AI可以提出关联候选；哪个关联被企业接受，要有明确依据。\n\n数字系统提供可追踪的事实与控制，AI扩大了可以被解释和处理的信息范围。二者互相补充，也会共同参与业务设计。现代数字化本来就可能包含AI，课程将它们分开讨论，是为了看清各自承担的工作。\n\n## 跟踪一条信息怎样成为承诺\n\n教学案例中，客户提出：“替换原设备，工作温度约180℃，希望周五到。”照片显示型号可能为M40。目录里有M40和M40-H，前者资料标明最高150℃，后者标明最高200℃。\n\n模型可以整理出“温度180℃、候选M40-H、希望周五到”，并标出照片识别存在不确定性。这是供确认的解释结果。技术人员还要确认工况适配，库存系统要返回当前可用量，供应或排程负责人要确认交付条件。授权人员据此批准后，企业才形成可以对外采用的报价和交期。\n\n这条链上，信息经历了几个不同变化：原话被解释，候选被检验，当前资源被查询，承诺由负责人作出。若把这些变化合成一句“AI识别后自动报价”，关键责任就消失了。\n\n同样，库存查询返回了数量，也不意味着货已为这笔询价保留。如果另一个订单可以同时占用库存，提交承诺前还需重新检查或执行约定的预留。控制发生在能够维护业务记录的系统中，不能靠模型记住一次查询来保证。\n\n## 数据问题为什么经常变成组织问题\n\n“资料没有整理好”可能包含四种不同问题：信息根本没有记录；记录存在但找不到；两处记录互相矛盾；记录正确却没有人有权确认采用。四者对应的处理方法不同。\n\n第一种要改变采集；第二种要改善身份、目录与连接；第三种要确定有效版本和维护责任；第四种要调整权责与流程。如果一律通过增加知识库处理，可能只是把矛盾装进一个更容易搜索的地方。\n\nAI还可能放大这种问题。一处错误的产品适配说明，一旦被多个助手共同引用，就会重复进入报价。错误从“某人记错了”变成“多个流程一致地采用错误规则”。因此，资料的来源、适用范围和失效条件会更重要。\n\n## 基础不齐，怎样开始\n\n企业可以围绕一条明确业务链补足必要条件。假如先做非标询价辅助，就先明确有效产品资料、询价身份、技术确认与库存查询入口，不必把整个企业的数据工程都列为前置。\n\n同时要判断依赖是否跨越边界。若报价必须引用三套互不相认的客户身份，且无法可靠核对，身份问题就是当前试点的组成部分。若某份历史附件与本轮任务无关，可以留到以后。边界由业务结果和错误后果决定。\n\n在自己的业务里，挑出一句常见但容易误解的话，追踪它最后进入哪个正式记录、谁确认、谁据此行动。你若能指出这条路径，便已经找到AI最可能接入的位置，以及必须补足的基础。\n\n下一课把这条工作路径放回经营结果，解释局部加速为何有时有效、有时没有变化。\n","html":"\u003ch1>第2课｜数字化与 AI 怎样共同改变企业\u003c/h1>\n\u003cp>一家企业已经有客户管理、库存和审批系统，员工仍每天在聊天里找信息；另一家只有表格和共享文档，却能稳定处理一类业务。两者的AI起点，很难只用“数字化程度高低”解释。\u003c/p>\n\u003cp>更有用的分析，是看企业怎样表示事实、传递工作和作出决定。\u003c/p>\n\u003ch2>数字化先把什么变得可管理\u003c/h2>\n\u003cp>把纸张扫描成文件，改变了信息的载体。给客户、产品和订单建立记录，改变了信息的组织方式。再把接单、审批、库存与交付连起来，改变了工作的协调方式。数字技术还可以进一步改变服务渠道、产品和商业模式。\u003c/p>\n\u003cp>这些变化常被统称为数字化转型。中文业务语境中的用法不完全一致，因此讨论项目时，应直接说清究竟改变了什么：是资料能搜索了，订单可以追踪了，还是业务规则和工作方式改变了。\u003c/p>\n\u003cp>以询价为例，客户说“还是上次那种”。员工必须先确定它对应哪位客户、哪一笔历史记录、哪个产品版本。建立稳定身份和关联，使这种查询可以反复完成。再区分“客户期望周五到货”与“企业已确认周五交货”，组织才能知道该按哪种承诺行动。\u003c/p>\n\u003cp>软件里的字段和状态，是企业对业务世界的共同表示。表示清楚，下游才能据此继续；表示模糊，系统会更快地传播模糊。\u003c/p>\n\u003ch2>AI改变了信息进入流程的方式\u003c/h2>\n\u003cp>许多软件要求人先把信息整理成规定格式。AI能够处理一部分未经这种整理的文字和图像，帮助提取条件、发现矛盾、比较记录，也能把系统数据解释成不同岗位能使用的说明。\u003c/p>\n\u003cp>因此，它可以降低业务现场与正式记录之间的转换成本。销售可以先用自然语言描述客户要求，模型整理出候选需求单，再由有责任的人确认。技术人员也可以先写出判断依据，由系统帮助形成交付给销售的说明。\u003c/p>\n\u003cp>转换成本下降，并不消除业务含义的决定。客户照片上的旧铭牌、仓库里相近的型号、技术部门批准的替代品，可能长得很像，却承担不同责任。AI可以提出关联候选；哪个关联被企业接受，要有明确依据。\u003c/p>\n\u003cp>数字系统提供可追踪的事实与控制，AI扩大了可以被解释和处理的信息范围。二者互相补充，也会共同参与业务设计。现代数字化本来就可能包含AI，课程将它们分开讨论，是为了看清各自承担的工作。\u003c/p>\n\u003ch2>跟踪一条信息怎样成为承诺\u003c/h2>\n\u003cp>教学案例中，客户提出：“替换原设备，工作温度约180℃，希望周五到。”照片显示型号可能为M40。目录里有M40和M40-H，前者资料标明最高150℃，后者标明最高200℃。\u003c/p>\n\u003cp>模型可以整理出“温度180℃、候选M40-H、希望周五到”，并标出照片识别存在不确定性。这是供确认的解释结果。技术人员还要确认工况适配，库存系统要返回当前可用量，供应或排程负责人要确认交付条件。授权人员据此批准后，企业才形成可以对外采用的报价和交期。\u003c/p>\n\u003cp>这条链上，信息经历了几个不同变化：原话被解释，候选被检验，当前资源被查询，承诺由负责人作出。若把这些变化合成一句“AI识别后自动报价”，关键责任就消失了。\u003c/p>\n\u003cp>同样，库存查询返回了数量，也不意味着货已为这笔询价保留。如果另一个订单可以同时占用库存，提交承诺前还需重新检查或执行约定的预留。控制发生在能够维护业务记录的系统中，不能靠模型记住一次查询来保证。\u003c/p>\n\u003ch2>数据问题为什么经常变成组织问题\u003c/h2>\n\u003cp>“资料没有整理好”可能包含四种不同问题：信息根本没有记录；记录存在但找不到；两处记录互相矛盾；记录正确却没有人有权确认采用。四者对应的处理方法不同。\u003c/p>\n\u003cp>第一种要改变采集；第二种要改善身份、目录与连接；第三种要确定有效版本和维护责任；第四种要调整权责与流程。如果一律通过增加知识库处理，可能只是把矛盾装进一个更容易搜索的地方。\u003c/p>\n\u003cp>AI还可能放大这种问题。一处错误的产品适配说明，一旦被多个助手共同引用，就会重复进入报价。错误从“某人记错了”变成“多个流程一致地采用错误规则”。因此，资料的来源、适用范围和失效条件会更重要。\u003c/p>\n\u003ch2>基础不齐，怎样开始\u003c/h2>\n\u003cp>企业可以围绕一条明确业务链补足必要条件。假如先做非标询价辅助，就先明确有效产品资料、询价身份、技术确认与库存查询入口，不必把整个企业的数据工程都列为前置。\u003c/p>\n\u003cp>同时要判断依赖是否跨越边界。若报价必须引用三套互不相认的客户身份，且无法可靠核对，身份问题就是当前试点的组成部分。若某份历史附件与本轮任务无关，可以留到以后。边界由业务结果和错误后果决定。\u003c/p>\n\u003cp>在自己的业务里，挑出一句常见但容易误解的话，追踪它最后进入哪个正式记录、谁确认、谁据此行动。你若能指出这条路径，便已经找到AI最可能接入的位置，以及必须补足的基础。\u003c/p>\n\u003cp>下一课把这条工作路径放回经营结果，解释局部加速为何有时有效、有时没有变化。\u003c/p>\n","exportMd":"# 第2课｜数字化与 AI 怎样共同改变企业\n\n一家企业已经有客户管理、库存和审批系统，员工仍每天在聊天里找信息；另一家只有表格和共享文档，却能稳定处理一类业务。两者的AI起点，很难只用“数字化程度高低”解释。\n\n更有用的分析，是看企业怎样表示事实、传递工作和作出决定。\n\n## 数字化先把什么变得可管理\n\n把纸张扫描成文件，改变了信息的载体。给客户、产品和订单建立记录，改变了信息的组织方式。再把接单、审批、库存与交付连起来，改变了工作的协调方式。数字技术还可以进一步改变服务渠道、产品和商业模式。\n\n这些变化常被统称为数字化转型。中文业务语境中的用法不完全一致，因此讨论项目时，应直接说清究竟改变了什么：是资料能搜索了，订单可以追踪了，还是业务规则和工作方式改变了。\n\n以询价为例，客户说“还是上次那种”。员工必须先确定它对应哪位客户、哪一笔历史记录、哪个产品版本。建立稳定身份和关联，使这种查询可以反复完成。再区分“客户期望周五到货”与“企业已确认周五交货”，组织才能知道该按哪种承诺行动。\n\n软件里的字段和状态，是企业对业务世界的共同表示。表示清楚，下游才能据此继续；表示模糊，系统会更快地传播模糊。\n\n## AI改变了信息进入流程的方式\n\n许多软件要求人先把信息整理成规定格式。AI能够处理一部分未经这种整理的文字和图像，帮助提取条件、发现矛盾、比较记录，也能把系统数据解释成不同岗位能使用的说明。\n\n因此，它可以降低业务现场与正式记录之间的转换成本。销售可以先用自然语言描述客户要求，模型整理出候选需求单，再由有责任的人确认。技术人员也可以先写出判断依据，由系统帮助形成交付给销售的说明。\n\n转换成本下降，并不消除业务含义的决定。客户照片上的旧铭牌、仓库里相近的型号、技术部门批准的替代品，可能长得很像，却承担不同责任。AI可以提出关联候选；哪个关联被企业接受，要有明确依据。\n\n数字系统提供可追踪的事实与控制，AI扩大了可以被解释和处理的信息范围。二者互相补充，也会共同参与业务设计。现代数字化本来就可能包含AI，课程将它们分开讨论，是为了看清各自承担的工作。\n\n## 跟踪一条信息怎样成为承诺\n\n教学案例中，客户提出：“替换原设备，工作温度约180℃，希望周五到。”照片显示型号可能为M40。目录里有M40和M40-H，前者资料标明最高150℃，后者标明最高200℃。\n\n模型可以整理出“温度180℃、候选M40-H、希望周五到”，并标出照片识别存在不确定性。这是供确认的解释结果。技术人员还要确认工况适配，库存系统要返回当前可用量，供应或排程负责人要确认交付条件。授权人员据此批准后，企业才形成可以对外采用的报价和交期。\n\n这条链上，信息经历了几个不同变化：原话被解释，候选被检验，当前资源被查询，承诺由负责人作出。若把这些变化合成一句“AI识别后自动报价”，关键责任就消失了。\n\n同样，库存查询返回了数量，也不意味着货已为这笔询价保留。如果另一个订单可以同时占用库存，提交承诺前还需重新检查或执行约定的预留。控制发生在能够维护业务记录的系统中，不能靠模型记住一次查询来保证。\n\n## 数据问题为什么经常变成组织问题\n\n“资料没有整理好”可能包含四种不同问题：信息根本没有记录；记录存在但找不到；两处记录互相矛盾；记录正确却没有人有权确认采用。四者对应的处理方法不同。\n\n第一种要改变采集；第二种要改善身份、目录与连接；第三种要确定有效版本和维护责任；第四种要调整权责与流程。如果一律通过增加知识库处理，可能只是把矛盾装进一个更容易搜索的地方。\n\nAI还可能放大这种问题。一处错误的产品适配说明，一旦被多个助手共同引用，就会重复进入报价。错误从“某人记错了”变成“多个流程一致地采用错误规则”。因此，资料的来源、适用范围和失效条件会更重要。\n\n## 基础不齐，怎样开始\n\n企业可以围绕一条明确业务链补足必要条件。假如先做非标询价辅助，就先明确有效产品资料、询价身份、技术确认与库存查询入口，不必把整个企业的数据工程都列为前置。\n\n同时要判断依赖是否跨越边界。若报价必须引用三套互不相认的客户身份，且无法可靠核对，身份问题就是当前试点的组成部分。若某份历史附件与本轮任务无关，可以留到以后。边界由业务结果和错误后果决定。\n\n在自己的业务里，挑出一句常见但容易误解的话，追踪它最后进入哪个正式记录、谁确认、谁据此行动。你若能指出这条路径，便已经找到AI最可能接入的位置，以及必须补足的基础。\n\n下一课把这条工作路径放回经营结果，解释局部加速为何有时有效、有时没有变化。\n","exportSingleMd":"# 第2课｜数字化与 AI 怎样共同改变企业\n\n一家企业已经有客户管理、库存和审批系统，员工仍每天在聊天里找信息；另一家只有表格和共享文档，却能稳定处理一类业务。两者的AI起点，很难只用“数字化程度高低”解释。\n\n更有用的分析，是看企业怎样表示事实、传递工作和作出决定。\n\n## 数字化先把什么变得可管理\n\n把纸张扫描成文件，改变了信息的载体。给客户、 怎样，例如需求字段是否完整。工作结果描述团队实际完成任务的情况，例如从收到材料到形成可用报价用了多久。经营结果描述这些变化对成本、成交、交付和客户关系的影响。\n\n三者之间存在因果路径，但每一段都有条件。字段更完整，只有在减少追问或技术退回时，才可能缩短报价周期；报价更快，只有在速度影响客户选择、且能够履约时，才可能增加有质量的订单。\n\n项目设计应把预期路径写出来。否则，技术团队优化字段正确率，业务团队等待成交增长，双方可能都认真工作，却没有验证同一个假设。\n\n## 瓶颈决定局部加速的价值\n\n下面是一组为说明机制而设的教学容量：每天需求整理最多处理80件，技术确认30件，报价发布50件。假设每件都要依次经过三段，需求足够、任务相似且没有其他限制，长期完成量受技术确认的30件约束。\n\nAI把整理容量提升到200件，其他条件不变，整条链仍最多完成30件。若团队继续把更多需求推进去，待确认队列还可能增长。此时，整理加速的价值可能体现为减少准备工时，但不能据此声称新增170件业务能力。\n\n换一个改法：AI整理时先检查必要条件，减少技术人员处理缺项、查找附件和退回材料的时间。如果技术确认的有效容量因此从30件提高到40件，整条链才有可能达到40件。是否真的提高，需要记录该岗位的工作变化与实际完成量。\n\n这里的关键是专业人员每小时能完成多少有效判断。单纯增加提交量，与提高有效判断能力，产生的结果不同。\n\n## 省下的时间要有去向\n\n固定薪酬团队每月节省100小时，首先得到的是可重新安排的时间。若人员编制、加班和外包支出均未改变，现金成本未必立即减少。时间可以被用于处理积压、扩大服务、改善质量，也可能被新的协调工作消耗。\n\n要把它算成经营收益，需要继续证明：减少了哪一项实际支出，避免了什么损失，或者支持了哪些新增业务。新增业务还需要需求、成交与交付容量。第13课会用完整账目展开。\n\n这也解释了岗位差异。同一工具对新员工可能帮助很大，对熟练人员可能只减少少量操作，还增加核对。2025年发表于QJE的客服研究使用5,172名客服人员的数据，以每小时解决的问题数衡量生产率，平均改善为15%，不同经验水平的效果存在明显差异。这是特定辅助系统与工作环境中的发现，企业不能直接把15%放进自己的预算。\n\n另一个方向的证据来自METR：在2025年初工具条件下，16名熟悉自身开源项目的开发者完成246项任务，允许使用AI时完成时间平均增加19%。2026年的后续研究又指出，参与和任务选择变化使新的提效估计难以可靠解释。企业应从这些研究中学会检查任务、人员、工具和测量条件，持续更新本地证据。\n\n## 为什么还要投入流程和组织\n\n一种技术可以广泛复用，但每家企业仍要学习怎样使用。有效资料、任务划分、评测样本、培训和协作规则，都是让技术发挥作用的互补投入。其中许多形成了长期可用的资产，却在当期表现为时间和费用。\n\n生产率J曲线研究讨论了通用技术与无形资产投入，以及这些投入如何影响宏观生产率的测量。它提醒我们：技术设备之外还存在重要投入。把这一认识用于企业项目时，需要另外记录实际现金流、形成的资产和可观察收益，不能推导某个项目将来必然回本。\n\n例如，团队花两周整理产品适配条件，如果形成了有维护责任、能在下一轮复用的规则，投入可能同时服务多个流程。若两周结束后只有一份无人维护的文档，未来价值仍未建立。投入的时间相同，资产质量不同。\n\n## 把因果链写成可检验的提案\n\n一份有用的表述可以是：“目前技术确认每天30件，其中相当一部分时间用于追问缺项。先验证AI能否在进入技术队列前发现缺项，减少技术退回。在技术判断质量保持的条件下，看有效确认量是否上升。”\n\n这段话包含了当前约束、作用机制、前导变化和最终观察。它也允许出现相反结果：缺项改善了，但确认量没有上升，可能说明追问并非主要瓶颈；确认量上升了，但错误承诺增多，则质量条件被破坏。\n\n请用一项真实改进写出同样的因果链，并标出你最没有证据的一段。下一阶段应优先取得能够判断这一段的资料。\n\n当价值路径变得清楚，还要看企业能否在竞争中保留这份价值。下一课讨论这个更外层的问题。\n","html":"\u003ch1>第3课｜任务提效怎样转化为经营改善\u003c/h1>\n\u003cp>项目报告称询价整理速度提高了一倍，企业的交付速度和利润却没有变化。这并不构成逻辑矛盾：整理只是整条业务链中的一段，企业收益还取决于其他环节和被释放资源的去向。\u003c/p>\n\u003cp>理解这条转换关系，才能确定应该测什么，以及下一笔投入放在哪里。\u003c/p>\n\u003ch2>先分清三种结果\u003c/h2>\n\u003cp>模型结果描 。下一阶段应优先取得能够判断这一段的资料。\u003c/p>\n\u003cp>当价值路径变得清楚，还要看企业能否在竞争中保留这份价值。下一课讨论这个更外层的问题。\u003c/p>\n","exportMd":"# 第3课｜任务提效怎样转化为经营改善\n\n项目报告称询价整理速度提高了一倍，企业的交付速度和利润却没有变化。这并不构成逻辑矛盾：整理只是整条业务链中的一段，企业收益还取决于其他环节和被释放资源的去向。\n\n理解这条转换关系，才能确定应该测什么，以及下一笔投入放在哪里。\n\n## 先分清三种结果\n\n模型结果描述它在给定任务上做得怎样，例如需求字段是否完整。工作结果描述团队实际完成任务的情况，例如从收到材料到形成可用报价用了多久。经营结果描述这些变化对成本、成交、交付和客户关系的影响。\n\n三者之间存在因果路径，但每一段都有条件。字段更完整，只有在减少追问或技术退回时，才可能缩短报价周期；报价更快，只有在速度影响客户选择、且能够履约时，才可能增加有质量的订单。\n\n项目设计应把预期路径写出来。否则，技术团队优化字段正确率，业务团队等待成交增长，双方可能都认真工作，却没有验证同一个假设。\n\n## 瓶颈决定局部加速的价值\n\n下面是一组为说明机制而设的教学容量：每天需求整理最多处理80件，技术确认30件，报价发布50件。假设每件都要依次经过三段，需求足够、任务相似且没有其他限制，长期完成量受技术确认的30件约束。\n\nAI把整理容量提升到200件，其他条件不变，整条链仍最多完成30件。若团队继续把更多需求推进去，待确认队列还可能增长。此时，整理加速的价值可能体现为减少准备工时，但不能据此声称新增170件业务能力。\n\n换一个改法：AI整理时先检查必要条件，减少技术人员处理缺项、查找附件和退回材料的时间。如果技术确认的有效容量因此从30件提高到40件，整条链才有可能达到40件。是否真的提高，需要记录该岗位的工作变化与实际完成量。\n\n这里的关键是专业人员每小时能完成多少有效判断。单纯增加提交量，与提高有效判断能力，产生的结果不同。\n\n## 省下的时间要有去向\n\n固定薪酬团队每月节省100小时，首先得到的是可重新安排的时间。若人员编制、加班和外包支出均未改变，现金成本未必立即减少。时间可以被用于处理积压、扩大服务、改善质量，也可能被新的协调工作消耗。\n\n要把它算成经营收益，需要继续证明：减少了哪一项实际支出，避免了什么损失，或者支持了哪些新增业务。新增业务还需要需求、成交与交付容量。第13课会用完整账目展开。\n\n这也解释了岗位差异。同一工具对新员工可能帮助很大，对熟练人员可能只减少少量操作，还增加核对。2025年发表于QJE的客服研究使用5,172名客服人员的数据，以每小时解决的问题数衡量生产率，平均改善为15%，不同经验水平的效果存在明显差异。这是特定辅助系统与工作环境中的发现，企业不能直接把15%放进自己的预算。\n\n另一个方向的证据来自METR：在2025年初工具条件下，16名熟悉自身开源项目的开发者完成246项任务，允许使用AI时完成时间平均增加19%。2026年的后续研究又指出，参与和任务选择变化使新的提效估计难以可靠解释。企业应从这些研究中学会检查任务、人员、工具和测量条件，持续更新本地证据。\n\n## 为什么还要投入流程和组织\n\n一种技术可以广泛复用，但每家企业仍要学习怎样使用。有效资料、任务划分、评测样本、培训和协作规则，都是让技术发挥作用的互补投入。其中许多形成了长期可用的资产，却在当期表现为时间和费用。\n\n生产率J曲线研究讨论了通用技术与无形资产投入，以及这些投入如何影响宏观生产率的测量。它提醒我们：技术设备之外还存在重要投入。把这一认识用于企业项目时，需要另外记录实际现金流、形成的资产和可观察收益，不能推导某个项目将来必然回本。\n\n例如，团队花两周整理产品适配条件，如果形成了有维护责任、能在下一轮复用的规则，投入可能同时服务多个流程。若两周结束后只有一份无人维护的文档，未来价值仍未建立。投入的时间相同，资产质量不同。\n\n## 把因果链写成可检验的提案\n\n一份有用的表述可以是：“目前技术确认每天30件，其中相当一部分时间用于追问缺项。先验证AI能否在进入技术队列前发现缺项，减少技术退回。在技术判断质量保持的条件下，看有效确认量是否上升。”\n\n这段话包含了当前约束、作用机制、前导变化和最终观察。它也允许出现相反结果：缺项改善了，但确认量没有上升，可能说明追问并非主要瓶颈；确认量上升了，但错误承诺增多，则质量条件被破坏。\n\n请用一项真实改进写出同样的因果链，并标出你最没有证据的一段。下一阶段应优先取得能够判断这一段的资料。\n\n当价值路径变得清楚，还要看企业能否在竞争中保留这份价值。下一课讨论这个更外层的问题。\n","exportSingleMd":"# 第3课｜任务提效怎样转化为经营改善\n\n项目报告称询价整理速度提高了一倍，企业的交付速度和利润却没有变化。这并不构成逻辑矛盾：整理只是整条业务链中的一段，企业收益还取决于其他环节和被释放资源的去向。\n\n理解这条转换关系，才能确定应该测什么，以及下一笔投入放在哪里。\n\n## 先分清三种结果\n\n模型结果描述它在给定任务上做得怎样，例如需求字段是否完整。工作结果描述团队实际完成任务的情况，例如从收到材料到形成可用报价用了多久。经营结果描述这些变化对成本、成交、交付和客户关系的影响。\n\n三者之间存在因果路径，但每一段都有条件。字段更完整，只有在减少追问或技术退回时，才可能缩短报价周期；报价更快，只有在速度影响客户选择、且能够履约时，才可能增加有质量的订单。\n\n项目设计应把预期路径写出来。否则，技术团队优化字段正确率，业务团队等待成交增长，双方可能都认真工作，却没有验证同一个假设。\n\n## 瓶颈决定局部加速的价值\n\n下面是一组为说明机制而设的教学容量：每天需求整理最多处理80件，技术确认30件，报价发布50件。假设每件都要依次经过三段，需求足够、任务相似且没有其他限制，长期完成量受技术确认的30件约束。\n\nAI把整理容量提升到200件，其他条件不变，整条链仍最多完成30件。若团队继续把更多需求推进去，待确认队列还可能增长。此时，整理加速的价值可能体现为减少准备工时，但不能据此声称新增170件业务能力。\n\n换一个改法：AI整理时先检查必要条件，减少技术人员处理缺项、查找附件和退回材料的时间。如果技术确认的有效容量因此从30件提高到40件，整条链才有可能达到40件。是否真的提高，需要记录该岗位的工作变化与实际完成量。\n\n这里的关键是专业人员每小时能完成多少有效判断。单纯增加提交量，与提高有效判断能力，产生的结果不同。\n\n## 省下的时间要有去向\n\n固定薪酬团队每月节省100小时，首先得到的是可重新安排的时间。若人员编制、加班和外包支出均未改变，现金成本未必立即减少。时间可以被用于处理积压、扩大服务、改善质量，也可能被新的协调工作消耗。\n\n要把它算成经营收益，需要继续证明：减少了哪一项实际支出，避免了什么损失，或者支持了哪些新增业务。新增业务还需要需求、成交与交付容量。第13课会用完整账目展开。\n\n这也解释了岗位差异。同一工具对新员工可能帮助很大，对熟练人员可能只减少少量操作，还增加核对。2025年发表于QJE的客服研究使用5,172名客服人员的数据，以每小时解决的问题数衡量生产率，平均改善为15%，不同经验水平的效果存在明显差异。这是特定辅助系统与工作环境中的发现，企业不能直接把15%放进自己的预算。\n\n另一个方向的证据来自METR：在2025年初工具条件下，16名熟悉自身开源项目的开发者完成246项任务，允许使用AI时完成时间平均增加19%。2026年的后续研究又指出，参与和任务选择变化使新的提效估计难以可靠解释。企业应从这些研究中学会检查任务、人员、工具和测量条件，持续更新本地证据。\n\n## 为什么还要投入流程和组织\n\n一种技术可以广泛复用，但每家企业仍要学习怎样使用。有效资料、任务划分、评测样本、培训和协作规则，都是让技术发挥作用的互补投入。其中许多形成了长期可用的资产，却在当期表现为时间和费用。\n\n生产率J曲线研究讨论了通用技术与无形资产投入，以及这些投入如何影响宏观生产率的测量。它提醒我们：技术设备之外还存在重要投入。把这一认识用于企业项目时，需要另外记录实际现金流、形成的资产和可观察收益，不能推导某个项目将来必然回本。\n\n例如，团队花两周整理产品适配条件，如果形成了有维护责任、能在下一轮复用的规则，投入可能同时服务多个流程。若两周结束后只有一份无人维护的文档，未来价值仍未建立。投入的时间相同，资产质量不同。\n\n## 把因果链写成可检验的提案\n\n一份有用的表述可以是：“目前技术确认每天30件，其中相当一部分时间用于追问缺项。先验证AI能否在进入技术队列前发现缺项，减少技术退回。在技术判断质量保持的条件下，看有效确认量是否上升。”\n\n这段话包含了当前约束、作用机制、前导变化和最终观察。它也允许出现相反结果：缺项改善了，但确认量没有上升，可能说明追问并非主要瓶颈；确认量上升了，但错误承诺增多，则质量条件被破坏。\n\n请用一项真实改进写出同样的因果链，并标出你最没有证据的一段。下一阶段应优先取得能够判断这一段的资料。\n\n当价值路径变得清楚，还要看企业能否在竞争中保留这份价值。下一课讨论这个更外层的问题。\n","text 心课","part":0,"title":"第4课｜AI 怎样影响竞争和商业模式","md":"# 第4课｜AI 怎样影响竞争和商业模式\n\n当多家公司都能更便宜地制作报告，行业未必同时获得更高利润。客户可能要求降价，也可能期待更快、更个性化的服务。技术创造了价值，企业还需要决定以什么方式把价值留在自己的经营中。\n\n## 先区分创造价值和获得收益\n\n创造价值，是客户得到更好的结果，或企业付出更少资源。获得收益，是企业能够通过价格、销量、留存或成本变化，保留其中一部分。\n\n假设一家专业服务公司过去每份分析报告需要8小时。AI辅助后，达到同样标准需要5小时。如果客户仍愿意按原价格采购，且公司能接到更多业务，释放的时间可能扩大收入。如果竞争使价格随工时下降，收益会部分转给客户。如果所有人员都满负荷做核对，名义上的生成速度也未必形成优势。\n\n因此，技术规划要和市场选择一起做。企业究竟希望更便宜、更快、更深入，还是服务原来无法覆盖的需求？这些选择决定流程、质量和投入重点。\n\n## 收费和服务承诺也会随之改变\n\n继续看报告服务，使用一组教学假设：原来一份合格报告用8小时，每小时收费600元、按投入工时分摊的人员成本300元，收入4,800元，分摊人员成本2,400元。这里假设两种做法的其他成本相同，先只比较服务计价机制，暂未计入AI新增费用；完整采用账在第13课展开。改造后同样标准用5小时；继续按小时收费，收入降为3,000元，分摊人员成本降为1,500元。同一份业务节约了时间，收入减去分摊人员成本的余额却从2,400元降为1,500元。是否能靠新增业务补回，还要另看需求和可用容量。\n\n企业也可以尝试按明确交付范围收费。例如每期4,800元，约定主题范围、依据材料、交付时间、一次复核和专业人员签署。若客户继续接受这个价格，5小时对应的分摊人员成本为1,500元，留下3,300元用于覆盖其他成本与利润。若人员为固定薪酬，以上工时分摊变化不表示公司当月少付同样金额；固定费用需要结合全团队工时、实际支出和新增AI成本另算。客户购买的是可靠交付，因此可能接受固定范围价格；若其只需要简单摘要，竞争也可能迫使价格下降。\n\n这项改变牵涉的不止报价表。企业需要能解释交付标准、估计例外成本，并对超范围需求另行决定。把原来不计时的返工留在固定价格中，可能吞掉毛利。它也不等于承诺客户经营结果：报告交付与客户采取行动后的收益，应分别定义。\n\n## 哪些变化可能影响业务边界\n\n**单位服务成本下降。** 某些原本只给大客户做的整理和分析，可能扩展到更多客户。企业需要验证获客、数据取得、人工复核和售后成本是否仍然过高。\n\n**定制成本下降。** 按客户情境生成说明、方案和软件功能变得更容易，服务可以细分。但每一种变体都需要维护。定制承诺越多，规则和版本管理越重要。\n\n**响应时点提前。** 企业可以更早理解需求、发现风险，甚至在客户提出正式请求前提供建议。价值来自提前采取了有效行动，需要有及时数据和适当授权。\n\n**企业与供应商之间的分工变化。** 某些过去需要外包的工作可以内部完成；某些过去无力建设的能力可以通过通用服务取得。选择自建或采购，要比较长期控制、适配、维护和切换成本。\n\n这些方向可以同时存在，但一个试点最好先检验一条主要路径。小客户服务与重点客户深度服务，对销售、产品和支持的要求可能完全不同。\n\n## 通用能力普及时，什么可能继续稀缺\n\n取得同一种模型通常不难形成长期差异。相对更难复制的，可能是企业对特定客户问题的理解、可合法使用且持续更新的数据、嵌入日常工作的流程、可靠的交付记录，以及客户愿意信任的关系。\n\n这些因素需要组合起来才有意义。积累很多客户文档，如果没有使用权或无法对应到当前问题，其价值有限。有一套工作流，如果没有人在变更时维护，也很快失效。\n\n可以用“第二次服务”检验资产：换一名员工、换一个客户、改变一项条件后，企业是否仍能以更少返工交出合格结果？若优势只存在于某位高手的即时发挥中，组织还没有完整获得这项能力。\n\n## FDE模式也有自己的经济逻辑\n\n通用产品覆盖很多客户，现场实施则发现每家企业的特殊条件。FDE能在两者之间工作：将业务难题翻译成可实现的方案，把共性经验带回产品和方法。\n\n对供应商，这可能扩大产品的可用范围、加快采用并发现新需求。对采购企业，这可能减少试错和协调成本。双方的利益有相交处，也有差异：供应商希望复用自己的平台，企业还要考虑退出、独立运行与跨平台选择。\n\n因此，引入FDE时，值得先问清谁从什么结果获得收益。企业要求的是一套可持续的业务能力，合作方实际承诺的可能是某个平台上的实现。两者可以一致，但需要通过方案和交接条件说明。\n\n## 用两种战略检验同一项能力\n\n工业服务案例中的需求整理能力，可以支持“更快处理现有大客户”，也可以支持“扩大标准化小客户服务”。\n\n前一种战略可能优先降低重点订单的技术往返，并保持定制判断。后一种需要建立产品适用范围、标准价格和例外分流，否则低价业务会占满专业人员。即使采用同一个模型，也会形成不同系统和岗位安排。\n\n请给自己的AI方向写出一句客户价值主张，再补上获得收益的路径。若主张是“更快”，需要说明快在哪个环节、客户为何在意、企业如何兑现。若主张是“更多个性化”，需要说明哪些变体能够承担维护成本。\n\n前四课建立了企业判断的外层框架。下一部分进入实施组织：FDE为何发展起来，企业应怎样使用这种工作方式。\n","html":"\u003ch1>第4课｜AI 怎样影响竞争和商业模式\u003c/h1>\n\u003cp>当多家公司都能更便宜地制作报告，行业未必同时获得更高利润。客户可能要求降价，也可能期待更快、更个性化的服务。技术创造了价值，企业还需要决定以什么方式把价值留在自己的经营中。\u003c/p>\n\u003ch2>先区分创造价值和获得收益\u003c/h2>\n\u003cp>创造价值，是客户得到更好的结果，或企业付出更少资源。获得收益，是企业能够通过价格、销量、留存或成本变化，保留其中一部分。\u003c/p>\n\u003cp>假设一家专业服务公司过去每份分析报告需要8小时。AI辅助后，达到同样标准需要5小时。如果客户仍愿意按原价格采购，且公司能接到更多业务，释放的时间可能扩大收入。如果竞争使价格随工时下降，收益会部分转给客户。如果所有人员都满负荷做核对，名义上的生成速度也未必形成优势。\u003c/p>\n\u003cp>因此，技术规划要和市场选择一起做。企业究竟希望更便宜、更快、更深入，还是服务原来无法覆盖的需求？这些选择决定流程、质量和投入重点。\u003c/p>\n\u003ch2>收费和服务承诺也会随之改变\u003c/h2>\n\u003cp>继续看报告服务，使用一组教学假设：原来一份合格报告用8小时，每小时收费600元、按投入工时分摊的人员成本300元，收入4,800元，分摊人员成本2,400元。这里假设两种做法的其他成本相同，先只比较服务计价机制，暂未计入AI新增费用；完整采用账在第13课展开。改造后同样标准用5小时；继续按小时收费，收入降为3,000元，分摊人员成本降为1,500元。同一份业务节约了时间，收入减去分摊人员成本的余额却从2,400元降为1,500元。是否能靠新增业务补回，还要另看需求和可用容量。\u003c/p>\n\u003cp>企业也可以尝试按明确交付范围收费。例如每期4,800元，约定主题范围、依据材料、交付时间、一次复核和专业人员签署。若客户继续接受这个价格，5小时对应的分摊人员成本为1,500元，留下3,300元用于覆盖其他成本与利润。若人员为固定薪酬，以上工时分摊变化不表示公司当月少付同样金额；固定费用需要结合全团队工时、实际支出和新增AI成本另算。客户购买的是可靠交付，因此可能接受固定范围价格；若其只需要简单摘要，竞争也可能迫使价格下降。\u003c/p>\n\u003cp>这项改变牵涉的不止报价表。企业需要能解释交付标准、估计例外成本，并对超范围需求另行决定。把原来不计时的返工留在固定价格中，可能吞掉毛利。它也不等于承诺客户经营结果：报告交付与客户采取行动后的收益，应分别定义。\u003c/p>\n\u003ch2>哪些变化可能影响业务边界\u003c/h2>\n\u003cp>\u003cstrong>单位服务成本下降。\u003c/strong> 某些原本只给大客户做的整理和分析，可能扩展到更多客户。企业需要验证获客、数据取得、人工复核和售后成本是否仍然过高。\u003c/p>\n\u003cp>\u003cstrong>定制成本下降。\u003c/strong> 按客户情境生成说明、方案和软件功能变得更容易，服务可以细分。但每一种变体都需要维护。定制承诺越多，规则和版本管理越重要。\u003c/p>\n\u003cp>\u003cstrong>响应时点提前。\u003c/strong> 企业可以更早理解需求、发现风险，甚至在客户提出正式请求前提供建议。价值来自提前采取了有效行动，需要有及时数据和适当授权。\u003c/p>\n\u003cp>\u003cstrong>企业与供应商之间的分工变化。\u003c/strong> 某些过去需要外包的工作可以内部完成；某些过去无力建设的能力可以通过通用服务取得。选择自建或采购，要比较长期控制、适配、维护和切换成本。\u003c/p>\n\u003cp>这些方向可以同时存在，但一个试点最好先 其只需要简单摘要，竞争也可能迫使价格下降。\n\n这项改变牵涉的不止报价表。企业需要能解释交付标准、估计例外成本，并对超范围需求另行决定。把原来不计时的返工留在固定价格中，可能吞掉毛利。它也不等于承诺客户经营结果：报告交付与客户采取行动后的收益，应分别定义。\n\n## 哪些变化可能影响业务边界\n\n**单位服务成本下降。** 某些原本只给大客户做的整理和分析，可能扩展到更多客户。企业需要验证获客、数据取得、人工复核和售后成本是否仍然过高。\n\n**定制成本下降。** 按客户情境生成说明、方案和软件功能变得更容易，服务可以细分。但每一种变体都需要维护。定制承诺越多，规则和版本管理越重要。\n\n**响应时点提前。** 企业可以更早理解需求、发现风险，甚至在客户提出正式请求前提供建议。价值来自提前采取了有效行动，需要有及时数据和适当授权。\n\n**企业与供应商之间的分工变化。** 某些过去需要外包的工作可以内部完成；某些过去无力建设的能力可以通过通用服务取得。选择自建或采购，要比较长期控制、适配、维护和切换成本。\n\n这些方向可以同时存在，但一个试点最好先检验一条主要路径。小客户服务与重点客户深度服务，对销售、产品和支持的要求可能完全不同。\n\n## 通用能力普及时，什么可能继续稀缺\n\n取得同一种模型通常不难形成长期差异。相对更难复制的，可能是企业对特定客户问题的理解、可合法使用且持续更新的数据、嵌入日常工作的流程、可靠的交付记录，以及客户愿意信任的关系。\n\n这些因素需要组合起来才有意义。积累很多客户文档，如果没有使用权或无法对应到当前问题，其价值有限。有一套工作流，如果没有人在变更时维护，也很快失效。\n\n可以用“第二次服务”检验资产：换一名员工、换一个客户、改变一项条件后，企业是否仍能以更少返工交出合格结果？若优势只存在于某位高手的即时发挥中，组织还没有完整获得这项能力。\n\n## FDE模式也有自己的经济逻辑\n\n通用产品覆盖很多客户，现场实施则发现每家企业的特殊条件。FDE能在两者之间工作：将业务难题翻译成可实现的方案，把共性经验带回产品和方法。\n\n对供应商，这可能扩大产品的可用范围、加快采用并发现新需求。对采购企业，这可能减少试错和协调成本。双方的利益有相交处，也有差异：供应商希望复用自己的平台，企业还要考虑退出、独立运行与跨平台选择。\n\n因此，引入FDE时，值得先问清谁从什么结果获得收益。企业要求的是一套可持续的业务能力，合作方实际承诺的可能是某个平台上的实现。两者可以一致，但需要通过方案和交接条件说明。\n\n## 用两种战略检验同一项能力\n\n工业服务案例中的需求整理能力，可以支持“更快处理现有大客户”，也可以支持“扩大标准化小客户服务”。\n\n前一种战略可能优先降低重点订单的技术往返，并保持定制判断。后一种需要建立产品适用范围、标准价格和例外分流，否则低价业务会占满专业人员。即使采用同一个模型，也会形成不同系统和岗位安排。\n\n请给自己的AI方向写出一句客户价值主张，再补上获得收益的路径。若主张是“更快”，需要说明快在哪个环节、客户为何在意、企业如何兑现。若主张是“更多个性化”，需要说明哪些变体能够承担维护成本。\n\n前四课建立了企业判断的外层框架。下一部分进入实施组织：FDE为何发展起来，企业应怎样使用这种工作方式。\n","exportSingleMd":"# 第4课｜AI 怎样影响竞争和商业模式\n\n当多家公司都能更便宜地制作报告，行业未必同时获得更高利润。客户可能要求降价，也可能期待更快、更个性化的服务。技术创造了价值，企业还需要决定以什么方式把价值留在自己的经营中。\n\n## 先区分创造价值和获得收益\n\n创造价值，是客户得到更好的结果，或企业付出更少资源。获得收益，是企业能够通过价格、销量、留存或成本变化，保留其中一部分。\n\n假设一家专业服务公司过去每份分析报告需要8小时。AI辅助后，达到同样标准需要5小时。如果客户仍愿意按原价格采购，且公司能接到更多业务，释放的时间可能扩大收入。如果竞争使价格随工时下降，收益会部分转给客户。如果所有人员都满负荷做核对，名义上的生成速度也未必形成优势。\n\n因此，技术规划要和市场选择一起做。企业究竟希望更便宜、更快、更深入，还是服务原来无法覆盖的需求？这些选择决定流程、质量和投入重点。\n\n## 收费和服务承诺也会随之改变\n\n继续看报告服务，使用一组教学假设：原来一份合格报告用8小时，每小时收费600元、按投入工时分摊的人员成本300元，收入4,800元，分摊人员成本2,400元。这里假设两种做法的其他成本相同，先只比较服务计价机制，暂未计入AI新增费用；完整采用账在第13课展开。改造后同样标准用5小时；继续 :"05-FDE的发展与作用.md","id":"lesson-05","number":5,"role":"核心课","part":1,"title":"第5课｜FDE 为什么发展起来，企业需要什么","md":"# 第5课｜FDE 为什么发展起来，企业需要什么\n\n企业可以购买通用模型与软件，但很难直接买到已经理解自身业务、接好资料、安排好权责并得到员工采用的结果。通用能力与具体业务之间的距离，构成了现场实施的工作。\n\nFDE之所以值得研究，正在于它把发现问题与动手实现放得很近。\n\n## 角色的来源与扩展\n\nFDE通常指Forward Deployed Engineer，前线部署工程师。Palantir长期采用Forward Deployed Software Engineer这一职位，强调工程师与客户并肩工作，理解复杂问题，利用业务数据开发和部署应用，并参与从构想到落地的过程。\n\n这一角色在生成式AI普及之前已经存在。它回应的是企业软件的一项长期困难：现场问题往往无法事先写成完整规格，而产品只有进入真实环境，才能暴露数据、流程和采用障碍。\n\nAI扩大了这项工作的范围。需求可能涉及阅读和判断等过去难以程序化的任务；合适方案需要在材料与使用中探索；模型输出还必须被接入可控流程。AWS当前的FDE交付描述强调与客户共同建设生产系统，并形成内部运行能力。Anthropic在2026年10月公布的Frontier Academy则面向具备软件基础的工程人员，安排企业部署训练与后续真实项目实践，使用了Frontier Deployed Engineer这一名称。\n\n相同缩写在不同机构中的展开和责任不完全相同。以上材料能够说明角色与培养方式正在扩展，不能据此认定全行业已有统一标准，也不能把厂商自己的交付描述当独立效果验证。\n\n## 企业为什么愿意为这种工作付费\n\n先看一段常见往返：业务说“希望自动报价”，分析人员写功能说明，开发人员按说明实现，用户试用后才发现必须先确认工况，技术负责人又指出确认结果需要保留依据。每一轮都增加等待和信息损失。\n\n现场实施把观察、设计、实现和反馈连接起来。工程人员可以看到一笔真实任务怎样被处理，业务人员也可以尽早操作候选方案。原来要经过多次转述才能发现的差异，可能在共同工作时暴露。\n\n它的经济价值主要来自减少这类认识与协调成本、尽早排除错误方向，以及把有效方案带到日常使用。是否划算，要与企业已有的产品、IT和业务改进能力比较。业务稳定、成熟软件已经充分覆盖的场景，常规配置与实施也可能很好；高不确定、跨数据与流程的问题，更需要紧密的现场反馈。\n\n## FDE在一条业务链中具体做什么\n\n在询价案例中，FDE先查看原始客户请求、技术退回和交付记录，弄清“报价慢”主要来自哪里。接着把一个范围缩小到可以共同观察的工作，例如非标准需求进入技术队列之前的整理。\n\n团队做出可操作方案，让销售与技术人员使用同一批材料。若发现照片识别不可靠，就调整确认入口；若技术人员仍频繁退回，就重新检查必要条件。实现有效后，再连接身份、资料、权限和记录，安排测试、上线与维护。\n\n这一过程需要实际工程能力。仅提供一份建议，无法检验系统连接和执行；仅按既定说明交付功能，也可能忽略现场问题已经变化。企业需要在合同和团队安排中写清发现、实现、部署和使用反馈分别由谁承担。\n\n## 哪些责任仍在企业\n\n企业决定服务哪些客户、接受什么承诺、愿意投入多少、由谁改变流程。业务负责人提供判断与取舍，资料负责人维护有效信息，系统负责人管理连接和运行，使用者参与真实任务检验。FDE可以帮助把这些责任转为工作安排，但没有天然权限替企业作出所有决定。\n\n尤其要防止一种结构：实施者掌握全部配置，业务只看演示，内部没有人能解释结果。这样的合作可能完成一次部署，却使企业长期依赖少数个人。\n\n一个有用的交付问题是：“如果原实施者下周不能参与，团队还能怎样判断系统是否正常、修改规则和恢复业务？”答案会暴露真正需要留下的资产。\n\n## 怎样理解本课程的差异化\n\n工程人员的FDE训练，通常把目标放在如何发现、构建和交付项目。本课程把同一过程放回企业一侧：为什么选择这个问题，怎样组织业务条件，如何判断方案、兑现收益，并保留下一次改进能力。\n\n两种视角在实际项目中需要相互配合。课程提供的是企业组织和使用FDE工作的判断框架，不以完成阅读授予工程资质，也不宣称所有转型都必须新增一个同名职位。内部团队、外部合作或混合安排，都可以承担其中的工作。\n\n若你正在考虑引入FDE，请先写下目前缺少哪种能力：现场诊断、AI实现、系统集成、采用推动，还是长期运维。把缺口写成可交付的工作，才有条件比较合作方式。\n\n下一课从一项经营困扰追到实际工作，开始定义值得实施的问题。\n","html":"\u003ch1>第5课｜FDE 为什么发展起来，企业需要什么\u003c/h1>\n\u003cp>企业可以购买通用模型与软件，但很难直接买到已经理解自身业务、接好资料、安排好权责并得到员工采用的结果。通用能力与具体业务之间的距离，构成了现场实施的工作。\u003c/p>\n\u003cp>FDE之所以值得研究，正在于它把发现问题与动手实现放得很近。\u003c/p>\n\u003ch2>角色的来源与扩展\u003c/h2>\n\u003cp>FDE通常指Forward Deployed Engineer，前线部署工程师。Palantir长期采用Forward Deployed Software Engineer这一职位，强调工程师与客户并肩工作，理解复杂问题，利用业务数据开发和部署应用，并参与从构想到落地的过程。\u003c/p>\n\u003cp>这一角色在生成式AI普及之前已经存在。它回应的是企业软件的一项长期困难：现场问题往往无法事先写成完整规格，而产品只有进入真实环境，才能暴露数据、流程和采用障碍。\u003c/p>\n\u003cp>AI扩大了这项工作的范围。需求可能涉及阅读和判断等过去难以程序化的任务；合适方案需要在材料与使用中探索；模型输出还必须被接入可控流程。AWS当前的FDE交付描述强调与客户共同建设生产系统，并形成内部运行能力。Anthropic在2026年10月公布的Frontier Academy则面向具备软件基础的工程人员，安排企业部署训练与后续真实项目实践，使用了Frontier Deployed Engineer这一名称。\u003c/p>\n\u003cp>相同缩写在不同机构中的展开和责任不完全相同。以上材料能够说明角色与培养方式正在扩展，不能据此认定全行业已有统一标准，也不能把厂商自己的交付描述当独立效果验证。\u003c/p>\n\u003ch2>企业为什么愿意为这种工作付费\u003c/h2>\n\u003cp>先看一段常见往返：业务说“希望自动报价”，分析人员写功能说明，开发人员按说明实现，用户试用后才发现必须先确认工况，技术负责人又指出确认结果需要保留依据。每一轮都增加等待和信息损失。\u003c/p>\n\u003cp>现场实施把观察、设计、实现和反馈连接起来。工程人员可以看到一笔真实任务怎样被处理，业务人员也可以尽早操作候选方案。原来要经过多次转述才能发现的差异，可能在共同工作时暴露。\u003c/p>\n\u003cp>它的经济价值主要来自减少这类认识与协调成本、尽早排除错误方向，以及把有效方案带到日常使用。是否划算，要与企业已有的产品、IT和业务改进能力比较。业务稳定、成熟软件已经充分覆盖的场景，常规配置与实施也可能很好；高不确定、跨数据与流程的问题，更需要紧密的现场反馈。\u003c/p>\n\u003ch2>FDE在一条业务链中具体做什么\u003c/h2>\n\u003cp>在询价案例中，FDE先查看原始客户请求、技术退回和交付记录，弄清“报价慢”主要来自哪里。接着把一个范围缩小到可以共同观察的工作，例如非标准需求进入技术队列之前的整理。\u003c/p>\n\u003cp>团队做出可操作方案，让销售与技术人员使用同一批材料。若发现照片识别不可靠，就调整确认入口；若技术人员仍频繁退回，就重新检查必要条件。实现有效后，再连接身份、资料、权限和记录，安排测试、上线与维护。\u003c/p>\n\u003cp>这一过程需要实际工程能力。仅提供一份建议，无法检验系统连接和执行；仅按既定说明交付功能，也可能忽略现场问题已经变化。企业需要在合同和团队安排中写清发现、实现、部署和使用反馈分别由谁承担。\u003c/p>\n\u003ch2>哪些责任仍在企业\u003c/h2>\n\u003cp>企业决定服务哪些客户、接受什么承诺、愿意投入多少、由谁改变流程。业务负责人提供判断与取舍，资料负责人维护有效信息，系统负责人管理连接和运行，使用者参与真实任务检验。FDE可以帮助把这些责任转为工作安排，但没有天然权限替企业作出所有决定。\u003c/p>\n\u003cp>尤其要防止一种结构：实施者掌握全部配置，业务只看演示，内部没有人能解释结果。这样的合作可能完成一次部署，却使企业长期依赖少数个人。\u003c/p>\n\u003cp>一个有用的交付问题是：“如果原实施者下周不能参与，团队还能怎样判断系统是否正常、修改规则和恢复业务？”答案会暴露真正需要留下的资产。\u003c/p>\n\u003ch2>怎样理解本课程的差异化\u003c/h2>\n\u003cp>工程人员的FDE训练，通常把目标放在如何 付项目。本课程把同一过程放回企业一侧：为什么选择这个问题，怎样组织业务条件，如何判断方案、兑现收益，并保留下一次改进能力。\n\n两种视角在实际项目中需要相互配合。课程提供的是企业组织和使用FDE工作的判断框架，不以完成阅读授予工程资质，也不宣称所有转型都必须新增一个同名职位。内部团队、外部合作或混合安排，都可以承担其中的工作。\n\n若你正在考虑引入FDE，请先写下目前缺少哪种能力：现场诊断、AI实现、系统集成、采用推动，还是长期运维。把缺口写成可交付的工作，才有条件比较合作方式。\n\n下一课从一项经营困扰追到实际工作，开始定义值得实施的问题。\n","exportSingleMd":"# 第5课｜FDE 为什么发展起来，企业需要什么\n\n企业可以购买通用模型与软件，但很难直接买到已经理解自身业务、接好资料、安排好权责并得到员工采用的结果。通用能力与具体业务之间的距离，构成了现场实施的工作。\n\nFDE之所以值得研究，正在于它把发现问题与动手实现放得很近。\n\n## 角色的来源与扩展\n\nFDE通常指Forward Deployed Engineer，前线部署工程师。Palantir长期采用Forward Deployed Software Engineer这一职位，强调工程师与客户并肩工作，理解复杂问题，利用业务数据开发和部署应用，并参与从构想到落地的过程。\n\n这一角色在生成式AI普及之前已经存在。它回应的是企业软件的一项长期困难：现场问题往往无法事先写成完整规格，而产品只有进入真实环境，才能暴露数据、流程和采用障碍。\n\nAI扩大了这项工作的范围。需求可能涉及阅读和判断等过去难以程序化的任务；合适方案需要在材料与使用中探索；模型输出还必须被接入可控流程。AWS当前的FDE交付描述强调与客户共同建设生产系统，并形成内部运行能力。Anthropic在2026年10月公布的Frontier Academy则面向具备软件基础的工程人员，安排企业部署训练与后续真实项目实践，使用了Frontier Deployed Engineer这一名称。\n\n相同缩写在不同机构中的展开和责任不完全相同。以上材料能够说明角色与培养方式正在扩展，不能据此认定全行业已有统一标准，也不能把厂商自己的交付描述当独立效果验证。\n\n## 企业为什么愿意为这种工作付费\n\n先看一段常见往返：业务说“希望自动报价”，分析人员写功能说明，开发人员按说明实现，用户试用后才发现必须先确认工况，技术负责人又指出确认结果需要保留依据。每一轮都增加等待和信息损失。\n\n现场实施把观察、设计、实现和反馈连接起来。工程人员可以看到一笔真实任务怎样被处理，业务人员也可以尽早操作候选方案。原来要经过多次转述才能发现的差异，可能在共同工作时暴露。\n\n它的经济价值主要来自减少这类认识与协调成本、尽早排除错误方向，以及把有效方案带到日常使用。是否划算，要与企业已有的产品、IT和业务改进能力比较。业务稳定、成熟软件已经充分覆盖的场景，常规配置与实施也可能很好；高不确定、跨数据与流程的问题，更需要紧密的现场反馈。\n\n## FDE在一条业务链中具体做什么\n\n在询价案例中，FDE先查看原始客户请求、技术退回和交付记录，弄清“报价慢”主要来自哪里。接着把一个范围缩小到可以共同观察的工作，例如非标准需求进入技术队列之前的整理。\n\n团队做出可操作方案，让销售与技术人员使用同一批材料。若发现照片识别不可靠，就调整确认入口；若技术人员仍频繁退回，就重新检查必要条件。实现有效后，再连接身份、资料、权限和记录，安排测试、上线与维护。\n\n这一过程需要实际工程能力。仅提供一份建议，无法检验系统连接和执行；仅按既定说明交付功能，也可能忽略现场问题已经变化。企业需要在合同和团队安排中写清发现、实现、部署和使用反馈分别由谁承担。\n\n## 哪些责任仍在企业\n\n企业决定服务哪些客户、接受什么承诺、愿意投入多少、由谁改变流程。业务负责人提供判断与取舍，资料负责人维护有效信息，系统负责人管理连接和运行，使用者参与真实任务检验。FDE可以帮助把这些责任转为工作安排，但没有天然权限替企业作出所有决定。\n\n尤其要防止一种结构：实施者掌握全部配置，业务只看演示，内部没有人能解释结果。这样的合作可能完成一次部署，却使企业长期依赖少数个人。\n\n一个有用的交付问题是：“如果原实施者下周不能参与，团队还能怎样判断系统是否正常、修改规则和恢复业务？”答案会暴露真正需要留下的资产。\n\n## 怎样理解本课程的差异化\n\n工程人员的FDE训练，通常把目标放在如何发现、构建和交付项目。本课程把同一过程放回企业一侧：为什么选择这个问题，怎样组织业务条件，如何判断方案、兑现收益，并保留下一次改进能力。\n\n两种视角在实际项目中需要相互配合。课程提供的是企业组织和使用FDE工作的判断框架，不以完成阅读授予工程资质，也不宣称所有转型都必须新增一个同名职位。内部团队、外部合作或混合安排，都可以承担其中的工作。\n\n若你正在考虑引入FDE，请先写下目前缺少哪种能力：现场诊断、AI实现、系统集成、采用推动，还是长期运维。把缺口写成可交付的工作，才有条件比较合作方式。\n\n下一课从一项经营困扰追到实际工作，开始定义值得实施的问题。\n","text":"# 第5课｜FDE 为什么发展起来，企业需要什么\n\n企业可以购买通用模型与软件，但很难直接买到已经理解自身业务、接好资料、安排好权责并得到员工采用的结果。通用能力与具体业务之间的距离，构成了现场实施的工作。\n\nFDE之所以值得研究，正在于它把发现问题与动手实现放得很近。\n\n## 角色的来源与扩展\n\nFDE通常指Forward Deployed Engineer，前线部署工程师。Palantir长期采用Forward Deployed Software Engineer这一职位，强调工程师与客户并肩工作，理解复杂问题，利用业务数据开发和部署应用，并参与从构想到落地的过程。\n\n这一角色在生成式AI普及之前已经存在。它回应的是企业软件的一项长期困难：现场问题往往无法事先写成完整规格，而产品只有进入真实环境，才能暴露数据、流程和采用障碍。\n\nAI扩大了这项工作的范围。需求可能涉及阅读和判断等过去难以程序化的任务；合适方案需要在材料与使用中探索；模型输出还必须被接入可控流程。AWS当前的FDE交付描述强调与客户共同建设生产系统，并形成内部运行能力。Anthropic在2026年10月公布的Frontier Academy则面向具备软件基础的工程人员，安排企业部署训练与后续真实项目实践，使用了Frontier Deployed Engineer这一名称。\n\n相同缩写在不同机构中的展开和责任不完全相同。以上材料能够说明角色与培养方式正在扩展，不能据此认定全行业已有统一标准，也不能把厂商自己的交付描述当独立效果验证。\n\n## 企业为什么愿意为这种工作付费\n\n先看一段常见往返：业务说“希望自动报价”，分析人员写功能说明，开发人员按说明实现，用户试用后才发现必须先确认工况，技术负责人又指出确认结果需要保留依据。每一轮都增加等待和信息损失。\n\n现场实施把观察、设计、实现和反馈连接起来。工程人员可以看到一笔真实任务怎样被处理，业务人员也可以尽早操作候选方案。原来要经过多次转述才能发现的差异，可能在共同工作时暴露。\n\n它的经济价值主要来自减少这类认识与协调成本、尽早排除错误方向，以及把有效方案带到日常使用。是否划算，要与企业已有的产品、IT和业务改进能力比较。业务稳定、成熟软件已经充分覆盖的场景，常规配置与实施也可能很好；高不确定、跨数据与流程的问题，更需要紧密的现场反馈。\n\n## FDE在一条业务链中具体做什么\n\n在询价案例中，FDE先查看原始客户请求、技术退回和交付记录，弄清“报价慢”主要来自哪里。接着把一个范围缩小到可以共同观察的工作，例如非标准需求进入技术队列之前的整理。\n\n团队做出可操作方案，让销售与技术人员使用同一批材料。若发现照片识别不可靠，就调整确认入口；若技术人员仍频繁退回，就重新检查必要条件。实现有效后，再连接身份、资料、权限和记录，安排测试、上线与维护。\n\n这一过程需要实际工程能力。仅提供一份建议，无法检验系统连接和执行；仅按既定说明交付功能，也可能忽略现场问题已经变化。企业需要在合同和团队安排中写清发现、实现、部署和使用反馈分别由谁承担。\n\n## 哪些责任仍在企业\n\n企业决定服务哪些客户、接受什么承诺、愿意投入多少、由谁改变流程。业务负责人提供判断与取舍，资料负责人维护有效信息，系统负责人管理连接和运行，使用者参与真实任务检验。FDE可以帮助把这些责任转为工作安排，但没有天然权限替企业作出所有决定。\n\n尤其要防止一种结构：实施者掌握全部配置，业务只看演示，内部没有人能解释结果。这样的合作可能完成一次部署，却使企业长期依赖少数个人。\n\n一个有用的交付问题是：“如果原实施者下周不能参与，团队还能怎样判断系统是否正常、修改规则和恢复业务？”答案会暴露真正需要留下的资产。\n\n## 怎样理解本课程的差异化\n\n工程人员的FDE训练，通常把目标放在如何发现、构建和交付项目。本课程把同一过程放回企业一侧：为什么选择这个问题，怎样组织业务条件，如何判断方案、兑现收益，并保留下一次改进能力。\n\n两种视角在实际项目中需要相互配合。课程提供的是企业组织和使用FDE工作的判断框架，不以完成阅读授予工程资质，也不宣称所有转型都必须新增一个同名职位。内部团队、外部合作或混合安排，都可以承担其中的工作。\n\n若你正在考虑引入FDE，请先写下目前缺少哪种能力：现场诊断、AI实现、系统集成、采用推动，还是长期运维。把缺口写成可交付的工作，才有条件比较合作方式。\n\n下一课从一项经营困扰追到实际工作，开始定义值得实施的问题。\n"},{"file":"06-从经营结果追到现场.md","id":"lesson-06","number":6,"role":"核心课","part":1,"title":"第6课｜从经营结果追到工作现场","md":"# 第6课｜从经营结果追到工作现场\n\n“报价慢”“员工效率低”“知识没有沉淀”，都可能是真实困扰，却还不足以成为实施说明。它们把不同原因压在同一个词里，团队很容易按自己熟悉的工具作答。\n\n诊断需要把结果、发生结果的路径，以及支撑路径的能力连接起来。\n\n## 从一个结果开始限定问题\n\n先说明慢的是哪一种报价，起点和终点是什么，影响了哪些客户。收到消息到销售回复、收到完整材料到技术确认、批准到发给客户，是三种不同周期。\n\n若企业关心客户等待，就要覆盖从最初请求开始的时间；若想改善技术岗位，则还要记录实际处理、等待与返工。只测模型回答耗时，无法回答这两类问题。\n\n案例A的八笔记录中，标准品准备周期为2、3、2小时，替换适配为18、16、20、17小时。这提供了一个分组线索：两类任务的工作结构不同。把它们混成一个平均值，可能看不见真正值得改的部分。\n\n样本很小，也可能被刻意选成问题单。此时最有价值的动作，是带着线索再查看最近一段时间的全部或有明确抽取规则的记录，确认问题是否持续、集中在哪些任务。\n\n## 还原一次工作怎样发生\n\n选择INQ-041，先把已提供的原消息、附件、补问、技术判断、库存回执和最终承诺按流转顺序排出来。卷宗没有提供全部岗位时点，因此只能标出已知时点；要实际分解处理、等待与返工，还需补取各岗位接收、开始、完成及退回记录。不能把教学叙述顺序当成已经观测的时间线。每一段都问：谁收到什么，依据什么继续，产物交给谁。\n\n观察可能发现，技术人员处理的不是单一的选型判断，还承担了整理聊天、寻找附件、解释缺项和追问。真正稀缺的专业判断时间，被材料准备消耗。\n\n这时“技术太忙”有了具体机制，也出现了新的改法：把必要条件提前整理，让一次补问尽量覆盖缺项。AI可以辅助识别与组织信息，业务人员负责确认。技术团队得到的输入发生变化，才可能减少无效往返。\n\n## 同时保留竞争解释\n\n同一现象可能有其他原因。技术人员也许已经拿到完整材料，只是优先处理高价值客户；也许等待来自供应商没有答复；也许批准只有一人有权限。\n\n这些解释作出不同预测。如果缺项是主要原因，材料完整的同类任务应该更少退回；如果优先级是原因，完整小单仍可能等待；如果审批是原因，技术完成后还会出现长队列。\n\n因此，诊断不应在访谈中得到一句抱怨就结束。可以对比同类任务、查看时间记录、旁观实际操作，并把员工解释与系统事实放在一起。没有证据支持的原因，先保留为假设。\n\n这里也要避免事后叙事：一次成功交付可能靠某位骨干临时协调，正式流程并没有这种能力。应记录实际做法、正式规定和偶然补救的差异，之后再决定哪一种值得制度化。\n\n## 用问题树连接能力缺口\n\n假设目前证据支持“材料准备不完整导致技术往返”，仍需继续问缺口在哪里。\n\n可能是员工不知道要收集哪些条件，需要明确受理标准；可能是条件散落在多个来源，需要改善整理；可能是客户根本不愿提供，需要调整问法、服务规则或合作范围；也可能各技术人员要求不同，需要先统一业务判断。\n\n同样的表面缺项，最后可能分别对应知识、AI整理、客户机制或权责协调。只有部分工作适合用模型解决。诊断到这一层，才能避免把整条问题链都交给“换个更好的AI”。\n\n## 形成一份可以被推翻的诊断\n\n一份工作诊断可以写成：“在替换适配询价中，报价周期较长。已查看记录显示，技术收到材料后多次补问，部分专业时间用于恢复客户条件。先检验受理前的必要条件检查能否减少往返；若完整输入的任务仍同样等待，应转向排队、优先级或审批解释。”\n\n这份诊断值得实施，是因为它指向具体变化，也说明了什么结果会使团队重新判断。\n\n请从[案例A](案例A-非标询价到履约承诺.md)选择两条你支持的观察和一条尚不能证明的解释，再写出能够区分解释的下一次取证。换成自己的业务时，材料可以很少，但每条推断都应知道从哪里来。\n\n问题明确后，下一步是选择怎样的试点，既控制投入，又取得足够有用的信息。\n","html":"\u003ch1>第6课｜从经营结果追到工作现场\u003c/h1>\n\u003cp>“报价慢”“员工效率低”“知识没有沉淀”，都可能是真实困扰，却还不足以成为实施说明。它们把不同原因压在同一个词里，团队很容易按自己熟悉的工具作答。\u003c/p>\n\u003cp>诊断需要把结果、发生结果的路径，以及支撑路径的能力连接起来。\u003c/p>\n\u003ch2>从一个结果开始限定问题\u003c/h2>\n\u003cp>先说明慢的是哪一种报价，起点和终点是什么，影响了哪些客户。收到消息到销售回复、收到完整材料到技术确认、批准到发给客户，是三种不同周期。\u003c/p>\n\u003cp>若企业关心客户等待，就要覆盖从最初请求开始的时间；若想改善技术岗位，则还要记录实际处理、等待与返工。只测模型回答耗时，无法回答这两类问题。\u003c/p>\n\u003cp>案例A的八笔记录中，标准品准备周期为2、3、2小时，替换适配为18、16、20、17小时。这提供了一个分组线索：两类任务的工作结构不同。把它们混成一个平均值，可能看不见真正值得改的部分。\u003c/p>\n\u003cp>样本很小，也可能被刻意选成问题单。此时最有价值的动作，是带着线索再查看最近一段时间的全部或有明确抽取规则的记录，确认问题是否持续、集中在哪些任务。\u003c/p>\n\u003ch2>还原一次工作怎样发生\u003c/h2>\n\u003cp>选择INQ-041，先把已提供的原消息、附件、补问、技术判断、库存回执和最终承诺按流转顺序排出来。卷宗没有提供全部岗位时点，因此只能标出已知时点；要实际分解处理、等待与返工，还需补取各岗位接收、开始、完成及退回记录。不能把教学叙述顺序当成已经观测的时间线。每一段都问：谁收到什么，依据什么继续，产物交给谁。\u003c/p>\n\u003cp>观察可能发现，技术人员处理的不是单一的选型判断，还承担了整理聊天、寻找附件、解释缺项和追问。真正稀缺的专业判断时间，被材料准备消耗。\u003c/p>\n\u003cp>这时“技术太忙”有了具体机制，也出现了新的改法：把必要条件提前整理，让一次补问尽量覆盖缺项。AI可以辅助识别与组织信息，业务人员负责确认。技术团队得到的输入发生变化，才可能减少无效往返。\u003c/p>\n\u003ch2>同时保留竞争解释\u003c/h2>\n\u003cp>同一现象可能有其他原因。技术人员也许已经拿到完整材料，只是优先处理高价值客户；也许等待来自供应商没有答复；也许批准只有一人有权限。\u003c/p>\n\u003cp>这些解释作出不同预测。如果缺项是主要原因，材料完整的同类任务应该更少退回；如果优先级是原因，完整小单仍可能等待；如果审批是原因，技术完成后还会出现长队列。\u003c/p>\n\u003cp>因此，诊断不应在访谈中得到一句抱怨就结束。可以对比同类任务、查看时间记录、旁观实际操作，并把员工解释与系统事实放在一起。没有证据支持的原因，先保留为假设。\u003c/p>\n\u003cp>这里也要避免事后叙事：一次成功交付可能靠某位骨干临时协调，正式流程并没有这种能力。应记录实际做法、正式规定和偶然补救的差异，之后再决定哪一种值得制度化。\u003c/p>\n\u003ch2>用问题树连接能力缺口\u003c/h2>\n\u003cp>假设目前证据支持“材料准备不完整导致技术往返”，仍需继续问缺口在哪里。\u003c/p>\n\u003cp>可能是员工不知道要收集哪些条件，需要明确受理标准；可能是条件散落在多个来源，需要改善整理；可能是客户根本不愿提供，需要调整问法、服务规则或合作范围；也可能各技术人员要求不同，需要先统一业务判断。\u003c/p>\n\u003cp>同样的表面缺项，最后可能分别对应知识、AI整理、客户机制或权责协调。只有部分工作适合用模型解决。诊断到这一层，才能避免把整条问题链都交给“换个更好的AI”。\u003c/p>\n\u003ch2>形成一份可以被推翻的诊断\u003c/h2>\n\u003cp>一份工作诊断可以写成：“在替换适配询价中，报价周期较长。已查看记录显示，技术收到材料后多次补问，部分专业时间用于恢复客户条件。先检验受理前的必要条件检查能否减少往返；若完整输入的任务仍同样等待，应转向排队、优先级或审批解释。”\u003c/p>\n\u003cp>这份诊断值得实施，是因为它指向具体变化，也说明了什么结果会使团队重新判断。\u003c/p>\n\u003cp>请从\u003ca href=\"#case-a\">案例A\u003c/a>选择两条你支持的观察和一条尚不能证明的解释，再写出能够区分解释的下一次取证。换成自己的业务时，材料可以很少，但每条推断都应知道从哪里来。\u003c/p>\n\u003cp>问题明确后，下一步是选择怎样的试点，既控制投入，又取得足够有用的信息。\u003c/p>\n","exportMd":"# 第6课｜从经营结果追到工作现场\n\n“报价慢”“员工效率低”“知识没有沉淀”，都可能是真实困扰，却还不足以成为实施说明。它们把不同原因压在同一个词里，团队很容易按自己熟悉的工具作答。\n\n诊断需要把结果、发生结果的路径，以及支撑路径的能力连接起来。\n\n## 从一个结果开始限定问题\n\n先说明慢的是哪一种报价，起点和终点是什么，影响了哪些客户。收到消息到销售回复、收到完整材料到技术确认、批准到发给客户，是三种不同周期。\n\n若企业关心客户等待，就要覆盖从最初请求开始的时间；若想改善技术岗位，则还要记录实际处理、等待与返工。只测模型回答耗时，无法回答这两类问题。\n\n案例A的八笔记录中，标准品准备周期为2、3、2小时，替换适配为18、16、20、17小时。这提供了一个分组线索：两类任务的工作结构不同。把它们混成一个平均值，可能看不见真正值得改的部分。\n\n样本很小，也可能被刻意选成问题单。此时最有价值的动作，是带着线索再查看最近一段时间的全部或有明确抽取规则的记录，确认问题是否持续、集中在哪些任务。\n\n## 还原一次工作怎样发生\n\n选择INQ-041，先把已提供的原消息、附件、补问、技术判断、库存回执和最终承诺按流转顺序排出来。卷宗没有提供全部岗位时点，因此只能标出已知时点；要实际分解处理、等待与返工，还需补取各岗位接收、开始、完成及退回记录。不能把教学叙述顺序当成已经观测的时间线。每一段都问：谁收到什么，依据什么继续，产物交给谁。\n\n观察可能发现，技术人员处理的不是单一的选型判断，还承担了整理聊天、寻找附件、解释缺项和追问。真正稀缺的专业判断时间，被材料准备消耗。\n\n这时“技术太忙”有了具体机制，也出现了新的改法：把必要条件提前整理，让一次补问尽量覆盖缺项。AI可以辅助识别与组织信息，业务人员负责确认。技术团队得到的输入发生变化，才可能减少无效往返。\n\n## 同时保留竞争解释\n\n同一现象可能有其他原因。技术人员也许已经拿到完整材料，只是优先处理高价值客户；也许等待来自供应商没有答复；也许批准只有一人有权限。\n\n这些解释作出不同预测。如果缺项是主要原因，材料完整的同类任务应该更少退回；如果优先级是原因，完整小单仍可能等待；如果审批是原因，技术完成后还会出现长队列。\n\n因此，诊断不应在访谈中得到一句抱怨就结束。可以对比同类任务、查看时间记录、旁观实际操作，并把员工解释与系统事实放在一起。没有证据支持的原因，先保留为假设。\n\n这里也要避免事后叙事：一次成功交付可能靠某位骨干临时协调，正式流程并没有这种能力。应记录实际做法、正式规定和偶然补救的差异，之后再决定哪一种值得制度化。\n\n## 用问题树连接能力缺口\n\n假设目前证据支持“材料准备不完整导致技术往返”，仍需继续问缺口在哪里。\n\n可能是员工不知道要收集哪些条件，需要明确受理标准；可能是条件散落在多个来源，需要改善整理；可能是客户根本不愿提供，需要调整问法、服务规则或合作范围；也可能各技术人员要求不同，需要先统一业务判断。\n\n同样的表面缺项，最后可能分别对应知识、AI整理、客户机制或权责协调。只有部分工作适合用模型解决。诊断到这一层，才能避免把整条问题链都交给“换个更好的AI”。\n\n## 形成一份可以被推翻的诊断\n\n一份工作诊断可以写成：“在替换适配询价中，报价周期较长。已查看记录显示，技术收到材料后多次补问，部分专业时间用于恢复客户条件。先检验受理前的必要条件检查能否减少往返；若完整输入的任务仍同样等待，应转向排队、优先级或审批解释。”\n\n这份诊断值得实施，是因为它指向具体变化，也说明了什么结果会使团队重新判断。\n\n请从[案例A](#case-a)选择两条你支持的观察和一条尚不能证明的解释，再写出能够区分解释的下一次取证。换成自己的业务时，材料可以很少，但每条推断都应知道从哪里来。\n\n问题明确后，下一步是选择怎样的试点，既控制投入，又取得足够有用的信息。\n","exportSingleMd":"# 第6课｜从经营结果追到工作现场\n\n“报价慢”“员工效率低”“知识没有沉淀”，都可能是真实困扰，却还不足以成为实施说明。它们把不同原因压在同一个词里，团队很容易按自己熟悉的工具作答。\n\n诊断需要把结果、发生结果的路径，以及支撑路径的能力连接起来。\n\n## 从一个结果开始限定问题\n\n先说明慢的是哪一种报价，起点和终点是什么，影响了哪些客户。收到消息到销售回复、收到完整材料到技术确认、批准到发给客户，是三种不同周期。\n\n若企业关心客户等待，就要覆盖从最初请 小任务范围；若业务改善且能稳定运行，再评估库存查询和记录连接。\n\n在这个例子里，追加决定可以沿三层证据展开：先用有原始依据的请求，检查必要条件是否被正确识别；再让销售与技术实际使用，记录准备、核对、修改、追问的总工时及客户等待周期；最后查看释放的技术时间是否减少积压、支持更多有效交付或取消了实际支出，并计入新增运行与维护费用。比较应选同类请求、相同信息完整程度和完成标准的现行做法，避免把标准品与复杂适配混比。\n\n缺项识别更准而总工作增加时，先改范围或分工；专业时间释放但没有相应需求时，可以讨论质量与容量价值，暂不宣称收入增加。这里先建立证据顺序，第12、13课再给评测和完整经济账。\n\n这种安排保留了未来选择：企业用较小投入获得信息，再决定是否追加。它也要求团队真的接受停止。任何结果都被解释为“还要继续投入”，试点就失去了投资纪律。\n\n## 比较项目时，避免一张总分表掩盖约束\n\n企业可能同时考虑报告生成、询价整理和自动售后。可以比较价值、实现条件、可验证性与采用责任，但不宜让一个综合分数覆盖决定性障碍。\n\n自动售后即使预期收益高，如果没有退款权限和异常责任安排，当前就不具备扩大执行的条件。报告生成即使容易制作，如果没有明确使用者，价值也仍是未知。先处理这些条件，再比较同样可进入的候选。\n\n项目之间还可能共享投入。客户身份整理可以同时服务询价和售后；一个通用评测工具可能支持多个助手。共享资产值得考虑，但应说明究竟被哪些工作采用，避免用“未来平台”解释无限范围。\n\n## 业务采用必须进入试点\n\n业务负责人需要投入实际时间：提供材料、核对结果、决定规则和观察使用。缺少这些条件，实施团队测到的只是技术可行性。\n\n可以提前约定一位流程负责人、两类真实使用岗位、材料范围和每周复盘时间。这里的重点是有人能够对跨岗位变化作决定。让每个员工各自试用，然后汇总满意度，难以判断整条业务是否改善。\n\n请为自己的试点写四句话：主要价值假设；本轮覆盖和排除的任务；最能改变投资判断的证据；出现什么情况停止或改道。[工作簿](工作簿-改造提案.md)提供可填写位置。\n\n范围清楚以后，需要把新旧工作方式作完整比较。下一课开始设计实际业务链。\n","html":"\u003ch1>第7课｜怎样选择试点和投资顺序\u003c/h1>\n\u003cp>试点同时有两种产出：完成一部分工作，和让企业知道下一步值不值得做。投入有限时，能尽早回答关键不确定性的试点，往往比范围更大、演示更完整的方案有用。\u003c/p>\n\u003ch2>先写价值假设，再选范围\u003c/h2>\n\u003cp>案例A当前的假设是：在技术受理之前检查必要条件，可以减少往返，使专业人员完成更多有效判断。\u003c/p>\n\u003cp>第一轮可以只覆盖替换适配询价的整理、缺项发现和补问建议。它仍需让真实岗位使用，但暂不承担最终选型与对外承诺。这样观察到的变化能较直接地对应价值假设。\u003c/p>\n\u003cp>如果第一轮同时更换客户管理系统、调整价格和培训技术团队，即使报价变快，也很难解释哪项改动起主要作用。组合改造有时必要，但应承认归因范围相应变宽。\u003c/p>\n\u003ch2>好的试点需要可学习的任务分布\u003c/h2>\n\u003cp>只选择最干净的材料，容易得到漂亮结果；只选择最坏的任务，又可能误判可用范围。先弄清日常任务有哪些类型，再让试点覆盖常见、模糊和重要异常。\u003c/p>\n\u003cp>对询价整理，普通完整请求、前后修改数量、旧新型号混用、资料缺失、跨客户旧单混淆，分别检验不同能力。严重错误的后果也不同：少写一个非关键备注，与把不确定交期变为正式承诺，不能等权处理。\u003c/p>\n\u003cp>数量由风险、任务多样性和可取得材料决定。十几笔可以帮助发现明显机制问题，却很难证明罕见严重错误已经被控制。企业应写清本轮能回答什么，暂时回答不了什么。\u003c/p>\n\u003ch2>把试点视为分阶段投资\u003c/h2>\n\u003cp>第一阶段用有限材料判断能力是否值得继续；第二阶段让岗位在受控范围中使用，验证完整工作成本与采用；第三阶段才扩大连接和责任范围。\u003c/p>\n\u003cp>每阶段应有继续、调整和停止的条件。例如：若缺项发现没有改善，先调整受理规则或放弃该用法；若整理有效但核对成本过高，缩小任务范围；若业务改善且能稳定运行，再评估库存查询和记录连接。\u003c/p>\n\u003cp>在这个例子里，追加决定可以沿三层证据展开：先用有原始依据的请求，检查必要条件是否被正确识别；再让销售与技术实际使用，记录准备、核对、修改、追问的总工时及客户等待周期； 放但没有相应需求时，可以讨论质量与容量价值，暂不宣称收入增加。这里先建立证据顺序，第12、13课再给评测和完整经济账。\n\n这种安排保留了未来选择：企业用较小投入获得信息，再决定是否追加。它也要求团队真的接受停止。任何结果都被解释为“还要继续投入”，试点就失去了投资纪律。\n\n## 比较项目时，避免一张总分表掩盖约束\n\n企业可能同时考虑报告生成、询价整理和自动售后。可以比较价值、实现条件、可验证性与采用责任，但不宜让一个综合分数覆盖决定性障碍。\n\n自动售后即使预期收益高，如果没有退款权限和异常责任安排，当前就不具备扩大执行的条件。报告生成即使容易制作，如果没有明确使用者，价值也仍是未知。先处理这些条件，再比较同样可进入的候选。\n\n项目之间还可能共享投入。客户身份整理可以同时服务询价和售后；一个通用评测工具可能支持多个助手。共享资产值得考虑，但应说明究竟被哪些工作采用，避免用“未来平台”解释无限范围。\n\n## 业务采用必须进入试点\n\n业务负责人需要投入实际时间：提供材料、核对结果、决定规则和观察使用。缺少这些条件，实施团队测到的只是技术可行性。\n\n可以提前约定一位流程负责人、两类真实使用岗位、材料范围和每周复盘时间。这里的重点是有人能够对跨岗位变化作决定。让每个员工各自试用，然后汇总满意度，难以判断整条业务是否改善。\n\n请为自己的试点写四句话：主要价值假设；本轮覆盖和排除的任务；最能改变投资判断的证据；出现什么情况停止或改道。[工作簿](#workbook)提供可填写位置。\n\n范围清楚以后，需要把新旧工作方式作完整比较。下一课开始设计实际业务链。\n","exportSingleMd":"# 第7课｜怎样选择试点和投资顺序\n\n试点同时有两种产出：完成一部分工作，和让企业知道下一步值不值得做。投入有限时，能尽早回答关键不确定性的试点，往往比范围更大、演示更完整的方案有用。\n\n## 先写价值假设，再选范围\n\n案例A当前的假设是：在技术受理之前检查必要条件，可以减少往返，使专业人员完成更多有效判断。\n\n第一轮可以只覆盖替换适配询价的整理、缺项发现和补问建议。它仍需让真实岗位使用，但暂不承担最终选型与对外承诺。这样观察到的变化能较直接地对应价值假设。\n\n如果第一轮同时更换客户管理系统、调整价格和培训技术团队，即使报价变快，也很难解释哪项改动起主要作用。组合改造有时必要，但应承认归因范围相应变宽。\n\n## 好的试点需要可学习的任务分布\n\n只选择最干净的材料，容易得到漂亮结果；只选择最坏的任务，又可能误判可用范围。先弄清日常任务有哪些类型，再让试点覆盖常见、模糊和重要异常。\n\n对询价整理，普通完整请求、前后修改数量、旧新型号混用、资料缺失、跨客户旧单混淆，分别检验不同能力。严重错误的后果也不同：少写一个非关键备注，与把不确定交期变为正式承诺，不能等权处理。\n\n数量由风险、任务多样性和可取得材料决定。十几笔可以帮助发现明显机制问题，却很难证明罕见严重错误已经被控制。企业应写清本轮能回答什么，暂时回答不了什么。\n\n## 把试点视为分阶段投资\n\n第一阶段用有限材料判断能力是否值得继续；第二阶段让岗位在受控范围中使用，验证完整工作成本与采用；第三阶段才扩大连接和责任范围。\n\n每阶段应有继续、调整和停止的条件。例如：若缺项发现没有改善，先调整受理规则或放弃该用法；若整理有效但核对成本过高，缩小任务范围；若业务改善且能稳定运行，再评估库存查询和记录连接。\n\n在这个例子里，追加决定可以沿三层证据展开：先用有原始依据的请求，检查必要条件是否被正确识别；再让销售与技术实际使用，记录准备、核对、修改、追问的总工时及客户等待周期；最后查看释放的技术时间是否减少积压、支持更多有效交付或取消了实际支出，并计入新增运行与维护费用。比较应选同类请求、相同信息完整程度和完成标准的现行做法，避免把标准品与复杂适配混比。\n\n缺项识别更准而总工作增加时，先改范围或分工；专业时间释放但没有相应需求时，可以讨论质量与容量价值，暂不宣称收入增加。这里先建立证据顺序，第12、13课再给评测和完整经济账。\n\n这种安排保留了未来选择：企业用较小投入获得信息，再决定是否追加。它也要求团队真的接受停止。任何结果都被解释为“还要继续投入”，试点就失去了投资纪律。\n\n## 比较项目时，避免一张总分表掩盖约束\n\n企业可能同时考虑报告生成、询价整理和自动售后。可以比较价值、实现条件、可验证性与采用责任，但不宜让一个综合分数覆盖决定性障碍。\n\n自动售后即使预期收益高，如果没有退款权限和异常责任安排，当前就不具备扩大执行的条件。报告生成即使容易制作，如果没有明确使用者，价值也仍是未知。先处理这些条件，再比较同样可进入的候选。\n\n项目之间还可能共享投入。客户身份整理可以同时服务询价和售后；一个通用评测工具可能支持多个助手。共享资产值得考虑，但应说明究竟被哪些工作采用，避免用“未来平台”解释无限范围。\n\n## 业务采用必须进入试点\n\n业务负责人需要投入实际时间：提供材料、核对结果、决定规则和观察使用。缺少这些条件，实施团队测到的只是技术可行性。\n\n可以提前约定一位流程负责人、两类真实使用岗位、材料范围和每周复盘时间。这里的重点是有人能够对跨岗位变化作决定。让每个员工各自试用，然后汇总满意度，难以判断整条业务是否改善。\n\n请为自己的试点写四句话：主要价值假设；本轮覆盖和排除的任务；最能改变投资判断的证据；出现什么情况停止或改道。[工作簿](https://zhongky1995.github.io/gaidn-fde-handbook/#workbook)提供可填写位置。\n\n范围清楚以后，需要把新旧工作方式作完整比较。下一课开始设计实际业务链。\n","text":"# 第7课｜怎样选择试点和投资顺序\n\n试点同时有两种产出：完成一部分工作，和让企业知道下一步值不值得做。投入有限时，能尽早回答关键不确定性的试点，往往比范围更大、演示更完整的方案有用。\n\n## 先写价值假设，再选范围\n\n案例A当前的假设是：在技术受理之前检查必要条件，可以减少往返，使专业人员完成更多有效判断。\n\n第一轮可以只覆盖替换适配询价的整理、缺项发现和补问建议。它仍需让真实岗位使用，但暂不承担最终选型与对外承诺。这样观察到的变化能较直接地对应价值假设。\n\n如果第一轮同时更换客户管理系统、调整价格和培训技术团队，即使报价变快，也很难解释哪项改动起主要作用。组合改造有时必要，但应承认归因范围相应变宽。\n\n## 好的试点需要可学习的任务分布\n\n只选择最干净的材料，容易得到漂亮结果；只选择最坏的任务，又可能误判可用范围。先弄清日常任务有哪些类型，再让试点覆盖常见、模糊和重要异常。\n\n对询价整理，普通完整请求、前后修改数量、旧新型号混用、资料缺失、跨客户旧单混淆，分别检验不同能力。严重错误的后果也不同：少写一个非关键备注，与把不确定交期变为正式承诺，不能等权处理。\n\n数量由风险、任务多样性和可取得材料决定。十几笔可以帮助发现明显机制问题，却很难证明罕见严重错误已经被控制。企业应写清本轮能回答什么，暂时回答不了什么。\n\n## 把试点视为分阶段投资\n\n第一阶段用有限材料判断能力是否值得继续；第二阶段让岗位在受控范围中使用，验证完整工作成本与采用；第三阶段才扩大连接和责任范围。\n\n每阶段应有继续、调整和停止的条件。例如：若缺项发现没有改善，先调整受理规则或放弃该用法；若整理有效但核对成本过高，缩小任务范围；若业务改善且能稳定运行，再评估库存查询和记录连接。\n\n在这个例子里，追加决定可以沿三层证据展开：先用有原始依据的请求，检查必要条件是否被正确识别；再让销售与技术实际使用，记录准备、核对、修改、追问的总工时及客户等待周期；最后查看释放的技术时间是否减少积压、支持更多有效交付或取消了实际支出，并计入新增运行与维护费用。比较应选同类请求、相同信息完整程度和完成标准的现行做法，避免把标准品与复杂适配混比。\n\n缺项识别更准而总工作增加时，先改范围或分工；专业时间释放但没有相应需求时，可以讨论质量与容量价值，暂不宣称收入增加。这里先建立证据顺序，第12、13课再给评测和完整经济账。\n\n这种安排保留了未来选择：企业用较小投入获得信息，再决定是否追加。它也要求团队真的接受停止。任何结果都被解释为“还要继续投入”，试点就失去了投资纪律。\n\n## 比较项目时，避免一张总分表掩盖约束\n\n企业可能同时考虑报告生成、询价整理和自动售后。可以比较价值、实现条件、可验证性与采用责任，但不宜让一个综合分数覆盖决定性障碍。\n\n自动售后即使预期收益高，如果没有退款权限和异常责任安排，当前就不具备扩大执行的条件。报告生成即使容易制作，如果没有明确使用者，价值也仍是未知。先处理这些条件，再比较同样可进入的候选。\n\n项目之间还可能共享投入。客户身份整理可以同时服务询价和售后；一个通用评测工具可能支持多个助手。共享资产值得考虑，但应说明究竟被哪些工作采用，避免用“未来平台”解释无限范围。\n\n## 业务采用必须进入试点\n\n业务负责人需要投入实际时间：提供材料、核对结果、决定规则和观察使用。缺少这些条件，实施团队测到的只是技术可行性。\n\n可以提前约定一位流程负责人、两类真实使用岗位、材料范围和每周复盘时间。这里的重点是有人能够对跨岗位变化作决定。让每个员工各自试用，然后汇总满意度，难以判断整条业务是否改善。\n\n请为自己的试点写四句话：主要价值假设；本轮覆盖和排除的任务；最能改变投资判断的证据；出现什么情况停止或改道。工作簿提供可填写位置。\n\n范围清楚以后，需要把新旧工作方式作完整比较。下一课开始设计实际业务链。\n"},{"file":"08-重设计业务链.md","id":"lesson-08","number":8,"role":"核心课","part":1,"title":"第8课｜重设计一条完整业务链","md":"# 第8课｜重设计一条完整业务链\n\nAI进入流程后，组织不能只增加一个“生成”按钮。原来的整理、判断、批准、执行和追责可能重新分配，有些动作可以退出，有些动作需要新增。\n\n业务设计要说明这些变化如何共同完成客户任务。\n\n## 先找到业务对象\n\n在案例A里，整个过程围绕同一笔询价展开。客户原话、候选需求、技术确认、库存预留、报价版本和发送记录，都需要关联到它。否则，某份正确回答仍可能被用到错误客户或旧版本上。\n\n对象可以理解为企业持续追踪的一件业务事物。围绕对象保存事实与变化，比围绕一次对话保存所有信息，更容易让不同岗位合作。一段对话可以涉及多个订单，一笔订单也可能跨多段对话。\n\n## 把不同性质的信息分开\n\n客户希望周五到货，是需求；模型判断M40-H可能适合，是建议；技术负责人批准适配，是专业决定；库存已预留，是执行结果；企业发出的交期，是对外承诺。\n\n如果都写在“备注”里，下游必须反复解释。可以为它们分别保留依据、负责人和状态。例如“候选型号”“已确认型号”“交期意向”“已确认交期”。增加字段的目的，是使后续动作知道该相信什么、还缺什么。\n\n状态也要对应实际条件。“待技术确认”意味着已经提交了什么材料、谁应该处理；“可报价”意味着哪些前提已经满足。若状态只由员工随手选择，却没有共同定义，自动化会更难判断。\n\n## 安排AI、程序和人的工作\n\nAI适合处理本案例中的非标准表达，提出条件、候选和补问。程序适合按有效规则计算金额、检查必填条件、维护记录和执行已授权操作。人负责需要专业判断、利益取舍或企业授权的决定。\n\n这种划分可以随证据调整。某类判断如果已被明确规则覆盖，可以进一步程序化；某类AI判断若反复不可靠，可以缩小范围或交回人工。岗位名称不是永久边界，任务性质与后果更关键。\n\n对于库存，AI可以请求查询，但可用量由库存系统返回；对于金额，模型可以解释组成，计算应采用可核对的方法；对于承诺，系统先检查企业规定的证据和授权。这样，模型承担理解工作的同时，正式动作仍有清楚依据。\n\n## 设计人真正能够完成的核对\n\n“人工确认”必须落到具体界面与责任。销售核对需求时，应看到客户原话与提取结果；技术确认时，应看到工况、有效目录和缺项；批准时，应看到技术结论、资源回执及仍待确认的事项。\n\n如果确认者只能看到一份流畅正文，要求其承担全部错误责任，却不给原始依据，复核很容易变成形式。好的核对设计缩小注意范围，让人集中处理真正影响结果的差异。\n\n同时，岗位需要有拒绝、退回和修改的权利。只有“确认”按钮的流程，会把不确定性推向下游。\n\n## 明确哪些旧动作退出\n\n新流程若仍要求销售手工整理原表，又要求把AI结果填进新表，工作可能增加。团队应逐项说明：哪些复制、重复录入和重复追问可以退出，哪些因监管或业务要求仍须保留。\n\n也要记录新增工作：查看来源、处理异常、更新资料和复测。它们进入投入账，不能被藏在“员工适应一下”里。只有完整工作比较，才能判断净变化。\n\n## 用一次变化检验设计\n\n假设技术已批准M40-H，客户随后把接口从F2改成F3。系统应让受影响的技术确认回到待确认，暂停依赖该确认的报价批准，阻止继续按旧条件发布。取得新适配依据后，才可恢复对应批准。已经完成的库存预留是一项仍需核对的执行事实，由履约人员按新方案决定保留、调整或取消，不能因技术确认失效就假定预留已自动撤销。依据是原批准适用条件发生变化，而其他事实各有自己的有效条件。\n\n若流程只能追加一条聊天消息，却不能标出受影响决定，后续岗位可能继续发送旧报价。设计因此需要记录输入、确认和产物之间的关系。第10与14课将解释系统怎样支持这类持续工作。\n\n请把一笔任务画成“收到什么—谁处理—留下什么—谁接手”的链，再标出建议、决定、执行和承诺。检查其中一个输入变化时，哪些后续结果应重新确认。这张图将成为系统设计的业务依据。\n","html":"\u003ch1>第8课｜重设计一条完整业务链\u003c/h1>\n\u003cp>AI进入流程后，组织不能只增加一个“生成”按钮。原来的整理、判断、批准、执行和追责可能重新分配，有些动作可以退出，有些动作需要新增。\u003 实。\n\n![产品规则、当前库存回执和本次要求先进入本轮上下文；模型据此形成候选，再交对应岗位确认。资料取得与业务授权分别处理。](assets/任务信息.svg)\n\n## 用同一输入定位错误\n\n客户要求6套，系统查到4套可用、2套补货待确认。候选回答写成“6套周五交齐”。错误至少可能来自三处：补货状态根本没有进入模型；进入了却被错误理解；模型草稿正确，最终模板却把待确认日期替换成了周五。\n\n诊断时先保存实际输入、取得的材料和输出版本。如果库存查询没有返回，补更多解释文字不会产生事实；如果输入齐全而模型反复混淆状态，再比较任务设计、模型配置或训练；如果错误在模板和保存处，就修对应系统。\n\n这一步使“AI不准”变成可以定位的问题。它也避免把所有错误都归因于模型，或者假定换一个更强模型就能修复整条业务链。\n\n## 记忆怎样成为可靠的企业信息\n\n应用可以保存对话摘要、客户偏好、工作进度或长期资料，再在后续任务中读取。保存在哪里、何时采用、谁能修改，是应用设计的一部分。\n\n例如，系统记下“客户通常收货到甲厂”，可以减少重复询问，但新订单写明乙厂时，应采用本次有效要求。记忆需要知道它描述的是偏好、历史事实还是已批准规则。把三者混在一起，会让旧信息获得不应有的权威。\n\n长任务还需要保存已完成工作和未决事项。仅依赖不断增长的聊天，既难检查，也可能在摘要时丢失关键限制。更稳定的做法是维护业务记录、任务状态与依据，需要时将相关部分提供给模型。\n\n## 信息越多，判断也有成本\n\n过多无关、重复或相互矛盾的材料，会增加查找与误用机会。上下文设计要围绕当前任务选择足够信息，而不是每次携带整家公司。\n\n对于技术确认，关键可能是工况、产品版本和适配规则；对于报价批准，关键是已确认型号、金额、资源和授权。不同岗位接收不同材料，但通过同一任务身份和依据相连。这样既保留完整性，也减轻每次处理的负担。\n\n请在自己的方案中任选一个回答，指出它依赖的稳定规则、当前事实、历史偏好与本次要求分别来自哪里、怎样更新。若某一项只能回答“模型应该知道”，这就是需要进一步设计的位置。\n\n取得信息以后，还需要决定下一步做什么，并可靠地改变业务记录。下一课研究这段执行过程。\n","html":"\u003ch1>第9课｜模型怎样使用企业知识和当前事实\u003c/h1>\n\u003cp>企业说“让AI懂我们的业务”，可能指三种不同要求：知道产品规则，取得当前订单，或学会一种专业处理方法。它们进入系统的位置不同，更新方式也不同。\u003c/p>\n\u003cp>分清这些关系，才能判断方案究竟缺什么。\u003c/p>\n\u003ch2>模型已有能力，与本次可用信息\u003c/h2>\n\u003cp>模型经过训练形成参数，参数共同影响它怎样处理输入、生成回答。普通使用时，补充一份订单主要改变当前任务输入，通常不会立即改写这些参数。\u003c/p>\n\u003cp>运行中的输入常称为上下文，包含任务要求、资料、对话与工具返回。文字会被编码为Token等计算单位，模型在有限的上下文内处理它们之间的关系。Token可能是字、词的一部分或符号组合；上下文容量的增加，意味着一次能容纳更多材料，但不保证模型一定找到并正确使用每个条件。\u003c/p>\n\u003cp>企业需要安排哪些信息进入本次上下文。例如“按有效目录核对适配”，还需要告诉系统有效目录在哪里、版本是什么、当前请求有哪些条件。只把公司名称写进要求，不能建立这些关系。\u003c/p>\n\u003ch2>训练、检索和查询分别解决什么\u003c/h2>\n\u003cp>案例A中，可以把表达和判断方法写成任务说明，让模型按栏目处理材料；可以检索产品目录，把相关段落提供给模型；还可以通过库存工具查询当前可用量。三者分别提供方法、稳定知识和动态事实。\u003c/p>\n\u003cp>检索增强生成常称为RAG：系统先找相关材料，再把取得的内容交给模型生成回答。检索可能使用关键词、语义相似度和其他筛选方法。语义检索常把文字表示为可比较的数值，帮助发现表达不同但意义相近的材料；相近并不等于有效或适用。\u003c/p>\n\u003cp>假如搜索同时取得M40旧目录与M40-H新目录，系统还要依据产品身份、版本和适用条件选择。资料返回给模型时，应保留来源和有效范围，便于核对。把全部文件放进一个可搜索库，只完成了其中一段。\u003c/p>\n\u003cp>库存变化更频繁，直接从受控系统取得当前回执通常更有意义。即便昨天的库存文字已被完整检索，今天也可能不适用。查询结果仍有时间与使用条件，批准前能否复用，要按流程设计判断。\u003c/p>\n\u003cp>微调则使用专门样本继续训练模型，改变参数，可能帮助某类稳定任务的表现。它需要数据、评测和维护，也不能保证记住之后发生的每次库存变化。决定是否训练，应先确认问题确实出在处理能力，而非缺少当前事实。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzNjAgNjEwIiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiPjx0aXRsZT7kvIHkuJrotYTmlpnov5vlhaXmnKzova7ku7vliqHvvIzlho3lvaLmiJDlgJnpgInnu5Pmnpw8L3RpdGxlPjxkZXNjPuacieaViOS6p+WTgeinhOWImeOAgeW9k+WJjeW6k+WtmOWbnuaJp+WSjOWuouaIt+acrOasoeimgeaxguWFiOiiq+WPluW+l+W5tue7hOaIkOW9k+WJjei+k+WFpeOAguaooeWei+S9v+eUqOi+k+WFpeS6p+eUn+WAmemAieWSjOS+neaNru+8jOS4k+S4muS6uuWRmOmaj+WQjuehruiupOOAguWbvuS4reeahOeureWktOihqOekuuS/oeaBr+aPkOS+m++8jOS4jeihqOekuuaOiOadg+aIluiHquWKqOabtOaWsOOAgjwvZGVzYz48ZGVmcz48bWFya2VyIGlkPSJhIiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTBaIiBmaWxsPSIjMTc2MTViIi8+PC9tYXJrZXI+PC9kZWZzPjxyZWN0IHdpZHRoPSIzNjAiIGhlaWdodD0iNjEwIiByeD0iMTYiIGZpbGw9IiNmM2Y3ZjYiLz48dGV4dCB4PSIyMiIgeT0iMzgiIGZvbnQtc2l6ZT0iMjMiIGZpbGw9IiMxODJiMjkiIGZvbnQtd2VpZ2h0PSI2MDAiPuS/oeaBr+WFiOWPluW+l++8jOWGjeWPguS4juWIpOaWrTwvdGV4dD4KPGcgZm9udC1zaXplPSIxOCIgZmlsbD0iIzE4MmIyOSI+PHJlY3QgeD0iMjIiIHk9IjY0IiB3aWR0aD0iMzE2IiBoZWlnaHQ9IjE1NiIgcng9IjEwIiBmaWxsPSJ3aGl0ZSIgc3Ryb2tlPSIjMTc2MTViIiBzdHJva2Utd2lkdGg9IjEuNSIvPjx0ZXh0IHg9IjM4IiB5PSI5MiIgZm9udC13ZWlnaHQ9IjYwMCI+5LiJ5Liq5p2l5rqQ77yM5ZCE5pyJ5pyJ5pWI5p2h5Lu2PC90ZXh0PjxwYXRoIGQ9Ik0zOCAxMDZIMzIyTTM4IDE0M0gzMjJNMzggMTgwSDMyMiIgc3Ryb2tlPSIjYjRjYmM2Ii8+PHRleHQgeD0iMzgiIHk9IjEzMiI+6KeE5YiZPC90ZXh0Pjx0ZXh0IHg9IjEyMiIgeT0iMTMyIj7kuqflk4Hnm67lvZUgdjM8L3RleHQ+PHRleHQgeD0iMzgiIHk9IjE2OSI+5b2T5YmN5LqL5a6ePC90ZXh0Pjx0ZXh0IHg9IjEyMiIgeT0iMTY5Ij7lupPlrZjlm57miacgUzE3PC90ZXh0Pjx0ZXh0IHg9IjM4IiB5PSIyMDYiPuacrOasoeimgeaxgjwvdGV4dD48dGV4dCB4PSIxMjIiIHk9IjIwNiI+5a6i5oi36K+35rGC5LiO6KGl5YWFPC90ZXh0Pgo8cGF0aCBkPSJNMTgwIDIyMFYyNjQiIHN0cm9rZT0iIzE3NjE1YiIgc3Ryb2tlLXdpZHRoPSIyIiBtYXJrZXItZW5kPSJ1cmwoI2EpIi8+ 些关系。\n\n## 训练、检索和查询分别解决什么\n\n案例A中，可以把表达和判断方法写成任务说明，让模型按栏目处理材料；可以检索产品目录，把相关段落提供给模型；还可以通过库存工具查询当前可用量。三者分别提供方法、稳定知识和动态事实。\n\n检索增强生成常称为RAG：系统先找相关材料，再把取得的内容交给模型生成回答。检索可能使用关键词、语义相似度和其他筛选方法。语义检索常把文字表示为可比较的数值，帮助发现表达不同但意义相近的材料；相近并不等于有效或适用。\n\n假如搜索同时取得M40旧目录与M40-H新目录，系统还要依据产品身份、版本和适用条件选择。资料返回给模型时，应保留来源和有效范围，便于核对。把全部文件放进一个可搜索库，只完成了其中一段。\n\n库存变化更频繁，直接从受控系统取得当前回执通常更有意义。即便昨天的库存文字已被完整检索，今天也可能不适用。查询结果仍有时间与使用条件，批准前能否复用，要按流程设计判断。\n\n微调则使用专门样本继续训练模型，改变参数，可能帮助某类稳定任务的表现。它需要数据、评测和维护，也不能保证记住之后发生的每次库存变化。决定是否训练，应先确认问题确实出在处理能力，而非缺少当前事实。\n\n![产品规则、当前库存回执和本次要求先进入本轮上下文；模型据此形成候选，再交对应岗位确认。资料取得与业务授权分别处理。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzNjAgNjEwIiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiPjx0aXRsZT7kvIHkuJrotYTmlpnov5vlhaXmnKzova7ku7vliqHvvIzlho3lvaLmiJDlgJnpgInnu5Pmnpw8L3RpdGxlPjxkZXNjPuacieaViOS6p+WTgeinhOWImeOAgeW9k+WJjeW6k+WtmOWbnuaJp+WSjOWuouaIt+acrOasoeimgeaxguWFiOiiq+WPluW+l+W5tue7hOaIkOW9k+WJjei+k+WFpeOAguaooeWei+S9v+eUqOi+k+WFpeS6p+eUn+WAmemAieWSjOS+neaNru+8jOS4k+S4muS6uuWRmOmaj+WQjuehruiupOOAguWbvuS4reeahOeureWktOihqOekuuS/oeaBr+aPkOS+m++8jOS4jeihqOekuuaOiOadg+aIluiHquWKqOabtOaWsOOAgjwvZGVzYz48ZGVmcz48bWFya2VyIGlkPSJhIiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTBaIiBmaWxsPSIjMTc2MTViIi8+PC9tYXJrZXI+PC9kZWZzPjxyZWN0IHdpZHRoPSIzNjAiIGhlaWdodD0iNjEwIiByeD0iMTYiIGZpbGw9IiNmM2Y3ZjYiLz48dGV4dCB4PSIyMiIgeT0iMzgiIGZvbnQtc2l6ZT0iMjMiIGZpbGw9IiMxODJiMjkiIGZvbnQtd2VpZ2h0PSI2MDAiPuS/oeaBr+WFiOWPluW+l++8jOWGjeWPguS4juWIpOaWrTwvdGV4dD4KPGcgZm9udC1zaXplPSIxOCIgZmlsbD0iIzE4MmIyOSI+PHJlY3QgeD0iMjIiIHk9IjY0IiB3aWR0aD0iMzE2IiBoZWlnaHQ9IjE1NiIgcng9IjEwIiBmaWxsPSJ3aGl0ZSIgc3Ryb2tlPSIjMTc2MTViIiBzdHJva2Utd2lkdGg9IjEuNSIvPjx0ZXh0IHg9IjM4IiB5PSI5MiIgZm9udC13ZWlnaHQ9IjYwMCI+5LiJ5Liq5p2l5rqQ77yM5ZCE5pyJ5pyJ5pWI5p2h5Lu2PC90ZXh0PjxwYXRoIGQ9Ik0zOCAxMDZIMzIyTTM4IDE0M0gzMjJNMzggMTgwSDMyMiIgc3Ryb2tlPSIjYjRjYmM2Ii8+PHRleHQgeD0iM 可以定位的问题。它也避免把所有错误都归因于模型，或者假定换一个更强模型就能修复整条业务链。\n\n## 记忆怎样成为可靠的企业信息\n\n应用可以保存对话摘要、客户偏好、工作进度或长期资料，再在后续任务中读取。保存在哪里、何时采用、谁能修改，是应用设计的一部分。\n\n例如，系统记下“客户通常收货到甲厂”，可以减少重复询问，但新订单写明乙厂时，应采用本次有效要求。记忆需要知道它描述的是偏好、历史事实还是已批准规则。把三者混在一起，会让旧信息获得不应有的权威。\n\n长任务还需要保存已完成工作和未决事项。仅依赖不断增长的聊天，既难检查，也可能在摘要时丢失关键限制。更稳定的做法是维护业务记录、任务状态与依据，需要时将相关部分提供给模型。\n\n## 信息越多，判断也有成本\n\n过多无关、重复或相互矛盾的材料，会增加查找与误用机会。上下文设计要围绕当前任务选择足够信息，而不是每次携带整家公司。\n\n对于技术确认，关键可能是工况、产品版本和适配规则；对于报价批准，关键是已确认型号、金额、资源和授权。不同岗位接收不同材料，但通过同一任务身份和依据相连。这样既保留完整性，也减轻每次处理的负担。\n\n请在自己的方案中任选一个回答，指出它依赖的稳定规则、当前事实、历史偏好与本次要求分别来自哪里、怎样更新。若某一项只能回答“模型应该知道”，这就是需要进一步设计的位置。\n\n取得信息以后，还需要决定下一步做什么，并可靠地改变业务记录。下一课研究这段执行过程。\n","text":"# 第9课｜模型怎样使用企业知识和当前事实\n\n企业说“让AI懂我们的业务”，可能指三种不同要求：知道产品规则，取得当前订单，或学会一种专业处理方法。它们进入系统的位置不同，更新方式也不同。\n\n分清这些关系，才能判断方案究竟缺什么。\n\n## 模型已有能力，与本次可用信息\n\n模型经过训练形成参数，参数共同影响它怎样处理输入、生成回答。普通使用时，补充一份订单主要改变当前任务输入，通常不会立即改写这些参数。\n\n运行中的输入常称为上下文，包含任务要求、资料、对话与工具返回。文字会被编码为Token等计算单位，模型在有限的上下文内处理它们之间的关系。Token可能是字、词的一部分或符号组合；上下文容量的增加，意味着一次能容纳更多材料，但不保证模型一定找到并正确使用每个条件。\n\n企业需要安排哪些信息进入本次上下文。例如“按有效目录核对适配”，还需要告诉系统有效目录在哪里、版本是什么、当前请求有哪些条件。只把公司名称写进要求，不能建立这些关系。\n\n## 训练、检索和查询分别解决什么\n\n案例A中，可以把表达和判断方法写成任务说明，让模型按栏目处理材料；可以检索产品目录，把相关段落提供给模型；还可以通过库存工具查询当前可用量。三者分别提供方法、稳定知识和动态事实。\n\n检索增强生成常称为RAG：系统先找相关材料，再把取得的内容交给模型生成回答。检索可能使用关键词、语义相似度和其他筛选方法。语义检索常把文字表示为可比较的数值，帮助发现表达不同但意义相近的材料；相近并不等于有效或适用。\n\n假如搜索同时取得M40旧目录与M40-H新目录，系统还要依据产品身份、版本和适用条件选择。资料返回给模型时，应保留来源和有效范围，便于核对。把全部文件放进一个可搜索库，只完成了其中一段。\n\n库存变化更频繁，直接从受控系统取得当前回执通常更有意义。即便昨天的库存文字已被完整检索，今天也可能不适用。查询结果仍有时间与使用条件，批准前能否复用，要按流程设计判断。\n\n微调则使用专门样本继续训练模型，改变参数，可能帮助某类稳定任务的表现。它需要数据、评测和维护，也不能保证记住之后发生的每次库存变化。决定是否训练，应先确认问题确实出在处理能力，而非缺少当前事实。\n\n \n\n## 用同一输入定位错误\n\n客户要求6套，系统查到4套可用、2套补货待确认。候选回答写成“6套周五交齐”。错误至少可能来自三处：补货状态根本没有进入模型；进入了却被错误理解；模型草稿正确，最终模板却把待确认日期替换成了周五。\n\n诊断时先保存实际输入、取得的材料和输出版本。如果库存查询没有返回，补更多解释文字不会产生事实；如果输入齐全而模型反复混淆状态，再比较任务设计、模型配置或训练；如果错误在模板和保存处，就修对应系统。\n\n这一步使“AI不准”变成可以定位的问题。它也避免把所有错误都归因于模型，或者假定换一个更强模型就能修复整条业务链。\n\n## 记忆怎样成为可靠的企业信息\n\n应用可以保存对话摘要、客户偏好、工作进度或长期资料，再在后续任务中读取。保存在哪里、何时采用、谁能修改，是应用设计的一部分。\n\n例如，系统记下“客户通常收货到甲厂”，可以减少重复询问，但新订单写明乙厂时，应采用本次有效要求。记忆需要知道它描述的是偏好、历史事实还是已批准规则。把三者混在一起，会让旧信息获得不应有的权威。\n\n长任务还需要保存已完成工作和未决事项。仅依赖不断增长的聊天，既难检查，也可能在摘要时丢失关键限制。更稳定的做法是维护业务记录、任务状态与依据，需要时将相关部分提供给模型。\n\n## 信息越多，判断也有成本\n\n过多无关、重复或相互矛盾的材料，会增加查找与误用机会。上下文设计要围绕当前任务选择足够信息，而不是每次携带整家公司。\n\n对于技术确认，关键可能是工况、产品版本和适配规则；对于报价批准，关键是已确认型号、金额、资源和授权。不同岗位接收不同材料，但通过同一任务身份和依据相连。这样既保留完整性，也减轻每次处理的负担。\n\n请在自己的方案中任选一个回答，指出它依赖的稳定规则、当前事实、历史偏好与本次要求分别来自哪里、怎样更新。若某一项只能回答“模型应该知道”，这就是需要进一步设计的位置。\n\n取得信息以后，还需要决定下一步做什么，并可靠地改变业务记录。下一课研究这段执行过程。\n"},{"file":"10-工作流Agent与执行控制.md","id":"lesson-10","number":10,"role":"核心课","part":2,"title":"第10课｜工作流、Agent 与执行控制","md":"# 第10课｜工作流、Agent 与执行控制\n\n模型能够提出“查询库存、预留4套、起草报价”，只是产生了一份计划。要让它进入业务，应用必须接收这些要求，调用真实工具，判断回执，再决定是否继续。\n\n从计划到动作的这段设计，决定了AI系统可以承担多少责任。\n\n## 谁决定下一步\n\n如果流程顺序可以事先明确，例如整理需求、检查缺项、技术确认、核价、批准，就可以由程序规定主要路径，并在其中调用模型处理非标准信息。这通常称为工作流。\n\n如果任务需要根据发现动态选择下一步，例如调查一项复杂故障，系统可以让模型在约定范围内选择查询、分析和工具，再根据返回结果调整路径。这类由模型参与控制下一步的系统常被称为Agent。\n\n实际产品可能混合两种方式。询价受理可以采用固定流程，疑难资料检索则允许更多探索。企业要比较的是某段工作需要多少灵活性、能够容忍什么错误、能否观察和控制；名称不能替代设计。\n\n多Agent还会增加分工与协调：不同任务由不同实例承担，再汇总结果。它可能帮助独立研究或专业分工，也会增加上下文传递、冲突处理和成本。只有在任务能合理分解、质量收益大于协调代价时，这种安排才有依据。\n\n## 工具怎样使计划成为动作\n\n应用向模型描述可用工具：它能做什么、需要哪些参数、会返回什么。模型提出调用要求后，运行程序核对权限和输入，向真实系统发送请求，再把回执提供给后续处理。\n\n例如，查询工具接收产品身份，返回可用数量和时间；预留工具接收询价身份、产品和数量，返回成功、拒绝或待核查。模型知道工具的名称，并不意味着账号已被授权，或工具背后的系统已经连接。\n\nAPI可以理解为软件之间约定的调用入口。MCP等协议帮助以统一方式向AI应用提供工具和资源，但权限、参数含义和业务控制仍需具体实现。一个统一入口，不会自动把“查询”变成“有权承诺”。\n\n## 把不确定性停在适当位置\n\n需求理解可能有歧义，库存占用却需要明确结果。因此可以允许模型提出型号候选，把正式预留限制在经过确认的产品和数量上。\n\n金额计算、授权检查和记录保存也应有可核的规则。模型可以解释为什么建议这样做，但关键事实和允许动作由系统按既定条件检查。这使灵活处理与稳定控制可以同时存在。\n\n对于越过当前范围的请求，系统需要给出实际去向。例如缺少接口条件时，创建补问任务并交给销售；技术未确认时，阻止正式报价而保留草稿。仅返回“请人工处理”，如果没有接收人和材料，异常仍会悬空。\n\n## 为什么长任务需要运行框架\n\n一个任务可能跨多次模型调用、人员等待和外部系统。运行框架常被称为Harness，它安排任务状态、可用工具、工作产物、检查、恢复与日志，使工作在中断后还能继续。\n\n在询价中，技术负责人今天未答复，系统应保存“等待技术确认”与已整理材料；明天继续时从该状态恢复，核对资料是否变化。它不应重新猜测昨天是否完成，也不应把等待误报为失败。\n\n这样的框架包含常规软件工程，也包含适应模型行为的设计。企业不必追求某个特定框架，但需要知道持续执行依靠哪些记录和控制。\n\n## 一个容易忽略的状态：结果未知\n\n应用发送预留请求后，网络超时。可能请求没有到达，也可能库存系统已经预留成功，只是回执未返回。此时不能直接把超时解释为失败，再重复占用4套。\n\n可用系统应支持查询同一请求的结果，或使用稳定请求标识，使重复提交不会重复产生业务效果，这类设计常称为幂等。若外部系统不支持，就需要明确人工核查与恢复办法，并限制自动重试。\n\n![库存系统已经预留4套，但应用没有收到回复；应用通过同一请求身份查询到成功结果，再恢复任务，避免直接重复占用。](assets/结果未知.svg)\n\n“等待”“失败”“成功”“结果未知”对应不同动作。状态区分得越清楚，系统越容易从异常恢复，也越容易知道究竟给客户承诺过什么。\n\n请让实施团队演示一次回执丢失后的处理：系统在哪里查结果，依据什么恢复，谁看到未决任务。能正常完成一次，说明主路径存在；能解释这次异常，才开始看见实际执行设计。\n","html":"\u003ch1>第10课｜工作流、Agent 与执行控制\u003c/h1>\n\u003cp>模型能够提出“查询库存、预留4套、起草报价”，只是产生了一份计划。要让它进入业务，应用必须接收这些要求，调用真实工具，判断回执，再决定是否继续。\u003c/p>\n\u003cp>从计划到动作的这段设计，决定了AI系统可以承担多少责任。\u003c/p>\n\u003ch2>谁决定下一步\u003c/h2>\n\u003cp>如果流程顺序可以事先明确，例如整理需求、检查缺项、技术确认、核价、批准，就可以由程序规定主要路径，并在其中调用模型处理非标准信息。这通常称为工作流。\u003c/p>\n\u003cp>如果任务需要根据发现动态选择下一步，例如调查一项复杂故障，系统可以让模型在约定范围内选择查询、分析和工具，再根据返回结果调整路径。这类由模型参与控制下一步的系统常被称为Agent。\u003c/p>\n\u003cp>实际产品可能混合两种方式。询价受理可以采用固定流程，疑难资料检索则允许更多探索。企业要比较的是某段工作需要多少灵活性、能够容忍什么错误、能否观察和控制；名称不能替代设计。\u003c/p>\n\u003cp>多Agent还会增加分工与协调：不同任务由不同实例承担，再汇总结果。它可能帮助独立研究或专业分工，也会增加上下文传递、冲突处理和成本。只有在任务能合理分解、质量收益大于协调代价时，这种安排才有依据。\u003c/p>\n\u003ch2>工具怎样使计划成为动作\u003c/h2>\n\u003cp>应用向模型描述可用工具：它能做什么、需要哪些参数、会返回什么。模型提出调用要求后，运行程序核对权限和输入，向真实系统发送请求，再把回执提供给后续处理。\u003c/p>\n\u003cp>例如，查询工具接收产品身份，返回可用数量和时间；预留工具接收询价身份、产品和数量，返回成功、拒绝或待核查。模型知道工具的名称，并不意味着账号已被授权，或工具背后的系统已经连接。\u003c/p>\n\u003cp>API可以理解为软件之间约定的调用入口。MCP等协议帮助以统一方式向AI应用提供工具和资源，但权限、参数含义和业务控制仍需具体实现。一个统一入口，不会自动把“查询”变成“有权承诺”。\u003c/p>\n\u003ch2>把不确定性停在适当位置\u003c/h2>\n\u003cp>需求理解可能有歧义，库存占用却需要明确结果。因此可以允许模型提出型号候选，把正式预留限制在经过确认的产品和数量上。\u003c/p>\n\u003cp>金额计算、授权检查和记录保存也应有可核的规则。模型可以解释为什么建议这样做，但关键事实和允许动作由系统按既定条件检查。这使灵活处理与稳定控制可以同时存在。\u003c/p>\n\u003cp>对于越过当前范围的请求，系统需要给出实际去向。例如缺少接口条件时，创建补问任务并交给销售；技术未确认时，阻止正式报价而保留草稿。仅返回“请人工处理”，如果没有接收人和材料，异常仍会悬空。\u003c/p>\n\u003ch2>为什么长任务需要运行框架\u003c/h2>\n\u003cp>一个任务可能跨多次模型调用、人员等待和外部系统。运行框架常被称为Harness，它安排任务状态、可用工具、工作产物、检查、恢复与日志，使工作在中断后还能继续。\u003c/p>\n\u003cp>在询价中，技术负责人今天未答复，系统应保存“等待技术确认”与已整理材料；明天继续时从该状态恢复，核对资料是否变化。它不应重新猜测昨天是否完成，也不应把等待误报为失败。\u003c/p>\n\u003cp>这样的框架包含常规软件工程，也包含适应模型行为的设计。企业不必追求某个特定框架，但需要知道持续执行依靠哪些记录和控制。\u003c/p>\n\u003ch2>一个容易忽略的状态：结果未知\u003c/h2>\n\u003cp>应用发送预留请求后，网络超时。可能请求没有到达，也可能库存系统已经预留成功，只是回执未返回。此时 技术确认、核价、批准，就可以由程序规定主要路径，并在其中调用模型处理非标准信息。这通常称为工作流。\n\n如果任务需要根据发现动态选择下一步，例如调查一项复杂故障，系统可以让模型在约定范围内选择查询、分析和工具，再根据返回结果调整路径。这类由模型参与控制下一步的系统常被称为Agent。\n\n实际产品可能混合两种方式。询价受理可以采用固定流程，疑难资料检索则允许更多探索。企业要比较的是某段工作需要多少灵活性、能够容忍什么错误、能否观察和控制；名称不能替代设计。\n\n多Agent还会增加分工与协调：不同任务由不同实例承担，再汇总结果。它可能帮助独立研究或专业分工，也会增加上下文传递、冲突处理和成本。只有在任务能合理分解、质量收益大于协调代价时，这种安排才有依据。\n\n## 工具怎样使计划成为动作\n\n应用向模型描述可用工具：它能做什么、需要哪些参数、会返回什么。模型提出调用要求后，运行程序核对权限和输入，向真实系统发送请求，再把回执提供给后续处理。\n\n例如，查询工具接收产品身份，返回可用数量和时间；预留工具接收询价身份、产品和数量，返回成功、拒绝或待核查。模型知道工具的名称，并不意味着账号已被授权，或工具背后的系统已经连接。\n\nAPI可以理解为软件之间约定的调用入口。MCP等协议帮助以统一方式向AI应用提供工具和资源，但权限、参数含义和业务控制仍需具体实现。一个统一入口，不会自动把“查询”变成“有权承诺”。\n\n## 把不确定性停在适当位置\n\n需求理解可能有歧义，库存占用却需要明确结果。因此可以允许模型提出型号候选，把正式预留限制在经过确认的产品和数量上。\n\n金额计算、授权检查和记录保存也应有可核的规则。模型可以解释为什么建议这样做，但关键事实和允许动作由系统按既定条件检查。这使灵活处理与稳定控制可以同时存在。\n\n对于越过当前范围的请求，系统需要给出实际去向。例如缺少接口条件时，创建补问任务并交给销售；技术未确认时，阻止正式报价而保留草稿。仅返回“请人工处理”，如果没有接收人和材料，异常仍会悬空。\n\n## 为什么长任务需要运行框架\n\n一个任务可能跨多次模型调用、人员等待和外部系统。运行框架常被称为Harness，它安排任务状态、可用工具、工作产物、检查、恢复与日志，使工作在中断后还能继续。\n\n在询价中，技术负责人今天未答复，系统应保存“等待技术确认”与已整理材料；明天继续时从该状态恢复，核对资料是否变化。它不应重新猜测昨天是否完成，也不应把等待误报为失败。\n\n这样的框架包含常规软件工程，也包含适应模型行为的设计。企业不必追求某个特定框架，但需要知道持续执行依靠哪些记录和控制。\n\n## 一个容易忽略的状态：结果未知\n\n应用发送预留请求后，网络超时。可能请求没有到达，也可能库存系统已经预留成功，只是回执未返回。此时不能直接把超时解释为失败，再重复占用4套。\n\n可用系统应支持查询同一请求的结果，或使用稳定请求标识，使重复提交不会重复产生业务效果，这类设计常称为幂等。若外部系统不支持，就需要明确人工核查与恢复办法，并限制自动重试。\n\n![库存系统已经预留4套，但应用没有收到回复；应用通过同一请求身份查询到成功结果，再恢复任务，避免直接重复占用。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzNjAgNTkwIiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiPjx0aXRsZT7lm57miafkuKLlpLHml7bvvIzlhYjmn6Xor6LlkIzkuIDor7fmsYLnmoTnu5Pmnpw8L3RpdGxlPjxkZXNjPuW6lOeUqOWQkeW6k+WtmOezu+e7n+ivt+axgumihOeVmTTlpZfvvIzlupPlrZjns7vnu5/lt7Lnu4/miafooYzkvYblm57miafmnKrliLDlupTnlKjjgILlupTnlKjml6Dms5Xnm7TmjqXmlq3lrprlpLHotKXvvIzpgJrov4flkIzkuIDor7fmsYLouqvku73mn6Xor6LvvIzmlLbliLDlt7LmiJDlip/nu5PmnpzlkI7mgaLlpI3vvIzkuI3ph43lpI3ljaDnlKjjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYSIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZP "text":"# 第10课｜工作流、Agent 与执行控制\n\n模型能够提出“查询库存、预留4套、起草报价”，只是产生了一份计划。要让它进入业务，应用必须接收这些要求，调用真实工具，判断回执，再决定是否继续。\n\n从计划到动作的这段设计，决定了AI系统可以承担多少责任。\n\n## 谁决定下一步\n\n如果流程顺序可以事先明确，例如整理需求、检查缺项、技术确认、核价、批准，就可以由程序规定主要路径，并在其中调用模型处理非标准信息。这通常称为工作流。\n\n如果任务需要根据发现动态选择下一步，例如调查一项复杂故障，系统可以让模型在约定范围内选择查询、分析和工具，再根据返回结果调整路径。这类由模型参与控制下一步的系统常被称为Agent。\n\n实际产品可能混合两种方式。询价受理可以采用固定流程，疑难资料检索则允许更多探索。企业要比较的是某段工作需要多少灵活性、能够容忍什么错误、能否观察和控制；名称不能替代设计。\n\n多Agent还会增加分工与协调：不同任务由不同实例承担，再汇总结果。它可能帮助独立研究或专业分工，也会增加上下文传递、冲突处理和成本。只有在任务能合理分解、质量收益大于协调代价时，这种安排才有依据。\n\n## 工具怎样使计划成为动作\n\n应用向模型描述可用工具：它能做什么、需要哪些参数、会返回什么。模型提出调用要求后，运行程序核对权限和输入，向真实系统发送请求，再把回执提供给后续处理。\n\n例如，查询工具接收产品身份，返回可用数量和时间；预留工具接收询价身份、产品和数量，返回成功、拒绝或待核查。模型知道工具的名称，并不意味着账号已被授权，或工具背后的系统已经连接。\n\nAPI可以理解为软件之间约定的调用入口。MCP等协议帮助以统一方式向AI应用提供工具和资源，但权限、参数含义和业务控制仍需具体实现。一个统一入口，不会自动把“查询”变成“有权承诺”。\n\n## 把不确定性停在适当位置\n\n需求理解可能有歧义，库存占用却需要明确结果。因此可以允许模型提出型号候选，把正式预留限制在经过确认的产品和数量上。\n\n金额计算、授权检查和记录保存也应有可核的规则。模型可以解释为什么建议这样做，但关键事实和允许动作由系统按既定条件检查。这使灵活处理与稳定控制可以同时存在。\n\n对于越过当前范围的请求，系统需要给出实际去向。例如缺少接口条件时，创建补问任务并交给销售；技术未确认时，阻止正式报价而保留草稿。仅返回“请人工处理”，如果没有接收人和材料，异常仍会悬空。\n\n## 为什么长任务需要运行框架\n\n一个任务可能跨多次模型调用、人员等待和外部系统。运行框架常被称为Harness，它安排任务状态、可用工具、工作产物、检查、恢复与日志，使工作在中断后还能继续。\n\n在询价中，技术负责人今天未答复，系统应保存“等待技术确认”与已整理材料；明天继续时从该状态恢复，核对资料是否变化。它不应重新猜测昨天是否完成，也不应把等待误报为失败。\n\n这样的框架包含常规软件工程，也包含适应模型行为的设计。企业不必追求某个特定框架，但需要知道持续执行依靠哪些记录和控制。\n\n## 一个容易忽略的状态：结果未知\n\n应用发送预留请求后，网络超时。可能请求没有到达，也可能库存系统已经预留成功，只是回执未返回。此时不能直接把超时解释为失败，再重复占用4套。\n\n可用系统应支持查询同一请求的结果，或使用稳定请求标识，使重复提交不会重复产生业务效果，这类设计常称为幂等。若外部系统不支持，就需要明确人工核查与恢复办法，并限制自动重试。\n\n \n\n“等待”“失败”“成功”“结果未知”对应不同动作。状态区分得越清楚，系统越容易从异常恢复，也越容易知道究竟给客户承诺过什么。\n\n请让实施团队演示一次回执丢失后的处理：系统在哪里查结果，依据什么恢复，谁看到未决任务。能正常完成一次，说明主路径存在；能解释这次异常，才开始看见实际执行设计。\n"},{"file":"11-从原型到企业系统.md","id":"lesson-11","number":11,"role":"核心课","part":2,"title":"第11课｜从原型到可以接手的企业系统","md":"# 第11课｜从原型到可以接手的企业系统\n\nAI编程让企业更容易做出能操作的原型：一个需求整理界面、一套客户查询、一个报告工作台。变化很有意义，因为业务人员可以更早看到方案，也更早发现自己原先没有说清的条件。\n\n但软件制作成本只是完整供给成本的一部分。企业仍需要决定长期由什么承载业务、怎样运行，以及谁能维护。\n\n## 原型要验证哪一种不确定性\n\n若不知道员工能否理解新分工，原型可以先验证页面、材料和操作顺序；若不知道模型能否理解非标准请求，可以先用固定材料检验输出；若不知道系统能否可靠写入，就必须真实连接受控测试环境。\n\n这三类验证可以分开开展。使用模拟数据的界面能帮助确认业务设计，但不能证明真实权限可用；直接调用模型可以检验处理能力，但不能证明同事能在日常系统里采用。\n\n每次展示应说明当前实际发生了什么。业务人员由此才能判断哪些问题已得到证据，哪些还需要实现。\n\n## 企业应用包含哪些相互依赖的部分\n\n围绕询价，至少可以辨认出六类职责：员工提交和核对材料的界面；解释与生成的模型；有效知识和当前数据；决定流程、权限与状态的应用；执行查询、预留和发送的连接；保存证据及观察运行的记录。\n\n它们可以由一个产品提供，也可以分布在现有系统与新功能中。课程不要求增加六套软件，而是帮助企业在方案中找到这些职责。\n\n例如，已有客户系统负责询价身份与正式记录，新功能只承担材料整理和确认界面，库存仍由原系统管理。这种安排可以保留既有事实源，减少同步。若为了新助手又复制一套库存，需要解释两处发生冲突时以哪里为准。\n\n## AI编程改变了哪些成本\n\n编写常规界面、转换文件格式和制作接口代码，部分工作可以更快完成。原型反馈也可能缩短需求往返。但业务规则没有确定、外部系统权限无法取得、错误后果无人负责，这些问题不会因为代码生成加速而自行解决。\n\n代码越容易产生，企业越需要明确可维护边界。重复生成多个相近工具，可能增加登录、数据复制、版本与维护负担。判断标准是业务能否更容易完成，而非新功能数量。\n\n对FDE，这意味着亲手实现的能力更容易与现场观察结合，同时也要求对产物负责：代码和配置是否可追溯，依赖能否运行，测试覆盖了什么，下一位人员如何继续。\n\n## 怎样比较采购、配置与自建\n\n成熟通用产品适合覆盖稳定共性，配置和连接可以适应一部分企业差异。定制实现适合重要且难以被现有产品覆盖的工作，但需要企业承担更多维护与治理。\n\n比较时，把同一个业务任务交给各候选：材料怎样进入，谁能查看，如何核对，能否连接当前记录，异常怎样处理，数据与配置如何带走。只有任务范围一致，报价与投入才可比较。\n\n如果短期差异主要是几项表单和规则，先配置可能足够；如果差异决定企业核心服务，且需要持续试验，自建或联合建设可能更合适。现有团队能力、时间和切换成本也应进入判断。选择可以分层，例如采购通用模型能力，自建业务规则与评测。\n\n## 用交接试验检查系统边界\n\n请一位没有参与开发的人，使用交付说明完成四件事：处理一笔正常任务；解释一笔失败；更新一条业务规则并验证；在受控条件下恢复一次中断。\n\n如果做不到，先看缺少什么：账号与权限、配置说明、资料维护入口、测试样本、部署方式或异常手册。文档不是越多越好，应能支持这些实际动作。\n\n进入生产前，还要形成有效版本。谁批准了哪些规则，采用哪个模型和工具配置，哪些场景经过检验，哪些任务仍需人工，均应能对应到当前运行系统。下一课将说明这些检验怎样设计，才能服务采用决定。\n","html":"\u003ch1>第11课｜从原型到可以接手的企业系统\u003c/h1>\n\u003cp>AI编程让企业更容易做出能操作的原型：一个需求整理界面、一套客户查询、一个报告工作台。变化很有意义，因为业务人员可以更早看到方案，也更早发现自己原先没有说清的条件。\u003c/p>\n\u003cp>但软件制作成本只是完整供给成本的一部分。企业仍需要决定长期由什么承载业务、怎样运行，以及谁能维护。\u003c/p>\n\u003ch2>原型要验证哪一种不确定性\u003c/h2>\n\u003cp>若不知道员工能否理解新分工，原型可以先验证页面、材料和操作顺序；若不知道模型能否理解非标准请求，可以先用固定材料检验输出；若不知道系统能否可靠写入，就必须真实连接受控测试环境。\u003c/p>\n\u003cp>这三类验证可以分开开展。使用模拟数据的界面能帮助确认业务设计，但不能证明真实权限可用；直接调用模型可以检验处理能力，但不能证明同事能在日常系统里采用。\u003c/p>\n\u003cp>每次展示应说明当前实际发生了什么。业务人员由此才能判断哪些问题已得到证据，哪些还需要实现。\u003c/p>\n\u003ch2>企业应用包含哪些相互依赖的部分\u003c/h2>\n\u003cp>围绕询价，至少可以辨认出六类职责：员工提交和核对材料的界面；解释与生成的模型；有效知识和当前数据；决定流程、权限与状态的应用；执行查询、预留和发送的连接；保存证据及观察运行的记录。\u003c/p>\n\u003cp>它们可以由一个产品提供，也可以分布在现有系统与新功能中。课程不要求增加六套软件，而是帮助企业在方案中找到这些职责。\u003c/p>\n\u003cp>例
