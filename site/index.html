const COURSE={"pages":[{"file":"00-导学.md","id":"intro","number":0,"role":"导学","part":-1,"title":"企业 AI 转型与 FDE","md":"# 企业 AI 转型与 FDE\n\n一家烘焙连锁的主打点心很早就卖完，工坊却还有可以生产的时间。门店没有货，也就不再推广这款商品；总部只看到已经发生的销量，下一轮仍按较低数量排产。企业看起来每天都在完成工作，却可能一直错过本来有能力满足的需求。\n\n类似问题也会出现在其他业务里：报价单生成更快，产品适配和供货却没有确认，客户仍等不到能用的方案；AI写出更多文章，专家来不及核验，能交付的数量没有增加。要理解AI怎样改变企业，需要把这些原来分开管理的事情重新放到一起。\n\n如果AI只用于加快原来的一个动作，企业可能只得到一张更快的日报。把客户、专业判断、生产资源和结果重新连接起来，它才有机会帮助企业发现系统性问题，发展自己的方法，并创造新的增长。\n\n这门课从企业经营与能力发展看FDE。FDE是Forward Deployed Engineer，通常译为前线部署工程师，核心是靠近现场，把认识做成可用工程，再由真实采用继续修正。AI提供通用智能，企业提供自身事实、经验和生产条件，二者在连续工作中共同发展。\n\n## 四组案例，各自面对什么生意\n\n| 案例 | 要看清的经营矛盾 | 从哪里读 |\n|---|---|---|\n| 连锁烘焙 | 缺货、排产、推介与需求反馈怎样共同压住增长 | [完整案例A](案例A-连锁备货.md) |\n| 工业品选型报价 | 多次交接怎样损失期限、订单和毛利，AI怎样放大适配判断 | [完整案例B](案例B-智能资源成本.md) |\n| 设备售后 | 经验、准备和派工怎样影响复访，能力如何跨人接任 | [完整案例C](案例C-设备售后.md) |\n| 工业品牌内容服务 | 生成扩产与专业瓶颈、客户付费需求和新服务怎样连接 | [完整案例D](案例D-专业服务.md) |\n\n四组企业和业务数字为教学构造。收益比较给出需求、成本、产能和采用条件，可以改变条件重新推演；公开研究另注明出处。案例不代表真实客户已经取得相应收益。\n\n## 全课要逐步回答的四件事\n\n第一，经验为什么难留下，AI怎样让更多自然工作材料进入下一次判断。会区分事件、解释、方法、组织能力与竞争优势，研究如何从生产开始形成积累。\n\n第二，FDE怎样找到企业真正有客户价值的差异，连同执行与纠错一起放大。企业不必处处定制，而应知道自己的能力怎样发生作用。\n\n第三，技术和产业仍在变化，企业怎样边采用边发展有自身特色的AI。长期工程、内部吸收和阶段选择，需要在持续工作里共同形成。\n\n第四，怎样经营可调度智能资源。token投入怎样形成合格工作，工作怎样兑现客户和经营结果，本轮又怎样留下未来能力；模型、人员、容量和维护都在同一条链中。\n\n## 怎样沿40章前进\n\n不要求先会软件开发。课程假定你熟悉人员、业务和经营取舍，新概念放在具体工作中解释。\n\n| 部分 | 主要判断 | 起点 |\n|---|---|---|\n| 变化 | 新智能供给怎样传到成本、分工和竞争 | [第1章](01-智能供给.md) |\n| 积累 | 经验怎样在生产中成为下一次能用的能力 | [第5章](05-从经验到能力.md) |\n| 优势与现场 | 哪种差异值得发展，FDE怎样发现和实现 | [第11章](11-客户认可的价值.md) |\n| 智能伙伴 | 持续职责、分工、信息与实际行动 | [第17章](17-智能伙伴的持续职责.md) |\n| 智能资源经营 | 配置、整链产能、成本和能力留存 | [第23章](23-token与智能资源.md) |\n| 证据与更新 | 任务合格、业务有效、组织学会及纠错 | [第29章](29-任务质量.md) |\n| 组织与共建 | 岗位、长期FDE、内部承担和迁移 | [第33章](33-岗位权责与激励.md) |\n| 持续发展 | 路线、新产品、行业节奏与完整提案 | [第37章](37-阶段发展路线.md) |\n\n顺序阅读可形成完整判断，也可以从自己的问题进入，再补前置材料。每章只展开与该问题有关的案例部分，完整条件在四份案例中汇总。目录、搜索和概念回查帮助定位，不以填写作业阻止继续阅读。\n\n最终用[改造提案工作簿](工作簿-改造提案.md)把一条真实业务写完整：客户为什么需要，问题如何发生，几种选择谁更好，AI与FDE分别做什么，结果怎样检验，谁持续承担，以及什么证据会改变下一步。\n\n从[第1章](01-智能供给.md)进入这条路线。\n","html":"\u003ch1>企业 AI 转型与 FDE\u003c/h1>\n\u003cp>一家烘焙连锁的主打点心很早就卖完，工坊却还有可以生产的时间。门店没有货，也就不再推广这款商品；总部只看到已经发生的销量，下一轮仍按较低数量排产。企业看起来每天都在完成工作，却可能一直错过本来有能力满足的需求。\u003c/p>\n\u003cp>类似问题也会出现在其他业务里：报价单生成更快，产品适配和供货却没有确认，客户仍等不到能用的方案；AI写出更多文章，专家来不及核验，能交付的数量没有增加。要理解AI怎样改变企业，需要把这些原来分开管理的事情重新放到一起。\u003c/p>\n\u003cp>如果AI只用于加快原来的一个动作，企业可能只得到一张更快的日报。把客户、专业判断、生产资源和结果重新连接起来，它才有机会帮助企业发现系统性问题，发展自己的方法，并创造新的增长。\u003c/p>\n\u003cp>这门课从企业经营与能力发展看FDE。FDE是Forward Deployed Engineer，通常译为前线部署工程师，核心是靠近现场，把认识做成可用工程，再由真实采用继续修正。AI提供通用智能，企业提供自身事实、经验和生产条件，二者在连续工作中共同发展。\u003c/p>\n\u003ch2 id=\"intro-section-1\">四组案例，各自面对什么生意\u003c/h2>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>案例\u003c/th>\n\u003cth>要看清的经营矛盾\u003c/th>\n\u003cth>从哪里读\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>连锁烘焙\u003c/td>\n\u003ctd>缺货、排产、推介与需求反馈怎样共同压住增长\u003c/td>\n\u003ctd>\u003ca href=\"#case-a\">完整案例A\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工业品选型报价\u003c/td>\n\u003ctd>多次交接怎样损失期限、订单和毛利，AI怎样放大适配判断\u003c/td>\n\u003ctd>\u003ca href=\"#case-b\">完整案例B\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>设备售后\u003c/td>\n\u003ctd>经验、准备和派工怎样影响复访，能力如何跨人接任\u003c/td>\n\u003ctd>\u003ca href=\"#case-c\">完整案例C\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工业品牌内容服务\u003c/td>\n\u003ctd>生成扩产与专业瓶颈、客户付费需求和新服务怎样连接\u003c/td>\n\u003ctd>\u003ca href=\"#case-d\">完整案例D\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>四组企业和业务数字为教学构造。收益比较给出需求、成本、产能和采用条件，可以改变条件重新推演；公开研究另注明出处。案例不代表真实客户已经取得相应收益。\u003c/p>\n\u003ch2 id=\"intro-section-2\">全课要逐步回答的四件事\u003c/h2>\n\u003cp>第一，经验为什么难留下，AI怎样让更多自然工作材料进入下一次判断。会区分事件、解释、方法、组织能力与竞争优势，研究如何从生产开始形成积累。\u003c/p>\n\u003cp>第二，FDE怎样找到企业真正有客户价值的差异，连同执行与纠错一起放大。企业不必处处定制，而应知道自己的能力怎样发生作用。\u003c/p>\n\u003cp>第三，技术和产业仍在变化，企业怎样边采用边发展有自身特色的AI。长期工程、内部吸收和阶段选择，需要在持续工作里共同形成。\u003c/p>\n\u003cp>第四，怎样经营可调度智能资源。token投入怎样形成合格工作，工作怎样兑现客户和经营结果，本轮又怎样留下未来能力；模型、人员、容量和维护都在同一条链中。\u003c/p>\n\u0 看起来每天都在完成工作，却可能一直错过本来有能力满足的需求。\n\n类似问题也会出现在其他业务里：报价单生成更快，产品适配和供货却没有确认，客户仍等不到能用的方案；AI写出更多文章，专家来不及核验，能交付的数量没有增加。要理解AI怎样改变企业，需要把这些原来分开管理的事情重新放到一起。\n\n如果AI只用于加快原来的一个动作，企业可能只得到一张更快的日报。把客户、专业判断、生产资源和结果重新连接起来，它才有机会帮助企业发现系统性问题，发展自己的方法，并创造新的增长。\n\n这门课从企业经营与能力发展看FDE。FDE是Forward Deployed Engineer，通常译为前线部署工程师，核心是靠近现场，把认识做成可用工程，再由真实采用继续修正。AI提供通用智能，企业提供自身事实、经验和生产条件，二者在连续工作中共同发展。\n\n## 四组案例，各自面对什么生意\n\n| 案例 | 要看清的经营矛盾 | 从哪里读 |\n|---|---|---|\n| 连锁烘焙 | 缺货、排产、推介与需求反馈怎样共同压住增长 | [完整案例A](https://zhongky1995.github.io/gaidn-fde-handbook/#case-a) |\n| 工业品选型报价 | 多次交接怎样损失期限、订单和毛利，AI怎样放大适配判断 | [完整案例B](https://zhongky1995.github.io/gaidn-fde-handbook/#case-b) |\n| 设备售后 | 经验、准备和派工怎样影响复访，能力如何跨人接任 | [完整案例C](https://zhongky1995.github.io/gaidn-fde-handbook/#case-c) |\n| 工业品牌内容服务 | 生成扩产与专业瓶颈、客户付费需求和新服务怎样连接 | [完整案例D](https://zhongky1995.github.io/gaidn-fde-handbook/#case-d) |\n\n四组企业和业务数字为教学构造。收益比较给出需求、成本、产能和采用条件，可以改变条件重新推演；公开研究另注明出处。案例不代表真实客户已经取得相应收益。\n\n## 全课要逐步回答的四件事\n\n第一，经验为什么难留下，AI怎样让更多自然工作材料进入下一次判断。会区分事件、解释、方法、组织能力与竞争优势，研究如何从生产开始形成积累。\n\n第二，FDE怎样找到企业真正有客户价值的差异，连同执行与纠错一起放大。企业不必处处定制，而应知道自己的能力怎样发生作用。\n\n第三，技术和产业仍在变化，企业怎样边采用边发展有自身特色的AI。长期工程、内部吸收和阶段选择，需要在持续工作里共同形成。\n\n第四，怎样经营可调度智能资源。token投入怎样形成合格工作，工作怎样兑现客户和经营结果，本轮又怎样留下未来能力；模型、人员、容量和维护都在同一条链中。\n\n## 怎样沿40章前进\n\n不要求先会软件开发。课程假定你熟悉人员、业务和经营取舍，新概念放在具体工作中解释。\n\n| 部分 | 主要判断 | 起点 |\n|---|---|---|\n| 变化 | 新智能供给怎样传到成本、分工和竞争 | [第1章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-01) |\n| 积累 | 经验怎样在生产中成为下一次能用的能力 | [第5章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-05) |\n| 优势与现场 | 哪种差异值得发展，FDE怎样发现和实现 | [第11章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-11) |\n| 智能伙伴 | 持续职责、分工、信息与实际行动 | [第17章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-17) |\n| 智能资源经营 | 配置、整链产能、成本和能力留存 | [第23章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-23) |\n| 证据与更新 | 任务合格、业务有效、组织学会及纠错 | [第29章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-29) |\n| 组织与共建 | 岗位、长期FDE、内部承担和迁移 | [第33章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-33) |\n| 持续发展 | 路线、新产品、行业节奏与完整提案 | [第37章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-37) |\n\n顺序阅读可形成完整判断，也可以从自己的问题进入，再补前置材料。每章只展开与该问题有关的案例部分，完整条件在四份案例中汇总。目录、搜索和概念回查帮助定位，不以填写作业阻止继续阅读。\n\n最终用[改造提案工作簿](https://zhongky1995.github.io/gaidn-fde-handbook/#workbook)把一条真实业务写完整：客户为什么需要，问题如何发生，几种选择谁更好，AI与FDE分别做什么，结果怎样检验，谁持续承担，以及什么证据会改变下一步。\n\n从[第1章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-01)进入这条路线。\n","text":"# 企业 AI 转型与 FDE\n\n一家烘焙连锁的主打点心很早就卖完，工坊却还有可以生产的时间。门店没有货，也就不再推广这款商品；总部只看到已经发生的销量，下一轮仍按较低数量排产。企业看起来每天都在完成工作，却可能一直错过本来有能力满足的需求。\n\n类似问题也会出现在其他业务里：报价单生成更快，产品适配和供货却没有确认，客户仍等不到能用的方案；AI写出更多文章，专家来不及核验，能交付的数量没有增加。要理解AI怎样改变企业，需要把这些原来分开管理的事情重新放到一起。\n\n如果AI只用于加快原来的一个动作，企业可能只得到一张更快的日报。把客户、专业判断、生产资源和结果重新连接起来，它才有机会帮助企业发现系统性问题，发展自己的方法，并创造新的增长。\n\n这门课从企业经营与能力发展看FDE。FDE是Forward Deployed Engineer，通常译为前线部署工程师，核心是靠近现场，把认识做成可用工程，再由真实采用继续修正。AI提供通用智能，企业提供自身事实、经验和生产条件，二者在连续工作中共同发展。\n\n## 四组案例，各自面对什么生意\n\n| 案例 | 要看清的经营矛盾 | 从哪里读 |\n|---|---|---|\n| 连锁烘焙 | 缺货、排产、推介与需求反馈怎样共同压住增长 | 完整案例A |\n| 工业品选型报价 | 多次交接怎样损失期限、订单和毛利，AI怎样放大适配判断 | 完整案例B |\n| 设备售后 | 经验、准备和派工怎样影响复访，能力如何跨人接任 | 完整案例C |\n| 工业品牌内容服务 | 生成扩产与专业瓶颈、客户付费需求和新服务怎样连接 | 完整案例D |\n\n四组企业和业务数字为教学构造。收益比较给出需求、成本、产能和采用条件，可以改变条件重新推演；公开研究另注明出处。案例不代表真实客户已经取得相应收益。\n\n## 全课要逐步回答的四件事\n\n第一，经验为什么难留下，AI怎样让更多自然工作材料进入下一次判断。会区分事件、解释、方法、组织能力与竞争优势，研究如何从生产开始形成积累。\n\n第二，FDE怎样找到企业真正有客户价值的差异，连同执行与纠错一起放大。企业不必处处定制，而应知道自己的能力怎样发生作用。\n\n第三，技术和产业仍在变化，企业怎样边采用边发展有自身特色的AI。长期工程、内部吸收和阶段选择，需要在持续工作里共同形成。\n\n第四，怎样经营可调度智能资源。token投入怎样形成合格工作，工作怎样兑现客户和经营结果，本轮又怎样留下未来能力；模型、人员、容量和维护都在同一条链中。\n\n## 怎样沿40章前进\n\n不要求先会软件开发。课程假定你熟悉人员、业务和经营取舍，新概念放在具体工作中解释。\n\n| 部分 | 主要判断 | 起点 |\n|---|---|---|\n| 变化 | 新智能供给怎样传到成本、分工和竞争 | 第1章 |\n| 积累 | 经验怎样在生产中成为下一次能用的能力 | 第5章 |\n| 优势与现场 | 哪种差异值得发展，FDE怎样发现和实现 | 第11章 |\n| 智能伙伴 | 持续职责、分工、信息与实际行动 | 第17章 |\n| 智能资源经营 | 配置、整链产能、成本和能力留存 | 第23章 |\n| 证据与更新 | 任务合格、业务有效、组织学会及纠错 | 第29章 |\n| 组织与共建 | 岗位、长期FDE、内部承担和迁移 | 第33章 |\n| 持续发展 | 路线、新产品、行业节奏与完整提案 | 第37章 |\n\n顺序阅读可形成完整判断，也可以从自己的问题进入，再补前置材料。每章只展开与该问题有关的案例部分，完整条件在四份案例中汇总。目录、搜索和概念回查帮助定位，不以填写作业阻止继续阅读。\n\n最终用改造提案工作簿把一条真实业务写完整：客户为什么需要，问题如何发生，几种选择谁更好，AI与FDE分别做什么，结果怎样检验，谁持续承担，以及什么证据会改变下一步。\n\n从第1章进入这条路线。\n"},{"file":"01-智能供给.md","id":"lesson-01","number":1,"role":"核心课","part":0,"title":"第1章｜从购买软件到调用智能，企业得到了什么","md":"# 第1章｜从购买软件到调用智能，企业得到了什么\n\n一家销售工业连接器的企业，接到客户发来的旧零件照片和图纸。客户的设备需要替换零件，希望三天内拿到能用的产品。销售查到一个外形相近的现货型号，却不敢直接推荐：接口看起来一样，不等于在客户的温度、负载等条件下也能工作。\n\n他把材料转给工程师。工程师要先了解使用条件，再核对产品资料；采购则要确认合适的型号有没有货、什么时候能送到。这笔生意能不能做成，取决于几个人能否及时把这些问题连起来。客户需要的是一个能按期使用的替代方案，而不只是收到一张报价单。\n\n这是课程中反复使用的[工业品报价教学案例](案例B-智能资源成本.md)。它帮助我们理解一个变化：AI使企业更容易取得处理文字、图像和复杂材料的能力，但这种能力怎样进入生意，还需要企业自己组织。\n\n## 软件已经做了很多事，为什么这里仍然离不开人\n\n库存系统可以告诉销售某型号还有多少件，价格程序可以按照数量计算折扣。这些工作有明确输入和相对稳定的规则：型号是什么、数量是多少、使用哪一版价格，确定以后就能计算。\n\n客户发来的材料却不一定满足这些条件。照片可能看不清型号，图纸可能是旧版本，“三天内需要”也可能是必须到货，而不是三天内发出。人首先要理解客户的话，再发现缺少什么，最后才能把问题交给现有系统处理。过去，这段工作往往夹在几个系统之间，由员工用经验补上。\n\n企业可以为一些常见情况开发专门功能，但每增加一种材料、一类例外，都要重新讨论和实现。业务量很大时，这笔准备成本值得付；需求分散、每种情况只出现几次时，逐项开发就可能比人工处理更贵。许多工作迟迟没有被数字化，并不只是管理者不重视，而是整理和建模的投入难以收回。\n\n## 通用模型改变的是起步方式\n\n基础模型先在广泛材料中学习，再将形成的部分能力用于不同任务。读一封客户邮件、比较两份产品说明、整理方案差异，可以使用同一个模型，而不必分别从头训练。这是“基础模型”对企业最直接的含义：先取得一部分通用能力，再围绕自己的业务补充资料、工具和工作规则。[基础模型研究](https://arxiv.org/abs/2108.07258v3)\n\n放到这笔询价中，销售可以把客户原话、图纸和候选产品说明交给AI，要求它先列出每个候选能满足什么、还缺什么依据。一个候选有现货，但使用条件尚未核对；另一个候选技术资料较完整，却要十天才能到货。AI可以帮助把这些分散的信息放在同一个比较中，让团队更早看见：第二个方案即使技术上成立，也不满足客户的三天期限。\n\n这里减少的是整理、对照和组织表达的劳动。工程师仍要核实关键的适配判断，采购仍要取得供应商的真实承诺。AI给出的比较让他们更容易知道该确认哪一项，而不是让一句看似完整的回答代替所有确认。\n\n## 从“能回答”到“能办成”，还差哪些条件\n\n假如模型说某型号有货，但依据是一份上个月的库存表，销售按此承诺就可能出错。要让AI协助真实报价，它必须能够取得当前库存，并区分“系统里显示有货”与“已经为客户预留”。同样，历史成交价可以帮助参考，却不能自动成为今天可承诺的价格。\n\n这些区别来自企业的经营安排。谁有权确认价格，谁能为客户预留库存，发生冲突时找谁决定，模型不会仅凭通用训练就知道。FDE需要深入现场，把这些事实来源和工作衔接接起来。FDE是参与现场业务改造的工程角色：既要理解工作为什么这样做，也要把可行的新做法实现出来，并跟踪它在实际使用中是否成立。\n\n企业因此不只是采购一个会写字的工具。它开始有机会让智能能力参与原本依靠人员反复理解和协调的工作。只有当整理出的信息能够支持判断、判断能够进入行动、行动结果能够被重新看见，这种参与才真正改变交付。\n\n## 怎样判断这项新供给值得采用\n\n对固定价格的计算，原来的程序可能已经又快又准，没有必要让模型重新推理。对材料不完整、候选很多、需要来回比较的技术询价，则可以观察AI是否减少了人员寻找资料和反复解释的时间。\n\n但比较不能停在“初稿几秒钟写完”。假如初稿省了十分钟，工程师却多花二十分钟查错，整笔业务反而更慢。应从客户提出要求开始，看到可采用方案形成：人员少做了哪些准备，新增了哪些核对，最后有没有更早得到一个确实能履约的报价。\n\n吸收能力研究指出，组织能否应用外部知识，与它已有的相关认识有关。[原始研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf) 对这家经销商来说，识别哪种材料重要、哪种判断必须由谁作出，正是这样的认识。通用模型使起点更低；持续理解自己的工作，才使取得的能力逐渐变成企业自己的能力。\n","html":"\u003ch1>第1章｜从购买软件到调用智能，企业得到了什么\u003c/h1>\n\u003cp>一家销售工业连接器的企业，接到客户发来的旧零件照片和图纸。客户的设备需要替换零件，希望三天内拿到能用的产品。销售查到一个外形相近的现货型号，却不敢直接推荐：接口看起来一样，不等于在客户的温度、负载等条件下也能工作。\u003c/p>\n\u003cp>他把材料转给工程师。工程师要先了解使用条件，再核对产品资料；采购则要确认合适的型号有没有货、什么时候能送到。这笔生意能不能做成，取决于几个人能否及时把这些问题连起来。客户需要的是一个能按期使用的替代方案，而不只是收到一张报价单。\u003c/p>\n\u003cp>这是课程中反复使用的\u003ca href=\"#case-b\">工业品报价教学案例\u003c/a>。它帮助我们理解一个变化：AI使企业更容易取得处理文字、图像和复杂材料的能力，但这种能力怎样进入生意，还需要企业自己组织。\u003c/p>\n\u003ch2 id=\"lesson-01-section-1\">软件已经做了很多事，为什么这里仍然离不开人\u003c/h2>\n\u003cp>库存系统可以告诉销售某型号还有多少件，价格程序可以按照数量计算折扣。这些工作有明确输入和相对稳定的规则：型号是什么、数量是多少、使用哪一版价格，确定以后就能计算。\u003c/p>\n\u003cp>客户发来的材料却不一定满足这些条件。照片可能看不清型号，图纸可能是旧版本，“三天内需要”也可能是必须到货，而不是三天内发出。人首先要理解客户的话，再发现缺少什么，最后才能把问题交给现有系统处理。过去，这段工作往往夹在几个系统之间，由员工用经验补上。\u003c/p>\n\u003cp>企业可以为一些常见情况开发专门功能，但每增加一种材料、一类例外，都要重新讨论和实现。业务量很大时，这笔准备成本值得付；需求分散、每种情况只出现几次时，逐项开发就可能比人工处理更贵。许多工作迟迟没有被数字化，并不只是管理者不重视，而是整理和建模的投入难以收回。\u003c/p>\n\u003ch2 id=\"lesson-01-section-2\">通用模型改变的是起步方式\u003c/h2>\n\u003cp>基础模型先在广泛材料中学习，再将形成的部分能力用于不同任务。读一封客户邮件、比较两份产品说明、整理方案差异，可以使用同一个模型，而不必分别从头训练。这是“基础模型”对企业最直接的含义：先取得一部分通用能力，再围绕自己的业务补充资料、工具和工作规则。\u003ca href=\"https://arxiv.org/abs/2108.07258v3\" target=\"_blank\" rel=\"noopener noreferrer\">基础模型研究\u003c/a>\u003c/p>\n\u003cp>放到这笔询价中，销售可以把客户原话、图纸和候选产品说明交给AI，要求它先列出每个候选能满足什么、还缺什么依据。一个候选有现货，但使用条件尚未核对；另一个候选技术资料较完整，却要十天才能到货。AI可以帮助把这些分散的信息放在同一个比较中，让团队更早看见：第二个方案即使技术上成立，也不满足客户的三天期限。\u003c/p>\n\u003cp>这里减少的是整理、对照和组织表达的劳动。工程师仍要核实关键的适配判断，采购仍要取得供应商的真实承诺。AI给出的比较让他们更容易知道该确认哪一项，而不是让一句看似完整的回答代替所有确认。\u003c/p>\n\u003ch2 id=\"lesson-01-section-3\">从“能回答”到“能办成”，还差哪些条件\u003c/h2>\n\u003cp>假如模型说某型号有货，但依据是一份上个月的库存表，销售按此承诺就可能出错。要让AI协助真实报价，它必须能够取得当前库存，并区分“系统里显示有货”与“已经为客户预留”。同样，历史成交价可以帮助参考，却不能自动成为今天可承诺的价格。\u003c/p>\n\u003cp>这些区别来自企业的经营安排。谁有权确认价格，谁能为客户预留库存，发生冲突时找谁决定，模型不会仅凭通用训练就知道。FDE需要深入现场，把这些事实来源和工作衔接接起来。FDE是参与现场业务改造的工程角色：既要理解工作为什么这样做，也要把可行的新做法实现出来，并跟踪它在实际使用中是否成立。\u003c/p>\n\u003cp>企业因此不只是采购一个会写字的工具。它开始有机会让智能能力参与原本依靠人员反复理解和协调的工作。只有当整理出的信息能够支持判断、判断能够进入行动、行动结果能够被重新看见，这种参与才真正改变交付。\u003c/p>\n\u003ch2 id=\"lesson-01-section-4\">怎样判断这项新供给值得采用\u003c/h2>\n\u003cp>对固定价格的计算，原来的程序可能已经又快又准，没有必要让模型重新推理。对材料不完整、候选很多、需要来回比较的技术询价，则可以观察AI是否减少了人员寻找资料和反复解释的时间。\u003c/p>\n\u003cp>但比较不能停在“初稿几秒钟写完”。假如初稿省了十分钟，工程师却多花二十分钟查错，整笔业务反而更慢。应从客户提出要求开始，看到可采用方案形成：人员少做了哪些准备，新增了哪些核对，最后有没有更早得到一个确实能履约的报价。\u003c/p>\n\u003cp>吸收能力研究指出，组织能否应用外部知识，与它已有的相关认识有关。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a> 对这家经销商来说，识别哪种材料重要、哪种判断必须由谁作出，正是这样的认识。通用模型使起点更低；持续理解自己的工作，才使取得的能力逐渐变成企业自己的能力。\u003c/p>\n","headings":[{"id":"lesson-01-section-1","label":"软件已经做了很多事，为什么这里仍然离不开人"},{"id":"lesson-01-section-2","label":"通用模型改变的是起步方式"},{"id":"lesson-01-section-3","label":"从“能回答”到“能办成”，还差哪些条件"},{"id":"lesson-01-section-4","label":"怎样判断这项新供给值得采用"}],"exportMd":"# 第1章｜从购买软件到调用智能，企业得到了什么\n\n一家销售工业连接器的企业，接到客户发来的旧零件照片和图纸。客户的设备需要替换零件，希望三天内拿到能用的产品。销售查到一个外形相近的现货型号，却不敢直接推荐：接口看起来一样，不等于在客户的温度、负载等条件下也能工作。\n\n他把材料转给工程师。工程师要先了解使用条件，再核对产品资料；采购则要确认合适的型号有没有货、什么时候能送到。这笔生意能不能做成，取决于几个人能否及时把这些问题连起来。客户需要的是一个能按期使用的替代方案，而不只是收到一张报价单。\n\n这是课程中反复使用的[工业品报价教学案例](#case-b)。它帮助我们理解一个变化：AI使企业更容易取得处理文字、图像和复杂材料的能力，但这种能力怎样进入生意，还需要企业自己组织。\n\n## 软件已经做了很多事，为什么这里仍然离不开人\n\n库存系统可以告诉销售某型号还有多少件，价格程序可以按照数量计算折扣。这些工作有明确输入和相对稳定的规则：型号是什么、数量是多少、使用哪一版价格，确定以后就能计算。\n\n客户发来的材料却不一定满足这些条件。照片可能看不清型号，图纸可能是旧版本，“三天内需要”也可能是必须到货，而不是三天内发出。人首先要理解客户的话，再发现缺少什么，最后才能把问题交给现有系统处理。过去，这段工作往往夹在几个系统之间，由员工用经验补上。\n\n企业可以为一些常见情况开发专门功能，但每增加一种材料、一类例外，都要重新讨论和实现。业务量很大时，这笔准备成本值得付；需求分散、每种情况只出现几次时，逐项开发就可能比人工处理更贵。许多工作迟迟没有被数字化，并不只是管理者不重视，而是整理和建模的投入难以收回。\n\n## 通用模型改变的是起步方式\n\n基础模型先在广泛材料中学习，再将形成的部分能力用于不同任务。读一封客户邮件、比较两份产品说明、整理方案差异，可以使用同一个模型，而不必分别从头训练。这是“基础模型”对企业最直接的含义：先取得一部分通用能力，再围绕自己的业务补充资料、工具和工作规则。[基础模型研究](https://arxiv.org/abs/2108.07258v3)\n\n放到这笔询价中，销售可以把客户原话、图纸和候选产品说明交给AI，要求它先列出每个候选能满足什么、还缺什么依据。一个候选有现货，但使用条件尚未核对；另一个候选技术资料较完整，却要十天才能到货。AI可以帮助把这些分散的信息放在同一个比较中，让团队更早看见：第二个方案即使技术上成立，也不满足客户的三天期限。\n\n这里减少的是整理、对照和组织表达的劳动。工程师仍要核实关键的适配判断，采购仍要取得供应商的真实承诺。AI给出的比较让他们更容易知道该确认哪一项，而不是让一句看似完整的回答代替所有确认。\n\n## 从“能回答”到“能办成”，还差哪些条件\n\n假如模型说某型号有货，但依据是一份上个月的库存表，销售按此承诺就可能出错。要让AI协助真实报价，它必须能够取得当前库存，并区分“系统里显示有货”与“已经为客户预留”。同样，历史成交价可以帮助参考，却不能自动成为今天可承诺的价格。\n\n这些区别来自企业的经营安排。谁有权确认价格，谁能为客户预留库存，发生冲突时找谁决定，模型不会仅凭通用训练就知道。FDE需要深入现场，把这些事实来源和工作衔接接起来。FDE是参与现场业务改造的工程角色：既要理解工作为什么这样做，也要把可行的新做法实现出来，并跟踪它在实际使用中是否成立。\n\n企业因此不只是采购一个会写字的工具。它开始有机会让智能能力参与原本依靠人员反复理解和协调的工作。只有当整理出的信息能够支持判断、判断能够进入行动、行动结果能够被重新看见，这种参与才真正改变交付。\n\n## 怎样判断这项新供给值得采用\n\n对固定价格的计算，原来的程序可能已经又快又准，没有必要让模型重新推理。对材料不完整、候选很多、需要来回比较的技术询价，则可以观察AI是否减少了人员寻找资料和反复解释的时间。\n\n但比较不能停在“初稿几秒钟写完”。假如初稿省了十分钟，工程师却多花二十分钟查错，整笔业务反而更慢。应从客户提出要求开始，看到可采用方案形成：人员少做了哪些准备，新增了哪些核对，最后有没有更早得到一个确实能履约的报价。\n\n吸收能力研究指出，组织能否应用外部知识，与它已有的相关认识有关。[原始研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf) 对这家经销商来说，识别哪种材料重要、哪种判断必须由谁作出，正是这样的认识。通用模型使起点更低；持续理解自己的工作，才使取得的能力逐渐变成企业自己的能力。\n","exportSingleMd":"# 第1章｜从购买软件到调用智能，企业得到了什么\n\n一家销售工业连接器的企业，接到客户发来的旧零件照片和图纸。客户的设备需要替换零件，希望三天内拿到能用的产品。销售查到一个外形相近的现货型号，却不敢直接推荐：接口看起来一样，不等于在客户的温度、负载等条件下也能工作。\n\n他把材料转给工程师。工程师要先了解使用条件，再核对产品资料；采购则要确认合适的型号有没有货、什么时候能送到。这笔生意能不能做成，取决于几个人能否及时把这些问题连起来。客户需要的是一个能按期使用的替代方案，而不只是收到一张报价单。\n\n这是课程中反复使用的[工业品报价教学案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-b)。它帮助我们理解一个变化：AI使企业更容易取得处理文字、图像和复杂材料的能力，但这种能力怎样进入生意，还需要企业自己组织。\n\n## 软件已经做了很多事，为什么这里仍然离不开人\n\n库存系统可以告诉销售某型号还有多少件，价格程序可以按照数量计算折扣。这些工作有明确输入和相对稳定的规则：型号是什么、数量是多少、使用哪一版价格，确定以后就能计算。\n\n客户发来的材料却不一定满足这些条件。照片可能看不清型号，图纸可能是旧版本，“三天内需要”也可能是必须到货，而不是三天内发出。人首先要理解客户的话，再发现缺少什么，最后才能把问题交给现有系统处理。过去，这段工作往往夹在几个系统之间，由员工用经验补上。\n\n企业可以为一些常见情况开发专门功能，但每增加一种材料、一类例外，都要重新讨论和实现。业务量很大时，这笔准备成本值得付；需求分散、每种情况只出现几次时，逐项开发就可能比人工处理更贵。许多工作迟迟没有被数字化，并不只是管理者不重视，而是整理和建模的投入难以收回。\n\n## 通用模型改变的是起步方式\n\n基础模型先在广泛材料中学习，再将形成的部分能力用于不同任务。读一封客户邮件、比较两份产品说明、整理方案差异，可以使用同一个模型，而不必分别从头训练。这是“基础模型”对企业最直接的含义：先取得一部分通用能力，再围绕自己的业务补充资料、工具和工作规则。[基础模型研究](https://arxiv.org/abs/2108.07258v3)\n\n放到这笔询价中，销售可以把客户原话、图纸和候选产品说明交给AI，要求它先列出每个候选能满足什么、还缺什么依据。一个候选有现货，但使用条件尚未核对；另一个候选技术资料较完整，却要十天才能到货。AI可以帮助把这些分散的信息放在同一个比较中，让团队更早看见：第二个方案即使技术上成立，也不满足客户的三天期限。\n\n这里减少的是整理、对照和组织表达的劳动。工程师仍要核实关键的适配判断，采购仍要取得供应商的真实承诺。AI给出的比较让他们更容易知道该确认哪一项，而不是让一句看似完整的回答代替所有确认。\n\n## 从“能回答”到“能办成”，还差哪些条件\n\n假如模型说某型号有货，但依据是一份上个月的库存表，销售按此承诺就可能出错。要让AI协助真实报价，它必须能够取得当前库存，并区分“系统里显示有货”与“已经为客户预留”。同样，历史成交价可以帮助参考，却不能自动成为今天可承诺的价格。\n\n这些区别来自企业的经营安排。谁有权确认价格，谁能为客户预留库存，发生冲突时找谁决定，模型不会仅凭通用训练就知道。FDE需要深入现场，把这些事实来源和工作衔接接起来。FDE是参与现场业务改造的工程角色：既要理解工作为什么这样做，也要把可行的新做法实现出来，并跟踪它在实际使用中是否成立。\n\n企业因此不只是采购一个会写字的工具。它开始有机会让智能能力参与原本依靠人员反复理解和协调的工作。只有当整理出的信息能够支持判断、判断能够进入行动、行动结果能够被重新看见，这种参与才真正改变交付。\n\n## 怎样判断这项新供给值得采用\n\n对固定价格的计算，原来的程序可能已经又快又准，没有必要让模型重新推理。对材料不完整、候选很多、需要来回比较的技术询价，则可以观察AI是否减少了人员寻找资料和反复解释的时间。\n\n但比较不能停在“初稿几秒钟写完”。假如初稿省了十分钟，工程师却多花二十分钟查错，整笔业务反而更慢。应从客户提出要求开始，看到可采用方案形成：人员少做了哪些准备，新增了哪些核对，最后有没有更早得到一个确实能履约的报价。\n\n吸收能力研究指出，组织能否应用外部知识，与它已有的相关认识有关。[原始研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf) 对这家经销商来说，识别哪种材料重要、哪种判断必须由谁作出，正是这样的认识。通用模型使起点更低；持续理解自己的工作，才使取得的能力逐渐变成企业自己的能力。\n","text":"# 第1章｜从购买软件到调用智能，企业得到了什么\n\n一家销售工业连接器的企业，接到客户发来的旧零件照片和图纸。客户的设备需要替换零件，希望三天内拿到能用的产品。销售查到一个外形相近的现货型号，却不敢直接推荐：接口看起来一样，不等于在客户的温度、负载等条件下也能工作。\n\n他把材料转给工程师。工程师要先了解使用条件，再核对产品资料；采购则要确认合适的型号有没有货、什么时候能送到。这笔生意能不能做成，取决于几个人能否及时把这些问题连起来。客户需要的是一个能按期使用的替代方案，而不只是收到一张报价单。\n\n这是课程中反复使用的工业品报价教学案例。它帮助我们理解一个变化：AI使企业更容易取得处理文字、图像和复杂材料的能力，但这种能力怎样进入生意，还需要企业自己组织。\n\n## 软件已经做了很多事，为什么这里仍然离不开人\n\n库存系统可以告诉销售某型号还有多少件，价格程序可以按照数量计算折扣。这些工作有明确输入和相对稳定的规则：型号是什么、数量是多少、使用哪一版价格，确定以后就能计算。\n\n客户发来的材料却不一定满足这些条件。照片可能看不清型号，图纸可能是旧版本，“三天内需要”也可能是必须到货，而不是三天内发出。人首先要理解客户的话，再发现缺少什么，最后才能把问题交给现有系统处理。过去，这段工作往往夹在几个系统之间，由员工用经验补上。\n\n企业可以为一些常见情况开发专门功能，但每增加一种材料、一类例外，都要重新讨论和实现。业务量很大时，这笔准备成本值得付；需求分散、每种情况只出现几次时，逐项开发就可能比人工处理更贵。许多工作迟迟没有被数字化，并不只是管理者不重视，而是整理和建模的投入难以收回。\n\n## 通用模型改变的是起步方式\n\n基础模型先在广泛材料中学习，再将形成的部分能力用于不同任务。读一封客户邮件、比较两份产品说明、整理方案差异，可以使用同一个模型，而不必分别从头训练。这是“基础模型”对企业最直接的含义：先取得一部分通用能力，再围绕自己的业务补充资料、工具和工作规则。基础模型研究\n\n放到这笔询价中，销售可以把客户原话、图纸和候选产品说明交给AI，要求它先列出每个候选能满足什么、还缺什么依据。一个候选有现货，但使用条件尚未核对；另一个候选技术资料较完整，却要十天才能到货。AI可以帮助把这些分散的信息放在同一个比较中，让团队更早看见：第二个方案即使技术上成立，也不满足客户的三天期限。\n\n这里减少的是整理、对照和组织表达的劳动。工程师仍要核实关键的适配判断，采购仍要取得供应商的真实承诺。AI给出的比较让他们更容易知道该确认哪一项，而不是让一句看似完整的回答代替所有确认。\n\n## 从“能回答”到“能办成”，还差哪些条件\n\n假如模型说某型号有货，但依据是一份上个月的库存表，销售按此承诺就可能出错。要让AI协助真实报价，它必须能够取得当前库存，并区分“系统里显示有货”与“已经为客户预留”。同样，历史成交价可以帮助参考，却不能自动成为今天可承诺的价格。\n\n这些区别来自企业的经营安排。谁有权确认价格，谁能为客户预留库存，发生冲突时找谁决定，模型不会仅凭通用训练就知道。FDE需要深入现场，把这些事实来源和工作衔接接起来。FDE是参与现场业务改造的工程角色：既要理解工作为什么这样做，也要把可行的新做法实现出来，并跟踪它在实际使用中是否成立。\n\n企业因此不只是采购一个会写字的工具。它开始有机会让智能能力参与原本依靠人员反复理解和协调的工作。只有当整理出的信息能够支持判断、判断能够进入行动、行动结果能够被重新看见，这种参与才真正改变交付。\n\n## 怎样判断这项新供给值得采用\n\n对固定价格的计算，原来的程序可能已经又快又准，没有必要让模型重新推理。对材料不完整、候选很多、需要来回比较的技术询价，则可以观察AI是否减少了人员寻找资料和反复解释的时间。\n\n但比较不能停在“初稿几秒钟写完”。假如初稿省了十分钟，工程师却多花二十分钟查错，整笔业务反而更慢。应从客户提出要求开始，看到可采用方案形成：人员少做了哪些准备，新增了哪些核对，最后有没有更早得到一个确实能履约的报价。\n\n吸收能力研究指出，组织能否应用外部知识，与它已有的相关认识有关。原始研究 对这家经销商来说，识别哪种材料重要、哪种判断必须由谁作出，正是这样的认识。通用模型使起点更低；持续理解自己的工作，才使取得的能力逐渐变成企业自己的能力。\n"},{"file":"02-数字化的积累边界.md","id":"lesson-02","number":2,"role":"核心课","part":0,"title":"第2章｜畅销商品卖完了，企业为什么仍可能错过增长","md":"# 第2章｜畅销商品卖完了，企业为什么仍可能错过增长\n\n设想一家有八家门店的烘焙企业。点心由中央工坊统一制作，每天早上送到各店，门店营业到晚上八点。总部每天看销售和剩余数量，再安排第二天生产。本章讨论的是其中一款主打点心，不是门店的全部生意；以下情境和数字均来自课程的[连锁烘焙教学案例](案例A-连锁备货.md)。\n\n两家店的情况很不一样。位于交通枢纽附近的X店，早上收到80份，下午六点已经全部卖完，之后仍有顾客来问。位于居民区的Y店，同样收到80份，到关门只卖出60份，剩下20份。\n\n如果只看日报，总部很容易作出一个合理决定：明天仍生产160份，把X店增加到100份，Y店减少到60份。这样既没有增加总产量，也可能少一些浪费。但我们还需要问：X店真正的需求究竟有多少？这次调整是在接近全部机会，还是只解决了最容易看见的一小部分？\n\n## “卖了80份”为什么没有把生意讲完整\n\n收银系统准确记录了X店售出的80份商品。可是从下午六点开始，货架上已经没有这款点心。之后再有顾客想买，也不会产生交易记录。于是，同样是“销量80”，可能意味着刚好有80份需求，也可能意味着供给只能满足80份，后面还有需求没有被记录。\n\n店长在工作群里说“18点卖光，后来还有人问”，其实补充了报表里没有的信息。如果这句话在整理日报时被压成一个销量数字，总部下一次预测又只能从80出发。系统保存了发生过的交易，却没有完整保存交易为什么停在这里。\n\n![X店售出80份后未满足需求未知；Y店售60份余20份。销量正确，但X的成交被供给上限截住。](assets/02-销量与需求.svg)\n\n读这张图时，要注意X店右侧并不是已经确定的订单。它表示一块尚未被看清的需求。要判断是否值得增加生产，还要知道售罄后来了多少询问、顾客能否接受稍晚购买，以及其他商品有没有替代掉这部分需求。单凭“卖完了”还算不出应当多做多少。\n\n## 顺着门店往回看，问题会延伸到工坊和员工的工作\n\n在这个教学案例中，进一步核对排产后发现：其他六家店的订单安排好以后，工坊在可用于X、Y两店的那段生产时间里，最多还能做320份，现在只安排了160份。也就是说，这段时间的设备、人员和原料条件还有余量。这里说的是两店相关的生产时段，不能据此认为整座工坊只有一半工作量。\n\n生产有余量，货却不会自己到门店。原来只有早上一次配送，如果下午追加生产，就需要安排新的配送，确认点心到店时仍符合品质要求，并有人接货和上架。在案例设定中，可以考虑下午制作、17点前补到X店，但这项安排会新增支出。\n\n再看门店。员工知道这款点心已经卖完，就停止在社群里推荐它，也不再持续登记预订。他们仍在销售其他商品，只是这款商品已经没有可交付的货，再招徕顾客会造成失望。这种做法对当天来说可以理解，却使总部更难看到本来可能出现的订单。\n\n几项安排由此连在了一起：工坊根据既有销量排产；门店因数量有限而提前售罄；售罄后相关推介和预订停止；总部收不到更多需求线索，下一轮又维持较低产量。每个岗位都在适应眼前条件，但企业整体的增长被共同限制住了。\n\n![本案中，按受限销量排产导致提前售罄，售罄又使推介和预订停止，新的需求线索更少返回排产。工坊、门店与需求反馈需要一起改变。](assets/02-缺货背后的联动.svg)\n\n图中的箭头表示这种相互影响。要改变它，不能只给店长一个“积极推广”的要求：没有货，推广难以持续；也不能只让工坊多生产：没有合适的配送和门店动作，多出来的点心可能变成损耗。\n\n## AI怎样帮助人把这些联系看见并用起来\n\n销售时段在收银记录里，顾客询问在聊天里，工坊余量在排产安排里，配送条件又由另一组人掌握。过去，要持续把这些材料放在一起，需要有人逐条找、对照和追问。企业即使知道这种分析有价值，也未必负担得起每天这样做。\n\nAI可以协助把同一天、同一商品、同一家店的不同材料对应起来，找出值得追查的矛盾：为什么连续提前售罄，排产却没有增加？为什么工坊仍有可用时间，门店却无法补货？它还可以根据这些材料整理几种方案，帮助负责人比较。\n\n这些问题仍要回到现场确认。FDE负责让材料能进入同一项工作，把待确认的事项送到相应人员面前，并把批准后的补货、推介和结果记录接起来。门店和工坊负责人则确认需求、品质与资源。AI擅长协助连接分散的信息；这种连接只有经过核实并改变了实际安排，才会带来经营效果。\n\n## 增长潜力需要怎样算，才看得清楚\n\n为了看清三种安排的差别，先作一个明确假设：在某类正常营业日，X店这款点心有160份实际可成交需求，Y店有60份。每份售价12元，做出来一份需要4元原料等变动成本；当天未售部分没有残值。原有工资和租金在三种方案中不变。\n\n原来两店各配80份，共生产160份，实际卖出140份。收到的销售款是140×12＝1680元，生产支出是160×4＝640元，相减得到1040元。为了比较方案，我们把它称为“当日贡献”：它还要用于覆盖企业原有工资、租金等费用，因此不是企业净利润。\n\n只调整分配时，X店配100份、Y店配60份，总产量不变，却能把160份全部售出。销售款增加到1920元，生产支出仍是640元，当日贡献变为1280元。这个240元的改善，靠普通的分配调整就有机会取得，不能全部算成AI的收益。\n\n如果再把X店增加到160份，Y店仍为60份，就要生产220份。假定这些货都售出，销售款是2640元，生产支出880元。再扣除新增配送50元、AI及外部整理服务30元，共80元，当日贡献为1680元。三种完整安排可放在一起比较：\n\n| 当天的安排 | 生产数量 | 售出数量 | 扣除列出支出后的当日贡献 |\n|---|---:|---:|---:|\n| X、Y各配80份 | 160份 | 140份 | 1040元 |\n| X配100份、Y配60份 | 160份 | 160份 | 1280元 |\n| X配160份、Y配60份，并安排补货 | 220份 | 220份 | 1680元 |\n\n第三种安排比原来多640元，比已经调整好分配的第二种多400元。X店这款商品销量从80份增至160份，确实翻倍；两店合计从140份增至220份，增加约57.1%。这不是整店收入翻倍，更不是已经发生的经营成果，而是在需求和履约条件成立时能看见的潜力。一次性连接投入还需另算，完整情景见案例专章。\n\n为什么要把条件讲清楚？因为“有能力多做”与“顾客会多买”是两件事。如果实际需求只有90份，多生产就可能增加损耗。因此，第一次尝试应同时观察售罄后的需求、补货后的销售和新增支出，让下一次排产有更可靠的根据。\n\n## 企业最终积累的，是什么经验\n\n经过这样的工作，企业留下的就不只是“某店某日销量多少”。它还能看到：当时为什么判断值得补货，工坊和配送怎样配合，员工是否恢复推介，顾客最后买了多少，以及哪个假设与实际不符。\n\n这些材料首先用于完成当天的生产和销售，同时又成为下一轮经营判断的依据。AI可以减少事后重新找材料、问当事人、拼接背景的工作，使更多原来容易消失的经验得到保留。知识研究所讨论的个人实践、表达和共同使用，也正是在这样的往返中发生。[知识研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)\n\n一家企业的know-how往往藏在这种关系里：什么情况下该多做，怎样把多做的货卖出去，哪几个人需要一起改变工作。过去难以持续整理的关系，现在有机会随着生产逐步被保存、检验和改进。这比一张更加整齐的日报，更接近企业能力的积累。\n","html":"\u003ch1>第2章｜畅销商品卖完了，企业为什么仍可能错过增长\u003c/h1>\n\u003cp>设想一家有八家门店的烘焙企业。点心由中央工坊统一制作，每天早上送到各店，门店营业到晚上八点。总部每天看销售和剩余数量，再安排第二天生产。本章讨论的是其中一款主打点心，不是门店的全部生意；以下情境和数字均来自课程的\u003ca href=\"#case-a\">连锁烘焙教学案例\u003c/a>。\u003c/p>\n\u003cp>两家店的情况很不一样。位于交通枢纽附近的X店，早上收到80份，下午六点已经全部卖完，之后仍有顾客来问。位于居民区的Y店，同样收到80份，到关门只卖出60份，剩下20份。\u003c/p>\n\u003cp>如果只看日报，总部很容易作出一个合理决定：明天仍生产160份，把X店增加到100份，Y店减少到60份。这样既没有增加总产量，也可能少一些浪费。但我们还需要问：X店真正的需求究竟有多少？这次调整是在接近全部机会，还是只解决了最容易看见的一小部分？\u003c/p>\n\u003ch2 id=\"lesson-02-section-1\">“卖了80份”为什么没有把生意讲完整\u003c/h2>\n\u003cp>收银系统准确记录了X店售出的80份商品。可是从下午六点开始，货架上已经没有这款点心。之后再有顾客想买，也不会产生交易记录。于是，同样是“销量80”，可能意味着刚好有80份需求，也可能意味着供给只能满足80份，后面还有需求没有被记录。\u003c/p>\n\u003cp>店长在工作群里说“18点卖光，后来还有人问”，其实补充了报表里没有的信息。如果这句话在整理日报时被压成一个销量数字，总部下一次预测又只能从80出发。系统保存了发生过的交易，却没有完整保存交易为什么停在这里。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNDYwIiB2aWV3Qm94PSIwIDAgMzYwIDQ2MCIgcm9sZT0iaW1nIj48dGl0bGU+6ZSA6YeP5LiN562J5LqO5YWo6YOo6ZyA5rGCPC90aXRsZT48ZGVzYz7mlZnlrabmoYjkvovvvJpY5Y2W5a6MODDkuKrlkI7pnIDmsYLmnKrnn6XvvIxZ5Y2W5Ye6NjDkuKrliakyMOS4quOAguaWnOe6ueWPquihqOekuuacquiuoemHj++8jOS4jeaMiemrmOW6puS8sOeul+mcgOaxguOAgjwvZGVzYz48ZGVmcz48bWFya2VyIGlkPSJhcnJvdyIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8tc3RhcnQtcmV2ZXJzZSI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTB6IiBmaWxsPSIjMTY1ZDUyIi8+PC9tYXJrZXI+PHBhdHRlcm4gaWQ9InVua25vd24iIHdpZHRoPSI4IiBoZWlnaHQ9IjgiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPjxwYXRoIGQ9Ik0tMiAyTDIgLTJNMCA4TDggME02IDEwTDEwIDYiIHN0cm9rZT0iIzg3NWQyMiIgc3Ryb2t 间的设备、人员和原料条件还有余量。这里说的是两店相关的生产时段，不能据此认为整座工坊只有一半工作量。\u003c/p>\n\u003cp>生产有余量，货却不会自己到门店。原来只有早上一次配送，如果下午追加生产，就需要安排新的配送，确认点心到店时仍符合品质要求，并有人接货和上架。在案例设定中，可以考虑下午制作、17点前补到X店，但这项安排会新增支出。\u003c/p>\n\u003cp>再看门店。员工知道这款点心已经卖完，就停止在社群里推荐它，也不再持续登记预订。他们仍在销售其他商品，只是这款商品已经没有可交付的货，再招徕顾客会造成失望。这种做法对当天来说可以理解，却使总部更难看到本来可能出现的订单。\u003c/p>\n\u003cp>几项安排由此连在了一起：工坊根据既有销量排产；门店因数量有限而提前售罄；售罄后相关推介和预订停止；总部收不到更多需求线索，下一轮又维持较低产量。每个岗位都在适应眼前条件，但企业整体的增长被共同限制住了。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNjUwIiB2aWV3Qm94PSIwIDAgMzYwIDY1MCIgcm9sZT0iaW1nIj48dGl0bGU+57y66LSn5oCO5qC35Y6L5L2P5LiL5LiA6L2u5aKe6ZW/PC90aXRsZT48ZGVzYz7mlZnlrabmoYjkvovkuK3nmoTogZTliqjvvJrlj5fpmZDplIDph4/lhrPlrprmjpLkuqfvvIzmj5DliY3llK7nvYTkvb/mjqjku4vkuI7pooTorqLlgZzmraLvvIzpnIDmsYLnur/ntKLlh4/lsJHvvIzlho3lm57liLDlgY/kvY7mjpLkuqfjgILnjrDlnLrmoLjlrp7nmoTnlJ/kuqfnqpflj6Pku43mnInkvZnph4/jgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjY1MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7nvLrotKfmgI7moLfljovkvY/kuIvkuIDova7lop7plb88L3RleHQ+PHRleHQgeD0iMjQiIHk9Ijc2IiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM1MjY4NWUiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjQwMCI+5pys5qGI6KeC5a+fIMK3IOS4jeeUsee8uui0p+iHquWKqOaOqOWHujwvdGV4dD48cmVjdCB4PSIzMCIgeT0iMTA0 MC4wIiB5PSI1MjEuMCIgZm9udC1mYW1pbHk9IlBpbmdGYW5nIFNDLE1pY3Jvc29mdCBZYUhlaSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmaWxsPSIjMjEzNDJmIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXdlaWdodD0iNDAwIj7nlZnkuIvmm7TlsJHpnIDmsYLnur/ntKI8L3RleHQ+PHBhdGggZD0iTTE2MCAzMzRMMTYwIDM1OCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMTY1ZDUyIiBzdHJva2Utd2lkdGg9IjIiIG1hcmtlci1lbmQ9InVybCgjYXJyb3cpIi8+PHBhdGggZD0iTTE2MCA0MzBMMTYwIDQ3OSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMTY1ZDUyIiBzdHJva2Utd2lkdGg9IjIiIG1hcmtlci1lbmQ9InVybCgjYXJyb3cpIi8+PHBhdGggZD0iTTI4NiA1MTVIMzI4VjI5OEgyODYiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzE2NWQ1MiIgc3Ryb2tlLXdpZHRoPSIyIiBtYXJrZXItZW5kPSJ1cmwoI2Fycm93KSIvPjx0ZXh0IHg9IjI0IiB5PSI1OTMiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxOCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7mlLnlj5jkvpvnu5nvvIzkuZ/opoHmjqXlm57pob7lrqLkuI7nu5Pmnpw8L3RleHQ+PHRleHQgeD0iMjQiIHk9IjYyNCIgZm9udC1mYW1pbHk9IlBpbmdGYW5nIFNDLE1pY3Jvc29mdCBZYUhlaSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmaWxsPSIjMjEzNDJmIiB0ZXh0LWFuY2hvcj0ic3RhcnQiIGZvbnQtd2VpZ2h0PSI0MDAiPuaJjeiDvei3s+WHuuWOn+adpeeahOW+queOrzwvdGV4dD48L3N2Zz4=\" alt=\"本案中，按受限销量排产导致提前售罄，售罄又使推介和预订停止，新的需求线索更少返回排产。工坊、门店与需求反馈需要一起改变。\">\u003c/p>\n\u003cp>图中的箭头表示这种相互影响。要改变它，不能只给店长一个“积极推广”的要求：没有货，推广难以持续；也不能只让工坊多生产：没有合适的配送和门店动作，多出来的点心可能变成损耗。\u003c/p>\n\u003ch2 id=\"lesson-02-section-3\">AI怎样帮助人把这些联系看见并用起来\u003c/h2>\n\u003cp>销售时段在收银记录里，顾客询问在聊天里，工坊余量在排产安排里，配送条件又由另一组人掌握。过去，要持续把这些材料放在一起，需要有人逐条找、对照和追问。企业即使知道这种分析有价值，也未必负担得起每天这样做。\u003c/p>\n\u003cp>AI可以协助把同一天、同一商品、同一家店的不同材料对应起来，找出值得追查的矛盾：为什么连续提前售罄，排产却没有增加？为什么工坊仍有可用时间，门店却无法补货？它还可以根据这些材料整理几种方案，帮助负责人比较。\u003c/p>\n\u003cp>这些问题仍要回到现场确认。FDE负责让材料能进入同一项工作，把待确认的事项送到相应人员面前，并把批准后的补货、推介和结果记录接起来。门店和工坊负责人则确认需求、品质与资源。AI擅长协助连接分散的信息；这种连接只有经过核实并改变了实际安排，才会带来经营效果。\u003c/p>\n\u003ch2 id=\"lesson-02-section-4\">增长潜力需要怎样算，才看得清楚\u003c/h2>\n\u003cp>为了看清三种安排的差别，先作一个明确假设：在某类正常营业日，X店这款点心有160份实际可成交需求，Y店有60份。每份售价12元，做出来一份需要4元原料等变动成本；当天未售部分没有残值。原有工资和租金在三种方案中不变。\u003c/p>\n\u003cp>原来两店各配80份，共生产160份，实际卖出140份。收到的销售款是140×12＝1680元，生产支出是160×4＝640元，相减得到1040元。为了比较方案，我们把它称为“当日贡献”：它还要用于覆盖企业原有工资、租金等费用，因此不是企业净利润。\u003c/p>\n\u003cp>只调整分配时，X店配100份、Y店配60份，总产量不变，却能把160份全部售出。销售款增加到1920元，生产支出仍是640元，当日贡献变为1280元。这个240元的改善，靠普通的分配调整就有机会取得，不能全部算成AI的收益。\u003c/p>\n\u003cp>如果再把X店增加到160份，Y店仍为60份，就要生产220份。假定这些货都售出，销售款是2640元，生产支出880元。再扣除新增配送50元、AI及外部整理服务30元，共80元，当日贡献为1680元。三种完整安排可放在一起比较：\u003c/p>\n\u003cdiv class=\"table-scroll table-wide\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>当天的安排\u003c/th>\n\u003cth align=\"right\">生产数量\u003c/th>\n\u003cth align=\"right\">售出数量\u003c/th>\n\u003cth align=\"right\">扣除列出支出后的当日贡献\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>X、Y各配80份\u003c/td>\n\u003ctd align=\"right\">160份\u003c/td>\n\u003ctd align=\"right\">140份\u003c/td>\n\u003ctd align=\"right\">1040元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>X配100份、Y配60份\u003c/td>\n\u003ctd align=\"right\">160份\u003c/td>\n\u003ctd align=\"right\">160份\u003c/td>\n\u003ctd align=\"right\">1280元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>X配160份、Y配60份，并安排补货\u003c/td>\n\u003ctd align=\"right\">220份\u003c/td>\n\u003ctd align=\"right\">220份\u003c/td>\n\u003ctd align=\"right\">1680元\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"table-hint\">表格可左右滑动查看\u003c/p>\n\u003cp>第三种安排比原来多640元，比已经调整好分配的第二种多400元。X店这款商品销量从80份增至160份，确实翻倍；两店合计从140份增至220份，增加约57.1%。这不是整店收入翻倍，更不是已经发生的经营成果，而是在需求和履约条件成立时能看见的潜力。一次性连接投入还需另算，完整情景见案例专章。\u003c/p>\n\u003cp>为什么要把条件讲清楚？因为“有能力多做”与“顾客会多买”是两件事。如果实际需求只有90份，多生产就可能增加损耗。因此，第一次尝试应同时观察售罄后的需求、补货后的销售和新增支出，让下一次排产有更可靠的根据。\u003c/p>\n\u003ch2 id=\"lesson-02-section-5\">企业最终积累的，是什么经验\u003c/h2>\n\u003cp>经过这样的工作，企业留下的就不只是“某店某日销量多少”。它还能看到：当时为什么判断值得补货，工坊和配送怎样配合，员工是否恢复推介，顾客最后买了多少，以及哪个假设与实际不符。\u003c/p>\n\u003cp>这些材料首先用于完成当天的生产和销售，同时又成为下一轮经营判断的依据。AI可以减少事后重新找材料、问当事人、拼接背景的工作，使更多原来容易消失的经验得到保留。知识研究所讨论的个人实践、表达和共同使用，也正是在这样的往返中发生。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">知识研究\u003c/a>\u003c/p>\n\u003cp>一家企业的know-how往往藏在这种关系里：什么情况下该多做，怎样把多做的货卖出去，哪几个人需要一起改变工作。过去难以持续整理的关系，现在有机会随着生产逐步被保存、检验和改进。这比一张更加整齐的日报，更接近企业能力的积累。\u003c/p>\n","headings":[{"id":"lesson-02-section-1","label":"“卖了80份”为什么没有把生意讲完整"},{"id":"lesson-02-section-2","label":"顺着门店往回看，问题会延伸到工坊和员工的工作"},{"id":"lesson-02-section-3","label":"AI怎样帮助人把这些联系看见并用起来"},{"id":"lesson-02-section-4","label":"增长潜力需要怎样算，才看得清楚"},{"id":"lesson-02-section-5","label":"企业最终积累的，是什么经验"}],"exportMd":"# 第2章｜畅销商品卖完了，企业为什么仍可能错过增长\n\n设想一家有八家门店的烘焙企业。点心由中央工坊统一制作，每天早上送到各店，门店营业到晚上八点。总部每天看销售和剩余数量，再安排第二天生产。本章讨论的是其中一款主打点心，不是门店的全部生意；以下情境和数字均来自课程的[连锁烘焙教学案例](#case-a)。\n\n两家店的情况很不一样。位于交通枢纽附近的X店，早上收到80份，下午六点已经全部卖完，之后仍有顾客来问。位于居民区的Y店，同样收到80份，到关门只卖出60份，剩下20份。\n\n如果只看日报，总部很容易作出一个合理决定：明天仍生产160份，把X店增加到100份，Y店减少到60份。这样既没有增加总产量，也可能少一些浪费。但我们还需要问：X店真正的需求究竟有多少？这次调整是在接近全部机会，还是只解决了最容易看见的一小部分？\n\n## “卖了80份”为什么没有把生意讲完整\n\n收银系统准确记录了X店售出的80份商品。可是从下午六点开始，货架上已经没有这款点心。之后再有顾客想买，也不会产生交易记录。于是，同样是“销量80”，可能意味着刚好有80份需求，也可能意味着供给只能满足80份，后面还有需求没有被记录。\n\n店长在工作群里说“18点卖光，后来还有人问”，其实补充了报表里没有的信息。如果这句话在整理日报时被压成一个销量数字，总部下一次预测又只能从80出发。系统保存了发生过的交易，却没有完整保存交易为什么停在这里。\n\n![X店售出80份后未满足需求未知；Y店售60份余20份。销量正确，但X的成交被供给上限截住。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNDYwIiB2aWV3Qm94PSIwIDAgMzYwIDQ2MCIgcm9sZT0iaW1nIj48dGl0bGU+6ZSA6YeP5LiN562J5LqO5YWo6YOo6ZyA5rGCPC90aXRsZT48ZGVzYz7mlZnlrabmoYjkvovvvJpY5Y2W5a6MODDkuKrlkI7pnIDmsYLmnKrnn6XvvIxZ5Y2W5Ye6NjDkuKrliakyMOS4quOAguaWnOe6ueWPquihqOekuuacquiuoemHj++8jOS4jeaMiemrmOW6puS8sOeul+mcgOaxguOAgjwvZGVzYz48ZGVmcz48bWFya2VyIGlkPSJhcnJvdyIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8tc3RhcnQtcmV2ZXJzZSI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTB6IiBmaWxsPSIjMTY1ZDUyIi8+PC9tYXJrZXI+PHBhdHRlcm4gaWQ9InVua25vd24iIHdpZHRoPSI4IiBoZWlnaHQ9IjgiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPjxwYXRoIGQ9Ik0tMiAyTDIgLTJNMCA4TDggME02IDEwTDEwIDYiIHN0cm9rZT0iIzg3NWQyMiIgc3Ryb2t 设定中，可以考虑下午制作、17点前补到X店，但这项安排会新增支出。\n\n再看门店。员工知道这款点心已经卖完，就停止在社群里推荐它，也不再持续登记预订。他们仍在销售其他商品，只是这款商品已经没有可交付的货，再招徕顾客会造成失望。这种做法对当天来说可以理解，却使总部更难看到本来可能出现的订单。\n\n几项安排由此连在了一起：工坊根据既有销量排产；门店因数量有限而提前售罄；售罄后相关推介和预订停止；总部收不到更多需求线索，下一轮又维持较低产量。每个岗位都在适应眼前条件，但企业整体的增长被共同限制住了。\n\n![本案中，按受限销量排产导致提前售罄，售罄又使推介和预订停止，新的需求线索更少返回排产。工坊、门店与需求反馈需要一起改变。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNjUwIiB2aWV3Qm94PSIwIDAgMzYwIDY1MCIgcm9sZT0iaW1nIj48dGl0bGU+57y66LSn5oCO5qC35Y6L5L2P5LiL5LiA6L2u5aKe6ZW/PC90aXRsZT48ZGVzYz7mlZnlrabmoYjkvovkuK3nmoTogZTliqjvvJrlj5fpmZDplIDph4/lhrPlrprmjpLkuqfvvIzmj5DliY3llK7nvYTkvb/mjqjku4vkuI7pooTorqLlgZzmraLvvIzpnIDmsYLnur/ntKLlh4/lsJHvvIzlho3lm57liLDlgY/kvY7mjpLkuqfjgILnjrDlnLrmoLjlrp7nmoTnlJ/kuqfnqpflj6Pku43mnInkvZnph4/jgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjY1MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7nvLrotKfmgI7moLfljovkvY/kuIvkuIDova7lop7plb88L3RleHQ+PHRleHQgeD0iMjQiIHk9Ijc2IiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM1MjY4NWUiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjQwMCI+5pys5qGI6KeC5a+fIMK3IOS4jeeUsee8uui0p+iHquWKqOaOqOWHujwvdGV4dD48cmVjdCB4PSIzMCIgeT0iMTA0IiB3aWR0aD0iMjkwIiBoZWlnaHQ9Ijk2IiByeD0iNiIgZmlsbD0id2hpdGUiIHN0cm9rZT0iIzYwNzM2YyIgc3Ryb2tlLXdpZHRoPSIxLjUiLz48dGV4dCB4PSI0OCIgeT0iMTM1IiBmb250LWZhbWlseT0iUGl 份 | 140份 | 1040元 |\n| X配100份、Y配60份 | 160份 | 160份 | 1280元 |\n| X配160份、Y配60份，并安排补货 | 220份 | 220份 | 1680元 |\n\n第三种安排比原来多640元，比已经调整好分配的第二种多400元。X店这款商品销量从80份增至160份，确实翻倍；两店合计从140份增至220份，增加约57.1%。这不是整店收入翻倍，更不是已经发生的经营成果，而是在需求和履约条件成立时能看见的潜力。一次性连接投入还需另算，完整情景见案例专章。\n\n为什么要把条件讲清楚？因为“有能力多做”与“顾客会多买”是两件事。如果实际需求只有90份，多生产就可能增加损耗。因此，第一次尝试应同时观察售罄后的需求、补货后的销售和新增支出，让下一次排产有更可靠的根据。\n\n## 企业最终积累的，是什么经验\n\n经过这样的工作，企业留下的就不只是“某店某日销量多少”。它还能看到：当时为什么判断值得补货，工坊和配送怎样配合，员工是否恢复推介，顾客最后买了多少，以及哪个假设与实际不符。\n\n这些材料首先用于完成当天的生产和销售，同时又成为下一轮经营判断的依据。AI可以减少事后重新找材料、问当事人、拼接背景的工作，使更多原来容易消失的经验得到保留。知识研究所讨论的个人实践、表达和共同使用，也正是在这样的往返中发生。[知识研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)\n\n一家企业的know-how往往藏在这种关系里：什么情况下该多做，怎样把多做的货卖出去，哪几个人需要一起改变工作。过去难以持续整理的关系，现在有机会随着生产逐步被保存、检验和改进。这比一张更加整齐的日报，更接近企业能力的积累。\n","exportSingleMd":"# 第2章｜畅销商品卖完了，企业为什么仍可能错过增长\n\n设想一家有八家门店的烘焙企业。点心由中央工坊统一制作，每天早上送到各店，门店营业到晚上八点。总部每天看销售和剩余数量，再安排第二天生产。本章讨论的是其中一款主打点心，不是门店的全部生意；以下情境和数字均来自课程的[连锁烘焙教学案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-a)。\n\n两家店的情况很不一样。位于交通枢纽附近的X店，早上收到80份，下午六点已经全部卖完，之后仍有顾客来问。位于居民区的Y店，同样收到80份，到关门只卖出60份，剩下20份。\n\n如果只看日报，总部很容易作出一个合理决定：明天仍生产160份，把X店增加到100份，Y店减少到60份。这样既没有增加总产量，也可能少一些浪费。但我们还需要问：X店真正的需求究竟有多少？这次调整是在接近全部机会，还是只解决了最容易看见的一小部分？\n\n## “卖了80份”为什么没有把生意讲完整\n\n收银系统准确记录了X店售出的80份商品。可是从下午六点开始，货架上已经没有这款点心。之后再有顾客想买，也不会产生交易记录。于是，同样是“销量80”，可能意味着刚好有80份需求，也可能意味着供给只能满足80份，后面还有需求没有被记录。\n\n店长在工作群里说“18点卖光，后来还有人问”，其实补充了报表里没有的信息。如果这句话在整理日报时被压成一个销量数字，总部下一次预测又只能从80出发。系统保存了发生过的交易，却没有完整保存交易为什么停在这里。\n\n![X店售出80份后未满足需求未知；Y店售60份余20份。销量正确，但X的成交被供给上限截住。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNDYwIiB2aWV3Qm94PSIwIDAgMzYwIDQ2MCIgcm9sZT0iaW1nIj48dGl0bGU+6ZSA6YeP5LiN562J5LqO5YWo6YOo6ZyA5rGCPC90aXRsZT48ZGVzYz7mlZnlrabmoYjkvovvvJpY5Y2W5a6MODDkuKrlkI7pnIDmsYLmnKrnn6XvvIxZ5Y2W5Ye6NjDkuKrliakyMOS4quOAguaWnOe6ueWPquihqOekuuacquiuoemHj++8jOS4jeaMiemrmOW6puS8sOeul+mcgOaxguOAgjwvZGVzYz48ZGVmcz48bWFya2VyIGlkPSJhcnJvdyIgdmlld0JveD 48L3N2Zz4=)\n\n读这张图时，要注意X店右侧并不是已经确定的订单。它表示一块尚未被看清的需求。要判断是否值得增加生产，还要知道售罄后来了多少询问、顾客能否接受稍晚购买，以及其他商品有没有替代掉这部分需求。单凭“卖完了”还算不出应当多做多少。\n\n## 顺着门店往回看，问题会延伸到工坊和员工的工作\n\n在这个教学案例中，进一步核对排产后发现：其他六家店的订单安排好以后，工坊在可用于X、Y两店的那段生产时间里，最多还能做320份，现在只安排了160份。也就是说，这段时间的设备、人员和原料条件还有余量。这里说的是两店相关的生产时段，不能据此认为整座工坊只有一半工作量。\n\n生产有余量，货却不会自己到门店。原来只有早上一次配送，如果下午追加生产，就需要安排新的配送，确认点心到店时仍符合品质要求，并有人接货和上架。在案例设定中，可以考虑下午制作、17点前补到X店，但这项安排会新增支出。\n\n再看门店。员工知道这款点心已经卖完，就停止在社群里推荐它，也不再持续登记预订。他们仍在销售其他商品，只是这款商品已经没有可交付的货，再招徕顾客会造成失望。这种做法对当天来说可以理解，却使总部更难看到本来可能出现的订单。\n\n几项安排由此连在了一起：工坊根据既有销量排产；门店因数量有限而提前售罄；售罄后相关推介和预订停止；总部收不到更多需求线索，下一轮又维持较低产量。每个岗位都在适应眼前条件，但企业整体的增长被共同限制住了。\n\n![本案中，按受限销量排产导致提前售罄，售罄又使推介和预订停止，新的需求线索更少返回排产。工坊、门店与需求反馈需要一起改变。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNjUwIiB2aWV3Qm94PSIwIDAgMzYwIDY1MCIgcm9sZT0iaW1nIj48dGl0bGU+57y66LSn5oCO5qC35Y6L5L2P5LiL5LiA6L2u5aKe6ZW/PC90aXRsZT48ZGVzYz7mlZnlrabmoYjkvovkuK3nmoTogZTliqjvvJrlj5fpmZDplIDph4/lhrPlrprmjpLkuqfvvIzmj5DliY3llK7nvYTkvb/mjqjku4vkuI7pooTorqLlgZzmraLvvIzpnIDmsYLnur/ntKLlh4/lsJHvvIzlho3lm57liLDlgY/kvY7mjpLkuqfjgILnjrDlnLrmoLjlrp7nmoTnlJ/kuqfnqpflj6Pku43mnInkvZnph4/jgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjY1MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7nvLrotKfmgI7moLfljovkvY/kuIvkuIDova7lop7plb88L3RleHQ+PHRleHQgeD0iMjQiIHk9Ijc2IiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm 40元。为了比较方案，我们把它称为“当日贡献”：它还要用于覆盖企业原有工资、租金等费用，因此不是企业净利润。\n\n只调整分配时，X店配100份、Y店配60份，总产量不变，却能把160份全部售出。销售款增加到1920元，生产支出仍是640元，当日贡献变为1280元。这个240元的改善，靠普通的分配调整就有机会取得，不能全部算成AI的收益。\n\n如果再把X店增加到160份，Y店仍为60份，就要生产220份。假定这些货都售出，销售款是2640元，生产支出880元。再扣除新增配送50元、AI及外部整理服务30元，共80元，当日贡献为1680元。三种完整安排可放在一起比较：\n\n| 当天的安排 | 生产数量 | 售出数量 | 扣除列出支出后的当日贡献 |\n|---|---:|---:|---:|\n| X、Y各配80份 | 160份 | 140份 | 1040元 |\n| X配100份、Y配60份 | 160份 | 160份 | 1280元 |\n| X配160份、Y配60份，并安排补货 | 220份 | 220份 | 1680元 |\n\n第三种安排比原来多640元，比已经调整好分配的第二种多400元。X店这款商品销量从80份增至160份，确实翻倍；两店合计从140份增至220份，增加约57.1%。这不是整店收入翻倍，更不是已经发生的经营成果，而是在需求和履约条件成立时能看见的潜力。一次性连接投入还需另算，完整情景见案例专章。\n\n为什么要把条件讲清楚？因为“有能力多做”与“顾客会多买”是两件事。如果实际需求只有90份，多生产就可能增加损耗。因此，第一次尝试应同时观察售罄后的需求、补货后的销售和新增支出，让下一次排产有更可靠的根据。\n\n## 企业最终积累的，是什么经验\n\n经过这样的工作，企业留下的就不只是“某店某日销量多少”。它还能看到：当时为什么判断值得补货，工坊和配送怎样配合，员工是否恢复推介，顾客最后买了多少，以及哪个假设与实际不符。\n\n这些材料首先用于完成当天的生产和销售，同时又成为下一轮经营判断的依据。AI可以减少事后重新找材料、问当事人、拼接背景的工作，使更多原来容易消失的经验得到保留。知识研究所讨论的个人实践、表达和共同使用，也正是在这样的往返中发生。[知识研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)\n\n一家企业的know-how往往藏在这种关系里：什么情况下该多做，怎样把多做的货卖出去，哪几个人需要一起改变工作。过去难以持续整理的关系，现在有机会随着生产逐步被保存、检验和改进。这比一张更加整齐的日报，更接近企业能力的积累。\n","text":"# 第2章｜畅销商品卖完了，企业为什么仍可能错过增长\n\n设想一家有八家门店的烘焙企业。点心由中央工坊统一制作，每天早上送到各店，门店营业到晚上八点。总部每天看销售和剩余数量，再安排第二天生产。本章讨论的是其中一款主打点心，不是门店的全部生意；以下情境和数字均来自课程的连锁烘焙教学案例。\n\n两家店的情况很不一样。位于交通枢纽附近的X店，早上收到80份，下午六点已经全部卖完，之后仍有顾客来问。位于居民区的Y店，同样收到80份，到关门只卖出60份，剩下20份。\n\n如果只看日报，总部很容易作出一个合理决定：明天仍生产160份，把X店增加到100份，Y店减少到60份。这样既没有增加总产量，也可能少一些浪费。但我们还需要问：X店真正的需求究竟有多少？这次调整是在接近全部机会，还是只解决了最容易看见的一小部分？\n\n## “卖了80份”为什么没有把生意讲完整\n\n收银系统准确记录了X店售出的80份商品。可是从下午六点开始，货架上已经没有这款点心。之后再有顾客想买，也不会产生交易记录。于是，同样是“销量80”，可能意味着刚好有80份需求，也可能意味着供给只能满足80份，后面还有需求没有被记录。\n\n店长在工作群里说“18点卖光，后来还有人问”，其实补充了报表里没有的信息。如果这句话在整理日报时被压成一个销量数字，总部下一次预测又只能从80出发。系统保存了发生过的交易，却没有完整保存交易为什么停在这里。\n\n \n\n读这张图时，要注意X店右侧并不是已经确定的订单。它表示一块尚未被看清的需求。要判断是否值得增加生产，还要知道售罄后来了多少询问、顾客能否接受稍晚购买，以及其他商品有没有替代掉这部分需求。单凭“卖完了”还算不出应当多做多少。\n\n## 顺着门店往回看，问题会延伸到工坊和员工的工作\n\n在这个教学案例中，进一步核对排产后发现：其他六家店的订单安排好以后，工坊在可用于X、Y两店的那段生产时间里，最多还能做320份，现在只安排了160份。也就是说，这段时间的设备、人员和原料条件还有余量。这里说的是两店相关的生产时段，不能据此认为整座工坊只有一半工作量。\n\n生产有余量，货却不会自己到门店。原来只有早上一次配送，如果下午追加生产，就需要安排新的配送，确认点心到店时仍符合品质要求，并有人接货和上架。在案例设定中，可以考虑下午制作、17点前补到X店，但这项安排会新增支出。\n\n再看门店。员工知道这款点心已经卖完，就停止在社群里推荐它，也不再持续登记预订。他们仍在销售其他商品，只是这款商品已经没有可交付的货，再招徕顾客会造成失望。这种做法对当天来说可以理解，却使总部更难看到本来可能出现的订单。\n\n几项安排由此连在了一起：工坊根据既有销量排产；门店因数量有限而提前售罄；售罄后相关推介和预订停止；总部收不到更多需求线索，下一轮又维持较低产量。每个岗位都在适应眼前条件，但企业整体的增长被共同限制住了。\n\n \n\n图中的箭头表示这种相互影响。要改变它，不能只给店长一个“积极推广”的要求：没有货，推广难以持续；也不能只让工坊多生产：没有合适的配送和门店动作，多出来的点心可能变成损耗。\n\n## AI怎样帮助人把这些联系看见并用起来\n\n销售时段在收银记录里，顾客询问在聊天里，工坊余量在排产安排里，配送条件又由另一组人掌握。过去，要持续把这些材料放在一起，需要有人逐条找、对照和追问。企业即使知道这种分析有价值，也未必负担得起每天这样做。\n\nAI可以协助把同一天、同一商品、同一家店的不同材料对应起来，找出值得追查的矛盾：为什么连续提前售罄，排产却没有增加？为什么工坊仍有可用时间，门店却无法补货？它还可以根据这些材料整理几种方案，帮助负责人比较。\n\n这些问题仍要回到现场确认。FDE负责让材料能进入同一项工作，把待确认的事项送到相应人员面前，并把批准后的补货、推介和结果记录接起来。门店和工坊负责人则确认需求、品质与资源。AI擅长协助连接分散的信息；这种连接只有经过核实并改变了实际安排，才会带来经营效果。\n\n## 增长潜力需要怎样算，才看得清楚\n\n为了看清三种安排的差别，先作一个明确假设：在某类正常营业日，X店这款点心有160份实际可成交需求，Y店有60份。每份售价12元，做出来一份需要4元原料等变动成本；当天未售部分没有残值。原有工资和租金在三种方案中不变。\n\n原来两店各配80份，共生产160份，实际卖出140份。收到的销售款是140×12＝1680元，生产支出是160×4＝640元，相减得到1040元。为了比较方案，我们把它称为“当日贡献”：它还要用于覆盖企业原有工资、租金等费用，因此不是企业净利润。\n\n只调整分配时，X店配100份、Y店配60份，总产量不变，却能把160份全部售出。销售款增加到1920元，生产支出仍是640元，当日贡献变为1280元。这个240元的改善，靠普通的分配调整就有机会取得，不能全部算成AI的收益。\n\n如果再把X店增加到160份，Y店仍为60份，就要生产220份。假定这些货都售出，销售款是2640元，生产支出880元。再扣除新增配送50元、AI及外部整理服务30元，共80元，当日贡献为1680元。三种完整安排可放在一起比较：\n\n| 当天的安排 | 生产数量 | 售出数量 | 扣除列出支出后的当日贡献 |\n|---|---:|---:|---:|\n| X、Y各配80份 | 160份 | 140份 | 1040元 |\n| X配100份、Y配60份 | 160份 | 160份 | 1280元 |\n| X配160份、Y配60份，并安排补货 | 220份 | 220份 | 1680元 |\n\n第三种安排比原来多640元，比已经调整好分配的第二种多400元。X店这款商品销量从80份增至160份，确实翻倍；两店合计从140份增至220份，增加约57.1%。这不是整店收入翻倍，更不是已经发生的经营成果，而是在需求和履约条件成立时能看见的潜力。一次性连接投入还需另算，完整情景见案例专章。\n\n为什么要把条件讲清楚？因为“有能力多做”与“顾客会多买”是两件事。如果实际需求只有90份，多生产就可能增加损耗。因此，第一次尝试应同时观察售罄后的需求、补货后的销售和新增支出，让下一次排产有更可靠的根据。\n\n## 企业最终积累的，是什么经验\n\n经过这样的工作，企业留下的就不只是“某店某日销量多少”。它还能看到：当时为什么判断值得补货，工坊和配送怎样配合，员工是否恢复推介，顾客最后买了多少，以及哪个假设与实际不符。\n\n这些材料首先用于完成当天的生产和销售，同时又成为下一轮经营判断的依据。AI可以减少事后重新找材料、问当事人、拼接背景的工作，使更多原来容易消失的经验得到保留。知识研究所讨论的个人实践、表达和共同使用，也正是在这样的往返中发生。知识研究\n\n一家企业的know-how往往藏在这种关系里：什么情况下该多做，怎样把多做的货卖出去，哪几个人需要一起改变工作。过去难以持续整理的关系，现在有机会随着生产逐步被保存、检验和改进。这比一张更加整齐的日报，更接近企业能力的积累。\n"},{"file":"03-产业重构.md","id":"lesson-03","number":3,"role":"核心课","part":0,"title":"第3章｜AI改变成本以后，谁会得到新的价值","md":"# 第3章｜AI改变成本以后，谁会得到新的价值\n\n一家为工业品牌制作文章和产品资料的服务团队，原来由编辑采访、查资料、写初稿，再请技术人员核验。客户愿意付费，是因为自己没有足够的人手，也缺少把复杂产品讲清楚的能力。\n\nAI能更快起草以后，团队自然想：同样的人是不是可以交更多稿？但客户也可能开始用AI自己写初稿，只请外部团队检查技术内容。原来包含采访、整理、写作和核验的一笔费用，可能被重新拆开。企业提高效率的同时，原有服务的价格和购买方式也在变化。\n\n[工业品牌内容服务案例](案例D-专业服务.md)用这个情境说明：判断AI对生意的影响，不能只看内部省了多少工作，还要看客户为什么付钱、竞争者能够提供什么，以及最后谁保留了收益。\n\n## 成本下降以后，同一项工作可能换人做\n\n假如整理一份产品说明原来需要专业人员投入很多时间，小客户可能索性不做。AI降低了起草门槛，这些客户开始有能力制作材料，市场需求有机会扩大。\n\n另一类客户原来一直外包，现在内部员工也能完成初稿，就可能减少这部分采购。与此同时，其他服务商也取得相似工具，可能用更低价格争取订单。因此，同一项技术进步可以同时带来新增客户、客户自行完成和价格下降，企业受到哪种影响，要看原来卖的究竟是什么。\n\n如果服务价值主要是把已有材料改写得通顺，客户更容易替代它。如果价值包含理解行业工况、核对产品适用范围、把内容与销售询问接起来，客户仍可能需要外部团队，只是会重新评价这项服务的价格和责任。\n\n这就是产业变化进入一家企业的具体路径：先有一些工作变得更容易承担，接着改变谁来做，再改变不同工作的组合，最后影响收费。无需等整个行业发生一次明显的大变革，这些变化就可能已经出现在下一份客户合同里。\n\n## 为什么业务量上升，利润仍可能没有改善\n\n用课程中的工业品报价情景算一笔简化账。企业原来每月成交200单，每单扣除采购和变动履约支出后留下500元，共留下100000元，用于覆盖固定费用和形成利润。\n\n如果AI帮助企业更快处理询价，每月成交增加到250单，但竞争加剧迫使企业降价，每单只留下400元，那么250×400仍然是100000元。订单多了四分之一，留下的钱却没有增加；如果还新增了系统与FDE服务费用，最终结果可能更差。\n\n这笔计算没有断言AI一定会引起降价。它揭示的是两个必须分开判断的问题：企业有没有创造更多客户愿意购买的结果，以及这些结果带来的价值由谁取得。客户可能通过更低价格取得收益，平台可能通过掌握客户入口获得收益，企业自身则未必保留足够回报。\n\nTeece关于商业模式和互补能力的研究，将技术与价值获取联系起来。所谓互补能力，是使技术真正产生商业结果所需的其他条件，例如渠道、服务网络、制造能力或客户关系。[商业模式研究](https://www.sciencedirect.com/science/article/pii/S002463010900051X)、[互补能力研究](https://pubsonline.informs.org/doi/abs/10.1287/inte.18.3.46) 对工业品经销商而言，会生成报价并不足够，能找到可靠货源、确认适配并按期交付，才更可能影响客户选择。\n\n## 原有服务可以怎样重新组合\n\n回到内容团队。它至少有三种值得分别判断的方向。第一种是把现有服务做得更快：仍然交付准确、可发布的产品材料，但减少制作周期。第二种是专门核验客户自己生成的材料：指出技术错误、补依据、负责明确范围内的专业检查。第三种是进一步参与客户获客：持续观察哪些产品问题带来有效询价，再帮助调整内容和销售衔接。\n\n这三种服务可能使用同一个模型，实际工作却不同。快速交稿需要控制制作和核验时间；独立核验需要清楚哪些判断由团队负责；持续获客则需要客户提供询价和跟进结果，还需要销售团队采取行动。第三种听起来价值更高，但如果拿不到这些资料、不能影响后续行动，团队就无法兑现新承诺。\n\n| 服务选择 | 客户为什么购买 | 交付必须具备的条件 |\n|---|---|---|\n| 更快制作技术内容 | 更早得到能发布的材料 | 准确依据、审核时间、可靠交期 |\n| 核验客户自制内容 | 降低错误和修改负担 | 明确核验范围、现行资料、专业责任 |\n| 持续获客支持 | 改善从内容到有效询价的过程 | 客户反馈、销售协作、持续调整能力 |\n\n比较时，应先找出客户已经感到困难、愿意付费解决的部分，再计算企业能否持续提供。长期服务不是天然更好，交更多内容也不是天然更有价值。\n\n## FDE需要理解的不只是当前流程\n\n如果FDE只问“怎样把写稿速度提高”，可能成功加快一个正在降价的环节。还需要和业务负责人一起追问：客户开始自己做哪些事？仍然不放心哪些事？企业现有的专业判断、资料和关系，能否被重新组合成更有价值的交付？\n\n回答这些问题，才知道接下来该连接哪种数据、改造哪段工作、保留什么经验。技术改造由此与业务发展发生联系。企业不必预知整个行业的终局，但应能看见自己最耗时的环节是否仍然值得客户付费，以及什么能力将使客户继续选择自己。\n","html":"\u003ch1>第3章｜AI改变成本以后，谁会得到新的价值\u003c/h1>\n\u003cp>一家为工业品牌制作文章和产品资料的服务团队，原来由编辑采访、查资料、写初稿，再请技术人员核验。客户愿意付费，是因为自己没有足够的人手，也缺少把复杂产品讲清楚的能力。\u003c/p>\n\u003cp>AI能更快起草以后，团队自然想：同样的人是不是可以交更多稿？但客户也可能开始用AI自己写初稿，只请外部团队检查技术内容。原来包含采访、整理、写作和核验的一笔费用，可能被重新拆开。企业提高效率的同时，原有服务的价格和购买方式也在变化。\u003c/p>\n\u003cp>\u003ca href=\"#case-d\">工业品牌内容服务案例\u003c/a>用这个情境说明：判断AI对生意的影响，不能只看内部省了多少工作，还要看客户为什么付钱、竞争者能够提供什么，以及最后谁保留了收益。\u003c/p>\n\u003ch2 id=\"lesson-03-section-1\">成本下降以后，同一项工作可能换人做\u003c/h2>\n\u003cp>假如整理一份产品说明原来需要专业人员投入很多时间，小客户可能索性不做。AI降低了起草门槛，这些客户开始有能力制作材料，市场需求有机会扩大。\u003c/p>\n\u003cp>另一类客户原来一直外包，现在内部员工也能完成初稿，就可能减少这部分采购。与此同时，其他服务商也取得相似工具，可能用更低价格争取订单。因此，同一项技术进步可以同时带来新增客户、客户自行完成和价格下降，企业受到哪种影响，要看原来卖的究竟是什么。\u003c/p>\n\u003cp>如果服务价值主要是把已有材料改写得通顺，客户更容易替代它。如果价值包含理解行业工况、核对产品适用范围、把内容与销售询问接起来，客户仍可能需要外部团队，只是会重新评价这项服务的价格和责任。\u003c/p>\n\u003cp>这就是产业变化进入一家企业的具体路径：先有一些工作变得更容易承担，接着改变谁来做，再改变不同工作的组合，最后影响收费。无需等整个行业发生一次明显的大变革，这些变化就可能已经出现在下一份客户合同里。\u003c/p>\n\u003ch2 id=\"lesson-03-section-2\">为什么业务量上升，利润仍可能没有改善\u003c/h2>\n\u003cp>用课程中的工业品报价情景算一笔简化账。企业原来每月成交200单，每单扣除采购和变动履约支出后留下500元，共留下100000元，用于覆盖固定费用和形成利润。\u003c/p>\n\u003cp>如果AI帮助企业更快处理询价，每月成交增加到250单，但竞争加剧迫使企业降价，每单只留下400元，那么250×400仍然是100000元。订单多了四分之一，留下的钱却没有增加；如果还新增了系统与FDE服务费用，最终结果可能更差。\u003c/p>\n\u003cp>这笔计算没有断言AI一定会引起降价。它揭示的是两个必须分开判断的问题：企业有没有创造更多客户愿意购买的结果，以及这些结果带来的价值由谁取得。客户可能通过更低价格取得收益，平台可能通过掌握客户入口获得收益，企业自身则未必保留足够回报。\u003c/p>\n\u003cp>Teece关于商业模式和互补能力的研究，将技术与价值获取联系起来。所谓互补能力，是使技术真正产生商业结果所需的其他条件，例如渠道、服务网络、制造能力或客户关系。\u003ca href=\"https://www.sciencedirect.com/science/article/pii/S002463010900051X\" target=\"_blank\" rel=\"noopener noreferrer\">商业模式研究\u003c/a>、\u003ca href=\"https://pubsonline.informs.org/doi/abs/10.1287/inte.18.3.46\" target=\"_blank\" rel=\"noopener noreferrer\">互补能力研究\u003c/a> 对工业品经销商而言，会生成报价并不足够，能找到可靠货源、确认适配并按期交付，才更可能影响客户选择。\u003c/p>\n\u003ch2 id=\"lesson-03-section-3\">原有服务可以怎样重新组合\u003c/h2>\n\u003cp>回到内容团队。它至少有三种值得分别判断的方向。第一种是把现有服务做得更快：仍然交付准确、可发布的产品材料，但减少制作周期。第二种是专门核验客户自己生成的材料：指出技术错误、补依据、负责明确范围内的专业检查。第三种是进一步参与客户获客：持续观察哪些产品问题带来有效询价，再帮助调整内容和销售衔接。\u003c/p>\n\u003cp>这三种服务可能使用同一个模型，实际工作却不同。快速交稿需要控制制作和核验时间；独立核验需要清楚哪些判断由团队负责；持续获客则需要客户提供询价和跟进结果，还需要销售团队采取行动。第三种听起来价值更高，但如果拿不到这些资料、不能影响后续行动，团队就无法兑现新承诺。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>服务选择\u003c/th>\n\u003cth>客户为什么购买\u003c/th>\n\u003cth>交付必须具备的条件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>更快制作技术内容\u003c/td>\n\u003ctd>更早得到能发布的材料\u003c/td>\n\u003ctd>准确依据、审核时间、可靠交期\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>核验客户自制内容\u003c/td>\n\u003ctd>降低错误和修改负担\u003c/td>\n\u003ctd>明确核验范围、现行资料、专业责任\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>持续获客支持\u003c/td>\n\u003ctd>改善从内容到有效询价的过程\u003c/td>\n\u003ctd>客户反馈、销售协作、持续调整能力\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>比较时，应先找出客户已经感到困难、愿意付费解决的部分，再计算企业能否持续提供。长期服务不是天然更好，交更多内容也不是天然更有价值。\u003c/p>\n\u003ch2 id=\"lesson-03-section-4\">FDE需要理解的不只是当前流程\u003c/h2>\n\u003cp>如果FDE只问“怎样把写稿速度提高”，可能成功加快一个正在降价的环节。还需要和业务负责人一起追问：客户开始自己做哪些事？仍然不放心哪些事？企业现有的专业判断、资料和关系，能否被重新组合成更有价值的交付？\u003c/p>\n\u003cp>回答这些问题，才知道接下来该连接哪种数据、改造哪段工作、保留什么经验。技术改造由此与业务发展发生联系。企业不必预知整个行业的终局，但应能看见自己最耗时的环节是否仍然值得客户付费，以及什么能力将使客户继续选择自己。\u003c/p>\n","headings":[{"id":"lesson-03-section-1","label":"成本下降以后，同一项工作可能换人做"},{"id":"lesson-03-section-2","label":"为什么业务量上升，利润仍可能没有改善"},{"id":"lesson-03-section-3","label":"原有服务可以怎样重新组合"},{"id":"lesson-03-section-4","label":"FDE需要理解的不只是当前流程"}],"exportMd":"# 第3章｜AI改变成本以后，谁会得到新的价值\n\n一家为工业品牌制作文章和产品资料的服务团队，原来由编辑采访、查资料、写初稿，再请技术人员核验。客户愿意付费，是因为自己没有足够的人手，也缺少把复杂产品讲清楚的能力。\n\nAI能更快起草以后，团队自然想：同样的人是不是可以交更多稿？但客户也可能开始用AI自己写初稿，只请外部团队检查技术内容。原来包含采访、整理、写作和核验的一笔费用，可能被重新拆开。企业提高效率的同时，原有服务的价格和购买方式也在变化。\n\n[工业品牌内容服务案例](#case-d)用这个情境说明：判断AI对生意的影响，不能只看内部省了多少工作，还要看客户为什么付钱、竞争者能够提供什么，以及最后谁保留了收益。\n\n## 成本下降以后，同一项工作可能换人做\n\n假如整理一份产品说明原来需要专业人员投入很多时间，小客户可能索性不做。AI降低了起草门槛，这些客户开始有能力制作材料，市场需求有机会扩大。\n\n另一类客户原来一直外包，现在内部员工也能完成初稿，就可能减少这部分采购。与此同时，其他服务商也取得相似工具，可能用更低价格争取订单。因此，同一项技术进步可以同时带来新增客户、客户自行完成和价格下降，企业受到哪种影响，要看原来卖的究竟是什么。\n\n如果服务价值主要是把已有材料改写得通顺，客户更容易替代它。如果价值包含理解行业工况、核对产品适用范围、把内容与销售询问接起来，客户仍可能需要外部团队，只是会重新评价这项服务的价格和责任。\n\n这就是产业变化进入一家企业的具体路径：先有一些工作变得更容易承担，接着改变谁来做，再改变不同工作的组合，最后影响收费。无需等整个行业发生一次明显的大变革，这些变化就可能已经出现在下一份客户合同里。\n\n## 为什么业务量上升，利润仍可能没有改善\n\n用课程中的工业品报价情景算一笔简化账。企业原来每月成交200单，每单扣除采购和变动履约支出后留下500元，共留下100000元，用于覆盖固定费用和形成利润。\n\n如果AI帮助企业更快处理询价，每月成交增加到250单，但竞争加剧迫使企业降价，每单只留下400元，那么250×400仍然是100000元。订单多了四分之一，留下的钱却没有增加；如果还新增了系统与FDE服务费用，最终结果可能更差。\n\n这笔计算没有断言AI一定会引起降价。它揭示的是两个必须分开判断的问题：企业有没有创造更多客户愿意购买的结果，以及这些结果带来的价值由谁取得。客户可能通过更低价格取得收益，平台可能通过掌握客户入口获得收益，企业自身则未必保留足够回报。\n\nTeece关于商业模式和互补能力的研究，将技术与价值获取联系起来。所谓互补能力，是使技术真正产生商业结果所需的其他条件，例如渠道、服务网络、制造能力或客户关系。[商业模式研究](https://www.sciencedirect.com/science/article/pii/S002463010900051X)、[互补能力研究](https://pubsonline.informs.org/doi/abs/10.1287/inte.18.3.46) 对工业品经销商而言，会生成报价并不足够，能找到可靠货源、确认适配并按期交付，才更可能影响客户选择。\n\n## 原有服务可以怎样重新组合\n\n回到内容团队。它至少有三种值得分别判断的方向。第一种是把现有服务做得更快：仍然交付准确、可发布的产品材料，但减少制作周期。第二种是专门核验客户自己生成的材料：指出技术错误、补依据、负责明确范围内的专业检查。第三种是进一步参与客户获客：持续观察哪些产品问题带来有效询价，再帮助调整内容和销售衔接。\n\n这三种服务可能使用同一个模型，实际工作却不同。快速交稿需要控制制作和核验时间；独立核验需要清楚哪些判断由团队负责；持续获客则需要客户提供询价和跟进结果，还需要销售团队采取行动。第三种听起来价值更高，但如果拿不到这些资料、不能影响后续行动，团队就无法兑现新承诺。\n\n| 服务选择 | 客户为什么购买 | 交付必须具备的条件 |\n|---|---|---|\n| 更快制作技术内容 | 更早得到能发布的材料 | 准确依据、审核时间、可靠交期 |\n| 核验客户自制内容 | 降低错误和修改负担 | 明确核验范围、现行资料、专业责任 |\n| 持续获客支持 | 改善从内容到有效询价的过程 | 客户反馈、销售协作、持续调整能力 |\n\n比较时，应先找出客户已经感到困难、愿意付费解决的部分，再计算企业能否持续提供。长期服务不是天然更好，交更多内容也不是天然更有价值。\n\n## FDE需要理解的不只是当前流程\n\n如果FDE只问“怎样把写稿速度提高”，可能成功加快一个正在降价的环节。还需要和业务负责人一起追问：客户开始自己做哪些事？仍然不放心哪些事？企业现有的专业判断、资料和关系，能否被重新组合成更有价值的交付？\n\n回答这些问题，才知道接下来该连接哪种数据、改造哪段工作、保留什么经验。技术改造由此与业务发展发生联系。企业不必预知整个行业的终局，但应能看见自己最耗时的环节是否仍然值得客户付费，以及什么能力将使客户继续选择自己。\n","exportSingleMd":"# 第3章｜AI改变成本以后，谁会得到新的价值\n\n一家为工业品牌制作文章和产品资料的服务团队，原来由编辑采访、查资料、写初稿，再请技术人员核验。客户愿意付费，是因为自己没有足够的人手，也缺少把复杂产品讲清楚的能力。\n\nAI能更快起草以后，团队自然想：同样的人是不是可以交更多稿？但客户也可能开始用AI自己写初稿，只请外部团队检查技术内容。原来包含采访、整理、写作和核验的一笔费用，可能被重新拆开。企业提高效率的同时，原有服务的价格和购买方式也在变化。\n\n[工业品牌内容服务案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-d)用这个情境说明：判断AI对生意的影响，不能只看内部省了多少工作，还要看客户为什么付钱、竞争者能够提供什么，以及最后谁保留了收益。\n\n## 成本下降以后，同一项工作可能换人做\n\n假如整理一份产品说明原来需要专业人员投入很多时间，小客户可能索性不做。AI降低了起草门槛，这些客户开始有能力制作材料，市场需求有机会扩大。\n\n另一类客户原来一直外包，现在内部员工也能完成初稿，就可能减少这部分采购。与此同时，其他服务商也取得相似工具，可能用更低价格争取订单。因此，同一项技术进步可以同时带来新增客户、客户自行完成和价格下降，企业受到哪种影响，要看原来卖的究竟是什么。\n\n如果服务价值主要是把已有材料改写得通顺，客户更容易替代它。如果价值包含理解行业工况、核对产品适用范围、把内容与销售询问接起来，客户仍可能需要外部团队，只是会重新评价这项服务的价格和责任。\n\n这就是产业变化进入一家企业的具体路径：先有一些工作变得更容易承担，接着改变谁来做，再改变不同工作的组合，最后影响收费。无需等整个行业发生一次明显的大变革，这些变化就可能已经出现在下一份客户合同里。\n\n## 为什么业务量上升，利润仍可能没有改善\n\n用课程中的工业品报价情景算一笔简化账。企业原来每月成交200单，每单扣除采购和变动履约支出后留下500元，共留下100000元，用于覆盖固定费用和形成利润。\n\n如果AI帮助企业更快处理询价，每月成交增加到250单，但竞争加剧迫使企业降价，每单只留下400元，那么250×400仍然是100000元。订单多了四分之一，留下的钱却没有增加；如果还新增了系统与FDE服务费用，最终结果可能更差。\n\n这笔计算没有断言AI一定会引起降价。它揭示的是两个必须分开判断的问题：企业有没有创造更多客户愿意购买的结果，以及这些结果带来的价值由谁取得。客户可能通过更低价格取得收益，平台可能通过掌握客户入口获得收益，企业自身则未必保留足够回报。\n\nTeece关于商业模式和互补能力的研究，将技术与价值获取联系起来。所谓互补能力，是使技术真正产生商业结果所需的其他条件，例如渠道、服务网络、制造能力或客户关系。[商业模式研究](https://www.sciencedirect.com/science/article/pii/S002463010900051X)、[互补能力研究](https://pubsonline.informs.org/doi/abs/10.1287/inte.18.3.46) 对工业品经销商而言，会生成报价并不足够，能找到可靠货源、确认适配并按期交付，才更可能影响客户选择。\n\n## 原有服务可以怎样重新组合\n\n回到内容团队。它至少有三种值得分别判断的方向。第一种是把现有服务做得更快：仍然交付准确、可发布的产品材料，但减少制作周期。第二种是专门核验客户自己生成的材料：指出技术错误、补依据、负责明确范围内的专业检查。第三种是进一步参与客户获客：持续观察哪些产品问题带来有效询价，再帮助调整内容和销售衔接。\n\n这三种服务可能使用同一个模型，实际工作却不同。快速交稿需要控制制作和核验时间；独立核验需要清楚哪些判断由团队负责；持续获客则需要客户提供询价和跟进结果，还需要销售团队采取行动。第三种听起来价值更高，但如果拿不到这些资料、不能影响后续行动，团队就无法兑现新承诺。\n\n| 服务选择 | 客户为什么购买 | 交付必须具备的条件 |\n|---|---|---|\n| 更快制作技术内容 | 更早得到能发布的材料 | 准确依据、审核时间、可靠交期 |\n| 核验客户自制内容 | 降低错误和修改负担 | 明确核验范围、现行资料、专业责任 |\n| 持续获客支持 | 改善从内容到有效询价的过程 | 客户反馈、销售协作、持续调整能力 |\n\n比较时，应先找出客户已经感到困难、愿意付费解决的部分，再计算企业能否持续提供。长期服务不是天然更好，交更多内容也不是天然更有价值。\n\n## FDE需要理解的不只是当前流程\n\n如果FDE只问“怎样把写稿速度提高”，可能成功加快一个正在降价的环节。还需要和业务负责人一起追问：客户开始自己做哪些事？仍然不放心哪些事？企业现有的专业判断、资料和关系，能否被重新组合成更有价值的交付？\n\n回答这些问题，才知道接下来该连接哪种数据、改造哪段工作、保留什么经验。技术改造由此与业务发展发生联系。企业不必预知整个行业的终局，但应能看见自己最耗时的环节是否仍然值得客户付费，以及什么能力将使客户继续选择自己。\n","text":"# 第3章｜AI改变成本以后，谁会得到新的价值\n\n一家为工业品牌制作文章和产品资料的服务团队，原来由编辑采访、查资料、写初稿，再请技术人员核验。客户愿意付费，是因为自己没有足够的人手，也缺少把复杂产品讲清楚的能力。\n\nAI能更快起草以后，团队自然想：同样的人是不是可以交更多稿？但客户也可能开始用AI自己写初稿，只请外部团队检查技术内容。原来包含采访、整理、写作和核验的一笔费用，可能被重新拆开。企业提高效率的同时，原有服务的价格和购买方式也在变化。\n\n工业品牌内容服务案例用这个情境说明：判断AI对生意的影响，不能只看内部省了多少工作，还要看客户为什么付钱、竞争者能够提供什么，以及最后谁保留了收益。\n\n## 成本下降以后，同一项工作可能换人做\n\n假如整理一份产品说明原来需要专业人员投入很多时间，小客户可能索性不做。AI降低了起草门槛，这些客户开始有能力制作材料，市场需求有机会扩大。\n\n另一类客户原来一直外包，现在内部员工也能完成初稿，就可能减少这部分采购。与此同时，其他服务商也取得相似工具，可能用更低价格争取订单。因此，同一项技术进步可以同时带来新增客户、客户自行完成和价格下降，企业受到哪种影响，要看原来卖的究竟是什么。\n\n如果服务价值主要是把已有材料改写得通顺，客户更容易替代它。如果价值包含理解行业工况、核对产品适用范围、把内容与销售询问接起来，客户仍可能需要外部团队，只是会重新评价这项服务的价格和责任。\n\n这就是产业变化进入一家企业的具体路径：先有一些工作变得更容易承担，接着改变谁来做，再改变不同工作的组合，最后影响收费。无需等整个行业发生一次明显的大变革，这些变化就可能已经出现在下一份客户合同里。\n\n## 为什么业务量上升，利润仍可能没有改善\n\n用课程中的工业品报价情景算一笔简化账。企业原来每月成交200单，每单扣除采购和变动履约支出后留下500元，共留下100000元，用于覆盖固定费用和形成利润。\n\n如果AI帮助企业更快处理询价，每月成交增加到250单，但竞争加剧迫使企业降价，每单只留下400元，那么250×400仍然是100000元。订单多了四分之一，留下的钱却没有增加；如果还新增了系统与FDE服务费用，最终结果可能更差。\n\n这笔计算没有断言AI一定会引起降价。它揭示的是两个必须分开判断的问题：企业有没有创造更多客户愿意购买的结果，以及这些结果带来的价值由谁取得。客户可能通过更低价格取得收益，平台可能通过掌握客户入口获得收益，企业自身则未必保留足够回报。\n\nTeece关于商业模式和互补能力的研究，将技术与价值获取联系起来。所谓互补能力，是使技术真正产生商业结果所需的其他条件，例如渠道、服务网络、制造能力或客户关系。商业模式研究、互补能力研究 对工业品经销商而言，会生成报价并不足够，能找到可靠货源、确认适配并按期交付，才更可能影响客户选择。\n\n## 原有服务可以怎样重新组合\n\n回到内容团队。它至少有三种值得分别判断的方向。第一种是把现有服务做得更快：仍然交付准确、可发布的产品材料，但减少制作周期。第二种是专门核验客户自己生成的材料：指出技术错误、补依据、负责明确范围内的专业检查。第三种是进一步参与客户获客：持续观察哪些产品问题带来有效询价，再帮助调整内容和销售衔接。\n\n这三种服务可能使用同一个模型，实际工作却不同。快速交稿需要控制制作和核验时间；独立核验需要清楚哪些判断由团队负责；持续获客则需要客户提供询价和跟进结果，还需要销售团队采取行动。第三种听起来价值更高，但如果拿不到这些资料、不能影响后续行动，团队就无法兑现新承诺。\n\n| 服务选择 | 客户为什么购买 | 交付必须具备的条件 |\n|---|---|---|\n| 更快制作技术内容 | 更早得到能发布的材料 | 准确依据、审核时间、可靠交期 |\n| 核验客户自制内容 | 降低错误和修改负担 | 明确核验范围、现行资料、专业责任 |\n| 持续获客支持 | 改善从内容到有效询价的过程 | 客户反馈、销售协作、持续调整能力 |\n\n比较时，应先找出客户已经感到困难、愿意付费解决的部分，再计算企业能否持续提供。长期服务不是天然更好，交更多内容也不是天然更有价值。\n\n## FDE需要理解的不只是当前流程\n\n如果FDE只问“怎样把写稿速度提高”，可能成功加快一个正在降价的环节。还需要和业务负责人一起追问：客户开始自己做哪些事？仍然不放心哪些事？企业现有的专业判断、资料和关系，能否被重新组合成更有价值的交付？\n\n回答这些问题，才知道接下来该连接哪种数据、改造哪段工作、保留什么经验。技术改造由此与业务发展发生联系。企业不必预知整个行业的终局，但应能看见自己最耗时的环节是否仍然值得客户付费，以及什么能力将使客户继续选择自己。\n"},{"file":"04-共同发展.md","id":"lesson-04","number":4,"role":"核心课","part":0,"title":"第4章｜路线还没有定下来，企业为什么需要开始","md":"# 第4章｜路线还没有定下来，企业为什么需要开始\n\n一家设备售后企业决定用AI整理维修工单。起初，负责人认为目标很清楚：把老师傅的经验留下，让新人查得到。真正把记录放在一起以后，却发现不少“维修成功”的设备过几天又报修，只是换了一张新工单。继续追查，部分重复上门与备件不匹配有关，部分与客户没有提前准备好现场条件有关。\n\n于是，项目的问题变了。整理维修记录仍有用，但要减少重复上门，还要改派工准备、备件确认和后续追踪。这个过程来自课程的[设备售后教学案例](案例C-设备售后.md)。它说明，企业往往不是先知道完整答案，再让技术照着实现；有些答案要在真实使用中才能形成。\n\n## 为什么有些学习不能靠等待替代\n\n等待工具成熟当然有价值。较成熟的产品可能更稳定，也可能减少企业自己开发基础功能的成本。但工具成熟，并不会自动告诉这家企业：它的重复上门主要发生在哪些设备，客户最在意哪类等待，哪些信息一直在交接中丢失。\n\n这些认识需要在自己的业务里积累。企业必须把一次报修从接单看到恢复，再看到后续是否复发，才能知道原来的记录能说明什么、还缺什么。即使以后更换模型，这些认识仍然可以帮助团队判断新工具应该用在哪一段。\n\n吸收能力研究强调，已有相关知识影响组织识别和应用外部知识的能力。[原始研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf) 这里的“已有认识”不一定是一套很大的知识库，也可以是团队已经能分清：这次失败来自资料不足、专业判断有误，还是正确决定没有被执行。能够分清，下一轮改进才有方向。\n\n## 开始，不等于一次把所有工作自动化\n\n这家服务企业可以先选择一种常见设备，把报修、实际操作、备件和再次联系关联起来。人员照常承担关键技术判断，AI协助整理和发现遗漏。这样既能支持当前工作，又能看清后续真正需要改什么。\n\n如果尚未确定重复上门的原因，就直接让系统自动派所有工单，可能只是把旧问题执行得更快。相反，如果现成工具已经能可靠解决明确的资料检索问题，也没有必要为了“转型”重新开发。\n\n因此，积极行动的含义是尽早接触真实任务，尽早获得会影响下一次选择的证据。投入规模可以随认识增加而调整。客户价值还不清楚时，先查需求；价值清楚但材料分散时，先把一小段完整工作接起来；已经稳定有效的做法，则可以扩大使用。\n\n这种做法也符合动态能力研究关注的组织能力：企业要在变化中识别机会、作出投入，并重新安排已有资源。[原始研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf) 对服务企业来说，资源重组可能很具体，就是让原本只负责写维修报告的人开始追踪复发，让派工人员在出发前看见版本与备件条件。\n\n## 双向靠近，发生在一轮轮具体工作中\n\n企业一开始可能只会说“希望少跑冤枉路”。FDE需要跟进实际工单，把这句话拆成可以观察的经过：为什么去、带了什么、到现场发现什么、为什么又去一次。企业提供真实材料、专业解释和工作权限，工程人员将它们组织成可使用的工具和安排。\n\n工具投入使用后，又可能暴露新的问题。例如技术员补充了备件不匹配的原因，团队才发现产品版本名称不统一；统一版本以后，又发现供应商确认太慢。每次新认识都可能改变下一轮工程，而工程改善又让企业看见更完整的生产过程。\n\n这就是企业拥抱AI、AI进入生产的双向过程。企业不是把一套固定流程完整交给技术后就退出，技术也不是交付一个系统后就获得所有答案。双方围绕真实问题不断改进，企业自己的方法才逐步进入AI参与的工作。\n\n## 连续推进为什么需要有人承担\n\n一次培训可以帮助员工理解工具，一次开发可以让某项功能上线。但如果没有人负责后续，新的异常会留在聊天里，旧方法继续运行，系统与实际业务逐渐脱节。持续的FDE力量能够把现场发现转成下一次改进，并核对改进有没有真正被采用。\n\n这不意味着企业必须永久依赖同一家外部团队。业务负责人仍需判断什么值得做，内部人员需要逐步掌握关键方法，资料、工具和验证方式也应能够接续。连续性应体现在企业始终有人推进这项工作，而不只是合同一直续费。\n\n未来的最佳组织形态尚未确定，恰好使这些学习更重要。企业今天开始积累的，不必是一套永不改变的答案，而是更快发现问题、更好使用新能力，并在结果不符合预期时改法的能力。\n","html":"\u003ch1>第4章｜路线还没有定下来，企业为什么需要开始\u003c/h1>\n\u003cp>一家设备售后企业决定用AI整理维修工单。起初，负责人认为目标很清楚：把老师傅的经验留下，让新人查得到。真正把记录放在一起以后，却发现不少“维修成功”的设备过几天又报修，只是换了一张新工单。继续追查，部分重复上门与备件不匹配有关，部分与客户没有提前准备好现场条件有关。\u003c/p>\n\u003cp>于是，项目的问题变了。整理维修记录仍有用，但要减少重复上门，还要改派工准备、备件确认和后续追踪。这个过程来自课程的\u003ca href=\"#case-c\">设备售后教学案例\u003c/a>。它说明，企业往往不是先知道完整答案，再让技术照着实现；有些答案要在真实使用中才能形成。\u003c/p>\n\u003ch2 id=\"lesson-04-section-1\">为什么有些学习不能靠等待替代\u003c/h2>\n\u003cp>等待工具成熟当然有价值。较成熟的产品可能更稳定，也可能减少企业自己开发基础功能的成本。但工具成熟，并不会自动告诉这家企业：它的重复上门主要发生在哪些设备，客户最在意哪类等待，哪些信息一直在交接中丢失。\u003c/p>\n\u003cp>这些认识需要在自己的业务里积累。企业必须把一次报修从接单看到恢复，再看到后续是否复发，才能知道原来的记录能说明什么、还缺什么。即使以后更换模型，这些认识仍然可以帮助团队判断新工具应该用在哪一段。\u003c/p>\n\u003cp>吸收能力研究强调，已有相关知识影响组织识别和应用外部知识的能力。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a> 这里的“已有认识”不一定是一套很大的知识库，也可以是团队已经能分清：这次失败来自资料不足、专业判断有误，还是正确决定没有被执行。能够分清，下一轮改进才有方向。\u003c/p>\n\u003ch2 id=\"lesson-04-section-2\">开始，不等于一次把所有工作自动化\u003c/h2>\n\u003cp>这家服务企业可以先选择一种常见设备，把报修、实际操作、备件和再次联系关联起来。人员照常承担关键技术判断，AI协助整理和发现遗漏。这样既能支持当前工作，又能看清后续真正需要改什么。\u003c/p>\n\u003cp>如果尚未确定重复上门的原因，就直接让系统自动派所有工单，可能只是把旧问题执行得更快。相反，如果现成工具已经能可靠解决明确的资料检索问题，也没有必要为了“转型”重新开发。\u003c/p>\n\u003cp>因此，积极行动的含义是尽早接触真实任务，尽早获得会影响下一次选择的证据。投入规模可以随认识增加而调整。客户价值还不清楚时，先查需求；价值清楚但材料分散时，先把一小段完整工作接起来；已经稳定有效的做法，则可以扩大使用。\u003c/p>\n\u003cp>这种做法也符合动态能力研究关注的组织能力：企业要在变化中识别机会、作出投入，并重新安排已有资源。\u003ca href=\"https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a> 对服务企业来说，资源重组可能很具体，就是让原本只负责写维修报告的人开始追踪复发，让派工人员在出发前看见版本与备件条件。\u003c/p>\n\u003ch2 id=\"lesson-04-section-3\">双向靠近，发生在一轮轮具体工作中\u003c/h2>\n\u003cp>企业一开始可能只会说“希望少跑冤枉路”。FDE需要跟进实际工单，把这句话拆成可以观察的经过：为什么去、带了什么、到现场发现什么、为什么又去一次。企业提供真实材料、专业解释和工作权限，工程人员将它们组织成可使用的工具和安排。\u003c/p>\n\u003cp>工具投入使用后，又可能暴露新的问题。例如技术员补充了备件不匹配的原因，团队才发现产品版本名称不统一；统一版本以后，又发现供应商确认太慢。每次新认识都可能改变下一轮工程，而工程改善又让企业看见更完整的生产过程。\u003c/p>\n\u003cp>这就是企业拥抱AI、AI进入生产的双向过程。企业不是把一套固定流程完整交给技术后就退出，技术也不是交付一个系统后就获得所有答案。双方围绕真实问题不断改进，企业自己的方法才逐步进入AI参与的工作。\u003c/p>\n\u003ch2 id=\"lesson-04-section-4\">连续推进为什么需要有人承担\u003c/h2>\n\u003cp>一次培训可以帮助员工理解工具，一次开发可以让某项功能上线。但如果没有人负责后续，新的异常会留在聊天里，旧方法继续运行，系统与实际业务逐渐脱节。持续的FDE力量能够把现场发现转成下一次改进，并核对改进有没有真正被采用。\u003c/p>\n\u003cp>这不意味着企业必须永久依赖同一家外部团队。业务负责人仍需判断什么值得做，内部人员需要逐步掌握关键方法，资料、工具和验证方式也应能够接续。连续性应体现在企业始终有人推进这项工作，而不只是合同一直续费。\u003c/p>\n\u003cp>未来的最佳组织形态尚未确定，恰好使这些学习更重要。企业今天开始积累的，不必是一套永不改变的答案，而是更快发现问题、更好使用新能力，并在结果不符合预期时改法的能力。\u003c/p>\n","headings":[{"id":"lesson-04-section-1","label":"为什么有些学习不能靠等待替代"},{"id":"lesson-04-section-2","label":"开始，不等于一次把所有工作自动化"},{"id":"lesson-04-section-3","label":"双向靠近，发生在一轮轮具体工作中"},{"id":"lesson-04-section-4","label":"连续推进为什么需要有人承担"}],"exportMd":"# 第4章｜路线还没有定下来，企业为什么需要开始\n\n一家设备售后企业决定用AI整理维修工单。起初，负责人认为目标很清楚：把老师傅的经验留下，让新人查得到。真正把记录放在一起以后，却发现不少“维修成功”的设备过几天又报修，只是换了一张新工单。继续追查，部分重复上门与备件不匹配有关，部分与客户没有提前准备好现场条件有关。\n\n于是，项目的问题变了。整理维修记录仍有用，但要减少重复上门，还要改派工准备、备件确认和后续追踪。这个过程来自课程的[设备售后教学案例](#case-c)。它说明，企业往往不是先知道完整答案，再让技术照着实现；有些答案要在真实使用中才能形成。\n\n## 为什么有些学习不能靠等待替代\n\n等待工具成熟当然有价值。较成熟的产品可能更稳定，也可能减少企业自己开发基础功能的成本。但工具成熟，并不会自动告诉这家企业：它的重复上门主要发生在哪些设备，客户最在意哪类等待，哪些信息一直在交接中丢失。\n\n这些认识需要在自己的业务里积累。企业必须把一次报修从接单看到恢复，再看到后续是否复发，才能知道原来的记录能说明什么、还缺什么。即使以后更换模型，这些认识仍然可以帮助团队判断新工具应该用在哪一段。\n\n吸收能力研究强调，已有相关知识影响组织识别和应用外部知识的能力。[原始研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf) 这里的“已有认识”不一定是一套很大的知识库，也可以是团队已经能分清：这次失败来自资料不足、专业判断有误，还是正确决定没有被执行。能够分清，下一轮改进才有方向。\n\n## 开始，不等于一次把所有工作自动化\n\n这家服务企业可以先选择一种常见设备，把报修、实际操作、备件和再次联系关联起来。人员照常承担关键技术判断，AI协助整理和发现遗漏。这样既能支持当前工作，又能看清后续真正需要改什么。\n\n如果尚未确定重复上门的原因，就直接让系统自动派所有工单，可能只是把旧问题执行得更快。相反，如果现成工具已经能可靠解决明确的资料检索问题，也没有必要为了“转型”重新开发。\n\n因此，积极行动的含义是尽早接触真实任务，尽早获得会影响下一次选择的证据。投入规模可以随认识增加而调整。客户价值还不清楚时，先查需求；价值清楚但材料分散时，先把一小段完整工作接起来；已经稳定有效的做法，则可以扩大使用。\n\n这种做法也符合动态能力研究关注的组织能力：企业要在变化中识别机会、作出投入，并重新安排已有资源。[原始研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf) 对服务企业来说，资源重组可能很具体，就是让原本只负责写维修报告的人开始追踪复发，让派工人员在出发前看见版本与备件条件。\n\n## 双向靠近，发生在一轮轮具体工作中\n\n企业一开始可能只会说“希望少跑冤枉路”。FDE需要跟进实际工单，把这句话拆成可以观察的经过：为什么去、带了什么、到现场发现什么、为什么又去一次。企业提供真实材料、专业解释和工作权限，工程人员将它们组织成可使用的工具和安排。\n\n工具投入使用后，又可能暴露新的问题。例如技术员补充了备件不匹配的原因，团队才发现产品版本名称不统一；统一版本以后，又发现供应商确认太慢。每次新认识都可能改变下一轮工程，而工程改善又让企业看见更完整的生产过程。\n\n这就是企业拥抱AI、AI进入生产的双向过程。企业不是把一套固定流程完整交给技术后就退出，技术也不是交付一个系统后就获得所有答案。双方围绕真实问题不断改进，企业自己的方法才逐步进入AI参与的工作。\n\n## 连续推进为什么需要有人承担\n\n一次培训可以帮助员工理解工具，一次开发可以让某项功能上线。但如果没有人负责后续，新的异常会留在聊天里，旧方法继续运行，系统与实际业务逐渐脱节。持续的FDE力量能够把现场发现转成下一次改进，并核对改进有没有真正被采用。\n\n这不意味着企业必须永久依赖同一家外部团队。业务负责人仍需判断什么值得做，内部人员需要逐步掌握关键方法，资料、工具和验证方式也应能够接续。连续性应体现在企业始终有人推进这项工作，而不只是合同一直续费。\n\n未来的最佳组织形态尚未确定，恰好使这些学习更重要。企业今天开始积累的，不必是一套永不改变的答案，而是更快发现问题、更好使用新能力，并在结果不符合预期时改法的能力。\n","exportSingleMd":"# 第4章｜路线还没有定下来，企业为什么需要开始\n\n一家设备售后企业决定用AI整理维修工单。起初，负责人认为目标很清楚：把老师傅的经验留下，让新人查得到。真正把记录放在一起以后，却发现不少“维修成功”的设备过几天又报修，只是换了一张新工单。继续追查，部分重复上门与备件不匹配有关，部分与客户没有提前准备好现场条件有关。\n\n于是，项目的问题变了。整理维修记录仍有用，但要减少重复上门，还要改派工准备、备件确认和后续追踪。这个过程来自课程的[设备售后教学案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-c)。它说明，企业往往不是先知道完整答案，再让技术照着实现；有些答案要在真实使用中才能形成。\n\n## 为什么有些学习不能靠等待替代\n\n等待工具成熟当然有价值。较成熟的产品可能更稳定，也可能减少企业自己开发基础功能的成本。但工具成熟，并不会自动告诉这家企业：它的重复上门主要发生在哪些设备，客户最在意哪类等待，哪些信息一直在交接中丢失。\n\n这些认识需要在自己的业务里积累。企业必须把一次报修从接单看到恢复，再看到后续是否复发，才能知道原来的记录能说明什么、还缺什么。即使以后更换模型，这些认识仍然可以帮助团队判断新工具应该用在哪一段。\n\n吸收能力研究强调，已有相关知识影响组织识别和应用外部知识的能力。[原始研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf) 这里的“已有认识”不一定是一套很大的知识库，也可以是团队已经能分清：这次失败来自资料不足、专业判断有误，还是正确决定没有被执行。能够分清，下一轮改进才有方向。\n\n## 开始，不等于一次把所有工作自动化\n\n这家服务企业可以先选择一种常见设备，把报修、实际操作、备件和再次联系关联起来。人员照常承担关键技术判断，AI协助整理和发现遗漏。这样既能支持当前工作，又能看清后续真正需要改什么。\n\n如果尚未确定重复上门的原因，就直接让系统自动派所有工单，可能只是把旧问题执行得更快。相反，如果现成工具已经能可靠解决明确的资料检索问题，也没有必要为了“转型”重新开发。\n\n因此，积极行动的含义是尽早接触真实任务，尽早获得会影响下一次选择的证据。投入规模可以随认识增加而调整。客户价值还不清楚时，先查需求；价值清楚但材料分散时，先把一小段完整工作接起来；已经稳定有效的做法，则可以扩大使用。\n\n这种做法也符合动态能力研究关注的组织能力：企业要在变化中识别机会、作出投入，并重新安排已有资源。[原始研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf) 对服务企业来说，资源重组可能很具体，就是让原本只负责写维修报告的人开始追踪复发，让派工人员在出发前看见版本与备件条件。\n\n## 双向靠近，发生在一轮轮具体工作中\n\n企业一开始可能只会说“希望少跑冤枉路”。FDE需要跟进实际工单，把这句话拆成可以观察的经过：为什么去、带了什么、到现场发现什么、为什么又去一次。企业提供真实材料、专业解释和工作权限，工程人员将它们组织成可使用的工具和安排。\n\n工具投入使用后，又可能暴露新的问题。例如技术员补充了备件不匹配的原因，团队才发现产品版本名称不统一；统一版本以后，又发现供应商确认太慢。每次新认识都可能改变下一轮工程，而工程改善又让企业看见更完整的生产过程。\n\n这就是企业拥抱AI、AI进入生产的双向过程。企业不是把一套固定流程完整交给技术后就退出，技术也不是交付一个系统后就获得所有答案。双方围绕真实问题不断改进，企业自己的方法才逐步进入AI参与的工作。\n\n## 连续推进为什么需要有人承担\n\n一次培训可以帮助员工理解工具，一次开发可以让某项功能上线。但如果没有人负责后续，新的异常会留在聊天里，旧方法继续运行，系统与实际业务逐渐脱节。持续的FDE力量能够把现场发现转成下一次改进，并核对改进有没有真正被采用。\n\n这不意味着企业必须永久依赖同一家外部团队。业务负责人仍需判断什么值得做，内部人员需要逐步掌握关键方法，资料、工具和验证方式也应能够接续。连续性应体现在企业始终有人推进这项工作，而不只是合同一直续费。\n\n未来的最佳组织形态尚未确定，恰好使这些学习更重要。企业今天开始积累的，不必是一套永不改变的答案，而是更快发现问题、更好使用新能力，并在结果不符合预期时改法的能力。\n","text":"# 第4章｜路线还没有定下来，企业为什么需要开始\n\n一家设备售后企业决定用AI整理维修工单。起初，负责人认为目标很清楚：把老师傅的经验留下，让新人查得到。真正把记录放在一起以后，却发现不少“维修成功”的设备过几天又报修，只是换了一张新工单。继续追查，部分重复上门与备件不匹配有关，部分与客户没有提前准备好现场条件有关。\n\n于是，项目的问题变了。整理维修记录仍有用，但要减少重复上门，还要改派工准备、备件确认和后续追踪。这个过程来自课程的设备售后教学案例。它说明，企业往往不是先知道完整答案，再让技术照着实现；有些答案要在真实使用中才能形成。\n\n## 为什么有些学习不能靠等待替代\n\n等待工具成熟当然有价值。较成熟的产品可能更稳定，也可能减少企业自己开发基础功能的成本。但工具成熟，并不会自动告诉这家企业：它的重复上门主要发生在哪些设备，客户最在意哪类等待，哪些信息一直在交接中丢失。\n\n这些认识需要在自己的业务里积累。企业必须把一次报修从接单看到恢复，再看到后续是否复发，才能知道原来的记录能说明什么、还缺什么。即使以后更换模型，这些认识仍然可以帮助团队判断新工具应该用在哪一段。\n\n吸收能力研究强调，已有相关知识影响组织识别和应用外部知识的能力。原始研究 这里的“已有认识”不一定是一套很大的知识库，也可以是团队已经能分清：这次失败来自资料不足、专业判断有误，还是正确决定没有被执行。能够分清，下一轮改进才有方向。\n\n## 开始，不等于一次把所有工作自动化\n\n这家服务企业可以先选择一种常见设备，把报修、实际操作、备件和再次联系关联起来。人员照常承担关键技术判断，AI协助整理和发现遗漏。这样既能支持当前工作，又能看清后续真正需要改什么。\n\n如果尚未确定重复上门的原因，就直接让系统自动派所有工单，可能只是把旧问题执行得更快。相反，如果现成工具已经能可靠解决明确的资料检索问题，也没有必要为了“转型”重新开发。\n\n因此，积极行动的含义是尽早接触真实任务，尽早获得会影响下一次选择的证据。投入规模可以随认识增加而调整。客户价值还不清楚时，先查需求；价值清楚但材料分散时，先把一小段完整工作接起来；已经稳定有效的做法，则可以扩大使用。\n\n这种做法也符合动态能力研究关注的组织能力：企业要在变化中识别机会、作出投入，并重新安排已有资源。原始研究 对服务企业来说，资源重组可能很具体，就是让原本只负责写维修报告的人开始追踪复发，让派工人员在出发前看见版本与备件条件。\n\n## 双向靠近，发生在一轮轮具体工作中\n\n企业一开始可能只会说“希望少跑冤枉路”。FDE需要跟进实际工单，把这句话拆成可以观察的经过：为什么去、带了什么、到现场发现什么、为什么又去一次。企业提供真实材料、专业解释和工作权限，工程人员将它们组织成可使用的工具和安排。\n\n工具投入使用后，又可能暴露新的问题。例如技术员补充了备件不匹配的原因，团队才发现产品版本名称不统一；统一版本以后，又发现供应商确认太慢。每次新认识都可能改变下一轮工程，而工程改善又让企业看见更完整的生产过程。\n\n这就是企业拥抱AI、AI进入生产的双向过程。企业不是把一套固定流程完整交给技术后就退出，技术也不是交付一个系统后就获得所有答案。双方围绕真实问题不断改进，企业自己的方法才逐步进入AI参与的工作。\n\n## 连续推进为什么需要有人承担\n\n一次培训可以帮助员工理解工具，一次开发可以让某项功能上线。但如果没有人负责后续，新的异常会留在聊天里，旧方法继续运行，系统与实际业务逐渐脱节。持续的FDE力量能够把现场发现转成下一次改进，并核对改进有没有真正被采用。\n\n这不意味着企业必须永久依赖同一家外部团队。业务负责人仍需判断什么值得做，内部人员需要逐步掌握关键方法，资料、工具和验证方式也应能够接续。连续性应体现在企业始终有人推进这项工作，而不只是合同一直续费。\n\n未来的最佳组织形态尚未确定，恰好使这些学习更重要。企业今天开始积累的，不必是一套永不改变的答案，而是更快发现问题、更好使用新能力，并在结果不符合预期时改法的能力。\n"},{"file":"05-从经验到能力.md","id":"lesson-05","number":5,"role":"核心课","part":1,"title":"第5章｜老师傅做对一次，企业怎样获得下一次的能力","md":"# 第5章｜老师傅做对一次，企业怎样获得下一次的能力\n\n设备恢复运行以后，维修报告写下“调整后恢复”。老师傅看得懂这句话，因为他记得设备的版本、客户当时的描述，以及自己具体做过什么。半年后换一位技术员处理相似问题，这六个字却远远不够：调整了哪里，是否同时重启，设备后来有没有复发，都不知道。\n\n企业常把“留下记录”当成“留下经验”，又把“留下经验”当成“形成能力”。这几步其实需要不同的工作。[设备售后教学案例](案例C-设备售后.md)提供了一组记录，可以把它们逐步拆开。\n\n## 先让后来的人知道究竟发生过什么\n\n案例中的一张工单代号为M1。原始经过是：设备属于V1版本，技术员进行了调整和重启，没有更换零件；设备当次恢复，记录跟踪到次日。AI整理时却曾将它写成更换零件后恢复。只看整理后的句子，新人可能带上不必要的零件，也可能误解原来的处理过程。\n\n因此，积累的第一步是保留事实：同一台设备、同一次问题、实际动作和观察结果应能对应起来。AI可以把散在记录中的内容组织好，人则核对会改变后续判断的差别。这里的价值是让下一位使用者不用重新找齐所有当事人，才能知道前面发生过什么。\n\n事实完整之后，仍然不能立即说“调整就是恢复的原因”。因为M1同时发生了调整和重启，我们还不知道究竟哪一步起主要作用，或者是否有其他条件一起改变。前者是记录发生了什么，后者是解释为什么发生，不能省掉中间的判断。\n\n## 一条解释，怎样逐渐成为可用的方法\n\n案例里另一张V1工单只记录了重启，也恢复了；还有一张V2工单记录调整，一小时后才报告恢复，中间经过不完整。这些差别提醒团队，同样写着“恢复”，可能包含不同问题。\n\n企业可以据此形成一个待检验的解释，例如某些情况下重启本身可能有效。但若直接把它写成“遇到此症状就重启”，就跳过了设备条件和专业判断。更有用的下一步，是让技术员先核对版本、补清实际动作、区分持续故障和间歇问题，再按适用的专业要求处理。\n\n方法因此比一句结论多了几层内容：什么时候开始用，先看什么，遇到不同情况如何分支，什么时候需要停止并求助。一个新人未必能立刻独立判断所有故障，但他可以依照方法取得正确资料、避免明显误用，并把问题交给合适的人。\n\n## 方法写出来以后，怎样才算企业能够使用\n\n假设技术员知道某种版本需要特定备件，却没有权限查询库存；或者知道需要专家支持，却不知道谁负责。这时知识没有缺失，工作仍然做不下去。要形成组织能力，还要配齐工具、资源和协作安排。\n\n可以让一位具备基本专业资格、但没有参与原整理的接任者处理新工单。他能否找到相关记录，识别与旧案例不同的条件，拿到需要的工具和支持，并把本次结果接回？这个过程比检查知识库里有多少条内容，更能显示企业究竟积累了什么。\n\n![真实事件要经过解释、适用检验、组织采用与客户选择，才可能发展为竞争优势；每一层都需要额外条件。](assets/05-积累的层次.svg)\n\n图中每向右走一步，都增加了一项要求。记录能被找到，不等于解释成立；解释有道理，不等于接任者能完成；企业能稳定完成，也不等于客户会因此更愿意购买。这些区别帮助管理者决定下一笔投入应该补在哪里。\n\n知识研究强调，个人经验要通过表达、共同实践和再使用，才可能成为组织知识。[原始研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf) 有些判断可以通过文字传递，有些现场动作仍需要示范和带教。AI降低整理与调用的成本，可以帮助这个过程持续发生，但不会使所有专业能力自动变成一份文档。\n\n## 能力与竞争优势之间，还要经过客户\n\n如果企业改善准备，减少了一次本可避免的外协上门，可能直接少支付一笔派工费用。客户也可能更早恢复生产，但客户少停机的价值，并不自动等于服务商获得同额利润。服务商能否通过更稳定的服务保持续约或取得更好的价格，还需要客户认可和合同安排。\n\n有些积累只是让企业达到应有水准，例如不再带错备件。有些积累则可以使企业持续比竞争者更快理解复杂问题。前一种也值得做，只是不能把每项改善都称为独有壁垒。\n\n对这家企业，最先应该争取的变化很明确：原来的老师傅不在时，新任务仍能沿着合适的方法推进；新情况出现时，团队能够修订方法，而不是照抄旧答案。到这一步，过去一次工作产生的价值，才开始进入企业下一次工作的能力。\n","html":"\u003ch1>第5章｜老师傅做对一次，企业怎样获得下一次的能力\u003c/h1>\n\u003cp>设备恢复运行以后，维修报告写下“调整后恢复”。老师傅看得懂这句话，因为他记得设备的版本、客户当时的描述，以及自己具体做过什么。半年后换一位技术员处理相似问题，这六个字却远远不够：调整了哪里，是否同时重启，设备后来有没有复发，都不知道。\u003c/p>\n\u003cp>企业常把“留下记录”当成“留下经验”，又把“留下经验”当成“形成能力”。这几步其实需要不同的工作。\u003ca href=\"#case-c\">设备售后教学案例\u003c/a>提供了一组记录，可以把它们逐步拆开。\u003c/p>\n\u003ch2 id=\"lesson-05-section-1\">先让后来的人知道究竟发生过什么\u003c/h2>\n\u003cp>案例中的一张工单代号为M1。原始经过是：设备属于V1版本，技术员进行了调整和重启，没有更换零件；设备当次恢复，记录跟踪到次日。AI整理时却曾将它写成更换零件后恢复。只看整理后的句子，新人可能带上不必要的零件，也可能误解原来的处理过程。\u003c/p>\n\u003cp>因此，积累的第一步是保留事实：同一台设备、同一次问题、实际动作和观察结果应能对应起来。AI可以把散在记录中的内容组织好，人则核对会改变后续判断的差别。这里的价值是让下一位使用者不用重新找齐所有当事人，才能知道前面发生过什么。\u003c/p>\n\u003cp>事实完整之后，仍然不能立即说“调整就是恢复的原因”。因为M1同时发生了调整和重启，我们还不知道究竟哪一步起主要作用，或者是否有其他条件一起改变。前者是记录发生了什么，后者是解释为什么发生，不能省掉中间的判断。\u003c/p>\n\u003ch2 id=\"lesson-05-section-2\">一条解释，怎样逐渐成为可用的方法\u003c/h2>\n\u003cp>案例里另一张V1工单只记录了重启，也恢复了；还有一张V2工单记录调整，一小时后才报告恢复，中间经过不完整。这些差别提醒团队，同样写着“恢复”，可能包含不同问题。\u003c/p>\n\u003cp>企业可以据此形成一个待检验的解释，例如某些情况下重启本身可能有效。但若直接把它写成“遇到此症状就重启”，就跳过了设备条件和专业判断。更有用的下一步，是让技术员先核对版本、补清实际动作、区分持续故障和间歇问题，再按适用的专业要求处理。\u003c/p>\n\u003cp>方法因此比一句结论多了几层内容：什么时候开始用，先看什么，遇到不同情况如何分支，什么时候需要停止并求助。一个新人未必能立刻独立判断所有故障，但他可以依照方法取得正确资料、避免明显误用，并把问题交给合适的人。\u003c/p>\n\u003ch2 id=\"lesson-05-section-3\">方法写出来以后，怎样才算企业能够使用\u003c/h2>\n\u003cp>假设技术员知道某种版本需要特定备件，却没有权限查询库存；或者知道需要专家支持，却不知道谁负责。这时知识没有缺失，工作仍然做不下去。要形成组织能力，还要配齐工具、资源和协作安排。\u003c/p>\n\u003cp>可以让一位具备基本专业资格、但没有参与原整理的接任者处理新工单。他能否找到相关记录，识别与旧案例不同的条件，拿到需要的工具和支持，并把本次结果接回？这个过程比检查知识库里有多少条内容，更能显示企业究竟积累了什么。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTcwIiB2aWV3Qm94PSIwIDAgMzYwIDU3MCIgcm9sZT0iaW1nIj48dGl0bGU+5q+P5LiA5bGC6YO95aSa5LiA6aG55p2h5Lu2PC90aXRsZT48ZGVzYz7kuovku7bjgIHop6Pph4rjgIHmlrnms5XjgIHnu4Tnu4fog73lipvkuI7kvJjlir/kuYvpl7TpnIDopoHkuI3lkIzmnaHku7bvvIzkuI3mmK/mlbDph4/oh6rliqjlop7plb/jgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjU3MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7mr4/kuIDlsYLpg73lpJrkuIDpobnmnaHku7Y8L3RleHQ+PHBhdGggZD0iTTU0IDEzMkw1NCAxNjciIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzE2NWQ1MiIgc3Ryb2tlLXdpZHRoPSIyIiBtYXJrZXItZW5kPSJ1cmwoI2Fycm93KSIvPjxwYXRoIGQ9Ik01NCAyMjhMNTQgMjYzIiBmaWxsPSJub25lIiBzdHJva2U9IiMxNjVkNTIiIHN0cm9rZS13aWR0aD0iMiIgbWFya2VyLWVuZD0idXJsKCNhcnJvdykiLz48cGF0aCBkPSJNNTQgMzI0TDU0IDM1OSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMTY1ZDUyIiBzdHJva2Utd2lkdGg9IjIiIG1hcmtlci1lbmQ9InVybCgjYXJyb3cpIi8+PHBhdGggZD0iTTU0IDQyMEw1NCA0NTUiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzE2NWQ1MiIgc3Ryb2tlLXdpZHRoPSIyIiBtYXJrZXItZW5kPSJ1cmwoI2Fycm93KSIvPjxwYXRoIGQ9Ik0yOCA3NUg2NUw4MSA5MVYxMzFIMjhaIiBmaWxsPSJ3aGl0ZSIgc3Ryb2tlPSIjNjA3MzZjIiBzdHJva2Utd2lkdGg9IjEuNSIvPjxwYXRoIGQ9Ik02NSA3NVY5MUg4MSIgZmlsbD0ibm9uZSIgc3Ryb2tl Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a> 有些判断可以通过文字传递，有些现场动作仍需要示范和带教。AI降低整理与调用的成本，可以帮助这个过程持续发生，但不会使所有专业能力自动变成一份文档。\u003c/p>\n\u003ch2 id=\"lesson-05-section-4\">能力与竞争优势之间，还要经过客户\u003c/h2>\n\u003cp>如果企业改善准备，减少了一次本可避免的外协上门，可能直接少支付一笔派工费用。客户也可能更早恢复生产，但客户少停机的价值，并不自动等于服务商获得同额利润。服务商能否通过更稳定的服务保持续约或取得更好的价格，还需要客户认可和合同安排。\u003c/p>\n\u003cp>有些积累只是让企业达到应有水准，例如不再带错备件。有些积累则可以使企业持续比竞争者更快理解复杂问题。前一种也值得做，只是不能把每项改善都称为独有壁垒。\u003c/p>\n\u003cp>对这家企业，最先应该争取的变化很明确：原来的老师傅不在时，新任务仍能沿着合适的方法推进；新情况出现时，团队能够修订方法，而不是照抄旧答案。到这一步，过去一次工作产生的价值，才开始进入企业下一次工作的能力。\u003c/p>\n","headings":[{"id":"lesson-05-section-1","label":"先让后来的人知道究竟发生过什么"},{"id":"lesson-05-section-2","label":"一条解释，怎样逐渐成为可用的方法"},{"id":"lesson-05-section-3","label":"方法写出来以后，怎样才算企业能够使用"},{"id":"lesson-05-section-4","label":"能力与竞争优势之间，还要经过客户"}],"exportMd":"# 第5章｜老师傅做对一次，企业怎样获得下一次的能力\n\n设备恢复运行以后，维修报告写下“调整后恢复”。老师傅看得懂这句话，因为他记得设备的版本、客户当时的描述，以及自己具体做过什么。半年后换一位技术员处理相似问题，这六个字却远远不够：调整了哪里，是否同时重启，设备后来有没有复发，都不知道。\n\n企业常把“留下记录”当成“留下经验”，又把“留下经验”当成“形成能力”。这几步其实需要不同的工作。[设备售后教学案例](#case-c)提供了一组记录，可以把它们逐步拆开。\n\n## 先让后来的人知道究竟发生过什么\n\n案例中的一张工单代号为M1。原始经过是：设备属于V1版本，技术员进行了调整和重启，没有更换零件；设备当次恢复，记录跟踪到次日。AI整理时却曾将它写成更换零件后恢复。只看整理后的句子，新人可能带上不必要的零件，也可能误解原来的处理过程。\n\n因此，积累的第一步是保留事实：同一台设备、同一次问题、实际动作和观察结果应能对应起来。AI可以把散在记录中的内容组织好，人则核对会改变后续判断的差别。这里的价值是让下一位使用者不用重新找齐所有当事人，才能知道前面发生过什么。\n\n事实完整之后，仍然不能立即说“调整就是恢复的原因”。因为M1同时发生了调整和重启，我们还不知道究竟哪一步起主要作用，或者是否有其他条件一起改变。前者是记录发生了什么，后者是解释为什么发生，不能省掉中间的判断。\n\n## 一条解释，怎样逐渐成为可用的方法\n\n案例里另一张V1工单只记录了重启，也恢复了；还有一张V2工单记录调整，一小时后才报告恢复，中间经过不完整。这些差别提醒团队，同样写着“恢复”，可能包含不同问题。\n\n企业可以据此形成一个待检验的解释，例如某些情况下重启本身可能有效。但若直接把它写成“遇到此症状就重启”，就跳过了设备条件和专业判断。更有用的下一步，是让技术员先核对版本、补清实际动作、区分持续故障和间歇问题，再按适用的专业要求处理。\n\n方法因此比一句结论多了几层内容：什么时候开始用，先看什么，遇到不同情况如何分支，什么时候需要停止并求助。一个新人未必能立刻独立判断所有故障，但他可以依照方法取得正确资料、避免明显误用，并把问题交给合适的人。\n\n## 方法写出来以后，怎样才算企业能够使用\n\n假设技术员知道某种版本需要特定备件，却没有权限查询库存；或者知道需要专家支持，却不知道谁负责。这时知识没有缺失，工作仍然做不下去。要形成组织能力，还要配齐工具、资源和协作安排。\n\n可以让一位具备基本专业资格、但没有参与原整理的接任者处理新工单。他能否找到相关记录，识别与旧案例不同的条件，拿到需要的工具和支持，并把本次结果接回？这个过程比检查知识库里有多少条内容，更能显示企业究竟积累了什么。\n\n![真实事件要经过解释、适用检验、组织采用与客户选择，才可能发展为竞争优势；每一层都需要额外条件。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTcwIiB2aWV3Qm94PSIwIDAgMzYwIDU3MCIgcm9sZT0iaW1nIj48dGl0bGU+5q+P5LiA5bGC6YO95aSa5LiA6aG55p2h5Lu2PC90aXRsZT48ZGVzYz7kuovku7bjgIHop6Pph4rjgIHmlrnms5XjgIHnu4Tnu4fog73lipvkuI7kvJjlir/kuYvpl7TpnIDopoHkuI3lkIzmnaHku7bvvIzkuI3mmK/mlbDph4/oh6rliqjlop7plb/jgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjU3MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7mr4/kuIDlsYLpg73lpJrkuIDpobnmnaHku7Y8L3RleHQ+PHBhdGggZD0iTTU0IDEzMkw1NCAxNjciIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzE2NWQ1MiIgc3Ryb2tlLXdpZHRoPSIyIiBtYXJrZXItZW5kPSJ1cmwoI2Fycm93KSIvPjxwYXRoIGQ9Ik01NCAyMjhMNTQgMjYzIiBmaWxsPSJub25lIiBzdHJva2U9IiMxNjVkNTIiIHN0cm9rZS13aWR0aD0iMiIgbWFya2VyLWVuZD0idXJsKCNhcnJvdykiLz48cGF0aCBkPSJNNTQgMzI0TDU0IDM1OSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMTY1ZDUyIiBzdHJva2Utd2lkdGg9IjIiIG1hcmtlci1lbmQ9InVybCgjYXJyb3cpIi8+PHBhdGggZD0iTTU0IDQyMEw1NCA0NTUiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzE2NWQ1MiIgc3Ryb2tlLXdpZHRoPSIyIiBtYXJrZXItZW5kPSJ1cmwoI2Fycm93KSIvPjxwYXRoIGQ9Ik0yOCA3NUg2NUw4MSA5MVYxMzFIMjhaIiBmaWxsPSJ3aGl0ZSIgc3Ryb2tlPSIjNjA3MzZjIiBzdHJva2Utd2lkdGg9IjEuNSIvPjxwYXRoIGQ9Ik02NSA3NVY5MUg4MSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjNjA3MzZjIiBzdHJva2Utd2lkdGg9IjEuNSIvPjx0ZXh0IHg9IjU0LjUiIHk9IjEwOS4wIiBmb250LWZhbWlseT0iUGlu 少支付一笔派工费用。客户也可能更早恢复生产，但客户少停机的价值，并不自动等于服务商获得同额利润。服务商能否通过更稳定的服务保持续约或取得更好的价格，还需要客户认可和合同安排。\n\n有些积累只是让企业达到应有水准，例如不再带错备件。有些积累则可以使企业持续比竞争者更快理解复杂问题。前一种也值得做，只是不能把每项改善都称为独有壁垒。\n\n对这家企业，最先应该争取的变化很明确：原来的老师傅不在时，新任务仍能沿着合适的方法推进；新情况出现时，团队能够修订方法，而不是照抄旧答案。到这一步，过去一次工作产生的价值，才开始进入企业下一次工作的能力。\n","exportSingleMd":"# 第5章｜老师傅做对一次，企业怎样获得下一次的能力\n\n设备恢复运行以后，维修报告写下“调整后恢复”。老师傅看得懂这句话，因为他记得设备的版本、客户当时的描述，以及自己具体做过什么。半年后换一位技术员处理相似问题，这六个字却远远不够：调整了哪里，是否同时重启，设备后来有没有复发，都不知道。\n\n企业常把“留下记录”当成“留下经验”，又把“留下经验”当成“形成能力”。这几步其实需要不同的工作。[设备售后教学案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-c)提供了一组记录，可以把它们逐步拆开。\n\n## 先让后来的人知道究竟发生过什么\n\n案例中的一张工单代号为M1。原始经过是：设备属于V1版本，技术员进行了调整和重启，没有更换零件；设备当次恢复，记录跟踪到次日。AI整理时却曾将它写成更换零件后恢复。只看整理后的句子，新人可能带上不必要的零件，也可能误解原来的处理过程。\n\n因此，积累的第一步是保留事实：同一台设备、同一次问题、实际动作和观察结果应能对应起来。AI可以把散在记录中的内容组织好，人则核对会改变后续判断的差别。这里的价值是让下一位使用者不用重新找齐所有当事人，才能知道前面发生过什么。\n\n事实完整之后，仍然不能立即说“调整就是恢复的原因”。因为M1同时发生了调整和重启，我们还不知道究竟哪一步起主要作用，或者是否有其他条件一起改变。前者是记录发生了什么，后者是解释为什么发生，不能省掉中间的判断。\n\n## 一条解释，怎样逐渐成为可用的方法\n\n案例里另一张V1工单只记录了重启，也恢复了；还有一张V2工单记录调整，一小时后才报告恢复，中间经过不完整。这些差别提醒团队，同样写着“恢复”，可能包含不同问题。\n\n企业可以据此形成一个待检验的解释，例如某些情况下重启本身可能有效。但若直接把它写成“遇到此症状就重启”，就跳过了设备条件和专业判断。更有用的下一步，是让技术员先核对版本、补清实际动作、区分持续故障和间歇问题，再按适用的专业要求处理。\n\n方法因此比一句结论多了几层内容：什么时候开始用，先看什么，遇到不同情况如何分支，什么时候需要停止并求助。一个新人未必能立刻独立判断所有故障，但他可以依照方法取得正确资料、避免明显误用，并把问题交给合适的人。\n\n## 方法写出来以后，怎样才算企业能够使用\n\n假设技术员知道某种版本需要特定备件，却没有权限查询库存；或者知道需要专家支持，却不知道谁负责。这时知识没有缺失，工作仍然做不下去。要形成组织能力，还要配齐工具、资源和协作安排。\n\n可以让一位具备基本专业资格、但没有参与原整理的接任者处理新工单。他能否找到相关记录，识别与旧案例不同的条件，拿到需要的工具和支持，并把本次结果接回？这个过程比检查知识库里有多少条内容，更能显示企业究竟积累了什么。\n\n![真实事件要经过解释、适用检验、组织采用与客户选择，才可能发展为竞争优势；每一层都需要额外条件。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTcwIiB2aWV3Qm94PSIwIDAgMzYwIDU3MCIgcm9sZT0iaW1nIj48dGl0bGU+5q+P5LiA5bGC6YO95aSa5LiA6aG55p2h5Lu2PC90aXRsZT48ZGVzYz7kuovku7bjgIHop6Pph4rjgIHmlrnms5XjgIHnu4Tnu4fog73lipvkuI7kvJjlir/kuYvpl7TpnIDopoHkuI3lkIzmnaHku7bvvIzkuI3mmK/mlbDph4/oh6rliqjlop7plb/jgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSI
