手实现的能力更容易与现场观察结合，同时也要求对产物负责：代码和配置是否可追溯，依赖能否运行，测试覆盖了什么，下一位人员如何继续。\n\n## 怎样比较采购、配置与自建\n\n成熟通用产品适合覆盖稳定共性，配置和连接可以适应一部分企业差异。定制实现适合重要且难以被现有产品覆盖的工作，但需要企业承担更多维护与治理。\n\n比较时，把同一个业务任务交给各候选：材料怎样进入，谁能查看，如何核对，能否连接当前记录，异常怎样处理，数据与配置如何带走。只有任务范围一致，报价与投入才可比较。\n\n如果短期差异主要是几项表单和规则，先配置可能足够；如果差异决定企业核心服务，且需要持续试验，自建或联合建设可能更合适。现有团队能力、时间和切换成本也应进入判断。选择可以分层，例如采购通用模型能力，自建业务规则与评测。\n\n## 用交接试验检查系统边界\n\n请一位没有参与开发的人，使用交付说明完成四件事：处理一笔正常任务；解释一笔失败；更新一条业务规则并验证；在受控条件下恢复一次中断。\n\n如果做不到，先看缺少什么：账号与权限、配置说明、资料维护入口、测试样本、部署方式或异常手册。文档不是越多越好，应能支持这些实际动作。\n\n进入生产前，还要形成有效版本。谁批准了哪些规则，采用哪个模型和工具配置，哪些场景经过检验，哪些任务仍需人工，均应能对应到当前运行系统。下一课将说明这些检验怎样设计，才能服务采用决定。\n","exportSingleMd":"# 第11课｜从原型到可以接手的企业系统\n\nAI编程让企业更容易做出能操作的原型：一个需求整理界面、一套客户查询、一个报告工作台。变化很有意义，因为业务人员可以更早看到方案，也更早发现自己原先没有说清的条件。\n\n但软件制作成本只是完整供给成本的一部分。企业仍需要决定长期由什么承载业务、怎样运行，以及谁能维护。\n\n## 原型要验证哪一种不确定性\n\n若不知道员工能否理解新分工，原型可以先验证页面、材料和操作顺序；若不知道模型能否理解非标准请求，可以先用固定材料检验输出；若不知道系统能否可靠写入，就必须真实连接受控测试环境。\n\n这三类验证可以分开开展。使用模拟数据的界面能帮助确认业务设计，但不能证明真实权限可用；直接调用模型可以检验处理能力，但不能证明同事能在日常系统里采用。\n\n每次展示应说明当前实际发生了什么。业务人员由此才能判断哪些问题已得到证据，哪些还需要实现。\n\n## 企业应用包含哪些相互依赖的部分\n\n围绕询价，至少可以辨认出六类职责：员工提交和核对材料的界面；解释与生成的模型；有效知识和当前数据；决定流程、权限与状态的应用；执行查询、预留和发送的连接；保存证据及观察运行的记录。\n\n它们可以由一个产品提供，也可以分布在现有系统与新功能中。课程不要求增加六套软件，而是帮助企业在方案中找到这些职责。\n\n例如，已有客户系统负责询价身份与正式记录，新功能只承担材料整理和确认界面，库存仍由原系统管理。这种安排可以保留既有事实源，减少同步。若为了新助手又复制一套库存，需要解释两处发生冲突时以哪里为准。\n\n## AI编程改变了哪些成本\n\n编写常规界面、转换文件格式和制作接口代码，部分工作可以更快完成。原型反馈也可能缩短需求往返。但业务规则没有确定、外部系统权限无法取得、错误后果无人负责，这些问题不会因为代码生成加速而自行解决。\n\n代码越容易产生，企业越需要明确可维护边界。重复生成多个相近工具，可能增加登录、数据复制、版本与维护负担。判断标准是业务能否更容易完成，而非新功能数量。\n\n对FDE，这意味着亲手实现的能力更容易与现场观察结合，同时也要求对产物负责：代码和配置是否可追溯，依赖能否运行，测试覆盖了什么，下一位人员如何继续。\n\n## 怎样比较采购、配置与自建\n\n成熟通用产品适合覆盖稳定共性，配置和连接可以适应一部分企业差异。定制实现适合重要且难以被现有产品覆盖的工作，但需要企业承担更多维护与治理。\n\n比较时，把同一个业务任务交给各候选：材料怎样进入，谁能查看，如何核对，能否连接当前记录，异常怎样处理，数据与配置如何带走。只有任务范围一致，报价与投入才可比较。\n\n如果短期差异主要是几项表单和规则，先配置可能足够；如果差异决定企业核心服务，且需要持续试验，自建或联合建设可能更合适。现有团队能力、时间和切换成本也应进入判断。选择可以分层，例如采购通用模型能力，自建业务规则与评测。\n\n## 用交接试验检查系统边界\n\n请一位没有参与开发的人，使用交付说明完成四件事：处理一笔正常任务；解释一笔失败；更新一条业务规则并验证；在受控条件下恢复一次中断。\n\n如果做不到，先看缺少什么：账号与权限、配置说明、资料维护入口、测试样本、部署方式或异常手册。文档不是越多越好，应能支持这些实际动作。\n\n进入生产前，还要形成有效版本。谁批准了哪些规则，采用哪个模型和工具配置，哪些场景经过检验，哪些任务仍需人工，均应能对应到当前运行系统。下一课将说明这些检验怎样设计，才能服务采用决定。\n","text":"# 第11课｜从原型到可以接手的企业系统\n\nAI编程让企业更容易做出能操作的原型：一个需求整理界面、一套客户查询、一个报告工作台。变化很有意义，因为业务人员可以更早看到方案，也更早发现自己原先没有说清的条件。\n\n但软件制作成本只是完整供给成本的一部分。企业仍需要决定长期由什么承载业务、怎样运行，以及谁能维护。\n\n## 原型要验证哪一种不确定性\n\n若不知道员工能否理解新分工，原型可以先验证页面、材料和操作顺序；若不知道模型能否理解非标准请求，可以先用固定材料检验输出；若不知道系统能否可靠写入，就必须真实连接受控测试环境。\n\n这三类验证可以分开开展。使用模拟数据的界面能帮助确认业务设计，但不能证明真实权限可用；直接调用模型可以检验处理能力，但不能证明同事能在日常系统里采用。\n\n每次展示应说明当前实际发生了什么。业务人员由此才能判断哪些问题已得到证据，哪些还需要实现。\n\n## 企业应用包含哪些相互依赖的部分\n\n围绕询价，至少可以辨认出六类职责：员工提交和核对材料的界面；解释与生成的模型；有效知识和当前数据；决定流程、权限与状态的应用；执行查询、预留和发送的连接；保存证据及观察运行的记录。\n\n它们可以由一个产品提供，也可以分布在现有系统与新功能中。课程不要求增加六套软件，而是帮助企业在方案中找到这些职责。\n\n例如，已有客户系统负责询价身份与正式记录，新功能只承担材料整理和确认界面，库存仍由原系统管理。这种安排可以保留既有事实源，减少同步。若为了新助手又复制一套库存，需要解释两处发生冲突时以哪里为准。\n\n## AI编程改变了哪些成本\n\n编写常规界面、转换文件格式和制作接口代码，部分工作可以更快完成。原型反馈也可能缩短需求往返。但业务规则没有确定、外部系统权限无法取得、错误后果无人负责，这些问题不会因为代码生成加速而自行解决。\n\n代码越容易产生，企业越需要明确可维护边界。重复生成多个相近工具，可能增加登录、数据复制、版本与维护负担。判断标准是业务能否更容易完成，而非新功能数量。\n\n对FDE，这意味着亲手实现的能力更容易与现场观察结合，同时也要求对产物负责：代码和配置是否可追溯，依赖能否运行，测试覆盖了什么，下一位人员如何继续。\n\n## 怎样比较采购、配置与自建\n\n成熟通用产品适合覆盖稳定共性，配置和连接可以适应一部分企业差异。定制实现适合重要且难以被现有产品覆盖的工作，但需要企业承担更多维护与治理。\n\n比较时，把同一个业务任务交给各候选：材料怎样进入，谁能查看，如何核对，能否连接当前记录，异常怎样处理，数据与配置如何带走。只有任务范围一致，报价与投入才可比较。\n\n如果短期差异主要是几项表单和规则，先配置可能足够；如果差异决定企业核心服务，且需要持续试验，自建或联合建设可能更合适。现有团队能力、时间和切换成本也应进入判断。选择可以分层，例如采购通用模型能力，自建业务规则与评测。\n\n## 用交接试验检查系统边界\n\n请一位没有参与开发的人，使用交付说明完成四件事：处理一笔正常任务；解释一笔失败；更新一条业务规则并验证；在受控条件下恢复一次中断。\n\n如果做不到，先看缺少什么：账号与权限、配置说明、资料维护入口、测试样本、部署方式或异常手册。文档不是越多越好，应能支持这些实际动作。\n\n进入生产前，还要形成有效版本。谁批准了哪些规则，采用哪个模型和工具配置，哪些场景经过检验，哪些任务仍需人工，均应能对应到当前运行系统。下一课将说明这些检验怎样设计，才能服务采用决定。\n"},{"file":"12-评测与业务验收.md","id":"lesson-12","number":12,"role":"核心课","part":3,"title":"第12课｜怎样评测，才能决定是否采用","md":"# 第12课｜怎样评测，才能决定是否采用\n\n一个助手能够生成合格报价草稿，尚未说明它适合独立报价。企业需要知道哪些任务能覆盖，错误发生在哪里，人工如何介入，以及完整流程是否改善。\n\n评测的起点是拟授予它的责任。\n\n## 把合格结果写成可以核对的要求\n\n案例A的整理助手应提取客户条件，保留不确定性，识别缺项并附依据。型号适配由技术确认，交期由履约确认。因此，“把六套全部承诺周五到”即使表达流畅，也越过了本轮责任范围。\n\n标准可以分为几类：事实是否有材料支持；关键条件是否完整；金额等规则是否正确；是否执行了允许范围内的动作；异常是否到达正确岗位。对于分析和创作，还需让专业人员说明有用、充分和可采用的判断依据。\n\n把标准与样本一起制定，能减少看见输出以后临时改变口径。允许不同合理答案，但决定性限制必须明确。\n\n## 分层观察同一笔任务\n\n模型层看如何使用输入；系统层看检索、权限、保存和工具回执；工作层看岗位完成任务的时间、返工与采用；经营层看价值假设是否兑现。\n\n一笔任务可能模型正确、保存失败，也可能系统成功、业务价值很低。测试应保留这些差异，方便决定改模型、修连接还是放弃方向。\n\n人工核对也需要记录。若人工修改后所有结果都正确，要知道人工花了多久、改了什么；否则无法判断系统带来的净变化。\n\n## 先建立一个可检查的小测试集\n\n以下是从案例A构造的教学测试材料与判定依据，示例结果不是实际模型运行。\n\n| 输入变化 | 应观察到的行为 | 不可接受的行为 |\n|---|---|---|\n| 原始请求，未补介质等条件 | 列出缺项，型号保持候选 | 直接确认适配 |\n| 客户数量从6改为8套 | 更新本次数量，保留变更关联 | 沿用旧数量和金额 |\n| 目录v3与旧目录同时出现 | 识别有效版本与适用条件 | 只按相似文字选旧规则 |\n| 库存有4套，其余补货待确认 | 区分资源事实和预测 | 写成6套都可交付 |\n| 客户A的消息附客户B旧单 | 提醒身份冲突，停止引用 | 直接继承收货点 |\n| 预留请求超时 | 查询同一请求或交人工核查 | 直接重复占用库存 |\n\n再加入普通任务，才能观察日常覆盖和成本。只测异常会低估可用范围，只测普通单会忽略重要错误。扩样时记录抽取规则，保留之后用于检验的任务，避免反复改到只适合已知样本。\n\n## 同时看正确率和覆盖率\n\n设两套方案处理同一组100个教学请求。A给出84份可直接进入下一步的结果，其中80份符合标准、4份错误，16份转交人工；B给出70份，其中69份符合标准、1份错误，30份转交人工。\n\nA的覆盖率是84%，在已给出结果中的正确率约95.2%；B分别是70%和约98.6%。只看后一个指标，会漏掉人工接手量；把所有转交都算错误，也会惩罚必要的谨慎处理。\n\n接下来要看错误后果与人工成本。若A多出的错误包含未经批准的交期承诺，就可能不适合当前责任；若B增加的人工接手大多是简单任务，其保守也有成本。企业应按任务类型设定允许范围，必要时让不同类型采用不同方案。\n\n还要防止只报总体平均。常见单准确率很高，可能掩盖少见但代价大的错误。测试中没有看到某种严重错误，只说明当前样本未观察到，不能证明实际概率为零。\n\n## 比较时保留真正的替代方案\n\n可以让人工现行方法、已有软件、AI候选处理同一组材料，以相同结果标准记录完整工作。AI方案若同时更换流程和数据，应说明这些变化属于整体方案，不能把全部收益归给模型。\n\n如需判断AI本身增加了什么，可以再比较“整理规则加普通表单”和“同样规则加模型整理”。如果多数缺项通过固定字段即可解决，企业可能先采用更简单方案。评测应允许这个结果。\n\n## 采用决定需要什么证据\n\n一个有用的结论应写成：“在这些任务、资料和配置下，能够承担这些责任；实际错误和转交量如下；完整工时与费用如下；扩大范围前还缺什么。”同时保留输入、输出、人工修改与最终业务结果。\n\n可以用下面这组独立材料完成一次判断：技术已确认M40-H适用；客户要6套、接受先发4套；有效单价1,150元，全单运费200元；4套已有预留和周五到货的物流确认，另外2套只有待确认补货预测。候选结果写道：“M40-H六套，总额7,100元，全部周五到。”这些是教学输入与候选，不是实际模型运行。\n\n请先分别核对产品、金额、数量与交期，再判断这份结果能否采用。\n\n\u003cdetails>\u003csummary>展开核对依据\u003c/summary>\n\n型号、数量与金额有依据，6×1,150＋200＝7,100元；“全部周五到”没有依据，应改为首批4套按已确认安排到货，另外2套交期待确认。一个字段正确，不能覆盖另一个决定性错误。\n\n\u003c/details>\n\n再将数量改为8套，其余材料不变。按同一单价和一笔运费，候选总额应为9,400元；已有依据仍只覆盖首批4套，其余4套的供货与日期需重新确认。请写出结果中哪些可直接更新，哪些必须等待新证据。测试能帮助团队定位具体责任，也为下一课的经济比较提供分母。\n","html":"\u003ch1>第12课｜怎样评测，才能决定是否采用\u003c/h1>\n\u003cp>一个助手能够生成合格报价草稿，尚未说明它适合独立报价。企业需要知道哪些任务能覆盖，错误发生在哪里，人工如何介入，以及完整流程是否改善。\u003c/p>\n\u003cp>评测的起点是拟授予它的责任。\u003c/p>\n\u003ch2>把合格结果写成可以核对的要求\u003c/h2>\n\u003cp>案例A的整理助手应提取客户条件，保留不确定性，识别缺项并附依据。型号适配由技术确认，交期由履约确认。因此，“把六套全部承诺周五到”即使表达流畅，也越过了本轮责任范围。\u003c/p>\n\u003cp>标准可以分为几类：事实是否有材料支持；关键条件是否完整；金额等规则是否正确；是否执行了允许范围内的动作；异常是否到达正确岗位。对于分析和创作，还需让专业人员说明有用、充分和可采用的判断依据。\u003c/p>\n\u003cp>把标准与样本一起制定，能减少看见输出以后临时改变口径。允许不同合理答案，但决定性限制必须明确。\u003c/p>\n\u003ch2>分层观察同一笔任务\u003c/h2>\n\u003cp>模型层看如何使用输入；系统层看检索、权限、保存和工具回执；工作层看岗位完成任务的时间、返工与采用；经营层看价值假设是否兑现。\u003c/p>\n\u003cp>一笔任务可能模型正确、保存失败，也可能系统成功、业务价值很低。测试应保留这些差异，方便决定改模型、修连接还是放弃方向。\u003c/p>\n\u003cp>人工核对也需要记录。若人工修改后所有结果都正确，要知道人工花了多久、改了什么；否则无法判断系统带来的净变化。\u003c/p>\n\u003ch2>先建立一个可检查的小测试集\u003c/h2>\n\u003cp>以下是从案例A构造的教学测试材料与判定依据，示例结果不是实际模型运行。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>输入变化\u003c/th>\n\u003cth>应观察到的行为\u003c/th>\n\u003cth>不可接受的行为\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>原始请求，未补介质等条件\u003c/td>\n\u003ctd>列出缺项，型号保持候选\u003c/td>\n\u003ctd>直接确认适配\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>客户数量从6改为8套\u003c/td>\n\u003ctd>更新本次数量，保留变更关联\u003c/td>\n\u003ctd>沿用旧数量和金额\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>目录v3与旧目录同时出现\u003c/td>\n\u003ctd>识别有效版本与适用条件\u003c/td>\n\u003ctd>只按相似文字选旧规则\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>库存有4套，其余补货待确认\u003c/td>\n\u003ctd>区分资源事实和预测\u003c/td>\n\u003ctd>写成6套都可交付\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>客户A的消息附客户B旧单\u003c/td>\n\u003ctd>提醒身份冲突，停止引用\u003c/td>\n\u003ctd>直接继承收货点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>预留请求超时\u003c/td>\n\u003ctd>查询同一请求或交人工核查\u003c/td>\n\u003ctd>直接重复占用库存\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>再加入普通任务，才能观察日常覆盖和成本。只测异常会低估可用范围，只测普通单会忽略重要错误。扩样时记录抽取规则，保留之后用于检验的任务，避免反复改到只适合已知样本。\u003c/p>\n\u003ch2>同时看正确率和覆盖率\u003c/h2>\n\u003cp>设两套方案处理同一组100个教学请求。A给出84份可直接进入下一步的结果，其中80份符合标准、4份错误，16份转交人工；B给出70份，其中69份符合标准、1份错误，30份转交人工。\u003c/p>\n\u003cp>A的覆盖率是84%，在已给出结果中的正确率约95.2%；B分别是70%和约98.6%。只看后一个指标，会漏掉人工接手量；把所有转交都算错误，也会惩罚必要的谨慎处理。\u003c/p>\n\u003cp>接下来要看错误后果与人工成本。若A多出的错误包含未经批准的交期承诺，就可能不适合当前责任；若B增加的人工接手大多是简单任务，其保守也有成本。企业应按任务类型设定允许范围，必要时让不同类型采用不同方案。\u003c/p>\n\u003cp>还要防止只报总体平均。常见单准确率很高，可能掩盖少见但代价大的错误。测试中没有看到某种严重错误，只说明当前样本未观察到，不能证明实际概率为零。\u003c/p>\n\u003ch2>比较时保留真正的替代方案\u003c/h2>\n\u003cp>可以让人工现行方法、已有软件、AI候选处理同一组材料，以相同结果标准记录完整工作。AI方案若同时更换流程和数据，应说明这些变化属于整体方案，不能把全部收益归给模型。\u003c/p>\n\u003cp>如需判断AI本身增加了什么，可以再比较“整理规则加普通表单”和“同样规则加模型整理”。如果多数缺项通过固定字段即可解决，企业可能先采用更简单方案。评测应允许这个结果。\u003c/p>\n\u003ch2>采用决定需要什么证据\u003c/h2>\n\u003cp>一个有用的结论应写成：“在这些任务、资料和配置下，能够承担这些责任；实际错误和转交量如下；完整工时与费用如下；扩大范围前还缺什么。”同时保留输入、输出、人工修改与最终业务结果。\u003c/p>\n\u003cp>可以用下面这组独立材料完成一次判断：技术已确认M40-H适用；客户要6套、接受先发4套；有效单价1,150元，全单运费200元；4套已有预留和周五到货的物流确认，另外2套只有待确认补货预测。候选结果写道：“M40-H六套，总额7,100元，全部周五到。”这些是教学输入与候选，不是实际模型运行。\u003c/p>\n\u003cp>请先分别核对产品、金额、数量与交期，再判断这份结果能否采用。\u003c/p>\n\u003cdetails>\u003csummary>展开核对依据\u003c/summary>\n\n\u003cp>型号、数量与金额有依据，6×1,150＋200＝7,100元；“全部周五到”没有依据，应改为首批4套按已确认安排到货，另外2套交期待确认。一个字段正确，不能覆盖另一个决定性错误。\u003c/p>\n\u003c/details>\n\n\u003cp>再将数量改为8套，其余材料不变。按同一单价和一笔运费，候选总额应为9,400元；已有依据仍只覆盖首批4套，其余4套的供货与日期需重新确认。请写出结果中哪些可直接更新，哪些必须等待新证据。测试能帮助团队定位具体责任，也为下一课的经济比较提供分母。\u003c/p>\n","exportMd":"# 第12课｜怎样评测，才能决定是否采用\n\n一个助手能够生成合格报价草稿，尚未说明它适合独立报价。企业需要知道哪些任务能覆盖，错误发生在哪里，人工如何介入，以及完整流程是否改善。\n\n评测的起点是拟授予它的责任。\n\n## 把合格结果写成可以核对的要求\n\n案例A的整理助手应提取客户条件，保留不确定性，识别缺项并附依据。型号适配由技术确认，交期由履约确认。因此，“把六套全部承诺周五到”即使表达流畅，也越过了本轮责任范围。\n\n标准可以分为几类：事实是否有材料支持；关键条件是否完整；金额等规则是否正确；是否执行了允许范围内的动作；异常是否到达正确岗位。对于分析和创作，还需让专业人员说明有用、充分和可采用的判断依据。\n\n把标准与样本一起制定，能减少看见输出以后临时改变口径。允许不同合理答案，但决定性限制必须明确。\n\n## 分层观察同一笔任务\n\n模型层看如何使用输入；系统层看检索、权限、保存和工具回执；工作层看岗位完成任务的时间、返工与采用；经营层看价值假设是否兑现。\n\n一笔任务可能模型正确、保存失败，也可能系统成功、业务价值很低。测试应保留这些差异，方便决定改模型、修连接还是放弃方向。\n\n人工核对也需要记录。若人工修改后所有结果都正确，要知道人工花了多久、改了什么；否则无法判断系统带来的净变化。\n\n## 先建立一个可检查的小测试集\n\n以下是从案例A构造的教学测试材料与判定依据，示例结果不是实际模型运行。\n\n| 输入变化 | 应观察到的行为 | 不可接受的行为 |\n|---|---|---|\n| 原始请求，未补介质等条件 | 列出缺项，型号保持候选 | 直接确认适配 |\n| 客户数量从6改为8套 | 更新本次数量，保留变更关联 | 沿用旧数量和金额 |\n| 目录v3与旧目录同时出现 | 识别有效版本与适用条件 | 只按相似文字选旧规则 |\n| 库存有4套，其余补货待确认 | 区分资源事实和预测 | 写成6套都可交付 |\n| 客户A的消息附客户B旧单 | 提醒身份冲突，停止引用 | 直接继承收货点 |\n| 预留请求超时 | 查询同一请求或交人工核查 | 直接重复占用库存 |\n\n再加入普通任务，才能观察日常覆盖和成本。只测异常会低估可用范围，只测普通单会忽略重要错误。扩样时记录抽取规则，保留之后用于检验的任务，避免反复改到只适合已知样本。\n\n## 同时看正确率和覆盖率\n\n设两套方案处理同一组100个教学请求。A给出84份可直接进入下一步的结果，其中80份符合标准、4份错误，16份转交人工；B给出70份，其中69份符合标准、1份错误，30份转交人工。\n\nA的覆盖率是84%，在已给出结果中的正确率约95.2%；B分别是70%和约98.6%。只看后一个指标，会漏掉人工接手量；把所有转交都算错误，也会惩罚必要的谨慎处理。\n\n接下来要看错误后果与人工成本。若A多出的错误包含未经批准的交期承诺，就可能不适合当前责任；若B增加的人工接手大多是简单任务，其保守也有成本。企业应按任务类型设定允许范围，必要时让不同类型采用不同方案。\n\n还要防止只报总体平均。常见单准确率很高，可能掩盖少见但代价大的错误。测试中没有看到某种严重错误，只说明当前样本未观察到，不能证明实际概率为零。\n\n## 比较时保留真正的替代方案\n\n可以让人工现行方法、已有软件、AI候选处理同一组材料，以相同结果标准记录完整工作。AI方案若同时更换流程和数据，应说明这些变化属于整体方案，不能把全部收益归给模型。\n\n如需判断AI本身增加了什么，可以再比较“整理规则加普通表单”和“同样规则加模型整理”。如果多数缺项通过固定字段即可解决，企业可能先采用更简单方案。评测应允许这个结果。\n\n## 采用决定需要什么证据\n\n一个有用的结论应写成：“在这些任务、资料和配置下，能够承担这些责任；实际错误和转交量如下；完整工时与费用如下；扩大范围前还缺什么。”同时保留输入、输出、人工修改与最终业务结果。\n\n可以用下面这组独立材料完成一次判断：技术已确认M40-H适用；客户要6套、接受先发4套；有效单价1,150元，全单运费200元；4套已有预留和周五到货的物流确认，另外2套只有待确认补货预测。候选结果写道：“M40-H六套，总额7,100元，全部周五到。”这些是教学输入与候选，不是实际模型运行。\n\n请先分别核对产品、金额、数量与交期，再判断这份结果能否采用。\n\n\u003cdetails>\u003csummary>展开核对依据\u003c/summary>\n\n型号、数量与金额有依据，6×1,150＋200＝7,100元；“全部周五到”没有依据，应改为首批4套按已确认安排到货，另外2套交期待确认。一个字段正确，不能覆盖另一个决定性错误。\n\n\u003c/details>\n\n再将数量改为8套，其余材料不变。按同一单价和一笔运费，候选总额应为9,400元；已有依据仍只覆盖首批4套，其余4套的供货与日期需重新确认。请写出结果中哪些可直接更新，哪些必须等待新证据。测试能帮助团队定位具体责任，也为下一课的经济比较提供分母。\n","exportSingleMd":"# 第12课｜怎样评测，才能决定是否采用\n\n一个助手能够生成合格报价草稿，尚未说明它适合独立报价。企业需要知道哪些任务能覆盖，错误发生在哪里，人工如何介入，以及完整流程是否改善。\n\n评测的起点是拟授予它的责任。\n\n## 把合格结果写成可以核对的要求\n\n案例A的整理助手应提取客户条件，保留不确定性，识别缺项并附依据。型号适配由技术确认，交期由履约确认。因此，“把六套全部承诺周五到”即使表达流畅，也越过了本轮责任范围。\n\n标准可以分为几类：事实是否有材料支持；关键条件是否完整；金额等规则是否正确；是否执行了允许范围内的动作；异常是否到达正确岗位。对于分析和创作，还需让专业人员说明有用、充分和可采用的判断依据。\n\n把标准与样本一起制定，能减少看见输出以后临时改变口径。允许不同合理答案，但决定性限制必须明确。\n\n## 分层观察同一笔任务\n\n模型层看如何使用输入；系统层看检索、权限、保存和工具回执；工作层看岗位完成任务的时间、返工与采用；经营层看价值假设是否兑现。\n\n一笔任务可能模型正确、保存失败，也可能系统成功、业务价值很低。测试应保留这些差异，方便决定改模型、修连接还是放弃方向。\n\n人工核对也需要记录。若人工修改后所有结果都正确，要知道人工花了多久、改了什么；否则无法判断系统带来的净变化。\n\n## 先建立一个可检查的小测试集\n\n以下是从案例A构造的教学测试材料与判定依据，示例结果不是实际模型运行。\n\n| 输入变化 | 应观察到的行为 | 不可接受的行为 |\n|---|---|---|\n| 原始请求，未补介质等条件 | 列出缺项，型号保持候选 | 直接确认适配 |\n| 客户数量从6改为8套 | 更新本次数量，保留变更关联 | 沿用旧数量和金额 |\n| 目录v3与旧目录同时出现 | 识别有效版本与适用条件 | 只按相似文字选旧规则 |\n| 库存有4套，其余补货待确认 | 区分资源事实和预测 | 写成6套都可交付 |\n| 客户A的消息附客户B旧单 | 提醒身份冲突，停止引用 | 直接继承收货点 |\n| 预留请求超时 | 查询同一请求或交人工核查 | 直接重复占用库存 |\n\n再加入普通任务，才能观察日常覆盖和成本。只测异常会低估可用范围，只测普通单会忽略重要错误。扩样时记录抽取规则，保留之后用于检验的任务，避免反复改到只适合已知样本。\n\n## 同时看正确率和覆盖率\n\n设两套方案处理同一组100个教学请求。A给出84份可直接进入下一步的结果，其中80份符合标准、4份错误，16份转交人工；B给出70份，其中69份符合标准、1份错误，30份转交人工。\n\nA的覆盖率是84%，在已给出结果中的正确率约95.2%；B分别是70%和约98.6%。只看后一个指标，会漏掉人工接手量；把所有转交都算错误，也会惩罚必要的谨慎处理。\n\n接下来要看错误后果与人工成本。若A多出的错误包含未经批准的交期承诺，就可能不适合当前责任；若B增加的人工接手大多是简单任务，其保守也有成本。企业应按任务类型设定允许范围，必要时让不同类型采用不同方案。\n\n还要防止只报总体平均。常见单准确率很高，可能掩盖少见但代价大的错误。测试中没有看到某种严重错误，只说明当前样本未观察到，不能证明实际概率为零。\n\n## 比较时保留真正的替代方案\n\n可以让人工现行方法、已有软件、AI候选处理同一组材料，以相同结果标准记录完整工作。AI方案若同时更换流程和数据，应说明这些变化属于整体方案，不能把全部收益归给模型。\n\n如需判断AI本身增加了什么，可以再比较“整理规则加普通表单”和“同样规则加模型整理”。如果多数缺项通过固定字段即可解决，企业可能先采用更简单方案。评测应允许这个结果。\n\n## 采用决定需要什么证据\n\n一个有用的结论应写成：“在这些任务、资料和配置下，能够承担这些责任；实际错误和转交量如下；完整工时与费用如下；扩大范围前还缺什么。”同时保留输入、输出、人工修改与最终业务结果。\n\n可以用下面这组独立材料完成一次判断：技术已确认M40-H适用；客户要6套、接受先发4套；有效单价1,150元，全单运费200元；4套已有预留和周五到货的物流确认，另外2套只有待确认补货预测。候选结果写道：“M40-H六套，总额7,100元，全部周五到。”这些是教学输入与候选，不是实际模型运行。\n\n请先分别核对产品、金额、数量与交期，再判断这份结果能否采用。\n\n\u003cdetails>\u003csummary>展开核对依据\u003c/summary>\n\n型号、数量与金额有依据，6×1,150＋200＝7,100元；“全部周五到”没有依据，应改为首批4套按已确认安排到货，另外2套交期待确认。一个字段正确，不能覆盖另一个决定性错误。\n\n\u003c/details>\n\n再将数量改为8套，其余材料不变。按同一单价和一笔运费，候选总额应为9,400元；已有依据仍只覆盖首批4套，其余4套的供货与日期需重新确认。请写出结果中哪些可直接更新，哪些必须等待新证据。测试能帮助团队定位具体责任，也为下一课的经济比较提供分母。\n","text":"# 第12课｜怎样评测，才能决定是否采用\n\n一个助手能够生成合格报价草稿，尚未说明它适合独立报价。企业需要知道哪些任务能覆盖，错误发生在哪里，人工如何介入，以及完整流程是否改善。\n\n评测的起点是拟授予它的责任。\n\n## 把合格结果写成可以核对的要求\n\n案例A的整理助手应提取客户条件，保留不确定性，识别缺项并附依据。型号适配由技术确认，交期由履约确认。因此，“把六套全部承诺周五到”即使表达流畅，也越过了本轮责任范围。\n\n标准可以分为几类：事实是否有材料支持；关键条件是否完整；金额等规则是否正确；是否执行了允许范围内的动作；异常是否到达正确岗位。对于分析和创作，还需让专业人员说明有用、充分和可采用的判断依据。\n\n把标准与样本一起制定，能减少看见输出以后临时改变口径。允许不同合理答案，但决定性限制必须明确。\n\n## 分层观察同一笔任务\n\n模型层看如何使用输入；系统层看检索、权限、保存和工具回执；工作层看岗位完成任务的时间、返工与采用；经营层看价值假设是否兑现。\n\n一笔任务可能模型正确、保存失败，也可能系统成功、业务价值很低。测试应保留这些差异，方便决定改模型、修连接还是放弃方向。\n\n人工核对也需要记录。若人工修改后所有结果都正确，要知道人工花了多久、改了什么；否则无法判断系统带来的净变化。\n\n## 先建立一个可检查的小测试集\n\n以下是从案例A构造的教学测试材料与判定依据，示例结果不是实际模型运行。\n\n| 输入变化 | 应观察到的行为 | 不可接受的行为 |\n|---|---|---|\n| 原始请求，未补介质等条件 | 列出缺项，型号保持候选 | 直接确认适配 |\n| 客户数量从6改为8套 | 更新本次数量，保留变更关联 | 沿用旧数量和金额 |\n| 目录v3与旧目录同时出现 | 识别有效版本与适用条件 | 只按相似文字选旧规则 |\n| 库存有4套，其余补货待确认 | 区分资源事实和预测 | 写成6套都可交付 |\n| 客户A的消息附客户B旧单 | 提醒身份冲突，停止引用 | 直接继承收货点 |\n| 预留请求超时 | 查询同一请求或交人工核查 | 直接重复占用库存 |\n\n再加入普通任务，才能观察日常覆盖和成本。只测异常会低估可用范围，只测普通单会忽略重要错误。扩样时记录抽取规则，保留之后用于检验的任务，避免反复改到只适合已知样本。\n\n## 同时看正确率和覆盖率\n\n设两套方案处理同一组100个教学请求。A给出84份可直接进入下一步的结果，其中80份符合标准、4份错误，16份转交人工；B给出70份，其中69份符合标准、1份错误，30份转交人工。\n\nA的覆盖率是84%，在已给出结果中的正确率约95.2%；B分别是70%和约98.6%。只看后一个指标，会漏掉人工接手量；把所有转交都算错误，也会惩罚必要的谨慎处理。\n\n接下来要看错误后果与人工成本。若A多出的错误包含未经批准的交期承诺，就可能不适合当前责任；若B增加的人工接手大多是简单任务，其保守也有成本。企业应按任务类型设定允许范围，必要时让不同类型采用不同方案。\n\n还要防止只报总体平均。常见单准确率很高，可能掩盖少见但代价大的错误。测试中没有看到某种严重错误，只说明当前样本未观察到，不能证明实际概率为零。\n\n## 比较时保留真正的替代方案\n\n可以让人工现行方法、已有软件、AI候选处理同一组材料，以相同结果标准记录完整工作。AI方案若同时更换流程和数据，应说明这些变化属于整体方案，不能把全部收益归给模型。\n\n如需判断AI本身增加了什么，可以再比较“整理规则加普通表单”和“同样规则加模型整理”。如果多数缺项通过固定字段即可解决，企业可能先采用更简单方案。评测应允许这个结果。\n\n## 采用决定需要什么证据\n\n一个有用的结论应写成：“在这些任务、资料和配置下，能够承担这些责任；实际错误和转交量如下；完整工时与费用如下；扩大范围前还缺什么。”同时保留输入、输出、人工修改与最终业务结果。\n\n可以用下面这组独立材料完成一次判断：技术已确认M40-H适用；客户要6套、接受先发4套；有效单价1,150元，全单运费200元；4套已有预留和周五到货的物流确认，另外2套只有待确认补货预测。候选结果写道：“M40-H六套，总额7,100元，全部周五到。”这些是教学输入与候选，不是实际模型运行。\n\n请先分别核对产品、金额、数量与交期，再判断这份结果能否采用。\n\n  展开核对依据 \n\n型号、数量与金额有依据，6×1,150＋200＝7,100元；“全部周五到”没有依据，应改为首批4套按已确认安排到货，另外2套交期待确认。一个字段正确，不能覆盖另一个决定性错误。\n\n \n\n再将数量改为8套，其余材料不变。按同一单价和一笔运费，候选总额应为9,400元；已有依据仍只覆盖首批4套，其余4套的供货与日期需重新确认。请写出结果中哪些可直接更新，哪些必须等待新证据。测试能帮助团队定位具体责任，也为下一课的经济比较提供分母。\n"},{"file":"13-投入回报与收益兑现.md","id":"lesson-13","number":13,"role":"核心课","part":3,"title":"第13课｜怎样算完整投入，兑现实际收益","md":"# 第13课｜怎样算完整投入，兑现实际收益\n\n工时、成本和现金流描述不同东西。企业采用AI时，最容易高估的地方，是把“可能省下的时间”直接写成“已经增加的利润”。\n\n下面用一份完整教学账，说明如何让各项数字对应到工作。\n\n## 先固定比较对象\n\n假设每月有1,000笔同类请求，现行方法平均每笔需要12分钟人工工作。AI方案覆盖其中800笔，每笔仍需7分钟人工，包括准备、核对、修改和平均异常处理；未覆盖的200笔继续用原方法。\n\n两种方法的完成标准相同，7分钟不包含自动等待，不能直接当客户等待周期；业务周期另测。以下数字全部是计算假设，未观测到任何真实企业效果。\n\n现行人工时间为12,000分钟，即200小时。新方法为800×7＋200×12＝8,000分钟，即约133.33小时。每月释放4,000分钟，约66.67小时。\n\n这个比较同时计入了覆盖率和人工复核。如果只用模型生成的几十秒去替代12分钟，会把仍在发生的工作隐藏起来。\n\n## 再追踪这些时间的去向\n\n假设企业确认能取消40小时原有外包，价格每小时150元，则减少现金支出6,000元。剩余约26.67小时由固定薪酬人员获得，可以安排其他工作；按同样150元估值约4,000元，属于释放容量的估计，不能再记为已节约现金。\n\n这两项合计约10,000元，是对66.67小时的资源估值。其中6,000元已经对应取消外包，不能在总账里再加一次。若外包实际上不能取消，6,000元也不能按现金收益认定。\n\n未来利用剩余时间成交新业务，需要另证实订单与贡献收益。即使事后成立，也应避免将同一份人员时间同时计成现金节约和新增服务成本节约。\n\n## 加入新方案的持续成本\n\n教学设定的月度增量成本如下。维护、复测由单独安排的服务承担，不在上述7分钟中重复计算。\n\n| 项目 | 每月金额/元 | 口径 |\n|---|---:|---|\n| 模型使用 | 800 | 本例每笔覆盖请求平均1元，含调用与重试 |\n| 平台与运行资源 | 700 | 新方案增量费用 |\n| 日常维护 | 1,500 | 资料、连接与运行支持 |\n| 周期复测 | 500 | 变更与抽查的新增安排 |\n| 预计错误现金支出 | 500 | 假设每月因错误实际支付的补发运费与退款差额，不含机会损失或商誉估值；预测值 |\n| 合计 | 4,000 | 每月增量成本 |\n\n人工复核与常规异常已进入7分钟；本例500元明确设为返工工时之外、预计会实际支付的补发运费与退款差额，两者范围不同。它是现金流预测假设，未发生时不能当成实际支出；机会损失与商誉等非现金估值应另列，不进入本例现金账。真实记录不足时应给范围和不确定性，不能为了表格完整就把未知填为零。\n\n在上述全部假设成立时，预测每月现金净改善为6,000－4,000＝2,000元。剩余容量单独说明，不并入该现金结果。\n\n## 一次性投入和回收期\n\n再假设开发、资料准备、集成、培训及上线共需60,000元一次性增量投入。若每月净改善始终为2,000元，不考虑时间价值、税费和期间变化，简单回收期为30个月；第一年累计现金变化为12×2,000－60,000＝－36,000元。\n\n负数说明按本例现金口径第一年尚未回收。企业可能因学习、质量或服务战略继续投入，但应把理由单独提出，并给出后续观察。不能用“长期能力”抹去当前账目。\n\n## 哪项条件最容易改变决定\n\n如果实际只取消20小时外包，现金支出少3,000元，其他成本仍为4,000元，每月现金净变化变为－1,000元。技术省时数据可以不变，投资判断已经变化。\n\n如果维护费随规则变动增加，也会改变结果。若覆盖量增加，某些固定费用可被更多任务分担，但任务组合、人工接手和错误率也可能变化。应按新的分布重新计算，避免把单笔效果直接外推到全企业。\n\n## 为收益安排负责人\n\n技术团队可以记录处理成本，业务负责人需要决定释放时间用到哪里，采购或财务核对支出是否真的取消，运营人员观察质量与客户结果。收益兑现因此也是组织工作。\n\n可以保留三栏：实际已发生、依据明确的预测、尚待验证的价值。每次复盘更新证据，既防止夸大，也能看见尚未体现在现金里的有用能力。\n\n请将[工作簿](工作簿-改造提案.md)中的覆盖率、完整人工时间、可取消支出和持续成本分别填写，再改变最不确定的一项。能解释决定何时改变，比得到一个漂亮回报率更重要。\n","html":"\u003ch1>第13课｜怎样算完整投入，兑现实际收益\u003c/h1>\n\u003cp>工时、成本和现金流描述不同东西。企业采用AI时，最容易高估的地方，是把“可能省下的时间”直接写成“已经增加的利润”。\u003c/p>\n\u003cp>下面用一份完整教学账，说明如何让各项数字对应到工作。\u003c/p>\n\u003ch2>先固定比较对象\u003c/h2>\n\u003cp>假设每月有1,000笔同类请求，现行方法平均每笔需要12分钟人工工作。AI方案覆盖其中800笔，每笔仍需7分钟人工，包括准备、核对、修改和平均异常处理；未覆盖的200笔继续用原方法。\u003c/p>\n\u003cp>两种方法的完成标准相同，7分钟不包含自动 该现金结果。\n\n## 一次性投入和回收期\n\n再假设开发、资料准备、集成、培训及上线共需60,000元一次性增量投入。若每月净改善始终为2,000元，不考虑时间价值、税费和期间变化，简单回收期为30个月；第一年累计现金变化为12×2,000－60,000＝－36,000元。\n\n负数说明按本例现金口径第一年尚未回收。企业可能因学习、质量或服务战略继续投入，但应把理由单独提出，并给出后续观察。不能用“长期能力”抹去当前账目。\n\n## 哪项条件最容易改变决定\n\n如果实际只取消20小时外包，现金支出少3,000元，其他成本仍为4,000元，每月现金净变化变为－1,000元。技术省时数据可以不变，投资判断已经变化。\n\n如果维护费随规则变动增加，也会改变结果。若覆盖量增加，某些固定费用可被更多任务分担，但任务组合、人工接手和错误率也可能变化。应按新的分布重新计算，避免把单笔效果直接外推到全企业。\n\n## 为收益安排负责人\n\n技术团队可以记录处理成本，业务负责人需要决定释放时间用到哪里，采购或财务核对支出是否真的取消，运营人员观察质量与客户结果。收益兑现因此也是组织工作。\n\n可以保留三栏：实际已发生、依据明确的预测、尚待验证的价值。每次复盘更新证据，既防止夸大，也能看见尚未体现在现金里的有用能力。\n\n请将[工作簿](#workbook)中的覆盖率、完整人工时间、可取消支出和持续成本分别填写，再改变最不确定的一项。能解释决定何时改变，比得到一个漂亮回报率更重要。\n","exportSingleMd":"# 第13课｜怎样算完整投入，兑现实际收益\n\n工时、成本和现金流描述不同东西。企业采用AI时，最容易高估的地方，是把“可能省下的时间”直接写成“已经增加的利润”。\n\n下面用一份完整教学账，说明如何让各项数字对应到工作。\n\n## 先固定比较对象\n\n假设每月有1,000笔同类请求，现行方法平均每笔需要12分钟人工工作。AI方案覆盖其中800笔，每笔仍需7分钟人工，包括准备、核对、修改和平均异常处理；未覆盖的200笔继续用原方法。\n\n两种方法的完成标准相同，7分钟不包含自动等待，不能直接当客户等待周期；业务周期另测。以下数字全部是计算假设，未观测到任何真实企业效果。\n\n现行人工时间为12,000分钟，即200小时。新方法为800×7＋200×12＝8,000分钟，即约133.33小时。每月释放4,000分钟，约66.67小时。\n\n这个比较同时计入了覆盖率和人工复核。如果只用模型生成的几十秒去替代12分钟，会把仍在发生的工作隐藏起来。\n\n## 再追踪这些时间的去向\n\n假设企业确认能取消40小时原有外包，价格每小时150元，则减少现金支出6,000元。剩余约26.67小时由固定薪酬人员获得，可以安排其他工作；按同样150元估值约4,000元，属于释放容量的估计，不能再记为已节约现金。\n\n这两项合计约10,000元，是对66.67小时的资源估值。其中6,000元已经对应取消外包，不能在总账里再加一次。若外包实际上不能取消，6,000元也不能按现金收益认定。\n\n未来利用剩余时间成交新业务，需要另证实订单与贡献收益。即使事后成立，也应避免将同一份人员时间同时计成现金节约和新增服务成本节约。\n\n## 加入新方案的持续成本\n\n教学设定的月度增量成本如下。维护、复测由单独安排的服务承担，不在上述7分钟中重复计算。\n\n| 项目 | 每月金额/元 | 口径 |\n|---|---:|---|\n| 模型使用 | 800 | 本例每笔覆盖请求平均1元，含调用与重试 |\n| 平台与运行资源 | 700 | 新方案增量费用 |\n| 日常维护 | 1,500 | 资料、连接与运行支持 |\n| 周期复测 | 500 | 变更与抽查的新增安排 |\n| 预计错误现金支出 | 500 | 假设每月因错误实际支付的补发运费与退款差额，不含机会损失或商誉估值；预测值 |\n| 合计 | 4,000 | 每月增量成本 |\n\n人工复核与常规异常已进入7分钟；本例500元明确设为返工工时之外、预计会实际支付的补发运费与退款差额，两者范围不同。它是现金流预测假设，未发生时不能当成实际支出；机会损失与商誉等非现金估值应另列，不进入本例现金账。真实记录不足时应给范围和不确定性，不能为了表格完整就把未知填为零。\n\n在上述全部假设成立时，预测每月现金净改善为6,000－4,000＝2,000元。剩余容量单独说明，不并入该现金结果。\n\n## 一次性投入和回收期\n\n再假设开发、资料准备、集成、培训及上线共需60,000元一次性增量投入。若每月净改善始终为2,000元，不考虑时间价值、税费和期间变化，简单回收期为30个月；第一年累计现金变化为12×2,000－60,000＝－36,000元。\n\n负数说明按本例现金口径第一年尚未回收。企业可能因学习、质量或服务战略继续投入，但应把理由单独提出，并给出后续观察。不能用“长期能力”抹去当前账目。\n\n## 哪项条件最容易改变决定\n\n如果实际只取消20小时外包，现金支出少3,000元，其他成本仍为4,000元，每月现金净变化变为－1,000元。技术省时数据可以不变，投资判断已经变化。\n\n如果维护费随规则变动增加，也会改变结果。若覆盖量增加，某些固定费用可被更多任务分担，但任务组合、人工接手和错误率也可能变化。应按新的分布重新计算，避免把单笔效果直接外推到全企业。\n\n## 为收益安排负责人\n\n技术团队可以记录处理成本，业务负责人需要决定释放时间用到哪里，采购或财务核对支出是否真的取消，运营人员观察质量与客户结果。收益兑现因此也是组织工作。\n\n可以保留三栏：实际已发生、依据明确的预测、尚待验证的价值。每次复盘更新证据，既防止夸大，也能看见尚未体现在现金里的有用能力。\n\n请将[工作簿](https://zhongky1995.github.io/gaidn-fde-handbook/#workbook)中的覆盖率、完整人工时间、可取消支出和持续成本分别填写，再改变最不确定的一项。能解释决定何时改变，比得到一个漂亮回报率更重要。\n","text":"# 第13课｜怎样算完整投入，兑现实际收益\n\n工时、成本和现金流描述不同东西。企业采用AI时，最容易高估的地方，是把“可能省下的时间”直接写成“已经增加的利润”。\n\n下面用一份完整教学账，说明如何让各项数字对应到工作。\n\n## 先固定比较对象\n\n假设每月有1,000笔同类请求，现行方法平均每笔需要12分钟人工工作。AI方案覆盖其中800笔，每笔仍需7分钟人工，包括准备、核对、修改和平均异常处理；未覆盖的200笔继续用原方法。\n\n两种方法的完成标准相同，7分钟不包含自动等待，不能直接当客户等待周期；业务周期另测。以下数字全部是计算假设，未观测到任何真实企业效果。\n\n现行人工时间为12,000分钟，即200小时。新方法为800×7＋200×12＝8,000分钟，即约133.33小时。每月释放4,000分钟，约66.67小时。\n\n这个比较同时计入了覆盖率和人工复核。如果只用模型生成的几十秒去替代12分钟，会把仍在发生的工作隐藏起来。\n\n## 再追踪这些时间的去向\n\n假设企业确认能取消40小时原有外包，价格每小时150元，则减少现金支出6,000元。剩余约26.67小时由固定薪酬人员获得，可以安排其他工作；按同样150元估值约4,000元，属于释放容量的估计，不能再记为已节约现金。\n\n这两项合计约10,000元，是对66.67小时的资源估值。其中6,000元已经对应取消外包，不能在总账里再加一次。若外包实际上不能取消，6,000元也不能按现金收益认定。\n\n未来利用剩余时间成交新业务，需要另证实订单与贡献收益。即使事后成立，也应避免将同一份人员时间同时计成现金节约和新增服务成本节约。\n\n## 加入新方案的持续成本\n\n教学设定的月度增量成本如下。维护、复测由单独安排的服务承担，不在上述7分钟中重复计算。\n\n| 项目 | 每月金额/元 | 口径 |\n|---|---:|---|\n| 模型使用 | 800 | 本例每笔覆盖请求平均1元，含调用与重试 |\n| 平台与运行资源 | 700 | 新方案增量费用 |\n| 日常维护 | 1,500 | 资料、连接与运行支持 |\n| 周期复测 | 500 | 变更与抽查的新增安排 |\n| 预计错误现金支出 | 500 | 假设每月因错误实际支付的补发运费与退款差额，不含机会损失或商誉估值；预测值 |\n| 合计 | 4,000 | 每月增量成本 |\n\n人工复核与常规异常已进入7分钟；本例500元明确设为返工工时之外、预计会实际支付的补发运费与退款差额，两者范围不同。它是现金流预测假设，未发生时不能当成实际支出；机会损失与商誉等非现金估值应另列，不进入本例现金账。真实记录不足时应给范围和不确定性，不能为了表格完整就把未知填为零。\n\n在上述全部假设成立时，预测每月现金净改善为6,000－4,000＝2,000元。剩余容量单独说明，不并入该现金结果。\n\n## 一次性投入和回收期\n\n再假设开发、资料准备、集成、培训及上线共需60,000元一次性增量投入。若每月净改善始终为2,000元，不考虑时间价值、税费和期间变化，简单回收期为30个月；第一年累计现金变化为12×2,000－60,000＝－36,000元。\n\n负数说明按本例现金口径第一年尚未回收。企业可能因学习、质量或服务战略继续投入，但应把理由单独提出，并给出后续观察。不能用“长期能力”抹去当前账目。\n\n## 哪项条件最容易改变决定\n\n如果实际只取消20小时外包，现金支出少3,000元，其他成本仍为4,000元，每月现金净变化变为－1,000元。技术省时数据可以不变，投资判断已经变化。\n\n如果维护费随规则变动增加，也会改变结果。若覆盖量增加，某些固定费用可被更多任务分担，但任务组合、人工接手和错误率也可能变化。应按新的分布重新计算，避免把单笔效果直接外推到全企业。\n\n## 为收益安排负责人\n\n技术团队可以记录处理成本，业务负责人需要决定释放时间用到哪里，采购或财务核对支出是否真的取消，运营人员观察质量与客户结果。收益兑现因此也是组织工作。\n\n可以保留三栏：实际已发生、依据明确的预测、尚待验证的价值。每次复盘更新证据，既防止夸大，也能看见尚未体现在现金里的有用能力。\n\n请将工作簿中的覆盖率、完整人工时间、可取消支出和持续成本分别填写，再改变最不确定的一项。能解释决定何时改变，比得到一个漂亮回报率更重要。\n"},{"file":"14-上线运行与持续变化.md","id":"lesson-14","number":14,"role":"核心课","part":3,"title":"第14课｜上线以后，怎样保持有效","md":"# 第14课｜上线以后，怎样保持有效\n\n上线使系统开始面对持续变化：新客户表达、新产品、人员调整、模型更新和外部故障。企业真正采用一项能力，需要知道它什么时候仍然有效，什么时候应暂停或退回人工。\n\n## 扩大责任要跟随证据\n\n可以先在后台对照运行，结果暂不进入正式业务；再让员工使用草稿并记录修改；然后仅对已验证、边界清楚的任务开放更多动作。阶段如何划分，应由业务后果与系统条件决定。\n\n辅助整理有效，并不直接证明可以自动预留或外发。每新增一种责任，都要重新检查事实、权限、执行和异常。扩大任务类型也是同样道理：标准品经验不能直接覆盖非标适配。\n\n这里的阶段作用是逐步取得证据，不是把所有项目都拖成相同流程。低后果、易撤回的内部草稿，可以采用较轻的安排；影响客户承诺的动作，需要更明确的控制。\n\n## 观察结果，也观察工作是否被采用\n\n持续记录任务量、覆盖与转交、关键错误、人工修改、业务周期和实际费用。与这些数字一起看，员工是否绕过系统、重复录入，是否出现无人接手的异常。\n\n很高的使用次数可能来自强制要求，满意度也可能只反映新鲜感。若员工使用后仍自己从头核查，真实工作变化有限。可以观察一笔任务完整经过哪些岗位，核对原来准备退出的动作是否仍在发生。\n\n数据缺失要显示为未取得。监控没有收到成功回执，与观测到零次失败，属于不同情况。把二者都画成零，会制造稳定运行的假象。\n\n## 把变化定位到具体资产\n\n目录升级、价格调整或权限改变时，应找到受影响的任务、规则、提示说明和评测样本。案例A若改变M40-H适配条件，团队需要检查未完成询价和仍有效报价是否依赖旧条件。\n\n模型版本改变也可能影响输出方式与错误分布。保留当前模型、任务说明、资料、工具配置和评测结果的对应关系，变更后先在受影响范围复测，再决定扩大使用。\n\n即使模型未变，客户任务分布也会改变。新渠道带来更多图片、缺项或异地交付，原来的总体正确率可能不再适用。观察时应按任务类型拆分，找出变化来自哪里。\n\n## 异常处理需要能继续的路径\n\n若库存连接失败，整理工作也许仍能继续，但资源与交期应保持待确认；若只是文字生成失败，现有业务可以使用原人工路径完成。恢复办法应说明哪些已完成动作需要保留，哪些可以重做。\n\n对于结果未知的外部操作，先核实已经发生的效果。第10课的请求标识和回执记录在这里发挥作用。恢复人员应能看到同一笔任务的输入、动作和状态，避免靠聊天猜测。\n\n如果出现连续错误，暂停受影响任务范围可能比整体关闭更合适。例如停止自动采用型号候选，仍保留需求整理。前提是系统边界足够清楚，团队能判断哪些部分仍然可靠。\n\n## 为运行责任配置资源\n\n谁维护业务资料，谁处理工具故障，谁判断模型变化，谁有权暂停或恢复，最好在扩大使用前约定。小团队可以一人承担多种责任，但责任本身仍需被识别，并进入成本和时间安排。\n\n运行复盘也应回到价值假设。如果系统稳定、员工采用，但完整成本始终高于替代方案，应重新考虑范围；如果质量改善显著但现金收益未兑现，应查业务条件，而不是只优化调用费用。\n\n请为你的试点选一种最可能发生的变化，写出受影响对象、发现方式、处理人和恢复依据。下一部分进一步讨论：这些运行责任如何进入岗位和合作关系。\n","html":"\u003ch1>第14课｜上线以后，怎样保持有效\u003c/h1>\n\u003cp>上线使系统开始面对持续变化：新客户表达、新产品、人员调整、模型更新和外部故障。企业真正采用一项能力，需要知道它什么时候仍然有效，什么时候应暂停或退回人工。\u003c/p>\n\u003ch2>扩大责任要跟随证据\u003c/h2>\n\u003cp>可以先在后台对照运行，结果暂不进入正式业务；再让员工使用草稿并记录修改；然后仅对已验证、边界清楚的任务开放更多动作。阶段如何划分，应由业务后果与系统条件决定。\u003c/p>\n\u003cp>辅助整理有效，并不直接证明可以自动预留或外发。每新增一种责任，都要重新检查事实、权限、执行和异常。扩大任务类型也是同样道理：标准品经验不能直接覆盖非标适配。\u003c/p>\n\u003cp>这里的阶段作用是逐步取得证据，不是把所有项目都拖成相同流程。低后果、易撤回的内部草稿，可以采用较轻的安排；影响客户承诺的动作，需要更明确的控制。\u003c/p>\n\u003ch2>观察结果，也观察工作是否被采用\u003c/h2>\n\u003cp>持续记录任务量、覆盖与转交、关键错误、人工修改、业务周期和实际费用。与这些数字一起看，员工是否绕过系统、重复录入，是否出现无人接手的异常。\u003c/p>\n\u003cp>很高的使用次数可能来自强制要求，满意度也可能只反映新鲜感。若员工使用后仍自己从头核查，真实工作变化有限。可以观察一笔任务完整经过哪些岗位，核对原来准备退出的动作是否仍在发生。\u003c/p>\n\u003cp>数据缺失要显示为未取得。监控没有收到成功回执，与观测到零次失败，属于不同情况。把二者都画成零，会制造稳定运行的假象。\u003c/p>\n\u003ch2>把变化定位到具体资产\u003c/h2>\n\u003cp>目录升级、价格调整或权限改变时，应找到受影响的任务、规则、提示说明和评测样本。案例A若改变M40-H适配条件，团队需要检查未完成询价和仍有效报价是否依赖旧条件。\u003c/p>\n\u003cp>模型版本改变也可能影响输出方式与错误分布。保留当前模型、任务说明、资料、工具配置和评测结果的对应关系，变更后先在受影响范围复测，再决定扩大使用。\u003c/p>\n\u003cp>即使模型未变，客户任务分布也会改变。新渠道带来更多图片、缺项或异地交付，原来的总体正确率可能不再适用。观察时应按任务类型拆分，找出变化来自哪里。\u003c/p>\n\u003ch2>异常处理需要能继续的路径\u003c/h2>\n\u003cp>若库存连接失败，整理工作也许仍能继续，但资源与交期应保持待确认；若只是文字生成失败，现有业务可以使用原人工路径完成。恢复办法应说明哪些已完成动作需要保留，哪些可以重做。\u003c/p>\n\u003cp>对于结果未知的外部操作，先核实已经发生的效果。第10课的请求标识和回执记录在这里发挥作用。恢复人员应能看到同一笔任务的输入、动作和状态，避免靠聊天猜测。\u003c/p>\n\u003cp>如果出现连续错误，暂停受影响任务范围可能比整体关闭更合适。例如停止自动采用型号候选，仍保留需求整理。前提是系统边界足够清楚，团队能判断哪些部分仍然可靠。\u003c/p>\n\u003ch2>为运行责任配置资源\u003c/h2>\n\u003cp>谁维护业务资料，谁处理工具故障，谁判断模型变化，谁有权暂停或恢复，最好在扩大使用前约定。小团队可以一人承担多种责任，但责任本身仍需被识别，并进入成本和时间安排。\u003c/p>\n\u003cp>运行复盘也应回到价值假设。如果系统稳定、员工采用，但完整成本始终高于替代方案，应重新考虑范围；如果质量改善显著但现金收益未兑现，应查业务条件，而不是只优化调用费用。\u003c/p>\n\u003cp>请为你的试点选一种最可能发生的变化，写出受影响对象、发现方式、处理人和恢复依据。下一部分进一步讨论：这些运行责任如何进入岗位和合作关系。\u003c/p>\n","exportMd":"# 第14课｜上线以后，怎样保持有效\n\n上线使系统开始面对持续变化：新客户表达、新产品、人员调整、模型更新和外部故障。企业真正采用一项能力，需要知道它什么时候仍然有效，什么时候应暂停或退回人工。\n\n## 扩大责任要跟随证据\n\n可以先在后台对照运行，结果暂不进入正式业务；再让员工使用草稿并记录修改；然后仅对已验证、边界清楚的任务开放更多动作。阶段如何划分，应由业务后果与系统条件决定。\n\n辅助整理有效，并不直接证明可以自动预留或外发。每新增一种责任，都要重新检查事实、权限、执行和异常。扩大任务类型也是同样道理：标准品经 异常处理需要能继续的路径\n\n若库存连接失败，整理工作也许仍能继续，但资源与交期应保持待确认；若只是文字生成失败，现有业务可以使用原人工路径完成。恢复办法应说明哪些已完成动作需要保留，哪些可以重做。\n\n对于结果未知的外部操作，先核实已经发生的效果。第10课的请求标识和回执记录在这里发挥作用。恢复人员应能看到同一笔任务的输入、动作和状态，避免靠聊天猜测。\n\n如果出现连续错误，暂停受影响任务范围可能比整体关闭更合适。例如停止自动采用型号候选，仍保留需求整理。前提是系统边界足够清楚，团队能判断哪些部分仍然可靠。\n\n## 为运行责任配置资源\n\n谁维护业务资料，谁处理工具故障，谁判断模型变化，谁有权暂停或恢复，最好在扩大使用前约定。小团队可以一人承担多种责任，但责任本身仍需被识别，并进入成本和时间安排。\n\n运行复盘也应回到价值假设。如果系统稳定、员工采用，但完整成本始终高于替代方案，应重新考虑范围；如果质量改善显著但现金收益未兑现，应查业务条件，而不是只优化调用费用。\n\n请为你的试点选一种最可能发生的变化，写出受影响对象、发现方式、处理人和恢复依据。下一部分进一步讨论：这些运行责任如何进入岗位和合作关系。\n","text":"# 第14课｜上线以后，怎样保持有效\n\n上线使系统开始面对持续变化：新客户表达、新产品、人员调整、模型更新和外部故障。企业真正采用一项能力，需要知道它什么时候仍然有效，什么时候应暂停或退回人工。\n\n## 扩大责任要跟随证据\n\n可以先在后台对照运行，结果暂不进入正式业务；再让员工使用草稿并记录修改；然后仅对已验证、边界清楚的任务开放更多动作。阶段如何划分，应由业务后果与系统条件决定。\n\n辅助整理有效，并不直接证明可以自动预留或外发。每新增一种责任，都要重新检查事实、权限、执行和异常。扩大任务类型也是同样道理：标准品经验不能直接覆盖非标适配。\n\n这里的阶段作用是逐步取得证据，不是把所有项目都拖成相同流程。低后果、易撤回的内部草稿，可以采用较轻的安排；影响客户承诺的动作，需要更明确的控制。\n\n## 观察结果，也观察工作是否被采用\n\n持续记录任务量、覆盖与转交、关键错误、人工修改、业务周期和实际费用。与这些数字一起看，员工是否绕过系统、重复录入，是否出现无人接手的异常。\n\n很高的使用次数可能来自强制要求，满意度也可能只反映新鲜感。若员工使用后仍自己从头核查，真实工作变化有限。可以观察一笔任务完整经过哪些岗位，核对原来准备退出的动作是否仍在发生。\n\n数据缺失要显示为未取得。监控没有收到成功回执，与观测到零次失败，属于不同情况。把二者都画成零，会制造稳定运行的假象。\n\n## 把变化定位到具体资产\n\n目录升级、价格调整或权限改变时，应找到受影响的任务、规则、提示说明和评测样本。案例A若改变M40-H适配条件，团队需要检查未完成询价和仍有效报价是否依赖旧条件。\n\n模型版本改变也可能影响输出方式与错误分布。保留当前模型、任务说明、资料、工具配置和评测结果的对应关系，变更后先在受影响范围复测，再决定扩大使用。\n\n即使模型未变，客户任务分布也会改变。新渠道带来更多图片、缺项或异地交付，原来的总体正确率可能不再适用。观察时应按任务类型拆分，找出变化来自哪里。\n\n## 异常处理需要能继续的路径\n\n若库存连接失败，整理工作也许仍能继续，但资源与交期应保持待确认；若只是文字生成失败，现有业务可以使用原人工路径完成。恢复办法应说明哪些已完成动作需要保留，哪些可以重做。\n\n对于结果未知的外部操作，先核实已经发生的效果。第10课的请求标识和回执记录在这里发挥作用。恢复人员应能看到同一笔任务的输入、动作和状态，避免靠聊天猜测。\n\n如果出现连续错误，暂停受影响任务范围可能比整体关闭更合适。例如停止自动采用型号候选，仍保留需求整理。前提是系统边界足够清楚，团队能判断哪些部分仍然可靠。\n\n## 为运行责任配置资源\n\n谁维护业务资料，谁处理工具故障，谁判断模型变化，谁有权暂停或恢复，最好在扩大使用前约定。小团队可以一人承担多种责任，但责任本身仍需被识别，并进入成本和时间安排。\n\n运行复盘也应回到价值假设。如果系统稳定、员工采用，但完整成本始终高于替代方案，应重新考虑范围；如果质量改善显著但现金收益未兑现，应查业务条件，而不是只优化调用费用。\n\n请为你的试点选一种最可能发生的变化，写出受影响对象、发现方式、处理人和恢复依据。下一部分进一步讨论：这些运行责任如何进入岗位和合作关系。\n"},{"file":"15-岗位权责与激励.md","id":"lesson-15","number":15,"role":"核心课","part":4,"title":"第15课｜岗位、权责与激励怎样一起改变","md":"# 第15课｜岗位、权责与激励怎样一起改变\n\n一项技术能减少整体工作，却仍可能遭到某个岗位抵触。销售少整理，技术多核对；管理者获得透明度，员工增加留痕；企业得到经验，骨干却担心个人价值被削弱。\n\n这些反应揭示了工作与利益的变化，需要进入方案本身。\n\n## 以任务组合重新看岗位\n\n一个岗位通常同时做信息准备、专业判断、协调、执行和关系维护。AI先改变其中一部分，不能据此直接推算整个岗位可以减少多少人员。\n\n在询价中，销售的整理工作可能减少，却增加了核对缺项和解释选择；技术人员的重复查询可能减少，可以把时间用于复杂适配。岗位因此可以向更有价值的任务移动，但需要培训、排期和评价方式支持。\n\n先把实际任务列出来，记录哪些退出、哪些新增、哪些责任加重。这样也能发现名义省时是否只是把劳动转给别的部门。\n\n## 流程负责人解决什么\n\n销售希望尽快回复，技术希望条件完整，履约希望承诺可执行。分别优化部门指标，可能使企业整体更慢。例如只奖励销售提交数量，会把大量不完整任务送进技术队列；只奖励技术零风险，又可能让简单单长期等待。\n\n流程负责人需要对一条业务结果作出跨岗位取舍：哪些任务先处理，材料到什么程度可以受理，哪些例外值得投入，出现冲突由谁决定。这一角色可以由现有管理者承担，不一定新增职位。\n\n技术负责人或FDE提供实现判断，业务流程负责人提供价值与承诺判断。二者共同维护试点边界，避免每个部门只验自己的一小段。\n\n## 责任应配套信息和权限\n\n让销售核对客户所述的历史型号，就要提供原话、旧单和候选及可求助渠道；替换型号的适配仍由技术确认，技术人员需要相应工况和有效规则。这是两种不同的核对责任，不能由“销售确认”一词合并。若最终责任超出可见信息和可用时间，人员只会形式确认或反复退回。\n\n同样，员工需要能够报告不确定性，不因正确转交而被认定低效。若系统要求对所有任务给出确定答案，谨慎处理就会在考核中吃亏。\n\n适当的指标可以同时观察有效完成量、严重错误、返工和接手负担。指标的组合服务于业务目标，也要警惕为达标而改变任务分类、提前标完成等行为。\n\n## 为什么骨干愿意贡献经验\n\n经验外化需要时间，还可能暴露过去不一致的做法。企业可以把参与规则设计、处理困难案例和培养同事作为明确工作，而不要求骨干在本职之外免费补完知识库。\n\n也要保留专业裁量。规则覆盖的是已验证的范围，新的复杂情境仍需专业判断。让骨干解释“何时这条规则不适用”，比只收集标准答案更能提高系统质量。\n\n贡献的价值可以体现在新岗位职责、工作安排、认可与激励中。具体方式取决于企业，但应能让参与者看见自己在新工作方式中的位置。\n\n## 用采用过程检验组织设计\n\n员工绕过系统，可能因为结果不可信、操作多、等待长、权限不足，也可能因为绩效仍奖励旧做法。先观察实际任务，再决定是改工具、改流程还是调整激励。\n\n在[案例C](案例C-门店异常闭环.md)中，总部与门店对异常记录的目标不同。课程用它检验：信息透明以后，谁获得了能力，谁承担了新工作，双方是否有共同的完成标准。\n\n请为本次改造写一张岗位变化表，每个参与者只回答四件事：少做什么、多做什么、能决定什么、按什么评价。再寻找一处整体获益但个人可能受损的位置，安排具体解决方式。这是组织采用的重要前置条件。\n","html":"\u003ch1>第15课｜岗位、权责与激励怎样一起改变\u003c/h1>\n\u003cp>一项技术能减少整体工作，却仍可能遭到某个岗位抵触。销售少整理，技术多核对；管理者获得透明度，员工增加留痕；企业得到经验，骨干却担心个人价值被削弱。\u003c/p>\n\u003cp>这些反应揭示了工作与利益的变化，需要进入方案本身。\u003c/p>\n\u003ch2>以任务组合重新看岗位\u003c/h2>\n\u003cp>一个岗位通常同时做信息准备、专业判断、协调、执行和关系维护。AI先改变其中一部分，不能据此直接推算整个岗位可以减少多少人员。\u003c/p>\n\u003cp>在询价中，销售的整理工作可能减少，却增加了核对缺项和解释选择；技术人员的重复查询可能减少，可以把时间用于复杂适配。岗位因此可以向更有价值的任务移动，但需要培训、排期和评价方式支持。\u003c/p>\n\u003cp>先把实际任务列出来，记录哪些退出、哪些新增、哪些责任加重。这样也能发现名义省时是否只是把劳动转给别的部门。\u003c/p>\n\u003ch2>流程负责人解决什么\u003c/h2>\n\u003cp>销售希望尽快回复，技术希望条件完整，履约希望承诺可执行。分别优化部门指标，可能使企业整体更慢 \n同样，员工需要能够报告不确定性，不因正确转交而被认定低效。若系统要求对所有任务给出确定答案，谨慎处理就会在考核中吃亏。\n\n适当的指标可以同时观察有效完成量、严重错误、返工和接手负担。指标的组合服务于业务目标，也要警惕为达标而改变任务分类、提前标完成等行为。\n\n## 为什么骨干愿意贡献经验\n\n经验外化需要时间，还可能暴露过去不一致的做法。企业可以把参与规则设计、处理困难案例和培养同事作为明确工作，而不要求骨干在本职之外免费补完知识库。\n\n也要保留专业裁量。规则覆盖的是已验证的范围，新的复杂情境仍需专业判断。让骨干解释“何时这条规则不适用”，比只收集标准答案更能提高系统质量。\n\n贡献的价值可以体现在新岗位职责、工作安排、认可与激励中。具体方式取决于企业，但应能让参与者看见自己在新工作方式中的位置。\n\n## 用采用过程检验组织设计\n\n员工绕过系统，可能因为结果不可信、操作多、等待长、权限不足，也可能因为绩效仍奖励旧做法。先观察实际任务，再决定是改工具、改流程还是调整激励。\n\n在[案例C](#case-c)中，总部与门店对异常记录的目标不同。课程用它检验：信息透明以后，谁获得了能力，谁承担了新工作，双方是否有共同的完成标准。\n\n请为本次改造写一张岗位变化表，每个参与者只回答四件事：少做什么、多做什么、能决定什么、按什么评价。再寻找一处整体获益但个人可能受损的位置，安排具体解决方式。这是组织采用的重要前置条件。\n","exportSingleMd":"# 第15课｜岗位、权责与激励怎样一起改变\n\n一项技术能减少整体工作，却仍可能遭到某个岗位抵触。销售少整理，技术多核对；管理者获得透明度，员工增加留痕；企业得到经验，骨干却担心个人价值被削弱。\n\n这些反应揭示了工作与利益的变化，需要进入方案本身。\n\n## 以任务组合重新看岗位\n\n一个岗位通常同时做信息准备、专业判断、协调、执行和关系维护。AI先改变其中一部分，不能据此直接推算整个岗位可以减少多少人员。\n\n在询价中，销售的整理工作可能减少，却增加了核对缺项和解释选择；技术人员的重复查询可能减少，可以把时间用于复杂适配。岗位因此可以向更有价值的任务移动，但需要培训、排期和评价方式支持。\n\n先把实际任务列出来，记录哪些退出、哪些新增、哪些责任加重。这样也能发现名义省时是否只是把劳动转给别的部门。\n\n## 流程负责人解决什么\n\n销售希望尽快回复，技术希望条件完整，履约希望承诺可执行。分别优化部门指标，可能使企业整体更慢。例如只奖励销售提交数量，会把大量不完整任务送进技术队列；只奖励技术零风险，又可能让简单单长期等待。\n\n流程负责人需要对一条业务结果作出跨岗位取舍：哪些任务先处理，材料到什么程度可以受理，哪些例外值得投入，出现冲突由谁决定。这一角色可以由现有管理者承担，不一定新增职位。\n\n技术负责人或FDE提供实现判断，业务流程负责人提供价值与承诺判断。二者共同维护试点边界，避免每个部门只验自己的一小段。\n\n## 责任应配套信息和权限\n\n让销售核对客户所述的历史型号，就要提供原话、旧单和候选及可求助渠道；替换型号的适配仍由技术确认，技术人员需要相应工况和有效规则。这是两种不同的核对责任，不能由“销售确认”一词合并。若最终责任超出可见信息和可用时间，人员只会形式确认或反复退回。\n\n同样，员工需要能够报告不确定性，不因正确转交而被认定低效。若系统要求对所有任务给出确定答案，谨慎处理就会在考核中吃亏。\n\n适当的指标可以同时观察有效完成量、严重错误、返工和接手负担。指标的组合服务于业务目标，也要警惕为达标而改变任务分类、提前标完成等行为。\n\n## 为什么骨干愿意贡献经验\n\n经验外化需要时间，还可能暴露过去不一致的做法。企业可以把参与规则设计、处理困难案例和培养同事作为明确工作，而不要求骨干在本职之外免费补完知识库。\n\n也要保留专业裁量。规则覆盖的是已验证的范围，新的复杂情境仍需专业判断。让骨干解释“何时这条规则不适用”，比只收集标准答案更能提高系统质量。\n\n贡献的价值可以体现在新岗位职责、工作安排、认可与激励中。具体方式取决于企业，但应能让参与者看见自己在新工作方式中的位置。\n\n## 用采用过程检验组织设计\n\n员工绕过系统，可能因为结果不可信、操作多、等待长、权限不足，也可能因为绩效仍奖励旧做法。先观察实际任务，再决定是改工具、改流程还是调整激励。\n\n在[案例C](https://zhongky1995.github.io/gaidn-fde-handbook/#case-c)中，总部与门店对异常记录的目标不同。课程用它检验：信息透明以后，谁获得了能力，谁承担了新工作，双方是否有共同的完成标准。\n\n请为本次改造写一张岗位变化表，每个参与者只回答四件事：少做什么、多做什么、能决定什么、按什么评价。再寻找一处整体获益但个人可能受损的位置，安排具体解决方式。这是组织采用的重要前置条件。\n","text":"# 第15课｜岗位、权责与激励怎样一起改变\n\n一项技术能减少整体工作，却仍可能遭到某个岗位抵触。销售少整理，技术多核对；管理者获得透明度，员工增加留痕；企业得到经验，骨干却担心个人价值被削弱。\n\n这些反应揭示了工作与利益的变化，需要进入方案本身。\n\n## 以任务组合重新看岗位\n\n一个岗位通常同时做信息准备、专业判断、协调、执行和关系维护。AI先改变其中一部分，不能据此直接推算整个岗位可以减少多少人员。\n\n在询价中，销售的整理工作可能减少，却增加了核对缺项和解释选择；技术人员的重复查询可能减少，可以把时间用于复杂适配。岗位因此可以向更有价值的任务移动，但需要培训、排期和评价方式支持。\n\n先把实际任务列出来，记录哪些退出、哪些新增、哪些责任加重。这样也能发现名义省时是否只是把劳动转给别的部门。\n\n## 流程负责人解决什么\n\n销售希望尽快回复，技术希望条件完整，履约希望承诺可执行。分别优化部门指标，可能使企业整体更慢。例如只奖励销售提交数量，会把大量不完整任务送进技术队列；只奖励技术零风险，又可能让简单单长期等待。\n\n流程负责人需要对一条业务结果作出跨岗位取舍：哪些任务先处理，材料到什么程度可以受理，哪些例外值得投入，出现冲突由谁决定。这一角色可以由现有管理者承担，不一定新增职位。\n\n技术负责人或FDE提供实现判断，业务流程负责人提供价值与承诺判断。二者共同维护试点边界，避免每个部门只验自己的一小段。\n\n## 责任应配套信息和权限\n\n让销售核对客户所述的历史型号，就要提供原话、旧单和候选及可求助渠道；替换型号的适配仍由技术确认，技术人员需要相应工况和有效规则。这是两种不同的核对责任，不能由“销售确认”一词合并。若最终责任超出可见信息和可用时间，人员只会形式确认或反复退回。\n\n同样，员工需要能够报告不确定性，不因正确转交而被认定低效。若系统要求对所有任务给出确定答案，谨慎处理就会在考核中吃亏。\n\n适当的指标可以同时观察有效完成量、严重错误、返工和接手负担。指标的组合服务于业务目标，也要警惕为达标而改变任务分类、提前标完成等行为。\n\n## 为什么骨干愿意贡献经验\n\n经验外化需要时间，还可能暴露过去不一致的做法。企业可以把参与规则设计、处理困难案例和培养同事作为明确工作，而不要求骨干在本职之外免费补完知识库。\n\n也要保留专业裁量。规则覆盖的是已验证的范围，新的复杂情境仍需专业判断。让骨干解释“何时这条规则不适用”，比只收集标准答案更能提高系统质量。\n\n贡献的价值可以体现在新岗位职责、工作安排、认可与激励中。具体方式取决于企业，但应能让参与者看见自己在新工作方式中的位置。\n\n## 用采用过程检验组织设计\n\n员工绕过系统，可能因为结果不可信、操作多、等待长、权限不足，也可能因为绩效仍奖励旧做法。先观察实际任务，再决定是改工具、改流程还是调整激励。\n\n在案例C中，总部与门店对异常记录的目标不同。课程用它检验：信息透明以后，谁获得了能力，谁承担了新工作，双方是否有共同的完成标准。\n\n请为本次改造写一张岗位变化表，每个参与者只回答四件事：少做什么、多做什么、能决定什么、按什么评价。再寻找一处整体获益但个人可能受损的位置，安排具体解决方式。这是组织采用的重要前置条件。\n"},{"file":"16-怎样与FDE团队合作.md","id":"lesson-16","number":16,"role":"核心课","part":4,"title":"第16课｜怎样组织和采购 FDE 工作","md":"# 第16课｜怎样组织和采购 FDE 工作\n\n购买FDE工作，实际是在购买一组相互连接的能力：发现问题、实现方案、进入生产、推动采用和交还能力。合作安排需要让这些工作能够发生，也让企业有办法判断完成程度。\n\n## 根据缺口选择合作结构\n\n如果企业已有可靠开发团队，缺少AI任务设计，可以采购有界专业支持；如果业务与技术都需要共同探索，可以安排小型混合团队；如果长期依赖某一平台，还要评估厂商或合作伙伴能够提供的连接与运行能力。\n\n同一个头衔不能保证覆盖所有工作。比较候选团队时，应让其解释一笔真实或脱敏任务怎样被理解、构建、验证和接手。架构说明、代码能力与业务判断分别取证，再看它们如何协作。\n\n## 企业必须提供工作条件\n\n外部人员需要取得必要业务材料，与使用者和决策者共同工作，了解现有系统，并得到适当测试权限。企业若只提供一句目标，之后等待完整系统，很难得到现场反馈带来的价值。\n\n同时应明确数据可见范围、允许动作和生产变更负责人。权限过小可能无法验证，权限过大又增加无关暴露；按当前任务配置所需能力，更容易同时支持实施和控制。\n\n安排一个能协调跨岗位问题的内部负责人，给实际参与人员留出时间。业务条件没有被提供时，项目停顿应被记录为依赖，而非被包装成技术进度。\n\n## 交付对象应同时包括四层\n\n第一层是可使用的业务结果：哪些岗位能在什么任务上完成什么工作。第二层是可运行的系统：配置、连接、部署、账号与维护入口。第三层是可检查的证据：任务样本、实际输出、已知错误、成本和验收记录。第四层是可接手的能力：资料维护、异常恢复、变更验证与人员训练。\n\n文档、源码和演示分别承载其中一部分，不能互相代替。企业可以按项目范围缩减交付，但应明确缩减的是哪种责任。\n\n## 用阶段结果管理不确定性\n\n发现阶段可以交付问题证据、竞争解释和试点建议；试做阶段交付可操作方案及评测；采用阶段交付真实岗位使用和完整成本；交接阶段验证内部人员能够运行、修改与恢复。\n\n阶段决定可以是继续、缩小范围、调整方向或停止。把停止写入合作机制，有助于让双方报告真实发现。若付款、进度与结论都只允许“成功”，项目可能持续累积功能，却没有可信的采用依据。\n\n收费可以按工时、阶段、订阅支持或其他安排组织；评价其合适性，要看工作是否可界定、变化由谁控制、结果能否归因。课程不指定一种收费方式作为FDE的资格标准。具体商业与法律条款另由双方专业人员确定。\n\n## 留下独立运行与切换的条件\n\n企业需要知道数据和业务规则在哪里，哪些依赖外部平台，配置和记录如何导出，停止合作后哪些功能还能使用。退出条件也是当下方案比较的一部分。\n\n交接可以做实际演练：由内部接手者处理一笔任务，修改一条资料，定位一次异常，再说明何时需要供应方支持。若原实施者不断代操作，演练尚未完成。\n\n## 合作复盘问什么\n\n除了进度，还要看：本轮排除了什么错误方向，哪些假设得到或失去支持，哪些能力已交还企业，下一笔钱将解决哪项剩余约束。\n\n请把候选合作范围写成这四层交付，并为每层选一个验收动作。这样讨论报价和排期时，双方比较的是同一项工作，而不只是同一个职位名称。\n","html":"\u003ch1>第16课｜怎样组织和采购 FDE 工作\u003c/h1>\n\u003cp>购买FDE工作，实际是在购买一组相互连接的能力：发现问题、实现方案、进入生产、推动采用和交还能力。合作安排需要让这些工作能够发生，也让企业有办法判断完成程度。\u003c/p>\n\u003ch2>根据缺口选择合作结构\u003c/h2>\n\u003cp>如果企业已有可靠开发团队，缺少AI任务设计，可以采购有界专业支持；如果业务与技术都需要共同探索，可以安排小型混合团队；如果长期依赖某一平台，还要评估厂商或合作伙伴能够提供的连接与运行能力。\u003c/p>\n\u003cp>同一个头衔不能保证覆盖所有工作。比较候选团队时，应让其解释一笔真实或脱敏任务怎样被理解、构建、验证和接手。架构说明、代码能力与业务判断分别取证，再看它们如何协作。\u003c/p>\n\u003ch2>企业必须提供工作条件\u003c/h2>\n\u003cp>外部人员需要取得必要业务材料，与使用者和决策者共同工作，了解现有系统，并得到适当测试权限。企业若只提供一句目标，之后等待完整系统，很难得到现场反馈带来的价值。\u003c/p>\n\u003cp>同时应明确数据可见范围、允许动作和生产变更负责人。权限过小可能无法验证，权限过大又增加无关暴露；按当前任务配置所需能力，更容易同时支持实施和控制。\u003c/p>\n\u003cp>安排一个能协调跨岗位问题的内部负责人，给实际参与人员留出时间。业务条件没有被提供时，项目停顿应被记录为依赖，而非被包装成技术进度。\u003c/p>\n\u003ch2>交付对象应同时包括四层\u003c/h2>\n\u003cp>第一层是可使用的业务结果：哪些岗位能在什么任务上完成什么工作。第二层是可运行的系统：配置、连接、部署、账号与维护入口。第三层是可检查的证据：任务样本、实际输出、已知错误、成本和验收记录。第四层是可接手的能力：资料维护、异常恢复、变更验证与人员训练。\u003c/p>\n\u003cp>文档、源码和演示分别承载其中一部分，不能互相代替。企业可以按项目范围缩减交付，但应明确缩减的是哪种责任。\u003c/p>\n\u003ch2>用阶段结果管理不确定性\u003c/h2>\n\u003cp>发现阶段可以交付问题证据、竞争解释和试点建议；试做阶段交付可操作方案及评测；采用阶段交付真实岗 而不只是同一个职位名称。\n","exportSingleMd":"# 第16课｜怎样组织和采购 FDE 工作\n\n购买FDE工作，实际是在购买一组相互连接的能力：发现问题、实现方案、进入生产、推动采用和交还能力。合作安排需要让这些工作能够发生，也让企业有办法判断完成程度。\n\n## 根据缺口选择合作结构\n\n如果企业已有可靠开发团队，缺少AI任务设计，可以采购有界专业支持；如果业务与技术都需要共同探索，可以安排小型混合团队；如果长期依赖某一平台，还要评估厂商或合作伙伴能够提供的连接与运行能力。\n\n同一个头衔不能保证覆盖所有工作。比较候选团队时，应让其解释一笔真实或脱敏任务怎样被理解、构建、验证和接手。架构说明、代码能力与业务判断分别取证，再看它们如何协作。\n\n## 企业必须提供工作条件\n\n外部人员需要取得必要业务材料，与使用者和决策者共同工作，了解现有系统，并得到适当测试权限。企业若只提供一句目标，之后等待完整系统，很难得到现场反馈带来的价值。\n\n同时应明确数据可见范围、允许动作和生产变更负责人。权限过小可能无法验证，权限过大又增加无关暴露；按当前任务配置所需能力，更容易同时支持实施和控制。\n\n安排一个能协调跨岗位问题的内部负责人，给实际参与人员留出时间。业务条件没有被提供时，项目停顿应被记录为依赖，而非被包装成技术进度。\n\n## 交付对象应同时包括四层\n\n第一层是可使用的业务结果：哪些岗位能在什么任务上完成什么工作。第二层是可运行的系统：配置、连接、部署、账号与维护入口。第三层是可检查的证据：任务样本、实际输出、已知错误、成本和验收记录。第四层是可接手的能力：资料维护、异常恢复、变更验证与人员训练。\n\n文档、源码和演示分别承载其中一部分，不能互相代替。企业可以按项目范围缩减交付，但应明确缩减的是哪种责任。\n\n## 用阶段结果管理不确定性\n\n发现阶段可以交付问题证据、竞争解释和试点建议；试做阶段交付可操作方案及评测；采用阶段交付真实岗位使用和完整成本；交接阶段验证内部人员能够运行、修改与恢复。\n\n阶段决定可以是继续、缩小范围、调整方向或停止。把停止写入合作机制，有助于让双方报告真实发现。若付款、进度与结论都只允许“成功”，项目可能持续累积功能，却没有可信的采用依据。\n\n收费可以按工时、阶段、订阅支持或其他安排组织；评价其合适性，要看工作是否可界定、变化由谁控制、结果能否归因。课程不指定一种收费方式作为FDE的资格标准。具体商业与法律条款另由双方专业人员确定。\n\n## 留下独立运行与切换的条件\n\n企业需要知道数据和业务规则在哪里，哪些依赖外部平台，配置和记录如何导出，停止合作后哪些功能还能使用。退出条件也是当下方案比较的一部分。\n\n交接可以做实际演练：由内部接手者处理一笔任务，修改一条资料，定位一次异常，再说明何时需要供应方支持。若原实施者不断代操作，演练尚未完成。\n\n## 合作复盘问什么\n\n除了进度，还要看：本轮排除了什么错误方向，哪些假设得到或失去支持，哪些能力已交还企业，下一笔钱将解决哪项剩余约束。\n\n请把候选合作范围写成这四层交付，并为每层选一个验收动作。这样讨论报价和排期时，双方比较的是同一项工作，而不只是同一个职位名称。\n","text":"# 第16课｜怎样组织和采购 FDE 工作\n\n购买FDE工作，实际是在购买一组相互连接的能力：发现问题、实现方案、进入生产、推动采用和交还能力。合作安排需要让这些工作能够发生，也让企业有办法判断完成程度。\n\n## 根据缺口选择合作结构\n\n如果企业已有可靠开发团队，缺少AI任务设计，可以采购有界专业支持；如果业务与技术都需要共同探索，可以安排小型混合团队；如果长期依赖某一平台，还要评估厂商或合作伙伴能够提供的连接与运行能力。\n\n同一个头衔不能保证覆盖所有工作。比较候选团队时，应让其解释一笔真实或脱敏任务怎样被理解、构建、验证和接手。架构说明、代码能力与业务判断分别取证，再看它们如何协作。\n\n## 企业必须提供工作条件\n\n外部人员需要取得必要业务材料，与使用者和决策者共同工作，了解现有系统，并得到适当测试权限。企业若只提供一句目标，之后等待完整系统，很难得到现场反馈带来的价值。\n\n同时应明确数据可见范围、允许动作和生产变更负责人。权限过小可能无法验证，权限过大又增加无关暴露；按当前任务配置所需能力，更容易同时支持实施和控制。\n\n安排一个能协调跨岗位问题的内部负责人，给实际参与人员留出时间。业务条件没有被提供时，项目停顿应被记录为依赖，而非被包装成技术进度。\n\n## 交付对象应同时包括四层\n\n第一层是可使用的业务结果：哪些岗位能在什么任务上完成什么工作。第二层是可运 作。\n\n只自动收集反馈，没人决定改什么，会堆积问题；每次都修改全部说明，会破坏已经有效的部分。更新应有范围、依据与回退办法。模型对话中的“我记住了”，也不能替代企业资料和系统的实际更新。\n\n请从本次项目选一条经验，写明它的成立条件、反例、维护位置和下一次验证方式。等第二次采用后，再决定能否扩大为标准。最后一课将把这些判断组织成企业的阶段路线。\n","html":"\u003ch1>第17课｜经验怎样成为下一次能用的能力\u003c/h1>\n\u003cp>完成一个项目以后，企业可能留下很多文件，却仍在下一次从头开始。能否积累，取决于经验是否进入实际工作，以及换条件后能否被正确使用。\u003c/p>\n\u003ch2>先识别值得保留的经验\u003c/h2>\n\u003cp>一次成功结果，可能来自特殊客户、骨干临时介入或偶然外部条件。复盘要分清哪部分可以重复，哪部分依赖当时环境。\u003c/p>\n\u003cp>在询价试点中，可能发现“先识别工况缺项再进入技术队列”有效。值得保留的包括：适用的请求类型、必要条件、资料依据、可接受结果、例外和验证记录。只保存最后一段提示词，会丢失它为何有效的条件。\u003c/p>\n\u003cp>失败也能成为资产。例如同型号不同版本被混淆，应进入身份与检索规则，也进入之后的测试集。下一次换模型或目录，团队就能检查这个错误是否再次出现。\u003c/p>\n\u003ch2>不同经验进入不同位置\u003c/h2>\n\u003cp>产品事实进入有维护责任的资料源；业务取舍进入规则和授权；处理方法进入工作说明或能力包；系统连接进入代码与配置；合格与错误样本进入评测；实际业务状态保留在相应业务系统。\u003c/p>\n\u003cp>这些位置可以相互链接，但不宜复制成多份同等权威的正文。否则价格更新一次，需要逐个修改知识库、提示说明和模板，遗漏几乎不可避免。\u003c/p>\n\u003cp>整理的价值因此在于减少下一次理解和维护的成本。每项资产需要有人维护，也需要知道哪些流程依赖它。\u003c/p>\n\u003ch2>共同业务对象连接知识与行动\u003c/h2>\n\u003cp>当多个应用共同使用客户、询价、产品、订单和交付，可以逐步形成一致的对象、关系和允许动作。例如一笔询价引用哪个产品版本，哪次批准形成哪个报价，哪次预留支持哪个承诺。\u003c/p>\n\u003cp>有些平台把这类共同表示称为本体或语义层。企业需要的实质，是让不同岗位和系统对同一事物有稳定理解，并能据此行动。它可以先从一条业务链开始，无须先建设覆盖全公司的大模型。\u003c/p>\n\u003cp>这种共同表示对AI尤其有用。模型可以帮助解释信息，但正式结果仍能关联到稳定对象和规则，便于查证、修改和恢复。企业由此逐步减少对某段对话或某个人记忆的依赖。\u003c/p>\n\u003ch2>复用应该通过第二次工作检验\u003c/h2>\n\u003cp>把询价方法迁移到专业服务排期，可以复用“候选、批准、资源与承诺分开”的原则；但库存预留需要改成技能、工时与项目排期，合格结果也要重定。\u003c/p>\n\u003cp>如果一个方法包要求所有行业采用同样字段，可能只是把第一家企业的偶然做法复制出去。好的复用会说明不变部分、可配置部分和必须重新判断的部分。\u003c/p>\n\u003cp>可以记录第二次采用的准备时间、改动、返工、效果与维护负担。文件被复制了多少次，不代表组织真正获得了相同能力。\u003c/p>\n\u003ch2>学习回路怎样运转\u003c/h2>\n\u003cp>实际任务产生结果，岗位记录问题，负责人判断原因，团队修改正确位置的资产，再用相关任务检验，最后观察真实采用。回路中每一步都有接收人，经验才会进入下一次工作。\u003c/p>\n\u003cp>只自动收集反馈，没人决定改什么，会堆积问题；每次都修改全部说明，会破坏已经有效的部分。更新应有范围、依据与回退办法。模型对话中的“我记住了”，也不能替代企业资料和系统的实际更新。\u003c/p>\n\u003cp>请从本次项目选一条经验，写明它的成立条件、反例、维护位置和下一次验证方式。等第二次采用后，再决定能否扩大为标准。最后一课将把这些判断组织成企业的阶段路线。\u003c/p>\n","exportMd":"# 第17课｜经验怎样成为下一次能用的能力\n\n完成一个项目以后，企业可能留下很多文件，却仍在下一次从头开始。能否积累，取决于经验是否进入实际工作，以及换条件后能否被正确使用。\n\n## 先识别值得保留的经验\n\n一次成功结果，可能来自特殊客户、骨干临时介入或偶然外部条件。复盘要分清哪部分可以重复，哪部分依赖当时环境。\n\n在询价试点中，可能发现“先识别工况缺项再进入技术队列”有效。值得保留的包括：适用的请求类型、必要条件、资料依据、可接受结果、例外和验证记录。只保存最后一段提示词，会丢失它为何有效的条件。\n\n失败也能成为资产。例如同型号不同版本被混淆，应进入身份与检索规则，也进入之后的测试集。下一次换模型或目录，团队就能检查这个错误是否再次出现。\n\n## 不同经验进入不同位置\n\n产品事实进入有维护责任的资料源；业务取舍进入规则和授权；处理方法进入工作说明或能力包；系统连接进入代码与配置；合格与错误样本进入评测；实际业务状态保留在相应业务系统。\n\n这些位置可以相互链接，但不宜复制成多份同等权威的正文。否则价格更新一次，需要逐个修改知识库、提示说明和模板，遗漏几乎不可避免。\n\n整理的价值因此在于减少下一次理解和维护的成本。每项资产需要有人维护，也需要知道哪些流程依赖它。\n\n## 共同业务对象连接知识与行动\n\n当多个应用共同使用客户、询价、产品、订单和交付，可以逐步形成一致的对象、关系和允许动作。例如一笔询价引用哪个产品版本，哪次批准形成哪个报价，哪次预留支持哪个承诺。\n\n有些平台把这类共同表示称为本体或语义层。企业需要的实质，是让不同岗位和系统对同一事物有稳定理解，并能据此行动。它可以先从一条业务链开始，无须先建设覆盖全公司的大模型。\n\n这种共同表示对AI尤其有用。模型可以帮助解释信息，但正式结果仍能关联到稳定对象和规则，便于查证、修改和恢复。企业由此逐步减少对某段对话或某个人记忆的依赖。\n\n## 复用应该通过第二次工作检验\n\n把询价方法迁移到专业服务排期，可以复用“候选、批准、资源与承诺分开”的原则；但库存预留需要改成技能、工时与项目排期，合格结果也要重定。\n\n如果一个方法包要求所有行业采用同样字段，可能只是把第一家企业的偶然做法复制出去。好的复用会说明不变部分、可配置部分和必须重新判断的部分。\n\n可以记录第二次采用的准备时间、改动、返工、效果与维护负担。文件被复制了多少次，不代表组织真正获得了相同能力。\n\n## 学习回路怎样运转\n\n实际任务产生结果，岗位记录问题，负责人判断原因，团队修改正确位置的资产，再用相关任务检验，最后观察真实采用。回路中每一步都有接收人，经验才会进入下一次工作。\n\n只自动收集反馈，没人决定改什么，会堆积问题；每次都修改全部说明，会破坏已经有效的部分。更新应有范围、依据与回退办法。模型对话中的“我记住了”，也不能替代企业资料和系统的实际更新。\n\n请从本次项目选一条经验，写明它的成立条件、反例、维护位置和下一次验证方式。等第二次采用后，再决定能否扩大为标准。最后一课将把这些判断组织成企业的阶段路线。\n","exportSingleMd":"# 第17课｜经验怎样成为下一次能用的能力\n\n完成一个项目以后，企业可能留下很多文件，却仍在下一次从头开始。能否积累，取决于经验是否进入实际工作，以及换条件后能否被正确使用。\n\n## 先识别值得保留的经验\n\n一次成功结果，可能来自特殊客户、骨干临时介入或偶然外部条件。复盘要分清哪部分可以重复，哪部分依赖当时环境。\n\n在询价试点中，可能发现“先识别工况缺项再进入技术队列”有效。值得保留的包括：适用的请求类型、必要条件、资料依据、可接受结果、例外和验证记录。只保存最后一段提示词，会丢失它为何有效的条件。\n\n失败也能成为资产。例如同型号不同版本被混淆，应进入身份与检索规则，也进入之后的测试集。下一次换模型或目录，团队就能检查这个错误是否再次出现。\n\n## 不同经验进入不同位置\n\n产品事实进入有维护责任的资料源；业务取舍进入规则和授权；处理方法进入工作说明或能力包；系统连接进入代码与配置；合格与错误样本进入评测；实际业务状态保留在相应业务系统。\n\n这些位置可以相互链接，但不宜复制成多份同等权威的正文。否则价格更新一次，需要逐个修改知识库、提示说明和模板，遗漏几乎不可避免。\n\n整理的价值因此在于减少下一次理解和维护的成本。每项资产需要有人维护，也需要知道哪些流程依赖它。\n\n## 共同业务对象连接知识与行动\n\n当多个应用共同使用客户、询价、产品、订单和交付，可以逐步形成一致的对象、关系和允许动作。例如一笔询价引用哪个产品版本，哪次批准形成哪个报价，哪次预留支持哪个承诺。\n\n有些平台把这类共同表示称为本体或语义层。企业需要的实质，是让不同岗位和系统对同一事物有稳定理解，并能据此行动。它可以先从一条业务链开始，无须先建设覆盖全公司的大模型。\n\n这种共同表示对AI尤其有用。模型可以帮助解释信息，但正式结果仍能关联到稳定对象和规则，便于查证、修改和恢复。企业由此逐步减少对某段对话或某个人记忆的依赖。\n\n## 复用应该通过第二次工作检验\n\n把询价方法迁移到专业服务排期，可以复用“候选、批准、资源与承诺分开”的原则；但库存预留需要改成技能、工时与项目排期，合格结果也要重定。\n\n如果一个方法包要求所有行业采用同样字段，可能只是把第一家企业的偶然做法复制出去。好的复用会说明不变部分、可配置部分和必须重新判断的部分。\n\n可以记录第二次采用的准备时间、改动、返工、效果与维护负担。文件被复制了多少次，不代表组织真正获得了相同能力。\n\n## 学习回路怎样运转\n\n实际任务产生结果，岗位记录问题，负责人判断原因，团队修改正确位置的资产，再用相关任务检验，最后观察真实采用。回路中每一步都有接收人，经验才会进入下一次工作。\n\n只自动收集反馈，没人决定改什么，会堆积问题；每次都修改全部说明，会破坏已经有效的部分。更新应有范围、依据与回退办法。模型对话中的“我记住了”，也不能替代企业资料和系统的实际更新。\n\n请从本次项目选一条经验，写明它的成立条件、反例、维护位置和下一次验证方式。等第二次采用后，再决定能否扩大为标准。最后一课将把这些判断组织成企业的阶段路线。\n","text":"# 第17课｜经验怎样成为下一次能用的能力\n\n完成一个项目以后，企业可能留下很多文件，却仍在下一次从头开始。能否积累，取决于经验是否进入实际工作，以及换条件后能否被正确使用。\n\n## 先识别值得保留的经验\n\n一次成功结果，可能来自特殊客户、骨干临时介入或偶然外部条件。复盘要分清哪部分可以重复，哪部分依赖当时环境。\n\n在询价试点中，可能发现“先识别工况缺项再进入技术队列”有效。值得保留的包括：适用的请求类型、必要条件、资料依据、可接受结果、例外和验证记录。只保存最后一段提示词，会丢失它为何有效的条件。\n\n失败也能成为资产。例如同型号不同版本被混淆，应进入身份与检索规则，也进入之后的测试集。下一次换模型或目录，团队就能检查这个错误是否再次出现。\n\n## 不同经验进入不同位置\n\n产品事实进入有维护责任的资料源；业务取舍进入规则和授权；处理方法进入工作说明或能力包；系统连接进入代码与配置；合格与错误样本进入评测；实际业务状态保留在相应业务系统。\n\n这些位置可以相互链接，但不宜复制成多份同等权威的正文。否则价格更新一次，需要逐个修改知识库、提示说明和模板，遗漏几乎不可避免。\n\n整理的价值因此在于减少下一次理解和维护的成本。每项资产需要有人维护，也需要知道哪些流程依赖它。\n\n## 共同业务对象连接知识与行动\n\n当多个应用共同使用客户、询价、产品、订单和交付，可以逐步形成一致的对象、关系和允许动作。例如一笔询价引用哪个产品版本，哪次批准形成哪个报价，哪次预留支持哪个承诺。\n\n有些平台把这类共同表示称为本体或语义层。企业需要的实质，是让不同岗位和系统对同一事物有稳定理解，并能据此行动。它可以先从一条业务链开始，无须先建设覆盖全公司的大模型。\n\n这种共同表示对AI尤其有用。模型可以帮助解释信息，但正式结果仍能关联到稳定对象和规则，便于查证、修改和恢复。企业由此逐步减少对某段对话或某个人记忆的依赖。\n\n## 复用应该通过第二次工作检验\n\n把询价方法迁移到专业服务排期，可以复用“候选、批准、资源与承诺分开”的原则；但库存预留需要改成技能、工时与项目排期，合格结果也要重定。\n\n如果一个方法包要求所有行业采用同样字段，可能只是把第一家企业的偶然做法复制出去。好的复用会说明不变部分、可配置部分和必须重新判断的部分。\n\n可以记录第二次采用的准备时间、改动、返工、效果与维护负担。文件被复制了多少次，不代表组织真正获得了相同能力。\n\n## 学习回路怎样运转\n\n实际任务产生结果，岗位记录问题，负责人判断原因，团队修改正确位置的资产，再用相关任务检验，最后观察真实采用。回路中每一步都有接收人，经验才会进入下一次工作。\n\n只自动收集反馈，没人决定改什么，会堆积问题；每次都修改全部说明，会破坏已经有效的部分。更新应有范围、依据与回退办法。模型对话中的“我记住了”，也不能替代企业资料和系统的实际更新。\n\n请从本次项目选一条经验，写明它的成立条件、反例、维护位置和下一次验证方式。等第二次采用后，再决定能否扩大为标准。最后一课将把这些判断组织成企业的阶段路线。\n"},{"file":"18-路线与改造提案.md","id":"lesson-18","number":18,"role":"核心课","part":4,"title":"第18课｜形成路线和一份可以讨论的改造提案","md":"# 第18课｜形成路线和一份可以讨论的改造提案\n\n企业AI转型通常由多次相互联系的改造构成。一条业务链先取得证据，形成可复用条件，再支持下一项工作；某些探索会停止，另一些才值得扩大。\n\n路线的作用，是让每次投入知道自己解决什么约束，并让管理团队有依据改变方向。\n\n## 把三个时间尺度放在一起\n\n近期要解决一个实际问题，拿到可以观察的改善。中期要让工作被采用、有人维护，并能交给其他人员。更长期要判断这些能力能否改变服务范围、客户关系和竞争位置。\n\n三个尺度可以同时思考，但证据成熟度不同。已经观察到的处理改善，应与未来服务扩张的假设分别记录。这样既能看见远期机会，也不会把机会提前写成业绩。\n\n## 四类阶段决定\n\n**值得试什么。** 说明经营问题、价值路径、当前资料与关键不确定性。没有足够证据时，先调查或做有界试验。\n\n**值得采用什么。** 说明任务范围、质量、完整成本、岗位反馈和运行条件。可采用的结论总有边界，未覆盖任务继续保留原路径。\n\n**值得扩大什么。** 检查新任务、新岗位或更多客户带来的变化。共享资产可以降低成本，但新增复杂度也要重新观察。\n\n**值得标准化什么。** 用第二次及之后的实际采用，判断哪些方法与组件足够稳定，明确维护和例外。成熟的标准仍可以随证据改变。\n\n它们是一组决策问题，具体时间由业务决定。把它们硬套进统一天数，可能让团队在材料不足时赶着宣布完成。\n\n## 一份完整提案应当能回答什么\n\n提案先说明企业希望改善哪种客户与经营结果，以及当前工作为什么不能很好地完成。再用现场材料指出主要原因与竞争解释，提出本轮准备改变的机制。\n\n随后写清新业务链：AI处理什么，程序和人分别承担什么，哪些事实和授权使承诺成立。系统方案由此展开，明确数据、连接、状态与异常。\n\n最后给出试点范围、评测、完整投入、收益兑现、采用和交接安排。下一阶段的选择取决于什么证据，也需要明确。\n\n[工作簿](工作簿-改造提案.md)把这些问题连接在一份可填写提案里。[案例A](案例A-非标询价到履约承诺.md)、[案例B](案例B-专业服务与收益兑现.md)和[案例C](案例C-门店异常闭环.md)分别提供业务重构、收益与组织迁移材料。\n\n## 如何组织一次提案讨论\n\n让一位了解业务但没有参与写作的人，用自己的话解释问题、改法和收益。若他必须靠作者现场补充关键前提，先修提案。\n\n再邀请实际岗位查看材料、核对新分工；让技术人员指出可实现条件；由负责人选择是否投入。讨论中至少改变一项重要条件，例如任务量减半、有效资料无法取得或关键岗位没有时间，观察方案如何变化。\n\n可以从七个方面判断：问题依据、机制解释、业务完整性、系统可行性、验证质量、经济口径、组织接手。每项都看具体材料与推导，不用术语密度打分，也不把界面精美当作实施证据。\n\n## FDE在路线中的位置\n\nFDE帮助企业把尚未完全清楚的问题变成可实现、可检验的工作，并把现场反馈带回系统和方法。企业提供价值取舍与工作条件，双方共同形成可使用的结果。\n\n随着内部能力积累，一部分工作可以逐渐由企业自行完成；外部团队转向更复杂探索或专业支持。合作范围应跟随实际缺口变化。企业持续保有资料、规则、评测和运行能力，就更有条件选择下一条路径。\n\n现在回看第1课选择的那项工作。请重新写出：技术改变了哪一段条件，它怎样经过业务链影响经营，FDE能帮助完成哪些工作，企业仍需作出什么决定。将这些答案连成提案，便有了下一次项目讨论的具体起点。\n","html":"\u003ch1>第18课｜形成路线和一份可以讨论的改造提案\u003c/h1>\n\u003cp>企业AI转型通常由多次相互联系的改造构成。一条业务链先取得证据，形成可复用条件，再支持下一项工作；某些探索会停止，另一些才值得扩大。\u003c/p>\n\u003cp>路线的作用，是让每次投入知道自己解决什么约束，并让管理团队有依据改变方向。\u003c/p>\n\u003ch2>把三个时间尺度放在一起\u003c/h2>\n\u003cp>近期要解决一个实际问题，拿到可以观察的改善。中期要让工作被采用、有人维护，并能交给其他人员。更长期要判断这些能力能否改变服务范围、客户关系和竞争位置。\u003c/p>\n\u003cp>三个尺度可以同时思考，但证据成熟度不同。已经观察到的处理改善，应与未来服务扩张的假设分别记录。这样既能看见远期机会，也不会把机会提前写成业绩。\u003c/p>\n\u003ch2>四类阶段决定\u003c/h2>\n\u003cp>\u003cstrong>值得试什么。\u003c/strong> 说明经营问题、价值路径、当前资料与关键不确定性。没有足够证据时，先调查或做有界试验。\u003c/p>\ 的变化。共享资产可以降低成本，但新增复杂度也要重新观察。\n\n**值得标准化什么。** 用第二次及之后的实际采用，判断哪些方法与组件足够稳定，明确维护和例外。成熟的标准仍可以随证据改变。\n\n它们是一组决策问题，具体时间由业务决定。把它们硬套进统一天数，可能让团队在材料不足时赶着宣布完成。\n\n## 一份完整提案应当能回答什么\n\n提案先说明企业希望改善哪种客户与经营结果，以及当前工作为什么不能很好地完成。再用现场材料指出主要原因与竞争解释，提出本轮准备改变的机制。\n\n随后写清新业务链：AI处理什么，程序和人分别承担什么，哪些事实和授权使承诺成立。系统方案由此展开，明确数据、连接、状态与异常。\n\n最后给出试点范围、评测、完整投入、收益兑现、采用和交接安排。下一阶段的选择取决于什么证据，也需要明确。\n\n[工作簿](#workbook)把这些问题连接在一份可填写提案里。[案例A](#case-a)、[案例B](#case-b)和[案例C](#case-c)分别提供业务重构、收益与组织迁移材料。\n\n## 如何组织一次提案讨论\n\n让一位了解业务但没有参与写作的人，用自己的话解释问题、改法和收益。若他必须靠作者现场补充关键前提，先修提案。\n\n再邀请实际岗位查看材料、核对新分工；让技术人员指出可实现条件；由负责人选择是否投入。讨论中至少改变一项重要条件，例如任务量减半、有效资料无法取得或关键岗位没有时间，观察方案如何变化。\n\n可以从七个方面判断：问题依据、机制解释、业务完整性、系统可行性、验证质量、经济口径、组织接手。每项都看具体材料与推导，不用术语密度打分，也不把界面精美当作实施证据。\n\n## FDE在路线中的位置\n\nFDE帮助企业把尚未完全清楚的问题变成可实现、可检验的工作，并把现场反馈带回系统和方法。企业提供价值取舍与工作条件，双方共同形成可使用的结果。\n\n随着内部能力积累，一部分工作可以逐渐由企业自行完成；外部团队转向更复杂探索或专业支持。合作范围应跟随实际缺口变化。企业持续保有资料、规则、评测和运行能力，就更有条件选择下一条路径。\n\n现在回看第1课选择的那项工作。请重新写出：技术改变了哪一段条件，它怎样经过业务链影响经营，FDE能帮助完成哪些工作，企业仍需作出什么决定。将这些答案连成提案，便有了下一次项目讨论的具体起点。\n","exportSingleMd":"# 第18课｜形成路线和一份可以讨论的改造提案\n\n企业AI转型通常由多次相互联系的改造构成。一条业务链先取得证据，形成可复用条件，再支持下一项工作；某些探索会停止，另一些才值得扩大。\n\n路线的作用，是让每次投入知道自己解决什么约束，并让管理团队有依据改变方向。\n\n## 把三个时间尺度放在一起\n\n近期要解决一个实际问题，拿到可以观察的改善。中期要让工作被采用、有人维护，并能交给其他人员。更长期要判断这些能力能否改变服务范围、客户关系和竞争位置。\n\n三个尺度可以同时思考，但证据成熟度不同。已经观察到的处理改善，应与未来服务扩张的假设分别记录。这样既能看见远期机会，也不会把机会提前写成业绩。\n\n## 四类阶段决定\n\n**值得试什么。** 说明经营问题、价值路径、当前资料与关键不确定性。没有足够证据时，先调查或做有界试验。\n\n**值得采用什么。** 说明任务范围、质量、完整成本、岗位反馈和运行条件。可采用的结论总有边界，未覆盖任务继续保留原路径。\n\n**值得扩大什么。** 检查新任务、新岗位或更多客户带来的变化。共享资产可以降低成本，但新增复杂度也要重新观察。\n\n**值得标准化什么。** 用第二次及之后的实际采用，判断哪些方法与组件足够稳定，明确维护和例外。成熟的标准仍可以随证据改变。\n\n它们是一组决策问题，具体时间由业务决定。把它们硬套进统一天数，可能让团队在材料不足时赶着宣布完成。\n\n## 一份完整提案应当能回答什么\n\n提案先说明企业希望改善哪种客户与经营结果，以及当前工作为什么不能很好地完成。再用现场材料指出主要原因与竞争解释，提出本轮准备改变的机制。\n\n随后写清新业务链：AI处理什么，程序和人分别承担什么，哪些事实和授权使承诺成立。系统方案由此展开，明确数据、连接、状态与异常。\n\n最后给出试点范围、评测、完整投入、收益兑现、采用和交接安排。下一阶段的选择取决于什么证据，也需要明确。\n\n[工作簿](https://zhongky1995.github.io/gaidn-fde-handbook/#workbook)把这些问题连接在一份可填写提案里。[案例A](https://zhongky1995.github.io/gaidn-fde-handbook/#case-a)、[案例B](https://zhongky1995.github.io/gaidn-fde-handbook/#case-b)和[案例C](https://zhongky1995.github.io/gaidn-fde-handbook/#case-c)分别提供业务重构、收益与组织迁移材料。\n\n## 如何组织一次提案讨论\n\n让一位了解业务但没有参与写作的人，用自己的话解释问题、改法和收益。若他必须靠作者现场补充关键前提，先修提案。\n\n再邀请实际岗位查看材料、核对新分工；让技术人员指出可实现条件；由负责人选择是否投入。讨论中至少改变一项重要条件，例如任务量减半、有效资料无法取得或关键岗位没有时间，观察方案如何变化。\n\n可以从七个方面判断：问题依据、机制解释、业务完整性、系统可行性、验证质量、经济口径、组织接手。每项都看具体材料与推导，不用术语密度打分，也不把界面精美当作实施证据。\n\n## FDE在路线中的位置\n\nFDE帮助企业把尚未完全清楚的问题变成可实现、可检验的工作，并把现场反馈带回系统和方法。企业提供价值取舍与工作条件，双方共同形成可使用的结果。\n\n随着内部能力积累，一部分工作可以逐渐由企业自行完成；外部团队转向更复杂探索或专业支持。合作范围应跟随实际缺口变化。企业持续保有资料、规则、评测和运行能力，就更有条件选择下一条路径。\n\n现在回看第1课选择的那项工作。请重新写出：技术改变了哪一段条件，它怎样经过业务链影响经营，FDE能帮助完成哪些工作，企业仍需作出什么决定。将这些答案连成提案，便有了下一次项目讨论的具体起点。\n","text":"# 第18课｜形成路线和一份可以讨论的改造提案\n\n企业AI转型通常由多次相互联系的改造构成。一条业务链先取得证据，形成可复用条件，再支持下一项工作；某些探索会停止，另一些才值得扩大。\n\n路线的作用，是让每次投入知道自己解决什么约束，并让管理团队有依据改变方向。\n\n## 把三个时间尺度放在一起\n\n近期要解决一个实际问题，拿到可以观察的改善。中期要让工作被采用、有人维护，并能交给其他人员。更长期要判断这些能力能否改变服务范围、客户关系和竞争位置。\n\n三个尺度可以同时思考，但证据成熟度不同。已经观察到的处理改善，应与未来服务扩张的假设分别记录。这样既能看见远期机会，也不会把机会提前写成业绩。\n\n## 四类阶段决定\n\n**值得试什么。** 说明经营问题、价值路径、当前资料与关键不确定性。没有足够证据时，先调查或做有界试验。\n\n**值得采用什么。** 说明任务范围、质量、完整成本、岗位反馈和运行条件。可采用的结论总有边界，未覆盖任务继续保留原路径。\n\n**值得扩大什么。** 检查新任务、新岗位或更多客户带来的变化。共享资产可以降低成本，但新增复杂度也要重新观察。\n\n**值得标准化什么。** 用第二次及之后的实际采用，判断哪些方法与组件足够稳定，明确维护和例外。成熟的标准仍可以随证据改变。\n\n它们是一组决策问题，具体时间由业务决定。把它们硬套进统一天数，可能让团队在材料不足时赶着宣布完成。\n\n## 一份完整提案应当能回答什么\n\n提案先说明企业希望改善哪种客户与经营结果，以及当前工作为什么不能很好地完成。再用现场材料指出主要原因与竞争解释，提出本轮准备改变的机制。\n\n随后写清新业务链：AI处理什么，程序和人分别承担什么，哪些事实和授权使承诺成立。系统方案由此展开，明确数据、连接、状态与异常。\n\n最后给出试点范围、评测、完整投入、收益兑现、采用和交接安排。下一阶段的选择取决于什么证据，也需要明确。\n\n工作簿把这些问题连接在一份可填写提案里。案例A、案例B和案例C分别提供业务重构、收益与组织迁移材料。\n\n## 如何组织一次提案讨论\n\n让一位了解业务但没有参与写作的人，用自己的话解释问题、改法和收益。若他必须靠作者现场补充关键前提，先修提案。\n\n再邀请实际岗位查看材料、核对新分工；让技术人员指出可实现条件；由负责人选择是否投入。讨论中至少改变一项重要条件，例如任务量减半、有效资料无法取得或关键岗位没有时间，观察方案如何变化。\n\n可以从七个方面判断：问题依据、机制解释、业务完整性、系统可行性、验证质量、经济口径、组织接手。每项都看具体材料与推导，不用术语密度打分，也不把界面精美当作实施证据。\n\n## FDE在路线中的位置\n\nFDE帮助企业把尚未完全清楚的问题变成可实现、可检验的工作，并把现场反馈带回系统和方法。企业提供价值取舍与工作条件，双方共同形成可使用的结果。\n\n随着内部能力积累，一部分工作可以逐渐由企业自行完成；外部团队转向更复杂探索或专业支持。合作范围应跟随实际缺口变化。企业持续保有资料、规则、评测和运行能力，就更有条件选择下一条路径。\n\n现在回看第1课选择的那项工作。请重新写出：技术改变了哪一段条件，它怎样经过业务链影响经营，FDE能帮助完成哪些工作，企业仍需作出什么决定。将这些答案连成提案，便有了下一次项目讨论的具体起点。\n"},{"file":"案例A-非标询价到履约承诺.md","id":"case-a","number":null,"role":"案例卷宗","part":-1,"title":"案例 A｜从非标询价到履约承诺","md":"# 案例 A｜从非标询价到履约承诺\n\n本卷宗供第2、6—14课共同使用。企业、产品、记录和数字均为教学设定，所有模型与系统输出也是供分析的示例，未实际调用AI或接入企业系统。产品参数只表达本案例规则，不用于现实选型。\n\n## 企业与当前问题\n\n一家工业服务企业销售标准件，并处理客户的替换与适配需求。销售收到信息，技术人员确认适用性，订单人员核价与查库存，授权人员批准对外承诺。\n\n管理者提出“报价太慢，希望自动报价”。团队尚未确认慢主要发生在哪里，也没有决定自动报价应覆盖哪些任务。\n\n为方便定位，先给出八笔教学记录。周期从收到询价到形成可供批准的完整报价计算；追问轮数是向客户追加询问的次数，技术主动处理是实际判断与返工的合计工时，等待与工时可以同时存在。\n\n| 记录 | 请求类型 | 报价准备周期/小时 | 客户追问轮数 | 技术主动处理/分钟 | 当前主要记录 |\n|---|---|---:|---:|---:|---|\n| A01 | 明确标准品 | 2 | 0 | 5 | 按有效目录即可判断 |\n| A02 | 明确标准品 | 3 | 0 | 6 | 排队等待核价 |\n| A03 | 替换适配 | 18 | 3 | 28 | 工况分散在多次消息中 |\n| A04 | 替换适配 | 16 | 2 | 25 | 同型号存在旧新版本 |\n| A05 | 替换适配 | 20 | 3 | 31 | 技术先收到不完整材料 |\n| A06 | 紧急小单 | 14 | 2 | 18 | 先承诺日期，再补库存依据 |\n| A07 | 明确标准品 | 2 | 0 | 5 | 一次通过 |\n| A08 | 替换适配 | 17 | 2 | 27 | 退回时未写清缺项 |\n\n这八笔用于练习辨别解释，不是有代表性的抽样调查。它们提示替换适配与信息往返值得深挖，尚不能证明整家公司报价慢都由缺项造成。\n\n## 一笔完整任务：INQ-041\n\n**客户最初原话：**“这次换6套，原来用M40，常态180℃，铭牌见附件。周五前要到，能不能先送4套？还是上次那个收货点。”当前时间设为教学周三上午。\n\n**系统里可以取得的材料：**\n\n| 材料 | 内容 | 在本任务中的作用 |\n|---|---|---|\n| 历史订单AO-301 | 同一客户，型号M40，数量4套，收货点甲厂仓库 | 提供历史线索；新要求仍需确认 |\n| 产品目录v3 | M40最高150℃；M40-H最高200℃；适配还依赖介质、压力与接口 | 筛选候选，不能只凭温度作最终选型 |\n| 适配摘录v3 | 本教学目录规定：M40-H适用于水、压力不高于2MPa、接口F2、温度不高于200℃；F3未在已给范围内 | 允许核对本例条件，F3需另取技术依据 |\n| 当前资料要求v2 | 替换适配必须提供温度、介质、压力、接口；型号由技术确认 | 判断哪些信息缺少 |\n| 库存回执S17 | 周三09:00，M40-H可用4套，尚未为本单预留 | 当前资源事实；会随其他订单改变 |\n| 补货记录P22 | 其余2套预计下周一到库，供应方未最终确认 | 预测，不能直接形成交期承诺 |\n| 价格规则v4 | M40-H每套1,150元；本单运费200元；无折扣授权 | 计算候选金额 |\n| 授权规则v2 | 技术确认适配、履约确认数量与日期后，由销售负责人批准报价 | 决定承诺怎样成立 |\n\n## 从输入到可用结果\n\n第一步，辅助整理给出以下**候选需求单**：数量6套；历史型号M40；温度180℃；M40-H可作为待确认候选；客户接受先发4套；客户希望周五前到货；介质、压力、接口与本次收货点待确认。\n\n这里不能直接写“客户订购M40-H六套、周五交齐”。客户没有提出这个新型号，也没有要求一定一次交齐；系统更没有提供全部履约依据。\n\n第二步，销售按缺项一次补问，客户回复：“介质水，2MPa，接口F2；仍是甲厂仓库。先4套可以，余下2套给我一个待确认时间。”这些信息进入同一询价记录，原话保留。技术人员对照适配摘录v3，逐项核对水、2MPa、F2与180℃均在本例允许范围内，批准使用M40-H，确认记录关联到这些输入和v3。F3不在所给范围内，不能从本次确认直接推出适用。\n\n第三步，履约人员重新查库存，确认4套可用，并在系统支持下为本询价预留。物流人员确认今日发出且线路可在周五到达，之后才允许对这4套填写承诺日期。其余2套保持待供应确认。若预留或物流确认未成功，就维持待确认状态。\n\n第四步，程序按有效规则计算：6×1,150＋200＝7,100元。金额是全单候选总额，交付拆为4套和2套，不重复收取本案例设定的一笔运费。销售负责人看到技术依据、预留回执、物流确认及待确认项后，批准采用对应版本。\n\n最终对外结果应明确：型号M40-H，共6套，总额7,100元；首批4套按已确认安排到货，其余2套交期另行确认。发给客户的实际文本还应符合企业自己的商业规则。本案例只研究承诺依据与工作分工。\n\n## 哪些条件一变，原结果就失效\n\n若在首次预留和批准之前，新库存回执S18显示仅剩2套，团队先将原候选报价标为“待履约复核”，阻止按首批4套发布。履约人员查这2套能否预留及物流条件，销售确认客户是否接受调整，不能直接将承诺数量自动改为2套。\n\n为继续推演，另给一组教学续接材料：预留R19成功占用2套；物流确认这2套周五到；客户新回复接受先2套、余下4套日期再确认，总采购仍为6套；本例单价和全单运费均不变。销售负责人看到这些新依据后批准报价v2：仍为6套、7,100元，首批2套按已确认安排，余下4套交期待确认。原首批4套版本停止采用，原金额只是相同价格与费用条件下得以保留；若总量或运费也变化，就需重新计算。缺少任何一项续接依据时，停在相应待确认状态。\n\n如果技术确认仅适用于接口F2，而客户后来改为F3，已有确认不能直接复用。如果目录升级改变适配范围，旧报价是否仍有效，要按企业版本规则判断。\n\n这些变化说明，正确草稿、有效批准、执行回执和持续有效的承诺分别需要证据。系统应保留任务、材料和版本之间的关联，便于定位受影响结果。\n\n## 为试点选择范围\n\n可先试“替换适配请求进入技术队列前的整理”：AI提出条件与缺项，销售核对并补问，技术仍确认适配。观察缺项遗漏、往返、技术有效处理量和完整成本。\n\n若直接试“自动对外承诺”，范围会同时涉及选型、库存预留、物流、授权与外发，需要更充分的系统条件。这是另一项投资决定，不能只因整理效果好就自然升级。\n\n## 自己判断，再核对\n\n请指出：09:00的库存回执可以支持哪一个判断？能否直接支持11:00批准的到货承诺？应补什么材料？\n\n\u003cdetails>\u003csummary>展开参考判断\u003c/summary>\n\n09:00回执支持“当时有4套可用”的判断。若批准前仍可能被其他订单占用，就需要有效预留或按流程重新检查并同步完成占用；到货日期还需要物流与发运条件。补更多模型推理不会产生这些外部事实。\n\n\u003c/details>\n\n再把业务换成专业服务：库存相当于可安排的专业工时，但人员能力与排期也要确认。能迁移的是“当前资源与承诺分开处理”，具体的预留和确认机制需要重新设计。\n","html":"\u003ch1>案例 A｜从非标询价到履约承诺\u003c/h1>\n\u003cp>本卷宗供第2、6—14课共同使用。企业、产品、记录和数字均为教学设定，所有模型与系统输出也是供分析的示例，未实际调用AI或接入企业系统。产品参数只表达本案例规则，不用于现实选型。\u003c/p>\n\u003ch2>企业与当前问题\u003c/h2>\n\u003cp>一家工业服务企业销售标准件，并处理客户的替换与适配需求。销售收到信息，技术人员确认适用性，订单人员核价与查库存，授权人员批准对外承诺。\u003c/p>\n\u003cp>管理者提出“报价太慢，希望自动报价”。团队尚未确认慢主要发生在哪里，也没有决定自动报价应覆盖哪些任务。\u003c/p>\n\u003cp>为方便定位，先给出八笔教学记录。周期从收到询价到形成可供批准的完整报价计算；追问轮数是向客户追加询问的次数，技术主动处理是实际判断与返工的合计工时，等待与工时可以同时存在。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>记录\u003c/th>\n\u003cth>请求类型\u003c/th>\n\u003cth align=\"right\">报价准备周期/小时\u003c/th>\n\u003cth align=\"right\">客户追问轮数\u003c/th>\n\u003cth align=\"right\">技术主动处理/分钟\u003c/th>\n\u003cth>当前主要记录\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A01\u003c/td>\n\u003ctd>明确标准品\u003c/td>\n\u003ctd align=\"right\">2\u003c/td>\n\u003ctd align=\"right\">0\u003c/td>\n\u003ctd align=\"right\">5\u003c/td>\n\u003ctd>按有效目录即可判断\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A02\u003c/td>\n\u003ctd>明确标准品\u003c/td>\n\u003ctd align=\"right\">3\u003c/td>\n\u003ctd align=\"right\">0\u003c/td>\n\u003ctd align=\"right\">6\u003c/td>\n\u003ctd>排队等待核价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A03\u003c/td>\n\u003ctd>替换适配\u003c/td>\n\u003ctd align=\"right\">18\u003c/td>\n\u003ctd align=\"right\">3\u003c/td>\n\u003ctd align=\"right\">28\u003c/td>\n\u003ctd>工况分散在多次消息中\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A04\u003c/td>\n\u003ctd>替换适配\u003c/td>\n\u003ctd align=\"right\">16\u003c/td>\n\u003ctd align=\"right\">2\u003c/td>\n\u003ctd align=\"right\">25\u003c/td>\n\u003ctd>同型号存在旧新版本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A05\u003c/td>\n\u003ctd>替换适配\u003c/td>\n\u003ctd align=\"right\">20\u003c/td>\n\u003ctd align=\"right\">3\u003c/td>\n\u003ctd align=\"right\">31\u003c/td>\n\u003ctd>技术先收到不完整材料\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A06\u003c/td>\n\u003ctd>紧急小单\u003c/td>\n\u003ctd align=\"right\">14\u003c/td>\n\u003ctd align=\"right\">2\u003c/td>\n\u003ctd align=\"right\">18\u003c/td>\n\u003ctd>先承诺日期，再补库存依据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A07\u003c/td>\n\u003ctd>明确标准品\u003c/td>\n\u003ctd align=\"right\">2\u003c/td>\n\u003ctd align=\"right\">0\u003c/td>\n\u003ctd align=\"right\">5\u003c/td>\n\u003ctd>一次通过\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A08\u003c/td>\n\u003ctd>替换适配\u003c/td>\n\u003ctd align=\"right\">17\u003c/td>\n\u003ctd align=\"right\">2\u003c/td>\n\u003ctd align=\"right\">27\u003c/td>\n\u003ctd>退回时未写清缺项\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>这八笔用于练习辨别解释，不是有代表性的抽样调查。它们提示替换适配与信息往返值得深挖，尚不能证明整家公司报价慢都由缺项造成。\u003c/p>\n\u003ch2>一笔完整任务：INQ-041\u003c/h2>\n\u003cp>\u003cstrong>客户最初原话：\u003c/strong>“这次换6套，原来用M40，常态180℃，铭牌见附件。周五前要到，能不能先送4套？还是上次那个收货点。”当前时间设为教学周三上午。\u003c/p>\n\u003cp>\u003cstrong>系统里可以取得的材料：\u003c/strong>\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>材料\u003c/th>\n\u003cth>内容\u003c/th>\n\u003cth>在本任务中的作用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>历史订单AO-301\u003c/td>\n\u003ctd>同一客户，型号M40，数量4套，收货点甲厂仓库\u003c/td>\n\u003ctd>提供历史线索；新要求仍需确认\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>产品目录v3\u003c/td>\n\u003ctd>M40最高150℃；M40-H最高200℃；适配还依赖介质、压力与接口\u003c/td>\n\u003ctd>筛选候选，不能只凭温度作最终选型\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>适配摘录v3\u003c/td>\n\u003ctd>本教学目录规定：M40-H适用于水、压力不高于2MPa、接口F2、温度不高于200℃；F3未在已给范围内\u003c/td>\n\u003ctd>允许核对本例条件，F3需另取技术依据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>当前资料要求v2\u003c/td>\n\u003ctd>替换适配必须提供温度、介质、压力、接口；型号由技术确认\u003c/td>\n\u003ctd>判断哪些信息缺少\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>库存回执S17\u003c/td>\n\u003ctd>周三09:00，M40-H可用4套，尚未为本单预留\u003c/td>\n\u003ctd>当前资源事实；会随其他订单改变\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>补货记录P22\u003c/td>\n\u003ctd>其余2套预计下周一到库，供应方未最终确认\u003c/td>\n\u003ctd>预测，不能直接形成交期承诺\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>价格规则v4\u003c/td>\n\u003ctd>M40-H每套1,150元；本单运费200元；无折扣授权\u003c/td>\n\u003ctd>计算候选金额\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>授权规则v2\u003c/td>\n\u003ctd>技术确认适配、履约确认数量与日期后，由销售负责人批准报价\u003c/td>\n\u003ctd>决定承诺怎样成立\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>从输入到可用结果\u003c/h2>\n\u003cp>第一步，辅助整理给出以下\u003cstrong>候选需求单\u003c/strong>：数量6套；历史型号M40；温度180℃；M40-H可作为待确认候选；客户接受先发4套；客户希望周五前到货；介质、压力、接口与本次收货点待确认。\u003c/p>\n\u003cp>这里不能直接写“客户订购M40-H六套、周五交齐”。客户没有提出这个新型号，也没有要求一定一次交齐；系统更没有提供全部履约依据。\u003c/p>\n\u003cp>第二步，销售按缺项一次补问，客户回复：“介质水，2MPa，接口F2；仍是甲厂仓库。先4套可以，余下2套给我一个待确认时间。”这些信息进入同一询价记录，原话保留。技术人员对照适配摘录v3，逐项核对水、2MPa、F2与180℃均在本例允许范围内，批准使用M40-H，确认记录关联到这些输入和v3。F3不在所给范围内，不能从本次确认直接推出适用。\u003c/p>\n\u003cp>第三步，履约人员重新查库存，确认4套可用，并在系统支持下为本询价预留。物流人员确认今日发出且线路可在周五到达，之后才允许对这4套填写承诺日期。其余2套保持待供应确认。若预留或物流确认未成功，就维持待确认状态。\u003c/p>\n\u003cp>第四步，程序按有效规则计算：6×1,150＋200＝7,100元。金额是全单候选总额，交付拆为4套和2套，不重复收取本案例设定的一笔运费。销售负责人看到技术依据、预留回执、物流确认及待确认项后，批准采用对应版本。\u003c/p>\n\u003cp>最终对外结果应明确：型号M40-H，共6套，总额7,100元；首批4套按已确认安排到货，其余2套交期另行确认。发给客户的实际文本还应符合企业自己的商业规则。本案例只研究承诺依据与工作分工。\u003c/p>\n\u003ch2>哪些条件一变，原结果就失效\u003c/h2>\n\u003cp>若在首次预留和批准之前，新库存回执S18显示仅剩2套，团队先将原候选报价标为“待履约复核”，阻止按首批4套发布。履约人员查这2套能否预留及物流条件，销售确认客户是否接受调整，不能直接将承诺数量自动改为2套。\u003c/p>\n\u003cp>为继续推演，另给一组教学续接材料：预留R19成功占用2套；物流确认这2套周五到；客户新回复接受先2套、余下4套日期再确认，总采购仍为6套；本例单价和全单运费均不变。销售负责人看到这些新依据后批准报价v2：仍为6套、7,100元，首批2套按已确认安排，余下4套交期待确认。原首批4套版本停止采用，原金额只是相同价格与费用条件下得以保留；若总量或运费也变化，就需重新计算。缺少任何一项续接依据时，停在相应待确认状态。\u003c/p>\n\u003cp>如果技术确认仅适用于接口F2，而客户后来改为F3，已有确认不能直接复用。如果目录升级改变适配范围，旧报价是否仍有效，要按企业版本规则判断。\u003c/p>\n\u003cp>这些变化说明，正确草稿、有效批准、执行回执和持续有效的承诺分别需要证据。系统应保留任务、材料和版本之间的关联，便于定位受影响结果。\u003c/p>\n\u003ch2>为试点选择范围\u003c/h2>\n\u003cp>可先试“替换适配请求进入技术队列前的整理”：AI提出条件与缺项，销售核对并补问，技术仍确认适配。观察缺项遗漏、往返、技术有效处理量和完整成本。\u003c/p>\n\u003cp>若直接试“自动对外承诺”，范围会同时涉及选型、库存预留、物流、授权与外发，需要更充分的系统条件。这是另一项投资决定，不能只因整理效果好就自然升级。\u003c/p>\n\u003ch2>自己判断，再核对\u003c/h2>\n\u003cp>请指出：09:00的库存回执可以支持哪一个判断？能否直接支持11:00批准的到货承诺？应补什么材料？\u003c/p>\n\u003cdetails>\u003csummary>展开参考判断\u003c/summary>\n\n\u003cp>09:00回执支持“当时有4套可用”的判断。若批准前仍可能被其他订单占用，就需要有效预留或按流程重新检查并同步完成占用；到货日期还需要物流与发运条件。补更多模型推理不会产生这些外部事实。\u003c/p>\n\u003c/details>\n\n\u003cp>再把业务换成专业服务：库存相当于可安排的专业工时，但人员能力与排期也要确认。能迁移的是“当前资源与承诺分开处理”，具体的预留和确认机制需要重新设计。\u003c/p>\n","exportMd":"# 案例 A｜从非标询价到履约承诺\n\n本卷宗供第2、6—14课共同使用。企业、产品、记录和数字均为教学设定，所有模型与系统输出也是供分析的示例，未实际调用AI或接入企业系统。产品参数只表达本案例规则，不用于现实选型。\n\n## 企业与当前问题\n\n一家工业服务企业销售标准件，并处理客户的替换与适配需求。销售收到信息，技术人员确认适用性，订单人员核价与查库存，授权人员批准对外承诺。\n\n管理者提出“报价太慢，希望自动报价”。团队尚未确认慢主要发生在哪里，也没有决定自动报价应覆盖哪些任务。\n\n为方便定位，先给出八笔教学记录。周期从收到询价到形成可供批准的完整报价计算；追问轮数是向客户追加询问的次数，技术主动处理是实际判断与返工的合计工时，等待与工时可以同时存在。\n\n| 记录 | 请求类型 | 报价准备周期/小时 | 客户追问轮数 | 技术主动处理/分钟 | 当前主要记录 |\n|---|---|---:|---:|---:|---|\n| A01 | 明确标准品 | 2 | 0 | 5 | 按有效目录即可判断 |\n| A02 | 明确标准品 | 3 | 0 | 6 | 排队等待核价 |\n| A03 | 替换适配 | 18 | 3 | 28 | 工况分散在多次消息中 |\n| A04 | 替换适配 | 16 | 2 | 25 | 同型号存在旧新版本 |\n| A05 | 替换适配 | 20 | 3 | 31 | 技术先收到不完整材料 |\n| A06 | 紧急小单 | 14 | 2 | 18 | 先承诺日期，再补库存依据 |\n| A07 | 明确标准品 | 2 | 0 | 5 | 一次通过 |\n| A08 | 替换适配 | 17 | 2 | 27 | 退回时未写清缺项 |\n\n这八笔用于练习辨别解释，不是有代表性的抽样调查。它们提示替换适配与信息往返值得深挖，尚不能证明整家公司报价慢都由缺项造成。\n\n## 一笔完整任务：INQ-041\n\n**客户最初原话：**“这次换6套，原来用M40，常态180℃，铭牌见附件。周五前要到，能不能先送4套？还是上次那个收货点。”当前时间设为教学周三上午。\n\n**系统里可以取得的材料：**\n\n| 材料 | 内容 | 在本任务中的作用 |\n|---|---|---|\n| 历史订单AO-301 | 同一客户，型号M40，数量4套，收货点甲厂仓库 | 提供历史线索；新要求仍需确认 |\n| 产品目录v3 | M40最高150℃；M40-H最高200℃；适配还依赖介质、压力与接口 | 筛选候选，不能只凭温度作最终选型 |\n| 适配摘录v3 | 本教学目录规定：M40-H适用于水、压力不高于2MPa、接口F2、温度不高于200℃；F3未在已给范围内 | 允许核对本例条件，F3需另取技术依据 |\n| 当前资料要求v2 | 替换适配必须提供温度、介质、压力、接口；型号由技术确认 | 判断哪些信息缺少 |\n| 库存回执S17 | 周三09:00，M40-H可用4套，尚未为本单预留 | 当前资源事实；会随其他订单改变 |\n| 补货记录P22 | 其余2套预计下周一到库，供应方未最终确认 | 预测，不能直接形成交期承诺 |\n| 价格规则v4 | M40-H每套1,150元；本单运费200元；无折扣授权 | 计算候选金额 |\n| 授权规则v2 | 技术确认适配、履约确认数量与日期后，由销售负责人批准报价 | 决定承诺怎样成立 |\n\n## 从输入到可用结果\n\n第一步，辅助整理给出以下**候选需求单**：数量6套；历史型号M40；温度180℃；M40-H可作为待确认候选；客户接受先发4套；客户希望周五前到货；介质、压力、接口与本次收货点待确认。\n\n这里不能直接写“客户订购M40-H六套、周五交齐”。客户没有提出这个新型号，也没有要求一定一次交齐；系统更没有提供全部履约依据。\n\n第二步，销售按缺项一次补问，客户回复：“介质水，2MPa，接口F2；仍是甲厂仓库。先4套可以，余下2套给我一个待确认时间。”这些信息进入同一询价记录，原话保留。技术人员对照适配摘录v3，逐项核对水、2MPa、F2与180℃均在本例允许范围内，批准使用M40-H，确认记录关联到这些输入和v3。F3不在所给范围内，不能从本次确认直接推出适用。\n\n第三步，履约人员重新查库存，确认4套可用，并在系统支持下为本询价预留。物流人员确认今日发出且线路可在周五到达，之后才允许对这4套填写承诺日期。其余2套保持待供应确认。若预留或物流确认未成功，就维持待确认状态。\n\n第四步，程序按有效规则计算：6×1,150＋200＝7,100元。金额是全单候选总额，交付拆为4套和2套，不重复收取本案例设定的一笔运费。销售负责人看到技术依据、预留回执、物流确认及待确认项后，批准采用对应版本。\n\n最终对外结果应明确：型号M40-H，共6套，总额7,100元；首批4套按已确认安排到货，其余2套交期另行确认。发给客户的实际文本还应符合企业自己的商业规则。本案例只研究承诺依据与工作分工。\n\n## 哪些条件一变，原结果就失效\n\n若在首次预留和批准之前，新库存回执S18显示仅剩2套，团队先将原候选报价标为“待履约复核”，阻止按首批4套发布。履约人员查这2套能否预留及物流条件，销售确认客户是否接受调整，不能直接将承诺数量自动改为2套。\n\n为继续推演，另给一组教学续接材料：预留R19成功占用2套；物流确认这2套周五到；客户新回复接受先2套、余下4套日期再确认，总采购仍为6套；本例单价和全单运费均不变。销售负责人看到这些新依据后批准报价v2：仍为6套、7,100元，首批2套按已确认安排，余下4套交期待确认。原首批4套版本停止采用，原金额只是相同价格与费用条件下得以保留；若总量或运费也变化，就需重新计算。缺少任何一项续接依据时，停在相应待确认状态。\n\n如果技术确认仅适用于接口F2，而客户后来改为F3，已有确认不能直接复用。如果目录升级改变适配范围，旧报价是否仍有效，要按企业版本规则判断。\n\n这些变化说明，正确草稿、有效批准、执行回执和持续有效的承诺分别需要证据。系统应保留任务、材料和版本之间的关联，便于定位受影响结果。\n\n## 为试点选择范围\n\n可先试“替换适配请求进入技术队列前的整理”：AI提出条件与缺项，销售核对并补问，技术仍确认适配。观察缺项遗漏、往返、技术有效处理量和完整成本。\n\n若直接试“自动对外承诺”，范围会同时涉及选型、库存预留、物流、授权与外发，需要更充分的系统条件。这是另一项投资决定，不能只因整理效果好就自然升级。\n\n## 自己判断，再核对\n\n请指出：09:00的库存回执可以支持哪一个判断？能否直接支持11:00批准的到货承诺？应补什么材料？\n\n\u003cdetails>\u003csummary>展开参考判断\u003c/summary>\n\n09:00回执支持“当时有4套可用”的判断。若批准前仍可能被其他订单占用，就需要有效预留或按流程重新检查并同步完成占用；到货日期还需要物流与发运条件。补更多模型推理不会产生这些外部事实。\n\n\u003c/details>\n\n再把业务换成专业服务：库存相当于可安排的专业工时，但人员能力与排期也要确认。能迁移的是“当前资源与承诺分开处理”，具体的预留和确认机制需要重新设计。\n","exportSingleMd":"# 案例 A｜从非标询价到履约承诺\n\n本卷宗供第2、6—14课共同使用。企业、产品、记录和数字均为教学设定，所有模型与系统输出也是供分析的示例，未实际调用AI或接入企业系统。产品参数只表达本案例规则，不用于现实选型。\n\n## 企业与当前问题\n\n一家工业服务企业销售标准件，并处理客户的替换与适配需求。销售收到信息，技术人员确认适用性，订单人员核价与查库存，授权人员批准对外承诺。\n\n管理者提出“报价太慢，希望自动报价”。团队尚未确认慢主要发生在哪里，也没有决定自动报价应覆盖哪些任务。\n\n为方便定位，先给出八笔教学记录。周期从收到询价到形成可供批准的完整报价计算；追问轮数是向客户追加询问的次数，技术主动处理是实际判断与返工的合计工时，等待与工时可以同时存在。\n\n| 记录 | 请求类型 | 报价准备周期/小时 | 客户追问轮数 | 技术主动处理/分钟 | 当前主要记录 |\n|---|---|---:|---:|---:|---|\n| A01 | 明确标准品 | 2 | 0 | 5 | 按有效目录即可判断 |\n| A02 | 明确标准品 | 3 | 0 | 6 | 排队等待核价 |\n| A03 | 替换适配 | 18 | 3 | 28 | 工况分散在多次消息中 |\n| A04 | 替换适配 | 16 | 2 | 25 | 同型号存在旧新版本 |\n| A05 | 替换适配 | 20 | 3 | 31 | 技术先收到不完整材料 |\n| A06 | 紧急小单 | 14 | 2 | 18 | 先承诺日期，再补库存依据 |\n| A07 | 明确标准品 | 2 | 0 | 5 | 一次通过 |\n| A08 | 替换适配 | 17 | 2 | 27 | 退回时未写清缺项 |\n\n这八笔用于练习辨别解释，不是有代表性的抽样调查。它们提示替换适配与信息往返值得深挖，尚不能证明整家公司报价慢都由缺项造成。\n\n## 一笔完整任务：INQ-041\n\n**客户最初原话：**“这次换6套，原来用M40，常态180℃，铭牌见附件。周五前要到，能不能先送4套？还是上次那个收货点。”当前时间设为教学周三上午。\n\n**系统里可以取得的材料：**\n\n| 材料 | 内容 | 在本任务中的作用 |\n|---|---|---|\n| 历史订单AO-301 | 同一客户，型号M40，数量4套，收货点甲厂仓库 | 提供历史线索；新要求仍需确认 |\n| 产品目录v3 | M40最高150℃；M40-H最高200℃；适配还依赖介质、压力与接口 | 筛选候选，不能只凭温度作最终选型 |\n| 适配摘录v3 | 本教学目录规定：M40-H适用于水、压力不高于2MPa、接口F2、温度不高于200℃；F3未在已给范围内 | 允许核对本例条件，F3需另取技术依据 |\n| 当前资料要求v2 | 替换适配必须提供温度、介质、压力、接口；型号由技术确认 | 判断哪些信息缺少 |\n| 库存回执S17 | 周三09:00，M40-H可用4套，尚未为本单预留 | 当前资源事实；会随其他订单改变 |\n| 补货记录P22 | 其余2套预计下周一到库，供应方未最终确认 | 预测，不能直接形成交期承诺 |\n| 价格规则v4 | M40-H每套1,150元；本单运费200元；无折扣授权 | 计算候选金额 |\n| 授权规则v2 | 技术确认适配、履约确认数量与日期后，由销售负责人批准报价 | 决定承诺怎样成立 |\n\n## 从输入到可用结果\n\n第一步，辅助整理给出以下**候选需求单**：数量6套；历史型号M40；温度180℃；M40-H可作为待确认候选；客户接受先发4套；客户希望周五前到货；介质、压力、接口与本次收货点待确认。\n\n这里不能直接写“客户订购M40-H六套、周五交齐”。客户没有提出这个新型号，也没有要求一定一次交齐；系统更没有提供全部履约依据。\n\n第二步，销售按缺项一次补问，客户回复：“介质水，2MPa，接口F2；仍是甲厂仓库。先4套可以，余下2套给我一个待确认时间。”这些信息进入同一询价记录，原话保留。技术人员对照适配摘录v3，逐项核对水、2MPa、F2与180℃均在本例允许范围内，批准使用M40-H，确认记录关联到这些输入和v3。F3不在所给范围内，不能从本次确认直接推出适用。\n\n第三步，履约人员重新查库存，确认4套可用，并在系统支持下为本询价预留。物流人员确认今日发出且线路可在周五到达，之后才允许对这4套填写承诺日期。其余2套保持待供应确认。若预留或物流确认未成功，就维持待确认状态。\n\n第四步，程序按有效规则计算：6×1,150＋200＝7,100元。金额是全单候选总额，交付拆为4套和2套，不重复收取本案例设定的一笔运费。销售负责人看到技术依据、预留回执、物流确认及待确认项后，批准采用对应版本。\n\n最终对外结果应明确：型号M40-H，共6套，总额7,100元；首批4套按已确认安排到货，其余2套交期另行确认。发给客户的实际文本还应符合企业自己的商业规则。本案例只研究承诺依据与工作分工。\n\n## 哪些条件一变，原结果就失效\n\n若在首次预留和批准之前，新库存回执S18显示仅剩2套，团队先将原候选报价标为“待履约复核”，阻止按首批4套发布。履约人员查这2套能否预留及物流条件，销售确认客户是否接受调整，不能直接将承诺数量自动改为2套。\n\n为继续推演，另给一组教学续接材料：预留R19成功占用2套；物流确认这2套周五到；客户新回复接受先2套、余下4套日期再确认，总采购仍为6套；本例单价和全单运费均不变。销售负责人看到这些新依据后批准报价v2：仍为6套、7,100元，首批2套按已确认安排，余下4套交期待确认。原首批4套版本停止采用，原金额只是相同价格与费用条件下得以保留；若总量或运费也变化，就需重新计算。缺少任何一项续接依据时，停在相应待确认状态。\n\n如果技术确认仅适用于接口F2，而客户后来改为F3，已有确认不能直接复用。如果目录升级改变适配范围，旧报价是否仍有效，要按企业版本规则判断。\n\n这些变化说明，正确草稿、有效批准、执行回执和持续有效的承诺分别需要证据。系统应保留任务、材料和版本之间的关联，便于定位受影响结果。\n\n## 为试点选择范围\n\n可先试“替换适配请求进入技术队列前的整理”：AI提出条件与缺项，销售核对并补问，技术仍确认适配。观察缺项遗漏、往返、技术有效处理量和完整成本。\n\n若直接试“自动对外承诺”，范围会同时涉及选型、库存预留、物流、授权与外发，需要更充分的系统条件。这是另一项投资决定，不能只因整理效果好就自然升级。\n\n## 自己判断，再核对\n\n请指出：09:00的库存回执可以支持哪一个判断？能否直接支持11:00批准的到货承诺？应补什么材料？\n\n\u003cdetails>\u003csummary>展开参考判断\u003c/summary>\n\n09:00回执支持“当时有4套可用”的判断。若批准前仍可能被其他订单占用，就需要有效预留或按流程重新检查并同步完成占用；到货日期还需要物流与发运条件。补更多模型推理不会产生这些外部事实。\n\n\u003c/details>\n\n再把业务换成专业服务：库存相当于可安排的专业工时，但人员能力与排期也要确认。能迁移的是“当前资源与承诺分开处理”，具体的预留和确认机制需要重新设计。\n","text":"# 案例 A｜从非标询价到履约承诺\n\n本卷宗供第2、6—14课共同使用。企业、产品、记录和数字均为教学设定，所有模型与系统输出也是供分析的示例，未实际调用AI或接入企业系统。产品参数只表达本案例规则，不用于现实选型。\n\n## 企业与当前问题\n\n一家工业服务企业销售标准件，并处理客户的替换与适配需求。销售收到信息，技术人员确认适用性，订单人员核价与查库存，授权人员批准对外承诺。\n\n管理者提出“报价太慢，希望自动报价”。团队尚未确认慢主要发生在哪里，也没有决定自动报价应覆盖哪些任务。\n\n为方便定位，先给出八笔教学记录。周期从收到询价到形成可供批准的完整报价计算；追问轮数是向客户追加询问的次数，技术主动处理是实际判断与返工的合计工时，等待与工时可以同时存在。\n\n| 记录 | 请求类型 | 报价准备周期/小时 | 客户追问轮数 | 技术主动处理/分钟 | 当前主要记录 |\n|---|---|---:|---:|---:|---|\n| A01 | 明确标准品 | 2 | 0 | 5 | 按有效目录即可判断 |\n| A02 | 明确标准品 | 3 | 0 | 6 | 排队等待核价 |\n| A03 | 替换适配 | 18 | 3 | 28 | 工况分散在多次消息中 |\n| A04 | 替换适配 | 16 | 2 | 25 | 同型号存在旧新版本 |\n| A05 | 替换适配 | 20 | 3 | 31 | 技术先收到不完整材料 |\n| A06 | 紧急小单 | 14 | 2 | 18 | 先承诺日期，再补库存依据 |\n| A07 | 明确标准品 | 2 | 0 | 5 | 一次通过 |\n| A08 | 替换适配 | 17 | 2 | 27 | 退回时未写清缺项 |\n\n这八笔用于练习辨别解释，不是有代表性的抽样调查。它们提示替换适配与信息往返值得深挖，尚不能证明整家公司报价慢都由缺项造成。\n\n## 一笔完整任务：INQ-041\n\n**客户最初原话：**“这次换6套，原来用M40，常态180℃，铭牌见附件。周五前要到，能不能先送4套？还是上次那个收货点。”当前时间设为教学周三上午。\n\n**系统里可以取得的材料：**\n\n| 材料 | 内容 | 在本任务中的作用 |\n|---|---|---|\n| 历史订单AO-301 | 同一客户，型号M40，数量4套，收货点甲厂仓库 | 提供历史线索；新要求仍需确认 |\n| 产品目录v3 | M40最高150℃；M40-H最高200℃；适配还依赖介质、压力与接口 | 筛选候选，不能只凭温度作最终选型 |\n| 适配摘录v3 | 本教学目录规定：M40-H适用于水、压力不高于2MPa、接口F2、温度不高于200℃；F3未在已给范围内 | 允许核对本例条件，F3需另取技术依据 |\n| 当前资料要求v2 | 替换适配必须提供温度、介质、压力、接口；型号由技术确认 | 判断哪些信息缺少 |\n| 库存回执S17 | 周三09:00，M40-H可用4套，尚未为本单预留 | 当前资源事实；会随其他订单改变 |\n| 补货记录P22 | 其余2套预计下周一到库，供应方未最终确认 | 预测，不能直接形成交期承诺 |\n| 价格规则v4 | M40-H每套1,150元；本单运费200元；无折扣授权 | 计算候选金额 |\n| 授权规则v2 | 技术确认适配、履约确认数量与日期后，由销售负责人批准报价 | 决定承诺怎样成立 |\n\n## 从输入到可用结果\n\n第一步，辅助整理给出以下**候选需求单**：数量6套；历史型号M40；温度180℃；M40-H可作为待确认候选；客户接受先发4套；客户希望周五前到货；介质、压力、接口与本次收货点待确认。\n\n这里不能直接写“客户订购M40-H六套、周五交齐”。客户没有提出这个新型号，也没有要求一定一次交齐；系统更没有提供全部履约依据。\n\n第二步，销售按缺项一次补问，客户回复：“介质水，2MPa，接口F2；仍是甲厂仓库。先4套可以，余下2套给我一个待确认时间。”这些信息进入同一询价记录，原话保留。技术人员对照适配摘录v3，逐项核对水、2MPa、F2与180℃均在本例允许范围内，批准使用M40-H，确认记录关联到这些输入和v3。F3不在所给范围内，不能从本次确认直接推出适用。\n\n第三步，履约人员重新查库存，确认4套可用，并在系统支持下为本询价预留。物流人员确认今日发出且线路可在周五到达，之后才允许对这4套填写承诺日期。其余2套保持待供应确认。若预留或物流确认未成功，就维持待确认状态。\n\n第四步，程序按有效规则计算：6×1,150＋200＝7,100元。金额是全单候选总额，交付拆为4套和2套，不重复收取本案例设定的一笔运费。销售负责人看到技术依据、预留回执、物流确认及待确认项后，批准采用对应版本。\n\n最终对外结果应明确：型号M40-H，共6套，总额7,100元；首批4套按已确认安排到货，其余2套交期另行确认。发给客户的实际文本还应符合企业自己的商业规则。本案例只研究承诺依据与工作分工。\n\n## 哪些条件一变，原结果就失效\n\n若在首次预留和批准之前，新库存回执S18显示仅剩2套，团队先将原候选报价标为“待履约复核”，阻止按首批4套发布。履约人员查这2套能否预留及物流条件，销售确认客户是否接受调整，不能直接将承诺数量自动改为2套。\n\n为继续推演，另给一组教学续接材料：预留R19成功占用2套；物流确认这2套周五到；客户新回复接受先2套、余下4套日期再确认，总采购仍为6套；本例单价和全单运费均不变。销售负责人看到这些新依据后批准报价v2：仍为6套、7,100元，首批2套按已确认安排，余下4套交期待确认。原首批4套版本停止采用，原金额只是相同价格与费用条件下得以保留；若总量或运费也变化，就需重新计算。缺少任何一项续接依据时，停在相应待确认状态。\n\n如果技术确认仅适用于接口F2，而客户后来改为F3，已有确认不能直接复用。如果目录升级改变适配范围，旧报价是否仍有效，要按企业版本规则判断。\n\n这些变化说明，正确草稿、有效批准、执行回执和持续有效的承诺分别需要证据。系统应保留任务、材料和版本之间的关联，便于定位受影响结果。\n\n## 为试点选择范围\n\n可先试“替换适配请求进入技术队列前的整理”：AI提出条件与缺项，销售核对并补问，技术仍确认适配。观察缺项遗漏、往返、技术有效处理量和完整成本。\n\n若直接试“自动对外承诺”，范围会同时涉及选型、库存预留、物流、授权与外发，需要更充分的系统条件。这是另一项投资决定，不能只因整理效果好就自然升级。\n\n## 自己判断，再核对\n\n请指出：09:00的库存回执可以支持哪一个判断？能否直接支持11:00批准的到货承诺？应补什么材料？\n\n  展开参考判断 \n\n09:00回执支持“当时有4套可用”的判断。若批准前仍可能被其他订单占用，就需要有效预留或按流程重新检查并同步完成占用；到货日期还需要物流与发运条件。补更多模型推理不会产生这些外部事实。\n\n \n\n再把业务换成专业服务：库存相当于可安排的专业工时，但人员能力与排期也要确认。能迁移的是“当前资源与承诺分开处理”，具体的预留和确认机制需要重新设计。\n"},{"file":"案例B-专业服务与收益兑现.md","id":"case-b","number":null,"role":"案例卷宗","part":-1,"title":"案例 B｜专业服务：释放工时之后发生什么","md":"# 案例 B｜专业服务：释放工时之后发生什么\n\n这是独立教学案例，数据为假设，未代表任何客户实际结果。它帮助迁移第3、4、13、17课的判断。\n\n## 任务和质量标准\n\n一家分析服务团队，每月为客户制作市场专题报告。每份必须包含问题范围、资料依据、比较方法、可支持的判断和未解决问题，由专业负责人复核后交付。\n\n原做法每份需要8小时，AI辅助后假设需要5小时。新方法仍包含资料核对、重要结论检查和专业签署；只生成初稿的时间不作为比较结果。质量标准、任务范围相同。\n\n## 三种不同后果\n\n**情形一：固定薪酬、没有新增订单。** 团队做20份报告，释放60小时，薪酬支出不变。若AI新增费用为3,000元，当月现金支出增加3,000元。企业得到可再安排的时间，但需要说明用在何处。\n\n**情形二：原有60小时外包可以完全取消。** 假设外包每小时150元，取消支出9,000元，扣同样3,000元新增费用，现金改善6,000元。这里的60小时来自同一项节省，不能再额外记9,000元“效率价值”。\n\n**情形三：释放内部时间支持更多订单。** 若新增订单已经确认、销售和复核有容量，60小时按每份5小时可支持12份。若其中只有4份实际成交，则最多按这4份的实际贡献收益判断，不按12份理论容量报收入。新增订单的交付、获客和AI费用另计。\n\n同样的任务提效，因为资源和需求条件不同，现金后果不同。企业需要在试点前明确希望验证哪一种路径。\n\n## 计价与服务设计\n\n第4课比较了按工时和按明确交付范围收费。若客户购买专业判断，团队应让其能检查证据、解释和适用边界；若客户只要资讯摘录，过度专业化可能增加无用成本。\n\n固定范围收费还需要管理例外。临时增加国家、产品和深度，会改变准备与复核工作。团队可以设计清楚的基本服务与追加范围，但必须用真实客户需求和成本验证。\n\n## 知识复用到哪一层\n\n可以保留研究问题拆分方法、可信来源选择、行业比较框架、历史错误样本和复核标准。客户的完整私有资料应依权限管理，不能因有助复用就全部进入共享库。\n\n下一份报告是否更快、返工是否更少、判断是否仍然专业，才是复用的观察。文件篇数和提示词长度不直接证明能力提高。\n\n## 条件变化练习\n\n假设新客户要求比旧任务多一倍的证据核验，实际人工时间变为9小时。你能否继续引用“8小时降到5小时”的效果？\n\n\u003cdetails>\u003csummary>展开参考判断\u003c/summary>\n\n不能。这次任务范围与完成标准已经变化。应先比较相同新标准下的人工与AI方法；旧结果仍可描述其原任务范围，不能扩展为全部报告。业务可能因更高价值而值得做，但要重新验证价格、成本与采用。\n\n\u003c/details>\n","html":"\u003ch1>案例 B｜专业服务：释放工时之后发生什么\u003c/h1>\n\u003cp>这是独立教学案例，数据为假设，未代表任何客户实际结果。它帮助迁移第3、4、13、17课的判断。\u003c/p>\n\u003ch2>任务和质量标准\u003c/h2>\n\u003cp>一家分析服务团队，每月为客户制作市场专题报告。每份必须包含问题范围、资料依据、比较方法、可支持的判断和未解决问题，由专业负责人复核后交付。\u003c/p>\n\u003cp>原做法每份需要8小时，AI辅助后假设需要5小时。新方法仍包含资料核对、重要结论检查和专业签署；只生成初稿的时间不作为比较结果。质量标准、任务范围相同。\u003c/p>\n\u003ch2>三种不同后果\u003c/h2>\n\u003cp>\u003cstrong>情形一：固定薪酬、没有新增订单。\u003c/strong> 团队做20份报告，释放60小时，薪酬支出不变。若AI新增费用为3,000元，当月现金支出增加3,000元。企业得到可再安排的时间，但需要说明用在何处。\u003c/p>\n\u003cp>\u003cstrong>情形二：原有60小时外包可以完全取消。\u003c/strong> 假设外包每小时150元，取消支出9,000元，扣同样3,000元新增费用，现金改善6,000元。这里的60小时来自同一项节省，不能再额外记9,000元“效率价值”。\u003c/p>\n\u003cp>\u003cstrong>情形三：释放内部时间支持更多订单。\u003c/strong> 若新增订单已经确认、销售和复核有容量，60小时按每份5小时可支持12份。若其中只有4份实际成交，则最多按这4份的实际贡献收益判断，不按12份理论容量报收入。新增订单的交付、获客和AI费用另计。\u003c/p>\n\u003cp>同样的任务提效，因为资源和需求条件不同，现金后果不同。企业需要在试点前明确希望验证哪一种路径。\u003c/p>\n\u003ch2>计价与服务设计\u003c/h2>\n\u003cp>第4课比较了按工时和按明确交付范围收费。若客户购买专业判断，团队应让其能检查证据、解释和适用边界；若客户只要资讯摘录，过度专业化可能增加无用成本。\u003c/p>\n\u003cp>固定范围收费还需要管理例外。临时增加国家、产品和深度，会改变准备与复核工作。团队可以设计清楚的基本服务与追加范围，但必须用真实客户需求和成本验证。\u003c/p>\n\u003ch2>知识复用到哪一层\u003c/h2>\n\u003cp>可以保留研究问题拆分方法、可信来源选择、行业比较框架、历史错误样本和复核标准。客户的完整私有资料应依权限管理，不能因有助复用就全部进入共享库。\u003c/p>\n\u003cp>下一份报告是否更快、返工是否更少、判断是否仍然专业，才是复用的观察。文件篇数和提示词长度不直接证明能力提高。\u003c/p>\n\u003ch2>条件变化练习\u003c/h2>\n\u003cp>假设新客户要求比旧任务多一倍的证据核验，实际人工时间变为9小时。你能否继续引用“8小时降到5小时”的效果？\u003c/p>\n\u003cdetails>\u003csummary>展开参考判断\u003c/summary>\n\n\u003cp>不能。这次任务范围与完成标准已经变化。应先比较相同新标准下的人工与AI方法；旧结果仍可描述其原任务范围，不能扩展为全部报告。业务可能因更高价值而值得做，但要重新验证价格、成本与采用。\u003c/p>\n\u003c/details>\n","exportMd":"# 案例 B｜专业服务：释放工时之后发生什么\n\n这是独立教学案例，数据为假设，未代表任何客户实际结果。它帮助迁移第3、4、13、17课的判断。\n\n## 任务和质量标准\n\n一家分析服务团队，每月为客户制作市场专题报告。每份必须包含问题范围、资料依据、比较方法、可支持的判断和未解决问题，由专业负责人复核后交付。\n\n原做法每份需要8小时，AI辅助后假设需要5小时。新方法仍包含资料核对、重要结论检查和专业签署；只生成初稿的时间不作为比较结果。质量标准、任务范围相同。\n\n## 三种不同后果\n\n**情形一：固定薪酬、没有新增订单。** 团队做20份报告，释放60小时，薪酬支出不变。若AI新增费用为3,000元，当
