1pbHk9IlBpbmdGYW5nIFNDLE1pY3Jvc29mdCBZYUhlaSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmaWxsPSIjODc1ZDIyIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXdlaWdodD0iNDAwIj7ov5jpnIDmo4Dpqow8L3RleHQ+PHRleHQgeD0iMjQiIHk9IjQwOSIgZm9udC1mYW1pbHk9IlBpbmdGYW5nIFNDLE1pY3Jvc29mdCBZYUhlaSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmaWxsPSIjMjEzNDJmIiB0ZXh0LWFuY2hvcj0ic3RhcnQiIGZvbnQtd2VpZ2h0PSI0MDAiPuWFseS6q+i+k+WFpe+8jOWIhuWIq+mqjOivgeS4pOexu+e7k+aenDwvdGV4dD48L3N2Zz4=\" alt=\"同一条工单生产链，一路形成当前服务交付，另一路保留原材料、修改和后续结果。两类产出共享输入，但经验仍需后续检验。\">\u003c/p>\n\u003ch2 id=\"lesson-07-section-2\">AI具体减少哪些劳动\u003c/h2>\n\u003cp>原来的总结者要先翻材料，再确认属于哪项任务，整理经过，补缺项，最后改写成别人能读懂的形式。这些工作中，有一部分适合由AI辅助：匹配任务、整理时间顺序、比较草稿与修改、提示尚无结果的工单。\u003c/p>\n\u003cp>人员仍要核对重要差别，但纠正一个已有草稿，可能比从空白重新组织便宜；从自然记录中提取关键条件，也可能比日后追问当事人更可靠。这里的“可能”需要通过实际工作负担比较，不由工具演示决定。\u003c/p>\n\u003cp>AI并未因此自动得到技术员的全部思考。未表达的理由、没有发生记录的动作，仍可能缺失。模型事后生成的解释，也不等于当时真正使用的依据。保存材料时应把观察、人员说明与事后推断分开。\u003c/p>\n\u003ch2 id=\"lesson-07-section-3\">采集什么，应由下一次用途决定\u003c/h2>\n\u003cp>如果下一张工单要判断经验是否适用，设备版本和发生条件就重要；如果要安排派工，可用人员与客户时效就重要；如果要判断某种方法是否长期有效，后续复发信息就重要。\u003c/p>\n\u003cp>“以后可能有用”不足以支持无限采集。每加一项记录，都应能说明它会改变谁的什么判断，或者支持哪种必要追溯。暂时说不清用途的材料，可以保留必要原件，却不必都要求人员填成结构化表格。\u003c/p>\n\u003cp>组织知识研究强调经验需要通过实践、表达与共同使用发展。工程上的工作流与Agent则提供材料进入持续任务的方式。二者相接，才构成生产内嵌积累的设计依据；单有聊天记录或自动笔记，都还不够。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">知识研究\u003c/a>、\u003ca href=\"https://www.anthropic.com/research/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">工程机制\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-07-section-4\">纠正记录，本身也能留下高价值信息\u003c/h2>\n\u003cp>这张工单最值得保留的，未必是AI写出的流畅总结，而是“未换件却被写成换件”的纠正。它暴露了模型如何在资料不足时补成一个常见故事，也说明最终材料需要哪些事实支持。\u003c/p>\n\u003cp>若错误草稿被直接进入经验库，后续人员可能以为换件是必要动作。资料积累越多，错误越容易显得有依据。把纠正接回工单、相关经验与未来评价任务，才使这次发现改变下一轮行为。\u003c/p>\n\u003cp>员工愿不愿纠正也与组织安排有关。如果新增记录主要被用来追责，人员可能少报异常；如果修改被看成低效，团队可能追求直接接受AI。采集设计因此要同时考虑工作负担和反馈激励。\u003c/p>\n\u003ch2 id=\"lesson-07-section-5\">怎样判断门槛真的降低了\u003c/h2>\n\u003cp>不只看一天生成多少记录，还要比较完成一次工作所需的额外填报、重复询问和整理时间；再观察接任者是否更容易找到有效材料，下一次判断是否改善。\u003c/p>\n\u003cp>如果系统每天自动生成大量笔记，却仍需资深人员逐篇重写，整理门槛未必下降。如果关键事实自然留下、人员只纠正必要差别，而且后续任务确实使用，那么企业才开始以更低负担扩大经验覆盖范围。\u003c/p>\n\u003cp>留下材料仍只是起点。企业还要判断其中哪部分解释可信，避免把一连串成功故事整理成未经检验的“最佳实践”。\u003c/p>\n","headings":[{"id":"lesson-07-section-1","label":"先看一张工单自然产生了什么"},{"id":"lesson-07-section-2","label":"AI具体减少哪些劳动"},{"id":"lesson-07-section-3","label":"采集什么，应由下一次用途决定"},{"id":"lesson-07-section-4","label":"纠正记录，本身也能留下高价值信息"},{"id":"lesson-07-section-5","label":"怎样判断门槛真的降低了"}],"exportMd":"# 第7章｜让生产自然留下经验，而非做完再补一份总结\n\n企业希望沉淀经验，常见安排是让员工每周写复盘、项目结束后补案例。开始时材料增长很快，忙起来却容易中断。员工不是不知道经验重要，而是在交付与总结争用同一段时间时，眼前任务通常更紧迫。\n\nAI带来的机会，是在工作已经发生的过程中帮助留下相关材料。**让一份输入同时服务当期交付与未来学习，可以改变积累的成本结构。** 但前提是记录能对应真实动作，后来也确实有人使用。\n\n## 先看一张工单自然产生了什么\n\n采用虚构设备售后案例。客服接到“促销时段间歇停机”的描述，系统知道设备为V1版本，但运行负载不完整。调度把工单交给技术员，技术员现场记录“调整设置并重启，未更换部件”。AI起草处置说明时误写为“更换部件后恢复”，技术员纠正。\n\n这些材料本来就在工作中出现：客户原话、设备身份、派工、实际动作、AI草稿与人的修改。要形成可用记录，首先是把它们关联到同一张工单，而不是要求技术员重新写一篇完整文章。\n\n后续还会出现客户是否恢复、是否复发、是否再次联系等结果。它们决定这次处置可以支持何种经验。如果只有“工单关闭”，就没有完成结果链。\n\n![同一条工单生产链，一路形成当前服务交付，另一路保留原材料、修改和后续结果。两类产出共享输入，但经验仍需后续检验。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNDQwIiB2aWV3Qm94PSIwIDAgMzYwIDQ0MCIgcm9sZT0iaW1nIj48dGl0bGU+5ZCM5LiA5bel5L2c77yM5Lik57G75Lqn5Ye6PC90aXRsZT48ZGVzYz7oh6rnhLbkuqfnlJ/nmoTlt6XljZXmnZDmlpnmnI3liqHlvZPmnJ/kuqTku5jvvIzkuZ/og73lvaLmiJDlvoXmo4Dpqoznu4/pqozvvJvnn6Xor4bkuI3mmK/oh6rliqjlrozmiJDjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIi  怎样判断门槛真的降低了\n\n不只看一天生成多少记录，还要比较完成一次工作所需的额外填报、重复询问和整理时间；再观察接任者是否更容易找到有效材料，下一次判断是否改善。\n\n如果系统每天自动生成大量笔记，却仍需资深人员逐篇重写，整理门槛未必下降。如果关键事实自然留下、人员只纠正必要差别，而且后续任务确实使用，那么企业才开始以更低负担扩大经验覆盖范围。\n\n留下材料仍只是起点。企业还要判断其中哪部分解释可信，避免把一连串成功故事整理成未经检验的“最佳实践”。\n","exportSingleMd":"# 第7章｜让生产自然留下经验，而非做完再补一份总结\n\n企业希望沉淀经验，常见安排是让员工每周写复盘、项目结束后补案例。开始时材料增长很快，忙起来却容易中断。员工不是不知道经验重要，而是在交付与总结争用同一段时间时，眼前任务通常更紧迫。\n\nAI带来的机会，是在工作已经发生的过程中帮助留下相关材料。**让一份输入同时服务当期交付与未来学习，可以改变积累的成本结构。** 但前提是记录能对应真实动作，后来也确实有人使用。\n\n## 先看一张工单自然产生了什么\n\n采用虚构设备售后案例。客服接到“促销时段间歇停机”的描述，系统知道设备为V1版本，但运行负载不完整。调度把工单交给技术员，技术员现场记录“调整设置并重启，未更换部件”。AI起草处置说明时误写为“更换部件后恢复”，技术员纠正。\n\n这些材料本来就在工作中出现：客户原话、设备身份、派工、实际动作、AI草稿与人的修改。要形成可用记录，首先是把它们关联到同一张工单，而不是要求技术员重新写一篇完整文章。\n\n后续还会出现客户是否恢复、是否复发、是否再次联系等结果。它们决定这次处置可以支持何种经验。如果只有“工单关闭”，就没有完成结果链。\n\n![同一条工单生产链，一路形成当前服务交付，另一路保留原材料、修改和后续结果。两类产出共享输入，但经验仍需后续检验。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNDQwIiB2aWV3Qm94PSIwIDAgMzYwIDQ0MCIgcm9sZT0iaW1nIj48dGl0bGU+5ZCM5LiA5bel5L2c77yM5Lik57G75Lqn5Ye6PC90aXRsZT48ZGVzYz7oh6rnhLbkuqfnlJ/nmoTlt6XljZXmnZDmlpnmnI3liqHlvZPmnJ/kuqTku5jvvIzkuZ/og73lvaLmiJDlvoXmo4Dpqoznu4/pqozvvJvnn6Xor4bkuI3mmK/oh6rliqjlrozmiJDjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjQ0MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7lkIzkuIDlt6XkvZzvvIzkuKTnsbvkuqflh7o8L3RleHQ+PHBhdGggZD0iTTExNyA3N0gyMjdMMjQzIDkzVjE0OUgxMTd yaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyMTM0MmYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSI0MDAiPuS6pOS7mOaYr+WQpuWPkeeUnzwvdGV4dD48dGV4dCB4PSIyNzEiIHk9IjM2NSIgZm9udC1mYW1pbHk9IlBpbmdGYW5nIFNDLE1pY3Jvc29mdCBZYUhlaSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmaWxsPSIjODc1ZDIyIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXdlaWdodD0iNDAwIj7ov5jpnIDmo4Dpqow8L3RleHQ+PHRleHQgeD0iMjQiIHk9IjQwOSIgZm9udC1mYW1pbHk9IlBpbmdGYW5nIFNDLE1pY3Jvc29mdCBZYUhlaSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmaWxsPSIjMjEzNDJmIiB0ZXh0LWFuY2hvcj0ic3RhcnQiIGZvbnQtd2VpZ2h0PSI0MDAiPuWFseS6q+i+k+WFpe+8jOWIhuWIq+mqjOivgeS4pOexu+e7k+aenDwvdGV4dD48L3N2Zz4=)\n\n## AI具体减少哪些劳动\n\n原来的总结者要先翻材料，再确认属于哪项任务，整理经过，补缺项，最后改写成别人能读懂的形式。这些工作中，有一部分适合由AI辅助：匹配任务、整理时间顺序、比较草稿与修改、提示尚无结果的工单。\n\n人员仍要核对重要差别，但纠正一个已有草稿，可能比从空白重新组织便宜；从自然记录中提取关键条件，也可能比日后追问当事人更可靠。这里的“可能”需要通过实际工作负担比较，不由工具演示决定。\n\nAI并未因此自动得到技术员的全部思考。未表达的理由、没有发生记录的动作，仍可能缺失。模型事后生成的解释，也不等于当时真正使用的依据。保存材料时应把观察、人员说明与事后推断分开。\n\n## 采集什么，应由下一次用途决定\n\n如果下一张工单要判断经验是否适用，设备版本和发生条件就重要；如果要安排派工，可用人员与客户时效就重要；如果要判断某种方法是否长期有效，后续复发信息就重要。\n\n“以后可能有用”不足以支持无限采集。每加一项记录，都应能说明它会改变谁的什么判断，或者支持哪种必要追溯。暂时说不清用途的材料，可以保留必要原件，却不必都要求人员填成结构化表格。\n\n组织知识研究强调经验需要通过实践、表达与共同使用发展。工程上的工作流与Agent则提供材料进入持续任务的方式。二者相接，才构成生产内嵌积累的设计依据；单有聊天记录或自动笔记，都还不够。[知识研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)、[工程机制](https://www.anthropic.com/research/building-effective-agents)\n\n## 纠正记录，本身也能留下高价值信息\n\n这张工单最值得保留的，未必是AI写出的流畅总结，而是“未换件却被写成换件”的纠正。它暴露了模型如何在资料不足时补成一个常见故事，也说明最终材料需要哪些事实支持。\n\n若错误草稿被直接进入经验库，后续人员可能以为换件是必要动作。资料积累越多，错误越容易显得有依据。把纠正接回工单、相关经验与未来评价任务，才使这次发现改变下一轮行为。\n\n员工愿不愿纠正也与组织安排有关。如果新增记录主要被用来追责，人员可能少报异常；如果修改被看成低效，团队可能追求直接接受AI。采集设计因此要同时考虑工作负担和反馈激励。\n\n## 怎样判断门槛真的降低了\n\n不只看一天生成多少记录，还要比较完成一次工作所需的额外填报、重复询问和整理时间；再观察接任者是否更容易找到有效材料，下一次判断是否改善。\n\n如果系统每天自动生成大量笔记，却仍需资深人员逐篇重写，整理门槛未必下降。如果关键事实自然留下、人员只纠正必要差别，而且后续任务确实使用，那么企业才开始以更低负担扩大经验覆盖范围。\n\n留下材料仍只是起点。企业还要判断其中哪部分解释可信，避免把一连串成功故事整理成未经检验的“最佳实践”。\n","text":"# 第7章｜让生产自然留下经验，而非做完再补一份总结\n\n企业希望沉淀经验，常见安排是让员工每周写复盘、项目结束后补案例。开始时材料增长很快，忙起来却容易中断。员工不是不知道经验重要，而是在交付与总结争用同一段时间时，眼前任务通常更紧迫。\n\nAI带来的机会，是在工作已经发生的过程中帮助留下相关材料。**让一份输入同时服务当期交付与未来学习，可以改变积累的成本结构。** 但前提是记录能对应真实动作，后来也确实有人使用。\n\n## 先看一张工单自然产生了什么\n\n采用虚构设备售后案例。客服接到“促销时段间歇停机”的描述，系统知道设备为V1版本，但运行负载不完整。调度把工单交给技术员，技术员现场记录“调整设置并重启，未更换部件”。AI起草处置说明时误写为“更换部件后恢复”，技术员纠正。\n\n这些材料本来就在工作中出现：客户原话、设备身份、派工、实际动作、AI草稿与人的修改。要形成可用记录，首先是把它们关联到同一张工单，而不是要求技术员重新写一篇完整文章。\n\n后续还会出现客户是否恢复、是否复发、是否再次联系等结果。它们决定这次处置可以支持何种经验。如果只有“工单关闭”，就没有完成结果链。\n\n \n\n## AI具体减少哪些劳动\n\n原来的总结者要先翻材料，再确认属于哪项任务，整理经过，补缺项，最后改写成别人能读懂的形式。这些工作中，有一部分适合由AI辅助：匹配任务、整理时间顺序、比较草稿与修改、提示尚无结果的工单。\n\n人员仍要核对重要差别，但纠正一个已有草稿，可能比从空白重新组织便宜；从自然记录中提取关键条件，也可能比日后追问当事人更可靠。这里的“可能”需要通过实际工作负担比较，不由工具演示决定。\n\nAI并未因此自动得到技术员的全部思考。未表达的理由、没有发生记录的动作，仍可能缺失。模型事后生成的解释，也不等于当时真正使用的依据。保存材料时应把观察、人员说明与事后推断分开。\n\n## 采集什么，应由下一次用途决定\n\n如果下一张工单要判断经验是否适用，设备版本和发生条件就重要；如果要安排派工，可用人员与客户时效就重要；如果要判断某种方法是否长期有效，后续复发信息就重要。\n\n“以后可能有用”不足以支持无限采集。每加一项记录，都应能说明它会改变谁的什么判断，或者支持哪种必要追溯。暂时说不清用途的材料，可以保留必要原件，却不必都要求人员填成结构化表格。\n\n组织知识研究强调经验需要通过实践、表达与共同使用发展。工程上的工作流与Agent则提供材料进入持续任务的方式。二者相接，才构成生产内嵌积累的设计依据；单有聊天记录或自动笔记，都还不够。知识研究、工程机制\n\n## 纠正记录，本身也能留下高价值信息\n\n这张工单最值得保留的，未必是AI写出的流畅总结，而是“未换件却被写成换件”的纠正。它暴露了模型如何在资料不足时补成一个常见故事，也说明最终材料需要哪些事实支持。\n\n若错误草稿被直接进入经验库，后续人员可能以为换件是必要动作。资料积累越多，错误越容易显得有依据。把纠正接回工单、相关经验与未来评价任务，才使这次发现改变下一轮行为。\n\n员工愿不愿纠正也与组织安排有关。如果新增记录主要被用来追责，人员可能少报异常；如果修改被看成低效，团队可能追求直接接受AI。采集设计因此要同时考虑工作负担和反馈激励。\n\n## 怎样判断门槛真的降低了\n\n不只看一天生成多少记录，还要比较完成一次工作所需的额外填报、重复询问和整理时间；再观察接任者是否更容易找到有效材料，下一次判断是否改善。\n\n如果系统每天自动生成大量笔记，却仍需资深人员逐篇重写，整理门槛未必下降。如果关键事实自然留下、人员只纠正必要差别，而且后续任务确实使用，那么企业才开始以更低负担扩大经验覆盖范围。\n\n留下材料仍只是起点。企业还要判断其中哪部分解释可信，避免把一连串成功故事整理成未经检验的“最佳实践”。\n"},{"file":"08-经验的可信度.md","id":"lesson-08","number":8,"role":"核心课","part":1,"title":"第8章｜成功过的做法，为什么还需要验证","md":"# 第8章｜成功过的做法，为什么还需要验证\n\n“调整后恢复”是一条很容易被整理成经验的记录。它简短、明确，有动作，也有结果。如果几十张工单都这样写，AI还能把它归纳成一条看起来非常稳定的方法。\n\n问题在于，相同措辞可能掩盖不同经过。真正值得积累的认识，需要解释动作与结果怎样发生关系，并知道哪些其他原因还没有排除。\n\n**一次成功可以产生候选经验，不能独自证明原因。企业要积累的，是能被后续观察支持、修正或推翻的认识。**\n\n## 把四条工单放在一起\n\n以下均为教学记录，不提供真实设备操作建议。\n\n| 工单 | 设备版本 | 记录的动作 | 观察到的结果 |\n|---|---|---|---|\n| M1 | V1 | 调整并重启，未换件 | 当次恢复，记录到次日 |\n| M2 | V1 | 调整并重启 | 当次恢复，记录到次日 |\n| M3 | V2 | 调整，未记录重启 | 一小时后报告恢复 |\n| M4 | V1 | 仅记录重启，未调整 | 当次恢复，记录到次日 |\n\n如果只选M1、M2、M3，可以讲“调整有效”的故事。把M4带进来，解释就需要更谨慎：可能是重启起作用，也可能是不同问题被用同一句话描述；M3又涉及不同版本与尚未记录的中间变化。\n\n这些记录也没有证明调整无效。它们说明，目前资料还不足以区分几个原因。把不确定性说清，能够帮助企业决定下一步取得什么信息。\n\n## 一个好解释，要能与另一个解释分开\n\n如果认为调整起主要作用，应当能说明在什么条件下、与未调整相比，会观察到什么差别。如果认为负载变化才关键，就应检查恢复是否与运行条件改变相伴。\n\n现实业务很难把所有条件控制一致。企业仍可以先补重要事实：完整动作、设备版本、发生时段、后续观察窗口，以及相似情况里没有成功的记录。这些信息有助于缩小解释范围。\n\nAI适合组织这种比较：找出记录缺项、列出互相竞争的解释、发现与既有方法不一致的工单。它也能提出值得尝试的观察方式。但语言上合理的因果故事，不能替代外部结果。\n\n## 为什么只看成功案例容易越学越偏\n\n企业常优先记录顺利完成的项目，因为它们更易总结、也更适合分享。相同做法失败的任务可能没有结案，客户也可能已停止反馈，于是没有进入经验库。\n\n系统还会改变未来所见材料。一个分配方法使某店长期缺货，销量便持续受供给限制；再用这些销量判断需求，就会看见支持原方法的“证据”。Sculley等关于机器学习系统的研究，把这类行动与后续数据相互影响视为重要系统问题。[原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n因此，未采用、失败、重复报修和不符合预期的情形，都可能比一篇成功总结更有认识价值。保留它们，目的是让方法可以更新。\n\n## 在证据不足时，企业仍然要行动\n\n经营不可能等到每项解释都得到严格实验确认。罕见问题可能无法重复，观察结果也可能要很久才返回。\n\n可行做法是让行动强度与证据相配。较弱的候选经验可以用于补问和检查方向；在明确条件下反复成立的方法，可以承担更多常规工作；出现新版本或相反事实时，则缩小采用范围。\n\n这使不确定性成为行动安排的一部分，而非一句无法操作的“仅供参考”。需要明确的是：当前依据是什么，打算怎样使用，什么观察会使团队改变做法。\n\n探索与利用研究解释了这种资源张力：企业既要使用已有认识，也要为可能改变认识的探索保留投入。它不要求每次都重新证明全部方法，更不提供统一试验周期。[March的原始研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)\n\n## 把经验写成下一次可以继续研究的形式\n\n对M1—M4，更有用的经验记录可以这样组织：观察到若干工单恢复；调整、重启、版本与运行条件尚未被区分；当前只用这些材料帮助识别缺项与候选原因，不据此形成统一处置；下一轮补齐完整动作与相应后续结果。\n\n这份记录没有给出一个漂亮的终结答案，却保存了可接续认识。下一位人员知道团队已经发现什么、还不知道什么，也知道怎样继续推进。\n\n经验可信度不是整理一次就永久固定的标签。它需要进入后续工作，持续接受新情况检验。为此，企业还需要一种在人员变化后仍然能被找到、理解和更新的组织记忆。\n","html":"\u003ch1>第8章｜成功过的做法，为什么还需要验证\u003c/h1>\n\u003cp>“调整后恢复”是一条很容易被整理成经验的记录。它简短、明确，有动作，也有结果。如果几十张工单都这样写，AI还能把它归纳成一条看起来非常稳定的方法。\u003c/p>\n\u003cp>问题在于，相同措辞可能掩盖不同经过。真正值得积累的认识，需要解释动作与结果怎样发生关系，并知道哪些其他原因还没有排除。\u003c/p>\n\u003cp>\u003cstrong>一次成功可以产生候选经验，不能独自证明原因。企业要积累的，是能被后续观察支持、修正或推翻的认识。\u003c/strong>\u003c/p>\n\u003ch2 id=\"lesson-08-section-1\">把四条工单放在一起\u003c/h2>\n\u003cp>以下 些信息有助于缩小解释范围。\n\nAI适合组织这种比较：找出记录缺项、列出互相竞争的解释、发现与既有方法不一致的工单。它也能提出值得尝试的观察方式。但语言上合理的因果故事，不能替代外部结果。\n\n## 为什么只看成功案例容易越学越偏\n\n企业常优先记录顺利完成的项目，因为它们更易总结、也更适合分享。相同做法失败的任务可能没有结案，客户也可能已停止反馈，于是没有进入经验库。\n\n系统还会改变未来所见材料。一个分配方法使某店长期缺货，销量便持续受供给限制；再用这些销量判断需求，就会看见支持原方法的“证据”。Sculley等关于机器学习系统的研究，把这类行动与后续数据相互影响视为重要系统问题。[原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n因此，未采用、失败、重复报修和不符合预期的情形，都可能比一篇成功总结更有认识价值。保留它们，目的是让方法可以更新。\n\n## 在证据不足时，企业仍然要行动\n\n经营不可能等到每项解释都得到严格实验确认。罕见问题可能无法重复，观察结果也可能要很久才返回。\n\n可行做法是让行动强度与证据相配。较弱的候选经验可以用于补问和检查方向；在明确条件下反复成立的方法，可以承担更多常规工作；出现新版本或相反事实时，则缩小采用范围。\n\n这使不确定性成为行动安排的一部分，而非一句无法操作的“仅供参考”。需要明确的是：当前依据是什么，打算怎样使用，什么观察会使团队改变做法。\n\n探索与利用研究解释了这种资源张力：企业既要使用已有认识，也要为可能改变认识的探索保留投入。它不要求每次都重新证明全部方法，更不提供统一试验周期。[March的原始研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)\n\n## 把经验写成下一次可以继续研究的形式\n\n对M1—M4，更有用的经验记录可以这样组织：观察到若干工单恢复；调整、重启、版本与运行条件尚未被区分；当前只用这些材料帮助识别缺项与候选原因，不据此形成统一处置；下一轮补齐完整动作与相应后续结果。\n\n这份记录没有给出一个漂亮的终结答案，却保存了可接续认识。下一位人员知道团队已经发现什么、还不知道什么，也知道怎样继续推进。\n\n经验可信度不是整理一次就永久固定的标签。它需要进入后续工作，持续接受新情况检验。为此，企业还需要一种在人员变化后仍然能被找到、理解和更新的组织记忆。\n","exportSingleMd":"# 第8章｜成功过的做法，为什么还需要验证\n\n“调整后恢复”是一条很容易被整理成经验的记录。它简短、明确，有动作，也有结果。如果几十张工单都这样写，AI还能把它归纳成一条看起来非常稳定的方法。\n\n问题在于，相同措辞可能掩盖不同经过。真正值得积累的认识，需要解释动作与结果怎样发生关系，并知道哪些其他原因还没有排除。\n\n**一次成功可以产生候选经验，不能独自证明原因。企业要积累的，是能被后续观察支持、修正或推翻的认识。**\n\n## 把四条工单放在一起\n\n以下均为教学记录，不提供真实设备操作建议。\n\n| 工单 | 设备版本 | 记录的动作 | 观察到的结果 |\n|---|---|---|---|\n| M1 | V1 | 调整并重启，未换件 | 当次恢复，记录到次日 |\n| M2 | V1 | 调整并重启 | 当次恢复，记录到次日 |\n| M3 | V2 | 调整，未记录重启 | 一小时后报告恢复 |\n| M4 | V1 | 仅记录重启，未调整 | 当次恢复，记录到次日 |\n\n如果只选M1、M2、M3，可以讲“调整有效”的故事。把M4带进来，解释就需要更谨慎：可能是重启起作用，也可能是不同问题被用同一句话描述；M3又涉及不同版本与尚未记录的中间变化。\n\n这些记录也没有证明调整无效。它们说明，目前资料还不足以区分几个原因。把不确定性说清，能够帮助企业决定下一步取得什么信息。\n\n## 一个好解释，要能与另一个解释分开\n\n如果认为调整起主要作用，应当能说明在什么条件下、与未调整相比，会观察到什么差别。如果认为负载变化才关键，就应检查恢复是否与运行条件改变相伴。\n\n现实业务很难把所有条件控制一致。企业仍可以先补重要事实：完整动作、设备版本、发生时段、后续观察窗口，以及相似情况里没有成功的记录。这些信息有助于缩小解释范围。\n\nAI适合组织这种比较：找出记录缺项、列出互相竞争的解释、发现与既有方法不一致的工单。它也能提出值得尝试的观察方式。但语言上合理的因果故事，不能替代外部结果。\n\n## 为什么只看成功案例容易越学越偏\n\n企业常优先记录顺利完成的项目，因为它们更易总结、也更适合分享。相同做法失败的任务可能没有结案，客户也可能已停止反馈，于是没有进入经验库。\n\n系统还会改变未来所见材料。一个分配方法使某店长期缺货，销量便持续受供给限制；再用这些销量判断需求，就会看见支持原方法的“证据”。Sculley等关于机器学习系统的研究，把这类行动与后续数据相互影响视为重要系统问题。[原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n因此，未采用、失败、重复报修和不符合预期的情形，都可能比一篇成功总结更有认识价值。保留它们，目的是让方法可以更新。\n\n## 在证据不足时，企业仍然要行动\n\n经营不可能等到每项解释都得到严格实验确认。罕见问题可能无法重复，观察结果也可能要很久才返回。\n\n可行做法是让行动强度与证据相配。较弱的候选经验可以用于补问和检查方向；在明确条件下反复成立的方法，可以承担更多常规工作；出现新版本或相反事实时，则缩小采用范围。\n\n这使不确定性成为行动安排的一部分，而非一句无法操作的“仅供参考”。需要明确的是：当前依据是什么，打算怎样使用，什么观察会使团队改变做法。\n\n探索与利用研究解释了这种资源张力：企业既要使用已有认识，也要为可能改变认识的探索保留投入。它不要求每次都重新证明全部方法，更不提供统一试验周期。[March的原始研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)\n\n## 把经验写成下一次可以继续研究的形式\n\n对M1—M4，更有用的经验记录可以这样组织：观察到若干工单恢复；调整、重启、版本与运行条件尚未被区分；当前只用这些材料帮助识别缺项与候选原因，不据此形成统一处置；下一轮补齐完整动作与相应后续结果。\n\n这份记录没有给出一个漂亮的终结答案，却保存了可接续认识。下一位人员知道团队已经发现什么、还不知道什么，也知道怎样继续推进。\n\n经验可信度不是整理一次就永久固定的标签。它需要进入后续工作，持续接受新情况检验。为此，企业还需要一种在人员变化后仍然能被找到、理解和更新的组织记忆。\n","text":"# 第8章｜成功过的做法，为什么还需要验证\n\n“调整后恢复”是一条很容易被整理成经验的记录。它简短、明确，有动作，也有结果。如果几十张工单都这样写，AI还能把它归纳成一条看起来非常稳定的方法。\n\n问题在于，相同措辞可能掩盖不同经过。真正值得积累的认识，需要解释动作与结果怎样发生关系，并知道哪些其他原因还没有排除。\n\n**一次成功可以产生候选经验，不能独自证明原因。企业要积累的，是能被后续观察支持、修正或推翻的认识。**\n\n## 把四条工单放在一起\n\n以下均为教学记录，不提供真实设备操作建议。\n\n| 工单 | 设备版本 | 记录的动作 | 观察到的结果 |\n|---|---|---|---|\n| M1 | V1 | 调整并重启，未换件 | 当次恢复，记录到次日 |\n| M2 | V1 | 调整并重启 | 当次恢复，记录到次日 |\n| M3 | V2 | 调整，未记录重启 | 一小时后报告恢复 |\n| M4 | V1 | 仅记录重启，未调整 | 当次恢复，记录到次日 |\n\n如果只选M1、M2、M3，可以讲“调整有效”的故事。把M4带进来，解释就需要更谨慎：可能是重启起作用，也可能是不同问题被用同一句话描述；M3又涉及不同版本与尚未记录的中间变化。\n\n这些记录也没有证明调整无效。它们说明，目前资料还不足以区分几个原因。把不确定性说清，能够帮助企业决定下一步取得什么信息。\n\n## 一个好解释，要能与另一个解释分开\n\n如果认为调整起主要作用，应当能说明在什么条件下、与未调整相比，会观察到什么差别。如果认为负载变化才关键，就应检查恢复是否与运行条件改变相伴。\n\n现实业务很难把所有条件控制一致。企业仍可以先补重要事实：完整动作、设备版本、发生时段、后续观察窗口，以及相似情况里没有成功的记录。这些信息有助于缩小解释范围。\n\nAI适合组织这种比较：找出记录缺项、列出互相竞争的解释、发现与既有方法不一致的工单。它也能提出值得尝试的观察方式。但语言上合理的因果故事，不能替代外部结果。\n\n## 为什么只看成功案例容易越学越偏\n\n企业常优先记录顺利完成的项目，因为它们更易总结、也更适合分享。相同做法失败的任务可能没有结案，客户也可能已停止反馈，于是没有进入经验库。\n\n系统还会改变未来所见材料。一个分配方法使某店长期缺货，销量便持续受供给限制；再用这些销量判断需求，就会看见支持原方法的“证据”。Sculley等关于机器学习系统的研究，把这类行动与后续数据相互影响视为重要系统问题。原始论文\n\n因此，未采用、失败、重复报修和不符合预期的情形，都可能比一篇成功总结更有认识价值。保留它们，目的是让方法可以更新。\n\n## 在证据不足时，企业仍然要行动\n\n经营不可能等到每项解释都得到严格实验确认。罕见问题可能无法重复，观察结果也可能要很久才返回。\n\n可行做法是让行动强度与证据相配。较弱的候选经验可以用于补问和检查方向；在明确条件下反复成立的方法，可以承担更多常规工作；出现新版本或相反事实时，则缩小采用范围。\n\n这使不确定性成为行动安排的一部分，而非一句无法操作的“仅供参考”。需要明确的是：当前依据是什么，打算怎样使用，什么观察会使团队改变做法。\n\n探索与利用研究解释了这种资源张力：企业既要使用已有认识，也要为可能改变认识的探索保留投入。它不要求每次都重新证明全部方法，更不提供统一试验周期。March的原始研究\n\n## 把经验写成下一次可以继续研究的形式\n\n对M1—M4，更有用的经验记录可以这样组织：观察到若干工单恢复；调整、重启、版本与运行条件尚未被区分；当前只用这些材料帮助识别缺项与候选原因，不据此形成统一处置；下一轮补齐完整动作与相应后续结果。\n\n这份记录没有给出一个漂亮的终结答案，却保存了可接续认识。下一位人员知道团队已经发现什么、还不知道什么，也知道怎样继续推进。\n\n经验可信度不是整理一次就永久固定的标签。它需要进入后续工作，持续接受新情况检验。为此，企业还需要一种在人员变化后仍然能被找到、理解和更新的组织记忆。\n"},{"file":"09-组织记忆.md","id":"lesson-09","number":9,"role":"核心课","part":1,"title":"第9章｜资料还在，为什么经验仍会随人离开","md":"# 第9章｜资料还在，为什么经验仍会随人离开\n\n设想一次交接：资深员工离职前交出了完整文件夹。几个月后，接任者仍频繁问：“当时为什么这样做？”文件找得到，却不知道哪份有效；规则写得明确，却不清楚例外；知道方法，也没有原员工的工具入口与协调关系。\n\n这种情况下，企业保存了资料，但没有完整保留让资料发挥作用的条件。\n\n**组织记忆的检验，是人员和任务变化后，企业还能否理解并使用有效经验。** 它存在于材料、人员、工具、职责和共同实践之间。\n\n## 保存、找到、理解与采用，是四段不同工作\n\n保存解决材料是否仍然存在。若原件已丢，后来的总结再完整，也很难核对关键细节。\n\n找到解决能否在需要时定位。几十个相似文件名、分散群聊和没有任务关联的笔记，会让保存价值停在潜在状态。\n\n理解解决为什么与何时可以使用。它需要情境、依据、版本和适用范围。一个结论从原背景移走，可能很快变成误导。\n\n采用则需要工作入口、工具、权限和人员安排。接任者没有办法执行，知识就仍停在解释层。采用后的结果还要能返回，供更新判断。\n\n| 交接时常见说法 | 需要进一步核对的问题 |\n|---|---|\n| 文件都在 | 原始材料、修改与结果能否对应 |\n| 搜索一下就有 | 能否区分有效方法、旧稿和候选解释 |\n| 新人看一遍就懂 | 是否需要未写出的前提或专业基础 |\n| 按流程做即可 | 资源、入口与异常支持是否可得 |\n| 后面有人维护 | 具体谁判断修订，哪里会显示新状态 |\n\n这些问题可以帮助企业找到断点，不要求每份资料都经过繁琐流程。\n\n## 用一次接任任务检查记忆\n\n继续采用教学设备案例。原技术员请假，接任者处理一张版本不同的新工单。他应该能看到原始描述、当时实际动作、被纠正的“换件”草稿、现有候选解释，以及哪些部分尚未证实。\n\n如果他能识别版本差异，知道还需补哪些事实，并选择合适的下一步，材料就开始支持独立判断。如果他只是复制原结论，则还不能说明组织学会。\n\n再检查执行条件：必要工具是否只有原技术员能用？调度规则是否靠个人关系推动？专业支持由谁提供？这些部分也属于能力接续，不能因不在文档里就忽略。\n\nNonaka关于知识形成的研究提醒我们，明确表达与共同实践相互补充。对于涉及身体操作、现场感知和熟练协调的工作，文字常需要与带教、示范和实际任务结合。[原始研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)\n\n## AI可以改变记忆入口，不能自动保证记忆正确\n\nAI可以按当前问题组织相关材料，比较不同版本，提示某条经验已经被修订，也可以帮助新人提出原本不知道该问的问题。它降低了使用记忆的部分门槛。\n\n但如果资料中的旧方法没有停用状态，AI也可能把它重新讲得很有说服力。如果企业没有保留反例，AI无法凭检索发现所有遗漏。长期记忆与当前调用因此需要共同建设。\n\n客服实地研究提供了经验通过AI进入更多员工工作的现实证据，但它没有证明每种隐性技能都可提取，也没有替任何企业完成接任检验。[研究原文](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)\n\n## 不必把所有知识变成同一种东西\n\n正式业务规则可以采用明确版本和负责者；尚在探索的经验可以保留案例与不同解释；熟练技能可能需要共同实践；低频一次性材料则只需可追溯保存。\n\n统一存成同一种“知识条目”，有时会让这些差别消失。企业应先判断它的用途，再选择载体和维护方式。\n\n组织记忆也有成本。某种罕见能力是否值得多人备份，某份旧资料是否仍值得维护，需要按业务重要性与可替代性决定。目标是保住关键能力，不是消除一切人员依赖。\n\n当企业知道哪些经验需要留下、怎样接棒，下一步才更容易决定哪些部分应该形成统一标准，哪些必须保留情境判断。\n","html":"\u003ch1>第9章｜资料还在，为什么经验仍会随人离开\u003c/h1>\n\u003cp>设想一次交接：资深员工离职前交出了完整文件夹。几个月后，接任者仍频繁问：“当时为什么这样做？”文件找得到，却不知道哪份有效；规则写得明确，却不清楚例外；知道方法，也没有原员工的工具入口与协调关系。\u003c/p>\n\u003cp>这种情况下，企业保存了资料，但没有完整保留让资料发挥作用的条件。\u003c/p>\n\u003cp>\u003cstrong>组织记忆的检验，是人员和任务变化后，企业还能否理解并使用有效经验。\u003c/strong> 它存在于材料、人员、工具、职责和共同实践之间。\u003c/p>\n\u003ch2 id=\"lesson-09-section-1\">保存、找到、理解与采用，是四段不同工作\u003c/h2>\n\u003cp>保存解决材料是否仍然存在。若原件已丢，后来的总结再完整，也很难核对关键细节。\u003c/p>\n\u003cp>找到解决能否在需要时定位。几十个相似文件名、分散群聊和没有任务关联的笔记，会让保存价值停在潜在状态。\u003c/p>\n\u003cp>理解解决为什么与何时可以使用。它需要情境、依据、版本和适用范围。一个结论从原背景移走，可能很快变成误导。\u003c/p>\n\u003cp>采用则需要工作入口、工具、权限和人员安排。接任者没有办法执行，知识就仍停在解释层。采用后的结果还要能返回，供更新判断。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>交接时常见说法\u003c/th>\n\u003cth>需要进一步核对的问题\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>文件都在\u003c/td>\n\u003ctd>原始材料、修改与结果能否对应\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>搜索一下就有\u003c/td>\n\u003ctd>能否区分有效方法、旧稿和候选解释\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新人看一遍就懂\u003c/td>\n\u003ctd>是否需要未写出的前提或专业基础\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>按流程做即可\u003c/td>\n\u003ctd>资源、入口与异常支持是否可得\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>后面有人维护\u003c/td>\n\u003ctd>具体谁判断修订，哪里会显示新状态\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>这些问题可以帮助企业找到断点，不要求每份资料都经过繁琐流程。\u003c/p>\n\u003ch2 id=\"lesson-09-section-2\">用一次接任任务检查记忆\u003c/h2>\n\u003cp>继续采用教学设备案例。原技术员请假，接任者处理一张版本不同的新工单。他应该能看到原始描述、当时实际动作、被纠正的“换件”草稿、现有候选解释，以及哪些部分尚未证实。\u003c/p>\n\u003cp>如果他能识别版本差异，知道还需补哪些事实，并选择合适的下一步，材料就开始支持独立判断。如果他只是复制原结论，则还不能说明组织学会。\u003c/p>\n\u003cp>再检查执行条件：必要工具是否只有原技术员能用？调度规则是否靠个人关系推动？专业支持由谁提供？这些部分也属于能力接续，不能因不在文档里就忽略。\u003c/p>\n\u003cp>Nonaka关于知识形成的研究提醒我们，明确表达与共同实践相互补充。对于涉及身体操作、现场感知和熟练协调的工作，文字常需要与带教、示范和实际任务结合。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-09-section-3\">AI可以改变记忆入口，不能自动保证记忆正确\u003c/h2>\n\u003cp>AI可以按当前问题组织相关材料，比较不同版本，提示某条经验已经被修订，也可以帮助新人提出原本不知道该问的问题。它降低了使用记忆的部分门槛。\u003c/p>\n\u003cp>但如果资料中的旧方法没有停用状态，AI也可能把它重新讲得很有说服力。如果企业没有保留反例，AI无法凭检索发现所有遗漏。长期记忆与当前调用因此需要共同建设。\u003c/p>\n\u003cp>客服实地研究提供了经验通过AI进入更多员工工作的现实证据，但它没有证明每种隐性技能都可提取，也没有替任何企业完成接任检验。\u003ca href=\"https://danielle.li/assets/docs/GenerativeAIatWork.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">研究原文\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-09-section-4\">不必把所有知识变成同一种东西\u003c/h2>\n\u003cp>正式业务规则可以采用明确版本和负责者；尚在探索的经验可以保留案例与不同解释；熟练技能可能需要共同实践；低频一次性材料则只需可追溯保存。\u003c/p>\n\u003cp>统一存成同一种“知识条目”，有时会让这些差别消失。企业应先判断它的用途，再选择载体和维护方式。\u003c/p>\n\u003cp>组织记忆也有成本。某种罕见能力是否值得多人备份，某份旧资料是否仍值得维护，需要按业务重要性与可替代性决定。目标是保住关键能力，不是消除一切人员依赖。\u003c/p>\n\u003cp>当企业知道哪些经验需要留下、怎样接棒，下一步才更容易决定哪些部分应该形成统一标准，哪些必须保留情境判断。\u003c/p>\n","headings":[{"id":"lesson-09-section-1","label":"保存、找到、理解与采用，是四段不同工作"},{"id":"lesson-09-section-2","label":"用一次接任任务检查记忆"},{"id":"lesson-09-section-3","label":"AI可以改变记忆入口，不能自动保证记忆正确"},{"id":"lesson-09-section-4","label":"不必把所有知识变成同一种东西"}],"exportMd":"# 第9章｜资料还在，为什么经验仍会随人离开\n\n设想一次交接：资深员工离职前交出了完整文件夹。几个月后，接任者仍频繁问：“当时为什么这样做？”文件找得到，却不知道哪份有效；规则写得明确，却不清楚例外；知道方法，也没有原员工的工具入口与协调关系。\n\n这种情况下，企业保存了资料，但没有完整保留让资料发挥作用的条件。\n\n**组织记忆的检验，是人员和任务变化后，企业还能否理解并使用有效经验。** 它存在于材料、人员、工具、职责和共同实践之间。\n\n## 保存、找到、理解与采用，是四段不同工作\n\n保存解决材料是否仍然存在。若原件已丢，后来的总结再完整，也很难核对关键细节。\n\n找到解决能否在需要时定位。几十个相似文件名、分散群聊和没有任务关联的笔记，会让保存价值停在潜在状态。\n\n理解解决为什么与何时可以使用。它需要情境、依据、版本和适用范围。一个结论从原背景移走，可能很快变成误导。\n\n采用则需要工作入口、工具、权限和人员安排。接任者没有办法执行，知识就仍停在解释层。采用后的结果还要能返回，供更新判断。\n\n| 交接时常见说法 | 需要进一步核对的问题 |\n|---|---|\n| 文件都在 | 原始材料、修改与结果能否对应 |\n| 搜索一下就有 | 能否区分有效方法、旧稿和候选解释 |\n| 新人看一遍就懂 | 是否需要未写出的前提或专业基础 |\n| 按流程做即可 | 资源、入口与异常支持是否可得 |\n| 后面有人维护 | 具体谁判断修订，哪里会显示新状态 |\n\n这些问题可以帮助企业找到断点，不要求每份资料都经过繁琐流程。\n\n## 用一次接任任务检查记忆\n\n继续采用教学设备案例。原技术员请假，接任者处理一张版本不同的新工单。他应该能看到原始描述、当时实际动作、被纠正的“换件”草稿、现有候选解释，以及哪些部分尚未证实。\n\n如果他能识别版本差异，知道还需补哪些事实，并选择合适的下一步，材料就开始支持独立判断。如果他只是复制原结论，则还不能说明组织学会。\n\n再检查执行条件：必要工具是否只有原技术员能用？调度规则是否靠个人关系推动？专业支持由谁提供？这些部分也属于能力接续，不能因不在文档里就忽略。\n\nNonaka关于知识形成的研究提醒我们，明确表达与共同实践相互补充。对于涉及身体操作、现场感知和熟练协调的工作，文字常需要与带教、示范和实际任务结合。[原始研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)\n\n## AI可以改变记忆入口，不能自动保证记忆正确\n\nAI可以按当前问题组织相关材料，比较不同版本，提示某条经验已经被修订，也可以帮助新人提出原本不知道该问的问题。它降低了使用记忆的部分门槛。\n\n但如果资料中的旧方法没有停用状态，AI也可能把它重新讲得很有说服力。如果企业没有保留反例，AI无法凭检索发现所有遗漏。长期记忆与当前调用因此需要共同建设。\n\n客服实地研究提供了经验通过AI进入更多员工工作的现实证据，但它没有证明每种隐性技能都可提取，也没有替任何企业完成接任检验。[研究原文](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)\n\n## 不必把所有知识变成同一种东西\n\n正式业务规则可以采用明确版本和负责者；尚在探索的经验可以保留案例与不同解释；熟练技能可能需要共同实践；低频一次性材料则只需可追溯保存。\n\n统一存成同一种“知识条目”，有时会让这些差别消失。企业应先判断它的用途，再选择载体和维护方式。\n\n组织记忆也有成本。某种罕见能力是否值得多人备份，某份旧资料是否仍值得维护，需要按业务重要性与可替代性决定。目标是保住关键能力，不是消除一切人员依赖。\n\n当企业知道哪些经验需要留下、怎样接棒，下一步才更容易决定哪些部分应该形成统一标准，哪些必须保留情境判断。\n","exportSingleMd":"# 第9章｜资料还在，为什么经验仍会随人离开\n\n设想一次交接：资深员工离职前交出了完整文件夹。几个月后，接任者仍频繁问：“当时为什么这样做？”文件找得到，却不知道哪份有效；规则写得明确，却不清楚例外；知道方法，也没有原员工的工具入口与协调关系。\n\n这种情况下，企业保存了资料，但没有完整保留让资料发挥作用的条件。\n\n**组织记忆的检验，是人员和任务变化后，企业还能否理解并使用有效经验。** 它存在于材料、人员、工具、职责和共同实践之间。\n\n## 保存、找到、理解与采用，是四段不同工作\n\n保存解决材料是否仍然存在。若原件已丢，后来的总结再完整，也很难核对关键细节。\n\n找到解决能否在需要时定位。几十个相似文件名、分散群聊和没有任务关联的笔记，会让保存价值停在潜在状态。\n\n理解解决为什么与何时可以使用。它需要情境、依据、版本和适用范围。一个结论从原背景移走，可能很快变成误导。\n\n采用则需要工作入口、工具、权限和人员安排。接任者没有办法 n继续采用教学设备案例。原技术员请假，接任者处理一张版本不同的新工单。他应该能看到原始描述、当时实际动作、被纠正的“换件”草稿、现有候选解释，以及哪些部分尚未证实。\n\n如果他能识别版本差异，知道还需补哪些事实，并选择合适的下一步，材料就开始支持独立判断。如果他只是复制原结论，则还不能说明组织学会。\n\n再检查执行条件：必要工具是否只有原技术员能用？调度规则是否靠个人关系推动？专业支持由谁提供？这些部分也属于能力接续，不能因不在文档里就忽略。\n\nNonaka关于知识形成的研究提醒我们，明确表达与共同实践相互补充。对于涉及身体操作、现场感知和熟练协调的工作，文字常需要与带教、示范和实际任务结合。原始研究\n\n## AI可以改变记忆入口，不能自动保证记忆正确\n\nAI可以按当前问题组织相关材料，比较不同版本，提示某条经验已经被修订，也可以帮助新人提出原本不知道该问的问题。它降低了使用记忆的部分门槛。\n\n但如果资料中的旧方法没有停用状态，AI也可能把它重新讲得很有说服力。如果企业没有保留反例，AI无法凭检索发现所有遗漏。长期记忆与当前调用因此需要共同建设。\n\n客服实地研究提供了经验通过AI进入更多员工工作的现实证据，但它没有证明每种隐性技能都可提取，也没有替任何企业完成接任检验。研究原文\n\n## 不必把所有知识变成同一种东西\n\n正式业务规则可以采用明确版本和负责者；尚在探索的经验可以保留案例与不同解释；熟练技能可能需要共同实践；低频一次性材料则只需可追溯保存。\n\n统一存成同一种“知识条目”，有时会让这些差别消失。企业应先判断它的用途，再选择载体和维护方式。\n\n组织记忆也有成本。某种罕见能力是否值得多人备份，某份旧资料是否仍值得维护，需要按业务重要性与可替代性决定。目标是保住关键能力，不是消除一切人员依赖。\n\n当企业知道哪些经验需要留下、怎样接棒，下一步才更容易决定哪些部分应该形成统一标准，哪些必须保留情境判断。\n"},{"file":"10-标准与情境.md","id":"lesson-10","number":10,"role":"核心课","part":1,"title":"第10章｜先统一什么，才能让更多经验复用","md":"# 第10章｜先统一什么，才能让更多经验复用\n\n企业推进标准化时，常遇到两个相反困难。标准太少，同一件事各有说法，无法比较；标准太早太细，现场人员觉得不适用，只能绕开执行。\n\nAI并没有消除这个问题，却提供了一种新的推进顺序：先让关键事实与协作含义一致，让经验能够相认，再在使用中形成更成熟的方法。\n\n**标准化可以从共同事实和接口开始，不必以压平全部现场判断为代价。** 能被理解的情境与例外，也是一种可积累内容。\n\n## 为什么先要有共同事实\n\n教学烘焙连锁需要比较不同门店的售罄情况。若一家填“卖完时间”，另一家填“库存归零时间”，还有一家把暂时下架也算售罄，表格虽整齐，含义却不一致。\n\n因此需要先说明商品、门店、营业日与状态。例如“正式分配”指中央已确认的安排，“实际到店”指门店收到的数量，二者不能用同一栏代替。这样才知道建议是否真正执行，结果对应哪次行动。\n\n这类一致性让经验可比较，也减少交接中的重复解释。它并不要求每位店长对需求作同样判断。\n\n## 为什么不能过早统一答案\n\n在一组教学条件中，X店需求95个、Y店需求60个。总共生产160个，将分配由80/80改为100/60，可以多满足一些需求。\n\n但换一组独立条件：X附近交通入口关闭，需求变为50个，Y变为90个。同样的100/60会留下更多卖不出的商品。旧答案不能脱离条件复用。\n\n应保留的可能是：怎样识别售罄后的未知需求，怎样使用本地事件，怎样在总产量下比较方案，以及怎样发现原方法不再适用。部分步骤可以统一，具体判断仍需当前事实。\n\n| 适合先统一 | 适合逐步形成 | 应保留情境 |\n|---|---|---|\n| 对象、日期、执行状态的含义 | 常见问题的处理方法 | 事件变化与新例外 |\n| 必须记录的真实动作 | 经过检验的经验条件 | 需求仍未知的部分 |\n| 正式规则与负责者 | 可扩展的评价样例 | 尚有竞争解释的问题 |\n\n这个划分不是固定分类表。随着证据增加，一些情境判断可以形成稳定方法；环境变化后，稳定方法也可能重新进入讨论。\n\n## AI怎样支持尚未完全规则化的经验\n\n过去，经验可以通过师徒与共同实践传递，并非必须先成为SOP。AI的新作用，是帮助更多材料以可承受的成本被组织、比较和带回任务。\n\n比如员工可以保留一个带背景的案例，AI在相似任务中提示相关条件；若当前情况不同，它应帮助识别差别，而不是只推荐最相似的历史答案。多次使用后，团队才更有依据决定哪些条件应成为规则。\n\n上下文工程讨论的是当前任务怎样取得相关信息；组织知识研究讨论经验如何通过表达与实践发展。二者相接，有助于形成“先可理解、再逐步稳定”的方法，而不是把未整理材料直接当成熟标准。[工程材料](https://www.anthropic.com/research/effective-context-engineering-for-ai-agents)、[知识研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)\n\n## 例外要怎样留下，才不会变成各行其是\n\n现场偏离标准时，应能说明偏离的事实、采取的动作和后续结果。例外可以帮助发现规则的适用范围，也可能暴露执行不到位。二者需要分辨。\n\n例如交通信息在决策前已经取得，却没有进入分配，是调用与工作设计的问题；交通在决策后临时变化，则不能用事后信息证明事前判断愚蠢。对这种差别的保留，会直接影响员工是否愿意报告真实情况。\n\n成熟的质量、财务或安全规则仍应按正式要求执行。情境判断应有明确用途，不能成为回避责任的理由。相反，对已知且稳定的工作，每次都重新推理也会浪费资源。\n\n## 一条业务的合理起点\n\n可以先让一笔工作做到：事实能对应，建议与实际动作分开，结果可返回，例外可以被看见。然后观察经验是否帮助下一次判断，再增加真正有用的标准。\n\n这一顺序降低的，是企业必须在采用前把全部经验定义完的负担。它没有承诺自动标准化，却给了企业一种在生产与学习中逐步形成秩序的路径。\n\n当经验开始可比较、可使用，企业仍需选择最值得发展的部分。并不是每项特殊做法都应放大，判断应回到客户认可的价值。\n","html":"\u003ch1>第10章｜先统一什么，才能让更多经验复用\u003c/h1>\n\u003cp>企业推进标准化时，常遇到两个相反困难。标准太少，同一件事各有说法，无法比较；标准太早太细，现场人员觉得不适用，只能绕开执行。\u003c/p>\n\u003cp>AI并没有消除这个问题，却提供了一种新的推进顺序：先让关键事实与协作含义一致，让经验能够相认，再在使用中形成更成熟的方法。\u003c/p>\n\u003cp>\u003cstrong>标准化可以从共同事实和接口开始，不必以压平全部现场判断为代价。\u003c/strong> 能被理解的情境与例外，也是一种可积累内容。\u003c/p>\n\u003ch2 id=\"lesson-10-section-1\">为什么先要有共同事实\u003c/h2>\n\u003cp>教学烘焙连锁需要比较不同门店的售罄情况。若一家填“卖完时间”，另一家填“库存归零时间”，还有一家把暂时下架也算售罄，表格虽整齐，含义却不一致。\u003c/p>\n\u003cp>因此需要先说明商品、门店、营业日与状态。例如“正式分配”指中央已确认的安排，“实际到店”指门店收到的数量，二者不能用同一栏代替。这样才知道建议是否真正执行，结果对应哪次行动。\u003c/p>\n\u003cp>这类一致性让经验可比较，也减少交接中的重复解释。它并不要求每位店长对需求作同样判断。\u003c/p>\n\u003ch2 id=\"lesson-10-section-2\">为什么不能过早统一答案\u003c/h2>\n\u003cp>在一组教学条件中，X店需求95个、Y店需求60个。总共生产160个，将分配由80/80改为100/60，可以多满足一些需求。\u003c/p>\n\u003cp>但换一组独立条件：X附近交通入口关闭，需求变为50个，Y变为90个。同样的100/60会留下更多卖不出的商品。旧答案不能脱离条件复用。\u003c/p>\n\u003cp>应保留的可能是：怎样识别售罄后的未知需求，怎样使用本地事件，怎样在总产量下比较方案，以及怎样发现原方法不再适用。部分步骤可以统一，具体判断仍需当前事实。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适合先统一\u003c/th>\n\u003cth>适合逐步形成\u003c/th>\n\u003cth>应保留情境\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>对象、日期、执行状态的含义\u003c/td>\n\u003ctd>常见问题的处理方法\u003c/td>\n\u003ctd>事件变化与新例外\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>必须记录的真实动作\u003c/td>\n\u003ctd>经过检验的经验条件\u003c/td>\n\u003ctd>需求仍未知的部分\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>正式规则与负责者\u003c/td>\n\u003ctd>可扩展的评价样例\u003c/td>\n\u003ctd>尚有竞争解释的问题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>这个划分不是固定分类表。随着证据增加，一些情境判断可以形成稳定方法；环境变化后，稳定方法也可能重新进入讨论。\u003c/p>\n\u003ch2 id=\"lesson-10-section-3\">AI怎样支持尚未完全规则化的经验\u003c/h2>\n\u003cp>过去，经验可以通过师徒与共同实践传递，并非必须先成为SOP。AI的新作用，是帮助更多材料以可承受的成本被组织、比较和带回任务。\u003c/p>\n\u003cp>比如员工可以保留一个带背景的案例，AI在相似任务中提示相关条件；若当前情况不同，它应帮助识别差别，而不是只推荐最相似的历史答案。多次使用后，团队才更有依据决定哪些条件应成为规则。\u003c/p>\n\u003cp>上下文工程讨论的是当前任务怎样取得相关信息；组织知识研究讨论经验如何通过表达与实践发展。二者相接，有助于形成“先可理解、再逐步稳定”的方法，而不是把未整理材料直接当成熟标准。\u003ca href=\"https://www.anthropic.com/research/effective-context-engineering-for-ai-agents\" target=\"_blank\" rel=\"noopener noreferrer\">工程材料\u003c/a>、\u003ca href=\"https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">知识研究\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-10-section-4\">例外要怎样留下，才不会变成各行其是\u003c/h2>\n\u003cp>现场偏离标准时，应能说明偏离的事实、采取的动作和后续结果。例外可以帮助发现规则的适用范围，也可能暴露执行不到位。二者需要分辨。\u003c/p>\n\u003cp>例如交通信息在决策前已经取得，却没有进入分配，是调用与工作设计的问题；交通在决策后临时变化，则不能用事后信息证明事前判断愚蠢。对这种差别的保留，会直接影响员工是否愿意报告真实情况。\u003c/p>\n\u003cp>成熟的质量、财务或安全规则仍应按正式要求执行。情境判断应有明确用途，不能成为回避责任的理由。相反，对已知且稳定的工作，每次都重新推理也会浪费资源。\u003c/p>\n\u003ch2 id=\"lesson-10-section-5\">一条业务的合理起点\u003c/h2>\n\u003cp>可以先让一笔工作做到：事实能对应，建议与实际动作分开，结果可返回，例外可以被看见。然后观察经验是否帮助下一次判断，再增加真正有用的标准。\u003c/p>\n\u003cp>这一顺序降低的，是企业必须在采用前把全部经验定义完的负担。它没有承诺自动标准化，却给了企业一种在生产与学习中逐步形成秩序的路径。\u003c/p>\n\u003cp>当经验开始可比较、可使用，企业仍需选择最值得发展的部分。并不是每项特殊做法都应放大，判断应回到客户认可的价值。\u003c/p>\n","headings":[{"id":"lesson-10-section-1","label":"为什么先要有共同事实"},{"id":"lesson-10-section-2","label":"为什么不能过早统一答案"},{"id":"lesson-10-section-3","label":"AI怎样支持尚未完全规则化的经验"},{"id":"lesson-10-section-4","label":"例外要怎样留下，才不会变成各行其是"},{"id":"lesson-10-section-5","label":"一条业务的合理起点"}],"exportMd":"# 第10章｜先统一什么，才能让更多经验复用\n\n企业推进标准化时，常遇到两个相反困难。标准太少，同一件事各有说法，无法比较；标准太早太细，现场人员觉得不适用，只能绕开执行。\n\nAI并没有消除这个问题，却提供了一种新的推进顺序：先让关键事实与协作含义一致，让经验能够相认，再在使用中形成更成熟的方法。\n\n**标准化可以从共同事实和接口开始，不必以压平全部现场判断为代价。** 能被理解的情境与例外，也是一种可积累内容。\n\n## 为什么先要有共同事实\n\n教学烘焙连锁需要比较不同门店的售罄情况。若一家填“卖完时间”，另一家填“库存归零时间”，还有一家把暂时下架也算售罄，表格虽整齐，含义却不一致。\n\n因此需要先说明商品、门店、营业日与状态。例如“正式分配”指中央已确认的安排，“实际到店”指门店收到的数量，二者不能用同一栏代替。这样才知道建议是否真正执行，结果对应哪次行动。\n\n这类一致性让经验可比较，也减少交接中的重复解释。它并不要求每位店长对需求作同样判断。\n\n## 为什么不能过早统一答案\n\n在一组教学条件中，X店需求95个、Y店需求60个。总共生产160个，将分配由80/80改为100/60，可以多满足一些需求。\n\n但换一组独立条件：X附近交通入口关闭，需求变为50个，Y变为90个。同样的100/60会留下更多卖不出的商品。旧答案不能脱离条件复用。\n\n应保留的可能是：怎样识别售罄后的未知需求，怎样使用本地事件，怎样在总产量下比较方案，以及怎样发现原方法不再适用。部分步骤可以统一，具体判断仍需当前事实。\n\n| 适合先统一 | 适合逐步形成 | 应保留情境 |\n|---|---|---|\n| 对象、日期、执行状态的含义 | 常见问题的处理方法 | 事件变化与新例外 |\n| 必须记录的真实动作 | 经过检验的经验条件 | 需求仍未知的部分 |\n| 正式规则与负责者 | 可扩展的评价样例 | 尚有竞争解释的问题 |\n\n这个划分不是固定分类表。随着证据增加，一些情境判断可以形成稳定方法；环境变化后，稳定方法也可能重新进入讨论。\n\n## AI怎样支持尚未完全规则化的经验\n\n过去，经验可以通过师徒与共同实践传递，并非必须先成为SOP。AI的新作用，是帮助更多材料以可承受的成本被组织、比较和带回任务。\n\n比如员工可以保留一个带背景的案例，AI在相似任务中提示相关条件；若当前情况不同，它应帮助识别差别，而不是只推荐最相似的历史答案。多次使用后，团队才更有依据决定哪些条件应成为规则。\n\n上下文工程讨论的是当前任务怎样取得相关信息；组织知识研究讨论经验如何通过表达与实践发展。二者相接，有助于形成“先可理解、再逐步稳定”的方法，而不是把未整理材料直接当成熟标准。[工程材料](https://www.anthropic.com/research/effective-context-engineering-for-ai-agents)、[知识研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)\n\n## 例外要怎样留下，才不会变成各行其是\n\n现场偏离标准时，应能说明偏离的事实、采取的动作和后续结果。例外可以帮助发现规则的适用范围，也可能暴露执行不到位。二者需要分辨。\n\n例如交通信息在决策前已经取得，却没有进入分配，是调用与工作设计的问题；交通在决策后临时变化，则不能用事后信息证明事前判断愚蠢。对这种差别的保留，会直接影响员工是否愿意报告真实情况。\n\n成熟的质量、财务或安全规则仍应按正式要求执行。情境判断应有明确用途，不能成为回避责任的理由。相反，对已知且稳定的工作，每次都重新推理也会浪费资源。\n\n## 一条业务的合理起点\n\n可以先让一笔工作做到：事实能对应，建议与实际动作分开，结果可返回，例外可以被看见。然后观察经验是否帮助下一次判断，再增加真正有用的标准。\n\n这一顺序降低的，是企业必须在采用前把全部经验定义完的负担。它没有承诺自动标准化，却给了企业一种在生产与学习中逐步形成秩序的路径。\n\n当经验开始可比较、可使用，企业仍需选择最值得发展的部分。并不是每项特殊做法都应放大，判断应回到客户认可的价值。\n","exportSingleMd":"# 第10章｜先统一什么，才能让更多经验复用\n\n企业推进标准化时，常遇到两个相反困难。标准太少，同一 。例如设备服务的目标若是减少重复停机，AI自动写工单的价值路径就必须经过事实准确、专业判断、实际处置与后续观察，不能只以记录速度结案。\n\n## 同一个好结果，可能来自不同原因\n\n回到教学烘焙连锁。X店卖得好，可能因为店长判断好，也可能因为位置便利、价格低、某商品特别受欢迎，或者竞争门店暂时缺货。\n\n如果客户主要因位置购买，“熟悉客流”可能帮助减少损失，却不是全部优势。如果客户经常在晚间到店，并因为能买到新鲜商品而持续选择，那么及时供应更可能具有市场意义。\n\n应取得什么证据，也因此不同。可以看客户到店时段、未买到后的行为、选择理由与复购情况，再对照门店条件。不能只问负责人“我们为什么好”，也不能把顾客一句赞扬直接当作稳定购买原因。\n\n| 内部说法 | 更接近客户价值的问题 | 需要排查的另一解释 |\n|---|---|---|\n| 经验丰富 | 是否更少返工、更可靠解决 | 是否只是拿到更容易的任务 |\n| 定制程度高 | 是否更符合客户具体限制 | 是否只是文件更多、交付更慢 |\n| 懂本地客流 | 是否减少未满足需求 | 是否主要来自位置或低价 |\n| 服务很细 | 是否减少客户协调负担 | 是否把必要工作留给客户 |\n\n表格的作用是帮助建立可讨论假设，不是给企业打一个统一分数。\n\n## 通用能力与差异化，并不冲突\n\n企业可能通过同一套成熟软件取得必要能力。若现成工具已能准确登记、提醒和查询，再定制一套并不会天然形成优势。\n\n差异化也不必藏在模型或代码里。它可能来自企业长期理解某类客户、能够协调现场资源，或者能够把高质量判断持续转成交付。通用AI参与这些工作，可以帮助放大组合；独有软件只是可能的组成部分。\n\nTeece的动态能力研究强调，资源需要在变化中保持相关。商业模式研究则进一步连接客户价值、交付与收益。两者都不支持“企业特有，所以一定有用”的跳步。[动态能力](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)、[商业模式](https://www.sciencedirect.com/science/article/pii/S002463010900051X)\n\n## 价值还要能被持续交付\n\n假设客户确实需要更及时恢复。企业靠一位专家全天候救火，能够产生好结果，却可能没有稳定放大的条件。AI如果只帮专家同时收到更多任务，甚至会增加压力。\n\n因此辨认价值之后，还要检查产生价值的成本与约束：是否依赖不可扩张的人力，是否需要特定现场资源，客户愿不愿承担相应价格，企业能否保持质量。\n\n这里要区分“客户认可”与“企业能保留收益”。有些改善会成为行业基本水准，企业需要做到，却未必因此取得溢价。有些独特安排成本过高，也可能不值得扩大。\n\n## 形成一个可用于现场工作的价值假设\n\n可以采用这样的表达：“某类客户在某种处境下，需要取得某项结果；我们怀疑企业的某种判断或协作方式帮助产生这一结果，但位置、价格或任务难度也可能解释，需要进一步比较。”\n\n这段话比口号具体，也没有假装已经知道答案。它为FDE提供了进入现场的方向：接下来要追查价值如何发生，以及为什么当前不能稳定复现。\n\n选择改造对象的依据，因而从“我们有什么特别流程”，转向“哪项客户价值值得发展，哪种企业能力可能支撑它”。\n","html":"\u003ch1>第11章｜企业觉得独特的地方，客户为什么未必买单\u003c/h1>\n\u003cp>企业可能这样描述自己：连锁企业说强项是“店长特别懂本地客流”。一家设备公司说“老师傅经验丰富”。一家专业服务机构说“报告定制程度高”。\u003c/p>\n\u003cp>这些说法都可能真实，却还不能直接决定AI改造方向。客户不一定为经验、复杂度或定制本身付费，他们更可能在意晚间是否买得到、设备能否可靠恢复、经营问题是否得到推进。\u003c/p>\n\u003cp>\u003cstrong>值得系统放大的差异化，应从客户获得的结果辨认，再追到企业怎样产生结果。\u003c/strong> 内部特色是待检验的解释。\u003c/p>\n\u003ch2 id=\"lesson-11-section-1\">把形容词翻译成客户处境\u003c/h2>\n\u003cp>“响应快”需要说明从哪里算到哪里。客服快速回复，与现场人员及时到达不同；到达也不等于客户恢复使用。\u003c/p>\n\u003cp>“懂需求”也有多种含义。能够快速读懂材料，能够识别客户没有说清的限制，能够提供更合适的方案，或者能够可靠履约，可能分别来自不同能力。\u003c/p>\n\u003cp>把形容词改成具体客户处境，可以避免团队各自按熟悉方式理解。例如设备服务的目标若是减少重复停机，AI自动写工单的价值路径就必须经过事实准确、专业判断、实际处置与后续观察，不能只以记录速度结案。\u003c/p>\n\u003ch2 id=\"lesson-11-section-2\">同一个好结果，可能来自不同原因\u003c/h2>\n\u003cp>回到教学烘焙连锁。X店卖得好，可能因为店长判断好，也可能因为位置便利、价格低、某商品特别受欢迎，或者竞争门店暂时缺货。\u003c/p>\n\u003cp>如果客户主要因位置购买，“熟悉客流”可能帮助减少损失，却不是全部优势。如果客户经常在晚间到店，并因为能买到新鲜商品而持续选择，那么及时供应更可能具有市场意义。\u003c/p>\n\u003cp>应取得什么证据，也因此不同。可以看客户到店时段、未买到后的行为、选择理由与复购情况，再对照门店条件。不能只问负责人“我们为什么好”，也不能把顾客一句赞扬直接当作稳定购买原因。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>内部说法\u003c/th>\n\u003cth>更接近客户价值的问题\u003c/th>\n\u003cth>需要排查的另一解释\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>经验丰富\u003c/td>\n\u003ctd>是否更少返工、更可靠解决\u003c/td>\n\u003ctd>是否只是拿到更容易的任务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>定制程度高\u003c/td>\n\u003ctd>是否更符合客户具体限制\u003c/td>\n\u003ctd>是否只是文件更多、交付更慢\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>懂本地客流\u003c/td>\n\u003ctd>是否减少未满足需求\u003c/td>\n\u003ctd>是否主要来自位置或低价\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>服务很细\u003c/td>\n\u003ctd>是否减少客户协调负担\u003c/td>\n\u003ctd>是否把必要工作留给客户\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>表格的作用是帮助建立可讨论假设，不是给企业打一个统一分数。\u003c/p>\n\u003ch2 id=\"lesson-11-section-3\">通用能力与差异化，并不冲突\u003c/h2>\n\u003cp>企业可能通过同一套成熟软件取得必要能力。若现成工具已能准确登记、提醒和查询，再定制一套并不会天然形成优势。\u003c/p>\n\u003cp>差异化也不必藏在模型或代码里。它可能来自企业长期理解某类客户、能够协调现场资源，或者能够把高质量判断持续转成交付。通用AI参与这些工作，可以帮助放大组合；独有软件只是可能的组成部分。\u003c/p>\n\u003cp>Teece的动态能力研究强调，资源需要在变化中保持相关。商业模式研究则进一步连接客户价值、交付与收益。两者都不支持“企业特有，所以一定有用”的跳步。\u003ca href=\"https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">动态能力\u003c/a>、\u003ca href=\"https://www.sciencedirect.com/science/article/pii/S002463010900051X\" target=\"_blank\" rel=\"noopener noreferrer\">商业模式\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-11-section-4\">价值还要能被持续交付\u003c/h2>\n\u003cp>假设客户确实需要更及时恢复。企业靠一位专家全天候救火，能够产生好结果，却可能没有稳定放大的条件。AI如果只帮专家同时收到更多任务，甚至会增加压力。\u003c/p>\n\u003cp>因此辨认价值之后，还要检查产生价值的成本与约束：是否依赖不可扩张的人力，是否需要特定现场资源，客户愿不愿承担相应价格，企业能否保持质量。\u003c/p>\n\u003cp>这里要区分“客户认可”与“企业能保留收益”。有些改善会成为行业基本水准，企业需要做到，却未必因此取得溢价。有些独特安排成本过高，也可能不值得扩大。\u003c/p>\n\u003ch2 id=\"lesson-11-section-5\">形成一个可用于现场工作的价值假设\u003c/h2>\n\u003cp>可以采用这样的表达：“某类客户在某种处境下，需要取得某项结果；我们怀疑企业的某种判断或协作方式帮助产生这一结果，但位置、价格或任务难度也可能解释，需要进一步比较。”\u003c/p>\n\u003cp>这段话比口号具体，也没有假装已经知道答案。它为FDE提供了进入现场的方向：接下来要追查价值如何发生，以及为什么当前不能稳定复现。\u003c/p>\n\u003cp>选择改造对象的依据，因而从“我们有什么特别流程”，转向“哪项客户价值值得发展，哪种企业能力可能支撑它”。\u003c/p>\n","headings":[{"id":"lesson-11-section-1","label":"把形容词翻译成客户处境"},{"id":"lesson-11-section-2","label":"同一个好结果，可能来自不同原因"},{"id":"lesson-11-section-3","label":"通用能力与差异化，并不冲突"},{"id":"lesson-11-section-4","label":"价值还要能被持续交付"},{"id":"lesson-11-section-5","label":"形成一个可用于现场工作的价值假设"}],"exportMd":"# 第11章｜企业觉得独特的地方，客户为什么未必买单\n\n企业可能这样描述自己：连锁企业说强项是“店长特别懂本地客流”。一家设备公司说“老师傅经验丰富”。一家专业服务机构说“报告定制程度高”。\n\n这些说法都可能真实，却还不能直接决定AI改造方向。客户不一定为经验、复杂度或定制本身付费，他们更可能在意晚间是否买得到、设备能否可靠恢复、经营问题是否得到推进。\n\n**值得系统放大的差异化，应从客户获得的结果辨认，再追到企业怎样产生结果。** 内部特色是待检验的解释。\n\n## 把形容词翻译成客户处境\n\n“响应快”需要说明从哪里算到哪里。客服快速回复，与现场人员及时到达不同；到达也不等于客户恢复使用。\n\n“懂需求”也有多种含义。能够快速读懂材料，能够识别客户没有说清的限制，能够提供更合适的方案，或者能够可靠履约，可能分别来自不同能力。\n\n把形容词改成具体客户处境，可以避免团队各自按熟悉方式理解。例如设备服务的目标若是减少重复停机，AI自动写工单的价值路径就必须经过事实准确、专业判断、实际处置与后续观察，不能只以记录速度结案。\n\n## 同一个好结果，可能来自不同原因\n\n回到教学烘焙连锁。X店卖得好，可能因为店长判断好，也可能因为位置便利、价格低、某商品特别受欢迎，或者竞争门店暂时缺货。\n\n如果客户主要因位置购买，“熟悉客流”可能帮助减少损失，却不是全部优势。如果客户经常在晚间到店，并因为能买到新鲜商品而持续选择，那么及时供应更可能具有市场意义。\n\n应取得什么证据，也因此不同。可以看客户到店时段、未买到后的行为、选择理由与复购情况，再对照门店条件。不能只问负责人“我们为什么好”，也不能把顾客一句赞扬直接当作稳定购买原因。\n\n| 内部说法 | 更接近客户价值的问题 | 需要排查的另一解释 |\n|---|---|---|\n| 经验丰富 | 是否更少返工、更可靠解决 | 是否只是拿到更容易的任务 |\n| 定制程度高 | 是否更符合客户具体限制 | 是否只是文件更多、交付更慢 |\n| 懂本地客流 | 是否减少未满足需求 | 是否主要来自位置或低价 |\n| 服务很细 | 是否减少客户协调负担 | 是否把必要工作留给客户 |\n\n表格的作用是帮助建立可讨论假设，不是给企业打一个统一分数。\n\n## 通用能力与差异化，并不冲突\n\n企业可能通过同一套成熟软件取得必要能力。若现成工具已能准确登记、提醒和查询，再定制一套并不会天然形成优势。\n\n差异化也不必藏在模型或代码里。它可能来自企业长期理解某类客户、能够协调现场资源，或者能够把高质量判断持续转成交付。通用AI参与这些工作，可以帮助放大组合；独有软件只是可能的组成部分。\n\nTeece的动态能力研究强调，资源需要在变化中保持相关。商业模式研究则进一步连接客户价值、交付与收益。两者都不支持“企业特有，所以一定有用”的跳步。[动态能力](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)、[商业模式](https://www.sciencedirect.com/science/article/pii/S002463010900051X)\n\n## 价值还要能被持续交付\n\n假设客户确实需要更及时恢复。企业靠一位专家全天候救火，能够产生好结果，却可能没有稳定放大的条件。AI如果只帮专家同时收到更多任务，甚至会增加压力。\n\n因此辨认价值之后，还要检查产生价值的成本与约束：是否依赖不可扩张的人力，是否需要特定现场资源，客户愿不愿承担相应价格，企业能否保持质量。\n\n这里要区分“客户认可”与“企业能保留收益”。有些改善会成为行业基本水准，企业需要做到，却未必因此取得溢价。有些独特安排成本过高，也可能不值得扩大。\n\n## 形成一个可用于现场工作的价值假设\n\n可以采用这样的表达：“某类客户在某种处境下，需要取得某项结果；我们怀疑企业的某种判断或协作方式帮助产生这一结果，但位置、价格或任务难度也可能解释，需要进一步比较。”\n\n这段话比口号具体，也没有假装已经知道答案。它为FDE提供了进入现场的方向：接下来要追查价值如何发生，以及为什么当前不能稳定复现。\n\n选择改造对象的依据，因而从“我们有什么特别流程”，转向“哪项客户价值值得发展，哪种企业能力可能支撑它”。\n","exportSingleMd":"# 第11章｜企业觉得独特的地方，客户为什么未必买单\n\n企业可能这样描述自己：连锁企业说强项是“店长特别懂本地客流”。一家设备公司说“老师傅经验丰富”。一家专业服务机构说“报告定制程度高”。\n\n这些说法都可能真实，却还不能直接决定AI改造方向。客户不一定为经验、复杂度或定制本身付费，他们更可能在意晚间是否买得到、设备能否可靠恢复、经营问题是否得到推进。\n\n**值得系统放大的差异化，应从客户获得的结果辨认，再追到企业怎样产生结果。** 内部特色是待检验的解释。\n\n## 把形容词翻译成客户处境\n\n“响应快”需要说明从哪里算到哪里。客服快速回复，与现场人员及时到达不同；到达也不等于客户恢复使用。\n\n“懂需求”也有多种含义。能够快速读懂材料，能够识别客户没有说清的限制，能够提供更合适的方案，或者能够可靠履约，可能分别来自不同能力。\n\n把形容词改成具体客户处境，可以避免团队各自按熟悉方式理解。例如设备服务的目标若是减少重复停机，AI自动写工单的价值路径就必须经过事实准确、专业判断、实际处置与后续观察，不能只以记录速度结案。\n\n## 同一个好结果，可能来自不同原因\n\n回到教学烘焙连锁。X店卖得好，可能因为店长判断好，也可能因为位置便利、价格低、某商品特别受欢迎，或者竞争门店暂时缺货。\n\n如果客户主要因位置购买，“熟悉客流”可能帮助减少损失，却不是全部优势。如果客户经常在晚间到店，并因为能买到新鲜商品而持续选择，那么及时供应更可能具有市场意义。\n\n应取得什么证据，也因此不同。可以看客户到店时段、未买到后的行为、选择理由与复购情况，再对照门店条件。不能只问负责人“我们为什么好”，也不能把顾客一句赞扬直接当作稳定购买原因。\n\n| 内部说法 | 更接近客户价值的问题 | 需要排查的另一解释 |\n|---|---|---|\n| 经验丰富 | 是否更少返工、更可靠解决 | 是否只是拿到更容易的任务 |\n| 定制程度高 | 是否更符合客户具体限制 | 是否只是文件更多、交付更慢 |\n| 懂本地客流 | 是否减少未满足需求 | 是否主要来自位置或低价 |\n| 服务很细 | 是否减少客户协调负担 | 是否把必要工作留给客户 |\n\n表格的作用是帮助建立可讨论假设，不是给企业打一个统一分数。\n\n## 通用能力与差异化，并不冲突\n\n企业可能通过同一套成熟软件取得必要能力。若现成工具已能准确登记、提醒和查询，再定制一套并不会天然形成优势。\n\n差异化也不必藏在模型或代码里。它可能来自企业长期理解某类客户、能够协调现场资源，或者能够把高质量判断持续转成交付。通用AI参与这些工作，可以帮助放大组合；独有软件只是可能的组成部分。\n\nTeece的动态能力研究强调，资源需要在变化中保持相关。商业模式研究则进一步连接客户价值、交付与收益。两者都不支持“企业特有，所以一定有用”的跳步。[动态能力](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)、[商业模式](https://www.sciencedirect.com/science/article/pii/S002463010900051X)\n\n## 价值还要能被持续交付\n\n假设客户确实需要更及时恢复。企业靠一位专家全天候救火，能够产生好结果，却可能没有稳定放大的条件。AI如果只帮专家同时收到更多任务，甚至会增加压力。\n\n因此辨认价值之后，还要检查产生价值的成本与约束：是否依赖不可扩张的人力，是否需要特定现场资源，客户愿不愿承担相应价格，企业能否保持质量。\n\n这里要区分“客户认可”与“企业能保留收益”。有些改善会成为行业基本水准，企业需要做到，却未必因此取得溢价。有些独特安排成本过高，也可能不值得扩大。\n\n## 形成一个可用于现场工作的价值假设\n\n可以采用这样的表达：“某类客户在某种处境下，需要取得某项结果；我们怀疑企业的某种判断或协作方式帮助产生这一结果，但位置、价格或任务难度也可能解释，需要进一步比较。”\n\n这段话比口号具体，也没有假装已经知道答案。它为FDE提供了进入现场的方向：接下来要追查价值如何发生，以及为什么当前不能稳定复现。\n\n选择改造对象的依据，因而从“我们有什么特别流程”，转向“哪项客户价值值得发展，哪种企业能力可能支撑它”。\n","text":"# 第11章｜企业觉得独特的地方，客户为什么未必买单\n\n企业可能这样描述自己：连锁企业说强项是“店长特别懂本地客流”。一家设备公司说“老师傅经验丰富”。一家专业服务机构说“报告定制程度高”。\n\n这些说法都可能真实，却还不能直接决定AI改造方向。客户不一定为经验、复杂度或定制本身付费，他们更可能在意晚间是否买得到、设备能否可靠恢复、经营问题是否得到推进。\n\n**值得系统放大的差异化，应从客户获得的结果辨认，再追到企业怎样产生结果。** 内部特色是待检验的解释。\n\n## 把形容词翻译成客户处境\n\n“响应快”需要说明从哪里算到哪里。客服快速回复，与现场人员及时到达不同；到达也不等于客户恢复使用。\n\n“懂需求”也有多种含义。能够快速读懂材料，能够识别客户没有说清的限制，能够提供更合适的方案，或者能够可靠履约，可能分别来自不同能力。\n\n把形容词改成具体客户处境，可以避免团队各自按熟悉方式理解。例如设备服务的目标若是减少重复停机，AI自动写工单的价值路径就必须经过事实准确、专业判断、实际处置与后续观察，不能只以记录速度结案。\n\n## 同一个好结果，可能来自不同原因\n\n回到教学烘焙连锁。X店卖得好，可能因为店长判断好，也可能因为位置便利、价格低、某商品特别受欢迎，或者竞争门店暂时缺货。\n\n如果客户主要因位置购买，“熟悉客流”可能帮助减少损失，却不是全部优势。如果客户经常在晚间到店，并因为能买到新鲜商品而持续选择，那么及时供应更可能具有市场意义。\n\n应取得什么证据，也因此不同。可以看客户到店时段、未买到后的行为、选择理由与复购情况，再对照门店条件。不能只问负责人“我们为什么好”，也不能把顾客一句赞扬直接当作稳定购买原因。\n\n| 内部说法 | 更接近客户价值的问题 | 需要排查的另一解释 |\n|---|---|---|\n| 经验丰富 | 是否更少返工、更可靠解决 | 是否只是拿到更容易的任务 |\n| 定制程度高 | 是否更符合客户具体限制 | 是否只是文件更多、交付更慢 |\n| 懂本地客流 | 是否减少未满足需求 | 是否主要来自位置或低价 |\n| 服务很细 | 是否减少客户协调负担 | 是否把必要工作留给客户 |\n\n表格的作用是帮助建立可讨论假设，不是给企业打一个统一分数。\n\n## 通用能力与差异化，并不冲突\n\n企业可能通过同一套成熟软件取得必要能力。若现成工具已能准确登记、提醒和查询，再定制一套并不会天然形成优势。\n\n差异化也不必藏在模型或代码里。它可能来自企业长期理解某类客户、能够协调现场资源，或者能够把高质量判断持续转成交付。通用AI参与这些工作，可以帮助放大组合；独有软件只是可能的组成部分。\n\nTeece的动态能力研究强调，资源需要在变化中保持相关。商业模式研究则进一步连接客户价值、交付与收益。两者都不支持“企业特有，所以一定有用”的跳步。动态能力、商业模式\n\n## 价值还要能被持续交付\n\n假设客户确实需要更及时恢复。企业靠一位专家全天候救火，能够产生好结果，却可能没有稳定放大的条件。AI如果只帮专家同时收到更多任务，甚至会增加压力。\n\n因此辨认价值之后，还要检查产生价值的成本与约束：是否依赖不可扩张的人力，是否需要特定现场资源，客户愿不愿承担相应价格，企业能否保持质量。\n\n这里要区分“客户认可”与“企业能保留收益”。有些改善会成为行业基本水准，企业需要做到，却未必因此取得溢价。有些独特安排成本过高，也可能不值得扩大。\n\n## 形成一个可用于现场工作的价值假设\n\n可以采用这样的表达：“某类客户在某种处境下，需要取得某项结果；我们怀疑企业的某种判断或协作方式帮助产生这一结果，但位置、价格或任务难度也可能解释，需要进一步比较。”\n\n这段话比口号具体，也没有假装已经知道答案。它为FDE提供了进入现场的方向：接下来要追查价值如何发生，以及为什么当前不能稳定复现。\n\n选择改造对象的依据，因而从“我们有什么特别流程”，转向“哪项客户价值值得发展，哪种企业能力可能支撑它”。\n"},{"file":"12-优势的生成机制.md","id":"lesson-12","number":12,"role":"核心课","part":2,"title":"第12章｜从好结果追到现场，优势究竟怎样发生","md":"# 第12章｜从好结果追到现场，优势究竟怎样发生\n\n在设备售后教学案例中，两张工单都在当天关闭。第一张处理后客户持续恢复使用；第二张只是客服先关闭，客户第二天重新报修。若只看关闭速度，两者都像表现良好。\n\n要理解企业真正的服务能力，必须追到“关闭”之前和之后：谁看到了什么，作出什么判断，实际采取了什么动作，客户获得了什么结果。\n\n**现场诊断的对象，是价值生成的机制，而非一串痛点或功能愿望。** 机制解释了条件如何通过行动影响结果，也指出扩大能力时会遇到什么约束。\n\n## 从一个结果，拆出不同路径\n\n“当天关闭”至少可能由三条路径产生：问题容易，普通流程已足够；专家识别了关键条件，减少无效处理；评价压力使工单提前结束。三条路径对应完全不同的改造。\n\n如果容易任务多，平均速度不能证明专家方法值得复制。如果关键判断有效，应研究它依赖哪些材料，能否帮助更多人。如果提前关闭来自考核，增加自动化可能只是更快制造好看的状态。\n\n这要求把表现不同的实际任务放在一起，既看好结果，也看反例。需要比较的不是人物标签，而是当时条件、信息、动作与后续结果。\n\n## 逐层追到产生差别的地方\n\n先明确客户结果。设备是否恢复，是否复发，客户是否还要反复协调？再看实际工作：报修材料怎样进入专业判断，技术员怎样取得支持，调度是否提供了合适资源。\n\n随后检查判断当时可见的信息。不能用事后知道的原因评价当时所有决定，也不能把事后解释当作原来的真实依据。\n\n最后检查约束。即使判断正确，缺少备件、现场人员或客户配合，也可能无法交付。此时继续优化模型回答，作用可能很有限。\n\n| 要辨认的原因 | 可帮助区分的材料 | 可能改变的工作 |\n|---|---|---|\n| 事实缺失 | 原始描述与反复补问 | 采集与资料入口 |\n| 判断方法不同 | 相近任务的动作与依据 | 经验组织、工具或专业支持 |\n| 交接断裂 | 建议、采用与执行记录 | 协作状态与责任 |\n| 资源受限 | 可用人员、时间和实际等待 | 排班、供应或服务承诺 |\n| 评价扭曲 | 关闭与恢复、复发之间的差别 | 岗位目标与反馈 |\n\n同一任务可能同时存在几种原因。这个分解帮助团队避免把所有问题交给一个技术功能。\n\n## 一个真实案例，说明现场机制如何改变工程\n\nZara库存分配研究中，某些关键尺码缺货会使整款商品停止展示。于是库存不是“剩下几件就还能卖几件”的简单问题，尺码组合影响商品能否继续被顾客看到。\n\n研究者把这种现场规则纳入分配方法，并与实际流程和部署结合。重要启发是，问题形式会被业务机制改变：如果先套一个通用库存公式，再把现场当作参数填进去，可能遗漏真正决定结果的关系。[原始案例](https://web.mit.edu/people/jgallien/ZaraOR2010.pdf)\n\n这是传统运筹与数字化实施案例，不是生成式AI项目。它仍然与FDE课程相关，因为现场认识进入工程这件事，早已有专业价值；新AI应说明自己增加了什么能力。\n\n## 为什么痛点清单不够\n\n“信息不通”“员工效率低”“知识没沉淀”都可能是真实感受，却把多种原因装进一个词。不同团队会按熟悉方式作答：做知识库、加表单、换模型、做看板。\n\n如果诊断能进一步说清“客户描述中的版本信息没有进入技术判断，技术员因此重复补问；原系统已有字段但未与工单关联”，工程选择就更具体。若发现补问其实是人员无时间响应，问题又会改变。\n\n专业内核在于解释差别如何产生，而非使用更多术语。FDE需要把这个解释做成可试的安排，再由真实工作挑战它。\n\n## 诊断的产物应是什么\n\n一项有用的现场认识，应包含：值得发展的客户结果，至少一种价值生成解释，仍在竞争的其他解释，限制复现的环节，以及什么观察会改变当前判断。\n\n它不要求第一次就找到唯一原因。相反，清楚知道自己在哪一段还不知道，会使下一次现场工作更有方向。找到机制之后，才有条件讨论怎样把有效方法放大到更多任务与人员。\n","html":"\u003ch1>第12章｜从好结果追到现场，优势究竟怎样发生\u003c/h1>\n\u003cp>在设备售后教学案例中，两张工单都在当天关闭。第一张处理后客户持续恢复使用；第二张只是客服先关闭，客户第二天重新报修。若只看关闭速度，两者都像表现良好。\u003c/p>\n\u003cp>要理解企业真正的服务能力，必须追到“关闭”之前和之后：谁看到了什么，作出什么判断，实际采取了什么动作，客户获得了什么结果。\u003c/p>\n\u003cp>\u003cstrong>现场诊断的对象，是价值生成的机制，而非一串痛点或功能愿望。\u003c/strong> 机制解释了条件如何通过行动影响结果，也指出扩大能力时会遇到什么约束。\u003c/p>\n\u003ch2 id=\"lesson-12-section-1\">从一个结果，拆出不同路径\u003c/h2>\n\u003cp>“当天关闭”至少可能由三条路径产生：问题容易，普通流程已足够；专家识别了关键条件，减少无效处理；评价压力使工单提前结束。三条路径对应完全不同的改造。\u003c/p>\n\u003cp>如果容易任务多，平均速度不能证明专家方法值得复制。如果关键判断有效，应研究它依赖哪些材料，能否帮助更多人。如果提前关闭来自考核，增加自动化可能只是更快制造好看的状态。\u003c/p>\n\u003cp>这要求把表现不同的实际任务放在一起，既看好结果，也看反例。需要比较的不是人物标签，而是当时条件、信息、动作与后续结果。\u003c/p>\n\u003ch2 id=\"lesson-12-section-2\">逐层追到产生差别的地方\u003c/h2>\n\u003cp>先明确客户结果。设备是否恢复，是否复发，客户是否还要反复协调？再看实际工作：报修材料怎样进入专业判断，技术员怎样取得支持，调度是否提供了合适资源。\u003c/p>\n\u003cp>随后检查判断当时可见的信息。不能用事后知道的原因评价当时所有决定，也不能把事后解释当作原来的真实依据。\u003c/p>\n\u003cp>最后检查约束。即使判断正确，缺少备件、现场人员或客户配合，也可能无法交付。此时继续优化模型回答，作用可能很有限。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>要辨认的原因\u003c/th>\n\u003cth>可帮助区分的材料\u003c/th>\n\u003cth>可能改变的工作\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>事实缺失\u003c/td>\n\u003ctd>原始描述与反复补问\u003c/td>\n\u003ctd>采集与资料入口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>判断方法不同\u003c/td>\n\u003ctd>相近任务的动作与依据\u003c/td>\n\u003ctd>经验组织、工具或专业支持\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>交接断裂\u003c/td>\n\u003ctd>建议、采用与执行记录\u003c/td>\n\u003ctd>协作状态与责任\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>资源受限\u003c/td>\n\u003ctd>可用人员、时间和实际等待\u003c/td>\n\u003ctd>排班、供应或服务承诺\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>评价扭曲\u003c/td>\n\u003ctd>关闭与恢复、复发之间的差别\u003c/td>\n\u003ctd>岗位目标与反馈\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>同一任务可能同时存在几种原因。这个分解帮助团队避免把所有问题交给一个技术功能。\u003c/p>\n\u003ch2 id=\"lesson-12-section-3\">一个真实案例，说明现场机制如何改变工程\u003c/h2>\n\u003cp>Zara库存分配研究中，某些关键尺码缺货会使整款商品停止展示。于是库存不是“剩下几件就还能卖几件”的简单问题，尺码组合影响商品能否继续被顾客看到。\u003c/p>\n\u003cp>研究者把这种现场规则纳入分配方法，并与实际流程和部署结合。重要启发是，问题形式会被业务机制改变：如果先套一个通用库存公式，再把现场当作参数填进去，可能遗漏真正决定结果的关系。\u003ca href=\"https://web.mit.edu/people/jgallien/ZaraOR2010.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始案例\u003c/a>\u003c/p>\n\u003cp>这是传统运筹与数字化实施案例，不是生成式AI项目。它仍然与FDE课程相关，因为现场认识进入工程这件事，早已有专业价值；新AI应说明自己增加了什么能力。\u003c/p>\n\u003ch2 id=\"lesson-12-section-4\">为什么痛点清单不够\u003c/h2>\n\u003cp>“信息不通”“员工效率低”“知识没沉淀”都可能是真实感受，却把多种原因装进一个词。不同团队会按熟悉方式作答：做知识库、加表单、换模型、做看板。\u003c/p>\n\u003cp>如果诊断能进一步说清“客户描述中的版本信息没有进入技术判断，技术员因此重复补问；原系统已有字段但未与工单关联”，工程选择就更具体。若发现补问其实是人员无时间响应，问题又会改变。\u003c/p>\n\u003cp>专业内核在于解释差别如何产生，而非使用更多术语。FDE需要把这个解释做成可试的安排，再由真实工作挑战它。\u003c/p>\n\u003ch2 id=\"lesson-12-section-5\">诊断的产物应是什么\u003c/h2>\n\u003cp>一项有用的现场认识，应包含：值得发展的客户结果，至少一种价值生成解释，仍在竞争的其他解释，限制复现的环节，以及什么观察会改变当前判断。\u003c/p>\n\u003cp>它不要求第一次就找到唯一原因。相反，清楚知道自己在哪一段还不知道，会使下一次现场工作更有方向。找到机制之后，才有条件讨论怎样把有效方法放大到更多任务与人员。\u003c/p>\n","headings":[{"id":"lesson-12-section-1","label":"从一个结果，拆出不同路径"},{"id":"lesson-12-section-2","label":"逐层追到产生差别的地方"},{"id":"lesson-12-section-3","label":"一个真实案例，说明现场机制如何改变工程"},{"id":"lesson-12-section-4","label":"为什么痛点清单不够"},{"id":"lesson-12-section-5","label":"诊断的产物应是什么"}],"exportMd":"# 第12章｜从好结果追到现场，优势究竟怎样发生\n\n在设备售后教学案例中，两张工单都在当天关闭。第一张处理后客户持续恢复使用；第二张只是客服先关闭，客户第二天重新报修。若只看关闭速度，两者都像表现良好。\n\n要理解企业真正的服务能力，必须追到“关闭”之前和之后：谁看到了什么，作出什么判断，实际采取了什么动作，客户获得了什么结果。\n\n**现场诊断的对象，是价值生成的机制，而非一串痛点或功能愿望。** 机制解释了条件如何通过行动影响结果，也指出扩大能力时会遇到什么约束。\n\n## 从一个结果，拆出不同路径\n\n“当天关闭”至少可能由三条路径产生：问题容易，普通流程已足够；专家识别了关键条件，减少无效处理；评价压力使工单提前结束。三条路径对应完全不同的改造。\n\n如果容易任务多，平均速度不能证明专家方法值得复制。如果关键判断有效，应研究它依赖哪些材料，能否帮助更多人。如果提前关闭来自考核，增加自动化可能只是更快制造好看的状态。\n\n这要求把表现不同的实际任务放在一起，既看好结果，也看反例。需要比较的不是人物标签，而是当时条件、信息、动作与后续结果。\n\n## 逐层追到产生差别的地方\n\n先明确客户结果。设备是否恢复，是否复发，客户是否还要反复协调？再看实际工作：报修材料怎样进入专业判断，技术员怎样取得支持，调度是否提供了合适资源。\n\n随后检查判断当时可见的信息。不能用事后知道的原因评价当时所有决定，也不能把事后解释当作原来的真实依据。\n\n最后检查约束。即使判断正确，缺少备件、现场人员或客户配合，也可能无法交付。此时继续优化模型回答，作用可能很有限。\n\n| 要辨认的原因 | 可帮助区分的材料 | 可能改变的工作 |\n|---|---|---|\n| 事实缺失 | 原始描述与反复补问 | 采集与资料入口 |\n| 判断方法不同 | 相近任务的动作与依据 | 经验组织、工具或专业支持 |\n| 交接断裂 | 建议、采用与执行记录 | 协作状态与责任 |\n| 资源受限 | 可用人员、时间和实际等待 | 排班、供应或服务承诺 |\n| 评价扭曲 | 关闭与恢复、复发之间的差别 | 岗位目标与反馈 |\n\n同一任务可能同时存在几种原因。这个分解帮助团队避免把所有问题交给一个技术功能。\n\n## 一个真实案例，说明现场机制如何改变工程\n\nZara库存分配研究中，某些关键尺码缺货会使整款商品停止展示。于是库存不是“剩下几件就还能卖几件”的简单问题，尺码组合影响商品能否继续被顾客看到。\n\n研究者把这种现场规则纳入分配方法，并与实际流程和部署结合。重要启发是，问题形式会被业务机制改变：如果先套一个通用库存公式，再把现场当作参数填进去，可能遗漏真正决定结果的关系。[原始案例](https://web.mit.edu/people/jgallien/ZaraOR2010.pdf)\n\n这是传统运筹与数字化实施案例，不是生成式AI项目。它仍然与FDE课程相关，因为现场认识进入工程这件事，早已有专业价值；新AI应说明自己增加了什么能力。\n\n## 为什么痛点清单不够\n\n“信息不通”“员工效率低”“知识没沉淀”都可能是真实感受，却把多种原因装进一个词。不同团队会按熟悉方式作答：做知识库、加表单、换模型、做看板。\n\n如果诊断能进一步说清“客户描述中的版本信息没有进入技术判断，技术员因此重复补问；原系统已有字段但未与工单关联”，工程选择就更具体。若发现补问其实是人员无时间响应，问题又会改变。\n\n专业内核在于解释差别如何产生，而非使用更多术语。FDE需要把这个解释做成可试的安排，再由真实工作挑战它。\n\n## 诊断的产物应是什么\n\n一项有用的现场认识，应包含：值得发展的客户结果，至少一种价值生成解释，仍在竞争的其他解释，限制复现的环节，以及什么观察会改变当前判断。\n\n它不要求第一次就找到唯一原因。相反，清楚知道自己在哪一段还不知道，会使下一次现场工作更有方向。找到机制之后，才有条件讨论怎样把有效方法放大到更多任务与人员。\n","exportSingleMd":"# 第12章｜从好结果追到现场，优势究竟怎样发生\n\n在设备售后教学案例中，两张工单都在当天关闭。第一张处理后客户持续恢复使用；第二张只是客服先关闭，客户第二天重新报修。若只看关闭速度，两者都像表现良好。\n\n要理解企业真正的服务能力，必须追到“关闭”之前和之后：谁看到了什么，作出什么判断，实际采取了什么动作，客户获得了什么结果。\n\n**现场诊断的对象，是价值生成的机制，而非一串痛点或功能愿望。** 机制解释了条件如何通过行动影响结果，也指出扩大能力时会遇到什么约束。\n\n## 从一个结果，拆出不同路径\n\n“当天关闭”至少可能由三条路径产生：问题容易，普通流程已足够；专家识别了关键条件，减少无效处理；评价压力使工单提前结束。三条路径对应完全不同的改造。\n\n如果容易任务多，平均速度不能证明专家方法值得复制。如果关键判断有效，应研究它依赖哪些材料，能否帮助更多人。如果提前关闭来自考核，增加自动化可能只是更快制造好看的状态。\n\n这要求把表现不同的实际任务放在一起，既看好结果，也看反例。需要比较的不是人物标签，而是当时条件、信息、动作与后续结果。\n\n## 逐层追到产生差别的地方\n\n先明确客户结果。设备是否恢复，是否复发，客户是否还要反复协调？再看实际工作：报修材料怎样进入专业判断，技术员怎样取得支持，调度是否提供了合适资源。\n\n随后检查判断当时可见的信息。不能用事后知道的原因评价当时所有决定，也不能把事后解释当作原来的真实依据。\n\n最后检查约束。即使判断正确，缺少备件、现场人员或客户配合，也可能无法交付。此时继续优化模型回答，作用可能很有限。\n\n| 要辨认的原因 | 可帮助区分的材料 | 可能改变的工作 |\n|---|---|---|\n| 事实缺失 | 原始描述与反复补问 | 采集与资料入口 |\n| 判断方法不同 | 相近任务的动作与依据 | 经验组织、工具或专业支持 |\n| 交接断裂 | 建议、采用与执行记录 | 协作状态与责任 |\n| 资源受限 | 可用人员、时间和实际等待 | 排班、供应或服务承诺 |\n| 评价扭曲 | 关闭与恢复、复发之间的差别 | 岗位目标与反馈 |\n\n同一任务可能同时存在几种原因。这个分解帮助团队避免把所有问题交给一个技术功能。\n\n## 一个真实案例，说明现场机制如何改变工程\n\nZara库存分配研究中，某些关键尺码缺货会使整款商品停止展示。于是库存不是“剩下几件就还 库、加表单、换模型、做看板。\n\n如果诊断能进一步说清“客户描述中的版本信息没有进入技术判断，技术员因此重复补问；原系统已有字段但未与工单关联”，工程选择就更具体。若发现补问其实是人员无时间响应，问题又会改变。\n\n专业内核在于解释差别如何产生，而非使用更多术语。FDE需要把这个解释做成可试的安排，再由真实工作挑战它。\n\n## 诊断的产物应是什么\n\n一项有用的现场认识，应包含：值得发展的客户结果，至少一种价值生成解释，仍在竞争的其他解释，限制复现的环节，以及什么观察会改变当前判断。\n\n它不要求第一次就找到唯一原因。相反，清楚知道自己在哪一段还不知道，会使下一次现场工作更有方向。找到机制之后，才有条件讨论怎样把有效方法放大到更多任务与人员。\n"},{"file":"13-系统化放大优势.md","id":"lesson-13","number":13,"role":"核心课","part":2,"title":"第13章｜放大优势，要同时扩大判断、执行与纠错","md":"# 第13章｜放大优势，要同时扩大判断、执行与纠错\n\n教学设备企业的资深技术员，经常能从客户的零散描述里抓到关键线索。企业希望用AI整理他的工单，让其他技术员也能更快判断。\n\n如果只把结论写成操作手册，可能丢失适用条件；如果把全部任务都转给这位专家复核，他会成为新的瓶颈；如果建议正确却没有现场资源，客户结果仍不会改善。\n\n**优势的系统化放大，需要有效判断能传播、行动有条件发生、结果能持续修正方法。** 三者共同成立，才能从少数人的好表现发展为更稳定的企业能力。\n\n## 先分清优势中哪些东西可以扩展\n\n专家可能拥有可表达的判断线索，也可能依赖长期形成的现场感知、特定工具和协作关系。不同部分需要不同放大方式。\n\n可表达经验可以组织成案例与方法；重复资料工作可以交给AI；依赖身体操作的技能可能仍需带教；稀缺工具与人员则需要真实资源安排。把它们全部称为“知识”，容易高估一个文档系统能够承担的作用。\n\n软件客服的实地研究显示，AI建议能够帮助不同经验员工，作用却并不均匀。它为经验扩散提供了现实参照，也提醒企业不能假定统一建议对每个人都同样有用。[研究原文](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)\n\n## 让方法进入工作，而不只进入资料库\n\n在教学设备案例中，新技术员处理工单时，AI可以带回相关历史，提示版本差异和关键缺项。这样经验与当前问题在工作入口相遇，人员不必先知道某篇资料叫什么。\n\n方法仍需要合适状态：已经验证、暂作线索、某版本不适用。它还应能追到依据，方便专业人员检查。被采用后的实际动作与结果再返回，才能知道方法是否真的有帮助。\n\n![有效方法通过共同入口进入多项任务；每项任务仍需实际执行资源，结果再回到共同方法。传播、履约与修订共同支持扩大能力。](assets/13-放大优势.svg)\n\n## 扩大建议量，为什么可能压低整体能力\n\n假设AI能为更多工单产生建议，专家却仍逐张核验。上游数量增加，会先形成待核任务。专家忙于检查重复内容，反而可能没有时间处理真正困难的新情况。\n\n可以考虑把已验证的常规准备工作交给AI，让专业支持聚焦需要判断的差异；也可以调整任务进入节奏。能否扩大委派，需要按真实质量和核验负担验证，不能只按“人必须最终决定”固定分工。\n\n同样，烘焙连锁即使有更好的配货建议，也要与中央生产、运输和门店接收配合。有效判断与履约资源之间的距离，是企业需要建设的部分。\n\n## 放大时，要保留局部学习\n\n统一方法可以减少重复摸索，但全部场景照搬旧答案，会压平有用差异。新门店的客群、设备的新版本、客户不同的服务时效，都可能改变适用性。\n\n因此，共同部分应帮助每个现场更快认识自己，而不是取消认识。标准可以统一事实、工具与评价方式；局部保留补充情境、报告反例和提出新方法的入口。\n\n动态能力研究强调资源的重组与持续相关性。放大优势不仅是复制已有方法，也包括在新情境中调整它。[原始研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)\n\n## 用三种证据判断放大是否发生\n\n第一类证据来自采用：更多合适任务是否真的用了有效经验，使用者能否理解条件。第二类来自交付：实际结果是否改善，资源与核验成本是否可持续。第三类来自更新：环境变化后，团队能否发现旧方法失效，并把修订带回后续任务。\n\n如果只有资料调用增长，没有实际采用，就还在传播前段；如果采用多但结果差，就应回到方法与执行；如果短期有效却无法纠错，规模可能放大未来损失。\n\n这三种证据也让FDE的工作更具体。它需要改入口、接工具、处理实际状态与反馈，也需要与业务负责人共同调整资源。优势发现与工程实现因此不能完全分开。\n","html":"\u003ch1>第13章｜放大优势，要同时扩大判断、执行与纠错\u003c/h1>\n\u003cp>教学设备企业的资深技术员，经常能从客户的零散描述里抓到关键线索。企业希望用AI整理他的工单，让其他技术员也能更快判断。\u003c/p>\n\u003cp>如果只把结论写成操作手册，可能丢失适用条件；如果把全部任务都转给这位专家复核，他会成为新的瓶颈；如果建议正确却没有现场资源，客户结果仍不会改善。\u003c/p>\n\u003cp>\u003cstrong>优势的系统化放大，需要有效判断能传播、行动有条件发生、结果能持续修正方法。\u003c/strong> 三者共同成立，才能从少数人的好表现发展为更稳定的企业能力。\u003c/p>\n\u003ch2 id=\"lesson-13-section-1\">先分清优势中哪些东西可以扩展\u003c/h2>\n\u003cp>专家可能拥有可表达的判断线索，也可能依赖长期形成的现场感知、特定工具和协作关系。不同部分需要不同放大方式。\u003c/p>\n\u003cp>可表达经验可以组织成案例与方法；重复资料工作可以交给AI；依赖身体操作的技能可能仍需带教；稀缺工具与人员则需要真实资源安排。把它们全部称为“知识”，容易高估一个文档系统能够承担的作用。\u003c/p>\n\u003cp>软件客服的实地研究显示，AI建议能够帮助不同经验员工，作用却并不均匀。它为经验扩散提供了现实参照，也提醒企业不能假定统一建议对每个人都同样有用。\u003ca href=\"https://danielle.li/assets/docs/GenerativeAIatWork.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">研究原文\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-13-section-2\">让方法进入工作，而不只进入资料库\u003c/h2>\n\u003cp>在教学设备案例中，新技术员处理工单时，AI可以带回相关历史，提示版本差异和关键缺项。这样经验与当前问题在工作入口相遇，人员不必先知道某篇资料叫什么。\u003c/p>\n\u003cp>方法仍需要合适状态：已经验证、暂作线索、某版本不适用。它还应能追到依据，方便专业人员检查。被采用后的实际动作与结果再返回，才能知道方法是否真的有帮助。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTEwIiB2aWV3Qm94PSIwIDAgMzYwIDUxMCIgcm9sZT0iaW1nIj48dGl0bGU+5pS+5aSn5LiN5Y+q5Lyg5pKt562U5qGIPC90aXRsZT48ZGVzYz7lhbHlkIzmlrnms5Xov5vlhaXlpJrkuKrpl6jlupfku7vliqHvvIzku43kvp3otZbmiafooYzotYTmupDvvJvnu5Pmnpzlm57mtYHkv67orqLlhbHlkIzmlrnms5XjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0i bel":"先分清优势中哪些东西可以扩展"},{"id":"lesson-13-section-2","label":"让方法进入工作，而不只进入资料库"},{"id":"lesson-13-section-3","label":"扩大建议量，为什么可能压低整体能力"},{"id":"lesson-13-section-4","label":"放大时，要保留局部学习"},{"id":"lesson-13-section-5","label":"用三种证据判断放大是否发生"}],"exportMd":"# 第13章｜放大优势，要同时扩大判断、执行与纠错\n\n教学设备企业的资深技术员，经常能从客户的零散描述里抓到关键线索。企业希望用AI整理他的工单，让其他技术员也能更快判断。\n\n如果只把结论写成操作手册，可能丢失适用条件；如果把全部任务都转给这位专家复核，他会成为新的瓶颈；如果建议正确却没有现场资源，客户结果仍不会改善。\n\n**优势的系统化放大，需要有效判断能传播、行动有条件发生、结果能持续修正方法。** 三者共同成立，才能从少数人的好表现发展为更稳定的企业能力。\n\n## 先分清优势中哪些东西可以扩展\n\n专家可能拥有可表达的判断线索，也可能依赖长期形成的现场感知、特定工具和协作关系。不同部分需要不同放大方式。\n\n可表达经验可以组织成案例与方法；重复资料工作可以交给AI；依赖身体操作的技能可能仍需带教；稀缺工具与人员则需要真实资源安排。把它们全部称为“知识”，容易高估一个文档系统能够承担的作用。\n\n软件客服的实地研究显示，AI建议能够帮助不同经验员工，作用却并不均匀。它为经验扩散提供了现实参照，也提醒企业不能假定统一建议对每个人都同样有用。[研究原文](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)\n\n## 让方法进入工作，而不只进入资料库\n\n在教学设备案例中，新技术员处理工单时，AI可以带回相关历史，提示版本差异和关键缺项。这样经验与当前问题在工作入口相遇，人员不必先知道某篇资料叫什么。\n\n方法仍需要合适状态：已经验证、暂作线索、某版本不适用。它还应能追到依据，方便专业人员检查。被采用后的实际动作与结果再返回，才能知道方法是否真的有帮助。\n\n![有效方法通过共同入口进入多项任务；每项任务仍需实际执行资源，结果再回到共同方法。传播、履约与修订共同支持扩大能力。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTEwIiB2aWV3Qm94PSIwIDAgMzYwIDUxMCIgcm9sZT0iaW1nIj48dGl0bGU+5pS+5aSn5LiN5Y+q5Lyg5pKt562U5qGIPC90aXRsZT48ZGVzYz7lhbHlkIzmlrnms5Xov5vlhaXlpJrkuKrpl6jlupfku7vliqHvvIzku43kvp3otZbmiafooYzotYTmupDvvJvnu5Pmnpzlm57mtYHkv67orqLlhbHlkIzmlrnms5XjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjUxMCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZ n## 让方法进入工作，而不只进入资料库\n\n在教学设备案例中，新技术员处理工单时，AI可以带回相关历史，提示版本差异和关键缺项。这样经验与当前问题在工作入口相遇，人员不必先知道某篇资料叫什么。\n\n方法仍需要合适状态：已经验证、暂作线索、某版本不适用。它还应能追到依据，方便专业人员检查。被采用后的实际动作与结果再返回，才能知道方法是否真的有帮助。\n\n![有效方法通过共同入口进入多项任务；每项任务仍需实际执行资源，结果再回到共同方法。传播、履约与修订共同支持扩大能力。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTEwIiB2aWV3Qm94PSIwIDAgMzYwIDUxMCIgcm9sZT0iaW1nIj48dGl0bGU+5pS+5aSn5LiN5Y+q5Lyg5pKt562U5qGIPC90aXRsZT48ZGVzYz7lhbHlkIzmlrnms5Xov5vlhaXlpJrkuKrpl6jlupfku7vliqHvvIzku43kvp3otZbmiafooYzotYTmupDvvJvnu5Pmnpzlm57mtYHkv67orqLlhbHlkIzmlrnms5XjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjUxMCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7mlL7lpKfkuI3lj6rkvKDmkq3nrZTmoYg8L3RleHQ+PGNpcmNsZSBjeD0iMTgwIiBjeT0iOTIiIHI9IjIwIiBmaWxsPSIjZWRmM2VkIiBzdHJva2U9IiMxNjVkNTIiIHN0cm9rZS13aWR0aD0iMiIvPjxwYXRoIGQ9Ik0xNTAgMTQxVjEzMVExODAgMTA2IDIxMCAxMzFWMTQxIiBmaWxsPSJub25lIiBzdHJva2U9IiMxNjVkNTIiIHN0cm9rZS13aWR0aD0iMiIvPjx0ZXh0IHg9IjIzNSIgeT0iMTAzIiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyMTM0MmYiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjQwMCI+546w5Zy657uP6aqMPC90ZXh0PjxwYXRoIGQ9Ik0xODAgMTQ2TDE4MCAxNzYiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzE2NWQ1MiIgc3Ryb2tlLXdpZHRoPSIyIiBtYXJrZXItZW5kPSJ1cmwoI2Fycm93KSIvPjxyZWN0IHg9IjU4IiB5PSIxNzgiIHdpZHRoPSIyNDQiIGhlaWdodD0iNjciIHJ4PSI2IiBm \n同样，烘焙连锁即使有更好的配货建议，也要与中央生产、运输和门店接收配合。有效判断与履约资源之间的距离，是企业需要建设的部分。\n\n## 放大时，要保留局部学习\n\n统一方法可以减少重复摸索，但全部场景照搬旧答案，会压平有用差异。新门店的客群、设备的新版本、客户不同的服务时效，都可能改变适用性。\n\n因此，共同部分应帮助每个现场更快认识自己，而不是取消认识。标准可以统一事实、工具与评价方式；局部保留补充情境、报告反例和提出新方法的入口。\n\n动态能力研究强调资源的重组与持续相关性。放大优势不仅是复制已有方法，也包括在新情境中调整它。[原始研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)\n\n## 用三种证据判断放大是否发生\n\n第一类证据来自采用：更多合适任务是否真的用了有效经验，使用者能否理解条件。第二类来自交付：实际结果是否改善，资源与核验成本是否可持续。第三类来自更新：环境变化后，团队能否发现旧方法失效，并把修订带回后续任务。\n\n如果只有资料调用增长，没有实际采用，就还在传播前段；如果采用多但结果差，就应回到方法与执行；如果短期有效却无法纠错，规模可能放大未来损失。\n\n这三种证据也让FDE的工作更具体。它需要改入口、接工具、处理实际状态与反馈，也需要与业务负责人共同调整资源。优势发现与工程实现因此不能完全分开。\n","text":"# 第13章｜放大优势，要同时扩大判断、执行与纠错\n\n教学设备企业的资深技术员，经常能从客户的零散描述里抓到关键线索。企业希望用AI整理他的工单，让其他技术员也能更快判断。\n\n如果只把结论写成操作手册，可能丢失适用条件；如果把全部任务都转给这位专家复核，他会成为新的瓶颈；如果建议正确却没有现场资源，客户结果仍不会改善。\n\n**优势的系统化放大，需要有效判断能传播、行动有条件发生、结果能持续修正方法。** 三者共同成立，才能从少数人的好表现发展为更稳定的企业能力。\n\n## 先分清优势中哪些东西可以扩展\n\n专家可能拥有可表达的判断线索，也可能依赖长期形成的现场感知、特定工具和协作关系。不同部分需要不同放大方式。\n\n可表达经验可以组织成案例与方法；重复资料工作可以交给AI；依赖身体操作的技能可能仍需带教；稀缺工具与人员则需要真实资源安排。把它们全部称为“知识”，容易高估一个文档系统能够承担的作用。\n\n软件客服的实地研究显示，AI建议能够帮助不同经验员工，作用却并不均匀。它为经验扩散提供了现实参照，也提醒企业不能假定统一建议对每个人都同样有用。研究原文\n\n## 让方法进入工作，而不只进入资料库\n\n在教学设备案例中，新技术员处理工单时，AI可以带回相关历史，提示版本差异和关键缺项。这样经验与当前问题在工作入口相遇，人员不必先知道某篇资料叫什么。\n\n方法仍需要合适状态：已经验证、暂作线索、某版本不适用。它还应能追到依据，方便专业人员检查。被采用后的实际动作与结果再返回，才能知道方法是否真的有帮助。\n\n \n\n## 扩大建议量，为什么可能压低整体能力\n\n假设AI能为更多工单产生建议，专家却仍逐张核验。上游数量增加，会先形成待核任务。专家忙于检查重复内容，反而可能没有时间处理真正困难的新情况。\n\n可以考虑把已验证的常规准备工作交给AI，让专业支持聚焦需要判断的差异；也可以调整任务进入节奏。能否扩大委派，需要按真实质量和核验负担验证，不能只按“人必须最终决定”固定分工。\n\n同样，烘焙连锁即使有更好的配货建议，也要与中央生产、运输和门店接收配合。有效判断与履约资源之间的距离，是企业需要建设的部分。\n\n## 放大时，要保留局部学习\n\n统一方法可以减少重复摸索，但全部场景照搬旧答案，会压平有用差异。新门店的客群、设备的新版本、客户不同的服务时效，都可能改变适用性。\n\n因此，共同部分应帮助每个现场更快认识自己，而不是取消认识。标准可以统一事实、工具与评价方式；局部保留补充情境、报告反例和提出新方法的入口。\n\n动态能力研究强调资源的重组与持续相关性。放大优势不仅是复制已有方法，也包括在新情境中调整它。原始研究\n\n## 用三种证据判断放大是否发生\n\n第一类证据来自采用：更多合适任务是否真的用了有效经验，使用者能否理解条件。第二类来自交付：实际结果是否改善，资源与核验成本是否可持续。第三类来自更新：环境变化后，团队能否发现旧方法失效，并把修订带回后续任务。\n\n如果只有资料调用增长，没有实际采用，就还在传播前段；如果采用多但结果差，就应回到方法与执行；如果短期有效却无法纠错，规模可能放大未来损失。\n\n这三种证据也让FDE的工作更具体。它需要改入口、接工具、处理实际状态与反馈，也需要与业务负责人共同调整资源。优势发现与工程实现因此不能完全分开。\n"},{"file":"14-FDE的企业侧角色.md","id":"lesson-14","number":14,"role":"核心课","part":2,"title":"第14章｜FDE的价值，为什么在现场认识与工程之间","md":"# 第14章｜FDE的价值，为什么在现场认识与工程之间\n\n企业提出“做一个AI日报”，可能是在表达整理负担，也可能是在表达经营信息无法进入决定。交付一个日报功能能够满足字面要求，却未必解决后一个问题。\n\n如果有一股工程力量，既能进入现场理解价值，又能快速把发现做成可用安排，再根据采用结果调整，它承担的就是FDE值得关注的那部分作用。\n\nFDE通常译作前线部署工程师。名称中的“前线”，强调靠近真实问题与使用者；它不等于每天坐在客户办公室。**从企业发展看，FDE的战略价值是缩短认识与实现之间的距离，使优势发现、系统建设和业务反馈持续相互推进。**\n\n## 为什么这类工作越来越重要\n\n通用平台与模型可以服务很多客户，却无法预先包含每一家企业的工作细节。企业的判断、例外、资源与协作各不相同。技术能力越广，候选应用越多，如何进入具体生产的工作也越复杂。\n\n过去的平台部署、数据集成和行业系统已经需要现场工程。生成式AI扩大了能力适用范围，也使业务问题与实现方式更需要通过使用逐步明确。这里包含一个发展逻辑：共同技术供给与企业具体条件之间，需要能够往返理解和动手建设的人。\n\nPalantir的官方FDSE岗位描述包含模糊业务问题、原型、代码开发、数据集成与客户反馈。AWS的FDE共建安排也把生产系统与客户内部能力联系起来。这些是机构对实际工作的自述，说明工程职责不能被省去；不同机构的岗位范围仍有差异。[Palantir岗位](https://jobs.lever.co/palantir/84131e3f-455e-47fc-9c11-898d95f09048)、[AWS安排](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)\n\n## 企业需要的，不只是有人听懂需求\n\n咨询可以帮助提出方向，培训可以增加理解，实施可以完成清晰功能。这些工作都有价值。但当问题本身还会随采用变化时，企业还需要有人把新认识迅速变成可操作结果，并持续跟进。\n\n这要求FDE能读取真实材料，理解价值与约束，制作原型，编写和集成必要系统，排查失败，改进记录与评价，也能解释哪些问题必须由业务管理承担。只会推荐工具，无法完成这种往返；只会按原需求编码，也可能错过真正值得发展的能力。\n\n![FDE把现场发现带到可用实现，再把真实采用与结果带回问题理解；企业负责人提供价值判断与资源安排，循环由两方共同支撑。](assets/14-FDE现场循环.svg)\n\n## 从AI日报，走向备货能力\n\n在教学烘焙连锁里，FDE先看日报如何形成，发现原消息中的售罄时点与未满足请求被压缩掉。于是提出一个具体假设：把这些事实接入分配，可能比只加快日报更有经营价值。\n\n要检验它，需要关联门店、商品和营业日，保留建议与正式安排，接回实际到店和营业反馈。若发现分配人员没有时间处理例外，还要与负责人讨论工作安排。\n\n这里既有主动发现，也有实际建设。FDE可以推动原来没人统筹的改造，使企业更快接近可用AI；但不能凭技术判断独自承诺中央产量、门店目标或客户价格。这些取舍需要有对应权力的企业人员参与。\n\n## 怎样评价这一股发展力量\n\n如果只按定制功能数考核，团队可能倾向于交付容易展示的界面。如果只按驻场天数考核，连续参与也可能没有能力变化。\n\n更有解释力的评价是：哪项有价值假设被做成了可用安排，哪些现场发现改变了实现，哪些采用结果改变了认识，企业留下了什么能够接续的能力。\n\n吸收能力研究提供了企业侧补充：外部知识要成为组织能力，需要内部相关理解与应用条件。企业负责人、专业人员和工程力量共同工作，才能减少供应商完成了项目、企业却仍不能判断的情况。[原始研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n## 哪些情况不需要新增同名岗位\n\n成熟软件已经解决的清晰需求，可以使用常规实施；内部团队如果已经具备连续现场工程能力，也可以自己承担。企业需要判断的是能力缺口，而非职位热度。\n\n反过来，一个长期外部团队也不会因叫FDE就天然有效。后面会专门讨论共建关系怎样保持连续、留下企业能力并允许调整。先看它在现场如何工作，才能理解这种合作究竟在购买什么。\n","html":"\u003ch1>第14章｜FDE的价值，为什么在现场认识与工程之间\u003c/h1>\n\u003cp>企业提出“做一个AI日报”，可能是在表达整理负担，也可能是在表达经营信息无法进入决定。交付一个日报功能能够满足字面要求，却未必解决后一个问题。\u003c/p>\n\u003cp>如果有一股工程力量，既能进入现场理解价值，又能快速把发现做成可用安排，再根据采用结果调整，它承担的就是FDE值得关注的那部分作用。\u003c/p>\n\u003cp>FDE通常译作前线部署工程师。名称中的“前线”，强调靠近真实问题与使用者；它不等于每天坐在客户办公室。\u003cstrong>从企业发展看，FDE的战略价值是缩短认识与实现之间的距离，使优势发现、系统建设和业务反馈持续相互推进。\u003c/strong>\u003c/p>\n\u003ch2 id=\"lesson-14-section-1\">为什么这类工作越来越重要\u003c/h2>\n\u003cp>通用平台与模型可以服务很多客户，却无法预先包含每一家企业的工作细节。企业的判断、例外、资源与协作各不相同。技术能力越广，候选应用越多，如何进入具体生产的工作也越复杂。\u003c/p>\n\u003cp>过去的平台部署、数据集成和行业系统已经需要现场工程。生成式AI扩大了能力适用范围，也使业务问题与实现方式更需要通过使用逐步明确。这里包含一个发展逻辑：共同技术供给与企业具体条件之间，需要能够往返理解和动手建设的人。\u003c/p>\n\u003cp>Palantir的官方FDSE岗位描述包含模糊业务问题、原型、代码开发、数据集成与客户反馈。AWS的FDE共建安排也把生产系统与客户内部能力联系起来。这些是机构对实际工作的自述，说明工程职责不能被省去；不同机构的岗位范围仍有差异。\u003ca href=\"https://jobs.lever.co/palantir/84131e3f-455e-47fc-9c11-898d95f09048\" target=\"_blank\" rel=\"noopener noreferrer\">Palantir岗位\u003c/a>、\u003ca href=\"https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers\" target=\"_blank\" rel=\"noopener noreferrer\">AWS安排\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-14-section-2\">企业需要的，不只是有人听懂需求\u003c/h2>\n\u003cp>咨询可以帮助提出方向，培训可以增加理解，实施可以完成清晰功能。这些工作都有价值。但当问题本身还会随采用变化时，企业还需要有人把新认识迅速变成可操作结果，并持续跟进。\u003c/p>\n\u003cp>这要求FDE能读取真实材料，理解价值与约束，制作原型，编写和集成必要系统，排查失败，改进记录与评价，也能解释哪些问题必须由业务管理承担。只会推荐工具，无法完成这种往返；只会按原需求编码，也可能错过真正值得发展的能力。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTkwIiB2aWV3Qm94PSIwIDAgMzYwIDU5MCIgcm9sZT0iaW1nIj48dGl0bGU+546w5Zy65LiO5bel56iL5oyB57ut5b6A6L+UPC90aXRsZT48ZGVzYz7njrDlnLrlj5HnjrDjgIHlj6/nlKjlrp7njrDjgIHnnJ/lrp7ph4fnlKjlkoznu5Pmnpzlj43ppojnm7jkupLov57mjqXvvIzkvIHkuJrmj5Dkvpvku7flgLzkuI7otYTmupDlronmjpLjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckh NaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxOCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7kvIHkuJrotJ/otKPkurrvvJrku7flgLzliKTmlq3kuI7otYTmupA8L3RleHQ+PC9zdmc+\" alt=\"FDE把现场发现带到可用实现，再把真实采用与结果带回问题理解；企业负责人提供价值判断与资源安排，循环由两方共同支撑。\">\u003c/p>\n\u003ch2 id=\"lesson-14-section-3\">从AI日报，走向备货能力\u003c/h2>\n\u003cp>在教学烘焙连锁里，FDE先看日报如何形成，发现原消息中的售罄时点与未满足请求被压缩掉。于是提出一个具体假设：把这些事实接入分配，可能比只加快日报更有经营价值。\u003c/p>\n\u003cp>要检验它，需要关联门店、商品和营业日，保留建议与正式安排，接回实际到店和营业反馈。若发现分配人员没有时间处理例外，还要与负责人讨论工作安排。\u003c/p>\n\u003cp>这里既有主动发现，也有实际建设。FDE可以推动原来没人统筹的改造，使企业更快接近可用AI；但不能凭技术判断独自承诺中央产量、门店目标或客户价格。这些取舍需要有对应权力的企业人员参与。\u003c/p>\n\u003ch2 id=\"lesson-14-section-4\">怎样评价这一股发展力量\u003c/h2>\n\u003cp>如果只按定制功能数考核，团队可能倾向于交付容易展示的界面。如果只按驻场天数考核，连续参与也可能没有能力变化。\u003c/p>\n\u003cp>更有解释力的评价是：哪项有价值假设被做成了可用安排，哪些现场发现改变了实现，哪些采用结果改变了认识，企业留下了什么能够接续的能力。\u003c/p>\n\u003cp>吸收能力研究提供了企业侧补充：外部知识要成为组织能力，需要内部相关理解与应用条件。企业负责人、专业人员和工程力量共同工作，才能减少供应商完成了项目、企业却仍不能判断的情况。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-14-section-5\">哪些情况不需要新增同名岗位\u003c/h2>\n\u003cp>成熟软件已经解决的清晰需求，可以使用常规实施；内部团队如果已经具备连续现场工程能力，也可以自己承担。企业需要判断的是能力缺口，而非职位热度。\u003c/p>\n\u003cp>反过来，一个长期外部团队也不会因叫FDE就天然有效。后面会专门讨论共建关系怎样保持连续、留下企业能力并允许调整。先看它在现场如何工作，才能理解这种合作究竟在购买什么。\u003c/p>\n","headings":[{"id":"lesson-14-section-1","label":"为什么这类工作越来越重要"},{"id":"lesson-14-section-2","label":"企业需要的，不只是有人听懂需求"},{"id":"lesson-14-section-3","label":"从AI日报，走向备货能力"},{"id":"lesson-14-section-4","label":"怎样评价这一股发展力量"},{"id":"lesson-14-section-5","label":"哪些情况不需要新增同名岗位"}],"exportMd":"# 第14章｜FDE的价值，为什么在现场认识与工程之间\n\n企业提出“做一个AI日报”，可能是在表达整理负担，也可能是在表达经营信息无法进入决定。交付一个日报功能能够满足字面要求，却未必解决后一个问题。\n\n如果有一股工程力量，既能进入现场理解价值，又能快速把发现做成可用安排，再根据采用结果调整，它承担的就是FDE值得关注的那部分作用。\n\nFDE通常译作前线部署工程师。名称中的“前线”，强调靠近真实问题与使用者；它不等于每天坐在客户办公室。**从企业发展看，FDE的战略价值是缩短认识与实现之间的距离，使优势发现、系统建设和业务反馈持续相互推进。**\n\n## 为什么这类工作越来越重要\n\n通用平台与模型可以服务很多客户，却无法预先包含每一家企业的工作细节。企业的判断、例外、资源与协作各不相同。技术能力越广，候选应用越多，如何进入具体生产的工作也越复杂。\n\n过去的平台部署、数据集成和行业系统已经需要现场工程。生成式AI扩大了能力适用范围，也使业务问题与实现方式更需要通过使用逐步明确。这里包含一个发展逻辑：共同技术供给与企业具体条件之间，需要能够往返理解和动手建设的人。\n\nPalantir的官方FDSE岗位描述包含模糊业务问题、原型、代码开发、数据集成与客户反馈。AWS的FDE共建安排也把生产系统与客户内部能力联系起来。这些是机构对实际工作的自述，说明工程职责不能被省去；不同机构的岗位范围仍有差异。[Palantir岗位](https://jobs.lever.co/palantir/84131e3f-455e-47fc-9c11-898d95f09048)、[AWS安排](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)\n\n## 企业需要的，不只是有人听懂需求\n\n咨询可以帮助提出方向，培训可以增加理解，实施可以完成清晰功能。这些工作都有价值。但当问题本身还会随采用变化时，企业还需要有人把新认识迅速变成可操作结果，并持续跟进。\n\n这要求FDE能读取真实材料，理解价值与约束，制作原型，编写和集成必要系统，排查失败，改进记录与评价，也能解释哪些问题必须由业务管理承担。只会推荐工具，无法完成这种往返；只会按原需求编码，也可能错过真正值得发展的能力。\n\n![FDE把现场发现带到可用实现，再把真实采用与结果带回问题理解；企业负责人提供价值判断与资源安排，循环由两方共同支撑。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTkwIiB2aWV3Qm94PSIwIDAgMzYwIDU5MCIgcm9sZT0iaW1nIj48dGl0bGU+546w5Zy65LiO5bel56iL5oyB57ut5b6A6L+UPC90aXRsZT48ZGVzYz7njrDlnLrlj5HnjrDjgIHlj6/nlKjlrp7njrDjgIHnnJ/lrp7ph4fnlKjlkoznu5Pmnpzlj43ppojnm7jkupLov57mjqXvvIzkvIHkuJrmj5Dkvpvku7flgLzkuI7otYTmupDlronmjpLjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjU5MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7njrDlnLrkuI7lt6XnqIvmjIHnu63lvoDov5Q8L3RleHQ+PHJlY3QgeD0iMzIiIHk9Ijg2IiB3aWR0aD0iMjE4IiBoZWlnaHQ9Ijc0IiByeD0iNiIgZmlsbD0iI2VkZjNlZCIgc3Ryb2tlPSIjNjA3MzZjIiBzdHJva2Ut 22/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n## 哪些情况不需要新增同名岗位\n\n成熟软件已经解决的清晰需求，可以使用常规实施；内部团队如果已经具备连续现场工程能力，也可以自己承担。企业需要判断的是能力缺口，而非职位热度。\n\n反过来，一个长期外部团队也不会因叫FDE就天然有效。后面会专门讨论共建关系怎样保持连续、留下企业能力并允许调整。先看它在现场如何工作，才能理解这种合作究竟在购买什么。\n","exportSingleMd":"# 第14章｜FDE的价值，为什么在现场认识与工程之间\n\n企业提出“做一个AI日报”，可能是在表达整理负担，也可能是在表达经营信息无法进入决定。交付一个日报功能能够满足字面要求，却未必解决后一个问题。\n\n如果有一股工程力量，既能进入现场理解价值，又能快速把发现做成可用安排，再根据采用结果调整，它承担的就是FDE值得关注的那部分作用。\n\nFDE通常译作前线部署工程师。名称中的“前线”，强调靠近真实问题与使用者；它不等于每天坐在客户办公室。**从企业发展看，FDE的战略价值是缩短认识与实现之间的距离，使优势发现、系统建设和业务反馈持续相互推进。**\n\n## 为什么这类工作越来越重要\n\n通用平台与模型可以服务很多客户，却无法预先包含每一家企业的工作细节。企业的判断、例外、资源与协作各不相同。技术能力越广，候选应用越多，如何进入具体生产的工作也越复杂。\n\n过去的平台部署、数据集成和行业系统已经需要现场工程。生成式AI扩大了能力适用范围，也使业务问题与实现方式更需要通过使用逐步明确。这里包含一个发展逻辑：共同技术供给与企业具体条件之间，需要能够往返理解和动手建设的人。\n\nPalantir的官方FDSE岗位描述包含模糊业务问题、原型、代码开发、数据集成与客户反馈。AWS的FDE共建安排也把生产系统与客户内部能力联系起来。这些是机构对实际工作的自述，说明工程职责不能被省去；不同机构的岗位范围仍有差异。[Palantir岗位](https://jobs.lever.co/palantir/84131e3f-455e-47fc-9c11-898d95f09048)、[AWS安排](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)\n\n## 企业需要的，不只是有人听懂需求\n\n咨询可以帮助提出方向，培训可以增加理解，实施可以完成清晰功能。这些工作都有价值。但当问题本身还会随采用变化时，企业还需要有人把新认识迅速变成可操作结果，并持续跟进。\n\n这要求FDE能读取真实材料，理解价值与约束，制作原型，编写和集成必要系统，排查失败，改进记录与评价，也能解释哪些问题必须由业务管理承担。只会推荐工具，无法完成这种往返；只会按原需求编码，也可能错过真正值得发展的能力。\n\n![FDE把现场发现带到可用实现，再把真实采用与结果带回问题理解；企业负责人提供价值判断与资源安排，循环由两方共同支撑。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTkwIiB2aWV3Qm94PSIwIDAgMzYwIDU5MCIgcm9sZT0iaW1nIj48dGl0bGU+546w5Zy65LiO5bel56iL5oyB57ut5b6A6L+UPC90aXRsZT48ZGVzYz7njrDlnLrlj5HnjrDjgIHlj6/nlKjlrp7njrDjgIHnnJ/lrp7ph4fnlKjlkoznu5Pmnpzlj43ppojnm7jkupLov57mjqXvvIzkvIHkuJrmj5Dkvpvku7flgLzkuI7otYTmupDlronmjpLjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pd C9zdmc+)\n\n## 从AI日报，走向备货能力\n\n在教学烘焙连锁里，FDE先看日报如何形成，发现原消息中的售罄时点与未满足请求被压缩掉。于是提出一个具体假设：把这些事实接入分配，可能比只加快日报更有经营价值。\n\n要检验它，需要关联门店、商品和营业日，保留建议与正式安排，接回实际到店和营业反馈。若发现分配人员没有时间处理例外，还要与负责人讨论工作安排。\n\n这里既有主动发现，也有实际建设。FDE可以推动原来没人统筹的改造，使企业更快接近可用AI；但不能凭技术判断独自承诺中央产量、门店目标或客户价格。这些取舍需要有对应权力的企业人员参与。\n\n## 怎样评价这一股发展力量\n\n如果只按定制功能数考核，团队可能倾向于交付容易展示的界面。如果只按驻场天数考核，连续参与也可能没有能力变化。\n\n更有解释力的评价是：哪项有价值假设被做成了可用安排，哪些现场发现改变了实现，哪些采用结果改变了认识，企业留下了什么能够接续的能力。\n\n吸收能力研究提供了企业侧补充：外部知识要成为组织能力，需要内部相关理解与应用条件。企业负责人、专业人员和工程力量共同工作，才能减少供应商完成了项目、企业却仍不能判断的情况。[原始研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n## 哪些情况不需要新增同名岗位\n\n成熟软件已经解决的清晰需求，可以使用常规实施；内部团队如果已经具备连续现场工程能力，也可以自己承担。企业需要判断的是能力缺口，而非职位热度。\n\n反过来，一个长期外部团队也不会因叫FDE就天然有效。后面会专门讨论共建关系怎样保持连续、留下企业能力并允许调整。先看它在现场如何工作，才能理解这种合作究竟在购买什么。\n","text":"# 第14章｜FDE的价值，为什么在现场认识与工程之间\n\n企业提出“做一个AI日报”，可能是在表达整理负担，也可能是在表达经营信息无法进入决定。交付一个日报功能能够满足字面要求，却未必解决后一个问题。\n\n如果有一股工程力量，既能进入现场理解价值，又能快速把发现做成可用安排，再根据采用结果调整，它承担的就是FDE值得关注的那部分作用。\n\nFDE通常译作前线部署工程师。名称中的“前线”，强调靠近真实问题与使用者；它不等于每天坐在客户办公室。**从企业发展看，FDE的战略价值是缩短认识与实现之间的距离，使优势发现、系统建设和业务反馈持续相互推进。**\n\n## 为什么这类工作越来越重要\n\n通用平台与模型可以服务很多客户，却无法预先包含每一家企业的工作细节。企业的判断、例外、资源与协作各不相同。技术能力越广，候选应用越多，如何进入具体生产的工作也越复杂。\n\n过去的平台部署、数据集成和行业系统已经需要现场工程。生成式AI扩大了能力适用范围，也使业务问题与实现方式更需要通过使用逐步明确。这里包含一个发展逻辑：共同技术供给与企业具体条件之间，需要能够往返理解和动手建设的人。\n\nPalantir的官方FDSE岗位描述包含模糊业务问题、原型、代码开发、数据集成与客户反馈。AWS的FDE共建安排也把生产系统与客户内部能力联系起来。这些是机构对实际工作的自述，说明工程职责不能被省去；不同机构的岗位范围仍有差异。Palantir岗位、AWS安排\n\n## 企业需要的，不只是有人听懂需求\n\n咨询可以帮助提出方向，培训可以增加理解，实施可以完成清晰功能。这些工作都有价值。但当问题本身还会随采用变化时，企业还需要有人把新认识迅速变成可操作结果，并持续跟进。\n\n这要求FDE能读取真实材料，理解价值与约束，制作原型，编写和集成必要系统，排查失败，改进记录与评价，也能解释哪些问题必须由业务管理承担。只会推荐工具，无法完成这种往返；只会按原需求编码，也可能错过真正值得发展的能力。\n\n \n\n## 从AI日报，走向备货能力\n\n在教学烘焙连锁里，FDE先看日报如何形成，发现原消息中的售罄时点与未满足请求被压缩掉。于是提出一个具体假设：把这些事实接入分配，可能比只加快日报更有经营价值。\n\n要检验它，需要关联门店、商品和营业日，保留建议与正式安排，接回实际到店和营业反馈。若发现分配人员没有时间处理例外，还要与负责人讨论工作安排。\n\n这里既有主动发现，也有实际建设。FDE可以推动原来没人统筹的改造，使企业更快接近可用AI；但不能凭技术判断独自承诺中央产量、门店目标或客户价格。这些取舍需要有对应权力的企业人员参与。\n\n## 怎样评价这一股发展力量\n\n如果只按定制功能数考核，团队可能倾向于交付容易展示的界面。如果只按驻场天数考核，连续参与也可能没有能力变化。\n\n更有解释力的评价是：哪项有价值假设被做成了可用安排，哪些现场发现改变了实现，哪些采用结果改变了认识，企业留下了什么能够接续的能力。\n\n吸收能力研究提供了企业侧补充：外部知识要成为组织能力，需要内部相关理解与应用条件。企业负责人、专业人员和工程力量共同工作，才能减少供应商完成了项目、企业却仍不能判断的情况。原始研究\n\n## 哪些情况不需要新增同名岗位\n\n成熟软件已经解决的清晰需求，可以使用常规实施；内部团队如果已经具备连续现场工程能力，也可以自己承担。企业需要判断的是能力缺口，而非职位热度。\n\n反过来，一个长期外部团队也不会因叫FDE就天然有效。后面会专门讨论共建关系怎样保持连续、留下企业能力并允许调整。先看它在现场如何工作，才能理解这种合作究竟在购买什么。\n"},{"file":"15-现场工作方法.md","id":"lesson-15","number":15,"role":"核心课","part":2,"title":"第15章｜原型怎样帮助认识问题，而不只用于演示","md":"# 第15章｜原型怎样帮助认识问题，而不只用于演示\n\n在设备服务教学情境中，一套AI工单原型在演示时很顺畅：输入描述，生成原因、动作和处置说明，点击即可保存。技术员拿自己的材料试用，却发现系统写了“更换部件”，实际没有换件。\n\n这个发现可以被当作一句措辞错误，改掉就结束；也可以成为一次更有价值的现场认识：系统是否在资料不足时补故事，真实动作从哪里进入，错误会不会进入下一次经验调用。\n\n**原型的价值，在于让业务假设接受实际操作与后果检验。** 演示成功说明流程能够走通，真实采用才会暴露它是否适合工作。\n\n## 先把原来的工作看完整\n\n观察应从有代表性的任务开始。原技术员如何取得材料，哪里反复补问，哪些工具必须打开，什么结果才算完成？记录实际经过，避免只听功能愿望。\n\n还要保留合理基线。某个步骤原本用现有系统就能完成，就不应把它全部算成AI新增贡献。某个错误原本也常发生，则需比较新安排是否减少或放大它，而非只要求新系统看起来完美。\n\n现场工作也需要节制。持续打断专家会增加负担；挑选几张最容易的工单，又会让团队高估覆盖范围。选择应围绕本轮最需要认识的差别。\n\n## 把一个关键假设做成可用安排\n\n例如假设：“系统先关联原始描述与真实动作，技术员只纠正必要差别，就能减少总结负担并保持记录准确。”\n\n这与“做一个工单助手”相比更具体。原型应让技术员用自己的材料完成一次工作，真实看到关联、草稿与修改，而不是由演示者预先准备好全部答案。\n\n使用中观察三种情况：被采用的部分为什么有用；被改动的部分缺什么；被绕开的部分增加了什么负担。满意度可以提供线索，不能替代这些实际行为。\n\n## 一次错误，应怎样改变实现\n\n“更换部件”被纠正后，先回到原材料，确认系统是否有相应依据。若没有，应把实际动作与推断原因分开，不允许流畅总结填补动作事实。\n\n再看这次纠正是否进入最终工单。若界面改对了，经验库却仍保留旧草稿，错误会继续传播。还要用其他有缺项或版本差异的工单检查，判断这是一处文字问题，还是共同资料链的缺口。\n\n最后确认新增核验是否可承受。若技术员为防错误必须逐句重写，原假设就没有成立。团队可能需要缩小输出范围、改善输入，或改变哪些部分适合AI承担。\n\n| 实际发现 | 需要考虑的修改 |\n|---|---|\n| 原材料没有关键动作 | 补真实动作入口，缩小生成范围 |\n| 信息存在却没有带入 | 改关联、检索或呈现 |\n| 判断正确但无人执行 | 改职责与资源安排 |\n| 人员频繁绕开 | 研究额外负担和任务不匹配 |\n| 感觉更快但总工时增加 | 测量核验、返工和衔接成本 |\n\n同一发现可以指向多个原因，需继续用材料区分。\n\n## 让业务人员进入判断，而非只参加需求会\n\n业务负责人需要决定什么结果值得改善，专业人员需要解释哪些差别重要，工程人员需要把认识实现。三者在原型采用与修改中持续相遇，才能形成有效往返。\n\n原型也可以促使企业改变原提问。例如工单写作困难的背后，可能是实际处置记录缺失；日报负担背后，可能是决定所需情境未被保留。改变问题不应被视为项目跑偏，前提是能说明新问题与原经营目标的关系。\n\nZara的现场实施研究展示了业务规则进入工程的必要性；METR的任务研究则提醒我们，使用者觉得更快与实际耗时可能不同。二者都支持以真实工作而非流畅演示检验认识。[现场案例](https://web.mit.edu/people/jgallien/ZaraOR2010.pdf)、[任务研究](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)\n\n## 原型之后应留下什么\n\n除了可操作功能，还应留下本轮假设、取得的观察、已经改变的认识，以及下一轮还需区分的问题。它们帮助团队避免每次从需求清单重新开始。\n\n这类现场往返需要明确投入边界。并非所有问题都值得同时解决，也不能把长期探索当作持续没有交付的理由。选择下一项试点，应看它能否影响真实业务，并改变下一步投资判断。\n","html":"\u003ch1>第15章｜原型怎样帮助认识问题，而不只用于演示\u003c/h1>\n\u003cp>在设备服务教学情境中，一套AI工单原型在演示时很顺畅：输入描述，生成原因、动作和处置说明，点击即可保存。技术员拿自己的材料试用，却发现系统写了“更换部件”，实际没有换件。\u003c/p>\n\u003cp>这个发现可以被当作一句措辞错误，改掉就结束；也可以成为一次更有价值的现场认识：系统是否在资料不足时补故事，真实动作从哪里进入，错误会不会进入下一次经验调用。\u003c/p>\n\u003cp>\u003cstrong>原型的价值，在于让业务假设接受实际操作与后果检验。\u003c/strong> 演示成功说明流程能够走通，真实采用才会暴露它是否适合工作。\u003c/p>\n\u003ch2 id=\"lesson-15-section-1\">先把原来的工作看完整\u003c/h2>\n\u003cp>观察应从有代表性的任务开始。原技术员如何取得材料，哪里反复补问，哪些工具必须打开，什么结果才算完成？记录实际经过，避免只听功能愿望。\u003c/p>\n\u003cp>还要保留合理基线。某个步骤原本用现有系统就能完成，就不应把它全部算成AI新增贡献。某个错误原本也常发生，则需比较新安排是否减少或放大它，而非只要求新系统看起来完美。\u003c/p>\n\u003cp>现场工作也需要节制。持续打断专家会增加负担；挑选几张最容易的工单，又会让团队高估覆盖范围。选择应围绕本轮最需要认识的差别。\u003c/p>\n\u003ch2 id=\"lesson-15-section-2\">把一个关键假设做成可用安排\u003c/h2>\n\u003cp>例如假设：“系统先关联原始描述与真实动作，技术员只纠正必要差别，就能减少总结负担并保持记录准确。”\u003c/p>\n\u003cp>这与“做一个工单助手”相比更具体。原型应让技术员用自己的材料完成一次工作，真实看到关联、草稿与修改，而不是由演示者预先准备好全部答案。\u003c/p>\n\u003cp>使用中观察三种情况：被采用的部分为什么有用；被改动的部分缺什么；被绕开的部分增加了什么负担。满意度可以提供线索，不能替代这些实际行为。\u003c/p>\n\u003ch2 id=\"lesson-15-section-3\">一次错误，应怎样改变实现\u003c/h2>\n\u003cp>“更换部件”被纠正后，先回到原材料，确认系统是否有相应依据。若没有，应把实际动作与推断原因分开，不允许流畅总结填补动作事实。\u003c/p>\n\u003cp>再看这次纠正是否进入最终工单。若界面改对了，经验库却仍保留旧草稿，错误会继续传播。还要用其他有缺项或版本差异的工单检查，判断这是一处文字问题，还是共同资料链的缺口。\u003c/p>\n\u003cp>最后确认新增核验是否可承受。若技术员为防错误必须逐句重写，原假设就没有成立。团队可能需要缩小输出范围、改善输入，或改变哪些部分适合AI承担。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>实际发现\u003c/th>\n\u003cth>需要考虑的修改\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>原材料没有关键动作\u003c/td>\n\u003ctd>补真实动作入口，缩小生成范围\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>信息存在却没有带入\u003c/td>\n\u003ctd>改关联、检索或呈现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>判断正确但无人执行\u003c/td>\n\u003ctd>改职责与资源安排\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>人员频繁绕开\u003c/td>\n\u003ctd>研究额外负担和任务不匹配\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>感觉更快但总工时增加\u003c/td>\n\u003ctd>测量核验、返工和衔接成本\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>同一发现可以指向多个原因，需继续用材料区分。\u003c/p>\n\u003ch2 id=\"lesson-15-section-4\">让业务人员进入判断，而非只参加需求会\u003c/h2>\n\u003cp>业务负责人需要决定什么结果值得改善，专业人员需要解释哪些差别重要，工程人员需要把认识实现。三者在原型采用与修改中持续相遇，才能形成有效往返。\u003c/p>\n\u003cp>原型也可以促使企业改变原提问。例如工单写作困难的背后，可能是实际处置记录缺失；日报负担背后，可能是决定所需情境未被保留。改变问题不应被视为项目跑偏，前提是能说明新问题与原经营目标的关系。\u003c/p>\n\u003cp>Zara的现场实施研究展示了业务规则进入工程的必要性；METR的任务研究则提醒我们，使用者觉得更快与实际耗时可能不同。二者都支持以真实工作而非流畅演示检验认识。\u003ca href=\"https://web.mit.edu/people/jgallien/ZaraOR2010.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">现场案例\u003c/a>、\u003ca href=\"https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">任务研究\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-15-section-5\">原型之后应留下什么\u003c/h2>\n\u003cp>除了可操作功能，还应留下本轮假设、取得的观察、已经改变的认识，以及下一轮还需区分的问题。它们帮助团队避免每次从需求清单重新开始。\u003c/p>\n\u003cp>这类现场往返需要明确投入边界。并非所有问题都值得同时解决，也不能把长期探索当作持续没有交付的理由。选择下一项试点，应看它能否影响真实业务，并改变下一步投资判断。\u003c/p>\n","headings":[{"id":"lesson-15-section-1","label":"先把原来的工作看完整"},{"id":"lesson-15-section-2","label":"把一个关键假设做成可用安排"},{"id":"lesson-15-section-3","label":"一次错误，应怎样改变实现"},{"id":"lesson-15-section-4","label":"让业务人员进入判断，而非只参加需求会"},{"id":"lesson-15-section-5","label":"原型之后应留下什么"}],"exportMd":"# 第15章｜原型怎样帮助认识问题，而不只用于演示\n\n在设备服务教学情境中，一套AI工单原型在演示时很顺畅：输入描述，生成原因、动作和处置说明，点击即可保存。技术员拿自己的材料试用，却发现系统写了“更换部件”，实际没有换件。\n\n这个发现可以被当作一句措辞错误，改掉就结束；也可以成为一次更有价值的现场认识：系统是否在资料不足时补故事，真实动作从哪里进入，错误会不会进入下一次经验调用。\n\n**原型的价值，在于让业务假设接受实际操作与后果检验。** 演示成功说明流程能够走通，真实采用才会暴露它是否适合工作。\n\n## 先把原来的工作看完整\n\n观察应从有代表性的任务开始。原技术员如何取得材料，哪里反复补问，哪些工具必须打开，什么结果才算完成？记录实际经过，避免只听功能愿望。\n\n还要保留合理基线。某个步骤原本用现有系统就能完成，就不应把它全部算成AI新增贡献。某个错误原本也常发生，则需比较新安排是否减少或放大它，而非只要求新系统看起来完美。\n\n现场工作也需要节制。持续打断专家会增加负担；挑选几张最容易的工单，又会让团队高估覆盖范围。选择应围绕本轮最需要认识的差别。\n\n## 把一个关键假设做成可用安排\n\n例如假设：“系统先关联原始描述与真实动作，技术员只纠正必要差别，就能减少总结负担并保持记录准确。”\n\n这与“做一个工单助手”相比更具体。原型应让技术员用自己的材料完成一次工作，真实看到关联、草稿与修改，而不是由演示者预先准备好全部答案。\n\n使用中观察三种情况：被采用的部分为什么有用；被改动的部分缺什么；被绕开的部分增加了什么负担。满意度可以提供线索，不能替代这些实际行为。\n\n## 一次错误，应怎样改变实现\n\n“更换部件”被纠正后，先回到原材料，确认系统是否有相应依据。若没有，应把实际动作与推断原因分开，不允许流畅总结填补动作事实。\n\n再看这次纠正是否进入最终工单。若界面改对了，经验库却仍保留旧草稿，错误会继续传播。还要用其他有缺项或版本差异的工单检查，判断这是一处文字问题，还是共同资料链的缺口。\n\n最后确认新增核验是否可承受。若技术员为防错误必须逐句重写，原假设就没有成立。团队可能需要缩小输出范围、改善输入，或改变哪些部分适合AI承担。\n\n| 实际发现 | 需要考虑的修改 |\n|---|---|\n| 原材料没有关键动作 | 补真实动作入口，缩小生成范围 |\n| 信息存在却没有带入 | 改关联、检索或呈现 |\n| 判断正确但无人执行 | 改职责与资源安排 |\n| 人员频繁绕开 | 研究额外负担和任务不匹配 |\n| 感觉更快但总工时增加 | 测量核验、返工和衔接成本 |\n\n同一发现可以指向多个原因，需继续用材料区分。\n\n## 让业务人员进入判断，而非只参加需求会\n\n业务负责人需要决定什么结果值得改善，专业人员需要解释哪些差别重要，工程人员需要把认识实现。三者在原型采用与修改中持续相遇，才能形成有效往返。\n\n原型也可以促使企业改变原提问。例如工单写作困难的背后，可能是实际处置记录缺失；日报负担背后，可能是决定所需情境未被保留。改变问题不应被视为项目跑偏，前提是能说明新问题与原经营目标的关系。\n\nZara的现场实施研究展示了业务规则进入工程的必要性；METR的任务研究则提醒我们，使用者觉得更快与实际耗时可能不同。二者都支持以真实工作而非流畅演示检验认识。[现场案例](https://web.mit.edu/people/jgallien/ZaraOR2010.pdf)、[任务研究](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)\n\n## 原型之后应留下什么\n\n除了可操作功能，还应留下本轮假设、取得的观察、已经改变的认识，以及下一轮还需区分的问题。它们帮助团队避免每次从需求清单重新开始。\n\n这类现场往返需要明确投入边界。并非所有问题都值得同时解决，也不能把长期探索当作持续没有交付的理由。选择下一项试点，应看它能否影响真实业务，并改变下一步投资判断。\n","exportSingleMd":"# 第15章｜原型怎样帮助认识问题，而不只用于演示\n\n在设备服务教学情境中，一套AI工单原型在演示时很顺畅：输入描述，生成原因、动作和处置说明，点击即可保存。技术员拿自己的材料试用，却发现系统写了“更换部件”，实际没有换件。\n\n这个发现可以被当作一句措辞错误，改掉就结束；也可以成为一次更有价值的现场认识：系统是否在资料不足时补故事，真实动作从哪里进入，错误会不会进入下一次经验调用。\n\n**原型的价值，在于让业务假设接受实际操作与后果检验。** 演示成功说明流程能够走通，真实采用才会暴露它是否适合工作。\n\n## 先把原来的工作看完整\n\n观察应从有代表性的任务开始。原技术员如何取得材料，哪里反复补问，哪些工具必须打开，什么结果才算完成？记录实际经过，避免只听功能愿望。\n\n还要保留合理基线。某个步骤原本用现有系统就能完成，就不应把它全部算成AI新增贡献。某个错误原本也常发生，则需比较新安排是否减少或放大它，而非只要求新系统看起来完美。\n\n现场工作也需要节制。持续打断专家会增加负担；挑选几张最容易的工单，又会让团队高估覆盖范围。选择应围绕本轮最需要认识的差别。\n\n## 把一个关键假设做成可用安排\n\n例如假设：“系统先关联原始描述与真实动作，技术员只纠正必要差别，就能减少总结负担并保持记录准确。”\n\n这与“做一个工单助手”相比更具体。原型应让技术员用自己的材料完成一次工作，真实看到关联、草稿与修改，而不是由演示者预先准备好全部答案。\n\n使用中观察三种情况：被采用的部分为什么有用；被改动的部分缺什么；被绕开的部分增加了什么负担。满意度可以提供线索，不能替代这些实际行为。\n\n## 一次错误，应怎样改变实现\n\n“更换部件”被纠正后，先回到原材料，确认系统是否有相应依据。若没有，应把实际动作与推断原因分开，不允许流畅总结填补动作事实。\n\n再看这次纠正是否进入最终工单。若界面改对了，经验库却仍
