纯要求模型更谨慎，往往没有定位问题。\n\n## 用少一些材料，也可以得到更好的工作\n\n确定价格查询只需当前有效记录，没必要把全部历史方案都带进来；复杂替代判断则需要多个候选和重要反例。材料选择应由本次要完成的决定支配。\n\n这家经销商的积累价值，最终要在当前客户面前体现：旧经验帮助团队更快找准问题，当前事实决定实际能承诺什么。两者各就其位，知识库才从存储空间变成生产条件。\n","text":"# 第20章｜旧报价找到了，为什么还不能直接拿来用\n\n客户的产品描述与一笔旧询价很像，AI迅速找到历史报价。型号相近、数量接近、方案也成功交过。可是价格已经变化，客户本次只接受三天交货，旧案却允许十天。\n\n在工业品案例中，检索成功只解决了“找到可比较材料”。当前能不能采用，需要再看关键条件。\n\n## 长期保存与本次使用是两项工作\n\n企业可以保存原件、方法、反例和历史版本。本次任务只需要相关部分，再加当前目标、事实和可用资源。模型不会因为企业拥有这些资料，就自动读到所有重要内容。\n\n材料越多，还可能带来冲突、费用与注意力负担。上下文工程关心怎样让当前工作取得合适信息，外部记忆和检索提供机制，业务知识是否正确仍需维护。工程材料\n\n## 材料的地位需要不同\n\n| 取得的材料 | 本次怎样用 |\n|---|---|\n| 客户当前要求 | 界定目标、期限与限制 |\n| 现行价格、库存与供货确认 | 判断当前可履约路线 |\n| 历史报价与适配案例 | 提供线索，比较过去条件 |\n| 正式规则与方法状态 | 约束可以采用什么 |\n| 反例与修订 | 避免重复旧错误 |\n\n旧报价可以帮助理解怎样取舍，不能覆盖现行价格；一次成功的适配可以提示核什么，不能填满当前未知工况。它们都出现在材料包里，并不因此具有同等事实地位。\n\n \n\n## 看一次建议是否真的用对了材料\n\n检查它引用了什么，是否保留当前期限，是否把历史供应承诺当作今天可用，是否识别了适配差异。不要只读AI事后解释，还应回到实际取得的材料与输出。\n\n若正确资料存在却没进入，改关联或筛选；若进入后仍混用，改呈现、任务或核验；若资料自己已经过时，先改知识状态。单纯要求模型更谨慎，往往没有定位问题。\n\n## 用少一些材料，也可以得到更好的工作\n\n确定价格查询只需当前有效记录，没必要把全部历史方案都带进来；复杂替代判断则需要多个候选和重要反例。材料选择应由本次要完成的决定支配。\n\n这家经销商的积累价值，最终要在当前客户面前体现：旧经验帮助团队更快找准问题，当前事实决定实际能承诺什么。两者各就其位，知识库才从存储空间变成生产条件。\n"},{"file":"21-建议与真实执行.md","id":"lesson-21","number":21,"role":"核心课","part":3,"title":"第21章｜AI说“已经安排”，业务究竟发生到了哪一步","md":"# 第21章｜AI说“已经安排”，业务究竟发生到了哪一步\n\n客户仍在等上门，调度员却看到AI回复“已安排技术员”。一种可能是系统只生成建议，没有正式派工；另一种可能是派工已接受，网络中断没返回。如果按同一种办法再点一次，前者需要补提交，后者可能重复占用人员。\n\n把智能接进生产，要知道它在哪个对象上做了什么，以及当前有什么证据。\n\n## 一张工单里的几种完成\n\n[设备案例](案例C-设备售后.md)可以沿着建议、采用、系统接受、到场、恢复和复发观察。每项状态都回答不同问题，也告诉下一岗位该做什么。\n\n![建议、采用、系统接受、到场与恢复代表不同事实；无回显时先查同一次提交，才能决定续接还是重试。](assets/21-业务状态.svg)\n\n工单关闭更接近内部工作结束，客户恢复则是外部结果；当次恢复也可能在第二天复发。如果后续又建成不相关新单，企业会高估首次解决能力，低估重复服务成本。\n\n同样，报价候选、正式报价、客户接受和订单交付不能互相代替；补货建议160份与实际到店160份也不同。经营结果必须对应实际发生的动作。\n\n## 工具不是多一个按钮\n\n工具使模型查询或改变业务系统。接入时要说清对象、身份、决定范围和返回结果。例如AI可以准备派工材料，哪些规则下可以直接提交，哪些情况需要调度取舍，提交以后怎样查状态。\n\n这些关系会影响实际交付。对象不清可能派错设备，范围不清可能把候选变成承诺，结果不清则可能重复或漏做。经营者不必记接口参数，但应能沿一笔业务检查这些含义。[Agent工程材料](https://www.anthropic.com/research/building-effective-agents)\n\n## 中断以后，怎样接着做\n\n提交前留下本次请求与工单的关联。没有回显时，查的是这同一次动作，而非“这张工单以前有没有派过人”。同一设备本就可能有前一次服务，查到任意旧记录不足以证明本次完成。\n\n确认已接受，就跟进后续；确认未接受，再按当前安排提交；仍未知，则保留未知并进入相应处理。系统恢复的目标是把已发生事实找回来，不是让AI补一句更确定的话。\n\n## 人的确认应该解决实际问题\n\n稳定、可核验的动作可以由系统完成并提供证据；资源、价格或客户承诺需要相应决定权；经过验证的常规判断也可逐步扩大委派。\n\n如果每步都让人点确认，却没人核对象和结果，新增的是操作负担。反过来，可靠系统反馈可以让人员少做重复查证，集中处理真正的取舍。\n\n验收时追一笔完整工作：建议何时形成，谁采用，动作怎样接受，下一岗位看见什么，客户结果如何返回。链条追得通，企业才可以把更多工作放心交给智能。\n","html":"\u003ch1>第21章｜AI说“已经安排”，业务究竟发生到了哪一步\u003c/h1>\n\u003cp>客户仍在等上门，调度员却看到AI回复“已安排技术员”。一种可能是系统只生成建议，没有正式派工；另一种可能是派工已接受，网络中断没返回。如果按同一种办法再点一次，前者需要补提交，后者可能重复占用人员。\u003c/p>\n\u003cp>把智能接进生产，要知道它在哪个对象上做了什么，以及当前有什么证据。\u003c/p>\n\u003ch2 id=\"lesson-21-section-1\">一张工单里的几种完成\u003c/h2>\n\u003cp>\u003ca href=\"#case-c\">设备案例\u003c/a>可以沿着建议、采用、系统接受、到场、恢复和复发观察。每项状态都回答不同问题，也告诉下一岗位该做什么。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTc1IiB2aWV3Qm94PSIwIDAgMzYwIDU3NSIgcm9sZT0iaW1nIj48dGl0bGU+5q+P5Liq54q25oCB6YO95piv5LiN5ZCM5LqL5a6ePC90aXRsZT48ZGVzYz7lu7rorq7jgIHph4fnlKjjgIHns7vnu5/mjqXlj5fjgIHliLDlnLrlkozmgaLlpI3kuI3og73nm7jkupLmm7/ku6PvvJvml6Dlm57mmL7ml7blhYjmn6Xlrp7pmYXnirbmgIHjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjU3NSIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7mr4/kuKrnirbmgIHpg73mmK/kuI3lkIzkuovlrp48L3RleHQ+PGNpcmNsZSBjeD0iMzUiIGN5PSIxMDMiIH esearch/building-effective-agents)\n\n## 中断以后，怎样接着做\n\n提交前留下本次请求与工单的关联。没有回显时，查的是这同一次动作，而非“这张工单以前有没有派过人”。同一设备本就可能有前一次服务，查到任意旧记录不足以证明本次完成。\n\n确认已接受，就跟进后续；确认未接受，再按当前安排提交；仍未知，则保留未知并进入相应处理。系统恢复的目标是把已发生事实找回来，不是让AI补一句更确定的话。\n\n## 人的确认应该解决实际问题\n\n稳定、可核验的动作可以由系统完成并提供证据；资源、价格或客户承诺需要相应决定权；经过验证的常规判断也可逐步扩大委派。\n\n如果每步都让人点确认，却没人核对象和结果，新增的是操作负担。反过来，可靠系统反馈可以让人员少做重复查证，集中处理真正的取舍。\n\n验收时追一笔完整工作：建议何时形成，谁采用，动作怎样接受，下一岗位看见什么，客户结果如何返回。链条追得通，企业才可以把更多工作放心交给智能。\n","exportSingleMd":"# 第21章｜AI说“已经安排”，业务究竟发生到了哪一步\n\n客户仍在等上门，调度员却看到AI回复“已安排技术员”。一种可能是系统只生成建议，没有正式派工；另一种可能是派工已接受，网络中断没返回。如果按同一种办法再点一次，前者需要补提交，后者可能重复占用人员。\n\n把智能接进生产，要知道它在哪个对象上做了什么，以及当前有什么证据。\n\n## 一张工单里的几种完成\n\n[设备案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-c)可以沿着建议、采用、系统接受、到场、恢复和复发观察。每项状态都回答不同问题，也告诉下一岗位该做什么。\n\n![建议、采用、系统接受、到场与恢复代表不同事实；无回显时先查同一次提交，才能决定续接还是重试。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTc1IiB2aWV3Qm94PSIwIDAgMzYwIDU3NSIgcm9sZT0iaW1nIj48dGl0bGU+5q+P5Liq54q25oCB6YO95piv5LiN5ZCM5LqL5a6ePC90aXRsZT48ZGVzYz7lu7rorq7jgIHph4fnlKjjgIHns7vnu5/mjqXlj5fjgIHliLDlnLrlkozmgaLlpI3kuI3og73nm7jkupLmm7/ku6PvvJvml6Dlm57mmL7ml7blhYjmn6Xlrp7pmYXnirbmgIHjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjU3NSIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7mr4/kuKrnirbmgIHpg73mmK/kuI3lkIzkuovlrp48L3RleHQ+PGNpcmNsZSBjeD0iMzUiIGN5PSIxMDMiIHI9IjE3IiBmaWxsPS 证的常规判断也可逐步扩大委派。\n\n如果每步都让人点确认，却没人核对象和结果，新增的是操作负担。反过来，可靠系统反馈可以让人员少做重复查证，集中处理真正的取舍。\n\n验收时追一笔完整工作：建议何时形成，谁采用，动作怎样接受，下一岗位看见什么，客户结果如何返回。链条追得通，企业才可以把更多工作放心交给智能。\n"},{"file":"22-持续运行与系统演化.md","id":"lesson-22","number":22,"role":"核心课","part":3,"title":"第22章｜上线以后，哪些变化会让原来的好系统逐渐失效","md":"# 第22章｜上线以后，哪些变化会让原来的好系统逐渐失效\n\n设备增加V2版本，原知识库仍主要是V1；供应商改变交期，旧报价依然容易被检索；内容客户换了产品，专家却还在纠正相同的混写。系统可以正常打开，工作条件已经不同。\n\n长期价值取决于事实、方法、工具、人员与评价能否持续更新。维护应当进入生产计划，而不是等问题出现后再找原开发者救火。\n\n## 一次变化，可能沿几处传播\n\n新设备版本加入，首先影响经验适用范围，也可能影响工具查询和专业支持。若检索仍推荐旧案、模型又把它说得确定，接任者就更容易误用。\n\n新模型替换，也可能改变整理、引用、工具选择和停止行为；一个结果更流畅，不代表原任务全部保留。应有代表性任务帮助团队比较，而不是靠升级演示判断。\n\n| 变化 | 先检查什么 |\n|---|---|\n| 业务规则或价格更新 | 当前权威记录、边界与在途任务 |\n| 新设备或产品版本 | 旧经验是否仍适用、缺什么事实 |\n| 模型或工具改变 | 其承担的任务、执行与恢复 |\n| 人员更替 | 未写出的前提、支持与责任 |\n\n不是每次都要重建全部系统。知道变化会影响哪种行为，才能把检查控制在有意义范围，也保住已有能力。\n\n## 为什么维护费常在扩大使用后显现\n\n原型由熟悉材料的人照看，许多前提靠个人补足。更多任务与人员进入后，版本、权限、工具状态和例外组合增多，隐含依赖才暴露出来。\n\n系统技术债研究说明，模型之外的依赖、反馈和维护会形成长期负担。[原始研究](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf) 企业应把持续整理、评价、工程支持和业务配合列为相关投入；低模型账单不代表低总成本。\n\n例如[设备案例](案例C-设备售后.md)每月新增6000元维护，要靠减少可避免复访等实际作用支持。若更新一直靠专家额外加班，列示费用之外还有容量被消耗，应在工作安排中体现。\n\n## 哪些积累可以跨过下一次技术变化\n\n可追溯原件、清楚的业务状态、代表任务、方法条件和内部理解，可以支持换模型、接新工具或调服务。它们让企业不必每次从背景重新解释。\n\n关于技术互补投入的研究，也将流程、组织和人员建设与技术作用联系起来。[研究记录](https://www.nber.org/papers/w25148) 这些投入需要具体用途，不能仅以未来资产名义无限增加。\n\n过时方法可以停用，低频复杂功能可以删去，成熟业务可以减少驻场强度。能够保留有效部分、撤掉无效部分并接住新情况，是持续运行最有价值的结果。\n","html":"\u003ch1>第22章｜上线以后，哪些变化会让原来的好系统逐渐失效\u003c/h1>\n\u003cp>设备增加V2版本，原知识库仍主要是V1；供应商改变交期，旧报价依然容易被检索；内容客户换了产品，专家却还在纠正相同的混写。系统可以正常打开，工作条件已经不同。\u003c/p>\n\u003cp>长期价值取决于事实、方法、工具、人员与评价能否持续更新。维护应当进入生产计划，而不是等问题出现后再找原开发者救火。\u003c/p>\n\u003ch2 id=\"lesson-22-section-1\">一次变化，可能沿几处传播\u003c/h2>\n\u003cp>新设备版本加入，首先影响经验适用范围，也可能影响工具查询和专业支持。若检索仍推荐旧案、模型又把它说得确定，接任者就更容易误用。\u003c/p>\n\u003cp>新模型替换，也可能改变整理、引用、工具选择和停止行为；一个结果更流畅，不代表原任务全部保留。应有代表性任务帮助团队比较，而不是靠升级演示判断。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>变化\u003c/th>\n\u003cth>先检查什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>业务规则或价格更新\u003c/td>\n\u003ctd>当前权威记录、边界与在途任务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新设备或产品版本\u003c/td>\n\u003ctd>旧经验是否仍适用、缺什么事实\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型或工具改变\u003c/td>\n\u003ctd>其承担的任务、执行与恢复\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>人员更替\u003c/td>\n\u003ctd>未写出的前提、支持与责任\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>不是每次都要重建全部系统。知道变化会影响哪种行为，才能把检查控制在有意义范围，也保住已有能力。\u003c/p>\n\u003ch2 id=\"lesson-22-section-2\">为什么维护费常在扩大使用后显现\u003c/h2>\n\u003cp>原型由熟悉材料的人照看，许多前提靠个人补足。更多任务与人员进入后，版本、权限、工具状态和例外组合增多，隐含依赖才暴露出来。\u003c/p>\n\u003cp>系统技术债研究说明，模型之外的依赖、反馈和维护会形成长期负担。\u003ca href=\"https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a> 企业应把持续整理、评价、工程支持和业务配合列为相关投入；低模型账单不代表低总成本。\u003c/p>\n\u003cp>例如\u003ca href=\"#case-c\">设备案例\u003c/a>每月新增6000元维护，要靠减少可避免复访等实际作用支持。若更新一直靠专家额外加班，列示费用之外还有容量被消耗，应在工作安排中体现。\u003c/p>\n\u003ch2 id=\"lesson-22-section-3\">哪些积累可以跨过下一次技术变化\u003c/h2>\n\u003cp>可追溯原件、清楚的业务状态、代表任务、方法条件和内部理解，可以支持换模型、接新工具或调服务。它们让企业不必每次从背景重新解释。\u003c/p>\n\u003cp>关于技术互补投入的研究，也将流程、组织和人员建设与技术作用联系起来。\u003ca href=\"https://www.nber.org/papers/w25148\" target=\"_blank\" rel=\"noopener noreferrer\">研究记录\u003c/a> 这些投入需要具体用途，不能仅以未来资产名义无限增加。\u003c/p>\n\u003cp>过时方法可以停用，低频复杂功能可以删去，成熟业务可以减少驻场强度。能够保留有效部分、撤掉无效部分并接住新情况，是持续运行最有价值的结果。\u003c/p>\n","headings":[{"id":"lesson-22-section-1","label":"一次变化，可能沿几处传播"},{"id":"lesson-22-section-2","label":"为什么维护费常在扩大使用后显现"},{"id":"lesson-22-section-3","label":"哪些积累可以跨过下一次技术变化"}],"exportMd":"# 第22章｜上线以后，哪些变化会让原来的好系统逐渐失效\n\n设备增加V2版本，原知识库仍主要是V1；供应商改变交期，旧报价依然容易被检索；内容客户换了产品，专家却还在纠正相同的混写。系统可以正常打开，工作条件已经不同。\n\n长期价值取决于事实、方法、工具、人员与评价能否持续更新。维护应当进入生产计划，而不是等问题出现后再找原开发者救火。\n\n## 一次变化，可能沿几处传播\n\n新设备版本加入，首先影响经验适用范围，也可能影响工具查询和专业支持。若检索仍推荐旧案、模型又把它说得确定，接任者就更容易误用。\n\n新模型替换，也可能改变整理、引用、工具选择和停止行为；一个结果更流畅，不代表原任务全部保留。应有代表性任务帮助团队比较，而不是靠升级演示判断。\n\n| 变化 | 先检查什么 |\n|---|---|\n| 业务规则或价格更新 | 当前权威记录、边界与在途任务 |\n| 新设备或产品版本 | 旧经验是否仍适用、缺什么事实 |\n| 模型或工具改变 | 其承担的任务、执行与恢复 |\n| 人员更替 | 未写出的前提、支持与责任 |\n\n不是每次都要重建全部系统。知道变化会影响哪种行为，才能把检查控制在有意义范围，也保住已有能力。\n\n## 为什么维护费常在扩大使用后显现\n\n原型由熟悉材料的人照看，许多前提靠个人补足。更多任务与人员进入后，版本、权限、工具状态和例外组合增多，隐含依赖才暴露出来。\n\n系统技术债研究说明，模型之外的依赖、反馈和维护会形成长期负担。[原始研究](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf) 企业应把持续整理、评价、工程支持和业务配合列为相关投入；低模型账单不代表低总成本。\n\n例如[设备案例](#case-c)每月新增6000元维护，要靠减少可避免复访等实际作用支持。若更新一直靠专家额外加班，列示费用之外还有容量被消耗，应在工作安排中体现。\n\n## 哪些积累可以跨过下一次技术变化\n\n可追溯原件、清楚的业务状态、代表任务、方法条件和内部理解，可以支持换模型、接新工具或调服务。它们让企业不必每次从背景重新解释。\n\n关于技术互补投入的研究，也将流程、组织和人员建设与技术作用联系起来。[研究记录](https://www.nber.org/papers/w25148) 这些投入需要具体用途，不能仅以未来资产名义无限增加。\n\n过时方法可以停用，低频复杂功能可以删去，成熟业务可以减少驻场强度。能够保留有效部分、撤掉无效部分并接住新情况，是持续运行最有价值的结果。\n","exportSingleMd":"# 第22章｜上线以后，哪些变化会让原来的好系统逐渐失效\n\n设备增加V2版本，原知识库仍主要是V1；供应商改变交期，旧报价依然容易被检索；内容客户换了产品，专家却还在纠正相同的混写。系统可以正常打开，工作条件已经不同。\n\n长期价值取决于事实、方法、工具、人员与评价能否持续更新。维护应当进入生产计划，而不是等问题出现后再找原开发者救火。\n\n## 一次变化，可能沿几处传播\n\n新设备版本加入，首先影响经验适用范围，也可能影响工具查询和专业支持。若检索仍推荐旧案、模型又把它说得确定，接任者就更容易误用。\n\n新模型替换，也可能改变整理、引用、工具选择和停止行为；一个结果更流畅，不代表原任务全部保留。应有代表性任务帮助团队比较，而不是靠升级演示判断。\n\n| 变化 | 先检查什么 |\n|---|---|\n| 业务规则或价格更新 | 当前权威记录、边界与在途任务 |\n| 新设备或产品版本 | 旧经验是否仍适用、缺什么事实 |\n| 模型或工具改变 | 其承担的任务、执行与恢复 |\n| 人员更替 | 未写出的前提、支持与责任 |\n\n不是每次都要重建全部系统。知道变化会影响哪种行为，才能把检查控制在有意义范围，也保住已有能力。\n\n## 为什么维护费常在扩大使用后显现\n\n原型由熟悉材料的人照看，许多前提靠个人补足。更多任务与人员进入后，版本、权限、工具状态和例外组合增多，隐含依赖才暴露出来。\n\n系统技术债研究说明，模型之外的依赖、反馈和维护会形成长期负担。[原始研究](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf) 企业应把持续整理、评价、工程支持和业务配合列为相关投入；低模型账单不代表低总成本。\n\n例如[设备案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-c)每月新增6000元维护，要靠减少可避免复访等实际作用支持。若更新一直靠专家额外加班，列示费用之外还有容量被消耗，应在工作安排中体现。\n\n## 哪些积累可以跨过下一次技术变化\n\n可追溯原件、清楚的业务状态、代表任务、方法条件和内部理解，可以支持换模型、接新工具或调服务。它们让企业不必每次从背景重新解释。\n\n关于技术互补投入的研究，也将流程、组织和人员建设与技术作用联系起来。[研究记录](https://www.nber.org/papers/w25148) 这些投入需要具体 有效利用 | 合格任务、核验、返工和总资源 | 生成很多但不可采用 |\n| 工作有没有兑现价值 | 客户选择、实际动作、贡献与现金 | 文档完成而订单未发生 |\n| 本轮留下什么 | 新任务、接任和迁移是否受益 | 累计输出没改善未来 |\n\n这三项需要连接，也可能有不同回报节奏。一次探索本期没有订单，却可能排除一个错误方向；一项低成本生成可能把负担转给专家。用途不清时，调用率会变成一个容易统计却难以解释的数字。\n\n## 智能资源怎样形成可持续资产\n\n当期调用被消耗，可靠方法、工具与组织条件可能留下。企业自己的AI能力，可以由通用模型与自有经验、客户理解和生产网络组合，不必从头训练独有模型。\n\n资产价值要在未来作用中体现。旧价格不值得永久复制，处理价格变化的方法却可以继续用；一份成功报价可能过时，识别关键限制和核对交付的能力仍有用途。\n\n经营上应知道本轮消耗服务哪种任务，形成什么产出，在哪个决定上使用，哪些内容未来还要维护。累计token可以反映活动规模，不能单独给知识定价。\n\n## 资源紧张时，先改善哪一段\n\n若模型不能理解关键冲突，增加适合能力可能有效；若事实根本没取得，先改资料；若专家是瓶颈，继续增加候选只会积压；若客户不购买，不能用更便宜生成掩盖价值问题。\n\n本课报价的月度情景，把智能和共建费用放进真实订单贡献比较。企业需要掌握的，正是这种从供给到工作、经营与下一轮能力的转换，而不只是议价时每千token便宜多少。\n","html":"\u003ch1>第23章｜经营智能资源，为什么不能只盯token账单\u003c/h1>\n\u003cp>两家经销商可以购买同一模型。一家把客户原件、现行库存、工程经验和结果接起来；另一家仍在个人聊天里反复复制，纠正也只留在当事人手中。相近的智能供给，会进入不同的生产体系。\u003c/p>\n\u003cp>下一轮，两家还会继续购买智能，但前一家的部分准备和错误已经可以少做。这种差别持续发生，资源经营便开始影响竞争能力。\u003c/p>\n\u003ch2 id=\"lesson-23-section-1\">token计量什么，企业又在购买什么\u003c/h2>\n\u003cp>token是模型处理输入与输出的计量单位，可对应字词或片段。它帮助计量资源，不代表同样数量一定取得同样能力，更不是利润单位。\u003c/p>\n\u003cp>企业实际上在安排可调度智能：需要什么能力，何时可得，允许多久，能否使用工具，质量与容量是否匹配。客服高峰、技术选型、开放构思和规则查询，要求不同。\u003c/p>\n\u003cp>通用能力可以复用，企业事实与工作条件仍需接入。\u003ca href=\"https://arxiv.org/abs/2108.07258v3\" target=\"_blank\" rel=\"noopener noreferrer\">基础模型研究\u003c/a> 重视智能资源，因而既包括取得供给，也包括把供给转成可用工作。\u003c/p>\n\u003ch2 id=\"lesson-23-section-2\">一笔询价经过三次转换\u003c/h2>\n\u003cp>第一，模型读懂材料、找出冲突、形成有依据的候选，成为合格工作。更多文字并不自动提高这项转换，核验与返工仍占资源。\u003c/p>\n\u003cp>第二，合格候选进入工程、采购和客户选择，成为可履约报价与真实订单。这项转换受客户、价格、库存和交付影响。\u003c/p>\n\u003cp>第三，原件、纠正、未成交理由和结果进入可再用方法，帮助下一次询价。它改变未来准备与判断，但需要维护和再使用。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNjYwIiB2aWV3Qm94PSIwIDAgMzYwIDY2MCIgcm9sZT0iaW1nIj48dGl0bGU+5pm66IO95oCO5qC36L+b5YWl57uP6JClPC90aXRsZT48ZGVzYz7mipXlhaXnu4/lkIjmoLzlt6XkvZzjgIHph4fnlKjmiafooYzlvbHlk43lrqLmiLfnu5PmnpzvvJvlj6/nlKjnu4/pqozpnIDmlbTnkIblkozlho3nlKjmo4DpqozvvIzmiY3mlK/mjIHkuIvkuIDova7ku7vliqHj 是这种从供给到工作、经营与下一轮能力的转换，而不只是议价时每千token便宜多少。\u003c/p>\n","headings":[{"id":"lesson-23-section-1","label":"token计量什么，企业又在购买什么"},{"id":"lesson-23-section-2","label":"一笔询价经过三次转换"},{"id":"lesson-23-section-3","label":"智能资源怎样形成可持续资产"},{"id":"lesson-23-section-4","label":"资源紧张时，先改善哪一段"}],"exportMd":"# 第23章｜经营智能资源，为什么不能只盯token账单\n\n两家经销商可以购买同一模型。一家把客户原件、现行库存、工程经验和结果接起来；另一家仍在个人聊天里反复复制，纠正也只留在当事人手中。相近的智能供给，会进入不同的生产体系。\n\n下一轮，两家还会继续购买智能，但前一家的部分准备和错误已经可以少做。这种差别持续发生，资源经营便开始影响竞争能力。\n\n## token计量什么，企业又在购买什么\n\ntoken是模型处理输入与输出的计量单位，可对应字词或片段。它帮助计量资源，不代表同样数量一定取得同样能力，更不是利润单位。\n\n企业实际上在安排可调度智能：需要什么能力，何时可得，允许多久，能否使用工具，质量与容量是否匹配。客服高峰、技术选型、开放构思和规则查询，要求不同。\n\n通用能力可以复用，企业事实与工作条件仍需接入。[基础模型研究](https://arxiv.org/abs/2108.07258v3) 重视智能资源，因而既包括取得供给，也包括把供给转成可用工作。\n\n## 一笔询价经过三次转换\n\n第一，模型读懂材料、找出冲突、形成有依据的候选，成为合格工作。更多文字并不自动提高这项转换，核验与返工仍占资源。\n\n第二，合格候选进入工程、采购和客户选择，成为可履约报价与真实订单。这项转换受客户、价格、库存和交付影响。\n\n第三，原件、纠正、未成交理由和结果进入可再用方法，帮助下一次询价。它改变未来准备与判断，但需要维护和再使用。\n\n![智能投入经合格工作、采用执行影响客户与经营结果；经验经整理和再用检验成为下一轮的方法与工具。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNjYwIiB2aWV3Qm94PSIwIDAgMzYwIDY2MCIgcm9sZT0iaW1nIj48dGl0bGU+5pm66IO95oCO5qC36L+b5YWl57uP6JClPC90aXRsZT48ZGVzYz7mipXlhaXnu4/lkIjmoLzlt6XkvZzjgIHph4fnlKjmiafooYzlvbHlk43lrqLmiLfnu5PmnpzvvJvlj6/nlKjnu4/pqozpnIDmlbTnkIblkozlho3nlKjmo4DpqozvvIzmiY3mlK/mjIHkuIvkuIDova7ku7vliqHjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjY2MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm HnmoTor4Hmja48L3RleHQ+PC9zdmc+)\n\n| 经营问题 | 可用观察 | 只看用量会漏掉什么 |\n|---|---|---|\n| 智能有没有有效利用 | 合格任务、核验、返工和总资源 | 生成很多但不可采用 |\n| 工作有没有兑现价值 | 客户选择、实际动作、贡献与现金 | 文档完成而订单未发生 |\n| 本轮留下什么 | 新任务、接任和迁移是否受益 | 累计输出没改善未来 |\n\n这三项需要连接，也可能有不同回报节奏。一次探索本期没有订单，却可能排除一个错误方向；一项低成本生成可能把负担转给专家。用途不清时，调用率会变成一个容易统计却难以解释的数字。\n\n## 智能资源怎样形成可持续资产\n\n当期调用被消耗，可靠方法、工具与组织条件可能留下。企业自己的AI能力，可以由通用模型与自有经验、客户理解和生产网络组合，不必从头训练独有模型。\n\n资产价值要在未来作用中体现。旧价格不值得永久复制，处理价格变化的方法却可以继续用；一份成功报价可能过时，识别关键限制和核对交付的能力仍有用途。\n\n经营上应知道本轮消耗服务哪种任务，形成什么产出，在哪个决定上使用，哪些内容未来还要维护。累计token可以反映活动规模，不能单独给知识定价。\n\n## 资源紧张时，先改善哪一段\n\n若模型不能理解关键冲突，增加适合能力可能有效；若事实根本没取得，先改资料；若专家是瓶颈，继续增加候选只会积压；若客户不购买，不能用更便宜生成掩盖价值问题。\n\n本课报价的月度情景，把智能和共建费用放进真实订单贡献比较。企业需要掌握的，正是这种从供给到工作、经营与下一轮能力的转换，而不只是议价时每千token便宜多少。\n","exportSingleMd":"# 第23章｜经营智能资源，为什么不能只盯token账单\n\n两家经销商可以购买同一模型。一家把客户原件、现行库存、工程经验和结果接起来；另一家仍在个人聊天里反复复制，纠正也只留在当事人手中。相近的智能供给，会进入不同的生产体系。\n\n下一轮，两家还会继续购买智能，但前一家的部分准备和错误已经可以少做。这种差别持续发生，资源经营便开始影响竞争能力。\n\n## token计量什么，企业又在购买什么\n\ntoken是模型处理输入与输出的计量单位，可对应字词或片段。它帮助计量资源，不代表同样数量一定取得同样能力，更不是利润单位。\n\n企业实际上在安排可调度智能：需要什么能力，何时可得，允许多久，能否使用工具，质量与容量是否匹配。客服高峰、技术选型、开放构思和规则查询，要求不同。\n\n通用能力可以复用，企业事实与工作条件仍需接入。[基础模型研究](https://arxiv.org/abs/2108.07258v3) 重视智能资源，因而既包括取得供给，也包括把供给转成可用工作。\n\n## 一笔询价经过三次转换\n\n第一，模型读懂材料、找出冲突、形成有依据的候选，成为合格工作。更多文字并不自动提高这项转换，核验与返工仍占资源。\n\n第二，合格候选进入工程、采购和客户选择，成为可履约报价与真实订单。这项转换受客户、价格、库存和交付影响。\n\n第三，原件、纠正、未成交理由和结果进入可再用方法，帮助下一次询价。它改变未来准备与判断，但需要维护和再使用。\n\n![智能投入经合格工作、采用执行影响客户与经营结果；经验经整理和再用检验成为下一轮的方法与工具。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNjYwIiB2aWV3Qm94PSIwIDAgMzYwIDY2MCIgcm9sZT0iaW1nIj48dGl0bGU+5pm66IO95oCO5qC36L+b5YWl57uP6JClPC90aXRsZT48ZGVzYz7mipXlhaXnu4/lkIjmoLzlt6XkvZzjgIHph4fnlKjmiafooYzlvbHlk43lrqLmiLfnu5PmnpzvvJvlj6/nlKjnu4/pqozpnIDmlbTnkIblkozlho3nlKjmo4DpqozvvIzmiY3mlK/mjIHkuIvkuIDova7ku7vliqHjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRo 没有订单，却可能排除一个错误方向；一项低成本生成可能把负担转给专家。用途不清时，调用率会变成一个容易统计却难以解释的数字。\n\n## 智能资源怎样形成可持续资产\n\n当期调用被消耗，可靠方法、工具与组织条件可能留下。企业自己的AI能力，可以由通用模型与自有经验、客户理解和生产网络组合，不必从头训练独有模型。\n\n资产价值要在未来作用中体现。旧价格不值得永久复制，处理价格变化的方法却可以继续用；一份成功报价可能过时，识别关键限制和核对交付的能力仍有用途。\n\n经营上应知道本轮消耗服务哪种任务，形成什么产出，在哪个决定上使用，哪些内容未来还要维护。累计token可以反映活动规模，不能单独给知识定价。\n\n## 资源紧张时，先改善哪一段\n\n若模型不能理解关键冲突，增加适合能力可能有效；若事实根本没取得，先改资料；若专家是瓶颈，继续增加候选只会积压；若客户不购买，不能用更便宜生成掩盖价值问题。\n\n本课报价的月度情景，把智能和共建费用放进真实订单贡献比较。企业需要掌握的，正是这种从供给到工作、经营与下一轮能力的转换，而不只是议价时每千token便宜多少。\n"},{"file":"24-任务与资源配置.md","id":"lesson-24","number":24,"role":"核心课","part":4,"title":"第24章｜多付一点智能费用，什么时候反而值得","md":"# 第24章｜多付一点智能费用，什么时候反而值得\n\n技术草稿的便宜方案每份模型费0.4元，更强安排1.2元。采购很容易先看到三倍价格；工程人员可能看到少了大量核验和返工。谁的账更接近本次选择，要把任务放完整。\n\n## 先辨认真正限制结果的东西\n\n[报价案例](案例B-智能资源成本.md)既有稳定查询，也有资料冲突与适配判断。日期和现行价格可由程序处理；工况未知要先补问；多个可行候选之间的比较，才可能受更好推理支持。\n\n模型变强能改善一部分理解和判断，不能补出尚未取得的现实事实。客户只接受三天交付，若供应确认仍是未知，再长的推理也不能创造承诺。\n\n## 用边际作用比较新增投入\n\n在给定的千项草稿比较中，两方案最终达到相同质量，人工按60元/小时估价，也就是每分钟1元。B每份多0.8元模型费，只看这两项估价，若能少占超过0.8分钟，就可能覆盖额外模型费用。\n\n实际教学条件中，A常规复核4分钟，另有20%需10分钟返工；B是2分钟、5%返工。摊到每份，A平均6分钟，B2.5分钟，少3.5分钟。这解释了为什么单价更高、列示总成本却更低。是否省现金，还要看相应支出能不能取消。\n\n判断不是“贵模型总划算”，而是额外投入改变了什么、改变多少，以及有没有更好的替代。材料组织、工具连接和任务范围调整，也可以是加强方案。\n\n## 分流本身也要有能力与成本\n\n如果强安排只在适配冲突任务上有用，可以考虑区别配置。但系统要认得出这种任务：误把困难问题送到低成本路径会伤质量，把大量普通问题送到加强路径又浪费资源。\n\n| 观察到的主因 | 值得先比较的改法 |\n|---|---|\n| 规则明确而重复 | 现有软件与稳定程序 |\n| 事实缺失或版本冲突 | 补资料、关联和核验 |\n| 重要比较确实做不好 | 更适合的模型、推理或专业支持 |\n| 候选很多但难以筛选 | 控制进入量、改可核验性与选择 |\n| 总在重新准备相同任务 | 可复用方法、工具与材料 |\n\n配置方案应连同识别、例外和维护一起比较。若分流负担高于节省，暂时统一使用一个可靠方案也可能合理。\n\n## 怎样做一次有区分力的比较\n\n把相同代表材料交给原安排和加强安排，按同一标准看重要错误、核验、返工与完成时间。调方案所用材料与最终检查材料分开，防止只对见过的题有效。\n\n测试时计算研究说明，在特定推理任务中，资源配置效果受策略和难度影响。[原始研究](https://arxiv.org/abs/2408.03314) 企业采用的是这个问题意识，不能把数学任务的提升直接搬成订单回报。\n\n高价值任务不等于可以无限计算。额外候选不再改变可采用方案、结果仍受供应或客户限制时，下一笔资源就该转向别处。智能配置的精细，应来自对价值路径的理解。\n","html":"\u003ch1>第24章｜多付一点智能费用，什么时候反而值得\u003c/h1>\n\u003cp>技术草稿的便宜方案每份模型费0.4元，更强安排1.2元。采购很容易先看到三倍价格；工程人员可能看到少了大量核验和返工。谁的账更接近本次选择，要把任务放完整。\u003c/p>\n\u003ch2 id=\"lesson-24-section-1\">先辨认真正限制结果的东西\u003c/h2>\n\u003cp>\u003ca href=\"#case-b\">报价案例\u003c/a>既有稳定查询，也有资料冲突与适配判断。日期和现行价格可由程序处理；工况未知要先补问；多个可行候选之间的比较，才可能受更好推理支持。\u003c/p>\n\u003cp>模型变强能改善一部分理解和判断，不能补出尚未取得的现实事实。客户只接受三天交付，若供应确认仍是未知，再长的推理也不能创造承诺。\u003c/p>\n\u003ch2 id=\"lesson-24-section-2\">用边际作用比较新增投入\u003c/h2>\n\u003cp>在给定的千项草稿比较中，两方案最终达到相同质量，人工按60元/小时估价，也就是每分钟1元。B每份多0.8元模型费，只看这两项估价，若能少占超过0.8分钟，就可能覆盖额外模型费用。\u003c/p>\n\u003cp>实际教学条件中，A常规复核4分钟，另有20%需10分钟返工；B是2分钟、5%返工。摊到每份，A平均6分钟，B2.5分钟，少3.5分钟。这解释了为什么单价更高、列示总成本却更低。是否省现金，还要看相应支出能不能取消。\u003c/p>\n\u003cp>判断不是“贵模型总划算”，而是额外投入改变了什么、改变多少，以及有没有更好的替代。材料组织、工具连接和任务范围调整，也可以是加强方案。\u003c/p>\n\u003ch2 id=\"lesson-24-section-3\">分流本身也要有能力与成本\u003c/h2>\n\u003cp>如果强安排只在适配冲突任务上有用，可以考虑区别配置。但系统要认得出这种任务：误把困难问题送到低成本路径会伤质量，把大量普通问题送到加强路径又浪费资源。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>观察到的主因\u003c/th>\n\u003cth>值得先比较的改法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>规则明确而重复\u003c/td>\n\u003ctd>现有软件与稳定程序\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>事实缺失或版本冲突\u003c/td>\n\u003ctd>补资料、关联和核验\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>重要比较确实做不好\u003c/td>\n\u003ctd>更适合的模型、推理或专业支持\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>候选很多但难以筛选\u003c/td>\n\u003ctd>控制进入量、改可核验性与选择\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>总在重新准备相同任务\u003c/td>\n\u003ctd>可复用方法、工具与材料\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>配置方案应连同识别、例外和维护一起比较。若分流负担高于节省，暂时统一使用一个可靠方案也可能合理。\u003c/p>\n\u003ch2 id=\"lesson-24-section-4\">怎样做一次有区分力的比较\u003c/h2>\n\u003cp>把相同代表材料交给原安排和加强安排，按同一标准看重要错误、核验、返工与完成时间。调方案所用材料与最终检查材料分开，防止只对见过的题有效。\u003c/p>\n\u003cp>测试时计算研究说明，在特定推理任务中，资源配置效果受策略和难度影响。\u003ca href=\"https://arxiv.org/abs/2408.03314\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a> 企业采用的是这个问题意识，不能把数学任务的提升直接搬成订单回报。\u003c/p>\n\u003cp>高价值任务不等于可以无限计算。额外候选不再改变可采用方案、结果仍受供应或客户限制时，下一笔资源就该转向别处。智能配置的精细，应来自对价值路径的理解。\u003c/p>\n","headings":[{"id":"lesson-24-section-1","label":"先辨认真正限制结果的东西"},{"id":"lesson-24-section-2","label":"用边际作用比较新增投入"},{"id":"lesson-24-section-3","label":"分流本身也要有能力与成本"},{"id":"lesson-24-section-4","label":"怎样做一次有区分力的比较"}],"exportMd":"# 第24章｜多付一点智能费用，什么时候反而值得\n\n技术草稿的便宜方案每份模型费0.4元，更强安排1.2元。采购很容易先看到三倍价格；工程人员可能看到少了大量核验和返工。谁的账更接近本次选择，要把任务放完整。\n\n## 先辨认真正限制结果的东西\n\n[报价案例](#case-b)既有稳定查询，也有资料冲突与适配判断。日期和现行价格可由程序处理；工况未知要先补问；多个可行候选之间的比较，才可能受更好推理支持。\n\n模型变强能改善一部分理解和判断，不能补出尚未取得的现实事实。客户只接受三天交付，若供应确认仍是未知，再长的推理也不能创造承诺。\n\n## 用边际作用比较新增投入\n\n在给定的千项草稿比较中，两方案最终达到相同质量，人工按60元/小时估价，也就是每分钟1元。B每份多0.8元模型费，只看这两项估价，若能少占超过0.8分钟，就可能覆盖额外模型费用。\n\n实际教学条件中，A常规复核4分钟，另有20%需10分钟返工；B是2分钟、5%返工。摊到每份，A平均6分钟，B2.5分钟，少3.5分钟。这解释了为什么单价更高、列示总成本却更低。是否省现金，还要看相应支出能不能取消。\n\n判断不是“贵模型总划算”，而是额外投入改变了什么、改变多少，以及有没有更好的替代。材料组织、工具连接和任务范围调整，也可以是加强方案。\n\n## 分流本身也要有能力与成本\n\n如果强安排只在适配冲突任务上有用，可以考虑区别配置。但系统要认得出这种任务：误把困难问题送到低成本路径会伤质量，把大量普通问题送到加强路径又浪费资源。\n\n| 观察到的主因 | 值得先比较的改法 |\n|---|---|\n| 规则明确而重复 | 现有软件与稳定程序 |\n| 事实缺失或版本冲突 | 补资料、关联和核验 |\n| 重要比较确实做不好 | 更适合的模型、推理或专业支持 |\n| 候选很多但难以筛选 | 控制进入量、改可核验性与选择 |\n| 总在重新准备相同任务 | 可复用方法、工具与材料 |\n\n配置方案应连同识别、例外和维护一起比较。若分流负担高于节省，暂时统一使用一个可靠方案也可能合理。\n\n## 怎样做一次有区分力的比较\n\n把相同代表材料交给原安排和加强安排，按同一标准看重要错误、核验、返工与完成时间。调方案所用材料与最终检查材料分开，防止只对见过的题有效。\n\n测试时计算研究说明，在特定推理任务中，资源配置效果受策略和难度影响。[原始研究](https://arxiv.org/abs/2408.03314) 企业采用的是这个问题意识，不能把数学任务的提升直接搬成订单回报。\n\n高价值任务不等于可以无限计算。额外候选不再改变可采用方案、结果仍受供应或客户限制时，下一笔资源就该转向别处。智能配置的精细，应来自对价值路径的理解。\n","exportSingleMd":"# 第24章｜多付一点智能费用，什么时候反而值得\n\n技术草稿的便宜方案每份模型费0.4元，更强安排1.2元。采购很容易先看到三倍价格；工程人员可能看到少了大量核验和返工。谁的账更接近本次选择，要把任务放完整。\n\n## 先辨认真正限制结果的东西\n\n[报价案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-b)既有稳定查询，也有资料冲突与适配判断。日期和现行价格可由程序处理；工况未知要先补问；多个可行候选之间的比较，才可能受更好推理支持。\n\n模型变强能改善一部分理解和判断，不能补出尚未取得的现实事实。客户只接受三天交付，若供应确认仍是未知，再长的推理也不能创造承诺。\n\n## 用边际作用比较新增投入\n\n在给定的千项草稿比较中，两方案最终达到相同质量，人工按60元/小时估价，也就是每分钟1元。B每份多0.8元模型费，只看这两项估价，若能少占超过0.8分钟，就可能覆盖额外模型费用。\n\n实际教学条件中，A常规复核4分钟，另有20%需10分钟返工；B是2分钟、5%返工。摊到每份，A平均6分钟，B2.5分钟，少3.5分钟。这解释了为什么单价更高、列示总成本却更低。是否省现金，还要看相应支出能不能取消。\n\n判断不是“贵模型总划算”，而是额外投入改变了什么、改变多少，以及有没有更好的替代。材料组织、工具连接和任务范围调整，也可以是加强方案。\n\n## 分流本身也要有能力与成本\n\n如果强安排只在适配冲突任务上有用，可以考虑区别配置。但系统要认得出这种任务：误把困难问题送到低成本路径会伤质量，把大量普通问题送到加强路径又浪费资源。\n\n| 观察到的主因 | 值得先比较的改法 |\n|---|---|\n| 规则明确而重复 | 现有软件与稳定程序 |\n| 事实缺失或版本冲突 | 补资料、关联和核验 |\n| 重要比较确实做不好 | 更适合的模型、推理或专业支持 |\n| 候选很多但难以筛选 | 控制进入量、改可核验性与选择 |\n| 总在重新准备相同任务 | 可复用方法、工具与材料 |\n\n配置方案应连同识别、例外和维护一起比较。若分流负担高于节省，暂时统一使用一个可靠方案也可能合理。\n\n## 怎样做一次有区分力的比较\n\n把相同代表材料交给原安排和加强安排，按同一标准看重要错误、核验、返工与完成时间。调方案所用材料与最终检查材料分开，防止只对见过的题有效。\n\n测试时计算研究说明，在特定推理任务中，资源配置效果受策略和难度影响。[原始研究](https://arxiv.org/abs/2408.03314) 企业采用的是这个问题意识，不能把数学任务的提升直接搬成订单回报。\n\n高价值任务不等于可以无限计算。额外候选不再改变可采用方案、结果仍受供应或客户限制时，下一笔资源就该转向别处。智能配置的精细，应来自对价值路径的理解。\n","text":"# 第24章｜多付一点智能费用，什么时候反而值得\n\n技术草稿的便宜方案每份模型费0.4元，更强安排1.2元。采购很容易先看到三倍价格；工程人员可能看到少了大量核验和返工。谁的账更接近本次选择，要把任务放完整。\n\n## 先辨认真正限制结果的东西\n\n报价案例既有稳定查询，也有资料冲突与适配判断。日期和现行价格可由程序处理；工况未知要先补问；多个可行候选之间的比较，才可能受更好推理支持。\n\n模型变强能改善一部分理解和判断，不能补出尚未取得的现实事实。客户只接受三天交付，若供应确认仍是未知，再长的推理也不能创造承诺。\n\n## 用边际作用比较新增投入\n\n在给定的千项草稿比较中，两方案最终达到相同质量，人工按60元/小时估价，也就是每分钟1元。B每份多0.8元模型费，只看这两项估价，若能少占超过0.8分钟，就可能覆盖额外模型费用。\n\n实际教学条件中，A常规复核4分钟，另有20%需10分钟返工；B是2分钟、5%返工。摊到每份，A平均6分钟，B2.5分钟，少3.5分钟。这解释了为什么单价更高、列示总成本却更低。是否省现金，还要看相应支出能不能取消。\n\n判断不是“贵模型总划算”，而是额外投入改变了什么、改变多少，以及有没有更好的替代。材料组织、工具连接和任务范围调整，也可以是加强方案。\n\n## 分流本身也要有能力与成本\n\n如果强安排只在适配冲突任务上有用，可以考虑区别配置。但系统要认得出这种任务：误把困难问题送到低成本路径会伤质量，把大量普通问题送到加强路径又浪费资源。\n\n| 观察到的主因 | 值得先比较的改法 |\n|---|---|\n| 规则明确而重复 | 现有软件与稳定程序 |\n| 事实缺失或版本冲突 | 补资料、关联和核验 |\n| 重要比较确实做不好 | 更适合的模型、推理或专业支持 |\n| 候选很多但难以筛选 | 控制进入量、改可核验性与选择 |\n| 总在重新准备相同任务 | 可复用方法、工具与材料 |\n\n配置方案应连同识别、例外和维护一起比较。若分流负担高于节省，暂时统一使用一个可靠方案也可能合理。\n\n## 怎样做一次有区分力的比较\n\n把相同代表材料交给原安排和加强安排，按同一标准看重要错误、核验、返工与完成时间。调方案所用材料与最终检查材料分开，防止只对见过的题有效。\n\n测试时计算研究说明，在特定推理任务中，资源配置效果受策略和难度影响。原始研究 企业采用的是这个问题意识，不能把数学任务的提升直接搬成订单回报。\n\n高价值任务不等于可以无限计算。额外候选不再改变可采用方案、结果仍受供应或客户限制时，下一笔资源就该转向别处。智能配置的精细，应来自对价值路径的理解。\n"},{"file":"25-产能与瓶颈.md","id":"lesson-25","number":25,"role":"核心课","part":4,"title":"第25章｜每天20份初稿，为什么仍然只能交4篇","md":"# 第25章｜每天20份初稿，为什么仍然只能交4篇\n\n为工业品牌做内容的团队，AI一天产生20份草稿，专家一天只能核4篇。负责人准备再增加模型并行。看上去生产力继续提高，实际等待却越来越长。\n\n[内容服务案例](案例D-专业服务.md)把瓶颈放得很清楚：专家每天给这项工作2小时，每篇要30分钟；客户买的是准确且可发布的交付，不是待核初稿。\n\n## 用数量守恒看积压\n\n初始没有待核材料，每天20份进入、4份完成，没有取消、返工或丢失。第一天剩16份，第二天32份，第五天80份。旧产品材料和客户要求还可能在等待中变化，积压会带来重新核对与解释。\n\n![每天20份进入、4份完成核验，待核积压在第1、2、5天增至16、32、80；增加上游生成没有改变下游瓶颈。](assets/25-生成与积压.svg)\n\n把生成翻成40份，只会更快填满队列。并行是否有价值，要看整链完成量和等待，而非单次生成速度。\n\n## 瓶颈里面，究竟有哪些工作\n\nFDE观察专家核验，发现他在反复查产品资料、辨型号、确认适用场景和改事实。于是改为在生成前组织现行材料，在核验时带出处与冲突，修改再返回下一轮。\n\n若相同质量下每篇核验能从30分钟减到20分钟，同样2小时便可以核6篇。每天只生成8份有针对性的候选，也可能比20份泛化草稿更合适。少掉的10分钟必须来自实际少做的查找和重做，不能只把目标写成6篇。\n\n同时约束进入量：本例编辑在原有排题工时内选6份送审，另2份终止，不继续算待核交付。若筛选也要占专家时间，应从同一2小时扣除。否则8进6出仍会每天新增2份积压，并没有建立稳定生产。\n\n## 把容量变化算到客户付费\n\n给定20个工作日，每篇付费800元，后续外部变动成本300元，每初稿模型2元，原固定工资不变。改善方案新增FDE费用8000元/月，客户有120篇需求且后续能接住。\n\n| 安排 | 月付费交付 | 扣列示费用后的贡献 |\n|---|---:|---:|\n| 原20稿/4核 | 80篇 | 39200元 |\n| 只扩到40稿/4核 | 80篇 | 38400元 |\n| 改成8稿/6核 | 120篇 | 51680元 |\n\n改善瓶颈的方案比原来多12480元，而只扩生成少800元。模型消耗更少，经营结果却可能更好，因为资源进入了真正限制交付的地方。\n\n若客户只愿买80篇，在同样新开支下，改善方案贡献反而只有31680元。新增容量需要需求来兑现；用本例成本，至少多16篇付费交付才有正增量。完整计算见案例D。\n\n## 产能变了，下一处瓶颈在哪里\n\n技术核验变快以后，客户确认、配图、发布或销售可能限制结果。应让进入节奏参考下游可接数量、积压与优先级，而非让所有生成长期满负荷。\n\nLittle的关系在相应稳定条件下连接平均在制、流量与停留时间。[原始摘要](https://pubsonline.informs.org/doi/abs/10.1287/opre.9.3.383) 例如独立稳定系统日完成4份、均停3天，平均在制12份；不能用前面持续超载的队列推一个稳定等待天数。\n\n企业真正得到的扩产，是从客户需求到合格交付的整链能力。解开一处以后继续追下一处，才不会把AI的速度变成人和客户的等待。\n","html":"\u003ch1>第25章｜每天20份初稿，为什么仍然只能交4篇\u003c/h1>\n\u003cp>为工业品牌做内容的团队，AI一天产生20份草稿，专家一天只能核4篇。负责人准备再增加模型并行。看上去生产力继续提高，实际等待却越来越长。\u003c/p>\n\u003cp>\u003ca href=\"#case-d\">内容服务案例\u003c/a>把瓶颈放得很清楚：专家每天给这项工作2小时，每篇要30分钟；客户买的是准确且可发布的交付，不是待核初稿。\u003c/p>\n\u003ch2 id=\"lesson-25-section-1\">用数量守恒看积压\u003c/h2>\n\u003cp>初始没有待核材料，每天20份进入、4份完成，没有取消、返工或丢失。第一天剩16份，第二天32份，第五天80份。旧产品材料和客户要求还可能在等待中变化，积压会带来重新核对与解释。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTIwIiB2aWV3Qm94PSIwIDAgMzYwIDUyMCIgcm9sZT0iaW1nIj48dGl0bGU+55Sf5oiQ5aKe6ZW/77yM5b6F5qC45Lmf5aKe6ZW/PC90aXRsZT48ZGVzYz7mr4/ml6Xov5vlhaUyMOS7veOAgeWujOaIkDTku73vvIzotbflp4vml6Dnp6/ljovvvIzm 方案比原来多12480元，而只扩生成少800元。模型消耗更少，经营结果却可能更好，因为资源进入了真正限制交付的地方。\u003c/p>\n\u003cp>若客户只愿买80篇，在同样新开支下，改善方案贡献反而只有31680元。新增容量需要需求来兑现；用本例成本，至少多16篇付费交付才有正增量。完整计算见案例D。\u003c/p>\n\u003ch2 id=\"lesson-25-section-4\">产能变了，下一处瓶颈在哪里\u003c/h2>\n\u003cp>技术核验变快以后，客户确认、配图、发布或销售可能限制结果。应让进入节奏参考下游可接数量、积压与优先级，而非让所有生成长期满负荷。\u003c/p>\n\u003cp>Little的关系在相应稳定条件下连接平均在制、流量与停留时间。\u003ca href=\"https://pubsonline.informs.org/doi/abs/10.1287/opre.9.3.383\" target=\"_blank\" rel=\"noopener noreferrer\">原始摘要\u003c/a> 例如独立稳定系统日完成4份、均停3天，平均在制12份；不能用前面持续超载的队列推一个稳定等待天数。\u003c/p>\n\u003cp>企业真正得到的扩产，是从客户需求到合格交付的整链能力。解开一处以后继续追下一处，才不会把AI的速度变成人和客户的等待。\u003c/p>\n","headings":[{"id":"lesson-25-section-1","label":"用数量守恒看积压"},{"id":"lesson-25-section-2","label":"瓶颈里面，究竟有哪些工作"},{"id":"lesson-25-section-3","label":"把容量变化算到客户付费"},{"id":"lesson-25-section-4","label":"产能变了，下一处瓶颈在哪里"}],"exportMd":"# 第25章｜每天20份初稿，为什么仍然只能交4篇\n\n为工业品牌做内容的团队，AI一天产生20份草稿，专家一天只能核4篇。负责人准备再增加模型并行。看上去生产力继续提高，实际等待却越来越长。\n\n[内容服务案例](#case-d)把瓶颈放得很清楚：专家每天给这项工作2小时，每篇要30分钟；客户买的是准确且可发布的交付，不是待核初稿。\n\n## 用数量守恒看积压\n\n初始没有待核材料，每天20份进入、4份完成，没有取消、返工或丢失。第一天剩16份，第二天32份，第五天80份。旧产品材料和客户要求还可能在等待中变化，积压会带来重新核对与解释。\n\n![每天20份进入、4份完成核验，待核积压在第1、2、5天增至16、32、80；增加上游生成没有改变下游瓶颈。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTIwIiB2aWV3Qm94PSIwIDAgMzYwIDUyMCIgcm9sZT0iaW1nIj48dGl0bGU+55Sf5oiQ5aKe6ZW/77yM5b6F5qC45Lmf5aKe6ZW/PC90aXRsZT48ZGVzYz7mr4/ml6Xov5vlhaUyMOS7veOAgeWujOaIkDTku73vvIzotbflp4vml6Dnp6/ljovvvIzml6XmnKvlvoXmoLjliIbliKsxNuOAgTMy44CBODDku73jgILmlbDph4/lrojmgZLmlZnlrabnrpfkvovjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0 ZWlnaHQ9IjQwMCI+5oyB57ut6LaF6LSf6I2377yM5peg56iz5a6a5bmz5Z2H562J5b6FPC90ZXh0Pjwvc3ZnPg==)\n\n把生成翻成40份，只会更快填满队列。并行是否有价值，要看整链完成量和等待，而非单次生成速度。\n\n## 瓶颈里面，究竟有哪些工作\n\nFDE观察专家核验，发现他在反复查产品资料、辨型号、确认适用场景和改事实。于是改为在生成前组织现行材料，在核验时带出处与冲突，修改再返回下一轮。\n\n若相同质量下每篇核验能从30分钟减到20分钟，同样2小时便可以核6篇。每天只生成8份有针对性的候选，也可能比20份泛化草稿更合适。少掉的10分钟必须来自实际少做的查找和重做，不能只把目标写成6篇。\n\n同时约束进入量：本例编辑在原有排题工时内选6份送审，另2份终止，不继续算待核交付。若筛选也要占专家时间，应从同一2小时扣除。否则8进6出仍会每天新增2份积压，并没有建立稳定生产。\n\n## 把容量变化算到客户付费\n\n给定20个工作日，每篇付费800元，后续外部变动成本300元，每初稿模型2元，原固定工资不变。改善方案新增FDE费用8000元/月，客户有120篇需求且后续能接住。\n\n| 安排 | 月付费交付 | 扣列示费用后的贡献 |\n|---|---:|---:|\n| 原20稿/4核 | 80篇 | 39200元 |\n| 只扩到40稿/4核 | 80篇 | 38400元 |\n| 改成8稿/6核 | 120篇 | 51680元 |\n\n改善瓶颈的方案比原来多12480元，而只扩生成少800元。模型消耗更少，经营结果却可能更好，因为资源进入了真正限制交付的地方。\n\n若客户只愿买80篇，在同样新开支下，改善方案贡献反而只有31680元。新增容量需要需求来兑现；用本例成本，至少多16篇付费交付才有正增量。完整计算见案例D。\n\n## 产能变了，下一处瓶颈在哪里\n\n技术核验变快以后，客户确认、配图、发布或销售可能限制结果。应让进入节奏参考下游可接数量、积压与优先级，而非让所有生成长期满负荷。\n\nLittle的关系在相应稳定条件下连接平均在制、流量与停留时间。[原始摘要](https://pubsonline.informs.org/doi/abs/10.1287/opre.9.3.383) 例如独立稳定系统日完成4份、均停3天，平均在制12份；不能用前面持续超载的队列推一个稳定等待天数。\n\n企业真正得到的扩产，是从客户需求到合格交付的整链能力。解开一处以后继续追下一处，才不会把AI的速度变成人和客户的等待。\n","exportSingleMd":"# 第25章｜每天20份初稿，为什么仍然只能交4篇\n\n为工业品牌做内容的团队，AI一天产生20份草稿，专家一天只能核4篇。负责人准备再增加模型并行。看上去生产力继续提高，实际等待却越来越长。\n\n[内容服务案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-d)把瓶颈放得很清楚：专家每天给这项工作2小时，每篇要30分钟；客户买的是准确且可发布的交付，不是待核初稿。\n\n## 用数量守恒看积压\n\n初始没有待核材料，每天20份进入、4份完成，没有取消、返工或丢失。第一天剩16份，第二天32份，第五天80份。旧产品材料和客户要求还可能在等待中变化，积压会带来重新核对与解释。\n\n![每天20份进入、4份完成核验，待核积压在第1、2、5天增至16、32、80；增加上游生成没有改变下游瓶颈。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTIwIiB2aWV3Qm94PSIwIDAgMzYwIDUyMCIgcm9sZT0iaW1nIj48dGl0bGU+55Sf5oiQ5aKe6ZW/77yM5b6F5qC45Lmf5aKe6ZW/PC90aXRsZT48ZGVzYz7mr4/ml6Xov5vlhaUyMOS7veOAgeWujOaIkDTku73vvIzotbflp4vml6Dnp6/ljovvvIzml6XmnKvlvoXmoLjliIbliKsxNuOAgTMy44CBODDku73jgILmlbDph4/lrojmgZLmlZnlrabnrpfkvovjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgb W1pbHk9IlBpbmdGYW5nIFNDLE1pY3Jvc29mdCBZYUhlaSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmaWxsPSIjMjEzNDJmIiB0ZXh0LWFuY2hvcj0iZW5kIiBmb250LXdlaWdodD0iNDAwIj44MDwvdGV4dD48dGV4dCB4PSIyNCIgeT0iNDk5IiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM4NzVkMjIiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjQwMCI+5oyB57ut6LaF6LSf6I2377yM5peg56iz5a6a5bmz5Z2H562J5b6FPC90ZXh0Pjwvc3ZnPg==)\n\n把生成翻成40份，只会更快填满队列。并行是否有价值，要看整链完成量和等待，而非单次生成速度。\n\n## 瓶颈里面，究竟有哪些工作\n\nFDE观察专家核验，发现他在反复查产品资料、辨型号、确认适用场景和改事实。于是改为在生成前组织现行材料，在核验时带出处与冲突，修改再返回下一轮。\n\n若相同质量下每篇核验能从30分钟减到20分钟，同样2小时便可以核6篇。每天只生成8份有针对性的候选，也可能比20份泛化草稿更合适。少掉的10分钟必须来自实际少做的查找和重做，不能只把目标写成6篇。\n\n同时约束进入量：本例编辑在原有排题工时内选6份送审，另2份终止，不继续算待核交付。若筛选也要占专家时间，应从同一2小时扣除。否则8进6出仍会每天新增2份积压，并没有建立稳定生产。\n\n## 把容量变化算到客户付费\n\n给定20个工作日，每篇付费800元，后续外部变动成本300元，每初稿模型2元，原固定工资不变。改善方案新增FDE费用8000元/月，客户有120篇需求且后续能接住。\n\n| 安排 | 月付费交付 | 扣列示费用后的贡献 |\n|---|---:|---:|\n| 原20稿/4核 | 80篇 | 39200元 |\n| 只扩到40稿/4核 | 80篇 | 38400元 |\n| 改成8稿/6核 | 120篇 | 51680元 |\n\n改善瓶颈的方案比原来多12480元，而只扩生成少800元。模型消耗更少，经营结果却可能更好，因为资源进入了真正限制交付的地方。\n\n若客户只愿买80篇，在同样新开支下，改善方案贡献反而只有31680元。新增容量需要需求来兑现；用本例成本，至少多16篇付费交付才有正增量。完整计算见案例D。\n\n## 产能变了，下一处瓶颈在哪里\n\n技术核验变快以后，客户确认、配图、发布或销售可能限制结果。应让进入节奏参考下游可接数量、积压与优先级，而非让所有生成长期满负荷。\n\nLittle的关系在相应稳定条件下连接平均在制、流量与停留时间。[原始摘要](https://pubsonline.informs.org/doi/abs/10.1287/opre.9.3.383) 例如独立稳定系统日完成4份、均停3天，平均在制12份；不能用前面持续超载的队列推一个稳定等待天数。\n\n企业真正得到的扩产，是从客户需求到合格交付的整链能力。解开一处以后继续追下一处，才不会把AI的速度变成人和客户的等待。\n","text":"# 第25章｜每天20份初稿，为什么仍然只能交4篇\n\n为工业品牌做内容的团队，AI一天产生20份草稿，专家一天只能核4篇。负责人准备再增加模型并行。看上去生产力继续提高，实际等待却越来越长。\n\n内容服务案例把瓶颈放得很清楚：专家每天给这项工作2小时，每篇要30分钟；客户买的是准确且可发布的交付，不是待核初稿。\n\n## 用数量守恒看积压\n\n初始没有待核材料，每天20份进入、4份完成，没有取消、返工或丢失。第一天剩16份，第二天32份，第五天80份。旧产品材料和客户要求还可能在等待中变化，积压会带来重新核对与解释。\n\n \n\n把生成翻成40份，只会更快填满队列。并行是否有价值，要看整链完成量和等待，而非单次生成速度。\n\n## 瓶颈里面，究竟有哪些工作\n\nFDE观察专家核验，发现他在反复查产品资料、辨型号、确认适用场景和改事实。于是改为在生成前组织现行材料，在核验时带出处与冲突，修改再返回下一轮。\n\n若相同质量下每篇核验能从30分钟减到20分钟，同样2小时便可以核6篇。每天只生成8份有针对性的候选，也可能比20份泛化草稿更合适。少掉的10分钟必须来自实际少做的查找和重做，不能只把目标写成6篇。\n\n同时约束进入量：本例编辑在原有排题工时内选6份送审，另2份终止，不继续算待核交付。若筛选也要占专家时间，应从同一2小时扣除。否则8进6出仍会每天新增2份积压，并没有建立稳定生产。\n\n## 把容量变化算到客户付费\n\n给定20个工作日，每篇付费800元，后续外部变动成本300元，每初稿模型2元，原固定工资不变。改善方案新增FDE费用8000元/月，客户有120篇需求且后续能接住。\n\n| 安排 | 月付费交付 | 扣列示费用后的贡献 |\n|---|---:|---:|\n| 原20稿/4核 | 80篇 | 39200元 |\n| 只扩到40稿/4核 | 80篇 | 38400元 |\n| 改成8稿/6核 | 120篇 | 51680元 |\n\n改善瓶颈的方案比原来多12480元，而只扩生成少800元。模型消耗更少，经营结果却可能更好，因为资源进入了真正限制交付的地方。\n\n若客户只愿买80篇，在同样新开支下，改善方案贡献反而只有31680元。新增容量需要需求来兑现；用本例成本，至少多16篇付费交付才有正增量。完整计算见案例D。\n\n## 产能变了，下一处瓶颈在哪里\n\n技术核验变快以后，客户确认、配图、发布或销售可能限制结果。应让进入节奏参考下游可接数量、积压与优先级，而非让所有生成长期满负荷。\n\nLittle的关系在相应稳定条件下连接平均在制、流量与停留时间。原始摘要 例如独立稳定系统日完成4份、均停3天，平均在制12份；不能用前面持续超载的队列推一个稳定等待天数。\n\n企业真正得到的扩产，是从客户需求到合格交付的整链能力。解开一处以后继续追下一处，才不会把AI的速度变成人和客户的等待。\n"},{"file":"26-完整成本与兑现.md","id":"lesson-26","number":26,"role":"核心课","part":4,"title":"第26章｜便宜的调用，为什么可能得到更贵的工作","md":"# 第26章｜便宜的调用，为什么可能得到更贵的工作\n\n报价系统的模型费在采购账里很清楚，专家复核、返工和客户等待却散在别处。按调用单价选择，很容易把成本移给人员；把少占工时全部算成现金，又会高估回报。\n\n先在同等合格任务下比较，再追释放的能力如何兑现，才能把几种账连起来。\n\n## 同一千份技术草稿，先统一质量\n\n采用[报价案例](案例B-智能资源成本.md)的独立条件：A、B处理相同1000份材料，全部复核，失败全部发现并返工到同样标准。人工按60元/小时估价，建设和维护暂不进入这张局部账。\n\n| 给定条件 | A | B |\n|---|---:|---:|\n| 每份模型费 | 0.4元 | 1.2元 |\n| 常规复核 | 4分钟 | 2分钟 |\n| 额外返工比例 | 20% | 5% |\n| 每份额外返工 | 10分钟 | 10分钟 |\n\nA模型400元；复核4000分钟，估价4000元；200份返工2000分钟，估价2000元。合6400元，人工100小时。\n\nB模型1200元；复核2000分钟，估价2000元；50份返工500分钟，估价500元。合3700元，人工约41.67小时。\n\n![同等千份合格技术草稿中，A列示模型、复核与返工总负担6400元，B3700元；图未包含建设维护，也不等同现金。](assets/26-合格工作的成本.svg)\n\nB多花800元模型费，少占约58.33小时，列示成本少2700元。质量是重要前提：若B漏检错误，或处理的材料更容易，比较就不再回答同一个问题。\n\n## 工时释放怎样变成现金或交付\n\n工资固定，少占时间不会自动少发工资。若其中20小时外包确实取消，每小时少付60元，现金减少1200元；扣新增模型800元，现金改善400元。\n\n其余时间可以用于更多有效报价、质量改进或减负。若没有实际用途，不能再全部按新增收入计入；同一小时也不能既当取消支出，又当新增业务重复取得收益。\n\n如果企业最紧的是现金、没有可取消支出和新用途，多花800元仍需说明理由；如果专家正限制有需求订单，释放的容量可能更重要，但要追到实际新增交付。相同技术比较，会因经营约束不同而改变选择。\n\n## 从草稿账走到月度经营账\n\n案例另给月1000笔有效询价，原200单、每单贡献500元。新共建9000元、模型1200元、工具800元，合11000元/月。\n\n增加20单，只多10000元，尚少1000元；增加50单，多25000元，扣费用后增14000元。若250单的单均贡献因降价变成400元，却比原来少11000元。更快报价、更多订单与更多利润之间，需要各自的证据。\n\n月账已经包含模型与共建费用，不能把局部估价差2700元再整笔加进去。两张账分别回答新系统内部用哪种供给、整条业务是否值得投入。\n\n## 一次性建设和持续能力怎样列\n\n烘焙案例的一次接入6000元，不能藏在日贡献里消失；给定正常条件连续20日，多640元/日，扣接入后才是6800元列示增量。实际需求不稳定，应用实际结果替换，不把20日自动当承诺。\n\n案例、工具和评价材料如果帮助以后少做准备，可以作为未来用途单列。技术互补投入研究说明流程、人员与组织条件的重要性，办公研究也提醒个人省时与工作重组并非同一观察。[互补投入](https://www.nber.org/papers/w25148)、[办公研究](https://arxiv.org/html/2504.11436v4)\n\n一项投资可以同时有当前收益与能力建设意义，但要分别讲清。这样，负责人知道为哪种结果付钱，也知道哪些尚待兑现。\n","html":"\u003ch1>第26章｜便宜的调用，为什么可能得到更贵的工作\u003c/h1>\n\u003cp>报价系统的模型费在采购账里很清楚，专家复核、返工和客户等待却散在别处。按调用单价选择，很容易把成本移给人员；把少占工时全部算成现金，又会高估回报。\u003c/p>\n\u003cp>先在同等合格任务下比较，再追释放的能力如何兑现，才能把几种账连起来。\u003c/p>\n\u003ch2 id=\"lesson-26-section-1\">同一千份技术草稿，先统一质量\u003c/h2>\n\u003cp>采用\u003ca href=\"#case-b\">报价案例\u003c/a>的独立条件：A、B处理相同1000份材料，全部复核，失败全部发现并返工到同样标准。人工按60元/小时估价，建设和维护暂不进入这张局部账。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>给定条件\u003c/th>\n\u003cth align=\"right\">A\u003c/th>\n\u003cth align=\"right\">B\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>每份模型费\u003c/td>\n\u003ctd align=\"right\">0.4元\u003c/td>\n\u003ctd align=\"right\">1.2元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>常规复核\u003c/td>\n\u003ctd align=\"right\">4分钟\u003c/td>\n\u003ctd align=\"right\">2分钟\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>额外返工比例\u003c/td>\n\u003ctd align=\"right\">20%\u003c/td>\n\u003ctd align=\"right\">5%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>每份额外返工\u003c/td>\n\u003ctd align=\"right\">10分钟\u003c/td>\n\u003ctd align=\"right\">10分钟\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A模型400元；复核4000分钟，估价4000元；200份返工2000分钟，估价2000元。合6400元，人工100小时。\u003c/p>\n\u003cp>B模型1200元；复核2000分钟，估价2000元；50份返工500分钟，估价500元。合3700元，人工约41.67小时。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNDMwIiB2aWV3Qm94PSIwIDAgMzYwIDQzMCIgcm9sZT0iaW1nIj48dGl0bGU+5q+U6L6D5ZCI5qC85bel5L2c55qE5oC76LSf5ouFPC90aXRs tion-1","label":"同一千份技术草稿，先统一质量"},{"id":"lesson-26-section-2","label":"工时释放怎样变成现金或交付"},{"id":"lesson-26-section-3","label":"从草稿账走到月度经营账"},{"id":"lesson-26-section-4","label":"一次性建设和持续能力怎样列"}],"exportMd":"# 第26章｜便宜的调用，为什么可能得到更贵的工作\n\n报价系统的模型费在采购账里很清楚，专家复核、返工和客户等待却散在别处。按调用单价选择，很容易把成本移给人员；把少占工时全部算成现金，又会高估回报。\n\n先在同等合格任务下比较，再追释放的能力如何兑现，才能把几种账连起来。\n\n## 同一千份技术草稿，先统一质量\n\n采用[报价案例](#case-b)的独立条件：A、B处理相同1000份材料，全部复核，失败全部发现并返工到同样标准。人工按60元/小时估价，建设和维护暂不进入这张局部账。\n\n| 给定条件 | A | B |\n|---|---:|---:|\n| 每份模型费 | 0.4元 | 1.2元 |\n| 常规复核 | 4分钟 | 2分钟 |\n| 额外返工比例 | 20% | 5% |\n| 每份额外返工 | 10分钟 | 10分钟 |\n\nA模型400元；复核4000分钟，估价4000元；200份返工2000分钟，估价2000元。合6400元，人工100小时。\n\nB模型1200元；复核2000分钟，估价2000元；50份返工500分钟，估价500元。合3700元，人工约41.67小时。\n\n![同等千份合格技术草稿中，A列示模型、复核与返工总负担6400元，B3700元；图未包含建设维护，也不等同现金。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNDMwIiB2aWV3Qm94PSIwIDAgMzYwIDQzMCIgcm9sZT0iaW1nIj48dGl0bGU+5q+U6L6D5ZCI5qC85bel5L2c55qE5oC76LSf5ouFPC90aXRsZT48ZGVzYz7lkIznrYnljYPpobnlkIjmoLzku7vliqHkuK3vvIxB5Li6NjQwMOWFg++8jELkuLozNzAw5YWD77yM5YyF5ZCr5qih5Z6L44CB5aSN5qC45LiO6L+U5bel5Lyw5Lu377yM5pyq5ZCr5bu66K6+57u05oqk44CCPC9kZXNjPjxkZWZzPjxtYXJrZXIgaWQ9ImFycm93IiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI3IiBtYXJrZXJIZWlnaHQ9IjciIG9yaWVudD0iYXV0by1zdGFydC1yZXZlcnNlIj48cGF0aCBkPSJNMCAwTDEwIDVMMCAxMHoiIGZpbGw9IiMxNjVkNTIiLz48L21hcmtlcj48cGF0dGVybiBpZD0idW5rbm93biIgd2lkdGg9IjgiIGhlaWdodD0iOCIgcGF0dGVyblVuaXRzPSJ1c2VyU3BhY2VPblVzZSI+PHBhdGggZD0iTS0yIDJMMiAtMk0wIDhMOCAwTTYgMTBMMTAgNiIgc3Ryb2tlPSIjODc1ZDIyIiBzdHJva2Utd2lkdGg9IjEuNSIvPjwvcGF0dGVybj48L2RlZnM+PHJlY3Qgd2lkdGg9IjM2MCIgaGVpZ2h0PSI0MzAiIHJ4PSI4IiBmaWxsPSIjZjZmOGYzIi8+PHRleHQgeD0iMjQiIHk9IjM5IiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMjQiIGZpbGw9IiMyMTM0MmYiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjQwMCI+5q+U6L6D5ZCI5qC85bel5L2c55qE5oC76LSf5ouFPC90ZXh0Pjx0ZXh0IHg9IjI0IiB5PSI4MCIgZm9udC1mYW1pbHk9IlBpbmdGYW5nIFNDLE1pY 14000元。若250单的单均贡献因降价变成400元，却比原来少11000元。更快报价、更多订单与更多利润之间，需要各自的证据。\n\n月账已经包含模型与共建费用，不能把局部估价差2700元再整笔加进去。两张账分别回答新系统内部用哪种供给、整条业务是否值得投入。\n\n## 一次性建设和持续能力怎样列\n\n烘焙案例的一次接入6000元，不能藏在日贡献里消失；给定正常条件连续20日，多640元/日，扣接入后才是6800元列示增量。实际需求不稳定，应用实际结果替换，不把20日自动当承诺。\n\n案例、工具和评价材料如果帮助以后少做准备，可以作为未来用途单列。技术互补投入研究说明流程、人员与组织条件的重要性，办公研究也提醒个人省时与工作重组并非同一观察。[互补投入](https://www.nber.org/papers/w25148)、[办公研究](https://arxiv.org/html/2504.11436v4)\n\n一项投资可以同时有当前收益与能力建设意义，但要分别讲清。这样，负责人知道为哪种结果付钱，也知道哪些尚待兑现。\n","exportSingleMd":"# 第26章｜便宜的调用，为什么可能得到更贵的工作\n\n报价系统的模型费在采购账里很清楚，专家复核、返工和客户等待却散在别处。按调用单价选择，很容易把成本移给人员；把少占工时全部算成现金，又会高估回报。\n\n先在同等合格任务下比较，再追释放的能力如何兑现，才能把几种账连起来。\n\n## 同一千份技术草稿，先统一质量\n\n采用[报价案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-b)的独立条件：A、B处理相同1000份材料，全部复核，失败全部发现并返工到同样标准。人工按60元/小时估价，建设和维护暂不进入这张局部账。\n\n| 给定条件 | A | B |\n|---|---:|---:|\n| 每份模型费 | 0.4元 | 1.2元 |\n| 常规复核 | 4分钟 | 2分钟 |\n| 额外返工比例 | 20% | 5% |\n| 每份额外返工 | 10分钟 | 10分钟 |\n\nA模型400元；复核4000分钟，估价4000元；200份返工2000分钟，估价2000元。合6400元，人工100小时。\n\nB模型1200元；复核2000分钟，估价2000元；50份返工500分钟，估价500元。合3700元，人工约41.67小时。\n\n![同等千份合格技术草稿中，A列示模型、复核与返工总负担6400元，B3700元；图未包含建设维护，也不等同现金。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNDMwIiB2aWV3Qm94PSIwIDAgMzYwIDQzMCIgcm9sZT0iaW1nIj48dGl0bGU+5q+U6L6D5ZCI5qC85bel5L2c55qE5oC76LSf5ouFPC90aXRsZT48ZGVzYz7lkIznrYnljYPpobnlkIjmoLzku7vliqHkuK3vvIxB5Li6NjQwMOWFg++8jELkuLozNzAw5YWD77yM5YyF5ZCr5qih5Z6L44CB5aSN5qC45LiO6L+U5bel5Lyw5Lu377yM5pyq5ZCr5bu66K6+57u05oqk44CCPC9kZXNjPjxkZWZzPjxtYXJrZXIgaWQ9ImFycm93IiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI3IiBtYXJrZXJIZWlnaHQ9IjciIG9yaWVudD0iYXV0by1zdGFydC1yZXZlcnNlIj48cGF0aCBkPSJNMCAwTDEwIDVMMCAxMHoiIGZpbGw9IiMxNjVkNTIiLz48L21hcmtlcj48cGF0dGVybiBpZD0idW5rbm93biIgd2lkdGg9IjgiIGhlaWdodD0iOCIgcGF0dGVyblVuaXRzPSJ1c2VyU3BhY2VPblVzZSI+PHBhdGggZD0iTS0yIDJMMiAtMk0wIDhMOCAwTTYgMTBMMTAgNiIgc3Ryb2tlPSIjODc1ZDIyIiBzdHJva2Utd2lkdGg9IjEuNSIvPjwvcGF0dGVybj48L2RlZnM+PHJlY3Qgd2lkdGg9IjM2MCIgaGVpZ2h0P 小时少付60元，现金减少1200元；扣新增模型800元，现金改善400元。\n\n其余时间可以用于更多有效报价、质量改进或减负。若没有实际用途，不能再全部按新增收入计入；同一小时也不能既当取消支出，又当新增业务重复取得收益。\n\n如果企业最紧的是现金、没有可取消支出和新用途，多花800元仍需说明理由；如果专家正限制有需求订单，释放的容量可能更重要，但要追到实际新增交付。相同技术比较，会因经营约束不同而改变选择。\n\n## 从草稿账走到月度经营账\n\n案例另给月1000笔有效询价，原200单、每单贡献500元。新共建9000元、模型1200元、工具800元，合11000元/月。\n\n增加20单，只多10000元，尚少1000元；增加50单，多25000元，扣费用后增14000元。若250单的单均贡献因降价变成400元，却比原来少11000元。更快报价、更多订单与更多利润之间，需要各自的证据。\n\n月账已经包含模型与共建费用，不能把局部估价差2700元再整笔加进去。两张账分别回答新系统内部用哪种供给、整条业务是否值得投入。\n\n## 一次性建设和持续能力怎样列\n\n烘焙案例的一次接入6000元，不能藏在日贡献里消失；给定正常条件连续20日，多640元/日，扣接入后才是6800元列示增量。实际需求不稳定，应用实际结果替换，不把20日自动当承诺。\n\n案例、工具和评价材料如果帮助以后少做准备，可以作为未来用途单列。技术互补投入研究说明流程、人员与组织条件的重要性，办公研究也提醒个人省时与工作重组并非同一观察。[互补投入](https://www.nber.org/papers/w25148)、[办公研究](https://arxiv.org/html/2504.11436v4)\n\n一项投资可以同时有当前收益与能力建设意义，但要分别讲清。这样，负责人知道为哪种结果付钱，也知道哪些尚待兑现。\n","text":"# 第26章｜便宜的调用，为什么可能得到更贵的工作\n\n报价系统的模型费在采购账里很清楚，专家复核、返工和客户等待却散在别处。按调用单价选择，很容易把成本移给人员；把少占工时全部算成现金，又会高估回报。\n\n先在同等合格任务下比较，再追释放的能力如何兑现，才能把几种账连起来。\n\n## 同一千份技术草稿，先统一质量\n\n采用报价案例的独立条件：A、B处理相同1000份材料，全部复核，失败全部发现并返工到同样标准。人工按60元/小时估价，建设和维护暂不进入这张局部账。\n\n| 给定条件 | A | B |\n|---|---:|---:|\n| 每份模型费 | 0.4元 | 1.2元 |\n| 常规复核 | 4分钟 | 2分钟 |\n| 额外返工比例 | 20% | 5% |\n| 每份额外返工 | 10分钟 | 10分钟 |\n\nA模型400元；复核4000分钟，估价4000元；200份返工2000分钟，估价2000元。合6400元，人工100小时。\n\nB模型1200元；复核2000分钟，估价2000元；50份返工500分钟，估价500元。合3700元，人工约41.67小时。\n\n \n\nB多花800元模型费，少占约58.33小时，列示成本少2700元。质量是重要前提：若B漏检错误，或处理的材料更容易，比较就不再回答同一个问题。\n\n## 工时释放怎样变成现金或交付\n\n工资固定，少占时间不会自动少发工资。若其中20小时外包确实取消，每小时少付60元，现金减少1200元；扣新增模型800元，现金改善400元。\n\n其余时间可以用于更多有效报价、质量改进或减负。若没有实际用途，不能再全部按新增收入计入；同一小时也不能既当取消支出，又当新增业务重复取得收益。\n\n如果企业最紧的是现金、没有可取消支出和新用途，多花800元仍需说明理由；如果专家正限制有需求订单，释放的容量可能更重要，但要追到实际新增交付。相同技术比较，会因经营约束不同而改变选择。\n\n## 从草稿账走到月度经营账\n\n案例另给月1000笔有效询价，原200单、每单贡献500元。新共建9000元、模型1200元、工具800元，合11000元/月。\n\n增加20单，只多10000元，尚少1000元；增加50单，多25000元，扣费用后增14000元。若250单的单均贡献因降价变成400元，却比原来少11000元。更快报价、更多订单与更多利润之间，需要各自的证据。\n\n月账已经包含模型与共建费用，不能把局部估价差2700元再整笔加进去。两张账分别回答新系统内部用哪种供给、整条业务是否值得投入。\n\n## 一次性建设和持续能力怎样列\n\n烘焙案例的一次接入6000元，不能藏在日贡献里消失；给定正常条件连续20日，多640元/日，扣接入后才是6800元列示增量。实际需求不稳定，应用实际结果替换，不把20日自动当承诺。\n\n案例、工具和评价材料如果帮助以后少做准备，可以作为未来用途单列。技术互补投入研究说明流程、人员与组织条件的重要性，办公研究也提醒个人省时与工作重组并非同一观察。互补投入、办公研究\n\n一项投资可以同时有当前收益与能力建设意义，但要分别讲清。这样，负责人知道为哪种结果付钱，也知道哪些尚待兑现。\n"},{"file":"27-能力留存.md","id":"lesson-27","number":27,"role":"核心课","part":4,"title":"第27章｜本轮智能消耗以后，什么值得留给企业","md":"# 第27章｜本轮智能消耗以后，什么值得留给企业\n\n旧报价会过期，供应承诺会变，固定配货数量也可能失效。企业如果把这些结果原封不动保存得更多，下一次反而更容易用错。\n\n资产留存应从未来用途判断：什么能减少重复准备、支持新任务，或者帮助企业更快改变方法。\n\n## 同一案例里，留下的东西价值不同\n\n在[报价案例](案例B-智能资源成本.md)中，“某日某型号多少钱”适合保留为历史事实，当前报价应查现行来源；“遇到替代要求先核工况和期限”则可能继续帮助新任务。\n\n烘焙连锁的160/60是给定条件下的方案；更值得复用的是如何识别供给封顶、连接排产与推广、比较最好的替代，再用结果更新。设备服务的一次恢复也可能只产生候选解释，而出发前核对完整条件可以先成为工作方法。\n\n| 留存对象 | 未来用途 | 维护重点 |\n|---|---|---|\n| 有条件的案例与反例 | 提供线索，少走已知错误路径 | 情境、依据与采用状态 |\n| 工具和共同业务结构 | 减少重复连接与解释 | 实际入口、状态和责任 |\n| 代表性任务 | 比较模型、规则与新版本 | 覆盖新变化，保留未调试材料 |\n| 团队共同理解 | 判断用途和组织实际采用 | 带教、接任与持续参与 |\n\n组织知识和吸收能力研究支持关注这些相关积累，但不能用文件数直接给它们估值。[知识研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)、[吸收能力](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n## 先积累什么，需要选择\n\n看后续会不会再用、会不会改变重要决定、维持有效需要多少负担。低频但后果重要的版本差异值得留，变化很快的事实则适合使用时查询。\n\n如果没人使用，适用条件也解释不清，维护长期占用专家，条目可以退到历史材料，暂停主动推荐。原始证据保留，当前采用权重改变，两者并不矛盾。\n\n系统依赖也会带来负担。共享工具若只为某个旧场景不断增加例外，可能需要拆分或替换，而非永远以资产名义维护。[系统技术债](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n## 用下一次工作，看这次是否真正留下能力\n\n新销售面对未见过的询价，能否更快确定缺项并取得现行事实？接任技术员能否识别版本和原方法的边界？新门店能否少做共同准备，又重新学习自己的需求？\n\n这些检验把“企业自己的AI”落到生产。通用模型可以更换，自有特色仍体现在客户理解、方法、工具和协作组合中。\n\n本轮结束时，只需给未来用途一个具体名字：留下什么、谁会再用、需要什么条件、谁负责维护、怎样知道它有帮助。暂时没有未来用途的一次性交付，也可以按当期价值评价，不必强行包装成资产。\n","html":"\u003ch1>第27章｜本轮智能消耗以后，什么值得留给企业\u003c/h1>\n\u003cp>旧报价会过期，供应承诺会变，固定配货数量也可能失效。企业如果把这些结果原封不动保存得更多，下一次反而更容易用错。\u003c/p>\n\u003cp>资产留存应从未来用途判断：什么能减少重复准备、支持新任务，或者帮助企业更快改变方法。\u003c/p>\n\u003ch2 id=\"lesson-27-section-1\">同一案例里，留下的东西价值不同\u003c/h2>\n\u003cp>在\u003ca href=\"#case-b\">报价案例\u003c/a>中，“某日某 在客户理解、方法、工具和协作组合中。\u003c/p>\n\u003cp>本轮结束时，只需给未来用途一个具体名字：留下什么、谁会再用、需要什么条件、谁负责维护、怎样知道它有帮助。暂时没有未来用途的一次性交付，也可以按当期价值评价，不必强行包装成资产。\u003c/p>\n","headings":[{"id":"lesson-27-section-1","label":"同一案例里，留下的东西价值不同"},{"id":"lesson-27-section-2","label":"先积累什么，需要选择"},{"id":"lesson-27-section-3","label":"用下一次工作，看这次是否真正留下能力"}],"exportMd":"# 第27章｜本轮智能消耗以后，什么值得留给企业\n\n旧报价会过期，供应承诺会变，固定配货数量也可能失效。企业如果把这些结果原封不动保存得更多，下一次反而更容易用错。\n\n资产留存应从未来用途判断：什么能减少重复准备、支持新任务，或者帮助企业更快改变方法。\n\n## 同一案例里，留下的东西价值不同\n\n在[报价案例](#case-b)中，“某日某型号多少钱”适合保留为历史事实，当前报价应查现行来源；“遇到替代要求先核工况和期限”则可能继续帮助新任务。\n\n烘焙连锁的160/60是给定条件下的方案；更值得复用的是如何识别供给封顶、连接排产与推广、比较最好的替代，再用结果更新。设备服务的一次恢复也可能只产生候选解释，而出发前核对完整条件可以先成为工作方法。\n\n| 留存对象 | 未来用途 | 维护重点 |\n|---|---|---|\n| 有条件的案例与反例 | 提供线索，少走已知错误路径 | 情境、依据与采用状态 |\n| 工具和共同业务结构 | 减少重复连接与解释 | 实际入口、状态和责任 |\n| 代表性任务 | 比较模型、规则与新版本 | 覆盖新变化，保留未调试材料 |\n| 团队共同理解 | 判断用途和组织实际采用 | 带教、接任与持续参与 |\n\n组织知识和吸收能力研究支持关注这些相关积累，但不能用文件数直接给它们估值。[知识研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)、[吸收能力](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n## 先积累什么，需要选择\n\n看后续会不会再用、会不会改变重要决定、维持有效需要多少负担。低频但后果重要的版本差异值得留，变化很快的事实则适合使用时查询。\n\n如果没人使用，适用条件也解释不清，维护长期占用专家，条目可以退到历史材料，暂停主动推荐。原始证据保留，当前采用权重改变，两者并不矛盾。\n\n系统依赖也会带来负担。共享工具若只为某个旧场景不断增加例外，可能需要拆分或替换，而非永远以资产名义维护。[系统技术债](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n## 用下一次工作，看这次是否真正留下能力\n\n新销售面对未见过的询价，能否更快确定缺项并取得现行事实？接任技术员能否识别版本和原方法的边界？新门店能否少做共同准备，又重新学习自己的需求？\n\n这些检验把“企业自己的AI”落到生产。通用模型可以更换，自有特色仍体现在客户理解、方法、工具和协作组合中。\n\n本轮结束时，只需给未来用途一个具体名字：留下什么、谁会再用、需要什么条件、谁负责维护、怎样知道它有帮助。暂时没有未来用途的一次性交付，也可以按当期价值评价，不必强行包装成资产。\n","exportSingleMd":"# 第27章｜本轮智能消耗以后，什么值得留给企业\n\n旧报价会过期，供应承诺会变，固定配货数量也可能失效。企业如果把这些结果原封不动保存得更多，下一次反而更容易用错。\n\n资产留存应从未来用途判断：什么能减少重复准备、支持新任务，或者帮助企业更快改变方法。\n\n## 同一案例里，留下的东西价值不同\n\n在[报价案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-b)中，“某日某型号多少钱”适合保留为历史事实，当前报价应查现行来源；“遇到替代要求先核工况和期限”则可能继续帮助新任务。\n\n烘焙连锁的160/60是给定条件下的方案；更值得复用的是如何识别供给封顶、连接排产与推广、比较最好的替代，再用结果更新。设备服务的一次恢复也可能只产生候选解释，而出发前核对完整条件可以先成为工作方法。\n\n| 留存对象 | 未来用途 | 维护重点 |\n|---|---|---|\n| 有条件的案例与反例 | 提供线索，少走已知错误路径 | 情境、依据与采用状态 |\n| 工具和共同业务结构 | 减少重复连接与解释 | 实际入口、状态和责任 |\n| 代表性任务 | 比较模型、规则与新版本 | 覆盖新变化，保留未调试材料 |\n| 团队共同理解 | 判断用途和组织实际采用 | 带教、接任与持续参与 |\n\n组织知识和吸收能力研究支持关注这些相关积累，但不能用文件数直接给它们估值。[知识研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)、[吸收能力](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n## 先积累什么，需要选择\n\n看后续会不会再用、会不会改变重要决定、维持有效需要多少负担。低频但后果重要的版本差异值得留，变化很快的事实则适合使用时查询。\n\n如果没人使用，适用条件也解释不清，维护长期占用专家，条目可以退到历史材料，暂停主动推荐。原始证据保留，当前采用权重改变，两者并不矛盾。\n\n系统依赖也会带来负担。共享工具若只为某个旧场景不断增加例外，可能需要拆分或替换，而非永远以资产名义维护。[系统技术债](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n## 用下一次工作，看这次是否真正留下能力\n\n新销售面对未见过的询价，能否更快确定缺项并取得现行事实？接任技术员能否识别版本和原方法的边界？新门店能否少做共同准备，又重新学习自己的需求？\n\n这些检验把“企业自己的AI”落到生产。通用模型可以更换，自有特色仍体现在客户理解、方法、工具和协作组合中。\n\n本轮结束时，只需给未来用途一个具体名字：留下什么、谁会再用、需要什么条件、谁负责维护、怎样知道它有帮助。暂时没有未来用途的一次性交付，也可以按当期价值评价，不必强行包装成资产。\n","text":"# 第27章｜本轮智能消耗以后，什么值得留给企业\n\n旧报价会过期，供应承诺会变，固定配货数量也可能失效。企业如果把这些结果原封不动保存得更多，下一次反而更容易用错。\n\n资产留存应从未来用途判断：什么能减少重复准备、支持新任务，或者帮助企业更快改变方法。\n\n## 同一案例里，留下的东西价值不同\n\n在报价案例中，“某日某型号多少钱”适合保留为历史事实，当前报价应查现行来源；“遇到替代要求先核工况和期限”则可能继续帮助新任务。\n\n烘焙连锁的160/60是给定条件下的方案；更值得复用的是如何识别供给封顶、连接排产与推广、比较最好的替代，再用结果更新。设备服务的一次恢复也可能只产生候选解释，而出发前核对完整条件可以先成为工作方法。\n\n| 留存对象 | 未来用途 | 维护重点 |\n|---|---|---|\n| 有条件的案例与反例 | 提供线索，少走已知错误路径 | 情境、依据与采用状态 |\n| 工具和共同业务结构 | 减少重复连接与解释 | 实际入口、状态和责任 |\n| 代表性任务 | 比较模型、规则与新版本 | 覆盖新变化，保留未调试材料 |\n| 团队共同理解 | 判断用途和组织实际采用 | 带教、接任与持续参与 |\n\n组织知识和吸收能力研究支持关注这些相关积累，但不能用文件数直接给它们估值。知识研究、吸收能力\n\n## 先积累什么，需要选择\n\n看后续会不会再用、会不会改变重要决定、维持有效需要多少负担。低频但后果重要的版本差异值得留，变化很快的事实则适合使用时查询。\n\n如果没人使用，适用条件也解释不清，维护长期占用专家，条目可以退到历史材料，暂停主动推荐。原始证据保留，当前采用权重改变，两者并不矛盾。\n\n系统依赖也会带来负担。共享工具若只为某个旧场景不断增加例外，可能需要拆分或替换，而非永远以资产名义维护。系统技术债\n\n## 用下一次工作，看这次是否真正留下能力\n\n新销售面对未见过的询价，能否更快确定缺项并取得现行事实？接任技术员能否识别版本和原方法的边界？新门店能否少做共同准备，又重新学习自己的需求？\n\n这些检验把“企业自己的AI”落到生产。通用模型可以更换，自有特色仍体现在客户理解、方法、工具和协作组合中。\n\n本轮结束时，只需给未来用途一个具体名字：留下什么、谁会再用、需要什么条件、谁负责维护、怎样知道它有帮助。暂时没有未来用途的一次性交付，也可以按当期价值评价，不必强行包装成资产。\n"},{"file":"28-投入组合.md","id":"lesson-28","number":28,"role":"核心课","part":4,"title":"第28章｜当期交付、探索与维护，为什么不能都靠同一段空余时间","md":"# 第28章｜当期交付、探索与维护，为什么不能都靠同一段空余时间\n\n内容团队希望每天交6篇，又要求同一位专家每天拿40分钟整理反例和验证新方法。专家只有2小时，若每篇核验20分钟，剩下80分钟只能核4篇。计划同时写满，两种产出却无法同时发生。\n\n这类资源冲突经常被隐藏在“边做边沉淀”里。生产、探索、验证和维护都需要真实时间，AI没有取消这项取舍。\n\n## 四类工作分别带来什么\n\n生产使当前合格交付发生；探索研究新客户与新方法；验证帮助判断采用或扩大；维护使规则、工具与经验继续适用。\n\n它们可以共享材料，却有不同回报节奏。生产量容易被看见，反例可能只让团队停止某方向，维护的成果又常是问题没发生。只奖励新增产出，会挤掉未来条件。\n\n探索与利用研究解释了这种竞争和长期张力，并没有给所有企业一套固定比例。[原始研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)\n\n## 在同一个瓶颈上，把取舍说出来\n\n回到[内容案例](案例D-专业服务.md)，方案假设把核验从30分钟降到20分钟。验证期间专家还要观察错误和质量，不能已经把全部新增容量承诺给客户。可以分阶段安排交付、增加相应支持，或减少本轮范围，具体选择由实际资源决定。\n\n设备服务也一样。专家既要解决日常复杂问题，又要判断新版本是否适用旧方法，还要带教新人。若旧方法已经可能误导当前服务，相关修订不能永远排在新功能之后。\n\n| 当前限制 | 资源选择的重点 |\n|---|---|\n| 正常生产不稳定 | 先守住必要质量、运行与异常支持 |\n| 价值假设尚未成立 | 为可改变投资的观察留出范围 |\n| 方法已稳定但需要扩展 | 增加采用与资源，同时保留抽查 |\n| 条件变化使经验失效 | 回到事实、修订和相应验证 |\n\n这张表用于解释取舍，不能替企业分配统一预算。\n\n## 探索为什么也要有成果要求\n\n烘焙连锁可以研究补货是否值得，但要说明哪项观察会让企业扩产、只改分配或停止。若试了一轮又一轮，认识和决定都不变，就不能仅凭“创新需要时间”解释。\n\n维护也要能指出保住什么：现行价格不会被旧案覆盖，设备新版本不会沿用旧结论，派工中断能查同一次提交。资源投入因此有具体对象。\n\n## 组合随证据发展\n\n生产扩大后，专业支持可能变成瓶颈；新市场打开时，探索需要更多；业务稳定后，可以减少高强度现场投入。阶段合理不等于永久合理。\n\n一份有用的资源安排，能讲清当前最重要的价值与未知，哪些人和智能在做什么，保住什么、延后什么、何时复查。只有把这些选择显性化，积累和持续改进才不会长期依赖加班。\n","html":"\u003ch1>第28章｜当期交付、探索与维护，为什么不能都靠同一段空余时间\u003c/h1>\n\u003cp>内容团队希望每天交6篇，又要求同一位专家每天拿40分钟整理反例和验证新方法。专家只有2小时，若每篇核验20分钟，剩下80分钟只能核4篇。计划同时写满，两种产出却无法同时发生。\u003c/p>\n\u003cp>这类资源冲突经常被隐藏在“边做边沉淀”里。生产、探索、验证和维护都需要真实时间，AI没有取消这项取舍。\u003c/p>\n\u003ch2 id=\"lesson-28-section-1\">四类工作分别带来什么\u003c/h2>\n\u003cp>生产使当前合格交付发生；探索研究新客户与新方法；验证帮助判断采用或扩大；维护使规则、工具与经验继续适用。\u003c/p>\n\u003cp>它们可以共享材料，却有不同回报节奏。生产量容易被看见，反例可能只让团队停止某方向，维护的成果又常是问题没发生。只奖励新增产出，会挤掉未来条件。\u003c/p>\n\u003cp>探索与利用研究解释了这种竞争和长期张力，并没有给所有企业一套固定比例。\u003ca href=\"https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-28-section-2\">在同一个瓶颈上，把取舍说出来\u003c/h2>\n\u003cp>回到\u003ca href=\"#case-d\">内容案例\u003c/a>，方案假设把核验从30分钟降到20分钟。验证期间专家还要观察错误和质量，不能已经把全部新增容量承诺给客户。可以分阶段安排交付、增加相应支持，或减少本轮范围，具体选择由实际资源决定。\u003c/p>\n\u003cp>设备服务也一样。专家既要解决日常复杂问题，又要判断新版本是否适用旧方法，还要带教新人。若旧方法已经可能误导当前服务，相关修订不能永远排在新功能之后。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>当前限制\u003c/th>\n\u003cth>资源选择的重点\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>正常生产不稳定\u003c/td>\n\u003ctd>先守住必要质量、运行与异常支持\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>价值假设尚未成立\u003c/td>\n\u003ctd>为可改变投资的观察留出范围\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>方法已稳定但需要扩展\u003c/td>\n\u003ctd>增加采用与资源，同时保留抽查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>条件变化使经验失效\u003c/td>\n\u003ctd>回到事实、修订和相应验证\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>这张表用于解释取舍，不能替企业分配统一预算。\u003c/p>\n\u003ch2 id=\"lesson-28-section-3\">探索为什么也要有成果要求\u003c/h2>\n\u003cp>烘焙连锁可以研究补货是否值得，但要说明哪项观察会让企业扩产、只改分配或停止。若试了一轮又一轮，认识和决定都不变，就不能仅凭“创新需要时间”解释。\u003c/p>\n\u003cp>维护也要能指出保住什么：现行价格不会被旧案覆盖，设备新版本不会沿用旧结论，派工中断能查同一次提交。资源投入因此有具体对象。\u003c/p>\n\u003ch2 id=\"lesson-28-section-4\">组合随证据发展\u003c/h2>\n\u003cp>生产扩大后，专业支持可能变成瓶颈；新市场打开时，探索需要更多；业务稳定后，可以减少高强度现场投入。阶段合理不等于永久合理。\u003c/p>\n\u003cp>一份有用的资源安排，能讲清当前最重要的价值与未知，哪些人和智能在做什么，保住什么、延后什么、何时复查。只有把这些选择显性化，积累和持续改进才不会长期依赖加班。\u003c/p>\n","headings":[{"id":"lesson-28-section-1","label":"四类工作分别带来什么"},{"id":"lesson-28-section-2","label":"在同一个瓶颈上，把取舍说出来"},{"id":"lesson-28-section-3","label":"探索为什么也要有成果要求"},{"id":"lesson-28-section-4","label":"组合随证据发展"}],"exportMd":"# 第28章｜当期交付、探索与维护，为什么不能都靠同一段空余时间\n\n内容团队希望每天交6篇，又要求同一位专家每天拿40分钟整理反例和验证新方法。专家只有2小时，若每篇核验20分钟，剩下80分钟只能核4篇。计划同时写满，两种产出却无法同时发生。\n\n这类资源冲突经常被隐藏在“边做边沉淀”里。生产、探索、验证和维护都需要真实时间，AI没有取消这项取舍。\n\n## 四类工作分别带来什么\n\n生产使当前合格交付发生；探索研究新客户与新方法；验证帮助判断采用或扩大；维护使规则、工具与经验继续适用。\n\n它们可以共享材料，却有不同回报节奏。生产量容易被看见，反例可能只让团队停止某方向，维护的成果又常是问题没发生。只奖励新增产出，会挤掉未来条件。\n\n探索与利用研究解释了这种竞争和长期张力，并没有给所有企业一套固定比例。[原始研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)\n\n## 在同一个瓶颈上，把取舍说出来\n\n回到[内容案例](#case-d)，方案假设把核验从30分钟降到20分钟。验证期间专家还要观察错误和质量，不能已经把全部新增容量承诺给客户。可以分阶段安排交付、增加相应支持，或减少本轮范围，具体选择由实际资源决定。\n\n设备服务也一样。专家既要解决日常复杂问题，又要判断新版本是否适用旧方法，还要带教新人。若旧方法已经可能误导当前服务，相关修订不能永远排在新功能之后。\n\n| 当前限制 | 资源选择的重点 |\n|---|---|\n| 正常生产不稳定 | 先守住必要质量、运行与异常支持 |\n| 价值假设尚未成立 | 为可改变投资的观察留出范围 |\n| 方法已稳定但需要扩展 | 增加采用与资源，同时保留抽查 |\n| 条件变化使经验失效 | 回到事实、修订和相应验证 |\n\n这张表用于解释取舍，不能替企业分配统一预算。\n\n## 探索为什么也要有成果要求\n\n烘焙连锁可以研究补货是否值得，但要说明哪项观察会让企业扩产、只改分配或停止。若试了一轮又一轮，认识和决定都不变，就不能仅凭“创新需要时间”解释。\n\n维护也要能指出保住什么：现行价格不会被旧案覆盖，设备新版本不会沿用旧结论，派工中断能查同一次提交。资源投入因此有具体对象。\n\n## 组合随证据发展\n\n生产扩大后，专业支持可能变成瓶颈；新市场打开时，探索需要更多；业务稳定后，可以减少高强度现场投入。阶段合理不等于永久合理。\n\n一份有用的资源安排，能讲清当前最重要的价值与未知，哪些人和智能在做什么，保住什么、延后什么、何时复查。只有把这些选择显性化，积累和持续改进才不会长期依赖加班。\n","exportSingleMd":"# 第28章｜当期交付、探索与维护，为什么不能都靠同一段空余时间\n\n内容团队希望每天交6篇，又要求同一位专家每天拿40分钟整理反例和验证新方法。专家只有2小时，若每篇核验20分钟，剩下80分钟只能核4篇。计划同时写满，两种产出却无法同时发生。\n\n这类资源冲突经常被隐藏在“边做边沉淀”里。生产、探索、验证和维护都需要真实时间，AI没有取消这项取舍。\n\n## 四类工作分别带来什么\n\n生产使当前合格交付发生；探索研究新客户与新方法；验证帮助判断采用或扩大；维护使规则、工具与经验继续适用。\n\n它们可以共享材料，却有不同回报节奏。生产量容易被看见，反例可能只让团队停止某方向，维护的成果又常是问题没发生。只奖励新增产出，会挤掉未来条件。\n\n探索与利用研究解释了这种竞争和长期张力，并没有给所有企业一套固定比例。[原始研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)\n\n## 在同一个瓶颈上，把取舍说出来\n\n回到[内容案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-d)，方案假设把核验从30分钟降到20分钟。验证期间专家还要观察错误和质量，不能已经把全部新增容量承诺给客户。可以分阶段安排交付、增加相应支持，或减少本轮范围，具体选择由实际资源决定。\n\n设备服务也一样。专家既要解决日常复杂问题，又要判断新版本是否适用旧方法，还要带教新人。若旧方法已经可能误导当前服务，相关修订不能永远排在新功能之后。\n\n| 当前限制 | 资源选择的重点 |\n|---|---|\n| 正常生产不稳定 | 先守住必要质量、运行与异常支持 |\n| 价值假设尚未成立 | 为可改变投资的观察留出范围 |\n| 方法已稳定但需要扩展 | 增加采用与资源，同时保留抽查 |\n| 条件变化使经验失效 | 回到事实、修订和相应验证 |\n\n这张表用于解释取舍，不能替企业分配统一预算。\n\n## 探索为什么也要有成果要求\n\n烘焙连锁可以研究补货是否值得，但要说明哪项观察会让企业扩产、只改分配或停止。若试了一轮又一轮，认识和决定都不变，就不能仅凭“创新需要时间”解释。\n\n维护也要能指出保住什么：现行价格不会被旧案覆盖，设备新版本不会沿用旧结论，派工中断能查同一次提交。资源投入因此有具体对象。\n\n## 组合随证据发展\n\n生产扩大后，专业支持可能变成瓶颈；新市场打开时，探索需要更多；业务稳定后，可以减少高强度现场投入。阶段合理不等于永久合理。\n\n一份有用的资源安排，能讲清当前最重要的价值与未知，哪些人和智能在做什么，保住什么、延后什么、何时复查。只有把这些选择显性化，积累和持续改进才不会长期依赖加班。\n","text":"# 第28章｜当期交付、探索与维护，为什么不能都靠同一段空余时间\n\n内容团队希望每天交6篇，又要求同一位专家每天拿40分钟整理反例和验证新方法。专家只有2小时，若每篇核验20分钟，剩下80分钟只能核4篇。计划同时写满，两种产出却无法同时发生。\n\n这类资源冲突经常被隐藏在“边做边沉淀”里。生产、探索、验证和维护都需要真实时间，AI没有取消这项取舍。\n\n## 四类工作分别带来什么\n\n生产使当前合格交付发生；探索研究新客户与新方法；验证帮助判断采用或扩大；维护使规则、工具与经验继续适用。\n\n它们可以共享材料，却有不同回报节奏。生产量容易被看见，反例可能只让团队停止某方向，维护的成果又常是问题没发生。只奖励新增产出，会挤掉未来条件。\n\n探索与利用研究解释了这种竞争和长期张力，并没有给所有企业一套固定比例。原始研究\n\n## 在同一个瓶颈上，把取舍说出来\n\n回到内容案例，方案假设把核验从30分钟降到20分钟。验证期间专家还要观察错误和质量，不能已经把全部新增容量承诺给客户。可以分阶段安排交付、增加相应支持，或减少本轮范围，具体选择由实际资源决定。\n\n设备服务也一样。专家既要解决日常复杂问题，又要判断新版本是否适用旧方法，还要带教新人。若旧方法已经可能误导当前服务，相关修订不能永远排在新功能之后。\n\n| 当前限制 | 资源选择的重点 |\n|---|---|\n| 正常生产不稳定 | 先守住必要质量、运行与异常支持 |\n| 价值假设尚未成立 | 为可改变投资的观察留出范围 |\n| 方法已稳定但需要扩展 | 增加采用与资源，同时保留抽查 |\n| 条件变化使经验失效 | 回到事实、修订和相应验证 |\n\n这张表用于解释取舍，不能替企业分配统一预算。\n\n## 探索为什么也要有成果要求\n\n烘焙连锁可以研究补货是否值得，但要说明哪项观察会让企业扩产、只改分配或停止。若试了一轮又一轮，认识和决定都不变，就不能仅凭“创新需要时间”解释。\n\n维护也要能指出保住什么：现行价格不会被旧案覆盖，设备新版本不会沿用旧结论，派工中断能查同一次提交。资源投入因此有具体对象。\n\n## 组合随证据发展\n\n生产扩大后，专业支持可能变成瓶颈；新市场打开时，探索需要更多；业务稳定后，可以减少高强度现场投入。阶段合理不等于永久合理。\n\n一份有用的资源安排，能讲清当前最重要的价值与未知，哪些人和智能在做什么，保住什么、延后什么、何时复查。只有把这些选择显性化，积累和持续改进才不会长期依赖加班。\n"},{"file":"29-任务质量.md","id":"lesson-29","number":29,"role":"核心课","part":5,"title":"第29章｜一份看起来专业的材料，怎样判断能不能真的采用","md":"# 第29章｜一份看起来专业的材料，怎样判断能不能真的采用\n\n内容草稿把另一型号的性能写进本次产品，句子仍然流畅；报价候选写着“可以交付”，供应商却只确认了十天货期。若评价只问是否清楚、专业，两份材料都可能获得好印象。\n\n质量要由材料将要支持的工作决定。不同阶段需要的证据不同。\n\n## 先给任务一个具体用途\n\n报价前资料整理，应忠实保留客户期限、工况、已知依据和缺项；形成候选，可以提出尚需确认的路线；正式报价，则需要对应有效版本、价格与可承诺条件。\n\n开放构思本来允许不成熟想法，若一开始按正式交付要求筛掉全部可能，会压缩探索。反过来，把候选的可能性写成已确认事实，会使下一岗位错误行动。\n\n| 阶段 | 重点核对 |\n|---|---|\n| 整理事实 | 是否准确、重要条件是否遗漏、能否追溯 |\n| 构思候选 | 是否回应问题、具有依据和可研究性 |\n| 比较选择 | 是否识别了决定结果的差别 |\n| 正式执行 | 对象、版本、决定权与状态是否一致 |\n| 客户采用 | 是否真正帮助其完成工作 |\n\n## 重要错误不能靠平均分抵消\n\n设备身份错、未换件写成换件、客户三天期限被忽略，会直接改变行动。标题略长通常不会。如果把它们混成一个总分，格式和流畅得分会掩盖关键事实错误。\n\n可以先检查采用所必需的条件，再比较完整程度和负担。对内容团队，能否找出型号与性能的依据，就是比文风更早的门槛。\n\n## 材料要能暴露真实困难\n\n从代表任务中保留常规、缺项、版本冲突、未采用和失败情况；一部分材料不用来调方案，观察新任务能否用好方法。不是越难越好，而是覆盖会改变本企业采用的差别。\n\n人员补救也要可见。专家重做全部工作才达到高质量，与AI本身形成可用材料不同。核验与返工进入评价，才知道新增系统究竟承担了多少。\n\n关于工作任务的研究提示主观顺畅与实际总耗时需要分开观察；阶段研究也提醒最终方案改善不代表选择环节成熟。[任务研究](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)、[创新研究](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n## 把结论写到可用于决定的程度\n\n说明在哪类材料上、按什么要求取得怎样表现，人员补了什么，哪种情况应缩小范围。这样团队才知道改资料、方法、模型还是工作安排。\n\n一份合格候选只是价值路径上的一段。它足以支持进入下一阶段，并不足以代替客户选择、实际执行和经营结果。\n","html":"\u003ch1>第29章｜一份看起来专业的材料，怎样判断能不能真的采用\u003c/h1>\n\u003cp>内容草稿把另一型号的性能写进本次产品，句子仍然流畅；报价候选写着“可以交付”，供应商却只确认了十天货期。若评价只问是否清楚、专业，两份材料都可能获得好印象。\u003c/p>\n\u003cp>质量要由材料将要支持的工作决定。不同阶段需要的证据不同。\u003c/p>\n\u003ch2 id=\"lesson-29-section-1\">先给任务一个具体用途\u003c/h2>\n\u003cp>报价前资料整理，应忠实保留客户期限、工况、已知依据和缺项；形成候选，可以提出尚需确认的路线；正式报价，则需要对应有效版本、价格与可承诺条件。\u003c/p>\n\u003cp>开放构思本来允许不成熟想法，若一开始按正式交付要求筛掉全部可能，会压缩探索。反过来，把候选的可能性写成已确认事实，会使下一岗位错误行动。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>阶段\u003c/th>\n\u003cth>重点核对\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>整理事实\u003c/td>\n\u003ctd>是否准确、重要条件是否遗漏、能否追溯\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>构思候选\u003c/td>\n\u003ctd>是否回应问题、具有依据和可研究性\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>比较选择\u003c/td>\n\u003ctd>是否识别了决定结果的差别\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>正式执行\u003c/td>\n\u003ctd>对象、版本、决定权与状态是否一致\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>客户采用\u003c/td>\n\u003ctd>是否真正帮助其完成工作\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"lesson-29-section-2\">重要错误不能靠平均分抵消\u003c/h2>\n\u003cp>设备身份错、未换件写成换件、客户三天期限被忽略，会直接改变行动。标题略长通常不会。如果把它们混成一个总分，格式和流畅得分会掩盖关键事实错误。\u003c/p>\n\u003cp>可以先检查采用所必需的条件，再比较完整程度和负担。对内容团队，能否找出型号与性能的依据，就是比文风更早的门槛。\u003c/p>\n\u003ch2 id=\"lesson-29-section-3\">材料要能暴露真实困难\u003c/h2>\n\u003cp>从代表任务中保留常规、缺项、版本冲突、未采用和失败情况；一部分材料不用来调方案，观察新任务能否用好方法。不是越难越好，而是覆盖会改变本企业采用的差别。\u003c/p>\n\u003cp>人员补救也要可见。专家重做全部工作才达到高质量，与AI本身形成可用材料不同。核验与返工进入评价，才知道新增系统究竟承担了多少。\u003c/p>\n\u003cp>关于工作任务的研究提示主观顺畅与实际总耗时需要分开观察；阶段研究也提醒最终方案改善不代表选择环节成熟。\u003ca href=\"https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">任务研究\u003c/a>、\u003ca href=\"https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702\" target=\"_blank\" rel=\"noopener noreferrer\">创新研究\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-29-section-4\">把结论写到可用于决定的程度\u003c/h2>\n\u003cp>说明在哪类材料上、按什么要求取得怎样表现，人员补了什么，哪种情况应缩小范围。这样团队才知道改资料、方法、模型还是工作安排。\u003c/p>\n\u003cp>一份合格候选只是价值路径上的一段。它足以支持进入下一阶段，并不足以代替客户选择、实际执行和经营结果。\u003c/p>\n","headings":[{"id":"lesson-29-section-1","label":"先给任务一个具体用途"},{"id":"lesson-29-section-2","label":"重要错误不能靠平均分抵消"},{"id":"lesson-29-section-3","label":"材料要能暴露真实困难"},{"id":"lesson-29-section-4","label":"把结论写到可用于决定的程度"}],"exportMd":"# 第29章｜一份看起来专业的材料，怎样判断能不能真的采用\n\n内容草稿把另一型号的性能写进本次产品，句子仍然流畅；报价候选写着“可以交付”，供应商却只确认了十天货期。若评价只问是否清楚、专业，两份材料都可能获得好印象。\n\n质量要由材料将要支持的工作决定。不同阶段需要的证据不同。\n\n## 先给任务一个具体用途\n\n报价前资料整理，应忠实保留客户期限、工况、已知依据和缺项；形成候选，可以提出尚需确认的路线；正式报价，则需要对应有效版本、价格与可承诺条件。\n\n开放构思本来允许不成熟想法，若一开始按正式交付要求筛掉全部可能，会压缩探索。反过来，把候选的可能性写成已确认事实，会使下一岗位错误行动。\n\n| 阶段 | 重点核对 |\n|---|---|\n| 整理事实 | 是否准确、重要条件是否遗漏、能否追溯 |\n| 构思候选 | 是否回应问题、具有依据和可研究性 |\n| 比较选择 | 是否识别了决定结果的差别 |\n| 正式执行 | 对象、版本、决定权与状态是否一致 |\n| 客户采用 | 是否真正帮助其完成工作 |\n\n## 重要错误不能靠平均分抵消\n\n设备身份错、未换件写成换件、客户三天期限被忽略，会直接改变行动。标题略长通常不会。如果把它们混成一个总分，格式和流畅得分会掩盖关键事实错误。\n\n可以先检查采用所必需的条件，再比较完整程度和负担。对内容团队，能否找出型号与性能的依据，就是比文风更早的门槛。\n\n## 材料要能暴露真实困难\n\n从代表任务中保留常规、缺项、版本冲突、未采用和失败情况；一部分材料不用来调方案，观察新任务能否用好方法。不是越难越好，而是覆盖会改变本企业采用的差别。\n\n人员补救也要可见。专家重做全部工作才达到高质量，与AI本身形成可用材料不同。核验与返工进入评价，才知道新增系统究竟承担了多少。\n\n关于工作任务的研究提示主观顺畅与实际总耗时需要分开观察；阶段研究也提醒最终方案改善不代表选择环节成熟。[任务研究](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)、[创新研究](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n## 把结论写到可用于决定的程度\n\n说明在哪类材料上、按什么要求取得怎样表现，人员补了什么，哪种情况应缩小范围。这样团队才知道改资料、方法、模型还是工作安排。\n\n一份合格候选只是价值路径上的一段。它足以支持进入下一阶段，并不足以代替客户选择、实际执行和经营结果。\n","exportSingleMd":"# 第29章｜一份看起来专业的材料，怎样判断能不能真的采用\n\n内容草稿把另一型号的性能写进本次产品，句子仍然流畅；报价候选写着“可以交付”，供应商却只确认了十天货期。若评价只问是否清楚、专业，两份材料都可能获得好印象。\n\n质量要由材料将要支持的工作决定。不同阶段需要的证据不同。\n\n## 先给任务一个具体用途\n\n报价前资料整理，应忠实保留客户期限、工况、已知依据和缺项；形成候选，可以提出尚需确认的路线；正式报价，则需要对应有效版本、价格与可承诺条件。\n\n开放构思本来允许不成熟想法，若一开始按正式交付要求筛掉全部可能，会压缩探索。反过来，把候选的可能性写成已确认事实，会使下一岗位错误行动。\n\n| 阶段 | 重点核对 |\n|---|---|\n| 整理事实 | 是否准确、重要条件是否遗漏、能否追溯 |\n| 构思候选 | 是否回应问题、具有依据和可研究性 |\n| 比较选择 | 是否识别了决定结果的差别 |\n| 正式执行 | 对象、版本、决定权与状态是否一致 |\n| 客户采用 | 是否真正帮助其完成工作 |\n\n## 重要错误不能靠平均分抵消\n\n设备身份错、未换件写成换件、客户三天期限被忽略，会直接改变行动。标题略长通常不会。如果把它们混成一个总分，格式和流畅得分会掩盖关键事实错误。\n\n可以先检查采用所必需的条件，再比较完整程度和负担。对内容团队，能否找出型号与性能的依据，就是比文风更早的门槛。\n\n## 材料要能暴露真实困难\n\n从代表任务中保留常规、缺项、版本冲突、未采用和失败情况；一部分材料不用来调方案，观察新任务能否用好方法。不是越难越好，而是覆盖会改变本企业采用的差别。\n\n人员补救也要可见。专家重做全部工作才达到高质量，与AI本身形成可用材料不同。核验与返工进入评价，才知道新增系统究竟承担了多少。\n\n关于工作任务的研究提示主观顺畅与实际总耗时需要分开观察；阶段研究也提醒最终方案改善不代表选择环节成熟。[任务研究](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)、[创新研究](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n## 把结论写到可用于决定的程度\n\n说明在哪类材料上、按什么要求取得怎样表现，人员补了什么，哪种情况应缩小范围。这样团队才知道改资料、方法、模型还是工作安排。\n\n一份合格候选只是价值路径上的一段。它足以支持进入下一阶段，并不足以代替客户选择、实际执行和经营结果。\n","text":"# 第29章｜一份看起来专业的材料，怎样判断能不能真的采用\n\n内容草稿把另一型号的性能写进本次产品，句子仍然流畅；报价候选写着“可以交付”，供应商却只确认了十天货期。若评价只问是否清楚、专业，两份材料都可能获得好印象。\n\n质量要由材料将要支持的工作决定。不同阶段需要的证据不同。\n\n## 先给任务一个具体用途\n\n报价前资料整理，应忠实保留客户期限、工况、已知依据和缺项；形成候选，可以提出尚需确认的路线；正式报价，则需要对应有效版本、价格与可承诺条件。\n\n开放构思本来允许不成熟想法，若一开始按正式交付要求筛掉全部可能，会压缩探索。反过来，把候选的可能性写成已确认事实，会使下一岗位错误行动。\n\n| 阶段 | 重点核对 |\n|---|---|\n| 整理事实 | 是否准确、重要条件是否遗漏、能否追溯 |\n| 构思候选 | 是否回应问题、具有依据和可研究性 |\n| 比较选择 | 是否识别了决定结果的差别 |\n| 正式执行 | 对象、版本、决定权与状态是否一致 |\n| 客户采用 | 是否真正帮助其完成工作 |\n\n## 重要错误不能靠平均分抵消\n\n设备身份错、未换件写成换件、客户三天期限被忽略，会直接改变行动。标题略长通常不会。如果把它们混成一个总分，格式和流畅得分会掩盖关键事实错误。\n\n可以先检查采用所必需的条件，再比较完整程度和负担。对内容团队，能否找出型号与性能的依据，就是比文风更早的门槛。\n\n## 材料要能暴露真实困难\n\n从代表任务中保留常规、缺项、版本冲突、未采用和失败情况；一部分材料不用来调方案，观察新任务能否用好方法。不是越难越好，而是覆盖会改变本企业采用的差别。\n\n人员补救也要可见。专家重做全部工作才达到高质量，与AI本身形成可用材料不同。核验与返工进入评价，才知道新增系统究竟承担了多少。\n\n关于工作任务的研究提示主观顺畅与实际总耗时需要分开观察；阶段研究也提醒最终方案改善不代表选择环节成熟。任务研究、创新研究\n\n## 把结论写到可用于决定的程度\n\n说明在哪类材料上、按什么要求取得怎样表现，人员补了什么，哪种情况应缩小范围。这样团队才知道改资料、方法、模型还是工作安排。\n\n一份合格候选只是价值路径上的一段。它足以支持进入下一阶段，并不足以代替客户选择、实际执行和经营结果。\n"},{"file":"30-业务效果与因果.md","id":"lesson-30","number":30,"role":"核心课","part":5,"title":"第30章｜销量增长以后，怎样判断企业究竟多赚了什么","md":"# 第30章｜销量增长以后，怎样判断企业究竟多赚了什么\n\nX店的主打点心从80份卖到160份，是容易让人兴奋的增长。但负责人接下来要问：全网多卖多少，新增生产和补货花了什么，比另一个更简单方案多赚多少，这些变化能否持续？\n\n## 让收益比较使用相同条件\n\n[连锁案例](案例A-连锁备货.md)给定正常日需求X160、Y60，售价12元、每份生产变动成本4元、未售无残值，原工资租金不变。扩产新增补货50元和按量AI/整理30元。\n\n| 方案 | 生产/售出 | 收入 | 生产成本与新增支出 | 列示贡献 |\n|---|---|---:|---:|---:|\n| 原80/80 | 160/140 | 1680元 | 640元 | 1040元 |\n| 改100/60 | 160/160 | 1920元 | 640元 | 1280元 |\n| 扩160/60 | 220/220 | 2640元 | 880＋80元 | 1680元 |\n\n![相同正常需求和费用条件下，原安排贡献1040元，只改分配1280元，扩产补货1680元；新增收益要相对合理替代比较。](assets/30-经营收益的比较.svg)\n\n扩产相对原安排多640元，却只比改分配多400元。若需求只有X120、Y60，扩产贡献1200元，虽然比原来好，仍低于只改分配的1280元。比较对象会直接改变投资结论。\n\n这里需求是为算账给定的条件。真实现场先看到的是供给上限以内的销量，不能先把需求160填进去，再称为AI预测已经成功。\n\n## 谁增长、增长什么，需要分别说明\n\nX该单品销量翻倍，两店合计销量从140增220，约增57.1%；收入也受单价影响，贡献还要扣新增成本。其他商品、门店和固定公司费用不在这个局部比例里。\n\n如果新增排产挤占别的高价值产品，机会成本应计入；如果销量只是从Y或其他店转来，全网未必增加。生产、到店与销售对应清楚，才有条件把这些关系算对。\n\n## 怎样检查真实贡献\n\n需要相对合理替代：原人工/SOP改进、成熟预测分配方法，以及AI帮助整理非标准信息、识别联动和接回行动的方案。普通改配本就能做到的收益，不应全部归给AI。\n\n第一项经营决定可以先比较几套完整、能执行的安排，无需在行动前把每一元收益精确分摊给某项技术。若下一笔投资是继续加AI、增加配送还是扩推广，再针对这项选择区分各自增量。比较的精细程度，由要作出的决定确定。\n\n真实试做也可能同时改变补货、门店推介、人员注意力和客户活动。记录这些变化，按相近任务、日期和资源条件比较。可行时安排适当对照；无法控制的差异则限制结论强度。\n\n两店共享库存，比较单位应覆盖主要相互影响，而不能简单给一店AI、一店不用，再把差额全当净收益。研究中的分批上线、随机任务和匹配比较有不同条件，应借用适合的问题意识。[客服研究](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)、[开发研究](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)\n\n## 小试点能支持哪种行动\n\n建议先不执行，可以看见新增事实、冲突和决定差别，却看不到执行后会怎样。少量真实采用可以暴露流程和成本，但未必给出稳定增长率。证据逐步增强，采用范围也逐步发展。\n\n一次性接入6000元也要回到项目账。相同正常条件若连续20日，640×20−6000=6800元；条件变化时，改用实际结果。把增长空间、取得条件和成本放在一起，企业得到的才是一项可检验、可转向的经营选择。\n","html":"\u003ch1>第30章｜销量增长以后，怎样判断企业究竟多赚了什么\u003c/h1>\n\u003cp>X店的主打点心从80份卖到160份，是容易让人兴奋的增长。但负责人接下来要问：全网多卖多少，新增生产和补货花了什么，比另一个更简单方案多赚多少，这些变化能否持续？\u003c/p>\n\u003ch2 id=\"lesson-30-section-1\">让收益比较使用相同条件\u003c/h2>\n\u003cp>\u003ca href=\"#case-a\">连锁案例\u003c/a>给定正常日需求X160、Y60，售价12元、每份生产变动成本4元、未售无残值，原工资租金不变。扩产新增补货50元和按量AI/整理30元。\u003c/p>\n\u003cdiv class=\"table-scroll table-wide\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方案\u003c/th>\n\u003cth>生产/售出\u003c/th>\n\u003cth align=\"right\">收入\u003c/th>\n\u003cth align=\"right\">生产成本与新增支出\u003c/th>\n\u003cth align=\"right\">列示贡献\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>原80/80\u003c/td>\n\u003ctd>160/140\u003c/td>\n\u003ctd align=\"right\">1680元\u003c/td>\n\u003ctd align=\"right\">640元\u003c/td>\n\u003ctd align=\"right\">1040元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>改100/60\u003c/td>\n\u003ctd>160/160\u003c/td>\n\u003ctd align=\"right\">1920元\u003c/td>\n\u003ctd align=\"right\">640元\u003c/td>\n\u003ctd align=\"right\">1280元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>扩160/60\u003c/td>\n\u003ctd>220/220\u003c/td>\n\u003ctd align=\"right\">2640元\u003c/td>\n\u003ctd align=\"right\">880＋80元\u003c/td>\n\u003ctd align=\"right\">1680元\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"table-hint\">表格可左右滑动查看\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTkwIiB2aWV3Qm94PSIwIDAgMzYwIDU5MCIgcm9sZT0iaW1nIj48dGl0bGU+5LiJ56eN5a6J5o6S77yM5pS255uK5LiN5ZCMPC90aXRsZT48ZGVzYz7mlZnlrabmraPluLjml6XvvIzljp/lronmjpLliJfnpLrotKHnjK4xMDQw5YWD77yM5Y+q5pS55YiG6YWNMTI4MOWFg++8jOaJqeS6p+ihpei0pzE2ODDlhYPvvJvmiankuqflr7nljp/lronmjpLlop7liqA2NDDlhYPvvIzlr7nmm7TlkIjnkIbmm7/ku6Plj6rlop7liqA0MDDlhYPjgILkuInmoLnmnaHlhbHnlKjpm7bln7rnur/jgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSI 条件。真实现场先看到的是供给上限以内的销量，不能先把需求160填进去，再称为AI预测已经成功。\u003c/p>\n\u003ch2 id=\"lesson-30-section-2\">谁增长、增长什么，需要分别说明\u003c/h2>\n\u003cp>X该单品销量翻倍，两店合计销量从140增220，约增57.1%；收入也受单价影响，贡献还要扣新增成本。其他商品、门店和固定公司费用不在这个局部比例里。\u003c/p>\n\u003cp>如果新增排产挤占别的高价值产品，机会成本应计入；如果销量只是从Y或其他店转来，全网未必增加。生产、到店与销售对应清楚，才有条件把这些关系算对。\u003c/p>\n\u003ch2 id=\"lesson-30-section-3\">怎样检查真实贡献\u003c/h2>\n\u003cp>需要相对合理替代：原人工/SOP改进、成熟预测分配方法，以及AI帮助整理非标准信息、识别联动和接回行动的方案。普通改配本就能做到的收益，不应全部归给AI。\u003c/p>\n\u003cp>第一项经营决定可以先比较几套完整、能执行的安排，无需在行动前把每一元收益精确分摊给某项技术。若下一笔投资是继续加AI、增加配送还是扩推广，再针对这项选择区分各自增量。比较的精细程度，由要作出的决定确定。\u003c/p>\n\u003cp>真实试做也可能同时改变补货、门店推介、人员注意力和客户活动。记录这些变化，按相近任务、日期和资源条件比较。可行时安排适当对照；无法控制的差异则限制结论强度。\u003c/p>\n\u003cp>两店共享库存，比较单位应覆盖主要相互影响，而不能简单给一店AI、一店不用，再把差额全当净收益。研究中的分批上线、随机任务和匹配比较有不同条件，应借用适合的问题意识。\u003ca href=\"https://danielle.li/assets/docs/GenerativeAIatWork.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">客服研究\u003c/a>、\u003ca href=\"https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">开发研究\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-30-section-4\">小试点能支持哪种行动\u003c/h2>\n\u003cp>建议先不执行，可以看见新增事实、冲突和决定差别，却看不到执行后会怎样。少量真实采用可以暴露流程和成本，但未必给出稳定增长率。证据逐步增强，采用范围也逐步发展。\u003c/p>\n\u003cp>一次性接入6000元也要回到项目账。相同正常条件若连续20日，640×20−6000=6800元；条件变化时，改用实际结果。把增长空间、取得条件和成本放在一起，企业得到的才是一项可检验、可转向的经营选择。\u003c/p>\n","headings":[{"id":"lesson-30-section-1","label":"让收益比较使用相同条件"},{"id":"lesson-30-section-2","label":"谁增长、增长什么，需要分别说明"},{"id":"lesson-30-section-3","label":"怎样检查真实贡献"},{"id":"lesson-30-section-4","label":"小试点能支持哪种行动"}],"exportMd":"# 第30章｜销量增长以后，怎样判断企业究竟多赚了什么\n\nX店的主打点心从80份卖到160份，是容易让人兴奋的增长。但负责人接下来要问：全网多卖多少，新增生产和补货花了什么，比另一个更简单方案多赚多少，这些变化能否持续？\n\n## 让收益比较使用相同条件\n\n[连锁案例](#case-a)给定正常日需求X160、Y60，售价12元、每份生产变动成本4元、未售无残值，原工资租金不变。扩产新增补货50元和按量AI/整理30元。\n\n| 方案 | 生产/售出 | 收入 | 生产成本与新增支出 | 列示贡献 |\n|---|---|---:|---:|---:|\n| 原80/80 | 160/140 | 1680元 | 640元 | 1040元 |\n| 改100/60 | 160/160 | 1920元 | 640元 | 1280元 |\n| 扩160/60 | 220/220 | 2640元 | 880＋80元 | 1680元 |\n\n![相同正常需求和费用条件  谁增长、增长什么，需要分别说明\n\nX该单品销量翻倍，两店合计销量从140增220，约增57.1%；收入也受单价影响，贡献还要扣新增成本。其他商品、门店和固定公司费用不在这个局部比例里。\n\n如果新增排产挤占别的高价值产品，机会成本应计入；如果销量只是从Y或其他店转来，全网未必增加。生产、到店与销售对应清楚，才有条件把这些关系算对。\n\n## 怎样检查真实贡献\n\n需要相对合理替代：原人工/SOP改进、成熟预测分配方法，以及AI帮助整理非标准信息、识别联动和接回行动的方案。普通改配本就能做到的收益，不应全部归给AI。\n\n第一项经营决定可以先比较几套完整、能执行的安排，无需在行动前把每一元收益精确分摊给某项技术。若下一笔投资是继续加AI、增加配送还是扩推广，再针对这项选择区分各自增量。比较的精细程度，由要作出的决定确定。\n\n真实试做也可能同时改变补货、门店推介、人员注意力和客户活动。记录这些变化，按相近任务、日期和资源条件比较。可行时安排适当对照；无法控制的差异则限制结论强度。\n\n两店共享库存，比较单位应覆盖主要相互影响，而不能简单给一店AI、一店不用，再把差额全当净收益。研究中的分批上线、随机任务和匹配比较有不同条件，应借用适合的问题意识。客服研究、开发研究\n\n## 小试点能支持哪种行动\n\n建议先不执行，可以看见新增事实、冲突和决定差别，却看不到执行后会怎样。少量真实采用可以暴露流程和成本，但未必给出稳定增长率。证据逐步增强，采用范围也逐步发展。\n\n一次性接入6000元也要回到项目账。相同正常条件若连续20日，640×20−6000=6800元；条件变化时，改用实际结果。把增长空间、取得条件和成本放在一起，企业得到的才是一项可检验、可转向的经营选择。\n"},{"file":"31-组织学习的验证.md","id":"lesson-31","number":31,"role":"核心课","part":5,"title":"第31章｜换一个人、换一道题，企业还会不会做","md":"# 第31章｜换一个人、换一道题，企业还会不会做\n\n原店长能用AI解释为什么补货，接任者却只记住X配160；资深工程师演示查案例，新技术员遇到V2设备就沿用V1结论。材料保存和原人会用，尚未证明组织接住了能力。\n\n学习需要在后续任务中体现，尤其要看能否识别条件改变，而不只是重复原答案。\n\n## 一张接任工单怎样检验积累\n\n采用[设备案例](案例C-设备售后.md)。接任者拿到V2间歇问题，运行条件仍不完整；系统带回M1的V1记录，原动作是调整并重启、未换件。\n\n合理的下一步应先辨认版本和事实差别，利用旧案提出缺项，再取得专业支持或进一步材料。若直接宣布相同原因，说明相似记录压过了适用判断；若能形成有依据的派工前准备，就展示了更可接续的能力。\n\n这项检验不要求接任者立刻猜中技术原因。当前知识确实不足时，知道还需要什么、怎样取得它，就是有价值的工作。\n\n## 观察哪一段已经被接住\n\n| 任务表现 | 能说明什么 |\n|---|---|\n| 找到原件与修订 | 经验有可用入口 |\n| 分清事实、解释和方法 | 条件与依据得到理解 |\n| 取得工具和专业支持 | 组织有实际采用条件 |\n| 结果返回并修订 | 学习能进入下一轮 |\n\n原作者通常记得未写出的背景，也知道系统容易在哪错。应保留未参与调试的任务，让具备相应基础、未参与原过程的人使用。专业基础和支持条件不同，应记录差别，不能把所有新人成败归于系统。\n\n## 怎样辨认积累的实际增量\n\n高手即使没有知识系统也可能做对。可以在条件相近的任务中比较有无这些积累时的准备、补问、错误和结果；条件允许时采用分组或交叉安排。它要回答积累帮助了哪一段，而不是把全部表现都算成系统贡献。\n\n还需比较新增负担：阅读是否过长，是否总得找原专家解释，维护与适配是否抵消重复准备的减少。吸收能力研究为相关知识如何支持新知识应用提供依据，具体增量仍需要任务证据。[原始研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n## 新店应该学会的是方法，而非配额\n\n第九店可以继承共同事实、反馈和工具，但需重新理解客群、时段与配送。它若复制160/60，是答案迁移；若能更快取得本地事实、比较补货和其他方案，则是能力在发挥作用。\n\n检验结束应改变建设：找不到就改入口，不理解就改解释与带教，无法执行就改工具与责任，新条件失效则更新方法。企业学会多少，由这些可见变化逐步说明。\n","html":"\u003ch1>第31章｜换一个人、换一道题，企业还会不会做\u003c/h1>\n\u003cp>原店长能用AI解释为什么补货，接任者却只记住X配160；资深工程师演示查案例，新技术员遇到V2设备就沿用V1结论。材料保存和原人会用，尚未证明组织接住了能力。\u003c/p>\n\u003cp>学习需要在后续任务中体现，尤其要看能否识别条件改变，而不只是重复原答案。\u003c/p>\n\u003ch2 id=\"lesson-31-section-1\">一张接任工单怎样检验积累\u003c/h2>\n\u003cp>采用\u003ca href=\"#case-c\">设备案例\u003c/a>。接任者拿到V2间歇问题，运行条件仍不完整；系统带回M1的V1记录，原动作是调整并重启、未换件。\u003c/p>\n\u003cp>合理的下一步应先辨认版本和事实差别，利用旧案提出缺项，再取得专业支持或进一步材料。若直接宣布相同原因，说明相似记录压过了适用判断；若能形成有依据的派工前准备，就展示了更可接续的能力。\u003c/p>\n\u003cp>这项检验不要求接任者立刻猜中技术原因。当前知识确实不足时，知道还需要什么、怎样取得它，就是有价值的工作。\u003c/p>\n\u003ch2 id=\"lesson-31-section-2\">观察哪一段已经被接住\u003c/h2>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>任务表现\u003c/th>\n\u003cth>能说明什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>找到原件与修订\u003c/td>\n\u003ctd>经验有可用入口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>分清事实、解释和方法\u003c/td>\n\u003ctd>条件与依据得到理解\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>取得工具和专业支持\u003c/td>\n\u003ctd>组织有实际采用条件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结果返回并修订\u003c/td>\n\u003ctd>学习能进入下一轮\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>原作者通常记得未写出的背景，也知道系统容易在哪错。应保留未参与调试的任务，让具备相应基础、未参与原过程的人使用。专业基础和支持条件不同，应记录差别，不能把所有新人成败归于系统。\u003c/p>\n\u003ch2 id=\"lesson-31-section-3\">怎样辨认积累的实际增量\u003c/h2>\n\u003cp>高手即使没有知识系统也可能做对。可以在条件相近的任务中比较有无这些积累时的准备、补问、错误和结果；条件允许时采用分组或交叉安排。它要回答积累帮助了哪一段，而不是把全部表现都算成系统贡献。\u003c/p>\n\u003cp>还需比较新增负担：阅读是否过长，是否总得找原专家解释，维护与适配是否抵消重复准备的减少。吸收能力研究为相关知识如何支持新知识应用提供依据，具体增量仍需要任务证据。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-31-section-4\">新店应该学会的是方法，而非配额\u003c/h2>\n\u003cp>第九店可以继承共同事实、反馈和工具，但需重新理解客群、时段与配送。它若复制160/60，是答案迁移；若能更快取得本地事实、比较补货和其他方案，则是能力在发挥作用。\u003c/p>\n\u003cp>检验结束应改变建设：找不到就改入口，不理解就改解释与带教，无法执行就改工具与责任，新条件失效则更新方法。企业学会多少，由这些可见变化逐步说明。\u003c/p>\n","headings":[{"id":"lesson-31-section-1","label":"一张接任工单怎样检验积累"},{"id":"lesson-31-section-2","label":"观察哪一段已经被接住"},{"id":"lesson-31-section-3","label":"怎样辨认积累的实际增量"},{"id":"lesson-31-section-4","label":"新店应该学会的是方法，而非配额"}],"exportMd":"# 第31章｜换一个人、换一道题，企业还会不会做\n\n原店长能用AI解释为什么补货，接任者却只记住X配160；资深工程师演示查案例，新技术员遇到V2设备就沿用V1结论。材料保存和原人会用，尚未证明组织接住了能力。\n\n学习需要在后续任务中体现，尤其要看能否识别条件改变，而不只是重复原答案。\n\n## 一张接任工单怎样检验积累\n\n采用[设备案例](#case-c)。接任者拿到V2间歇问题，运行条件仍不完整；系统带回M1的V1记录，原动作是调整并重启、未换件。\n\n合理的下一步应先辨认版本和事实差别，利用旧案提出缺项，再取得专业支持或进一步材料。若直接宣布相同原因，说明相似记录压过了适用判断；若能形成有依据的派工前准备，就展示了更可接续的能力。\n\n这项检验不要求接任者立刻猜中技术原因。当前知识确实不足时，知道还需要什么、怎样取得它，就是有价值的工作。\n\n## 观察哪一段已经被接住\n\n| 任务表现 | 能说明什么 |\n|---|---|\n| 找到原件与修订 | 经验有可用入口 |\n| 分清事实、解释和方法 | 条件与依据得到理解 |\n| 取得工具和专业支持 | 组织有实际采用条件 |\n| 结果返回并修订 | 学习能进入下一轮 |\n\n原作者通常记得未写出的背景，也知道系统容易在哪错。应保留未参与调试的任务，让具备相应基础、未参与原过程的人使用。专业基础和支持条件不同，应记录差别，不能把所有新人成败归于系统。\n\n## 怎样辨认积累的实际增量\n\n高手即使没有知识系统也可能做对。可以在条件相近的任务中比较有无这些积累时的准备、补问、错误和结果；条件允许时采用分组或交叉安排。它要回答积累帮助了哪一段，而不是把全部表现都算成系统贡献。\n\n还需比较新增负担：阅读是否过长，是否总得找原专家解释，维护与适配是否抵消重复准备的减少。吸收能力研究为相关知识如何支持新知识应用提供依据，具体增量仍需要任务证据。[原始研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n## 新店应该学会的是方法，而非配额\n\n第九店可以继承共同事实、反馈和工具，但需重新理解客群、时段与配送。它若复制160/60，是答案迁移；若能更快取得本地事实、比较补货和其他方案，则是能力在发挥作用。\n\n检验结束应改变建设：找不到就改入口，不理解就改解释与带教，无法执行就改工具与责任，新条件失效则更新方法。企业学会多少，由这些可见变化逐步说明。\n","exportSingleMd":"# 第31章｜换一个人、换一道题，企业还会不会做\n\n原店长能用AI解释为什么补货，接任者却只记住X配160；资深工程师演示查案例，新技术员遇到V2设备就沿用V1结论。材料保存和原人会用，尚未证明组织接住了能力。\n\n学习需要在后续任务中体现，尤其要看能否识别条件改变，而不只是重复原答案。\n\n## 一张接任工单怎样检验积累\n\n采用[设备案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-c)。接任者拿到V2间歇问题，运行条件仍不完整；系统带回M1的V1记录，原动作是调整并重启、未换件。\n\n合理的下一步应先辨认版本和事实差别，利用旧案提出缺项，再取得专业支持或进一步材料。若直接宣布相同原因，说明相似记录压过了适用判断；若能形成有依据的派工前准备，就展示了更可接续的能力。\n\n这项检验不要求接任者立刻猜中技术原因。当前知识确实不足时，知道还需要什么、怎样取得它，就是有价值的工作。\n\n## 观察哪一段已经被接住\n\n| 任务表现 | 能说明什么 |\n|---|---|\n| 找到原件与修订 | 经验有可用入口 |\n| 分清事实、解释和方法 | 条件与依据得到理解 |\n| 取得工具和专业支持 | 组织有实际采用条件 |\n| 结果返回并修订 | 学习能进入下一轮 |\n\n原作者通常记得未写出的背景，也知道系统容易在哪错。应保留未参与调试的任务，让具备相应基础、未参与原过程的人使用。专业基础和支持条件不同，应记录差别，不能把所有新人成败归于系统。\n\n## 怎样辨认积累的实际增量\n\n高手即使没有知识系统也可能做对。可以在条件相近的任务中比较有无这些积累时的准备、补问、错误和结果；条件允许时采用分组或交叉安排。它要回答积累帮助了哪一段，而不是把全部表现都算成系统贡献。\n\n还需比较新增负担：阅读是否过长，是否总得找原专家解释，维护与适配是否抵消重复准备的减少。吸收能力研究为相关知识如何支持新知识应用提供依据，具体增量仍需要任务证据。[原始研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n## 新店应该学会的是方法，而非配额\n\n第九店可以继承共同事实、反馈和工具，但需重新理解客群、时段与配送。它若复制160/60，是答案迁移；若能更快取得本地事实、比较补货和其他方案，则是能力在发挥作用。\n\n检验结束应改变建设：找不到就改入口，不理解就改解释与带教，无法执行就改工具与责任，新条件失效则更新方法。企业学会多少，由这些可见变化逐步说明。\n","text":"# 第31章｜换一个人、换一道题，企业还会不会做\n\n原店长能用AI解释为什么补货，接任者却只记住X配160；资深工程师演示查案例，新技术员遇到V2设备就沿用V1结论。材料保存和原人会用，尚未证明组织接住了能力。\n\n学习需要在后续任务中体现，尤其要看能否识别条件改变，而不只是重复原答案。\n\n## 一张接任工单怎样检验积累\n\n采用设备案例。接任者拿到V2间歇问题，运行条件仍不完整；系统带回M1的V1记录，原动作是调整并重启、未换件。\n\n合理的下一步应先辨认版本和事实差别，利用旧案提出缺项，再取得专业支持或进一步材料。若直接宣布相同原因，说明相似记录压过了适用判断；若能形成有依据的派工前准备，就展示了更可接续的能力。\n\n这项检验不要求接任者立刻猜中技术原因。当前知识确实不足时，知道还需要什么、怎样取得它，就是有价值的工作。\n\n## 观察哪一段已经被接住\n\n| 任务表现 | 能说明什么 |\n|---|---|\n| 找到原件与修订 | 经验有可用入口 |\n| 分清事实、解释和方法 | 条件与依据得到理解 |\n| 取得工具和专业支持 | 组织有实际采用条件 |\n| 结果返回并修订 | 学习能进入下一轮 |\n\n原作者通常记得未写出的背景，也知道系统容易在哪错。应保留未参与调试的任务，让具备相应基础、未参与原过程的人使用。专业基础和支持条件不同，应记录差别，不能把所有新人成败归于系统。\n\n## 怎样辨认积累的实际增量\n\n高手即使没有知识系统也可能做对。可以在条件相近的任务中比较有无这些积累时的准备、补问、错误和结果；条件允许时采用分组或交叉安排。它要回答积累帮助了哪一段，而不是把全部表现都算成系统贡献。\n\n还需比较新增负担：阅读是否过长，是否总得找原专家解释，维护与适配是否抵消重复准备的减少。吸收能力研究为相关知识如何支持新知识应用提供依据，具体增量仍需要任务证据。原始研究\n\n## 新店应该学会的是方法，而非配额\n\n第九店可以继承共同事实、反馈和工具，但需重新理解客群、时段与配送。它若复制160/60，是答案迁移；若能更快取得本地事实、比较补货和其他方案，则是能力在发挥作用。\n\n检验结束应改变建设：找不到就改入口，不理解就改解释与带教，无法执行就改工具与责任，新条件失效则更新方法。企业学会多少，由这些可见变化逐步说明。\n"},{"file":"32-纠错与遗忘.md","id":"lesson-32","number":32,"role":"核心课","part":5,"title":"第32章｜为什么企业会用越来越多的数据，证明旧判断正确","md":"# 第32章｜为什么企业会用越来越多的数据，证明旧判断正确\n\nX店长期少配，早早售罄，系统反复记录80份。总部据此继续按80安排；门店认为推介没有意义，需求线索更少。每条销售记录都真实，组合起来却可能把企业困在旧上限。\n\n经验更新既要吸收新内容，也要能改变当前采用的方法。\n\n## 行动会决定未来看见什么\n\n不服务某类客户，就缺少其后续需求；工单提前关闭，复发又建新单，就难看见问题延续；只存已采用方案，未采用理由就不会帮助下一次。\n\nAI进入生产后可能更快复制这种选择，也可能帮助发现循环。关键是哪些反馈进入模型与人员判断，哪些被工作安排遮住。[系统反馈研究](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n![少配限制可见销量，旧记录支持继续少配；售罄与询问暴露缺项，受控改变供给并观察，才能取得原循环外的证据。](assets/32-反馈与偏差.svg)\n\n## 需要新的观察，不能只把旧记录整理得更好\n\n售罄后有人问，首先说明有未观察需求，并没有给出数量。可以在资源允许范围内追加供给、开放预订、跟踪未买到后的行为。每种方法都有成本和偏差，也可能影响其他门店。\n\n这些投入的理由，是让新观察有机会不同于原安排制造的数据。始终只给80份，又只用成交评价原需求，难以认识上限以外的部分。\n\n## 一个有效方案，也会遇到失效条件\n\n改用[连锁案例](案例A-连锁备货.md)的独立变化情景：交通入口关闭，需求变为X50、Y90，价格、变动成本及扩产费用仍相同。\n\n| 供货安排 | 售出/剩余 | 列示贡献 |\n|---|---|---:|\n| 原80/80，生产160 | 130/30 | 920元 |\n| 改100/60，生产160 | 110/50 | 680元 |\n| 仍扩160/60，生产220 | 110/110 | 360元 |\n\n继续扩大旧数量，比原安排少560元。这里应调整的，是需求认识与当期方案。若交通在决定前已知却没被使用，改资料调用；若事后突变，则改响应和资源，而不是用事后事实指责事前所有判断。\n\n## 修订要改变后续行为\n\n设备工单把“换件”纠正为“未换件”，最终原件改了，旧总结若仍主动推荐，错误还会继续。需要明确哪条事实保留、哪项解释变化、当前入口显示什么，并把反例放入代表任务。\n\n停止采用不等于删除历史。保留依据有助于理解为什么改变，当前工作则应知道什么已经不适用。旧成功吸引资源和注意力，探索与利用研究也提醒我们这种惯性。[原始研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)\n\n积累越多，更新越重要。一家能够把反例变成方法变化的企业，才有机会让经验增长继续帮助经营，而非让AI把过去的错误讲得更有把握。\n","html":"\u003ch1>第32章｜为什么企业会用越来越多的数据，证明旧判断正确\u003c/h1>\n\u003cp>X店长期少配，早早售罄，系统反复记录80份。总部据此继续按80安排；门店认为推介没有意义，需求线索更少。每条销售记录都真实，组合起来却可能把企业困在旧上限。\u003c/p>\n\u003cp>经验更新既要吸收新内容，也要能改变当前采用的方法。\u003c/p>\n\u003ch2 id=\"lesson-32-section-1\">行动会决定未来看见什么\u003c/h2>\n\u003cp>不服务某类客户，就缺少其后续需求；工单提前关闭，复发又建新单，就难看见问题延续；只存已采用方案，未采用理由就不会帮助下一次。\u003c/p>\n\u003cp>AI进入生产后可能更快复制这种选择，也可能帮助发现循环。关键是哪些反馈进入模型与人员判断，哪些被工作安排遮住。\u003ca href=\"https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">系统反馈研究\u003c/a>\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNjUwIiB2aWV3Qm94PSIwIDAgMzYwIDY1MCIgcm9sZT0iaW1nIj48dGl0bGU+5Y+N6aaI5Lmf5Y+v6IO95Zu65YyW5YGP5beuPC90aXRsZT48ZGVzYz7lsJHphY3pmZDliLbplIDph4/vvIzlj5fpmZDplIDph4/mlK/mjIHnu6fnu63lsJHphY3jgILllK7nvYTkv6Hmga/mmrTpnLLnvLrpobnvvIzlj5fmjqfmlLnlj5jkvpvnu5nlub
