)\n\n| 当前限制 | 可以比较的投入 | 不宜直接得出的结论 |\n|---|---|---|\n| 已知规则查询 | 现有程序与模型 | 越强模型越准确 |\n| 事实缺失或冲突 | 补事实、关联与核验 | 更长推理会补全现实 |\n| 有用候选不足 | 更好材料、生成与比较 | 候选越多越有价值 |\n| 筛选与专家瓶颈 | 控制进入、选择支持、分工 | 增加上游产出就能扩交付 |\n| 未来任务准备重复 | 可复用方法与工具 | 所有一次性交付都该做成平台 |\n\n资源选择由真实比较支持，不需要一开始建立复杂的统一评分系统。\n\n## 高价值任务也有投入上限\n\n客户重要，并不等于无限生成和核验都有价值。额外投入如果不改变可采用方案，或者结果仍被实物与人员约束，边际作用会很小。\n\n反过来，单笔价值不大的任务若重复很多次，减少一次无效核验也可能值得做。判断应同时看任务频率、质量要求、错误后果和配套成本，而不是只按任务名称排序。\n\n企业还应保留探索资源。某些投入当前尚未直接增加交付，却能帮助理解新需求；它需要明确要改变什么选择，不能与常规生产混成一个调用效率数字。\n\n## 不同阶段可以采用不同安排\n\n专业服务的资料整理、候选构思、选择和客户沟通，不必使用相同方案。宝洁创新研究把这些阶段分开观察，提醒企业最终质量改善不意味着每一阶段都同步改善。[研究原文](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n例如可以让常规材料整理使用稳定低成本安排，对冲突集中或需要跨专业比较的任务增加资源，再由实际评价决定哪些筛选可以委派。具体组合需要比较，不能仅靠经验认定“简单给小模型、复杂给大模型”已经完成设计。\n\n## 一项配置决定要说清什么\n\n应能说明额外投入改变的任务环节，与哪个合理替代相比，需要什么事实，怎样确认质量，并通过哪条路径影响经营。\n\n如果这些关系说不清，精细到单次调用的预算也可能只是精确管理了一个不重要的数字。把配置放进完整交付链，才能进一步看见产能与等待的约束。\n","html":"\u003ch1>第24章｜更强模型与更多推理，应该用在哪些任务上\u003c/h1>\n\u003cp>假设企业有两项AI工作。一项按购买日期核对保修；另一项在客户材料相互冲突时整理原因与候选方案。团队为了统一管理，全部使用同一种模型和相同推理设置。\u003c/p>\n\u003cp>统一便于采购，却不一定便于经营。前者可能直接查规则最准确，后者可能先缺少关键事实，再多推理也只是在不完整信息上组织故事。\u003c/p>\n\u003cp>\u003cstrong>智能资源应按额外投入能改变什么来配置。\u003c/strong> 同时比较任务表现与业务价值，才能知道钱和专业时间花在哪里。\u003c/p>\n\u003ch2 id=\"lesson-24-section-1\">先找限制任务的东西\u003c/h2>\n\u003cp>质量不足可能来自模型能力，也可能来自材料缺失、工具不通、任务范围过宽或评价不清。只有第一种主要靠升级模型才可能解决。\u003c/p>\n\u003cp>在教学设备报修中，设备版本未知时，继续寻找更多相似旧案例未必有用。先确认当前版本，可能直接排除一部分方法。若实际动作没有记录，增加推理也不能可靠恢复事实。\u003c/p>\n\u003cp>同样，一份正确候选方案若没有进入客户决定，下一笔投入可能应该用于工作衔接，而非再生成十份候选。\u003c/p>\n\u003ch2 id=\"lesson-24-section-2\">按任务比较新增作用\u003c/h2>\n\u003cp>可以对代表性任务比较基本安排与加强安排。加强不只有“更大模型”，还包括更完整材料、更合适工具、额外比较或专业核验。\u003c/p>\n\u003cp>看新增合格结果、时间、人工负担与实际采用。若更强方案在困难任务中减少大量返工，却对常规任务几乎没有增量，就有理由区别配置。若两者都失败且原因是缺事实，应先改输入。\u003c/p>\n\u003cp>关于测试时计算的研究，在特定推理任务和策略中讨论了按难度配置资源的效果。它提供有用方向，不能把数学任务中的倍数搬成企业投资回报，也不能证明所有工作都适合自动识别难度。\u003ca href=\"https://arxiv.org/abs/2408.03314\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>当前限制\u003c/th>\n\u003cth>可以比较的投入\u003c/th>\n\u003cth>不宜直接得出的结论\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>已知规则查询\u003c/td>\n\u003ctd>现有程序与模型\u003c/td>\n\u003ctd>越强模型越准确\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>事实缺失或冲突\u003c/td>\n\u003ctd>补事实、关联与核验\u003c/td>\n\u003ctd>更长推理会补全现实\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>有用候选不足\u003c/td>\n\u003ctd>更好材料、生成与比较\u003c/td>\n\u003ctd>候选越多越有价值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>筛选与专家瓶颈\u003c/td>\n\u003ctd>控制进入、选择支持、分工\u003c/td>\n\u003ctd>增加上游产出就能扩交付\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>未来任务准备重复\u003c/td>\n\u003ctd>可复用方法与工具\u003c/td>\n\u003ctd>所有一次性交付都该做成平台\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>资源选择由真实比较支持，不需要一开始建立复杂的统一评分系统。\u003c/p>\n\u003ch2 id=\"lesson-24-section-3\">高价值任务也有投入上限\u003c/h2>\n\u003cp>客户重要，并不等于无限生成和核验都有价值。额外投入如果不改变可采用方案，或者结果仍被实物与人员约束，边际作用会很小。\u003c/p>\n\u003cp>反过来，单笔价值不大的任务若重复很多次，减少一次无效核验也可能值得做。判断应同时看任务频率、质量要求、错误后果和配套成本，而不是只按任务名称排序。\u003c/p>\n\u003cp>企业还应保留探索资源。某些投入当前尚未直接增加交付，却能帮助理解新需求；它需要明确要改变什么选择，不能与常规生产混成一个调用效率数字。\u003c/p>\n\u003ch2 id=\"lesson-24-section-4\">不同阶段可以采用不同安排\u003c/h2>\n\u003cp>专业服务的资料整理、候选构思、选择和客户沟通，不必使用相同方案。宝洁创新研究把这些阶段分开观察，提醒企业最终质量改善不意味着每一阶段都同步改善。\u003ca href=\"https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702\" target=\"_blank\" rel=\"noopener noreferrer\">研究原文\u003c/a>\u003c/p>\n\u003cp>例如可以让常规材料整理使用稳定低成本安排，对冲突集中或需要跨专业比较的任务增加资源，再由实际评价决定哪些筛选可以委派。具体组合需要比较，不能仅靠经验认定“简单给小模型、复杂给大模型”已经完成设计。\u003c/p>\n\u003ch2 id=\"lesson-24-section-5\">一项配置决定要说清什么\u003c/h2>\n\u003cp>应能说明额外投入改变的任务环节，与哪个合理替代相比，需要什么事实，怎样确认质量，并通过哪条路径影响经营。\u003c/p>\n\u003cp>如果这些关系说不清，精细到单次调用的预算也可能只是精确管理了一个不重要的数字。把配置放进完整交付链，才能进一步看见产能与等待的约束。\u003c/p>\n","headings":[{"id":"lesson-24-section-1","label":"先找限制任务的东西"},{"id":"lesson-24-section-2","label":"按任务比较新增作用"},{"id":"lesson-24-section-3","label":"高价值任务也有投入上限"},{"id":"lesson-24-section-4","label":"不同阶段可以采用不同安排"},{"id":"lesson-24-section-5","label":"一项配置决定要说清什么"}],"exportMd":"# 第24章｜更强模型与更多推理，应该用在哪些任务上\n\n假设企业有两项AI工作。一项按购买日期核对保修；另一项在客户材料相互冲突时整理原因与候选方案。团队为了统一管理，全部使用同一种模型和相同推理设置。\n\n统一便于采购，却不一定便于经营。前者可能直接查规则最准确，后者可能先缺少关键事实，再多推理也只是在不完整信息上组织故事。\n\n**智能资源应按额外投入能改变什么来配置。** 同时比较任务表现与业务价值，才能知道钱和专业时间花在哪里。\n\n## 先找限制任务的东西\n\n质量不足可能来自模型能力，也可能来自材料缺失、工具不通、任务范围过宽或评价不清。只有第一种主要靠升级模型才可能解决。\n\n在教学设备报修中，设备版本未知时，继续寻找更多相似旧案例未必有用。先确认当前版本，可能直接排除一部分方法。若实际动作没有记录，增加推理也不能可靠恢复事实。\n\n同样，一份正确候选方案若没有进入客户决定，下一笔投入可能应该用于工作衔接，而非再生成十份候选。\n\n## 按任务比较新增作用\n\n可以对代表性任务比较基本安排与加强安排。加强不只有“更大模型”，还包括更完整材料、更合适工具、额外比较或专业核验。\n\n看新增合格结果、时间、人工负担与实际采用。若更强方案在困难任务中减少大量返工，却对常规任务几乎没有增量，就有理由区别配置。若两者都失败且原因是缺事实，应先改输入。\n\n关于测试时计算的研究，在特定推理任务和策略中讨论了按难度配置资源的效果。它提供有用方向，不能把数学任务中的倍数搬成企业投资回报，也不能证明所有工作都适合自动识别难度。[原始研究](https://arxiv.org/abs/2408.03314)\n\n| 当前限制 | 可以比较的投入 | 不宜直接得出的结论 |\n|---|---|---|\n| 已知规则查询 | 现有程序与模型 | 越强模型越准确 |\n| 事实缺失或冲突 | 补事实、关联与核验 | 更长推理会补全现实 |\n| 有用候选不足 | 更好材料、生成与比较 | 候选越多越有价值 |\n| 筛选与专家瓶颈 | 控制进入、选择支持、分工 | 增加上游产出就能扩交付 |\n| 未来任务准备重复 | 可复用方法与工具 | 所有一次性交付都该做成平台 |\n\n资源选择由真实比较支持，不需要一开始建立复杂的统一评分系统。\n\n## 高价值任务也有投入上限\n\n客户重要，并不等于无限生成和核验都有价值。额外投入如果不改变可采用方案，或者结果仍被实物与人员约束，边际作用会很小。\n\n反过来，单笔价值不大的任务若重复很多次，减少一次无效核验也可能值得做。判断应同时看任务频率、质量要求、错误后果和配套成本，而不是只按任务名称排序。\n\n企业还应保留探索资源。某些投入当前尚未直接增加交付，却能帮助理解新需求；它需要明确要改变什么选择，不能与常规生产混成一个调用效率数字。\n\n## 不同阶段可以采用不同安排\n\n专业服务的资料整理、候选构思、选择和客户沟通，不必使用相同方案。宝洁创新研究把这些阶段分开观察，提醒企业最终质量改善不意味着每一阶段都同步改善。[研究原文](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n例如可以让常规材料整理使用稳定低成本安排，对冲突集中或需要跨专业比较的任务增加资源，再由实际评价决定哪些筛选可以委派。具体组合需要比较，不能仅靠经验认定“简单给小模型、复杂给大模型”已经完成设计。\n\n## 一项配置决定要说清什么\n\n应能说明额外投入改变的任务环节，与哪个合理替代相比，需要什么事实，怎样确认质量，并通过哪条路径影响经营。\n\n如果这些关系说不清，精细到单次调用的预算也可能只是精确管理了一个不重要的数字。把配置放进完整交付链，才能进一步看见产能与等待的约束。\n","exportSingleMd":"# 第24章｜更强模型与更多推理，应该用在哪些任务上\n\n假设企业有两项AI工作。一项按购买日期核对保修；另一项在客户材料相互冲突时整理原因与候选方案。团队为了统一管理，全部使用同一种模型和相同推理设置。\n\n统一便于采购，却不一定便于经营。前者可能直接查规则最准确，后者可能先缺少关键事实，再多推理也只是在不完整信息上组织故事。\n\n**智能资源应按额外投入能改变什么来配置。** 同时比较任务表现与业务价值，才能知道钱和专业时间花在哪里。\n\n## 先找限制任务的东西\n\n质量不足可能来自模型能力，也可能来自材料缺失、工具不通、 sonline.informs.org/doi/abs/10.1287/opre.9.3.383)\n\n例如另设一个已经稳定的教学系统，平均每天完成4份，平均每份在系统停留3天，则平均在制数量为12份。这里的3天是给定条件，不是由前面不断增长的积压估出来的。\n\n前面的20进、4出没有形成稳定队列，不能套公式给出一个稳定平均等待。更不能由公式得出“增加AI就能把等待缩成一天”。它帮助把数量、流量和时间放在同一关系中，原因仍需回到各环节容量。\n\n## 应该改哪里\n\n一种选择是减少无用进入，让候选围绕更明确需求生成。另一种是提高候选可核验性，减少专家重复查证。还可以把经过验证的常规核验交给AI，改变分工，或增加真正缺少的专业资源。\n\n每天只生成4份也不自动等于最优。候选多样性可能有价值，减少后质量可能下降；有些产出可长期储存，也可能合理建立库存。需要比较少量高质量候选与大量筛选，哪一种更适合这项工作。\n\n同理，烘焙连锁的判断能力提升仍受生产与配送约束；设备分析更快仍可能需要现场人员。智能资源的边界要由完整业务确定。\n\n## 从局部效率走向整链经营\n\n可以沿客户需求到实际结果，观察每个环节的进入量、完成量、等待和返工。先找到真正限制交付的地方，再决定增加智能、人力、工具还是调整服务方式。\n\n评价不只问一份东西生成多快，而要问同等质量的工作完成多少、客户等多久、总成本如何变化。这样才有条件继续讨论：投入更贵的智能，是否反而得到更便宜的合格工作。\n","html":"\u003ch1>第25章｜每天能生成20份，为什么交付仍只有4份\u003c/h1>\n\u003cp>一家教学专业服务机构用AI制作候选报告，每天可以生成20份。专家每天只能完成4份核验。负责人看到产出增长，准备增加更多模型并行，希望接更多客户。\u003c/p>\n\u003cp>但生成不是交付链的最后一步。候选还要核验、修改、与客户沟通并被采用。\u003c/p>\n\u003cp>\u003cstrong>局部扩产只有与下游容量配合，才可能变成有效交付。持续超过处理能力的生成，会先形成在制积压。\u003c/strong>\u003c/p>\n\u003ch2 id=\"lesson-25-section-1\">用数量守恒看问题\u003c/h2>\n\u003cp>设起始没有待核材料，每个工作日固定进入20份，专家完成4份，没有取消、返工、丢失和优先级差异。这是教学假设，不是实际企业记录。\u003c/p>\n\u003cdiv class=\"table-scroll table-wide\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>日末\u003c/th>\n\u003cth align=\"right\">累计进入\u003c/th>\n\u003cth align=\"right\">累计完成核验\u003c/th>\n\u003cth align=\"right\">待核积压\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1天\u003c/td>\n\u003ctd align=\"right\">20\u003c/td>\n\u003ctd align=\"right\">4\u003c/td>\n\u003ctd align=\"right\">16\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第2天\u003c/td>\n\u003ctd align=\"right\">40\u003c/td>\n\u003ctd align=\"right\">8\u003c/td>\n\u003ctd align=\"right\">32\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第5天\u003c/td>\n\u003ctd align=\"right\">100\u003c/td>\n\u003ctd align=\"right\">20\u003c/td>\n\u003ctd align=\"right\">80\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"table-hint\">表格可左右滑动查看\u003c/p>\n\u003cp>待核每天增加16份。再提高生成速度，并不会自动改变专家容量；如果缺项与返工增加，实际情况还可能更复杂。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTIwIiB2aWV3Qm94PSIwIDAgMzYwIDUyMCIgcm9sZT0iaW1nIj48dGl0bGU+55Sf5oiQ5aKe6ZW/77yM5b6F5qC45Lmf5aKe6ZW/PC90aXRsZT48ZGVzYz7mr4/ml6Xov5vlhaUyMOS7veOAgeWujOaIkDTku73vvIzotbflp4vml6Dnp6/ljovvvIzml6XmnKvlvoXmoLjliIbliKsxNuOAgTMy44CBODDku73jgILmlbDph4/lrojmgZLmlZnlrabnrpfkvovjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjUyMCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7nlJ/miJDlop7plb/vvIzlvoXmoLjkuZ/lop7plb88L3RleHQ+PHRleHQgeD0iMjQiIHk9IjgwIiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM1MjY4NWUiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjQwMCI+5pWZ5a2m5YGH6K6+IMK3IOWNleS9je+8muS7vTwvdGV4dD48cmVjdCB4PSIyNCIgeT0iMTAxIiB3aWR0aD0iMTM3IiBoZWlnaHQ9IjYxIiByeD0iNiIgZmlsbD0iI2VkZjNlZCIgc3Ryb2tlPSIjNjA3MzZjIiBzdHJva2Utd2lkdGg9IjEuNSIvPjx0ZXh0IHg9IjkyLjUiIHk9IjEzNy41IiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyMTM0MmYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSI0MDAiPuavj+Wkqei/m+WFpTIwPC90ZXh0PjxwYXRoIGQ9Ik0xNjIgMTMyTDE5NSAxMzIiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzE2NWQ1MiIgc3Ryb2tlLXdpZHRoPSIyIiBtYXJrZXItZW5kPSJ1cmwoI2Fycm93KSIvPjxyZWN0IHg9IjE5NyIgeT0iMTAxIiB3aWR0aD0iMTM5IiB 和时间放在同一关系中，原因仍需回到各环节容量。\u003c/p>\n\u003ch2 id=\"lesson-25-section-4\">应该改哪里\u003c/h2>\n\u003cp>一种选择是减少无用进入，让候选围绕更明确需求生成。另一种是提高候选可核验性，减少专家重复查证。还可以把经过验证的常规核验交给AI，改变分工，或增加真正缺少的专业资源。\u003c/p>\n\u003cp>每天只生成4份也不自动等于最优。候选多样性可能有价值，减少后质量可能下降；有些产出可长期储存，也可能合理建立库存。需要比较少量高质量候选与大量筛选，哪一种更适合这项工作。\u003c/p>\n\u003cp>同理，烘焙连锁的判断能力提升仍受生产与配送约束；设备分析更快仍可能需要现场人员。智能资源的边界要由完整业务确定。\u003c/p>\n\u003ch2 id=\"lesson-25-section-5\">从局部效率走向整链经营\u003c/h2>\n\u003cp>可以沿客户需求到实际结果，观察每个环节的进入量、完成量、等待和返工。先找到真正限制交付的地方，再决定增加智能、人力、工具还是调整服务方式。\u003c/p>\n\u003cp>评价不只问一份东西生成多快，而要问同等质量的工作完成多少、客户等多久、总成本如何变化。这样才有条件继续讨论：投入更贵的智能，是否反而得到更便宜的合格工作。\u003c/p>\n","headings":[{"id":"lesson-25-section-1","label":"用数量守恒看问题"},{"id":"lesson-25-section-2","label":"为什么积压本身也有成本"},{"id":"lesson-25-section-3","label":"队列关系能解释什么"},{"id":"lesson-25-section-4","label":"应该改哪里"},{"id":"lesson-25-section-5","label":"从局部效率走向整链经营"}],"exportMd":"# 第25章｜每天能生成20份，为什么交付仍只有4份\n\n一家教学专业服务机构用AI制作候选报告，每天可以生成20份。专家每天只能完成4份核验。负责人看到产出增长，准备增加更多模型并行，希望接更多客户。\n\n但生成不是交付链的最后一步。候选还要核验、修改、与客户沟通并被采用。\n\n**局部扩产只有与下游容量配合，才可能变成有效交付。持续超过处理能力的生成，会先形成在制积压。**\n\n## 用数量守恒看问题\n\n设起始没有待核材料，每个工作日固定进入20份，专家完成4份，没有取消、返工、丢失和优先级差异。这是教学假设，不是实际企业记录。\n\n| 日末 | 累计进入 | 累计完成核验 | 待核积压 |\n|---|---:|---:|---:|\n| 第1天 | 20 | 4 | 16 |\n| 第2天 | 40 | 8 | 32 |\n| 第5天 | 100 | 20 | 80 |\n\n待核每天增加16份。再提高生成速度，并不会自动改变专家容量；如果缺项与返工增加，实际情况还可能更复杂。\n\n![每天20份进入、4份完成核验，未完成材料按天积累为16、32和80份。上游生成扩产没有消除下游瓶颈。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTIwIiB2aWV3Qm94PSIwIDAgMzYwIDUyMCIgcm9sZT0iaW1nIj48dGl0bGU+55Sf5oiQ5aKe6ZW/77yM5b6F5qC45Lmf5aKe6ZW/PC90aXRsZT48ZGVzYz7mr4/ml6Xov5vlhaUyMOS7veOAgeWujOaIkDTku73vvIzotbflp4vml6Dnp6/ljovvvIzml6XmnKvlvoXmoLjliIbliKsxNuOAgTMy44CBODDku73jgILmlbDph4/lrojmgZLmlZnlrabnrpfkvovjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1Mi YW5nIFNDLE1pY3Jvc29mdCBZYUhlaSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE5IiBmaWxsPSIjMjEzNDJmIiB0ZXh0LWFuY2hvcj0iZW5kIiBmb250LXdlaWdodD0iNDAwIj44MDwvdGV4dD48dGV4dCB4PSI4MCIgeT0iNDU3IiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyMTM0MmYiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjQwMCI+MDwvdGV4dD48dGV4dCB4PSIzMTIiIHk9IjQ1NyIgZm9udC1mYW1pbHk9IlBpbmdGYW5nIFNDLE1pY3Jvc29mdCBZYUhlaSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmaWxsPSIjMjEzNDJmIiB0ZXh0LWFuY2hvcj0iZW5kIiBmb250LXdlaWdodD0iNDAwIj44MDwvdGV4dD48dGV4dCB4PSIyNCIgeT0iNDk5IiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM4NzVkMjIiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjQwMCI+5oyB57ut6LaF6LSf6I2377yM5peg56iz5a6a5bmz5Z2H562J5b6FPC90ZXh0Pjwvc3ZnPg==)\n\n不能把累计生成100份乘一个假定单价，宣布取得100份收入。核验完成也未必等于客户已经采用，这个例子只计算列明环节。\n\n## 为什么积压本身也有成本\n\n待核材料可能包含已经过时的客户事实；等待中的客户会追问，团队需要重新解释；专家面对大量相似候选，也要花时间判断哪些值得先看。\n\n这些成本未必在模型账单中出现，却会影响交付时效和人员负担。企业若只统计生成耗时，会漏掉等待和后续协调。\n\n并行同样需要完整测量。多个任务同时推进，可能提高总完成量，也可能竞争同一专家或工具。METR后续方法讨论提醒我们，并行使用会改变时间测量条件，不能只将单次耗时相加或相减。[方法更新](https://metr.org/blog/2026-02-24-uplift-update/)\n\n## 队列关系能解释什么\n\nLittle的经典排队研究，在相应稳定性和有限均值条件下，连接平均在制数量、平均流量与平均停留时间，常写作L=λW。[原始论文摘要](https://pubsonline.informs.org/doi/abs/10.1287/opre.9.3.383)\n\n例如另设一个已经稳定的教学系统，平均每天完成4份，平均每份在系统停留3天，则平均在制数量为12份。这里的3天是给定条件，不是由前面不断增长的积压估出来的。\n\n前面的20进、4出没有形成稳定队列，不能套公式给出一个稳定平均等待。更不能由公式得出“增加AI就能把等待缩成一天”。它帮助把数量、流量和时间放在同一关系中，原因仍需回到各环节容量。\n\n## 应该改哪里\n\n一种选择是减少无用进入，让候选围绕更明确需求生成。另一种是提高候选可核验性，减少专家重复查证。还可以把经过验证的常规核验交给AI，改变分工，或增加真正缺少的专业资源。\n\n每天只生成4份也不自动等于最优。候选多样性可能有价值，减少后质量可能下降；有些产出可长期储存，也可能合理建立库存。需要比较少量高质量候选与大量筛选，哪一种更适合这项工作。\n\n同理，烘焙连锁的判断能力提升仍受生产与配送约束；设备分析更快仍可能需要现场人员。智能资源的边界要由完整业务确定。\n\n## 从局部效率走向整链经营\n\n可以沿客户需求到实际结果，观察每个环节的进入量、完成量、等待和返工。先找到真正限制交付的地方，再决定增加智能、人力、工具还是调整服务方式。\n\n评价不只问一份东西生成多快，而要问同等质量的工作完成多少、客户等多久、总成本如何变化。这样才有条件继续讨论：投入更贵的智能，是否反而得到更便宜的合格工作。\n","text":"# 第25章｜每天能生成20份，为什么交付仍只有4份\n\n一家教学专业服务机构用AI制作候选报告，每天可以生成20份。专家每天只能完成4份核验。负责人看到产出增长，准备增加更多模型并行，希望接更多客户。\n\n但生成不是交付链的最后一步。候选还要核验、修改、与客户沟通并被采用。\n\n**局部扩产只有与下游容量配合，才可能变成有效交付。持续超过处理能力的生成，会先形成在制积压。**\n\n## 用数量守恒看问题\n\n设起始没有待核材料，每个工作日固定进入20份，专家完成4份，没有取消、返工、丢失和优先级差异。这是教学假设，不是实际企业记录。\n\n| 日末 | 累计进入 | 累计完成核验 | 待核积压 |\n|---|---:|---:|---:|\n| 第1天 | 20 | 4 | 16 |\n| 第2天 | 40 | 8 | 32 |\n| 第5天 | 100 | 20 | 80 |\n\n待核每天增加16份。再提高生成速度，并不会自动改变专家容量；如果缺项与返工增加，实际情况还可能更复杂。\n\n \n\n不能把累计生成100份乘一个假定单价，宣布取得100份收入。核验完成也未必等于客户已经采用，这个例子只计算列明环节。\n\n## 为什么积压本身也有成本\n\n待核材料可能包含已经过时的客户事实；等待中的客户会追问，团队需要重新解释；专家面对大量相似候选，也要花时间判断哪些值得先看。\n\n这些成本未必在模型账单中出现，却会影响交付时效和人员负担。企业若只统计生成耗时，会漏掉等待和后续协调。\n\n并行同样需要完整测量。多个任务同时推进，可能提高总完成量，也可能竞争同一专家或工具。METR后续方法讨论提醒我们，并行使用会改变时间测量条件，不能只将单次耗时相加或相减。方法更新\n\n## 队列关系能解释什么\n\nLittle的经典排队研究，在相应稳定性和有限均值条件下，连接平均在制数量、平均流量与平均停留时间，常写作L=λW。原始论文摘要\n\n例如另设一个已经稳定的教学系统，平均每天完成4份，平均每份在系统停留3天，则平均在制数量为12份。这里的3天是给定条件，不是由前面不断增长的积压估出来的。\n\n前面的20进、4出没有形成稳定队列，不能套公式给出一个稳定平均等待。更不能由公式得出“增加AI就能把等待缩成一天”。它帮助把数量、流量和时间放在同一关系中，原因仍需回到各环节容量。\n\n## 应该改哪里\n\n一种选择是减少无用进入，让候选围绕更明确需求生成。另一种是提高候选可核验性，减少专家重复查证。还可以把经过验证的常规核验交给AI，改变分工，或增加真正缺少的专业资源。\n\n每天只生成4份也不自动等于最优。候选多样性可能有价值，减少后质量可能下降；有些产出可长期储存，也可能合理建立库存。需要比较少量高质量候选与大量筛选，哪一种更适合这项工作。\n\n同理，烘焙连锁的判断能力提升仍受生产与配送约束；设备分析更快仍可能需要现场人员。智能资源的边界要由完整业务确定。\n\n## 从局部效率走向整链经营\n\n可以沿客户需求到实际结果，观察每个环节的进入量、完成量、等待和返工。先找到真正限制交付的地方，再决定增加智能、人力、工具还是调整服务方式。\n\n评价不只问一份东西生成多快，而要问同等质量的工作完成多少、客户等多久、总成本如何变化。这样才有条件继续讨论：投入更贵的智能，是否反而得到更便宜的合格工作。\n"},{"file":"26-完整成本与兑现.md","id":"lesson-26","number":26,"role":"核心课","part":4,"title":"第26章｜模型更贵，为什么合格工作反而更便宜","md":"# 第26章｜模型更贵，为什么合格工作反而更便宜\n\n采购时看到的是模型费用，实际工作还会占用核对、返工与衔接时间。只按调用单价选择，可能把成本转移给人员；只按节省工时算回报，又可能把没有减少的工资当成现金收益。\n\n**先在同等合格交付下比较完整相关成本，再说明释放能力怎样兑现。** 成本、工时和现金需要相连，也需要分开。\n\n## 给定同一组任务，先统一质量\n\n下面是独立教学算例，费用并非当前市场报价。A、B处理同一组1000项任务，所有输出都复核；所有失败项都被发现，额外返工后达到相同标准。只比较列明的费用和工时。\n\n| 给定条件 | A | B |\n|---|---:|---:|\n| 每项模型费 | 0.4元 | 1.2元 |\n| 常规复核 | 4分钟 | 2分钟 |\n| 额外返工比例 | 20% | 5% |\n| 每项额外返工 | 10分钟 | 10分钟 |\n| 人工工时估价 | 60元/小时 | 60元/小时 |\n\n这里的质量条件很重要。若B少复核却漏掉错误，不能直接用较少工时证明更经济；若两方案服务不同任务，也不能把难度差当作方案效果。\n\n## 把费用算到合格任务\n\nA模型费为1000×0.4=400元。常规复核4000分钟，约66.67小时，按给定工时估价计4000元；200项返工共2000分钟，约33.33小时，计2000元。列示合计6400元，人工共100小时。\n\nB模型费为1200元。常规复核2000分钟，约33.33小时，计2000元；50项返工共500分钟，约8.33小时，计500元。列示合计3700元，人工约41.67小时。\n\n| 列示结果 | A | B |\n|---|---:|---:|\n| 模型费用 | 400元 | 1200元 |\n| 常规复核估价 | 4000元 | 2000元 |\n| 返工估价 | 2000元 | 500元 |\n| 合计 | 6400元 | 3700元 |\n| 人工时间 | 100小时 | 约41.67小时 |\n\nB多花800元模型费，却少占约58.33小时，列示成本少2700元。它说明输入单价与同等合格工作的总成本可能方向相反。\n\n![在同等千项合格任务假设下，A的核验和返工使列示总成本达到6400元；B模型更贵，但列示总成本3700元。图中未包含建设维护费用。](assets/26-合格工作的成本.svg)\n\n## 2700元为什么不一定成为现金\n\n人工60元/小时首先是一个给定估价。若人员工资固定，少占时间会释放容量，却没有自动减少工资支出。\n\n假设其中确有20小时外包被取消，每小时支出60元，则现金减少1200元。再减去新增模型费用800元，列示现金改善为400元。\n\n其余释放时间可能用于更多交付、质量改进或员工减负；没有实际用途与结果前，不应再全部按现金计入。也不能同时把同一小时算作少支出和新增业务而重复取得收益。\n\n新增业务同样要扣除新增交付成本。理论上能多接项目，与真实客户购买、人员完成和收入兑现不同。\n\n## 完整相关成本还包括什么\n\n本算例没有列建设、平台、持续维护、专业支持与业务配合，因此它不是全项目回本分析。若两方案这些成本不同，应在决策时补入；相同且不因选择改变的成本，则与比较问题分开处理。\n\n关于技术互补投入的研究说明，流程、组织和人力变化会影响技术作用。办公AI研究也提醒我们，个人省时未必伴随被观测到的工作重组。这两点共同支持追踪兑现路径，而非只把工时乘单价。[互补投入](https://www.nber.org/papers/w25148)、[办公研究](https://arxiv.org/html/2504.11436v4)\n\n## 当前价值与长期能力怎样并列\n\n企业可能愿意为以后更容易处理任务，投入案例整理、工具和评价材料。这是有意义的经营选择，但应单列具体投入和未来用途。\n\n不能因为当前账面不理想，就给“知识资产”任意估值补成回本。应先看接任、新任务或迁移是否真正受益，再逐步形成更可靠判断。\n\n这使一份完整比较至少能回答：同等质量下用了多少资源，释放什么能力，哪部分支出确实取消，新增结果怎样发生，还有哪些成本与未来作用尚未进入。企业由此掌握的是价值转换过程，而不只是一个漂亮的回报率。\n","html":"\u003ch1>第26章｜模型更贵，为什么合格工作反而更便宜\u003c/h1>\n\u003cp>采购时看到的是模型费用，实际工作还会占用核对、返工与衔接时间。只按调用单价选择，可能把成本转移给人员；只按节省工时算回报，又可能把没有减少的工资当成现金收益。\u003c/p>\n\u003cp>\u003cstrong>先在同等合格交付下比较完整相关成本，再说明释放能力怎样兑现。\u003c/strong> 成本、工时和现金需要相连，也需要分开。\u003c/p>\n\u003ch2 id=\"lesson-26-section-1\">给定同一组任务，先统一质量\u003c/h2>\n\u003cp>下面是独立教学算例，费用并非当前市场报价。A、B处理同一组1000项任务，所有输出都复核；所有失败项都被发现，额外返工后达到相同标准。只比较列明的费用和工时。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>给定条件\u003c/th>\n\u003cth align=\"right\">A\u003c/th>\n\u003cth align=\"right\">B\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>每项模型费\u003c/td>\n\u003ctd align=\"right\">0.4元\u003c/td>\n\u003ctd align=\"right\">1.2元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>常规复核\u003c/td>\n\u003ctd align=\"right\">4分钟\u003c/td>\n\u003ctd align=\"right\">2分钟\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>额外返工比例\u003c/td>\n\u003ctd align=\"right\">20%\u003c/td>\n\u003ctd align=\"right\">5%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>每项额外返工\u003c/td>\n\u003ctd align=\"right\">10分钟\u003c/td>\n\u003ctd align=\"right\">10分钟\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>人工工时估价\u003c/td>\n\u003ctd align=\"right\">60元/小时\u003c/td>\n\u003ctd align=\"right\">60元/小时\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>这里的质量条件很重要。若B少复核却漏掉错误，不能直接用较少工时证明更经济；若两方案服务不同任务，也不能把难度差当作方案效果。\u003c/p>\n\u003ch2 id=\"lesson-26-section-2\">把费用算到合格任务\u003c/h2>\n\u003cp>A模型费为1000×0.4=400元。常规复核4000分钟，约66.67小时，按给定工时估价计4000元；200项返工共2000分钟，约33.33小时，计2000元。列示合计6400元，人工共100小时。\u003c/p>\n\u003cp>B模型费为1200元。常规复核2000分钟，约33.33小时，计2000元；50项返工共500分钟，约8.33小时，计500元。列示合计3700元，人工约41.67小时。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>列示结果\u003c/th>\n\u003cth align=\"right\">A\u003c/th>\n\u003cth align=\"right\">B\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>模型费用\u003c/td>\n\u003ctd align=\"right\">400元\u003c/td>\n\u003ctd align=\"right\">1200元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>常规复核估价\u003c/td>\n\u003ctd align=\"right\">4000元\u003c/td>\n\u003ctd align=\"right\">2000元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>返工估价\u003c/td>\n\u003ctd align=\"right\">2000元\u003c/td>\n\u003ctd align=\"right\">500元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>合计\u003c/td>\n\u003ctd align=\"right\">6400元\u003c/td>\n\u003ctd align=\"right\">3700元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>人工时间\u003c/td>\n\u003ctd align=\"right\">100小时\u003c/td>\n\u003ctd align=\"right\">约41.67小时\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>B多花800元模型费，却少占约58.33小时，列示成本 p>这使一份完整比较至少能回答：同等质量下用了多少资源，释放什么能力，哪部分支出确实取消，新增结果怎样发生，还有哪些成本与未来作用尚未进入。企业由此掌握的是价值转换过程，而不只是一个漂亮的回报率。\u003c/p>\n","headings":[{"id":"lesson-26-section-1","label":"给定同一组任务，先统一质量"},{"id":"lesson-26-section-2","label":"把费用算到合格任务"},{"id":"lesson-26-section-3","label":"2700元为什么不一定成为现金"},{"id":"lesson-26-section-4","label":"完整相关成本还包括什么"},{"id":"lesson-26-section-5","label":"当前价值与长期能力怎样并列"}],"exportMd":"# 第26章｜模型更贵，为什么合格工作反而更便宜\n\n采购时看到的是模型费用，实际工作还会占用核对、返工与衔接时间。只按调用单价选择，可能把成本转移给人员；只按节省工时算回报，又可能把没有减少的工资当成现金收益。\n\n**先在同等合格交付下比较完整相关成本，再说明释放能力怎样兑现。** 成本、工时和现金需要相连，也需要分开。\n\n## 给定同一组任务，先统一质量\n\n下面是独立教学算例，费用并非当前市场报价。A、B处理同一组1000项任务，所有输出都复核；所有失败项都被发现，额外返工后达到相同标准。只比较列明的费用和工时。\n\n| 给定条件 | A | B |\n|---|---:|---:|\n| 每项模型费 | 0.4元 | 1.2元 |\n| 常规复核 | 4分钟 | 2分钟 |\n| 额外返工比例 | 20% | 5% |\n| 每项额外返工 | 10分钟 | 10分钟 |\n| 人工工时估价 | 60元/小时 | 60元/小时 |\n\n这里的质量条件很重要。若B少复核却漏掉错误，不能直接用较少工时证明更经济；若两方案服务不同任务，也不能把难度差当作方案效果。\n\n## 把费用算到合格任务\n\nA模型费为1000×0.4=400元。常规复核4000分钟，约66.67小时，按给定工时估价计4000元；200项返工共2000分钟，约33.33小时，计2000元。列示合计6400元，人工共100小时。\n\nB模型费为1200元。常规复核2000分钟，约33.33小时，计2000元；50项返工共500分钟，约8.33小时，计500元。列示合计3700元，人工约41.67小时。\n\n| 列示结果 | A | B |\n|---|---:|---:|\n| 模型费用 | 400元 | 1200元 |\n| 常规复核估价 | 4000元 | 2000元 |\n| 返工估价 | 2000元 | 500元 |\n| 合计 | 6400元 | 3700元 |\n| 人工时间 | 100小时 | 约41.67小时 |\n\nB多花800元模型费，却少占约58.33小时，列示成本少2700元。它说明输入单价与同等合格工作的总成本可能方向相反。\n\n![在同等千项合格任务假设下，A的核验和返工使列示总成本达到6400元；B模型更贵，但列示总成本3700元。图中未包含建设维护费用。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNDMwIiB2aWV3Qm94PSIwIDAgMzYwIDQzMCIgcm9sZT0iaW1nIj48dGl0bGU+5q+U6L6D5ZCI5qC85bel5L2c55qE5oC76LSf5ouFPC90aXRsZT48ZGVzYz7lkIznrYnljYPpobnlkIjmoLzku7vliqHkuK3vvIxB5Li6NjQwMOWFg++8jELkuLozNzAw5YWD77yM5YyF5ZCr5qih5Z6L44CB5aSN5qC45LiO6L+U5bel5Lyw5Lu377yM5pyq5ZCr5bu66K6+57u05oqk44CCPC9kZXNjPjxkZWZzPjxtYXJrZXIgaWQ9ImFycm93IiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI3IiBtYXJrZXJIZWlnaHQ9IjciIG9yaWVudD0iYXV0by1zdGFydC1yZXZlcnNlIj48cGF0aCBkPSJNMCAwTDEwIDVMMCAxMHoiIG 明更经济；若两方案服务不同任务，也不能把难度差当作方案效果。\n\n## 把费用算到合格任务\n\nA模型费为1000×0.4=400元。常规复核4000分钟，约66.67小时，按给定工时估价计4000元；200项返工共2000分钟，约33.33小时，计2000元。列示合计6400元，人工共100小时。\n\nB模型费为1200元。常规复核2000分钟，约33.33小时，计2000元；50项返工共500分钟，约8.33小时，计500元。列示合计3700元，人工约41.67小时。\n\n| 列示结果 | A | B |\n|---|---:|---:|\n| 模型费用 | 400元 | 1200元 |\n| 常规复核估价 | 4000元 | 2000元 |\n| 返工估价 | 2000元 | 500元 |\n| 合计 | 6400元 | 3700元 |\n| 人工时间 | 100小时 | 约41.67小时 |\n\nB多花800元模型费，却少占约58.33小时，列示成本少2700元。它说明输入单价与同等合格工作的总成本可能方向相反。\n\n \n\n## 2700元为什么不一定成为现金\n\n人工60元/小时首先是一个给定估价。若人员工资固定，少占时间会释放容量，却没有自动减少工资支出。\n\n假设其中确有20小时外包被取消，每小时支出60元，则现金减少1200元。再减去新增模型费用800元，列示现金改善为400元。\n\n其余释放时间可能用于更多交付、质量改进或员工减负；没有实际用途与结果前，不应再全部按现金计入。也不能同时把同一小时算作少支出和新增业务而重复取得收益。\n\n新增业务同样要扣除新增交付成本。理论上能多接项目，与真实客户购买、人员完成和收入兑现不同。\n\n## 完整相关成本还包括什么\n\n本算例没有列建设、平台、持续维护、专业支持与业务配合，因此它不是全项目回本分析。若两方案这些成本不同，应在决策时补入；相同且不因选择改变的成本，则与比较问题分开处理。\n\n关于技术互补投入的研究说明，流程、组织和人力变化会影响技术作用。办公AI研究也提醒我们，个人省时未必伴随被观测到的工作重组。这两点共同支持追踪兑现路径，而非只把工时乘单价。互补投入、办公研究\n\n## 当前价值与长期能力怎样并列\n\n企业可能愿意为以后更容易处理任务，投入案例整理、工具和评价材料。这是有意义的经营选择，但应单列具体投入和未来用途。\n\n不能因为当前账面不理想，就给“知识资产”任意估值补成回本。应先看接任、新任务或迁移是否真正受益，再逐步形成更可靠判断。\n\n这使一份完整比较至少能回答：同等质量下用了多少资源，释放什么能力，哪部分支出确实取消，新增结果怎样发生，还有哪些成本与未来作用尚未进入。企业由此掌握的是价值转换过程，而不只是一个漂亮的回报率。\n"},{"file":"27-能力留存.md","id":"lesson-27","number":27,"role":"核心课","part":4,"title":"第27章｜智能消耗之后，什么能够留在企业","md":"# 第27章｜智能消耗之后，什么能够留在企业\n\n设想一家企业累计生成了很多报告，拥有庞大知识空间。换一个项目，团队却仍要重新收集背景；换一个负责人，旧方法也没人敢用。资料在增长，下一次工作没有明显变容易。\n\n这说明智能使用量是一种过程流量，能够持续发挥作用的能力则需要额外形成。\n\n**本轮投入是否留下资产，应看它能否在后续任务中被找到、用对并维护，实际减少重复准备或扩大可做范围。** 字数与累计token无法完成这个判断。\n\n## 什么可能成为可再用能力\n\n一条有条件的案例，可以帮助下一次识别情境；一项可靠工具，可以减少重复集成；一组代表性任务，可以帮助判断新模型；一种跨岗位协作方式，可以减少重新解释。\n\n它们的共同点，不是存储形式，而是能够改变未来工作。某些能力依靠资料，某些依靠程序和流程，还有一些依靠人员共同理解。\n\n组织知识研究解释了实践与表达之间的转换；吸收能力研究进一步说明，相关积累会影响识别和应用新知识。它们支持关注未来使用，不支持按文件数量计算能力净值。[知识形成](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)、[吸收能力](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n## 不是所有留下的东西都会增值\n\n教学设备工单如果把“未换件”误写为“换件”，错误总结进入更多任务，资料越多可能越难纠正。维护过时规则、重复文档和高度专用接口，也可能增加未来负担。\n\n因此能力留存同时涉及新增、维护与失效。企业需要知道哪些方法还适用，哪些已被修订，哪些维护不经济。原始事实可以保留，采用状态可以改变。\n\n系统技术债研究提醒我们，组件依赖与环境变化会形成持续成本。把某项成果做成共享能力，应同时考虑维护与适配。[原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n## “自己的AI”可以体现在哪里\n\n企业不一定需要从头训练专属模型。共同模型与自己的案例、工具、客户理解、资源安排结合，也可能形成独特工作能力。\n\n关键在于这些内容是否真正进入生产，并且能够根据本企业结果更新。只有一套通用提示词，难以证明特色；只有一批私有数据，也难以证明可用。有效组合与持续发展机制，才是需要建设的部分。\n\n这种看法既保留差异化目标，也避免为了独特而处处定制。通用组件可以采用，局部经验可以自有，两者共同支持企业能力。\n\n## 用下一次任务检验本轮积累\n\n教学连锁增加第九家门店，可以复用门店事件、建议、正式安排与结果的共同结构，但需要重新认识客群、时段和配送。\n\n若新店更快建立可靠记录，人员能利用旧经验提出合理问题，后续建设少了部分重复准备，就有积累作用的证据。若只是复制旧配货数量，反而可能犯错。\n\n设备服务的接任任务也类似。新人员能否识别版本差异、找到纠正、使用工具，并把新结果接回？这些表现比原作者重复演示更能暴露能力是否留在组织。\n\n## 给未来用途一个具体名字\n\n企业可以在本轮结束时说明：留下什么，预期用于哪类下一次任务，谁维护，使用时需要什么条件，以及怎样观察作用。暂时没有未来用途的一次性交付，也可以按当期价值评价，无须强行包装成资产。\n\n这有助于把长期投入与当前生产并列管理。生产、探索、验证与维护都需要资源，下一章将讨论怎样让这些投入共存，并按证据改变组合。\n","html":"\u003ch1>第27章｜智能消耗之后，什么能够留在企业\u003c/h1>\n\u003cp>设想一家企业累计生成了很多报告，拥有庞大知识空间。换一个项目，团队却仍要重新收集背景；换一个负责人，旧方法也没人敢用。资料在增长，下一次工作没有明显变容易。\u003c/p>\n\u003cp>这说明智能使用量是一种过程流量，能够持续发挥作用的能力则需要额外形成。\u003c/p>\n\u003cp>\u003cstrong>本轮投入是否留下资产，应看它能否在后续任务中被找到、用对并维护，实际减少重复准备或扩大可做范围。\u003c/strong> 字数与累计token无法完成这个判断。\u003c/p>\n\u003ch2 id=\"lesson-27-section-1\">什么可能成为可再用能力\u003c/h2>\n\u003cp>一条有条件的案例，可以帮助下一次识别情境；一项可靠工具，可以减少重复集成；一组代表性任务，可以帮助判断新模型；一种跨岗位协作方式，可以减少重新解释。\u003c/p>\n\u003cp>它们的共同点，不是存储形式，而是能够改变未来工作。某些能力依靠资料，某些依靠程序和流程，还有一些依靠人员共同理解。\u003c/p>\n\u003cp>组织知识研究解释了实践与表达之间的转换；吸收能力研究进一步说明，相关积累会影响识别和应用新知识。它们支持关注未来使用，不支持按文件数量计算能力净值。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">知识形成\u003c/a>、\u003ca href=\"https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">吸收能力\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-27-section-2\">不是所有留下的东西都会增值\u003c/h2>\n\u 别和应用新知识。它们支持关注未来使用，不支持按文件数量计算能力净值。[知识形成](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)、[吸收能力](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n## 不是所有留下的东西都会增值\n\n教学设备工单如果把“未换件”误写为“换件”，错误总结进入更多任务，资料越多可能越难纠正。维护过时规则、重复文档和高度专用接口，也可能增加未来负担。\n\n因此能力留存同时涉及新增、维护与失效。企业需要知道哪些方法还适用，哪些已被修订，哪些维护不经济。原始事实可以保留，采用状态可以改变。\n\n系统技术债研究提醒我们，组件依赖与环境变化会形成持续成本。把某项成果做成共享能力，应同时考虑维护与适配。[原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n## “自己的AI”可以体现在哪里\n\n企业不一定需要从头训练专属模型。共同模型与自己的案例、工具、客户理解、资源安排结合，也可能形成独特工作能力。\n\n关键在于这些内容是否真正进入生产，并且能够根据本企业结果更新。只有一套通用提示词，难以证明特色；只有一批私有数据，也难以证明可用。有效组合与持续发展机制，才是需要建设的部分。\n\n这种看法既保留差异化目标，也避免为了独特而处处定制。通用组件可以采用，局部经验可以自有，两者共同支持企业能力。\n\n## 用下一次任务检验本轮积累\n\n教学连锁增加第九家门店，可以复用门店事件、建议、正式安排与结果的共同结构，但需要重新认识客群、时段和配送。\n\n若新店更快建立可靠记录，人员能利用旧经验提出合理问题，后续建设少了部分重复准备，就有积累作用的证据。若只是复制旧配货数量，反而可能犯错。\n\n设备服务的接任任务也类似。新人员能否识别版本差异、找到纠正、使用工具，并把新结果接回？这些表现比原作者重复演示更能暴露能力是否留在组织。\n\n## 给未来用途一个具体名字\n\n企业可以在本轮结束时说明：留下什么，预期用于哪类下一次任务，谁维护，使用时需要什么条件，以及怎样观察作用。暂时没有未来用途的一次性交付，也可以按当期价值评价，无须强行包装成资产。\n\n这有助于把长期投入与当前生产并列管理。生产、探索、验证与维护都需要资源，下一章将讨论怎样让这些投入共存，并按证据改变组合。\n","exportSingleMd":"# 第27章｜智能消耗之后，什么能够留在企业\n\n设想一家企业累计生成了很多报告，拥有庞大知识空间。换一个项目，团队却仍要重新收集背景；换一个负责人，旧方法也没人敢用。资料在增长，下一次工作没有明显变容易。\n\n这说明智能使用量是一种过程流量，能够持续发挥作用的能力则需要额外形成。\n\n**本轮投入是否留下资产，应看它能否在后续任务中被找到、用对并维护，实际减少重复准备或扩大可做范围。** 字数与累计token无法完成这个判断。\n\n## 什么可能成为可再用能力\n\n一条有条件的案例，可以帮助下一次识别情境；一项可靠工具，可以减少重复集成；一组代表性任务，可以帮助判断新模型；一种跨岗位协作方式，可以减少重新解释。\n\n它们的共同点，不是存储形式，而是能够改变未来工作。某些能力依靠资料，某些依靠程序和流程，还有一些依靠人员共同理解。\n\n组织知识研究解释了实践与表达之间的转换；吸收能力研究进一步说明，相关积累会影响识别和应用新知识。它们支持关注未来使用，不支持按文件数量计算能力净值。[知识形成](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)、[吸收能力](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n## 不是所有留下的东西都会增值\n\n教学设备工单如果把“未换件”误写为“换件”，错误总结进入更多任务，资料越多可能越难纠正。维护过时规则、重复文档和高度专用接口，也可能增加未来负担。\n\n因此能力留存同时涉及新增、维护与失效。企业需要知道哪些方法还适用，哪些已被修订，哪些维护不经济。原始事实可以保留，采用状态可以改变。\n\n系统技术债研究提醒我们，组件依赖与环境变化会形成持续成本。把某项成果做成共享能力，应同时考虑维护与适配。[原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n## “自己的AI”可以体现在哪里\n\n企业不一定需要从头训练专属模型。共同模型与自己的案例、工具、客户理解、资源安排结合，也可能形成独特工作能力。\n\n关键在于这些内容是否真正进入生产，并且能够根据本企业结果更新。只有一套通用提示词，难以证明特色；只有一批私有数据，也难以证明可用。有效组合与持续发展机制，才是需要建设的部分。\n\n这种看法既保留差异化目标，也避免为了独特而处处定制。通用组件可以采用，局部经验可以自有，两者共同支持企业能力。\n\n## 用下一次任务检验本轮积累\n\n教学连锁增加第九家门店，可以复用门店事件、建议、正式安排与结果的共同结构，但需要重新认识客群、时段和配送。\n\n若新店更快建立可靠记录，人员能利用旧经验提出合理问题，后续建设少了部分重复准备，就有积累作用的证据。若只是复制旧配货数量，反而可能犯错。\n\n设备服务的接任任务也类似。新人员能否识别版本差异、找到纠正、使用工具，并把新结果接回？这些表现比原作者重复演示更能暴露能力是否留在组织。\n\n## 给未来用途一个具体名字\n\n企业可以在本轮结束时说明：留下什么，预期用于哪类下一次任务，谁维护，使用时需要什么条件，以及怎样观察作用。暂时没有未来用途的一次性交付，也可以按当期价值评价，无须强行包装成资产。\n\n这有助于把长期投入与当前生产并列管理。生产、探索、验证与维护都需要资源，下一章将讨论怎样让这些投入共存，并按证据改变组合。\n","text":"# 第27章｜智能消耗之后，什么能够留在企业\n\n设想一家企业累计生成了很多报告，拥有庞大知识空间。换一个项目，团队却仍要重新收集背景；换一个负责人，旧方法也没人敢用。资料在增长，下一次工作没有明显变容易。\n\n这说明智能使用量是一种过程流量，能够持续发挥作用的能力则需要额外形成。\n\n**本轮投入是否留下资产，应看它能否在后续任务中被找到、用对并维护，实际减少重复准备或扩大可做范围。** 字数与累计token无法完成这个判断。\n\n## 什么可能成为可再用能力\n\n一条有条件的案例，可以帮助下一次识别情境；一项可靠工具，可以减少重复集成；一组代表性任务，可以帮助判断新模型；一种跨岗位协作方式，可以减少重新解释。\n\n它们的共同点，不是存储形式，而是能够改变未来工作。某些能力依靠资料，某些依靠程序和流程，还有一些依靠人员共同理解。\n\n组织知识研究解释了实践与表达之间的转换；吸收能力研究进一步说明，相关积累会影响识别和应用新知识。它们支持关注未来使用，不支持按文件数量计算能力净值。知识形成、吸收能力\n\n## 不是所有留下的东西都会增值\n\n教学设备工单如果把“未换件”误写为“换件”，错误总结进入更多任务，资料越多可能越难纠正。维护过时规则、重复文档和高度专用接口，也可能增加未来负担。\n\n因此能力留存同时涉及新增、维护与失效。企业需要知道哪些方法还适用，哪些已被修订，哪些维护不经济。原始事实可以保留，采用状态可以改变。\n\n系统技术债研究提醒我们，组件依赖与环境变化会形成持续成本。把某项成果做成共享能力，应同时考虑维护与适配。原始论文\n\n## “自己的AI”可以体现在哪里\n\n企业不一定需要从头训练专属模型。共同模型与自己的案例、工具、客户理解、资源安排结合，也可能形成独特工作能力。\n\n关键在于这些内容是否真正进入生产，并且能够根据本企业结果更新。只有一套通用提示词，难以证明特色；只有一批私有数据，也难以证明可用。有效组合与持续发展机制，才是需要建设的部分。\n\n这种看法既保留差异化目标，也避免为了独特而处处定制。通用组件可以采用，局部经验可以自有，两者共同支持企业能力。\n\n## 用下一次任务检验本轮积累\n\n教学连锁增加第九家门店，可以复用门店事件、建议、正式安排与结果的共同结构，但需要重新认识客群、时段和配送。\n\n若新店更快建立可靠记录，人员能利用旧经验提出合理问题，后续建设少了部分重复准备，就有积累作用的证据。若只是复制旧配货数量，反而可能犯错。\n\n设备服务的接任任务也类似。新人员能否识别版本差异、找到纠正、使用工具，并把新结果接回？这些表现比原作者重复演示更能暴露能力是否留在组织。\n\n## 给未来用途一个具体名字\n\n企业可以在本轮结束时说明：留下什么，预期用于哪类下一次任务，谁维护，使用时需要什么条件，以及怎样观察作用。暂时没有未来用途的一次性交付，也可以按当期价值评价，无须强行包装成资产。\n\n这有助于把长期投入与当前生产并列管理。生产、探索、验证与维护都需要资源，下一章将讨论怎样让这些投入共存，并按证据改变组合。\n"},{"file":"28-投入组合.md","id":"lesson-28","number":28,"role":"核心课","part":4,"title":"第28章｜当期生产、探索、验证和维护，怎样共同获得资源","md":"# 第28章｜当期生产、探索、验证和维护，怎样共同获得资源\n\nAI项目运行后，可能出现这样的处境：日常任务占满预算。团队知道需要整理反例、更新规则，也想试新服务，却总是推到下个月。另一种情况是持续试工具，现有生产反而无人维护。\n\n两者都涉及同一个问题：不同用途争用共同资源，但回报时间和可见程度不同。\n\n**智能投入需要同时服务当期交付、新可能、有效性检验和持续维护，并按证据调整组合。** 单看当月产出，容易挤掉未来条件；把所有支出叫创新，又会失去判断。\n\n## 四类用途，分别回答什么\n\n生产使当前合格工作发生，例如生成并执行日常分配、完成工单材料准备。它需要稳定质量、时效与成本。\n\n探索研究当前尚未确定的可能，例如新门店需求、新服务方式或新的判断方法。回报不确定，应说明想减少什么未知。\n\n验证帮助决定某种方法是否值得采用或扩大。比较合理基线、检查新版本、检验接任都消耗资源，却可能避免错误扩张。\n\n维护使已有能力继续有效，例如更新规则、修复工具连接、停用失效经验。它的产出往往是“问题没有发生”，因此容易在只看新增功能的评价中被忽视。\n\n| 用途 | 教学连锁中的工作 | 阶段复查问题 |\n|---|---|---|\n| 生产 | 日常候选与正式分配 | 合格完成与实际结果是否稳定 |\n| 探索 | 第九店需求与新预订服务 | 哪项未知被减少，下一步怎样变 |\n| 验证 | 与人工/SOP、传统方法比较 | 是否有真实增量与可迁移依据 |\n| 维护 | 更新交通条件与失效规则 | 是否仍适用，维护负担是否合理 |\n\n某项工作可以同时服务多个用途。分类用于说明目的与取舍，不要求建立繁琐填报。\n\n## 为什么最容易被看见的回报会占优势\n\n当期生产可以统计完成量，探索却可能没有立即可见成果；维护延迟的损失尚未发生，验证也可能只是让团队决定停止。\n\n若只奖励新增产出，团队自然把精力投向容易展示的工作。长期看，可能缺少新认识、错误方法继续扩大，原系统也逐渐失效。\n\nMarch的探索与利用研究解释了资源竞争与回报节奏差异。它提供的是长期张力，不是一个人人适用的固定比例。[原始研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)\n\n## 资源组合应随证据变化\n\n假设连锁最初不确定售罄信息是否有增量，验证与采集需要较多注意力。若方法已在明确范围内稳定，日常生产可以扩大，同时保留维护和抽查。\n\n若交通变化使旧方法失效，资源应回到认识与修订；若新店迁移负担很高，就不能只按旧店低成本推算扩张。某一阶段的合理安排，不应被永久当成组织比例。\n\n探索也应有结果要求。结果可以是确定一个方向不值得做，但必须说明哪项观察改变了选择。连续失败而认识不变，不能仅以“创新本来如此”解释。\n\n## 用共同瓶颈安排投入\n\n预算不只是模型费，还包括专家时间、工程与业务配合。产能瓶颈若在专业核验，把所有新增预算用于生成会扩大积压；若在资料关联，购买更大模型也可能无效。\n\n因此需要把四类用途放在同一条业务里讨论：当期生产占用多少关键人力，验证与维护是否有入口，探索能否在受控范围取得反馈。系统技术债研究提醒我们，忽视维护会使依赖与反馈问题不断累积。[原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n## 一份有用的阶段资源说明\n\n它应讲清当前最重要的价值与未知，四类工作各解决什么，哪项证据会使投入增加、减少或转向，以及由谁复查。\n\n不必给每项未来能力估值，也不必因不能精确预测就放弃安排。明确的机制与阶段证据，能够支持比单一调用预算更有内容的经营判断。\n\n接下来需要把“证据”进一步拆开。任务质量提高、业务效果改善和组织真正学会，必须分别观察。\n","html":"\u003ch1>第28章｜当期生产、探索、验证和维护，怎样共同获得资源\u003c/h1>\n\u003cp>AI项目运行后，可能出现这样的处境：日常任务占满预算。团队知道需要整理反例、更新规则，也想试新服务，却总是推到下个月。另一种情况是持续试工具，现有生产反而无人维护。\u003c/p>\n\u003cp>两者都涉及同一个问题：不同用途争用共同资源，但回报时间和可见程度不同。\u003c/p>\n\u003cp>\u003cstrong>智能投入需要同时服务当期交付、新可能、有效性检验和持续维护，并按证据调整组合。\u003c/strong> 单看当月产出，容易挤掉未来条件；把所有支出叫创新，又会失去判断。\u003c/p>\n\u003ch2 id=\"lesson-28-section-1\">四类用途，分别回答什么\u003c/h2>\n\u003cp>生产使当前合格工作发生，例如生成并执行日常分配、完成工单材料准备。它需要稳定质量、时效与成本。\u003c/p>\n\u003cp>探索研究当前尚未确定的可能，例如新门店需求、新服务方式或新的判断方法。回报不确定，应说明想减少什么未知。\u003c/p>\n\u003cp>验证帮助决定某种方法是否值得采用或扩大。比较合理基线、检查新版本、检验接任都消耗资源，却可能避免错误扩张。\u003c/p>\n\u003cp>维护使已有能力继续有效，例如更新规则、修复工具连接、停用失效经验。它的产出往往是“问题没有发生”，因此容易在只看新增功能的评价中被忽视。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>用途\u003c/th>\n\u003cth>教学连锁中的工作\u003c/th>\n\u003cth>阶段复查问题\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>生产\u003c/td>\n\u003ctd>日常候选与正式分配\u003c/td>\n\u003ctd>合格完成与实际结果是否稳定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>探索\u003c/td>\n\u003ctd>第九店需求与新预订服务\u003c/td>\n\u003ctd>哪项未知被减少，下一步怎样变\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>验证\u003c/td>\n\u003ctd>与人工/SOP、传统方法比较\u003c/td>\n\u003ctd>是否有真实增量与可迁移依据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>维护\u003c/td>\n\u003ctd>更新交通条件与失效规则\u003c/td>\n\u003ctd>是否仍适用，维护负担是否合理\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>某项工作可以同时服务多个用途。分类用于说明目的与取舍，不要求建立繁琐填报。\u003c/p>\n\u003ch2 id=\"lesson-28-section-2\">为什么最容易被看见的回报会占优势\u003c/h2>\n\u003cp>当期生产可以统计完成量，探索却可能没有立即可见成果；维护延迟的损失尚未发生，验证也可能只是让团队决定停止。\u003c/p>\n\u003cp>若只奖励新增产出，团队自然把精力投向容易展示的工作。长期看，可能缺少新认识、错误方法继续扩大，原系统也逐渐失效。\u003c/p>\n\u003cp>March的探索与利用研究解释了资源竞争与回报节奏差异。它提供的是长期张力，不是一个人人适用的固定比例。\u003ca href=\"https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-28-section-3\">资源组合应随证据变化\u003c/h2>\n\u003cp>假设连锁最初不确定售罄信息是否有增量，验证与采集需要较多注意力。若方法已在明确范围内稳定，日常生产可以扩大，同时保留维护和抽查。\u003c/p>\n\u003cp>若交通变化使旧方法失效，资源应回到认识与修订；若新店迁移负担很高，就不能只按旧店低成本推算扩张。某一阶段的合理安排，不应被永久当成组织比例。\u003c/p>\n\u003cp>探索也应有结果要求。结果可以是确定一个方向不值得做，但必须说明哪项观察改变了选择。连续失败而认识不变，不能仅以“创新本来如此”解释。\u003c/p>\n\u003ch2 id=\"lesson-28-section-4\">用共同瓶颈安排投入\u003c/h2>\n\u003cp>预算不只是模型费，还包括专家时间、工程与业务配合。产能瓶颈若在专业核验，把所有新增预算用于生成会扩大积压；若在资料关联，购买更大模型也可能无效。\u003c/p>\n\u003cp>因此需要把四类用途放在同一条业务里讨论：当期生产占用多少关键人力，验证与维护是否有入口，探索能否在受控范围取得反馈。系统技术债研究提醒我们，忽视维护会使依赖与反馈问题不断累积。\u003ca href=\"https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始论文\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-28-section-5\">一份有用的阶段资源说明\u003c/h2>\n\u003cp>它应讲清当前最重要的价值与未知，四类工作各解决什么，哪项证据会使投入增加、减少或转向，以及由谁复查。\u003c/p>\n\u003cp>不必给每项未来能力估值，也不必因不能精确预测就放弃安排。明确的机制与阶段证据，能够支持比单一调用预算更有内容的经营判断。\u003c/p>\n\u003cp>接下来需要把“证据”进一步拆开。任务质量提高、业务效果改善和组织真正学会，必须分别观察。\u003c/p>\n","headings":[{"id":"lesson-28-section-1","label":"四类用途，分别回答什么"},{"id":"lesson-28-section-2","label":"为什么最容易被看见的回报会占优势"},{"id":"lesson-28-section-3","label":"资源组合应随证据变化"},{"id":"lesson-28-section-4","label":"用共同瓶颈安排投入"},{"id":"lesson-28-section-5","label":"一份有用的阶段资源说明"}],"exportMd":"# 第28章｜当期生产、探索、验证和维护，怎样共同获得资源\n\nAI项目运行后，可能出现这样的处境：日常任务占满预算。团队知道需要整理反例、更新规则，也想试新服务，却总是推到下个月。另一种情况是持续试工具，现有生产反而无人维护。\n\n两者都涉及同一个问题：不同用途争用共同资源，但回报时间和可见程度不同。\n\n**智能投入需要同时服务当期交付、新可能、有效性检验和持续维护，并按证据调整组合。** 单看当月产出，容易挤掉未来条件；把所有支出叫创新，又会失去判断。\n\n## 四类用途，分别回答什么\n\n生产使当前合格工作发生，例如生成并执行日常分配、完成工单材料准备。它需要稳定质量、时效与成本。\n\n探索研究当前尚未确定的可能，例如新门店需求、新服务方式或新的判断方法。回报不确定，应说明想减少什么未知。\n\n验证帮助决定某种方法是否值得采用或扩大。比较合理基线、检查新版本、检验接任都消耗资源，却可能避免错误扩张。\n\n维护使已有能力继续有效，例如更新规则、修复工具连接、停用失效经验。它的产出往往是“问题没有发生”，因此容易在只看新增功能的评价中被忽视。\n\n| 用途 | 教学连锁中的工作 | 阶段复查问题 |\n|---|---|---|\n| 生产 | 日常候选与正式分配 | 合格完成与实际结果是否稳定 |\n| 探索 | 第九店需求与新预订服务 | 哪项未知被减少，下一步怎样变 |\n| 验证 | 与人工/SOP、传统方法比较 | 是否有真实增量与可迁移依据 |\n| 维护 | 更新交通条件与失效规则 | 是否仍适用，维护负担是否合理 |\n\n某项工作可以同时服务多个用途。分类用于说明目的与取舍，不要求建立繁琐填报。\n\n## 为什么最容易被看见的回报会占优势\n\n当期生产可以统计完成量，探索却可能没有立即可见成果；维护延迟的损失尚未发生，验证也可能只是让团队决定停止。\n\n若只奖励新增产出，团队自然把精力投向容易展示的工作。长期看，可能缺少新认识、错误方法继续扩大，原系统也逐渐失效。\n\nMarch的探索与利用研究解释了资源竞争与回报节奏差异。它提供的是长期张力，不是一个人人适用的固定比例。[原始研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)\n\n## 资源组合应随证据变化\n\n假设连锁最初不确定售罄信息是否有增量，验证与采集需要较多注意力。若方法已在明确范围内稳定，日常生产可以扩大，同时保留维护和抽查。\n\n若交通变化使旧方法失效，资源应回到认识与修订；若新店迁移负担很高，就不能只按旧店低成本推算扩张。某一阶段的合理安排，不应被永久当成组织比例。\n\n探索也应有结果要求。结果可以是确定一个方向不值得做，但必须说明哪项观察改变了选择。连续失败而认识不变，不能仅以“创新本来如此”解释。\n\n## 用共同瓶颈安排投入\n\n预算不只是模型费，还包括专家时间、工程与业务配合。产能瓶颈若在专业核验，把所有新增预算用于生成会扩大积压；若在资料关联，购买更大模型也可能无效。\n\n因此需要把四类用途放在同一条业务里讨论：当期生产占用多少关键人力，验证与维护是否有入口，探索能否在受控范围取得反馈。系统技术债研究提醒我们，忽视维护会使依赖与反馈问题不断累积。[原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n## 一份有用的阶段资源说明\n\n它应讲清当前最重要的价值与未知，四类工作各解决什么，哪项证据会使投入增加、减少或转向，以及由谁复查。\n\n不必给每项未来能力估值，也不必因不能精确预测就放弃安排。明确的机制与阶段证据，能够支持比单一调用预算更有内容的经营判断。\n\n接下来需要把“证据”进一步拆开。任务质量提高、业务效果改善和组织真正学会，必须分别观察。\n","exportSingleMd":"# 第28章｜当期生产、探索、验证和维护，怎样共同获得资源\n\nAI项目运行后，可能出现这样的处境：日常任务占满预算。团队知道需要整理反例、更新规则，也想试新服务，却总是推到下个月。另一种情况是持续试工具，现有生产反而无人维护。\n\n两者都涉及同一个问题：不同用途争用共同资源，但回报时间和可见程度不同。\n\n**智能投入需要同时服务当期交付、新可能、有效性检验和持续维护，并按证据调整组合。** 单看当月产出，容易挤掉未来条件；把所有支出叫创新，又会失去判断。\n\n## 四类用途，分别回答什么\n\n生产使当前合格工作发生，例如生成并执行日常分配、完成工单材料准备。它需要稳定质量、时效与成本。\n\n探索研究当前尚未确定的可能，例如新门店需求、新服务方式或新的判断方法。回报不确定，应说明想减少什么未知。\n\n验证帮助决定某种方法是否值得采用或扩大。比较合理基线、检查新版本、检验接任都消耗资源，却可能避免错误扩张。\n\n维护使已有能力继续有效，例如更新规则、修复工具连接、停用失效经验。它的产出往往是“问题没有发生”，因此容易在只看新增功能的评价中被忽视。\n\n| 用途 | 教学连锁中的工作 | 阶段复查问题 |\n|---|---|---|\n| 生产 | 日常候选与正式分配 | 合格完成与实际结果是否稳定 |\n| 探索 | 第九店需求与新预订服务 | 哪项未知被减少，下一步怎样变 |\n| 验证 | 与人工/SOP、传统方法比较 | 是否有真实增量与可迁移依据 |\n| 维护 | 更新交通条件与失效规则 | 是否仍适用，维护负担是否合理 |\n\n某项工作可以同时服务多个用途。分类用于说明目的与取舍，不要求建立繁琐填报。\n\n## 为什么最容易被看见的回报会占优势\n\n当期生产可以统计完成量，探索却可能没有立即可见成果；维护延迟的损失尚未发生，验证也可能只是让团队决定停止。\n\n若只奖励新增产出，团队自然把精力投向容易展示的工作。长期看，可能缺少新认识、错误方法继续扩大，原系统也逐渐失效。\n\nMarch的探索与利用研究解释了资源竞争与回报节奏差异。它提供的是长期张力，不是一个人人适用的固定比例。[原始研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)\n\n## 资源组合应随证据变化\n\n假设连锁最初不确定售罄信息是否有增量，验证与采集需要较多注意力。若方法已在明确范围内稳定，日常生产可以扩大，同时保留维护和抽查。\n\n若交通变化使旧方法失效，资源应回到认识与修订；若新店迁移负担很高，就不能只按旧店低成本推算扩张。某一阶段的合理安排，不应被永久当成组织比例。\n\n探索也应有结果要求。结果可以是确定一个方向不值得做，但必须说明哪项观察改变了选择。连续失败而认识不变，不能仅以“创新本来如此”解释。\n\n## 用共同瓶颈安排投入\n\n预算不只是模型费，还包括专家时间、工程与业务配合。产能瓶颈若在专业核验，把所有新增预算用于生成会扩大积压；若在资料关联，购买更大模型也可能无效。\n\n因此需要把四类用途放在同一条业务里讨论：当期生产占用多少关键人力，验证与维护是否有入口，探索能否在受控范围取得反馈。系统技术债研究提醒我们，忽视维护会使依赖与反馈问题不断累积。[原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n## 一份有用的阶段资源说明\n\n它应讲清当前最重要的价值与未知，四类工作各解决什么，哪项证据会使投入增加、减少或转向，以及由谁复查。\n\n不必给每项未来能力估值，也不必因不能精确预测就放弃安排。明确的机制与阶段证据，能够支持比单一调用预算更有内容的经营判断。\n\n接下来需要把“证据”进一步拆开。任务质量提高、业务效果改善和组织真正学会，必须分别观察。\n","text":"# 第28章｜当期生产、探索、验证和维护，怎样共同获得资源\n\nAI项目运行后，可能出现这样的处境：日常任务占满预算。团队知道需要整理反例、更新规则，也想试新服务，却总是推到下个月。另一种情况是持续试工具，现有生产反而无人维护。\n\n两者都涉及同一个问题：不同用途争用共同资源，但回报时间和可见程度不同。\n\n**智能投入需要同时服务当期交付、新可能、有效性检验和持续维护，并按证据调整组合。** 单看当月产出，容易挤掉未来条件；把所有支出叫创新，又会失去判断。\n\n## 四类用途，分别回答什么\n\n生产使当前合格工作发生，例如生成并执行日常分配、完成工单材料准备。它需要稳定质量、时效与成本。\n\n探索研究当前尚未确定的可能，例如新门店需求、新服务方式或新的判断方法。回报不确定，应说明想减少什么未知。\n\n验证帮助决定某种方法是否值得采用或扩大。比较合理基线、检查新版本、检验接任都消耗资源，却可能避免错误扩张。\n\n维护使已有能力继续有效，例如更新规则、修复工具连接、停用失效经验。它的产出往往是“问题没有发生”，因此容易在只看新增功能的评价中被忽视。\n\n| 用途 | 教学连锁中的工作 | 阶段复查问题 |\n|---|---|---|\n| 生产 | 日常候选与正式分配 | 合格完成与实际结果是否稳定 |\n| 探索 | 第九店需求与新预订服务 | 哪项未知被减少，下一步怎样变 |\n| 验证 | 与人工/SOP、传统方法比较 | 是否有真实增量与可迁移依据 |\n| 维护 | 更新交通条件与失效规则 | 是否仍适用，维护负担是否合理 |\n\n某项工作可以同时服务多个用途。分类用于说明目的与取舍，不要求建立繁琐填报。\n\n## 为什么最容易被看见的回报会占优势\n\n当期生产可以统计完成量，探索却可能没有立即可见成果；维护延迟的损失尚未发生，验证也可能只是让团队决定停止。\n\n若只奖励新增产出，团队自然把精力投向容易展示的工作。长期看，可能缺少新认识、错误方法继续扩大，原系统也逐渐失效。\n\nMarch的探索与利用研究解释了资源竞争与回报节奏差异。它提供的是长期张力，不是一个人人适用的固定比例。原始研究\n\n## 资源组合应随证据变化\n\n假设连锁最初不确定售罄信息是否有增量，验证与采集需要较多注意力。若方法已在明确范围内稳定，日常生产可以扩大，同时保留维护和抽查。\n\n若交通变化使旧方法失效，资源应回到认识与修订；若新店迁移负担很高，就不能只按旧店低成本推算扩张。某一阶段的合理安排，不应被永久当成组织比例。\n\n探索也应有结果要求。结果可以是确定一个方向不值得做，但必须说明哪项观察改变了选择。连续失败而认识不变，不能仅以“创新本来如此”解释。\n\n## 用共同瓶颈安排投入\n\n预算不只是模型费，还包括专家时间、工程与业务配合。产能瓶颈若在专业核验，把所有新增预算用于生成会扩大积压；若在资料关联，购买更大模型也可能无效。\n\n因此需要把四类用途放在同一条业务里讨论：当期生产占用多少关键人力，验证与维护是否有入口，探索能否在受控范围取得反馈。系统技术债研究提醒我们，忽视维护会使依赖与反馈问题不断累积。原始论文\n\n## 一份有用的阶段资源说明\n\n它应讲清当前最重要的价值与未知，四类工作各解决什么，哪项证据会使投入增加、减少或转向，以及由谁复查。\n\n不必给每项未来能力估值，也不必因不能精确预测就放弃安排。明确的机制与阶段证据，能够支持比单一调用预算更有内容的经营判断。\n\n接下来需要把“证据”进一步拆开。任务质量提高、业务效果改善和组织真正学会，必须分别观察。\n"},{"file":"29-任务质量.md","id":"lesson-29","number":29,"role":"核心课","part":5,"title":"第29章｜怎样判断AI工作合格，而不只判断回答好看","md":"# 第29章｜怎样判断AI工作合格，而不只判断回答好看\n\n设备服务教学案例里的两份工单总结都流畅、格式完整。一份准确记录“调整并重启，未换件”，另一份写成“更换部件后恢复”。若只让使用者评价“是否专业、是否清晰”，第二份也可能得到好印象。\n\n评价必须回到任务：这份材料要支持什么工作，哪些差别会改变后续判断。\n\n**质量标准应匹配采用条件与任务阶段。** 能读、能采用、能执行、能产生结果，需要不同证据。\n\n## 从一项具体任务建立标准\n\n若任务是整理派工前资料，合格应涉及设备身份、客户描述、已知历史、关键缺项与原材料关联。它不需要在事实不足时给出确定故障原因。\n\n若任务是形成正式处置记录，实际动作与结果准确就很重要。未换件却写成换件，是事实错误；没有长期观察却写成彻底解决，是结论超出证据。两者都不是修辞偏好。\n\n若任务是开放构思，可以允许未成熟方案。此时要求每项想法都达到正式交付标准，反而会提前压缩探索。阶段与用途决定要求。\n\n| 阶段 | 需要判断什么 | 不能用什么替代 |\n|---|---|---|\n| 整理事实 | 是否准确、完整且能追溯 | 语言流畅 |\n| 产生候选 | 是否相关、有依据、有用 | 候选数量 |\n| 比较选择 | 是否识别关键差别 | 最终方案看起来不错 |\n| 实际执行 | 对象、动作与状态是否正确 | AI说已完成 |\n| 客户采用 | 是否帮助真实工作 | 内部满意度 |\n\n一个项目可以逐步覆盖这些阶段，但不能只测前一段就宣布后一段成立。\n\n## 让材料有机会暴露重要错误\n\n只用团队熟悉的标准样例，会漏掉现实中的资料缺项、版本冲突与异常。可以从真实任务中选择有代表性的材料，保留一部分不参与调试，避免只对见过的题有效。\n\n在教学设备案例里，至少要看到常规查询、实际动作与草稿不符、不同版本的相似报修，以及提交后无回显等情形。每类材料都对应一种可能改变行动的差别。\n\n不需要为了数量堆积极端题。选择依据是业务重要性与当前未知，而不是让测试看起来复杂。\n\n## 把阶段表现与最终结果同时看\n\n宝洁创新实验提醒我们，候选生成、从候选中选择与最终方案质量可以不同方向变化。最终改善仍有价值，却未必说明选择环节已经成熟。[研究原文](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n因此，企业既应看最终合格交付，也应定位错误发生在哪一段。若材料整理正确、执行对象错误，升级生成能力可能无助；若候选很好但筛选负担巨大，问题更接近工作配置。\n\n## 核验本身也要进入评价\n\n一个方案在专家重做全部工作后达到高质量，与直接形成可靠材料不同。应记录核验和返工负担，防止把人员补救当作模型独立能力。\n\n人员评价也会受印象影响。METR开发研究对照了主观感受与实际任务耗时，说明“觉得更快”不能独自承担效果判断。它针对特定时期与任务，不能用来断言所有AI都更慢。[原始研究](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)\n\n自动评分可以帮助处理规模，但其标准和材料仍需核对。若评价只重复模型自己的解释，可能无法发现共同遗漏。重要差别应能回到真实资料和业务要求。\n\n## 质量结论应怎样写\n\n可以说清：在什么任务和材料范围内，按什么要求观察到哪些表现，人员做了多少补充，哪些情况尚不适合扩大采用。\n\n这样的结论比一个总分更容易用于决策。它告诉团队要改事实、方法、工具还是分工，也为下一阶段业务试点提供基础。\n\n任务合格仍不证明企业结果改善。真实业务里，还有选择、采用、资源与同期变化，必须继续比较。\n","html":"\u003ch1>第29章｜怎样判断AI工作合格，而不只判断回答好看\u003c/h1>\n\u003cp>设备服务教学案例里的两份工单总结都流畅、格式完整。一份准确记录“调整并重启，未换件”，另一份写成“更换部件后恢复”。若只让使用者评价“是否专业、是否清晰”，第二份也可能得到好印象。\u003c/p>\n\u003cp>评价必须回到任务：这份材料要支持什么工作，哪些差别会改变后续判断。\u003c/p>\n\u003cp>\u003cstrong>质量标准应匹配采用条件与任务阶段。\u003c/strong> 能读、能采用、能执行、能产生结果，需要不同证据。\u003c/p>\n\u003ch2 id=\"lesson-29-section-1\">从一项具体任务建立标准\u003c/h2>\n\u003cp>若任务是整理派工前资料，合格应涉及设备身份、客户描述、已知历史、关键缺项与原材料关联。它不需要在事实不足时给出确定故障原因。\u003c/p>\n\u003cp>若任务是形成正式处置记录，实际动作与结果准确就很重要。未换件却写成换件，是事实错误；没有长期观察却写成彻底解决，是结论超出证据。两者都不是修辞偏好。\u003c/p>\n\u003cp>若任务是开放构思，可以允许未成熟方案。此时要求每项想法都达到正式交付标准，反而会提前压缩探索。阶段与用途决定要求。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>阶段\u003c/th>\n\u003cth>需要判断什么\u003c/th>\n\u003cth>不能用什么替代\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>整理事实\u003c/td>\n\u003ctd>是否准确、完整且能追溯\u003c/td>\n\u003ctd>语言流畅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>产生候选\u003c/td>\n\u003ctd>是否相关、有依据、有用\u003c/td>\n\u003ctd>候选数量\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>比较选择\u003c/td>\n\u003ctd>是否识别关键差别\u003c/td>\n\u003ctd>最终方案看起来不错\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>实际执行\u003c/td>\n\u003ctd>对象、动作与状态是否正确\u003c/td>\n\u003ctd>AI说已完成\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>客户采用\u003c/td>\n\u003ctd>是否帮助真实工作\u003c/td>\n\u003ctd>内部满意度\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>一个项目可以逐步覆盖这些阶段，但不能只测前一段就宣布后一段成立。\u003c/p>\n\u003ch2 id=\"lesson-29-section-2\">让材料有机会暴露重要错误\u003c/h2>\n\u003cp>只用团队熟悉的标准样例，会漏掉现实中的资料缺项、版本冲突与异常。可以从真实任务中选择有代表性的材料，保留一部分不参与调试，避免只对见过的题有效。\u003c/p>\n\u003cp>在教学设备案例里，至少要看到常规查询、实际动作与草稿不符、不同版本的相似报修，以及提交后无回显等情形。每类材料都对应一种可能改变行动的差别。\u003c/p>\n\u003cp>不需要为了数量堆积极端题。选择依据是业务重要性与当前未知，而不是让测试看起来复杂。\u003c/p>\n\u003ch2 id=\"lesson-29-section-3\">把阶段表现与最终结果同时看\u003c/h2>\n\u003cp>宝洁创新实验提醒我们，候选生成、从候选中选择与最终方案质量可以不同方向变化。最终改善仍有价值，却未必说明选择环节已经成熟。\u003ca href=\"https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702\" target=\"_blank\" rel=\"noopener noreferrer\">研究原文\u003c/a>\u003c/p>\n\u003cp>因此，企业既应看最终合格交付，也应定位错误发生在哪一段。若材料整理正确、执行对象错误，升级生成能力可能无助；若候选很好但筛选负担巨大，问题更接近工作配置。\u003c/p>\n\u003ch2 id=\"lesson-29-section-4\">核验本身也要进入评价\u003c/h2>\n\u003cp>一个方案在专家重做全部工作后达到高质量，与直接形成可靠材料不同。应记录核验和返工负担，防止把人员补救当作模型独立能力。\u003c/p>\n\u003cp>人员评价也会受印象影响。METR开发研究对照了主观感受与实际任务耗时，说明“觉得更快”不能独自承担效果判断。它针对特定时期与任务，不能用来断言所有AI都更慢。\u003ca href=\"https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003cp>自动评分可以帮助处理规模，但其标准和材料仍需核对。若评价只重复模型自己的解释，可能无法发现共同遗漏。重要差别应能回到真实资料和业务要求。\u003c/p>\n\u003ch2 id=\"lesson-29-section-5\">质量结论应怎样写\u003c/h2>\n\u003cp>可以说清：在什么任务和材料范围内，按什么要求观察到哪些表现，人员做了多少补充，哪些情况尚不适合扩大采用。\u003c/p>\n\u003cp>这样的结论比一个总分更容易用于决策。它告诉团队要改事实、方法、工具还是分工，也为下一阶段业务试点提供基础。\u003c/p>\n\u003cp>任务合格仍不证明企业结果改善。真实业务里，还有选择、采用、资源与同期变化，必须继续比较。\u003c/p>\n","headings":[{"id":"lesson-29-section-1","label":"从一项具体任务建立标准"},{"id":"lesson-29-section-2","label":"让材料有机会暴露重要错误"},{"id":"lesson-29-section-3","label":"把阶段表现与最终结果同时看"},{"id":"lesson-29-section-4","label":"核验本身也要进入评价"},{"id":"lesson-29-section-5","label":"质量结论应怎样写"}],"exportMd":"# 第29章｜怎样判断AI工作合格，而不只判断回答好看\n\n设备服务教学案例里的两份工单总结都流畅、格式完整。一份准确记录“调整并重启，未换件”，另一份写成“更换部件后恢复”。若只让使用者评价“是否专业、是否清晰”，第二份也可能得到好印象。\n\n评价必须回到任务：这份材料要支持什么工作，哪些差别会改变后续判断。\n\n**质量标准应匹配采用条件与任务阶段。** 能读、能采用、能执行、能产生结果，需要不同证据。\n\n## 从一项具体任务建立标准\n\n若任务是整理派工前资料，合格应涉及设备身份、客户描述、已知历史、关键缺项与原材料关联。它不需要在事实不足时给出确定故障原因。\n\n若任务是形成正式处置记录，实际动作与结果准确就很重要。未换件却写成换件，是事实错误；没有长期观察却写成彻底解决，是结论超出证据。两者都不是修辞偏好。\n\n若任务是开放构思，可以允许未成熟方案。此时要求每项想法都达到正式交付标准，反而会提前压缩探索。阶段与用途决定要求。\n\n| 阶段 | 需要判断什么 | 不能用什么替代 |\n|---|---|---|\n| 整理事实 | 是否准确、完整且能追溯 | 语言流畅 |\n| 产生候选 | 是否相关、有依据、有用 | 候选数量 |\n| 比较选择 | 是否识别关键差别 | 最终方案看起来不错 |\n| 实际执行 | 对象、动作与状态是否正确 | AI说已完成 |\n| 客户采用 | 是否帮助真实工作 | 内部满意度 |\n\n一个项目可以逐步覆盖这些阶段，但不能只测前一段就宣布后一段成立。\n\n## 让材料有机会暴露重要错误\n\n只用团队熟悉的标准样例，会漏掉现实中的资料缺项、版本冲突与异常。可以从真实任务中选择有代表性的材料，保留一部分不参与调试，避免只对见过的题有效。\n\n在教学设备案例里，至少要看到常规查询、实际动作与草稿不符、不同版本的相似报修，以及提交后无回显等情形。每类材料都对应一种可能改变行动的差别。\n\n不需要为了数量堆积极端题。选择依据是业务重要性与当前未知，而不是让测试看起来复杂。\n\n## 把阶段表现与最终结果同时看\n\n宝洁创新实验提醒我们，候选生成、从候选中选择与最终方案质量可以不同方向变化。最终改善仍有价值，却未必说明选择环节已经成熟。[研究原文](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n因此，企业既应看最终合格交付，也应定位错误发生在哪一段。若材料整理正确、执行对象错误，升级生成能力可能无助；若候选很好但筛选负担巨大，问题更接近工作配置。\n\n## 核验本身也要进入评价\n\n一个方案在专家重做全部工作后达到高质量，与直接形成可靠材料不同。应记录核验和返工负担，防止把人员补救当作模型独立能力。\n\n人员评价也会受印象影响。METR开发研究对照了主观感受与实际任务耗时，说明“觉得更快”不能独自承担效果判断。它针对特定时期与任务，不能用来断言所有AI都更慢。[原始研究](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)\n\n自动评分可以帮助处理规模，但其标准和材料仍需核对。若评价只重复模型自己的解释，可能无法发现共同遗漏。重要差别应能回到真实资料和业务要求。\n\n## 质量结论应怎样写\n\n可以说清：在什么任务和材料范围内，按什么要求观察到哪些表现，人员做了多少补充，哪些情况尚不适合扩大采用。\n\n这样的结论比一个总分更容易用于决策。它告诉团队要改事实、方法、工具还是分工，也为下一阶段业务试点提供基础。\n\n任务合格仍不证明企业结果改善。真实业务里，还有选择、采用、资源与同期变化，必须继续比较。\n","exportSingleMd":"# 第29章｜怎样判断AI工作合格，而不只判断回答好看\n\n设备服务教学案例里的两份工单总结都流畅、格式完整。一份准确记录“调整并重启，未换件”，另一份写成“更换部件后恢复”。若只让使用者评价“是否专业、是否清晰”，第二份也可能得到好印象。\n\n评价必须回到任务：这份材料要支持什么工作，哪些差别会改变后续判断。\n\n**质量标准应匹配采用条件与任务阶段。** 能读、能采用、能执行、能产生结果，需要不同证据。\n\n## 从一项具体任务建立标准\n\n若任务是整理派工前资料，合格应涉及设备身份、客户描述、已知历史、关键缺项与原材料关联。它不需要在事实不足时给出确定故障原因。\n\n若任务是形成正式处置记录，实际动作与结果准确就很重要。未换件却写成换件，是事实错误；没有长期观察却写成彻底解决，是结论超出证据。两者都不是修辞偏好。\n\n若任务是开放构思，可以允许未成熟方案。此时要求每项想法都达到正式交付标准，反而会提前压缩探索。阶段与用途决定要求。\n\n| 阶段 | 需要判断什么 | 不能用什么替代 |\n|---|---|---|\n| 整理事实 | 是否准确、完整且能追溯 | 语言流畅 |\n| 产生候选 | 是否相关、有依据、有用 | 候选数量 |\n| 比较选择 | 是否识别关键差别 | 最终方案看起来不错 |\n| 实际执行 | 对象、动作与状态是否正确 | AI说已完成 |\n| 客户采用 | 是否帮助真实工作 | 内部满意度 |\n\n一个项目可以逐步覆盖这些阶段，但不能只测前一段就宣布后一段成立。\n\n## 让材料有机会暴露重要错误\n\n只用团队熟悉的标准样例，会漏掉现实中的资料缺项、版本冲突与异常。可以从真实任务中选择有代表性的材料，保留一部分不参与调试，避免只对见过的题有效。\n\n在教学设备案例里，至少要看到常规查询、实际动作与草稿不符、不同版本的相似报修，以及提交后无回显等情形。每类材料都对应一种可能改变行动的差别。\n\n不需要为了数量堆积极端题。选择依据是业务重要性与当前未知，而不是让测试看起来复杂。\n\n## 把阶段表现与最终结果同时看\n\n宝洁创新实验提醒我们，候选生成、从候选中选择与最终方案质量可以不同方向变化。最终改善仍有价值，却未必说明选择环节已经成熟。[研究原文](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n因此，企业既应看最终合格交付，也应定位错误发生在哪一段。若材料整理正确、执行对象错误，升级生成能力可能无助；若候选很好但筛选负担巨大，问题更接近工作配置。\n\n## 核验本身也要进入评价\n\n一个方案在专家重做全部工作后达到高质量，与直接形成可靠材料不同。应记录核验和返工负担，防止把人员补救当作模型独立能力。\n\n人员评价也会受印象影响。METR开发研究对照了主观感受与实际任务耗时，说明“觉得更快”不能独自承担效果判断。它针对特定时期与任务，不能用来断言所有AI都更慢。[原始研究](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)\n\n自动评分可以帮助处理规模，但其标准和材料仍需核对。若评价只重复模型自己的解释，可能无法发现共同遗漏。重要差别应能回到真实资料和业务要求。\n\n## 质量结论应怎样写\n\n可以说清：在什么任务和材料范围内，按什么要求观察到哪些表现，人员做了多少补充，哪些情况尚不适合扩大采用。\n\n这样的结论比一个总分更容易用于决策。它告诉团队要改事实、方法、工具还是分工，也为下一阶段业务试点提供基础。\n\n任务合格仍不证明企业结果改善。真实业务里，还有选择、采用、资源与同期变化，必须继续比较。\n","text":"# 第29章｜怎样判断AI工作合格，而不只判断回答好看\n\n设备服务教学案例里的两份工单总结都流畅、格式完整。一份准确记录“调整并重启，未换件”，另一份写成“更换部件后恢复”。若只让使用者评价“是否专业、是否清晰”，第二份也可能得到好印象。\n\n评价必须回到任务：这份材料要支持什么工作，哪些差别会改变后续判断。\n\n**质量标准应匹配采用条件与任务阶段。** 能读、能采用、能执行、能产生结果，需要不同证据。\n\n## 从一项具体任务建立标准\n\n若任务是整理派工前资料，合格应涉及设备身份、客户描述、已知历史、关键缺项与原材料关联。它不需要在事实不足时给出确定故障原因。\n\n若任务是形成正式处置记录，实际动作与结果准确就很重要。未换件却写成换件，是事实错误；没有长期观察却写成彻底解决，是结论超出证据。两者都不是修辞偏好。\n\n若任务是开放构思，可以允许未成熟方案。此时要求每项想法都达到正式交付标准，反而会提前压缩探索。阶段与用途决定要求。\n\n| 阶段 | 需要判断什么 | 不能用什么替代 |\n|---|---|---|\n| 整理事实 | 是否准确、完整且能追溯 | 语言流畅 |\n| 产生候选 | 是否相关、有依据、有用 | 候选数量 |\n| 比较选择 | 是否识别关键差别 | 最终方案看起来不错 |\n| 实际执行 | 对象、动作与状态是否正确 | AI说已完成 |\n| 客户采用 | 是否帮助真实工作 | 内部满意度 |\n\n一个项目可以逐步覆盖这些阶段，但不能只测前一段就宣布后一段成立。\n\n## 让材料有机会暴露重要错误\n\n只用团队熟悉的标准样例，会漏掉现实中的资料缺项、版本冲突与异常。可以从真实任务中选择有代表性的材料，保留一部分不参与调试，避免只对见过的题有效。\n\n在教学设备案例里，至少要看到常规查询、实际动作与草稿不符、不同版本的相似报修，以及提交后无回显等情形。每类材料都对应一种可能改变行动的差别。\n\n不需要为了数量堆积极端题。选择依据是业务重要性与当前未知，而不是让测试看起来复杂。\n\n## 把阶段表现与最终结果同时看\n\n宝洁创新实验提醒我们，候选生成、从候选中选择与最终方案质量可以不同方向变化。最终改善仍有价值，却未必说明选择环节已经成熟。研究原文\n\n因此，企业既应看最终合格交付，也应定位错误发生在哪一段。若材料整理正确、执行对象错误，升级生成能力可能无助；若候选很好但筛选负担巨大，问题更接近工作配置。\n\n## 核验本身也要进入评价\n\n一个方案在专家重做全部工作后达到高质量，与直接形成可靠材料不同。应记录核验和返工负担，防止把人员补救当作模型独立能力。\n\n人员评价也会受印象影响。METR开发研究对照了主观感受与实际任务耗时，说明“觉得更快”不能独自承担效果判断。它针对特定时期与任务，不能用来断言所有AI都更慢。原始研究\n\n自动评分可以帮助处理规模，但其标准和材料仍需核对。若评价只重复模型自己的解释，可能无法发现共同遗漏。重要差别应能回到真实资料和业务要求。\n\n## 质量结论应怎样写\n\n可以说清：在什么任务和材料范围内，按什么要求观察到哪些表现，人员做了多少补充，哪些情况尚不适合扩大采用。\n\n这样的结论比一个总分更容易用于决策。它告诉团队要改事实、方法、工具还是分工，也为下一阶段业务试点提供基础。\n\n任务合格仍不证明企业结果改善。真实业务里，还有选择、采用、资源与同期变化，必须继续比较。\n"},{"file":"30-业务效果与因果.md","id":"lesson-30","number":30,"role":"核心课","part":5,"title":"第30章｜结果变好了，怎样知道AI贡献了什么","md":"# 第30章｜结果变好了，怎样知道AI贡献了什么\n\n假设一次试点后，门店销量上升，团队宣布AI有效。但同一时期附近举办活动，店长投入了更多注意力，配送也临时增加。哪一项改变产生了结果？\n\n企业不必等到完美研究才能行动，却需要知道比较能够支持什么。\n\n**业务效果应相对合理替代、在明确条件下判断。** 模型回答更好、试点前后数字变化，都不能单独证明经营改善来自AI。\n\n## 先用一个算例看清作用路径\n\n教学烘焙案例设总产量160，需求事先给定为X店95、Y店60，每个售价12元、生产变动成本4元，未售无残值。商品可在销售前自由分配，没有替代购买、调价或时段差异。\n\n| 方案 | X/Y分配 | 售出 | 剩余 | 收入 | 全部生产变动成本 | 列示贡献 |\n|---|---|---:|---:|---:|---:|---:|\n| 等量分配 | 80/80 | 140 | 20 | 1680 | 640 | 1040 |\n| 候选改配 | 100/60 | 155 | 5 | 1860 | 640 | 1220 |\n\n两方案都生产160个，成本都是640元；改配多售15个，收入多180元，列示贡献因此多180元。\n\n这个计算说明分配方法可以怎样影响结果。它没有证明AI知道真实需求，也不是两个营业日的前后对比；更没有计入系统、人工和配送差异。因此不能把180元写成已验证AI净收益。\n\n## 真实业务中的未知在哪里\n\n现实记录看到的是销量，提前售罄后的潜在需求未知。需求也会随日期、活动和客户选择变化。不同门店的人员、位置和商品组合未必可比。\n\n所以需要明确结果口径与观察范围。关心客户等待，就不能只测模型回复；关心全网贡献，就不能只看一店销量；关心重复报修，就要跟踪关闭之后。\n\n还要保留当时可得信息。事后才出现的交通变化，不能算作系统事前应知的事实；原本已有却没使用的资料，则是另一类问题。\n\n## 比较对象决定AI增量的含义\n\n至少考虑合理的人工改进、成熟程序或现成软件。若只与原先混乱流程相比，可能把整理业务本身的收益全部归给AI。\n\n教学连锁可比较三种安排：改进人工记录与SOP；使用既有预测和分配方法；增加AI组织非标准说明、衔接工具与调用经验。AI增量需要落在第三种比前两种多做或少花的地方。\n\nZara的历史分配案例说明，现场规则与工程结合在生成式AI之前已经能产生价值。它帮助我们保留合理替代，而不是否认新能力。[原始案例](https://web.mit.edu/people/jgallien/ZaraOR2010.pdf)\n\n## 能怎样设计更有依据的比较\n\n如果任务可分、条件允许且不会明显相互影响，可以安排对照。若随机分配可行，它有助于减少选择差异；不能随机时，也应尽量记录任务、人员与时间条件，说明剩余解释。\n\n软件客服研究主要利用分批上线进行估计，METR开发研究则在任务中随机允许或禁止特定工具。两者是不同设计，不能把所有研究统称为随机试验。[客服研究](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)、[开发研究](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)\n\n教学连锁还有共享库存干扰：X多配，可能挤占Y或其他店。不能把X增加的销量全部当成净增长，应同时看全网和实际资源变化。\n\n## 有限证据怎样支持有限行动\n\n小样本可以帮助发现流程断点、错误类型和需要补的条件，却不足以给出稳定通用提升率。长期结果未出现前，可以先观察必要中间条件，同时保留后续跟踪。\n\n试点结论应说明观察、可能解释和下一项行动的关系：哪些证据足以支持扩大，哪些仍需检验，什么变化会使判断反转。这样既避免过度承诺，也避免因无法完美识别就停在原地。\n\n当期业务结果之外，还需要另一类证据：企业是否真正形成了下一次能用的能力。\n","html":"\u003ch1>第30章｜结果变好了，怎样知道AI贡献了什么\u003c/h1>\n\u003cp>假设一次试点后，门店销量上升，团队宣布AI有效。但同一时期附近举办活动，店长投入了更多注意力，配送也临时增加。哪一项改变产生了结果？\u003c/p>\n\u003cp>企业不必等到完美研究才能行动，却需要知道比较能够支持什么。\u003c/p>\n\u003cp>\u003cstrong>业务效果应相对合理替代、在明确条件下判断。\u003c/strong> 模型回答更好、试点前后数字变化，都不能单独证明经营改善来自AI。\u003c/p>\n\u003ch2 id=\"lesson-30-section-1\">先用一个算例看清作用路径\u003c/h2>\n\u003cp>教学烘焙案例设总产量160，需求事先给定为X店95、Y店60，每个售价12元、生产变动成本4元，未售无残值。商品可在销售前自由分配，没有替代购买、调价或时段差异。\u003c/p>\n\u003cdiv class=\"table-scroll table-wide\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方案\u003c/th>\n\u003cth>X/Y分配\u003c/th>\n\u003cth align=\"right\">售出\u003c/th>\n\u003cth align=\"right\">剩余\u003c/th>\n\u003cth align=\"right\">收入\u003c/th>\n\u003cth align=\"right\">全部生产变动成本\u003c/th>\n\u003cth align=\"right\">列示贡献\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>等量分配\u003c/td>\n\u003ctd>80/80\u003c/td>\n\u003ctd align=\"right\">140\u003c/td>\n\u003ctd align=\"right\">20\u003c/td>\n\u003ctd align=\"right\">1680\u003c/td>\n\u003ctd align=\"right\">640\u003c/td>\n\u003ctd align=\"right\">1040\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>候选改配\u003c/td>\n\u003ctd>100/60\u003c/td>\n\u003ctd align=\"right\">155\u003c/td>\n\u003ctd align=\"right\">5\u003c/td>\n\u003ctd align=\"right\">1860\u003c/td>\n\u003ctd align=\"right\">640\u003c/td>\n\u003ctd align=\"right\">1220\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"table-hint\">表格可左右滑动查看\u003c/p>\n\u003cp>两方案都生产160个，成本都是640元；改配多售15个，收入多180元，列示贡献因此多180元。\u003c/p>\n\u003cp>这个计算说明分配方法可以怎样影响结果。它没有证明AI知道真实需求，也不是两个营业日的前后对比；更没有计入系统、人工和配送差异。因此不能把180元写成已验证AI净收益。\u003c/p>\n\u003ch2 id=\"lesson-30-section-2\">真实业务中的未知在哪里\u003c/h2>\n\u003cp>现实记录看到的是销量，提前售罄后的潜在需求未知。需求也会随日期、活动和客户选择变化。不同门店的人员、位置和商品组合未必可比。\u003c/p>\n\u003cp>所以需要明确结果口径与观察范围。关心客户等待，就不能只测模型回复；关心全网贡献，就不能只看一店销量；关心重复报修，就要跟踪关闭之后。\u003c/p>\n\u003cp>还要保留当时可得信息。事后才出现的交通变化，不能算作系统事前应知的事实；原本已有却没使用的资料，则是另一类问题。\u003c/p>\n\u003ch2 id=\"lesson-30-section-3\">比较对象决定AI增量的含义\u003c/h2>\n\u003cp>至少考虑合理的人工改进、成熟程序或现成软件。若只与原先混乱流程相比，可能把整理业务本身的收益全部归给AI。\u003c/p>\n\u003cp>教学连锁可比较三种安排：改进人工记录与SOP；使用既有预测和分配方法；增加AI组织非标准说明、衔接工具与调用经验。AI增量需要落在第三种比前两种多做或少花的地方。\u003c/p>\n\u003cp>Zara的历史分配案例说明，现场规则与工程结合在生成式AI之前已经能产生价值。它帮助我们保留合理替代，而不是否认新能力。\u003ca href=\"https://web.mit.edu/people/jgallien/ZaraOR2010.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始案例\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-30-section-4\">能怎样设计更有依据的比较\u003c/h2>\n\u003cp>如果任务可分、条件允许且不会明显相互影响，可以安排对照。若随机分配可行，它有助于减少选择差异；不能随机时，也应尽量记录任务、人员与时间条件，说明剩余解释。\u003c/p>\n\u003cp>软件客服研究主要利用分批上线进行估计，METR开发研究则在任务中随机允许或禁止特定工具。两者是不同设计，不能把所有研究统称为随机试验。\u003ca href=\"https://danielle.li/assets/docs/GenerativeAIatWork.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">客服研究\u003c/a>、\u003ca href=\"https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">开发研究\u003c/a>\u003c/p>\n\u003cp>教学连锁还有共享库存干扰：X多配，可能挤占Y或其他店。不能把X增加的销量全部当成净增长，应同时看全网和实际资源变化。\u003c/p>\n\u003ch2 id=\"lesson-30-section-5\">有限证据怎样支持有限行动\u003c/h2>\n\u003cp>小样本可以帮助发现流程断点、错误类型和需要补的条件，却不足以给出稳定通用提升率。长期结果未出现前，可以先观察必要中间条件，同时保留后续跟踪。\u003c/p>\n\u003cp>试点结论应说明观察、可能解释和下一项行动的关系：哪些证据足以支持扩大，哪些仍需检验，什么变化会使判断反转。这样既避免过度承诺，也避免因无法完美识别就停在原地。\u003c/p>\n\u003cp>当期业务结果之外，还需要另一类证据：企业是否真正形成了下一次能用的能力。\u003c/p>\n","headings":[{"id":"lesson-30-section-1","label":"先用一个算例看清作用路径"},{"id":"lesson-30-section-2","label":"真实业务中的未知在哪里"},{"id":"lesson-30-section-3","label":"比较对象决定AI增量的含义"},{"id":"lesson-30-section-4","label":"能怎样设计更有依据的比较"},{"id":"lesson-30-section-5","label":"有限证据怎样支持有限行动"}],"exportMd":"# 第30章｜结果变好了，怎样知道AI贡献了什么\n\n假设一次试点后，门店销量上升，团队宣布AI有效。但同一时期附近举办活动，店长投入了更多注意力，配送也临时增加。哪一项改变产生了结果？\n\n企业不必等到完美研究才能行动，却需要知道比较能够支持什么。\n\n**业务效果应相对合理替代、在明确条件下判断。** 模型回答更好、试点前后数字变化，都不能单独证明经营改善来自AI。\n\n## 先用一个算例看清作用路径\n\n教学烘焙案例设总产量160，需求事先给定为X店95、Y店60，每个售价12元、生产变动成本4元，未售无残值。商品可在销售前自由分配，没有替代购买、调价或时段差异。\n\n| 方案 | X/Y分配 | 售出 | 剩余 | 收入 | 全部生产变动成本 | 列示贡献 |\n|---|---|---:|---:|---:|---:|---:|\n| 等量分配 | 80/80 | 140 | 20 | 1680 | 640 | 1040 |\n| 候选改配 | 100/60 | 155 | 5 | 1860 | 640 | 1220 |\n\n两方案都生产160个，成本都是640元；改配多售15个，收入多180元，列示贡献因此多180元。\n\n这个计算说明分配方法可以怎样影响结果。它没有证明AI知道真实需求，也不是两个营业日的前后对比；更没有计入系统、人工和配送差异。因此不能把180元写成已验证AI净收益。\n\n## 真实业务中的未知在哪里\n\n现实记录看到的是销量，提前售罄后的潜在需求未知。需求也会随日期、活动和客户选择变化。不同门店的人员、位置和商品组合未必可比。\n\n所以需要明确结果口径与观察范围。关心客户等待，就不能只测模型回复；关心全网贡献，就不能只看一店销量；关心重复报修，就要跟踪关闭之后。\n\n还要保留当时可得信息。事后才出现的交通变化，不能算作系统事前应知的事实；原本已有却没使用的资料，则是另一类问题。\n\n## 比较对象决定AI增量的含义\n\n至少考虑合理的人工改进、成熟程序或现成软件。若只与原先混乱流程相比，可能把整理业务本身的收益全部归给AI。\n\n教学连锁可比较三种安排：改进人工记录与SOP；使用既有预测和分配方法；增加AI组织非标准说明、衔接工具与调用经验。AI增量需要落在第三种比前两种多做或少花的地方。\n\nZara的历史分配案例说明，现场规则与工程结合在生成式AI之前已经能产生价值。它帮助我们保留合理替代，而不是否认新能力。[原始案例](https://web.mit.edu/people/jgallien/ZaraOR2010.pdf)\n\n## 能怎样设计更有依据的比较\n\n如果任务可分、条件允许且不会明显相互影响，可以安排对照。若随机分配可行，它有助于减少选择差异；不能随机时，也应尽量记录任务、人员与时间条件，说明剩余解释。\n\n软件客服研究主要利用分批上线进行估计，METR开发研究则在任务中随机允许或禁止特定工具。两者是不同设计，不能把所有研究统称为随机试验。[客服研究](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)、[开发研究](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)\n\n教学连锁还有共享库存干扰：X多配，可能挤占Y或其他店。不能把X增加的销量全部当成净增长，应同时看全网和实际资源变化。\n\n## 有限证据怎样支持有限行动\n\n小样本可以帮助发现流程断点、错误类型和需要补的条件，却不足以给出稳定通用提升率。长期结果未出现前，可以先观察必要中间条件，同时保留后续跟踪。\n\n试点结论应说明观察、可能解释和下一项行动的关系：哪些证据足以支持扩大，哪些仍需检验，什么变化会使判断反转。这样既避免过度承诺，也避免因无法完美识别就停在原地。\n\n当期业务结果之外，还需要另一类证据：企业是否真正形成了下一次能用的能力。\n","exportSingleMd":"# 第30章｜结果变好了，怎样知道AI贡献了什么\n\n假设一次试点后，门店销量上升，团队宣布AI有效。但同一时期附近举办活动，店长投入了更多注意力，配送也临时增加。哪一项改变产生了结果？\n\n企业不必等到完美研究才能行动，却需要知道比较能够支持什么。\n\n**业务效果应相对合理替代、在明确条件下判断。** 模型回答更好、试点前后数字变化，都不能单独证明经营改善来自AI。\n\n## 先用一个算例看清作用路径\n\n教学烘焙案例设总产量160，需求事先给定为X店95、Y店60，每个售价12元、生产变动成本4元，未售无残值。商品可在销售前自由分配，没有替代购买、调价或时段差异。\n\n| 方案 | X/Y分配 | 售出 | 剩余 | 收入 | 全部生产变动成本 | 列示贡献 |\n|---|---|---:|---:|---:|---:|---:|\n| 等量分配 | 80/80 | 140 | 20 | 1680 | 640 | 1040 |\n| 候选改配 | 100/60 | 155 | 5 | 1860 | 640 | 1220 |\n\n两方案都生产160个，成本都是640元；改配多售15个，收入多180元，列示贡献因此多180元。\n\n这个计算说明分配方法可以怎样影响结果。它没有证明AI知道真实需求，也不是两个营业日的前后对比；更没有计入系统、人工和配送差异。因此不能把180元写成已验证AI净收益。\n\n## 真实业务中的未知在哪里\n\n现实记录看到的是销量，提前售罄后的潜在需求未知。需求也会随日期、活动和客户选择变化。不同门店的人员、位置和商品组合未必可比。\n\n所以需要明确结果口径与观察范围。关心客户等待，就不能只测模型回复；关心全网贡献，就不能只看一店销量；关心重复报修，就要跟踪关闭之后。\n\n还要保留当时可得信息。事后才出现的交通变化，不能算作系统事前应知的事实；原本已有却没使用的资料，则是另一类问题。\n\n## 比较对象决定AI增量的含义\n\n至少考虑合理的人工改进、成熟程序或现成软件。若只与原先混乱流程相比，可能把整理业务本身的收益全部归给AI。\n\n教学连锁可比较三种安排：改进人工记录与SOP；使用既有预测和分配方法；增加AI组织非标准说明、衔接工具与调用经验。AI增量需要落在第三种比前两种多做或少花的地方。\n\nZara的历史分配案例说明，现场规则与工程结合在生成式AI之前已经能产生价值。它帮助我们保留合理替代，而不是否认新能力。[原始案例](https://web.mit.edu/people/jgallien/ZaraOR2010.pdf)\n\n## 能怎样设计更有依据的比较\n\n如果任务可分、条件允许且不会明显相互影响，可以安排对照。若随机分配可行，它有助于减少选择差异；不能随机时，也应尽量记录任务、人员与时间条件，说明剩余解释。\n\n软件客服研究主要利用分批上线进行估计，METR开发研究则在任务中随机允许或禁止特定工具。两者是不同设计，不能把所有研究统称为随机试验。[客服研究](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)、[开发研究](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)\n\n教学连锁还有共享库存干扰：X多配，可能挤占Y或其他店。不能把X增加的销量全部当成净增长，应同时看全网和实际资源变化。\n\n## 有限证据怎样支持有限行动\n\n小样本可以帮助发现流程断点、错误类型和需要补的条件，却不足以给出稳定通用提升率。长期结果未出现前，可以先观察必要中间条件，同时保留后续跟踪。\n\n试点结论应说明观察、可能解释和下一项行动的关系：哪些证据足以支持扩大，哪些仍需检验，什么变化会使判断反转。这样既避免过度承诺，也避免因无法完美识别就停在原地。\n\n当期业务结果之外，还需要另一类证据：企业是否真正形成了下一次能用的能力。\n","text":"# 第30章｜结果变好了，怎样知道AI贡献了什么\n\n假设一次试点后，门店销量上升，团队宣布AI有效。但同一时期附近举办活动，店长投入了更多注意力，配送也临时增加。哪一项改变产生了结果？\n\n企业不必等到完美研究才能行动，却需要知道比较能够支持什么。\n\n**业务效果应相对合理替代、在明确条件下判断。** 模型回答更好、试点前后数字变化，都不能单独证明经营改善来自AI。\n\n## 先用一个算例看清作用路径\n\n教学烘焙案例设总产量160，需求事先给定为X店95、Y店60，每个售价12元、生产变动成本4元，未售无残值。商品可在销售前自由分配，没有替代购买、调价或时段差异。\n\n| 方案 | X/Y分配 | 售出 | 剩余 | 收入 | 全部生产变动成本 | 列示贡献 |\n|---|---|---:|---:|---:|---:|---:|\n| 等量分配 | 80/80 | 140 | 20 | 1680 | 640 | 1040 |\n| 候选改配 | 100/60 | 155 | 5 | 1860 | 640 | 1220 |\n\n两方案都生产160个，成本都是640元；改配多售15个，收入多180元，列示贡献因此多180元。\n\n这个计算说明分配方法可以怎样影响结果。它没有证明AI知道真实需求，也不是两个营业日的前后对比；更没有计入系统、人工和配送差异。因此不能把180元写成已验证AI净收益。\n\n## 真实业务中的未知在哪里\n\n现实记录看到的是销量，提前售罄后的潜在需求未知。需求也会随日期、活动和客户选择变化。不同门店的人员、位置和商品组合未必可比。\n\n所以需要明确结果口径与观察范围。关心客户等待，就不能只测模型回复；关心全网贡献，就不能只看一店销量；关心重复报修，就要跟踪关闭之后。\n\n还要保留当时可得信息。事后才出现的交通变化，不能算作系统事前应知的事实；原本已有却没使用的资料，则是另一类问题。\n\n## 比较对象决定AI增量的含义\n\n至少考虑合理的人工改进、成熟程序或现成软件。若只与原先混乱流程相比，可能把整理业务本身的收益全部归给AI。\n\n教学连锁可比较三种安排：改进人工记录与SOP；使用既有预测和分配方法；增加AI组织非标准说明、衔接工具与调用经验。AI增量需要落在第三种比前两种多做或少花的地方。\n\nZara的历史分配案例说明，现场规则与工程结合在生成式AI之前已经能产生价值。它帮助我们保留合理替代，而不是否认新能力。原始案例\n\n## 能怎样设计更有依据的比较\n\n如果任务可分、条件允许且不会明显相互影响，可以安排对照。若随机分配可行，它有助于减少选择差异；不能随机时，也应尽量记录任务、人员与时间条件，说明剩余解释。\n\n软件客服研究主要利用分批上线进行估计，METR开发研究则在任务中随机允许或禁止特定工具。两者是不同设计，不能把所有研究统称为随机试验。客服研究、开发研究\n\n教学连锁还有共享库存干扰：X多配，可能挤占Y或其他店。不能把X增加的销量全部当成净增长，应同时看全网和实际资源变化。\n\n## 有限证据怎样支持有限行动\n\n小样本可以帮助发现流程断点、错误类型和需要补的条件，却不足以给出稳定通用提升率。长期结果未出现前，可以先观察必要中间条件，同时保留后续跟踪。\n\n试点结论应说明观察、可能解释和下一项行动的关系：哪些证据足以支持扩大，哪些仍需检验，什么变化会使判断反转。这样既避免过度承诺，也避免因无法完美识别就停在原地。\n\n当期业务结果之外，还需要另一类证据：企业是否真正形成了下一次能用的能力。\n"},{"file":"31-组织学习的验证.md","id":"lesson-31","number":31,"role":"核心课","part":5,"title":"第31章｜怎样证明组织学会了，而不只是资料存好了","md":"# 第31章｜怎样证明组织学会了，而不只是资料存好了\n\n在接任教学情境中，原店长用AI助手演示备货，解释很清楚，结果也合理。接任店长独立处理新情况，却直接照搬旧数量。企业保存了方法，但它仍需要原作者在场补充。\n\n学习的证据必须超出原题与原参与者。\n\n**有效积累应在后续任务、人员接任和新情境中体现作用，尤其表现为知道何时不能照搬。**\n\n## 为什么重复原题不够\n\n原参与者记得未写出的背景，也知道系统容易在哪出错。他的演示可能把个人经验与系统能力混在一起。\n\n相同题目又容易被调试过程记住。系统反复给出原答案，只说明它对这份材料表现稳定，不能说明新的任务也能理解条件。\n\n可以保留未参与整理的任务，让合适但未参与原过程的人员使用；再改变关键条件，检查方法是否有条件地发挥作用。基础专业能力仍需考虑，不能把新人的所有错误都归于资料。\n\n## 接任检验，看什么更有区分力\n\n教学设备案例让接任技术员处理一张版本不同的新工单。可以观察：他能否找到相关材料，分清原始事实与候选解释，注意版本差异，取得需要的工具和支持，并把新结果接回。\n\n若他看到“调整后恢复”就直接套用，说明条件没有被理解；若他能指出尚缺负载或完整动作，并据此选择进一步信息，则是更强的可接续证据。\n\n这并不要求他立即给出正确原因。有时最重要的学习表现，是识别当前知识不足，避免把旧结论当确定答案。\n\n## 迁移检验，分清共同部分与本地认识\n\n教学连锁进入第九店，可以沿用商品与日期身份、事件记录、建议与正式分配、结果反馈。新店的客群、时段和配送仍需学习。\n\n因此不应以“是否复制X店100件”验收。应看共同结构是否减少重复准备，新店能否形成自己的需求认识，条件变化后是否调整方法。\n\n| 检验 | 更接近学习的表现 | 仍需谨慎的解释 |\n|---|---|---|\n| 原任务再使用 | 依据可追溯、条件被理解 | 可能只是原作者记得背景 |\n| 接任人员 | 能独立识别差别与缺项 | 专业基础和支持条件可能不同 |\n| 留出任务 | 对未调试材料仍有作用 | 任务样本可能较窄 |\n| 新情境迁移 | 复用共性并重学差异 | 适配与维护成本尚需观察 |\n\n不同检验互相补充，不必用一次结果宣布企业永久学会。\n\n## 还要比较新增负担\n\n资料完整却难找，接任者需要很久阅读；方法可用却依赖原专家不断解释；新场景复用需要大量修订。这些都应进入学习成本。\n\n可以与原工作或合理替代比较，观察减少了哪些重复准备，新增了哪些负担，以及结果是否保持。这样“资产沉淀”才有实际内容。\n\n吸收能力研究说明相关知识会影响识别与应用外部知识；客服实地研究提供经验通过AI传播与学习的局部证据。它们支持设计这些检验，但没有替企业给出统一知识资产分数。[吸收能力](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)、[客服研究](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)\n\n## 让检验结果改变建设\n\n如果断点在找不到，改入口和关联；若在不理解条件，改案例解释与带教；若在无法执行，改工具和职责；若在新情境失效，回到适用范围与新认识。\n\n企业不必要求所有能力都被完全独立接棒，但应明确关键依赖与可接受范围。学习验证的意义，是帮助选择下一项建设，而不是给知识库盖一个总通过章。\n\n检验发现的反例，还必须进入日常工作。只有系统和人员真的改变行为，纠错才完成。\n","html":"\u003ch1>第31章｜怎样证明组织学会了，而不只是资料存好了\u003c/h1>\n\u003cp>在接任教学情境中，原店长用AI助手演示备货，解释很清楚，结果也合理。接任店长独立处理新情况，却直接照搬旧数量。企业保存了方法，但它仍需要原作者在场补充。\u003c/p>\n\u003cp>学习的证据必须超出原题与原参与者。\u003c/p>\n\u003cp>\u003cstrong>有效积累应在后续任务、人员接任和新情境中体现作用，尤其表现为知道何时不能照搬。\u003c/strong>\u003c/p>\n\u003ch2 id=\"lesson-31-section-1\">为什么重复原题不够\u003c/h2>\n\u003cp>原参与者记得未写出的背景，也知道系统容易在哪出错。他的演示可能把个人经验与系统能力混在一起。\u003c/p>\n\u003cp>相同题目又容易被调试过程记住。系统反复给出原答案，只说明它对这份材料表现稳定，不能说明新的任务也能理解条件。\u003c/p>\n\u003cp>可以保留未参与整理的任务，让合适但未参与原过程的人员使用；再改变关键条件，检查方法是否有条件地发挥作用。基础专业能力仍需考虑，不能把新人的所有错误都归于资料。\u003c/p>\n\u003ch2 id=\"lesson-31-section-2\">接任检验，看什么更有区分力\u003c/h2>\n\u003cp>教学设备案例让接任技术员处理一张版本不同的新工单。可以观察：他能否找到相关材料，分清原始事实与候选解释，注意版本差异，取得需要的工具和支持，并把新结果接回。\u003c/p>\n\u003cp>若他看到“调整后恢复”就直接套用，说明条件没有被理解；若他能指出尚缺负载或完整动作，并据此选择进一步信息，则是更强的可接续证据。\u003c/p>\n\u003cp>这并不要求他立即给出正确原因。有时最重要的学习表现，是识别当前知识不足，避免把旧结论当确定答案。\u003c/p>\n\u003ch2 id=\"lesson-31-section-3\">迁移检验，分清共同部分与本地认识\u003c/h2>\n\u003cp>教学连锁进入第九店，可以沿用商品与日期身份、事件记录、建议与正式分配、结果反馈。新店的客群、时段和配送仍需学习。\u003c/p>\n\u003cp>因此不应以“是否复制X店100件”验收。应看共同结构是否减少重复准备，新店能否形成自己的需求认识，条件变化后是否调整方法。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>检验\u003c/th>\n\u003cth>更接近学习的表现\u003c/th>\n\u003cth>仍需谨慎的解释\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>原任务再使用\u003c/td>\n\u003ctd>依据可追溯、条件被理解\u003c/td>\n\u003ctd>可能只是原作者记得背景\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接任人员\u003c/td>\n\u003ctd>能独立识别差别与缺项\u003c/td>\n\u003ctd>专业基础和支持条件可能不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>留出任务\u003c/td>\n\u003ctd>对未调试材料仍有作用\u003c/td>\n\u003ctd>任务样本可能较窄\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新情境迁移\u003c/td>\n\u003ctd>复用共性并重学差异\u003c/td>\n\u003ctd>适配与维护成本尚需观察\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>不同检验互相补充，不必用一次结果宣布企业永久学会。\u003c/p>\n\u003ch2 id=\"lesson-31-section-4\">还要比较新增负担\u003c/h2>\n\u003cp>资料完整却难找，接任者需要很久阅读；方法可用却依赖原专家不断解释；新场景复用需要大量修订。这些都应进入学习成本。\u003c/p>\n\u003cp>可以与原工作或合理替代比较，观察减少了哪些重复准备，新增了哪些负担，以及结果是否保持。这样“资产沉淀”才有实际内容。\u003c/p>\n\u003cp>吸收能力研究说明相关知识会影响识别与应用外部知识；客服实地研究提供经验通过AI传播与学习的局部证据。它们支持设计这些检验，但没有替企业给出统一知识资产分数。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">吸收能力\u003c/a>、\u003ca href=\"https://danielle.li/assets/docs/GenerativeAIatWork.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">客服研究\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-31-section-5\">让检验结果改变建设\u003c/h2>\n\u003cp>如果断点在找不到，改入口和关联；若在不理解条件，改案例解释与带教；若在无法执行，改工具和职责；若在新情境失效，回到适用范围与新认识。\u003c/p>\n\u003cp>企业不必要求所有能力都被完全独立接棒，但应明确关键依赖与可接受范围。学习验证的意义，是帮助选择下一项建设，而不是给知识库盖一个总通过章。\u003c/p>\n\u003cp>检验发现的反例，还必须进入日常工作。只有系统和人员真的改变行为，纠错才完成。\u003c/p>\n","headings":[{"id":"lesson-31-section-1","label":"为什么重复原题不够"},{"id":"lesson-31-section-2","label":"接任检验，看什么更有区分力"},{"id":"lesson-31-section-3","label":"迁移检验，分清共同部分与本地认识"},{"id":"lesson-31-section-4","label":"还要比较新增负担"},{"id":"lesson-31-section-5","label":"让检验结果改变建设"}],"exportMd":"# 第31章｜怎样证明组织学会了，而不只是资料存好了\n\n在接任教学情境中，原店长用AI助手演示备货，解释很清楚，结果也合理。接任店长独立处理新情况，却直接照搬旧数量。企业保存了方法，但它仍需要原作者在场补充。\n\n学习的证据必须超出原题与原参与者。\n\n**有效积累应在后续任务、人员接任和新情境中体现作用，尤其表现为知道何时不能照搬。**\n\n## 为什么重复原题不够\n\n原参与者记得未写出的背景，也知道系统容易在哪出错。他的演示可能把个人经验与系统能力混在一起。\n\n相同题目又容易被调试过程记住。系统反复给出原答案，只说明它对这份材料表现稳定，不能说明新的任务也能理解条件。\n\n可以保留未参与整理的任务，让合适但未参与原过程的人员使用；再改变关键条件，检查方法是否有条件地发挥作用。基础专业能力仍需考虑，不能把新人的所有错误都归于资料。\n\n## 接任检验，看什么更有区分力\n\n教学设备案例让接任技术员处理一张版本不同的新工单。可以观察：他能否找到相关材料，分清原始事实与候选解释，注意版本差异，取得需要的工具和支持，并把新结果接回。\n\n若他看到“调整后恢复”就直接套用，说明条件没有被理解；若他能指出尚缺负载或完整动作，并据此选择进一步信息，则是更强的可接续证据。\n\n这并不要求他立即给出正确原因。有时最重要的学习表现，是识别当前知识不足，避免把旧结论当确定答案。\n\n## 迁移检验，分清共同部分与本地认识\n\n教学连锁进入第九店，可以沿用商品与日期身份、事件记录、建议与正式分配、结果反馈。新店的客群、时段和配送仍需学习。\n\n因此不应以“是否复制X店100件”验收。应看共同结构是否减少重复准备，新店能否形成自己的需求认识，条件变化后是否调整方法。\n\n| 检验 | 更接近学习的表现 | 仍需谨慎的解释 |\n|---|---|---|\n| 原任务再使用 | 依据可追溯、条件被理解 | 可能只是原作者记得背景 |\n| 接任人员 | 能独立识别差别与缺项 | 专业基础和支持条件可能不同 |\n| 留出任务 | 对未调试材料仍有作用 | 任务样本可能较窄 |\n| 新情境迁移 | 复用共性并重学差异 | 适配与维护成本尚需观察 |\n\n不同检验互相补充，不必用一次结果宣布企业永久学会。\n\n## 还要比较新增负担\n\n资料完整却难找，接任者需要很久阅读；方法可用却依赖原专家不断解释；新场景复用需要大量修订。这些都应进入学习成本。\n\n可以与原工作或合理替代比较，观察减少了哪些重复准备，新增了哪些负担，以及结果是否保持。这样“资产沉淀”才有实际内容。\n\n吸收能力研究说明相关知识会影响识别与应用外部知识；客服实地研究提供经验通过AI传播与学习的局部证据。它们支持设计这些检验，但没有替企业给出统一知识资产分数。[吸收能力](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)、[客服研究](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)\n\n## 让检验结果改变建设\n\n如果断点在找不到，改入口和关联；若在不理解条件，改案例解释与带教；若在无法执行，改工具和职责；若在新情境失效，回到适用范围与新认识。\n\n企业不必要求所有能力都被完全独立接棒，但应明确关键依赖与可接受范围。学习验证的意义，是帮助选择下一项建设，而不是给知识库盖一个总通过章。\n\n检验发现的反例，还必须进入日常工作。只有系统和人员真的改变行为，纠错才完成。\n","exportSingleMd":"# 第31章｜怎样证明组织学会了，而不只是资料存好了\n\n在接任教学情境中，原店长用AI助手演示备货，解释很清楚，结果也合理。接任店长独立处理新情况，却直接照搬旧数量。企业保存了方法，但它仍需要原作者在场补充。\n\n学习的证据必须超出原题与原参与者。\n\n**有效积累应在后续任务、人员接任和新情境中体现作用，尤其表现为知道何时不能照搬。**\n\n## 为什么重复原题不够\n\n原参与者记得未写出的背景，也知道系统容易在哪出错。他的演示可能把个人经验与系统能力混在一起。\n\n相同题目又容易被调试过程记住。系统反复给出原答案，只说明它对这份材料表现稳定，不能说明新的任务也能理解条件。\n\n可以保留未参与整理的任务，让合适但未参与原过程的人员使用；再改变关键条件，检查方法是否有条件地发挥作用。基础专业能力仍需考虑，不能把新人的所有错误都归于资料。\n\n## 接任检验，看什么更有区分力\n\n教学设备案例让接任技术员处理一张版本不同的新工单。可以观察：他能否找到相关材料，分清原始事实与候选解释，注意版本差异，取得需要的工具和支持，并把新结果接回。\n\n若他看到“调整后恢复”就直接套用，说明条件没有被理解；若他能指出尚缺负载或完整动作，并据此选择进一步信息，则是更强的可接续证据。\n\n这并不要求他立即给出正确原因。有时最重要的学习表现，是识别当前知识不足，避免把旧结论当确定答案。\n\n## 迁移检验，分清共同部分与本地认识\n\n教学连锁进入第九店，可以沿用商品与日期身份、事件记录、建议与正式分配、结果反馈。新店的客群、时段和配送仍需学习。\n\n因此不应以“是否复制X店100件”验收。应看共同结构是否减少重复准备，新店能否形成自己的需求认识，条件变化后是否调整方法。\n\n| 检验 | 更接近学习的表现 | 仍需谨慎的解释 |\n|---|---|---|\n| 原任务再使用 | 依据可追溯、条件被理解 | 可能只是原作者记得背景 |\n| 接任人员 | 能独立识别差别与缺项 | 专业基础和支持条件可能不同 |\n| 留出任务 | 对未调试材料仍有作用 | 任务样本可能较窄 |\n| 新情境迁移 | 复用共性并重学差异 | 适配与维护成本尚需观察 |\n\n不同检验互相补充，不必用一次结果宣布企业永久学会。\n\n## 还要比较新增负担\n\n资料完整却难找，接任者需要很久阅读；方法可用却依赖原专家不断解释；新场景复用需要大量修订。这些都应进入学习成本。\n\n可以与原工作或合理替代比较，观察减少了哪些重复准备，新增了哪些负担，以及结果是否保持。这样“资产沉淀”才有实际内容。\n\n吸收能力研究说明相关知识会影响识别与应用外部知识；客服实地研究提供经验通过AI传播与学习的局部证据。它们支持设计这些检验，但没有替企业给出统一知识资产分数。[吸收能力](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)、[客服研究](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)\n\n## 让检验结果改变建设\n\n如果断点在找不到，改入口和关联；若在不理解条件，改案例解释与带教；若在无法执行，改工具和职责；若在新情境失效，回到适用范围与新认识。\n\n企业不必要求所有能力都被完全独立接棒，但应明确关键依赖与可接受范围。学习验证的意义，是帮助选择下一项建设，而不是给知识库盖一个总通过章。\n\n检验发现的反例，还必须进入日常工作。只有系统和人员真的改变行为，纠错才完成。\n","text":"# 第31章｜怎样证明组织学会了，而不只是资料存好了\n\n在接任教学情境中，原店长用AI助手演示备货，解释很清楚，结果也合理。接任店长独立处理新情况，却直接照搬旧数量。企业保存了方法，但它仍需要原作者在场补充。\n\n学习的证据必须超出原题与原参与者。\n\n**有效积累应在后续任务、人员接任和新情境中体现作用，尤其表现为知道何时不能照搬。**\n\n## 为什么重复原题不够\n\n原参与者记得未写出的背景，也知道系统容易在哪出错。他的演示可能把个人经验与系统能力混在一起。\n\n相同题目又容易被调试过程记住。系统反复给出原答案，只说明它对这份材料表现稳定，不能说明新的任务也能理解条件。\n\n可以保留未参与整理的任务，让合适但未参与原过程的人员使用；再改变关键条件，检查方法是否有条件地发挥作用。基础专业能力仍需考虑，不能把新人的所有错误都归于资料。\n\n## 接任检验，看什么更有区分力\n\n教学设备案例让接任技术员处理一张版本不同的新工单。可以观察：他能否找到相关材料，分清原始事实与候选解释，注意版本差异，取得需要的工具和支持，并把新结果接回。\n\n若他看到“调整后恢复”就直接套用，说明条件没有被理解；若他能指出尚缺负载或完整动作，并据此选择进一步信息，则是更强的可接续证据。\n\n这并不要求他立即给出正确原因。有时最重要的学习表现，是识别当前知识不足，避免把旧结论当确定答案。\n\n## 迁移检验，分清共同部分与本地认识\n\n教学连锁进入第九店，可以沿用商品与日期身份、事件记录、建议与正式分配、结果反馈。新店的客群、时段和配送仍需学习。\n\n因此不应以“是否复制X店100件”验收。应看共同结构是否减少重复准备，新店能否形成自己的需求认识，条件变化后是否调整方法。\n\n| 检验 | 更接近学习的表现 | 仍需谨慎的解释 |\n|---|---|---|\n| 原任务再使用 | 依据可追溯、条件被理解 | 可能只是原作者记得背景 |\n| 接任人员 | 能独立识别差别与缺项 | 专业基础和支持条件可能不同 |\n| 留出任务 | 对未调试材料仍有作用 | 任务样本可能较窄 |\n| 新情境迁移 | 复用共性并重学差异 | 适配与维护成本尚需观察 |\n\n不同检验互相补充，不必用一次结果宣布企业永久学会。\n\n## 还要比较新增负担\n\n资料完整却难找，接任者需要很久阅读；方法可用却依赖原专家不断解释；新场景复用需要大量修订。这些都应进入学习成本。\n\n可以与原工作或合理替代比较，观察减少了哪些重复准备，新增了哪些负担，以及结果是否保持。这样“资产沉淀”才有实际内容。\n\n吸收能力研究说明相关知识会影响识别与应用外部知识；客服实地研究提供经验通过AI传播与学习的局部证据。它们支持设计这些检验，但没有替企业给出统一知识资产分数。吸收能力、客服研究\n\n## 让检验结果改变建设\n\n如果断点在找不到，改入口和关联；若在不理解条件，改案例解释与带教；若在无法执行，改工具和职责；若在新情境失效，回到适用范围与新认识。\n\n企业不必要求所有能力都被完全独立接棒，但应明确关键依赖与可接受范围。学习验证的意义，是帮助选择下一项建设，而不是给知识库盖一个总通过章。\n\n检验发现的反例，还必须进入日常工作。只有系统和人员真的改变行为，纠错才完成。\n"},{"file":"32-纠错与遗忘.md","id":"lesson-32","number":32,"role":"核心课","part":5,"title":"第32章｜企业怎样避免越积累越相信旧错误","md":"# 第32章｜企业怎样避免越积累越相信旧错误\n\n设想某店长期配货偏少，常在高峰前卖完。系统记录销量不高，于是下一轮继续少配。低供给制造低销量，低销量又被用来支持低供给。\n\n没有任何一条销售记录造假，企业却可能在不断积累支持错误判断的材料。\n\n**经验更新不仅是增加内容，还包括改变适用范围、修订方法和停止采用。** 反馈质量决定企业是在学习，还是在强化旧偏差。\n\n## 行动会改变未来看见的数据\n\n如果某类客户没有被服务，就很难观察其后续需求；如果工单提前关闭，复发可能变成另一张新单；如果只保存已采用建议，未被采用的理由就消失。\n\nAI进入生产后，这些关系不会自动消除。系统可能以更快速度重复同一种选择，使后续材料更像原判断正确。\n\n机器学习系统研究把模型行动影响未来数据的反馈视为重要维护问题。企业需要检查哪些结果可见，哪些因当前安排而被遮蔽。[原始研究](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n![少配使销量受供给限制，受限销量又支持下一轮少配；加入售罄时点和未满足请求，可以暴露循环中的缺失，而非直接补出真实需求。](assets/32-反馈与偏差.svg)\n\n## 一个成功方法，也可能因环境变化失效\n\n另设独立教学条件：总产量仍为160，X附近交通入口关闭，需求变为X50、Y90。价格12元、生产变动成本4元，未售无残值，其余条件与算例一致。\n\n| 分配 | 售出 | 剩余 | 收入 | 列示贡献 |\n|---|---:|---:|---:|---:|\n| 80/80 | 130 | 30 | 1560元 | 920元 |\n| 100/60 | 110 | 50 | 1320元 | 680元 |\n\n照搬原100/60，比等量分配少240元列示贡献。应保留的经验因此不是某个固定数量，而是如何使用事件、需求线索与约束形成判断。\n\n如果交通信息决策前已知却没用，是调用或工作设计缺口；如果事后才出现，则需要调整而非事后苛责。区分这两种情况，也影响人员是否愿意报告真实例外。\n\n## 反例不一定推翻全部方法\n\n一次失败可能来自执行偏离、资料缺失、方法错误或环境变化。若不分原因，团队可能在过度保守与频繁推倒之间摇摆。\n\n需要回到当时事实与实际动作，明确改哪一部分。可能只缩小某版本适用范围，也可能增加一个关键观察；有时则应停止整项方法。\n\n探索与利用研究提醒我们，既有成功会吸引资源和注意力。保留挑战旧认识的入口，有助于避免所有新情况都被解释成执行不够好。[原始研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)\n\n## 修改文档，还不等于完成纠错\n\n教学工单把“更换部件”纠正为“未换件”，最终记录如果改了，旧总结却仍被检索成确定方法，后续行为不会改变。\n\n一次有效修订应明确：原始事实保留，哪条解释或方法变化，当前采用入口显示什么，谁负责后续观察。必要时把反例加入代表任务，检查下一次模型或规则变更是否重新带回旧错误。\n\n“遗忘”在经营上可以表现为停止主动采用，不必删除原始证据。保留历史有助于理解为什么改变，而当前工作应能辨认最新状态。\n\n## 让更新成为正常生产\n\n可以定期回看未采用、失败、重复处理与条件变化，不只统计成功调用。修订需要有负责者与资源，否则团队会把它不断推迟。\n\n工具和工作方式变化也要求更新证据。METR后续方法讨论显示，新的使用条件需要新的观察设计，旧结论不应永久冻结。[方法更新](https://metr.org/blog/2026-02-24-uplift-update/)\n\n持续积累要有两种能力：让有效经验进入更多任务，也让新事实有机会改变旧经验。后者需要岗位愿意提供真实反馈，并有力量把发现改进系统。组织与长期共建由此成为转型的一部分。\n","html":"\u003ch1>第32章｜企业怎样避免越积累越相信旧错误\u003c/h1>\n\u003cp>设想某店长期配货偏少，常在高峰前卖完。系统记录销量不高，于是下一轮继续少配。低供给制造低销量，低销量又被用来支持低供给。\u003c/p>\n\u003cp>没有任何一条销售记录造假，企业却可能在不断积累支持错误判断的材料。\u003c/p>\n\u003cp>\u003cstrong>经验更新不仅是增加内容，还包括改变适用范围、修订方法和停止采用。\u003c/strong> 反馈质量决定企业是在学习，还是在强化旧偏差。\u003c/p>\n\u003ch2 id=\"lesson-32-section-1\">行动会改变未来看见的数据\u003c/h2>\n\u003cp>如果某类客户没有被服务，就很难观察其后续需求；如果工单提前关闭，复发可能变成另一张新单；如果只保存已采用建议，未被采用的理由就消失。\u003c/p>\n\u003cp>AI进入生产后，这些关系不会自动消除。系统可能以更快速度重复同一种选择，使后续材料更像原判断正确。\u003c/p>\n\u003cp>机器学习系统研究把模型行动影响未来数据的反馈视为重要维护问题。企业需要检查哪些结果可见，哪些因当前安排而被遮蔽。\u003ca href=\"https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTEwIiB2aWV3Qm94PSIwIDAgMzYwIDUxMCIgcm9sZT0iaW1nIj48dGl0bGU+5Y+N6aaI5Lmf5Y+v6IO95Zu65YyW5YGP5beuPC90aXRsZT48ZGVzYz7lsJHphY3pmZDliLbplIDph4/vvIzlj5fpmZDplIDph4/lj4jooqvnlKjmnaXlhrPlrprnu6fnu63lsJHphY3jgILooaXllK7nvYTlkozmnKrmu6HotrPor7fmsYLlj6/mmrTpnLLnvLrpobnvvIzkuI3og73ooaXlh7rnnJ/lrp7pnIDmsYLjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjUxMCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7lj43ppojkuZ/lj6/og73lm7rljJblgY/lt648L3RleHQ+PHJlY3QgeD0iMzAiIHk9Ijg4IiB3aWR0aD0iMTU0IiBoZWlnaHQ9IjY3IiByeD0iNiIgZmlsbD0iI2VkZjNlZCIgc3Ryb2tlPSIjNjA3MzZjIiBzdHJva2Utd2lkdGg9IjEuNSIvPjx0ZXh0IHg9IjEwNy4wIiB5PSIxMTUuMCIgZm9udC1mYW1pbHk9IlBpbmdGYW5nIFNDLE1pY3Jvc29mdCBZYUhlaSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmaWxsPSIjMjEzNDJmIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXdlaWdodD0iNDAwIj7lsJHphY08L3RleHQ+PHRleHQgeD0iMTA3LjAiIHk9IjE0MC4wIiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0i IiM4NzVkMjIiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSI0MDAiPuihpeWUrue9hOaXtueCueS4juacqua7oei2s+ivt+axgjwvdGV4dD48cGF0aCBkPSJNMzIyIDQ0MkgzNDhWMjQ5SDMzMiIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMTY1ZDUyIiBzdHJva2Utd2lkdGg9IjIiIG1hcmtlci1lbmQ9InVybCgjYXJyb3cpIi8+PC9zdmc+\" alt=\"少配使销量受供给限制，受限销量又支持下一轮少配；加入售罄时点和未满足请求，可以暴露循环中的缺失，而非直接补出真实需求。\">\u003c/p>\n\u003ch2 id=\"lesson-32-section-2\">一个成功方法，也可能因环境变化失效\u003c/h2>\n\u003cp>另设独立教学条件：总产量仍为160，X附近交通入口关闭，需求变为X50、Y90。价格12元、生产变动成本4元，未售无残值，其余条件与算例一致。\u003c/p>\n\u003cdiv class=\"table-scroll table-wide\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>分配\u003c/th>\n\u003cth align=\"right\">售出\u003c/th>\n\u003cth align=\"right\">剩余\u003c/th>\n\u003cth align=\"right\">收入\u003c/th>\n\u003cth align=\"right\">列示贡献\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>80/80\u003c/td>\n\u003ctd align=\"right\">130\u003c/td>\n\u003ctd align=\"right\">30\u003c/td>\n\u003ctd align=\"right\">1560元\u003c/td>\n\u003ctd align=\"right\">920元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>100/60\u003c/td>\n\u003ctd align=\"right\">110\u003c/td>\n\u003ctd align=\"right\">50\u003c/td>\n\u003ctd align=\"right\">1320元\u003c/td>\n\u003ctd align=\"right\">680元\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"table-hint\">表格可左右滑动查看\u003c/p>\n\u003cp>照搬原100/60，比等量分配少240元列示贡献。应保留的经验因此不是某个固定数量，而是如何使用事件、需求线索与约束形成判断。\u003c/p>\n\u003cp>如果交通信息决策前已知却没用，是调用或工作设计缺口；如果事后才出现，则需要调整而非事后苛责。区分这两种情况，也影响人员是否愿意报告真实例外。\u003c/p>\n\u003ch2 id=\"lesson-32-section-3\">反例不一定推翻全部方法\u003c/h2>\n\u003cp>一次失败可能来自执行偏离、资料缺失、方法错误或环境变化。若不分原因，团队可能在过度保守与频繁推倒之间摇摆。\u003c/p>\n\u003cp>需要回到当时事实与实际动作，明确改哪一部分。可能只缩小某版本适用范围，也可能增加一个关键观察；有时则应停止整项方法。\u003c/p>\n\u003cp>探索与利用研究提醒我们，既有成功会吸引资源和注意力。保留挑战旧认识的入口，有助于避免所有新情况都被解释成执行不够好。\u003ca href=\"https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-32-section-4\">修改文档，还不等于完成纠错\u003c/h2>\n\u003cp>教学工单把“更换部件”纠正为“未换件”，最终记录如果改了，旧总结却仍被检索成确定方法，后续行为不会改变。\u003c/p>\n\u003cp>一次有效修订应明确：原始事实保留，哪条解释或方法变化，当前采用入口显示什么，谁负责后续观察。必要时把反例加入代表任务，检查下一次模型或规则变更是否重新带回旧错误。\u003c/p>\n\u003cp>“遗忘”在经营上可以表现为停止主动采用，不必删除原始证据。保留历史有助于理解为什么改变，而当前工作应能辨认最新状态。\u003c/p>\n\u003ch2 id=\"lesson-32-section-5\">让更新成为正常生产\u003c/h2>\n\u003cp>可以定期回看未采用、失败、重复处理与条件变化，不只统计成功调用。修订需要有负责者与资源，否则团队会把它不断推迟。\u003c/p>\n\u003cp>工具和工作方式变化也要求更新证据。METR后续方法讨论显示，新的使用条件需要新的观察设计，旧结论不应永久冻结。\u003ca href=\"https://metr.org/blog/2026-02-24-uplift-update/\" target=\"_blank\" rel=\"noopener noreferrer\">方法更新\u003c/a>\u003c/p>\n\u003cp>持续积累要有两种能力：让有效经验进入更多任务，也让新事实有机会改变旧经验。后者需要岗位愿意提供真实反馈，并有力量把发现改进系统。组织与长期共建由此成为转型的一部分。\u003c/p>\n","headings":[{"id":"lesson-32-section-1","label":"行动会改变未来看见的数据"},{"id":"lesson-32-section-2","label":"一个成功方法，也可能因环境变化失效"},{"id":"lesson-32-section-3","label":"反例不一定推翻全部方法"},{"id":"lesson-32-section-4","label":"修改文档，还不等于完成纠错"},{"id":"lesson-32-section-5","label":"让更新成为正常生产"}],"exportMd":"# 第32章｜企业怎样避免越积累越相信旧错误\n\n设想某店长期配货偏少，常在高峰前卖完。系统记录销量不高，于是下一轮继续少配。低供给制造低销量，低销量又被用来支持低供给。\n\n没有任何一条销售记录造假，企业却可能在不断积累支持错误判断的材料。\n\n**经验更新不仅是增加内容，还包括改变适用范围、修订方法和停止采用。** 反馈质量决定企业是在学习，还是在强化旧偏差。\n\n## 行动会改变未来看见的数据\n\n如果某类客户没有被服务，就很难观察其后续需求；如果工单提前关闭，复发可能变成另一张新单；如果只保存已采用建议，未被采用的理由就消失。\n\nAI进入生产后，这些关系不会自动消除。系统可能以更快速度重复同一种选择，使后续材料更像原判断正确。\n\n机器学习系统研究把模型行动影响未来数据的反馈视为重要维护问题。企业需要检查哪些结果可见，哪些因当前安排而被遮蔽。[原始研究](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n![少配使销量受供给限制，受限销量又支持下一轮少配；加入售罄时点和未满足请求，可以暴露循环中的缺失，而非直接补出真实需求。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTEwIiB2aWV3Qm94PSIwIDAgMzYwIDUxMCIgcm9sZT0iaW1nIj48dGl0bGU+5Y+N6aaI5Lmf5Y+v6IO95Zu65YyW5YGP5beuPC90aXRsZT48ZGVzYz7lsJHphY3pmZDliLbplIDph4/vvIzlj5fpmZDplIDph4/lj4jooqvnlKjmnaXlhrPlrprnu6fnu63lsJHphY3jgILooaXllK7nvYTlkozmnKrmu6HotrPor7fmsYLlj6/mmrTpnLLnvLrpobnvvIzkuI3og73ooaXlh7rnnJ/lrp7pnI 范围，也可能增加一个关键观察；有时则应停止整项方法。\n\n探索与利用研究提醒我们，既有成功会吸引资源和注意力。保留挑战旧认识的入口，有助于避免所有新情况都被解释成执行不够好。[原始研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)\n\n## 修改文档，还不等于完成纠错\n\n教学工单把“更换部件”纠正为“未换件”，最终记录如果改了，旧总结却仍被检索成确定方法，后续行为不会改变。\n\n一次有效修订应明确：原始事实保留，哪条解释或方法变化，当前采用入口显示什么，谁负责后续观察。必要时把反例加入代表任务，检查下一次模型或规则变更是否重新带回旧错误。\n\n“遗忘”在经营上可以表现为停止主动采用，不必删除原始证据。保留历史有助于理解为什么改变，而当前工作应能辨认最新状态。\n\n## 让更新成为正常生产\n\n可以定期回看未采用、失败、重复处理与条件变化，不只统计成功调用。修订需要有负责者与资源，否则团队会把它不断推迟。\n\n工具和工作方式变化也要求更新证据。METR后续方法讨论显示，新的使用条件需要新的观察设计，旧结论不应永久冻结。[方法更新](https://metr.org/blog/2026-02-24-uplift-update/)\n\n持续积累要有两种能力：让有效经验进入更多任务，也让新事实有机会改变旧经验。后者需要岗位愿意提供真实反馈，并有力量把发现改进系统。组织与长期共建由此成为转型的一部分。\n","exportSingleMd":"# 第32章｜企业怎样避免越积累越相信旧错误\n\n设想某店长期配货偏少，常在高峰前卖完。系统记录销量不高，于是下一轮继续少配。低供给制造低销量，低销量又被用来支持低供给。\n\n没有任何一条销售记录造假，企业却可能在不断积累支持错误判断的材料。\n\n**经验更新不仅是增加内容，还包括改变适用范围、修订方法和停止采用。** 反馈质量决定企业是在学习，还是在强化旧偏差。\n\n## 行动会改变未来看见的数据\n\n如果某类客户没有被服务，就很难观察其后续需求；如果工单提前关闭，复发可能变成另一张新单；如果只保存已采用建议，未被采用的理由就消失。\n\nAI进入生产后，这些关系不会自动消除。系统可能以更快速度重复同一种选择，使后续材料更像原判断正确。\n\n机器学习系统研究把模型行动影响未来数据的反馈视为重要维护问题。企业需要检查哪些结果可见，哪些因当前安排而被遮蔽。[原始研究](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n![少配使销量受供给限制，受限销量又支持下一轮少配；加入售罄时点和未满足请求，可以暴露循环中的缺失，而非直接补出真实需求。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTEwIiB2aWV3Qm94PSIwIDAgMzYwIDUxMCIgcm9sZT0iaW1nIj48dGl0bGU+5Y+N6aaI5Lmf5Y+v6IO95Zu65YyW5YGP5beuPC90aXRsZT48ZGVzYz7lsJHphY3pmZDliLbplIDph4/vvIzlj5fpmZDplIDph4/lj4jooqvnlKjmnaXlhrPlrprnu6fnu63lsJHphY3jgILooaXllK7nvYTlkozmnKrmu6HotrPor7fmsYLlj6/mmrTpnLLnvLrpobnvvIzkuI3og73ooaXlh7rnnJ/lrp7pnIDmsYLjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVp
