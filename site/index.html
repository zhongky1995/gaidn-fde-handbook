务 | 门店核实等待40分钟 |\n| 顾客请求C3 | 已接受一次补送，仍申请退还本次300元服务费 | 明确本次请求，不代表已批准 |\n| 补救规则v2 | 店长可批准不超过100元的补送；本类退款由区域经理批准，财务执行 | 区分决定与执行权限 |\n| 时限与升级规则v2 | 区域任务24小时未处理，系统向运营负责人升级；运营负责人可安排已获授权的副区域经理接手 | 超时可以改变接手安排，不能自动退款 |\n| 关闭规则v2 | 核实记录、有效决定、执行回执与顾客告知均齐备，且无待处理事项，才可关闭 | 明确完成条件 |\n\n周一10:00，AI整理成事件E07，店长核对V7与C3，程序按有效规则派给区域经理，状态为“待退款决定”，保存24小时时限。AI的作用是整理和提示缺项；程序负责保存身份、按规则派单、计时与记录回执。\n\n到周二10:00仍无决定，程序对同一事件执行一次升级，并标为“已升级、决定仍待办”。运营负责人安排有授权的副区域经理接手。周三10:00，接手人查看原材料与规则，批准退还300元；程序创建财务执行任务，状态改为“已批准、待执行”。\n\n财务执行后返回回执F88，关联E07及批准记录；门店记录已告知顾客，且本例无其他待处理事项，系统才按关闭规则转为“已完成”。若只有批准、没有执行回执，任务仍未完成；若付款请求超时，则先核实同一请求结果，避免重复退款。\n\n## 知识冲突怎样影响动作\n\n旧规则允许店长直接处理某类补救，新规则要求区域确认。系统若从旧聊天中检索到熟悉表述，可能给出过期建议。因此，处理规则要有维护位置与有效范围，历史聊天只作为事件线索。\n\n如果规则尚未明确，AI可以组织事实和候选处理，但不能用自己的常识创造企业授权。这个缺口需要业务负责人决定。\n\n## 激励为什么会改变数据\n\n如果只按异常数量考核门店，员工可能少记、延迟记或换分类。总部看见异常变少，却无法判断服务是否改善。\n\n可以结合主动上报、处理及时性、重复发生、顾客结果与抽查，区分发现问题和造成问题的责任。同时减少重复录入，让门店获得处理支持，透明度才更容易持续。\n\n## 能迁移什么，必须重做什么\n\n从询价案例可以迁移业务对象、事实与建议分开、权责明确、执行回执和经验回流。需要重做的是事件类型、严重程度、升级路径、顾客沟通规则和隐私范围。\n\n若把询价中的“技术确认”字段原样复制成“总部确认”，并不能完成这些设计。跨场景复用，需要重建实际责任与后果。\n\n## 条件变化练习\n\n系统已经识别异常，但区域经理两天没有处理。依据本例v2规则，程序可以做什么？能否自动退款？如果批准后没有F88回执，能否关闭？\n\n\u003cdetails>\u003csummary>展开参考判断\u003c/summary>\n\n24小时时限已过，程序可以升级并保留待办；运营负责人可安排有授权的接手人。程序不能因等待两天就自动批准退款。批准后若没有执行回执，仍保持待执行或结果未知，先查执行情况。提高分类准确率不会补上尚未作出的决定或缺少的执行结果。\n\n\u003c/details>\n","html":"\u003ch1>案例 C｜多门店服务：信息透明以后谁来负责\u003c/h1>\n\u003cp>这是教学情境，企业与规则均为设定。它帮助检验第8、14、15、17课在不同组织中的适用边界。\u003c/p>\n\u003ch2>业务背景\u003c/h2>\n\u003cp>一家连锁服务企业有多个门店。顾客反馈、设备异常与服务补救，分散在门店群聊中。总部希望AI归类并生成异常日报，门店担心多填表、被误判和增加检查。\u003c/p>\n\u003cp>当前问题不能直接确定为“缺一个日报”。总部需要的是及时发现重要问题并确保处理，门店需要的是以可承担的工作完成顾客服务。若只有总部看见更多异常，却无人协调资源，门店负担可能增加。\u003c/p>\n\u003ch2>一笔任务怎样闭环\u003c/h2>\n\u003cp>教学输入：“顾客称预约后到店等了40分钟；门店补送一次服务，顾客仍要求退款。”AI可以整理事件与候选类型，标出等待和退款要求。\u003c/p>\n\u003cp>门店负责人核对预约及到店记录，说明40分钟是顾客陈述还是已核事实。服务经理按有效补救规则决定处理；退款若超出门店权限，交给授权人员。实际联系、顾客答复、退款执行和完成依据分别保留。\u003c/p>\n\u003cp>日报显示“已识别退款诉求”，并不等于“退款已完成”。系统需要知道任务交给谁、何时未处理、由谁升级，以及什么结果可以关闭。\u003c/p>\n\u003ch2>本笔任务的教学材料与状态\u003c/h2>\n\u003cp>以下规则仅为本案例设定，假设企业已经在系统中配置岗位对应、计时和派单，不是通用退款规则，也没有实际发送或付款。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>材料\u003c/th>\n\u003cth>本例内容\u003c/th>\n\u003cth>能支持什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>预约与服务记录V7\u003c/td>\n\u003ctd>预约周一09:00，顾客09:00到店，09:40开始服务\u003c/td>\n\u003ctd>门店核实等待40分钟\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>顾客请求C3\u003c/td>\n\u003ctd>已接受一次补送，仍申请退还本次300元服务费\u003c/td>\n\u003ctd>明确本次请求，不代表已批准\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>补救规则v2\u003c/td>\n\u003ctd>店长可批准不超过100元的补送；本类退款由区域经理批准，财务执行\u003c/td>\n\u003ctd>区分决定与执行权限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>时限与升级规则v2\u003c/td>\n\u003ctd>区域任务24小时未处理，系统向运营负责人升级；运营负责人可安排已获授权的副区域经理接手\u003c/td>\n\u003ctd>超时可以改变接手安排，不能自动退款\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>关闭规则v2\u003c/td>\n\u003ctd>核实记录、有效决定、执行回执与顾客告知均齐备，且无待处理事项，才可关闭\u003c/td>\n\u003ctd>明确完成条件\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>周一10:00，AI整理成事件E07，店长核对V7与C3，程序按有效规则派给区域经理，状态为“待退款决定”，保存24小时时限。AI的作用是整理和提示缺项；程序负责保存身份、按规则派单、计时与记录回执。\u003c/p>\n\u003cp>到周二10:00仍无决定，程序对同一事件执行一次升级，并标为“已升级、决定仍待办”。运营负责人安排有授权的副区域经理接手。周三10:00，接手人查看原材料与规则，批准退还300元；程序创建财务执行任务，状态改为“已批准、待执行”。\u003c/p>\n\u003cp>财务执行后返回回执F88，关联E07及批准记录；门店记录已告知顾客，且本例无其他待处理事项，系统才按关闭规则转为“已完成”。若只有批准、没有执行回执，任务仍未完成；若付款请求超时，则先核实同一请求结果，避免重复退款。\u003c/p>\n\u003ch2>知识冲突怎样影响动作\u003c/h2>\n\u003cp>旧规则允许店长直接处理某类补救，新规则要求区域确认。系统若从旧聊天中检索到熟悉表述，可能给出过期建议。因此，处理规则要有维护位置与有效范围，历史聊天只作为事件线索。\u003c/p>\n\u003cp>如果规则尚未明确，AI可以组织事实和候选处理，但不能用自己的常识创造企业授权。这个缺口需要业务负责人决定。\u003c/p>\n\u003ch2>激励为什么会改变数据\u003c/h2>\n\u003cp>如果只按异常数量考核门店，员工可能少记、延迟记或换分类。总部看见异常变少，却无法判断服务是否改善。\u003c/p>\n\u003cp>可以结合主动上报、处理及时性、重复发生、顾客结果与抽查，区分发现问题和造成问题的责任。同时减少重复录入，让门店获得处理支持，透明度才更容易持续。\u003c/p>\n\u003ch2>能迁移什么，必须重做什么\u003c/h2>\n\u003cp>从询价案例可以迁移业务对象、事实与建议分开、权责明确、执行回执和经验回流。需要重做的是事件类型、严重程度、升级路径、顾客沟通规则和隐私范围。\u003c/p>\n\u003cp>若把询价中的“技术确认”字段原样复制成“总部确认”，并不能完成这些设计。跨场景复用，需要重建实际责任与后果。\u003c/p>\n\u003ch2>条件变化练习\u003c/h2>\n\u003cp>系统已经识别异常，但区域经理两天没有处理。依据本例v2规则，程序可以做什么？能否自动退款？如果批准后没有F88回执，能否关闭？\u003c/p>\n\u003cdetails>\u003csummary>展开参考判断\u003c/summary>\n\n\u003cp>24小时时限已过，程序可以升级并保留待办；运营负责人可安排有授权的接手人。程序不能因等待两天就自动批准退款。批准后若没有执行回执，仍保持待执行或结果未知，先查执行情况。提高分类准确率不会补上尚未作出的决定或缺少的执行结果。\u003c/p>\n\u003c/details>\n","exportMd":"# 案例 C｜多门店服务：信息透明以后谁来负责\n\n这是教学情境，企业与规则均为设定。它帮助检验第8、14、15、17课在不同组织中的适用边界。\n\n## 业务背景\n\n一家连锁服务企业有多个门店。顾客反馈、设备异常与服务补救，分散在门店群聊中。总部希望AI归类并生成异常日报，门店担心多填表、被误判和增加检查。\n\n当前问题不能直接确定为“缺一个日报”。总部需要的是及时发现重要问题并确保处理，门店需要的是以可承担的工作完成顾客服务。若只有总部看见更多异常，却无人协调资源，门店负担可能增加。\n\n## 一笔任务怎样闭环\n\n教学输入：“顾客称预约后到店等了40分钟；门店补送一次服务，顾客仍要求退款。”AI可以整理事件与候选类型，标出等待和退款要求。\n\n门店负责人核对预约及到店记录，说明40分钟是顾客陈述还是已核事实。服务经理按有效补救规则决定处理；退款若超出门店权限，交给授权人员。实际联系、顾客答复、退款执行和完成依据分别保留。\n\n日报显示“已识别退款诉求”，并不等于“退款已完成”。系统需要知道任务交给谁、何时未处理、由谁升级，以及什么结果可以关闭。\n\n## 本笔任务的教学材料与状态\n\n以下规则仅为本案例设定，假设企业已经在系统中配置岗位对应、计时和派单，不是通用退款规则，也没有实际发送或付款。\n\n| 材料 | 本例内容 | 能支持什么 |\n|---|---|---|\n| 预约与服务记录V7 | 预约周一09:00，顾客09:00到店，09:40开始服务 | 门店核实等待40分钟 |\n| 顾客请求C3 | 已接受一次补送，仍申请退还本次300元服务费 | 明确本次请求，不代表已批准 |\n| 补救规则v2 | 店长可批准不超过100元的补送；本类退款由区域经理批准，财务执行 | 区分决定与执行权限 |\n| 时限与升级规则v2 | 区域任务24小时未处理，系统向运营负责人升级；运营负责人可安排已获授权的副区域经理接手 | 超时可以改变接手安排，不能自动退款 |\n| 关闭规则v2 | 核实记录、有效决定、执行回执与顾客告知均齐备，且无待处理事项，才可关闭 | 明确完成条件 |\n\n周一10:00，AI整理成事件E07，店长核对V7与C3，程序按有效规则派给区域经理，状态为“待退款决定”，保存24小时时限。AI的作用是整理和提示缺项；程序负责保存身份、按规则派单、计时与记录回执。\n\n到周二10:00仍无决定，程序对同一事件执行一次升级，并标为“已升级、决定仍待办”。运营负责人安排有授权的副区域经理接手。周三10:00，接手人查看原材料与规则，批准退还300元；程序创建财务执行任务，状态改为“已批准、待执行”。\n\n财务执行后返回回执F88，关联E07及批准记录；门店记录已告知顾客，且本例无其他待处理事项，系统才按关闭规则转为“已完成”。若只有批准、没有执行回执，任务仍未完成；若付款请求超时，则先核实同一请求结果，避免重复退款。\n\n## 知识冲突怎样影响动作\n\n旧规则允许店长直接处理某类补救，新规则要求区域确认。系统若从旧聊天中检索到熟悉表述，可能给出过期建议。因此，处理规则要有维护位置与有效范围，历史聊天只作为事件线索。\n\n如果规则尚未明确，AI可以组织事实和候选处理，但不能用自己的常识创造企业授权。这个缺口需要业务负责人决定。\n\n## 激励为什么会改变数据\n\n如果只按异常数量考核门店，员工可能少记、延迟记或换分类。总部看见异常变少，却无法判断服务是否改善。\n\n可以结合主动上报、处理及时性、重复发生、顾客结果与抽查，区分发现问题和造成问题的责任。同时减少重复录入，让门店获得处理支持，透明度才更容易持续。\n\n## 能迁移什么，必须重做什么\n\n从询价案例可以迁移业务对象、事实与建议分开、权责明确、执行回执和经验回流。需要重做的是事件类型、严重程度、升级路径、顾客沟通规则和隐私范围。\n\n若把询价中的“技术确认”字段原样复制成“总部确认”，并不能完成这些设计。跨场景复用，需要重建实际责任与后果。\n\n## 条件变化练习\n\n系统已经识别异常，但区域经理两天没有处理。依据本例v2规则，程序可以做什么？能否自动退款？如果批准后没有F88回执，能否关闭？\n\n\u003cdetails>\u003csummary>展开参考判断\u003c/summary>\n\n24小时时限已过，程序可以升级并保留待办；运营负责人可安排有授权的接手人。程序不能因等待两天就自动批准退款。批准后若没有执行回执，仍保持待执行或结果未知，先查执行情况。提高分类准确率不会补上尚未作出的决定或缺少的执行结果。\n\n\u003c/details>\n","exportSingleMd":"# 案例 C｜多门店服务：信息透明以后谁来负责\n\n这是教学情境，企业与规则均为设定。它帮助检验第8、14、15、17课在不同组织中的适用边界。\n\n## 业务背景\n\n一家连锁服务企业有多个门店。顾客反馈、设备异常与服务补救，分散在门店群聊中。总部希望AI归类并生成异常日报，门店担心多填表、被误判和增加检查。\n\n当前问题不能直接确定为“缺一个日报”。总部需要的是及时发现重要问题并确保处理，门店需要的是以可承担的工作完成顾客服务。若只有总部看见更多异常，却无人协调资源，门店负担可能增加。\n\n## 一笔任务怎样闭环\n\n教学输入：“顾客称预约后到店等了40分钟；门店补送一次服务，顾客仍要求退款。”AI可以整理事件与候选类型，标出等待和退款要求。\n\n门店负责人核对预约及到店记录，说明40分钟是顾客陈述还是已核事实。服务经理按有效补救规则决定处理；退款若超出门店权限，交给授权人员。实际联系、顾客答复、退款执行和完成依据分别保留。\n\n日报显示“已识别退款诉求”，并不等于“退款已完成”。系统需要知道任务交给谁、何时未处理、由谁升级，以及什么结果可以关闭。\n\n## 本笔任务的教学材料与状态\n\n以下规则仅为本案例设定，假设企业已经在系统中配置岗位对应、计时和派单，不是通用退款规则，也没有实际发送或付款。\n\n| 材料 | 本例内容 | 能支持什么 |\n|---|---|---|\n| 预约与服务记录V7 | 预约周一09:00，顾客09:00到店，09:40开始服务 | 门店核实等待40分钟 |\n| 顾客请求C3 | 已接受一次补送，仍申请退还本次300元服务费 | 明确本次请求，不代表已批准 |\n| 补救规则v2 | 店长可批准不超过100元的补送；本类退款由区域经理批准，财务执行 | 区分决定与执行权限 |\n| 时限与升级规则v2 | 区域任务24小时未处理，系统向运营负责人升级；运营负责人可安排已获授权的副区域经理接手 | 超时可以改变接手安排，不能自动退款 |\n| 关闭规则v2 | 核实记录、有效决定、执行回执与顾客告知均齐备，且无待处理事项，才可关闭 | 明确完成条件 |\n\n周一10:00，AI整理成事件E07，店长核对V7与C3，程序按有效规则派给区域经理，状态为“待退款决定”，保存24小时时限。AI的作用是整理和提示缺项；程序负责保存身份、按规则派单、计时与记录回执。\n\n到周二10:00仍无决定，程序对同一事件执行一次升级，并标为“已升级、决定仍待办”。运营负责人安排有授权的副区域经理接手。周三10:00，接手人查看原材料与规则，批准退还300元；程序创建财务执行任务，状态改为“已批准、待执行”。\n\n财务执行后返回回执F88，关联E07及批准记录；门店记录已告知顾客，且本例无其他待处理事项，系统才按关闭规则转为“已完成”。若只有批准、没有执行回执，任务仍未完成；若付款请求超时，则先核实同一请求结果，避免重复退款。\n\n## 知识冲突怎样影响动作\n\n旧规则允许店长直接处理某类补救，新规则要求区域确认。系统若从旧聊天中检索到熟悉表述，可能给出过期建议。因此，处理规则要有维护位置与有效范围，历史聊天只作为事件线索。\n\n如果规则尚未明确，AI可以组织事实和候选处理，但不能用自己的常识创造企业授权。这个缺口需要业务负责人决定。\n\n## 激励为什么会改变数据\n\n如果只按异常数量考核门店，员工可能少记、延迟记或换分类。总部看见异常变少，却无法判断服务是否改善。\n\n可以结合主动上报、处理及时性、重复发生、顾客结果与抽查，区分发现问题和造成问题的责任。同时减少重复录入，让门店获得处理支持，透明度才更容易持续。\n\n## 能迁移什么，必须重做什么\n\n从询价案例可以迁移业务对象、事实与建议分开、权责明确、执行回执和经验回流。需要重做的是事件类型、严重程度、升级路径、顾客沟通规则和隐私范围。\n\n若把询价中的“技术确认”字段原样复制成“总部确认”，并不能完成这些设计。跨场景复用，需要重建实际责任与后果。\n\n## 条件变化练习\n\n系统已经识别异常，但区域经理两天没有处理。依据本例v2规则，程序可以做什么？能否自动退款？如果批准后没有F88回执，能否关闭？\n\n\u003cdetails>\u003csummary>展开参考判断\u003c/summary>\n\n24小时时限已过，程序可以升级并保留待办；运营负责人可安排有授权的接手人。程序不能因等待两天就自动批准退款。批准后若没有执行回执，仍保持待执行或结果未知，先查执行情况。提高分类准确率不会补上尚未作出的决定或缺少的执行结果。\n\n\u003c/details>\n","text":"# 案例 C｜多门店服务：信息透明以后谁来负责\n\n这是教学情境，企业与规则均为设定。它帮助检验第8、14、15、17课在不同组织中的适用边界。\n\n## 业务背景\n\n一家连锁服务企业有多个门店。顾客反馈、设备异常与服务补救，分散在门店群聊中。总部希望AI归类并生成异常日报，门店担心多填表、被误判和增加检查。\n\n当前问题不能直接确定为“缺一个日报”。总部需要的是及时发现重要问题并确保处理，门店需要的是以可承担的工作完成顾客服务。若只有总部看见更多异常，却无人协调资源，门店负担可能增加。\n\n## 一笔任务怎样闭环\n\n教学输入：“顾客称预约后到店等了40分钟；门店补送一次服务，顾客仍要求退款。”AI可以整理事件与候选类型，标出等待和退款要求。\n\n门店负责人核对预约及到店记录，说明40分钟是顾客陈述还是已核事实。服务经理按有效补救规则决定处理；退款若超出门店权限，交给授权人员。实际联系、顾客答复、退款执行和完成依据分别保留。\n\n日报显示“已识别退款诉求”，并不等于“退款已完成”。系统需要知道任务交给谁、何时未处理、由谁升级，以及什么结果可以关闭。\n\n## 本笔任务的教学材料与状态\n\n以下规则仅为本案例设定，假设企业已经在系统中配置岗位对应、计时和派单，不是通用退款规则，也没有实际发送或付款。\n\n| 材料 | 本例内容 | 能支持什么 |\n|---|---|---|\n| 预约与服务记录V7 | 预约周一09:00，顾客09:00到店，09:40开始服务 | 门店核实等待40分钟 |\n| 顾客请求C3 | 已接受一次补送，仍申请退还本次300元服务费 | 明确本次请求，不代表已批准 |\n| 补救规则v2 | 店长可批准不超过100元的补送；本类退款由区域经理批准，财务执行 | 区分决定与执行权限 |\n| 时限与升级规则v2 | 区域任务24小时未处理，系统向运营负责人升级；运营负责人可安排已获授权的副区域经理接手 | 超时可以改变接手安排，不能自动退款 |\n| 关闭规则v2 | 核实记录、有效决定、执行回执与顾客告知均齐备，且无待处理事项，才可关闭 | 明确完成条件 |\n\n周一10:00，AI整理成事件E07，店长核对V7与C3，程序按有效规则派给区域经理，状态为“待退款决定”，保存24小时时限。AI的作用是整理和提示缺项；程序负责保存身份、按规则派单、计时与记录回执。\n\n到周二10:00仍无决定，程序对同一事件执行一次升级，并标为“已升级、决定仍待办”。运营负责人安排有授权的副区域经理接手。周三10:00，接手人查看原材料与规则，批准退还300元；程序创建财务执行任务，状态改为“已批准、待执行”。\n\n财务执行后返回回执F88，关联E07及批准记录；门店记录已告知顾客，且本例无其他待处理事项，系统才按关闭规则转为“已完成”。若只有批准、没有执行回执，任务仍未完成；若付款请求超时，则先核实同一请求结果，避免重复退款。\n\n## 知识冲突怎样影响动作\n\n旧规则允许店长直接处理某类补救，新规则要求区域确认。系统若从旧聊天中检索到熟悉表述，可能给出过期建议。因此，处理规则要有维护位置与有效范围，历史聊天只作为事件线索。\n\n如果规则尚未明确，AI可以组织事实和候选处理，但不能用自己的常识创造企业授权。这个缺口需要业务负责人决定。\n\n## 激励为什么会改变数据\n\n如果只按异常数量考核门店，员工可能少记、延迟记或换分类。总部看见异常变少，却无法判断服务是否改善。\n\n可以结合主动上报、处理及时性、重复发生、顾客结果与抽查，区分发现问题和造成问题的责任。同时减少重复录入，让门店获得处理支持，透明度才更容易持续。\n\n## 能迁移什么，必须重做什么\n\n从询价案例可以迁移业务对象、事实与建议分开、权责明确、执行回执和经验回流。需要重做的是事件类型、严重程度、升级路径、顾客沟通规则和隐私范围。\n\n若把询价中的“技术确认”字段原样复制成“总部确认”，并不能完成这些设计。跨场景复用，需要重建实际责任与后果。\n\n## 条件变化练习\n\n系统已经识别异常，但区域经理两天没有处理。依据本例v2规则，程序可以做什么？能否自动退款？如果批准后没有F88回执，能否关闭？\n\n  展开参考判断 \n\n24小时时限已过，程序可以升级并保留待办；运营负责人可安排有授权的接手人。程序不能因等待两天就自动批准退款。批准后若没有执行回执，仍保持待执行或结果未知，先查执行情况。提高分类准确率不会补上尚未作出的决定或缺少的执行结果。\n\n \n"},{"file":"概念索引.md","id":"glossary","number":null,"role":"参考","part":-1,"title":"概念索引","md":"# 概念索引\n\n这里提供回查入口。首次学习仍建议阅读概念所在正文，理解其机制与条件。\n\n| 概念 | 在本课中的含义 | 解释位置 |\n|---|---|---|\n| 基础模型 | 在广泛材料上训练，可适配多类任务的模型；企业用途还需条件 | [第1课](01-AI改变了什么.md)、[第9课](09-模型如何使用企业知识.md) |\n| 数字化转型 | 数字技术与信息结构引起的工作、协调及业务变化，具体项目应说明改变什么 | [第2课](02-数字化与AI怎样连接.md) |\n| 互补投入 | 为使技术发挥作用而建设的数据、流程、人员和方法 | [第3课](03-从任务提效到经营改善.md) |\n| 流程瓶颈 | 在说明的任务与资源条件下，限制整条工作链完成量的环节 | [第3课](03-从任务提效到经营改善.md) |\n| 价值获取 | 企业通过价格、销量、留存或成本等方式保留所创造价值的一部分 | [第4课](04-竞争与商业模式.md) |\n| FDE | 嵌入现场，连接问题发现、工程实现、部署与反馈的角色/工作方式；机构定义有差异 | [第5课](05-FDE的发展与作用.md) |\n| 价值假设 | 某种变化通过明确机制改善工作或经营的可检验解释 | [第6—7课](07-选择试点与投资顺序.md) |\n| 业务对象 | 企业持续追踪的事物，如客户、询价和订单，可关联记录与动作 | [第8课](08-重设计业务链.md) |\n| 上下文 | 模型本次运行可使用的要求、资料、历史与工具返回 | [第9课](09-模型如何使用企业知识.md) |\n| RAG | 先检索相关材料，再提供给模型生成的安排 | [第9课](09-模型如何使用企业知识.md) |\n| 微调 | 用专门样本继续训练，改变模型参数 | [第9课](09-模型如何使用企业知识.md) |\n| 工作流 | 主要路径由程序安排，可在其中调用模型 | [第10课](10-工作流Agent与执行控制.md) |\n| Agent | 模型在给定范围内参与选择动作，并根据反馈继续任务的系统 | [第10课](10-工作流Agent与执行控制.md) |\n| API / MCP | 软件调用入口，以及向AI应用提供工具与资源的一类协议；不自动授予权限 | [第10课](10-工作流Agent与执行控制.md) |\n| Harness | 支持持续任务、工具、状态、检查与恢复的运行框架 | [第10课](10-工作流Agent与执行控制.md) |\n| 幂等 | 对同一业务请求重复提交时，避免重复产生业务效果的设计 | [第10课](10-工作流Agent与执行控制.md) |\n| 覆盖率与条件正确率 | 能承担的任务比例，以及已给出结果中合格的比例；还需看错误后果 | [第12课](12-评测与业务验收.md) |\n| 容量与现金 | 可重新安排的资源，与实际收付款变化，分别核算 | [第13课](13-投入回报与收益兑现.md) |\n| 语义层/本体 | 对业务对象、关系和允许动作的共同表示 | [第17课](17-经验如何成为组织能力.md) |\n\n对同一概念，各产品的具体实现可能不同。评估方案时，请对方用当前业务材料说明它实际取得、决定和改变了什么。\n","html":"\u003ch1>概念索引\u003c/h1>\n\u003cp>这里提供回查入口。首次学习仍建议阅读概念所在正文，理解其机制与条件。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>在本课中的含义\u003c/th>\n\u003cth>解释位置\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>基础模型\u003c/td>\n\u003ctd>在广泛材料上训练，可适配多类任务的模型；企业用途还需条件\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-01\">第1课\u003c/a>、\u003ca href=\"#lesson-09\">第9课\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数字化转型\u003c/td>\n\u003ctd>数字技术与信息结构引起的工作、协调及业务变化，具体项目应说明改变什么\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-02\">第2课\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>互补投入\u003c/td>\n\u003ctd>为使技术发挥作用而建设的数据、流程、人员和方法\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-03\">第3课\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>流程瓶颈\u003c/td>\n\u003ctd>在说明的任务与资源条件下，限制整条工作链完成量的环节\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-03\">第3课\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>价值获取\u003c/td>\n\u003ctd>企业通过价格、销量、留存或成本等方式保留所创造价值的一部分\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-04\">第4课\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FDE\u003c/td>\n\u003ctd>嵌入现场，连接问题发现、工程实现、部署与反馈的角色/工作方式；机构定义有差异\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-05\">第5课\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>价值假设\u003c/td>\n\u003ctd>某种变化通过明确机制改善工作或经营的可检验解释\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-07\">第6—7课\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>业务对象\u003c/td>\n\u003ctd>企业持续追踪的事物，如客户、询价和订单，可关联记录与动作\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-08\">第8课\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>上下文\u003c/td>\n\u003ctd>模型本次运行可使用的要求、资料、历史与工具返回\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-09\">第9课\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RAG\u003c/td>\n\u003ctd>先检索相关材料，再提供给模型生成的安排\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-09\">第9课\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>微调\u003c/td>\n\u003ctd>用专门样本继续训练，改变模型参数\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-09\">第9课\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工作流\u003c/td>\n\u003ctd>主要路径由程序安排，可在其中调用模型\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-10\">第10课\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Agent\u003c/td>\n\u003ctd>模型在给定范围内参与选择动作，并根据反馈继续任务的系统\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-10\">第10课\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>API / MCP\u003c/td>\n\u003ctd>软件调用入口，以及向AI应用提供工具与资源的一类协议；不自动授予权限\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-10\">第10课\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Harness\u003c/td>\n\u003ctd>支持持续任务、工具、状态、检查与恢复的运行框架\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-10\">第10课\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>幂等\u003c/td>\n\u003ctd>对同一业务请求重复提交时，避免重复产生业务效果的设计\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-10\">第10课\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>覆盖率与条件正确率\u003c/td>\n\u003ctd>能承担的任务比例，以及已给出结果中合格的比例；还需看错误后果\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-12\">第12课\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>容量与现金\u003c/td>\n\u003ctd>可重新安排的资源，与实际收付款变化，分别核算\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-13\">第13课\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>语义层/本体\u003c/td>\n\u003ctd>对业务对象、关系和允许动作的共同表示\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-17\">第17课\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>对同一概念，各产品的具体实现可能不同。评估方案时，请对方用当前业务材料说明它实际取得、决定和改变了什么。\u003c/p>\n","exportMd":"# 概念索引\n\n这里提供回查入口。首次学习仍建议阅读概念所在正文，理解其机制与条件。\n\n| 概念 | 在本课中的含义 | 解释位置 |\n|---|---|---|\n| 基础模型 | 在广泛材料上训练，可适配多类任务的模型；企业用途还需条件 | [第1课](#lesson-01)、[第9课](#lesson-09) |\n| 数字化转型 | 数字技术与信息结构引起的工作、协调及业务变化，具体项目应说明改变什么 | [第2课](#lesson-02) |\n| 互补投入 | 为使技术发挥作用而建设的数据、流程、人员和方法 | [第3课](#lesson-03) |\n| 流程瓶颈 | 在说明的任务与资源条件下，限制整条工作链完成量的环节 | [第3课](#lesson-03) |\n| 价值获取 | 企业通过价格、销量、留存或成本等方式保留所创造价值的一部分 | [第4课](#lesson-04) |\n| FDE | 嵌入现场，连接问题发现、工程实现、部署与反馈的角色/工作方式；机构定义有差异 | [第5课](#lesson-05) |\n| 价值假设 | 某种变化通过明确机制改善工作或经营的可检验解释 | [第6—7课](#lesson-07) |\n| 业务对象 | 企业持续追踪的事物，如客户、询价和订单，可关联记录与动作 | [第8课](#lesson-08) |\n| 上下文 | 模型本次运行可使用的要求、资料、历史与工具返回 | [第9课](#lesson-09) |\n| RAG | 先检索相关材料，再提供给模型生成的安排 | [第9课](#lesson-09) |\n| 微调 | 用专门样本继续训练，改变模型参数 | [第9课](#lesson-09) |\n| 工作流 | 主要路径由程序安排，可在其中调用模型 | [第10课](#lesson-10) |\n| Agent | 模型在给定范围内参与选择动作，并根据反馈继续任务的系统 | [第10课](#lesson-10) |\n| API / MCP | 软件调用入口，以及向AI应用提供工具与资源的一类协议；不自动授予权限 | [第10课](#lesson-10) |\n| Harness | 支持持续任务、工具、状态、检查与恢复的运行框架 | [第10课](#lesson-10) |\n| 幂等 | 对同一业务请求重复提交时，避免重复产生业务效果的设计 | [第10课](#lesson-10) |\n| 覆盖率与条件正确率 | 能承担的任务比例，以及已给出结果中合格的比例；还需看错误后果 | [第12课](#lesson-12) |\n| 容量与现金 | 可重新安排的资源，与实际收付款变化，分别核算 | [第13课](#lesson-13) |\n| 语义层/本体 | 对业务对象、关系和允许动作的共同表示 | [第17课](#lesson-17) |\n\n对同一概念，各产品的具体实现可能不同。评估方案时，请对方用当前业务材料说明它实际取得、决定和改变了什么。\n","exportSingleMd":"# 概念索引\n\n这里提供回查入口。首次学习仍建议阅读概念所在正文，理解其机制与条件。\n\n| 概念 | 在本课中的含义 | 解释位置 |\n|---|---|---|\n| 基础模型 | 在广泛材料上训练，可适配多类任务的模型；企业用途还需条件 | [第1课](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-01)、[第9课](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-09) |\n| 数字化转型 | 数字技术与信息结构引起的工作、协调及业务变化，具体项目应说明改变什么 | [第2课](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-02) |\n| 互补投入 | 为使技术发挥作用而建设的数据、流程、人员和方法 | [第3课](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-03) |\n| 流程瓶颈 | 在说明的任务与资源条件下，限制整条工作链完成量的环节 | [第3课](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-03) |\n| 价值获取 | 企业通过价格、销量、留存或成本等方式保留所创造价值的一部分 | [第4课](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-04) |\n| FDE | 嵌入现场，连接问题发现、工程实现、部署与反馈的角色/工作方式；机构定义有差异 | [第5课](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-05) |\n| 价值假设 | 某种变化通过明确机制改善工作或经营的可检验解释 | [第6—7课](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-07) |\n| 业务对象 | 企业持续追踪的事物，如客户、询价和订单，可关联记录与动作 | [第8课](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-08) |\n| 上下文 | 模型本次运行可使用的要求、资料、历史与工具返回 | [第9课](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-09) |\n| RAG | 先检索相关材料，再提供给模型生成的安排 | [第9课](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-09) |\n| 微调 | 用专门样本继续训练，改变模型参数 | [第9课](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-09) |\n| 工作流 | 主要路径由程序安排，可在其中调用模型 | [第10课](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-10) |\n| Agent | 模型在给定范围内参与选择动作，并根据反馈继续任务的系统 | [第10课](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-10) |\n| API / MCP | 软件调用入口，以及向AI应用提供工具与资源的一类协议；不自动授予权限 | [第10课](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-10) |\n| Harness | 支持持续任务、工具、状态、检查与恢复的运行框架 | [第10课](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-10) |\n| 幂等 | 对同一业务请求重复提交时，避免重复产生业务效果的设计 | [第10课](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-10) |\n| 覆盖率与条件正确率 | 能承担的任务比例，以及已给出结果中合格的比例；还需看错误后果 | [第12课](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-12) |\n| 容量与现金 | 可重新安排的资源，与实际收付款变化，分别核算 | [第13课](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-13) |\n| 语义层/本体 | 对业务对象、关系和允许动作的共同表示 | [第17课](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-17) |\n\n对同一概念，各产品的具体实现可能不同。评估方案时，请对方用当前业务材料说明它实际取得、决定和改变了什么。\n","text":"# 概念索引\n\n这里提供回查入口。首次学习仍建议阅读概念所在正文，理解其机制与条件。\n\n| 概念 | 在本课中的含义 | 解释位置 |\n|---|---|---|\n| 基础模型 | 在广泛材料上训练，可适配多类任务的模型；企业用途还需条件 | 第1课、第9课 |\n| 数字化转型 | 数字技术与信息结构引起的工作、协调及业务变化，具体项目应说明改变什么 | 第2课 |\n| 互补投入 | 为使技术发挥作用而建设的数据、流程、人员和方法 | 第3课 |\n| 流程瓶颈 | 在说明的任务与资源条件下，限制整条工作链完成量的环节 | 第3课 |\n| 价值获取 | 企业通过价格、销量、留存或成本等方式保留所创造价值的一部分 | 第4课 |\n| FDE | 嵌入现场，连接问题发现、工程实现、部署与反馈的角色/工作方式；机构定义有差异 | 第5课 |\n| 价值假设 | 某种变化通过明确机制改善工作或经营的可检验解释 | 第6—7课 |\n| 业务对象 | 企业持续追踪的事物，如客户、询价和订单，可关联记录与动作 | 第8课 |\n| 上下文 | 模型本次运行可使用的要求、资料、历史与工具返回 | 第9课 |\n| RAG | 先检索相关材料，再提供给模型生成的安排 | 第9课 |\n| 微调 | 用专门样本继续训练，改变模型参数 | 第9课 |\n| 工作流 | 主要路径由程序安排，可在其中调用模型 | 第10课 |\n| Agent | 模型在给定范围内参与选择动作，并根据反馈继续任务的系统 | 第10课 |\n| API / MCP | 软件调用入口，以及向AI应用提供工具与资源的一类协议；不自动授予权限 | 第10课 |\n| Harness | 支持持续任务、工具、状态、检查与恢复的运行框架 | 第10课 |\n| 幂等 | 对同一业务请求重复提交时，避免重复产生业务效果的设计 | 第10课 |\n| 覆盖率与条件正确率 | 能承担的任务比例，以及已给出结果中合格的比例；还需看错误后果 | 第12课 |\n| 容量与现金 | 可重新安排的资源，与实际收付款变化，分别核算 | 第13课 |\n| 语义层/本体 | 对业务对象、关系和允许动作的共同表示 | 第17课 |\n\n对同一概念，各产品的具体实现可能不同。评估方案时，请对方用当前业务材料说明它实际取得、决定和改变了什么。\n"},{"file":"延伸阅读.md","id":"reading","number":null,"role":"参考","part":-1,"title":"研究与延伸阅读","md":"# 研究与延伸阅读\n\n以下材料帮助追查关键研究和继续学习。正文为独立撰写的企业分析与教学解释，不以任一本参考书的目录组织课程。\n\n## AI与数字化\n\n- [Stanford CRFM：On the Opportunities and Risks of Foundation Models](https://arxiv.org/abs/2108.07258)，2021。理解广泛训练、任务适配和下游影响；它是基础性报告，不代表2026年的模型能力排名。对应第1、9课。\n- [OECD：Understanding Digital Transformation](https://www.oecd.org/en/publications/going-digital-shaping-policies-improving-lives_9789264312012-en/full-report/component-6.html)，2019。区分信息数字化、技术应用与更广泛的转型影响。对应第2课。\n\n## 生产率与企业收益\n\n- [Brynjolfsson、Rock、Syverson：The Productivity J-Curve](https://www.aeaweb.org/articles?id=10.1257/mac.20180386)，2021正式发表；[2018工作论文作者机构版](https://ide.mit.edu/sites/default/files/publications/jcurve.pdf)。讨论无形互补投资与宏观生产率测量，不能据此保证某个项目回本。对应第3课。\n- [Brynjolfsson、Li、Raymond：Generative AI at Work](https://doi.org/10.1093/qje/qjae044)，QJE 2025；[作者版](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)。本课程采用5,172名客服、每小时解决问题数平均改善15%的发表版本，避免与早期工作论文的样本和数值混用。对应第3、12课。\n- [HBS：Navigating the Jagged Technological Frontier](https://aiinstitute.hbs.edu/navigating-the-jagged-technological-frontier/)，2023研究介绍。解释任务不同，AI帮助与限制可以不同；该研究涉及758名咨询人员，不能作为所有企业的统一提效比例。对应第7、12课。\n- [METR：Early-2025 Experienced Open-Source Developer Study](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)及[2026-02-24研究更新](https://metr.org/blog/2026-02-24-uplift-update/)。前者16名开发者、246任务的完成时间结果，与后续存在选择偏差的新估计应分开理解。对应第3、12课。\n\n## FDE的角色和发展\n\n- [Palantir：Forward Deployed Software Engineer职责](https://jobs.lever.co/palantir/7ea66860-ae93-4139-9388-b7284cb33f37)，2026-10-24读取。看现场协作、定制应用与部署如何结合；职位页面以后可能变化。对应第5课。\n- [AWS：Forward Deployed Engineering说明](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)，2026-10-24读取。看共同建设与客户独立运行的交付定位，内容属于厂商自述。对应第5、16、17课。\n- [Anthropic：Claude Frontier Academy](https://www.anthropic.com/news/claude-frontier-academy)，2026-10-02。看面向工程人员的部署训练与项目实践；其Frontier Deployed Engineer命名与通常的Forward Deployed Engineer应区分。对应第5课。\n\n## 系统和工程\n\n- [Anthropic：Building Effective Agents](https://www.anthropic.com/research/building-effective-agents)，2024。比较工作流与Agent安排，选择由任务及成本决定。对应第10课。\n- [Anthropic：Effective Context Engineering for AI Agents](https://www.anthropic.com/research/effective-context-engineering-for-ai-agents)，2025。理解任务信息的选择与持续维护。对应第9课。\n- [NIST：Generative AI Profile，NIST AI 600-1](https://doi.org/10.6028/NIST.AI.600-1)，2024。供进一步了解跨生命周期的测量、管理与风险问题。对应第12、14课。\n\n## 继续深入的中文材料\n\n- [张汉东：Harness Engineering](https://github.com/ZhangHanDong/harness-engineering-from-cc-to-ai-coding)：了解运行框架和工程控制，适合作为技术团队进阶阅读。\n- [Datawhale：DeepAgents实战](https://github.com/datawhalechina/deepagents-in-action)：了解框架与实验实现，具体实验需核对版本和条件。\n- [范冰：FDE指导书](https://github.com/xdash/FDE-the-Guidance-Book-of-Forward-Deployed-Engineer)：从工程与客户交付一侧对照阅读。\n\n材料读取截至2026-10-24。不同研究的任务、工具、人员和指标不同；课程保留这种差异，并用明确标记的假设案例训练本地判断。\n","html":"\u003ch1>研究与延伸阅读\u003c/h1>\n\u003cp>以下材料帮助追查关键研究和继续学习。正文为独立撰写的企业分析与教学解释，不以任一本参考书的目录组织课程。\u003c/p>\n\u003ch2>AI与数字化\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://arxiv.org/abs/2108.07258\" target=\"_blank\" rel=\"noopener noreferrer\">Stanford CRFM：On the Opportunities and Risks of Foundation Models\u003c/a>，2021。理解广泛训练、任务适配和下游影响；它是基础性报告，不代表2026年的模型能力排名。对应第1、9课。\u003c/li>\n\u003cli>\u003ca href=\"https://www.oecd.org/en/publications/going-digital-shaping-policies-improving-lives_9789264312012-en/full-report/component-6.html\" target=\"_blank\" rel=\"noopener noreferrer\">OECD：Understanding Digital Transformation\u003c/a>，2019。区分信息数字化、技术应用与更广泛的转型影响。对应第2课。\u003c/li>\n\u003c/ul>\n\u003ch2>生产率与企业收益\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://www.aeaweb.org/articles?id=10.1257/mac.20180386\" target=\"_blank\" rel=\"noopener noreferrer\">Brynjolfsson、Rock、Syverson：The Productivity J-Curve\u003c/a>，2021正式发表；\u003ca href=\"https://ide.mit.edu/sites/default/files/publications/jcurve.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">2018工作论文作者机构版\u003c/a>。讨论无形互补投资与宏观生产率测量，不能据此保证某个项目回本。对应第3课。\u003c/li>\n\u003cli>\u003ca href=\"https://doi.org/10.1093/qje/qjae044\" target=\"_blank\" rel=\"noopener noreferrer\">Brynjolfsson、Li、Raymond：Generative AI at W Generative AI at Work](https://doi.org/10.1093/qje/qjae044)，QJE 2025；[作者版](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)。本课程采用5,172名客服、每小时解决问题数平均改善15%的发表版本，避免与早期工作论文的样本和数值混用。对应第3、12课。\n- [HBS：Navigating the Jagged Technological Frontier](https://aiinstitute.hbs.edu/navigating-the-jagged-technological-frontier/)，2023研究介绍。解释任务不同，AI帮助与限制可以不同；该研究涉及758名咨询人员，不能作为所有企业的统一提效比例。对应第7、12课。\n- [METR：Early-2025 Experienced Open-Source Developer Study](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)及[2026-02-24研究更新](https://metr.org/blog/2026-02-24-uplift-update/)。前者16名开发者、246任务的完成时间结果，与后续存在选择偏差的新估计应分开理解。对应第3、12课。\n\n## FDE的角色和发展\n\n- [Palantir：Forward Deployed Software Engineer职责](https://jobs.lever.co/palantir/7ea66860-ae93-4139-9388-b7284cb33f37)，2026-10-24读取。看现场协作、定制应用与部署如何结合；职位页面以后可能变化。对应第5课。\n- [AWS：Forward Deployed Engineering说明](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)，2026-10-24读取。看共同建设与客户独立运行的交付定位，内容属于厂商自述。对应第5、16、17课。\n- [Anthropic：Claude Frontier Academy](https://www.anthropic.com/news/claude-frontier-academy)，2026-10-02。看面向工程人员的部署训练与项目实践；其Frontier Deployed Engineer命名与通常的Forward Deployed Engineer应区分。对应第5课。\n\n## 系统和工程\n\n- [Anthropic：Building Effective Agents](https://www.anthropic.com/research/building-effective-agents)，2024。比较工作流与Agent安排，选择由任务及成本决定。对应第10课。\n- [Anthropic：Effective Context Engineering for AI Agents](https://www.anthropic.com/research/effective-context-engineering-for-ai-agents)，2025。理解任务信息的选择与持续维护。对应第9课。\n- [NIST：Generative AI Profile，NIST AI 600-1](https://doi.org/10.6028/NIST.AI.600-1)，2024。供进一步了解跨生命周期的测量、管理与风险问题。对应第12、14课。\n\n## 继续深入的中文材料\n\n- [张汉东：Harness Engineering](https://github.com/ZhangHanDong/harness-engineering-from-cc-to-ai-coding)：了解运行框架和工程控制，适合作为技术团队进阶阅读。\n- [Datawhale：DeepAgents实战](https://github.com/datawhalechina/deepagents-in-action)：了解框架与实验实现，具体实验需核对版本和条件。\n- [范冰：FDE指导书](https://github.com/xdash/FDE-the-Guidance-Book-of-Forward-Deployed-Engineer)：从工程与客户交付一侧对照阅读。\ Engineer应区分。对应第5课。\n\n## 系统和工程\n\n- [Anthropic：Building Effective Agents](https://www.anthropic.com/research/building-effective-agents)，2024。比较工作流与Agent安排，选择由任务及成本决定。对应第10课。\n- [Anthropic：Effective Context Engineering for AI Agents](https://www.anthropic.com/research/effective-context-engineering-for-ai-agents)，2025。理解任务信息的选择与持续维护。对应第9课。\n- [NIST：Generative AI Profile，NIST AI 600-1](https://doi.org/10.6028/NIST.AI.600-1)，2024。供进一步了解跨生命周期的测量、管理与风险问题。对应第12、14课。\n\n## 继续深入的中文材料\n\n- [张汉东：Harness Engineering](https://github.com/ZhangHanDong/harness-engineering-from-cc-to-ai-coding)：了解运行框架和工程控制，适合作为技术团队进阶阅读。\n- [Datawhale：DeepAgents实战](https://github.com/datawhalechina/deepagents-in-action)：了解框架与实验实现，具体实验需核对版本和条件。\n- [范冰：FDE指导书](https://github.com/xdash/FDE-the-Guidance-Book-of-Forward-Deployed-Engineer)：从工程与客户交付一侧对照阅读。\n\n材料读取截至2026-10-24。不同研究的任务、工具、人员和指标不同；课程保留这种差异，并用明确标记的假设案例训练本地判断。\n","text":"# 研究与延伸阅读\n\n以下材料帮助追查关键研究和继续学习。正文为独立撰写的企业分析与教学解释，不以任一本参考书的目录组织课程。\n\n## AI与数字化\n\n- Stanford CRFM：On the Opportunities and Risks of Foundation Models，2021。理解广泛训练、任务适配和下游影响；它是基础性报告，不代表2026年的模型能力排名。对应第1、9课。\n- OECD：Understanding Digital Transformation，2019。区分信息数字化、技术应用与更广泛的转型影响。对应第2课。\n\n## 生产率与企业收益\n\n- Brynjolfsson、Rock、Syverson：The Productivity J-Curve，2021正式发表；2018工作论文作者机构版。讨论无形互补投资与宏观生产率测量，不能据此保证某个项目回本。对应第3课。\n- Brynjolfsson、Li、Raymond：Generative AI at Work，QJE 2025；作者版。本课程采用5,172名客服、每小时解决问题数平均改善15%的发表版本，避免与早期工作论文的样本和数值混用。对应第3、12课。\n- HBS：Navigating the Jagged Technological Frontier，2023研究介绍。解释任务不同，AI帮助与限制可以不同；该研究涉及758名咨询人员，不能作为所有企业的统一提效比例。对应第7、12课。\n- METR：Early-2025 Experienced Open-Source Developer Study及2026-02-24研究更新。前者16名开发者、246任务的完成时间结果，与后续存在选择偏差的新估计应分开理解。对应第3、12课。\n\n## FDE的角色和发展\n\n- Palantir：Forward Deployed Software Engineer职责，2026-10-24读取。看现场协作、定制应用与部署如何结合；职位页面以后可能变化。对应第5课。\n- AWS：Forward Deployed Engineering说明，2026-10-24读取。看共同建设与客户独立运行的交付定位，内容属于厂商自述。对应第5、16、17课。\n- Anthropic：Claude Frontier Academy，2026-10-02。看面向工程人员的部署训练与项目实践；其Frontier Deployed Engineer命名与通常的Forward Deployed Engineer应区分。对应第5课。\n\n## 系统和工程\n\n- Anthropic：Building Effective Agents，2024。比较工作流与Agent安排，选择由任务及成本决定。对应第10课。\n- Anthropic：Effective Context Engineering for AI Agents，2025。理解任务信息的选择与持续维护。对应第9课。\n- NIST：Generative AI Profile，NIST AI 600-1，2024。供进一步了解跨生命周期的测量、管理与风险问题。对应第12、14课。\n\n## 继续深入的中文材料\n\n- 张汉东：Harness Engineering：了解运行框架和工程控制，适合作为技术团队进阶阅读。\n- Datawhale：DeepAgents实战：了解框架与实验实现，具体实验需核对版本和条件。\n- 范冰：FDE指导书：从工程与客户交付一侧对照阅读。\n\n材料读取截至2026-10-24。不同研究的任务、工具、人员和指标不同；课程保留这种差异，并用明确标记的假设案例训练本地判断。\n"},{"file":"工作簿-改造提案.md","id":"workbook","number":null,"role":"工作簿","part":-1,"title":"工作簿｜一份可以拿到项目会上讨论的提案","md":"# 工作簿｜一份可以拿到项目会上讨论的提案\n\n建议先用案例A填写，再换成自己的业务。每栏可以写“未知”，同时注明需要什么证据。完成填写只表示形成草案，是否值得实施还需实际材料与相关负责人判断。\n\n## 1．问题与客户价值\n\n- 这项业务为哪类客户完成什么任务：\n- 当前最重要的结果问题，起点、终点及观察范围：\n- 已取得的原始任务、时间记录、返工和结果：\n- 技术发展可能改变哪一段条件：\n- 客户怎样受益，企业通过什么路径获得收益：\n\n## 2．诊断与竞争解释\n\n| 当前观察 | 主要解释 | 其他可能解释 | 区分解释需要的证据 |\n|---|---|---|---|\n| 待填写 | 待填写 | 待填写 | 待填写 |\n\n可参考案例A：替换适配准备周期较长，可能由信息缺项导致，也可能由优先级、供应或审批造成。下一轮应比较完整与缺项任务，并拆分技术前后等待。\n\n## 3．新的业务链\n\n| 收到的材料/对象 | 谁处理 | AI、程序和人的具体动作 | 留下什么结果 | 谁接手、凭什么继续 |\n|---|---|---|---|---|\n| 待填写 | 待填写 | 待填写 | 待填写 | 待填写 |\n\n- 哪些旧动作退出，哪些新增：\n- 哪些是事实、建议、决定、执行和对外承诺：\n- 当前资料与权限从哪里取得：\n- 输入变化时，哪些后续结果需要重新确认：\n\n## 4．试点与验证\n\n- 主要价值假设：\n- 本轮任务范围和不覆盖的责任：\n- 普通、模糊及重要异常分别用什么材料检验：\n- 相同任务下的人工/现有软件/AI比较方法：\n- 模型、系统、工作和经营各观察什么：\n- 继续、调整与停止条件：\n\n检验时可以使用案例A的库存变化：原回执4套，批准前变为2套且未预留。提案应能解释哪些结果失效、谁处理，以及对外承诺怎样保持准确。\n\n## 5．完整投入账\n\n| 项目 | 数量与单位 | 采用/测量依据 | 实际、预测或未知 |\n|---|---|---|---|\n| 月度同类任务量与覆盖率 | 待填写 | 待填写 | 待填写 |\n| 现行完整人工时间 | 待填写 | 待填写 | 待填写 |\n| 新方法人工准备、核对、修改和异常 | 待填写 | 待填写 | 待填写 |\n| 可实际取消的支出 | 待填写 | 待填写 | 待填写 |\n| 释放但未兑现的人员容量 | 待填写 | 待填写 | 待填写 |\n| 一次性开发、准备、集成、培训 | 待填写 | 待填写 | 待填写 |\n| 模型、平台、维护、复测和错误成本 | 待填写 | 待填写 | 待填写 |\n\n- 月度现金净变化：\n- 有条件的新增收益，条件是什么：\n- 最不确定的变量及变化后的采用决定：\n- 谁负责实际兑现收益：\n\n第13课的教学核算可供检查：200小时降为约133.33小时，释放约66.67小时；其中40小时取消外包形成6,000元现金节约，另外约26.67小时仅为内部容量；预测持续现金增量成本4,000元，其中500元明确假设为会实际支付的错误补发运费与退款差额，预测现金净改善2,000元；未发生的预算不记作实际现金。各项时间不重叠，资源估值不能重复加入现金。\n\n## 6．岗位、合作与接手\n\n| 参与者 | 少做/多做什么 | 决策权限与核对依据 | 所需时间及评价 | 接手与替补 |\n|---|---|---|---|---|\n| 待填写 | 待填写 | 待填写 | 待填写 | 待填写 |\n\n- FDE或实施团队承担哪些有界工作：\n- 企业必须提供的材料、人员、权限与决定：\n- 正常任务、规则变更、故障和结果未知怎样接手：\n- 数据、配置、资料、测试与运行说明保存在哪里：\n\n## 7．下一阶段决定\n\n- 本轮形成了哪些有证据的结论：\n- 哪些主张仍然是待验证假设：\n- 下一笔投入将解决哪项约束：\n- 可以复用的资产、成立条件与维护人：\n\n请另一位业务人员先读提案，复述问题、改法和收益。再改变一个重要条件，检查是否能依据材料重新判断。讨论所得差异应写回对应栏，而不只保留在会议记忆里。\n","html":"\u003ch1>工作簿｜一份可以拿到项目会上讨论的提案\u003c/h1>\n\u003cp>建议先用案例A填写，再换成自己的业务。每栏可以写“未知”，同时注明需要什么证据。完成填写只表示形成草案，是否值得实施还需实际材料与相关负责人判断。\u003c/p>\n\u003ch2>1．问题与客户价值\u003c/h2>\n\u003cul>\n\u003cli>这项业务为哪类客户完成什么任务：\u003c/li>\n\u003cli>当前最重要的结果问题，起点、终点及观察范围：\u003c/li>\n\u003cli>已取得的原始任务、时间记录、返工和结果：\u003c/li>\n\u003cli>技术发展可能改变哪一段条件：\u003c/li>\n\u003cli>客户怎样受益，企业通过什么路径获得收益：\u003c/li>\n\u003c/ul>\n\u003ch2>2．诊断与竞争解释\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>当前观察\u003c/th>\n\u003cth>主要解释\u003c/th>\n\u003cth>其他可能解释\u003c/th>\n\u003cth>区分解释需要的证据\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>可参考案例A：替换适配准备周期较长，可能由信息缺项导致，也可能由优先级、供应或审批造成。下一轮应比较完整与缺项任务，并拆分技术前后等待。\u003c/p>\n\u003ch2>3．新的业务链\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>收到的材料/对象\u003c/th>\n\u003cth>谁处理\u003c/th>\n\u003cth>AI、程序和人的具体动作\u003c/th>\n\u003cth>留下什么结果\u003c/th>\n\u003cth>谁接手、凭什么继续\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\n\u003cli>哪些旧动作退出，哪些新增：\u003c/li>\n\u003cli>哪些是事实、建议、决定、执行和对外承诺：\u003c/li>\n\u003cli>当前资料与权限从哪里取得：\u003c/li>\n\u003cli>输入变化时，哪些后续结果需要重新确认：\u003c/li>\n\u003c/ul>\n\ const {pages,parts}=COURSE;
const pageMap=Object.fromEntries(pages.map(p=>[p.id,p]));
const storeKey='gaidn-fde-course-20261024';
let active='home',restorePosition=false,scrollTimer=null;
const main=document.getElementById('main'),sidebar=document.getElementById('sidebar'),overlay=document.getElementById('overlay');
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function readState(){try{const d=JSON.parse(localStorage.getItem(storeKey));return d&&pageMap[d.id]?d:null}catch{return null}}
function saveState(){if(!pageMap[active])return;try{localStorage.setItem(storeKey,JSON.stringify({id:active,y:Math.max(0,window.scrollY),at:Date.now()}))}catch{}}
function menu(open){const wasOpen=sidebar.classList.contains('open');sidebar.classList.toggle('open',open);overlay.classList.toggle('open',open);document.getElementById('menu-toggle').setAttribute('aria-expanded',String(open));if(open)sidebar.querySelector('input').focus();else if(wasOpen)document.getElementById('menu-toggle').focus()}
document.getElementById('menu-toggle').onclick=()=>menu(!sidebar.classList.contains('open'));
document.getElementById('menu-close').onclick=()=>menu(false);overlay.onclick=()=>menu(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape')menu(false)});
function renderCatalog(){document.getElementById('catalog').innerHTML=`<a href="#home">课程首页</a><a href="#intro">导学 · 从这里开始</a><h2>五部分 · 18课</h2>`+parts.map((p,i)=>`<details data-part="${i}" ${i===0?'open':''}><summary>${['一','二','三','四','五'][i]} · ${p.title}</summary>${pages.filter(x=>x.part===i).map(x=>`<a href="#${x.id}">${esc(x.title.replace(/^第\d+课｜/,''))}</a>`).join('')}</details>`).join('')+`<h2>案例、工作与回查</h2>`+['case-a','case-b','case-c','workbook','glossary','reading'].map(id=>`<a href="#${id}">${esc(pageMap[id].title)}</a>`).join('');}
renderCatalog();
function updateCatalog(){document.querySelectorAll('#catalog a').forEach(a=>{if(a.hash==='#'+active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});if(pageMap[active]?.part>=0)document.querySelector(`details[data-part="${pageMap[active].part}"]`).open=true;}
function home(migration=''){
const state=readState();main.innerHTML=`<section class="home">${migration?`<div class="migration" role="status">${esc(migration)}</div>`:''}<div class="hero"><p class="eyebrow">企业视角的完整课程 · 2026</p><h1>企业 AI 转型与 FDE</h1><p class="sub">技术变化、业务重构与组织能力</p><p class="lead">理解 AI 如何改变企业，选择值得投入的业务改造，并借助 FDE 把通用能力转为可以采用、运行和积累的工作方式。</p><div class="actions"><a class="button primary" href="#intro">从头学习 →</a>${state?'<button id="resume">继续阅读</button>':''}<a class="button" href="#workbook">打开改造提案</a></div>${state?`<p class="search-note">上次读到：${esc(pageMap[state.id].title)}</p>`:''}</div><p class="section-label">一条从技术变化走向企业能力的路径</p><div class="route-list">${parts.map((p,i)=>`<a class="route-row" href="#lesson-${String(p.from).padStart(2,'0')}"><span class="n">0${i+1}</span><div><h2>${p.title}</h2><p>${p.description} · 第${p.from}—${p.to}课</p></div><span aria-hidden="true">→</span></a>`).join('')}</div><section class="resources"><p class="section-label">带着材料推演，再回到自己的业务</p><div class="resource-links"><a href="#case-a">工业服务案例</a><a href="#case-b">专业服务案例</a><a href="#case-c">门店服务案例</a><a href="#glossary">概念回查</a></div></section><p class="fineprint">18课 · 3份案例卷宗 · 改造提案工作簿<br>案例采用标明的教学材料与假设数字。阅读进度只保存在本机，表示阅读位置。<br><a href="index.html" download="企业AI转型与FDE-离线阅读.html">下载离线阅读版</a> · <button class="quiet" data-download="book">下载完整可编辑稿</button></p></section>`;
if(state)document.getElementById('resume').onclick=()=>{restorePosition=true;location.hash=state.id;};
}
function reader(page){const sequential=pages.filter(p=>p.number!==null);const i=sequential.findIndex(p=>p.id===page.id),prev=i>0?sequential[i-1]:null,next=i>=0?sequential[i+1]:null;const kicker=page.part>=0?`${['一','二','三','四','五'][page.part]} · ${parts[page.part].title} / ${page.number} / 18`:page.role;
 main.innerHTML=`<div class="reading"><p class="eyebrow">${kicker}</p><div class="reader-tools"><a href="#home">课程首页</a><button class="quiet" data-download="${page.id==='workbook'?'workbook':'current'}">下载${page.id==='workbook'?'工作簿':'本篇'}</button><button class="quiet" id="print-current">打印本篇</button><button class="quiet" id="print-all">打印全书</button></div><article class="article" id="article">${page.html}</article><nav class="course-nav" aria-label="前后课程">${prev?`<a href="#${prev.id}"><small>上一课</small>${esc(prev.title)}</a>`:'<a href="#home"><small>返回</small>课程首页</a>'}${next?`<a href="#${next.id}"><small>接着学习 →</small>${esc(next.title)}</a>`:'<a href="#workbook"><small>带回自己的业务 →</small>改造提案工作簿</a>'}</nav><p class="fineprint"><a href="#reading">研究与延伸阅读</a> · <a href="index.html" download="企业AI转型与FDE-离线阅读.html">离线阅读版</a><br>GAIDN · 2026-10-24 全新课程</p></div>`;
 document.getElementById('print-current').onclick=()=>window.print();document.getElementById('print-all').onclick=()=>{document.getElementById('print-book').innerHTML=pages.map(p=>`<article class="article">${p.html}</article>`).join('');document.body.classList.add('print-all');window.print();};}
window.addEventListener('afterprint',()=>document.body.classList.remove('print-all'));
function route(){saveState();let raw;try{raw=decodeURIComponent(location.hash.slice(1))}catch{raw='unknown'}active=raw||'home';let message='';if(/^c\d+/i.test(active)){active='home';message='课程已从头重构，原章节编号不再沿用。请从新版导学开始，或使用目录和搜索查找。';}else if(active!=='home'&&!pageMap[active]){active='home';message='这个阅读位置未找到，可以从新版导学或目录继续。';}const state=readState();if(active==='home'){home(message);document.title='企业 AI 转型与 FDE · GAIDN'}else{reader(pageMap[active]);document.title=pageMap[active].title+' · 企业 AI 转型与 FDE'}updateCatalog();menu(false);const y=restorePosition&&state?.id===active?state.y:0;restorePosition=false;window.scrollTo(0,y);if(active!=='home'&&!y)saveState();main.focus({preventScroll:true});}
document.addEventListener('click',e=>{const dl=e.target.closest('[data-download]');if(!dl)return;const kind=dl.dataset.download;let text,name;if(kind==='book'){text=pages.map(p=>`<a id="${p.id}"></a>\n\n${p.exportMd}`).join('\n\n---\n\n');name='企业AI转型与FDE-完整稿.md';}else{const p=kind==='workbook'?pageMap.workbook:pageMap[active];text=p.exportSingleMd;name=p.file;}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);});
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLocaleLowerCase(),out=document.getElementById('search-results');document.getElementById('catalog').hidden=Boolean(q);if(!q){out.innerHTML='';return;}const terms=q.split(/\s+/);const matches=pages.filter(p=>terms.every(t=>(p.title+' '+p.text).toLocaleLowerCase().includes(t)));out.innerHTML=`<p class="search-note">全部课程与案例 · ${matches.length}篇</p>`+(matches.length?matches.map(p=>`<a class="search-hit" href="#${p.id}"><small>${p.role}${p.part>=0?' · '+parts[p.part].title:''}</small>${esc(p.title)}</a>`).join(''):'<p class="empty">没有找到对应内容。可以试试“投入”“权限”或“资料”。</p>');});
window.addEventListener('hashchange',route);window.addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(saveState,160)},{passive:true});window.addEventListener('pagehide',saveState);route();
</script>
</body></html>
