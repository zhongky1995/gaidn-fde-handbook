n| 人员频繁绕开 | 研究额外负担和任务不匹配 |\n| 感觉更快但总工时增加 | 测量核验、返工和衔接成本 |\n\n同一发现可以指向多个原因，需继续用材料区分。\n\n## 让业务人员进入判断，而非只参加需求会\n\n业务负责人需要决定什么结果值得改善，专业人员需要解释哪些差别重要，工程人员需要把认识实现。三者在原型采用与修改中持续相遇，才能形成有效往返。\n\n原型也可以促使企业改变原提问。例如工单写作困难的背后，可能是实际处置记录缺失；日报负担背后，可能是决定所需情境未被保留。改变问题不应被视为项目跑偏，前提是能说明新问题与原经营目标的关系。\n\nZara的现场实施研究展示了业务规则进入工程的必要性；METR的任务研究则提醒我们，使用者觉得更快与实际耗时可能不同。二者都支持以真实工作而非流畅演示检验认识。现场案例、任务研究\n\n## 原型之后应留下什么\n\n除了可操作功能，还应留下本轮假设、取得的观察、已经改变的认识，以及下一轮还需区分的问题。它们帮助团队避免每次从需求清单重新开始。\n\n这类现场往返需要明确投入边界。并非所有问题都值得同时解决，也不能把长期探索当作持续没有交付的理由。选择下一项试点，应看它能否影响真实业务，并改变下一步投资判断。\n"},{"file":"16-试点与学习价值.md","id":"lesson-16","number":16,"role":"核心课","part":2,"title":"第16章｜先做哪个试点，才会影响下一步选择","md":"# 第16章｜先做哪个试点，才会影响下一步选择\n\n企业同时看到三个AI机会：自动写日报；让现场信息帮助备货；直接由AI协调全网分配。第一个容易展示，第三个最有想象力，中间一个看起来没有那么完整。\n\n如果只按容易成功或技术先进排序，很难解释该先做哪一个。试点还承担另一项工作：减少会改变下一步选择的不确定性。\n\n**一个好试点，既接近值得发展的业务价值，也有机会让关键假设被证据改变。** 结束时，企业应更清楚继续什么、改变什么或停止什么。\n\n## 先问成功以后，企业会知道什么\n\n自动日报若成功，可以证明整理工作的一部分能够减少。它未必证明现场信息会改善分配，也未必证明企业形成了可复用经验。\n\n全网自主调配即使短期结果不错，也可能难以区分原因：同期需求变化、人员额外照顾、配送调整与模型建议都在发生。范围很大，不等于认识更清楚。\n\n让两店的售罄与现场事件进入候选分配，再追踪采用、执行和结果，更有机会辨认本轮关心的关系：哪些事实有用，建议能否采用，实际约束在哪里。但这个选择也有前提——企业能拿到必要结果，且投入可承受。\n\n## 把不确定性翻译成可观察差别\n\n“AI能不能帮助企业转型”过大，难以用一项试点回答。可以缩成更具体的问题：“补入售罄时点与事件后，决定是否不同；不同决定能否执行；结果是否比合理替代更好。”\n\n其中任何一段失败，下一步都可能改变。如果决定不变，可能是信息没增量；如果决定改善但执行不了，可能该改资源安排；如果结果无法观察，可能应先补反馈。\n\n| 试点结果 | 可以形成的认识 | 下一步可能选择 |\n|---|---|---|\n| 材料更全，但决定无变化 | 尚未体现增量，或关键事实未选对 | 调整假设或停止该方向 |\n| 决定变化，实际未执行 | 实现与采用存在断点 | 处理职责、工具或资源 |\n| 有执行，无法追踪结果 | 暂不能判断业务效果 | 补结果关联 |\n| 结果改善且条件可说明 | 有进一步验证与扩展依据 | 扩任务、接任或迁移检验 |\n\n这些不是自动决策规则，而是帮助团队提前说明证据怎样影响选择。\n\n## 小范围不等于小到没有代表性\n\n只用最好整理、最愿配合的人和最简单任务，试点会高估后续采用。适当包含常规、例外和资料缺项，更能暴露实际条件。\n\n但扩大范围也会增加干扰。教学连锁两店共用中央库存，一店多配可能挤占另一店。即使X销量增加，也要看全网变化，不能把转移来的销量当净增长。真正的业务比较将在后面专门展开。\n\n反馈周期同样重要。某些服务结果要很久才能看见，不能要求一周证明长期价值。可以先检查较近的必要条件，同时保留对最终结果的跟踪。\n\n## 失败怎样才有学习价值\n\n如果试点开始前没有具体问题，结束后所有结果都可被解释为“有收获”，学习就很难检验。\n\n真正的学习价值应能指出原先可能怎样选择，现在因哪项观察改变了选择。例如发现主要瓶颈是配送后，企业减少模型扩展投入，转而研究配送；或者发现现成软件同样有效，就选择成本更低的替代。\n\nMarch的探索与利用研究说明，试新办法与改善现有办法争用资源、回报节奏不同。它支持有意识地安排探索，却不导出固定试点预算或时长。[原始研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)\n\n## 为下一步保留能力\n\n一项试点还可能形成可复用任务、有效评价材料和内部理解。这些成果可以帮助企业更快判断下一项技术，但需要在后续使用中检验。\n\n所以试点结论应同时回答：当期发现了什么价值，哪些假设仍未知，留下什么可再用能力，下一项选择如何发生。它为持续发展打开路径，而不是必须按原计划一路扩到全自动。\n","html":"\u003ch1>第16章｜先做哪个试点，才会影响下一步选择\u003c/h1>\n\u003cp>企业同时看到三个AI机会：自动写日报；让现场信息帮助备货；直接由AI协调全网分配。第一个容易展示，第三个最有想象力，中间一个看起来没有那么完整。\u003c/p>\n\u003cp>如果只按容易成功或技术先进排序，很难解释该先做哪一个。试点还承担另一项工作：减少会改变下一步选择的不确定性。\u003c/p>\n\u003cp>\u003cstrong>一个好试点，既接近值得发展的业务价值，也有机会让关键假设被证据改变。\u003c/strong> 结束时，企业应更清楚继续什么、改变什么或停止什么。\u003c/p>\n\u003ch2 id=\"lesson-16-section-1\">先问成功以后，企业会知道什么\u003c/h2>\n\u003cp>自动日报若成功，可以证明整理工作的一部分能够减少。它未必证明现场信息会改善分配，也未必证明企业形成了可复用经验。\u003c/p>\n\u003cp>全网自主调配即使短期结果不错，也可能难以区分原因：同期需求变化、人员额外照顾、配送调整与模型建议都在发生。范围很大，不等于认识更清楚。\u003c/p>\n\u003cp>让两店的售罄与现场事件进入候选分配，再追踪采用、执行和结果，更有机会辨认本轮关心的关系：哪些事实有用，建议能否采用，实际约束在哪里。但这个选择也有前提——企业能拿到必要结果，且投入可承受。\u003c/p>\n\u003ch2 id=\"lesson-16-section-2\">把不确定性翻译成可观察差别\u003c/h2>\n\u003cp>“AI能不能帮助企业转型”过大，难以用一项试点回答。可以缩成更具体的问题：“补入售罄时点与事件后，决定是否不同；不同决定能否执行；结果是否比合理替代更好。”\u003c/p>\n\u003cp>其中任何一段失败，下一步都可能改变。如果决定不变，可能是信息没增量；如果决定改善但执行不了，可能该改资源安排；如果结果无法观察，可能应先补反馈。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>试点结果\u003c/th>\n\u003cth>可以形成的认识\u003c/th>\n\u003cth>下一步可能选择\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>材料更全，但决定无变化\u003c/td>\n\u003ctd>尚未体现增量，或关键事实未选对\u003c/td>\n\u003ctd>调整假设或停止该方向\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>决定变化，实际未执行\u003c/td>\n\u003ctd>实现与采用存在断点\u003c/td>\n\u003ctd>处理职责、工具或资源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>有执行，无法追踪结果\u003c/td>\n\u003ctd>暂不能判断业务效果\u003c/td>\n\u003ctd>补结果关联\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结果改善且条件可说明\u003c/td>\n\u003ctd>有进一步验证与扩展依据\u003c/td>\n\u003ctd>扩任务、接任或迁移检验\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>这些不是自动决策规则，而是帮助团队提前说明证据怎样影响选择。\u003c/p>\n\u003ch2 id=\"lesson-16-section-3\">小范围不等于小到没有代表性\u003c/h2>\n\u003cp>只用最好整理、最愿配合的人和最简单任务，试点会高估后续采用。适当包含常规、例外和资料缺项，更能暴露实际条件。\u003c/p>\n\u003cp>但扩大范围也会增加干扰。教学连锁两店共用中央库存，一店多配可能挤占另一店。即使X销量增加，也要看全网变化，不能把转移来的销量当净增长。真正的业务比较将在后面专门展开。\u003c/p>\n\u003cp>反馈周期同样重要。某些服务结果要很久才能看见，不能要求一周证明长期价值。可以先检查较近的必要条件，同时保留对最终结果的跟踪。\u003c/p>\n\u003ch2 id=\"lesson-16-section-4\">失败怎样才有学习价值\u003c/h2>\n\u003cp>如果试点开始前没有具体问题，结束后所有结果都可被解释为“有收获”，学习就很难检验。\u003c/p>\n\u003cp>真正的学习价值应能指出原先可能怎样选择，现在因哪项观察改变了选择。例如发现主要瓶颈是配送后，企业减少模型扩展投入，转而研究配送；或者发现现成软件同样有效，就选择成本更低的替代。\u003c/p>\n\u003cp>March的探索与利用研究说明，试新办法与改善现有办法争用资源、回报节奏不同。它支持有意识地安排探索，却不导出固定试点预算或时长。\u003ca href=\"https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-16-section-5\">为下一步保留能力\u003c/h2>\n\u003cp>一项试点还可能形成可复用任务、有效评价材料和内部理解。这些成果可以帮助企业更快判断下一项技术，但需要在后续使用中检验。\u003c/p>\n\u003cp>所以试点结论应同时回答：当期发现了什么价值，哪些假设仍未知，留下什么可再用能力，下一项选择如何发生。它为持续发展打开路径，而不是必须按原计划一路扩到全自动。\u003c/p>\n","headings":[{"id":"lesson-16-section-1","label":"先问成功以后，企业会知道什么"},{"id":"lesson-16-section-2","label":"把不确定性翻译成可观察差别"},{"id":"lesson-16-section-3","label":"小范围不等于小到没有代表性"},{"id":"lesson-16-section-4","label":"失败怎样才有学习价值"},{"id":"lesson-16-section-5","label":"为下一步保留能力"}],"exportMd":"# 第16章｜先做哪个试点，才会影响下一步选择\n\n企业同时看到三个AI机会：自动写日报；让现场信息帮助备货；直接由AI协调全网分配。第一个容易展示，第三个最有想象力，中间一个看起来没有那么完整。\n\n如果只按容易成功或技术先进排序，很难解释该先做哪一个。试点还承担另一项工作：减少会改变下一步选择的不确定性。\n\n**一个好试点，既接近值得发展的业务价值，也有机会让关键假设被证据改变。** 结束时，企业应更清楚继续什么、改变什么或停止什么。\n\n## 先问成功以后，企业会知道什么\n\n自动日报若成功，可以证明整理工作的一部分能够减少。它未必证明现场信息会改善分配，也未必证明企业形成了可复用经验。\n\n全网自主调配即使短期结果不错，也可能难以区分原因：同期需求变化、人员额外照顾、配送调整与模型建议都在发生。范围很大，不等于认识更清楚。\n\n让两店的售罄与现场事件进入候选分配，再追踪采用、执行和结果，更有机会辨认本轮关心的关系：哪些事实有用，建议能否采用，实际约束在哪里。但这个选择也有前提——企业能拿到必要结果，且投入可承受。\n\n## 把不确定性翻译成可观察差别\n\n“AI能不能帮助企业转型”过大，难以用一项试点回答。可以缩成更具体的问题：“补入售罄时点与事件后，决定是否不同；不同决定能否执行；结果是否比合理替代更好。”\n\n其中任何一段失败，下一步都可能改变。如果决定不变，可能是信息没增量；如果决定改善但执行不了，可能该改资源安排；如果结果无法观察，可能应先补反馈。\n\n| 试点结果 | 可以形成的认识 | 下一步可能选择 |\n|---|---|---|\n| 材料更全，但决定无变化 | 尚未体现增量，或关键事实未选对 | 调整假设或停止该方向 |\n| 决定变化，实际未执行 | 实现与采用存在断点 | 处理职责、工具或资源 |\n| 有执行，无法追踪结果 | 暂不能判断业务效果 | 补结果关联 |\n| 结果改善且条件可说明 | 有进一步验证与扩展依据 | 扩任务、接任或迁移检验 |\n\n这些不是自动决策规则，而是帮助团队提前说明证据怎样影响选择。\n\n## 小范围不等于小到没有代表性\n\n只用最好整理、最愿配合的人和最简单任务，试点会高估后续采用。适当包含常规、例外和资料缺项，更能暴露实际条件。\n\n但扩大范围也会增加干扰。教学连锁两店共用中央库存，一店多配可能挤占另一店。即使X销量增加，也要看全网变化，不能把转移来的销量当净增长。真正的业务比较将在后面专门展开。\n\n反馈周期同样重要。某些服务结果要很久才能看见，不能要求一周证明长期价值。可以先检查较近的必要条件，同时保留对最终结果的跟踪。\n\n## 失败怎样才有学习价值\n\n如果试点开始前没有具体问题，结束后所有结果都可被解释为“有收获”，学习就很难检验。\n\n真正的学习价值应能指出原先可能怎样选择，现在因哪项观察改变了选择。例如发现主要瓶颈是配送后，企业减少模型扩展投入，转而研究配送；或者发现现成软件同样有效，就选择成本更低的替代。\n\nMarch的探索与利用研究说明，试新办法与改善现有办法争用资源、回报节奏不同。它支持有意识地安排探索，却不导出固定试点预算或时长。[原始研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)\n\n## 为下一步保留能力\n\n一项试点还可能形成可复用任务、有效评价材料和内部理解。这些成果可以帮助企业更快判断下一项技术，但需要在后续使用中检验。\n\n所以试点结论应同时回答：当期发现了什么价值，哪些假设仍未知，留下什么可再用能力，下一项选择如何发生。它为持续发展打开路径，而不是必须按原计划一路扩到全自动。\n","exportSingleMd":"# 第16章｜先做哪个试点，才会影响下一步选择\n\n企业同时看到三个AI机会：自动写日报；让现场信息帮助备货；直接由AI协调全网分配。第一个容易展示，第三个最有想象力，中间一个看起来没有那么完整。\n\n如果只按容易成功或技术先进排序，很难解释该先做哪一个。试点还承担另一项工作：减少会改变下一步选择的不确定性。\n\n**一个好试点，既接近值得发展的业务价值，也有机会让关键假设被证据改变。** 结束时，企业应更清楚继续什么、改变什么或停止什么。\n\n## 先问成功以后，企业会知道什么\n\n自动日报若成功，可以证明整理工作的一部分能够减少。它未必证明现场信息会改善分配，也未必证明企业形成了可复用经验。\n\n全网自主调配即使短期结果不错，也可能难以区分原因：同期需求变化、人员额外照顾、配送调整与模型建议都在发生。范围很大，不等于认识更清楚。\n\n让两店的售罄与现场事件进入候选分配，再追踪采用、执行和结果，更有机会辨认本轮关心的关系：哪些事实有用，建议能否采用，实际约束在哪里。但这个选择也有前提——企业能拿到必要结果，且投入可承受。\n\n## 把不确定性翻译成可观察差别\n\n“AI能不能帮助企业转型”过大，难以用一项试点回答。可以缩成更具体的问题：“补入售罄时点与事件后，决定是否不同；不同决定能否执行；结果是否比合理替代更好。”\n\n其中任何一段失败，下一步都可能改变。如果决定不变，可能是信息没增量；如果决定改善但执行不了，可能该改资源安排；如果结果无法观察，可能应先补反馈。\n\n| 试点结果 | 可以形成的认识 | 下一步可能选择 |\n|---|---|---|\n| 材料更全，但决定无变化 | 尚未体现增量，或关键事实未选对 | 调整假设或停止该方向 |\n| 决定变化，实际未执行 | 实现与采用存在断点 | 处理职责、工具或资源 |\n| 有执行，无法追踪结果 | 暂不能判断业务效果 | 补结果关联 |\n| 结果改善且条件可说明 | 有进一步验证与扩展依据 | 扩任务、接任或迁移检验 |\n\n这些不是自动决策规则，而是帮助团队提前说明证据怎样影响选择。\n\n## 小范围不等于小到没有代表性\n\n只用最好整理、最愿配合的人和最简单任务，试点会高估后续采用。适当包含常规、例外和资料缺项，更能暴露实际 有办法争用资源、回报节奏不同。它支持有意识地安排探索，却不导出固定试点预算或时长。原始研究\n\n## 为下一步保留能力\n\n一项试点还可能形成可复用任务、有效评价材料和内部理解。这些成果可以帮助企业更快判断下一项技术，但需要在后续使用中检验。\n\n所以试点结论应同时回答：当期发现了什么价值，哪些假设仍未知，留下什么可再用能力，下一项选择如何发生。它为持续发展打开路径，而不是必须按原计划一路扩到全自动。\n"},{"file":"17-智能伙伴的持续职责.md","id":"lesson-17","number":17,"role":"核心课","part":3,"title":"第17章｜把AI当作伙伴，需要给它怎样的工作","md":"# 第17章｜把AI当作伙伴，需要给它怎样的工作\n\n让AI写一份处置说明，与让它持续跟进一张工单，是两种工作。前者可以在一次输入与输出中结束；后者需要发现缺项、取得信息、协调下一步、确认实际结果，并在情况改变后继续处理。\n\n企业说“AI是智能伙伴”，有价值的含义正在这里：把可用智能安排成持续工作的参与者。\n\n**伙伴关系来自可接续的职责、信息、行动与反馈，而非一个拟人化名字。** 企业也不必把AI永久限定在起草环节，委派范围可以随任务证据发展。\n\n## 从一张报修任务看持续职责\n\n在教学设备案例中，客户报告“促销时段间歇停机”。AI首先可以检查设备身份、历史与当前资料，发现负载和发生时间不完整，再提出补问。\n\n资料返回后，它可以组织相关工单，说明相似之处与版本差别，提出需要进一步确认的方向。派工完成后，继续检查是否到场、客户是否恢复，后续是否复发。\n\n这里每一步都依赖外部事实。对话里的“已处理”不能代替派工系统接受，历史工单也不能代替现场结果。持续职责要求工作状态能够在中断后恢复，而不只是连续生成语言。\n\n![持续工单围绕同一项任务取得信息、提出与执行动作、接回结果；记忆支持下一轮，反馈使下一步发生变化。](assets/17-智能伙伴.svg)\n\n## 四类条件缺一项，会发生什么\n\n没有清楚目标，AI可能把写完说明当作结束，而客户仍未恢复。目标应与工作范围一致，例如“把派工前材料准备到可采用”，比一个没有边界的“负责售后”更适合起步。\n\n没有相关记忆，系统每次都要重问，或者只凭通用经验猜测。记忆包括当前任务经过与适用的企业经验，后面会分别解释。\n\n没有行动工具，建议只能停在对话中；有工具却不知道使用范围，也可能重复登记或改错对象。企业要把可用资源与实际决定范围安排清楚。\n\n没有结果反馈，系统无法知道动作是否完成、旧方法是否有效。它可能持续推进一个早已失效的假设，或者把没有回显当成没有执行。\n\n这些条件由业务与工程共同提供。智能伙伴的可用能力，是模型与企业工作条件结合后的表现。\n\n## 伙伴也应帮助产生新认识\n\n如果AI只检索旧答案，它主要是在扩散既有经验。更主动的作用，是发现旧经验解释不了的差别，提出候选原因和可区分观察，帮助团队发展新方法。\n\n例如四张恢复工单中，调整、重启与版本相互混杂。AI可以把这种混杂指出来，建议下一次补齐关键事实。企业再决定资源和实际观察，结果返回后更新认识。新知识因此来自共同工作，不能由AI提出得合理就直接认定。\n\n宝洁的创新实验为AI参与跨专业构思提供了现实证据；Agent工程经验则说明怎样把模型、工具与反馈组织起来。前者不证明长期商业结果，后者也不能代替业务验证。[协作研究](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)、[工程材料](https://www.anthropic.com/research/building-effective-agents)\n\n## 自主程度怎样逐步发展\n\n早期可以只承担资料准备，让使用者检查结果。如果一类常规任务在代表情况中表现可靠，企业可以进一步委派其中的判断与执行；遇到新条件或低把握情况，再回到相应专业支持。\n\n这种安排不要求所有任务走相同路线。简单查询可以直接完成；复杂探索可以允许提出多种候选；对实际动作的委派，则需要相应执行与结果证据。人的参与也应有具体作用，不能只是增加一个形式上的确认按钮。\n\n持续工作并不意味着模型每次都把企业知识永久写进参数。很多记忆来自外部记录，在当前任务中重新读取。企业应根据实际机制判断“记住了什么”，而非依据AI的口头承诺。\n\n## 从一个可检验职责开始\n\n可以先选一项有明确使用者、自然输入和可见结果的职责，例如派工前材料准备、跟踪未完成事项或组织门店异常信息。观察它是否减少重复劳动，是否能在情况变化后接续，是否帮助下一岗位作出更有依据的动作。\n\n当企业能够安排、检查和改进这种智能供给，AI伙伴才从理念进入经营。进一步的问题是，人与AI应当如何共同承担不同阶段的判断。\n","html":"\u003ch1>第17章｜把AI当作伙伴，需要给它怎样的工作\u003c/h1>\n\u003cp>让AI写一份处置说明，与让它持续跟进一张工单，是两种工作。前者可以在一次输入与输出中结束；后者需要发现缺项、取得信息、协调下一步、确认实际结果，并在情况改变后继续处理。\u003c/p>\n\u003cp>企业说“AI是智能伙伴”，有价值的含义正在这里：把可用智能安排成持续工作的参与者。\u003c/p>\n\u003cp>\u003cstrong>伙伴关系来自可接续的职责、信息、行动与反馈，而非一个拟人化名字。\u003c/strong> 企业也不必把AI永久限定在起草环节，委派范围可以随任务证据发展。\u003c/p>\n\u003ch2 id=\"lesson-17-section-1\">从一张报修任务看持续职责\u003c/h2>\n\u003cp>在教学设备案例中，客户报告“促销时段间歇停机”。AI首先可以检查设备身份、历史与当前资料，发现负载和发生时间不完整，再提出补问。\u003c/p>\n\u003cp>资料返回后，它可以组织相关工单，说明相似之处与版本差别，提出需要进一步确认的方向。派工完成后，继续检查是否到场、客户是否恢复，后续是否复发。\u003c/p>\n\u003cp>这里每一步都依赖外部事实。对话里的“已处理”不能代替派工系统接受，历史工单也不能代替现场结果。持续职责要求工作状态能够在中断后恢复，而不只是连续生成语言。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTAwIiB2aWV3Qm94PSIwIDAgMzYwIDUwMCIgcm9sZT0iaW1nIj48dGl0bGU+5oyB57ut5bel5L2c5Zu057uV5ZCM5LiA5Lu75YqhPC90aXRsZT48ZGVzYz7lvZPliY3lt6XljZXkv53mjIHouqvku73kuI7nu4/ov4fvvJvkv6Hmga/jgIHliqjkvZzjgIHnu5Pmnpzov5vlhaXlkIzkuIDmjIHnu63ku7vliqHvvIznu5Pmnpzlj43ppojmlLnlj5jkuIvkuIDmraXjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjUwMCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7mjIHnu63lt6XkvZzlm7Tnu5XlkIzkuIDku7vliqE8L3RleHQ+PHJlY3QgeD0iMjUiIHk9Ijc2IiB3aWR0aD0iMzEwIiBoZWlnaHQ9IjM3OSIgcng 可以把这种混杂指出来，建议下一次补齐关键事实。企业再决定资源和实际观察，结果返回后更新认识。新知识因此来自共同工作，不能由AI提出得合理就直接认定。\u003c/p>\n\u003cp>宝洁的创新实验为AI参与跨专业构思提供了现实证据；Agent工程经验则说明怎样把模型、工具与反馈组织起来。前者不证明长期商业结果，后者也不能代替业务验证。\u003ca href=\"https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702\" target=\"_blank\" rel=\"noopener noreferrer\">协作研究\u003c/a>、\u003ca href=\"https://www.anthropic.com/research/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">工程材料\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-17-section-4\">自主程度怎样逐步发展\u003c/h2>\n\u003cp>早期可以只承担资料准备，让使用者检查结果。如果一类常规任务在代表情况中表现可靠，企业可以进一步委派其中的判断与执行；遇到新条件或低把握情况，再回到相应专业支持。\u003c/p>\n\u003cp>这种安排不要求所有任务走相同路线。简单查询可以直接完成；复杂探索可以允许提出多种候选；对实际动作的委派，则需要相应执行与结果证据。人的参与也应有具体作用，不能只是增加一个形式上的确认按钮。\u003c/p>\n\u003cp>持续工作并不意味着模型每次都把企业知识永久写进参数。很多记忆来自外部记录，在当前任务中重新读取。企业应根据实际机制判断“记住了什么”，而非依据AI的口头承诺。\u003c/p>\n\u003ch2 id=\"lesson-17-section-5\">从一个可检验职责开始\u003c/h2>\n\u003cp>可以先选一项有明确使用者、自然输入和可见结果的职责，例如派工前材料准备、跟踪未完成事项或组织门店异常信息。观察它是否减少重复劳动，是否能在情况变化后接续，是否帮助下一岗位作出更有依据的动作。\u003c/p>\n\u003cp>当企业能够安排、检查和改进这种智能供给，AI伙伴才从理念进入经营。进一步的问题是，人与AI应当如何共同承担不同阶段的判断。\u003c/p>\n","headings":[{"id":"lesson-17-section-1","label":"从一张报修任务看持续职责"},{"id":"lesson-17-section-2","label":"四类条件缺一项，会发生什么"},{"id":"lesson-17-section-3","label":"伙伴也应帮助产生新认识"},{"id":"lesson-17-section-4","label":"自主程度怎样逐步发展"},{"id":"lesson-17-section-5","label":"从一个可检验职责开始"}],"exportMd":"# 第17章｜把AI当作伙伴，需要给它怎样的工作\n\n让AI写一份处置说明，与让它持续跟进一张工单，是两种工作。前者可以在一次输入与输出中结束；后者需要发现缺项、取得信息、协调下一步、确认实际结果，并在情况改变后继续处理。\n\n企业说“AI是智能伙伴”，有价值的含义正在这里：把可用智能安排成持续工作的参与者。\n\n**伙伴关系来自可接续的职责、信息、行动与反馈，而非一个拟人化名字。** 企业也不必把AI永久限定在起草环节，委派范围可以随任务证据发展。\n\n## 从一张报修任务看持续职责\n\n在教学设备案例中，客户报告“促销时段间歇停机”。AI首先可以检查设备身份、历史与当前资料，发现负载和发生时间不完整，再提出补问。\n\n资料返回后，它可以组织相关工单，说明相似之处与版本差别，提出需要进一步确认的方向。派工完成后，继续检查是否到场、客户是否恢复，后续是否复发。\n\n这里每一步都依赖外部事实。对话里的“已处理”不能代替派工系统接受，历史工单也不能代替现场结果。持续职责要求工作状态能够在中断后恢复，而不只是连续生成语言。\n\n![持续工单围绕同一项任务取得信息、提出与执行动作、接回结果；记忆支持下一轮，反馈使下一步发生变化。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTAwI 。派工完成后，继续检查是否到场、客户是否恢复，后续是否复发。\n\n这里每一步都依赖外部事实。对话里的“已处理”不能代替派工系统接受，历史工单也不能代替现场结果。持续职责要求工作状态能够在中断后恢复，而不只是连续生成语言。\n\n![持续工单围绕同一项任务取得信息、提出与执行动作、接回结果；记忆支持下一轮，反馈使下一步发生变化。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTAwIiB2aWV3Qm94PSIwIDAgMzYwIDUwMCIgcm9sZT0iaW1nIj48dGl0bGU+5oyB57ut5bel5L2c5Zu057uV5ZCM5LiA5Lu75YqhPC90aXRsZT48ZGVzYz7lvZPliY3lt6XljZXkv53mjIHouqvku73kuI7nu4/ov4fvvJvkv6Hmga/jgIHliqjkvZzjgIHnu5Pmnpzov5vlhaXlkIzkuIDmjIHnu63ku7vliqHvvIznu5Pmnpzlj43ppojmlLnlj5jkuIvkuIDmraXjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjUwMCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7mjIHnu63lt6XkvZzlm7Tnu5XlkIzkuIDku7vliqE8L3RleHQ+PHJlY3QgeD0iMjUiIHk9Ijc2IiB3aWR0aD0iMzEwIiBoZWlnaHQ9IjM3OSIgcng9IjYiIGZpbGw9IiNlZGYzZWQiIHN0cm9rZT0iIzE2NWQ1MiIgc3Ryb2tlLXdpZHRoPSIxLjUiLz48dGV4dCB4PSI0NiIgeT0iMTA4IiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMjAiIGZpbGw9IiMyMTM0MmYiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjYwMCI+5bel5Y2VTTEgwrcg5oyB57ut6IGM6LSjPC90ZXh0PjxwYXRoIGQ9Ik00OCAxMzJIMTM2TDE1MiAxNDhWMTk4SDQ4WiIgZmlsbD0id2hpdGUiIHN0cm9rZT0iIzYwNzM2YyIgc3Ryb2tlLXdpZHRoPSIxLjUiLz48cGF0aCBkPSJNMTM2IDEzMlYxNDhIMTUyIiBmaWxsPSJub25lIiBzdHJva2U9IiM2MDczNmMiIHN0cm9rZS13aWR0aD0iMS41Ii8+PHRleHQgeD0iMTAwLjAiIHk9IjE3MS4wIiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHN 确认实际结果，并在情况改变后继续处理。\n\n企业说“AI是智能伙伴”，有价值的含义正在这里：把可用智能安排成持续工作的参与者。\n\n**伙伴关系来自可接续的职责、信息、行动与反馈，而非一个拟人化名字。** 企业也不必把AI永久限定在起草环节，委派范围可以随任务证据发展。\n\n## 从一张报修任务看持续职责\n\n在教学设备案例中，客户报告“促销时段间歇停机”。AI首先可以检查设备身份、历史与当前资料，发现负载和发生时间不完整，再提出补问。\n\n资料返回后，它可以组织相关工单，说明相似之处与版本差别，提出需要进一步确认的方向。派工完成后，继续检查是否到场、客户是否恢复，后续是否复发。\n\n这里每一步都依赖外部事实。对话里的“已处理”不能代替派工系统接受，历史工单也不能代替现场结果。持续职责要求工作状态能够在中断后恢复，而不只是连续生成语言。\n\n \n\n## 四类条件缺一项，会发生什么\n\n没有清楚目标，AI可能把写完说明当作结束，而客户仍未恢复。目标应与工作范围一致，例如“把派工前材料准备到可采用”，比一个没有边界的“负责售后”更适合起步。\n\n没有相关记忆，系统每次都要重问，或者只凭通用经验猜测。记忆包括当前任务经过与适用的企业经验，后面会分别解释。\n\n没有行动工具，建议只能停在对话中；有工具却不知道使用范围，也可能重复登记或改错对象。企业要把可用资源与实际决定范围安排清楚。\n\n没有结果反馈，系统无法知道动作是否完成、旧方法是否有效。它可能持续推进一个早已失效的假设，或者把没有回显当成没有执行。\n\n这些条件由业务与工程共同提供。智能伙伴的可用能力，是模型与企业工作条件结合后的表现。\n\n## 伙伴也应帮助产生新认识\n\n如果AI只检索旧答案，它主要是在扩散既有经验。更主动的作用，是发现旧经验解释不了的差别，提出候选原因和可区分观察，帮助团队发展新方法。\n\n例如四张恢复工单中，调整、重启与版本相互混杂。AI可以把这种混杂指出来，建议下一次补齐关键事实。企业再决定资源和实际观察，结果返回后更新认识。新知识因此来自共同工作，不能由AI提出得合理就直接认定。\n\n宝洁的创新实验为AI参与跨专业构思提供了现实证据；Agent工程经验则说明怎样把模型、工具与反馈组织起来。前者不证明长期商业结果，后者也不能代替业务验证。协作研究、工程材料\n\n## 自主程度怎样逐步发展\n\n早期可以只承担资料准备，让使用者检查结果。如果一类常规任务在代表情况中表现可靠，企业可以进一步委派其中的判断与执行；遇到新条件或低把握情况，再回到相应专业支持。\n\n这种安排不要求所有任务走相同路线。简单查询可以直接完成；复杂探索可以允许提出多种候选；对实际动作的委派，则需要相应执行与结果证据。人的参与也应有具体作用，不能只是增加一个形式上的确认按钮。\n\n持续工作并不意味着模型每次都把企业知识永久写进参数。很多记忆来自外部记录，在当前任务中重新读取。企业应根据实际机制判断“记住了什么”，而非依据AI的口头承诺。\n\n## 从一个可检验职责开始\n\n可以先选一项有明确使用者、自然输入和可见结果的职责，例如派工前材料准备、跟踪未完成事项或组织门店异常信息。观察它是否减少重复劳动，是否能在情况变化后接续，是否帮助下一岗位作出更有依据的动作。\n\n当企业能够安排、检查和改进这种智能供给，AI伙伴才从理念进入经营。进一步的问题是，人与AI应当如何共同承担不同阶段的判断。\n"},{"file":"18-人机分工.md","id":"lesson-18","number":18,"role":"核心课","part":3,"title":"第18章｜生成、选择与执行，应该怎样分给人与AI","md":"# 第18章｜生成、选择与执行，应该怎样分给人与AI\n\nAI能提出更多方案，企业是否就应该让它起草、人来最终判断？这个安排容易理解，却未必适合所有任务。专家可能被大量候选压住，人员也可能选择错误；某些常规判断则可能由AI做得足够可靠。\n\n**人机分工应按任务阶段、人员经验与实际组合表现调整。** 不能用“人更懂判断”或“模型已经更强”替代具体比较。\n\n## 同一任务中，能力可能分布不均\n\n一份服务方案至少经过资料整理、候选构思、比较筛选、正式交付和后续采用。擅长生成不等于擅长选出最好的，选得好也不等于能实际履约。\n\n人员经验同样重要。新人可能缺背景，AI帮助他取得相关经验；专家已经掌握很多信息，统一建议可能增加检查负担。软件客服研究观察到不同经验群体的作用差异，不能把平均变化当作每个人的变化。[研究原文](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)\n\n因此评价应同时看独立表现与组合表现。人和AI各自能做什么，组合后是否改善，新增沟通与核验是否抵消收益，都需要在任务中观察。\n\n## 最终方案变好，不等于选择能力同步变好\n\n宝洁创新实验把生成、组内选择与最终质量分开。研究中，AI条件的最终入选方案质量仍较高，但从自身方案池选出最优项的表现没有同步提高；研究也不能确认参与者在选择环节实际使用了AI。[原始研究](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n用一个独立教学算例可以看清这种关系。假设方案分数只用于说明逻辑，不是该研究数据：\n\n| 情况 | 方案池 | 最终选中 | 选中分数 |\n|---|---|---|---:|\n| 原安排 | 70、80 | 80 | 80 |\n| 新安排 | 92、98 | 92 | 92 |\n\n新安排没有选出自己最好的98，最终92仍高于原来的80。由此既不能说选择已经改善，也不能说最终结果没有改善。\n\n企业若只观察最终方案，可能不知道资源该投向构思还是选择；若只观察是否选中最优，又可能忽视整体候选质量已经提高。阶段拆分帮助定位下一项改进。\n\n## 人工复核也有成本和错误\n\n“最后让人检查一下”容易掩盖实际工作量。复核者需要理解背景、查证事实和判断后果；当材料多、时间紧时，可能只检查格式，或过度信任流畅建议。\n\n如果专家每次都要从原材料重做一遍，AI可能没有减少总劳动。如果让AI先标出依据与关键差别，专家只处理需要专业判断的部分，组合可能更合理；是否成立仍需比较真实质量与工时。\n\n相反，已经明确、可核验的常规工作，也没有理由永远保留逐项人工确认。可以在充分观察后扩大委派，同时保留例外处理与结果回查。\n\n## 为一个具体阶段选择分工\n\n教学专业服务机构可以分别比较：AI组织材料是否减少遗漏；AI构思是否增加有用候选；选择环节是单人、多人还是人机比较更有效；正式交付前哪些事实必须核验；客户采用后怎样接回结果。\n\n任务范围应小到能分辨原因。例如“AI制作报告的总体满意度”太宽，不能说明哪一阶段值得投入。明确到“从给定客户材料中辨认相互冲突的事实”，更容易形成有区分力的评价。\n\n| 观察到的情况 | 可能的分工调整 |\n|---|---|\n| 候选质量提高，筛选负担大增 | 控制候选进入量，改筛选支持 |\n| 新人明显受益，专家频繁改写 | 按经验和任务配置不同辅助 |\n| 常规判断稳定、易核验 | 考虑扩大委派，持续抽查结果 |\n| 新条件下错误集中 | 缩小该类范围，补事实或专业支持 |\n\n这些是需要验证的选择，不能按表自动决定所有业务。\n\n## 分工是一项持续更新的经营安排\n\n模型、人员和任务都会变化。有效的人机组合不应因第一次试点成功而永久固定，也不应因一次失败就把整类判断全部排除。\n\n企业需要知道当前边界为何存在、扩大委派还缺什么证据。这样，AI伙伴才能逐步承担更多有价值工作，人的专业能力也能投向更需要它的地方。下一步是用合适的工作组织方式承载这种分工。\n","html":"\u003ch1>第18章｜生成、选择与执行，应该怎样分给人与AI\u003c/h1>\n\u003cp>AI能提出更多方案，企业是否就应该让它起草、人来最终判断？这个安排容易理解，却未必适合所有任务。专家可能被大量候选压住，人员也可能选择错误；某些常规判断则可能由AI做得足够可靠。\u003c/p>\n\u003cp>\u003cstrong>人机分工应按任务阶段、人员经验与实际组合表现调整。\u003c/strong> 不能用“人更懂判断”或“模型已经更强”替代具体比较。\u003c/p>\n\u003ch2 id=\"lesson-18-section-1\">同一任务中，能力可能分布不均\u003c/h2>\n\u003cp>一份服务方案至少经过资料整理、候选构思、比较筛选、正式交付和后续采用。擅长生成不等于擅长选出最好的，选得好也不等于能实际履约。\u003c/p>\n\u003cp>人员经验同样重要。新人可能缺背景，AI帮助他取得相关经验；专家已经掌握很多信息，统一建议可能增加检查负担。软件客服研究观察到不同经验群体的作用差异，不能把平均变化当作每个人的变化。\u003ca href=\"https://danielle.li/assets/docs/GenerativeAIatWork.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">研究原文\u003c/a>\u003c/p>\n\u003cp>因此评价应同时看独立表现与组合表现。人和AI各自能做什么，组合后是否改善，新增沟通与核验是否抵消收益，都需要在任务中观察。\u003c/p>\n\u003ch2 id=\"lesson-18-section-2\">最终方案变好，不等于选择能力同步变好\u003c/h2>\n\u003cp>宝洁创新实验把生成、组内选择与最终质量分开。研究中，AI条件的最终入选方案质量仍较高，但从自身方案池选出最优项的表现没有同步提高；研究也不能确认参与者在选择环节实际使用了AI。\u003ca href=\"https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003cp>用一个独立教学算例可以看清这种关系。假设方案分数只用于说明逻辑，不是该研究数据：\u003c/p>\n\u003cdiv class=\"table-scroll table-wide\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>情况\u003c/th>\n\u003cth>方案池\u003c/th>\n\u003cth>最终选中\u003c/th>\n\u003cth align=\"right\">选中分数\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>原安排\u003c/td>\n\u003ctd>70、80\u003c/td>\n\u003ctd>80\u003c/td>\n\u003ctd align=\"right\">80\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新安排\u003c/td>\n\u003ctd>92、98\u003c/td>\n\u003ctd>92\u003c/td>\n\u003ctd align=\"right\">92\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"table-hint\">表格可左右滑动查看\u003c/p>\n\u003cp>新安排没有选出自己最好的98，最终92仍高于原来的80。由此既不能说选择已经改善，也不能说最终结果没有改善。\u003c/p>\n\u003cp>企业若只观察最终方案，可能不知道资源该投向构思还是选择；若只观察是否选中最优，又可能忽视整体候选质量已经提高。阶段拆分帮助定位下一项改进。\u003c/p>\n\u003ch2 id=\"lesson-18-section-3\">人工复核也有成本和错误\u003c/h2>\n\u003cp>“最后让人检查一下”容易掩盖实际工作量。复核者需要理解背景、查证事实和判断后果；当材料多、时间紧时，可能只检查格式，或过度信任流畅建议。\u003c/p>\n\u003cp>如果专家每次都要从原材料重做一遍，AI可能没有减少总劳动。如果让AI先标出依据与关键差别，专家只处理需要专业判断的部分，组合可能更合理；是否成立仍需比较真实质量与工时。\u003c/p>\n\u003cp>相反，已经明确、可核验的常规工作，也没有理由永远保留逐项人工确认。可以在充分观察后扩大委派，同时保留例外处理与结果回查。\u003c/p>\n\u003ch2 id=\"lesson-18-section-4\">为一个具体阶段选择分工\u003c/h2>\n\u003cp>教学专业服务机构可以分别比较：AI组织材料是否减少遗漏；AI构思是否增加有用候选；选择环节是单人、多人还是人机比较更有效；正式交付前哪些事实必须核验；客户采用后怎样接回结果。\u003c/p>\n\u003cp>任务范围应小到能分辨原因。例如“AI制作报告的总体满意度”太宽，不能说明哪一阶段值得投入。明确到“从给定客户材料中辨认相互冲突的事实”，更容易形成有区分力的评价。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>观察到的情况\u003c/th>\n\u003cth>可能的分工调整\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>候选质量提高，筛选负担大增\u003c/td>\n\u003ctd>控制候选进入量，改筛选支持\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新人明显受益，专家频繁改写\u003c/td>\n\u003ctd>按经验和任务配置不同辅助\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>常规判断稳定、易核验\u003c/td>\n\u003ctd>考虑扩大委派，持续抽查结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新条件下错误集中\u003c/td>\n\u003ctd>缩小该类范围，补事实或专业支持\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>这些是需要验证的选择，不能按表自动决定所有业务。\u003c/p>\n\u003ch2 id=\"lesson-18-section-5\">分工是一项持续更新的经营安排\u003c/h2>\n\u003cp>模型、人员和任务都会变化。有效的人机组合不应因第一次试点成功而永久固定，也不应因一次失败就把整类判断全部排除。\u003c/p>\n\u003cp>企业需要知道当前边界为何存在、扩大委派还缺什么证据。这样，AI伙伴才能逐步承担更多有价值工作，人的专业能力也能投向更需要它的地方。下一步是用合适的工作组织方式承载这种分工。\u003c/p>\n","headings":[{"id":"lesson-18-section-1","label":"同一任务中，能力可能分布不均"},{"id":"lesson-18-section-2","label":"最终方案变好，不等于选择能力同步变好"},{"id":"lesson-18-section-3","label":"人工复核也有成本和错误"},{"id":"lesson-18-section-4","label":"为一个具体阶段选择分工"},{"id":"lesson-18-section-5","label":"分工是一项持续更新的经营安排"}],"exportMd":"# 第18章｜生成、选择与执行，应该怎样分给人与AI\n\nAI能提出更多方案，企业是否就应该让它起草、人来最终判断？这个安排容易理解，却未必适合所有任务。专家可能被大量候选压住，人员也可能选择错误；某些常规判断则可能由AI做得足够可靠。\n\n**人机分工应按任务阶段、人员经验与实际组合表现调整。** 不能用“人更懂判断”或“模型已经更强”替代具体比较。\n\n## 同一任务中，能力可能分布不均\n\n一份服务方案至少经过资料整理、候选构思、比较筛选、正式交付和后续采用。擅长生成不等于擅长选出最好的，选得好也不等于能实际履约。\n\n人员经验同样重要。新人可能缺背景，AI帮助他取得相关经验；专家已经掌握很多信息，统一建议可能增加检查负担。软件客服研究观察到不同经验群体的作用差异，不能把平均变化当作每个人的变化。[研究原文](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)\n\n因此评价应同时看独立表现与组合表现。人和AI各自能做什么，组合后是否改善，新增沟通与核验是否抵消收益，都需要在任务中观察。\n\n## 最终方案变好，不等于选择能力同步变好\n\n宝洁创新实验把生成、组内选择与最终质量分开。研究中，AI条件的最终入选方案质量仍较高，但从自身方案池选出最优项的表现没有同步提高；研究也不能确认参与者在选择环节实际使用了AI。[原始研究](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n用一个独立教学算例可以看清这种关系。假设方案分数只用于说明逻辑，不是该研究数据：\n\n| 情况 | 方案池 | 最终选中 | 选中分数 |\n|---|---|---|---:|\n| 原安排 | 70、80 | 80 | 80 |\n| 新安排 | 92、98 | 92 | 92 |\n\n新安排没有选出自己最好的98，最终92仍高于原来的80。由此既不能说选择已经改善，也不能说最终结果没有改善。\n\n企业若只观察最终方案，可能不知道资源该投向构思还是选择；若只观察是否选中最优，又可能忽视整体候选质量已经提高。阶段拆分帮助定位下一项改进。\n\n## 人工复核也有成本和错误\n\n“最后让人检查一下”容易掩盖实际工作量。复核者需要理解背景、查证事实和判断后果；当材料多、时间紧时，可能只检查格式，或过度信任流畅建议。\n\n如果专家每次都要从原材料重做一遍，AI可能没有减少总劳动。如果让AI先标出依据与关键差别，专家只处理需要专业判断的部分，组合可能更合理；是否成立仍需比较真实质量与工时。\n\n相反，已经明确、可核验的常规工作，也没有理由永远保留逐项人工确认。可以在充分观察后扩大委派，同时保留例外处理与结果回查。\n\n## 为一个具体阶段选择分工\n\n教学专业服务机构可以分别比较：AI组织材料是否减少遗漏；AI构思是否增加有用候选；选择环节是单人、多人还是人机比较更有效；正式交付前哪些事实必须核验；客户采用后怎样接回结果。\n\n任务范围应小到能分辨原因。例如“AI制作报告的总体满意度”太宽，不能说明哪一阶段值得投入。明确到“从给定客户材料中辨认相互冲突的事实”，更容易形成有区分力的评价。\n\n| 观察到的情况 | 可能的分工调整 |\n|---|---|\n| 候选质量提高，筛选负担大增 | 控制候选进入量，改筛选支持 |\n| 新人明显受益，专家频繁改写 | 按经验和任务配置不同辅助 |\n| 常规判断稳定、易核验 | 考虑扩大委派，持续抽查结果 |\n| 新条件下错误集中 | 缩小该类范围，补事实或专业支持 |\n\n这些是需要验证的选择，不能按表自动决定所有业务。\n\n## 分工是一项持续更新的经营安排\n\n模型、人员和任务都会变化。有效的人机组合不应因第一次试点成功而永久固定，也不应因一次失败就把整类判断全部排除。\n\n企业需要知道当前边界为何存在、扩大委派还缺什么证据。这样，AI伙伴才能逐步承担更多有价值工作，人的专业能力也能投向更需要它的地方。下一步是用合适的工作组织方式承载这种分工。\n","exportSingleMd":"# 第18章｜生成、选择与执行，应该怎样分给人与AI\n\nAI能提出更多方案，企业是否就应该让它起草、人来最终判断？这个安排容易理解，却未必适合所有任务。专家可能被大量候选压住，人员也可能选择错误；某些常规判断则可能由AI做得足够可靠。\n\n**人机分工应按任务阶段、人员经验与实际组合表现调整。** 不能用“人更懂判断”或“模型已经更强”替代具体比较。\n\n## 同一任务中，能力可能分布不均\n\n一份服务方案至少经过资料整理、候选构思、比较筛选、正式交付和后续采用。擅长生成不等于擅长选出最好的，选得好也不等于能实际履约。\n\n人员经验同样重要。新人可能缺背景，AI帮助他取得相关经验；专家已经掌握很多信息，统一建议可能增加检查负担。软件客服研究观察到不同经验群体的作用差异，不能把平均变化当作每个人的变化。[研究原文](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)\n\n因此评价应同时看独立表现与组合表现。人和AI各自能做什么，组合后是否改善，新增沟通与核验是否抵消收益，都需要在任务中观察。\n\n## 最终方案变好，不等于选择能力同步变好\n\n宝洁创新实验把生成、组内选择与最终质量分开。研究中，AI条件的最终入选方案质量仍较高，但从自身方案池选出最优项的表现没有同步提高；研究也不能确认参与者在选择环节实际使用了AI。[原始研究](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n用一个独立教学算例可以看清这种关系。假设方案分数只用于说明逻辑，不是该研究数据：\n\n| 情况 | 方案池 | 最终选中 | 选中分数 |\n|---|---|---|---:|\n| 原安排 | 70、80 | 80 | 80 |\n| 新安排 | 92、98 | 92 | 92 |\n\n新安排没有选出自己最好的98，最终92仍高于原来的80。由此既不能说选择已经改善，也不能说最终结果没有改善。\n\n企业若只观察最终方案，可能不知道资源该投向构思还是选择；若只观察是否选中最优，又可能忽视整体候选质量已经提高。阶段拆分帮助定位下一项改进。\n\n## 人工复核也有成本和错误\n\n“最后让人检查一下”容易掩盖实际工作量。复核者需要理解背景、查证事实和判断后果；当材料多、时间紧时，可能只检查格式，或过度信任流畅建议。\n\n如果专家每次都要从原材料重做一遍，AI可能没有减少总劳动。如果让AI先标出依据与关键差别，专家只处理需要专业判断的部分，组合可能更合理；是否成立仍需比较真实质量与工时。\n\n相反，已经明确、可核验的常规工作，也没有理由永远保留逐项人工确认。可以在充分观察后扩大委派，同时保留例外处理与结果回查。\n\n## 为一个具体阶段选择分工\n\n教学专业服务机构可以分别比较：AI组织材料是否减少遗漏；AI构思是否增加有用候选；选择环节是单人、多人还是人机比较更有效；正式交付前哪些事实必须核验；客户采用后怎样接回结果。\n\n任务范围应小到能分辨原因。例如“AI制作报告的总体满意度”太宽，不能说明哪一阶段值得投入。明确到“从给定客户材料中辨认相互冲突的事实”，更容易形成有区分力的评价。\n\n| 观察到的情况 | 可能的分工调整 |\n|---|---|\n| 候选质量提高，筛选负担大增 | 控制候选进入量，改筛选支持 |\n| 新人明显受益，专家频繁改写 | 按经验和任务配置不同辅助 |\n| 常规判断稳定、易核验 | 考虑扩大委派，持续抽查结果 |\n| 新条件下错误集中 | 缩小该类范围，补事实或专业支持 |\n\n这些是需要验证的选择，不能按表自动决定所有业务。\n\n## 分工是一项持续更新的经营安排\n\n模型、人员和任务都会变化。有效的人机组合不应因第一次试点成功而永久固定，也不应因一次失败就把整类判断全部排除。\n\n企业需要知道当前边界为何存在、扩大委派还缺什么证据。这样，AI伙伴才能逐步承担更多有价值工作，人的专业能力也能投向更需要它的地方。下一步是用合适的工作组织方式承载这种分工。\n","text":"# 第18章｜生成、选择与执行，应该怎样分给人与AI\n\nAI能提出更多方案，企业是否就应该让它起草、人来最终判断？这个安排容易理解，却未必适合所有任务。专家可能被大量候选压住，人员也可能选择错误；某些常规判断则可能由AI做得足够可靠。\n\n**人机分工应按任务阶段、人员经验与实际组合表现调整。** 不能用“人更懂判断”或“模型已经更强”替代具体比较。\n\n## 同一任务中，能力可能分布不均\n\n一份服务方案至少经过资料整理、候选构思、比较筛选、正式交付和后续采用。擅长生成不等于擅长选出最好的，选得好也不等于能实际履约。\n\n人员经验同样重要。新人可能缺背景，AI帮助他取得相关经验；专家已经掌握很多信息，统一建议可能增加检查负担。软件客服研究观察到不同经验群体的作用差异，不能把平均变化当作每个人的变化。研究原文\n\n因此评价应同时看独立表现与组合表现。人和AI各自能做什么，组合后是否改善，新增沟通与核验是否抵消收益，都需要在任务中观察。\n\n## 最终方案变好，不等于选择能力同步变好\n\n宝洁创新实验把生成、组内选择与最终质量分开。研究中，AI条件的最终入选方案质量仍较高，但从自身方案池选出最优项的表现没有同步提高；研究也不能确认参与者在选择环节实际使用了AI。原始研究\n\n用一个独立教学算例可以看清这种关系。假设方案分数只用于说明逻辑，不是该研究数据：\n\n| 情况 | 方案池 | 最终选中 | 选中分数 |\n|---|---|---|---:|\n| 原安排 | 70、80 | 80 | 80 |\n| 新安排 | 92、98 | 92 | 92 |\n\n新安排没有选出自己最好的98，最终92仍高于原来的80。由此既不能说选择已经改善，也不能说最终结果没有改善。\n\n企业若只观察最终方案，可能不知道资源该投向构思还是选择；若只观察是否选中最优，又可能忽视整体候选质量已经提高。阶段拆分帮助定位下一项改进。\n\n## 人工复核也有成本和错误\n\n“最后让人检查一下”容易掩盖实际工作量。复核者需要理解背景、查证事实和判断后果；当材料多、时间紧时，可能只检查格式，或过度信任流畅建议。\n\n如果专家每次都要从原材料重做一遍，AI可能没有减少总劳动。如果让AI先标出依据与关键差别，专家只处理需要专业判断的部分，组合可能更合理；是否成立仍需比较真实质量与工时。\n\n相反，已经明确、可核验的常规工作，也没有理由永远保留逐项人工确认。可以在充分观察后扩大委派，同时保留例外处理与结果回查。\n\n## 为一个具体阶段选择分工\n\n教学专业服务机构可以分别比较：AI组织材料是否减少遗漏；AI构思是否增加有用候选；选择环节是单人、多人还是人机比较更有效；正式交付前哪些事实必须核验；客户采用后怎样接回结果。\n\n任务范围应小到能分辨原因。例如“AI制作报告的总体满意度”太宽，不能说明哪一阶段值得投入。明确到“从给定客户材料中辨认相互冲突的事实”，更容易形成有区分力的评价。\n\n| 观察到的情况 | 可能的分工调整 |\n|---|---|\n| 候选质量提高，筛选负担大增 | 控制候选进入量，改筛选支持 |\n| 新人明显受益，专家频繁改写 | 按经验和任务配置不同辅助 |\n| 常规判断稳定、易核验 | 考虑扩大委派，持续抽查结果 |\n| 新条件下错误集中 | 缩小该类范围，补事实或专业支持 |\n\n这些是需要验证的选择，不能按表自动决定所有业务。\n\n## 分工是一项持续更新的经营安排\n\n模型、人员和任务都会变化。有效的人机组合不应因第一次试点成功而永久固定，也不应因一次失败就把整类判断全部排除。\n\n企业需要知道当前边界为何存在、扩大委派还缺什么证据。这样，AI伙伴才能逐步承担更多有价值工作，人的专业能力也能投向更需要它的地方。下一步是用合适的工作组织方式承载这种分工。\n"},{"file":"19-工作流与Agent.md","id":"lesson-19","number":19,"role":"核心课","part":3,"title":"第19章｜什么时候写成流程，什么时候需要Agent判断","md":"# 第19章｜什么时候写成流程，什么时候需要Agent判断\n\n一张设备工单包含几类不同工作：核对保修日期，登记报修，选择相关历史，提出补问，形成派工建议。它们可以在同一界面完成，却不必由同一种机制处理。\n\n**稳定且明确的部分可以固定组织，需要根据新信息决定下一步的部分再交给动态判断。** 系统成熟与否，应看实际完成质量、成本和可接续性。\n\n## 固定工作流，提前确定路径\n\n保修日期已有明确规则，登记字段也相对稳定。程序可以按顺序取得设备、查询记录、返回结果，遇到缺项进入预先规定的处理。\n\n工作流的优势是路径清楚、重复性强，方便核对哪一步完成、哪里失败。模型也可以出现在固定流程的一步中，例如按要求整理客户描述，但整个推进顺序仍由预先安排决定。\n\n固定并不等于低级。稳定业务若每次都让模型重新规划，可能增加费用、波动与排查困难。\n\n## Agent，把部分路径选择留到运行时\n\n如果客户描述不完整，系统可能需要先查历史；查到版本冲突，又需要取得当前设备信息；资料仍不足时，再提出补问。下一步由刚取得的信息决定，难以把全部情况事先列完。\n\nAgent可以根据目标与当前情况，选择工具、观察结果、决定是否继续。这里的自主是具体行动选择，不代表它天然拥有全部业务决定权，也不保证选择正确。\n\nAnthropic的工程经验以此区分预设工作流与动态Agent，并强调复杂度需要与任务相配。它提供一种实现视角，不能直接证明哪种组织方式最有经营价值。[工程原文](https://www.anthropic.com/research/building-effective-agents)\n\n![固定流程沿已知顺序推进；动态处理根据取得的信息选择补问或相关历史，再回到同一工单。两者可以在一条业务中组合。](assets/19-固定与动态.svg)\n\n## 在同一条业务里组合\n\n教学设备服务可以让设备查询、工单登记和正式状态变更使用成熟系统；让AI在受控材料与工具范围内整理异常、选择相关案例和提出补问；再把实际决定与行动送回业务系统。\n\n外围保持对象、身份和完成状态清楚，内部保留必要判断空间。这样既不要求把每种客户说法写成规则，也不把全部稳定动作放进一个难以追踪的长对话。\n\n选择的依据可以很具体：路径是否真的不确定，工具结果能否观察，额外推理是否改善任务，出现中断能否查清已经做过什么。\n\n## “更自主”可能增加什么代价\n\n动态判断会增加候选路径，也可能带来多轮调用、重复查询和新的失败组合。一个结果错误，可能来自资料、工具、路径选择或停止条件，需要有能力区分。\n\nSculley等关于系统技术债的研究提醒我们，模型之外的依赖与维护会形成长期负担。把组件做得更复杂，应有真实任务价值支持，而非只为采用最新形式。[原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n企业也不能反过来把所有未知都强行固定。如果团队尚不了解现场，就写出完整流程，往往会让人员在系统外处理大量例外。此时应先通过现场使用认识问题，再决定稳定部分。\n\n## 用一次任务判断机制是否合适\n\n可以拿一张包含缺项的真实工单，追踪系统取得什么、为什么选择下一步、何时认为完成。再用一张常规工单比较：是否为简单工作增加了不必要复杂度？\n\n若固定流程已能低成本完成，保留即可；若重要判断需要动态处理，就明确其输入、可用工具和结果检查。无需用Agent数量或对话轮次评价成熟度。\n\n两种机制共同依赖一个条件：当前任务要取得相关而可信的信息。企业长期保存的经验，不会自动完整进入这一次工作，这正是上下文与检索要解决的问题。\n","html":"\u003ch1>第19章｜什么时候写成流程，什么时候需要Agent判断\u003c/h1>\n\u003cp>一张设备工单包含几类不同工作：核对保修日期，登记报修，选择相关历史，提出补问，形成派工建议。它们可以在同一界面完成，却不必由同一种机制处理。\u003c/p>\n\u003cp>\u003cstrong>稳定且明确的部分可以固定组织，需要根据新信息决定下一步的部分再交给动态判断。\u003c/strong> 系统成熟与否，应看实际完成质量、成本和可接续性。\u003c/p>\n\u003ch2 id=\"lesson-19-section-1\">固定工作流，提前确定路径\u003c/h2>\n\u003cp>保修日期已有明确规则，登记字段也相对稳定。程序可以按顺序取得设备、查询记录、返回结果，遇到缺项进入预先规定的处理。\u003c/p>\n\u003cp>工作流的优势是路径清楚、重复性强，方便核对哪一步完成、哪里失败。模型也可以出现在固定流程的一步中，例如按要求整理客户描述，但整个推进顺序仍由预先安排决定。\u003c/p>\n\u003cp>固定并不等于低级。稳定业务若每次都让模型重新规划，可能增加费用、波动与排查困难。\u003c/p>\n\u003ch2 id=\"lesson-19-section-2\">Agent，把部分路径选择留到运行时\u003c/h2>\n\u003cp>如果客户描述不完整，系统可能需要先查历史；查到版本冲突，又需要取得当前设备信息；资料仍不足时，再提出补问。下一步由刚取得的信息决定，难以把全部情况事先列完。\u003c/p>\n\u003cp>Agent可以根据目标与当前情况，选择工具、观察结果、决定是否继续。这里的自主是具体行动选择，不代表它天然拥有全部业务决定权，也不保证选择正确。\u003c/p>\n\u003cp>Anthropic的工程经验以此区分预设工作流与动态Agent，并强调复杂度需要与任务相配。它提供一种实现视角，不能直接证明哪种组织方式最有经营价值。\u003ca href=\"https://www.anthropic.com/research/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">工程原文\u003c/a>\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTAwIiB2aWV3Qm94PSIwIDAgMzYwIDUwMCIgcm9sZT0iaW1nIj48dGl0bGU+5Zu65a6a5LiO5Yqo5oCB5Y+v5Lul57uE5ZCIPC90aXRsZT48ZGVzYz7lm7rlrprmn6Xor6LnmbvorrDpobrluo/kuI7mjInotYTmlpnmmK/lkKblhYXotrPpgInmi6nooaXpl67nmoTliqjmgIHlpITnkIbvvIzlj6/ku6XmlL7ov5vlkIzkuIDkuJrliqHjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjUwMCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIg eHQ+PC9zdmc+\" alt=\"固定流程沿已知顺序推进；动态处理根据取得的信息选择补问或相关历史，再回到同一工单。两者可以在一条业务中组合。\">\u003c/p>\n\u003ch2 id=\"lesson-19-section-3\">在同一条业务里组合\u003c/h2>\n\u003cp>教学设备服务可以让设备查询、工单登记和正式状态变更使用成熟系统；让AI在受控材料与工具范围内整理异常、选择相关案例和提出补问；再把实际决定与行动送回业务系统。\u003c/p>\n\u003cp>外围保持对象、身份和完成状态清楚，内部保留必要判断空间。这样既不要求把每种客户说法写成规则，也不把全部稳定动作放进一个难以追踪的长对话。\u003c/p>\n\u003cp>选择的依据可以很具体：路径是否真的不确定，工具结果能否观察，额外推理是否改善任务，出现中断能否查清已经做过什么。\u003c/p>\n\u003ch2 id=\"lesson-19-section-4\">“更自主”可能增加什么代价\u003c/h2>\n\u003cp>动态判断会增加候选路径，也可能带来多轮调用、重复查询和新的失败组合。一个结果错误，可能来自资料、工具、路径选择或停止条件，需要有能力区分。\u003c/p>\n\u003cp>Sculley等关于系统技术债的研究提醒我们，模型之外的依赖与维护会形成长期负担。把组件做得更复杂，应有真实任务价值支持，而非只为采用最新形式。\u003ca href=\"https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始论文\u003c/a>\u003c/p>\n\u003cp>企业也不能反过来把所有未知都强行固定。如果团队尚不了解现场，就写出完整流程，往往会让人员在系统外处理大量例外。此时应先通过现场使用认识问题，再决定稳定部分。\u003c/p>\n\u003ch2 id=\"lesson-19-section-5\">用一次任务判断机制是否合适\u003c/h2>\n\u003cp>可以拿一张包含缺项的真实工单，追踪系统取得什么、为什么选择下一步、何时认为完成。再用一张常规工单比较：是否为简单工作增加了不必要复杂度？\u003c/p>\n\u003cp>若固定流程已能低成本完成，保留即可；若重要判断需要动态处理，就明确其输入、可用工具和结果检查。无需用Agent数量或对话轮次评价成熟度。\u003c/p>\n\u003cp>两种机制共同依赖一个条件：当前任务要取得相关而可信的信息。企业长期保存的经验，不会自动完整进入这一次工作，这正是上下文与检索要解决的问题。\u003c/p>\n","headings":[{"id":"lesson-19-section-1","label":"固定工作流，提前确定路径"},{"id":"lesson-19-section-2","label":"Agent，把部分路径选择留到运行时"},{"id":"lesson-19-section-3","label":"在同一条业务里组合"},{"id":"lesson-19-section-4","label":"“更自主”可能增加什么代价"},{"id":"lesson-19-section-5","label":"用一次任务判断机制是否合适"}],"exportMd":"# 第19章｜什么时候写成流程，什么时候需要Agent判断\n\n一张设备工单包含几类不同工作：核对保修日期，登记报修，选择相关历史，提出补问，形成派工建议。它们可以在同一界面完成，却不必由同一种机制处理。\n\n**稳定且明确的部分可以固定组织，需要根据新信息决定下一步的部分再交给动态判断。** 系统成熟与否，应看实际完成质量、成本和可接续性。\n\n## 固定工作流，提前确定路径\n\n保修日期已有明确规则，登记字段也相对稳定。程序可以按顺序取得设备、查询记录、返回结果，遇到缺项进入预先规定的处理。\n\n工作流的优势是路径清楚、重复性强，方便核对哪一步完成、哪里失败。模型也可以出现在固定流程的一步中，例如按要求整理客户描述，但整个推进顺序仍由预先安排决定。\n\n固定并不等于低级。稳定业务若每次都让模型重新规划，可能增加费用、波动与排查困难。\n\n## Agent，把部分路径选择留到运行时\n\n如果客户描述不完整，系统可能需要先查历史；查到版本冲突，又需要取得当前设备信息；资料仍不足时，再提出补问。下一步由刚取得的信息决定，难以把全部情况事先列完。\n\nAgent可以根据目标与当前情况，选择工具、观察结果、决定是否继续。这里的自主是具体行动选择，不代表它天然拥有全部业务决定权，也不保证选择正确。\n\nAnthropic的工程经验以此区分预设工作流与动态Agent，并强调复杂度需要与任务相配。它提供一种实现视角，不能直接证明哪种组织方式最有经营价值。[工程原文](https://www.anthropic.com/research/building-effective-agents)\n\n![固定流程沿已知顺序推进；动态处理根据取得的信息选择补问或相关历史，再回到同一工单。两者可以在一条业务中组合。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTAwIiB2aWV3Qm94PSIwIDAgMzYwIDUwMCIgcm9sZT0iaW1nIj48dGl0bGU+5Zu65a6a5LiO5Yqo5oCB5Y+v5Lul57uE5ZCIPC90aXRsZT48ZGVzYz7lm7rlrprmn6Xor6LnmbvorrDpobrluo/kuI7mjInotYTmlpnmmK/lkKblhYXotrPpgInmi6nooaXpl67nmoTliqjmgIHlpITnkIbvvIzlj6/ku6XmlL7ov5vlkIzkuIDkuJrliqHjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjUwMCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7lm7rlrprkuI7liqjmgIHlj6/ku6Xnu4TlkIg8L3RleHQ+PHRleHQgeD0iMjQiIHk9IjgzIiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMjAiIGZpbGw9IiMyMTM0MmYiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjYwMCI+5bey55+l6aG65bqPPC90ZXh0PjxyZWN0IHg9IjI0IiB5PSIxMDIiIHdpZHRoPSI4MCIgaGVpZ2h0PSI2MSIgcng9IjYiIGZpbGw9IiNlZGYzZWQiIHN0cm9rZT0iIzYwNzM2YyIgc3Ryb2tlLXdpZHRoPSIxLjUiLz48dGV4dCB4PSI2NC4wIiB5PSIxMzguNSIgZm9udC1mYW1pbHk9IlBpbmdGYW5nIFNDLE1pY3Jvc29mdCBZYUhlaSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmaWxsPSIjMjEzNDJmIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXdlaWdodD0iNDAwIj7mn6Xor6I8L3RleHQ n若固定流程已能低成本完成，保留即可；若重要判断需要动态处理，就明确其输入、可用工具和结果检查。无需用Agent数量或对话轮次评价成熟度。\n\n两种机制共同依赖一个条件：当前任务要取得相关而可信的信息。企业长期保存的经验，不会自动完整进入这一次工作，这正是上下文与检索要解决的问题。\n","exportSingleMd":"# 第19章｜什么时候写成流程，什么时候需要Agent判断\n\n一张设备工单包含几类不同工作：核对保修日期，登记报修，选择相关历史，提出补问，形成派工建议。它们可以在同一界面完成，却不必由同一种机制处理。\n\n**稳定且明确的部分可以固定组织，需要根据新信息决定下一步的部分再交给动态判断。** 系统成熟与否，应看实际完成质量、成本和可接续性。\n\n## 固定工作流，提前确定路径\n\n保修日期已有明确规则，登记字段也相对稳定。程序可以按顺序取得设备、查询记录、返回结果，遇到缺项进入预先规定的处理。\n\n工作流的优势是路径清楚、重复性强，方便核对哪一步完成、哪里失败。模型也可以出现在固定流程的一步中，例如按要求整理客户描述，但整个推进顺序仍由预先安排决定。\n\n固定并不等于低级。稳定业务若每次都让模型重新规划，可能增加费用、波动与排查困难。\n\n## Agent，把部分路径选择留到运行时\n\n如果客户描述不完整，系统可能需要先查历史；查到版本冲突，又需要取得当前设备信息；资料仍不足时，再提出补问。下一步由刚取得的信息决定，难以把全部情况事先列完。\n\nAgent可以根据目标与当前情况，选择工具、观察结果、决定是否继续。这里的自主是具体行动选择，不代表它天然拥有全部业务决定权，也不保证选择正确。\n\nAnthropic的工程经验以此区分预设工作流与动态Agent，并强调复杂度需要与任务相配。它提供一种实现视角，不能直接证明哪种组织方式最有经营价值。[工程原文](https://www.anthropic.com/research/building-effective-agents)\n\n![固定流程沿已知顺序推进；动态处理根据取得的信息选择补问或相关历史，再回到同一工单。两者可以在一条业务中组合。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTAwIiB2aWV3Qm94PSIwIDAgMzYwIDUwMCIgcm9sZT0iaW1nIj48dGl0bGU+5Zu65a6a5LiO5Yqo5oCB5Y+v5Lul57uE5ZCIPC90aXRsZT48ZGVzYz7lm7rlrprmn6Xor6LnmbvorrDpobrluo/kuI7mjInotYTmlpnmmK/lkKblhYXotrPpgInmi6nooaXpl67nmoTliqjmgIHlpITnkIbvvIzlj6/ku6XmlL7ov5vlkIzkuIDkuJrliqHjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjUwMCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb25 材料与工具范围内整理异常、选择相关案例和提出补问；再把实际决定与行动送回业务系统。\n\n外围保持对象、身份和完成状态清楚，内部保留必要判断空间。这样既不要求把每种客户说法写成规则，也不把全部稳定动作放进一个难以追踪的长对话。\n\n选择的依据可以很具体：路径是否真的不确定，工具结果能否观察，额外推理是否改善任务，出现中断能否查清已经做过什么。\n\n## “更自主”可能增加什么代价\n\n动态判断会增加候选路径，也可能带来多轮调用、重复查询和新的失败组合。一个结果错误，可能来自资料、工具、路径选择或停止条件，需要有能力区分。\n\nSculley等关于系统技术债的研究提醒我们，模型之外的依赖与维护会形成长期负担。把组件做得更复杂，应有真实任务价值支持，而非只为采用最新形式。[原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n企业也不能反过来把所有未知都强行固定。如果团队尚不了解现场，就写出完整流程，往往会让人员在系统外处理大量例外。此时应先通过现场使用认识问题，再决定稳定部分。\n\n## 用一次任务判断机制是否合适\n\n可以拿一张包含缺项的真实工单，追踪系统取得什么、为什么选择下一步、何时认为完成。再用一张常规工单比较：是否为简单工作增加了不必要复杂度？\n\n若固定流程已能低成本完成，保留即可；若重要判断需要动态处理，就明确其输入、可用工具和结果检查。无需用Agent数量或对话轮次评价成熟度。\n\n两种机制共同依赖一个条件：当前任务要取得相关而可信的信息。企业长期保存的经验，不会自动完整进入这一次工作，这正是上下文与检索要解决的问题。\n","text":"# 第19章｜什么时候写成流程，什么时候需要Agent判断\n\n一张设备工单包含几类不同工作：核对保修日期，登记报修，选择相关历史，提出补问，形成派工建议。它们可以在同一界面完成，却不必由同一种机制处理。\n\n**稳定且明确的部分可以固定组织，需要根据新信息决定下一步的部分再交给动态判断。** 系统成熟与否，应看实际完成质量、成本和可接续性。\n\n## 固定工作流，提前确定路径\n\n保修日期已有明确规则，登记字段也相对稳定。程序可以按顺序取得设备、查询记录、返回结果，遇到缺项进入预先规定的处理。\n\n工作流的优势是路径清楚、重复性强，方便核对哪一步完成、哪里失败。模型也可以出现在固定流程的一步中，例如按要求整理客户描述，但整个推进顺序仍由预先安排决定。\n\n固定并不等于低级。稳定业务若每次都让模型重新规划，可能增加费用、波动与排查困难。\n\n## Agent，把部分路径选择留到运行时\n\n如果客户描述不完整，系统可能需要先查历史；查到版本冲突，又需要取得当前设备信息；资料仍不足时，再提出补问。下一步由刚取得的信息决定，难以把全部情况事先列完。\n\nAgent可以根据目标与当前情况，选择工具、观察结果、决定是否继续。这里的自主是具体行动选择，不代表它天然拥有全部业务决定权，也不保证选择正确。\n\nAnthropic的工程经验以此区分预设工作流与动态Agent，并强调复杂度需要与任务相配。它提供一种实现视角，不能直接证明哪种组织方式最有经营价值。工程原文\n\n \n\n## 在同一条业务里组合\n\n教学设备服务可以让设备查询、工单登记和正式状态变更使用成熟系统；让AI在受控材料与工具范围内整理异常、选择相关案例和提出补问；再把实际决定与行动送回业务系统。\n\n外围保持对象、身份和完成状态清楚，内部保留必要判断空间。这样既不要求把每种客户说法写成规则，也不把全部稳定动作放进一个难以追踪的长对话。\n\n选择的依据可以很具体：路径是否真的不确定，工具结果能否观察，额外推理是否改善任务，出现中断能否查清已经做过什么。\n\n## “更自主”可能增加什么代价\n\n动态判断会增加候选路径，也可能带来多轮调用、重复查询和新的失败组合。一个结果错误，可能来自资料、工具、路径选择或停止条件，需要有能力区分。\n\nSculley等关于系统技术债的研究提醒我们，模型之外的依赖与维护会形成长期负担。把组件做得更复杂，应有真实任务价值支持，而非只为采用最新形式。原始论文\n\n企业也不能反过来把所有未知都强行固定。如果团队尚不了解现场，就写出完整流程，往往会让人员在系统外处理大量例外。此时应先通过现场使用认识问题，再决定稳定部分。\n\n## 用一次任务判断机制是否合适\n\n可以拿一张包含缺项的真实工单，追踪系统取得什么、为什么选择下一步、何时认为完成。再用一张常规工单比较：是否为简单工作增加了不必要复杂度？\n\n若固定流程已能低成本完成，保留即可；若重要判断需要动态处理，就明确其输入、可用工具和结果检查。无需用Agent数量或对话轮次评价成熟度。\n\n两种机制共同依赖一个条件：当前任务要取得相关而可信的信息。企业长期保存的经验，不会自动完整进入这一次工作，这正是上下文与检索要解决的问题。\n"},{"file":"20-上下文与检索.md","id":"lesson-20","number":20,"role":"核心课","part":3,"title":"第20章｜企业拥有经验，AI为什么仍会用错","md":"# 第20章｜企业拥有经验，AI为什么仍会用错\n\n设想企业已经把历史工单、规则和案例放进知识空间。当前报修涉及V2设备，AI却找到一张措辞很相似的V1工单，并把旧处理结论当作本次答案。\n\n资料找到了，但找对相似材料与用对经验，是两件事。\n\n**有效上下文，需要把相关、当前、可信且可行动的信息带进这一次任务。** 它是组织记忆发挥作用的入口，不等于组织记忆本身。\n\n## 长期记忆与当前工作材料\n\n长期保存的材料可以很多：原始工单、方法、规则、反例与修订。当前任务需要的只是其中相关部分，加上此刻的事实和目标。\n\n模型一次能够处理的信息有限，阅读更多也会增加成本与冲突。把全部资料交给它，并不保证重要内容被使用；反而可能让旧版本、相似但不适用的案例和当前事实混在一起。\n\n上下文工程讨论的正是怎样组织当前工作材料。外部笔记、检索与信息筛选可以支持持续任务，但它们不自动保证业务知识正确。[工程材料](https://www.anthropic.com/research/effective-context-engineering-for-ai-agents)\n\n## 相似为什么还不够\n\n教学烘焙案例曾在一组给定需求下采用X配100、Y配60。下一次，X附近交通入口关闭，AI却检索到那次好结果，并建议照用。\n\n旧案例与当前都在讨论同种商品、同两家店，文字当然相似。关键差别却是需求条件发生变化。若把历史结论当作当前事实，就会在“相关”之后跳过“适用”。\n\n经验的正确用法，是带回当时需求假设、分配约束和结果，帮助本次提出可检验的方案。新交通事实需要进入本次判断；缺失的需求数量仍是未知，不能由旧案例填满。\n\n![长期资料中只有相关且适用的部分进入本次工作；当前事实与正式规则共同约束判断，旧案例不能覆盖已经变化的条件。](assets/20-当前上下文.svg)\n\n## 四项检查，对应四类错误\n\n相关性回答它是否与当前问题有关。错误可能来自关键词相同、实际任务不同。\n\n当前性回答它是否仍适用。规则版本、客户状态和设备条件都可能变化，旧材料不一定失效，但需要判断。\n\n可信性回答它是什么性质：原始报告、已核事实、候选解释，还是已经过适用检验的方法。相似案例中的猜测，不能在引用时升级成确定原因。\n\n可行动性回答它是否足以支持本次工作。知道过去怎么做，还要知道当前资源、工具与决定范围，否则只是合理建议。\n\n| 材料 | 在本次任务中的作用 |\n|---|---|\n| 当前设备与报修情况 | 界定正在处理什么 |\n| 现行正式规则 | 提供必须遵循的条件 |\n| 相似历史案例 | 提供线索和可比较方法 |\n| 反例与修订 | 防止照搬不适用结论 |\n| 当前资源与状态 | 决定什么能够实际发生 |\n\n它们的地位不同，不能因为都出现在同一段上下文中就被当成同等事实。\n\n## 如何知道材料真的被用对\n\n可以检查一次建议引用了哪些依据，是否识别当前与历史的关键差别，是否把未知补成已知，是否遗漏会改变行动的限制。\n\n检查时不能只看AI给出的解释。解释可能是事后组织出来的，应与实际输入、所用材料和输出核对。对重要任务，可以保留足以重现判断条件的记录，便于排查。\n\n如果反复发生同类错误，改法可能是修订材料状态、改善检索筛选、调整呈现，或者缩小任务范围。单纯要求模型“更加谨慎”通常没有说明问题究竟在哪里。\n\n## 为什么有时少给材料反而更好\n\n简单查询可能只需一条现行规则与一个设备日期，复杂检索反而增加干扰。开放探索则可能需要不同角度的案例，但应清楚哪些事实已经成立、哪些只是候选认识。\n\n企业应按任务准备信息，而不是按资料数量显示智能程度。保存记录、形成可信经验和当前使用，是相连的三段工作。只有最后一段影响了真实判断，前面的积累才开始转为当前能力。\n\n当前判断仍需要接到实际业务。AI建议了什么、负责人采用了什么、系统真正做了什么，必须继续区分。\n","html":"\u003ch1>第20章｜企业拥有经验，AI为什么仍会用错\u003c/h1>\n\u003cp>设想企业已经把历史工单、规则和案例放进知识空间。当前报修涉及V2设备，AI却找到一张措辞很相似的V1工单，并把旧处理结论当作本次答案。\u003c/p>\n\u003cp>资料找到了，但找对相似材料与用对经验，是两件事。\u003c/p>\n\u003cp>\u003cstrong>有效上下文，需要把相关、当前、可信且可行动的信息带进这一次任务。\u003c/strong> 它是组织记忆发挥作用的入口，不等于组织记忆本身。\u003c/p>\n\u003ch2 id=\"lesson-20-section-1\">长期记忆与当前工作材料\u003c/h2>\n\u003cp>长期保存的材料可以很多：原始工单、方法、规则、反例与修订。当前任务需要的只是其中相关部分，加上此刻的事实和目标。\u003c/p>\n\u003cp>模型一次能够处理的信息有限，阅读更多也会增加成本与冲突。把全部资料交给它，并不保证重要内容被使用；反而可能让旧版本、相似但不适用的案例和当前事实混在一起。\u003c/p>\n\u003cp>上下文工程讨论的正是怎样组织当前工作材料。外部笔记、检索与信息筛选可以支持持续任务，但它们不自动保证业务知识正确。\u003ca href=\"https://www.anthropic.com/research/effective-context-engineering-for-ai-agents\" target=\"_blank\" rel=\"noopener noreferrer\">工程材料\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-20-section-2\">相似为什么还不够\u003c/h2>\n\u003cp>教学烘焙案例曾在一组给定需求下采用X配100、Y配60。下一次，X附近交通入口关闭，AI却检索到那次好结果，并建议照用。\u003c/p>\n\u003cp>旧案例与当前都在讨论同种商品、同两家店，文字当然相似。关键差别却是需求条件发生变化。若把历史结论当作当前事实，就会在“相关”之后跳过“适用”。\u003c/p>\n\u003cp>经验的正确用法，是带回当时需求假设、分配约束和结果，帮助本次提出可检验的方案。新交通事实需要进入本次判断；缺失的需求数量仍是未知，不能由旧案例填满。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTUwIiB2aWV3Qm94PSIwIDAgMzYwIDU1MCIgcm9sZT0iaW1nIj48dGl0bGU+5oqK6YCC55So5p2Q5paZ5bim6L+b5b2T5YmN5Lu75YqhPC90aXRsZT48ZGVzYz7ljoblj7LmoYjkvovjgIHmraPlvI/op4TliJnlkozlj43kvovnu4/ov4fmnaHku7bkuI7niYjmnKzmo4Dmn6XvvIzlkozlvZPliY3kuovlrp7lhbHlkIzmlK/mjIHmnKzmrKHlt6XkvZzjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjU1MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iM c/p>\n\u003cp>可信性回答它是什么性质：原始报告、已核事实、候选解释，还是已经过适用检验的方法。相似案例中的猜测，不能在引用时升级成确定原因。\u003c/p>\n\u003cp>可行动性回答它是否足以支持本次工作。知道过去怎么做，还要知道当前资源、工具与决定范围，否则只是合理建议。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>材料\u003c/th>\n\u003cth>在本次任务中的作用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>当前设备与报修情况\u003c/td>\n\u003ctd>界定正在处理什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>现行正式规则\u003c/td>\n\u003ctd>提供必须遵循的条件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>相似历史案例\u003c/td>\n\u003ctd>提供线索和可比较方法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>反例与修订\u003c/td>\n\u003ctd>防止照搬不适用结论\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>当前资源与状态\u003c/td>\n\u003ctd>决定什么能够实际发生\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>它们的地位不同，不能因为都出现在同一段上下文中就被当成同等事实。\u003c/p>\n\u003ch2 id=\"lesson-20-section-4\">如何知道材料真的被用对\u003c/h2>\n\u003cp>可以检查一次建议引用了哪些依据，是否识别当前与历史的关键差别，是否把未知补成已知，是否遗漏会改变行动的限制。\u003c/p>\n\u003cp>检查时不能只看AI给出的解释。解释可能是事后组织出来的，应与实际输入、所用材料和输出核对。对重要任务，可以保留足以重现判断条件的记录，便于排查。\u003c/p>\n\u003cp>如果反复发生同类错误，改法可能是修订材料状态、改善检索筛选、调整呈现，或者缩小任务范围。单纯要求模型“更加谨慎”通常没有说明问题究竟在哪里。\u003c/p>\n\u003ch2 id=\"lesson-20-section-5\">为什么有时少给材料反而更好\u003c/h2>\n\u003cp>简单查询可能只需一条现行规则与一个设备日期，复杂检索反而增加干扰。开放探索则可能需要不同角度的案例，但应清楚哪些事实已经成立、哪些只是候选认识。\u003c/p>\n\u003cp>企业应按任务准备信息，而不是按资料数量显示智能程度。保存记录、形成可信经验和当前使用，是相连的三段工作。只有最后一段影响了真实判断，前面的积累才开始转为当前能力。\u003c/p>\n\u003cp>当前判断仍需要接到实际业务。AI建议了什么、负责人采用了什么、系统真正做了什么，必须继续区分。\u003c/p>\n","headings":[{"id":"lesson-20-section-1","label":"长期记忆与当前工作材料"},{"id":"lesson-20-section-2","label":"相似为什么还不够"},{"id":"lesson-20-section-3","label":"四项检查，对应四类错误"},{"id":"lesson-20-section-4","label":"如何知道材料真的被用对"},{"id":"lesson-20-section-5","label":"为什么有时少给材料反而更好"}],"exportMd":"# 第20章｜企业拥有经验，AI为什么仍会用错\n\n设想企业已经把历史工单、规则和案例放进知识空间。当前报修涉及V2设备，AI却找到一张措辞很相似的V1工单，并把旧处理结论当作本次答案。\n\n资料找到了，但找对相似材料与用对经验，是两件事。\n\n**有效上下文，需要把相关、当前、可信且可行动的信息带进这一次任务。** 它是组织记忆发挥作用的入口，不等于组织记忆本身。\n\n## 长期记忆与当前工作材料\n\n长期保存的材料可以很多：原始工单、方法、规则、反例与修订。当前任务需要的只是其中相关部分，加上此刻的事实和目标。\n\n模型一次能够处理的信息有限，阅读更多也会增加成本与冲突。把全部资料交给它，并不保证重要内容被使用；反而可能让旧版本、相似但不适用的案例和当前事实混在一起。\n\n上下文工程讨论的正是怎样组织当前工作材料。外部笔记、检索与信息筛选可以支持持续任务，但它们不自动保证业务知识正确。[工程材料](https://www.anthropic.com/research/effective-context-engineering-for-ai-agents)\n\n## 相似为什么还不够\n\n教学烘焙案例曾在一组给定需求下采用X配100、Y配60。下一次，X附近交通入口关闭，AI却检索到那次好结果，并建议照用。\n\n旧案例与当前都在讨论同种商品、同两家店，文字当然相似。关键差别却是需求条件发生变化。若把历史结论当作当前事实，就会在“相关”之后跳过“适用”。\n\n经验的正确用法，是带回当时需求假设、分配约束和结果，帮助本次提出可检验的方案。新交通事实需要进入本次判断；缺失的需求数量仍是未知，不能由旧案例填满。\n\n![长期资料中只有相关且适用的部分进入本次工作；当前事实与正式规则共同约束判断，旧案例不能覆盖已经变化的条件。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTUwIiB2aWV3Qm94PSIwIDAgMzYwIDU1MCIgcm9sZT0iaW1nIj48dGl0bGU+5oqK6YCC55So5p2Q5paZ5bim6L+b5b2T5YmN5Lu75YqhPC90aXRsZT48ZGVzYz7ljoblj7LmoYjkvovjgIHmraPlvI/op4TliJnlkozlj43kvovnu4/ov4fmnaHku7bkuI7niYjmnKzmo4Dmn6XvvIzlkozlvZPliY3kuovlrp7lhbHlkIzmlK/mjIHmnKzmrKHlt6XkvZzjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjU1MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7miorpgILnlKjmnZDmlpnluKbov5vlvZPliY3ku7vliqE8L3RleHQ+PHBhdGggZD0iTTIyIDg4SDk0TDExMCAxMDRWMTYzSDIyWiIgZmlsbD0id2hpdGUiIHN0cm9rZT0iIzYwNzM2YyIgc3Ryb2tlLXdpZHRoPSIxLjUiLz48cGF0aCBkPSJNOTQgODhWMTA0SDExMCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjNjA3MzZjIiBzdHJva2Utd2lkdGg9IjEuNSIvPjx0ZXh0IHg9IjY2LjAiIHk9IjEzMS41IiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0 息，而不是按资料数量显示智能程度。保存记录、形成可信经验和当前使用，是相连的三段工作。只有最后一段影响了真实判断，前面的积累才开始转为当前能力。\n\n当前判断仍需要接到实际业务。AI建议了什么、负责人采用了什么、系统真正做了什么，必须继续区分。\n","exportSingleMd":"# 第20章｜企业拥有经验，AI为什么仍会用错\n\n设想企业已经把历史工单、规则和案例放进知识空间。当前报修涉及V2设备，AI却找到一张措辞很相似的V1工单，并把旧处理结论当作本次答案。\n\n资料找到了，但找对相似材料与用对经验，是两件事。\n\n**有效上下文，需要把相关、当前、可信且可行动的信息带进这一次任务。** 它是组织记忆发挥作用的入口，不等于组织记忆本身。\n\n## 长期记忆与当前工作材料\n\n长期保存的材料可以很多：原始工单、方法、规则、反例与修订。当前任务需要的只是其中相关部分，加上此刻的事实和目标。\n\n模型一次能够处理的信息有限，阅读更多也会增加成本与冲突。把全部资料交给它，并不保证重要内容被使用；反而可能让旧版本、相似但不适用的案例和当前事实混在一起。\n\n上下文工程讨论的正是怎样组织当前工作材料。外部笔记、检索与信息筛选可以支持持续任务，但它们不自动保证业务知识正确。[工程材料](https://www.anthropic.com/research/effective-context-engineering-for-ai-agents)\n\n## 相似为什么还不够\n\n教学烘焙案例曾在一组给定需求下采用X配100、Y配60。下一次，X附近交通入口关闭，AI却检索到那次好结果，并建议照用。\n\n旧案例与当前都在讨论同种商品、同两家店，文字当然相似。关键差别却是需求条件发生变化。若把历史结论当作当前事实，就会在“相关”之后跳过“适用”。\n\n经验的正确用法，是带回当时需求假设、分配约束和结果，帮助本次提出可检验的方案。新交通事实需要进入本次判断；缺失的需求数量仍是未知，不能由旧案例填满。\n\n![长期资料中只有相关且适用的部分进入本次工作；当前事实与正式规则共同约束判断，旧案例不能覆盖已经变化的条件。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTUwIiB2aWV3Qm94PSIwIDAgMzYwIDU1MCIgcm9sZT0iaW1nIj48dGl0bGU+5oqK6YCC55So5p2Q5paZ5bim6L+b5b2T5YmN5Lu75YqhPC90aXRsZT48ZGVzYz7ljoblj7LmoYjkvovjgIHmraPlvI/op4TliJnlkozlj43kvovnu4/ov4fmnaHku7bkuI7niYjmnKzmo4Dmn6XvvIzlkozlvZPliY3kuovlrp7lhbHlkIzmlK/mjIHmnKzmrKHlt6XkvZzjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjU1MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ  |\n\n它们的地位不同，不能因为都出现在同一段上下文中就被当成同等事实。\n\n## 如何知道材料真的被用对\n\n可以检查一次建议引用了哪些依据，是否识别当前与历史的关键差别，是否把未知补成已知，是否遗漏会改变行动的限制。\n\n检查时不能只看AI给出的解释。解释可能是事后组织出来的，应与实际输入、所用材料和输出核对。对重要任务，可以保留足以重现判断条件的记录，便于排查。\n\n如果反复发生同类错误，改法可能是修订材料状态、改善检索筛选、调整呈现，或者缩小任务范围。单纯要求模型“更加谨慎”通常没有说明问题究竟在哪里。\n\n## 为什么有时少给材料反而更好\n\n简单查询可能只需一条现行规则与一个设备日期，复杂检索反而增加干扰。开放探索则可能需要不同角度的案例，但应清楚哪些事实已经成立、哪些只是候选认识。\n\n企业应按任务准备信息，而不是按资料数量显示智能程度。保存记录、形成可信经验和当前使用，是相连的三段工作。只有最后一段影响了真实判断，前面的积累才开始转为当前能力。\n\n当前判断仍需要接到实际业务。AI建议了什么、负责人采用了什么、系统真正做了什么，必须继续区分。\n","text":"# 第20章｜企业拥有经验，AI为什么仍会用错\n\n设想企业已经把历史工单、规则和案例放进知识空间。当前报修涉及V2设备，AI却找到一张措辞很相似的V1工单，并把旧处理结论当作本次答案。\n\n资料找到了，但找对相似材料与用对经验，是两件事。\n\n**有效上下文，需要把相关、当前、可信且可行动的信息带进这一次任务。** 它是组织记忆发挥作用的入口，不等于组织记忆本身。\n\n## 长期记忆与当前工作材料\n\n长期保存的材料可以很多：原始工单、方法、规则、反例与修订。当前任务需要的只是其中相关部分，加上此刻的事实和目标。\n\n模型一次能够处理的信息有限，阅读更多也会增加成本与冲突。把全部资料交给它，并不保证重要内容被使用；反而可能让旧版本、相似但不适用的案例和当前事实混在一起。\n\n上下文工程讨论的正是怎样组织当前工作材料。外部笔记、检索与信息筛选可以支持持续任务，但它们不自动保证业务知识正确。工程材料\n\n## 相似为什么还不够\n\n教学烘焙案例曾在一组给定需求下采用X配100、Y配60。下一次，X附近交通入口关闭，AI却检索到那次好结果，并建议照用。\n\n旧案例与当前都在讨论同种商品、同两家店，文字当然相似。关键差别却是需求条件发生变化。若把历史结论当作当前事实，就会在“相关”之后跳过“适用”。\n\n经验的正确用法，是带回当时需求假设、分配约束和结果，帮助本次提出可检验的方案。新交通事实需要进入本次判断；缺失的需求数量仍是未知，不能由旧案例填满。\n\n \n\n## 四项检查，对应四类错误\n\n相关性回答它是否与当前问题有关。错误可能来自关键词相同、实际任务不同。\n\n当前性回答它是否仍适用。规则版本、客户状态和设备条件都可能变化，旧材料不一定失效，但需要判断。\n\n可信性回答它是什么性质：原始报告、已核事实、候选解释，还是已经过适用检验的方法。相似案例中的猜测，不能在引用时升级成确定原因。\n\n可行动性回答它是否足以支持本次工作。知道过去怎么做，还要知道当前资源、工具与决定范围，否则只是合理建议。\n\n| 材料 | 在本次任务中的作用 |\n|---|---|\n| 当前设备与报修情况 | 界定正在处理什么 |\n| 现行正式规则 | 提供必须遵循的条件 |\n| 相似历史案例 | 提供线索和可比较方法 |\n| 反例与修订 | 防止照搬不适用结论 |\n| 当前资源与状态 | 决定什么能够实际发生 |\n\n它们的地位不同，不能因为都出现在同一段上下文中就被当成同等事实。\n\n## 如何知道材料真的被用对\n\n可以检查一次建议引用了哪些依据，是否识别当前与历史的关键差别，是否把未知补成已知，是否遗漏会改变行动的限制。\n\n检查时不能只看AI给出的解释。解释可能是事后组织出来的，应与实际输入、所用材料和输出核对。对重要任务，可以保留足以重现判断条件的记录，便于排查。\n\n如果反复发生同类错误，改法可能是修订材料状态、改善检索筛选、调整呈现，或者缩小任务范围。单纯要求模型“更加谨慎”通常没有说明问题究竟在哪里。\n\n## 为什么有时少给材料反而更好\n\n简单查询可能只需一条现行规则与一个设备日期，复杂检索反而增加干扰。开放探索则可能需要不同角度的案例，但应清楚哪些事实已经成立、哪些只是候选认识。\n\n企业应按任务准备信息，而不是按资料数量显示智能程度。保存记录、形成可信经验和当前使用，是相连的三段工作。只有最后一段影响了真实判断，前面的积累才开始转为当前能力。\n\n当前判断仍需要接到实际业务。AI建议了什么、负责人采用了什么、系统真正做了什么，必须继续区分。\n"},{"file":"21-建议与真实执行.md","id":"lesson-21","number":21,"role":"核心课","part":3,"title":"第21章｜AI说已完成，业务为什么可能还没有发生","md":"# 第21章｜AI说已完成，业务为什么可能还没有发生\n\n在派工教学情境中，AI回复：“已安排技术员上门。”调度员以为派工完成，客户仍在等待。后来才发现，系统只生成了派工建议，没有正式提交。\n\n另一种情况恰好相反：派工系统已经接受任务，只是网络中断没有返回回显。再次提交，又可能重复占用人员。\n\n**让智能进入生产，需要确认它在哪个业务对象上完成了哪种行动。** 文本里的完成与真实状态之间，必须有可核查连接。\n\n## 一次服务包含几个不同事实\n\n教学设备工单可以区分：AI形成建议；调度员决定采用；派工系统接受；技术员到场；客户报告恢复；后续观察是否复发。\n\n这不是为了增加管理栏目。每个状态对应不同问题：有没有决定，动作有没有提交，现场有没有发生，客户有没有得到结果。它们决定下一岗位应该做什么。\n\n同样，烘焙连锁的候选配货表、中央正式分配与实际到店数量不同。建议100/60不能被当作已经送达100/60，否则经营结果就会对应错动作。\n\n![派工建议、采用、系统接受、到场与恢复依次对应不同事实。中断后查已接受状态，才能决定续接还是重试，不能只看最后一句回复。](assets/21-业务状态.svg)\n\n## 工具接入要连接什么\n\n工具使模型能够查询或改变业务系统。企业真正关心的，是它作用于哪张工单、使用什么身份、可以决定什么，以及怎样确认结果。\n\n对象不清，可能处理错设备；范围不清，可能把候选变成正式承诺；结果不清，可能重复执行或无人执行。技术实现需要处理这些关系，正文不必把每个接口参数交给经营者记忆，但必须解释它们为何影响交付。\n\nAgent工程经验说明了模型选择工具与观察结果的方式；FDE岗位中的集成职责，则对应把这些方式接入真实企业系统的工作。[工程材料](https://www.anthropic.com/research/building-effective-agents)、[岗位自述](https://jobs.lever.co/palantir/84131e3f-455e-47fc-9c11-898d95f09048)\n\n## 中断后，先辨认已经发生什么\n\n假设派工提交后没有返回。此时“没有看到结果”只说明当前不知道，不说明系统没接受。合理续接应先查这笔工单是否已有对应派工，再决定是否继续提交。\n\n如果查到已接受，就接着跟进，不重复占用人员；若确认未接受，再按当前安排重试；若状态仍未知，就保留未知并交给相应处理。具体实现可以不同，但业务含义要一致。\n\n这类能力使连续工作能跨越网络、工具与人员切换，而非要求每次都重新开始。它也是智能伙伴与一次聊天的重要区别。\n\n## 确认并不等于每步都由人点击\n\n稳定、可核验的动作可以由系统直接完成并返回证据。需要业务取舍的动作，由有相应职责的人决定；经过实际验证的常规判断，也可以逐步扩大AI承担范围。\n\n关键是每种确认要解决什么不确定性。形式上的按钮可能没有检查实际对象和结果；可靠的系统反馈则可以减少无效人工。\n\n只有分析用途的任务，也不必制造执行动作。例如比较几种服务路线，本来就应产生候选与依据，而非自动承诺客户。\n\n## 真正结果还在状态链之后\n\n即使技术员到场，客户也可能尚未恢复；即使恢复，当次观察也未证明长期稳定。系统应让完成的范围可以被理解，避免把一个中间节点包装成最终价值。\n\n机器学习系统研究强调，模型之外的依赖和反馈同样决定长期可靠性。业务状态是其中一项很具体的依赖。[原始研究](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n企业在验收一项智能工作时，可以沿一笔真实业务追问：建议在哪里形成，谁采用，动作怎样确认，下一岗位看到什么，客户结果如何返回。追得通，才有条件讨论持续运行；追不通，再流畅的“完成”都仍有缺口。\n","html":"\u003ch1>第21章｜AI说已完成，业务为什么可能还没有发生\u003c/h1>\n\u003cp>在派工教学情境中，AI回复：“已安排技术员上门。”调度员以为派工完成，客户仍在等待。后来才发现，系统只生成了派工建议，没有正式提交。\u003c/p>\n\u003cp>另一种情况恰好相反：派工系统已经接受任务，只是网络中断没有返回回显。再次提交，又可能重复占用人员。\u003c/p>\n\u003cp>\u003cstrong>让智能进入生产，需要确认它在哪个业务对象上完成了哪种行动。\u003c/strong> 文本里的完成与真实状态之间，必须有可核查连接。\u003c/p>\n\u003ch2 id=\"lesson-21-section-1\">一次服务包含几个不同事实\u003c/h2>\n\u003cp>教学设备工单可以区分：AI形成建议；调度员决定采用；派工系统接受；技术员到场；客户报告恢复；后续观察是否复发。\u003c/p>\n\u003cp>这不是为了增加管理栏目。每个状态对应不同问题：有没有决定，动作有没有提交，现场有没有发生，客户有没有得到结果。它们决定下一岗位应该做什么。\u003c/p>\n\u003cp>同样，烘焙连锁的候选配货表、中央正式分配与实际到店数量不同。建议100/60不能被当作已经送达100/60，否则经营结果就会对应错动作。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTc1IiB2aWV3Qm94PSIwIDAgMzYwIDU3NSIgcm9sZT0iaW1nIj48dGl0bGU+5q+P5Liq54q25oCB6YO95piv5LiN5ZCM5LqL5a6ePC90aXRsZT48ZGVzYz7lu7rorq7jgIHph4fnlKjjgIHns7vnu5/mjqXlj5fjgIHliLDlnLrlkozmgaLlpI3kuI3og73nm7jkupLmm7/ku6PvvJvml6Dlm57mmL7ml7blhYjmn6Xlrp7pmYXnirbmgIHjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjU3NSIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7mr4/kuKrnirbmgIHpg73mmK/kuI3lkIzkuovlrp48L3RleHQ+PGNpcmNsZSBjeD0iMzUiIGN5PSIxMDMiIHI9IjE3IiBmaWxsPSIjZWRmM2VkIiBzdHJva2U9IiMxNjVkNTIiIHN0cm9rZS13aWR0aD0iMiIvPjx0ZXh0IHg9IjM1IiB5PSIxMTAiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxOCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC13ZWlnaHQ9IjQwMCI+MTwvdGV4dD48cmVjdCB4PSI3MiIgeT0iNzgiIHdpZHRoPSIyNTEiIGh /5YWN6YeN5aSN5rS+5belPC90ZXh0Pjwvc3ZnPg==\" alt=\"派工建议、采用、系统接受、到场与恢复依次对应不同事实。中断后查已接受状态，才能决定续接还是重试，不能只看最后一句回复。\">\u003c/p>\n\u003ch2 id=\"lesson-21-section-2\">工具接入要连接什么\u003c/h2>\n\u003cp>工具使模型能够查询或改变业务系统。企业真正关心的，是它作用于哪张工单、使用什么身份、可以决定什么，以及怎样确认结果。\u003c/p>\n\u003cp>对象不清，可能处理错设备；范围不清，可能把候选变成正式承诺；结果不清，可能重复执行或无人执行。技术实现需要处理这些关系，正文不必把每个接口参数交给经营者记忆，但必须解释它们为何影响交付。\u003c/p>\n\u003cp>Agent工程经验说明了模型选择工具与观察结果的方式；FDE岗位中的集成职责，则对应把这些方式接入真实企业系统的工作。\u003ca href=\"https://www.anthropic.com/research/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">工程材料\u003c/a>、\u003ca href=\"https://jobs.lever.co/palantir/84131e3f-455e-47fc-9c11-898d95f09048\" target=\"_blank\" rel=\"noopener noreferrer\">岗位自述\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-21-section-3\">中断后，先辨认已经发生什么\u003c/h2>\n\u003cp>假设派工提交后没有返回。此时“没有看到结果”只说明当前不知道，不说明系统没接受。合理续接应先查这笔工单是否已有对应派工，再决定是否继续提交。\u003c/p>\n\u003cp>如果查到已接受，就接着跟进，不重复占用人员；若确认未接受，再按当前安排重试；若状态仍未知，就保留未知并交给相应处理。具体实现可以不同，但业务含义要一致。\u003c/p>\n\u003cp>这类能力使连续工作能跨越网络、工具与人员切换，而非要求每次都重新开始。它也是智能伙伴与一次聊天的重要区别。\u003c/p>\n\u003ch2 id=\"lesson-21-section-4\">确认并不等于每步都由人点击\u003c/h2>\n\u003cp>稳定、可核验的动作可以由系统直接完成并返回证据。需要业务取舍的动作，由有相应职责的人决定；经过实际验证的常规判断，也可以逐步扩大AI承担范围。\u003c/p>\n\u003cp>关键是每种确认要解决什么不确定性。形式上的按钮可能没有检查实际对象和结果；可靠的系统反馈则可以减少无效人工。\u003c/p>\n\u003cp>只有分析用途的任务，也不必制造执行动作。例如比较几种服务路线，本来就应产生候选与依据，而非自动承诺客户。\u003c/p>\n\u003ch2 id=\"lesson-21-section-5\">真正结果还在状态链之后\u003c/h2>\n\u003cp>即使技术员到场，客户也可能尚未恢复；即使恢复，当次观察也未证明长期稳定。系统应让完成的范围可以被理解，避免把一个中间节点包装成最终价值。\u003c/p>\n\u003cp>机器学习系统研究强调，模型之外的依赖和反馈同样决定长期可靠性。业务状态是其中一项很具体的依赖。\u003ca href=\"https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003cp>企业在验收一项智能工作时，可以沿一笔真实业务追问：建议在哪里形成，谁采用，动作怎样确认，下一岗位看到什么，客户结果如何返回。追得通，才有条件讨论持续运行；追不通，再流畅的“完成”都仍有缺口。\u003c/p>\n","headings":[{"id":"lesson-21-section-1","label":"一次服务包含几个不同事实"},{"id":"lesson-21-section-2","label":"工具接入要连接什么"},{"id":"lesson-21-section-3","label":"中断后，先辨认已经发生什么"},{"id":"lesson-21-section-4","label":"确认并不等于每步都由人点击"},{"id":"lesson-21-section-5","label":"真正结果还在状态链之后"}],"exportMd":"# 第21章｜AI说已完成，业务为什么可能还没有发生\n\n在派工教学情境中，AI回复：“已安排技术员上门。”调度员以为派工完成，客户仍在等待。后来才发现，系统只生成了派工建议，没有正式提交。\n\n另一种情况恰好相反：派工系统已经接受任务，只是网络中断没有返回回显。再次提交，又可能重复占用人员。\n\n**让智能进入生产，需要确认它在哪个业务对象上完成了哪种行动。** 文本里的完成与真实状态之间，必须有可核查连接。\n\n## 一次服务包含几个不同事实\n\n教学设备工单可以区分：AI形成建议；调度员决定采用；派工系统接受；技术员到场；客户报告恢复；后续观察是否复发。\n\n这不是为了增加管理栏目。每个状态对应不同问题：有没有决定，动作有没有提交，现场有没有发生，客户有没有得到结果。它们决定下一岗位应该做什么。\n\n同样，烘焙连锁的候选配货表、中央正式分配与实际到店数量不同。建议100/60不能被当作已经送达100/60，否则经营结果就会对应错动作。\n\n![派工建议、采用、系统接受、到场与恢复依次对应不同事实。中断后查已接受状态，才能决定续接还是重试，不能只看最后一句回复。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTc1IiB2aWV3Qm94PSIwIDAgMzYwIDU3NSIgcm9sZT0iaW1nIj48dGl0bGU+5q+P5Liq54q25oCB6YO95piv5LiN5ZCM5LqL5a6ePC90aXRsZT48ZGVzYz7lu7rorq7jgIHph4fnlKjjgIHns7vnu5/mjqXlj5fjgIHliLDlnLrlkozmgaLlpI3kuI3og73nm7jkupLmm7/ku6PvvJvml6Dlm57mmL7ml7blhYjmn6Xlrp7pmYXnirbmgIHjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjU3NSIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7mr4/kuKrnirbmgIHpg73mmK/kuI3lkIzkuovlrp48L3RleHQ+PGNpcmNsZSBjeD0iMzUiIGN5PSIxMDMiIHI9IjE3IiBmaWxsPSIjZWRmM2VkIiBzdHJva2U9IiMxNjVkNTIiIHN0cm9rZS13aWR0aD0iMiIvPjx0ZXh0IHg9IjM1IiB5PSIxMTAiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxOCIgZmlsbD0i \n## 确认并不等于每步都由人点击\n\n稳定、可核验的动作可以由系统直接完成并返回证据。需要业务取舍的动作，由有相应职责的人决定；经过实际验证的常规判断，也可以逐步扩大AI承担范围。\n\n关键是每种确认要解决什么不确定性。形式上的按钮可能没有检查实际对象和结果；可靠的系统反馈则可以减少无效人工。\n\n只有分析用途的任务，也不必制造执行动作。例如比较几种服务路线，本来就应产生候选与依据，而非自动承诺客户。\n\n## 真正结果还在状态链之后\n\n即使技术员到场，客户也可能尚未恢复；即使恢复，当次观察也未证明长期稳定。系统应让完成的范围可以被理解，避免把一个中间节点包装成最终价值。\n\n机器学习系统研究强调，模型之外的依赖和反馈同样决定长期可靠性。业务状态是其中一项很具体的依赖。[原始研究](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n企业在验收一项智能工作时，可以沿一笔真实业务追问：建议在哪里形成，谁采用，动作怎样确认，下一岗位看到什么，客户结果如何返回。追得通，才有条件讨论持续运行；追不通，再流畅的“完成”都仍有缺口。\n","text":"# 第21章｜AI说已完成，业务为什么可能还没有发生\n\n在派工教学情境中，AI回复：“已安排技术员上门。”调度员以为派工完成，客户仍在等待。后来才发现，系统只生成了派工建议，没有正式提交。\n\n另一种情况恰好相反：派工系统已经接受任务，只是网络中断没有返回回显。再次提交，又可能重复占用人员。\n\n**让智能进入生产，需要确认它在哪个业务对象上完成了哪种行动。** 文本里的完成与真实状态之间，必须有可核查连接。\n\n## 一次服务包含几个不同事实\n\n教学设备工单可以区分：AI形成建议；调度员决定采用；派工系统接受；技术员到场；客户报告恢复；后续观察是否复发。\n\n这不是为了增加管理栏目。每个状态对应不同问题：有没有决定，动作有没有提交，现场有没有发生，客户有没有得到结果。它们决定下一岗位应该做什么。\n\n同样，烘焙连锁的候选配货表、中央正式分配与实际到店数量不同。建议100/60不能被当作已经送达100/60，否则经营结果就会对应错动作。\n\n \n\n## 工具接入要连接什么\n\n工具使模型能够查询或改变业务系统。企业真正关心的，是它作用于哪张工单、使用什么身份、可以决定什么，以及怎样确认结果。\n\n对象不清，可能处理错设备；范围不清，可能把候选变成正式承诺；结果不清，可能重复执行或无人执行。技术实现需要处理这些关系，正文不必把每个接口参数交给经营者记忆，但必须解释它们为何影响交付。\n\nAgent工程经验说明了模型选择工具与观察结果的方式；FDE岗位中的集成职责，则对应把这些方式接入真实企业系统的工作。工程材料、岗位自述\n\n## 中断后，先辨认已经发生什么\n\n假设派工提交后没有返回。此时“没有看到结果”只说明当前不知道，不说明系统没接受。合理续接应先查这笔工单是否已有对应派工，再决定是否继续提交。\n\n如果查到已接受，就接着跟进，不重复占用人员；若确认未接受，再按当前安排重试；若状态仍未知，就保留未知并交给相应处理。具体实现可以不同，但业务含义要一致。\n\n这类能力使连续工作能跨越网络、工具与人员切换，而非要求每次都重新开始。它也是智能伙伴与一次聊天的重要区别。\n\n## 确认并不等于每步都由人点击\n\n稳定、可核验的动作可以由系统直接完成并返回证据。需要业务取舍的动作，由有相应职责的人决定；经过实际验证的常规判断，也可以逐步扩大AI承担范围。\n\n关键是每种确认要解决什么不确定性。形式上的按钮可能没有检查实际对象和结果；可靠的系统反馈则可以减少无效人工。\n\n只有分析用途的任务，也不必制造执行动作。例如比较几种服务路线，本来就应产生候选与依据，而非自动承诺客户。\n\n## 真正结果还在状态链之后\n\n即使技术员到场，客户也可能尚未恢复；即使恢复，当次观察也未证明长期稳定。系统应让完成的范围可以被理解，避免把一个中间节点包装成最终价值。\n\n机器学习系统研究强调，模型之外的依赖和反馈同样决定长期可靠性。业务状态是其中一项很具体的依赖。原始研究\n\n企业在验收一项智能工作时，可以沿一笔真实业务追问：建议在哪里形成，谁采用，动作怎样确认，下一岗位看到什么，客户结果如何返回。追得通，才有条件讨论持续运行；追不通，再流畅的“完成”都仍有缺口。\n"},{"file":"22-持续运行与系统演化.md","id":"lesson-22","number":22,"role":"核心课","part":3,"title":"第22章｜第一次可用之后，系统靠什么保持有效","md":"# 第22章｜第一次可用之后，系统靠什么保持有效\n\n假设AI工单助手上线时表现良好。后来设备版本更新，保修规则变化，专业人员换岗，模型也升级了。界面仍然能打开，旧方法却开始被用于新情况。\n\n系统没有停止运行，不代表原来的有效条件仍然存在。\n\n**AI系统的长期价值，取决于企业持续维护事实、方法、工具、评价与接续的能力。** 维护是生产的一部分，应在建设时被考虑。\n\n## 变化会从不同位置进入\n\n资料变化可能只需要更新现行规则；业务方式变化可能需要重设计岗位和状态；模型变化可能影响理解、措辞和工具选择；人员变化则可能暴露原来靠个人补足的前提。\n\n这些变化会相互影响。例如新设备版本加入，检索仍返回旧案例，AI又以更确定的语气总结，接任人员不知道原限制，结果偏差就可能被放大。\n\n因此，系统需要分清资料、方法、工具与工作安排的责任。并非每项变化都要重建平台，但应知道由谁判断影响、怎样检查、什么情况需要调整使用范围。\n\n## 保留能比较的任务，而非只保留成功截图\n\n一次模型变更后，可以用过去代表性任务、新出现的例外与尚未用于调试的材料比较。看任务质量、人工核验、执行和时间是否变化，不能只问新模型看起来是否更聪明。\n\n教学设备案例至少应包含常规查询、版本冲突、动作缺项和中断续接。教学连锁则应包含正常需求与交通变化。这样才有机会看见旧能力是否保留、新能力是否成立。\n\n过去曾有效的测量也需要随任务更新。METR后续方法讨论提示，人员选择和并行使用会改变测量条件；新工作方式不能简单沿用旧的时间口径。[方法更新](https://metr.org/blog/2026-02-24-uplift-update/)\n\n## 维护成本为什么常在后面出现\n\n原型通常围绕少量熟悉材料，由原开发者现场照看。扩大使用后，资料版本、工具状态、权限、人员和任务组合更多，原来隐含的依赖开始显现。\n\nSculley等研究把这些外围依赖、反馈和维护负担称为机器学习系统的重要技术债来源。它提醒企业，模型只是整个系统的一部分。[原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n企业不必据此一开始就搭建庞大平台。更有用的是把当前必需条件说明白：数据从哪里来，规则谁更新，实际结果谁观察，中断由谁处理，以及原人员不在时怎样接续。\n\n## 将互补投入纳入经营\n\n新技术的作用往往依赖流程、人员、组织与产品变化。关于生产率J曲线的研究讨论了这类互补投入及其测量问题，但宏观关系不是单项目现金回本保证。[原始研究记录](https://www.nber.org/papers/w25148)\n\n在实际项目中，应列出持续整理、评价、系统维护与业务配合所需资源。若一直靠专家无偿加班维持，表面的低模型费用可能掩盖真实成本。\n\n也要允许缩小或停止不经济部分。低频功能可能采用轻维护或现成服务；过时方法可以停用；没有增量的复杂组件可以移除。持续建设不等于持续加东西。\n\n## 怎样保持可演化，而非每次推倒重来\n\n有效积累包括可追溯案例、清楚的业务含义、可比较任务、工具连接和内部理解。新变化到来时，企业可以复用这些基础，只对需要重新认识的部分投入。\n\n例如新增门店可以沿用事件、建议、执行与结果的共同结构，同时重新学习客群和配送条件。新设备系列可以沿用工单链，但不盲目复制技术方法。\n\n持续运行最终需要经营判断：哪些能力值得保留，智能资源投在哪里，维护与探索怎样竞争预算。接下来六章将把这些问题展开为智能资源经营。\n","html":"\u003ch1>第22章｜第一次可用之后，系统靠什么保持有效\u003c/h1>\n\u003cp>假设AI工单助手上线时表现良好。后来设备版本更新，保修规则变化，专业人员换岗，模型也升级了。界面仍然能打开，旧方法却开始被用于新情况。\u003c/p>\n\u003cp>系统没有停止运行，不代表原来的有效条件仍然存在。\u003c/p>\n\u003cp>\u003cstrong>AI系统的长期价值，取决于企业持续维护事实、方法、工具、评价与接续的能力。\u003c/strong> 维护是生产的一部分，应在建设时被考虑。\u003c/p>\n\u003ch2 id=\"lesson-22-section-1\">变化会从不同位置进入\u003c/h2>\n\u003cp>资料变化可能只需要更新现行规则；业务方 id":"lesson-22-section-2","label":"保留能比较的任务，而非只保留成功截图"},{"id":"lesson-22-section-3","label":"维护成本为什么常在后面出现"},{"id":"lesson-22-section-4","label":"将互补投入纳入经营"},{"id":"lesson-22-section-5","label":"怎样保持可演化，而非每次推倒重来"}],"exportMd":"# 第22章｜第一次可用之后，系统靠什么保持有效\n\n假设AI工单助手上线时表现良好。后来设备版本更新，保修规则变化，专业人员换岗，模型也升级了。界面仍然能打开，旧方法却开始被用于新情况。\n\n系统没有停止运行，不代表原来的有效条件仍然存在。\n\n**AI系统的长期价值，取决于企业持续维护事实、方法、工具、评价与接续的能力。** 维护是生产的一部分，应在建设时被考虑。\n\n## 变化会从不同位置进入\n\n资料变化可能只需要更新现行规则；业务方式变化可能需要重设计岗位和状态；模型变化可能影响理解、措辞和工具选择；人员变化则可能暴露原来靠个人补足的前提。\n\n这些变化会相互影响。例如新设备版本加入，检索仍返回旧案例，AI又以更确定的语气总结，接任人员不知道原限制，结果偏差就可能被放大。\n\n因此，系统需要分清资料、方法、工具与工作安排的责任。并非每项变化都要重建平台，但应知道由谁判断影响、怎样检查、什么情况需要调整使用范围。\n\n## 保留能比较的任务，而非只保留成功截图\n\n一次模型变更后，可以用过去代表性任务、新出现的例外与尚未用于调试的材料比较。看任务质量、人工核验、执行和时间是否变化，不能只问新模型看起来是否更聪明。\n\n教学设备案例至少应包含常规查询、版本冲突、动作缺项和中断续接。教学连锁则应包含正常需求与交通变化。这样才有机会看见旧能力是否保留、新能力是否成立。\n\n过去曾有效的测量也需要随任务更新。METR后续方法讨论提示，人员选择和并行使用会改变测量条件；新工作方式不能简单沿用旧的时间口径。[方法更新](https://metr.org/blog/2026-02-24-uplift-update/)\n\n## 维护成本为什么常在后面出现\n\n原型通常围绕少量熟悉材料，由原开发者现场照看。扩大使用后，资料版本、工具状态、权限、人员和任务组合更多，原来隐含的依赖开始显现。\n\nSculley等研究把这些外围依赖、反馈和维护负担称为机器学习系统的重要技术债来源。它提醒企业，模型只是整个系统的一部分。[原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n企业不必据此一开始就搭建庞大平台。更有用的是把当前必需条件说明白：数据从哪里来，规则谁更新，实际结果谁观察，中断由谁处理，以及原人员不在时怎样接续。\n\n## 将互补投入纳入经营\n\n新技术的作用往往依赖流程、人员、组织与产品变化。关于生产率J曲线的研究讨论了这类互补投入及其测量问题，但宏观关系不是单项目现金回本保证。[原始研究记录](https://www.nber.org/papers/w25148)\n\n在实际项目中，应列出持续整理、评价、系统维护与业务配合所需资源。若一直靠专家无偿加班维持，表面的低模型费用可能掩盖真实成本。\n\n也要允许缩小或停止不经济部分。低频功能可能采用轻维护或现成服务；过时方法可以停用；没有增量的复杂组件可以移除。持续建设不等于持续加东西。\n\n## 怎样保持可演化，而非每次推倒重来\n\n有效积累包括可追溯案例、清楚的业务含义、可比较任务、工具连接和内部理解。新变化到来时，企业可以复用这些基础，只对需要重新认识的部分投入。\n\n例如新增门店可以沿用事件、建议、执行与结果的共同结构，同时重新学习客群和配送条件。新设备系列可以沿用工单链，但不盲目复制技术方法。\n\n持续运行最终需要经营判断：哪些能力值得保留，智能资源投在哪里，维护与探索怎样竞争预算。接下来六章将把这些问题展开为智能资源经营。\n","exportSingleMd":"# 第22章｜第一次可用之后，系统靠什么保持有效\n\n假设AI工单助手上线时表现良好。后来设备版本更新，保修规则变化，专业人员换岗，模型也升级了。界面仍然能打开，旧方法却开始被用于新情况。\n\n系统没有停止运行，不代表原来的有效条件仍然存在。\n\n**AI系统的长期价值，取决于企业持续维护事实、方法、工具、评价与接续的能力。** 维护是生产的一部分，应在建设时被考虑。\n\n## 变化会从不同位置进入\n\n资料变化可能只需要更新现行规则；业务方式变化可能需要重设计岗位和状态；模型变化可能影响理解、措辞和工具选择；人员变化则可能暴露原来靠个人补足的前提。\n\n这些变化会相互影响。例如新设备版本加入，检索仍返回旧案例，AI又以更确定的语气总结，接任人员不知道原限制，结果偏差就可能被放大。\n\n因此，系统需要分清资料、方法、工具与工作安排的责任。并非每项变化都要重建平台，但应知道由谁判断影响、怎样检查、什么情况需要调整使用范围。\n\n## 保留能比较的任务，而非只保留成功截图\n\n一次模型变更后，可以用过去代表性任务、新出现的例外与尚未用于调试的材料比较。看任务质量、人工核验、执行和时间是否变化，不能只问新模型看起来是否更聪明。\n\n教学设备案例至少应包含常规查询、版本冲突、动作缺项和中断续接。教学连锁则应包含正常需求与交通变化。这样才有机会看见旧能力是否保留、新能力是否成立。\n\n过去曾有效的测量也需要随任务更新。METR后续方法讨论提示，人员选择和并行使用会改变测量条件；新工作方式不能简单沿用旧的时间口径。[方法更新](https://metr.org/blog/2026-02-24-uplift-update/)\n\n## 维护成本为什么常在后面出现\n\n原型通常围绕少量熟悉材料，由原开发者现场照看。扩大使用后，资料版本、工具状态、权限、人员和任务组合更多，原来隐含的依赖开始显现。\n\nSculley等研究把这些外围依赖、反馈和维护负担称为机器学习系统的重要技术债来源。它提醒企业，模型只是整个系统的一部分。[原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n企业不必据此一开始就搭建庞大平台。更有用的是把当前必需条件说明白：数据从哪里来，规则谁更新，实际结果谁观察，中断由谁处理，以及原人员不在时怎样接续。\n\n## 将互补投入纳入经营\n\n新技术的作用往往依赖流程、人员、组织与产品变化。关于生产率J曲线的研究讨论了这类互补投入及其测量问题，但宏观关系不是单项目现金回本保证。[原始研究记录](https://www.nber.org/papers/w25148)\n\n在实际项目中，应列出持续整理、评价、系统维护与业务配合所需资源。若一直靠专家无偿加班维持，表面的低模型费用可能掩盖真实成本。\n\n也要允许缩小或停止不经济部分。低频功能可能采用轻维护或现成服务；过时方法可以停用；没有增量的复杂组件可以移除。持续建设不等于持续加东西。\n\n## 怎样保持可演化，而非每次推倒重来\n\n有效积累包括可追溯案例、清楚的业务含义、可比较任务、工具连接和内部理解。新变化到来时，企业可以复用这些基础，只对需要重新认识的部分投入。\n\n例如新增门店可以沿用事件、建议、执行与结果的共同结构，同时重新学习客群和配送条件。新设备系列可以沿用工单链，但不盲目复制技术方法。\n\n持续运行最终需要经营判断：哪些能力值得保留，智能资源投在哪里，维护与探索怎样竞争预算。接下来六章将把这些问题展开为智能资源经营。\n","text":"# 第22章｜第一次可用之后，系统靠什么保持有效\n\n假设AI工单助手上线时表现良好。后来设备版本更新，保修规则变化，专业人员换岗，模型也升级了。界面仍然能打开，旧方法却开始被用于新情况。\n\n系统没有停止运行，不代表原来的有效条件仍然存在。\n\n**AI系统的长期价值，取决于企业持续维护事实、方法、工具、评价与接续的能力。** 维护是生产的一部分，应在建设时被考虑。\n\n## 变化会从不同位置进入\n\n资料变化可能只需要更新现行规则；业务方式变化可能需要重设计岗位和状态；模型变化可能影响理解、措辞和工具选择；人员变化则可能暴露原来靠个人补足的前提。\n\n这些变化会相互影响。例如新设备版本加入，检索仍返回旧案例，AI又以更确定的语气总结，接任人员不知道原限制，结果偏差就可能被放大。\n\n因此，系统需要分清资料、方法、工具与工作安排的责任。并非每项变化都要重建平台，但应知道由谁判断影响、怎样检查、什么情况需要调整使用范围。\n\n## 保留能比较的任务，而非只保留成功截图\n\n一次模型变更后，可以用过去代表性任务、新出现的例外与尚未用于调试的材料比较。看任务质量、人工核验、执行和时间是否变化，不能只问新模型看起来是否更聪明。\n\n教学设备案例至少应包含常规查询、版本冲突、动作缺项和中断续接。教学连锁则应包含正常需求与交通变化。这样才有机会看见旧能力是否保留、新能力是否成立。\n\n过去曾有效的测量也需要随任务更新。METR后续方法讨论提示，人员选择和并行使用会改变测量条件；新工作方式不能简单沿用旧的时间口径。方法更新\n\n## 维护成本为什么常在后面出现\n\n原型通常围绕少量熟悉材料，由原开发者现场照看。扩大使用后，资料版本、工具状态、权限、人员和任务组合更多，原来隐含的依赖开始显现。\n\nSculley等研究把这些外围依赖、反馈和维护负担称为机器学习系统的重要技术债来源。它提醒企业，模型只是整个系统的一部分。原始论文\n\n企业不必据此一开始就搭建庞大平台。更有用的是把当前必需条件说明白：数据从哪里来，规则谁更新，实际结果谁观察，中断由谁处理，以及原人员不在时怎样接续。\n\n## 将互补投入纳入经营\n\n新技术的作用往往依赖流程、人员、组织与产品变化。关于生产率J曲线的研究讨论了这类互补投入及其测量问题，但宏观关系不是单项目现金回本保证。原始研究记录\n\n在实际项目中，应列出持续整理、评价、系统维护与业务配合所需资源。若一直靠专家无偿加班维持，表面的低模型费用可能掩盖真实成本。\n\n也要允许缩小或停止不经济部分。低频功能可能采用轻维护或现成服务；过时方法可以停用；没有增量的复杂组件可以移除。持续建设不等于持续加东西。\n\n## 怎样保持可演化，而非每次推倒重来\n\n有效积累包括可追溯案例、清楚的业务含义、可比较任务、工具连接和内部理解。新变化到来时，企业可以复用这些基础，只对需要重新认识的部分投入。\n\n例如新增门店可以沿用事件、建议、执行与结果的共同结构，同时重新学习客群和配送条件。新设备系列可以沿用工单链，但不盲目复制技术方法。\n\n持续运行最终需要经营判断：哪些能力值得保留，智能资源投在哪里，维护与探索怎样竞争预算。接下来六章将把这些问题展开为智能资源经营。\n"},{"file":"23-token与智能资源.md","id":"lesson-23","number":23,"role":"核心课","part":4,"title":"第23章｜token进入经营，企业真正需要掌握什么","md":"# 第23章｜token进入经营，企业真正需要掌握什么\n\nAI费用上升时，企业可能要求所有团队减少token；也可能把调用量增长当成转型进展。两种做法都抓住了可见数字，却还没有说明智能资源用得怎样。\n\ntoken是模型处理输入与输出的计量单位，可能对应字词或其片段。它帮助计量资源，却不是企业价值单位。同样数量在不同模型、任务和输入条件下，不代表同样能力。\n\n**企业需要经营的是可调度智能：它具有什么能力，何时可得，怎样进入生产，以及投入之后留下什么。** token让这种投入变得可见，但经营判断需要越过用量。\n\n## 智能资源不只有一个数量维度\n\n任务要求可能是正确理解、专业比较、代码制作或连续行动。不同供给在质量、时效、容量与工具条件上不同。\n\n例如客服高峰需要及时响应，长期分析可能允许更慢但更充分的比较；简单日期查询不需要复杂推理，资料冲突却可能需要更多检查。企业要取得的智能供给，应与这些工作条件相配。\n\n基础模型扩展了可复用能力的范围，企业专属事实、方法和履约资源仍需接入。把智能视为生产资源，意味着可以选择、安排、组合与持续改进其使用，而非把每次调用当孤立技术动作。[基础模型研究](https://arxiv.org/abs/2108.07258v3)\n\n## 三种转换，需要分别观察\n\n第一种是有效利用：投入之后，形成多少符合任务要求的工作。更多文字不必然是更多合格工作，核验与返工也要计入。\n\n第二种是价值转换：合格工作是否进入实际决定和交付，改善客户或经营结果。一份正确报告没有被采用，价值路径与一项实际执行的改进不同。\n\n第三种是能力留存：本轮工作是否留下有条件、可再用的经验、工具或协作能力，使下一次任务更好做。累计输出与累计token，不能直接说明这项变化。\n\n| 转换 | 可观察的问题 | 容易误用的替代数字 |\n|---|---|---|\n| 投入→合格工作 | 同等任务质量下需要多少总资源 | 总输出量、单次费用 |\n| 合格工作→经营结果 | 谁采用，何种动作和结果改变 | 使用次数、满意度 |\n| 本轮工作→未来能力 | 新任务、接任或迁移是否受益 | 文档数、累计token |\n\n三者可能方向不同。一个方案降低当前费用，却增加人工负担；一个探索本期不增加交付，却为后续判断留下有用认识。企业需要说明具体关系。\n\n## 为什么资源与资产要一起理解\n\n当期智能使用会被消耗，留下的能力才可能长期发挥作用。企业在战略意义上重视“智能资产”，既包括取得与配置供给的能力，也包括通过使用形成的知识和生产条件。\n\n这不要求把每个token都资本化，更不能凭累计账单计算企业知识净值。经营上更实际的问题是：本轮投入服务什么用途，未来在哪里再用，谁维护，怎样知道它还有效。\n\n关于技术互补投入的研究说明，流程、组织和人力等建设会影响技术作用。这支持同时看供给与使用条件，不能据此给所有知识任意标价。[研究记录](https://www.nber.org/papers/w25148)\n\n## 单价低，为什么不一定更经济\n\n课程的独立教学算例比较两种方案处理同一千项任务。A模型费用较少，却需要更多复核与返工；B调用更贵，列示总成本反而更低。完整计算将在第26章展开。\n\n另一家教学专业服务机构每天能生成20份报告，专家每天只能核验4份。即使生成费用很低，未核产出也会持续积压。智能资源经营因此同时涉及任务配置与整条产能链。\n\n## 用什么问题代替“调用够不够多”\n\n可以先把投入对应到具体工作：谁在什么任务上使用，什么算合格，结果去哪里，下一次怎样受益。再检查资源是否花在真正限制结果的地方。\n\n减少无效长输出、补齐关键事实、改进工具连接、提高候选质量，都可能比压低每次单价更有作用。对于特定推理任务，追加计算的效果也与策略和难度有关，不能一概假定越多越好。[推理资源研究](https://arxiv.org/abs/2408.03314)\n\n下一周期的差距，可能体现在企业能否把类似智能供给转为更好的工作与积累。这个判断有具体机制，也需要持续证据。资源应当如何配置，要从每一种任务的边际作用开始。\n","html":"\u003ch1>第23章｜token进入经营，企业真正需要掌握什么\u003c/h1>\n\u003cp>AI费用上升时，企业可能要求所有团队减少token；也可能把调用量增长当成转型进展。两种做法都抓住了可见数字，却还没有说明智能资源用得怎样。\u003c/p>\n\u003cp>token是模型处理输入与输出的计量单位，可能对应字词或其片段。它帮助计量资源，却不是企业价值单位。同样数量在不同模型、任务和输入条件下，不代表同样能力。\u003c/p>\n\u003cp>\u003cstrong>企业需要经营的是可调度智能：它具有什么能力，何时可得，怎样进入生产，以及投入之后留下什么。\u003c/strong> token让这种投入变得可见，但经营判断需要越过用量。\u003c/p>\n\u003ch2 id=\"lesson-23-section-1\">智能资源不只有一个数量维度\u003c/h2>\n\u003cp>任务要求可能是正确理解、专业比较、代码制作或连续行动。不同供给在质量、时效、容量与工具条件上不同。\u003c/p>\n\u003cp>例如客服高峰需要及时响应，长期分析可能允许更慢但更充分的比较；简单日期查询不需要复杂推理，资料冲突却可能需要更多检查。企业要取得的智能供给，应与这些工作条件相配。\u003c/p>\n\u003cp>基础模型扩展了可复用能力的范围，企业专属事实、方法和履约资源仍需接入。把智能视为生产资源，意味着可以选择、安排、组合与持续改进其使用，而非把每次调用当孤立技术动作。\u003ca href=\"https://arxiv.org/abs/2108.07258v3\" target=\"_blank\" rel=\"noopener noreferrer\">基础模型研究\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-23-section-2\">三种转换，需要分别观察\u003c/h2>\n\u003cp>第一种是有效利用：投入之后，形成多少符合任务要求的工作。更多文字不必然是更多合格工作，核验与返工也要计入。\u003c/p>\n\u003cp>第二种是价值转换：合格工作是否进入实际决定和交付，改善客户或经营结果。一份正确报告没有被采用，价值路径与一项实际执行的改进不同。\u003c/p>\n\u003cp>第三种是能力留存：本轮工作是否留下有条件、可再用的经验、工具或协作能力，使下一次任务更好做。累计输出与累计token，不能直接说明这项变化。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>转换\u003c/th>\n\u003cth>可观察的问题\u003c/th>\n\u003cth>容易误用的替代数字\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>投入→合格工作\u003c/td>\n\u003ctd>同等任务质量下需要多少总资源\u003c/td>\n\u003ctd>总输出量、单次费用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>合格工作→经营结果\u003c/td>\n\u003ctd>谁采用，何种动作和结果改变\u003c/td>\n\u003ctd>使用次数、满意度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>本轮工作→未来能力\u003c/td>\n\u003ctd>新任务、接任或迁移是否受益\u003c/td>\n\u003ctd>文档数、累计token\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>三者可能方向不同。一个方案降低当前费用，却增加人工负担；一个探索本期不增加交付，却为后续判断留下有用认识。企业需要说明具体关系。\u003c/p>\n\u003ch2 id=\"lesson-23-section-3\">为什么资源与资产要一起理解\u003c/h2>\n\u003cp>当期智能使用会被消耗，留下的能力才可能长期发挥作用。企业在战略意义上重视“智能资产”，既包括取得与配置供给的能力，也包括通过使用形成的知识和生产条件。\u003c/p>\n\u003cp>这不要求把每个token都资本化，更不能凭累计账单计算企业知识净值。经营上更实际的问题是：本轮投入服务什么用途，未来在哪里再用，谁维护，怎样知道它还有效。\u003c/p>\n\u003cp>关于技术互补投入的研究说明，流程、组织和人力等建设会影响技术作用。这支持同时看供给与使用条件，不能据此给所有知识任意标价。\u003ca href=\"https://www.nber.org/papers/w25148\" target=\"_blank\" rel=\"noopener noreferrer\">研究记录\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-23-section-4\">单价低，为什么不一定更经济\u003c/h2>\n\u003cp>课程的独立教学算例比较两种方案处理同一千项任务。A模型费用较少，却需要更多复核与返工；B调用更贵，列示总成本反而更低。完整计算将在第26章展开。\u003c/p>\n\u003cp>另一家教学专业服务机构每天能生成20份报告，专家每天只能核验4份。即使生成费用很低，未核产出也会持续积压。智能资源经营因此同时涉及任务配置与整条产能链。\u003c/p>\n\u003ch2 id=\"lesson-23-section-5\">用什么问题代替“调用够不够多”\u003c/h2>\n\u003cp>可以先把投入对应到具体工作：谁在什么任务上使用，什么算合格，结果去哪里，下一次怎样受益。再检查资源是否花在真正限制结果的地方。\u003c/p>\n\u003cp>减少无效长输出、补齐关键事实、改进工具连接、提高候选质量，都可能比压低每次单价更有作用。对于特定推理任务，追加计算的效果也与策略和难度有关，不能一概假定越多越好。\u003ca href=\"https://arxiv.org/abs/2408.03314\" target=\"_blank\" rel=\"noopener noreferrer\">推理资源研究\u003c/a>\u003c/p>\n\u003cp>下一周期的差距，可能体现在企业能否把类似智能供给转为更好的工作与积累。这个判断有具体机制，也需要持续证据。资源应当如何配置，要从每一种任务的边际作用开始。\u003c/p>\n","headings":[{"id":"lesson-23-section-1","label":"智能资源不只有一个数量维度"},{"id":"lesson-23-section-2","label":"三种转换，需要分别观察"},{"id":"lesson-23-section-3","label":"为什么资源与资产要一起理解"},{"id":"lesson-23-section-4","label":"单价低，为什么不一定更经济"},{"id":"lesson-23-section-5","label":"用什么问题代替“调用够不够多”"}],"exportMd":"# 第23章｜token进入经营，企业真正需要掌握什么\n\nAI费用上升时，企业可能要求所有团队减少token；也可能把调用量增长当成转型进展。两种做法都抓住了可见数字，却还没有说明智能资源用得怎样。\n\ntoken是模型处理输入与输出的计量单位，可能对应字词或其片段。它帮助计量资源，却不是企业价值单位。同样数量在不同模型、任务和输入条件下，不代表同样能力。\n\n**企业需要经营的是可调度智能：它具有什么能力，何时可得，怎样进入生产，以及投入之后留下什么。** token让这种投入变得可见，但经营判断需要越过用量。\n\n## 智能资源不只有一个数量维度\n\n任务要求可能是正确理解、专业比较、代码制作或连续行动。不同供给在质量、时效、容量与工具条件上不同。\n\n例如客服高峰需要及时响应，长期分析可能允许更慢但更充分的比较；简单日期查询不需要复杂推理，资料冲突却可能需要更多检查。企业要取得的智能供给，应与这些工作条件相配。\n\n基础模型扩展了可复用能力的范围，企业专属事实、方法和履约资源仍需接入。把智能视为生产资源，意味着可以选择、安排、组合与持续改进其使用，而非把每次调用当孤立技术动作。[基础模型研究](https://arxiv.org/abs/2108.07258v3)\n\n## 三种转换，需要分别观察\n\n第一种是有效利用：投入之后，形成多少符合任务要求的工作。更多文字不必然是更多合格工作，核验与返工也要计入。\n\n第二种是价值转换：合格工作是否进入实际决定和交付，改善客户或经营结果。一份正确报告没有被采用，价值路径与一项实际执行的改进不同。\n\n第三种是能力留存：本轮工作是否留下有条件、可再用的经验、工具或协作能力，使下一次任务更好做。累计输出与累计token，不能直接说明这项变化。\n\n| 转换 | 可观察的问题 | 容易误用的替代数字 |\n|---|---|---|\n| 投入→合格工作 | 同等任务质量下需要多少总资源 | 总输出量、单次费用 |\n| 合格工作→经营结果 | 谁采用，何种动作和结果改变 | 使用次数、满意度 |\n| 本轮工作→未来能力 | 新任务、接任或迁移是否受益 | 文档数、累计token |\n\n三者可能方向不同。一个方案降低当前费用，却增加人工负担；一个探索本期不增加交付，却为后续判断留下有用认识。企业需要说明具体关系。\n\n## 为什么资源与资产要一起理解\n\n当期智能使用会被消耗，留下的能力才可能长期发挥作用。企业在战略意义上重视“智能资产”，既包括取得与配置供给的能力，也包括通过使用形成的知识和生产条件。\n\n这不要求把每个token都资本化，更不能凭累计账单计算企业知识净值。经营上更实际的问题是：本轮投入服务什么用途，未来在哪里再用，谁维护，怎样知道它还有效。\n\n关于技术互补投入的研究说明，流程、组织和人力等建设会影响技术作用。这支持同时看供给与使用条件，不能据此给所有知识任意标价。[研究记录](https://www.nber.org/papers/w25148)\n\n## 单价低，为什么不一定更经济\n\n课程的独立教学算例比较两种方案处理同一千项任务。A模型费用较少，却需要更多复核与返工；B调用更贵，列示总成本反而更低。完整计算将在第26章展开。\n\n另一家教学专业服务机构每天能生成20份报告，专家每天只能核验4份。即使生成费用很低，未核产出也会持续积压。智能资源经营因此同时涉及任务配置与整条产能链。\n\n## 用什么问题代替“调用够不够多”\n\n可以先把投入对应到具体工作：谁在什么任务上使用，什么算合格，结果去哪里，下一次怎样受益。再检查资源是否花在真正限制结果的地方。\n\n减少无效长输出、补齐关键事实、改进工具连接、提高候选质量，都可能比压低每次单价更有作用。对于特定推理任务，追加计算的效果也与策略和难度有关，不能一概假定越多越好。[推理资源研究](https://arxiv.org/abs/2408.03314)\n\n下一周期的差距，可能体现在企业能否把类似智能供给转为更好的工作与积累。这个判断有具体机制，也需要持续证据。资源应当如何配置，要从每一种任务的边际作用开始。\n","exportSingleMd":"# 第23章｜token进入经营，企业真正需要掌握什么\n\nAI费用上升时，企业可能要求所有团队减少token；也可能把调用量增长当成转型进展。两种做法都抓住了可见数字，却还没有说明智能资源用得怎样。\n\ntoken是模型处理输入与输出的计量单位，可能对应字词或其片段。它帮助计量资源，却不是企业价值单位。同样数量在不同模型、任务和输入条件下，不代表同样能力。\n\n**企业需要经营的是可调度智能：它具有什么能力，何时可得，怎样进入生产，以及投入之后留下什么。** token让这种投入变得可见，但经营判断需要越过用量。\n\n## 智能资源不只有一个数量维度\n
