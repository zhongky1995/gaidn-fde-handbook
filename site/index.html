 class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可能的新供给\u003c/th>\n\u003cth>成本下降带来的机会\u003c/th>\n\u003cth>首轮要观察什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>更细分的客户说明\u003c/td>\n\u003ctd>同一套专业知识按不同需求组织\u003c/td>\n\u003ctd>客户是否更容易选择、追问是否更具体\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>更频繁的经营或使用分析\u003c/td>\n\u003ctd>查询、整理和初步分析更容易开展\u003c/td>\n\u003ctd>发现是否及时、是否支持实际行动\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>小范围专属工具\u003c/td>\n\u003ctd>编程和修改成本降低\u003c/td>\n\u003ctd>用户是否持续使用、维护是否可承担\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>专业服务的初步分诊\u003c/td>\n\u003ctd>先整理材料与识别差异\u003c/td>\n\u003ctd>专家时间是否集中到有价值的问题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>先选择少量适合的对象，保留必要人工支持，观察使用与履约，再决定标准化和定价。若客户使用积极但复核太重，就改资料和服务范围；若结果很少被使用，则重新查看它与客户决定的关系。新服务通过这种实际往返形成。\u003c/p>\n\u003ch2>企业的差异怎样逐渐积累\u003c/h2>\n\u003cp>竞争者也可以使用通用模型，但未必拥有同样的客户理解、专业方法和履约反馈。企业持续把这些经验放进任务，并用结果修正，才能形成更符合自身业务的能力。\u003c/p>\n\u003cp>其中一个关键是让反馈回到方法。客户的追问可以改进资料，专业人员的修正可以完善判断，运行问题可以改善工具。每一次使用都可能为下一次提供更好的条件。规模扩大时，这种积累有助于减少重复探索。\u003c/p>\n\u003cp>企业应保有重要资料、方法和业务记录的可用形式，并明确供应商与内部团队的维护分工。需要换模型或工具时，能够迁移已有知识与工作方法，就能保住已经积累的价值。\u003c/p>\n\u003ch2>怎样管理这条发展路径\u003c/h2>\n\u003cp>把改进项目与经营方向一起回顾：当前哪些限制最值得解决，已有能力能减少哪些投入，哪些新的供给值得小范围尝试。随后给每项工作安排负责人、资源和下一次决定的依据。\u003c/p>\n\u003cp>局部提效、服务扩展与组织积累可以相互促进。企业逐步学会用更低成本试验，用实际结果选择，再把有效方法留给团队。这种持续调整能力，是组织AI化值得追求的长期成果。\u003c/p>\n\u003cp>\u003ca id=\"do-27\">\u003c/a>\u003c/p>\n\u003ch2>把一个新服务想法变成有限试用\u003c/h2>\n\u003cp>选一种本来因整理成本高而少做的服务，例如给设备客户提供使用情况说明。先用一句话写清：服务给哪类客户，在什么时刻提供什么结果，客户拿到后准备作什么决定。\u003c/p>\n\u003cp>在\u003ca href=\"#download\" data-download=\"03-试点范围与任务说明.docx\">试点范围与任务说明\u003c/a>填一版服务示意：\u003c/p>\n\u003cblockquote>\n\u003cp>面向已有使用记录的设备客户，先整理一段时期的使用变化，由专业人员核对后给出需要进一步检查的事项；客户经理与客户确认这些事项是否帮助安排维护。原始记录由客户与企业按现有安排提供。\u003c/p>\n\u003c/blockquote>\n\u003cp>接着先做一份样稿，请专业人员核事实与建议，请业务负责人选愿意参与的客户进行试用沟通。问客户会根据哪一条采取什么动作、还缺什么，而不只问“觉得报告好不好”。同时记录整理、专业复核、沟通和后续履约的资源。\u003c/p>\n\u003cp>若客户能据结果行动、履约资源也可承担，就继续观察同类客户并核定价与范围；若客户很少用，就重看提供时刻与问题；若复核过重，就缩小服务范围或改资料方法。最后将这项选择、采用的证据和下一轮安排保存下来。\u003c/p>\n","text":"# 第27章｜从局部改进走向企业能力与新服务\n\n**企业AI化有两种相互支持的增长：把已有工作做得更好，以及利用降低的信息处理成本提供新的服务。扩展时，把经营需要与已经形成的能力放在一起考虑。**\n\n[本章做法：把一个新服务想法变成有限试用](#do-27)\n\n一项试点完成后，企业更清楚模型适合处理什么，也积累了一些资料、方法、工具和协作经验。下一项投入可以因此少做一部分准备，但仍要回应当前业务最值得解决的问题。\n\n## 局部改善以后，限制会移动\n\n材料整理加快，专业确认可能开始排队；确认加快，资源安排可能成为限制；交付稳定以后，企业可能更需要新的客户。这些变化说明原有改善正在改变工作条件，也提示了新的投入方向。\n\n可以沿同一项结果持续观察。若目标是缩短客户响应，就继续看从收到需求到形成可用答复的整段时间。若目标是服务更多客户，就看专业人员负荷和履约容量。团队据此判断下一步是改善相邻环节、增加资源，还是转向新的经营问题。\n\n![经营限制决定改进方向，共用能力降低实施成本，新服务试验检验新的供给机会。](assets/27.svg)\n\n## 从共用方法走向可组合的能力\n\n准确关联客户与订单、按身份提供资料、采用统一计算方法、保存任务状态，这些能力可以被多个场景使用。销售方案与售后处理各有专业流程，却可能共用客户记录和产品知识。\n\n企业可以把稳定共用部分维护好，再允许各业务组合使用。新的场景因此不必重新整理全部资料或重建每个连接，团队可以把更多精力用于理解新任务的特殊要求。\n\n人员同样积累能力。业务骨干更会表达判断，负责人更会管理跨岗结果，技术人员更熟悉真实环境，管理者更能判断投入。这些人与方法、数据、工具共同构成企业的改造能力。\n\n## 成本结构改变以后，什么新服务值得尝试\n\n回到第1章的设备服务设想。整理使用记录和制作初步分析变便宜后，企业可以考虑提高服务频次，或者把原来只面向重点客户的服务扩展给更多客户。变化发生在服务经济性：专业人员把时间集中在值得判断的异常，信息整理与基础表达由系统承担。\n\n新服务还需要一项完整设计。服务对象是谁，客户在什么时刻需要结果，哪些数据可以取得，专业人员在哪一步参与，结果怎样影响客户行动，后续履约需要多少资源，都要放在一起考虑。\n\n| 可能的新供给 | 成本下降带来的机会 | 首轮要观察什么 |\n| --- | --- | --- |\n| 更细分的客户说明 | 同一套专业知识按不同需求组织 | 客户是否更容易选择、追问是否更具体 |\n| 更频繁的经营或使用分析 | 查询、整理和初步分析更容易开展 | 发现是否及时、是否支持实际行动 |\n| 小范围专属工具 | 编程和修改成本降低 | 用户是否持续使用、维护是否可承担 |\n| 专业服务的初步分诊 | 先整理材料与识别差异 | 专家时间是否集中到有价值的问题 |\n\n先选择少量适合的对象，保留必要人工支持，观察使用与履约，再决定标准化和定价。若客户使用积极但复核太重，就改资料和服务范围；若结果很少被使用，则重新查看它与客户决定的关系。新服务通过这种实际往返形成。\n\n## 企业的差异怎样逐渐积累\n\n竞争者也可以使用通用模型，但未必拥有同样的客户理解、专业方法和履约反馈。企业持续把这些经验放进任务，并用结果修正，才能形成更符合自身业务的能力。\n\n其中一个关键是让反馈回到方法。客户的追问可以改进资料，专业人员的修正可以完善判断，运行问题可以改善工具。每一次使用都可能为下一次提供更好的条件。规模扩大时，这种积累有助于减少重复探索。\n\n企业应保有重要资料、方法和业务记录的可用形式，并明确供应商与内部团队的维护分工。需要换模型或工具时，能够迁移已有知识与工作方法，就能保住已经积累的价值。\n\n## 怎样管理这条发展路径\n\n把改进项目与经营方向一起回顾：当前哪些限制最值得解决，已有能力能减少哪些投入，哪些新的供给值得小范围尝试。随后给每项工作安排负责人、资源和下一次决定的依据。\n\n局部提效、服务扩展与组织积累可以相互促进。企业逐步学会用更低成本试验，用实际结果选择，再把有效方法留给团队。这种持续调整能力，是组织AI化值得追求的长期成果。\n\n\n\u003ca id=\"do-27\">\u003c/a>\n\n## 把一个新服务想法变成有限试用\n\n选一种本来因整理成本高而少做的服务，例如给设备客户提供使用情况说明。先用一句话写清：服务给哪类客户，在什么时刻提供什么结果，客户拿到后准备作什么决定。\n\n在[试点范围与任务说明](toolkit/03-试点范围与任务说明.docx)填一版服务示意：\n\n> 面向已有使用记录的设备客户，先整理一段时期的使用变化，由专业人员核对后给出需要进一步检查的事项；客户经理与客户确认这些事项是否帮助安排维护。原始记录由客户与企业按现有安排提供。\n\n接着先做一份样稿，请专业人员核事实与建议，请业务负责人选愿意参与的客户进行试用沟通。问客户会根据哪一条采取什么动作、还缺什么，而不只问“觉得报告好不好”。同时记录整理、专业复核、沟通和后续履约的资源。\n\n若客户能据结果行动、履约资源也可承担，就继续观察同类客户并核定价与范围；若客户很少用，就重看提供时刻与问题；若复核过重，就缩小服务范围或改资料方法。最后将这项选择、采用的证据和下一轮安排保存下来。\n"},{"id":"c28","file":"28-企业主的行动路线与阶段决定.md","title":"第28章｜从哪里开始：行动路线与阶段决定","html":"\u003ch1>第28章｜从哪里开始：行动路线与阶段决定\u003c/h1>\n\u003cp>先拿一笔你熟悉的工作，找出最值得改变的一段，形成一份能交给别人继续的试点约定。你可以先做这个过程，再按需要回查能力与系统章节。\u003c/p>\n\u003cp>\u003ca href=\"#c28/do-28\">本章做法：从一笔任务形成首轮试点约定\u003c/a>\u003c/p>\n\u003cp>\u003ca id=\"do-28\">\u003c/a>\u003c/p>\n\u003ch2>第一次动手，先把一笔任务说清楚\u003c/h2>\n\u003cp>\u003ca href=\"#download\" data-download=\"01-改造机会与现状记录.docx\">下载改造机会与现状记录\u003c/a>，打开第一页的填写示例，再在空表里填自己的材料。现在先只做下面这条路径：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>选一笔原任务。\u003c/strong> 从最近的询价、报修、报告或内容制作中，选一笔你觉得反复或等待较多的。找出原始输入与最终交给谁的结果。\u003c/li>\n\u003cli>\u003cstrong>沿记录还原经过。\u003c/strong> 在表里写“谁收到什么—怎样处理—交给谁”，标出等待与退回。请实际操作者补你看不到的部分；一人经营时就按消息、文件和操作记录回看。\u003c/li>\n\u003cli>\u003cstrong>提出一个可核的解释。\u003c/strong> 例如一笔安装需求因缺地点退回，先问上游是否知道地点是必需项。不要只写“员工效率低”。\u003c/li>\n\u003cli>\u003cstrong>选择一段先改。\u003c/strong> 可以先统一输入，也可以试AI整理与缺项提示。写明采用哪项能力、还需要哪些人员或系统条件。\u003c/li>\n\u003cli>\u003cstrong>约定怎样看结果。\u003c/strong> 谁核对，谁接手，下一次带哪条材料回来。结果是字段、实际文件或正式记录，要交到约定的位置。\u003c/li>\n\u003c/ol>\n\u003cp>做完之后，表中至少能读出这样一项约定。以下为填写示意：\u003c/p>\n\u003cblockquote>\n\u003cp>本轮先试标准安装需求整理。专业人员给出必要条件，销售提供原消息并核对，AI形成带依据的字段和待补问题，专业人员实际接收判断。先看遗漏、核对、退回与整段负担，再决定是否连接正式系统。\u003c/p>\n\u003c/blockquote>\n\u003cp>如果仍写不出具体输入和接手者，先回到一笔真实任务继续看；若原因还有争议，先安排查证；能够说明输入、动作、结果和检查以后，就可以进入有限试做。\u003c/p>\n\u003ch2>根据你当前卡住的位置，继续哪一步\u003c/h2>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现在的状态\u003c/th>\n\u003cth>直接去做什么\u003c/th>\n\u003cth>本轮拿到什么才继续\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>只有“想用AI”，不知改哪里\u003c/td>\n\u003ctd>按\u003ca href=\"#c18/do-18\">第18章\u003c/a>还原任务并核原因\u003c/td>\n\u003ctd>一份现状记录与首轮改法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已有候选，但范围很大\u003c/td>\n\u003ctd>按\u003ca href=\"#c19/do-19\">第19章\u003c/a>比较轻重办法\u003c/td>\n\u003ctd>一份范围、责任和检查明确的试点说明\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>想先确认某项AI能力\u003c/td>\n\u003ctd>选第3—17章对应的试做方法，用给出的材料或企业允许使用的样例\u003c/td>\n\u003ctd>原始输入、实际输出、核对与修正记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已有初稿，下游仍难接手\u003c/td>\n\u003ctd>按\u003ca href=\"#c20/do-20\">第20章\u003c/a>重写交接条件\u003c/td>\n\u003ctd>下一岗位能实际打开并继续的产物\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>需要接系统\u003c/td>\n\u003ctd>按\u003ca href=\"#c21/do-21\">第21章\u003c/a>核读写对应、身份和保存\u003c/td>\n\u003ctd>实际查询、保存与接手记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>人员分工与维护跟不上\u003c/td>\n\u003ctd>按\u003ca href=\"#c24/do-24\">第24章\u003c/a>逐项调整\u003c/td>\n\u003ctd>一份有时间与授权支持的分工约定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已准备试用或采购\u003c/td>\n\u003ctd>按\u003ca href=\"#c22/do-22\">第22章\u003c/a>验证，再按\u003ca href=\"#c23/do-23\">第23章\u003c/a>算账比较\u003c/td>\n\u003ctd>采用范围、完整成本和下一段投入决定\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch2>如何开一次能推进事情的工作会\u003c/h2>\n\u003cp>会前把原材料、现状记录和本轮要决定的问题发给实际参与者，由他们补齐各自信息。开会时先走一笔任务，再讨论改法，不让每个人只介绍自己想要的功能。\u003c/p>\n\u003cp>你可以依次问：“这笔任务最终要交给谁？最耗时或反复的是哪里？有什么记录支持这个解释？哪段可以先试？由谁供材料、谁做、谁检查？下一次拿什么结果回来？”把答案直接写进\u003ca href=\"#download\" data-download=\"03-试点范围与任务说明.docx\">试点范围与任务说明\u003c/a>。\u003c/p>\n\u003cp>散会时请各位参与者复述自己要交什么、从哪里取得输入、交到哪里。若上下游对交接仍不一致，就当场把条件写清；超出本轮授权与资源的决定交给有权人员。下一次会议打开的是实际任务和产物，再据结果调整。\u003c/p>\n\u003ch2>每一段结束，怎样决定下一笔投入\u003c/h2>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>当前得到的证据\u003c/th>\n\u003cth>可以作的决定\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>材料与原因基本查清，已有小范围可试的改法\u003c/td>\n\u003ctd>安排有限实现与业务反馈\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AI整理有帮助，但连接条件或成本暂不适合\u003c/td>\n\u003ctd>先作为团队辅助，明确人工交接\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>原型可用，换材料仍有稳定结果\u003c/td>\n\u003ctd>进入限定任务与角色的日常试用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>下游能接手，全链负担与质量可接受\u003c/td>\n\u003ctd>确定采用范围，调整旧工作与维护责任\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>复核重、权限未成立或规则仍争议\u003c/td>\n\u003ctd>先改相应条件、缩范围或换办法，再核原任务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新服务被客户用于实际决定且履约可承担\u003c/td>\n\u003ctd>继续核需求、定价和扩大条件\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>每次决定写下采用的依据、下一步动作和责任人。已经投入过什么可以作复盘材料，新的投入仍要由下一段价值与条件支持。\u003c/p>\n\u003ch2>第一轮结束，把工作交到日常使用中\u003c/h2>\n\u003cp>让内部人员独立打开入口，完成正常任务，处理一个常见缺项或异常，再找到对应规则和记录。把入口、范围、维护人和接手办法记到\u003ca href=\"#download\" data-download=\"07-运行交接与问题记录.docx\">运行交接与问题记录\u003c/a>。同时确认哪些旧动作停止，省出的时间怎样安排，持续费用由谁承担。\u003c/p>\n\u003cp>最后留下一条有效经验，写进\u003ca href=\"#download\" data-download=\"08-经验复用卡.docx\">经验复用卡\u003c/a>，让下一次任务实际使用并反馈。第一轮的成果由此成为一项正在使用的工作，以及继续改善它的依据。\u003c/p>\n","text":"# 第28章｜从哪里开始：行动路线与阶段决定\n\n先拿一笔你熟悉的工作，找出最值得改变的一段，形成一份能交给别人继续的试点约定。你可以先做这个过程，再按需要回查能力与系统章节。\n\n[本章做法：从一笔任务形成首轮试点约定](#do-28)\n\n\u003ca id=\"do-28\">\u003c/a>\n\n## 第一次动手，先把一笔任务说清楚\n\n[下载改造机会与现状记录](toolkit/01-改造机会与现状记录.docx)，打开第一页的填写示例，再在空表里填自己的材料。现在先只做下面这条路径：\n\n1. **选一笔原任务。** 从最近的询价、报修、报告或内容制作中，选一笔你觉得反复或等待较多的。找出原始输入与最终交给谁的结果。\n2. **沿记录还原经过。** 在表里写“谁收到什么—怎样处理—交给谁”，标出等待与退回。请实际操作者补你看不到的部分；一人经营时就按消息、文件和操作记录回看。\n3. **提出一个可核的解释。** 例如一笔安装需求因缺地点退回，先问上游是否知道地点是必需项。不要只写“员工效率低”。\n4. **选择一段先改。** 可以先统一输入，也可以试AI整理与缺项提示。写明采用哪项能力、还需要哪些人员或系统条件。\n5. **约定怎样看结果。** 谁核对，谁接手，下一次带哪条材料回来。结果是字段、实际文件或正式记录，要交到约定的位置。\n\n做完之后，表中至少能读出这样一项约定。以下为填写示意：\n\n> 本轮先试标准安装需求整理。专业人员给出必要条件，销售提供原消息并核对，AI形成带依据的字段和待补问题，专业人员实际接收判断。先看遗漏、核对、退回与整段负担，再决定是否连接正式系统。\n\n如果仍写不出具体输入和接手者，先回到一笔真实任务继续看；若原因还有争议，先安排查证；能够说明输入、动作、结果和检查以后，就可以进入有限试做。\n\n## 根据你当前卡住的位置，继续哪一步\n\n| 现在的状态 | 直接去做什么 | 本轮拿到什么才继续 |\n| --- | --- | --- |\n| 只有“想用AI”，不知改哪里 | 按[第18章](18-从经营结果诊断改造机会.md#do-18)还原任务并核原因 | 一份现状记录与首轮改法 |\n| 已有候选，但范围很大 | 按[第19章](19-怎样选择场景并管理试点组合.md#do-19)比较轻重办法 | 一份范围、责任和检查明确的试点说明 |\n| 想先确认某项AI能力 | 选第3—17章对应的试做方法，用给出的材料或企业允许使用的样例 | 原始输入、实际输出、核对与修正记录 |\n| 已有初稿，下游仍难接手 | 按[第20章](20-重设计流程分工与授权.md#do-20)重写交接条件 | 下一岗位能实际打开并继续的产物 |\n| 需要接系统 | 按[第21章](21-系统集成数据与共同事实.md#do-21)核读写对应、身份和保存 | 实际查询、保存与接手记录 |\n| 人员分工与维护跟不上 | 按[第24章](24-岗位重构负责人和激励.md#do-24)逐项调整 | 一份有时间与授权支持的分工约定 |\n| 已准备试用或采购 | 按[第22章](22-原型评测与业务验收.md#do-22)验证，再按[第23章](23-投入回报与合作采购.md#do-23)算账比较 | 采用范围、完整成本和下一段投入决定 |\n\n## 如何开一次能推进事情的工作会\n\n会前把原材料、现状记录和本轮要决定的问题发给实际参与者，由他们补齐各自信息。开会时先走一笔任务，再讨论改法，不让每个人只介绍自己想要的功能。\n\n你可以依次问：“这笔任务最终要交给谁？最耗时或反复的是哪里？有什么记录支持这个解释？哪段可以先试？由谁供材料、谁做、谁检查？下一次拿什么结果回来？”把答案直接写进[试点范围与任务说明](toolkit/03-试点范围与任务说明.docx)。\n\n散会时请各位参与者复述自己要交什么、从哪里取得输入、交到哪里。若上下游对交接仍不一致，就当场把条件写清；超出本轮授权与资源的决定交给有权人员。下一次会议打开的是实际任务和产物，再据结果调整。\n\n## 每一段结束，怎样决定下一笔投入\n\n| 当前得到的证据 | 可以作的决定 |\n| --- | --- |\n| 材料与原因基本查清，已有小范围可试的改法 | 安排有限实现与业务反馈 |\n| AI整理有帮助，但连接条件或成本暂不适合 | 先作为团队辅助，明确人工交接 |\n| 原型可用，换材料仍有稳定结果 | 进入限定任务与角色的日常试用 |\n| 下游能接手，全链负担与质量可接受 | 确定采用范围，调整旧工作与维护责任 |\n| 复核重、权限未成立或规则仍争议 | 先改相应条件、缩范围或换办法，再核原任务 |\n| 新服务被客户用于实际决定且履约可承担 | 继续核需求、定价和扩大条件 |\n\n每次决定写下采用的依据、下一步动作和责任人。已经投入过什么可以作复盘材料，新的投入仍要由下一段价值与条件支持。\n\n## 第一轮结束，把工作交到日常使用中\n\n让内部人员独立打开入口，完成正常任务，处理一个常见缺项或异常，再找到对应规则和记录。把入口、范围、维护人和接手办法记到[运行交接与问题记录](toolkit/07-运行交接与问题记录.docx)。同时确认哪些旧动作停止，省出的时间怎样安排，持续费用由谁承担。\n\n最后留下一条有效经验，写进[经验复用卡](toolkit/08-经验复用卡.docx)，让下一次任务实际使用并反馈。第一轮的成果由此成为一项正在使用的工作，以及继续改善它的依据。\n"},{"id":"c29","file":"29-工作文件与经营判断工具.md","title":"工作文件与经营判断工具","html":"\u003ch1>工作文件与经营判断工具\u003c/h1>\n\u003cp>这里有八份可下载填写的工作文件，配合正文推进一项改造。每份都有一页填写示例和一页空表。示例帮助你理解要写到什么程度；自己的约定写在空表里，交给实际参与者核对，再按约定处理下一笔任务。\u003c/p>\n\u003ch2>第一次下载和填写，怎样操作\u003c/h2>\n\u003col>\n\u003cli>点击对应文件的“下载”链接，在浏览器的下载记录或电脑“下载”文件夹中找到它。\u003c/li>\n\u003cli>用 Word、WPS 或其他兼容的文档软件打开。先读示例页，再到空表页填写任务、参与人和日期；表格中的提示说明要回答什么。\u003c/li>\n\u003cli>另存一份，以本次任务命名，例如“安装需求整理—首轮试点”。把原消息、实际输出或正式记录放在企业约定位置，在表中注明从哪里查。\u003c/li>\n\u003cli>请下一位参与者实际读表并继续工作。有歧义就一起修改；完成一轮后，将结果、决定和下一步写回同一份记录。\u003c/li>\n\u003c/ol>\n\u003cp>如果刚开始，先下载第一份，按\u003ca href=\"#c28/do-28\">第28章\u003c/a>做。不必一次填完八份。表格也可以按实际使用习惯搬进企业已有协作工具，保留需要回答的问题。\u003c/p>\n\u003ch2>01　改造机会与现状记录\u003c/h2>\n\u003cp>\u003ca href=\"#download\" data-download=\"01-改造机会与现状记录.docx\">下载：改造机会与现状记录\u003c/a>\u003c/p>\n\u003cp>当你只有“想用AI”的方向，或团队对问题原因说法不一时使用。带一笔原任务、退回记录和最终结果，请实际操作者与接手者还原过程。\u003c/p>\n\u003cp>填写时把“效率低”展开为可查的观察。例如：“安装需求缺地点，专业人员退回，销售再向客户补问。”再写当前解释、怎样核实、先改变哪一步和谁配合。第18章提供诊断方法，第19章帮助比较统一表单、AI整理与系统连接。\u003c/p>\n\u003cp>\u003cstrong>填到什么程度：\u003c/strong> 下一位参与者能指出原任务、原因依据与首轮改法，知道自己要交什么材料；若原因仍争议，知道要查什么、由谁查。\u003c/p>\n\u003ch2>02　AI试做与核对记录\u003c/h2>\n\u003cp>\u003ca href=\"#download\" data-download=\"02-AI试做与核对记录.docx\">下载：AI试做与核对记录\u003c/a>\u003c/p>\n\u003cp>试模型、提示词、知识检索或工具组合时使用。把原始输入和预期先写下，再保存实际输出、应用条件与核对结果。第3—17章各有对应的试做材料和方法，可以从适合自己业务的一章开始。\u003c/p>\n\u003cp>例如“本次两套、明年可能加一套”，本单应为两套。如果实际输出为三套，保留错误输出，补清“本次与意向分开”的要求，再重试原材料和一条本次确实三套的新材料。这样能看到修改有没有起作用。\u003c/p>\n\u003cp>\u003cstrong>填到什么程度：\u003c/strong> 别人能重看同一份输入和实际输出，理解修正了什么，以及当前适合用到哪一步。\u003c/p>\n\u003ch2>03　试点范围与任务说明\u003c/h2>\n\u003cp>\u003ca href=\"#download\" data-download=\"03-试点范围与任务说明.docx\">下载：试点范围与任务说明\u003c/a>\u003c/p>\n\u003cp>选好候选任务后，交给实施者、合作方或内部团队前使用。按第19章明确本轮终点，再写输入、处理、交付位置、允许动作、系统条件、责任与检查。需要采购时，用同一份说明比较方案。\u003c/p>\n\u003cp>示例终点是“专业人员收到可开始判断的安装需求”。AI整理字段和缺项，销售核对补问，专业人员接齐备材料。本轮是否自动查历史、保存正式记录或发送客户，应分别写清，参与者据此安排工作和费用。\u003c/p>\n\u003cp>\u003cstrong>填到什么程度：\u003c/strong> 实施者知道做什么，业务人员知道供什么、核什么，发起人知道下一次拿什么结果作决定。\u003c/p>\n\u003ch2>04　分工授权与岗位调整表\u003c/h2>\n\u003cp>\u003ca href=\"#download\" data-download=\"04-分工授权与岗位调整表.docx\">下载：分工授权与岗位调整表\u003c/a>\u003c/p>\n\u003cp>跨岗位受影响、需要明确决定权或安排新增维护工作时使用。按第20、24章，先摆出旧工作与AI带来的变化，再选业务负责人、逐岗写交接和授权。\u003c/p>\n\u003cp>例如销售少抄录但仍要核对，专业骨干新增方法维护，就把销售释放时间安排到具体回访，从骨干原工作中留出维护时间。交接质量、方法采用与完整任务结果进入评价，不能只奖励初稿提交量。正式评价调整由有权管理者确定。\u003c/p>\n\u003cp>\u003cstrong>填到什么程度：\u003c/strong> 每个人知道接什么、交什么、能决定什么、何时上报；新增工作有时间，已被替代的旧动作明确退出，下一轮有检查安排。\u003c/p>\n\u003ch2>05　试用与验收记录\u003c/h2>\n\u003cp>\u003ca href=\"#download\" data-download=\"05-试用与验收记录.docx\">下载：试用与验收记录\u003c/a>\u003c/p>\n\u003cp>原型有了初步结果、准备扩大采用范围时使用。按第22章先写预期，再由实际使用者处理正常、缺项和变化材料，保留实际显示及保存结果。\u003c/p>\n\u003cp>例如数量变更后，系统虽更新金额，却沿用旧批准。记录具体问题，请实施者检查内容与批准的对应，改后重走该任务，并核未变更的合法批准仍能继续。再请下游从正式入口接手，最后写采用范围与维护责任。\u003c/p>\n\u003cp>\u003cstrong>填到什么程度：\u003c/strong> 一项“通过”能指出对应材料、身份、版本与实际结果；尚有问题时知道谁改、怎样重试以及当前采用到哪里。\u003c/p>\n\u003ch2>06　投入与收益计算表\u003c/h2>\n\u003cp>\u003ca href=\"#download\" data-download=\"06-投入与收益计算表.docx\">下载：投入与收益计算表\u003c/a>\u003c/p>\n\u003cp>准备投入、比较采购或复盘使用价值时使用。按第23章列同类型任务的完整人工时间、固定维护、持续费用及一次性投入，等待周期另外记录。\u003c/p>\n\u003cp>表内教学算例为每月200项，单项人工从30分钟变18分钟，毛释放40小时，扣固定维护8小时后为32小时。若任务量只有50项，同一计算只剩2小时。释放时间接到减少支出、增加交付或其他明确用途以后，再核对应收益；固定工资未变时先记录可用时间。\u003c/p>\n\u003cp>\u003cstrong>填到什么程度：\u003c/strong> 可以重算，能说明数字来自哪里、时间用到哪里，并据此决定下一段投入。质量与新收入分别记依据，避免重复计算。\u003c/p>\n\u003ch2>07　运行交接与问题记录\u003c/h2>\n\u003cp>\u003ca href=\"#download\" data-download=\"07-运行交接与问题记录.docx\">下载：运行交接与问题记录\u003c/a>\u003c/p>\n\u003cp>一项能力进入日常使用时，按第25章交给内部接手者填写。打开真实入口确认使用范围、规则与配置位置，安排正常操作和常见异常演练。\u003c/p>\n\u003cp>例如通知重复时，先暂停该动作，业务人员核已发记录并登记必要的人工发送，技术人员修复。恢复前合并核对已发和未发，避免把已经完成的工作再做一遍。将人员、入口、版本、费用承担及问题回看写清。\u003c/p>\n\u003cp>\u003cstrong>填到什么程度：\u003c/strong> 内部人员能独立完成任务，并按记录找到方法和异常接手人；发生规则变化时，有人知道改哪里、核哪些任务。\u003c/p>\n\u003ch2>08　经验复用卡\u003c/h2>\n\u003cp>\u003ca href=\"#download\" data-download=\"08-经验复用卡.docx\">下载：经验复用卡\u003c/a>\u003c/p>\n\u003cp>一项修正已经核清原因，希望下一次继续有效时使用。按第13、26章记录方法、适用条件、材料与工具依赖、负责人和版本。\u003c/p>\n\u003cp>例如把“客户希望月底”误作“确认月底”，就留下区分期望与承诺的方法及确认依据要求。下一次任务真正附上这份方法，或由应用读取，再换材料检查；记录采用结果和需要的调整。\u003c/p>\n\u003cp>\u003cstrong>填到什么程度：\u003c/strong> 新使用者能找到并采用方法，减少重复准备；若仍依赖原作者口头补充，就继续补齐条件和入口。\u003c/p>\n\u003ch2>每一轮结束，留下一个明确决定\u003c/h2>\n\u003cp>把当前得到的结果、支持依据、建议下一步与所需资源写进本轮文件的“决定”栏。下一次打开同一文件，从实际结果继续：是扩大采用，先改条件，缩小范围，还是换一种更合适的办法。第28章提供阶段决定的具体对照。\u003c/p>\n","text":"# 工作文件与经营判断工具\n\n这里有八份可下载填写的工作文件，配合正文推进一项改造。每份都有一页填写示例和一页空表。示例帮助你理解要写到什么程度；自己的约定写在空表里，交给实际参与者核对，再按约定处理下一笔任务。\n\n## 第一次下载和填写，怎样操作\n\n1. 点击对应文件的“下载”链接，在浏览器的下载记录或电脑“下载”文件夹中找到它。\n2. 用 Word、WPS 或其他兼容的文档软件打开。先读示例页，再到空表页填写任务、参与人和日期；表格中的提示说明要回答什么。\n3. 另存一份，以本次任务命名，例如“安装需求整理—首轮试点”。把原消息、实际输出或正式记录放在企业约定位置，在表中注明从哪里查。\n4. 请下一位参与者实际读表并继续工作。有歧义就一起修改；完成一轮后，将结果、决定和下一步写回同一份记录。\n\n如果刚开始，先下载第一份，按[第28章](28-企业主的行动路线与阶段决定.md#do-28)做。不必一次填完八份。表格也可以按实际使用习惯搬进企业已有协作工具，保留需要回答的问题。\n\n## 01　改造机会与现状记录\n\n[下载：改造机会与现状记录](toolkit/01-改造机会与现状记录.docx)\n\n当你只有“想用AI”的方向，或团队对问题原因说法不一时使用。带一笔原任务、退回记录和最终结果，请实际操作者与接手者还原过程。\n\n填写时把“效率低”展开为可查的观察。例如：“安装需求缺地点，专业人员退回，销售再向客户补问。”再写当前解释、怎样核实、先改变哪一步和谁配合。第18章提供诊断方法，第19章帮助比较统一表单、AI整理与系统连接。\n\n**填到什么程度：** 下一位参与者能指出原任务、原因依据与首轮改法，知道自己要交什么材料；若原因仍争议，知道要查什么、由谁查。\n\n## 02　AI试做与核对记录\n\n[下载：AI试做与核对记录](toolkit/02-AI试做与核对记录.docx)\n\n试模型、提示词、知识检索或工具组合时使用。把原始输入和预期先写下，再保存实际输出、应用条件与核对结果。第3—17章各有对应的试做材料和方法，可以从适合自己业务的一章开始。\n\n例如“本次两套、明年可能加一套”，本单应为两套。如果实际输出为三套，保留错误输出，补清“本次与意向分开”的要求，再重试原材料和一条本次确实三套的新材料。这样能看到修改有没有起作用。\n\n**填到什么程度：** 别人能重看同一份输入和实际输出，理解修正了什么，以及当前适合用到哪一步。\n\n## 03　试点范围与任务说明\n\n[下载：试点范围与任务说明](toolkit/03-试点范围与任务说明.docx)\n\n选好候选任务后，交给实施者、合作方或内部团队前使用。按第19章明确本轮终点，再写输入、处理、交付位置、允许动作、系统条件、责任与检查。需要采购时，用同一份说明比较方案。\n\n示例终点是“专业人员收到可开始判断的安装需求”。AI整理字段和缺项，销售核对补问，专业人员接齐备材料。本轮是否自动查历史、保存正式记录或发送客户，应分别写清，参与者据此安排工作和费用。\n\n**填到什么程度：** 实施者知道做什么，业务人员知道供什么、核什么，发起人知道下一次拿什么结果作决定。\n\n## 04　分工授权与岗位调整表\n\n[下载：分工授权与岗位调整表](toolkit/04-分工授权与岗位调整表.docx)\n\n跨岗位受影响、需要明确决定权或安排新增维护工作时使用。按第20、24章，先摆出旧工作与AI带来的变化，再选业务负责人、逐岗写交接和授权。\n\n例如销售少抄录但仍要核对，专业骨干新增方法维护，就把销售释放时间安排到具体回访，从骨干原工作中留出维护时间。交接质量、方法采用与完整任务结果进入评价，不能只奖励初稿提交量。正式评价调整由有权管理者确定。\n\n**填到什么程度：** 每个人知道接什么、交什么、能决定什么、何时上报；新增工作有时间，已被替代的旧动作明确退出，下一轮有检查安排。\n\n## 05　试用与验收记录\n\n[下载：试用与验收记录](toolkit/05-试用与验收记录.docx)\n\n原型有了初步结果、准备扩大采用范围时使用。按第22章先写预期，再由实际使用者处理正常、缺项和变化材料，保留实际显示及保存结果。\n\n例如数量变更后，系统虽更新金额，却沿用旧批准。记录具体问题，请实施者检查内容与批准的对应，改后重走该任务，并核未变更的合法批准仍能继续。再请下游从正式入口接手，最后写采用范围与维护责任。\n\n**填到什么程度：** 一项“通过”能指出对应材料、身份、版本与实际结果；尚有问题时知道谁改、怎样重试以及当前采用到哪里。\n\n## 06　投入与收益计算表\n\n[下载：投入与收益计算表](toolkit/06-投入与收益计算表.docx)\n\n准备投入、比较采购或复盘使用价值时使用。按第23章列同类型任务的完整人工时间、固定维护、持续费用及一次性投入，等待周期另外记录。\n\n表内教学算例为每月200项，单项人工从30分钟变18分钟，毛释放40小时，扣固定维护8小时后为32小时。若任务量只有50项，同一计算只剩2小时。释放时间接到减少支出、增加交付或其他明确用途以后，再核对应收益；固定工资未变时先记录可用时间。\n\n**填到什么程度：** 可以重算，能说明数字来自哪里、时间用到哪里，并据此决定下一段投入。质量与新收入分别记依据，避免重复计算。\n\n## 07　运行交接与问题记录\n\n[下载：运行交接与问题记录](toolkit/07-运行交接与问题记录.docx)\n\n一项能力进入日常使用时，按第25章交给内部接手者填写。打开真实入口确认使用范围、规则与配置位置，安排正常操作和常见异常演练。\n\n例如通知重复时，先暂停该动作，业务人员核已发记录并登记必要的人工发送，技术人员修复。恢复前合并核对已发和未发，避免把已经完成的工作再做一遍。将人员、入口、版本、费用承担及问题回看写清。\n\n**填到什么程度：** 内部人员能独立完成任务，并按记录找到方法和异常接手人；发生规则变化时，有人知道改哪里、核哪些任务。\n\n## 08　经验复用卡\n\n[下载：经验复用卡](toolkit/08-经验复用卡.docx)\n\n一项修正已经核清原因，希望下一次继续有效时使用。按第13、26章记录方法、适用条件、材料与工具依赖、负责人和版本。\n\n例如把“客户希望月底”误作“确认月底”，就留下区分期望与承诺的方法及确认依据要求。下一次任务真正附上这份方法，或由应用读取，再换材料检查；记录采用结果和需要的调整。\n\n**填到什么程度：** 新使用者能找到并采用方法，减少重复准备；若仍依赖原作者口头补充，就继续补齐条件和入口。\n\n## 每一轮结束，留下一个明确决定\n\n把当前得到的结果、支持依据、建议下一步与所需资源写进本轮文件的“决定”栏。下一次打开同一文件，从实际结果继续：是扩大采用，先改条件，缩小范围，还是换一种更合适的办法。第28章提供阶段决定的具体对照。\n"},{"id":"c30","file":"30-关键观点与术语索引.md","title":"关键观点与术语索引","html":"\u003ch1>关键观点与术语索引\u003c/h1>\n\u003cp>本页汇总全书观点，并按当前问题提供阅读入口。每条观点可回到相应章节查看机制、例子与实施方法。\u003c/p>\n\u003ch2>从当前问题找到入口\u003c/h2>\n\u003cp>| 当前问题 | 阅读入口 |\n| 读完仍不知道现在做什么 | \u003ca href=\"#c28/do-28\">第28章：完成第一份现状记录\u003c/a> |\n| 要调整岗位、负责人和激励 | \u003ca href=\"#c24/do-24\">第24章：按一笔任务重排分工\u003c/a> |\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>需要可填写的示例与空表\u003c/th>\n\u003cth>\u003ca href=\"#c29\">第29章：八份工作文件\u003c/a>\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>不清楚AI化要改变什么\u003c/td>\n\u003ctd>\u003ca href=\"#c01\">第1章\u003c/a>、\u003ca href=\"#c02\">第2章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>想了解模型怎样工作、为何会出错\u003c/td>\n\u003ctd>\u003ca href=\"#c03\">第3章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>想识别语言、推理、研究、视觉、分析、创作与编程机会\u003c/td>\n\u003ctd>\u003ca href=\"#c04\">第4章\u003c/a>至\u003ca href=\"#c10\">第10章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已有工具，但AI常拿错资料或忘记条件\u003c/td>\n\u003ctd>\u003ca href=\"#c11\">第11章\u003c/a>、\u003ca href=\"#c12\">第12章\u003c/a>、\u003ca href=\"#c13\">第13章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>需要让AI执行、持续完成多步工作\u003c/td>\n\u003ctd>\u003ca href=\"#c14\">第14章\u003c/a>、\u003ca href=\"#c15\">第15章\u003c/a>、\u003ca href=\"#c16\">第16章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>想选模型与核对能力\u003c/td>\n\u003ctd>\u003ca href=\"#c17\">第17章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>不知先改哪里、怎样推动试点\u003c/td>\n\u003ctd>\u003ca href=\"#c18\">第18章\u003c/a>、\u003ca href=\"#c19\">第19章\u003c/a>、\u003ca href=\"#c28\">第28章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>跨部门与系统接续困难\u003c/td>\n\u003ctd>\u003ca href=\"#c20\">第20章\u003c/a>、\u003ca href=\"#c21\">第21章\u003c/a>、\u003ca href=\"#c24\">第24章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>想判断是否可用、是否值得\u003c/td>\n\u003ctd>\u003ca href=\"#c22\">第22章\u003c/a>、\u003ca href=\"#c23\">第23章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已经运行，需要维护与扩大\u003c/td>\n\u003ctd>\u003ca href=\"#c25\">第25章\u003c/a>、\u003ca href=\"#c26\">第26章\u003c/a>、\u003ca href=\"#c27\">第27章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>要把讨论落成工作约定\u003c/td>\n\u003ctd>\u003ca href=\"#c29\">第29章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch2>关键观点：从能力到企业改造\u003c/h2>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>观点\u003c/th>\n\u003cth>如何落到工作中\u003c/th>\n\u003cth>论证位置\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>AI化从一类工作的完成方式入手\u003c/td>\n\u003ctd>信息加工成本下降，为流程重组和服务扩展创造机会。\u003c/td>\n\u003ctd>\u003ca href=\"#c01\">第1章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FDE把业务发现与工程实现放在同一轮推进\u003c/td>\n\u003ctd>用真实输入构建，用使用结果修改，企业及时提供判断和资源。\u003c/td>\n\u003ctd>\u003ca href=\"#c02\">第2章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>通用模型可以组成企业专属能力\u003c/td>\n\u003ctd>知识、方法、工具与任务组织共同决定实际表现。\u003c/td>\n\u003ctd>\u003ca href=\"#c03\">第3章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>自然语言成为新的业务入口\u003c/td>\n\u003ctd>把多样表达转成带状态的信息，减少消息与系统之间的人工搬运。\u003c/td>\n\u003ctd>\u003ca href=\"#c04\">第4章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>推理帮助企业组织选择与调查\u003c/td>\n\u003ctd>展开条件和后果，找出最值得取得的事实。\u003c/td>\n\u003ctd>\u003ca href=\"#c05\">第5章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>研究围绕经营决定持续积累\u003c/td>\n\u003ctd>先明确证据需要，再调查、比较并形成下一步。\u003c/td>\n\u003ctd>\u003ca href=\"#c06\">第6章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>现场信息可以更直接地参与工作\u003c/td>\n\u003ctd>照片、声音和文件经过提取、核对，进入专业判断。\u003c/td>\n\u003ctd>\u003ca href=\"#c07\">第7章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>自然语言问数应接到实际计算\u003c/td>\n\u003ctd>统一业务定义，执行查询，再检验原因解释。\u003c/td>\n\u003ctd>\u003ca href=\"#c08\">第8章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>内容生产可以从重复制作走向方法复用\u003c/td>\n\u003ctd>组织简报、结构、素材与使用反馈，服务不同读者。\u003c/td>\n\u003ctd>\u003ca href=\"#c09\">第9章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>编程成本下降让小范围改造更值得尝试\u003c/td>\n\u003ctd>用有限实现连接现有工作，再按实际用途持续修改。\u003c/td>\n\u003ctd>\u003ca href=\"#c10\">第10章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>按任务提供信息，是建设能力的直接手段\u003c/td>\n\u003ctd>稳定说明、当前事实与按需查询共同形成上下文。\u003c/td>\n\u003ctd>\u003ca href=\"#c11\">第11章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>知识与业务系统共同供给企业事实\u003c/td>\n\u003ctd>资料保存稳定方法，查询取得当前状态，按需组合。\u003c/td>\n\u003ctd>\u003ca href=\"#c12\">第12章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>企业学习要改变下一次工作的条件\u003c/td>\n\u003ctd>将有效修正转成方法、知识或程序，并通过使用继续完善。\u003c/td>\n\u003ctd>\u003ca href=\"#c13\">第13章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工具调用把理解接到实际操作\u003c/td>\n\u003ctd>模型提出请求，应用执行，结果交回业务继续。\u003c/td>\n\u003ctd>\u003ca href=\"#c14\">第14章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>固定流程和动态判断可以组合\u003c/td>\n\u003ctd>稳定要求交给规则，多变路径交给模型，按收益决定分工。\u003c/td>\n\u003ctd>\u003ca href=\"#c15\">第15章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>长期工作通过状态保存与恢复接续\u003c/td>\n\u003ctd>保留任务、证据和动作进展，中断后从事实继续。\u003c/td>\n\u003ctd>\u003ca href=\"#c16\">第16章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型组合以企业任务为选择单位\u003c/td>\n\u003ctd>同时比较质量、成本、响应时间与维护。\u003c/td>\n\u003ctd>\u003ca href=\"#c17\">第17章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>诊断把经营结果追到可改变的原因\u003c/td>\n\u003ctd>查看处理、等待和返工，再选择具体改法。\u003c/td>\n\u003ctd>\u003ca href=\"#c18\">第18章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>试点要交出可使用的结果\u003c/td>\n\u003ctd>限定有价值的范围，让下一岗位能够接手。\u003c/td>\n\u003ctd>\u003ca href=\"#c19\">第19章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>流程改造要重新分工并撤去重复工作\u003c/td>\n\u003ctd>围绕交出物组织人、模型和程序。\u003c/td>\n\u003ctd>\u003ca href=\"#c20\">第20章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>共同事实依赖清楚的对象与权威记录\u003c/td>\n\u003ctd>按稳定标识关联不同系统，各自维护负责的数据。\u003c/td>\n\u003ctd>\u003ca href=\"#c21\">第21章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>验证为每个阶段的采用决定提供依据\u003c/td>\n\u003ctd>按可行性、任务质量、实际采用和运行接手逐步检查。\u003c/td>\n\u003ctd>\u003ca href=\"#c22\">第22章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>省出的时间需要明确的经营去处\u003c/td>\n\u003ctd>减少现金支出、扩大交付和改善质量分别核算。\u003c/td>\n\u003ctd>\u003ca href=\"#c23\">第23章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>岗位变化需要时间、权责和利益安排\u003c/td>\n\u003ctd>为专业判断、方法维护和跨岗协作留出真实资源。\u003c/td>\n\u003ctd>\u003ca href=\"#c24\">第24章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>持续治理让成熟能力能够放心交给团队\u003c/td>\n\u003ctd>更新有负责人，变化有检查，异常有接手。\u003c/td>\n\u003ctd>\u003ca href=\"#c25\">第25章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>下一次工作检验资产的复用价值\u003c/td>\n\u003ctd>知识、方法和工具减少重复准备，维护按实际收益安排。\u003c/td>\n\u003ctd>\u003ca href=\"#c26\">第26章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已有能力可以支持新的经营供给\u003c/td>\n\u003ctd>从客户需要出发试验新服务，观察使用与履约经济性。\u003c/td>\n\u003ctd>\u003ca href=\"#c27\">第27章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>一轮改造留下结果，也留下继续改造的能力\u003c/td>\n\u003ctd>以诊断、实现、试用和接手形成持续推进。\u003c/td>\n\u003ctd>\u003ca href=\"#c28\">第28章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch2>常见术语：理解到足以参与讨论\u003c/h2>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>术语\u003c/th>\n\u003cth>本书中的意思\u003c/th>\n\u003cth>决策时应问什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>FDE\u003c/td>\n\u003ctd>深入业务现场，把问题定义、工程实现与使用反馈紧密结合的工作方式与角色\u003c/td>\n\u003ctd>谁负责结果，企业需要提供哪些决定与资源？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型与应用\u003c/td>\n\u003ctd>模型执行理解、推理和生成，应用负责界面、资料、工具及保存\u003c/td>\n\u003ctd>这项能力来自哪里，结果怎样进入实际工作？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>提示词\u003c/td>\n\u003ctd>交给模型的任务要求与处理说明\u003c/td>\n\u003ctd>目标、输入、输出与检查要求是否清楚？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>大模型\u003c/td>\n\u003ctd>通过训练形成广泛信息处理能力、运行时依据输入生成结果的模型\u003c/td>\n\u003ctd>当前任务采用哪些能力，提供哪些材料与工具？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>参数、训练、微调\u003c/td>\n\u003ctd>参数参与模型计算；训练更新参数；微调是在已有模型上进一步训练\u003c/td>\n\u003ctd>问题真的需要训练，还是缺资料、方法或工具？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Token\u003c/td>\n\u003ctd>模型处理文字等内容时使用的编码单位\u003c/td>\n\u003ctd>输入、输出和额外计算怎样影响成本与时延？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>上下文\u003c/td>\n\u003ctd>模型这次能够使用的指令、资料、历史与工具结果\u003c/td>\n\u003ctd>当前资料是否真的进入，版本是否适用？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Embedding、向量检索\u003c/td>\n\u003ctd>将内容转换为数值表示，并按相近关系寻找候选资料\u003c/td>\n\u003ctd>相似材料是否满足权限与适用条件？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RAG\u003c/td>\n\u003ctd>先检索资料，再把相关内容提供给模型使用\u003c/td>\n\u003ctd>资料、检索与利用分别怎样检查？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结构化输出\u003c/td>\n\u003ctd>按约定字段和类型返回信息，便于程序处理\u003c/td>\n\u003ctd>字段怎样从原始内容形成，后续怎样使用？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>多模态\u003c/td>\n\u003ctd>处理文字、图像、声音等多种形式\u003c/td>\n\u003ctd>输入范围、识别误差与专业判断怎样接续？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>API\u003c/td>\n\u003ctd>系统供程序调用的操作入口\u003c/td>\n\u003ctd>当前身份能读写什么，能否核实结果？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MCP\u003c/td>\n\u003ctd>连接模型应用与外部工具、资源等能力的协议\u003c/td>\n\u003ctd>它连接了哪些能力，采用什么身份执行？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工作流\u003c/td>\n\u003ctd>预先规定主要步骤与分支的安排\u003c/td>\n\u003ctd>哪些必须固定，哪些需要动态判断？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Agent\u003c/td>\n\u003ctd>在限定目标与能力范围内，根据反馈选择下一步的执行安排\u003c/td>\n\u003ctd>允许它选择什么，何时停下或交人？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Skill\u003c/td>\n\u003ctd>供AI使用的任务方法、资源与可能工具的组合\u003c/td>\n\u003ctd>是否有适用条件、真实依赖与验证？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Harness\u003c/td>\n\u003ctd>支持模型持续执行的工具、环境、状态、检查与恢复安排\u003c/td>\n\u003ctd>中断、变化与外部副作用怎样处理？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>幂等\u003c/td>\n\u003ctd>对同一意图重复提交，在实际接收端约束下不重复产生相应影响\u003c/td>\n\u003ctd>接收系统是否真正支持，超时怎样核实？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>评测、回归、验收\u003c/td>\n\u003ctd>分别检查任务表现、改动是否破坏旧行为，以及业务能否在约定范围接手\u003c/td>\n\u003ctd>这轮检查支持什么采用决定，下一轮观察什么？\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>讨论方案时，可以把术语对应到实际输入、处理过程和结果，沿这些具体内容确定需要采用的能力。\u003c/p>\n","text":"# 关键观点与术语索引\n\n本页汇总全书观点，并按当前问题提供阅读入口。每条观点可回到相应章节查看机制、例子与实施方法。\n\n## 从当前问题找到入口\n\n| 当前问题 | 阅读入口 |\n| 读完仍不知道现在做什么 | [第28章：完成第一份现状记录](28-企业主的行动路线与阶段决定.md#do-28) |\n| 要调整岗位、负责人和激励 | [第24章：按一笔任务重排分工](24-岗位重构负责人和激励.md#do-24) |\n| 需要可填写的示例与空表 | [第29章：八份工作文件](29-工作文件与经营判断工具.md) |\n| --- | --- |\n| 不清楚AI化要改变什么 | [第1章](01-企业AI化改变的究竟是什么.md)、[第2章](02-FDE的价值与企业主的责任.md) |\n| 想了解模型怎样工作、为何会出错 | [第3章](03-模型能力是怎样形成和发挥的.md) |\n| 想识别语言、推理、研究、视觉、分析、创作与编程机会 | [第4章](04-语言理解让非标准信息进入业务.md)至[第10章](10-AI编程怎样改变企业软件供给.md) |\n| 已有工具，但AI常拿错资料或忘记条件 | [第11章](11-上下文是AI工作的现场条件.md)、[第12章](12-知识库RAG与业务数据怎样配合.md)、[第13章](13-经验记忆Skill与企业学习.md) |\n| 需要让AI执行、持续完成多步工作 | [第14章](14-工具API浏览器与MCP怎样让AI行动.md)、[第15章](15-工作流Agent与多Agent怎样选择.md)、[第16章](16-长任务Harness与执行可靠性.md) |\n| 想选模型与核对能力 | [第17章](17-怎样评估能力并选择模型.md) |\n| 不知先改哪里、怎样推动试点 | [第18章](18-从经营结果诊断改造机会.md)、[第19章](19-怎样选择场景并管理试点组合.md)、[第28章](28-企业主的行动路线与阶段决定.md) |\n| 跨部门与系统接续困难 | [第20章](20-重设计流程分工与授权.md)、[第21章](21-系统集成数据与共同事实.md)、[第24章](24-岗位重构负责人和激励.md) |\n| 想判断是否可用、是否值得 | [第22章](22-原型评测与业务验收.md)、[第23章](23-投入回报与合作采购.md) |\n| 已经运行，需要维护与扩大 | [第25章](25-持续运行风险与变更治理.md)、[第26章](26-把项目经验变为组织能力资产.md)、[第27章](27-从局部改进走向企业能力与新服务.md) |\n| 要把讨论落成工作约定 | [第29章](29-工作文件与经营判断工具.md) |\n\n## 关键观点：从能力到企业改造\n\n| 观点 | 如何落到工作中 | 论证位置 |\n| --- | --- | --- |\n| AI化从一类工作的完成方式入手 | 信息加工成本下降，为流程重组和服务扩展创造机会。 | [第1章](01-企业AI化改变的究竟是什么.md) |\n| FDE把业务发现与工程实现放在同一轮推进 | 用真实输入构建，用使用结果修改，企业及时提供判断和资源。 | [第2章](02-FDE的价值与企业主的责任.md) |\n| 通用模型可以组成企业专属能力 | 知识、方法、工具与任务组织共同决定实际表现。 | [第3章](03-模型能力是怎样形成和发挥的.md) |\n| 自然语言成为新的业务入口 | 把多样表达转成带状态的信息，减少消息与系统之间的人工搬运。 | [第4章](04-语言理解让非标准信息进入业务.md) |\n| 推理帮助企业组织选择与调查 | 展开条件和后果，找出最值得取得的事实。 | [第5章](05-推理能力怎样帮助经营判断.md) |\n| 研究围绕经营决定持续积累 | 先明确证据需要，再调查、比较并形成下一步。 | [第6章](06-检索研究怎样成为可靠情报.md) |\n| 现场信息可以更直接地参与工作 | 照片、声音和文件经过提取、核对，进入专业判断。 | [第7章](07-多模态能力怎样读取业务现场.md) |\n| 自然语言问数应接到实际计算 | 统一业务定义，执行查询，再检验原因解释。 | [第8章](08-数据分析怎样从问数走向解释.md) |\n| 内容生产可以从重复制作走向方法复用 | 组织简报、结构、素材与使用反馈，服务不同读者。 | [第9章](09-创作能力怎样进入内容生产.md) |\n| 编程成本下降让小范围改造更值得尝试 | 用有限实现连接现有工作，再按实际用途持续修改。 | [第10章](10-AI编程怎样改变企业软件供给.md) |\n| 按任务提供信息，是建设能力的直接手段 | 稳定说明、当前事实与按需查询共同形成上下文。 | [第11章](11-上下文是AI工作的现场条件.md) |\n| 知识与业务系统共同供给企业事实 | 资料保存稳定方法，查询取得当前状态，按需组合。 | [第12章](12-知识库RAG与业务数据怎样配合.md) |\n| 企业学习要改变下一次工作的条件 | 将有效修正转成方法、知识或程序，并通过使用继续完善。 | [第13章](13-经验记忆Skill与企业学习.md) |\n| 工具调用把理解接到实际操作 | 模型提出请求，应用执行，结果交回业务继续。 | [第14章](14-工具API浏览器与MCP怎样让AI行动.md) |\n| 固定流程和动态判断可以组合 | 稳定要求交给规则，多变路径交给模型，按收益决定分工。 | [第15章](15-工作流Agent与多Agent怎样选择.md) |\n| 长期工作通过状态保存与恢复接续 | 保留任务、证据和动作进展，中断后从事实继续。 | [第16章](16-长任务Harness与执行可靠性.md) |\n| 模型组合以企业任务为选择单位 | 同时比较质量、成本、响应时间与维护。 | [第17章](17-怎样评估能力并选择模型.md) |\n| 诊断把经营结果追到可改变的原因 | 查看处理、等待和返工，再选择具体改法。 | [第18章](18-从经营结果诊断改造机会.md) |\n| 试点要交出可使用的结果 | 限定有价值的范围，让下一岗位能够接手。 | [第19章](19-怎样选择场景并管理试点组合.md) |\n| 流程改造要重新分工并撤去重复工作 | 围绕交出物组织人、模型和程序。 | [第20章](20-重设计流程分工与授权.md) |\n| 共同事实依赖清楚的对象与权威记录 | 按稳定标识关联不同系统，各自维护负责的数据。 | [第21章](21-系统集成数据与共同事实.md) |\n| 验证为每个阶段的采用决定提供依据 | 按可行性、任务质量、实际采用和运行接手逐步检查。 | [第22章](22-原型评测与业务验收.md) |\n| 省出的时间需要明确的经营去处 | 减少现金支出、扩大交付和改善质量分别核算。 | [第23章](23-投入回报与合作采购.md) |\n| 岗位变化需要时间、权责和利益安排 | 为专业判断、方法维护和跨岗协作留出真实资源。 | [第24章](24-岗位重构负责人和激励.md) |\n| 持续治理让成熟能力能够放心交给团队 | 更新有负责人，变化有检查，异常有接手。 | [第25章](25-持续运行风险与变更治理.md) |\n| 下一次工作检验资产的复用价值 | 知识、方法和工具减少重复准备，维护按实际收益安排。 | [第26章](26-把项目经验变为组织能力资产.md) |\n| 已有能力可以支持新的经营供给 | 从客户需要出发试验新服务，观察使用与履约经济性。 | [第27章](27-从局部改进走向企业能力与新服务.md) |\n| 一轮改造留下结果，也留下继续改造的能力 | 以诊断、实现、试用和接手形成持续推进。 | [第28章](28-企业主的行动路线与阶段决定.md) |\n\n## 常见术语：理解到足以参与讨论\n\n| 术语 | 本书中的意思 | 决策时应问什么 |\n| --- | --- | --- |\n| FDE | 深入业务现场，把问题定义、工程实现与使用反馈紧密结合的工作方式与角色 | 谁负责结果，企业需要提供哪些决定与资源？ |\n| 模型与应用 | 模型执行理解、推理和生成，应用负责界面、资料、工具及保存 | 这项能力来自哪里，结果怎样进入实际工作？ |\n| 提示词 | 交给模型的任务要求与处理说明 | 目标、输入、输出与检查要求是否清楚？ |\n| 大模型 | 通过训练形成广泛信息处理能力、运行时依据输入生成结果的模型 | 当前任务采用哪些能力，提供哪些材料与工具？ |\n| 参数、训练、微调 | 参数参与模型计算；训练更新参数；微调是在已有模型上进一步训练 | 问题真的需要训练，还是缺资料、方法或工具？ |\n| Token | 模型处理文字等内容时使用的编码单位 | 输入、输出和额外计算怎样影响成本与时延？ |\n| 上下文 | 模型这次能够使用的指令、资料、历史与工具结果 | 当前资料是否真的进入，版本是否适用？ |\n| Embedding、向量检索 | 将内容转换为数值表示，并按相近关系寻找候选资料 | 相似材料是否满足权限与适用条件？ |\n| RAG | 先检索资料，再把相关内容提供给模型使用 | 资料、检索与利用分别怎样检查？ |\n| 结构化输出 | 按约定字段和类型返回信息，便于程序处理 | 字段怎样从原始内容形成，后续怎样使用？ |\n| 多模态 | 处理文字、图像、声音等多种形式 | 输入范围、识别误差与专业判断怎样接续？ |\n| API | 系统供程序调用的操作入口 | 当前身份能读写什么，能否核实结果？ |\n| MCP | 连接模型应用与外部工具、资源等能力的协议 | 它连接了哪些能力，采用什么身份执行？ |\n| 工作流 | 预先规定主要步骤与分支的安排 | 哪些必须固定，哪些需要动态判断？ |\n| Agent | 在限定目标与能力范围内，根据反馈选择下一步的执行安排 | 允许它选择什么，何时停下或交人？ |\n| Skill | 供AI使用的任务方法、资源与可能工具的组合 | 是否有适用条件、真实依赖与验证？ |\n| Harness | 支持模型持续执行的工具、环境、状态、检查与恢复安排 | 中断、变化与外部副作用怎样处理？ |\n| 幂等 | 对同一意图重复提交，在实际接收端约束下不重复产生相应影响 | 接收系统是否真正支持，超时怎样核实？ |\n| 评测、回归、验收 | 分别检查任务表现、改动是否破坏旧行为，以及业务能否在约定范围接手 | 这轮检查支持什么采用决定，下一轮观察什么？ |\n\n讨论方案时，可以把术语对应到实际输入、处理过程和结果，沿这些具体内容确定需要采用的能力。"}];const toolkit={"01-改造机会与现状记录.docx":{"mime":"application/vnd.openxmlformats-officedocument.wordprocessingml.document","data":"UEsDBBQAAAAIAGG/V10zwTgFnwEAAEoHAAATAAAAW0NvbnRlbnRfVHlwZXNdLnhtbLWVTU/bQBCG7/0Vli8+IHtDDxWq4nAocCyRGkSvm/U4Wdgv7UwC+ffMOolV0VCHBi6RnJn3fR5/yePLZ2uyNUTU3tXFeTUqMnDKN9ot6uJudlNeFBmSdI003kFdbACLy8mX8WwTADMOO6zzJVH4LgSqJViJlQ/geNL6aCXxYVyIINWjXID4Ohp9E8o7AkclpY58Mr6CVq4MZdfP/Hcnkj8EWOTZj+1iYtW5tqmgG4iDmQgGX2VkCEYrSTwXa9e8Mit3VhUnux1c6oBnvPAGIU3eBuxyt3w1o24gm8pIP6XlLaFWSN7+tkZoAjuNPuB59e+2A7q+bbWCxquV5UjVl6Y const $=id=>document.getElementById(id);const groups={"00":"阅读入口","01":"一、企业价值与FDE","03":"二、理解AI的工作能力","11":"三、把能力变成企业系统","18":"四、组织一轮业务改造","24":"五、运行与组织能力建设","29":"工作文件与索引"};

$('print-all').innerHTML=pages.map(p=>'<section>'+p.html+'</section>').join('');
function checkTables(){document.querySelectorAll('.table-shell').forEach(shell=>{const table=shell.querySelector('table');if(table.rows[0]?.cells.length===2)table.classList.add('cols-2');const box=shell.querySelector('.table-wrap');shell.querySelector('.table-hint').hidden=box.scrollWidth<=box.clientWidth+1;});}
let navigation=0;
async function go(){const serial=++navigation;let [id,anchor]=(location.hash.slice(1)||'c00').split('/');let idx=pages.findIndex(p=>p.id===id);if(idx<0)idx=0;const p=pages[idx];$('article').after($('home-actions'));$('article').innerHTML=p.html;document.title=p.title+' · GAIDN';$('home-actions').innerHTML=p.id==='c00'?'<a class="primary" href="#c28/do-28">动手做第一项改造</a><a href="#c01">从头阅读</a><a href="#c03">AI能力篇</a><a href="#c29">下载工作表</a>':'';if(p.id==='c00'){$('article').querySelector('p')?.after($('home-actions'))}
$('page-nav').innerHTML=(idx?'<a href="#'+pages[idx-1].id+'">← '+pages[idx-1].title+'</a>':'<span></span>')+(idx<pages.length-1?'<a href="#'+pages[idx+1].id+'">'+pages[idx+1].title+' →</a>':'<a href="#c00">返回导读</a>');document.querySelectorAll('#toc-list a').forEach(a=>{if(a.getAttribute('href')==='#'+p.id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});$('toc').classList.remove('mobile-open');$('menu').setAttribute('aria-expanded','false');$('utility-status').textContent='';try{localStorage.setItem('gaidn-fde-depth-bookmark',p.id)}catch{}window.scrollTo(0,0);$('search-dialog').close();checkTables();
if(anchor){await Promise.all(Array.from($('article').querySelectorAll('img')).map(img=>img.decode().catch(()=>{})));if(serial!==navigation)return;requestAnimationFrame(()=>{$('article').querySelector('[id="'+CSS.escape(anchor)+'"]')?.scrollIntoView({block:'start'});});}}
window.addEventListener('hashchange',go);window.addEventListener('resize',()=>requestAnimationFrame(checkTables));
$('article').addEventListener('click',async e=>{const download=e.target.closest('[data-download]');if(download){e.preventDefault();const file=download.dataset.download,item=toolkit[file];if(!item){$('utility-status').textContent='文件暂时无法下载，请刷新页面后重试。';return}const bytes=Uint8Array.from(atob(item.data),c=>c.charCodeAt(0)),url=URL.createObjectURL(new Blob([bytes],{type:item.mime})),a=document.createElement('a');a.href=url;a.download=file;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);$('utility-status').textContent='已开始下载：'+file+'。请在下载文件中打开。';return}
const copy=e.target.closest('.copy-text');if(copy){const code=copy.closest('.copy-block').querySelector('code');try{await navigator.clipboard.writeText(code.textContent);copy.textContent='已复制';}catch{const range=document.createRange();range.selectNodeContents(code);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);copy.textContent='已选中，请手动复制';}return}
const button=e.target.closest('.enlarge');if(button){const img=button.closest('figure').querySelector('img');$('figure-large').src=img.src;$('figure-large').alt=img.alt;$('figure-dialog').showModal();}});
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#c"]');if(a&&a.getAttribute('href')===location.hash){e.preventDefault();go();}});
$('figure-close').onclick=()=>$('figure-dialog').close();$('menu').onclick=()=>{const open=$('toc').classList.toggle('mobile-open');$('chapters').open=true;$('menu').setAttribute('aria-expanded',String(open))};$('search-open').onclick=()=>{$('search-dialog').showModal();$('search-input').focus();search()};$('search-close').onclick=()=>$('search-dialog').close();$('search-input').oninput=search;$('print').onclick=()=>window.print();
function search(){const q=$('search-input').value.trim().toLowerCase();const hits=q?pages.filter(p=>p.text.toLowerCase().includes(q)):[];$('results').replaceChildren();if(!q){$('results').textContent='输入关键词，查找全书内容。';return}if(!hits.length){$('results').textContent='没有找到相关内容，可以换一个说法，例如“交接”“复核”或“成本”。';return}for(const p of hits){const a=document.createElement('a');a.href='#'+p.id;const title=document.createElement('strong');title.textContent=p.title;const sn=document.createElement('span');sn.className='snippet';const i=p.text.toLowerCase().indexOf(q);sn.textContent=p.text.slice(Math.max(0,i-24),i+90).replace(/[#*|]/g,' ');a.append(title,sn);a.onclick=()=>$('search-dialog').close();$('results').append(a)}}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();$('search-open').click()}});go();
try{const b=localStorage.getItem('gaidn-fde-depth-last');if(b&&pages.some(p=>p.id===b.split('/')[0])&&!location.hash)location.hash=b}catch{}window.addEventListener('pagehide',()=>{try{localStorage.setItem('gaidn-fde-depth-last',location.hash.slice(1)||'c00')}catch{}});
