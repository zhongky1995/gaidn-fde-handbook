>更合适的取得方式\u003c/th>\n\u003cth>维护责任\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>服务适用条件\u003c/td>\n\u003ctd>有版本的知识资料\u003c/td>\n\u003ctd>业务规则负责人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>当前客户和订单状态\u003c/td>\n\u003ctd>业务系统查询\u003c/td>\n\u003ctd>相应系统与数据负责人\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>当前可用资源\u003c/td>\n\u003ctd>排班或库存等权威记录\u003c/td>\n\u003ctd>资源管理人员\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已作承诺及变更\u003c/td>\n\u003ctd>绑定业务对象的正式记录\u003c/td>\n\u003ctd>作出决定与执行的责任人\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>每天上传一份当时的排班副本，适合只需要了解近期安排的任务；需要当场预约，则应查询当前可用时段，并在预约提交时检查时段是否仍空闲。实时性要求由业务动作决定，也决定连接应该做到哪一步。\u003c/p>\n\u003ch2>知识库失败时，怎样定位原因\u003c/h2>\n\u003cp>一个错误回答可能来自四处：资料本身错或缺；检索没有找到适用材料；取回片段缺少关键条件；模型没有正确利用已提供材料。分别检查原文、检索结果和最终输入，才知道该改哪一层。\u003c/p>\n\u003cp>按这四处逐一查看，就能选择改进办法：补写缺少的规则；调整索引和筛选；连同前后条件取回完整片段；或改善任务拆分与模型配置。诊断从一条具体回答展开，改进才有明确位置。\u003c/p>\n\u003cp>维护也不应只靠“员工发现错误再说”。对经常影响承诺的知识，指定负责人定期检查；变更发生时，确认相关入口、暂存的资料副本和工作方法是否同步更新。知识库是企业运行资产，需要持续治理。\u003c/p>\n\u003ch2>企业何时才值得讨论训练\u003c/h2>\n\u003cp>当企业拥有质量足够、具有代表性的任务样例，希望稳定某种格式、风格或专门行为时，可以评估微调等方式。但应先确认问题不是资料供给、检索或流程设计造成的，并比较维护与验证成本。\u003c/p>\n\u003cp>稳定行为可以通过训练改善，频繁变化的规则和业务状态则通过资料与系统持续供给。企业据此把更新放到合适的位置，既保持工作方法，又能及时适应变化。\u003c/p>\n","text":"# 第12章｜知识库、RAG与业务数据怎样配合\n\n**知识库让稳定知识得到积累，RAG让相关知识在需要时进入模型，业务系统查询提供当前事实。三者配合，AI才能既按企业的方法工作，又跟上正在发生的业务。**\n\n企业常希望“把所有资料交给 AI，让它懂公司”。这里至少包含三个不同目标：了解稳定知识，查询当前状态，以及遵循企业的工作方法。它们需要的技术和维护方式不同。\n\n知识库通常保存制度、产品说明、操作经验和参考材料。RAG 是“检索增强生成”：先找出相关资料，再把这些资料交给模型用于回答或任务。业务数据查询则从订单、库存、客户等系统取得当前记录。训练或微调模型会改变参数，通常不适合作为每日更新业务事实的首选方式。\n\n## 检索究竟怎样工作\n\n在第一次查询之前，企业要先准备可查的资料。规则负责人选出正式服务手册，标明适用型号、地区和生效日期；实施者把文档按内容整理成可查的段落，保存每段来自哪份文件、哪一页。系统再建立便于查找的记录，这些查找记录称为“索引”。规则更新后，负责人替换有效版本，相关索引也要更新。\n\n先看生活中的一种查资料过程。准备照菜谱做晚饭，菜谱说明怎样做，冰箱里的食材决定今天能做多少。查到了菜谱，还要打开冰箱看看当前有什么。企业服务也有两类信息：服务手册写适用条件，排班系统记录今天还能安排谁。\n\n假设客服接到“这台设备坏了，明天能不能上门”的消息。应用先根据客户记录确定设备型号和服务地区，再到企业知识库查该型号的服务规则。用户说“坏了找谁”，文档标题却是“售后服务申请”，系统仍可能找到相关段落：除了按字词查找，还可以把文字转换成数值表示，比较含义接近的内容。这种表示常叫向量或 Embedding，对应的查找方式叫语义检索。\n\n找到候选段落以后，应用把适用的规则原文与本次问题一同交给模型。模型根据这些材料说明能提供什么服务。这个“先找资料，再带着资料回答”的过程，就是 RAG。\n\n检索通常还要利用产品、地区、客户类型、生效日期和权限等信息筛选候选。例如两个产品都有“售后更换”，当前任务先确定产品，再选择有效规则。含义匹配帮助找到资料，条件筛选帮助选对资料。\n\n![客户询问明日上门，知识库提供该型号服务条件，排班系统提供当前时段；客服据两类信息形成答复，确认后再提交预约。](assets/12.svg)\n\n## 一份制度为什么需要比正文更多的信息\n\n假定企业调整了某项服务规则。旧版仍在历史文件夹，新版已经生效，另有一份培训演示稿使用简化说法。如果只按文字相似程度检索，三份都有可能进入回答。\n\n规则负责人维护有效版本、生效范围和替代关系。应用查询时优先使用符合当前任务的正式版本，历史文件留给追溯。多个有效规则出现冲突，就把冲突内容交负责人处理，再更新共用入口。\n\n拆分长文档也要保留关系。某条优惠条件在前文，排除条件在后文；若只把前半段取给模型，答案可能扩大承诺。分块和索引的设计应考虑完整规则，而不只是让每块长度均匀。\n\n## 知识与当前事实怎样接力\n\n客户问能否安排下周服务，知识库可以提供服务范围和安排规则，但下周人员是否有空需要查排班；客户是否具备服务资格需要查相应记录；最终是否占用时段还需要执行预约。\n\n| 所需信息 | 更合适的取得方式 | 维护责任 |\n| --- | --- | --- |\n| 服务适用条件 | 有版本的知识资料 | 业务规则负责人 |\n| 当前客户和订单状态 | 业务系统查询 | 相应系统与数据负责人 |\n| 当前可用资源 | 排班或库存等权威记录 | 资源管理人员 |\n| 已作承诺及变更 | 绑定业务对象的正式记录 | 作出决定与执行的责任人 |\n\n每天上传一份当时的排班副本，适合只需要了解近期安排的任务；需要当场预约，则应查询当前可用时段，并在预约提交时检查时段是否仍空闲。实时性要求由业务动作决定，也决定连接应该做到哪一步。\n\n## 知识库失败时，怎样定位原因\n\n一个错误回答可能来自四处：资料本身错或缺；检索没有找到适用材料；取回片段缺少关键条件；模型没有正确利用已提供材料。分别检查原文、检索结果和最终输入，才知道该改哪一层。\n\n按这四处逐一查看，就能选择改进办法：补写缺少的规则；调整索引和筛选；连同前后条件取回完整片段；或改善任务拆分与模型配置。诊断从一条具体回答展开，改进才有明确位置。\n\n维护也不应只靠“员工发现错误再说”。对经常影响承诺的知识，指定负责人定期检查；变更发生时，确认相关入口、暂存的资料副本和工作方法是否同步更新。知识库是企业运行资产，需要持续治理。\n\n## 企业何时才值得讨论训练\n\n当企业拥有质量足够、具有代表性的任务样例，希望稳定某种格式、风格或专门行为时，可以评估微调等方式。但应先确认问题不是资料供给、检索或流程设计造成的，并比较维护与验证成本。\n\n稳定行为可以通过训练改善，频繁变化的规则和业务状态则通过资料与系统持续供给。企业据此把更新放到合适的位置，既保持工作方法，又能及时适应变化。"},{"id":"c13","file":"13-经验记忆Skill与企业学习.md","title":"第13章｜经验、记忆、Skill与企业学习","html":"\u003ch1>第13章｜经验、记忆、Skill与企业学习\u003c/h1>\n\u003cp>\u003cstrong>企业学习，是把工作中得到的经验写进下一次工作的资料、方法和系统，让更多人能够沿用，并继续修正。AI可以参与提取和整理，业务人员把其中有效的判断确认下来。\u003c/strong>\u003c/p>\n\u003cp>企业希望系统越用越懂业务，这个愿望需要拆开。系统可以保存当前任务进度，可以记住某位用户的偏好，可以积累企业知识，也可以维护经过验证的工作方法。它们都可能被产品称作“记忆”，但作用和责任不同。\u003c/p>\n\u003cp>这些记忆应按用途保存。个人表达偏好跟随用户，本次特别安排跟随任务，共用政策进入企业规则。应用按当前身份和任务调用相应内容，经验才会在合适的地方发挥作用。\u003c/p>\n\u003ch2>一次成功里，什么值得留下\u003c/h2>\n\u003cp>某位员工用 AI 做出一份合格方案，可能因为他提供了好资料，也可能因为他在多轮修改里补上了没有写出的专业判断。若只保存最后的提示词，下一位员工仍可能失败。\u003c/p>\n\u003cp>应回看过程：输入是什么，哪些地方原来出错，员工根据什么发现，修改了哪个条件，最后如何确认可用。由此提取的经验，可能是一个必要问题、一条适用规则、一种核对方法，也可能是某种情况下应停止自动处理。\u003c/p>\n\u003cp>回看成功与失败时，尤其要找到起作用的条件：是哪份资料补全了事实，哪种比较帮助判断，哪项检查发现了错误。把条件与方法一起保留，再换材料检验，就能分辨哪些经验值得沿用。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"13\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iODUzIiB2aWV3Qm94PSIwIDAgMzYwIDg1MyIgcm9sZT0iaW1nIj48dGl0bGU+5LiA5p2h57uP6aqM77yM5oCO5qC35Y+Y5oiQ5YWx55So5pa55rOVPC90aXRsZT48ZGVzYz7mnJ/mnJvor6/kvZzmib/or7rlkI7vvIzljLrliIbml6XmnJ/nirbmgIHvvIznlKjlt7Lmibnlh4bmnKrmibnlh4blkozlj5jmm7TmoLfkvovmo4Dmn6XvvIzlho3phY3nva7nu5nlhbHnlKjku7vliqHlubbnu7TmiqTjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYSIgbWFya2VyV2lkdGg9IjgiIG1hcmtlckhlaWdodD0iOCIgcmVmWD0iNyIgcmVmWT0iNCIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwIEw4IDQgTDAgOCBaIiBmaWxsPSIjMjQ2YTU1Ii8+PC9tYXJrZXI+PC9kZWZzPjxyZWN0IHdpZHRoPSIzNjAiIGhlaWdodD0iODUzIiBmaWxsPSJ3aGl0ZSIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiI+PHRleHQgeD0iMjQiIHk9IjM4IiBmb250LXNpemU9IjI0IiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNjAwIj7kuIDmnaHnu4/pqozvvIzmgI7moLflj5jmiJDlhbHnlKjmlrnms5U8L3RleHQ+PHRleHQgeD0iMjQiIHk9IjcxIiBmb250LXNpemU9IjE4IiBmaWxsPSIjNjE3MTZiIiBmb250LXdlaWdodD0iNDAwIj7npLrmhI/vvJrmiorlrqLmiLfmnJ/mnJvkuI7kvIHkuJrmib/or7rliIblvIA8L3RleHQ+PHJlY3QgeD0iMjQiIHk9IjEyNCIgd2lkdGg9IjMxMiIgaGVpZ2h0PSIxNDIiIHJ4PSI4IiBmaWxsPSIjZmNmMmU1IiBzdHJva2U9IiNkNWUwZGEiIHN0cm9rZS13aWR0aD0iMS40Ii8+PHRleHQgeD0iNDAiIHk9IjE1NCIgZm9udC1zaXplPSIyMSIgZmlsbD0iIzI0NmE1NSIgZm9udC13ZWlnaHQ9IjYwMCI+5Y+R546w5Y6f6ZSZ6K+vPC90ZXh0PjxwYXRoIGQ9Ik00MCAxNzYgSDMyMCIgc3Ryb2tlPSIjZDVlMGRhIiBzdHJva2Utd2lkdGg9IjIiIGZpbGw9Im5vbmUiLz48dGV4dCB4PSI0MCIgeT0iMjA4IiBmb250LXNpemU9IjIwIiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNDAwIj7lrqLmiLfor7TluIzmnJvmnIjlupXkuqTku5g8L3RleHQ+PHRleHQgeD0iNDAiIHk9IjIzNyIgZm9udC1zaXplPSIyMCIgZmlsbD0iIzIwM2YzOCIgZm9udC13ZWlnaHQ9IjQwMCI+57O757uf5Y205YaZ5oiQ5bey56Gu6K6k5pel5pyfPC90ZXh0Pj ">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>问题\u003c/th>\n\u003cth>优先改进的位置\u003c/th>\n\u003cth>改进如何发挥作用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>规则已经变更\u003c/td>\n\u003ctd>权威知识及生效范围\u003c/td>\n\u003ctd>让新任务取得当前规则\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>重要信息没有进入\u003c/td>\n\u003ctd>资料供给与上下文\u003c/td>\n\u003ctd>让模型获得判断所需事实\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>判断步骤不完整\u003c/td>\n\u003ctd>方法、样例与适用条件\u003c/td>\n\u003ctd>补足遗漏的比较与检查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>某项约束需严格执行\u003c/td>\n\u003ctd>系统写入或操作处\u003c/td>\n\u003ctd>在实际动作发生时核对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>信息方法合理仍持续不足\u003c/td>\n\u003ctd>模型配置、任务拆分或训练\u003c/td>\n\u003ctd>改善相应处理能力\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>通常应先改能够直接解决问题、影响范围又清楚的部分。每日变化的库存适合查系统；稳定的表达偏好适合任务配置；不能重复付款这样的约束需要执行系统支持。把所有问题都变成“再写一条提醒”，会使说明越来越长而保障越来越弱。\u003c/p>\n\u003ch2>企业学习也需要维护和淘汰\u003c/h2>\n\u003cp>共用方法应有负责人，重大修改要用新旧样例回查。适用条件变化后，旧经验可能需要退役。方法数量越来越多，若没有检索入口和版本管理，反而增加选错的机会。\u003c/p>\n\u003cp>记录下一项工作使用了哪部分方法、减少了什么准备、作了哪些调整，就能了解复用效果。有效方法值得安排维护；持续产生额外负担的方法则应修改或退出默认入口。企业学习由此有了具体的反馈。\u003c/p>\n\u003cp>经验沉淀的重点，是使企业更会判断和执行。AI 可以参与整理、比较和发现模式，组织仍需要对哪些经验值得沿用作出负责的决定。\u003c/p>\n","text":"# 第13章｜经验、记忆、Skill与企业学习\n\n**企业学习，是把工作中得到的经验写进下一次工作的资料、方法和系统，让更多人能够沿用，并继续修正。AI可以参与提取和整理，业务人员把其中有效的判断确认下来。**\n\n企业希望系统越用越懂业务，这个愿望需要拆开。系统可以保存当前任务进度，可以记住某位用户的偏好，可以积累企业知识，也可以维护经过验证的工作方法。它们都可能被产品称作“记忆”，但作用和责任不同。\n\n这些记忆应按用途保存。个人表达偏好跟随用户，本次特别安排跟随任务，共用政策进入企业规则。应用按当前身份和任务调用相应内容，经验才会在合适的地方发挥作用。\n\n## 一次成功里，什么值得留下\n\n某位员工用 AI 做出一份合格方案，可能因为他提供了好资料，也可能因为他在多轮修改里补上了没有写出的专业判断。若只保存最后的提示词，下一位员工仍可能失败。\n\n应回看过程：输入是什么，哪些地方原来出错，员工根据什么发现，修改了哪个条件，最后如何确认可用。由此提取的经验，可能是一个必要问题、一条适用规则、一种核对方法，也可能是某种情况下应停止自动处理。\n\n回看成功与失败时，尤其要找到起作用的条件：是哪份资料补全了事实，哪种比较帮助判断，哪项检查发现了错误。把条件与方法一起保留，再换材料检验，就能分辨哪些经验值得沿用。\n\n![运行记录转成经过检验的企业方法](assets/13.svg)\n\n## 从记录到方法，需要一轮验证\n\n设想系统曾把“客户提出的交付日期”写成“企业已确认日期”。团队发现后形成候选教训：将期望与承诺分开，并记录承诺的确认者及依据。\n\n接着要看正常任务：已经有明确批准的日期，仍应允许采用；客户反复变更时，要能找到当前版本；原话模糊时，应保持待确认。新规则若使所有日期都无法流转，也没有解决问题。\n\n验证后才把它发布为共用方法，说明适用范围、负责人和版本。原始错误记录保留，便于将来理解为何这样设计。下次若规则仍失败，再判断是方法不完整、资料不足，还是程序没有真正执行要求。\n\n## Skill在企业里可以是什么\n\n家里留下“一次做得很好的菜”的照片，还不足以让别人复做；写出材料用量、先后步骤和火候判断，再让家人试做，才开始形成可沿用的菜谱。企业保留一份成功方案也一样：还要留下它采用了什么材料、在哪些条件下作了哪些判断。\n\nSkill可以理解为一套供AI使用的任务说明和资源组合，包括适用条件、步骤、范例、检查方式，以及相关脚本或工具。不同产品的实现有所差异，企业可以先把它理解为“把怎样完成一类工作写给AI，并提供需要的资源”。\n\n企业可以把稳定方法组织成Skill，例如收到一类需求后先检查什么，怎样组织材料，遇到什么条件交给人，交出物怎样验收。它比一句提示更完整，也比“岗位智能体”这样的名称更容易检查。\n\n方法包还要与实际运行环境连接。比如方案制作Skill写明先查产品资料，再读取客户记录，应用就需要提供这些查询能力。使用前检查资料和工具是否齐备，运行中按约定处理返回结果，方法才能被真正执行。\n\n例如负责人将“整理订货需求”的方法保存到共用入口，里面说明怎样区分本次购买与未来意向，并附上原话范例。实施者把这项方法配置给对应任务：应用开始整理订货消息时，先读取这份说明，再连同客户材料交给模型。负责人修改共用说明后，后续任务取得新版本。这段读取与更新安排，使经验能被下一次工作真正用到。\n\n## 出错以后，应该改哪一层\n\n| 问题 | 优先改进的位置 | 改进如何发挥作用 |\n| --- | --- | --- |\n| 规则已经变更 | 权威知识及生效范围 | 让新任务取得当前规则 |\n| 重要信息没有进入 | 资料供给与上下文 | 让模型获得判断所需事实 |\n| 判断步骤不完整 | 方法、样例与适用条件 | 补足遗漏的比较与检查 |\n| 某项约束需严格执行 | 系统写入或操作处 | 在实际动作发生时核对 |\n| 信息方法合理仍持续不足 | 模型配置、任务拆分或训练 | 改善相应处理能力 |\n\n通常应先改能够直接解决问题、影响范围又清楚的部分。每日变化的库存适合查系统；稳定的表达偏好适合任务配置；不能重复付款这样的约束需要执行系统支持。把所有问题都变成“再写一条提醒”，会使说明越来越长而保障越来越弱。\n\n## 企业学习也需要维护和淘汰\n\n共用方法应有负责人，重大修改要用新旧样例回查。适用条件变化后，旧经验可能需要退役。方法数量越来越多，若没有检索入口和版本管理，反而增加选错的机会。\n\n记录下一项工作使用了哪部分方法、减少了什么准备、作了哪些调整，就能了解复用效果。有效方法值得安排维护；持续产生额外负担的方法则应修改或退出默认入口。企业学习由此有了具体的反馈。\n\n经验沉淀的重点，是使企业更会判断和执行。AI 可以参与整理、比较和发现模式，组织仍需要对哪些经验值得沿用作出负责的决定。\n"},{"id":"c14","file":"14-工具API浏览器与MCP怎样让AI行动.md","title":"第14章｜工具、API、浏览器与MCP怎样让AI行动","html":"\u003ch1>第14章｜工具、API、浏览器与MCP怎样让AI行动\u003c/h1>\n\u003cp>\u003cstrong>工具调用把AI的理解和规划接到实际操作上。模型根据任务提出动作，应用执行查询、计算或写入，再把结果交回后续工作。\u003c/strong>\u003c/p>\n\u003cp>只产生文字的 AI，可以建议“为客户建立服务申请”。能够调用工具的应用，则可能真的创建记录、查询库存、发送通知或运行程序。这是从辅助表达走向业务执行的重要变化，也使企业必须明确动作由谁授权、写到哪里、失败怎样处理。\u003c/p>\n\u003ch2>一次工具调用如何发生\u003c/h2>\n\u003cp>餐厅服务员把点单交给厨房，厨房接单后制作，再把菜与桌号交给出餐人员。服务员说“已经帮你下单”，背后需要厨房确实收到并登记。工具调用也有这样的来回：模型提出需要做的操作，已连接的程序去执行，再带回实际结果。\u003c/p>\n\u003cp>在客户服务应用里，实施者预先接好“查询订单”和“创建服务申请”等操作，并配置使用账号。应用告诉模型这些操作可以做什么、需要填哪些信息。这里的“参数”，就是执行这次操作必须提供的具体值，例如客户编号、设备编号、故障描述。模型填好这些项目，提出请求；应用检查后，把请求送到售后系统。\u003c/p>\n\u003cp>售后系统保存申请，返回申请编号和处理状态。应用把结果交回模型，模型便可以告诉用户“申请已建立”，并提供可打开的记录。图中去程传的是创建要求，回程传的是保存结果；下一次查询进度时，还使用这笔申请的编号。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"14\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iOTAwIiB2aWV3Qm94PSIwIDAgMzYwIDkwMCIgcm9sZT0iaW1nIj48dGl0bGU+55Sz6K+35oCO5qC35o+Q5Lqk77yM57uT5p6c5oCO5qC35Zue5p2lPC90aXRsZT48ZGVzYz7mqKHlnovmj5Dlh7rlj4LmlbDvvIzlupTnlKjmo4Dmn6Xlubblj5HpgIHvvIzllK7lkI7ns7vnu5/kv53lrZjov5Tlm57nvJblj7flkoznirbmgIHvvIzlupTnlKjmja7mraTlsZXnpLrlkozkuqTmjqXjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYSIgbWFya2VyV2lkdGg9IjgiIG1hcmtlckhlaWdodD0iOCIgcmVmWD0iNyIgcmVmWT0iNCIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwIEw4IDQgTDAgOCBaIiBmaWxsPSIjMjQ2YTU1Ii8+PC9tYXJrZXI+PC9kZWZzPjxyZWN0IHdpZHRoPSIzNjAiIGhlaWdodD0iOTAwIiBmaWxsPSJ3aGl0ZSIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiI+PHRleHQgeD0iMjQiIHk9IjM4IiBmb250LXNpemU9IjI0IiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNjAwIj7nlLPor7fmgI7moLfmj5DkuqTvvIznu5PmnpzmgI7moLflm57mnaU8L3RleHQ+PHRleHQgeD0iMjQiIHk9IjcxIiBmb250LXNpemU9IjE4IiBmaWxsPSIjNjE3MTZiIiBmb250LXdlaWdodD0iNDAwIj7npLrmhI/vvJpBSeWKqeaJi+WIm+W7uuS4gOeslOWUruWQjueUs+ivtzwvdGV4dD48cmVjdCB4PSIyNCIgeT0iMTI0IiB3aWR0aD0iMzEyIiBoZWlnaHQ9IjExMyIgcng9IjgiIGZpbGw9IiNlZGYyZjgiIHN0cm9rZT0iI2Q1ZTBkYSIgc3Ryb2tlLXdpZHRoPSIxLjQiLz48dGV4dCB4PSI0MCIgeT0iMTU0IiBmb250LXNpemU9IjIxIiBmaWxsPSIjMjQ2YTU1IiBmb250LXdlaWdodD0iNjAwIj7ikaAg5qih5Z6L5pW055CG5Yib5bu66KaB5rGCPC90ZXh0PjxwYXRoIGQ9Ik00MCAxNzYgSDMyMCIgc3Ryb2tlPSIjZDVlMGRhIiBzdHJva2Utd2lkdGg9IjIiIGZpbGw9Im5vbmUiLz48dGV4dCB4PSI0MCIgeT0iMjA4IiBmb250LXNpemU9IjIwIiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNDAwIj7lrqLmiLfnvJblj7fjgIHorr7lpIfnvJblj7fjgIHmlYXpmpzmj4/ov7A8L3RleHQ+PHBhdGggZD0iTTE4MC4wIDI0MiBWMjg2IiBzdHJva2U9IiMyNDZhNTUiIHN0cm9rZS13aWR0aD0iMiIgZmlsbD0ibm9uZSIgbWFya2VyLWVuZD0idXJsKCNhKSIvPjxyZWN0IHg9IjE5Mi4wIiB5PSIyNDYiIHdpZHRoPSIxNDIuMCIgaGVpZ2h0PSIzMCIgcng9IjAiIGZpbGw9 an>图 14-1\u003c/span>\u003cbutton type=\"button\" class=\"enlarge\" aria-label=\"放大查看图14-1\">放大查看\u003c/button>\u003c/figcaption>\u003c/figure>\n\u003cp>以建立服务申请为例，模型可以整理客户、设备和问题描述，提出创建请求。应用检查当前用户能否为该客户建单、必要字段是否齐全、是否已有重复申请，再向业务系统写入。成功后取得申请编号，并读回记录或核对保存结果，用户才有可以继续处理的对象。\u003c/p>\n\u003cp>申请创建后，接收团队可以按编号打开记录、安排处理。若接口先返回“请求已接受”，应用继续查询处理状态，取得保存结果再通知接手者。完整反馈让发起者知道工作推进到了哪里。\u003c/p>\n\u003ch2>几种连接方式各解决什么\u003c/h2>\n\u003cp>API 是系统开放给程序的操作入口，通常适合稳定、明确的数据读取和动作。浏览器操作模拟人在界面上的工作，适用于没有合适接口但允许通过界面处理的任务；它更容易受页面变化、登录状态和加载延迟影响。\u003c/p>\n\u003cp>仍以报修为例：人可以打开网页，在客户、设备、故障三栏中填写，再点击提交；程序也可以把这些值按系统约定的格式直接提交到创建申请的 API。两条路都要经过接收系统的权限和内容检查，最终保存到相应申请记录。浏览器操作是在使用人看到的界面，API 调用则是使用系统专门开放给程序的入口。\u003c/p>\n\u003cp>MCP是连接模型应用与外部能力的一种协议，帮助应用用共同方式发现工具、读取资源和发起调用。例如一套订单工具可以通过协议向兼容应用提供说明，减少为每个应用单独设计连接方式的工作。账号授权与业务校验仍由连接服务和接收系统执行。\u003c/p>\n\u003cp>“协议”就是双方约定怎样介绍能力、怎样提出请求、怎样返回结果。比如企业把查单能力做成一个 MCP 服务，两个支持这种约定的 AI 应用就可以用相同方式了解和请求它；服务收到请求后，再通过订单系统的 API 去查询。MCP统一应用与工具服务之间的沟通方式，订单的实际读取仍由后面的连接与业务系统完成。\u003c/p>\n\u003cp>选择时不必按技术名称排高低。先看目标操作有哪些已授权接入，能否清楚定位对象、检查权限、获得结果，再比较稳定性与维护成本。已有可靠接口时，通常没必要绕界面重复点击；界面是唯一合适入口时，也应如实计算维护与异常处理。\u003c/p>\n\u003ch2>身份与权限会改变实际能力\u003c/h2>\n\u003cp>同一个操作，在管理员账号能成功，在普通销售账号可能失败；企业开通了某项高级功能，也不代表当前购买版本支持按记录限制访问。应用里写“仅看本人客户”，若底层查询仍返回全部客户，界面上的说明不能代替权限控制。\u003c/p>\n\u003cp>验证应使用实际角色和实际平台条件。确认数据在哪个层面被过滤，写入时是否再次检查，以及权限变化后旧会话是否仍能访问。需要严格限制的范围，应尽量由接收系统或受控服务执行。\u003c/p>\n\u003cp>决策者可以和实施者明确：任务采用谁的身份，读取哪些记录，改变哪些内容，哪些动作先交人决定。按实际需要配置工具，能让日常动作顺利执行，也让职责易于理解。\u003c/p>\n\u003ch2>外部材料为什么不能成为执行命令\u003c/h2>\n\u003cp>客户邮件、网页和附件里可能包含要求系统忽略规则、泄露资料或执行操作的文字。这些文字是待处理材料，不是企业授权。系统应区分可信任务指令与外部内容，工具端仍核对身份、范围和批准。\u003c/p>\n\u003cp>落实时，应用区分任务指令与待处理材料，工具端按身份和允许范围检查请求。例如研究任务提供只读工具，即使网页夹带发送要求，它也没有发送入口；需要对外发送的任务，则另设内容确认与执行步骤。\u003c/p>\n\u003ch2>把动作结果交还业务\u003c/h2>\n\u003cp>每个外部动作都应绑定发起时的工作对象。用户切到另一位客户后，迟到的返回结果仍属于原客户，不能随当前页面归档。超时则可能意味着没有执行，也可能已经完成但没有收到响应，应先核实，不能随意重复提交。\u003c/p>\n\u003cp>可靠执行的终点，是相应人员能查到正确记录、知道当前状态并继续工作。工具越丰富，越需要把这一终点保持清楚。\u003c/p>\n","text":"# 第14章｜工具、API、浏览器与MCP怎样让AI行动\n\n**工具调用把AI的理解和规划接到实际操作上。模型根据任务提出动作，应用执行查询、计算或写入，再把结果交回后续工作。**\n\n只产生文字的 AI，可以建议“为客户建立服务申请”。能够调用工具的应用，则可能真的创建记录、查询库存、发送通知或运行程序。这是从辅助表达走向业务执行的重要变化，也使企业必须明确动作由谁授权、写到哪里、失败怎样处理。\n\n## 一次工具调用如何发生\n\n餐厅服务员把点单交给厨房，厨房接单后制作，再把菜与桌号交给出餐人员。服务员说“已经帮你下单”，背后需要厨房确实收到并登记。工具调用也有这样的来回：模型提出需要做的操作，已连接的程序去执行，再带回实际结果。\n\n在客户服务应用里，实施者预先接好“查询订单”和“创建服务申请”等操作，并配置使用账号。应用告诉模型这些操作可以做什么、需要填哪些信息。这里的“参数”，就是执行这次操作必须提供的具体值，例如客户编号、设备编号、故障描述。模型填好这些项目，提出请求；应用检查后，把请求送到售后系统。\n\n售后系统保存申请，返回申请编号和处理状态。应用把结果交回模型，模型便可以告诉用户“申请已建立”，并提供可打开的记录。图中去程传的是创建要求，回程传的是保存结果；下一次查询进度时，还使用这笔申请的编号。\n\n![模型组织客户、设备和故障信息，应用把创建请求交给售后系统；系统保存并返回编号，应用据此展示申请并交给服务团队。](assets/14.svg)\n\n以建立服务申请为例，模型可以整理客户、设备和问题描述，提出创建请求。应用检查当前用户能否为该客户建单、必要字段是否齐全、是否已有重复申请，再向业务系统写入。成功后取得申请编号，并读回记录或核对保存结果，用户才有可以继续处理的对象。\n\n申请创建后，接收团队可以按编号打开记录、安排处理。若接口先返回“请求已接受”，应用继续查询处理状态，取得保存结果再通知接手者。完整反馈让发起者知道工作推进到了哪里。\n\n## 几种连接方式各解决什么\n\nAPI 是系统开放给程序的操作入口，通常适合稳定、明确的数据读取和动作。浏览器操作模拟人在界面上的工作，适用于没有合适接口但允许通过界面处理的任务；它更容易受页面变化、登录状态和加载延迟影响。\n\n仍以报修为例：人可以打开网页，在客户、设备、故障三栏中填写，再点击提交；程序也可以把这些值按系统约定的格式直接提交到创建申请的 API。两条路都要经过接收系统的权限和内容检查，最终保存到相应申请记录。浏览器操作是在使用人看到的界面，API 调用则是使用系统专门开放给程序的入口。\n\nMCP是连接模型应用与外部能力的一种协议，帮助应用用共同方式发现工具、读取资源和发起调用。例如一套订单工具可以通过协议向兼容应用提供说明，减少为每个应用单独设计连接方式的工作。账号授权与业务校验仍由连接服务和接收系统执行。\n\n“协议”就是双方约定怎样介绍能力、怎样提出请求、怎样返回结果。比如企业把查单能力做成一个 MCP 服务，两个支持这种约定的 AI 应用就可以用相同方式了解和请求它；服务收到请求后，再通过订单系统的 API 去查询。MCP统一应用与工具服务之间的沟通方式，订单的实际读取仍由后面的连接与业务系统完成。\n\n选择时不必按技术名称排高低。先看目标操作有哪些已授权接入，能否清楚定位对象、检查权限、获得结果，再比较稳定性与维护成本。已有可靠接口时，通常没必要绕界面重复点击；界面是唯一合适入口时，也应如实计算维护与异常处理。\n\n## 身份与权限会改变实际能力\n\n同一个操作，在管理员账号能成功，在普通销售账号可能失败；企业开通了某项高级功能，也不代表当前购买版本支持按记录限制访问。应用里写“仅看本人客户”，若底层查询仍返回全部客户，界面上的说明不能代替权限控制。\n\n验证应使用实际角色和实际平台条件。确认数据在哪个层面被过滤，写入时是否再次检查，以及权限变化后旧会话是否仍能访问。需要严格限制的范围，应尽量由接收系统或受控服务执行。\n\n决策者可以和实施者明确：任务采用谁的身份，读取哪些记录，改变哪些内容，哪些动作先交人决定。按实际需要配置工具，能让日常动作顺利执行，也让职责易于理解。\n\n## 外部材料为什么不能成为执行命令\n\n客户邮件、网页和附件里可能包含要求系统忽略规则、泄露资料或执行操作的文字。这些文字是待处理材料，不是企业授权。系统应区分可信任务指令与外部内容，工具端仍核对身份、范围和批准。\n\n落实时，应用区分任务指令与待处理材料，工具端按身份和允许范围检查请求。例如研究任务提供只读工具，即使网页夹带发送要求，它也没有发送入口；需要对外发送的任务，则另设内容确认与执行步骤。\n\n## 把动作结果交还业务\n\n每个外部动作都应绑定发起时的工作对象。用户切到另一位客户后，迟到的返回结果仍属于原客户，不能随当前页面归档。超时则可能意味着没有执行，也可能已经完成但没有收到响应，应先核实，不能随意重复提交。\n\n可靠执行的终点，是相应人员能查到正确记录、知道当前状态并继续工作。工具越丰富，越需要把这一终点保持清楚。\n"},{"id":"c15","file":"15-工作流Agent与多Agent怎样选择.md","title":"第15章｜工作流、Agent与多Agent怎样选择","html":"\u003ch1>第15章｜工作流、Agent与多Agent怎样选择\u003c/h1>\n\u003cp>\u003cstrong>固定步骤与动态判断可以组合使用。选择依据是任务路径有多不确定、动作后果有多大，以及协调成本是否值得。\u003c/strong>\u003c/p>\n\u003cp>工作流通常由人预先规定主要步骤与分支，例如收集资料、检查字段、计算、审批、保存。Agent 通常译为“智能体”，它允许模型在一定范围内，根据目标和反馈选择下一步，如决定还需查哪些资料、使用什么工具或怎样调整计划。不同产品使用这些名称的方式不完全一致，应看实际控制方式。\u003c/p>\n\u003cp>两者可以在同一项工作中组合。流程规定必须经过的环节，模型在其中处理变化的材料、提出判断或选择查询路径。企业据此把稳定要求与灵活处理放在各自合适的位置。\u003c/p>\n\u003ch2>哪些部分值得固定\u003c/h2>\n\u003cp>照着家人的晚餐安排做饭，有些要求事先就确定了：几个人吃、谁有明确忌口、几点开饭；冰箱里缺了一种配菜时，做饭的人可以查看现有食材，选择替代搭配。企业流程也可以同时包含这两类安排：确定必须遵守的步骤，让模型在需要判断的部分选择办法。\u003c/p>\n\u003cp>例如处理售后申请，客户和设备必须先确认，提交前必须有故障描述；在这些环节中，客户发照片就先辨认型号，只有含糊描述就先追问，提供过维修记录就补查历史。这些中间动作由已有材料决定。材料够用后，仍回到同一个出口：保存申请并交给维修团队。\u003c/p>\n\u003cp>金额计算、必填字段、身份权限、批准与写入关系等，往往需要明确规则。将这些部分固定，可以减少遗漏，并让错误更容易定位。模型适合处理表达多变、材料形态不同或需要综合判断的部分。\u003c/p>\n\u003cp>例如研究竞争产品时，检索路径可能变化，适合让模型根据已有证据决定下一项查询；最终采购批准仍应走企业既有授权。处理标准服务申请时，主要步骤固定，模型可以解释客户原话和识别缺项，没必要让它每次重新发明整个流程。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"15\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iODQ4IiB2aWV3Qm94PSIwIDAgMzYwIDg0OCIgcm9sZT0iaW1nIj48dGl0bGU+5oyJ5p2Q5paZ6YCJ5q2l6aqk77yM57uf5LiA5Lqk5o6lPC90aXRsZT48ZGVzYz7lm7rlrprlhaXlj6Plh7rlj6PlhoXvvIzmoLnmja7mnZDmlpnpgInmi6novqjorqTjgIHov73pl67miJbmn6Xljoblj7LvvJvnvLrlhbPplK7pobnnu6fnu63ooaXlhYXvvIzotrPlpJ/lj5fnkIblkI7kv53lrZjjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYSIgbWFya2VyV2lkdGg9IjgiIG1hcmtlckhlaWdodD0iOCIgcmVmWD0iNyIgcmVmWT0iNCIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwIEw4IDQgTDAgOCBaIiBmaWxsPSIjMjQ2YTU1Ii8+PC9tYXJrZXI+PC9kZWZzPjxyZWN0IHdpZHRoPSIzNjAiIGhlaWdodD0iODQ4IiBmaWxsPSJ3aGl0ZSIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiI+PHRleHQgeD0iMjQiIHk9IjM4IiBmb250LXN +Q5LqkPC90ZXh0Pjx0ZXh0IHg9IjQwIiB5PSI3OTUiIGZvbnQtc2l6ZT0iMjAiIGZpbGw9IiMyMDNmMzgiIGZvbnQtd2VpZ2h0PSI0MDAiPue7tOS/ruWboumYn+WPluW+l+WPr+WkhOeQhueahOiusOW9lTwvdGV4dD48L2c+PC9zdmc+\" alt=\"售后申请保留确认对象、整理故障和保存接手的固定路径；其中材料不同时，模型选择看照片、追问或查历史，再回到共同出口。\">\u003c/picture>\u003cfigcaption>\u003cspan>图 15-1\u003c/span>\u003cbutton type=\"button\" class=\"enlarge\" aria-label=\"放大查看图15-1\">放大查看\u003c/button>\u003c/figcaption>\u003c/figure>\n\u003ch2>自主性不只是一个开关\u003c/h2>\n\u003cp>企业应分别决定几种自由：模型能看到哪些资料，能自行选择哪些方法，能调整什么顺序，能执行哪些外部动作，以及何时必须交给人。\u003c/p>\n\u003cp>可以允许它自由查内部公开产品资料，却只允许生成客户回复草稿；也可以允许它自动更新低影响标签，但涉及价格承诺必须批准。这种分解比笼统地说“让Agent自动干活”更容易讨论。\u003c/p>\n\u003cp>应用据此提供相应工具，并在执行处检查条件。例如允许自动更新标签，工具就只开放标签字段；价格修改需要批准，写入时就核对批准对应的内容。自主范围因此成为可以实现的分工。\u003c/p>\n\u003ch2>多Agent在什么时候有帮助\u003c/h2>\n\u003cp>多Agent可以把工作分给多个模型任务，例如分别研究几个互相独立的主题，或由一个任务生成候选、另一个按明确标准检查。它的价值来自并行、职责分离或不同工具能力，而不是角色名称丰富。\u003c/p>\n\u003cp>多Agent的分工需要实质差异。研究任务可以分别取得不同来源，检查任务可以使用明确标准和另一组验证材料，合并者负责处理冲突。同一材料和相似方法可能产生相关错误，设计时应关注每个任务究竟增加了哪种信息或检查。\u003c/p>\n\u003cp>比如比较三种客服软件，可以把同一份任务要求交给三个研究任务，分别查甲、乙、丙的官方功能与接入条件。每个任务交回产品版本、相关原文和未确认问题，再由合并者按相同栏目整理。若甲只查了基础版、乙查的是高级版，合并时先补齐版本条件，才比较价格。这和家人分别查机票、住宿再汇总旅行预算相似：可以分头查，但日期、人数和包含费用必须一致。\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>情况\u003c/th>\n\u003cth>可以考虑的安排\u003c/th>\n\u003cth>需要额外承担\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>多项互不依赖的信息收集\u003c/td>\n\u003ctd>并行研究后合并\u003c/td>\n\u003ctd>去重、口径对齐与出处核查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同一任务需要生成与挑战\u003c/td>\n\u003ctd>分开提出与检查\u003c/td>\n\u003ctd>检查标准及独立证据，避免只是换口吻\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>后续步骤依赖前一步结论\u003c/td>\n\u003ctd>顺序执行或局部并行\u003c/td>\n\u003ctd>状态交接和错误传播管理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>任务很短且路径明确\u003c/td>\n\u003ctd>单流程或单Agent\u003c/td>\n\u003ctd>多方协调通常可能得不偿失\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch2>协调成本怎样吃掉收益\u003c/h2>\n\u003cp>任务拆得过细，每个Agent都需要重复理解背景，产生大量中间文件；合并时还要解决同一对象不同名称、互相矛盾的假设和遗漏。并行节约的时间可能被协调消耗。\u003c/p>\n\u003cp>因此应先证明单个任务方法有效，再决定是否拆分。比较时计算整个任务的质量、费用、耗时和人工整理，而不只看各子任务完成得多快。对复杂任务，还应观察某个子任务失败时，是否能只重做受影响部分。\u003c/p>\n\u003ch2>企业怎样审查一个Agent方案\u003c/h2>\n\u003cp>请提供方演示一个未预先准备的正常任务、一个缺信息任务和一个工具失败任务。观察它怎样选择下一步、什么时候停下、如何说明未完成，以及接手者能否看懂当前状态。\u003c/p>\n\u003cp>观察过程中，重点看它是否利用查询和工具反馈改变下一步：缺少材料时补查，发现冲突时比较，完成动作后取得结果。这样的演示能帮助企业确定哪些步骤适合动态处理，以及哪些地方保留固定安排。\u003c/p>\n","text":"# 第15章｜工作流、Agent与多Agent怎样选择\n\n**固定步骤与动态判断可以组合使用。选择依据是任务路径有多不确定、动作后果有多大，以及协调成本是否值得。**\n\n工作流通常由人预先规定主要步骤与分支，例如收集资料、检查字段、计算、审批、保存。Agent 通常译为“智能体”，它允许模型在一定范围内，根据目标和反馈选择下一步，如决定还需查哪些资料、使用什么工具或怎样调整计划。不同产品使用这些名称的方式不完全一致，应看实际控制方式。\n\n两者可以在同一项工作中组合。流程规定必须经过的环节，模型在其中处理变化的材料、提出判断或选择查询路径。企业据此把稳定要求与灵活处理放在各自合适的位置。\n\n## 哪些部分值得固定\n\n照着家人的晚餐安排做饭，有些要求事先就确定了：几个人吃、谁有明确忌口、几点开饭；冰箱里缺了一种配菜时，做饭的人可以查看现有食材，选择替代搭配。企业流程也可以同时包含这两类安排：确定必须遵守的步骤，让模型在需要判断的部分选择办法。\n\n例如处理售后申请，客户和设备必须先确认，提交前必须有故障描述；在这些环节中，客户发照片就先辨认型号，只有含糊描述就先追问，提供过维修记录就补查历史。这些中间动作由已有材料决定。材料够用后，仍回到同一个出口：保存申请并交给维修团队。\n\n金额计算、必填字段、身份权限、批准与写入关系等，往往需要明确规则。将这些部分固定，可以减少遗漏，并让错误更容易定位。模型适合处理表达多变、材料形态不同或需要综合判断的部分。\n\n例如研究竞争产品时，检索路径可能变化，适合让模型根据已有证据决定下一项查询；最终采购批准仍应走企业既有授权。处理标准服务申请时，主要步骤固定，模型可以解释客户原话和识别缺项，没必要让它每次重新发明整个流程。\n\n![售后申请保留确认对象、整理故障和保存接手的固定路径；其中材料不同时，模型选择看照片、追问或查历史，再回到共同出口。](assets/15.svg)\n\n## 自主性不只是一个开关\n\n企业应分别决定几种自由：模型能看到哪些资料，能自行选择哪些方法，能调整什么顺序，能执行哪些外部动作，以及何时必须交给人。\n\n可以允许它自由查内部公开产品资料，却只允许生成客户回复草稿；也可以允许它自动更新低影响标签，但涉及价格承诺必须批准。这种分解比笼统地说“让Agent自动干活”更容易讨论。\n\n应用据此提供相应工具，并在执行处检查条件。例如允许自动更新标签，工具就只开放标签字段；价格修改需要批准，写入时就核对批准对应的内容。自主范围因此成为可以实现的分工。\n\n## 多Agent在什么时候有帮助\n\n多Agent可以把工作分给多个模型任务，例如分别研究几个互相独立的主题，或由一个任务生成候选、另一个按明确标准检查。它的价值来自并行、职责分离或不同工具能力，而不是角色名称丰富。\n\n多Agent的分工需要实质差异。研究任务可以分别取得不同来源，检查任务可以使用明确标准和另一组验证材料，合并者负责处理冲突。同一材料和相似方法可能产生相关错误，设计时应关注每个任务究竟增加了哪种信息或检查。\n\n比如比较三种客服软件，可以把同一份任务要求交给三个研究任务，分别查甲、乙、丙的官方功能与接入条件。每个任务交回产品版本、相关原文和未确认问题，再由合并者按相同栏目整理。若甲只查了基础版、乙查的是高级版，合并时先补齐版本条件，才比较价格。这和家人分别查机票、住宿再汇总旅行预算相似：可以分头查，但日期、人数和包含费用必须一致。\n\n| 情况 | 可以考虑的安排 | 需要额外承担 |\n| --- | --- | --- |\n| 多项互不依赖的信息收集 | 并行研究后合并 | 去重、口径对齐与出处核查 |\n| 同一任务需要生成与挑战 | 分开提出与检查 | 检查标准及独立证据，避免只是换口吻 |\n| 后续步骤依赖前一步结论 | 顺序执行或局部并行 | 状态交接和错误传播管理 |\n| 任务很短且路径明确 | 单流程或单Agent | 多方协调通常可能得不偿失 |\n\n## 协调成本怎样吃掉收益\n\n任务拆得过细，每个Agent都需要重复理解背景，产生大量中间文件；合并时还要解决同一对象不同名称、互相矛盾的假设和遗漏。并行节约的时间可能被协调消耗。\n\n因此应先证明单个任务方法有效，再决定是否拆分。比较时计算整个任务的质量、费用、耗时和人工整理，而不只看各子任务完成得多快。对复杂任务，还应观察某个子任务失败时，是否能只重做受影响部分。\n\n## 企业怎样审查一个Agent方案\n\n请提供方演示一个未预先准备的正常任务、一个缺信息任务和一个工具失败任务。观察它怎样选择下一步、什么时候停下、如何说明未完成，以及接手者能否看懂当前状态。\n\n观察过程中，重点看它是否利用查询和工具反馈改变下一步：缺少材料时补查，发现冲突时比较，完成动作后取得结果。这样的演示能帮助企业确定哪些步骤适合动态处理，以及哪些地方保留固定安排。"},{"id":"c16","file":"16-长任务Harness与执行可靠性.md","title":"第16章｜长任务、Harness与执行可靠性","html":"\u003ch1>第16章｜长任务、Harness与执行可靠性\u003c/h1>\n\u003cp>\u003cstrong>Harness是支持AI持续工作的执行安排，包括工具、任务状态、运行环境、检查与恢复。它让多步工作能够保存进展、利用反馈，并在中断后继续。\u003c/strong>\u003c/p>\n\u003cp>整理大量材料、连续修改方案、开发并部署工具，都可能跨越多轮对话与多次工具调用。每一轮的结果需要成为下一轮的条件，中途还会遇到信息增加、工具失败和要求改变。Harness负责组织这种连续性。\u003c/p>\n\u003cp>对于管理者，理解它最直接的方式，是看一项工作如何保存已经取得的材料与结果，以及接手时怎样知道下一步。\u003c/p>\n\u003ch2>为什么单步不错，整项任务仍会失败\u003c/h2>\n\u003cp>一项工作可能需要读取、提取、核对、计算、写入和通知。前一步的错误会进入后一步；某一步失败后盲目继续，最终产物可能更难发现问题。\u003c/p>\n\u003cp>可以用一个假设算例理解为什么要安排检查与恢复：若10个步骤相互独立，每步成功概率都是95%，前两步都成功的概率是95%×95%，继续把10步相乘，就得到约60%。实际步骤通常存在依赖，因此这里仅说明累积关系。系统若能发现失败并重做受影响部分，就有机会提高整项任务的完成率。\u003c/p>\n\u003cp>增加检查、重试和恢复能够改善部分失败，但也会增加成本与时间。应按实际任务测量最终结果，而不是不断堆叠步骤。\u003c/p>\n\u003ch2>至少保存三类连续性\u003c/h2>\n\u003cp>任务连续性说明目标、范围和完成条件是否仍清楚。证据连续性说明当前结论采用哪些资料、版本和确认。动作连续性说明哪些操作未开始、进行中、已经完成或结果未知。\u003c/p>\n\u003cp>交接记录应把三类内容分别记清：目标与完成条件，采用的资料和版本，已经发生的动作与当前状态。恢复时按这些信息定位可复用结果，核对必要事实，再执行下一步。原始文件和系统记录保留可找回的位置。\u003c/p>\n\u003cp>例如下午整理完一批报修材料，还没建立申请就中断了。应用把已整理的文件位置、哪些材料已核对、哪些仍缺型号，以及“尚未创建申请”保存到任务记录。第二天继续时，先打开这份记录，找到已保存的整理结果，补问缺项，然后创建申请。若中断发生在提交以后，就先查询有没有生成申请，再决定从哪里继续。两种中断留下的事实不同，恢复动作也不同。\u003c/p>\n\u003cp>条件改变时，还要知道哪些旧结果失效。例如需求修改后，原计算和批准可能都需要重做；已经取得的通用资料则未必需要重新检索。清楚的依赖关系能避免全盘重来，也避免沿用已失效产物。\u003c/p>\n\u003ch2>超时为什么特别危险\u003c/h2>\n\u003cp>网上寄件时，点击提交后页面一直转圈，你可能会先打开“我的寄件”看看有没有生成运单。因为转圈只说明你尚未看到结果：平台可能没收到请求，也可能已经生成运单，只是回执没有到达页面。再点一次之前，先查记录，能减少重复下单。\u003c/p>\n\u003cp>AI应用创建服务申请后等待过久，也会遇到同样的问题。“超时”是等待结果超过了设定时间，并不能单独说明保存是否发生。恢复处理先按原客户、设备和这次请求查记录：已经有申请就沿已有记录继续；接收系统明确未执行后才重新提交；无法判断时让接手人员核实。\u003c/p>\n\u003cp>“幂等”在这里指同一次创建请求重复送达，也只产生一笔申请。接收系统支持这种操作时，应用为同一次提交保留固定请求标识。接收端记录这个标识及对应结果，再收到相同请求就返回已有结果，从而避免重复创建。没有接收端支持时，应用先按业务对象查询是否已创建，无法确定则交人核实。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"16\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iODU2IiB2aWV3Qm94PSIwIDAgMzYwIDg1NiIgcm9sZT0iaW1nIj48dGl0bGU+5LiA55u06L2s5ZyI77yM5YWI5p+l5piv5ZCm5bey57uP5L+d5a2YPC90aXRsZT48ZGVzYz7otoXml7blkI7mjInljp/or7fmsYLmn6Xor4HvvIzlt7Lkv53lrZjnlKjljp/nvJblj7fnu6fnu63vvIznoa7orqTmnKrmiafooYzmiY3ph43or5XvvIzmnKrnn6XliJnkuqTkurrmoLjlrp7jgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYSIgbWFya2VyV2lkdGg9IjgiIG1hcmtlckhlaWdodD0iOCIgcmVmWD0iNyIgcmVmWT0iNCIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwIEw4IDQgTDAgOCBaIiBmaWxsPSIjMjQ2YTU1Ii8+PC9tYXJrZXI+PC9kZWZzPjxyZWN0IHdpZHRoPSIzNjAiIGhlaWdodD0iODU2IiBmaWxsPSJ3aGl0ZSIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiI+PHRleHQgeD0iMjQiIHk9IjM4IiBmb250LXNpemU9IjI0IiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNjAwIj7kuIDnm7TovazlnIjvvIzlhYjmn6XmmK/lkKblt7Lnu4/kv53lrZg8L3RleHQ+PHRleHQgeD0iMjQiIHk9IjcxIiBmb250LXNpemU9IjE4IiBmaWxsPSIjNjE3MTZiIiBmb250LXdlaWdodD0iNDAwIj7npLrmhI/vvJrliJvlu7rmnI3liqHnlLPor7flkI7msqHmnInmlLbliLDlm57miac8L3RleHQ+PHJlY3QgeD0iMjQiIHk9IjEyNCIgd2lkdGg9IjMxMiIgaGVpZ2h0PSIxNDIiIHJ4PSI4IiBmaWxsPSIjZWRmMmY4IiBzdHJva2U9IiNkNWUwZGEiIHN0cm9rZS13aWR0aD0iMS40Ii8+PHRleHQgeD0iNDAiIHk9IjE1NCIgZm9udC1zaXplPSIyMSIgZmlsbD0iIzI0NmE1NSIgZm9udC13ZWlnaHQ9IjYwMCI+5b2T5YmN5Y+q55+l6YGT77ya562J5b6F6LaF5pe2PC90ZXh0PjxwYXRoIGQ9Ik00MCAxNzYgSDMyMCIgc3Ryb2tlPSIjZDVlMGRhIiBzdHJva2Utd2lkdGg9IjIiIGZpbGw9Im5vbmUiLz48dGV4dCB4PSI0MCIgeT0iMjA4IiBmb250LXNpemU9IjIwIiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNDAwIj7lj6/og73mnKrmiafooYzvvIzkuZ/lj6/og73lt7Lkv53lrZg8L3Rl >\n\u003cp>长任务的成熟，表现为出错后仍能有序继续，且企业知道哪些已经发生。可靠性来自模型能力与执行安排共同建设。\u003c/p>\n","text":"# 第16章｜长任务、Harness与执行可靠性\n\n**Harness是支持AI持续工作的执行安排，包括工具、任务状态、运行环境、检查与恢复。它让多步工作能够保存进展、利用反馈，并在中断后继续。**\n\n整理大量材料、连续修改方案、开发并部署工具，都可能跨越多轮对话与多次工具调用。每一轮的结果需要成为下一轮的条件，中途还会遇到信息增加、工具失败和要求改变。Harness负责组织这种连续性。\n\n对于管理者，理解它最直接的方式，是看一项工作如何保存已经取得的材料与结果，以及接手时怎样知道下一步。\n\n## 为什么单步不错，整项任务仍会失败\n\n一项工作可能需要读取、提取、核对、计算、写入和通知。前一步的错误会进入后一步；某一步失败后盲目继续，最终产物可能更难发现问题。\n\n可以用一个假设算例理解为什么要安排检查与恢复：若10个步骤相互独立，每步成功概率都是95%，前两步都成功的概率是95%×95%，继续把10步相乘，就得到约60%。实际步骤通常存在依赖，因此这里仅说明累积关系。系统若能发现失败并重做受影响部分，就有机会提高整项任务的完成率。\n\n增加检查、重试和恢复能够改善部分失败，但也会增加成本与时间。应按实际任务测量最终结果，而不是不断堆叠步骤。\n\n## 至少保存三类连续性\n\n任务连续性说明目标、范围和完成条件是否仍清楚。证据连续性说明当前结论采用哪些资料、版本和确认。动作连续性说明哪些操作未开始、进行中、已经完成或结果未知。\n\n交接记录应把三类内容分别记清：目标与完成条件，采用的资料和版本，已经发生的动作与当前状态。恢复时按这些信息定位可复用结果，核对必要事实，再执行下一步。原始文件和系统记录保留可找回的位置。\n\n例如下午整理完一批报修材料，还没建立申请就中断了。应用把已整理的文件位置、哪些材料已核对、哪些仍缺型号，以及“尚未创建申请”保存到任务记录。第二天继续时，先打开这份记录，找到已保存的整理结果，补问缺项，然后创建申请。若中断发生在提交以后，就先查询有没有生成申请，再决定从哪里继续。两种中断留下的事实不同，恢复动作也不同。\n\n条件改变时，还要知道哪些旧结果失效。例如需求修改后，原计算和批准可能都需要重做；已经取得的通用资料则未必需要重新检索。清楚的依赖关系能避免全盘重来，也避免沿用已失效产物。\n\n## 超时为什么特别危险\n\n网上寄件时，点击提交后页面一直转圈，你可能会先打开“我的寄件”看看有没有生成运单。因为转圈只说明你尚未看到结果：平台可能没收到请求，也可能已经生成运单，只是回执没有到达页面。再点一次之前，先查记录，能减少重复下单。\n\nAI应用创建服务申请后等待过久，也会遇到同样的问题。“超时”是等待结果超过了设定时间，并不能单独说明保存是否发生。恢复处理先按原客户、设备和这次请求查记录：已经有申请就沿已有记录继续；接收系统明确未执行后才重新提交；无法判断时让接手人员核实。\n\n“幂等”在这里指同一次创建请求重复送达，也只产生一笔申请。接收系统支持这种操作时，应用为同一次提交保留固定请求标识。接收端记录这个标识及对应结果，再收到相同请求就返回已有结果，从而避免重复创建。没有接收端支持时，应用先按业务对象查询是否已创建，无法确定则交人核实。\n\n![保存申请后未收到回执，恢复先查原请求；已保存则沿原编号继续，确认未执行才重试，结果仍未知则交人核实。](assets/16.svg)\n\n付款、通知和订单等动作，分别按业务后果设计恢复方法。读取可以重做，已经送出的通知则需要核对实际接收情况；这种区别会直接影响恢复路径。\n\n## 恢复应该从事实继续\n\n模型会话中断后，恢复过程先读取保存的任务状态和实际产物，核对外部动作，再继续未完成部分。不要只让模型猜上次做到哪里。工具失败也应反馈明确：是无权限、输入不适用、服务不可达，还是结果未知。\n\n对可以安全重复的读取，可以重试；对会产生外部影响的写入，需要先核实；对资料缺失或目标冲突，重复调用通常没有帮助。区分这些情况，比设置统一“失败重试三次”更重要。\n\n## 管理者应该要求什么演示\n\n可以请实施者在一项长任务进行中暂停，再恢复；在保存请求超时后查看如何处理；修改一项已确认条件，观察哪些结果被标记需要重做。接手者还应能看懂状态并选择人工完成，而不是只有原开发者知道如何继续。\n\n运行记录应帮助定位，而不只是显示“执行成功”。至少能看到读取范围、所用版本、关键动作结果、未完成项和人工接手。模型写出的过程说明，可以辅助理解，却不能替代这些实际证据。\n\n长任务的成熟，表现为出错后仍能有序继续，且企业知道哪些已经发生。可靠性来自模型能力与执行安排共同建设。\n"},{"id":"c17","file":"17-怎样评估能力并选择模型.md","title":"第17章｜怎样评估能力并选择模型","html":"\u003ch1>第17章｜怎样评估能力并选择模型\u003c/h1>\n\u003cp>\u003cstrong>企业应按任务选择模型组合，比较合格结果、完整成本、响应时间和维护条件。先明确工作需要，再用相同材料比较候选，就能把模型变化转成可管理的选择。\u003c/strong>\u003c/p>\n\u003cp>模型和产品变化很快。企业若围绕某个名称组织全部方案，很容易在升级时重新争论。更稳定的做法是先定义任务和判断标准，再用相同材料比较候选，并保留重新评估的能力。\u003c/p>\n\u003ch2>先判断正在比较什么\u003c/h2>\n\u003cp>一个产品可能同时包含模型、检索、工具和界面。某次表现改善，可能来自更强模型，也可能因为资料更完整、工具接通或流程更合理。比较时应尽量保持条件一致；若比较的是整套产品，就明确评价整套方案，不把成绩全部归给模型。\u003c/p>\n\u003cp>任务还需要分类。文字整理、复杂推理、图像识别、程序生成和工具选择，错误方式不同。没有必要期待一个配置在所有任务里最优。\u003c/p>\n\u003ch2>建立小而有代表性的任务集\u003c/h2>\n\u003cp>假设企业准备选择整理订货消息的模型，可以先把“怎样才算整理正确”写在消息旁边，再让候选模型处理同样材料：\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>客户消息示意\u003c/th>\n\u003cth>正确结果应保留什么\u003c/th>\n\u003cth>怎样判断\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>“这次两套，明年可能再加一套”\u003c/td>\n\u003ctd>本次两套，明年一套列意向\u003c/td>\n\u003ctd>检查是否把未来意向加进本单\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>“颜色沿用上次”\u003c/td>\n\u003ctd>需要查对应历史，当前颜色待确认\u003c/td>\n\u003ctd>检查是否编出颜色或引用错客户\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>“先别下单，等我确认”\u003c/td>\n\u003ctd>暂不下单，等待客户确认\u003c/td>\n\u003ctd>检查是否保留否定与条件\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>对照结果后，再记录每种配置的处理时间、人工修改和费用。这样，选择依据就落在同一类真实工作上。模型名称和演示印象可以帮助提出候选，采用决定则由这些比较结果支持。\u003c/p>\n\u003cp>从实际工作选取标准输入、缺项、歧义、否定、变更和异常。保留原始材料、预期结果与判断依据。涉及客户或员工资料时按企业相应规则处理，避免为测试随意扩大数据范围。\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>任务类别\u003c/th>\n\u003cth>评价重点\u003c/th>\n\u003cth>检查办法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>字段提取\u003c/td>\n\u003ctd>关键字段、否定和状态\u003c/td>\n\u003ctd>对照原始片段与采用规则\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>研究与分析\u003c/td>\n\u003ctd>依据、口径和推导\u003c/td>\n\u003ctd>查回材料，复算，比较其他解释\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>内容创作\u003c/td>\n\u003ctd>事实、用途与连贯\u003c/td>\n\u003ctd>按实际读者任务打开成品检查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工具执行\u003c/td>\n\u003ctd>对象、参数与执行结果\u003c/td>\n\u003ctd>读回记录，由接收方继续\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>长任务\u003c/td>\n\u003ctd>完整结果与恢复\u003c/td>\n\u003ctd>暂停后继续，修改条件后重做受影响部分\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>样本不只覆盖最常见情况，也要包含后果严重的错误。但人为挑选的小集合，不适合直接当总体成功率。它帮助发现缺陷并比较候选，后续还需要受控试用观察日常分布。\u003c/p>\n\u003ch2>不同错误不能简单平均\u003c/h2>\n\u003cp>把客户意向写成承诺，比内部标签略有偏差后果更大。总分相同的两个配置，可能一个偶尔措辞不佳，另一个偶尔归错客户。企业应先规定不可接受的错误和必须交人的情况，再比较一般质量。\u003c/p>\n\u003cp>质量判断可以组合几种依据：关键字段对照原材料，计算由程序重算，执行核对系统记录，专业结论由对应人员评价。模型自评可作辅助信息，最终采用上述可检查的结果。\u003c/p>\n\u003ch2>算完整任务成本\u003c/h2>\n\u003cp>单次调用便宜，不代表整项工作便宜。重试、检索、代码执行、子任务、人工复核和维护都应计入。响应较慢也未必坏，复杂经营分析可以等待，客户现场操作则可能需要更快反馈。\u003c/p>\n\u003cp>可以采用分层配置：简单整理使用适当的轻量能力，遇到复杂推理再升级；确定性计算交给程序，知识查询按需进行。升级条件应能观察，例如资料冲突、必要字段缺失或任务类型变化，不能只靠模型自己说“这题很难”。\u003c/p>\n\u003ch2>版本更新怎样管理\u003c/h2>\n\u003cp>模型、提示、工具和资料任何一项变化，都可能改变表现。更新前复测核心任务和历史失败，受控观察后再扩大。记录当时使用的配置，才能在问题发生时还原条件。\u003c/p>\n\u003cp>企业不需要为每次小改做庞大测试，但涉及关键承诺、权限或写入的变化，应有相应验证。选择的目标是获得适合企业的能力组合，并知道何时需要重新判断。\u003c/p>\n","text":"# 第17章｜怎样评估能力并选择模型\n\n**企业应按任务选择模型组合，比较合格结果、完整成本、响应时间和维护条件。先明确工作需要，再用相同材料比较候选，就能把模型变化转成可管理的选择。**\n\n模型和产品变化很快。企业若围绕某个名称组织全部方案，很容易在升级时重新争论。更稳定的做法是先定义任务和判断标准，再用相同材料比较候选，并保留重新评估的能力。\n\n## 先判断正在比较什么\n\n一个产品可能同时包含模型、检索、工具和界面。某次表现改善，可能来自更强模型，也可能因为资料更完整、工具接通或流程更合理。比较时应尽量保持条件一致；若比较的是整套产品，就明确评价整套方案，不把成绩全部归给模型。\n\n任务还需要分类。文字整理、复杂推理、图像识别、程序生成和工具选择，错误方式不同。没有必要期待一个配置在所有任务里最优。\n\n## 建立小而有代表性的任务集\n\n假设企业准备选择整理订货消息的模型，可以先把“怎样才算整理正确”写在消息旁边，再让候选模型处理同样材料：\n\n| 客户消息示意 | 正确结果应保留什么 | 怎样判断 |\n| --- | --- | --- |\n| “这次两套，明年可能再加一套” | 本次两套，明年一套列意向 | 检查是否把未来意向加进本单 |\n| “颜色沿用上次” | 需要查对应历史，当前颜色待确认 | 检查是否编出颜色或引用错客户 |\n| “先别下单，等我确认” | 暂不下单，等待客户确认 | 检查是否保留否定与条件 |\n\n对照结果后，再记录每种配置的处理时间、人工修改和费用。这样，选择依据就落在同一类真实工作上。模型名称和演示印象可以帮助提出候选，采用决定则由这些比较结果支持。\n\n从实际工作选取标准输入、缺项、歧义、否定、变更和异常。保留原始材料、预期结果与判断依据。涉及客户或员工资料时按企业相应规则处理，避免为测试随意扩大数据范围。\n\n| 任务类别 | 评价重点 | 检查办法 |\n| --- | --- | --- |\n| 字段提取 | 关键字段、否定和状态 | 对照原始片段与采用规则 |\n| 研究与分析 | 依据、口径和推导 | 查回材料，复算，比较其他解释 |\n| 内容创作 | 事实、用途与连贯 | 按实际读者任务打开成品检查 |\n| 工具执行 | 对象、参数与执行结果 | 读回记录，由接收方继续 |\n| 长任务 | 完整结果与恢复 | 暂停后继续，修改条件后重做受影响部分 |\n\n样本不只覆盖最常见情况，也要包含后果严重的错误。但人为挑选的小集合，不适合直接当总体成功率。它帮助发现缺陷并比较候选，后续还需要受控试用观察日常分布。\n\n## 不同错误不能简单平均\n\n把客户意向写成承诺，比内部标签略有偏差后果更大。总分相同的两个配置，可能一个偶尔措辞不佳，另一个偶尔归错客户。企业应先规定不可接受的错误和必须交人的情况，再比较一般质量。\n\n质量判断可以组合几种依据：关键字段对照原材料，计算由程序重算，执行核对系统记录，专业结论由对应人员评价。模型自评可作辅助信息，最终采用上述可检查的结果。\n\n## 算完整任务成本\n\n单次调用便宜，不代表整项工作便宜。重试、检索、代码执行、子任务、人工复核和维护都应计入。响应较慢也未必坏，复杂经营分析可以等待，客户现场操作则可能需要更快反馈。\n\n可以采用分层配置：简单整理使用适当的轻量能力，遇到复杂推理再升级；确定性计算交给程序，知识查询按需进行。升级条件应能观察，例如资料冲突、必要字段缺失或任务类型变化，不能只靠模型自己说“这题很难”。\n\n## 版本更新怎样管理\n\n模型、提示、工具和资料任何一项变化，都可能改变表现。更新前复测核心任务和历史失败，受控观察后再扩大。记录当时使用的配置，才能在问题发生时还原条件。\n\n企业不需要为每次小改做庞大测试，但涉及关键承诺、权限或写入的变化，应有相应验证。选择的目标是获得适合企业的能力组合，并知道何时需要重新判断。\n"},{"id":"c18","file":"18-从经营结果诊断改造机会.md","title":"第18章｜从经营结果诊断改造机会","html":"\u003ch1>第18章｜从经营结果诊断改造机会\u003c/h1>\n\u003cp>\u003cstrong>诊断从经营结果追到具体原因，再选择能够改变原因的做法。它把“想用AI”的方向，变成一项可以投入、实施和检验的改造。\u003c/strong>\u003c/p>\n\u003cp>企业可能说“销售效率低”“员工不会用知识”“方案制作太慢”。这些描述包含真实困扰，但还不足以决定建设什么。需要沿经营结果、业务路径、能力条件和组织安排逐层查下去。\u003c/p>\n\u003cp>例如销售响应慢，可能是写回复慢，也可能是价格不统一、客户条件不全、技术确认排队，或者企业根本没有可交付资源。这些原因可以同时存在，解决方式却不同。\u003c/p>\n\u003ch2>从一笔任务看见实际过程\u003c/h2>\n\u003cp>挑选几笔近期任务，包含正常完成、返工和没有完成的。查看原始输入、处理记录、等待和交接，不只听负责人概括。访谈可以解释做法，实际记录帮助发现遗漏与不一致。\u003c/p>\n\u003cp>以客户询问一项定制服务为例，销售先整理要求，技术人员确认是否能做，销售补问遗漏条件，再请负责人批准特殊价格，最后形成方案。假设这笔工作的教学记录如下：整理材料20分钟，等待专业确认3小时，补充信息30分钟，等待批准2小时，形成最终文件10分钟。全程6小时，实际处理1小时，等待5小时。将最后10分钟压缩到2分钟，周期只减少8分钟，不能解释为整体效率提升80%。\u003c/p>\n\u003cp>这组时间说明，优先查看等待可能更有价值。若等待来自资料缺项，就改善收集与识别；若完整资料仍排队，就看确认责任和资源；若批准反复使用同样规则，可以讨论把部分决定交给业务负责人。不同原因对应不同改法。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"18\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4b e-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>层次\u003c/th>\n\u003cth>主要问题\u003c/th>\n\u003cth>值得看的证据\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>经营结果\u003c/td>\n\u003ctd>哪项结果不理想，影响多大\u003c/td>\n\u003ctd>周期、质量、成本、收入与客户后果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>业务路径\u003c/td>\n\u003ctd>结果经过哪些处理和交接\u003c/td>\n\u003ctd>原始任务、实际动作、等待、返工\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>能力条件\u003c/td>\n\u003ctd>缺信息、方法、工具还是资源\u003c/td>\n\u003ctd>输入质量、规则、实际系统能力与操作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>组织安排\u003c/td>\n\u003ctd>谁负责、有无时间和授权\u003c/td>\n\u003ctd>接收方式、考核、例外决定与维护责任\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>四层解释应当连起来。例如缩短客户响应，需要减少专业确认前的退回；退回源于现场条件缺失；解决办法是在需求进入时提示缺项，由专业负责人维护必要条件。经营目标、工作变化、AI能力与责任安排，由此形成同一个方案。\u003c/p>\n\u003ch2>区分观察、解释与建议\u003c/h2>\n\u003cp>“抽取的任务中，多次因缺少现场条件退回”是观察。“缺少前置检查导致返工”是解释。“增加 AI 缺项识别”是建议。三者应分别写，否则团队容易把建议当成已经被证明的原因。\u003c/p>\n\u003cp>解释还需要竞争版本。退回可能因为上游不知道要什么，也可能因为下游每次要求不同，或客户暂时无法提供。如果主要原因是规则不一致，单纯要求上游填更多字段可能只会扩大负担。\u003c/p>\n\u003cp>可以先明确必要材料并提供缺项提示，观察同类任务退回是否减少，再看资料齐备后的等待。若退回减少、周期仍长，说明下一步应处理确认排队。诊断在试验后继续更新，逐步找到最值得改变的环节。\u003c/p>\n\u003ch2>识别AI适配的原因\u003c/h2>\n\u003cp>AI较可能改善的环节，包括非标准信息理解、资料关联、候选分析、内容与程序生成。固定计算和字段校验通常更适合程序；物理产能、资金、客户真实需求和利益冲突则需要相应经营安排。\u003c/p>\n\u003cp>某项改造可以混合这些方式。统一规则靠业务决定，整理杂乱输入靠模型，金额计算靠程序，资源承诺由有权人员确认。判断改造价值时，不必要求所有价值都来自AI，重要的是用合理方式改善结果。\u003c/p>\n\u003cp>专业工作也可以这样拆开。专家用于搜索资料、比较案例、初步分析和表达结论的时间，可能由AI协助减少；专家集中处理影响结果的关键差异。沿实际任务逐项试，就能找到既发挥专业经验、又扩大服务能力的组合。\u003c/p>\n\u003ch2>一份诊断应该交出什么\u003c/h2>\n\u003cp>有用的诊断应明确目标结果、当前路径、主要限制及证据、仍有争议的解释、可选办法和首轮验证。对未知数量、成本和原因写明未知，安排最小核实，不用整齐数字填空。\u003c/p>\n\u003cp>决策者据此决定为什么先做这里、安排谁参与、第一轮投入验证什么。诊断的交付物应把原因、备选办法和首轮工作放在一起，使团队可以从解释进入行动。\u003c/p>\n","text":"# 第18章｜从经营结果诊断改造机会\n\n**诊断从经营结果追到具体原因，再选择能够改变原因的做法。它把“想用AI”的方向，变成一项可以投入、实施和检验的改造。**\n\n企业可能说“销售效率低”“员工不会用知识”“方案制作太慢”。这些描述包含真实困扰，但还不足以决定建设什么。需要沿经营结果、业务路径、能力条件和组织安排逐层查下去。\n\n例如销售响应慢，可能是写回复慢，也可能是价格不统一、客户条件不全、技术确认排队，或者企业根本没有可交付资源。这些原因可以同时存在，解决方式却不同。\n\n## 从一笔任务看见实际过程\n\n挑选几笔近期任务，包含正常完成、返工和没有完成的。查看原始输入、处理记录、等待和交接，不只听负责人概括。访谈可以解释做法，实际记录帮助发现遗漏与不一致。\n\n以客户询问一项定制服务为例，销售先整理要求，技术人员确认是否能做，销售补问遗漏条件，再请负责人批准特殊价格，最后形成方案。假设这笔工作的教学记录如下：整理材料20分钟，等待专业确认3小时，补充信息30分钟，等待批准2小时，形成最终文件10分钟。全程6小时，实际处理1小时，等待5小时。将最后10分钟压缩到2分钟，周期只减少8分钟，不能解释为整体效率提升80%。\n\n这组时间说明，优先查看等待可能更有价值。若等待来自资料缺项，就改善收集与识别；若完整资料仍排队，就看确认责任和资源；若批准反复使用同样规则，可以讨论把部分决定交给业务负责人。不同原因对应不同改法。\n\n![假设工作全程360分钟，其中等待300分钟；文件生成减少8分钟，使全程变为352分钟。](assets/18.svg)\n\n## 四层诊断怎样连起来\n\n| 层次 | 主要问题 | 值得看的证据 |\n| --- | --- | --- |\n| 经营结果 | 哪项结果不理想，影响多大 | 周期、质量、成本、收入与客户后果 |\n| 业务路径 | 结果经过哪些处理和交接 | 原始任务、实际动作、等待、返工 |\n| 能力条件 | 缺信息、方法、工具还是资源 | 输入质量、规则、实际系统能力与操作 |\n| 组织安排 | 谁负责、有无时间和授权 | 接收方式、考核、例外决定与维护责任 |\n\n四层解释应当连起来。例如缩短客户响应，需要减少专业确认前的退回；退回源于现场条件缺失；解决办法是在需求进入时提示缺项，由专业负责人维护必要条件。经营目标、工作变化、AI能力与责任安排，由此形成同一个方案。\n\n## 区分观察、解释与建议\n\n“抽取的任务中，多次因缺少现场条件退回”是观察。“缺少前置检查导致返工”是解释。“增加 AI 缺项识别”是建议。三者应分别写，否则团队容易把建议当成已经被证明的原因。\n\n解释还需要竞争版本。退回可能因为上游不知道要什么，也可能因为下游每次要求不同，或客户暂时无法提供。如果主要原因是规则不一致，单纯要求上游填更多字段可能只会扩大负担。\n\n可以先明确必要材料并提供缺项提示，观察同类任务退回是否减少，再看资料齐备后的等待。若退回减少、周期仍长，说明下一步应处理确认排队。诊断在试验后继续更新，逐步找到最值得改变的环节。\n\n## 识别AI适配的原因\n\nAI较可能改善的环节，包括非标准信息理解、资料关联、候选分析、内容与程序生成。固定计算和字段校验通常更适合程序；物理产能、资金、客户真实需求和利益冲突则需要相应经营安排。\n\n某项改造可以混合这些方式。统一规则靠业务决定，整理杂乱输入靠模型，金额计算靠程序，资源承诺由有权人员确认。判断改造价值时，不必要求所有价值都来自AI，重要的是用合理方式改善结果。\n\n专业工作也可以这样拆开。专家用于搜索资料、比较案例、初步分析和表达结论的时间，可能由AI协助减少；专家集中处理影响结果的关键差异。沿实际任务逐项试，就能找到既发挥专业经验、又扩大服务能力的组合。\n\n## 一份诊断应该交出什么\n\n有用的诊断应明确目标结果、当前路径、主要限制及证据、仍有争议的解释、可选办法和首轮验证。对未知数量、成本和原因写明未知，安排最小核实，不用整齐数字填空。\n\n决策者据此决定为什么先做这里、安排谁参与、第一轮投入验证什么。诊断的交付物应把原因、备选办法和首轮工作放在一起，使团队可以从解释进入行动。"},{"id":"c19","file":"19-怎样选择场景并管理试点组合.md","title":"第19章｜怎样选择场景并管理试点组合","html":"\u003ch1>第19章｜怎样选择场景并管理试点组合\u003c/h1>\n\u003cp>\u003cstrong>首个场景宜选择重要、能形成有用结果、又能在当前条件下检验的一类工作。范围确定得好，企业既能得到实际改善，也能看清下一轮该投入什么。\u003c/strong>\u003c/p>\n\u003cp>企业常在两种极端之间摇摆：一开始就希望重做全部业务，或者挑一个无关紧要的小工具快速展示。前者难以定位失败，后者即使成功也无法支持经营决定。试点需要在价值与可验证性之间取得合适范围。\u003c/p>\n\u003ch2>先把场景写成一次工作\u003c/h2>\n\u003cp>“AI销售”是方向，“客户提出需求后，形成经过必要确认、可由销售发送的方案”才开始成为场景。它说明触发、输入、终点和使用者。进一步要限定客户类型、产品范围、输入形式和例外，才能确定首轮建设。\u003c/p>\n\u003cp>小范围可以只覆盖标准服务，但应做到一个明确交出点：专业人员收到足以判断的材料，或销售拿到经过必要确认的方案。后续发送、签约和履约继续由既有岗位承担。这样，首轮范围虽小，仍能被真正使用。\u003c/p>\n\u003ch2>用五类问题比较机会\u003c/h2>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>比较维度\u003c/th>\n\u003cth>需要回答的问题\u003c/th>\n\u003cth>对选择的影响\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>经营重要性\u003c/td>\n\u003ctd>影响哪项结果，改善是否被需要\u003c/td>\n\u003ctd>决定投入优先级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>主要原因\u003c/td>\n\u003ctd>哪段工作限制结果，有什么依据\u003c/td>\n\u003ctd>决定改造位置\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AI适配\u003c/td>\n\u003ctd>哪项能力能够改变该步骤\u003c/td>\n\u003ctd>决定采用模型、程序或人员\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>当前条件\u003c/td>\n\u003ctd>资料、权限、人员和系统怎样取得\u003c/td>\n\u003ctd>决定先补什么、怎样实现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>检验成本\u003c/td>\n\u003ctd>多久能获得可用结果，怎样检查\u003c/td>\n\u003ctd>决定首轮范围和资源\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>评分可以帮助会议讨论，但分值只是把假设显式化，并非成功概率。若两个场景分数接近，应该看差异来自什么未知，能否先花很小成本核实，而不是争论小数点。\u003c/p>\n\u003ch2>一个候选工作可以有多种方案\u003c/h2>\n\u003cp>以服务需求整理为例，可以先统一表单与规则，也可以在表单上加入AI处理自由表达，还可以进一步接入业务系统完成后续分配。三种方案的价值、成本和依赖不同。\u003c/p>\n\u003cp>如果客户输入本来就能标准化，表单已解决主要缺项，加入AI反而增加核对，第一种就可能足够。若输入来自多种消息，模型整理能明显减少人工搬运，第二种值得试。只有下游确实需要自动接续、且连接条件成立，才进一步评估第三种。\u003c/p>\n\u003cp>比较这些路径，能看出每增加一层建设，换来什么额外价值。企业可以先选最值得的组合，保留将来扩展的接口与方法，再根据使用结果增加能力。\u003c/p>\n\u003ch2>怎样安排试点组合\u003c/h2>\n\u003cp>企业可以把候选分成近期可试、需先补条件和暂不投入。近期试点不宜过多，因为业务骨干、技术和管理注意力常是同一批资源。每项都启动，可能使每项都得不到足够反馈。\u003c/p>\n\u003cp>组合里可以有改善现有工作的项目，也可以有探索新服务的项目。前者以当前成本和质量为基线，后者先看客户是否使用、交付是否成立。分别设置评价问题，能使不同项目得到适合的管理，而共同争取的业务骨干与实施资源仍需统一安排。\u003c/p>\n\u003cp>共用资料与组件可以降低成本，但复用最多的场景不一定最重要。如果当前主要问题是获客不足，即使售后最容易接入已有系统，也不应仅为复用而优先投入。经营瓶颈仍是选择依据。\u003c/p>\n\u003ch2>提前说明扩大、调整与停止条件\u003c/h2>\n\u003cp>试点开始时可以约定几种后续决定：交出物合格、下游能接续，就进入日常试用；资料规则需要补齐，就先组织业务确认；平台条件限制实现，就换连接方式或缩小范围；服务被采用且经济性成立，再投入下一阶段。这些决定使阶段成果有明确去处。\u003c/p>\n\u003cp>停止并不意味着所有投入归零。有效知识、失败样例和已确认接口条件都可以留下，供后续工作使用。但这些资产是否值得继续维护，也要另作判断，不能仅因已经投入就继续扩建。\u003c/p>\n\u003cp>试点的成果应是一项更清楚的经营决定：继续投什么、为什么，以及还要承担哪些未知。\u003c/p>\n","text":"# 第19章｜怎样选择场景并管理试点组合\n\n**首个场景宜选择重要、能形成有用结果、又能在当前条件下检验的一类工作。范围确定得好，企业既能得到实际改善，也能看清下一轮该投入什么。**\n\n企业常在两种极端之间摇摆：一开始就希望重做全部业务，或者挑一个无关紧要的小工具快速展示。前者难以定位失败，后者即使成功也无法支持经营决定。试点需要在价值与可验证性之间取得合适范围。\n\n## 先把场景写成一次工作\n\n“AI销售”是方向，“客户提出需求后，形成经过必要确认、可由销售发送的方案”才开始成为场景。它说明触发、输入、终点和使用者。进一步要限定客户类型、产品范围、输入形式和例外，才能确定首轮建设。\n\n小范围可以只覆盖标准服务，但应做到一个明确交出点：专业人员收到足以判断的材料，或销售拿到经过必要确认的方案。后续发送、签约和履约继续由既有岗位承担。这样，首轮范围虽小，仍能被真正使用。\n\n## 用五类问题比较机会\n\n| 比较维度 | 需要回答的问题 | 对选择的影响 |\n| --- | --- | --- |\n| 经营重要性 | 影响哪项结果，改善是否被需要 | 决定投入优先级 |\n| 主要原因 | 哪段工作限制结果，有什么依据 | 决定改造位置 |\n| AI适配 | 哪项能力能够改变该步骤 | 决定采用模型、程序或人员 |\n| 当前条件 | 资料、权限、人员和系统怎样取得 | 决定先补什么、怎样实现 |\n| 检验成本 | 多久能获得可用结果，怎样检查 | 决定首轮范围和资源 |\n\n评分可以帮助会议讨论，但分值只是把假设显式化，并非成功概率。若两个场景分数接近，应该看差异来自什么未知，能否先花很小成本核实，而不是争论小数点。\n\n## 一个候选工作可以有多种方案\n\n以服务需求整理为例，可以先统一表单与规则，也可以在表单上加入AI处理自由表达，还可以进一步接入业务系统完成后续分配。三种方案的价值、成本和依赖不同。\n\n如果客户输入本来就能标准化，表单已解决主要缺项，加入AI反而增加核对，第一种就可能足够。若输入来自多种消息，模型整理能明显减少人工搬运，第二种值得试。只有下游确实需要自动接续、且连接条件成立，才进一步评估第三种。\n\n比较这些路径，能看出每增加一层建设，换来什么额外价值。企业可以先选最值得的组合，保留将来扩展的接口与方法，再根据使用结果增加能力。\n\n## 怎样安排试点组合\n\n企业可以把候选分成近期可试、需先补条件和暂不投入。近期试点不宜过多，因为业务骨干、技术和管理注意力常是同一批资源。每项都启动，可能使每项都得不到足够反馈。\n\n组合里可以有改善现有工作的项目，也可以有探索新服务的项目。前者以当前成本和质量为基线，后者先看客户是否使用、交付是否成立。分别设置评价问题，能使不同项目得到适合的管理，而共同争取的业务骨干与实施资源仍需统一安排。\n\n共用资料与组件可以降低成本，但复用最多的场景不一定最重要。如果当前主要问题是获客不足，即使售后最容易接入已有系统，也不应仅为复用而优先投入。经营瓶颈仍是选择依据。\n\n## 提前说明扩大、调整与停止条件\n\n试点开始时可以约定几种后续决定：交出物合格、下游能接续，就进入日常试用；资料规则需要补齐，就先组织业务确认；平台条件限制实现，就换连接方式或缩小范围；服务被采用且经济性成立，再投入下一阶段。这些决定使阶段成果有明确去处。\n\n停止并不意味着所有投入归零。有效知识、失败样例和已确认接口条件都可以留下，供后续工作使用。但这些资产是否值得继续维护，也要另作判断，不能仅因已经投入就继续扩建。\n\n试点的成果应是一项更清楚的经营决定：继续投什么、为什么，以及还要承担哪些未知。\n"},{"id":"c20","file":"20-重设计流程分工与授权.md","title":"第20章｜重设计流程、分工与授权","html":"\u003ch1>第20章｜重设计流程、分工与授权\u003c/h1>\n\u003cp>\u003cstrong>AI进入流程后，应把各项判断与动作重新分配给人、模型和程序，让下一岗位更容易接手，并撤去已被替代的旧工作。\u003c/strong>\u003c/p>\n\u003cp>原有工作中，熟练员工常把信息收集、专业判断、计算、协调和表达混在一起完成。AI可以承担其中部分动作，但拆开以后必须重新连接，否则容易出现“每一步都有人做，整件事却没人负责”。\u003c/p>\n\u003ch2>从交出物反推责任\u003c/h2>\n\u003cp>先明确下一位接手者需要什么。专业人员确认服务范围，需要客户要求、设备条件和未决项；批准人需要最终内容、计算依据与特殊安排。设计交接时，把这些信息组织在一起，让对方能直接开始自己的判断。\u003c/p>\n\u003cp>可以把它与给家人订一桌饭作对照。负责联系餐厅的人先问清人数和忌口，把菜单与价格交给付款的人确认，再通知餐厅准备。传递“已经同意”时，要带上同意的是哪份菜单；后来增加一道菜，需要重新确认变化的费用。每次交接都有具体内容，对方才能继续。\u003c/p>\n\u003cp>企业安排设备安装也一样。销售交出客户、设备和现场条件；AI帮助整理并标出缺项；专业人员确认能否安装；程序按已确认的项目计算费用；有权负责人查看这份具体方案，决定是否采用特殊安排。销售发送后，把客户答复记回同一项工作，排班人员据已确认条件安排人员。每一位接手者都应看到前一步确认了什么、还留下什么问题。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"20\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iOTA0IiB2aWV3Qm94PSIwIDAgMzYwIDkwNCIgcm9sZT0iaW1nIj48dGl0bGU+5a6J6KOF5pa55qGI5oCO5qC36YCQ5q2l5a6M5oiQPC90aXRsZT48ZGVzYz7pnIDmsYLjgIHkuJPkuJrliKTmlq3jgIHotLnnlKjlkozmibnlh4blvaLmiJDlj6/lj5HpgIHmlrnmoYjvvIzlrqLmiLfnoa7orqTlkI7mjpLnj63nu6fnu63vvJvkuqTmjqXluKblhbfkvZPlhoXlrrnjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYSIgbWFya2VyV2lkdGg9IjgiIG1hcmtlckhlaWdodD0iOCIgcmVmWD0iNyIgcmVmWT0iNCIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwIEw4IDQgTDAgOCBaIiBmaWxsPSIjMjQ2YTU1Ii8+PC9tYXJrZXI+PC9kZWZzPjxyZWN0IHdpZHRoPSIzNjAiIGhlaWdodD0iOTA0IiBmaWxsPSJ3aGl0ZSIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiI+PHRleHQgeD0iMjQiIHk9IjM4IiBmb250LXNpemU9IjI0IiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNjAwIj7lronoo4XmlrnmoYjmgI7moLfpgJDmraXlrozmiJA8L3RleHQ+PHRleHQgeD0iMjQiIHk9IjcxIiBmb250LXNpemU9IjE4IiBmaWxsPSIjNjE3MTZiIiBmb250LXdlaWdodD0iNDAwIj7npLrmhI/vvJrmr4/kvY3mjqXmiYvogIXlvpfliLDlhbfkvZPmnZDmlpk8L3RleHQ+PHJlY3QgeD0iMjQiIHk9IjEyNCIgd2lkdGg9IjMxMiIgaGVpZ2h0PSIxNDIiIHJ4PSI4IiBmaWxsPSIjZWRmMmY4IiBzdHJva2U9IiNkNWUwZGEiIHN0cm9rZS13aWR0aD0iMS40Ii8+PHRleHQgeD0iNDAiIHk9IjE1NCIgZm9udC1zaXplPSIyMSIgZmlsbD0iIzI0NmE1NSIgZm9udC13ZWlnaHQ9IjYwMCI+6ZSA5ZSuICsgQUnvvJrpnIDmsYLorrDlvZ ，按风险抽查或复核\u003c/td>\n\u003ctd>原始依据、未知与纠错入口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>固定金额计算\u003c/td>\n\u003ctd>程序\u003c/td>\n\u003ctd>当前规则、参数与舍入方式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>专业适配判断\u003c/td>\n\u003ctd>具备能力的人员，AI协助\u003c/td>\n\u003ctd>材料充分、判断标准与责任\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>常规低影响更新\u003c/td>\n\u003ctd>在受限条件下自动执行\u003c/td>\n\u003ctd>身份、范围、可追查及异常接手\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>重要承诺和例外\u003c/td>\n\u003ctd>有权负责人决定\u003c/td>\n\u003ctd>最终内容、版本、影响与批准记录\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>分工可以随着能力和经验变化调整。先让AI整理材料、人员逐项核对，经过足够同类任务观察后，可以把稳定低影响部分转为抽查，让专业人员集中处理差异与例外。调整时同步改变工具范围、检查方法和接手安排。\u003c/p>\n\u003ch2>人工复核怎样才有作用\u003c/h2>\n\u003cp>复核人需要有能力、依据和时间。让员工一天批准大量看不见原始资料的结果，人工参与很可能退化为机械点击。应突出真正需要判断的差异、依据与未决项，减少重复阅读。\u003c/p>\n\u003cp>不同错误需要不同检查。数量与身份可以对照原始记录，金额可由程序重算，专业结论需要专业依据。复核也应能退回并指出原因，让错误进入方法改进，而不是由每个人私下修好后消失。\u003c/p>\n\u003cp>复核负担高时，先查看核对方式是否合适。若员工每次都要翻完整原文，可以让结果直接关联依据位置；若每个字段都要求同样强度审查，可以集中处理影响数量、费用和承诺的关键项。仍需大量专业重做的部分，则保留人工主导。\u003c/p>\n\u003ch2>批准必须对应具体内容\u003c/h2>\n\u003cp>批准了一个草稿，之后数量、价格或履约条件改变，原批准是否仍有效，需要明确规则。重要改动通常应重新检查受影响部分，而不是只保留一个“已批准”状态。\u003c/p>\n\u003cp>写入或发送时，系统把待提交的内容版本与批准记录核对。版本相同即可继续；内容改变则重新检查受影响部分。这样，批准人的判断与最终执行保持对应，也能处理批准后他人修改的情况。\u003c/p>\n\u003ch2>例外应该去哪儿\u003c/h2>\n\u003cp>流程要为资料缺失、规则冲突、工具失败和结果未知安排不同路径。能补资料的由相应人员补；需要政策决定的升级负责人；系统故障时采用既定人工方式，并标记以后补录；执行结果未知时先核实，避免重复动作。\u003c/p>\n\u003cp>运行时记录例外原因，可以继续改进流程。同类缺项反复发生，就改输入说明；某条规则频繁引起争议，就交负责人澄清；故障接手耗时，就改善状态展示。例外路径也成为组织学习的入口。\u003c/p>\n\u003ch2>删除旧工作，才可能释放时间\u003c/h2>\n\u003cp>新系统如果要求员工先填新表、再发原来的聊天消息、最后维护旧报表，AI节省的几分钟可能被新增管理消耗。上线前应逐项明确哪些旧动作停止，什么记录成为正式入口，谁负责与上下游一致。\u003c/p>\n\u003cp>评价时沿完整工作计算。上游与下游的处理、等待和核对都进入同一本账，团队才有动力共同优化交接。业务负责人负责维护这条完整路径，下一章将进一步解释不同系统怎样支持它。\u003c/p>\n","text":"# 第20章｜重设计流程、分工与授权\n\n**AI进入流程后，应把各项判断与动作重新分配给人、模型和程序，让下一岗位更容易接手，并撤去已被替代的旧工作。**\n\n原有工作中，熟练员工常把信息收集、专业判断、计算、协调和表达混在一起完成。AI可以承担其中部分动作，但拆开以后必须重新连接，否则容易出现“每一步都有人做，整件事却没人负责”。\n\n## 从交出物反推责任\n\n先明确下一位接手者需要什么。专业人员确认服务范围，需要客户要求、设备条件和未决项；批准人需要最终内容、计算依据与特殊安排。设计交接时，把这些信息组织在一起，让对方能直接开始自己的判断。\n\n可以把它与给家人订一桌饭作对照。负责联系餐厅的人先问清人数和忌口，把菜单与价格交给付款的人确认，再通知餐厅准备。传递“已经同意”时，要带上同意的是哪份菜单；后来增加一道菜，需要重新确认变化的费用。每次交接都有具体内容，对方才能继续。\n\n企业安排设备安装也一样。销售交出客户、设备和现场条件；AI帮助整理并标出缺项；专业人员确认能否安装；程序按已确认的项目计算费用；有权负责人查看这份具体方案，决定是否采用特殊安排。销售发送后，把客户答复记回同一项工作，排班人员据已确认条件安排人员。每一位接手者都应看到前一步确认了什么、还留下什么问题。\n\n![安装要求经过销售与AI整理、专业确认、程序计算和负责人批准，成为可发送的方案；客户答复回到原工作，供排班继续。](assets/20.svg)\n\n## 人机分工为什么要按后果区分\n\nAI可以帮助解释非标准输入、提出追问、比较方案和起草内容。固定规则检查与计算适合程序执行；专业事实和特殊例外则由对应责任人判断。某些低影响动作可自动完成，另一些涉及客户承诺、资源占用或费用，应按企业授权处理。\n\n| 决策或动作 | 可考虑的承担方式 | 必须明确的条件 |\n| --- | --- | --- |\n| 输入整理与主题归类 | 模型处理，按风险抽查或复核 | 原始依据、未知与纠错入口 |\n| 固定金额计算 | 程序 | 当前规则、参数与舍入方式 |\n| 专业适配判断 | 具备能力的人员，AI协助 | 材料充分、判断标准与责任 |\n| 常规低影响更新 | 在受限条件下自动执行 | 身份、范围、可追查及异常接手 |\n| 重要承诺和例外 | 有权负责人决定 | 最终内容、版本、影响与批准记录 |\n\n分工可以随着能力和经验变化调整。先让AI整理材料、人员逐项核对，经过足够同类任务观察后，可以把稳定低影响部分转为抽查，让专业人员集中处理差异与例外。调整时同步改变工具范围、检查方法和接手安排。\n\n## 人工复核怎样才有作用\n\n复核人需要有能力、依据和时间。让员工一天批准大量看不见原始资料的结果，人工参与很可能退化为机械点击。应突出真正需要判断的差异、依据与未决项，减少重复阅读。\n\n不同错误需要不同检查。数量与身份可以对照原始记录，金额可由程序重算，专业结论需要专业依据。复核也应能退回并指出原因，让错误进入方法改进，而不是由每个人私下修好后消失。\n\n复核负担高时，先查看核对方式是否合适。若员工每次都要翻完整原文，可以让结果直接关联依据位置；若每个字段都要求同样强度审查，可以集中处理影响数量、费用和承诺的关键项。仍需大量专业重做的部分，则保留人工主导。\n\n## 批准必须对应具体内容\n\n批准了一个草稿，之后数量、价格或履约条件改变，原批准是否仍有效，需要明确规则。重要改动通常应重新检查受影响部分，而不是只保留一个“已批准”状态。\n\n写入或发送时，系统把待提交的内容版本与批准记录核对。版本相同即可继续；内容改变则重新检查受影响部分。这样，批准人的判断与最终执行保持对应，也能处理批准后他人修改的情况。\n\n## 例外应该去哪儿\n\n流程要为资料缺失、规则冲突、工具失败和结果未知安排不同路径。能补资料的由相应人员补；需要政策决定的升级负责人；系统故障时采用既定人工方式，并标记以后补录；执行结果未知时先核实，避免重复动作。\n\n运行时记录例外原因，可以继续改进流程。同类缺项反复发生，就改输入说明；某条规则频繁引起争议，就交负责人澄清；故障接手耗时，就改善状态展示。例外路径也成为组织学习的入口。\n\n## 删除旧工作，才可能释放时间\n\n新系统如果要求员工先填新表、再发原来的聊天消息、最后维护旧报表，AI节省的几分钟可能被新增管理消耗。上线前应逐项明确哪些旧动作停止，什么记录成为正式入口，谁负责与上下游一致。\n\n评价时沿完整工作计算。上游与下游的处理、等待和核对都进入同一本账，团队才有动力共同优化交接。业务负责人负责维护这条完整路径，下一章将进一步解释不同系统怎样支持它。"},{"id":"c21","file":"21-系统集成数据与共同事实.md","title":"第21章｜系统集成、数据与共同事实","html":"\u003ch1>第21章｜系统集成、数据与共同事实\u003c/h1>\n\u003cp>\u003cstrong>系统集成让不同岗位围绕同一个客户、订单或任务使用一致的信息。AI能够查到业务事实、写回处理结果，工作就能从一个入口接续到另一个入口。\u003c/strong>\u003c/p>\n\u003cp>企业通常已经有客户、订单、财务、排班或协作系统。AI应用进入后，应明确哪些数据从哪里读，哪些动作写回哪里，哪些系统继续作为正式记录。否则一个新工作台可能让信息更加分散。\u003c/p>\n\u003ch2>同一对象怎样被识别\u003c/h2>\n\u003cp>客户名称可能重复，联系人可能更换，一位客户可能拥有多台设备。仅按名字或手机号关联，容易把记录归错。应尽量采用稳定标识，并保存系统之间的对应关系。\u003c/p>\n\u003cp>寄给同一个人的两件包裹，收件姓名相同，运单号却不同。查物流时按运单号查，才知道哪一件已经签收、哪一件仍在途中。企业客户也可能有多笔订单和多台设备，需要分清当前到底处理哪一笔。\u003c/p>\n\u003cp>例如同一客户买了设备甲和设备乙，本次报修的是乙。受理人员先核对乙的设备序列号，或企业分配的唯一设备编号；服务系统建立申请时，保存这个设备编号。企业维护的对应记录说明乙属于哪笔订单、这笔订单属于哪个客户。应用沿这些对应关系查订单、服务资格和维修历史，才会取得乙的材料。界面仍显示客户名称和设备名称，编号在记录之间帮助保持对应。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"21\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iMTAxNSIgdmlld0JveD0iMCAwIDM2MCAxMDE1IiByb2xlPSJpbWciPjx0aXRsZT7lkIzkuIDlrqLmiLfnmoTkuKTlj7Dorr7lpIc8L3RpdGxlPjxkZXNjPuWuouaIt+aLpeacieeUsuS5meS4pOWPsOiuvuWkh++8jOacrOasoeeUs+ivt+S/neWtmOS5meeahOagh+ivhuW5tuafpeivouS5meeahOiuouWNleWSjOe7tOS/ruWOhuWPsu+8jOmBv+WFjea3t+eUqOeUsueahOiusOW9leOAgjwvZGVzYz48ZGVmcz48bWFya2VyIGlkPSJhIiBtYXJrZXJXaWR0aD0iOCIgbWFya2VySGVpZ2h0PSI4IiByZWZYPSI3IiByZWZZPSI0IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDAgTDggNCBMMCA4IFoiIGZpbGw9IiMyNDZhNTUiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjM2MCIgaGVpZ2h0PSIxMDE1IiBmaWxsPSJ3aGl0ZSIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiI+PHRleHQgeD0iMjQiIHk9IjM4IiBmb250LXNpemU9IjI0IiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNjAwIj7lkIzkuIDlrqLmiLfnmoTkuKTlj7Dorr7lpIc8L3RleHQ+PHRleHQgeD0iMjQiIHk9IjcxIiBmb250LXNpemU9IjE4IiBmaWxsPSIjNjE3MTZiIiBmb250LXdlaWdodD0iNDAwIj7npLrmhI/vvJrov5nmrKHmiqXkv67nmoTmmK/orr7lpIfkuZk8L3RleHQ+PHJlY3QgeD0iMjQiIHk9IjEyNCIgd2lkdGg9IjMxMiIgaGVpZ2h0PSIxMTMiIHJ4PSI4IiBmaWxsPSIjZWRmMmY4IiBzdHJva2U9IiNkNWUwZGEiIHN0cm9rZS13aWR0aD0iMS40Ii8+PHRleHQgeD0iNDAiIHk9IjE1NCIgZm9udC1zaXplPSIyMSIgZmlsbD0iIzI0NmE1NSIgZm9udC13ZWlnaHQ9IjYwMCI+5a6i5oi36K6w5b2VPC90ZXh0PjxwYXRoIGQ9Ik00MCAxNzYgSDMyMCIgc3Ryb2tlPSIjZDVlMGRhIiBzdHJva2Utd2lkdGg9IjIiIGZpbGw9Im5vbmUiLz48dGV4dCB4PSI0MCIgeT0i 哪处记录为准。例如交付状态以订单系统为准，客服笔记只是补充说明。两个系统的编号不同，就保留一份对应表：设备乙在售后系统的编号，对应订单系统中的哪台设备和哪笔订单。这类对应表通常叫“映射表”。\u003c/p>\n\u003ch2>技术接通前要核对的现实条件\u003c/h2>\n\u003cp>先确认企业当前账号、购买版本、接口范围和权限条件，再使用小范围记录实际读写。这些条件决定数据怎样取得、结果怎样保存，也帮助团队及早确定方案中哪些可以直接采用、哪些需要额外安排。\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>核对对象\u003c/th>\n\u003cth>实际操作\u003c/th>\n\u003cth>取得的结果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>身份\u003c/td>\n\u003ctd>用最终使用者角色登录与查询\u003c/td>\n\u003ctd>确定使用身份与操作范围\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数据\u003c/td>\n\u003ctd>查询允许和不允许访问的记录\u003c/td>\n\u003ctd>明确读写条件与限制位置\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>写入\u003c/td>\n\u003ctd>创建后读回，再由接收方打开\u003c/td>\n\u003ctd>确认保存与接手路径\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>平台条件\u003c/td>\n\u003ctd>核当前版本、配置和接口\u003c/td>\n\u003ctd>明确可直接采用的能力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>完整任务\u003c/td>\n\u003ctd>从输入推进到下一岗位继续\u003c/td>\n\u003ctd>确定各项连接如何共同工作\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>这些核实应尽早进行，尤其是它们可能决定方案能否成立时。可以先用低影响测试记录验证，不必等完整界面做完再发现关键权限缺失。\u003c/p>\n\u003ch2>数据变更怎样传播\u003c/h2>\n\u003cp>一个系统更新了客户资料，其他应用可能持有旧副本。需要明确哪些字段实时查、哪些允许缓存，以及同步失败怎样发现。并非每项数据都需要实时一致，但业务使用者应知道延迟限制。\u003c/p>\n\u003cp>“缓存”可以理解为留一份副本方便再用。你把电影院座位图截下来，过一会儿再看截图，画面仍是原来的空位；真正订票要回到售票系统查。企业工作台也可能暂存一份排班，方便展示，但要承诺预约时，需要回到负责排班的系统确认。\u003c/p>\n\u003cp>例如客户改了收货地址，客服先在约定的客户资料系统保存；应用准备生成发货单时，从该系统读取新地址。如果另一个工作台保存了地址副本，实施者需要安排它收到变更通知或定期重新读取，并记录最近更新时间。更新失败时把这份副本标为待更新，发货人员回到正式记录核对，再出单。企业据此明确哪些场合可以用稍旧的副本，哪些动作必须取得当前记录。\u003c/p>\n\u003cp>资源预约可以说明执行时检查的作用。查询时有空位，另一个人可能先完成预约；因此提交时由资源系统再次检查并占用，成功后返回预约记录。内容批准同理：写入端检查当前版本，再接受对应动作。这类保证需要接收系统支持，接入前应确认其能力。\u003c/p>\n\u003cp>例如客服上午查到明天下午有一个时段，正在等客户答复；另一位客服先为别的客户预约成功。第一位客服随后提交时，排班系统发现时段已占用，返回不能预约。应用据此重新查询可选时段，再请客户选择。查看空位只是取得当时的信息，保存成功的预约记录才表明这个时段已经分配给当前客户。\u003c/p>\n\u003ch2>按当前任务整理数据\u003c/h2>\n\u003cp>系统连接会暴露原有数据差异：同一客户有多条记录，字段采用不同含义，旧规则仍在部分入口使用。处理时先确定当前任务依赖哪些对象和字段，再由对应负责人整理。\u003c/p>\n\u003cp>例如先为一个产品范围建立客户、设备和服务申请的关联，明确哪些记录合并、哪些保持分开。试点期间可以采用有维护人的映射表；重复使用增多后，再把稳定关系纳入系统。这样既能推进当前工作，也能让临时安排逐渐转为长期资产。\u003c/p>\n\u003cp>数据治理因此有了业务优先级。先处理影响实际判断和交接的部分，积累方法，再随新场景扩大。\u003c/p>\n\u003ch2>判断集成完成的终点\u003c/h2>\n\u003cp>让实际角色从真实输入开始，完成读取、处理、批准和写入，随后由接手方打开正式记录继续。再试一次无权限、重复提交和内容变更。这样的验证，比“已经接了几个接口”更接近企业需要的结果。\u003c/p>\n\u003cp>集成建设的价值，是让AI可以利用企业事实并在受控条件下行动。它同时要求业务对象清楚、平台条件真实、执行约束有效，以及接手路径存在。\u003c/p>\n","text":"# 第21章｜系统集成、数据与共同事实\n\n**系统集成让不同岗位围绕同一个客户、订单或任务使用一致的信息。AI能够查到业务事实、写回处理结果，工作就能从一个入口接续到另一个入口。**\n\n企业通常已经有客户、订单、财务、排班或协作系统。AI应用进入后，应明确哪些数据从哪里读，哪些动作写回哪里，哪些系统继续作为正式记录。否则一个新工作台可能让信息更加分散。\n\n## 同一对象怎样被识别\n\n客户名称可能重复，联系人可能更换，一位客户可能拥有多台设备。仅按名字或手机号关联，容易把记录归错。应尽量采用稳定标识，并保存系统之间的对应关系。\n\n寄给同一个人的两件包裹，收件姓名相同，运单号却不同。查物流时按运单号查，才知道哪一件已经签收、哪一件仍在途中。企业客户也可能有多笔订单和多台设备，需要分清当前到底处理哪一笔。\n\n例如同一客户买了设备甲和设备乙，本次报修的是乙。受理人员先核对乙的设备序列号，或企业分配的唯一设备编号；服务系统建立申请时，保存这个设备编号。企业维护的对应记录说明乙属于哪笔订单、这笔订单属于哪个客户。应用沿这些对应关系查订单、服务资格和维修历史，才会取得乙的材料。界面仍显示客户名称和设备名称，编号在记录之间帮助保持对应。\n\n![同一客户拥有设备甲和设备乙，本次申请明确指向乙；应用沿设备乙对应的订单和维修记录查询，避免把甲的记录混入。](assets/21.svg)\n\n各类数据可以继续保存在负责它的系统中：订单系统管理订单状态，服务系统管理处理记录，应用根据稳定标识关联查询。权威位置清楚，就能减少在多个地方重复维护同一事实。\n\n这里的“权威位置”是企业约定以哪处记录为准。例如交付状态以订单系统为准，客服笔记只是补充说明。两个系统的编号不同，就保留一份对应表：设备乙在售后系统的编号，对应订单系统中的哪台设备和哪笔订单。这类对应表通常叫“映射表”。\n\n## 技术接通前要核对的现实条件\n\n先确认企业当前账号、购买版本、接口范围和权限条件，再使用小范围记录实际读写。这些条件决定数据怎样取得、结果怎样保存，也帮助团队及早确定方案中哪些可以直接采用、哪些需要额外安排。\n\n| 核对对象 | 实际操作 | 取得的结果 |\n| --- | --- | --- |\n| 身份 | 用最终使用者角色登录与查询 | 确定使用身份与操作范围 |\n| 数据 | 查询允许和不允许访问的记录 | 明确读写条件与限制位置 |\n| 写入 | 创建后读回，再由接收方打开 | 确认保存与接手路径 |\n| 平台条件 | 核当前版本、配置和接口 | 明确可直接采用的能力 |\n| 完整任务 | 从输入推进到下一岗位继续 | 确定各项连接如何共同工作 |\n\n这些核实应尽早进行，尤其是它们可能决定方案能否成立时。可以先用低影响测试记录验证，不必等完整界面做完再发现关键权限缺失。\n\n## 数据变更怎样传播\n\n一个系统更新了客户资料，其他应用可能持有旧副本。需要明确哪些字段实时查、哪些允许缓存，以及同步失败怎样发现。并非每项数据都需要实时一致，但业务使用者应知道延迟限制。\n\n“缓存”可以理解为留一份副本方便再用。你把电影院座位图截下来，过一会儿再看截图，画面仍是原来的空位；真正订票要回到售票系统查。企业工作台也可能暂存一份排班，方便展示，但要承诺预约时，需要回到负责排班的系统确认。\n\n例如客户改了收货地址，客服先在约定的客户资料系统保存；应用准备生成发货单时，从该系统读取新地址。如果另一个工作台保存了地址副本，实施者需要安排它收到变更通知或定期重新读取，并记录最近更新时间。更新失败时把这份副本标为待更新，发货人员回到正式记录核对，再出单。企业据此明确哪些场合可以用稍旧的副本，哪些动作必须取得当前记录。\n\n资源预约可以说明执行时检查的作用。查询时有空位，另一个人可能先完成预约；因此提交时由资源系统再次检查并占用，成功后返回预约记录。内容批准同理：写入端检查当前版本，再接受对应动作。这类保证需要接收系统支持，接入前应确认其能力。\n\n例如客服上午查到明天下午有一个时段，正在等客户答复；另一位客服先为别的客户预约成功。第一位客服随后提交时，排班系统发现时段已占用，返回不能预约。应用据此重新查询可选时段，再请客户选择。查看空位只是取得当时的信息，保存成功的预约记录才表明这个时段已经分配给当前客户。\n\n## 按当前任务整理数据\n\n系统连接会暴露原有数据差异：同一客户有多条记录，字段采用不同含义，旧规则仍在部分入口使用。处理时先确定当前任务依赖哪些对象和字段，再由对应负责人整理。\n\n例如先为一个产品范围建立客户、设备和服务申请的关联，明确哪些记录合并、哪些保持分开。试点期间可以采用有维护人的映射表；重复使用增多后，再把稳定关系纳入系统。这样既能推进当前工作，也能让临时安排逐渐转为长期资产。\n\n数据治理因此有了业务优先级。先处理影响实际判断和交接的部分，积累方法，再随新场景扩大。\n\n## 判断集成完成的终点\n\n让实际角色从真实输入开始，完成读取、处理、批准和写入，随后由接手方打开正式记录继续。再试一次无权限、重复提交和内容变更。这样的验证，比“已经接了几个接口”更接近企业需要的结果。\n\n集成建设的价值，是让AI可以利用企业事实并在受控条件下行动。它同时要求业务对象清楚、平台条件真实、执行约束有效，以及接手路径存在。\n"},{"id":"c22","file":"22-原型评测与业务验收.md","title":"第22章｜原型、评测与业务验收","html":"\u003ch1>第22章｜原型、评测与业务验收\u003c/h1>\n\u003cp>\u003cstrong>验证帮助企业逐步作出采用决定：原型检查关键设想，评测改进任务表现，试用观察日常工作，验收把运行交给企业。\u003c/strong>\u003c/p>\n\u003cp>这些工作回答不同问题。识别是否准确，可以先用材料检验；实际岗位能否接续，要放到流程里操作；投入是否划算，则需要观察时间、质量和维护。按当前最关键的问题安排验证，团队就能把精力用在下一项决定需要的证据上。\u003c/p>\n\u003ch2>原型该证明什么\u003c/h2>\n\u003cp>以客服整理报修为例，首轮先把几条客户消息交给有限版本，看它能否分清设备、现象和缺项；这就是原型。随后换一批消息，逐条对照预期结果，检查缺项、否定和变更怎样处理，这叫评测。再让客服在限定范围内实际使用，记录是否减少整理、是否增加核对，是试用。最后由企业人员独立完成受理与异常接手，明确维护责任，才进入验收。\u003c/p>\n\u003cp>这四种检查围绕同一类工作，逐步回答“关键设想成立吗”“换材料还行吗”“日常是否好用”“企业能接手吗”。\u003c/p>\n\u003cp>首轮可以只验证模型能否从杂乱材料提取必要条件，或新的交接是否让专业人员更容易判断。部分步骤由人完成也可以，但应明确标记，不把后台人工当成自动能力。\u003c/p>\n\u003cp>如果关键问题是识别质量，没必要先建完整平台；如果关键问题是实际权限，不能只做离线演示。原型的范围应由风险和未知决定，而不是由最容易展示的界面决定。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"22\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iODI0IiB2aWV3Qm94PSIwIDAgMzYwIDgyNCIgcm9sZT0iaW1nIj48dGl0bGU+5ZCM5LiA57G75oql5L+u77yM5YiG6Zi25q615qOA5p+lPC90aXRsZT48ZGVzYz7ljp/lnovlhYjor5XlhbPplK7or4bliKvvvIzor4TmtYvmjaLmnZDmlpnmo4Dmn6XvvIzor5XnlKjop4Llr5/ml6XluLjotJ/mi4XvvIzpqozmlL 大查看图22-1\">放大查看\u003c/button>\u003c/figcaption>\u003c/figure>\n\u003ch2>评测要覆盖怎样的错误\u003c/h2>\n\u003cp>准备具有代表性的正常、缺项、否定、歧义、变更与异常任务，写明预期结果和依据。不要只用开发时反复调好的材料；也要保留未参与调整的材料，观察方法是否能够迁移。\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>层次\u003c/th>\n\u003cth>应检验什么\u003c/th>\n\u003cth>典型失败\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>产物\u003c/td>\n\u003ctd>字段、内容、计算与专业要求\u003c/td>\n\u003ctd>格式对但把意向变成确认\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>任务\u003c/td>\n\u003ctd>完整路径、对象、权限和状态\u003c/td>\n\u003ctd>金额更新了，旧批准却仍有效\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>采用\u003c/td>\n\u003ctd>人能否理解、接手并处理例外\u003c/td>\n\u003ctd>实施者不在，员工无法继续\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>价值\u003c/td>\n\u003ctd>全链负担、质量与经营用途\u003c/td>\n\u003ctd>生成快了，但复核与返工增加\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>每项检查确定一个可观察终点：字段与原文一致，保存后读回正确对象，实际角色完成操作，下游人员打开记录继续处理。检查记录保留输入、当时条件和结果，便于修改后复查。\u003c/p>\n\u003ch2>一项修改要怎样复测\u003c/h2>\n\u003cp>假设原测试发现需求变更后仍可沿用旧批准。修复时将批准绑定内容版本。复测先重现原失败，确认修改后会要求重新检查；再测试正常批准仍可使用，以及其他角色不能绕过限制。\u003c/p>\n\u003cp>这称为回归检查：修一个问题时，确认没有破坏原来正确行为。范围按影响选择，不必每次全部重测，也不能只看一张修复后的截图。\u003c/p>\n\u003cp>模型错误也应分类：资料没进入、检索错误、理解错误、规则缺失、工具失败或对象关联错误。分类的作用是决定下一步改哪里，而不是为了让报表更精细。\u003c/p>\n\u003ch2>受控试用怎样安排\u003c/h2>\n\u003cp>限定参与者、任务类型、允许动作和时间范围，保留人工接手。记录完整任务，包括失败、等待、重试和最终没有采用的结果。只统计成功完成的任务，会使系统看起来比实际更好。\u003c/p>\n\u003cp>比较前后时，按任务类型和复杂度分组，并使用相近观察周期。标准输入与复杂输入分别记录，可以看出改进适合哪部分工作。试用材料较少时，先用结果决定下一轮范围，随着实际使用增加再估计整体效果。\u003c/p>\n\u003cp>严重错误即使少见，也应先限制相关能力。是否暂停要看后果、可发现性和补救条件，而不是只看总成功率。\u003c/p>\n\u003ch2>验收意味着企业能接手\u003c/h2>\n\u003cp>业务验收应由相应责任人判断任务能否完成，实施方提供过程和证据。技术人员不能替业务确定专业标准，业务也不能只凭界面感觉评价底层约束。\u003c/p>\n\u003cp>可以安排一名未参与开发的实际使用者独立完成正常任务和常见异常，查看手册、状态和接手是否足够。然后核对企业是否掌握必要入口、数据、配置与维护安排。\u003c/p>\n\u003cp>验收确定当前正式使用的范围、责任和维护方式。团队在这个基础上持续运行，经营者也有了比较下一轮扩展成本与收益的起点。\u003c/p>\n","text":"# 第22章｜原型、评测与业务验收\n\n**验证帮助企业逐步作出采用决定：原型检查关键设想，评测改进任务表现，试用观察日常工作，验收把运行交给企业。**\n\n这些工作回答不同问题。识别是否准确，可以先用材料检验；实际岗位能否接续，要放到流程里操作；投入是否划算，则需要观察时间、质量和维护。按当前最关键的问题安排验证，团队就能把精力用在下一项决定需要的证据上。\n\n## 原型该证明什么\n\n以客服整理报修为例，首轮先把几条客户消息交给有限版本，看它能否分清设备、现象和缺项；这就是原型。随后换一批消息，逐条对照预期结果，检查缺项、否定和变更怎样处理，这叫评测。再让客服在限定范围内实际使用，记录是否减少整理、是否增加核对，是试用。最后由企业人员独立完成受理与异常接手，明确维护责任，才进入验收。\n\n这四种检查围绕同一类工作，逐步回答“关键设想成立吗”“换材料还行吗”“日常是否好用”“企业能接手吗”。\n\n首轮可以只验证模型能否从杂乱材料提取必要条件，或新的交接是否让专业人员更容易判断。部分步骤由人完成也可以，但应明确标记，不把后台人工当成自动能力。\n\n如果关键问题是识别质量，没必要先建完整平台；如果关键问题是实际权限，不能只做离线演示。原型的范围应由风险和未知决定，而不是由最容易展示的界面决定。\n\n![从能力可行到真实运行的逐层验证](assets/22.svg)\n\n## 评测要覆盖怎样的错误\n\n准备具有代表性的正常、缺项、否定、歧义、变更与异常任务，写明预期结果和依据。不要只用开发时反复调好的材料；也要保留未参与调整的材料，观察方法是否能够迁移。\n\n| 层次 | 应检验什么 | 典型失败 |\n| --- | --- | --- |\n| 产物 | 字段、内容、计算与专业要求 | 格式对但把意向变成确认 |\n| 任务 | 完整路径、对象、权限和状态 | 金额更新了，旧批准却仍有效 |\n| 采用 | 人能否理解、接手并处理例外 | 实施者不在，员工无法继续 |\n| 价值 | 全链负担、质量与经营用途 | 生成快了，但复核与返工增加 |\n\n每项检查确定一个可观察终点：字段与原文一致，保存后读回正确对象，实际角色完成操作，下游人员打开记录继续处理。检查记录保留输入、当时条件和结果，便于修改后复查。\n\n## 一项修改要怎样复测\n\n假设原测试发现需求变更后仍可沿用旧批准。修复时将批准绑定内容版本。复测先重现原失败，确认修改后会要求重新检查；再测试正常批准仍可使用，以及其他角色不能绕过限制。\n\n这称为回归检查：修一个问题时，确认没有破坏原来正确行为。范围按影响选择，不必每次全部重测，也不能只看一张修复后的截图。\n\n模型错误也应分类：资料没进入、检索错误、理解错误、规则缺失、工具失败或对象关联错误。分类的作用是决定下一步改哪里，而不是为了让报表更精细。\n\n## 受控试用怎样安排\n\n限定参与者、任务类型、允许动作和时间范围，保留人工接手。记录完整任务，包括失败、等待、重试和最终没有采用的结果。只统计成功完成的任务，会使系统看起来比实际更好。\n\n比较前后时，按任务类型和复杂度分组，并使用相近观察周期。标准输入与复杂输入分别记录，可以看出改进适合哪部分工作。试用材料较少时，先用结果决定下一轮范围，随着实际使用增加再估计整体效果。\n\n严重错误即使少见，也应先限制相关能力。是否暂停要看后果、可发现性和补救条件，而不是只看总成功率。\n\n## 验收意味着企业能接手\n\n业务验收应由相应责任人判断任务能否完成，实施方提供过程和证据。技术人员不能替业务确定专业标准，业务也不能只凭界面感觉评价底层约束。\n\n可以安排一名未参与开发的实际使用者独立完成正常任务和常见异常，查看手册、状态和接手是否足够。然后核对企业是否掌握必要入口、数据、配置与维护安排。\n\n验收确定当前正式使用的范围、责任和维护方式。团队在这个基础上持续运行，经营者也有了比较下一轮扩展成本与收益的起点。"},{"id":"c23","file":"23-投入回报与合作采购.md","title":"第23章｜投入回报与合作采购","html":"\u003ch1>第23章｜投入回报与合作采购\u003c/h1>\n\u003cp>\u003cstrong>AI改造的经济性，要按完整任务和整个使用周期计算。释放时间、减少现金支出、改善质量与创造新收入，应分别记账。\u003c/strong>\u003c/p>\n\u003cp>省出的时间有几种去处：减少加班、承接更多任务、让专业人员处理复杂问题，或改善响应速度。企业应提前选择希望实现哪一种，并在试用中观察时间是否真的转化成相应结果。\u003c/p>\n\u003ch2>一笔可复查的教学账\u003c/h2>\n\u003cp>以下是假设计算，用于说明方法：每月200项同类任务，原来每项全链处理30分钟，改后包含复核与返工平均18分钟。\u003c/p>\n\u003cp>原工时为200×30÷60＝100小时，新工时为200×18÷60＝60小时，两者相减少用40小时，这里称为“毛释放”。扣除每月维护规则、检查运行等8小时，净释放32小时。若按每小时80元估算劳动价值，对应2,560元的可用工时价值，也称为“容量价值”，表示释放出来的工作时间按此单价折算值。企业接着需要决定这32小时用在哪里。\u003c/p>\n\u003cp>若另有每月1,200元模型和服务费用，且32小时可以替代同价外部工作，月度经营改善可按2,560−1,200＝1,360元估算，再考虑一次性建设投入。若原员工工资固定，则先记录容量增加，进一步看它是否带来更多交付、较少加班或更好质量。建设、数据准备、培训和交接另计一次性成本。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"23\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNzMzIiB2aWV3Qm94PSIwIDAgMzYwIDczMyIgcm9sZT0iaW1nIj48dGl0bGU+5a6M5pW05oiQ5pys5Yaz5a6a57uP5rWO5oCnPC90aXRsZT48ZGVzYz4xMDDlh482MOW+lzQw5bCP5pe277yM5YaN5YePOOWwj+aXtue7tOaKpOW+lzMy77yb5Yqz5Yqo5Lu35YC85LiO546w6YeR5Yip5ram5YiG5byA44CCPC9kZXNjPjxkZWZzPjxtYXJrZXIgaWQ9ImEiIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIHJlZlg9IjciIHJlZlk9IjQiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAgMCBMOCA0IEwwIDggWiIgZmlsbD0iIzI0NmE1NSIvPjwvbWFya2VyPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjczMyIgZmlsbD0id2hpdGUiLz48ZyBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiPjx0ZXh0IHg9IjI0IiB5PSIzOCIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIwM2YzOCIgZm9udC13ZWlnaHQ9IjYwMCI+5a6M5pW05oiQ5pys5Yaz5a6a57uP5rWO5oCnPC90ZXh0Pjx0ZXh0IHg9IjI0IiB5PSI4MiIgZm9udC1zaXplPSIxOSIgZmlsbD0iIzYxNzE2YiIgZm9udC13ZWlnaHQ9IjQwMCI+5pWZ5a2m5YGH6K6+77ya5q+P5pyIMjAw6aG55ZCM57G75Lu75YqhPC90ZXh0Pjx0ZXh0IHg9IjI0IiB5PSIxMTgiIGZvbnQtc2l6ZT0iMjAiIGZpbGw9IiMyMDNmMzgiIGZvbnQtd2VpZ2h0PSI2MDAiPuWOn+WFqOmTvuW3peaXtiAxMDDlsI/ml7Y8L3RleHQ+PHJlY3QgeD0iMjQiIHk9IjEzMiIgd2lkdGg9IjI0MC4wIiBoZWlnaHQ9IjE4IiByeD0iMiIgZmlsbD0iIzM2NWU4NiIgc3Ryb2tlPSIjMzY1ZTg2IiBzdHJva2Utd2lkdGg9IjEuNCIvPjx0ZXh0IHg9IjI0IiB5PSIxODQiIGZvbnQtc2l6ZT0iMjAiIGZpbGw9IiMyMDNmMzgiIGZvbnQtd2VpZ2h0PSI2MDAiPuaUueWQjuW3peaXtiA2MOWwj+aXtjwvdGV4dD48cmVjdCB4PSIyNCIgeT0iMTk4IiB3aWR0aD0iMTQ0LjAiIGhlaWdodD0iMTgiIHJ4PSIyIiBmaWxsPSIjMjQ2YTU1IiBzdHJva2U9I 贡献计算，并扣除相应履约成本；如果用于减少外包，就按实际少付的费用计算。同一份时间选择一种转化路径入账，便能保持收益口径清楚。\u003c/p>\n\u003ch2>两份报价怎样比较\u003c/h2>\n\u003cp>一份便宜方案可能只提供个人助手，另一份包含资料治理、系统连接、权限、验收和交接。只有范围相同，才适合直接比较价格。若企业只需个人辅助，轻量方案可能已经足够；若需要跨岗任务接续，则要补算缺少环节的人工和建设成本。\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>比较项\u003c/th>\n\u003cth>需要写清\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>结果范围\u003c/td>\n\u003ctd>从什么输入开始，交到哪里，谁继续\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>真实能力\u003c/td>\n\u003ctd>哪些已接通，哪些人工或模拟，受什么平台条件限制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>交付责任\u003c/td>\n\u003ctd>资料、规则、连接、验证、培训分别由谁承担\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>持续成本\u003c/td>\n\u003ctd>模型、平台、维护、改动、复核和内部配合\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>退出与迁移\u003c/td>\n\u003ctd>数据、配置、必要文件及后续运行怎样处理\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>采购约定宜围绕完整工作：处理哪些输入，按什么标准形成结果，谁能够接手，以及后续怎样维护。模型、智能体和知识条目可以作为实现清单，验收则依据这些工作结果。\u003c/p>\n\u003ch2>付款与阶段投入怎样对应\u003c/h2>\n\u003cp>可以按待证明问题分段投入：诊断查原因，原型验证核心能力与连接，试用检验实际负担，运行阶段完成交接。每一段结束后，企业有权根据新证据调整下一段范围。\u003c/p>\n\u003cp>已经花的钱属于历史投入，下一段仍应按新增成本与预期价值判断。若试点发现轻量工具足够，停止复杂集成可能是合理结果。良好的采购安排应允许事实改变方案，而不是迫使双方维持最初叙事。\u003c/p>\n\u003cp>企业要购买的是能够持续发挥作用的能力与责任安排。价格讨论只有回到这个对象，才有真正可比的基础。\u003c/p>\n","text":"# 第23章｜投入回报与合作采购\n\n**AI改造的经济性，要按完整任务和整个使用周期计算。释放时间、减少现金支出、改善质量与创造新收入，应分别记账。**\n\n省出的时间有几种去处：减少加班、承接更多任务、让专业人员处理复杂问题，或改善响应速度。企业应提前选择希望实现哪一种，并在试用中观察时间是否真的转化成相应结果。\n\n## 一笔可复查的教学账\n\n以下是假设计算，用于说明方法：每月200项同类任务，原来每项全链处理30分钟，改后包含复核与返工平均18分钟。\n\n原工时为200×30÷60＝100小时，新工时为200×18÷60＝60小时，两者相减少用40小时，这里称为“毛释放”。扣除每月维护规则、检查运行等8小时，净释放32小时。若按每小时80元估算劳动价值，对应2,560元的可用工时价值，也称为“容量价值”，表示释放出来的工作时间按此单价折算值。企业接着需要决定这32小时用在哪里。\n\n若另有每月1,200元模型和服务费用，且32小时可以替代同价外部工作，月度经营改善可按2,560−1,200＝1,360元估算，再考虑一次性建设投入。若原员工工资固定，则先记录容量增加，进一步看它是否带来更多交付、较少加班或更好质量。建设、数据准备、培训和交接另计一次性成本。\n\n![全链工时、持续成本与价值分别计算](assets/23.svg)\n\n## 改变一个条件，结论会怎样变化\n\n如果任务量降到每月50项，同样每项少12分钟，毛释放只有10小时。固定维护仍为8小时，净释放2小时。按80元估算仅160元，已经不足以覆盖上述1,200元月费用。高频场景和低频场景，经济性可能完全不同。\n\n如果仍有200项，但复核加重，使新工时变成每项25分钟，毛释放约16.7小时，扣8小时后约8.7小时，劳动价值约693元。原本看似不错的方案，也可能不再合算。\n\n两次重算显示，任务量和复核时间会显著改变经济性。试用时应优先测准这两项，并观察固定维护是否能够随其他场景复用。企业可以因此决定提高使用频率、改善核对方式，或选择更轻的方案。\n\n## 质量和增长怎样入账\n\n减少漏项、避免错误承诺、缩短客户等待，都可能比单纯省时更重要。可以记录原错误频率、后果及改后观察，但不要把尚未发生的所有潜在损失都算成确定收益。\n\n新增收入更要分清。AI使企业能更低成本提供初步分析，不代表客户愿意付费；若分析促进成交，还要区分市场、销售和产品等其他变化。可先检验客户需求与履约成本，再逐步估计贡献。\n\n如果释放的时间用于新增服务，就按新增服务的贡献计算，并扣除相应履约成本；如果用于减少外包，就按实际少付的费用计算。同一份时间选择一种转化路径入账，便能保持收益口径清楚。\n\n## 两份报价怎样比较\n\n一份便宜方案可能只提供个人助手，另一份包含资料治理、系统连接、权限、验收和交接。只有范围相同，才适合直接比较价格。若企业只需个人辅助，轻量方案可能已经足够；若需要跨岗任务接续，则要补算缺少环节的人工和建设成本。\n\n| 比较项 | 需要写清 |\n| --- | --- |\n| 结果范围 | 从什么输入开始，交到哪里，谁继续 |\n| 真实能力 | 哪些已接通，哪些人工或模拟，受什么平台条件限制 |\n| 交付责任 | 资料、规则、连接、验证、培训分别由谁承担 |\n| 持续成本 | 模型、平台、维护、改动、复核和内部配合 |\n| 退出与迁移 | 数据、配置、必要文件及后续运行怎样处理 |\n\n采购约定宜围绕完整工作：处理哪些输入，按什么标准形成结果，谁能够接手，以及后续怎样维护。模型、智能体和知识条目可以作为实现清单，验收则依据这些工作结果。\n\n## 付款与阶段投入怎样对应\n\n可以按待证明问题分段投入：诊断查原因，原型验证核心能力与连接，试用检验实际负担，运行阶段完成交接。每一段结束后，企业有权根据新证据调整下一段范围。\n\n已经花的钱属于历史投入，下一段仍应按新增成本与预期价值判断。若试点发现轻量工具足够，停止复杂集成可能是合理结果。良好的采购安排应允许事实改变方案，而不是迫使双方维持最初叙事。\n\n企业要购买的是能够持续发挥作用的能力与责任安排。价格讨论只有回到这个对象，才有真正可比的基础。\n"},{"id":"c24","file":"24-岗位重构负责人和激励.md","title":"第24章｜岗位重构、负责人和激励","html":"\u003ch1>第24章｜岗位重构、负责人和激励\u003c/h1>\n\u003cp>\u003cstrong>企业采用AI，意味着重新安排一部分工作、专业经验和决定权。管理者需要同时考虑谁从中受益、谁承担新增工作，以及怎样让团队愿意持续改进。\u003c/strong>\u003c/p>\n\u003cp>一项工具可以由个人开始使用；跨岗位改造则会改变彼此的输入和负担。销售整理得更快，专业人员可能收到更多材料；初稿更容易生成，负责人可能花更多时间筛选。组织安排决定这些变化能否形成整体收益。\u003c/p>\n\u003ch2>谁对一类工作的结果负责\u003c/h2>\n\u003cp>技术负责人管理实现与运行，业务负责人管理结果、标准和协作。业务负责人需要能沿完整任务查看：客户或上游提交什么，谁处理什么，等待在哪里，最后谁使用结果。\u003c/p>\n\u003cp>例如，AI让需求整理加快，专业确认开始排队。业务负责人应查看收到的任务：哪些已齐备，可以按标准处理；哪些仍缺条件，应在上游补充；哪些涉及特殊服务，需要负责人决定。随后调整入口要求、分派方式和授权。这样，技术带来的速度才能传递到后续工作。\u003c/p>\n\u003cp>这项责任需要相应时间和权限。项目期间让业务负责人参与样例、试用与规则确认，运行后给他维护方法和处理跨岗问题的职责。决策者负责解决超出其权限的资源与利益取舍。\u003c/p>\n\u003ch2>沿岗位任务重新分配时间\u003c/h2>\n\u003cp>岗位往往由多类任务组成。一个专业人员既查资料，也判断适配，既制作说明，也处理例外。AI进入后，可以把其中的阅读、整理和初稿先交给系统，让专业人员集中处理真正影响结果的差异。\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>原有工作\u003c/th>\n\u003cth>改造后的重点\u003c/th>\n\u003cth>对人员能力的要求\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>逐件抄录与归纳\u003c/td>\n\u003ctd>核对关键字段，处理缺项和异常\u003c/td>\n\u003ctd>理解材料、识别状态与依据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>从零制作内容\u003c/td>\n\u003ctd>确定目标、结构与专业表达\u003c/td>\n\u003ctd>判断读者需要，核对并修改结果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>凭经验逐案判断\u003c/td>\n\u003ctd>处理特殊情况，完善共用方法\u003c/td>\n\u003ctd>说明条件、比较反例、更新规则\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>反复协调与询问\u003c/td>\n\u003ctd>维护共同记录，解决跨岗卡点\u003c/td>\n\u003ctd>理解全程状态，作出例外决定\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>这种调整可以逐项发生。先测出哪些任务得到改善，再安排释放时间的用途。例如把原先整理资料的半天转为客户回访，就要同时明确回访对象、要了解的问题和结果去向。时间有了新的安排，提效才能进入经营。\u003c/p>\n\u003ch2>经验共享为什么需要经营安排\u003c/h2>\n\u003cp>业务骨干的经验是企业能力的重要来源。整理经验会占用他的时间，也可能改变他在团队中的作用。如果仍只按个人产量评价，就很难持续要求他培训同事、修正规则和提供反例。\u003c/p>\n\u003cp>企业可以把方法维护列为正式工作：明确每次更新解决什么问题，安排可用时间，把帮助团队减少返工的贡献计入评价。对于需要持续参与的骨干，也要讨论职责、成长和收益分配。经验越重要，越需要认真处理提供经验的人所处的位置。\u003c/p>\n\u003cp>同样，销售与交付的评价要能支持共同结果。销售看响应和成交，交付看质量与资源，企业可以共同约定标准响应、必要条件和加急成本，再用完整任务观察两方负担。AI提供更及时的信息，负责人据此作经营取舍。\u003c/p>\n\u003ch2>培训围绕新工作展开\u003c/h2>\n\u003cp>业务人员需要学会提出任务、看懂AI结果、核对关键差异、处理例外并交给下一岗位。培训可以用一笔实际材料走完这个过程，让员工亲眼看到自己负责的判断在哪一步。\u003c/p>\n\u003cp>专业人员还需要学会把方法说明白：什么条件会改变结论，哪些例子最能区分情况，怎样发现错误。技术人员据此设计实现。管理者则练习用任务结果、完整负担和经营用途评价项目。不同岗位学习的内容，来自各自的新责任。\u003c/p>\n\u003cp>培训之后安排实际使用和反馈。员工遇到的问题应有入口，规则修改有负责人，解决结果回到共用方法。培训由一次讲解延伸成工作中的学习。\u003c/p>\n\u003ch2>让新做法成为日常入口\u003c/h2>\n\u003cp>试用阶段记录哪些任务采用了新路径、哪些绕回旧方式，并询问原因。如果新系统缺少必要功能，就改实现；如果旧制度要求重复填报，就调整制度；如果专业人员不信任某类输出，就共同检查原始材料和方法。\u003c/p>\n\u003cp>正式采用时，明确这一类任务从哪里进入、以哪份记录为准、哪些旧动作停止。保留清楚的故障接手方法，团队便能在正常时沿新方式工作，遇到问题时继续完成业务。\u003c/p>\n\u003cp>组织AI化会改变岗位的任务组合，也会改变协作关系。管理者的推动作用，是为这种变化安排时间、权责和利益，使改进对参与者也成为可以持续承担的工作。\u003c/p>\n","text":"# 第24章｜岗位重构、负责人和激励\n\n**企业采用AI，意味着重新安排一部分工作、专业经验和决定权。管理者需要同时考虑谁从中受益、谁承担新增工作，以及怎样让团队愿意持续改进。**\n\n一项工具可以由个人开始使用；跨岗位改造则会改变彼此的输入和负担。销售整理得更快，专业人员可能收到更多材料；初稿更容易生成，负责人可能花更多时间筛选。组织安排决定这些变化能否形成整体收益。\n\n## 谁对一类工作的结果负责\n\n技术负责人管理实现与运行，业务负责人管理结果、标准和协作。业务负责人需要能沿完整任务查看：客户或上游提交什么，谁处理什么，等待在哪里，最后谁使用结果。\n\n例如，AI让需求整理加快，专业确认开始排队。业务负责人应查看收到的任务：哪些已齐备，可以按标准处理；哪些仍缺条件，应在上游补充；哪些涉及特殊服务，需要负责人决定。随后调整入口要求、分派方式和授权。这样，技术带来的速度才能传递到后续工作。\n\n这项责任需要相应时间和权限。项目期间让业务负责人参与样例、试用与规则确认，运行后给他维护方法和处理跨岗问题的职责。决策者负责解决超出其权限的资源与利益取舍。\n\n## 沿岗位任务重新分配时间\n\n岗位往往由多类任务组成。一个专业人员既查资料，也判断适配，既制作说明，也处理例外。AI进入后，可以把其中的阅读、整理和初稿先交给系统，让专业人员集中处理真正影响结果的差异。\n\n| 原有工作 | 改造后的重点 | 对人员能力的要求 |\n| --- | --- | --- |\n| 逐件抄录与归纳 | 核对关键字段，处理缺项和异常 | 理解材料、识别状态与依据 |\n| 从零制作内容 | 确定目标、结构与专业表达 | 判断读者需要，核对并修改结果 |\n| 凭经验逐案判断 | 处理特殊情况，完善共用方法 | 说明条件、比较反例、更新规则 |\n| 反复协调与询问 | 维护共同记录，解决跨岗卡点 | 理解全程状态，作出例外决定 |\n\n这种调整可以逐项发生。先测出哪些任务得到改善，再安排释放时间的用途。例如把原先整理资料的半天转为客户回访，就要同时明确回访对象、要了解的问题和结果去向。时间有了新的安排，提效才能进入经营。\n\n## 经验共享为什么需要经营安排\n\n业务骨干的经验是企业能力的重要来源。整理经验会占用他的时间，也可能改变他在团队中的作用。如果仍只按个人产量评价，就很难持续要求他培训同事、修正规则和提供反例。\n\n企业可以把方法维护列为正式工作：明确每次更新解决什么问题，安排可用时间，把帮助团队减少返工的贡献计入评价。对于需要持续参与的骨干，也要讨论职责、成长和收益分配。经验越重要，越需要认真处理提供经验的人所处的位置。\n\n同样，销售与交付的评价要能支持共同结果。销售看响应和成交，交付看质量与资源，企业可以共同约定标准响应、必要条件和加急成本，再用完整任务观察两方负担。AI提供更及时的信息，负责人据此作经营取舍。\n\n## 培训围绕新工作展开\n\n业务人员需要学会提出任务、看懂AI结果、核对关键差异、处理例外并交给下一岗位。培训可以用一笔实际材料走完这个过程，让员工亲眼看到自己负责的判断在哪一步。\n\n专业人员还需要学会把方法说明白：什么条件会改变结论，哪些例子最能区分情况，怎样发现错误。技术人员据此设计实现。管理者则练习用任务结果、完整负担和经营用途评价项目。不同岗位学习的内容，来自各自的新责任。\n\n培训之后安排实际使用和反馈。员工遇到的问题应有入口，规则修改有负责人，解决结果回到共用方法。培训由一次讲解延伸成工作中的学习。\n\n## 让新做法成为日常入口\n\n试用阶段记录哪些任务采用了新路径、哪些绕回旧方式，并询问原因。如果新系统缺少必要功能，就改实现；如果旧制度要求重复填报，就调整制度；如果专业人员不信任某类输出，就共同检查原始材料和方法。\n\n正式采用时，明确这一类任务从哪里进入、以哪份记录为准、哪些旧动作停止。保留清楚的故障接手方法，团队便能在正常时沿新方式工作，遇到问题时继续完成业务。\n\n组织AI化会改变岗位的任务组合，也会改变协作关系。管理者的推动作用，是为这种变化安排时间、权责和利益，使改进对参与者也成为可以持续承担的工作。\n"},{"id":"c25","file":"25-持续运行风险与变更治理.md","title":"第25章｜持续运行、风险与变更治理","html":"\u003ch1>第25章｜持续运行、风险与变更治理\u003c/h1>\n\u003cp>\u003cstrong>持续运行要让AI能力跟着业务变化更新。企业需要明确谁维护资料与方法，谁处理系统问题，以及变化发生后怎样保持工作接续。\u003c/strong>\u003c/p>\n\u003cp>AI系统可能依赖外部模型、知识资料、接口、账号和业务规则。任何一项变化，都可能改变原先验证过的行为。持续可用需要企业知道由谁发现变化、怎样判断影响，以及出问题时谁继续工作。\u003c/p>\n\u003ch2>按后果决定控制强度\u003c/h2>\n\u003cp>内部草稿写得不合适，与对外发出错误承诺，后果不同。只读查询与修改正式记录，也不能采用完全相同控制。应按数据范围、动作后果、可发现性和可补救程度确定权限与核对。\u003c/p>\n\u003cp>权限可以按用途配置：研究读取相关资料，内容起草生成待用文件，分析调用查询和计算工具；需要改变正式记录的任务，再配置相应写入和确认步骤。这样的分工使日常操作明确，也缩小出错时的影响范围。\u003c/p>\n\u003cp>选择部署方式时，沿实际数据路径查看资料在哪里处理、谁可以访问、怎样保存和删除，再结合合同与内部管理要求作决定。无论采用哪种方式，权限、规则更新和运行责任都要落实到具体系统与人员。\u003c/p>\n\u003ch2>哪些变化值得重新验证\u003c/h2>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>变化\u003c/th>\n\u003cth>可能影响\u003c/th>\n\u003cth>相应检查\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>规则与知识更新\u003c/td>\n\u003ctd>答案适用范围和承诺\u003c/td>\n\u003ctd>新旧任务、边界与历史记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型或任务说明更新\u003c/td>\n\u003ctd>理解、格式、工具选择\u003c/td>\n\u003ctd>核心任务与历史失败\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>平台和接口变化\u003c/td>\n\u003ctd>读取、写入、状态\u003c/td>\n\u003ctd>实际账号与完整路径\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>岗位与权限变化\u003c/td>\n\u003ctd>可见范围和批准\u003c/td>\n\u003ctd>新旧身份及未授权操作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>业务量和任务分布变化\u003c/td>\n\u003ctd>成本、等待和错误\u003c/td>\n\u003ctd>复杂度、负担与异常接手\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>检查范围可以随变化确定：改一条规则，检查受影响任务；换模型，复测核心能力和历史错误；调整身份，重查数据范围。保存当前运行版本，便于出问题时还原当时条件。\u003c/p>\n\u003ch2>监测要看业务，而不只看程序\u003c/h2>\n\u003cp>程序运行率和接口错误有用，但还应观察任务积压、人工改动、退回、结果未采用和客户追问。模型没有报错，也可能持续生成不合用内容；工具调用成功，也可能把记录写错对象。\u003c/p>\n\u003cp>运行日志应让有权人员还原必要过程，同时控制敏感信息范围。并非为了排错就保存所有原文、全部聊天和个人资料。保存什么、谁可看、保留多久，应与企业实际用途一致。\u003c/p>\n\u003cp>问题记录需要归类并分配负责人。资料问题交知识维护，业务冲突交业务负责人，接口与程序问题交技术。避免所有错误都堆到一个“AI不稳定”类别。\u003c/p>\n\u003ch2>降级、回滚与补救各是什么\u003c/h2>\n\u003cp>降级是在能力不可用时继续必要业务，例如人工登记并明确接手，恢复后核对补录。回滚是恢复程序或配置的旧版本。补救则处理已经发生的外部影响，如错误通知、重复申请或不准确承诺。\u003c/p>\n\u003cp>餐厅点单设备暂时不可用，服务员可以改用纸单，把桌号、菜品和是否出餐记清。设备恢复后，已经出过的菜只补登记，不再让厨房重新做。这里临时换一种办法维持营业，就是降级；补回记录，是为了让后面的人知道实际做到哪里。\u003c/p>\n\u003cp>换到企业通知流程，假设一项更新造成重复提醒：业务负责人先暂停这项自动通知，技术人员检查发送记录和更新内容，客服查清哪些客户收到重复消息并处理必要说明。期间需要发出的通知由指定人员接手，逐项记下对象、内容和实际发送时间。技术修复后，先用少量任务验证，再按记录跳过已发送项、继续剩余通知。\u003c/p>\n\u003cp>若采用恢复旧配置的办法，那一步叫回滚；已经发出的重复通知仍需要业务人员处理。程序回到旧版本与客户收到怎样的消息，是两件都要照顾的事。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"25\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iODYzIiB2aWV3Qm94PSIwIDAgMzYwIDg2MyIgcm9sZT0iaW1nIj48dGl0bGU+6YCa55+l5Ye66ZSZ5ZCO5oCO5qC357un57utPC90aXRsZT48ZGVzYz7mmoLlgZzplJnor6/liqjkvZzlkI7kuJrliqHkurrlt6XmjqXmiYvlubbnmbvorrDvvIzmioDmnK/kv67lpI3pqozor4HvvJvmgaLlpI3ml7bmjInlrp7pmYXorrDlvZXot7Pov4flt7Llj5HpobnjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYSIgbWFya2VyV2lkdGg9IjgiIG1hcmtlckhlaWdodD0iOCIgcmVmWD0iNyIgcmVmWT0iNCIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwIEw4IDQgTDAgOCBaIiBmaWxsPSIjMjQ2YTU1Ii8+PC9tYXJrZXI+PC9kZWZzPjxyZWN0IHdpZHRoPSIzNjAiIGhlaWdodD0iODYzIiBmaWxsPSJ3aGl0ZSIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiI+PHRleHQgeD0iMjQiIHk9IjM4IiBmb250LXNpemU9IjI0IiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNjAwIj7pgJrnn6Xlh7rplJnlkI7mgI7moLfnu6fnu608L3RleHQ+PHRleHQgeD0iMjQiIHk9IjcxIiBmb250LXNpemU9IjE4IiBmaWxsPSIjNjE3MTZiIiBmb250LXdlaWdodD0iNDAwIj7npLrmhI/vvJrmm7TmlrDlkI7lh7rnjrDph43lpI3mj5DphpI8L3RleHQ+PHJlY3QgeD0iMjQiIHk9IjEyNCIgd2lkdGg9IjMxMiIgaGVpZ2h0PSIxMTMiIHJ4PSI4IiBmaWxsPSIjZmNmMmU1IiBzdHJva2U9IiNkNWUwZGEiIHN0cm9rZS13aWR0aD0iMS40Ii8+PHRleHQgeD0iNDAiIHk9IjE1NCIgZm9udC1zaXplPSIyMSIgZmlsbD0iIzI0NmE1NSIgZm9udC13ZWlnaHQ9IjYwMCI+5YWI5pqC5YGc6L+Z6aG56Ieq5Yqo6YCa55+lPC90ZXh0PjxwYXRoIGQ9Ik00MCAxNzYgSDMyMCIgc3Ryb2tlPSIjZDVlMGRhIiBzdHJva2Utd2lkdGg9IjIiIGZpbGw9Im5vbmUiLz48dGV4dCB4PSI0MCIgeT0iMjA4IiBmb250LXNpemU9IjIwIiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNDAwIj7kv53nlZnlt7Llj5HorrDlvZXvvIzpgb/lhY3nu6fnu63ph43lpI08L3RleHQ+PHJlY3QgeD0iMjQiIHk9IjI2MSIgd2lkdGg9IjMxMiIgaGVpZ2h0PSIxNDIiIHJ4PSI4IiBmaWxsPSIjZWRmMmY4IiBzd dCB4PSI0MCIgeT0iNTQxIiBmb250LXNpemU9IjIwIiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNDAwIj7lt7Llj5HpgIEg4oaSIOi3s+i/hzwvdGV4dD48dGV4dCB4PSI0MCIgeT0iNTcwIiBmb250LXNpemU9IjIwIiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNDAwIj7lsJrmnKrlj5HpgIEg4oaSIOe7p+e7reWkhOeQhjwvdGV4dD48dGV4dCB4PSIyNCIgeT0iNjI1IiBmb250LXNpemU9IjE4IiBmaWxsPSIjNjE3MTZiIiBmb250LXdlaWdodD0iNDAwIj7lpoLlkIzppJDljoXkuLTml7bnlKjnurjljZXvvJrns7vnu5/mgaLlpI3lkI7ooaXorrDlvZXvvIzlt7Lnu4/lgZrov4fnmoToj5zkuI3ph43lgZrjgII8L3RleHQ+PC9nPjwvc3ZnPg==\" alt=\"自动通知异常后暂停发送，业务人员按发送记录接手并登记；技术修复验证后，系统核对已发项，只继续未发任务。\">\u003c/picture>\u003cfigcaption>\u003cspan>图 25-1\u003c/span>\u003cbutton type=\"button\" class=\"enlarge\" aria-label=\"放大查看图25-1\">放大查看\u003c/button>\u003c/figcaption>\u003c/figure>\n\u003cp>保存超时时，先查询业务记录，确认结果后再继续。人工接手也记录对象和已完成动作，技术恢复时据此跳过已处理部分。这样可以减少恢复阶段再次产生重复。\u003c/p>\n\u003ch2>企业怎样保持可控\u003c/h2>\n\u003cp>为关键能力指定业务和技术责任人，明确常见异常、响应与接手方式，定期查看运行价值。若一项能力很少使用、维护成本不断增加，应允许简化或退役。\u003c/p>\n\u003cp>治理支持企业把成熟动作交给系统，把重要例外交给有权人员。规则、状态和接手清楚以后，决策者可以减少逐项介入，把注意力放在需要调整的经营选择上。\u003c/p>\n","text":"# 第25章｜持续运行、风险与变更治理\n\n**持续运行要让AI能力跟着业务变化更新。企业需要明确谁维护资料与方法，谁处理系统问题，以及变化发生后怎样保持工作接续。**\n\nAI系统可能依赖外部模型、知识资料、接口、账号和业务规则。任何一项变化，都可能改变原先验证过的行为。持续可用需要企业知道由谁发现变化、怎样判断影响，以及出问题时谁继续工作。\n\n## 按后果决定控制强度\n\n内部草稿写得不合适，与对外发出错误承诺，后果不同。只读查询与修改正式记录，也不能采用完全相同控制。应按数据范围、动作后果、可发现性和可补救程度确定权限与核对。\n\n权限可以按用途配置：研究读取相关资料，内容起草生成待用文件，分析调用查询和计算工具；需要改变正式记录的任务，再配置相应写入和确认步骤。这样的分工使日常操作明确，也缩小出错时的影响范围。\n\n选择部署方式时，沿实际数据路径查看资料在哪里处理、谁可以访问、怎样保存和删除，再结合合同与内部管理要求作决定。无论采用哪种方式，权限、规则更新和运行责任都要落实到具体系统与人员。\n\n## 哪些变化值得重新验证\n\n| 变化 | 可能影响 | 相应检查 |\n| --- | --- | --- |\n| 规则与知识更新 | 答案适用范围和承诺 | 新旧任务、边界与历史记录 |\n| 模型或任务说明更新 | 理解、格式、工具选择 | 核心任务与历史失败 |\n| 平台和接口变化 | 读取、写入、状态 | 实际账号与完整路径 |\n| 岗位与权限变化 | 可见范围和批准 | 新旧身份及未授权操作 |\n| 业务量和任务分布变化 | 成本、等待和错误 | 复杂度、负担与异常接手 |\n\n检查范围可以随变化确定：改一条规则，检查受影响任务；换模型，复测核心能力和历史错误；调整身份，重查数据范围。保存当前运行版本，便于出问题时还原当时条件。\n\n## 监测要看业务，而不只看程序\n\n程序运行率和接口错误有用，但还应观察任务积压、人工改动、退回、结果未采用和客户追问。模型没有报错，也可能持续生成不合用内容；工具调用成功，也可能把记录写错对象。\n\n运行日志应让有权人员还原必要过程，同时控制敏感信息范围。并非为了排错就保存所有原文、全部聊天和个人资料。保存什么、谁可看、保留多久，应与企业实际用途一致。\n\n问题记录需要归类并分配负责人。资料问题交知识维护，业务冲突交业务负责人，接口与程序问题交技术。避免所有错误都堆到一个“AI不稳定”类别。\n\n## 降级、回滚与补救各是什么\n\n降级是在能力不可用时继续必要业务，例如人工登记并明确接手，恢复后核对补录。回滚是恢复程序或配置的旧版本。补救则处理已经发生的外部影响，如错误通知、重复申请或不准确承诺。\n\n餐厅点单设备暂时不可用，服务员可以改用纸单，把桌号、菜品和是否出餐记清。设备恢复后，已经出过的菜只补登记，不再让厨房重新做。这里临时换一种办法维持营业，就是降级；补回记录，是为了让后面的人知道实际做到哪里。\n\n换到企业通知流程，假设一项更新造成重复提醒：业务负责人先暂停这项自动通知，技术人员检查发送记录和更新内容，客服查清哪些客户收到重复消息并处理必要说明。期间需要发出的通知由指定人员接手，逐项记下对象、内容和实际发送时间。技术修复后，先用少量任务验证，再按记录跳过已发送项、继续剩余通知。\n\n若采用恢复旧配置的办法，那一步叫回滚；已经发出的重复通知仍需要业务人员处理。程序回到旧版本与客户收到怎样的消息，是两件都要照顾的事。\n\n![自动通知异常后暂停发送，业务人员按发送记录接手并登记；技术修复验证后，系统核对已发项，只继续未发任务。](assets/25.svg)\n\n保存超时时，先查询业务记录，确认结果后再继续。人工接手也记录对象和已完成动作，技术恢复时据此跳过已处理部分。这样可以减少恢复阶段再次产生重复。\n\n## 企业怎样保持可控\n\n为关键能力指定业务和技术责任人，明确常见异常、响应与接手方式，定期查看运行价值。若一项能力很少使用、维护成本不断增加，应允许简化或退役。\n\n治理支持企业把成熟动作交给系统，把重要例外交给有权人员。规则、状态和接手清楚以后，决策者可以减少逐项介入，把注意力放在需要调整的经营选择上。"},{"id":"c26","file":"26-把项目经验变为组织能力资产.md","title":"第26章｜把项目经验变为组织能力资产","html":"\u003ch1>第26章｜把项目经验变为组织能力资产\u003c/h1>\n\u003cp>\u003cstrong>一项改造值得留下两类成果：当前工作得到改善，下一次同类工作也更容易做好。后者来自能够找到、使用和维护的知识、方法与工具。\u003c/strong>\u003c/p>\n\u003cp>企业可以在项目结束时整理经验，更有效的做法是在工作中持续提取：哪份资料经常使用，哪种判断反复出现，哪项检查曾发现关键错误，哪段工具连接值得共用。这样，沉淀对象来自实际需要。\u003c/p>\n\u003ch2>从一次修正提取可沿用的方法\u003c/h2>\n\u003cp>设想一份AI生成方案中出现交期错误。沿过程查看，发现它把客户希望的日期当成企业确认日期。团队据此把“期望日期”和“已确认日期”分成两个字段，并要求后者记录确认依据。\u003c/p>\n\u003cp>这项改动可以成为一套方法：从原话识别日期含义，查询是否已有确认，分别保存状态，再根据状态安排追问或继续处理。用已确认、尚未确认和反复变更几类材料检验，确认方法能支持工作后，供其他相关任务使用。\u003c/p>\n\u003cp>迁移到采购时，同样可以区分供应商预计到货与已确认到货，但具体确认规则由采购负责人确定。复用的是区分状态、保存依据的办法，专业内容在新任务中重新明确。经验因此既保持价值，也能适应不同业务。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"26\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iODQ0IiB2aWV3Qm94PSIwIDAgMzYwIDg0NCIgcm9sZT0iaW1nIj48dGl0bGU+5LiA5qyh5L+u5q2j5oCO5qC35oiQ5Li65YWx55So5pa55rOVPC90aXRsZT48ZGVzYz7ml6XmnJ/nirbmgIHplJnor6/lvJXlh7rlrZfmrrXkuI7kvp3mja7orr7orqHvvIznu4/kuI3lkIzmoLfkvovmo4Dmn6XlkI7nlKjkuo
