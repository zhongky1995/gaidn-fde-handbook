<script>
const COURSE={"pages":[{"file":"00-导学.md","id":"intro","number":0,"role":"导学","part":-1,"title":"企业 AI 转型与 FDE","md":"# 企业 AI 转型与 FDE\n\n企业能够买到越来越强的通用智能，却仍要回答自己的问题：哪些工作值得改变，什么经验真正有价值，怎样让AI进入生产，投入最后留下了什么。\n\n这门课从企业经营与能力发展的角度理解FDE。FDE是把现场认识与工程实现连接起来的力量；AI则可以成为有记忆、能行动、接受反馈的工作伙伴。两者共同作用的对象，是企业产生客户价值与形成自身能力的方式。\n\n## 全课围绕四个问题\n\n第一，过去难以留下的经验，怎样在生产中以更低负担被观察、组织和再次使用。这里会区分记录、解释、方法、组织能力与竞争优势，不把资料增长当作积累已经完成。\n\n第二，企业真正的差异化在哪里，FDE怎样找到它的生成机制，并使有效判断、实际执行和纠错一起放大。独特做法需要客户与交付证据。\n\n第三，企业与AI怎样在真实使用中共同发展。长期工程、内部吸收与阶段选择如何相互支持，为什么培训和单次上线难以承担全部持续变化。\n\n第四，怎样经营可调度智能资源。token投入如何形成合格工作，合格工作如何兑现结果，本轮工作又怎样提高下一次能力；模型费、人工、容量和维护都要进入这条链。\n\n## 怎样阅读\n\n不需要先具备软件开发知识。课程假定你熟悉人员、业务与经营中的常见取舍；新概念会在具体问题中解释。\n\n按顺序阅读，可以从变化机制走到一份完整改造提案。已有明确问题时，也可以从相关部分进入，再补必要背景。目录按八部分组织，搜索覆盖全部正文、案例和参考材料。\n\n| 阅读部分 | 需要建立的判断 | 起点 |\n|---|---|---|\n| 变化 | AI怎样传到企业能力与产业竞争 | [第1章](01-智能供给.md) |\n| 积累 | 经验怎样成为组织下一次能用的能力 | [第5章](05-从经验到能力.md) |\n| 优势与现场 | 值得改什么，FDE怎样发现与实现 | [第11章](11-客户认可的价值.md) |\n| 智能伙伴 | 信息、分工、行动和持续运行 | [第17章](17-智能伙伴的持续职责.md) |\n| 智能资源经营 | 任务配置、整链容量、成本和留存 | [第23章](23-token与智能资源.md) |\n| 证据与更新 | 任务合格、业务有效和真正学会 | [第29章](29-任务质量.md) |\n| 组织与共建 | 激励、长期FDE与内部接续 | [第33章](33-岗位权责与激励.md) |\n| 持续发展 | 路线、新服务、行业与完整提案 | [第37章](37-阶段发展路线.md) |\n\n阅读不以提交作业作为继续条件。工作簿与案例推演可以在需要时使用；阅读位置只表示读到哪里，不代表已经掌握。\n\n## 四组教学案例，分别帮助看清什么\n\n[连锁备货案例](案例A-连锁备货.md)贯穿客户价值、现场信息、分配、反例与新店迁移。它保留生产配送约束，避免把模型能力当作全部经营结果。\n\n[智能成本案例](案例B-智能资源成本.md)比较同等合格任务的模型费、核验和返工，并把工时释放与现金改善分开。\n\n[设备售后案例](案例C-设备售后.md)追踪原始描述、动作、错误草稿、候选解释、接任与真实服务状态。\n\n[专业服务案例](案例D-专业服务.md)展开生成扩产、专家瓶颈、阶段选择与新服务设计。\n\n四组企业、条件与业务数字都是教学设定。正文另使用客服、Zara、宝洁、办公和开发等公开研究，各自支持不同范围的判断。相关原文与实际采用范围见[研究与延伸阅读](延伸阅读.md)。\n\n## 这门课最终要形成什么\n\n你可以带着自己的一条业务读，也可以先用教学案例走完。最终成果是一份能够向经营、业务和工程说明的提案：客户为何需要，企业何以做到，AI与FDE分别承担什么，结果怎样检验，资源怎样兑现，下一阶段如何选择。\n\n一份好的提案可以有未知，但每个重要未知应能说明怎样取得证据。课程希望帮助建立的，是主动建设与持续更新判断的能力。\n\n从[第1章：企业得到了什么新供给](01-智能供给.md)开始。\n","html":"\u003ch1>企业 AI 转型与 FDE\u003c/h1>\n\u003cp>企业能够买到越来越强的通用智能，却仍要回答自己的问题：哪些工作值得改变，什么经验真正有价值，怎样让AI进入生产，投入最后留下了什么。\u003c/p>\n\u003cp>这门课从企业经营与能力发展的角度理解FDE。FDE是把现场 s://zhongky1995.github.io/gaidn-fde-handbook/#lesson-17) |\n| 智能资源经营 | 任务配置、整链容量、成本和留存 | [第23章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-23) |\n| 证据与更新 | 任务合格、业务有效和真正学会 | [第29章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-29) |\n| 组织与共建 | 激励、长期FDE与内部接续 | [第33章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-33) |\n| 持续发展 | 路线、新服务、行业与完整提案 | [第37章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-37) |\n\n阅读不以提交作业作为继续条件。工作簿与案例推演可以在需要时使用；阅读位置只表示读到哪里，不代表已经掌握。\n\n## 四组教学案例，分别帮助看清什么\n\n[连锁备货案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-a)贯穿客户价值、现场信息、分配、反例与新店迁移。它保留生产配送约束，避免把模型能力当作全部经营结果。\n\n[智能成本案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-b)比较同等合格任务的模型费、核验和返工，并把工时释放与现金改善分开。\n\n[设备售后案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-c)追踪原始描述、动作、错误草稿、候选解释、接任与真实服务状态。\n\n[专业服务案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-d)展开生成扩产、专家瓶颈、阶段选择与新服务设计。\n\n四组企业、条件与业务数字都是教学设定。正文另使用客服、Zara、宝洁、办公和开发等公开研究，各自支持不同范围的判断。相关原文与实际采用范围见[研究与延伸阅读](https://zhongky1995.github.io/gaidn-fde-handbook/#reading)。\n\n## 这门课最终要形成什么\n\n你可以带着自己的一条业务读，也可以先用教学案例走完。最终成果是一份能够向经营、业务和工程说明的提案：客户为何需要，企业何以做到，AI与FDE分别承担什么，结果怎样检验，资源怎样兑现，下一阶段如何选择。\n\n一份好的提案可以有未知，但每个重要未知应能说明怎样取得证据。课程希望帮助建立的，是主动建设与持续更新判断的能力。\n\n从[第1章：企业得到了什么新供给](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-01)开始。\n","text":"# 企业 AI 转型与 FDE\n\n企业能够买到越来越强的通用智能，却仍要回答自己的问题：哪些工作值得改变，什么经验真正有价值，怎样让AI进入生产，投入最后留下了什么。\n\n这门课从企业经营与能力发展的角度理解FDE。FDE是把现场认识与工程实现连接起来的力量；AI则可以成为有记忆、能行动、接受反馈的工作伙伴。两者共同作用的对象，是企业产生客户价值与形成自身能力的方式。\n\n## 全课围绕四个问题\n\n第一，过去难以留下的经验，怎样在生产中以更低负担被观察、组织和再次使用。这里会区分记录、解释、方法、组织能力与竞争优势，不把资料增长当作积累已经完成。\n\n第二，企业真正的差异化在哪里，FDE怎样找到它的生成机制，并使有效判断、实际执行和纠错一起放大。独特做法需要客户与交付证据。\n\n第三，企业与AI怎样在真实使用中共同发展。长期工程、内部吸收与阶段选择如何相互支持，为什么培训和单次上线难以承担全部持续变化。\n\n第四，怎样经营可调度智能资源。token投入如何形成合格工作，合格工作如何兑现结果，本轮工作又怎样提高下一次能力；模型费、人工、容量和维护都要进入这条链。\n\n## 怎样阅读\n\n不需要先具备软件开发知识。课程假定你熟悉人员、业务与经营中的常见取舍；新概念会在具体问题中解释。\n\n按顺序阅读，可以从变化机制走到一份完整改造提案。已有明确问题时，也可以从相关部分进入，再补必要背景。目录按八部分组织，搜索覆盖全部正文、案例和参考材料。\n\n| 阅读部分 | 需要建立的判断 | 起点 |\n|---|---|---|\n| 变化 | AI怎样传到企业能力与产业竞争 | 第1章 |\n| 积累 | 经验怎样成为组织下一次能用的能力 | 第5章 |\n| 优势与现场 | 值得改什么，FDE怎样发现与实现 | 第11章 |\n| 智能伙伴 | 信息、分工、行动和持续运行 | 第17章 |\n| 智能资源经营 | 任务配置、整链容量、成本和留存 | 第23章 |\n| 证据与更新 | 任务合格、业务有效和真正学会 | 第29章 |\n| 组织与共建 | 激励、长期FDE与内部接续 | 第33章 |\n| 持续发展 | 路线、新服务、行业与完整提案 | 第37章 |\n\n阅读不以提交作业作为继续条件。工作簿与案例推演可以在需要时使用；阅读位置只表示读到哪里，不代表已经掌握。\n\n## 四组教学案例，分别帮助看清什么\n\n连锁备货案例贯穿客户价值、现场信息、分配、反例与新店迁移。它保留生产配送约束，避免把模型能力当作全部经营结果。\n\n智能成本案例比较同等合格任务的模型费、核验和返工，并把工时释放与现金改善分开。\n\n设备售后案例追踪原始描述、动作、错误草稿、候选解释、接任与真实服务状态。\n\n专业服务案例展开生成扩产、专家瓶颈、阶段选择与新服务设计。\n\n四组企业、条件与业务数字都是教学设定。正文另使用客服、Zara、宝洁、办公和开发等公开研究，各自支持不同范围的判断。相关原文与实际采用范围见研究与延伸阅读。\n\n## 这门课最终要形成什么\n\n你可以带着自己的一条业务读，也可以先用教学案例走完。最终成果是一份能够向经营、业务和工程说明的提案：客户为何需要，企业何以做到，AI与FDE分别承担什么，结果怎样检验，资源怎样兑现，下一阶段如何选择。\n\n一份好的提案可以有未知，但每个重要未知应能说明怎样取得证据。课程希望帮助建立的，是主动建设与持续更新判断的能力。\n\n从第1章：企业得到了什么新供给开始。\n"},{"file":"01-智能供给.md","id":"lesson-01","number":1,"role":"核心课","part":0,"title":"第1章｜从购买软件到调用智能，企业得到了什么","md":"# 第1章｜从购买软件到调用智能，企业得到了什么\n\n设想一家设备服务公司的客服收到客户发来的几张照片、一段语音和一句“又停了，下午要用”。客服需要弄清设备是哪一台、以前有没有相似问题、保修是否有效，再把可用材料交给技术员。\n\n过去，企业可以为这套工作开发系统：登记设备、查保修日期、按地区派单。系统能稳定完成已经规定好的事情。但客户的说法不统一，照片没有固定格式，“又停了”还依赖以前发生过什么。要处理这些材料，往往仍要有人逐项理解、询问和整理。\n\n基础模型带来的变化，是企业可以先取得一部分通用的阅读、比较、表达与推理能力，再把它适配到自己的任务。**许多认知工作的起点，从“先为这项任务制造能力”，变成了“先调用已有能力，再补企业条件”。** 这改变了尝试成本，也改变了企业需要建设的部分。\n\n## 几类技术，减少的是不同的准备工作\n\n规则程序适合条件明确的工作。例如“购买日期加保修期，判断是否到期”，只要日期与规则正确，程序可以重复执行。它的能力主要来自人预先写清的步骤，适合精确、稳定的要求。\n\n专用机器学习从相关样本中学习模式。例如根据设备的历史运行数据预测某类故障。企业需要定义目标、准备样本，并检查这个模型在目标环境中是否可靠。它未必能顺带读懂客服邮件或撰写服务说明。\n\n基础模型则在广泛材料上形成部分可迁移能力。同一个模型可能协助理解客户描述、归纳历史工单、比较不同方案，也可能生成代码。它不要求每遇到一种文字处理需求，都从零训练一套专用模型。这是“基础”的一个含义：它提供可进一步适配的底层能力，而非已经完成全部企业工作。\n\nAgent进一步把模型安排进连续任务。它可以先查资料，发现缺项后提出补问，再调用业务工具，检查结果并决定下一步。企业得到的可能不再只是一个答案，而是一段能够持续推进的工作供给。工作能否可靠完成，还取决于材料、工具和安排。\n\n| 企业要完成的事 | 合适的能力起点 | 仍需明确的企业条件 |\n|---|---|---|\n| 判断保修日期 | 规则与现有系统 | 设备身份、有效日期、当前保修规则 |\n| 从散乱材料整理报修经过 | 通用语言与多模态能力 | 原始材料、历史关联、事实与猜测的区别 |\n| 连续跟进一张工单 | 模型、工具与任务安排 | 谁能派工、完成状态、异常与反馈入口 |\n\n这些方法可以同时存在。用模型计算一个确定日期，可能比直接查表更贵、更难核对；用固定字段处理所有现场描述，又可能丢失重要情境。成熟选择来自任务要求。\n\n## 模型会读材料，为什么还不懂本企业\n\n回到这张教学工单。“下午要用”说明客户有时效要求，却没有说明企业还有没有现场人员、能否提供替代设备、谁可以承诺到场时间。\n\n这些信息分布在排班、库存、服务合同和人员判断中。模型即使能提出一套合理方案，也不能凭通用知识补出当前可用的人和物。企业要做的，是把通用能力接到自己的事实、方法与行动条件上。\n\n这也是不同企业使用同一模型，结果可能不同的原因。一家企业的设备身份清楚、历史工单可追踪、专业人员愿意纠正错误；另一家企业连工单是否实际完成都说不清。同样的模型，进入的是不同的生产条件。\n\n在组织研究中，Cohen与Levinthal把识别、吸收并应用外部知识的能力称为“吸收能力”。它解释了一个重要关系：已有相关经验会影响企业能否用好新供给。它并不意味着必须先建立完美基础才能开始，而是提醒企业在采用中持续形成相关知识。[原始论文](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n## 使用一次工具，与形成采用能力\n\n首次尝试可能只需要把几张工单交给模型，观察它能否整理出有用材料。继续使用时，企业就要回答更具体的问题：哪些遗漏最常见，谁能发现错误，正确结果怎样进入派工，运行后怎样知道客户恢复了。\n\n对这些问题的回答，会成为下一轮采用的基础。企业逐渐知道哪些任务值得用AI、需要怎样的输入、如何评价、何时可以扩大委派。这个过程本身也是能力建设。\n\n软件客服的实地研究提供了一个现实参照：AI在真实对话中提供建议，员工可以采用、修改或忽略；不同经验群体的表现变化并不相同。这表明通用供给必须通过具体使用方式发生作用。研究观察的是特定公司与工作，不能直接推成任何企业的利润增长。[研究原文](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)\n\n因而，企业最初要辨认的，不是“我们用了哪一代AI”，而是新供给具体减少哪种准备、还缺什么条件，以及使用过程中是否增加了下一次采用的能力。理解这一点，才能进一步解释：已有数字化保存了很多数据，为什么仍有大量工作价值没有留下。\n","html":"\u003ch1>第1章｜从购买软件到调用智能，企业得到了什么\u003c/h1>\n\u003cp>设想一家设备服务公司的客服收到客户发来的几张照片、一段语音和一句“又停了，下午要用”。客服需要弄清设备是哪一台、以前有没有相似问题、保修是否有效，再把可用材料交给技术员。\u003c/p>\n\u003cp>过去，企业可以为这套工作开发系统：登记设备、查保修日期、按地区派单。系统能稳定完成已经规定好的事情。但客户的说法不统一，照片没有固定格式，“又停了”还依赖以前发生过什么。要处理这些材料，往往仍要有人逐项理解、询问和整理。\u003c/p>\n\u003cp>基础模型带来的变化，是企业可以先取得一部分通用的阅读、比较、表达与推理能力，再把它适配到自己的任务。\u003cstrong>许多认知工作的起点，从“先为这项任务制造能力”，变成了“先调用已有能力，再补企业条件”。\u003c/strong> 这改变了尝试成本，也改变了企业需要建设的部分。\u003c/p>\n\u003ch2 id=\"lesson-01-section-1\">几类技术，减少的是不同的准备工作\u003c/h2>\n\u003cp>规则程序适合条件明确的工作。例如“购买日期加保修期，判断是否到期”，只要日期与规则正确，程序可以重复执行。它的能力主要来自人预先写清的步骤，适合精确、稳定的要求。\u003c/p>\n\u003cp>专用机器学习从相关样本中学习模式。例如根据设备的历史运行数据预测某类故障。企业需要定义目标、准备样本，并检查这个模型在目标环境中是否可靠。它未必能顺带读懂客服邮件或撰写服务说明。\u003c/p>\n\u003cp>基础模型则在广泛材料上形成部分可迁移能力。同一个模型可能协助理解客户描述、归纳历史工单、比较不同方案，也可能生成代码。它不要求每遇到一种文字处理需求，都从零训练一套专用模型。这是“基础”的一个含义：它提供可进一步适配的底层能力，而非已经完成全部企业工作。\u003c/p>\n\u003cp>Agent进一步把模型安排进连续任务。它可以先查资料，发现缺项后提出补问，再调用业务工具，检查结果并决定下一步。企业得到的可能不再只是一个答案，而是一段能够持续推进的工作供给。工作能否可靠完成，还取决于材料、工具和安排。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>企业要完成的事\u003c/th>\n\u003cth>合适的能力起点\u003c/th>\n\u003cth>仍需明确的企业条件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>判断保修日期\u003c/td>\n\u003ctd>规则与现有系统\u003c/td>\n\u003ctd>设备身份、有效日期、当前保修规则\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>从散乱材料整理报修经过\u003c/td>\n\u003ctd>通用语言与多模态能力\u003c/td>\n\u003ctd>原始材料、历史关联、事实与猜测的区别\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>连续跟进一张工单\u003c/td>\n\u003ctd>模型、工具与任务安排\u003c/td>\n\u003ctd>谁能派工、完成状态、异常与反馈入口\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>这些方法可以同时存在。用模型计算一个确定日期，可能比直接查表更贵、更难核对；用固定字段处理所有现场描述，又可能丢失重要情境。成熟选择来自任务要求。\u003c/p>\n\u003ch2 id=\"lesson-01-section-2\">模型会读材料，为什么还不懂本企业\u003c/h2>\n\u003cp>回到这张教学工单。“下午要用”说明客户有时效要求，却没有说明企业还有没有现场人员、能否提供替代设备、谁可以承诺到场时间。\u003c/p>\n\u003cp>这些信息分布在排班、库存、服务合同和人员判断中。模型即使能提出一套合理方案，也不能凭通用知识补出当前可用的人和物。企业要做的，是把通用能力接到自己的事实、方法与行动条件上。\u003c/p>\n\u003cp>这也是不同企业使用同一模型，结果可能不同的原因。一家企业的设备身份清楚、历史工单可追踪、专业人员愿意纠正错误；另一家企业连工单是否实际完成都说不清。同样的模型，进入的是不同的生产条件。\u003c/p>\n\u003cp>在组织研究中，Cohen与Levinthal把识别、吸收并应用外部知识的能力称为“吸收能力”。它解释了一个重要关系：已有相关经验会影响企业能否用好新供给。它并不意味着必须先建立完美基础才能开始，而是提醒企业在采用中持续形成相关知识。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始论文\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-01-section-3\">使用一次工具，与形成采用能力\u003c/h2>\n\u003cp>首次尝试可能只需要把几张工单交给模型，观察它能否整理出有用材料。继续使用时，企业就要回答更具体的问题：哪些遗漏最常见，谁能发现错误，正确结果怎样进入派工，运行后怎样知道客户恢复了。\u003c/p>\n\u003cp>对这些问题的回答，会成为下一轮采用的基础。企业逐渐知道哪些任务值得用AI、需要怎样的输入、如何评价、何时可以扩大委派。这个过程本身也是能力建设。\u003c/p>\n\u003cp>软件客服的实地研究提供了一个现实参照：AI在真实对话中提供建议，员工可以采用、修改或忽略；不同经验群体的表现变化并不相同。这表明通用供给必须通过具体使用方式发生作用。研究观察的是特定公司与工作，不能直接推成任何企业的利润增长。\u003ca href=\"https://danielle.li/assets/docs/GenerativeAIatWork.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">研究原文\u003c/a>\u003c/p>\n\u003cp>因而，企业最初要辨认的，不是“我们用了哪一代AI”，而是新供给具体减少哪种准备、还缺什么条件，以及使用过程中是否增加了下一次采用的能力。理解这一点，才能进一步解释：已有数字化保存了很多数据，为什么仍有大量工作价值没有留下。\u003c/p>\n","headings":[{"id":"lesson-01-section-1","label":"几类技术，减少的是不同的准备工作"},{"id":"lesson-01-section-2","label":"模型会读材料，为什么还不懂本企业"},{"id":"lesson-01-section-3","label":"使用一次工具，与形成采用能力"}],"exportMd":"# 第1章｜从购买软件到调用智能，企业得到了什么\n\n设想一家设备服务公司的客服收到客户发来的几张照片、一段语音和一句“又停了，下午要用”。客服需要弄清设备是哪一台、以前有没有相似问题、保修是否有效，再把可用材料交给技术员。\n\n过去，企业可以为这套工作开发系统：登记设备、查保修日期、按地区派单。系统能稳定完成已经规定好的事情。但客户的说法不统一，照片没有固定格式，“又停了”还依赖以前发生过什么。要处理这些材料，往往仍要有人逐项理解、询问和整理。\n\n基础模型带来的变化，是企业可以先取得一部分通用的阅读、比较、表达与推理能力，再把它适配到自己的任务。**许多认知工作的起点，从“先为这项任务制造能力”，变成了“先调用已有能力，再补企业条件”。** 这改变了尝试成本，也改变了企业需要建设的部分。\n\n## 几类技术，减少的是不同的准备工作\n\n规则程序适合条件明确的工作。例如“购买日期加保修期，判断是否到期”，只要日期与规则正确，程序可以重复执行。它的能力主要来自人预先写清的步骤，适合精确、稳定的要求。\n\n专用机器学习从相关样本中学习模式。例如根据设备的历史运行数据预测某类故障。企业需要定义目标、准备样本，并检查这个模型在目标环境中是否可靠。它未必能顺带读懂客服邮件或撰写服务说明。\n\n基础模型则在广泛材料上形成部分可迁移能力。同一个模型可能协助理解客户描述、归纳历史工单、比较不同方案，也可能生成代码。它不要求每遇到一种文字处理需求，都从零训练一套专用模型。这是“基础”的一个含义：它提供可进一步适配的底层能力，而非已经完成全部企业工作。\n\nAgent进一步把模型安排进连续任务。它可以先查资料，发现缺项后提出补问，再调用业务工具，检查结果并决定下一步。企业得到的可能不再只是一个答案，而是一段能够持续推进的工作供给。工作能否可靠完成，还取决于材料、工具和安排。\n\n| 企业要完成的事 | 合适的能力起点 | 仍需明确的企业条件 |\n|---|---|---|\n| 判断保修日期 | 规则与现有系统 | 设备身份、有效日期、当前保修规则 |\n| 从散乱材料整理报修经过 | 通用语言与多模态能力 | 原始材料、历史关联、事实与猜测的区别 |\n| 连续跟进一张工单 | 模型、工具与任务安排 | 谁能派工、完成状态、异常与反馈入口 |\n\n这些方法可以同时存在。用模型计算一个确定日期，可能比直接查表更贵、更难核对；用固定字段处理所有现场描述，又可能丢失重要情境。成熟选择来自任务要求。\n\n## 模型会读材料，为什么还不懂本企业\n\n回到这张教学工单。“下午要用”说明客户有时效要求，却没有说明企业还有没有现场人员、能否提供替代设备、谁可以承诺到场时间。\n\n这些信息分布在排班、库存、服务合同和人员判断中。模型即使能提出一套合理方案，也不能凭通用知识补出当前可用的人和物。企业要做的，是把通用能力接到自己的事实、方法与行动条件上。\n\n这也是不同企业使用同一模型，结果可能不同的原因。一家企业的设备身份清楚、历史工单可追踪、专业人员愿意纠正错误；另一家企业连工单是否实际完成都说不清。同样的模型，进入的是不同的生产条件。\n\n在组织研究中，Cohen与Levinthal把识别、吸收并应用外部知识的能力称为“吸收能力”。它解释了一个重要关系：已有相关经验会影响企业能否用好新供给。它并不意味着必须先建立完美基础才能开始，而是提醒企业在采用中持续形成相关知识。[原始论文](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n## 使用一次工具，与形成采用能力\n\n首次尝试可能只需要把几张工单交给模型，观察它能否整理出有用材料。继续使用时，企业就要回答更具体的问题：哪些遗漏最常见，谁能发现错误，正确结果怎样进入派工，运行后怎样知道客户恢复了。\n\n对这些问题的回答，会成为下一轮采用的基础。企业逐渐知道哪些任务值得用AI、需要怎样的输入、如何评价、何时可以扩大委派。这个过程本身也是能力建设。\n\n软件客服的实地研究提供了一个现实参照：AI在真实对话中提供建议，员工可以采用、修改或忽略；不同经验群体的表现变化并不相同。这表明通用供给必须通过具体使用方式发生作用。研究观察的是特定公司与工作，不能直接推成任何企业的利润增长。[研究原文](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)\n\n因而，企业最初要辨认的，不是“我们用了哪一代AI”，而是新供给具体减少哪种准备、还缺什么条件，以及使用过程中是否增加了下一次采用的能力。理解这一点，才能进一步解释：已有数字化保存了很多数据，为什么仍有大量工作价值没有留下。\n","exportSingleMd":"# 第1章｜从购买软件到调用智能，企业得到了什么\n\n设想一家设备服务公司的客服收到客户发来的几张照片、一段语音和一句“又停了，下午要用”。客服需要弄清设备是哪一台、以前有没有相似问题、保修是否有效，再把可用材料交给技术员。\n\n过去，企业可以为这套工作开发系统：登记设备、查保修日期、按地区派单。系统能稳定完成已经规定好的事情。但客户的说法不统一，照片没有固定格式，“又停了”还依赖以前发生过什么。要处理这些材料，往往仍要有人逐项理解、询问和整理。\n\n基础模型带来的变化，是企业可以先取得一部分通用的阅读、比较、表达与推理能力，再把它适配到自己的任务。**许多认知工作的起点，从“先为这项任务制造能力”，变成了“先调用已有能力，再补企业条件”。** 这改变了尝试成本，也改变了企业需要建设的部分。\n\n## 几类技术，减少的是不同的准备工作\n\n规则程序适合条件明确的工作。例如“购买日期加保修期，判断是否到期”，只要日期与规则正确，程序可以重复执行。它的能力主要来自人预先写清的步骤，适合精确、稳定的要求。\n\n专用机器学习从相关样本中学习模式。例如根据设备的历史运行数据预测某类故障。企业需要定义目标、准备样本，并检查这个模型在目标环境中是否可靠。它未必能顺带读懂客服邮件或撰写服务说明。\n\n基础模型则在广泛材料上形成部分可迁移能力。同一个模型可能协助理解客户描述、归纳历史工单、比较不同方案，也可能生成代码。它不要求每遇到一种文字处理需求，都从零训练一套专用模型。这是“基础”的一个含义：它提供可进一步适配的底层能力，而非已经完成全部企业工作。\n\nAgent进一步把模型安排进连续任务。它可以先查资料，发现缺项后提出补问，再调用业务工具，检查结果并决定下一步。企业得到的可能不再只是一个答案，而是一段能够持续推进的工作供给。工作能否可靠完成，还取决于材料、工具和安排。\n\n| 企业要完成的事 | 合适的能力起点 | 仍需明确的企业条件 |\n|---|---|---|\n| 判断保修日期 | 规则与现有系统 | 设备身份、有效日期、当前保修规则 |\n| 从散乱材料整理报修经过 | 通用语言与多模态能力 | 原始材料、历史关联、事实与猜测的区别 |\n| 连续跟进一张工单 | 模型、工具与任务安排 | 谁能派工、完成状态、异常与反馈入口 |\n\n这些方法可以同时存在。用模型计算一个确定日期，可能比直接查表更贵、更难核对；用固定字段处理所有现场描述，又可能丢失重要情境。成熟选择来自任务要求。\n\n## 模型会读材料，为什么还不懂本企业\n\n回到这张教学工单。“下午要用”说明客户有时效要求，却没有说明企业还有没有现场人员、能否提供替代设备、谁可以承诺到场时间。\n\n这些信息分布在排班、库存、服务合同和人员判断中。模型即使能提出一套合理方案，也不能凭通用知识补出当前可用的人和物。企业要做的，是把通用能力接到自己的事实、方法与行动条件上。\n\n这也是不同企业使用同一模型，结果可能不同的原因。一家企业的设备身份清楚、历史工单可追踪、专业人员愿意纠正错误；另一家企业连工单是否实际完成都说不清。同样的模型，进入的是不同的生产条件。\n\n在组织研究中，Cohen与Levinthal把识别、吸收并应用外部知识的能力称为“吸收能力”。它解释了一个重要关系：已有相关经验会影响企业能否用好新供给。它并不意味着必须先建立完美基础才能开始，而是提醒企业在采用中持续形成相关知识。[原始论文](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n## 使用一次工具，与形成采用能力\n\n首次尝试可能只需要把几张工单交给模型，观察它能否整理出有用材料。继续使用时，企业就要回答更具体的问题：哪些遗漏最常见，谁能发现错误，正确结果怎样进入派工，运行后怎样知道客户恢复了。\n\n对这些问题的回答，会成为下一轮采用的基础。企业逐渐知道哪些任务值得用AI、需要怎样的输入、如何评价、何时可以扩大委派。这个过程本身也是能力建设。\n\n软件客服的实地研究提供了一个现实参照：AI在真实对话中提供建议，员工可以采用、修改或忽略；不同经验群体的表现变化并不相同。这表明通用供给必须通过具体使用方式发生作用。研究观察的是特定公司与工作，不能直接推成任何企业的利润增长。[研究原文](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)\n\n因而，企业最初要辨认的，不是“我们用了哪一代AI”，而是新供给具体减少哪种准备、还缺什么条件，以及使用过程中是否增加了下一次采用的能力。理解这一点，才能进一步解释：已有数字化保存了很多数据，为什么仍有大量工作价值没有留下。\n","text":"# 第1章｜从购买软件到调用智能，企业得到了什么\n\n设想一家设备服务公司的客服收到客户发来的几张照片、一段语音和一句“又停了，下午要用”。客服需要弄清设备是哪一台、以前有没有相似问题、保修是否有效，再把可用材料交给技术员。\n\n过去，企业可以为这套工作开发系统：登记设备、查保修日期、按地区派单。系统能稳定完成已经规定好的事情。但客户的说法不统一，照片没有固定格式，“又停了”还依赖以前发生过什么。要处理这些材料，往往仍要有人逐项理解、询问和整理。\n\n基础模型带来的变化，是企业可以先取得一部分通用的阅读、比较、表达与推理能力，再把它适配到自己的任务。**许多认知工作的起点，从“先为这项任务制造能力”，变成了“先调用已有能力，再补企业条件”。** 这改变了尝试成本，也改变了企业需要建设的部分。\n\n## 几类技术，减少的是不同的准备工作\n\n规则程序适合条件明确的工作。例如“购买日期加保修期，判断是否到期”，只要日期与规则正确，程序可以重复执行。它的能力主要来自人预先写清的步骤，适合精确、稳定的要求。\n\n专用机器学习从相关样本中学习模式。例如根据设备的历史运行数据预测某类故障。企业需要定义目标、准备样本，并检查这个模型在目标环境中是否可靠。它未必能顺带读懂客服邮件或撰写服务说明。\n\n基础模型则在广泛材料上形成部分可迁移能力。同一个模型可能协助理解客户描述、归纳历史工单、比较不同方案，也可能生成代码。它不要求每遇到一种文字处理需求，都从零训练一套专用模型。这是“基础”的一个含义：它提供可进一步适配的底层能力，而非已经完成全部企业工作。\n\nAgent进一步把模型安排进连续任务。它可以先查资料，发现缺项后提出补问，再调用业务工具，检查结果并决定下一步。企业得到的可能不再只是一个答案，而是一段能够持续推进的工作供给。工作能否可靠完成，还取决于材料、工具和安排。\n\n| 企业要完成的事 | 合适的能力起点 | 仍需明确的企业条件 |\n|---|---|---|\n| 判断保修日期 | 规则与现有系统 | 设备身份、有效日期、当前保修规则 |\n| 从散乱材料整理报修经过 | 通用语言与多模态能力 | 原始材料、历史关联、事实与猜测的区别 |\n| 连续跟进一张工单 | 模型、工具与任务安排 | 谁能派工、完成状态、异常与反馈入口 |\n\n这些方法可以同时存在。用模型计算一个确定日期，可能比直接查表更贵、更难核对；用固定字段处理所有现场描述，又可能丢失重要情境。成熟选择来自任务要求。\n\n## 模型会读材料，为什么还不懂本企业\n\n回到这张教学工单。“下午要用”说明客户有时效要求，却没有说明企业还有没有现场人员、能否提供替代设备、谁可以承诺到场时间。\n\n这些信息分布在排班、库存、服务合同和人员判断中。模型即使能提出一套合理方案，也不能凭通用知识补出当前可用的人和物。企业要做的，是把通用能力接到自己的事实、方法与行动条件上。\n\n这也是不同企业使用同一模型，结果可能不同的原因。一家企业的设备身份清楚、历史工单可追踪、专业人员愿意纠正错误；另一家企业连工单是否实际完成都说不清。同样的模型，进入的是不同的生产条件。\n\n在组织研究中，Cohen与Levinthal把识别、吸收并应用外部知识的能力称为“吸收能力”。它解释了一个重要关系：已有相关经验会影响企业能否用好新供给。它并不意味着必须先建立完美基础才能开始，而是提醒企业在采用中持续形成相关知识。原始论文\n\n## 使用一次工具，与形成采用能力\n\n首次尝试可能只需要把几张工单交给模型，观察它能否整理出有用材料。继续使用时，企业就要回答更具体的问题：哪些遗漏最常见，谁能发现错误，正确结果怎样进入派工，运行后怎样知道客户恢复了。\n\n对这些问题的回答，会成为下一轮采用的基础。企业逐渐知道哪些任务值得用AI、需要怎样的输入、如何评价、何时可以扩大委派。这个过程本身也是能力建设。\n\n软件客服的实地研究提供了一个现实参照：AI在真实对话中提供建议，员工可以采用、修改或忽略；不同经验群体的表现变化并不相同。这表明通用供给必须通过具体使用方式发生作用。研究观察的是特定公司与工作，不能直接推成任何企业的利润增长。研究原文\n\n因而，企业最初要辨认的，不是“我们用了哪一代AI”，而是新供给具体减少哪种准备、还缺什么条件，以及使用过程中是否增加了下一次采用的能力。理解这一点，才能进一步解释：已有数字化保存了很多数据，为什么仍有大量工作价值没有留下。\n"},{"file":"02-数字化的积累边界.md","id":"lesson-02","number":2,"role":"核心课","part":0,"title":"第2章｜系统记录了很多，企业为什么仍在反复从头做起","md":"# 第2章｜系统记录了很多，企业为什么仍在反复从头做起\n\n在连锁备货的教学情境中，企业有收银系统、库存表和每日销售报表。总部知道每家店卖出多少、剩余多少，也有统一备货流程。可一位熟悉客流的店长离开后，新店长仍需要花很久摸索：什么时段容易缺货、临时活动意味着什么、哪些老顾客的询问值得提前准备。\n\n这并不说明过去的数字化没有价值。它说明企业保存的内容，与实际工作依赖的内容，并没有完全重合。\n\n**过去较容易积累的是已被定义的事实与流程；较难留下的是情境、判断依据、例外处理和协作经验。AI的重要机会，在于改变后面这些内容进入生产与积累的成本。**\n\n## 一条完整销售记录，也可能缺少决定含义\n\n下面采用贯穿课程的教学案例。企业有8家门店与中央生产团队，只先看X、Y两店的一种商品。两店各配80个，X卖完80个，Y卖出60个、剩20个。X在18点售罄，后来仍有顾客询问；Y正常营业到20点。\n\n收银记录没有错。问题是，X卖出80个，不能说明它当天只需要80个。卖完以后无法继续成交，潜在需求被供给限制挡在了记录之外。询问也不能直接补成需求数量：有人可能改买其他商品，有人可能只是随口问，当前仍有未知。\n\n![X店销量到达配货上限后，未满足需求不再表现为成交；Y店则存在未售库存。相同配货下，销量记录不能独立代表需求。](assets/02-销量与需求.svg)\n\n如果总部只按历史销量备货，X的高需求可能一直没有机会显现。这个例子说明，数据可以准确，却仍不足以回答经营问题。关键不是再增加一个图表，而是把“数字在什么条件下产生”带回判断。\n\n## 为什么系统更容易保存结果\n\n系统要形成一个字段，通常先要有人决定记录什么、采用什么口径、在哪一步填写。商品、数量、时间和付款状态容易定义，因而适合稳定记录。\n\n现场判断的形态更复杂。一位店长可能综合天气、地铁出口施工、附近活动和前几天的询问，决定改变备货。哪些因素重要，往往是在遇到例外后才逐渐认识的。企业若要求每次都先建立完整分类，再把所有理由写成标准字段，准备与维护成本就会很高。\n\n过去还有人工复盘、师徒传承、共同实践等办法，许多企业也靠这些办法形成了很强的能力。问题在于覆盖范围：专家有限，解释会占用生产时间；当任务数量增加、人员变动或协作拉长，一部分经验就容易失去入口。\n\n组织知识研究将个人实践、表达与共同使用看成相互联系的过程。这提醒我们，知识既不只在数据库里，也不会因为写成文字就完成传承。[Nonaka的组织知识研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)\n\n## AI带来的增量，落在积累的哪一步\n\n假设店长原来就会在工作群里说明“18点卖光，后来仍有人问，明天请多配”。人工整理日报时，这句话可能只剩“销量80”。要在未来使用它，还需要重新翻聊天、辨认商品和日期、询问当事人。\n\nAI可以承担其中一部分匹配与组织工作：把原消息对应到门店、商品和营业日；保留售罄时点；区分已知事实与请求；在下一次分配任务中带回相关材料。它也可以先起草经验记录，让人员纠正关键差别，减少从空白重新总结的负担。\n\n这里有一条具体的成本机制：**同一份材料先服务当前生产，再成为下一轮的候选经验。** 原来分开的“做事”和“做完后整理”开始共享输入。是否真的更便宜，还要计入人员纠正、系统关联与后续维护，不能只比较生成速度。\n\n## 不必等到所有事情都成为SOP\n\n如果企业必须先把全部经验解释成明确规则，才能使用AI，大量现场知识仍会停在门外。更可行的起点，是先围绕一条业务建立必要秩序：对象对应得上，发生时间清楚，建议与实际行动分开，结果能返回。\n\n尚未形成稳定规则的经验，可以先以带条件的案例存在。比如“某次交通活动期间晚高峰需求增加”，保留当时情况与结果，供相似任务参考。经过比较后，再决定哪些部分值得形成标准，哪些需要继续观察。\n\n传统数字化也已经做过这种工作。Zara的库存分配研究发现，关键尺码缺货会影响整款商品的展示，现场规则因此改变了分配模型的设计。它证明现场认识与系统工程结合早已有价值；生成式AI的新作用，需要具体落在材料处理与经验调用等新增环节。[案例原文](https://web.mit.edu/people/jgallien/ZaraOR2010.pdf)\n\n企业因此可以从更小的完整业务开始，同时建设数字化和智能化。真正值得追踪的是：更多有效经验能否以可承受的成本进入下一次工作，而不是系统里又增加了多少文档。\n","html":"\u003ch1>第2章｜系统记录了很多，企业为什么仍在反复从头做起\u003c/h1>\n\u003cp>在连锁备货的教学情境中，企业有收银系统、库存表和每日销售报表。总部知道每家店卖出多少、剩余多少，也有统一备货流程。可一位熟悉客流的店长离开后，新店长仍需要花很久摸索：什么时段容易缺货、临时活动意味着什么、哪些老顾客的询问值得提前准备。\u003c/p>\n\u003cp>这并不说明过去的数字化没有价值。它说明企业保存的内容，与实际工作依赖的内容，并没有完全重合。\u003c/p>\n\u003cp>\u003cstrong>过去较容易积累的是已被定义的事实与流程；较难留下的是情境、判断依据、例外处理和协作经验。AI的重要机会，在于改变后面这些内容进入生产与积累的成本。\u003c/strong>\u003c/p>\n\u003ch2 id=\"lesson-02-section-1\">一条完整销售记录，也可能缺少决定含义\u003c/h2>\n\u003cp>下面采用贯穿课程的教学案例。企业有8家门店与中央生产团队，只先看X、Y两店的一种商品。两店各配80个，X卖完80个，Y卖出60个、剩20个。X在18点售罄，后来仍有顾客询问；Y正常营业到20点。\u003c/p>\n\u003cp>收银记录没有错。问题是，X卖出80个，不能说明它当天只需要80个。卖完以后无法继续成交，潜在需求被供给限制挡在了记录之外。询问也不能直接补成需求数量：有人可能改买其他商品，有人可能只是随口问，当前仍有未知。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNDYwIiB2aWV3Qm94PSIwIDAgMzYwIDQ2MCIgcm9sZT0iaW1nIj48dGl0bGU+6ZSA6YeP5LiN562J5LqO5YWo6YOo6ZyA5rGCPC90aXRsZT48ZGVzYz7mlZnlrabmoYjkvovvvJpY5Y2W5a6MODDkuKrlkI7pnIDmsYLmnKrnn6XvvIxZ5Y2W5Ye6NjDkuKrliakyMOS4quOAguaWnOe6ueWPquihqOekuuacquiuoemHj++8jOS4jeaMiemrmOW6puS8sOeul+mcgOaxguOAgjwvZGVzYz48ZGVmcz48bWFya2VyIGlkPSJhcnJvdyIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8tc3RhcnQtcmV2ZXJzZSI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTB6IiBmaWxsPSIjMTY1ZDUyIi8+PC9tYXJrZXI+PHBhdHRlcm4gaWQ9InVua25vd24iIHdpZHRoPSI4IiBoZWlnaHQ9IjgiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPjxwYXRoIGQ9Ik0tMiAyTDIgLTJNMCA4TDggME02IDEwTDEwIDYiIHN0cm9rZT0iIzg3NWQyMiIgc3Ryb2tlLXdpZHRoPSIxLjUiLz48L3BhdHRlcm4+PC9kZWZzPjxyZWN0IHdpZHRoPSIzNjAiIGhlaWdo 段，准备与维护成本就会很高。\u003c/p>\n\u003cp>过去还有人工复盘、师徒传承、共同实践等办法，许多企业也靠这些办法形成了很强的能力。问题在于覆盖范围：专家有限，解释会占用生产时间；当任务数量增加、人员变动或协作拉长，一部分经验就容易失去入口。\u003c/p>\n\u003cp>组织知识研究将个人实践、表达与共同使用看成相互联系的过程。这提醒我们，知识既不只在数据库里，也不会因为写成文字就完成传承。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Nonaka的组织知识研究\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-02-section-3\">AI带来的增量，落在积累的哪一步\u003c/h2>\n\u003cp>假设店长原来就会在工作群里说明“18点卖光，后来仍有人问，明天请多配”。人工整理日报时，这句话可能只剩“销量80”。要在未来使用它，还需要重新翻聊天、辨认商品和日期、询问当事人。\u003c/p>\n\u003cp>AI可以承担其中一部分匹配与组织工作：把原消息对应到门店、商品和营业日；保留售罄时点；区分已知事实与请求；在下一次分配任务中带回相关材料。它也可以先起草经验记录，让人员纠正关键差别，减少从空白重新总结的负担。\u003c/p>\n\u003cp>这里有一条具体的成本机制：\u003cstrong>同一份材料先服务当前生产，再成为下一轮的候选经验。\u003c/strong> 原来分开的“做事”和“做完后整理”开始共享输入。是否真的更便宜，还要计入人员纠正、系统关联与后续维护，不能只比较生成速度。\u003c/p>\n\u003ch2 id=\"lesson-02-section-4\">不必等到所有事情都成为SOP\u003c/h2>\n\u003cp>如果企业必须先把全部经验解释成明确规则，才能使用AI，大量现场知识仍会停在门外。更可行的起点，是先围绕一条业务建立必要秩序：对象对应得上，发生时间清楚，建议与实际行动分开，结果能返回。\u003c/p>\n\u003cp>尚未形成稳定规则的经验，可以先以带条件的案例存在。比如“某次交通活动期间晚高峰需求增加”，保留当时情况与结果，供相似任务参考。经过比较后，再决定哪些部分值得形成标准，哪些需要继续观察。\u003c/p>\n\u003cp>传统数字化也已经做过这种工作。Zara的库存分配研究发现，关键尺码缺货会影响整款商品的展示，现场规则因此改变了分配模型的设计。它证明现场认识与系统工程结合早已有价值；生成式AI的新作用，需要具体落在材料处理与经验调用等新增环节。\u003ca href=\"https://web.mit.edu/people/jgallien/ZaraOR2010.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">案例原文\u003c/a>\u003c/p>\n\u003cp>企业因此可以从更小的完整业务开始，同时建设数字化和智能化。真正值得追踪的是：更多有效经验能否以可承受的成本进入下一次工作，而不是系统里又增加了多少文档。\u003c/p>\n","headings":[{"id":"lesson-02-section-1","label":"一条完整销售记录，也可能缺少决定含义"},{"id":"lesson-02-section-2","label":"为什么系统更容易保存结果"},{"id":"lesson-02-section-3","label":"AI带来的增量，落在积累的哪一步"},{"id":"lesson-02-section-4","label":"不必等到所有事情都成为SOP"}],"exportMd":"# 第2章｜系统记录了很多，企业为什么仍在反复从头做起\n\n在连锁备货的教学情境中，企业有收银系统、库存表和每日销售报表。总部知道每家店卖出多少、剩余多少，也有统一备货流程。可一位熟悉客流的店长离开后，新店长仍需要花很久摸索：什么时段容易缺货、临时活动意味着什么、哪些老顾客的询问值得提前准备。\n\n这并不说明过去的数字化没有价值。它说明企业保存的内容，与实际工作依赖的内容，并没有完全重合。\n\n**过去较容易积累的是已被定义的事实与流程；较难留下的是情境、判断依据、例外处理和协作经验。AI的重要机会，在于改变后面这些内容进入生产与积累的成本。**\n\n## 一条完整销售记录，也可能缺少决定含义\n\n下面采用贯穿课程的教学案例。企业有8家门店与中央生产团队，只先看X、Y两店的一种商品。两店各配80个，X卖完80个，Y卖出60个、剩20个。X在18点售罄，后来仍有顾客询问；Y正常营业到20点。\n\n收银记录没有错。问题是，X卖出80个，不能说明它当天只需要80个。卖完以后无法继续成交，潜在需求被供给限制挡在了记录之外。询问也不能直接补成需求数量：有人可能改买其他商品，有人可能只是随口问，当前仍有未知。\n\n![X店销量到达配货上限后，未满足需求不再表现为成交；Y店则存在未售库存。相同配货下，销量记录不能独立代表需求。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNDYwIiB2aWV3Qm94PSIwIDAgMzYwIDQ2MCIgcm9sZT0iaW1nIj48dGl0bGU+6ZSA6YeP5LiN562J5LqO5YWo6YOo6ZyA5rGCPC90aXRsZT48ZGVzYz7mlZnlrabmoYjkvovvvJpY5Y2W5a6MODDkuKrlkI7pnIDmsYLmnKrnn6XvvIxZ5Y2W5Ye6NjDkuKrliakyMOS4quOAguaWnOe6ueWPquihqOekuuacquiuoemHj++8jOS4jeaMiemrmOW6puS8sOeul+mcgOaxguOAgjwvZGVzYz48ZGVmcz48bWFya2VyIGlkPSJhcnJvdyIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8tc3RhcnQtcmV2ZXJzZSI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTB6IiBmaWxsPSIjMTY1ZDUyIi8+PC9tYXJrZXI+PHBhdHRlcm4gaWQ9InVua25vd24iIHdpZHRoPSI4IiBoZWlnaHQ9IjgiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPjxwYXRoIGQ9Ik0tMiAyTDIgLTJNMCA4TDggME02IDEwTDEwIDYiIHN0cm9rZT0iIzg3NWQyMiIgc3Ryb2tlLXdpZHRoPSIxLjUiLz48L3BhdHRlcm4+PC9kZWZzPjxyZWN0IHdpZHRoPSIzNjAiIGhlaWdodD0iNDYwIiByeD0iOCIgZmlsbD0iI2Y2ZjhmMyIvPjx0ZXh0IHg9IjI0IiB5PSIzOSIgZm9udC1mYW1pbHk9IlBpbmdGYW5nIFNDLE1pY3Jvc29mdCBZYUhlaSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjI0IiBmaWxsPSIjMjEzNDJmIiB0ZXh0LWFuY2hvcj0ic3RhcnQiIGZvbnQtd2VpZ2h0PSI0MDAiPumUgOmHj+S4jeetieS6juWFqOmDqOmcgOaxgjwvdGV4dD48dGV4dCB4PSIyNCIgeT0iNzMiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxOCIgZmlsbD0iIzUyNjg1ZSIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7mlZnlraborrDlvZUgwrcg5Y2V5L2N77ya5LiqPC90ZXh0PjxwYXRoIGQ9Ik00NiAzNDBMMzIyIDM0MCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjNjA3MzZjIiBzdHJva2Utd2lkdGg9IjIiLz48cGF0aCBkPSJNNDYgMTc1TDQ2IDM0MCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjNjA3MzZjIiBzdHJva2Utd2lkdGg9IjIiLz48dGV4dCB4PSIzNSIgeT0iMzQ2IiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQt 用等新增环节。[案例原文](https://web.mit.edu/people/jgallien/ZaraOR2010.pdf)\n\n企业因此可以从更小的完整业务开始，同时建设数字化和智能化。真正值得追踪的是：更多有效经验能否以可承受的成本进入下一次工作，而不是系统里又增加了多少文档。\n","exportSingleMd":"# 第2章｜系统记录了很多，企业为什么仍在反复从头做起\n\n在连锁备货的教学情境中，企业有收银系统、库存表和每日销售报表。总部知道每家店卖出多少、剩余多少，也有统一备货流程。可一位熟悉客流的店长离开后，新店长仍需要花很久摸索：什么时段容易缺货、临时活动意味着什么、哪些老顾客的询问值得提前准备。\n\n这并不说明过去的数字化没有价值。它说明企业保存的内容，与实际工作依赖的内容，并没有完全重合。\n\n**过去较容易积累的是已被定义的事实与流程；较难留下的是情境、判断依据、例外处理和协作经验。AI的重要机会，在于改变后面这些内容进入生产与积累的成本。**\n\n## 一条完整销售记录，也可能缺少决定含义\n\n下面采用贯穿课程的教学案例。企业有8家门店与中央生产团队，只先看X、Y两店的一种商品。两店各配80个，X卖完80个，Y卖出60个、剩20个。X在18点售罄，后来仍有顾客询问；Y正常营业到20点。\n\n收银记录没有错。问题是，X卖出80个，不能说明它当天只需要80个。卖完以后无法继续成交，潜在需求被供给限制挡在了记录之外。询问也不能直接补成需求数量：有人可能改买其他商品，有人可能只是随口问，当前仍有未知。\n\n![X店销量到达配货上限后，未满足需求不再表现为成交；Y店则存在未售库存。相同配货下，销量记录不能独立代表需求。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNDYwIiB2aWV3Qm94PSIwIDAgMzYwIDQ2MCIgcm9sZT0iaW1nIj48dGl0bGU+6ZSA6YeP5LiN562J5LqO5YWo6YOo6ZyA5rGCPC90aXRsZT48ZGVzYz7mlZnlrabmoYjkvovvvJpY5Y2W5a6MODDkuKrlkI7pnIDmsYLmnKrnn6XvvIxZ5Y2W5Ye6NjDkuKrliakyMOS4quOAguaWnOe6ueWPquihqOekuuacquiuoemHj++8jOS4jeaMiemrmOW6puS8sOeul+mcgOaxguOAgjwvZGVzYz48ZGVmcz48bWFya2VyIGlkPSJhcnJvdyIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8tc3RhcnQtcmV2ZXJzZSI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTB6IiBmaWxsPSIjMTY1ZDUyIi8+PC9tYXJrZXI+PHBhdHRlcm4gaWQ9InVua25vd24iIHdpZHRoPSI4IiBoZWlnaHQ9IjgiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPjxwYXRoIGQ9Ik0tMiAyTDIgLTJNMCA4TDggME02IDEwTDEwIDYiIHN0cm9rZT0iIzg3NWQyMiIgc3Ryb2tlLXdpZHRoPSIxLjUiLz48L3BhdHRlcm4+PC9kZWZzPjxyZWN0IHdpZHRoPSIzNjAiIGhlaWdodD0iNDYwIiByeD0iOCIgZmlsbD0iI2Y2ZjhmMyIvPjx0ZXh0IHg9IjI0IiB5PSIzOSIgZm9udC1mYW1pbHk9IlBpbmdGYW5nIFNDLE1pY3Jvc29mdCBZYUhlaSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjI0IiBmaWxsPSIjMjEzNDJmIiB0ZXh0LWFuY2hvcj0ic3RhcnQiIGZvbnQtd2VpZ2h0PSI0MDAiPumUgOmHj+S4jeetieS6juWFqOmDqOmcgOaxgjwvdGV4dD48dGV4dCB4PSIyNCIgeT0iNzMiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1za 里有一条具体的成本机制：**同一份材料先服务当前生产，再成为下一轮的候选经验。** 原来分开的“做事”和“做完后整理”开始共享输入。是否真的更便宜，还要计入人员纠正、系统关联与后续维护，不能只比较生成速度。\n\n## 不必等到所有事情都成为SOP\n\n如果企业必须先把全部经验解释成明确规则，才能使用AI，大量现场知识仍会停在门外。更可行的起点，是先围绕一条业务建立必要秩序：对象对应得上，发生时间清楚，建议与实际行动分开，结果能返回。\n\n尚未形成稳定规则的经验，可以先以带条件的案例存在。比如“某次交通活动期间晚高峰需求增加”，保留当时情况与结果，供相似任务参考。经过比较后，再决定哪些部分值得形成标准，哪些需要继续观察。\n\n传统数字化也已经做过这种工作。Zara的库存分配研究发现，关键尺码缺货会影响整款商品的展示，现场规则因此改变了分配模型的设计。它证明现场认识与系统工程结合早已有价值；生成式AI的新作用，需要具体落在材料处理与经验调用等新增环节。[案例原文](https://web.mit.edu/people/jgallien/ZaraOR2010.pdf)\n\n企业因此可以从更小的完整业务开始，同时建设数字化和智能化。真正值得追踪的是：更多有效经验能否以可承受的成本进入下一次工作，而不是系统里又增加了多少文档。\n","text":"# 第2章｜系统记录了很多，企业为什么仍在反复从头做起\n\n在连锁备货的教学情境中，企业有收银系统、库存表和每日销售报表。总部知道每家店卖出多少、剩余多少，也有统一备货流程。可一位熟悉客流的店长离开后，新店长仍需要花很久摸索：什么时段容易缺货、临时活动意味着什么、哪些老顾客的询问值得提前准备。\n\n这并不说明过去的数字化没有价值。它说明企业保存的内容，与实际工作依赖的内容，并没有完全重合。\n\n**过去较容易积累的是已被定义的事实与流程；较难留下的是情境、判断依据、例外处理和协作经验。AI的重要机会，在于改变后面这些内容进入生产与积累的成本。**\n\n## 一条完整销售记录，也可能缺少决定含义\n\n下面采用贯穿课程的教学案例。企业有8家门店与中央生产团队，只先看X、Y两店的一种商品。两店各配80个，X卖完80个，Y卖出60个、剩20个。X在18点售罄，后来仍有顾客询问；Y正常营业到20点。\n\n收银记录没有错。问题是，X卖出80个，不能说明它当天只需要80个。卖完以后无法继续成交，潜在需求被供给限制挡在了记录之外。询问也不能直接补成需求数量：有人可能改买其他商品，有人可能只是随口问，当前仍有未知。\n\n \n\n如果总部只按历史销量备货，X的高需求可能一直没有机会显现。这个例子说明，数据可以准确，却仍不足以回答经营问题。关键不是再增加一个图表，而是把“数字在什么条件下产生”带回判断。\n\n## 为什么系统更容易保存结果\n\n系统要形成一个字段，通常先要有人决定记录什么、采用什么口径、在哪一步填写。商品、数量、时间和付款状态容易定义，因而适合稳定记录。\n\n现场判断的形态更复杂。一位店长可能综合天气、地铁出口施工、附近活动和前几天的询问，决定改变备货。哪些因素重要，往往是在遇到例外后才逐渐认识的。企业若要求每次都先建立完整分类，再把所有理由写成标准字段，准备与维护成本就会很高。\n\n过去还有人工复盘、师徒传承、共同实践等办法，许多企业也靠这些办法形成了很强的能力。问题在于覆盖范围：专家有限，解释会占用生产时间；当任务数量增加、人员变动或协作拉长，一部分经验就容易失去入口。\n\n组织知识研究将个人实践、表达与共同使用看成相互联系的过程。这提醒我们，知识既不只在数据库里，也不会因为写成文字就完成传承。Nonaka的组织知识研究\n\n## AI带来的增量，落在积累的哪一步\n\n假设店长原来就会在工作群里说明“18点卖光，后来仍有人问，明天请多配”。人工整理日报时，这句话可能只剩“销量80”。要在未来使用它，还需要重新翻聊天、辨认商品和日期、询问当事人。\n\nAI可以承担其中一部分匹配与组织工作：把原消息对应到门店、商品和营业日；保留售罄时点；区分已知事实与请求；在下一次分配任务中带回相关材料。它也可以先起草经验记录，让人员纠正关键差别，减少从空白重新总结的负担。\n\n这里有一条具体的成本机制：**同一份材料先服务当前生产，再成为下一轮的候选经验。** 原来分开的“做事”和“做完后整理”开始共享输入。是否真的更便宜，还要计入人员纠正、系统关联与后续维护，不能只比较生成速度。\n\n## 不必等到所有事情都成为SOP\n\n如果企业必须先把全部经验解释成明确规则，才能使用AI，大量现场知识仍会停在门外。更可行的起点，是先围绕一条业务建立必要秩序：对象对应得上，发生时间清楚，建议与实际行动分开，结果能返回。\n\n尚未形成稳定规则的经验，可以先以带条件的案例存在。比如“某次交通活动期间晚高峰需求增加”，保留当时情况与结果，供相似任务参考。经过比较后，再决定哪些部分值得形成标准，哪些需要继续观察。\n\n传统数字化也已经做过这种工作。Zara的库存分配研究发现，关键尺码缺货会影响整款商品的展示，现场规则因此改变了分配模型的设计。它证明现场认识与系统工程结合早已有价值；生成式AI的新作用，需要具体落在材料处理与经验调用等新增环节。案例原文\n\n企业因此可以从更小的完整业务开始，同时建设数字化和智能化。真正值得追踪的是：更多有效经验能否以可承受的成本进入下一次工作，而不是系统里又增加了多少文档。\n"},{"file":"03-产业重构.md","id":"lesson-03","number":3,"role":"核心课","part":0,"title":"第3章｜AI怎样沿着成本、分工和价值归属改变产业","md":"# 第3章｜AI怎样沿着成本、分工和价值归属改变产业\n\n设想一家专业服务机构，原来需要多人整理客户资料、制作经营报告。引入AI后，初稿可以更快出现。管理者很容易先想到两个方向：减少制作成本，或者接更多项目。\n\n但同一项变化，也可能让客户自己制作初稿，只向机构购买核验；可能让竞争者以更低价格提供类似报告；还可能使过去买不起一次完整咨询的小企业，开始购买持续的小额服务。\n\n这几种前景指向不同的经营选择。**认知工作变便宜，首先改变可做的事情，随后可能改变谁来做、怎样交付和由谁取得收益。** 企业要沿着这条传导链理解产业变化。\n\n## 成本下降，会改变服务的边界\n\n一种工作原来准备成本很高，只有规模较大的客户值得服务。若资料理解、分析起草和持续跟踪的部分成本下降，企业就可能用不同方式服务更小、更多样的需求。\n\n但进入小客户市场还需要其他条件：获客成本是否可承受，资料能否取得，客户是否愿意配合，交付后有没有行动能力。生成成本下降，只是打开一个候选空间。\n\n反过来，一些客户会选择自己完成过去外购的部分工作。例如机构不再替客户从头写报告，而是核验客户与AI共同生成的分析。原先被打包收费的环节，可能被拆开。企业若只提高旧产品的制作效率，就可能错过客户购买对象已经改变的事实。\n\n## 分工改变，会重新组合企业边界\n\n企业为什么把某些事交给外部机构？原因可能是专业能力稀缺、规模不足以养团队、协调复杂，或者自己难以判断结果。\n\nAI会改变其中一些条件。通用材料整理更容易取得，外部服务就需要解释自己还提供什么：独有行业经验、可信判断、现场执行、持续责任，还是客户无法自行建立的协作网络。与此同时，AI系统仍需要接入企业事实和实际动作，新的现场工程工作又可能增加。\n\n这说明一个旧环节减少，不等于整条业务不再需要专业服务；专业工作的价值可能迁移。FDE的企业侧机会，就来自通用智能与具体生产之间仍存在、且会不断变化的距离。\n\n## 创造了价值，为什么企业未必留下收益\n\n假设各家机构都把同类报告的制作成本降下来。客户可以更方便地比较，价格可能随竞争下降。成本改善的一部分于是成为客户获得的好处，机构未必保留原来的毛利。\n\n如果客户入口主要掌握在某个平台，机构还可能把新增价值让渡给平台；如果真正稀缺的是现场履约能力，掌握这一能力的一方可能保留更多收益。具体结果取决于竞争、议价与替代条件，不能只看谁最先调用模型。\n\nTeece对商业模式的研究，把客户价值、交付安排与价值获取放在一起讨论。它的启发是：技术创新需要相应经营设计，不能把“做得出来”直接当作“能够持续获利”。[原始研究](https://www.sciencedirect.com/science/article/pii/S002463010900051X)\n\n## 用同一家机构，推演三条不同路线\n\n以下为教学情境，尚无市场结果。机构拥有客户关系、部分行业经验和一组专家。\n\n| 路线 | 客户实际购买什么 | 企业还需补什么 |\n|---|---|---|\n| 更便宜的一次报告 | 一次资料整理与分析 | 保持合格质量，验证获客和核验成本能否支持价格 |\n| 持续行动支持 | 定期发现变化、推进决定、追踪行动 | 持续资料入口、客户协作、专家与执行容量 |\n| 独立核验服务 | 对客户已有分析作专业检查 | 明确核验范围、可靠依据、责任和收费方式 |\n\n三条路线可以采用相近模型，却需要不同流程、人员和收益结构。第二条看起来更接近长期服务，但如果客户并不需要持续支持，或者资料无法连续取得，它也可能比原服务更难经营。\n\n宝洁的创新实验为“AI能参与跨专业构思”提供了真实参照。研究观察到的是方案生成、选择与质量等阶段表现，并没有证明那些方案已经变成新产品收入。因此，它支持扩大探索范围，不能替任何新服务填出付费率。[研究原文](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n## 回到自己的产业，应追哪几件事\n\n先找出哪些工作成本和准备方式可能改变，再追问客户会不会改为自做、少买、拆开买，或者购买过去不存在的服务。随后检查交付仍受什么约束，新增价值能否留在企业。\n\n烘焙连锁的备货判断即使改善，仍要生产和配送；设备服务的诊断即使更快，仍可能需要现场人员。实物资源、渠道与客户关系不会因文本生成变便宜而自动消失，它们可能成为新组合里的关键条件。\n\n产业变化因而既有威胁，也有建设方向。企业需要持续理解自己的客户和能力，在技术变化中验证新的组合，而不是等某一套软件被宣布为最终答案。\n","html":"\u003ch1>第3章｜AI怎样沿着成本、分工和价值归属改变产业\u003c/h1>\n\u003cp>设想一家专业服务机构，原来需要多人整理客户资料、制作经营报告。引入AI后，初稿可以更快出现。管理者很容易先想到两个方向：减少制作成本，或者接更多项目。\u003c/p>\n\u003cp>但同一项变化，也可能让客户自己制作初稿，只向机构购买核验；可能让竞争者以更低价格提供类似报告；还可能使过去买不起一次完整咨询的小企业，开始购买持续的小额服务。\u003c/p>\n\u003cp>这几种前景指向不同的经营选择。\u003cstrong>认知工作变便宜，首先改变可做的事情，随后可能改变谁来做、怎样交付和由谁取得收益。\u003c/strong> 企业要沿着这条传导链理解产业变化。\u003c/p>\n\u003ch2 id=\"lesson-03-section-1\">成本下降，会改变服务的边界\u003c/h2>\n\u003cp>一种工作原来准备成本很高，只有规模较大的客户值得服务。若资料理解、分析起草和持续跟踪的部分成本下降，企业就可能用不同方式服务更小、更多样的需求。\u003c/p>\n\u003cp>但进入小客户市场还需要其他条件：获客成本是否可承受，资料能否取得，客户是否愿意配合，交付后有没有行动能力。生成成本下降，只是打开一个候选空间。\u003c/p>\n\u003cp>反过来，一些客户会选择自己完成过去外购的部分工作。例如机构不再替客户从头写报告，而是核验客户与AI共同生成的分析。原先被打包收费的环节，可能被拆开。企业若只提高旧产品的制作效率，就可能错过客户购买对象已经改变的事实。\u003c/p>\n\u003ch2 id=\"lesson-03-section-2\">分工改变，会重新组合企业边界\u003c/h2>\n\u003cp>企业为什么把某些事交给外部机构？原因可能是专业能力稀缺、规模不足以养团队、协调复杂，或者自己难以判断结果。\u003c/p>\n\u003cp>AI会改变其中一些条件。通用材料整理更容易取得，外部服务就需要解释自己还提供什么：独有行业经验、可信判断、现场执行、持续责任，还是客户无法自行建立的协作网络。与此同时，AI系统仍需要接入企业事实和实际动作，新的现场工程工作又可能增加。\u003c/p>\n\u003cp>这说明一个旧环节减少，不等于整条业务不再需要专业服务；专业工作的价值可能迁移。FDE的企业侧机会，就来自通用智能与具体生产之间仍存在、且会不断变化的距离。\u003c/p>\n\u003ch2 id=\"lesson-03-section-3\">创造了价值，为什么企业未必留下收益\u003c/h2>\n\u003cp>假设各家机构都把同类报告的制作成本降下来。客户可以更方便地比较，价格可能随竞争下降。成本改善的一部分于是成为客户获得的好处，机构未必保留原来的毛利。\u003c/p>\n\u003cp>如果客户入口主要掌握在某个平台，机构还可能把新增价值让渡给平台；如果真正稀缺的是现场履约能力，掌握这一能力的一方可能保留更多收益。具体结果取决于竞争、议价与替代条件，不能只看谁最先调用模型。\u003c/p>\n\u003cp>Teece对商业模式的研究，把客户价值、交付安排与价值获取放在一起讨论。它的启发是：技术创新需要相应经营设计，不能把“做得出来”直接当作“能够持续获利”。\u003ca href=\"https://www.sciencedirect.com/science/article/pii/S002463010900051X\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-03-section-4\">用同一家机构，推演三条不同路线\u003c/h2>\n\u003cp>以下为教学情境，尚无市场结果。机构拥有客户关系、部分行业经验和一组专家。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>路线\u003c/th>\n\u003cth>客户实际购买什么\u003c/th>\n\u003cth>企业还需补什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>更便宜的一次报告\u003c/td>\n\u003ctd>一次资料整理与分析\u003c/td>\n\u003ctd>保持合格质量，验证获客和核验成本能否支持价格\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>持续行动支持\u003c/td>\n\u003ctd>定期发现变化、推进决定、追踪行动\u003c/td>\n\u003ctd>持续资料入口、客户协作、专家与执行容量\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>独立核验服务\u003c/td>\n\u003ctd>对客户已有分析作专业检查\u003c/td>\n\u003ctd>明确核验范围、可靠依据、责任和收费方式\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>三条路线可以采用相近模型，却需要不同流程、人员和收益结构。第二条看起来更接近长期服务，但如果客户并不需要持续支持，或者资料无法连续取得，它也可能比原服务更难经营。\u003c/p>\n\u003cp>宝洁的创新实验为“AI能参与跨专业构思”提供了真实参照。研究观察到的是方案生成、选择与质量等阶段表现，并没有证明那些方案已经变成新产品收入。因此，它支持扩大探索范围，不能替任何新服务填出付费率。\u003ca href=\"https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702\" target=\"_blank\" rel=\"noopener noreferrer\">研究原文\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-03-section-5\">回到自己的产业，应追哪几件事\u003c/h2>\n\u003cp>先找出哪些工作成本和准备方式可能改变，再追问客户会不会改为自做、少买、拆开买，或者购买过去不存在的服务。随后检查交付仍受什么约束，新增价值能否留在企业。\u003c/p>\n\u003cp>烘焙连锁的备货判断即使改善，仍要生产和配送；设备服务的诊断即使更快，仍可能需要现场人员。实物资源、渠道与客户关系不会因文本生成变便宜而自动消失，它们可能成为新组合里的关键条件。\u003c/p>\n\u003cp>产业变化因而既有威胁，也有建设方向。企业需要持续理解自己的客户和能力，在技术变化中验证新的组合，而不是等某一套软件被宣布为最终答案。\u003c/p>\n","headings":[{"id":"lesson-03-section-1","label":"成本下降，会改变服务的边界"},{"id":"lesson-03-section-2","label":"分工改变，会重新组合企业边界"},{"id":"lesson-03-section-3","label":"创造了价值，为什么企业未必留下收益"},{"id":"lesson-03-section-4","label":"用同一家机构，推演三条不同路线"},{"id":"lesson-03-section-5","label":"回到自己的产业，应追哪几件事"}],"exportMd":"# 第3章｜AI怎样沿着成本、分工和价值归属改变产业\n\n设想一家专业服务机构，原来需要多人整理客户资料、制作经营报告。引入AI后，初稿可以更快出现。管理者很容易先想到两个方向：减少制作成本，或者接更多项目。\n\n但同一项变化，也可能让客户自己制作初稿，只向机构购买核验；可能让竞争者以更低价格提供类似报告；还可能使过去买不起一次完整咨询的小企业，开始购买持续的小额服务。\n\n这几种前景指向不同的经营选择。**认知工作变便宜，首先改变可做的事情，随后可能改变谁来做、怎样交付和由谁取得收益。** 企业要沿着这条传导链理解产业变化。\n\n## 成本下降，会改变服务的边界\n\n一种工作原来准备成本很高，只有规模较大的客户值得服务。若资料理解、分析起草和持续跟踪的部分成本下降，企业就可能用不同方式服务更小、更多样的需求。\n\n但进入小客户市场还需要其他条件：获客成本是否可承受，资料能否取得，客户是否愿意配合，交付后有没有行动能力。生成成本下降，只是打开一个候选空间。\n\n反过来，一些客户会选择自己完成过去外购的部分工作。例如机构不再替客户从头写报告，而是核验客户与AI共同生成的分析。原先被打包收费的环节，可能被拆开。企业若只提高旧产品的制作效率，就可能错过客户购买对象已经改变的事实。\n\n## 分工改变，会重新组合企业边界\n\n企业为什么把某些事交给外部机构？原因可能是专业能力稀缺、规模不足以养团队、协调复杂，或者自己难以判断结果。\n\nAI会改变其中一些条件。通用材料整理更容易取得，外部服务就需要解释自己还提供什么：独有行业经验、可信判断、现场执行、持续责任，还是客户无法自行建立的协作网络。与此同时，AI系统仍需要接入企业事实和实际动作，新的现场工程工作又可能增加。\n\n这说明一个旧环节减少，不等于整条业务不再需要专业服务；专业工作的价值可能迁移。FDE的企业侧机会，就来自通用智能与具体生产之间仍存在、且会不断变化的距离。\n\n## 创造了价值，为什么企业未必留下收益\n\n假设各家机构都把同类报告的制作成本降下来。客户可以更方便地比较，价格可能随竞争下降。成本改善的一部分于是成为客户获得的好处，机构未必保留原来的毛利。\n\n如果客户入口主要掌握在某个平台，机构还可能把新增价值让渡给平台；如果真正稀缺的是现场履约能力，掌握这一能力的一方可能保留更多收益。具体结果取决于竞争、议价与替代条件，不能只看谁最先调用模型。\n\nTeece对商业模式的研究，把客户价值、交付安排与价值获取放在一起讨论。它的启发是：技术创新需要相应经营设计，不能把“做得出来”直接当作“能够持续获利”。[原始研究](https://www.sciencedirect.com/science/article/pii/S002463010900051X)\n\n## 用同一家机构，推演三条不同路线\n\n以下为教学情境，尚无市场结果。机构拥有客户关系、部分行业经验和一组专家。\n\n| 路线 | 客户实际购买什么 | 企业还需补什么 |\n|---|---|---|\n| 更便宜的一次报告 | 一次资料整理与分析 | 保持合格质量，验证获客和核验成本能否支持价格 |\n| 持续行动支持 | 定期发现变化、推进决定、追踪行动 | 持续资料入口、客户协作、专家与执行容量 |\n| 独立核验服务 | 对客户已有分析作专业检查 | 明确核验范围、可靠依据、责任和收费方式 |\n\n三条路线可以采用相近模型，却需要不同流程、人员和收益结构。第二条看起来更接近长期服务，但如果客户并不需要持续支持，或者资料无法连续取得，它也可能比原服务更难经营。\n\n宝洁的创新实验为“AI能参与跨专业构思”提供了真实参照。研究观察到的是方案生成、选择与质量等阶段表现，并没有证明那些方案已经变成新产品收入。因此，它支持扩大探索范围，不能替任何新服务填出付费率。[研究原文](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n## 回到自己的产业，应追哪几件事\n\n先找出哪些工作成本和准备方式可能改变，再追问客户会不会改为自做、少买、拆开买，或者购买过去不存在的服务。随后检查交付仍受什么约束，新增价值能否留在企业。\n\n烘焙连锁的备货判断即使改善，仍要生产和配送；设备服务的诊断即使更快，仍可能需要现场人员。实物资源、渠道与客户关系不会因文本生成变便宜而自动消失，它们可能成为新组合里的关键条件。\n\n产业变化因而既有威胁，也有建设方向。企业需要持续理解自己的客户和能力，在技术变化中验证新的组合，而不是等某一套软件被宣布为最终答案。\n","exportSingleMd":"# 第3章｜AI怎样沿着成本、分工和价值归属改变产业\n\n设想一家专业服务机构，原来需要多人整理客户资料、制作经营报告。引入AI后，初稿可以更快出现。管理者很容易先想到两个方向：减少制作成本，或者接更多项目。\n\n但同一项变化，也可能让客户自己制作初稿，只向机构购买核验；可能让竞争者以更低价格提供类似报告；还可能使过去买不起一次完整咨询的小企业，开始购买持续的小额服务。\n\n这几种前景指向不同的经营选择。**认知工作变便宜，首先改变可做的事情，随后可能改变谁来做、怎样交付和由谁取得收益。** 企业要沿着这条传导链理解产业变化。\n\n## 成本下降，会改变服务的边界\n\n一种工作原来准备成本很高，只有规模较大的客户值得服务。若资料理解、分析起草和持续跟踪的部分成本下降，企业就可能用不同方式服务更小、更多样的需求。\n\n但进入小客户市场还需要其他条件：获客成本是否可承受，资料能否取得，客户是否愿意配合，交付后有没有行动能力。生成成本下降，只是打开一个候选空间。\n\n反过来，一些客户会选择自己完成过去外购的部分工作。例如机构不再替客户从头写报告，而是核验客户与AI共同生成的分析。原先被打包收费的环节，可能被拆开。企业若只提高旧产品的制作效率，就可能错过客户购买对象已经改变的事实。\n\n## 分工改变，会重新组合企业边界\n\n企业为什么把某些事交给外部机构？原因可能是专业能力稀缺、规模不足以养团队、协调复杂，或者自己难以判断结果。\n\nAI会改变其中一些条件。通用材料整理更容易取得，外部服务就需要解释自己还提供什么：独有行业经验、可信判断、现场执行、持续责任，还是客户无法自行建立的协作网络。与此同时，AI系统仍需要接入企业事实和实际动作，新的现场工程工作又可能增加。\n\n这说明一个旧环节减少，不等于整条业务不再需要专业服务；专业工作的价值可能迁移。FDE的企业侧机会，就来自通用智能与具体生产之间仍存在、且会不断变化的距离。\n\n## 创造了价值，为什么企业未必留下收益\n\n假设各家机构都把同类报告的制作成本降下来。客户可以更方便地比较，价格可能随竞争下降。成本改善的一部分于是成为客户获得的好处，机构未必保留原来的毛利。\n\n如果客户入口主要掌握在某个平台，机构还可能把新增价值让渡给平台；如果真正稀缺的是现场履约能力，掌握这一能力的一方可能保留更多收益。具体结果取决于竞争、议价与替代条件，不能只看谁最先调用模型。\n\nTeece对商业模式的研究，把客户价值、交付安排与价值获取放在一起讨论。它的启发是：技术创新需要相应经营设计，不能把“做得出来”直接当作“能够持续获利”。[原始研究](https://www.sciencedirect.com/science/article/pii/S002463010900051X)\n\n## 用同一家机构，推演三条不同路线\n\n以下为教学情境，尚无市场结果。机构拥有客户关系、部分行业经验和一组专家。\n\n| 路线 | 客户实际购买什么 | 企业还需补什么 |\n|---|---|---|\n| 更便宜的一次报告 | 一次资料整理与分析 | 保持合格质量，验证获客和核验成本能否支持价格 |\n| 持续行动支持 | 定期发现变化、推进决定、追踪行动 | 持续资料入口、客户协作、专家与执行容量 |\n| 独立核验服务 | 对客户已有分析作专业检查 | 明确核验范围、可靠依据、责任和收费方式 |\n\n三条路线可以采用相近模型，却需要不同流程、人员和收益结构。第二条看起来更接近长期服务，但如果客户并不需要持续支持，或者资料无法连续取得，它也可能比原服务更难经营。\n\n宝洁的创新实验为“AI能参与跨专业构思”提供了真实参照。研究观察到的是方案生成、选择与质量等阶段表现，并没有证明那些方案已经变成新产品收入。因此，它支持扩大探索范围，不能替任何新服务填出付费率。[研究原文](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n## 回到自己的产业，应追哪几件事\n\n先找出哪些工作成本和准备方式可能改变，再追问客户会不会改为自做、少买、拆开买，或者购买过去不存在的服务。随后检查交付仍受什么约束，新增价值能否留在企业。\n\n烘焙连锁的备货判断即使改善，仍要生产和配送；设备服务的诊断即使更快，仍可能需要现场人员。实物资源、渠道与客户关系不会因文本生成变便宜而自动消失，它们可能成为新组合里的关键条件。\n\n产业变化因而既有威胁，也有建设方向。企业需要持续理解自己的客户和能力，在技术变化中验证新的组合，而不是等某一套软件被宣布为最终答案。\n","text":"# 第3章｜AI怎样沿着成本、分工和价值归属改变产业\n\n设想一家专业服务机构，原来需要多人整理客户资料、制作经营报告。引入AI后，初稿可以更快出现。管理者很容易先想到两个方向：减少制作成本，或者接更多项目。\n\n但同一项变化，也可能让客户自己制作初稿，只向机构购买核验；可能让竞争者以更低价格提供类似报告；还可能使过去买不起一次完整咨询的小企业，开始购买持续的小额服务。\n\n这几种前景指向不同的经营选择。**认知工作变便宜，首先改变可做的事情，随后可能改变谁来做、怎样交付和由谁取得收益。** 企业要沿着这条传导链理解产业变化。\n\n## 成本下降，会改变服务的边界\n\n一种工作原来准备成本很高，只有规模较大的客户值得服务。若资料理解、分析起草和持续跟踪的部分成本下降，企业就可能用不同方式服务更小、更多样的需求。\n\n但进入小客户市场还需要其他条件：获客成本是否可承受，资料能否取得，客户是否愿意配合，交付后有没有行动能力。生成成本下降，只是打开一个候选空间。\n\n反过来，一些客户会选择自己完成过去外购的部分工作。例如机构不再替客户从头写报告，而是核验客户与AI共同生成的分析。原先被打包收费的环节，可能被拆开。企业若只提高旧产品的制作效率，就可能错过客户购买对象已经改变的事实。\n\n## 分工改变，会重新组合企业边界\n\n企业为什么把某些事交给外部机构？原因可能是专业能力稀缺、规模不足以养团队、协调复杂，或者自己难以判断结果。\n\nAI会改变其中一些条件。通用材料整理更容易取得，外部服务就需要解释自己还提供什么：独有行业经验、可信判断、现场执行、持续责任，还是客户无法自行建立的协作网络。与此同时，AI系统仍需要接入企业事实和实际动作，新的现场工程工作又可能增加。\n\n这说明一个旧环节减少，不等于整条业务不再需要专业服务；专业工作的价值可能迁移。FDE的企业侧机会，就来自通用智能与具体生产之间仍存在、且会不断变化的距离。\n\n## 创造了价值，为什么企业未必留下收益\n\n假设各家机构都把同类报告的制作成本降下来。客户可以更方便地比较，价格可能随竞争下降。成本改善的一部分于是成为客户获得的好处，机构未必保留原来的毛利。\n\n如果客户入口主要掌握在某个平台，机构还可能把新增价值让渡给平台；如果真正稀缺的是现场履约能力，掌握这一能力的一方可能保留更多收益。具体结果取决于竞争、议价与替代条件，不能只看谁最先调用模型。\n\nTeece对商业模式的研究，把客户价值、交付安排与价值获取放在一起讨论。它的启发是：技术创新需要相应经营设计，不能把“做得出来”直接当作“能够持续获利”。原始研究\n\n## 用同一家机构，推演三条不同路线\n\n以下为教学情境，尚无市场结果。机构拥有客户关系、部分行业经验和一组专家。\n\n| 路线 | 客户实际购买什么 | 企业还需补什么 |\n|---|---|---|\n| 更便宜的一次报告 | 一次资料整理与分析 | 保持合格质量，验证获客和核验成本能否支持价格 |\n| 持续行动支持 | 定期发现变化、推进决定、追踪行动 | 持续资料入口、客户协作、专家与执行容量 |\n| 独立核验服务 | 对客户已有分析作专业检查 | 明确核验范围、可靠依据、责任和收费方式 |\n\n三条路线可以采用相近模型，却需要不同流程、人员和收益结构。第二条看起来更接近长期服务，但如果客户并不需要持续支持，或者资料无法连续取得，它也可能比原服务更难经营。\n\n宝洁的创新实验为“AI能参与跨专业构思”提供了真实参照。研究观察到的是方案生成、选择与质量等阶段表现，并没有证明那些方案已经变成新产品收入。因此，它支持扩大探索范围，不能替任何新服务填出付费率。研究原文\n\n## 回到自己的产业，应追哪几件事\n\n先找出哪些工作成本和准备方式可能改变，再追问客户会不会改为自做、少买、拆开买，或者购买过去不存在的服务。随后检查交付仍受什么约束，新增价值能否留在企业。\n\n烘焙连锁的备货判断即使改善，仍要生产和配送；设备服务的诊断即使更快，仍可能需要现场人员。实物资源、渠道与客户关系不会因文本生成变便宜而自动消失，它们可能成为新组合里的关键条件。\n\n产业变化因而既有威胁，也有建设方向。企业需要持续理解自己的客户和能力，在技术变化中验证新的组合，而不是等某一套软件被宣布为最终答案。\n"},{"file":"04-共同发展.md","id":"lesson-04","number":4,"role":"核心课","part":0,"title":"第4章｜没有转型终稿，为什么仍要现在开始建设","md":"# 第4章｜没有转型终稿，为什么仍要现在开始建设\n\n面对快速变化的AI，企业常有两种看法。一种是再等一等，等工具稳定、路线清楚后一次建好；另一种是尽快买齐系统，完成一次转型项目。\n\n两种想法都希望把不确定性留在建设之前。困难在于，很多问题只有真实使用后才会被看见：客户究竟需要什么，业务材料缺什么，哪一段值得交给AI，旧经验哪里已经不适用。企业自身也会在使用中改变。\n\n**AI转型需要持续取得、吸收和重组能力。主动建设的意义，在于使企业更能作出下一次选择，而非尽早把当前工具固定下来。**\n\n## 企业怎样靠近AI，AI又怎样靠近生产\n\n企业先从一条业务提供事实、目标、工作入口与反馈，让通用智能有机会参与真实任务。这是企业靠近AI的一面。\n\n模型与工程团队则要理解现场例外，把能力接到材料、工具和真实执行上，根据使用结果修正系统。这是AI靠近生产的一面。两边的认识会交替推进：企业可能发现原问题问错了，工程也可能发现真正缺口不在模型，而在业务状态或人员协作。\n\n以教学烘焙连锁为例，最初要求“AI自动写日报”很合理，因为整理日报占时间。现场工作却可能发现，更关键的价值是把提前售罄信息接入分配决定。实现这一点，又会暴露中央产能、配送和门店反馈的问题。新的认识由真实采用产生，很难在第一次需求会上全部写清。\n\n## 为什么相关积累会影响下一步\n\n一家企业已经能把建议、修改、实际执行和结果关联起来，换一项新能力时，就更容易比较它是否有用。另一家企业没有结果记录，即使接入更强模型，也可能继续靠印象判断。\n\n差距首先表现为学习条件：能否识别新技术的用途，能否组织一次有效试做，能否把发现转成业务动作。吸收能力研究强调已有相关知识对识别和应用外部知识的作用；它为“边采用边建设”提供了机制依据。[研究原文](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n不过，积累也会形成惯性。原系统投入越大，团队越可能维护原路线；原经验越成功，越容易忽视新条件。Teece所讨论的动态能力，正是企业使资源与能力持续适应变化的本领。保持相关性与拥有资源，是不同问题。[研究原文](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)\n\n## 早开始，并不等于所有早投入都有价值\n\n如果企业连续试了很多工具，却没有留下可复用的任务、真实反馈或内部理解，时间过去并不自动形成优势。相反，一段错误经验若被大量复用，还可能使修正更困难。\n\n因此，起步应选择能形成完整认识的小范围：有真实客户或内部使用者，有可以观察的结果，有业务负责人，也有把发现改成实际安排的工程力量。先建立可靠往返，再扩大范围。\n\nMETR关于开发工作的研究及其后续方法更新，也提醒企业：工具和工作方式变化后，旧测量需要重看。一次研究在特定任务上的结果，既不应被永久当作不用AI的理由，也不能因新工具发布就自动失效而无需重测。[原始研究](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)、[后续更新](https://metr.org/blog/2026-02-24-uplift-update/)\n\n## 连续力量为什么重要\n\n一次系统交付可以解决当时明确的问题，持续变化却需要有人保持现场认识、理解系统，并把反馈变成修改。企业因此需要连续工程能力，FDE可以承担其中的重要部分。\n\n这种连续性不必由同一家外部团队永久提供。内部、外部或混合团队都可能适合。真正需要保留的是企业对客户价值的理解、对有效方法的判断，以及接续和改变系统的能力。后面讨论长期FDE合作时，将据此评价共建，而不把合作年限当成果。\n\n## 形成一条能更新的发展路线\n\n教学连锁可以先验证售罄信息能否改善分配，再判断已有方法能否被接任店长使用，随后才决定如何进入第九家店。若交通条件变化使旧方法不再有效，下一步就应更新认识和安排；若配送成为瓶颈，就不应只继续升级模型。\n\n探索新可能与改善现有做法会争用资源。March的研究解释了这种长期张力，但没有给出人人适用的预算比例。[原始论文](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)\n\n企业可以拥有明确方向，同时保留调整方法的能力：持续改善客户获得的结果，使有效经验留下，让下一次建设更有依据。这比承诺某个时间点完成全部转型，更接近变化中的实际经营。\n","html":"\u003ch1>第4章｜没有转型终稿，为什么仍要现在开始建设\u003c/h1>\n\u003cp>面对快速变化的AI，企业常有两种看法。一种是再等一等，等工具稳定、路线清楚后一次建好；另一种是尽快买齐系统，完成一次转型项目。\u003c/p>\n\u003cp>两种想法都希望把不确定性留在建设之前。困难在于，很多问题只有真实使用后才会被看见：客户究竟需要什么，业务材料缺什么，哪一段值得交给AI，旧经验哪里已经不适用。企业自身也 \u003c/p>\n\u003cp>这种连续性不必由同一家外部团队永久提供。内部、外部或混合团队都可能适合。真正需要保留的是企业对客户价值的理解、对有效方法的判断，以及接续和改变系统的能力。后面讨论长期FDE合作时，将据此评价共建，而不把合作年限当成果。\u003c/p>\n\u003ch2 id=\"lesson-04-section-5\">形成一条能更新的发展路线\u003c/h2>\n\u003cp>教学连锁可以先验证售罄信息能否改善分配，再判断已有方法能否被接任店长使用，随后才决定如何进入第九家店。若交通条件变化使旧方法不再有效，下一步就应更新认识和安排；若配送成为瓶颈，就不应只继续升级模型。\u003c/p>\n\u003cp>探索新可能与改善现有做法会争用资源。March的研究解释了这种长期张力，但没有给出人人适用的预算比例。\u003ca href=\"https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始论文\u003c/a>\u003c/p>\n\u003cp>企业可以拥有明确方向，同时保留调整方法的能力：持续改善客户获得的结果，使有效经验留下，让下一次建设更有依据。这比承诺某个时间点完成全部转型，更接近变化中的实际经营。\u003c/p>\n","headings":[{"id":"lesson-04-section-1","label":"企业怎样靠近AI，AI又怎样靠近生产"},{"id":"lesson-04-section-2","label":"为什么相关积累会影响下一步"},{"id":"lesson-04-section-3","label":"早开始，并不等于所有早投入都有价值"},{"id":"lesson-04-section-4","label":"连续力量为什么重要"},{"id":"lesson-04-section-5","label":"形成一条能更新的发展路线"}],"exportMd":"# 第4章｜没有转型终稿，为什么仍要现在开始建设\n\n面对快速变化的AI，企业常有两种看法。一种是再等一等，等工具稳定、路线清楚后一次建好；另一种是尽快买齐系统，完成一次转型项目。\n\n两种想法都希望把不确定性留在建设之前。困难在于，很多问题只有真实使用后才会被看见：客户究竟需要什么，业务材料缺什么，哪一段值得交给AI，旧经验哪里已经不适用。企业自身也会在使用中改变。\n\n**AI转型需要持续取得、吸收和重组能力。主动建设的意义，在于使企业更能作出下一次选择，而非尽早把当前工具固定下来。**\n\n## 企业怎样靠近AI，AI又怎样靠近生产\n\n企业先从一条业务提供事实、目标、工作入口与反馈，让通用智能有机会参与真实任务。这是企业靠近AI的一面。\n\n模型与工程团队则要理解现场例外，把能力接到材料、工具和真实执行上，根据使用结果修正系统。这是AI靠近生产的一面。两边的认识会交替推进：企业可能发现原问题问错了，工程也可能发现真正缺口不在模型，而在业务状态或人员协作。\n\n以教学烘焙连锁为例，最初要求“AI自动写日报”很合理，因为整理日报占时间。现场工作却可能发现，更关键的价值是把提前售罄信息接入分配决定。实现这一点，又会暴露中央产能、配送和门店反馈的问题。新的认识由真实采用产生，很难在第一次需求会上全部写清。\n\n## 为什么相关积累会影响下一步\n\n一家企业已经能把建议、修改、实际执行和结果关联起来，换一项新能力时，就更容易比较它是否有用。另一家企业没有结果记录，即使接入更强模型，也可能继续靠印象判断。\n\n差距首先表现为学习条件：能否识别新技术的用途，能否组织一次有效试做，能否把发现转成业务动作。吸收能力研究强调已有相关知识对识别和应用外部知识的作用；它为“边采用边建设”提供了机制依据。[研究原文](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n不过，积累也会形成惯性。原系统投入越大，团队越可能维护原路线；原经验越成功，越容易忽视新条件。Teece所讨论的动态能力，正是企业使资源与能力持续适应变化的本领。保持相关性与拥有资源，是不同问题。[研究原文](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)\n\n## 早开始，并不等于所有早投入都有价值\n\n如果企业连续试了很多工具，却没有留下可复用的任务、真实反馈或内部理解，时间过去并不自动形成优势。相反，一段错误经验若被大量复用，还可能使修正更困难。\n\n因此，起步应选择能形成完整认识的小范围：有真实客户或内部使用者，有可以观察的结果，有业务负责人，也有把发现改成实际安排的工程力量。先建立可靠往返，再扩大范围。\n\nMETR关于开发工作的研究及其后续方法更新，也提醒企业：工具和工作方式变化后，旧测量需要重看。一次研究在特定任务上的结果，既不应被永久当作不用AI的理由，也不能因新工具发布就自动失效而无需重测。[原始研究](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)、[后续更新](https://metr.org/blog/2026-02-24-uplift-update/)\n\n## 连续力量为什么重要\n\n一次系统交付可以解决当时明确的问题，持续变化却需要有人保持现场认识、理解系统，并把反馈变成修改。企业因此需要连续工程能力，FDE可以承担其中的重要部分。\n\n这种连续性不必由同一家外部团队永久提供。内部、外部或混合团队都可能适合。真正需要保留的是企业对客户价值的理解、对有效方法的判断，以及接续和改变系统的能力。后面讨论长期FDE合作时，将据此评价共建，而不把合作年限当成果。\n\n## 形成一条能更新的发展路线\n\n教学连锁可以先验证售罄信息能否改善分配，再判断已有方法能否被接任店长使用，随后才决定如何进入第九家店。若交通条件变化使旧方法不再有效，下一步就应更新认识和安排；若配送成为瓶颈，就不应只继续升级模型。\n\n探索新可能与改善现有做法会争用资源。March的研究解释了这种长期张力，但没有给出人人适用的预算比例。[原始论文](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)\n\n企业可以拥有明确方向，同时保留调整方法的能力：持续改善客户获得的结果，使有效经验留下，让下一次建设更有依据。这比承诺某个时间点完成全部转型，更接近变化中的实际经营。\n","exportSingleMd":"# 第4章｜没有转型终稿，为什么仍要现在开始建设\n\n面对快速变化的AI，企业常有两种看法。一种是再等一等，等工具稳定、路线清楚后一次建好；另一种是尽快买齐系统，完成一次转型项目。\n\n两种想法都希望把不确定性留在建设之前。困难在于，很多问题只有真实使用后才会被看见：客户究竟需要什么，业务材料缺什么，哪一段值得交给AI，旧经验哪里已经不适用。企业自身也会在使用中改变。\n\n**AI转型需要持续取得、吸收和重组能力。主动建设的意义，在于使企业更能作出下一次选择，而非尽早把当前工具固定下来。**\n\n## 企业怎样靠近AI，AI又怎样靠近生产\n\n企业先从一条业务提供事实、目标、工作入口与反馈，让通用智能有机会参与真实任务。这是企业靠近AI的一面。\n\n模型与工程团队则要理解现场例外，把能力接到材料、工具和真实执行上，根据使用结果修正系统。这是AI靠近生产的一面。两边的认识会交替推进：企业可能发现原问题问错了，工程也可能发现真正缺口不在模型，而在业务状态或人员协作。\n\n以教学烘焙连锁为例，最初要求“AI自动写日报”很合理，因为整理日报占时间。现场工作却可能发现，更关键的价值是把提前售罄信息接入分配决定。实现这一点，又会暴露中央产能、配送和门店反馈的问题。新的认识由真实采用产生，很难在第一次需求会上全部写清。\n\n## 为什么相关积累会影响下一步\n\n一家企业已经能把建议、修改、实际执行和结果关联起来，换一项新能力时，就更容易比较它是否有用。另一家企业没有结果记录，即使接入更强模型，也可能继续靠印象判断。\n\n差距首先表现为学习条件：能否识别新技术的用途，能否组织一次有效试做，能否把发现转成业务动作。吸收能力研究强调已有相关知识对识别和应用外部知识的作用；它为“边采用边建设”提供了机制依据。[研究原文](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n不过，积累也会形成惯性。原系统投入越大，团队越可能维护原路线；原经验越成功，越容易忽视新条件。Teece所讨论的动态能力，正是企业使资源与能力持续适应变化的本领。保持相关性与拥有资源，是不同问题。[研究原文](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)\n\n## 早开始，并不等于所有早投入都有价值\n\n如果企业连续试了很多工具，却没有留下可复用的任务、真实反馈或内部理解，时间过去并不自动形成优势。相反，一段错误经验若被大量复用，还可能使修正更困难。\n\n因此，起步应选择能形成完整认识的小范围：有真实客户或内部使用者，有可以观察的结果，有业务负责人，也有把发现改成实际安排的工程力量。先建立可靠往返，再扩大范围。\n\nMETR关于开发工作的研究及其后续方法更新，也提醒企业：工具和工作方式变化后，旧测量需要重看。一次研究在特定任务上的结果，既不应被永久当作不用AI的理由，也不能因新工具发布就自动失效而无需重测。[原始研究](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)、[后续更新](https://metr.org/blog/2026-02-24-uplift-update/)\n\n## 连续力量为什么重要\n\n一次系统交付可以解决当时明确的问题，持续变化却需要有人保持现场认识、理解系统，并把反馈变成修改。企业因此需要连续工程能力，FDE可以承担其中的重要部分。\n\n这种连续性不必由同一家外部团队永久提供。内部、外部或混合团队都可能适合。真正需要保留的是企业对客户价值的理解、对有效方法的判断，以及接续和改变系统的能力。后面讨论长期FDE合作时，将据此评价共建，而不把合作年限当成果。\n\n## 形成一条能更新的发展路线\n\n教学连锁可以先验证售罄信息能否改善分配，再判断已有方法能否被接任店长使用，随后才决定如何进入第九家店。若交通条件变化使旧方法不再有效，下一步就应更新认识和安排；若配送成为瓶颈，就不应只继续升级模型。\n\n探索新可能与改善现有做法会争用资源。March的研究解释了这种长期张力，但没有给出人人适用的预算比例。[原始论文](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)\n\n企业可以拥有明确方向，同时保留调整方法的能力：持续改善客户获得的结果，使有效经验留下，让下一次建设更有依据。这比承诺某个时间点完成全部转型，更接近变化中的实际经营。\n","text":"# 第4章｜没有转型终稿，为什么仍要现在开始建设\n\n面对快速变化的AI，企业常有两种看法。一种是再等一等，等工具稳定、路线清楚后一次建好；另一种是尽快买齐系统，完成一次转型项目。\n\n两种想法都希望把不确定性留在建设之前。困难在于，很多问题只有真实使用后才会被看见：客户究竟需要什么，业务材料缺什么，哪一段值得交给AI，旧经验哪里已经不适用。企业自身也会在使用中改变。\n\n**AI转型需要持续取得、吸收和重组能力。主动建设的意义，在于使企业更能作出下一次选择，而非尽早把当前工具固定下来。**\n\n## 企业怎样靠近AI，AI又怎样靠近生产\n\n企业先从一条业务提供事实、目标、工作入口与反馈，让通用智能有机会参与真实任务。这是企业靠近AI的一面。\n\n模型与工程团队则要理解现场例外，把能力接到材料、工具和真实执行上，根据使用结果修正系统。这是AI靠近生产的一面。两边的认识会交替推进：企业可能发现原问题问错了，工程也可能发现真正缺口不在模型，而在业务状态或人员协作。\n\n以教学烘焙连锁为例，最初要求“AI自动写日报”很合理，因为整理日报占时间。现场工作却可能发现，更关键的价值是把提前售罄信息接入分配决定。实现这一点，又会暴露中央产能、配送和门店反馈的问题。新的认识由真实采用产生，很难在第一次需求会上全部写清。\n\n## 为什么相关积累会影响下一步\n\n一家企业已经能把建议、修改、实际执行和结果关联起来，换一项新能力时，就更容易比较它是否有用。另一家企业没有结果记录，即使接入更强模型，也可能继续靠印象判断。\n\n差距首先表现为学习条件：能否识别新技术的用途，能否组织一次有效试做，能否把发现转成业务动作。吸收能力研究强调已有相关知识对识别和应用外部知识的作用；它为“边采用边建设”提供了机制依据。研究原文\n\n不过，积累也会形成惯性。原系统投入越大，团队越可能维护原路线；原经验越成功，越容易忽视新条件。Teece所讨论的动态能力，正是企业使资源与能力持续适应变化的本领。保持相关性与拥有资源，是不同问题。研究原文\n\n## 早开始，并不等于所有早投入都有价值\n\n如果企业连续试了很多工具，却没有留下可复用的任务、真实反馈或内部理解，时间过去并不自动形成优势。相反，一段错误经验若被大量复用，还可能使修正更困难。\n\n因此，起步应选择能形成完整认识的小范围：有真实客户或内部使用者，有可以观察的结果，有业务负责人，也有把发现改成实际安排的工程力量。先建立可靠往返，再扩大范围。\n\nMETR关于开发工作的研究及其后续方法更新，也提醒企业：工具和工作方式变化后，旧测量需要重看。一次研究在特定任务上的结果，既不应被永久当作不用AI的理由，也不能因新工具发布就自动失效而无需重测。原始研究、后续更新\n\n## 连续力量为什么重要\n\n一次系统交付可以解决当时明确的问题，持续变化却需要有人保持现场认识、理解系统，并把反馈变成修改。企业因此需要连续工程能力，FDE可以承担其中的重要部分。\n\n这种连续性不必由同一家外部团队永久提供。内部、外部或混合团队都可能适合。真正需要保留的是企业对客户价值的理解、对有效方法的判断，以及接续和改变系统的能力。后面讨论长期FDE合作时，将据此评价共建，而不把合作年限当成果。\n\n## 形成一条能更新的发展路线\n\n教学连锁可以先验证售罄信息能否改善分配，再判断已有方法能否被接任店长使用，随后才决定如何进入第九家店。若交通条件变化使旧方法不再有效，下一步就应更新认识和安排；若配送成为瓶颈，就不应只继续升级模型。\n\n探索新可能与改善现有做法会争用资源。March的研究解释了这种长期张力，但没有给出人人适用的预算比例。原始论文\n\n企业可以拥有明确方向，同时保留调整方法的能力：持续改善客户获得的结果，使有效经验留下，让下一次建设更有依据。这比承诺某个时间点完成全部转型，更接近变化中的实际经营。\n"},{"file":"05-从经验到能力.md","id":"lesson-05","number":5,"role":"核心课","part":1,"title":"第5章｜一次成功，怎样成为企业下一次能用的能力","md":"# 第5章｜一次成功，怎样成为企业下一次能用的能力\n\n在设备售后教学情境中，资深技术员处理完一张工单，客户恢复使用。系统里留下“调整后恢复”六个字。负责人希望把这些工单交给AI，整理成企业自己的经验库。\n\n这件事值得做，但“整理出来”还没有回答最重要的问题：恢复是否因为这次调整？相似设备都适用吗？另一位技术员拿到材料，能否作出合适判断？如果能，这种能力又是否改善了客户选择？\n\n**事件、经验解释、可用方法、组织能力和竞争优势，是五个相连却不同的层次。每向前一步，都要增加条件。** 理解这些条件，才能知道企业正在积累什么。\n\n## 从发生过，到解释为什么\n\n“某日某台设备在调整后恢复”是一条事件记录。它保存观察与动作，便于重新检查。当记录缺少设备版本、当时情况和完整动作时，连事件本身也不够清楚。\n\n“这类问题可能由某项设置引起”则是对事件的解释。解释把零散事实组织起来，提出未来可用的认识。但先后发生不等于因果成立：技术员还可能重启过设备，运行负载也可能变化，客户描述还可能不完整。\n\n企业可以把这个解释保留为候选经验，让它帮助提出下一次要问什么、比较什么。此时最有价值的，可能是缩小调查方向，而不是立刻变成一条自动执行规则。\n\n## 从解释，到有条件的方法\n\n方法需要说明适用于哪些情况、采用什么判断与行动、如何观察结果，以及什么时候应停下或改法。它可以是一条明确规则，也可以是一组有条件的案例和判断依据。\n\n例如，经过进一步核对，企业可能确认某种经验只适用于特定版本，其他版本尚无证据。把这个限制留下，不会削弱方法，反而使下一位使用者知道如何采用。\n\n同样的道理适用于门店备货。曾经把X店多配20个，并不能形成通用方法；理解提前售罄、未满足请求、门店事件与中央约束如何共同影响分配，才更接近一种能够调整的做法。\n\n![事件到优势之间需要经过解释、适用检验、组织采用与客户选择。每上一层都有新的条件；资料增多不会自动越过这些条件。](assets/05-积累的层次.svg)\n\n## 从方法，到组织真的做得到\n\n即使方法正确，也可能只在原专家手里有用。他知道材料里没有写出的前提，拥有别人没有的工具入口，还知道应该找谁协调。\n\n当企业要把它变成组织能力，就需要让其他合适人员能够定位材料、理解条件、取得资源、实施行动并获得反馈。人员与工具、协作和知识共同支持结果，能力才不再完全依附于某个人的一次发挥。\n\n这里有一个简单检验：原技术员暂时不在，接任者面对一张新的、并非照搬原题的工单，能不能识别关键差别，作出合理下一步？这个检验比文件数量更接近组织是否获得能力。\n\nNonaka的组织知识研究强调实践与表达、个人与组织之间的转换。它帮助解释为什么把经验写下来有用，也解释为什么文字不能独自承担全部传承。[原始研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)\n\n## 从做得到，到客户愿意选择\n\n可靠解决问题是一种能力，竞争优势还需要额外关系。客户是否因此少停机、少反复沟通？它是否影响续约、购买或推荐？企业能否以可持续成本交付，并保留部分价值？竞争者是否容易取得同样办法？\n\n这些问题把组织能力连接到市场。企业内部觉得独特的技术动作，可能只是达到基本服务水准；真正使客户选择的，可能是及时响应与跨岗位协作。Teece关于动态能力的研究提醒我们，能力还需要保持与环境相关。[原始论文](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)\n\n| 当前拥有的东西 | 可以合理说什么 | 还不能直接说什么 |\n|---|---|---|\n| 完整工单 | 某件事曾这样发生 | 原因已被证实 |\n| 带依据的解释 | 值得在类似情况中检验 | 已形成通用方法 |\n| 经条件检验的方法 | 在明确范围内可以使用 | 企业所有岗位都能执行 |\n| 跨人采用与接续 | 组织获得了一部分能力 | 一定形成市场壁垒 |\n| 客户选择与可持续交付证据 | 能讨论竞争价值 | 优势永久有效 |\n\n五个层次不要求每条记录最终都变成优势。有些一次性交付本来就有价值，有些经验适用范围很窄，也不值得长期维护。企业要避免的是，把上游产物的增长当作下游成果的证据。\n\nAI可以降低整理、比较和调用的部分成本，也能提出新的解释与方法。FDE需要把这些可能性接到实际工作里。二者共同推进的对象，应是这条从事件到有效能力的转换，而不只是一个更大的资料库。\n","html":"\u003ch1>第5章｜一次成功，怎样成为企业下一次能用的能力\u003c/h1>\n\u003cp>在设备售后教学情境中，资深技术员处理完一张工单，客户恢复使用。系统里留下“调整后恢复”六个字。负责人希望把这些工单交给AI，整理成企业自己的经验库。\u003c/p>\n\u003cp>这件事值得做，但“整理出来”还没有回答最重要的问题：恢复是否因为这次调整？相似设备都适用吗？另一位技术员拿到材料，能否作出合适判断？如果能，这种能力又是否改善了客户选择？\u003c/p>\n\u003cp>\u003cstrong>事件、经验解释、可用方法、组织能力和竞争优势，是五个相连却不同的层次。每向前一步，都要增加条件。\u003c/strong> 理解这些条件，才能知道企业正在积累什么。\u003c/p>\n\u003ch2 id=\"lesson-05-section-1\">从发生过，到解释为什么\u003c/h2>\n\u003cp>“某日某台设备在调整后恢复”是一条事件记录。它保存观察与动作，便于重新检查。当记录缺少设备版本、当时情况和完整动作时，连事件本身也不够清楚。\u003c/p>\n\u003cp>“这类问题可能由某项设置引起”则是对事件的解释。解释把零散事实组织起来，提出未来可用的认识。但先后发生不等于因果成立：技术员还可能重启过设备，运行负载也可能变化，客户描述还可能不完整。\u003c/p>\n\u003cp>企业可以把这个解释保留为候选经验，让它帮助提出下一次要问什么、比较什么。此时最有价值的，可能是缩小调查方向，而不是立刻变成一条自动执行规则。\u003c/p>\n\u003ch2 id=\"lesson-05-section-2\">从解释，到有条件的方法\u003c/h2>\n\u003cp>方法需要说明适用于哪些情况、采用什么判断与行动、如何观察结果，以及什么时候应停下或改法。它可以是一条明确规则，也可以是一组有条件的案例和判断依据。\u003c/p>\n\u003cp>例如，经过进一步核对，企业可能确认某种经验只适用于特定版本，其他版本尚无证据。把这个限制留下，不会削弱方法，反而使下一位使用者知道如何采用。\u003c/p>\n\u003cp>同样的道理适用于门店备货。曾经把X店多配20个，并不能形成通用方法；理解提前售罄、未满足请求、门店事件与中央约束如何共同影响分配，才更接近一种能够调整的做法。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:i 自承担全部传承。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-05-section-4\">从做得到，到客户愿意选择\u003c/h2>\n\u003cp>可靠解决问题是一种能力，竞争优势还需要额外关系。客户是否因此少停机、少反复沟通？它是否影响续约、购买或推荐？企业能否以可持续成本交付，并保留部分价值？竞争者是否容易取得同样办法？\u003c/p>\n\u003cp>这些问题把组织能力连接到市场。企业内部觉得独特的技术动作，可能只是达到基本服务水准；真正使客户选择的，可能是及时响应与跨岗位协作。Teece关于动态能力的研究提醒我们，能力还需要保持与环境相关。\u003ca href=\"https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始论文\u003c/a>\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>当前拥有的东西\u003c/th>\n\u003cth>可以合理说什么\u003c/th>\n\u003cth>还不能直接说什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>完整工单\u003c/td>\n\u003ctd>某件事曾这样发生\u003c/td>\n\u003ctd>原因已被证实\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>带依据的解释\u003c/td>\n\u003ctd>值得在类似情况中检验\u003c/td>\n\u003ctd>已形成通用方法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>经条件检验的方法\u003c/td>\n\u003ctd>在明确范围内可以使用\u003c/td>\n\u003ctd>企业所有岗位都能执行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>跨人采用与接续\u003c/td>\n\u003ctd>组织获得了一部分能力\u003c/td>\n\u003ctd>一定形成市场壁垒\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>客户选择与可持续交付证据\u003c/td>\n\u003ctd>能讨论竞争价值\u003c/td>\n\u003ctd>优势永久有效\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>五个层次不要求每条记录最终都变成优势。有些一次性交付本来就有价值，有些经验适用范围很窄，也不值得长期维护。企业要避免的是，把上游产物的增长当作下游成果的证据。\u003c/p>\n\u003cp>AI可以降低整理、比较和调用的部分成本，也能提出新的解释与方法。FDE需要把这些可能性接到实际工作里。二者共同推进的对象，应是这条从事件到有效能力的转换，而不只是一个更大的资料库。\u003c/p>\n","headings":[{"id":"lesson-05-section-1","label":"从发生过，到解释为什么"},{"id":"lesson-05-section-2","label":"从解释，到有条件的方法"},{"id":"lesson-05-section-3","label":"从方法，到组织真的做得到"},{"id":"lesson-05-section-4","label":"从做得到，到客户愿意选择"}],"exportMd":"# 第5章｜一次成功，怎样成为企业下一次能用的能力\n\n在设备售后教学情境中，资深技术员处理完一张工单，客户恢复使用。系统里留下“调整后恢复”六个字。负责人希望把这些工单交给AI，整理成企业自己的经验库。\n\n这件事值得做，但“整理出来”还没有回答最重要的问题：恢复是否因为这次调整？相似设备都适用吗？另一位技术员拿到材料，能否作出合适判断？如果能，这种能力又是否改善了客户选择？\n\n**事件、经验解释、可用方法、组织能力和竞争优势，是五个相连却不同的层次。每向前一步，都要增加条件。** 理解这些条件，才能知道企业正在积累什么。\n\n## 从发生过，到解释为什么\n\n“某日某台设备在调整后恢复”是一条事件记录。它保存观察与动作，便于重新检查。当记录缺少设备版本、当时情况和完整动作时，连事件本身也不够清楚。\n\n“这类问题可能由某项设置引起”则是对事件的解释。解释把零散事实组织起来，提出未来可用的认识。但先后发生不等于因果成立：技术员还可能重启过设备，运行负载也可能变化，客户描述还可能不完整。\n\n企业可以把这个解释保留为候选经验，让它帮助提出下一次要问什么、比较什么。此时最有价值的，可能是缩小调查方向，而不是立刻变成一条自动执行规则。\n\n## 从解释，到有条件的方法\n\n方法需要说明适用于哪些情况、采用什么判断与行动、如何观察结果，以及什么时候应停下或改法。它可以是一条明确规则，也可以是一组有条件的案例和判断依据。\n\n例如，经过进一步核对，企业可能确认某种经验只适用于特定版本，其他版本尚无证据。把这个限制留下，不会削弱方法，反而使下一位使用者知道如何采用。\n\n同样的道理适用于门店备货。曾经把X店多配20个，并不能形成通用方法；理解提前售罄、未满足请求、门店事件与中央约束如何共同影响分配，才更接近一种能够调整的做法。\n\n![事件到优势之间需要经过解释、适用检验、组织采用与客户选择。每上一层都有新的条件；资料增多不会自动越过这些条件。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTcwIiB2aWV3Qm94PSIwIDAgMzYwIDU3MCIgcm9sZT0iaW1nIj48dGl0bGU+5q+P5LiA5bGC6YO95aSa5LiA6aG55p2h5Lu2PC90aXRsZT48ZGVzYz7kuovku7bjgIHop6Pph4rjgIHmlrnms5XjgIHnu4Tnu4fog73lipvkuI7kvJjlir/kuYvpl7TpnIDopoHkuI3lkIzmnaHku7bvvIzkuI3mmK/mlbDph4/oh6rliqjlop7plb/jgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjU3MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7mr4/kuIDlsYLpg73lpJrkuIDpobnmnaHku7Y8L3RleHQ+PHBhdGggZD0iTTU0IDEzMkw1NCAxNjciIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzE2NWQ1MiIgc3Ryb2tlLXdpZHRoPSIyIiBtYXJrZXItZW5kPSJ1cmwoI2Fycm93KSIvPjxwYXRoIG S8mOWKvzwvdGV4dD48dGV4dCB4PSIxMDUiIHk9IjUxMiIgZm9udC1mYW1pbHk9IlBpbmdGYW5nIFNDLE1pY3Jvc29mdCBZYUhlaSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmaWxsPSIjNTI2ODVlIiB0ZXh0LWFuY2hvcj0ic3RhcnQiIGZvbnQtd2VpZ2h0PSI0MDAiPuWuouaIt+iupOWPr+S4lOWPr+aMgee7rTwvdGV4dD48L3N2Zz4=)\n\n## 从方法，到组织真的做得到\n\n即使方法正确，也可能只在原专家手里有用。他知道材料里没有写出的前提，拥有别人没有的工具入口，还知道应该找谁协调。\n\n当企业要把它变成组织能力，就需要让其他合适人员能够定位材料、理解条件、取得资源、实施行动并获得反馈。人员与工具、协作和知识共同支持结果，能力才不再完全依附于某个人的一次发挥。\n\n这里有一个简单检验：原技术员暂时不在，接任者面对一张新的、并非照搬原题的工单，能不能识别关键差别，作出合理下一步？这个检验比文件数量更接近组织是否获得能力。\n\nNonaka的组织知识研究强调实践与表达、个人与组织之间的转换。它帮助解释为什么把经验写下来有用，也解释为什么文字不能独自承担全部传承。[原始研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)\n\n## 从做得到，到客户愿意选择\n\n可靠解决问题是一种能力，竞争优势还需要额外关系。客户是否因此少停机、少反复沟通？它是否影响续约、购买或推荐？企业能否以可持续成本交付，并保留部分价值？竞争者是否容易取得同样办法？\n\n这些问题把组织能力连接到市场。企业内部觉得独特的技术动作，可能只是达到基本服务水准；真正使客户选择的，可能是及时响应与跨岗位协作。Teece关于动态能力的研究提醒我们，能力还需要保持与环境相关。[原始论文](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)\n\n| 当前拥有的东西 | 可以合理说什么 | 还不能直接说什么 |\n|---|---|---|\n| 完整工单 | 某件事曾这样发生 | 原因已被证实 |\n| 带依据的解释 | 值得在类似情况中检验 | 已形成通用方法 |\n| 经条件检验的方法 | 在明确范围内可以使用 | 企业所有岗位都能执行 |\n| 跨人采用与接续 | 组织获得了一部分能力 | 一定形成市场壁垒 |\n| 客户选择与可持续交付证据 | 能讨论竞争价值 | 优势永久有效 |\n\n五个层次不要求每条记录最终都变成优势。有些一次性交付本来就有价值，有些经验适用范围很窄，也不值得长期维护。企业要避免的是，把上游产物的增长当作下游成果的证据。\n\nAI可以降低整理、比较和调用的部分成本，也能提出新的解释与方法。FDE需要把这些可能性接到实际工作里。二者共同推进的对象，应是这条从事件到有效能力的转换，而不只是一个更大的资料库。\n","exportSingleMd":"# 第5章｜一次成功，怎样成为企业下一次能用的能力\n\n在设备售后教学情境中，资深技术员处理完一张工单，客户恢复使用。系统里留下“调整后恢复”六个字。负责人希望把这些工单交给AI，整理成企业自己的经验库。\n\n这件事值得做，但“整理出来”还没有回答最重要的问题：恢复是否因为这次调整？相似设备都适用吗？另一位技术员拿到材料，能否作出合适判断？如果能，这种能力又是否改善了客户选择？\n\n**事件、经验解释、可用方法、组织能力和竞争优势，是五个相连却不同的层次。每向前一步，都要增加条件。** 理解这些条件，才能知道企业正在积累什么。\n\n## 从发生过，到解释为什么\n\n“某日某台设备在调整后恢复”是一条事件记录。它保存观察与动作，便于重新检查。当记录缺少设备版本、当时情况和完整动作时，连事件本身也不够清楚。\n\n“这类问题可能由某项设置引起”则是对事件的解释。解释把零散事实组织起来，提出未来可用的认识。但先后发生不等于因果成立：技术员还可能重启过设备，运行负载也可能变化，客户描述还可能不完整。\n\n企业可以把这个解释保留为候选经验，让它帮助提出下一次要问什么、比较什么。此时最有价值的，可能是缩小调查方向，而不是立刻变成一条自动执行规则。\n\n## 从解释，到有条件的方法\n\n方法需要说明适用于哪些情况、采用什么判断与行动、如何观察结果，以及什么时候应停下或改法。它可以是一条明确规则，也可以是一组有条件的案例和判断依据。\n\n例如，经过进一步核对，企业可能确认某种经验只适用于特定版本，其他版本尚无证据。把这个限制留下，不会削弱方法，反而使下一位使用者知道如何采用。\n\n同样的道理适用于门店备货。曾经把X店多配20个，并不能形成通用方法；理解提前售罄、未满足请求、门店事件与中央约束如何共同影响分配，才更接近一种能够调整的做法。\n\n![事件到优势之间需要经过解释、适用检验、组织采用与客户选择。每上一层都有新的条件；资料增多不会自动越过这些条件。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTcwIiB2aWV3Qm94PSIwIDAgMzYwIDU3MCIgcm9sZT0iaW1nIj48dGl0bGU+5q+P5LiA5bGC6YO95aSa5LiA6aG55p2h5Lu2PC90aXRsZT48ZGVzYz7kuovku7bjgIHop6Pph4rjgIHmlrnms5XjgIHnu4Tnu4fog73lipvkuI7kvJjlir/kuYvpl7TpnIDopoHkuI3lkIzmnaHku7bvvIzkuI3mmK/mlbDph4/oh6rliqjlop7plb/jgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjU3MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7mr4/kuIDlsYLpg73lpJrkuIDpobnmnaHku7Y8L3RleHQ+PHBhdGggZD0iTTU0IDEzMkw1NCAxNjciIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzE2NWQ1MiIgc3Ryb2tlLXdpZHRoPSIyIiBtYXJrZXItZW5kPSJ1cmwoI2Fycm93KSIvPjxwYXRoIGQ9Ik01NCAyMjhMNTQgMjYzIiBmaWxsPSJub25lIiBzdHJva2U9IiMxNjVkNTIiIHN0cm9rZS13aWR0aD0iMiIgbWFya2VyLWVuZD0idXJsKCNhcnJvdykiLz48cGF0aCBkPSJNNTQgMzI0TDU0IDM1OSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMTY1ZDUyIiBzdHJva2Utd2lkdGg9IjIiIG1hcmtlci1lbmQ9InVybCgjYXJyb3cpIi8+PHBhdGggZD0iTTU0IDQyMEw1NCA0NTUiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzE2NWQ1MiIgc3Ryb2tlLXdpZHRoPSIyIiBtYXJrZXItZW5kPSJ1cmwoI2Fycm93KSIvPjxwYXRoIGQ9Ik0yOCA3NUg2NUw4MSA5MVYxMzFIMjhaIiBmaWxsPSJ3aGl0ZSIgc3Ryb2tlPSIjNjA3MzZjIiBzdHJva2Utd2lkdGg9Ij 合理下一步？这个检验比文件数量更接近组织是否获得能力。\n\nNonaka的组织知识研究强调实践与表达、个人与组织之间的转换。它帮助解释为什么把经验写下来有用，也解释为什么文字不能独自承担全部传承。[原始研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)\n\n## 从做得到，到客户愿意选择\n\n可靠解决问题是一种能力，竞争优势还需要额外关系。客户是否因此少停机、少反复沟通？它是否影响续约、购买或推荐？企业能否以可持续成本交付，并保留部分价值？竞争者是否容易取得同样办法？\n\n这些问题把组织能力连接到市场。企业内部觉得独特的技术动作，可能只是达到基本服务水准；真正使客户选择的，可能是及时响应与跨岗位协作。Teece关于动态能力的研究提醒我们，能力还需要保持与环境相关。[原始论文](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)\n\n| 当前拥有的东西 | 可以合理说什么 | 还不能直接说什么 |\n|---|---|---|\n| 完整工单 | 某件事曾这样发生 | 原因已被证实 |\n| 带依据的解释 | 值得在类似情况中检验 | 已形成通用方法 |\n| 经条件检验的方法 | 在明确范围内可以使用 | 企业所有岗位都能执行 |\n| 跨人采用与接续 | 组织获得了一部分能力 | 一定形成市场壁垒 |\n| 客户选择与可持续交付证据 | 能讨论竞争价值 | 优势永久有效 |\n\n五个层次不要求每条记录最终都变成优势。有些一次性交付本来就有价值，有些经验适用范围很窄，也不值得长期维护。企业要避免的是，把上游产物的增长当作下游成果的证据。\n\nAI可以降低整理、比较和调用的部分成本，也能提出新的解释与方法。FDE需要把这些可能性接到实际工作里。二者共同推进的对象，应是这条从事件到有效能力的转换，而不只是一个更大的资料库。\n","text":"# 第5章｜一次成功，怎样成为企业下一次能用的能力\n\n在设备售后教学情境中，资深技术员处理完一张工单，客户恢复使用。系统里留下“调整后恢复”六个字。负责人希望把这些工单交给AI，整理成企业自己的经验库。\n\n这件事值得做，但“整理出来”还没有回答最重要的问题：恢复是否因为这次调整？相似设备都适用吗？另一位技术员拿到材料，能否作出合适判断？如果能，这种能力又是否改善了客户选择？\n\n**事件、经验解释、可用方法、组织能力和竞争优势，是五个相连却不同的层次。每向前一步，都要增加条件。** 理解这些条件，才能知道企业正在积累什么。\n\n## 从发生过，到解释为什么\n\n“某日某台设备在调整后恢复”是一条事件记录。它保存观察与动作，便于重新检查。当记录缺少设备版本、当时情况和完整动作时，连事件本身也不够清楚。\n\n“这类问题可能由某项设置引起”则是对事件的解释。解释把零散事实组织起来，提出未来可用的认识。但先后发生不等于因果成立：技术员还可能重启过设备，运行负载也可能变化，客户描述还可能不完整。\n\n企业可以把这个解释保留为候选经验，让它帮助提出下一次要问什么、比较什么。此时最有价值的，可能是缩小调查方向，而不是立刻变成一条自动执行规则。\n\n## 从解释，到有条件的方法\n\n方法需要说明适用于哪些情况、采用什么判断与行动、如何观察结果，以及什么时候应停下或改法。它可以是一条明确规则，也可以是一组有条件的案例和判断依据。\n\n例如，经过进一步核对，企业可能确认某种经验只适用于特定版本，其他版本尚无证据。把这个限制留下，不会削弱方法，反而使下一位使用者知道如何采用。\n\n同样的道理适用于门店备货。曾经把X店多配20个，并不能形成通用方法；理解提前售罄、未满足请求、门店事件与中央约束如何共同影响分配，才更接近一种能够调整的做法。\n\n \n\n## 从方法，到组织真的做得到\n\n即使方法正确，也可能只在原专家手里有用。他知道材料里没有写出的前提，拥有别人没有的工具入口，还知道应该找谁协调。\n\n当企业要把它变成组织能力，就需要让其他合适人员能够定位材料、理解条件、取得资源、实施行动并获得反馈。人员与工具、协作和知识共同支持结果，能力才不再完全依附于某个人的一次发挥。\n\n这里有一个简单检验：原技术员暂时不在，接任者面对一张新的、并非照搬原题的工单，能不能识别关键差别，作出合理下一步？这个检验比文件数量更接近组织是否获得能力。\n\nNonaka的组织知识研究强调实践与表达、个人与组织之间的转换。它帮助解释为什么把经验写下来有用，也解释为什么文字不能独自承担全部传承。原始研究\n\n## 从做得到，到客户愿意选择\n\n可靠解决问题是一种能力，竞争优势还需要额外关系。客户是否因此少停机、少反复沟通？它是否影响续约、购买或推荐？企业能否以可持续成本交付，并保留部分价值？竞争者是否容易取得同样办法？\n\n这些问题把组织能力连接到市场。企业内部觉得独特的技术动作，可能只是达到基本服务水准；真正使客户选择的，可能是及时响应与跨岗位协作。Teece关于动态能力的研究提醒我们，能力还需要保持与环境相关。原始论文\n\n| 当前拥有的东西 | 可以合理说什么 | 还不能直接说什么 |\n|---|---|---|\n| 完整工单 | 某件事曾这样发生 | 原因已被证实 |\n| 带依据的解释 | 值得在类似情况中检验 | 已形成通用方法 |\n| 经条件检验的方法 | 在明确范围内可以使用 | 企业所有岗位都能执行 |\n| 跨人采用与接续 | 组织获得了一部分能力 | 一定形成市场壁垒 |\n| 客户选择与可持续交付证据 | 能讨论竞争价值 | 优势永久有效 |\n\n五个层次不要求每条记录最终都变成优势。有些一次性交付本来就有价值，有些经验适用范围很窄，也不值得长期维护。企业要避免的是，把上游产物的增长当作下游成果的证据。\n\nAI可以降低整理、比较和调用的部分成本，也能提出新的解释与方法。FDE需要把这些可能性接到实际工作里。二者共同推进的对象，应是这条从事件到有效能力的转换，而不只是一个更大的资料库。\n"},{"file":"06-人的衔接损耗.md","id":"lesson-06","number":6,"role":"核心课","part":1,"title":"第6章｜人的衔接为什么会丢掉判断价值","md":"# 第6章｜人的衔接为什么会丢掉判断价值\n\n教学连锁里，店长发给总部的消息是：“18点卖光，后来仍有人问，明天请多配。”日报显示：“X店销量80，剩余0。”中央团队第二天继续按80个分配。\n\n消息传到了，总部也准时完成了日报。问题却没有被带进分配决定。这种损耗不主要发生在网络传输，而发生在不同岗位对同一件事的重新组织中。\n\n**人在衔接时往往保留对自己有用的部分，压缩掉下一岗位可能需要的条件。** AI只有把这些条件重新接到具体决定上，才可能减少损耗。\n\n## 同一句话，在不同岗位承担不同任务\n\n店长的原话至少包含三层：一个已报告的事实——18点售罄；一个数量未知的现象——之后仍有人询问；一个行动请求——希望明天多配。它没有证明明天应配多少，也没有区分询问者是否会真实购买。\n\n日报的任务可能是汇总销售，保留销量与剩余已经满足填报要求。中央分配人员接到数字后，则需要判断需求、产能与配送。中间被删去的时点与询问，恰好可能影响这个判断。\n\n岗位都可能认真完成自己的工作，却没有共同保存一项决定所需的上下文。只要求“沟通再及时一点”，无法解释应该多传什么、传到哪里。\n\n![现场消息经日报压缩，售罄时点与未满足请求被丢失；直接把相关原材料连接到分配任务，可让下一岗位看见条件和未知。](assets/06-交接中的丢失.svg)\n\n## 反复解释，会怎样变成经营损耗\n\n如果分配人员意识到材料不足，就要找店长补问。店长可能已经忙别的工作，补充延后；如果没有意识到不足，就可能把80当作稳定需求。前者形成等待，后者形成判断偏差。\n\n下一轮有新人员加入，还会重新解释一次。随着协作链变长，原始条件可能越来越难追溯。企业最终承担的是重复沟通、返工、响应变慢，或者错误判断持续进入后续行动。\n\n不过，并非全部等待都来自信息。中央团队可能知道需求更高，却没有生产容量；也可能因门店考核不同而有意压低配货。把这些问题都称为“信息不透明”，就会用资料共享代替真正的资源与管理选择。\n\n吸收能力研究强调，组织取得外部知识之后，还要有内部沟通和相关认识才能应用。多任务激励理论则解释了为什么人员会把注意力投向被评价的维度。它们分别帮助辨认理解问题与目标问题。[吸收能力](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)、[多任务激励](https://web.stanford.edu/~milgrom/publishedarticles/Multitask%20Principal%20Agent.pdf)\n\n## AI怎样减少衔接损耗\n\n一种做法是自动生成更清晰的日报。这可以减少整理劳动，却仍可能只保留总部已有字段。另一种做法，是围绕下一次分配，把门店消息、销量、商品和营业日关联起来，让决定者按需取得相关原材料。\n\n后者还应保留不同信息的性质：“售罄”是报告事实，“需求超过80”是有理由的解释，“明天配100”是候选动作。AI如果把三者合成一句确定建议，就可能在补上下文时制造新跳步。\n\n有效衔接也需要选择。把整天聊天全部塞给分配人员，会产生新的阅读负担。合理目标是：让重要决定能找到所需条件，在有疑问时能够回到原材料，而不是让每个人读完所有内容。\n\n## 用一笔业务定位真正断点\n\n可以选一笔近期反复沟通的业务，按实际经过检查：最初材料包含什么，每一岗位为了完成自己的工作删减了什么，下一岗位因此缺少哪项决定条件，最后是通过补问、猜测还是重新调查解决。\n\n然后分别判断三类原因。若是事实没有被观察，需要改变生产记录；若是事实存在却没有到达决定处，需要改变关联和呈现；若是目标或资源冲突，需要由有权安排的人作取舍。它们可以同时存在，但改法不同。\n\nFDE在这里的价值，是理解断点，并把新的衔接方式做进实际工作。能否减少重复解释、使决定更有依据，还要由真实采用检验。下一章因此要进一步回答：怎样让记录从生产开始形成，而不把积累变成员工额外的一份工作。\n","html":"\u003ch1>第6章｜人的衔接为什么会丢掉判断价值\u003c/h1>\n\u003cp>教学连锁里，店长发给总部的消息是：“18点卖光，后来仍有人问，明天请多配。”日报显示：“X店销量80，剩余0。”中央团队第二天继续按80个分配。\u003c/p>\n\u003cp>消息传到了，总部也准时完成了日报。问题却没有被带进分配决定。这种损耗不主要发生在网络传输，而发生在不同岗位对同一件事的重新组织中。\u003c/p>\n\u003cp>\u003cstrong>人在衔接时往往保留对自己有用的部分，压缩掉下一岗位可能需要的条件。\u003c/strong> AI只有把这些条件重新接到具体决定上，才可能减少损耗。\u003c/p>\n\u003ch2 id=\"lesson-06-section-1\">同一句话，在不同岗位承担不同任务\u003c/h2>\n\u003cp>店长的原话至少包含三层：一个已报告的事实——18点售罄；一个数量未知的现象——之后仍有人询问；一个行动请求——希望明天多配。它没有证明明天应配多少，也没有区分询问者是否会真实购买。\u003c/p>\n\u003cp>日报的任务可能是汇总销售，保留销量与剩余已经满足填报要求。中央分配人员接到数字后，则需要判断需求、产能与配送。中间被删去的时点与询问，恰好可能影响这个判断。\u003c/p>\n\u003cp>岗位都可能认真完成自己的工作，却没有共同保存一项决定所需的上下文。只要求“沟通再及时一点”，无法解释应该多传什么、传到哪里。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTIwIiB2aWV3Qm94PSIwIDAgMzYwIDUyMCIgcm9sZT0iaW1nIj48dGl0bGU+5Lqk5o6l5Lit5Lii5o6J55qE5piv5p2h5Lu2PC90aXRsZT48ZGVzYz7pl6jlupfljp/or53mnInllK7nvYTml7bngrnjgIHor6Lpl67kuI7or7fmsYLvvIzml6XmiqXlj6rlianplIDph4/vvJvlhbPogZTljp/mnZDmlpnlj6/mlK/mjIHliIbphY3jgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMj  target=\"_blank\" rel=\"noopener noreferrer\">多任务激励\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-06-section-3\">AI怎样减少衔接损耗\u003c/h2>\n\u003cp>一种做法是自动生成更清晰的日报。这可以减少整理劳动，却仍可能只保留总部已有字段。另一种做法，是围绕下一次分配，把门店消息、销量、商品和营业日关联起来，让决定者按需取得相关原材料。\u003c/p>\n\u003cp>后者还应保留不同信息的性质：“售罄”是报告事实，“需求超过80”是有理由的解释，“明天配100”是候选动作。AI如果把三者合成一句确定建议，就可能在补上下文时制造新跳步。\u003c/p>\n\u003cp>有效衔接也需要选择。把整天聊天全部塞给分配人员，会产生新的阅读负担。合理目标是：让重要决定能找到所需条件，在有疑问时能够回到原材料，而不是让每个人读完所有内容。\u003c/p>\n\u003ch2 id=\"lesson-06-section-4\">用一笔业务定位真正断点\u003c/h2>\n\u003cp>可以选一笔近期反复沟通的业务，按实际经过检查：最初材料包含什么，每一岗位为了完成自己的工作删减了什么，下一岗位因此缺少哪项决定条件，最后是通过补问、猜测还是重新调查解决。\u003c/p>\n\u003cp>然后分别判断三类原因。若是事实没有被观察，需要改变生产记录；若是事实存在却没有到达决定处，需要改变关联和呈现；若是目标或资源冲突，需要由有权安排的人作取舍。它们可以同时存在，但改法不同。\u003c/p>\n\u003cp>FDE在这里的价值，是理解断点，并把新的衔接方式做进实际工作。能否减少重复解释、使决定更有依据，还要由真实采用检验。下一章因此要进一步回答：怎样让记录从生产开始形成，而不把积累变成员工额外的一份工作。\u003c/p>\n","headings":[{"id":"lesson-06-section-1","label":"同一句话，在不同岗位承担不同任务"},{"id":"lesson-06-section-2","label":"反复解释，会怎样变成经营损耗"},{"id":"lesson-06-section-3","label":"AI怎样减少衔接损耗"},{"id":"lesson-06-section-4","label":"用一笔业务定位真正断点"}],"exportMd":"# 第6章｜人的衔接为什么会丢掉判断价值\n\n教学连锁里，店长发给总部的消息是：“18点卖光，后来仍有人问，明天请多配。”日报显示：“X店销量80，剩余0。”中央团队第二天继续按80个分配。\n\n消息传到了，总部也准时完成了日报。问题却没有被带进分配决定。这种损耗不主要发生在网络传输，而发生在不同岗位对同一件事的重新组织中。\n\n**人在衔接时往往保留对自己有用的部分，压缩掉下一岗位可能需要的条件。** AI只有把这些条件重新接到具体决定上，才可能减少损耗。\n\n## 同一句话，在不同岗位承担不同任务\n\n店长的原话至少包含三层：一个已报告的事实——18点售罄；一个数量未知的现象——之后仍有人询问；一个行动请求——希望明天多配。它没有证明明天应配多少，也没有区分询问者是否会真实购买。\n\n日报的任务可能是汇总销售，保留销量与剩余已经满足填报要求。中央分配人员接到数字后，则需要判断需求、产能与配送。中间被删去的时点与询问，恰好可能影响这个判断。\n\n岗位都可能认真完成自己的工作，却没有共同保存一项决定所需的上下文。只要求“沟通再及时一点”，无法解释应该多传什么、传到哪里。\n\n![现场消息经日报压缩，售罄时点与未满足请求被丢失；直接把相关原材料连接到分配任务，可让下一岗位看见条件和未知。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTIwIiB2aWV3Qm94PSIwIDAgMzYwIDUyMCIgcm9sZT0iaW1nIj48dGl0bGU+5Lqk5o6l5Lit5Lii5o6J55qE5piv5p2h5Lu2PC90aXRsZT48ZGVzYz7pl6jlupfljp/or53mnInllK7nvYTml7bngrnjgIHor6Lpl67kuI7or7fmsYLvvIzml6XmiqXlj6rlianplIDph4/vvJvlhbPogZTljp/mnZDmlpnlj6/mlK/mjIHliIbphY3jgII8L2Rlc2M+ .edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)、[多任务激励](https://web.stanford.edu/~milgrom/publishedarticles/Multitask%20Principal%20Agent.pdf)\n\n## AI怎样减少衔接损耗\n\n一种做法是自动生成更清晰的日报。这可以减少整理劳动，却仍可能只保留总部已有字段。另一种做法，是围绕下一次分配，把门店消息、销量、商品和营业日关联起来，让决定者按需取得相关原材料。\n\n后者还应保留不同信息的性质：“售罄”是报告事实，“需求超过80”是有理由的解释，“明天配100”是候选动作。AI如果把三者合成一句确定建议，就可能在补上下文时制造新跳步。\n\n有效衔接也需要选择。把整天聊天全部塞给分配人员，会产生新的阅读负担。合理目标是：让重要决定能找到所需条件，在有疑问时能够回到原材料，而不是让每个人读完所有内容。\n\n## 用一笔业务定位真正断点\n\n可以选一笔近期反复沟通的业务，按实际经过检查：最初材料包含什么，每一岗位为了完成自己的工作删减了什么，下一岗位因此缺少哪项决定条件，最后是通过补问、猜测还是重新调查解决。\n\n然后分别判断三类原因。若是事实没有被观察，需要改变生产记录；若是事实存在却没有到达决定处，需要改变关联和呈现；若是目标或资源冲突，需要由有权安排的人作取舍。它们可以同时存在，但改法不同。\n\nFDE在这里的价值，是理解断点，并把新的衔接方式做进实际工作。能否减少重复解释、使决定更有依据，还要由真实采用检验。下一章因此要进一步回答：怎样让记录从生产开始形成，而不把积累变成员工额外的一份工作。\n","exportSingleMd":"# 第6章｜人的衔接为什么会丢掉判断价值\n\n教学连锁里，店长发给总部的消息是：“18点卖光，后来仍有人问，明天请多配。”日报显示：“X店销量80，剩余0。”中央团队第二天继续按80个分配。\n\n消息传到了，总部也准时完成了日报。问题却没有被带进分配决定。这种损耗不主要发生在网络传输，而发生在不同岗位对同一件事的重新组织中。\n\n**人在衔接时往往保留对自己有用的部分，压缩掉下一岗位可能需要的条件。** AI只有把这些条件重新接到具体决定上，才可能减少损耗。\n\n## 同一句话，在不同岗位承担不同任务\n\n店长的原话至少包含三层：一个已报告的事实——18点售罄；一个数量未知的现象——之后仍有人询问；一个行动请求——希望明天多配。它没有证明明天应配多少，也没有区分询问者是否会真实购买。\n\n日报的任务可能是汇总销售，保留销量与剩余已经满足填报要求。中央分配人员接到数字后，则需要判断需求、产能与配送。中间被删去的时点与询问，恰好可能影响这个判断。\n\n岗位都可能认真完成自己的工作，却没有共同保存一项决定所需的上下文。只要求“沟通再及时一点”，无法解释应该多传什么、传到哪里。\n\n![现场消息经日报压缩，售罄时点与未满足请求被丢失；直接把相关原材料连接到分配任务，可让下一岗位看见条件和未知。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTIwIiB2aWV3Qm94PSIwIDAgMzYwIDUyMCIgcm9sZT0iaW1nIj48dGl0bGU+5Lqk5o6l5Lit5Lii5o6J55qE5piv5p2h5Lu2PC90aXRsZT48ZGVzYz7pl6jlupfljp/or53mnInllK7nvYTml7bngrnjgIHor6Lpl67kuI7or7fmsYLvvIzml6XmiqXlj6rlianplIDph4/vvJvlhbPogZTljp/mnZDmlpnlj6/mlK/mjIHliIbphY3jgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuV 过80”是有理由的解释，“明天配100”是候选动作。AI如果把三者合成一句确定建议，就可能在补上下文时制造新跳步。\n\n有效衔接也需要选择。把整天聊天全部塞给分配人员，会产生新的阅读负担。合理目标是：让重要决定能找到所需条件，在有疑问时能够回到原材料，而不是让每个人读完所有内容。\n\n## 用一笔业务定位真正断点\n\n可以选一笔近期反复沟通的业务，按实际经过检查：最初材料包含什么，每一岗位为了完成自己的工作删减了什么，下一岗位因此缺少哪项决定条件，最后是通过补问、猜测还是重新调查解决。\n\n然后分别判断三类原因。若是事实没有被观察，需要改变生产记录；若是事实存在却没有到达决定处，需要改变关联和呈现；若是目标或资源冲突，需要由有权安排的人作取舍。它们可以同时存在，但改法不同。\n\nFDE在这里的价值，是理解断点，并把新的衔接方式做进实际工作。能否减少重复解释、使决定更有依据，还要由真实采用检验。下一章因此要进一步回答：怎样让记录从生产开始形成，而不把积累变成员工额外的一份工作。\n","text":"# 第6章｜人的衔接为什么会丢掉判断价值\n\n教学连锁里，店长发给总部的消息是：“18点卖光，后来仍有人问，明天请多配。”日报显示：“X店销量80，剩余0。”中央团队第二天继续按80个分配。\n\n消息传到了，总部也准时完成了日报。问题却没有被带进分配决定。这种损耗不主要发生在网络传输，而发生在不同岗位对同一件事的重新组织中。\n\n**人在衔接时往往保留对自己有用的部分，压缩掉下一岗位可能需要的条件。** AI只有把这些条件重新接到具体决定上，才可能减少损耗。\n\n## 同一句话，在不同岗位承担不同任务\n\n店长的原话至少包含三层：一个已报告的事实——18点售罄；一个数量未知的现象——之后仍有人询问；一个行动请求——希望明天多配。它没有证明明天应配多少，也没有区分询问者是否会真实购买。\n\n日报的任务可能是汇总销售，保留销量与剩余已经满足填报要求。中央分配人员接到数字后，则需要判断需求、产能与配送。中间被删去的时点与询问，恰好可能影响这个判断。\n\n岗位都可能认真完成自己的工作，却没有共同保存一项决定所需的上下文。只要求“沟通再及时一点”，无法解释应该多传什么、传到哪里。\n\n \n\n## 反复解释，会怎样变成经营损耗\n\n如果分配人员意识到材料不足，就要找店长补问。店长可能已经忙别的工作，补充延后；如果没有意识到不足，就可能把80当作稳定需求。前者形成等待，后者形成判断偏差。\n\n下一轮有新人员加入，还会重新解释一次。随着协作链变长，原始条件可能越来越难追溯。企业最终承担的是重复沟通、返工、响应变慢，或者错误判断持续进入后续行动。\n\n不过，并非全部等待都来自信息。中央团队可能知道需求更高，却没有生产容量；也可能因门店考核不同而有意压低配货。把这些问题都称为“信息不透明”，就会用资料共享代替真正的资源与管理选择。\n\n吸收能力研究强调，组织取得外部知识之后，还要有内部沟通和相关认识才能应用。多任务激励理论则解释了为什么人员会把注意力投向被评价的维度。它们分别帮助辨认理解问题与目标问题。吸收能力、多任务激励\n\n## AI怎样减少衔接损耗\n\n一种做法是自动生成更清晰的日报。这可以减少整理劳动，却仍可能只保留总部已有字段。另一种做法，是围绕下一次分配，把门店消息、销量、商品和营业日关联起来，让决定者按需取得相关原材料。\n\n后者还应保留不同信息的性质：“售罄”是报告事实，“需求超过80”是有理由的解释，“明天配100”是候选动作。AI如果把三者合成一句确定建议，就可能在补上下文时制造新跳步。\n\n有效衔接也需要选择。把整天聊天全部塞给分配人员，会产生新的阅读负担。合理目标是：让重要决定能找到所需条件，在有疑问时能够回到原材料，而不是让每个人读完所有内容。\n\n## 用一笔业务定位真正断点\n\n可以选一笔近期反复沟通的业务，按实际经过检查：最初材料包含什么，每一岗位为了完成自己的工作删减了什么，下一岗位因此缺少哪项决定条件，最后是通过补问、猜测还是重新调查解决。\n\n然后分别判断三类原因。若是事实没有被观察，需要改变生产记录；若是事实存在却没有到达决定处，需要改变关联和呈现；若是目标或资源冲突，需要由有权安排的人作取舍。它们可以同时存在，但改法不同。\n\nFDE在这里的价值，是理解断点，并把新的衔接方式做进实际工作。能否减少重复解释、使决定更有依据，还要由真实采用检验。下一章因此要进一步回答：怎样让记录从生产开始形成，而不把积累变成员工额外的一份工作。\n"},{"file":"07-生产中的采集.md","id":"lesson-07","number":7,"role":"核心课","part":1,"title":"第7章｜让生产自然留下经验，而非做完再补一份总结","md":"# 第7章｜让生产自然留下经验，而非做完再补一份总结\n\n企业希望沉淀经验，常见安排是让员工每周写复盘、项目结束后补案例。开始时材料增长很快，忙起来却容易中断。员工不是不知道经验重要，而是在交付与总结争用同一段时间时，眼前任务通常更紧迫。\n\nAI带来的机会，是在工作已经发生的过程中帮助留下相关材料。**让一份输入同时服务当期交付与未来学习，可以改变积累的成本结构。** 但前提是记录能对应真实动作，后来也确实有人使用。\n\n## 先看一张工单自然产生了什么\n\n采用虚构设备售后案例。客服接到“促销时段间歇停机”的描述，系统知道设备为V1版本，但运行负载不完整。调度把工单交给技术员，技术员现场记录“调整设置并重启，未更换部件”。AI起草处置说明时误写为“更换部件后恢复”，技术员纠正。\n\n这些材料本来就在工作中出现：客户原话、设备身份、派工、实际动作、AI草稿与人的修改。要形成可用记录，首先是把它们关联到同一张工单，而不是要求技术员重新写一篇完整文章。\n\n后续还会出现客户是否恢复、是否复发、是否再次联系等结果。它们决定这次处置可以支持何种经验。如果只有“工单关闭”，就没有完成结果链。\n\n![同一条工单生产链，一路形成当前服务交付，另一路保留原材料、修改和后续结果。两类产出共享输入，但经验仍需后续检验。](assets/07-生产与积累.svg)\n\n## AI具体减少哪些劳动\n\n原来的总结者要先翻材料，再确认属于哪项任务，整理经过，补缺项，最后改写成别人能读懂的形式。这些工作中，有一部分适合由AI辅助：匹配任务、整理时间顺序、比较草稿与修改、提示尚无结果的工单。\n\n人员仍要核对重要差别，但纠正一个已有草稿，可能比从空白重新组织便宜；从自然记录中提取关键条件，也可能比日后追问当事人更可靠。这里的“可能”需要通过实际工作负担比较，不由工具演示决定。\n\nAI并未因此自动得到技术员的全部思考。未表达的理由、没有发生记录的动作，仍可能缺失。模型事后生成的解释，也不等于当时真正使用的依据。保存材料时应把观察、人员说明与事后推断分开。\n\n## 采集什么，应由下一次用途决定\n\n如果下一张工单要判断经验是否适用，设备版本和发生条件就重要；如果要安排派工，可用人员与客户时效就重要；如果要判断某种方法是否长期有效，后续复发信息就重要。\n\n“以后可能有用”不足以支持无限采集。每加一项记录，都应能说明它会改变谁的什么判断，或者支持哪种必要追溯。暂时说不清用途的材料，可以保留必要原件，却不必都要求人员填成结构化表格。\n\n组织知识研究强调经验需要通过实践、表达与共同使用发展。工程上的工作流与Agent则提供材料进入持续任务的方式。二者相接，才构成生产内嵌积累的设计依据；单有聊天记录或自动笔记，都还不够。[知识研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)、[工程机制](https://www.anthropic.com/research/building-effective-agents)\n\n## 纠正记录，本身也能留下高价值信息\n\n这张工单最值得保留的，未必是AI写出的流畅总结，而是“未换件却被写成换件”的纠正。它暴露了模型如何在资料不足时补成一个常见故事，也说明最终材料需要哪些事实支持。\n\n若错误草稿被直接进入经验库，后续人员可能以为换件是必要动作。资料积累越多，错误越容易显得有依据。把纠正接回工单、相关经验与未来评价任务，才使这次发现改变下一轮行为。\n\n员工愿不愿纠正也与组织安排有关。如果新增记录主要被用来追责，人员可能少报异常；如果修改被看成低效，团队可能追求直接接受AI。采集设计因此要同时考虑工作负担和反馈激励。\n\n## 怎样判断门槛真的降低了\n\n不只看一天生成多少记录，还要比较完成一次工作所需的额外填报、重复询问和整理时间；再观察接任者是否更容易找到有效材料，下一次判断是否改善。\n\n如果系统每天自动生成大量笔记，却仍需资深人员逐篇重写，整理门槛未必下降。如果关键事实自然留下、人员只纠正必要差别，而且后续任务确实使用，那么企业才开始以更低负担扩大经验覆盖范围。\n\n留下材料仍只是起点。企业还要判断其中哪部分解释可信，避免把一连串成功故事整理成未经检验的“最佳实践”。\n","html":"\u003ch1>第7章｜让生产自然留下经验，而非做完再补一份总结\u003c/h1>\n\u003cp>企业希望沉淀经验，常见安排是让员工每周写复盘、项目结束后补案例。开始时材料增长很快，忙起来却容易中断。员工不是不知道经验重要，而是在交付与总结争用同一段时间时，眼前任务通常更紧迫。\u003c/p>\n\u003cp>AI带来的机会，是在工作已经发生的过程中帮助留下相关材料。\u003cstrong>让一份输入同时服务当期交付与未来学习，可以改变积累的成本结构。\u003c/strong> 但前提是记录能对应真实动作，后来也确实有人使用。\u003c/p>\n\u003ch2 id=\"lesson-07-section-1\">先看一张工单自然产生了什么\u003c/h2>\n\u003cp>采用虚构设备售后案例。客服接到“促销时段间歇停机”的描述，系统知道设备为V1版本，但运行负载不完整。调度把工单交给技术员，技术员现场记录“调整设置并重启，未更换部件”。AI起草处置说明时误写为“更换部件后恢复”，技术员纠正。\u003c/p>\n\u003cp>这些材料本来就在工作中出现：客户原话、设备身份、派工、实际动作、AI草稿与人的修改。要形成可用记录，首先是把它们关联到同一张工单，而不是要求技术员重新写一篇完整文章。\u003c/p>\n\u003cp>后续还会出现客户是否恢复、是否复发、是否再次联系等结果。它们决定这次处置可以支持何种经验。如果只有“工单关闭”，就没有完成结果链。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNDQwIiB2aWV3Qm94PSIwIDAgMzYwIDQ0MCIgcm9sZT0iaW1nIj48dGl0bGU+5ZCM5LiA5bel5L2c77yM5Lik57G75Lqn5Ye6PC90aXRsZT48ZGVzYz7oh6rnhLbkuqfnlJ/nmoTlt6XljZXmnZDmlpnmnI3liqHlvZPmnJ/kuqTku5jvvIzkuZ/og73lvaLmiJDlvoXmo4Dpqoznu4/pqozvvJvnn6Xor4bkuI3mmK/oh6rliqjlrozmiJDjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjQ0MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7lkIzkuIDlt6XkvZzvvIzkuKTnsbvkuqflh7o8L3RleHQ+PHBhdGggZD0iTTExNyA3N0gyMjdMMjQzIDkzVjE0OUgxMTdaIiBmaWxsPSJ3aGl0ZSIgc3Ryb2tlPSIjNjA3MzZjIiBzdHJva2Utd2lkdGg9IjEuNSIvPjxwYXRoIGQ9Ik0yMjcgNzdWOTNIMjQzIiBmaWxsPSJub25lIiBzdHJva2U9IiM2MDczNmMiIHN0cm9rZS13aWR0aD0iMS41Ii8+PH
