怎样知道AI参与的安排确实值得采用\n\n企业可以先比较几套完整、能够运行的方案：原方法的合理改进、成熟的预测分配办法，以及AI协助整理非标准材料、识别联动并接回行动的安排。普通调配就能取得的收益，不应全部归到AI名下。\n\n最初的经营决定并不要求先将每一元收益精确分摊给模型、配送和推介。可以先判断整个新安排是否更好。若下一笔投资是增加AI投入还是增加配送，再针对这项选择区分各自增量。比较的精细程度应服务于实际决定。\n\n真实试做常常同时改变多项条件。门店可能因为试点更加积极推介，某天恰好有活动，配送也可能变快。应记录这些变化，尽可能在相近条件下比较；可行时设置适当对照，无法排除的差别则限制结论。研究中的分批上线和随机任务提供不同方法参照，各自需要适用条件。[客服研究](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)、[开发研究](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)\n\n## 从一次观察，走到下一笔投入\n\n只生成建议、不执行，可以看见新信息和决定差别，却无法知道执行后的销售。少量真实采用可以暴露流程与成本，但未必足以预测长期增长。证据逐步增加，采用范围也应相应发展。\n\n一次接入6000元还要回到项目账。若同样正常条件持续20日，相对原安排每天多640元，累计12800元，扣接入后为6800元；实际条件变化时，应改用实际结果。\n\n这样的收益说明让人既看见增长空间，也知道取得它需要什么。它支持继续、调整或停止，而不是用一次漂亮增长替代后面的经营判断。\n","html":"\u003ch1>第30章｜销量增长以后，怎样判断企业究竟多赚了什么\u003c/h1>\n\u003cp>烘焙连锁看到X店主打点心从80份卖到160份，很容易把它称为增长成功。但负责人还需要知道：多卖的商品生产花了多少，是否新增配送，是否从其他店转移了需求，以及有没有一个更简单、回报更好的做法。\u003c/p>\n\u003cp>本章继续使用\u003ca href=\"#case-a\">连锁烘焙教学案例\u003c/a>。数字用于比较经营安排，不代表真实门店已经取得的效果。我们先在相同条件下算清，再讨论真实试做怎样获得判断依据。\u003c/p>\n\u003ch2 id=\"lesson-30-section-1\">先比较三套都能执行的安排\u003c/h2>\n\u003cp>假定正常日X店有160份可成交需求，Y店60份；售价12元，每份生产变动成本4元，当天未售部分无残值，原工资租金不变。扩产方案另外增加配送50元和按量AI、整理服务30元，共80元。\u003c/p>\n\u003cp>原来两店各配80份，共生产160份，卖出140份。收入1680元，生产成本640元，扣后留下1040元。若只重新分配为X100、Y60，总产量不变，却能卖完160份，收入1920元，扣640元后留下1280元。\u003c/p>\n\u003cp>若扩到X160、Y60，共生产220份且全部售出，收入2640元，生产成本880元，再扣80元新增支出，留下1680元。这里留下的金额称为贡献，仍要覆盖公司原有固定费用，并不是净利润。\u003c/p>\n\u003cdiv class=\"table-scroll table-wide\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>当日安排\u003c/th>\n\u003cth>生产/售出\u003c/th>\n\u003cth align=\"right\">收入\u003c/th>\n\u003cth align=\"right\">本表扣除支出\u003c/th>\n\u003cth align=\"right\">贡献\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>原来80/80\u003c/td>\n\u003ctd>160/140\u003c/td>\n\u003ctd align=\"right\">1680元\u003c/td>\n\u003ctd align=\"right\">640元\u003c/td>\n\u003ctd align=\"right\">1040元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>改分配100/60\u003c/td>\n\u003ctd>160/160\u003c/td>\n\u003ctd align=\"right\">1920元\u003c/td>\n\u003ctd align=\"right\">640元\u003c/td>\n\u003ctd align=\"right\">1280元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>扩产补货160/60\u003c/td>\n\u003ctd>220/220\u003c/td>\n\u003ctd align=\"right\">2640元\u003c/td>\n\u003ctd align=\"right\">880＋80元\u003c/td>\n\u003ctd align=\"right\">1680元\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"table-hint\">表格可左右滑动查看\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTkwIiB2aWV3Qm94PSIwIDAgMzYwIDU5MCIgcm9sZT0iaW1nIj48dGl0bGU+5LiJ56eN5a6J5o6S77yM5pS255uK5LiN5ZCMPC90aXRsZT48ZGVzYz7mlZnlrabmraPluLjml6XvvIzljp/lronmjpLliJfnpLrotKHnjK4xMDQw5YWD77yM5Y+q5pS55YiG6YWNMTI4MOWFg++8jOaJqeS6p+ihpei0pzE2ODDlhYPvvJvmiankuqflr7nljp/lronmjpLlop7liqA2NDDlhYPvvIzlr7nmm7TlkIjnkIbmm7/ku6Plj6rlop7liqA0MDDlhYPjgILkuInmoLnmnaHlhbHnlKjpm7bln7rnur/jgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjU5MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7kuInnp43lronmjpLvvIzmlLbnm4rkuI3lkIw8L3RleHQ+PHRleHQgeD0iMjQiIHk9IjgwIiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM1MjY4NWUiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjQwMCI+5pWZ5a2m5q2j5bi45pelIMK3IOWIl+ekuui0oeeMru+8muWFgy/ml6U8L3RleHQ 变多项条件。门店可能因为试点更加积极推介，某天恰好有活动，配送也可能变快。应记录这些变化，尽可能在相近条件下比较；可行时设置适当对照，无法排除的差别则限制结论。研究中的分批上线和随机任务提供不同方法参照，各自需要适用条件。\u003ca href=\"https://danielle.li/assets/docs/GenerativeAIatWork.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">客服研究\u003c/a>、\u003ca href=\"https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">开发研究\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-30-section-5\">从一次观察，走到下一笔投入\u003c/h2>\n\u003cp>只生成建议、不执行，可以看见新信息和决定差别，却无法知道执行后的销售。少量真实采用可以暴露流程与成本，但未必足以预测长期增长。证据逐步增加，采用范围也应相应发展。\u003c/p>\n\u003cp>一次接入6000元还要回到项目账。若同样正常条件持续20日，相对原安排每天多640元，累计12800元，扣接入后为6800元；实际条件变化时，应改用实际结果。\u003c/p>\n\u003cp>这样的收益说明让人既看见增长空间，也知道取得它需要什么。它支持继续、调整或停止，而不是用一次漂亮增长替代后面的经营判断。\u003c/p>\n","headings":[{"id":"lesson-30-section-1","label":"先比较三套都能执行的安排"},{"id":"lesson-30-section-2","label":"需求变化以后，结论为什么可能反过来"},{"id":"lesson-30-section-3","label":"谁增长、增长什么，需要讲清楚"},{"id":"lesson-30-section-4","label":"怎样知道AI参与的安排确实值得采用"},{"id":"lesson-30-section-5","label":"从一次观察，走到下一笔投入"}],"exportMd":"# 第30章｜销量增长以后，怎样判断企业究竟多赚了什么\n\n烘焙连锁看到X店主打点心从80份卖到160份，很容易把它称为增长成功。但负责人还需要知道：多卖的商品生产花了多少，是否新增配送，是否从其他店转移了需求，以及有没有一个更简单、回报更好的做法。\n\n本章继续使用[连锁烘焙教学案例](#case-a)。数字用于比较经营安排，不代表真实门店已经取得的效果。我们先在相同条件下算清，再讨论真实试做怎样获得判断依据。\n\n## 先比较三套都能执行的安排\n\n假定正常日X店有160份可成交需求，Y店60份；售价12元，每份生产变动成本4元，当天未售部分无残值，原工资租金不变。扩产方案另外增加配送50元和按量AI、整理服务30元，共80元。\n\n原来两店各配80份，共生产160份，卖出140份。收入1680元，生产成本640元，扣后留下1040元。若只重新分配为X100、Y60，总产量不变，却能卖完160份，收入1920元，扣640元后留下1280元。\n\n若扩到X160、Y60，共生产220份且全部售出，收入2640元，生产成本880元，再扣80元新增支出，留下1680元。这里留下的金额称为贡献，仍要覆盖公司原有固定费用，并不是净利润。\n\n| 当日安排 | 生产/售出 | 收入 | 本表扣除支出 | 贡献 |\n|---|---|---:|---:|---:|\n| 原来80/80 | 160/140 | 1680元 | 640元 | 1040元 |\n| 改分配100/60 | 160/160 | 1920元 | 640元 | 1280元 |\n| 扩产补货160/60 | 220/220 | 2640元 | 880＋80元 | 1680元 |\n\n![相同正常需求和费用条件下，原安排贡献1040元，只改分配1280元，扩产补货1680元；新增收益要相对合理替代比较。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTkwIiB2aWV3Qm94PSIwIDAgMzYwIDU5MCIgcm9sZT0iaW1nIj48d 0元后留下1280元。\n\n若扩到X160、Y60，共生产220份且全部售出，收入2640元，生产成本880元，再扣80元新增支出，留下1680元。这里留下的金额称为贡献，仍要覆盖公司原有固定费用，并不是净利润。\n\n| 当日安排 | 生产/售出 | 收入 | 本表扣除支出 | 贡献 |\n|---|---|---:|---:|---:|\n| 原来80/80 | 160/140 | 1680元 | 640元 | 1040元 |\n| 改分配100/60 | 160/160 | 1920元 | 640元 | 1280元 |\n| 扩产补货160/60 | 220/220 | 2640元 | 880＋80元 | 1680元 |\n\n![相同正常需求和费用条件下，原安排贡献1040元，只改分配1280元，扩产补货1680元；新增收益要相对合理替代比较。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTkwIiB2aWV3Qm94PSIwIDAgMzYwIDU5MCIgcm9sZT0iaW1nIj48dGl0bGU+5LiJ56eN5a6J5o6S77yM5pS255uK5LiN5ZCMPC90aXRsZT48ZGVzYz7mlZnlrabmraPluLjml6XvvIzljp/lronmjpLliJfnpLrotKHnjK4xMDQw5YWD77yM5Y+q5pS55YiG6YWNMTI4MOWFg++8jOaJqeS6p+ihpei0pzE2ODDlhYPvvJvmiankuqflr7nljp/lronmjpLlop7liqA2NDDlhYPvvIzlr7nmm7TlkIjnkIbmm7/ku6Plj6rlop7liqA0MDDlhYPjgILkuInmoLnmnaHlhbHnlKjpm7bln7rnur/jgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjU5MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7kuInnp43lronmjpLvvIzmlLbnm4rkuI3lkIw8L3RleHQ+PHRleHQgeD0iMjQiIHk9IjgwIiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM1MjY4NWUiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjQwMCI+5pWZ5a2m5q2j5bi45pelIMK3IOWIl+ekuui0oeeMru+8muWFgy/ml6U8L3RleHQ+PHRleHQgeD0iMzIiIHk9IjEyMiIgZm9udC1mYW1pbHk9IlBpbmdGYW5nIFNDLE1pY3Jvc29mdCBZYUhlaSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjIwIiBmaW 看见增长空间，也知道取得它需要什么。它支持继续、调整或停止，而不是用一次漂亮增长替代后面的经营判断。\n","text":"# 第30章｜销量增长以后，怎样判断企业究竟多赚了什么\n\n烘焙连锁看到X店主打点心从80份卖到160份，很容易把它称为增长成功。但负责人还需要知道：多卖的商品生产花了多少，是否新增配送，是否从其他店转移了需求，以及有没有一个更简单、回报更好的做法。\n\n本章继续使用连锁烘焙教学案例。数字用于比较经营安排，不代表真实门店已经取得的效果。我们先在相同条件下算清，再讨论真实试做怎样获得判断依据。\n\n## 先比较三套都能执行的安排\n\n假定正常日X店有160份可成交需求，Y店60份；售价12元，每份生产变动成本4元，当天未售部分无残值，原工资租金不变。扩产方案另外增加配送50元和按量AI、整理服务30元，共80元。\n\n原来两店各配80份，共生产160份，卖出140份。收入1680元，生产成本640元，扣后留下1040元。若只重新分配为X100、Y60，总产量不变，却能卖完160份，收入1920元，扣640元后留下1280元。\n\n若扩到X160、Y60，共生产220份且全部售出，收入2640元，生产成本880元，再扣80元新增支出，留下1680元。这里留下的金额称为贡献，仍要覆盖公司原有固定费用，并不是净利润。\n\n| 当日安排 | 生产/售出 | 收入 | 本表扣除支出 | 贡献 |\n|---|---|---:|---:|---:|\n| 原来80/80 | 160/140 | 1680元 | 640元 | 1040元 |\n| 改分配100/60 | 160/160 | 1920元 | 640元 | 1280元 |\n| 扩产补货160/60 | 220/220 | 2640元 | 880＋80元 | 1680元 |\n\n \n\n图中扩产比原来多640元，却只比重新分配多400元。前一个比较说明总体改善，后一个比较帮助判断新增生产和补货是否值得。只拿较差的原安排作对照，容易高估复杂方案的必要性。\n\n## 需求变化以后，结论为什么可能反过来\n\n若X实际只需要120份、Y仍60份，扩产220份只能卖180份。收入2160元，扣生产880元和新增80元，贡献1200元。它仍比原安排1040元好，却低于只改分配的1280元。\n\n企业此时可以说扩产相对旧安排有改善，却不能说它是当前最好的选择。第16章的门槛计算说明，在这些条件下，X至少卖到127份，扩产才超过重新分配。\n\n真实现场起初只知道X卖到80份就没货了，不能先把160份需求当成事实，再据此宣布预测成功。试做要逐步取得售罄后需求、实际补货和成交的证据，使算账条件越来越接近现实。\n\n## 谁增长、增长什么，需要讲清楚\n\nX店这款商品从80到160，销量翻倍；两店合计从140到220，增加约57.1%。因为算例价格不变，收入同比例变化；贡献增长则受成本影响。其他商品和整家公司的收入不在这个比例里。\n\n如果工坊为了追加点心，挤占了另一种更有价值产品的产能，失去的贡献也需考虑。如果顾客只是从另一家店转来，全网净增长可能小于X店增长。比较应覆盖主要相互影响，不能只挑最亮眼的局部。\n\n## 怎样知道AI参与的安排确实值得采用\n\n企业可以先比较几套完整、能够运行的方案：原方法的合理改进、成熟的预测分配办法，以及AI协助整理非标准材料、识别联动并接回行动的安排。普通调配就能取得的收益，不应全部归到AI名下。\n\n最初的经营决定并不要求先将每一元收益精确分摊给模型、配送和推介。可以先判断整个新安排是否更好。若下一笔投资是增加AI投入还是增加配送，再针对这项选择区分各自增量。比较的精细程度应服务于实际决定。\n\n真实试做常常同时改变多项条件。门店可能因为试点更加积极推介，某天恰好有活动，配送也可能变快。应记录这些变化，尽可能在相近条件下比较；可行时设置适当对照，无法排除的差别则限制结论。研究中的分批上线和随机任务提供不同方法参照，各自需要适用条件。客服研究、开发研究\n\n## 从一次观察，走到下一笔投入\n\n只生成建议、不执行，可以看见新信息和决定差别，却无法知道执行后的销售。少量真实采用可以暴露流程与成本，但未必足以预测长期增长。证据逐步增加，采用范围也应相应发展。\n\n一次接入6000元还要回到项目账。若同样正常条件持续20日，相对原安排每天多640元，累计12800元，扣接入后为6800元；实际条件变化时，应改用实际结果。\n\n这样的收益说明让人既看见增长空间，也知道取得它需要什么。它支持继续、调整或停止，而不是用一次漂亮增长替代后面的经营判断。\n"},{"file":"31-组织学习的验证.md","id":"lesson-31","number":31,"role":"核心课","part":5,"title":"第31章｜换一个人、换一道题，企业还会不会做","md":"# 第31章｜换一个人、换一道题，企业还会不会做\n\n原店长可以解释为什么给门店增加备货，接任者却只记住一个数量；资深工程师演示知识系统时很顺畅，新技术员遇到另一个版本的设备，就照抄旧方法。企业保存了材料，也安排了培训，为什么能力仍然不能接续？\n\n因为原人知道很多没有写出来的背景，也能自行补救系统的缺口。检查他能不能使用，与检查组织是否学会，是不同的事情。积累的价值需要在后续的新任务和新人员身上体现。\n\n## 先看接任者面对的具体困难\n\n沿用[设备售后教学案例](案例C-设备售后.md)。接任技术员收到一台V2设备的间歇问题，运行条件还不完整。系统找到一条相似记录M1，但它属于V1版本，当时进行了调整和重启，没有换件，观察到当次恢复。\n\n接任者不能只因症状相似就宣布原因相同。他应先识别版本与事实差别，用旧案提示自己还需要哪些信息，再取得专业支持或准备下一步观察。若能形成有依据的派工前材料，就已经完成了有价值的工作，即使还不能确定最终技术原因。\n\n这项检验考察的是使用经验的方法，而不是让新人猜一个标准答案。真正掌握方法的人，在知识不足时知道缺什么、怎样补；只记住答案的人，则容易把旧结论直接搬到新情况。\n\n## 从一项任务中，看出不同层次的接续\n\n接任者能找到原始记录，说明经验有入口。能够分清实际动作与原因解释，说明理解了依据。知道需要专家确认，并能够取得支持，说明组织提供了执行条件。完成以后把新结果关联回来，则说明这次工作还会帮助下一次。\n\n其中任一环节缺失，都会影响表现。例如资料齐全却找不到，增加文章数量没有帮助；知道方法却没有工具和权限，问题也不在阅读理解。观察真实任务，可以使修复落在正确位置。\n\n参与者应具备相应专业基础，但不必参与过原系统调试。也要记录他们拥有的支持条件，不能把所有成败都归因于系统。一个缺少基本资格的人无法完成专业任务，并不能直接说明知识积累无效。\n\n## 怎样知道改善来自这些积累\n\n经验丰富的人即使没有系统也可能做对，简单任务本来就可能很快。因此，可以在相近条件下比较有无这些资料和工具时的准备、补问、错误与结果；条件允许时采用不同人员或交叉安排，并注意任务难度和熟悉程度。\n\n比较还包括新增负担。材料太长，接任者读完仍找原专家解释，可能只是把原来口头沟通变成了先读一遍再沟通。方法若需要大量维护，却很少再用，也需要重新判断投入。\n\n吸收能力研究说明相关知识有助于理解和应用新知识，但本企业积累到底改善了多少，仍要靠具体任务显示。[原始研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n## 换一个场景时，应当迁移什么\n\n烘焙连锁的新店可以继承商品、营业日和售罄记录的共同含义，也可以使用已有工具。但它需要重新认识自己的客群、时段和配送条件。\n\n如果新店只是复制原店的160份配额，继承的是一次答案；如果它能更快收集当地需求、识别销量受供给限制、比较补货和其他方案，则说明原有方法正在帮助它学习。两者在开业初期可能都表现为“系统已经复制”，长期效果却不同。\n\n检验结束后，应形成实际改动：找不到就改善入口，不理解就补解释和带教，无法执行就补工具与责任，新条件不适用就更新方法。企业是否学会，不由培训结束或文档交接宣布，而由后续工作能够怎样继续来说明。\n","html":"\u003ch1>第31章｜换一个人、换一道题，企业还会不会做\u003c/h1>\n\u003cp>原店长可以解释为什么给门店增加备货，接任者却只记住一个数量；资深工程师演示知识系统时很顺畅，新技术员遇到另一个版本的设备，就照抄旧方法。企业保存了材料，也安排了培训，为什么能力仍然不能接续？\u003c/p>\n\u003cp>因为原人知道很多没有写出来的背景，也能自行补救系统的缺口。检查他能不能使用，与检查组织是否学会，是不同的事情。积累的价值需要在后续的新任务和新人员身上体现。\u003c/p>\n\u003ch2 id=\"lesson-31-section-1\">先看接任者面对的具体困难\u003c/h2>\n\u003cp>沿用\u003ca href=\"#case-c\">设备售后教学案例\u003c/a>。接任技术员收到一台V2设备的间歇问题，运行条件还不完整。系统找到一条相似记录M1，但它属于V1版本，当时进行了调整和重启，没有换件， 长期效果却不同。\n\n检验结束后，应形成实际改动：找不到就改善入口，不理解就补解释和带教，无法执行就补工具与责任，新条件不适用就更新方法。企业是否学会，不由培训结束或文档交接宣布，而由后续工作能够怎样继续来说明。\n"},{"file":"32-纠错与遗忘.md","id":"lesson-32","number":32,"role":"核心课","part":5,"title":"第32章｜为什么企业会用越来越多的数据，证明旧判断正确","md":"# 第32章｜为什么企业会用越来越多的数据，证明旧判断正确\n\n一家门店每天只配80份点心，傍晚卖完。系统连续记录销量80，总部据此认为需求稳定在80附近，于是继续配80。店员知道很快没货，也不再积极接受这款商品的晚间预订。\n\n所有成交记录都是真的，企业却可能越来越难看见上限以外的需求。数据并不是独立于经营产生的：企业先作出的安排，会影响后面能够观察到什么。\n\n## 旧行动怎样不断支持旧认识\n\n在[连锁烘焙教学案例](案例A-连锁备货.md)中，X店售罄后仍有人询问，但这些人没有形成收银记录。如果需求分析只使用已成交销量，就会把供给限制后的结果当作全部需求。再按这个结果排产，下一轮仍然看不到更多成交。\n\n相似问题也发生在服务业。工单当次恢复就关闭，复发又建立不相关新单，系统可能一直认为首次处理成功率很高；只保留成交方案，不记录未采用理由，经验库也容易反复支持既有做法。\n\n系统反馈研究将行动与未来数据的相互影响视为重要问题。[原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf) AI可以帮助发现这种循环，也可能因为更快使用旧数据而加强它，区别取决于什么信息能够回来改变判断。\n\n![少配限制可见销量，旧记录支持继续少配；售罄与询问暴露缺项，受控改变供给并观察，才能取得原循环外的证据。](assets/32-反馈与偏差.svg)\n\n图中的循环不能只靠把80这个数字预测得更准来打破。必须取得原来安排没有产生、或没有保存的观察。\n\n## 新的观察，怎样帮助看见原来的盲区\n\n可以记录售罄后顾客询问、开放明确条件的预订，或在可承受范围内追加供给，观察实际购买。询问并不等于订单，预订也可能取消，因此不同证据要分别理解。\n\n追加供给会增加成本，也可能影响其他商品和门店，不能无限尝试。它的价值在于帮助回答原数据无法回答的问题：如果有货，并且配送与销售动作到位，顾客是否真的会买更多。\n\nAI可以协助对照这些新材料，FDE使它们回到排产和评价，负责人决定可承担的试验范围。这样企业才可能用新的事实修订需求认识，而不是只用更多相同记录强化原判断。\n\n## 一个曾经有效的方案，也会因条件变化失效\n\n案例另设一个独立情景：交通入口关闭，X店需求降到50份，Y店需求增到90份。售价仍为12元，生产变动成本4元，扩产方案另付80元。\n\n原来80/80安排，X卖50、Y卖80，共130份，剩30份。收入1560元扣生产640元，贡献920元。若仍按100/60分配，只能卖50＋60＝110份，贡献1320−640＝680元。继续扩到160/60，仍只卖110份，却生产220份，贡献1320−880−80＝360元。\n\n| 供货安排 | 实际售出 | 剩余 | 扣列示支出后的贡献 |\n|---|---:|---:|---:|\n| 原80/80 | 130份 | 30份 | 920元 |\n| 改100/60 | 110份 | 50份 | 680元 |\n| 仍扩160/60 | 110份 | 110份 | 360元 |\n\n扩产此时比原安排少560元。这个结果没有证明增加供给永远错误，而是说明旧数量依赖的需求条件已经变化。若交通信息决定前就已知道，应修复信息使用；若决定后突然发生，则研究响应和损失控制。不能把事后才出现的事实，当作事前所有人都应知道的条件。\n\n## 纠错必须改变下一次实际采用\n\n设备案例中，AI把“未换件”写成“换件”。人员在原工单纠正以后，旧总结若仍被推荐，错误还会继续影响其他人。因此，需要让事实修订进入当前材料、方法说明和代表任务，而不只改一处文字。\n\n停止推荐旧方法，也不等于删除历史。保留当时依据，才能解释为什么曾经这样做、后来为何改变。探索与利用研究提醒我们，过去成功容易继续吸引资源和注意力。[原始研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)\n\n企业积累越多，越需要让反例正常进入工作。能够用新事实改变旧办法，经验才会继续帮助经营，而不是成为越来越难被质疑的惯性。\n","html":"\u003ch1>第32章｜为什么企业会用越来越多的数据，证明旧判断正确\u003c/h1>\n\u003cp>一家门店每天只配80份点心，傍晚卖完。系统连续记录销量80，总部据此认为需求稳定在80附近，于是继续配80。店员知道很快没货，也不再积极接受这款商品的晚间预订。\u003c/p>\n\u003cp>所有成交记录都是真的，企业却可能越来越难看见上限以外的需求。数据并不是独立于经营产生的：企业先作出的安排，会影响后面能够观察到什么。\u003c/p>\n\u003ch2 id=\"lesson-32-section-1\">旧行动怎样不断支持旧认识\u003c/h2>\n\u003cp>在\u003ca href=\"#case-a\">连锁烘焙教学案例\u003c/a>中，X店售罄后仍有人询问，但这些人没有形成收银记录。如果需求分析只使用已成交销量，就会把供给限制后的结果当作全部需求。再按这个结果排产，下一轮仍然看不到更多成交。\u003c/p>\n\u003cp>相似问题也发生在服务业。工单当次恢复就关闭，复发又建立不相关新单，系统可能一直认为首次处理成功率很高；只保留成交方案，不记录未采用理由，经验库也容易反复支持既有做法。\u003c/p>\n\u003cp>系统反馈研究将行动与未来数据的相互影响视为重要问题。\u003ca href=\"https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始论文\u003c/a> AI可以帮助发现这种循环，也可能因为更快使用旧数据而加强它，区别取决于什么信息能够回来改变判断。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNjUwIiB2aWV3Qm94PSIwIDAgMzYwIDY1MCIgcm9sZT0iaW1nIj48dGl0bGU+5Y+N6aaI5Lmf5Y+v6IO95Zu65YyW5YGP5beuPC90aXRsZT48ZGVzYz7lsJHphY3pmZDliLbplIDph4/vvIzlj5fpmZDplIDph4/mlK/mjIHnu6fnu63lsJHphY3jgILllK7nvYTkv6Hmga/mmrTpnLLnvLrpobnvvIzlj5fmjqfmlLnlj5jkvpvnu5nlubbop4Llr5/miY3og73lj5blvpfljp/lvqrnjq/lpJbnmoTmlrDor4Hmja7jgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjY1MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3N 价仍为12元，生产变动成本4元，扩产方案另付80元。\u003c/p>\n\u003cp>原来80/80安排，X卖50、Y卖80，共130份，剩30份。收入1560元扣生产640元，贡献920元。若仍按100/60分配，只能卖50＋60＝110份，贡献1320−640＝680元。继续扩到160/60，仍只卖110份，却生产220份，贡献1320−880−80＝360元。\u003c/p>\n\u003cdiv class=\"table-scroll table-wide\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>供货安排\u003c/th>\n\u003cth align=\"right\">实际售出\u003c/th>\n\u003cth align=\"right\">剩余\u003c/th>\n\u003cth align=\"right\">扣列示支出后的贡献\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>原80/80\u003c/td>\n\u003ctd align=\"right\">130份\u003c/td>\n\u003ctd align=\"right\">30份\u003c/td>\n\u003ctd align=\"right\">920元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>改100/60\u003c/td>\n\u003ctd align=\"right\">110份\u003c/td>\n\u003ctd align=\"right\">50份\u003c/td>\n\u003ctd align=\"right\">680元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>仍扩160/60\u003c/td>\n\u003ctd align=\"right\">110份\u003c/td>\n\u003ctd align=\"right\">110份\u003c/td>\n\u003ctd align=\"right\">360元\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"table-hint\">表格可左右滑动查看\u003c/p>\n\u003cp>扩产此时比原安排少560元。这个结果没有证明增加供给永远错误，而是说明旧数量依赖的需求条件已经变化。若交通信息决定前就已知道，应修复信息使用；若决定后突然发生，则研究响应和损失控制。不能把事后才出现的事实，当作事前所有人都应知道的条件。\u003c/p>\n\u003ch2 id=\"lesson-32-section-4\">纠错必须改变下一次实际采用\u003c/h2>\n\u003cp>设备案例中，AI把“未换件”写成“换件”。人员在原工单纠正以后，旧总结若仍被推荐，错误还会继续影响其他人。因此，需要让事实修订进入当前材料、方法说明和代表任务，而不只改一处文字。\u003c/p>\n\u003cp>停止推荐旧方法，也不等于删除历史。保留当时依据，才能解释为什么曾经这样做、后来为何改变。探索与利用研究提醒我们，过去成功容易继续吸引资源和注意力。\u003ca href=\"https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003cp>企业积累越多，越需要让反例正常进入工作。能够用新事实改变旧办法，经验才会继续帮助经营，而不是成为越来越难被质疑的惯性。\u003c/p>\n","headings":[{"id":"lesson-32-section-1","label":"旧行动怎样不断支持旧认识"},{"id":"lesson-32-section-2","label":"新的观察，怎样帮助看见原来的盲区"},{"id":"lesson-32-section-3","label":"一个曾经有效的方案，也会因条件变化失效"},{"id":"lesson-32-section-4","label":"纠错必须改变下一次实际采用"}],"exportMd":"# 第32章｜为什么企业会用越来越多的数据，证明旧判断正确\n\n一家门店每天只配80份点心，傍晚卖完。系统连续记录销量80，总部据此认为需求稳定在80附近，于是继续配80。店员知道很快没货，也不再积极接受这款商品的晚间预订。\n\n所有成交记录都是真的，企业却可能越来越难看见上限以外的需求。数据并不是独立于经营产生的：企业先作出的安排，会影响后面能够观察到什么。\n\n## 旧行动怎样不断支持旧认识\n\n在[连锁烘焙教学案例](#case-a)中，X店售罄后仍有人询问，但这些人没有形成收银记录。如果需求分析只使用已成交销量，就会把供给限制后的结果当作全部需求。再按这个结果排产，下一轮仍然看不到更多成交。\n\n相似问题也发生在服务业。工单当次恢复就关闭，复发又建立不相关新单，系统可能一直认为首次处理成功率很高；只保留成交方案，不记录未采用理由，经验库也容易反复支持既有做法。\n\n系统反馈研究将行动与未来数据的相互影响视为重要问题。[原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf) AI可以帮助发现这种循环，也可能因为更快使用旧数据而加强它，区别取决于什么信息能够回来改变判断。\n\n![少配限制可见销量，旧记录支持继续少配；售罄与询问暴露缺项，受控改变供给并观察，才能取得原循环外的证据。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNjUwIiB2aWV3Qm94PSIwIDAgMzYwIDY1MCIgcm9sZT0iaW1nIj48dGl0bGU+5Y+N6aaI5Lmf5Y+v6IO95Zu65YyW5YGP5beuPC90aXRsZT48ZGVzYz7lsJHphY3pmZDliLbplIDph4/vvIzlj5fpmZDplIDph4/mlK/mjIHnu6fnu63lsJHphY3jgILllK7nvYTkv6Hmga/mmrTpnLLnvLrpobnvvIzlj5fmjqfmlLnlj5jkvpvnu5nlubbop4Llr5/miY3og73lj5blvpfljp/lvqrnjq/lpJbnmoTmlrDor4Hmja7jgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjY1MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7lj43ppojkuZ/lj6/og73lm7rljJblgY/lt648L3RleHQ+PHJlY3QgeD0iMzAiIHk9Ijg4IiB3aWR0aD0iMTU0IiBoZWlnaHQ9IjY3IiByeD0iNiIgZmlsbD0iI2VkZjNlZCIgc3Ryb2tlPSIjNjA3MzZjIiBzdHJva2Utd2lkdGg9IjEu 错误还会继续影响其他人。因此，需要让事实修订进入当前材料、方法说明和代表任务，而不只改一处文字。\n\n停止推荐旧方法，也不等于删除历史。保留当时依据，才能解释为什么曾经这样做、后来为何改变。探索与利用研究提醒我们，过去成功容易继续吸引资源和注意力。[原始研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)\n\n企业积累越多，越需要让反例正常进入工作。能够用新事实改变旧办法，经验才会继续帮助经营，而不是成为越来越难被质疑的惯性。\n","exportSingleMd":"# 第32章｜为什么企业会用越来越多的数据，证明旧判断正确\n\n一家门店每天只配80份点心，傍晚卖完。系统连续记录销量80，总部据此认为需求稳定在80附近，于是继续配80。店员知道很快没货，也不再积极接受这款商品的晚间预订。\n\n所有成交记录都是真的，企业却可能越来越难看见上限以外的需求。数据并不是独立于经营产生的：企业先作出的安排，会影响后面能够观察到什么。\n\n## 旧行动怎样不断支持旧认识\n\n在[连锁烘焙教学案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-a)中，X店售罄后仍有人询问，但这些人没有形成收银记录。如果需求分析只使用已成交销量，就会把供给限制后的结果当作全部需求。再按这个结果排产，下一轮仍然看不到更多成交。\n\n相似问题也发生在服务业。工单当次恢复就关闭，复发又建立不相关新单，系统可能一直认为首次处理成功率很高；只保留成交方案，不记录未采用理由，经验库也容易反复支持既有做法。\n\n系统反馈研究将行动与未来数据的相互影响视为重要问题。[原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf) AI可以帮助发现这种循环，也可能因为更快使用旧数据而加强它，区别取决于什么信息能够回来改变判断。\n\n![少配限制可见销量，旧记录支持继续少配；售罄与询问暴露缺项，受控改变供给并观察，才能取得原循环外的证据。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNjUwIiB2aWV3Qm94PSIwIDAgMzYwIDY1MCIgcm9sZT0iaW1nIj48dGl0bGU+5Y+N6aaI5Lmf5Y+v6IO95Zu65YyW5YGP5beuPC90aXRsZT48ZGVzYz7lsJHphY3pmZDliLbplIDph4/vvIzlj5fpmZDplIDph4/mlK/mjIHnu6fnu63lsJHphY3jgILllK7nvYTkv6Hmga/mmrTpnLLnvLrpobnvvIzlj5fmjqfmlLnlj5jkvpvnu5nlubbop4Llr5/miY3og73lj5blvpfljp/lvqrnjq/lpJbnmoTmlrDor4Hmja7jgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjY1MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyN ＝360元。\n\n| 供货安排 | 实际售出 | 剩余 | 扣列示支出后的贡献 |\n|---|---:|---:|---:|\n| 原80/80 | 130份 | 30份 | 920元 |\n| 改100/60 | 110份 | 50份 | 680元 |\n| 仍扩160/60 | 110份 | 110份 | 360元 |\n\n扩产此时比原安排少560元。这个结果没有证明增加供给永远错误，而是说明旧数量依赖的需求条件已经变化。若交通信息决定前就已知道，应修复信息使用；若决定后突然发生，则研究响应和损失控制。不能把事后才出现的事实，当作事前所有人都应知道的条件。\n\n## 纠错必须改变下一次实际采用\n\n设备案例中，AI把“未换件”写成“换件”。人员在原工单纠正以后，旧总结若仍被推荐，错误还会继续影响其他人。因此，需要让事实修订进入当前材料、方法说明和代表任务，而不只改一处文字。\n\n停止推荐旧方法，也不等于删除历史。保留当时依据，才能解释为什么曾经这样做、后来为何改变。探索与利用研究提醒我们，过去成功容易继续吸引资源和注意力。[原始研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)\n\n企业积累越多，越需要让反例正常进入工作。能够用新事实改变旧办法，经验才会继续帮助经营，而不是成为越来越难被质疑的惯性。\n","text":"# 第32章｜为什么企业会用越来越多的数据，证明旧判断正确\n\n一家门店每天只配80份点心，傍晚卖完。系统连续记录销量80，总部据此认为需求稳定在80附近，于是继续配80。店员知道很快没货，也不再积极接受这款商品的晚间预订。\n\n所有成交记录都是真的，企业却可能越来越难看见上限以外的需求。数据并不是独立于经营产生的：企业先作出的安排，会影响后面能够观察到什么。\n\n## 旧行动怎样不断支持旧认识\n\n在连锁烘焙教学案例中，X店售罄后仍有人询问，但这些人没有形成收银记录。如果需求分析只使用已成交销量，就会把供给限制后的结果当作全部需求。再按这个结果排产，下一轮仍然看不到更多成交。\n\n相似问题也发生在服务业。工单当次恢复就关闭，复发又建立不相关新单，系统可能一直认为首次处理成功率很高；只保留成交方案，不记录未采用理由，经验库也容易反复支持既有做法。\n\n系统反馈研究将行动与未来数据的相互影响视为重要问题。原始论文 AI可以帮助发现这种循环，也可能因为更快使用旧数据而加强它，区别取决于什么信息能够回来改变判断。\n\n \n\n图中的循环不能只靠把80这个数字预测得更准来打破。必须取得原来安排没有产生、或没有保存的观察。\n\n## 新的观察，怎样帮助看见原来的盲区\n\n可以记录售罄后顾客询问、开放明确条件的预订，或在可承受范围内追加供给，观察实际购买。询问并不等于订单，预订也可能取消，因此不同证据要分别理解。\n\n追加供给会增加成本，也可能影响其他商品和门店，不能无限尝试。它的价值在于帮助回答原数据无法回答的问题：如果有货，并且配送与销售动作到位，顾客是否真的会买更多。\n\nAI可以协助对照这些新材料，FDE使它们回到排产和评价，负责人决定可承担的试验范围。这样企业才可能用新的事实修订需求认识，而不是只用更多相同记录强化原判断。\n\n## 一个曾经有效的方案，也会因条件变化失效\n\n案例另设一个独立情景：交通入口关闭，X店需求降到50份，Y店需求增到90份。售价仍为12元，生产变动成本4元，扩产方案另付80元。\n\n原来80/80安排，X卖50、Y卖80，共130份，剩30份。收入1560元扣生产640元，贡献920元。若仍按100/60分配，只能卖50＋60＝110份，贡献1320−640＝680元。继续扩到160/60，仍只卖110份，却生产220份，贡献1320−880−80＝360元。\n\n| 供货安排 | 实际售出 | 剩余 | 扣列示支出后的贡献 |\n|---|---:|---:|---:|\n| 原80/80 | 130份 | 30份 | 920元 |\n| 改100/60 | 110份 | 50份 | 680元 |\n| 仍扩160/60 | 110份 | 110份 | 360元 |\n\n扩产此时比原安排少560元。这个结果没有证明增加供给永远错误，而是说明旧数量依赖的需求条件已经变化。若交通信息决定前就已知道，应修复信息使用；若决定后突然发生，则研究响应和损失控制。不能把事后才出现的事实，当作事前所有人都应知道的条件。\n\n## 纠错必须改变下一次实际采用\n\n设备案例中，AI把“未换件”写成“换件”。人员在原工单纠正以后，旧总结若仍被推荐，错误还会继续影响其他人。因此，需要让事实修订进入当前材料、方法说明和代表任务，而不只改一处文字。\n\n停止推荐旧方法，也不等于删除历史。保留当时依据，才能解释为什么曾经这样做、后来为何改变。探索与利用研究提醒我们，过去成功容易继续吸引资源和注意力。原始研究\n\n企业积累越多，越需要让反例正常进入工作。能够用新事实改变旧办法，经验才会继续帮助经营，而不是成为越来越难被质疑的惯性。\n"},{"file":"33-岗位权责与激励.md","id":"lesson-33","number":33,"role":"核心课","part":6,"title":"第33章｜系统已经给出好建议，员工为什么还会按旧方式工作","md":"# 第33章｜系统已经给出好建议，员工为什么还会按旧方式工作\n\n连锁总部要求门店减少剩余，又希望员工积极推广主打商品。店长若多报需求、最后没有卖完，会被追问；若少配一点、早早售罄，报表却显得干净。AI建议增加供给以后，员工仍可能沿用保守做法。\n\n这不一定是员工抗拒新技术。他们面对的评价、可用资源和决定权可能没有改变。技术让跨岗位关系更容易被看见，真正改变行为还需要相应的经营安排。\n\n## 局部指标为什么会使整体目标落空\n\n只看剩余量，店长有理由少配；只看工单关闭数，技术员可能优先关闭而不追踪复发；只看文章份数，团队会不断生成，即使专家已经核不过来。人员同时承担多项工作，会自然把注意力放到被衡量和奖励的部分。\n\n多任务激励研究解释了这种现象：容易度量的任务可能吸引更多努力，而重要但不易衡量的部分受到挤压。[原始研究](https://web.stanford.edu/~milgrom/publishedarticles/Multitask%20Principal%20Agent.pdf) AI如果只加快原指标对应的动作，也可能使偏离更快发生。\n\n[连锁烘焙案例](案例A-连锁备货.md)因此需要将商品可得性、剩余、实际贡献和重要例外一起理解。目的不是给店长堆更多指标，而是让评价接近他真正能够影响的结果。\n\n## 责任必须与能够采取的行动对应\n\n如果供给数量由总部决定，下午又没有配送，门店无法仅靠积极推广满足顾客。相反，如果门店接受了更多预订，工坊和配送也应知道怎样响应，否则推广只会增加失望。\n\n负责人需要明确谁能调整数量，谁确认产能与品质，谁承担加急费用，门店何时应报告新的需求。AI提供比较和提醒，FDE把这些动作接入系统，但跨岗位资源取舍不能只留给某个员工自行协调。\n\n同样，报价系统发现客户期限与供应商货期冲突后，需要有人决定换方案、承担加急成本还是与客户重新协商。只有提醒，没有决定者，问题仍会停在消息里。\n\n## 要求员工贡献经验，也是在增加一项劳动\n\n企业希望专家把经验留下，常见做法是要求他事后写长文。可专家同时承担日常交付，整理工作就会与客户任务竞争。若没有时间安排，它只能依赖热情或加班。\n\nAI可以先从自然工作材料起草，专家集中确认关键事实和差别，再由内部维护者与FDE将修订做进方法和工具。例如设备案例中一句“未换件”的纠正，不只是改字，还可能防止后续人员带错备件或误判原因。这种贡献值得被看见，但不宜按新增条目数量奖励，否则容易鼓励更多无效文字。\n\n如果员工的经验一被吸收，马上只体现为次日任务量增加，他也可能不愿持续解释。企业需要让必要时间、角色发展和改进收益有明确安排，使贡献成为正式工作的一部分。\n\n## 让真实反馈有机会进入系统\n\n员工指出AI建议不适用，可能是在提供新的业务条件；报告试点失败，可能帮助企业停止错误投入。如果评价只认可成功案例，人员会减少坏消息，系统以后看到的材料也会偏向顺利结果。\n\n可以要求反馈具体到当时条件、采用动作和实际结果，并据此区分方法问题、执行问题和外部变化。这样既避免把所有失败推给工具，也避免把条件变化全部算成员工责任。\n\n业务负责人承担客户价值和资源选择，专业人员判断方法，FDE实现工具与工作变化，实际岗位执行并回报结果，内部承担者接续维护。角色可以由同一人兼任，但这些动作不能无人负责。\n\n当报告异常、解释差别和修订方法成为正常生产的一部分，AI才有机会持续取得真实材料，帮助企业越来越理解自己的业务。\n","html":"\u003ch1>第33章｜系统已经给出好建议，员工为什么还会按旧方式工作\u003c/h1>\n\u003cp>连锁总部要求门店减少剩余，又希望员工积极推广主打商品。店长若多报需求、最后没有卖完，会被追问；若少配一点、早早售罄，报表却显得干净。AI建议增加供给以后，员工仍可能沿用保守做法。\u003c/p>\n\u003cp>这不一定是员工抗拒新技术。他们面对的评价、可用资源和决定权可能没有改变。技术让跨岗位关系更容易被看见，真正改变行为还需要相应的经营安排。\u003c/p>\n\u003ch2 id=\"lesson-33-section-1\">局部指标为什么会使整体目标落空\u003c/h2>\n\u003cp>只看剩余量，店长有理由少配；只看工单关闭数，技术员可能优先关闭而不追踪复发；只看文章份数，团队会不断生成，即使专家已经核不过来。人员同时承担多项工作，会自然把注意力放到被衡量和奖励的部分。\u003c/p>\n\u003cp>多任务激励研究解释了这种现象：容易度量的任务可能吸引更多努力，而重要但不易衡量的部分受到挤压。\u003ca href=\"https://web.stanford.edu/~milgrom/publishedarticles/Multitask%20Principal%20Agent.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a> AI如果只加快原指标对应的动作，也可能使偏离更快发生。\u003c/p>\n\u003cp>\u003ca href=\"#case-a\">连锁烘焙案例\u003c/a>因此需要将商品可得性、剩余、实际贡献和重要例外一起理解。目的不是给店长堆更多指标，而是让评价接近他真正能够影响的结果。\u003c/p>\n\u003ch2 id=\"lesson-33-section-2\">责任必须与能够采取的行动对应\u003c/h2>\n\u003cp>如果供给数量由总部决定，下午又没有配送，门店无法仅靠积极推广满足顾客。相反，如果门店接受了更多预订，工坊和配送也应知道怎样响应，否则推广只会增加失望。\u003c/p>\n\u003cp>负责人需要明确谁能调整数量，谁确认产能与品质，谁承担加急费用，门店何时应报告新的需求。AI提供比较和提醒，FDE把这些动作接入系统，但跨岗位资源取舍不能只留给某个员工自行协调。\u003c/p>\n\u003cp>同样，报价系统发现客户期限与供应商货期冲突后，需要有人决定换方案、承担加急成本还是与客户重新协商。只有提醒，没有决定者，问题仍会停在消息里。\u003c/p>\n\u003ch2 id=\"lesson-33-section-3\">要求员工贡献经验，也是在增加一项劳动\u003c/h2>\n\u003cp>企业希望专家把经验留下，常见做法是要求他事后写长文。可专家同时承担日常交付，整理工作就会与客户任务竞争。若没有时间安排，它只能依赖热情或加班。\u003c/p>\n\u003cp>AI可以先从自然工作材料起草，专家集中确认关键事实和差别，再由内部维护者与FDE将修订做进方法和工具。例如设备案例中一句“未换件”的纠正，不只是改字，还可能防止后续人员带错备件或误判原因。这种贡献值得被看见，但不宜按新增条目数量奖励，否则容易鼓励更多无效文字。\u003c/p>\n\u003cp>如果员工的经验一被吸收，马上只体现为次日任务量增加，他也可能不愿持续解释。企业需要让必要时间、角色发展和改进收益有明确安排，使贡献成为正式工作的一部分。\u003c/p>\n\u003ch2 id=\"lesson-33-section-4\">让真实反馈有机会进入系统\u003c/h2>\n\u003cp>员工指出AI建议不适用，可能是在提供新的业务条件；报告试点失败，可能帮助企业停止错误投入。如果评价只认可成功案例，人员会减少坏消息，系统以后看到的材料也会偏向顺利结果。\u003c/p>\n\u003cp>可以要求反馈具体到当时条件、采用动作和实际结果，并据此区分方法问题、执行问题和外部变化。这样既避免把所有失败推给工具，也避免把条件变化全部算成员工责任。\u003c/p>\n\u003cp>业务负责人承担客户价值和资源选择，专业人员判断方法，FDE实现工具与工作变化，实际岗位执行并回报结果，内部承担者接续维护。角色可以由同一人兼任，但这些动作不能无人负责。\u003c/p>\n\u003cp>当报告异常、解释差别和修订方法成为正常生产的一部分，AI才有机会持续取得真实材料，帮助企业越来越理解自己的业务。\u003c/p>\n","headings":[{"id":"lesson-33-section-1","label":"局部指标为什么会使整体目标落空"},{"id":"lesson-33-section-2","label":"责任必须与能够采取的行动对应"},{"id":"lesson-33-section-3 确认关键事实和差别，再由内部维护者与FDE将修订做进方法和工具。例如设备案例中一句“未换件”的纠正，不只是改字，还可能防止后续人员带错备件或误判原因。这种贡献值得被看见，但不宜按新增条目数量奖励，否则容易鼓励更多无效文字。\n\n如果员工的经验一被吸收，马上只体现为次日任务量增加，他也可能不愿持续解释。企业需要让必要时间、角色发展和改进收益有明确安排，使贡献成为正式工作的一部分。\n\n## 让真实反馈有机会进入系统\n\n员工指出AI建议不适用，可能是在提供新的业务条件；报告试点失败，可能帮助企业停止错误投入。如果评价只认可成功案例，人员会减少坏消息，系统以后看到的材料也会偏向顺利结果。\n\n可以要求反馈具体到当时条件、采用动作和实际结果，并据此区分方法问题、执行问题和外部变化。这样既避免把所有失败推给工具，也避免把条件变化全部算成员工责任。\n\n业务负责人承担客户价值和资源选择，专业人员判断方法，FDE实现工具与工作变化，实际岗位执行并回报结果，内部承担者接续维护。角色可以由同一人兼任，但这些动作不能无人负责。\n\n当报告异常、解释差别和修订方法成为正常生产的一部分，AI才有机会持续取得真实材料，帮助企业越来越理解自己的业务。\n"},{"file":"34-长期FDE共建.md","id":"lesson-34","number":34,"role":"核心课","part":6,"title":"第34章｜长期FDE共建，企业持续购买的究竟是什么","md":"# 第34章｜长期FDE共建，企业持续购买的究竟是什么\n\n一家设备售后企业第一次引入AI，目标是整理工单。记录连起来以后，发现不少设备反复报修；继续追查，又发现部分复访与版本核对、备件准备和客户现场条件有关。要减少这些出行，下一步必须改变派工准备，而不只是继续润色维修总结。\n\n这些发现来自同一条业务逐步深入。每次重新找团队，都要重新解释背景、旧选择和例外；如果原团队只维护第一次交付的功能，新认识又可能无人实现。长期FDE共建的价值，应在这种连续变化中理解。\n\n## 连续理解，怎样减少重复认识的成本\n\n持续参与的工程团队知道为什么当时选择某种方案，哪些方法试过但没有用，哪个系统依赖哪项业务条件。新情况出现时，它更容易判断应改资料、工具、专业方法，还是岗位安排。\n\n这类认识往往不能在最初需求文档里写全，因为一些问题要等使用以后才显露。培训能帮助人员理解，首次上线能提供当时可用功能，后续仍需要工程行动和业务决定。稳定共建使新事实有较短路径进入生产。\n\n但这种连续性需要表现为可用改变。如果长期合作只是每月开会、重复汇报，同样没有形成价值。企业应能追踪一项现场发现怎样改变了工具或方法，以及实际工作怎样回应。\n\n## 用设备案例看三次相连的交付\n\n[设备售后教学案例](案例C-设备售后.md)中的第一项工作，是把同一设备的原始材料、实际操作、人员纠正和结果对应起来。例如AI曾把未换件写成换件，修复后应让当前记录和后续调用都使用正确事实。此时主要看事实质量、记录负担和人员是否采用。\n\n第二项工作，是将再次报修接回原设备，分辨重复出行。案例假设某月100项服务之外又有30次复访，其中12次与版本或配套不匹配有关，8次与材料、客户准备不足有关，另10次属于必要的分阶段服务。这样，团队找到的是前20次可能改善的机会，而不是承诺消灭全部30次。\n\n第三项工作，再根据这些原因改变出发前核对、备件准备和专业支持。实际运行以后，观察哪些出行真正减少，设备恢复和客户体验是否改善。如果减少的是原本需要分阶段完成的服务，表面复访下降也不一定是好结果。\n\n## 连续服务仍然需要经济约束\n\n案例假设每次可取消的外协复访支出500元，新AI和FDE维护每月6000元。减少10次，只省5000元，尚不足覆盖费用；减少12次刚好持平；若20次候选机会全部兑现，少支出10000元，扣费用后改善4000元。\n\n客户减少停机可能还有更大价值，但它属于客户侧结果，不能直接加进服务商现金收益。续约、专业容量和新服务机会也应分别追踪。这样，长期合作既能够讨论发展价值，也接受现实经营评价。\n\n如果后续发现主要约束已不在工程，而在备件供应，下一阶段就应改变重点。长期合作不是提前购买一串固定功能，而是持续取得与当前问题相关的改进能力。\n\n## 稳定关系与可调整安排，怎样同时存在\n\n关系合作研究讨论了难以事先写全的质量和适应要求，怎样依靠持续互动、激励与约束来处理。[原始研究](https://faculty.washington.edu/mfan/is582/articles/Baker2002.pdf) FDE对本企业例外和协作的理解，需要持续投入；阶段成果和清楚责任，则使这种投入不会变成无法评价的依赖。\n\n合作中应保留关键原件、方法条件、工具入口和运行认识。内部负责人持续承担客户价值与资源选择，专业人员参与方法判断，内部运行者逐步接住资料和评价。外部团队可以负责深入工程，但不应成为企业唯一知道系统为什么这样工作的人。\n\n业务成熟时，可以降低驻场强度，保留维护与必要支持；新产品和新场景出现时，再增加共建。企业需要长期保有的是把认识转成生产能力的力量，合作形式和资源强度可以随阶段变化。\n","html":"\u003ch1>第34章｜长期FDE共建，企业持续购买的究竟是什么\u003c/h1>\n\u003cp>一家设备售后企业第一次引入AI，目标是整理工单。记录连起来以后，发现不少设备反复报修；继续追查，又发现部分复访与版本核对、备件准备和客户现场条件有关。要减少这些出行，下一步必须改变派工准备，而不只是继续润色维修总结。\u003c/p>\n\u003cp>这些发现来自同一条业务逐步深入。每次重新找团队，都要重新解释背景、旧选择和例外；如果原团队只维护第一次交付的功能，新认识又可能无人实现。长期FDE共建的价值，应在这种连续变化中理解。\u003c/p>\n\u003ch2 id=\"lesson-34-section-1\">连续理解，怎样减少重复认识的成本\u003c/h2>\n\u003cp>持续参与的工程团队知道为什么当时选择某种方案，哪些方法试过但没有用，哪个系统依赖哪项业务条件。新情况出现时，它更容易判断应改资料、工具、专业方法，还是岗位安排。\u003c/p>\n\u003cp>这类认识往往不能在最初需求文档里写全，因为一些问题要等使用以后才显露。培训能帮助人员理解，首次上线能提供当时可用功能，后续仍需要工程行动和业务决定。稳定共建使新事实有较短路径进入生产。\u003c/p>\n\u003cp>但这种连续性需要表现为可用改变。如果长期合作只是每月开会、重复汇报，同样没有形成价值。企业应能追踪一项现场发现怎样改变了工具或方法，以及实际工作怎样回应。\u003c/p>\n\u003ch2 id=\"lesson-34-section-2\">用设备案例看三次相连的交付\u003c/h2>\n\u003cp>\u003ca href=\"#case-c\">设备售后教学案例\u003c/a>中的第一项工作，是把同一设备的原始材料、实际操作、人员纠正和结果对应起来。例如AI曾把未换件写成换件，修复后应让当前记录和后续调用都使用正确事实。此时主要看事实质量、记录负担和人员是否采用。\u003c/p>\n\u003cp>第二项工作，是将再次报修接回原设备，分辨重复出行。案例假设某月100项服务之外又有30次复访，其中12次与版本或配套不匹配有关，8次与材料、客户准备不足有关，另10次属于必要的分阶段服务。这样，团队找到的是前20次可能改善的机会，而不是承诺消灭全部30次。\u003c/p>\n\u003cp>第三项工作，再根据这些原因改变出发前核对、备件准备和专业支持。实际运行以后，观察哪些出行真正减少，设备恢复和客户体验是否改善。如果减少的是原本需要分阶段完成的服务，表面复访下降也不一定是好结果。\u003c/p>\n\u003ch2 id=\"lesson-34-section-3\">连续服务仍然需要经济约束\u003c/h2>\n\u003cp>案例假设每次可取消的外协复访支出500元，新AI和FDE维护每月6000元。减少10次，只省5000元，尚不足覆盖费用；减少12次刚好持平；若20次候选机会全部兑现，少支出10000元，扣费用后改善4000元。\u003c/p>\n\u003cp>客户减少停机可能还有更大价值，但它属于客户侧结果，不能直接加进服务商现金收益。续约、专业容量和新服务机会也应分别追踪。这样，长期合作既能够讨论发展价值，也接受现实经营评价。\u003c/p>\n\u003cp>如果后续发现主要约束已不在工程，而在备件供应，下一阶段就应改变重点。长期合作不是提前购买一串固定功能，而是持续取得与当前问题相关的改进能力。\u003c/p>\n\u003ch2 id=\"lesson-34-section-4\">稳定关系与可调整安排，怎样同时存在\u003c/h2>\n\u003cp>关系合作研究讨论了难以事先写全的质量和适应要求，怎样依靠持续互动、激励与约束来处理。\u003ca href=\"https://faculty.washington.edu/mfan/is582/articles/Baker2002.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a> FDE对本企业例外和协作的理解，需要持续投入；阶段成果和清楚责任，则使这种投入不会变成无法评价的依赖。\u003c/p>\n\u003cp>合作中应保留关键原件、方法条件、工具入口和运行认识。内部负责人持续承担客户价值与资源选择，专业人员参与方法判断，内部运行者逐步接住资料和评价。外部团队可以负责深入工程，但不应成为企业唯一知道系统为什么这样工作的人。\u003c/p>\n\u003cp>业务成熟时，可以降低驻场强度，保留维护与必要支持；新产品和新场景出现时，再增加共建。企业需要长期保有的是把认识转成生产能力的力量，合作形式和资源强度可以随阶段变化。\u003c/p>\n","headings":[{"id":"lesson-34-section-1","label":"连续理解，怎样减少重复认识的成本"},{"id":"lesson-34-section-2","label":"用设备案例看三次相连的交付"},{"id":"lesson-34-section-3","label":"连续服务仍然需要经济约束"},{"id":"lesson-34-section-4","label":"稳定关系与可调整安排，怎样同时存在"}],"exportMd":"# 第34章｜长期FDE共建，企业持续购买的究竟是什么\n\n一家设备售后企业第一次引入AI，目标是整理工单。记录连起来以后，发现不少设备反复报修；继续追查，又发现部分复访与版本核对、备件准备和客户现场条件有关。要减少这些出行，下一步必须改变派工准备，而不只是继续润色维修总结。\n\n这些发现来自同一条业务逐步深入。每次重新找团队，都要重新解释背景、旧选择和例外；如果原团队只维护第一次交付的功能，新认识又可能无人实现。长期FDE共建的价值，应在这种连续变化中理解。\n\n## 连续理解，怎样减少重复认识的成本\n\n持续参与的工程团队知道为什么当时选择某种方案，哪些方法试过但没有用，哪个系统依赖哪项业务条件。新情况出现时，它更容易判断应改资料、工具、专业方法，还是岗位安排。\n\n这类认识往往不能在最初需求文档里写全，因为一些问题要等使用以后才显露。培训能帮助人员理解，首次上线能提供当时可用功能，后续仍需要工程行动和业务决定。稳定共建使新事实有较短路径进入生产。\n\n但这种连续性需要表现为可用改变。如果长期合作只是每月开会、重复汇报，同样没有形成价值。企业应能追踪一项现场发现怎样改变了工具或方法，以及实际工作怎样回应。\n\n## 用设备案例看三次相连的交付\n\n[设备售后教学案例](#case-c)中的第一项工作，是把同一设备的原始材料、实际操作、人员纠正和结果对应起来。例如AI曾把未换件写成换件，修复后应让当前记录和后续调用都使用正确事实。此时主要看事实质量、记录负担和人员是否采用。\n\n第二项工作，是将再次报修接回原设备，分辨重复出行。案例假设某月100项服务之外又有30次复访，其中12次与版本或配套不匹配有关，8次与材料、客户准备不足有关，另10次属于必要的分阶段服务。这样，团队找到的是前20次可能改善的机会，而不是承诺消灭全部30次。\n\n第三项工作，再根据这些原因改变出发前核对、备件准备和专业支持。实际运行以后，观察哪些出行真正减少，设备恢复和客户体验是否改善。如果减少的是原本需要分阶段完成的服务，表面复访下降也不一定是好结果。\n\n## 连续服务仍然需要经济约束\n\n案例假设每次可取消的外协复访支出500元，新AI和FDE维护每月6000元。减少10次，只省5000元，尚不足覆盖费用；减少12次刚好持平；若20次候选机会全部兑现，少支出10000元，扣费用后改善4000元。\n\n客户减少停机可能还有更大价值，但它属于客户侧结果，不能直接加进服务商现金收益。续约、专业容量和新服务机会也应分别追踪。这样，长期合作既能够讨论发展价值，也接受现实经营评价。\n\n如果后续发现主要约束已不在工程，而在备件供应，下一阶段就应改变重点。长期合作不是提前购买一串固定功能，而是持续取得与当前问题相关的改进能力。\n\n## 稳定关系与可调整安排，怎样同时存在\n\n关系合作研究讨论了难以事先写全的质量和适应要求，怎样依靠持续互动、激励与约束来处理。[原始研究](https://faculty.washington.edu/mfan/is582/articles/Baker2002.pdf) FDE对本企业例外和协作的理解，需要持续投入；阶段成果和清楚责任，则使这种投入不会变成无法评价的依赖。\n\n合作中应保留关键原件、方法条件、工具入口和运行认识。内部负责人持续承担客户价值与资源选择，专业人员参与方法判断，内部运行者逐步接住资料和评价。外部团队可以负责深入工程，但不应成为企业唯一知道系统为什么这样工作的人。\n\n业务成熟时，可以降低驻场强度，保留维护与必要支持；新产品和新场景出现时，再增加共建。企业需要长期保有的是把认识转成生产能力的力量，合作形式和资源强度可以随阶段变化。\n","exportSingleMd":"# 第34章｜长期FDE共建，企业持续购买的究竟是什么\n\n一家设备售后企业第一次引入AI，目标是整理工单。记录连起来以后，发现不少设备反复报修；继续追查，又发现部分复访与版本核对、备件准备和客户现场条件有关。要减少这些出行，下一步必须改变派工准备，而不只是继续润色维修总结。\n\n这些发现来自同一条业务逐步深入。每次重新找团队，都要重新解释背景、旧选择和例外；如果原团队只维护第一次交付的功能，新认识又可能无人实现。长期FDE共建的价值，应在这种连续变化中理解。\n\n## 连续理解，怎样减少重复认识的成本\n\n持续参与的工程团队知道为什么当时选择某种方案，哪些方法试过但没有用，哪个系统依赖哪项业务条件。新情况出现时，它更容易判断应改资料、工具、专业方法，还是岗位安排。\n\n这类认识往往不能在最初需求文档里写全，因为一些问题要等使用以后才显露。培训能帮助人员理解，首次上线能提供当时可用功能，后续仍需要工程行动和业务决定。稳定共建使新事实有较短路径进入生产。\n\n但这种连续性需要表现为可用改变。如果长期合作只是每月开会、重复汇报，同样没有形成价值。企业应能追踪一项现场发现怎样改变了工具或方法，以及实际工作怎样回应。\n\n## 用设备案例看三次相连的交付\n\n[设备售后教学案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-c)中的第一项工作，是把同一设备的原始材料、实际操作、人员纠正和结果对应起来。例如AI曾把未换件写成换件，修复后应让当前记录和后续调用都使用正确事实。此时主要看事实质量、记录负担和人员是否采用。\n\n第二项工作，是将再次报修接回原设备，分辨重复出行。案例假设某月100项服务之外又有30次复访，其中12次与版本或配套不匹配有关，8次与材料、客户准备不足有关，另10次属于必要的分阶段服务。这样，团队找到的是前20次可能改善的机会，而不是承诺消灭全部30次。\n\n第三项工作，再根据这些原因改变出发前核对、备件准备和专业支持。实际运行以后，观察哪些出行真正减少，设备恢复和客户体验是否改善。如果减少的是原本需要分阶段完成的服务，表面复访下降也不一定是好结果。\n\n## 连续服务仍然需要经济约束\n\n案例假设每次可取消的外协复访支出500元，新AI和FDE维护每月6000元。减少10次，只省5000元，尚不足覆盖费用；减少12次刚好持平；若20次候选机会全部兑现，少支出10000元，扣费用后改善4000元。\n\n客户减少停机可能还有更大价值，但它属于客户侧结果，不能直接加进服务商现金收益。续约、专业容量和新服务机会也应分别追踪。这样，长期合作既能够讨论发展价值，也接受现实经营评价。\n\n如果后续发现主要约束已不在工程，而在备件供应，下一阶段就应改变重点。长期合作不是提前购买一串固定功能，而是持续取得与当前问题相关的改进能力。\n\n## 稳定关系与可调整安排，怎样同时存在\n\n关系合作研究讨论了难以事先写全的质量和适应要求，怎样依靠持续互动、激励与约束来处理。[原始研究](https://faculty.washington.edu/mfan/is582/articles/Baker2002.pdf) FDE对本企业例外和协作的理解，需要持续投入；阶段成果和清楚责任，则使这种投入不会变成无法评价的依赖。\n\n合作中应保留关键原件、方法条件、工具入口和运行认识。内部负责人持续承担客户价值与资源选择，专业人员参与方法判断，内部运行者逐步接住资料和评价。外部团队可以负责深入工程，但不应成为企业唯一知道系统为什么这样工作的人。\n\n业务成熟时，可以降低驻场强度，保留维护与必要支持；新产品和新场景出现时，再增加共建。企业需要长期保有的是把认识转成生产能力的力量，合作形式和资源强度可以随阶段变化。\n","text":"# 第34章｜长期FDE共建，企业持续购买的究竟是什么\n\n一家设备售后企业第一次引入AI，目标是整理工单。记录连起来以后，发现不少设备反复报修；继续追查，又发现部分复访与版本核对、备件准备和客户现场条件有关。要减少这些出行，下一步必须改变派工准备，而不只是继续润色维修总结。\n\n这些发现来自同一条业务逐步深入。每次重新找团队，都要重新解释背景、旧选择和例外；如果原团队只维护第一次交付的功能，新认识又可能无人实现。长期FDE共建的价值，应在这种连续变化中理解。\n\n## 连续理解，怎样减少重复认识的成本\n\n持续参与的工程团队知道为什么当时选择某种方案，哪些方法试过但没有用，哪个系统依赖哪项业务条件。新情况出现时，它更容易判断应改资料、工具、专业方法，还是岗位安排。\n\n这类认识往往不能在最初需求文档里写全，因为一些问题要等使用以后才显露。培训能帮助人员理解，首次上线能提供当时可用功能，后续仍需要工程行动和业务决定。稳定共建使新事实有较短路径进入生产。\n\n但这种连续性需要表现为可用改变。如果长期合作只是每月开会、重复汇报，同样没有形成价值。企业应能追踪一项现场发现怎样改变了工具或方法，以及实际工作怎样回应。\n\n## 用设备案例看三次相连的交付\n\n设备售后教学案例中的第一项工作，是把同一设备的原始材料、实际操作、人员纠正和结果对应起来。例如AI曾把未换件写成换件，修复后应让当前记录和后续调用都使用正确事实。此时主要看事实质量、记录负担和人员是否采用。\n\n第二项工作，是将再次报修接回原设备，分辨重复出行。案例假设某月100项服务之外又有30次复访，其中12次与版本或配套不匹配有关，8次与材料、客户准备不足有关，另10次属于必要的分阶段服务。这样，团队找到的是前20次可能改善的机会，而不是承诺消灭全部30次。\n\n第三项工作，再根据这些原因改变出发前核对、备件准备和专业支持。实际运行以后，观察哪些出行真正减少，设备恢复和客户体验是否改善。如果减少的是原本需要分阶段完成的服务，表面复访下降也不一定是好结果。\n\n## 连续服务仍然需要经济约束\n\n案例假设每次可取消的外协复访支出500元，新AI和FDE维护每月6000元。减少10次，只省5000元，尚不足覆盖费用；减少12次刚好持平；若20次候选机会全部兑现，少支出10000元，扣费用后改善4000元。\n\n客户减少停机可能还有更大价值，但它属于客户侧结果，不能直接加进服务商现金收益。续约、专业容量和新服务机会也应分别追踪。这样，长期合作既能够讨论发展价值，也接受现实经营评价。\n\n如果后续发现主要约束已不在工程，而在备件供应，下一阶段就应改变重点。长期合作不是提前购买一串固定功能，而是持续取得与当前问题相关的改进能力。\n\n## 稳定关系与可调整安排，怎样同时存在\n\n关系合作研究讨论了难以事先写全的质量和适应要求，怎样依靠持续互动、激励与约束来处理。原始研究 FDE对本企业例外和协作的理解，需要持续投入；阶段成果和清楚责任，则使这种投入不会变成无法评价的依赖。\n\n合作中应保留关键原件、方法条件、工具入口和运行认识。内部负责人持续承担客户价值与资源选择，专业人员参与方法判断，内部运行者逐步接住资料和评价。外部团队可以负责深入工程，但不应成为企业唯一知道系统为什么这样工作的人。\n\n业务成熟时，可以降低驻场强度，保留维护与必要支持；新产品和新场景出现时，再增加共建。企业需要长期保有的是把认识转成生产能力的力量，合作形式和资源强度可以随阶段变化。\n"},{"file":"35-内部吸收与接续.md","id":"lesson-35","number":35,"role":"核心课","part":6,"title":"第35章｜企业自己的AI能力，怎样从共同工作里长出来","md":"# 第35章｜企业自己的AI能力，怎样从共同工作里长出来\n\n企业安排员工学习模型、知识库和Agent，培训后大家能操作界面，也记住了一些术语。可设备增加新版本时，仍然只有外部团队知道该改哪里；客户价格规则变化，内部也不知道哪些任务会受到影响。\n\n这说明操作知识还没有变成组织的实际承担。企业自己的AI能力，需要内部有人能够判断用途、识别关键变化、协调正确支持，并解释结果。并不要求所有人写代码，但不能只会等待外部团队给结论。\n\n## 内部至少要能够回答哪些业务问题\n\n以新设备版本为例：过去的方法还能不能采用，相关资料由谁确认，哪些任务需要专家，当前系统会不会继续推荐旧结论？这些问题涉及业务判断、专业知识和工程行为，需要不同人员共同接住。\n\n组织吸收能力研究强调相关认识和内部沟通对应用外部知识的作用。[原始研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf) 因此，培养能力不只是增加某个人的术语知识，而是让关键责任在组织中有人理解、能够协作。\n\n内部负责人不必解释模型内部每一步运算，却需要知道输出用于什么决定，错误会影响什么，出现变化时应该调用哪种支持。这是企业控制自身采用范围的基本条件。\n\n## 从一项真实责任开始，比旁听全部会议更有效\n\n在[工业品报价教学案例](案例B-智能资源成本.md)中，可以让内部成员先追一笔询价：客户三天期限是否进入工程候选和采购比较，哪些地方发生过补问，最终怎样形成正式报价。他先学会看完整工作，而不是先学习所有技术概念。\n\n下一步，可以和工程师共同维护适配条件和反例。遇到旧报价误用，判断应更新原始事实、方法说明，还是系统取得材料的方式。FDE解释技术影响，内部人员提供业务含义，双方通过具体问题形成共同语言。\n\n再往后，让内部成员组织一次方案变化的比较：选择代表询价，明确最终要求，记录人员补救和采用结果，解释证据为什么支持某种范围。具体实现仍可由工程人员完成，但企业已能够提出和评价改进。\n\n## 能力形成以后，要让工作真正交出去\n\n可以让原承担者暂时退出一项限定工作，由另一位具备基础的人接续，观察正常情况和必要异常是否能处理。交接材料齐全，却仍必须每次找原人解释，就应继续修补背景、入口或支持安排。\n\n这种检验不应故意撤掉必要专业支持，也不要求新人独自解决所有问题。它要确认的是组织是否知道怎样继续：什么能直接处理，什么需要升级，谁来作决定，结果怎样返回。\n\nAWS的共建自述将生产部署和客户接续作为目标，可作为一种交付方向参照；是否真正接住，仍要看本企业的任务表现。[官方材料](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)\n\n## 外部支持与内部能力可以互相增强\n\n小企业任务量不足，未必值得建立完整技术部门。可以持续使用外部专业力量，同时把客户理解、关键事实、价值判断和资源安排保留在内部。外部团队越了解现场，工程往返越快；内部越能判断问题，双方越不容易陷入功能清单和反复解释。\n\n若外部团队独自处理全部材料、评价和决定，内部只看演示，相关认识很难积累。反过来，要求内部人员参加所有技术讨论，也可能浪费时间。更好的参与是共同处理一次版本冲突、解释一次失败、修改一项真实工作。\n\n培训应围绕这些承担设计：追完材料与执行，判断一次方法边界，比较一次投入，维护一项经验，再作阶段选择。当这些能力分布在企业内部，并能够被后来的人接任，AI共建才逐渐成为企业自身能力的发展过程。\n","html":"\u003ch1>第35章｜企业自己的AI能力，怎样从共同工作里长出来\u003c/h1>\n\u003cp>企业安排员工学习模型、知识库和Agent，培训后大家能操作界面，也记住了一些术语。可设备增加新版本时，仍然只有外部团队知道该改哪里；客户价格规则变化，内部也不知道哪些任务会受到影响。\u003c/p>\n\u003cp>这说明操作知识还没有变成组织的实际承担。企业自己的AI能力，需要内部有人能够判断用途、识别关键变化、协调正确支持，并解释结果。并不要求所有人写代码，但不能只会等待外部团队给结论。\u003c/p>\n\u003ch2 id=\"lesson-35-section-1\">内部至少要能够回答哪些业务问题\u003c/h2>\n\u003cp>以新设备版本为例：过去的方法还能不能采用，相关资料由谁确认，哪些任务需要专家，当前系统会不会继续推荐旧结论？这些问题涉及业务判断、专业知识和工程行为，需要不同人员共同接住。\u003c/p>\n\u003cp>组织吸收能力研究强调相关认识和内部沟通对应用外部知识的作用。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a> 因此，培养能力不只是增加某个人的术语知识，而是让关键责任在组织中有人理解、能够协作。\u003c/p>\n\u003cp>内部负责人不必解释模型内部每一步运算，却需要知道输出用于什么决定，错误会影响什么，出现变化时应该调用哪种支持。这是企业控制自身采用范围的基本条件。\u003c/p>\n\u003ch2 id=\"lesson-35-section-2\">从一项真实责任开始，比旁听全部会议更有效\u003c/h2>\n\u003cp>在\u003ca href=\"#case-b\">工业品报价教学案例\u003c/a>中，可以让内部成员先追一笔询价：客户三天期限是否进入工程候选和采购比较，哪些地方发生过补问，最终怎样形成正式报价。他先学会看完整工作，而不是先学习所有技术概念。\u003c/p>\n\u003cp>下一步，可以和工程师共同 -b)中，可以让内部成员先追一笔询价：客户三天期限是否进入工程候选和采购比较，哪些地方发生过补问，最终怎样形成正式报价。他先学会看完整工作，而不是先学习所有技术概念。\n\n下一步，可以和工程师共同维护适配条件和反例。遇到旧报价误用，判断应更新原始事实、方法说明，还是系统取得材料的方式。FDE解释技术影响，内部人员提供业务含义，双方通过具体问题形成共同语言。\n\n再往后，让内部成员组织一次方案变化的比较：选择代表询价，明确最终要求，记录人员补救和采用结果，解释证据为什么支持某种范围。具体实现仍可由工程人员完成，但企业已能够提出和评价改进。\n\n## 能力形成以后，要让工作真正交出去\n\n可以让原承担者暂时退出一项限定工作，由另一位具备基础的人接续，观察正常情况和必要异常是否能处理。交接材料齐全，却仍必须每次找原人解释，就应继续修补背景、入口或支持安排。\n\n这种检验不应故意撤掉必要专业支持，也不要求新人独自解决所有问题。它要确认的是组织是否知道怎样继续：什么能直接处理，什么需要升级，谁来作决定，结果怎样返回。\n\nAWS的共建自述将生产部署和客户接续作为目标，可作为一种交付方向参照；是否真正接住，仍要看本企业的任务表现。[官方材料](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)\n\n## 外部支持与内部能力可以互相增强\n\n小企业任务量不足，未必值得建立完整技术部门。可以持续使用外部专业力量，同时把客户理解、关键事实、价值判断和资源安排保留在内部。外部团队越了解现场，工程往返越快；内部越能判断问题，双方越不容易陷入功能清单和反复解释。\n\n若外部团队独自处理全部材料、评价和决定，内部只看演示，相关认识很难积累。反过来，要求内部人员参加所有技术讨论，也可能浪费时间。更好的参与是共同处理一次版本冲突、解释一次失败、修改一项真实工作。\n\n培训应围绕这些承担设计：追完材料与执行，判断一次方法边界，比较一次投入，维护一项经验，再作阶段选择。当这些能力分布在企业内部，并能够被后来的人接任，AI共建才逐渐成为企业自身能力的发展过程。\n","exportSingleMd":"# 第35章｜企业自己的AI能力，怎样从共同工作里长出来\n\n企业安排员工学习模型、知识库和Agent，培训后大家能操作界面，也记住了一些术语。可设备增加新版本时，仍然只有外部团队知道该改哪里；客户价格规则变化，内部也不知道哪些任务会受到影响。\n\n这说明操作知识还没有变成组织的实际承担。企业自己的AI能力，需要内部有人能够判断用途、识别关键变化、协调正确支持，并解释结果。并不要求所有人写代码，但不能只会等待外部团队给结论。\n\n## 内部至少要能够回答哪些业务问题\n\n以新设备版本为例：过去的方法还能不能采用，相关资料由谁确认，哪些任务需要专家，当前系统会不会继续推荐旧结论？这些问题涉及业务判断、专业知识和工程行为，需要不同人员共同接住。\n\n组织吸收能力研究强调相关认识和内部沟通对应用外部知识的作用。[原始研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf) 因此，培养能力不只是增加某个人的术语知识，而是让关键责任在组织中有人理解、能够协作。\n\n内部负责人不必解释模型内部每一步运算，却需要知道输出用于什么决定，错误会影响什么，出现变化时应该调用哪种支持。这是企业控制自身采用范围的基本条件。\n\n## 从一项真实责任开始，比旁听全部会议更有效\n\n在[工业品报价教学案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-b)中，可以让内部成员先追一笔询价：客户三天期限是否进入工程候选和采购比较，哪些地方发生过补问，最终怎样形成正式报价。他先学会看完整工作，而不是先学习所有技术概念。\n\n下一步，可以和工程师共同维护适配条件和反例。遇到旧报价误用，判断应更新原始事实、方法说明，还是系统取得材料的方式。FDE解释技术影响，内部人员提供业务含义，双方通过具体问题形成共同语言。\n\n再往后，让内部成员组织一次方案变化的比较：选择代表询价，明确最终要求，记录人员补救和采用结果，解释证据为什么支持某种范围。具体实现仍可由工程人员完成，但企业已能够提出和评价改进。\n\n## 能力形成以后，要让工作真正交出去\n\n可以让原承担者暂时退出一项限定工作，由另一位具备基础的人接续，观察正常情况和必要异常是否能处理。交接材料齐全，却仍必须每次找原人解释，就应继续修补背景、入口或支持安排。\n\n这种检验不应故意撤掉必要专业支持，也不要求新人独自解决所有问题。它要确认的是组织是否知道怎样继续：什么能直接处理，什么需要升级，谁来作决定，结果怎样返回。\n\nAWS的共建自述将生产部署和客户接续作为目标，可作为一种交付方向参照；是否真正接住，仍要看本企业的任务表现。[官方材料](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)\n\n## 外部支持与内部能力可以互相增强\n\n小企业任务量不足，未必值得建立完整技术部门。可以持续使用外部专业力量，同时把客户理解、关键事实、价值判断和资源安排保留在内部。外部团队越了解现场，工程往返越快；内部越能判断问题，双方越不容易陷入功能清单和反复解释。\n\n若外部团队独自处理全部材料、评价和决定，内部只看演示，相关认识很难积累。反过来，要求内部人员参加所有技术讨论，也可能浪费时间。更好的参与是共同处理一次版本冲突、解释一次失败、修改一项真实工作。\n\n培训应围绕这些承担设计：追完材料与执行，判断一次方法边界，比较一次投入，维护一项经验，再作阶段选择。当这些能力分布在企业内部，并能够被后来的人接任，AI共建才逐渐成为企业自身能力的发展过程。\n","text":"# 第35章｜企业自己的AI能力，怎样从共同工作里长出来\n\n企业安排员工学习模型、知识库和Agent，培训后大家能操作界面，也记住了一些术语。可设备增加新版本时，仍然只有外部团队知道该改哪里；客户价格规则变化，内部也不知道哪些任务会受到影响。\n\n这说明操作知识还没有变成组织的实际承担。企业自己的AI能力，需要内部有人能够判断用途、识别关键变化、协调正确支持，并解释结果。并不要求所有人写代码，但不能只会等待外部团队给结论。\n\n## 内部至少要能够回答哪些业务问题\n\n以新设备版本为例：过去的方法还能不能采用，相关资料由谁确认，哪些任务需要专家，当前系统会不会继续推荐旧结论？这些问题涉及业务判断、专业知识和工程行为，需要不同人员共同接住。\n\n组织吸收能力研究强调相关认识和内部沟通对应用外部知识的作用。原始研究 因此，培养能力不只是增加某个人的术语知识，而是让关键责任在组织中有人理解、能够协作。\n\n内部负责人不必解释模型内部每一步运算，却需要知道输出用于什么决定，错误会影响什么，出现变化时应该调用哪种支持。这是企业控制自身采用范围的基本条件。\n\n## 从一项真实责任开始，比旁听全部会议更有效\n\n在工业品报价教学案例中，可以让内部成员先追一笔询价：客户三天期限是否进入工程候选和采购比较，哪些地方发生过补问，最终怎样形成正式报价。他先学会看完整工作，而不是先学习所有技术概念。\n\n下一步，可以和工程师共同维护适配条件和反例。遇到旧报价误用，判断应更新原始事实、方法说明，还是系统取得材料的方式。FDE解释技术影响，内部人员提供业务含义，双方通过具体问题形成共同语言。\n\n再往后，让内部成员组织一次方案变化的比较：选择代表询价，明确最终要求，记录人员补救和采用结果，解释证据为什么支持某种范围。具体实现仍可由工程人员完成，但企业已能够提出和评价改进。\n\n## 能力形成以后，要让工作真正交出去\n\n可以让原承担者暂时退出一项限定工作，由另一位具备基础的人接续，观察正常情况和必要异常是否能处理。交接材料齐全，却仍必须每次找原人解释，就应继续修补背景、入口或支持安排。\n\n这种检验不应故意撤掉必要专业支持，也不要求新人独自解决所有问题。它要确认的是组织是否知道怎样继续：什么能直接处理，什么需要升级，谁来作决定，结果怎样返回。\n\nAWS的共建自述将生产部署和客户接续作为目标，可作为一种交付方向参照；是否真正接住，仍要看本企业的任务表现。官方材料\n\n## 外部支持与内部能力可以互相增强\n\n小企业任务量不足，未必值得建立完整技术部门。可以持续使用外部专业力量，同时把客户理解、关键事实、价值判断和资源安排保留在内部。外部团队越了解现场，工程往返越快；内部越能判断问题，双方越不容易陷入功能清单和反复解释。\n\n若外部团队独自处理全部材料、评价和决定，内部只看演示，相关认识很难积累。反过来，要求内部人员参加所有技术讨论，也可能浪费时间。更好的参与是共同处理一次版本冲突、解释一次失败、修改一项真实工作。\n\n培训应围绕这些承担设计：追完材料与执行，判断一次方法边界，比较一次投入，维护一项经验，再作阶段选择。当这些能力分布在企业内部，并能够被后来的人接任，AI共建才逐渐成为企业自身能力的发展过程。\n"},{"file":"36-复用与迁移.md","id":"lesson-36","number":36,"role":"核心课","part":6,"title":"第36章｜扩到第九家店，复制什么，重新学习什么","md":"# 第36章｜扩到第九家店，复制什么，重新学习什么\n\n一家烘焙连锁已经在原门店建立了备货和反馈方法，准备开第九家店。原来的X店位于交通枢纽，顾客多在经过时购买；新店主要服务社区，居民可能提前预订、约定取货。复制同一个界面很快，直接沿用同一个配货量却可能出错。\n\n扩张需要同时完成两件事：利用已有积累，减少重复建设；理解新场景，避免把旧条件当成普遍事实。这两项工作并不矛盾。\n\n## 哪些共同基础，可以让新店更快开始\n\n[连锁烘焙案例](案例A-连锁备货.md)已经形成商品、门店和营业日的共同含义，能够区分补货建议、正式安排、实际到店和销售结果。新店可以沿用这些结构，不必重新讨论什么算售罄、结果应该对应哪次动作。\n\n工具连接、资料整理和带教材料也可能复用。员工能够较快进入同一种工作方式，负责人也可以在共同口径下比较不同门店。这里省掉的是基础准备和反复解释，并不是省掉对新店的认识。\n\n![共同身份、事件、建议执行结果结构与工具支持多店；每家店保留自己的客群、时段与配送条件。](assets/36-共性与迁移.svg)\n\n图中共同部分托住多家门店，各店上方仍保留自己的条件。若把当地条件也全部固定为旧店答案，就会失去这层区别。\n\n## 客户不同，会改变观察需求的方式\n\n通勤门店提前售罄后，需要关注后来有多少顾客询问、未买到以后怎样选择。社区预订门店则可能更早取得约定取货数量，生产安排可以部分依据已经确认的需求。两者都要保证供给，但信息进入的时间和方式不同。\n\n新店还需要判断预订取消、临时购买和取货时段，配送是否能配合，哪些商品适合当地客户。原来识别供给限制、比较候选和接回结果的方法，可以帮助它更快提出这些问题，却不能替它填好答案。\n\n若新店最终采用与旧店不同的数量和节奏，并不代表复制失败。只要它少做了共同准备，又更快形成适合当地的做法，原积累就在发挥作用。\n\n## 复用需要把收益和适配负担一起比较\n\n与新店从头采用一种合理方案相比，现有基础少了哪些开发、资料整理和培训？为了适应新条件，又增加多少理解、连接和维护？两边都算，才能判断复用是否值得。\n\n不能只把复制按钮当作全部成本，也不能因为需要适配就否认旧基础价值。真正的问题是总负担是否减少、重要质量是否保持，以及以后再扩一家店是否会更容易。\n\n如果旧系统围绕某一家店设计得太死，每出现新情况都增加复杂例外，可能需要把共同部分和本地部分拆开。平台化的价值在于多场景能够共用有用基础，而不是所有界面看起来完全一样。\n\n吸收能力研究说明相关积累帮助理解新知识，动态能力研究则关注资源在变化中重新组合。[吸收能力研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)、[动态能力研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf) 新店扩张正需要这两方面同时发生。\n\n## 怎样检查迁移已经发生\n\n可以让新店人员用自己的材料完成一次需求判断和生产安排，看共同工具是否可用、哪些条件需要补充、原方法是否帮助识别差异。实际结果返回后，再判断本地规则和共同方法各应怎样更新。\n\n同样，设备服务进入另一系列，可以共享工单和反馈结构，但要重新检查技术方法；经销商进入新行业，可以共享询价协作，却需要认识客户工况和供应关系。\n\n企业可扩展的能力，体现在带着已有基础进入新问题，既不每次从零开始，也不强迫新业务复制旧答案。\n","html":"\u003ch1>第36章｜扩到第九家店，复制什么，重新学习什么\u003c/h1>\n\u003cp>一家烘焙连锁已经在原门店建立了备货和反馈方法，准备开第九家店。原来的X店位于交通枢纽，顾客多在经过时购买；新店主要服务社区，居民可能提前预订、约定取货。复制同一个界面很快，直接沿用同一个配货量却可能出错。\u003c/p>\n\u003cp>扩张需要同时完成两件事：利用已有积累，减少重复建设；理解新场景，避免把旧条件当成普遍事实。这两项工作并不矛盾。\u003c/p>\n\u003ch2 id=\"lesson-36-section-1\">哪些共同基础，可以让新店更快开始\u003c/h2>\n\u003cp>\u003ca href=\"#case-a\">连锁烘焙案例\u003c/a>已经形成商品、门店和营业日的共同含义，能够区分补货建议、正式安排、实际到店和销售结果。新店可以沿用这些结构，不必重新讨论什么算售罄、结果应该对应哪次动作。\u003c/p>\n\u003cp>工具连接、资料整理和带教材料也可能复用。员工能够较快进入同一种工作方式，负责人也可以在共同口径下比较不同门店。这里省掉的是基础准备和反复解释，并不是省掉对新店的认识。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNDgwIiB2aWV3Qm94PSIwIDAgMzYwIDQ4MCIgcm9sZT0iaW1nIj48dGl0bGU+5aSN5Yi257uT5p6E77yM6YeN5a2m5p2h5Lu2PC90aXRsZT48ZGVzYz7lhbHlkIzouqvku73jgIHkuovku7bjgIHmiafooYznu5PmnoTkuI7lt6XlhbfmlK/mjIHlpJrlupfvvJvlkITlupflrqLnvqTml7bmrrXphY3pgIHku43pnIDlsYDpg6jorqTor4bjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjQ4MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7lpI3liLbnu5PmnoTvvIzph43lrabmnaHku7Y8L3RleHQ+PHJlY3QgeD0iNjIiIHk9IjgyIiB3aWR0aD0iMjM2IiBoZWlnaHQ9IjExOSIgcng9IjYiIGZpbGw9IndoaXRlIiBzdHJva2U9IiMxNjVkNTIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PHRleHQgeD0iMTgwIiB5PSIxMTMiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyMSIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC13ZWlnaHQ9IjYwMCI+5YWx5ZCM57uT5p6E5LiO5bel5YW3PC90ZXh0Pjx0ZXh0IHg9IjE4MCIgeT0iMTQzIiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyMTM0MmYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSI0MDAiPui6q+S7vSDCtyDkuovku7Y8L3RleHQ+PHRleHQgeD0iMTgwIiB5PSIxNzciIGZvbnQtZmFtaW 供给，但信息进入的时间和方式不同。\u003c/p>\n\u003cp>新店还需要判断预订取消、临时购买和取货时段，配送是否能配合，哪些商品适合当地客户。原来识别供给限制、比较候选和接回结果的方法，可以帮助它更快提出这些问题，却不能替它填好答案。\u003c/p>\n\u003cp>若新店最终采用与旧店不同的数量和节奏，并不代表复制失败。只要它少做了共同准备，又更快形成适合当地的做法，原积累就在发挥作用。\u003c/p>\n\u003ch2 id=\"lesson-36-section-3\">复用需要把收益和适配负担一起比较\u003c/h2>\n\u003cp>与新店从头采用一种合理方案相比，现有基础少了哪些开发、资料整理和培训？为了适应新条件，又增加多少理解、连接和维护？两边都算，才能判断复用是否值得。\u003c/p>\n\u003cp>不能只把复制按钮当作全部成本，也不能因为需要适配就否认旧基础价值。真正的问题是总负担是否减少、重要质量是否保持，以及以后再扩一家店是否会更容易。\u003c/p>\n\u003cp>如果旧系统围绕某一家店设计得太死，每出现新情况都增加复杂例外，可能需要把共同部分和本地部分拆开。平台化的价值在于多场景能够共用有用基础，而不是所有界面看起来完全一样。\u003c/p>\n\u003cp>吸收能力研究说明相关积累帮助理解新知识，动态能力研究则关注资源在变化中重新组合。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">吸收能力研究\u003c/a>、\u003ca href=\"https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">动态能力研究\u003c/a> 新店扩张正需要这两方面同时发生。\u003c/p>\n\u003ch2 id=\"lesson-36-section-4\">怎样检查迁移已经发生\u003c/h2>\n\u003cp>可以让新店人员用自己的材料完成一次需求判断和生产安排，看共同工具是否可用、哪些条件需要补充、原方法是否帮助识别差异。实际结果返回后，再判断本地规则和共同方法各应怎样更新。\u003c/p>\n\u003cp>同样，设备服务进入另一系列，可以共享工单和反馈结构，但要重新检查技术方法；经销商进入新行业，可以共享询价协作，却需要认识客户工况和供应关系。\u003c/p>\n\u003cp>企业可扩展的能力，体现在带着已有基础进入新问题，既不每次从零开始，也不强迫新业务复制旧答案。\u003c/p>\n","headings":[{"id":"lesson-36-section-1","label":"哪些共同基础，可以让新店更快开始"},{"id":"lesson-36-section-2","label":"客户不同，会改变观察需求的方式"},{"id":"lesson-36-section-3","label":"复用需要把收益和适配负担一起比较"},{"id":"lesson-36-section-4","label":"怎样检查迁移已经发生"}],"exportMd":"# 第36章｜扩到第九家店，复制什么，重新学习什么\n\n一家烘焙连锁已经在原门店建立了备货和反馈方法，准备开第九家店。原来的X店位于交通枢纽，顾客多在经过时购买；新店主要服务社区，居民可能提前预订、约定取货。复制同一个界面很快，直接沿用同一个配货量却可能出错。\n\n扩张需要同时完成两件事：利用已有积累，减少重复建设；理解新场景，避免把旧条件当成普遍事实。这两项工作并不矛盾。\n\n## 哪些共同基础，可以让新店更快开始\n\n[连锁烘焙案例](#case-a)已经形成商品、门店和营业日的共同含义，能够区分补货建议、正式安排、实际到店和销售结果。新店可以沿用这些结构，不必重新讨论什么算售罄、结果应该对应哪次动作。\n\n工具连接、资料整理和带教材料也可能复用。员工能够较快进入同一种工作方式，负责人也可以在共同口径下比较不同门店。这里省掉的是基础准备和反复解释，并不是省掉对新店的认识。\n\n![共同身份、事件、建议执行结果结构与工具支持多店；每家店保留自己的客群、时段与配送条件。](data:image/svg+xml;base64,PHN2ZyB4bWx 平台化的价值在于多场景能够共用有用基础，而不是所有界面看起来完全一样。\n\n吸收能力研究说明相关积累帮助理解新知识，动态能力研究则关注资源在变化中重新组合。[吸收能力研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)、[动态能力研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf) 新店扩张正需要这两方面同时发生。\n\n## 怎样检查迁移已经发生\n\n可以让新店人员用自己的材料完成一次需求判断和生产安排，看共同工具是否可用、哪些条件需要补充、原方法是否帮助识别差异。实际结果返回后，再判断本地规则和共同方法各应怎样更新。\n\n同样，设备服务进入另一系列，可以共享工单和反馈结构，但要重新检查技术方法；经销商进入新行业，可以共享询价协作，却需要认识客户工况和供应关系。\n\n企业可扩展的能力，体现在带着已有基础进入新问题，既不每次从零开始，也不强迫新业务复制旧答案。\n","exportSingleMd":"# 第36章｜扩到第九家店，复制什么，重新学习什么\n\n一家烘焙连锁已经在原门店建立了备货和反馈方法，准备开第九家店。原来的X店位于交通枢纽，顾客多在经过时购买；新店主要服务社区，居民可能提前预订、约定取货。复制同一个界面很快，直接沿用同一个配货量却可能出错。\n\n扩张需要同时完成两件事：利用已有积累，减少重复建设；理解新场景，避免把旧条件当成普遍事实。这两项工作并不矛盾。\n\n## 哪些共同基础，可以让新店更快开始\n\n[连锁烘焙案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-a)已经形成商品、门店和营业日的共同含义，能够区分补货建议、正式安排、实际到店和销售结果。新店可以沿用这些结构，不必重新讨论什么算售罄、结果应该对应哪次动作。\n\n工具连接、资料整理和带教材料也可能复用。员工能够较快进入同一种工作方式，负责人也可以在共同口径下比较不同门店。这里省掉的是基础准备和反复解释，并不是省掉对新店的认识。\n\n![共同身份、事件、建议执行结果结构与工具支持多店；每家店保留自己的客群、时段与配送条件。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNDgwIiB2aWV3Qm94PSIwIDAgMzYwIDQ4MCIgcm9sZT0iaW1nIj48dGl0bGU+5aSN5Yi257uT5p6E77yM6YeN5a2m5p2h5Lu2PC90aXRsZT48ZGVzYz7lhbHlkIzouqvku73jgIHkuovku7bjgIHmiafooYznu5PmnoTkuI7lt6XlhbfmlK/mjIHlpJrlupfvvJvlkITlupflrqLnvqTml7bmrrXphY3pgIHku43pnIDlsYDpg6jorqTor4bjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjQ4MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWks 件也全部固定为旧店答案，就会失去这层区别。\n\n## 客户不同，会改变观察需求的方式\n\n通勤门店提前售罄后，需要关注后来有多少顾客询问、未买到以后怎样选择。社区预订门店则可能更早取得约定取货数量，生产安排可以部分依据已经确认的需求。两者都要保证供给，但信息进入的时间和方式不同。\n\n新店还需要判断预订取消、临时购买和取货时段，配送是否能配合，哪些商品适合当地客户。原来识别供给限制、比较候选和接回结果的方法，可以帮助它更快提出这些问题，却不能替它填好答案。\n\n若新店最终采用与旧店不同的数量和节奏，并不代表复制失败。只要它少做了共同准备，又更快形成适合当地的做法，原积累就在发挥作用。\n\n## 复用需要把收益和适配负担一起比较\n\n与新店从头采用一种合理方案相比，现有基础少了哪些开发、资料整理和培训？为了适应新条件，又增加多少理解、连接和维护？两边都算，才能判断复用是否值得。\n\n不能只把复制按钮当作全部成本，也不能因为需要适配就否认旧基础价值。真正的问题是总负担是否减少、重要质量是否保持，以及以后再扩一家店是否会更容易。\n\n如果旧系统围绕某一家店设计得太死，每出现新情况都增加复杂例外，可能需要把共同部分和本地部分拆开。平台化的价值在于多场景能够共用有用基础，而不是所有界面看起来完全一样。\n\n吸收能力研究说明相关积累帮助理解新知识，动态能力研究则关注资源在变化中重新组合。吸收能力研究、动态能力研究 新店扩张正需要这两方面同时发生。\n\n## 怎样检查迁移已经发生\n\n可以让新店人员用自己的材料完成一次需求判断和生产安排，看共同工具是否可用、哪些条件需要补充、原方法是否帮助识别差异。实际结果返回后，再判断本地规则和共同方法各应怎样更新。\n\n同样，设备服务进入另一系列，可以共享工单和反馈结构，但要重新检查技术方法；经销商进入新行业，可以共享询价协作，却需要认识客户工况和供应关系。\n\n企业可扩展的能力，体现在带着已有基础进入新问题，既不每次从零开始，也不强迫新业务复制旧答案。\n"},{"file":"37-阶段发展路线.md","id":"lesson-37","number":37,"role":"核心课","part":7,"title":"第37章｜怎样安排一条有方向、又能被证据改变的路线","md":"# 第37章｜怎样安排一条有方向、又能被证据改变的路线\n\n“先建知识库，再上Agent，最后实现自动化”，听起来像一条清晰路线。但如果客户最需要的是可靠交期，知识库是否应当先做？如果现有资料已经齐全，真正限制结果的是专家容量，继续整理内容又能改变什么？\n\n技术顺序不能直接代替经营路线。一条可用路线需要说明每阶段为什么值得投入，当前能交付什么，以及哪些结果会支持下一步、促使改向或停止。\n\n## 先确定比工具更稳定的方向\n\n烘焙连锁希望顾客在需要时更可靠地买到新鲜商品，同时控制剩余。设备企业希望更可靠地恢复服务、减少可避免复访。经销商希望形成能履约的替代方案，并保住订单贡献。\n\n这些方向可以持续，使用的模型、界面和分工却可能改变。若把某个工具当成终点，新能力出现以后，企业容易为了保留旧建设而错过更合适的安排。\n\n动态能力研究关注资源如何持续适应和重组。[原始研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf) 对路线设计而言，稳定的是要改善的客户结果与企业能力，阶段方法则应允许被事实改变。\n\n## 用连锁案例看阶段之间的依赖\n\n[连锁烘焙案例](案例A-连锁备货.md)起初只知道X店提前售罄、Y店有剩余。先需要把实际销量、售罄后的顾客行为、工坊余量和配送条件对应起来，才能判断扩产是否可能有价值。\n\n若确认供给与履约条件可行，再比较只改分配和增加生产。按案例成本，扩产相对100/60安排需要多卖至少27份才更好。试点因此围绕真实新增需求、补货执行和贡献展开，而不是先追求全网自动排产。\n\n若试点支持继续，下一阶段检查更多日期、接任人员和新店是否能使用方法。再出现新的客户需要，才研究预订等服务。各阶段由当前证据连接，不是提前认定所有企业都要按相同顺序走完。\n\n已有完整资料链的企业可以直接进入价值比较；客户根本不需要目标结果时，则应先改方向。起点应落在最能改变选择的缺口上。\n\n## 每阶段既要学习，也要交付\n\n阶段成果可以是一项可用工作入口、一种经过比较的方法，或者有依据地停止一个方向。还要明确承担者、资源和复查时点，使团队知道什么时候重新决定。\n\n“获得认识”需要具体说明改变了什么。例如发现补货卖不动，决定保留简单分配；发现需求存在而配送晚到，转向履约改造。若所有结果都只支持继续投入，阶段检验就失去了作用。\n\n内容团队在验证每篇20分钟核验能保持质量之前，不宜已经承诺每天6篇；设备服务先分清哪些复访可避免，再按费用覆盖点安排投入。不同业务的阶段依赖来自不同的价值实现条件，不能用同一份功能清单替代。\n\n## 新技术出现时，怎样调整而不推倒重来\n\n新模型可能使原来困难的理解任务更可靠，也可能使新服务变得可行。可以先用本企业代表任务比较它改变了什么。若客户目标和生产条件没有变，可能只替换一部分能力；若交付边界发生变化，则重新研究客户、责任和收益。\n\n已有原件、方法条件、评价任务和内部认识，可以帮助企业完成这种判断。路线因此能够累积，而不必每次新工具出现都从头开始。\n\n连续FDE与内部负责人共同保持现场、工程和结果之间的往返：变化被看见，改法被实现，使用结果影响下一笔资源。路线的连续性在于企业持续改善，而不是项目组件只增不减。\n","html":"\u003ch1>第37章｜怎样安排一条有方向、又能被证据改变的路线\u003c/h1>\n\u003cp>“先建知识库，再上Agent，最后实现自动化”，听起来像一条清晰路线。但如果客户最需要的是可靠交期，知识库是否应当先做？如果现有资料已经齐全，真正限制结果的是专家容量，继续整理内容又能改变什么？\u003c/p>\n\u003cp>技术顺序不能直接代替经营路线。一条可用路线需要说明每阶段为什么值得投入，当前能交付什么，以及哪些结果会支持下一步、促使改向或停止。\u003c/p>\n\u003ch2 id=\"lesson-37-section-1\">先确定比工具更稳定的方向\u003c/h2>\n\u003cp>烘焙连锁希望顾客在需要时更可靠地买到新鲜商品，同时控制剩余。设备企业希望更可靠地恢复服务、减少可避免复访。经销商希望形成能履约的替代方案，并保住订单贡献。\u003c/p>\n\u003cp>这些方向可以持续，使用的模型、界面和分工却可能改变。若把某个工具当成终点，新能力出现以后，企业容易为了保留旧建设而错过更合适的安排。\u003c/p>\n\u003cp>动态能力研究关注资源如何持续适应和重组。\u003ca href=\"https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a> 对路线设计而言，稳定的是要改善的客户结果与企业能力，阶段方法则应允许被事实改变。\u003c/p>\n\u003ch2 id=\"lesson-37-section-2\">用连锁案例看阶段之间的依赖\u003c/h2>\n\u003cp>\u003ca href=\"#case-a\">连锁烘焙案例\u003c/a>起初只知道X店提前售罄、Y店有剩余。先需要把实际销量、售罄后的顾客行为、工坊余量和配送条件对应起来，才能判断扩产是否可能有价值。\u003c/p>\n\u003cp>若确认供给与履约条件可行，再比较只改分配和增加生产。按案例成本，扩产相对100/60安排需要多卖至少27份才更好。试点因此围绕真实新增需求、补货执行和贡献展开，而不是先追求全网自动排产。\u003c/p>\n\u003cp>若试点支持继续，下一阶段检查更多日期、接任人员和新店是否能使用方法。再出现新的客户需要，才研究预订等服务。各阶段由当前证据连接，不是提前认定所有企业都要按相同顺序走完。\u003c/p>\n\u003cp>已有完整资料链的企业可以直接进入价值比较；客户根本不需要目标结果时，则应先改方向。起点应落在最能改变选择的缺口上。\u003c/p>\n\u003ch2 id=\"lesson-37-section-3\">每阶段既要学习，也要交付\u003c/h2>\n\u003cp>阶段成果可以是一项可用工作入口、一种经过比较的方法，或者有依据地停止一个方向。还要明确承担者、资源和复查时点，使团队知道什么时候重新决定。\u003c/p>\n\u003cp>“获得认识”需要具体说明改变了什么。例如发现补货卖不动，决定保留简单分配；发现需求存在而配送晚到，转向履约改造。若所有结果都只支持继续投入，阶段检验就失去了作用。\u003c/p>\n\u003cp>内容团队在验证每篇20分钟核验能保持质量之前，不宜已经承诺每天6篇；设备服务先分清哪些复访可避免，再按费用覆盖点安排投入。不同业务的阶段依赖来自不同的价值实现条件，不能用同一份功能清单替代。\u003c/p>\n\u003ch2 id=\"lesson-37-section-4\">新技术出现时，怎样调整而不推倒重来\u003c/h2>\n\u003cp>新模型可能使原来困难的理解任务更可靠，也可能使新服务变得可行。可以先用本企业代表任务比较它改变了什么。若客户目标和生产条件没有变，可能只替换一部分能力；若交付边界发生变化，则重新研究客户、责任和收益。\u003c/p>\n\u003cp>已有原件、方法条件、评价任务和内部认识，可以帮助企业完成这种判断。路线因此能够累积，而不必每次新工具出现都从头开始。\u003c/p>\n\u003cp>连续FDE与内部负责人共同保持现场、工程和结果之间的往返：变化被看见，改法被实现，使用结果影响下一笔资源。路线的连续性在于企业持续改善，而不是项目组件只增不减。\u003c/p>\n","headings":[{"id":"lesson-37-section-1","label":"先确定比工具更稳定的方向"},{"id":"lesson-37-section-2","label":"用连锁案例看阶段之间的依赖"},{"id":"lesson-37-section-3","label":"每阶段既要学习，也要交付"},{"id":"lesson-37-section-4","label":"新技术出现时，怎样调整而不推倒重来"}],"exportMd":"# 第37章｜怎样安排一条有方向、又能被证据改变的路线\n\n“先建知识库，再上Agent，最后实现自动化”，听起来像一条清晰路线。但如果客户最需要的是可靠交期，知识库是否应当先做？如果现有资料已经齐全，真正限制结果的是专家容量，继续整理内容又能改变什么？\n\n技术顺序不能直接代替经营路线。一条可用路线需要说明每阶段为什么值得投入，当前能交付什么，以及哪些结果会支持下一步、促使改向或停止。\n\n## 先确定比工具更稳定的方向\n\n烘焙连锁希望顾客在需要时更可靠地买到新鲜商品，同时控制剩余。设备企业希望更可靠地恢复服务、减少可避免复访。经销商希望形成能履约的替代方案，并保住订单贡献。\n\n这些方向可以持续，使用的模型、界面和分工却可能改变。若把某个工具当成终点，新能力出现以后，企业容易为了保留旧建设而错过更合适的安排。\n\n动态能力研究关注资源如何持续适应和重组。[原始研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf) 对路线设计而言，稳定的是要改善的客户结果与企业能力，阶段方法则应允许被事实改变。\n\n## 用连锁案例看阶段之间的依赖\n\n[连锁烘焙案例](#case-a)起初只知道X店提前售罄、Y店有剩余。先需要把实际销量、售罄后的顾客行为、工坊余量和配送条件对应起来，才能判断扩产是否可能有价值。\n\n若确认供给与履约条件可行，再比较只改分配和增加生产。按案例成本，扩产相对100/60安排需要多卖至少27份才更好。试点因此围绕真实新增需求、补货执行和贡献展开，而不是先追求全网自动排产。\n\n若试点支持继续，下一阶段检查更多日期、接任人员和新店是否能使用方法。再出现新的客户需要，才研究预订等服务。各阶段由当前证据连接，不是提前认定所有企业都要按相同顺序走完。\n\n已有完整资料链的企业可以直接进入价值比较；客户根本不需要目标结果时，则应先改方向。起点应落在最能改变选择的缺口上。\n\n## 每阶段既要学习，也要交付\n\n阶段成果可以是一项可用工作入口、一种经过比较的方法，或者有依据地停止一个方向。还要明确承担者、资源和复查时点，使团队知道什么时候重新决定。\n\n“获得认识”需要具体说明改变了什么。例如发现补货卖不动，决定保留简单分配；发现需求存在而配送晚到，转向履约改造。若所有结果都只支持继续投入，阶段检验就失去了作用。\n\n内容团队在验证每篇20分钟核验能保持质量之前，不宜已经承诺每天6篇；设备服务先分清哪些复访可避免，再按费用覆盖点安排投入。不同业务的阶段依赖来自不同的价值实现条件，不能用同一份功能清单替代。\n\n## 新技术出现时，怎样调整而不推倒重来\n\n新模型可能使原来困难的理解任务更可靠，也可能使新服务变得可行。可以先用本企业代表任务比较它改变了什么。若客户目标和生产条件没有变，可能只替换一部分能力；若交付边界发生变化，则重新研究客户、责任和收益。\n\n已有原件、方法条件、评价任务和内部认识，可以帮助企业完成这种判断。路线因此能够累积，而不必每次新工具出现都从头开始。\n\n连续FDE与内部负责人共同保持现场、工程和结果之间的往返：变化被看见，改法被实现，使用结果影响下一笔资源。路线的连续性在于企业持续改善，而不是项目组件只增不减。\n","exportSingleMd":"# 第37章｜怎样安排一条有方向、又能被证据改变的路线\n\n“先建知识库，再上Agent，最后实现自动化”，听起来像一条清晰路线。但如果客户最需要的是可靠交期，知识库是否应当先做？如果现有资料已经齐全，真正限制结果的是专家容量，继续整理内容又能改变什么？\n\n技术顺序不能直接代替经营路线。一条可用路线需要说明每阶段为什么值得投入，当前能交付什么，以及哪些结果会支持下一步、促使改向或停止。\n\n## 先确定比工具更稳定的方向\n\n烘焙连锁希望顾客在需要时更可靠地买到新鲜商品，同时控制剩余。设备企业希望更可靠地恢复服务、减少可避免复访。经销商希望形成能履约的替代方案，并保住订单贡献。\n\n这些方向可以持续，使用的模型、界面和分工却可能改变。若把某个工具当成终点，新能力出现以后，企业容易为了保留旧建设而错过更合适的安排。\n\n动态能力研究关注资源如何持续适应和重组。[原始研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf) 对路线设计而言，稳定的是要改善的客户结果与企业能力，阶段方法则应允许被事实改变。\n\n## 用连锁案例看阶段之间的依赖\n\n[连锁烘焙案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-a)起初只知道X店提前售罄、Y店有剩余。先需要把实际销量、售罄后的顾客行为、工坊余量和配送条件对应起来，才能判断扩产是否可能有价值。\n\n若确认供给与履约条件可行，再比较只改分配和增加生产。按案例成本，扩产相对100/60安排需要多卖至少27份才更好。试点因此围绕真实新增需求、补货执行和贡献展开，而不是先追求全网自动排产。\n\n若试点支持继续，下一阶段检查更多日期、接任人员和新店是否能使用方法。再出现新的客户需要，才研究预订等服务。各阶段由当前证据连接，不是提前认定所有企业都要按相同顺序走完。\n\n已有完整资料链的企业可以直接进入价值比较；客户根本不需要目标结果时，则应先改方向。起点应落在最能改变选择的缺口上。\n\n## 每阶段既要学习，也要交付\n\n阶段成果可以是一项可用工作入口、一种经过比较的方法，或者有依据地停止一个方向。还要明确承担者、资源和复查时点，使团队知道什么时候重新决定。\n\n“获得认识”需要具体说明改变了什么。例如发现补货卖不动，决定保留简单分配；发现需求存在而配送晚到，转向履约改造。若所有结果都只支持继续投入，阶段检验就失去了作用。\n\n内容团队在验证每篇20分钟核验能保持质量之前，不宜已经承诺每天6篇；设备服务先分清哪些复访可避免，再按费用覆盖点安排投入。不同业务的阶段依赖来自不同的价值实现条件，不能用同一份功能清单替代。\n\n## 新技术出现时，怎样调整而不推倒重来\n\n新模型可能使原来困难的理解任务更可靠，也可能使新服务变得可行。可以先用本企业代表任务比较它改变了什么。若客户目标和生产条件没有变，可能只替换一部分能力；若交付边界发生变化，则重新研究客户、责任和收益。\n\n已有原件、方法条件、评价任务和内部认识，可以帮助企业完成这种判断。路线因此能够累积，而不必每次新工具出现都从头开始。\n\n连续FDE与内部负责人共同保持现场、工程和结果之间的往返：变化被看见，改法被实现，使用结果影响下一笔资源。路线的连续性在于企业持续改善，而不是项目组件只增不减。\n","text":"# 第37章｜怎样安排一条有方向、又能被证据改变的路线\n\n“先建知识库，再上Agent，最后实现自动化”，听起来像一条清晰路线。但如果客户最需要的是可靠交期，知识库是否应当先做？如果现有资料已经齐全，真正限制结果的是专家容量，继续整理内容又能改变什么？\n\n技术顺序不能直接代替经营路线。一条可用路线需要说明每阶段为什么值得投入，当前能交付什么，以及哪些结果会支持下一步、促使改向或停止。\n\n## 先确定比工具更稳定的方向\n\n烘焙连锁希望顾客在需要时更可靠地买到新鲜商品，同时控制剩余。设备企业希望更可靠地恢复服务、减少可避免复访。经销商希望形成能履约的替代方案，并保住订单贡献。\n\n这些方向可以持续，使用的模型、界面和分工却可能改变。若把某个工具当成终点，新能力出现以后，企业容易为了保留旧建设而错过更合适的安排。\n\n动态能力研究关注资源如何持续适应和重组。原始研究 对路线设计而言，稳定的是要改善的客户结果与企业能力，阶段方法则应允许被事实改变。\n\n## 用连锁案例看阶段之间的依赖\n\n连锁烘焙案例起初只知道X店提前售罄、Y店有剩余。先需要把实际销量、售罄后的顾客行为、工坊余量和配送条件对应起来，才能判断扩产是否可能有价值。\n\n若确认供给与履约条件可行，再比较只改分配和增加生产。按案例成本，扩产相对100/60安排需要多卖至少27份才更好。试点因此围绕真实新增需求、补货执行和贡献展开，而不是先追求全网自动排产。\n\n若试点支持继续，下一阶段检查更多日期、接任人员和新店是否能使用方法。再出现新的客户需要，才研究预订等服务。各阶段由当前证据连接，不是提前认定所有企业都要按相同顺序走完。\n\n已有完整资料链的企业可以直接进入价值比较；客户根本不需要目标结果时，则应先改方向。起点应落在最能改变选择的缺口上。\n\n## 每阶段既要学习，也要交付\n\n阶段成果可以是一项可用工作入口、一种经过比较的方法，或者有依据地停止一个方向。还要明确承担者、资源和复查时点，使团队知道什么时候重新决定。\n\n“获得认识”需要具体说明改变了什么。例如发现补货卖不动，决定保留简单分配；发现需求存在而配送晚到，转向履约改造。若所有结果都只支持继续投入，阶段检验就失去了作用。\n\n内容团队在验证每篇20分钟核验能保持质量之前，不宜已经承诺每天6篇；设备服务先分清哪些复访可避免，再按费用覆盖点安排投入。不同业务的阶段依赖来自不同的价值实现条件，不能用同一份功能清单替代。\n\n## 新技术出现时，怎样调整而不推倒重来\n\n新模型可能使原来困难的理解任务更可靠，也可能使新服务变得可行。可以先用本企业代表任务比较它改变了什么。若客户目标和生产条件没有变，可能只替换一部分能力；若交付边界发生变化，则重新研究客户、责任和收益。\n\n已有原件、方法条件、评价任务和内部认识，可以帮助企业完成这种判断。路线因此能够累积，而不必每次新工具出现都从头开始。\n\n连续FDE与内部负责人共同保持现场、工程和结果之间的往返：变化被看见，改法被实现，使用结果影响下一笔资源。路线的连续性在于企业持续改善，而不是项目组件只增不减。\n"},{"file":"38-新产品与服务.md","id":"lesson-38","number":38,"role":"核心课","part":7,"title":"第38章｜企业自己的AI，怎样帮助创造原来没有的生意","md":"# 第38章｜企业自己的AI，怎样帮助创造原来没有的生意\n\n工业品牌客户原来按篇购买产品文章，后来可以自己用AI起草。服务商的旧收费理由受到压力，但客户仍有一组问题没有解决：材料是否准确，是否回应采购者关心的工况，带来的询价是否合适，销售跟进以后为什么没有成交？\n\n这些问题可能打开新的服务空间，也可能只是原有交付需要补足的部分。企业需要从持续工作中发现具体需要，再验证自己是否能够提供、客户是否愿意付费。\n\n## 新需求往往藏在客户反复修改的地方\n\n在[工业品牌内容教学案例](案例D-专业服务.md)中，一篇文章混用了型号性能，客户不能发布；另一篇虽然准确，却没有回应采购者关于替代旧型号、适用条件和交期的疑问，销售仍要重新解释。\n\n如果只统计稿件通过率，团队容易把这些都归为写作问题。把产品资料、客户修改、销售常见问题和未成交理由放在一起，AI则可以帮助提出另一种解释：部分采购者需要的，是判断产品能否进入自己的工作，而不只是阅读一篇流畅介绍。\n\n这个解释要继续与真实材料核对，区分稳定需要与某次偶然反馈。若反复成立，企业就获得了新的客户认识：哪些问题值得优先回答，什么证据能够帮助客户判断，哪些内容需要与销售动作连接。\n\n## 把新认识做成小而完整的交付\n\n服务可以先选一个客户、一类产品和一个明确采购问题。团队整理相关询价，形成有依据的问题清单；AI协助构思回应，专业人员核验事实；再把可用材料交给内容和销售岗位使用。\n\n随后追踪：哪些材料被采用，产生的询问是否相关，销售是否继续跟进，卡在哪一步。得到这些反馈，才能调整问题和材料。若只多发文章，没有后续记录，就无法判断它是否改善了获客过程。\n\nFDE在这里要实现的，不只是写作按钮，而是使产品资料、内容、询价与跟进能够对应。专业人员负责准确性，客户销售负责真实行动，双方还需要约定哪些反馈可以持续提供。\n\n这种服务仍不应一开始就承诺全面代管获客。先对一个可观察问题承担清楚范围，才能知道新增责任需要多少人员与工具，客户是否认可。\n\n## 新收费方式必须对应新的责任\n\n按篇收费容易理解：交付一篇合格材料，收取相应费用。持续服务则包含资料更新、问题研究、专业支持和结果解释。按月收费可以支持这些工作，但也可能使服务商承担超过能力的责任。\n\n如果客户只需要准确材料，一次性交付或固定内容服务可能已经足够；如果希望持续改善询价质量，却不愿提供后续记录，服务商就难以承担完整判断。合同名称变成订阅，并不会自动使交付形成持续价值。\n\n案例中的月度账已经显示，核验能力提高到每天6篇，也需要真实付费需求。若客户仍只买80篇，新增共建费用可能降低贡献。新服务同样要回答：谁愿意为什么付费，收入是否足以支持持续人工、工具与配合。\n\nTeece的商业模式研究将客户价值、交付方式和价值获取联系起来。[原始研究](https://www.sciencedirect.com/science/article/pii/S002463010900051X) 宝洁研究提供AI参与跨专业构思的参照，但并未替任何具体新产品证明市场收入。[创新研究](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n## 哪些结果意味着应当改变产品方向\n\n若技术内容准确性改善，客户已经得到主要价值，可以先把这项服务做稳。若询价质量提高，却没有销售接续，应讨论双方协作和服务边界。若客户愿意提供反馈并持续采用，才有理由扩大问题范围和支持周期。\n\n烘焙企业发展预订、设备企业发展持续服务、经销商发展适配支持，也可以沿相似过程探索。它们都从原业务积累出发，却需要重新认识新客户处境、交付条件和收费逻辑。\n\nAI帮助企业创造新生意的途径，既包括提出更多想法，也包括让过去分散的线索被一起理解。持续生产提供材料，专业与经营判断检验解释，FDE将可行认识做进服务。新的know-how和新的产品，才可能在这个过程中一起形成。\n","html":"\u003ch1>第38章｜企业自己的AI，怎样帮助创造原来没有的生意\u003c/h1>\n\u003cp>工业品牌客户原来按篇购买产品文章，后来可以自己用AI起草。服务商的旧收费理由受到压力，但客户仍有一组问题没有解决：材料是否准确，是否回应采购者关心的工况，带来的询价是否合适，销售跟进以后为什么没有成交？\u003c/p>\n\u003cp>这些问题可能打开新的服务空间，也可能只是原有交付需要补足的部分。企业需要从持续工作中发现具体需要，再验证自己是否能够提供、客户是否愿意付费。\u003c/p>\n\u003ch2 id=\"lesson-38-section-1\">新需求往往藏在客户反复修改的地方\u003c/h2>\n\u003cp>在\u003ca href=\"#case-d\">工业品牌内容教学案例\u003c/a>中，一篇文章混用了型号性能，客户不能发布；另一篇虽然准确，却没有回应采购者关于替代旧型号、适用条件和交期的疑问，销售仍要重新解释。\u003c/p>\n\u003cp>如果只统计稿件通过率，团队容易把这些都归为写作问题。把产品资料、客户修改、销售常见问题和未成交理由放在一起，AI则可以帮助提出另一种解释：部分采购者需要的，是判断产品能否进入自己的工作，而不只是阅读一篇流畅介绍。\u003c/p>\n\u003cp>这个解释要继续与真实材料核对，区分稳定需要与某次偶然反馈。若反复成立，企业就获得了新的客户认识：哪些问题值得优先回答，什么证据能够帮助客户判断，哪些内容需要与销售动作连接。\u003c/p>\n\u003ch2 id=\"lesson-38-section-2\">把新认识做成小而完整的交付\u003c/h2>\n\u003cp>服务可以先选一个客户、一类产品和一个明确采购问题。团队整理相关询价，形成有依据的问题清单；AI协助构思回应，专业人员核验事实；再把可用材料交给内容和销售岗位使用。\u003c/p>\n\u003cp>随后追踪：哪些材料被采用，产生的询问是否相关，销售是否继续跟进，卡在哪一步。得到这些反馈，才能调整问题和材料。若只多发文章，没有后续记录，就无法判断它是否改善了获客过程。\u003c/p>\n\u003cp>FDE在这里要实现的，不只是写作按钮，而是使产品资料、内容、询价与跟进能够对应。专业人员负责准确性，客户销售负责真实行动，双方还需要约定哪些反馈可以持续提供。\u003c/p>\n\u003cp>这种服务仍不应一开始就承诺全面代管获客。先对一个可观察问题承担清楚范围，才能知道新增责任需要多少人员与工具，客户是否认可。\u003c/p>\n\u003ch2 id=\"lesson-38-section-3\">新收费方式必须对应新的责任\u003c/h2>\n\u003cp>按篇收费容易理解：交付一篇合格材料，收取相应费用。持续服务则包含资料更新、问题研究、专业支持和结果解释。按月收费可以支持这些工作，但也可能使服务商承担超过能力的责任。\u003c/p>\n\u003cp>如果客户只需要准确材料，一次性交付或固定内容服务可能已经足够；如果希望持续改善询价质量，却不愿提供后续记录，服务商就难以承担完整判断。合同名称变成订阅，并不会自动使交付形成持续价值。\u003c/p>\n\u003cp>案例中的月度账已经显示，核验能力提高到每天6篇，也需要真实付费需求。若客户仍只买80篇，新增共建费用可能降低贡献。新服务同样要回答：谁愿意为什么付费，收入是否足以支持持续人工、工具与配合。\u003c/p>\n\u003cp>Teece的商业模式研究将客户价值、交付方式和价值获取联系起来。\u003ca href=\"https://www.sciencedirect.com/science/article/pii/S002463010900051X\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a> 宝洁研究提供AI参与跨专业构思的参照，但并未替任何具体新产品证明市场收入。\u003ca href=\"https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702\" target=\"_blank\" rel=\"noopener noreferrer\">创新研究\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-38-section-4\">哪些结果意味着应当改变产品方向\u003c/h2>\n\u003cp>若技术内容准确性改善，客户已经得到主要价值，可以先把这项服务做稳。若询价质量提高，却没有销售接续，应讨论双方协作和服务边界。若客户愿意提供反馈并持续采用，才有理由扩大问题范围和支持周期。\u003c/p>\n\u003cp>烘焙企业发展预订、设备企业发展持续服务、经销商发展适配支持，也可以沿相似过程探索。它们都从原业务积累出发，却需要重新认识新客户处境、交付条件和收费逻辑。\u003c/p>\n\u003cp>AI帮助企业创造新生意的途径，既包括提出更多想法，也包括让过去分散的线索被一起理解。持续生产提供材料，专业与经营判断检验解释，FDE将可行认识做进服务。新的know-how和新的产品，才可能在这个过程中一起形成。\u003c/p>\n","headings":[{"id":"lesson-38-section-1","label":"新需求往往藏在客户反复修改的地方"},{"id":"lesson-38-section-2","label":"把新认识做成小而完整的交付"},{"id":"lesson-38-section-3","label":"新收费方式必须对应新的责任"},{"id":"lesson-38-section-4","label":"哪些结果意味着应当改变产品方向"}],"exportMd":"# 第38章｜企业自己的AI，怎样帮助创造原来没有的生意\n\n工业品牌客户原来按篇购买产品文章，后来可以自己用AI起草。服务商的旧收费理由受到压力，但客户仍有一组问题没有解决：材料是否准确，是否回应采购者关心的工况，带来的询价是否合适，销售跟进以后为什么没有成交？\n\n这些问题可能打开新的服务空间，也可能只是原有交付需要补足的部分。企业需要从持续工作中发现具体需要，再验证自己是否能够提供、客户是否愿意付费。\n\n## 新需求往往藏在客户反复修改的地方\n\n在[工业品牌内容教学案例](#case-d)中，一篇文章混用了型号性能，客户不能发布；另一篇虽然准确，却没有回应采购者关于替代旧型号、适用条件和交期的疑问，销售仍要重新解释。\n\n如果只统计稿件通过率，团队容易把这些都归为写作问题。把产品资料、客户修改、销售常见问题和未成交理由放在一起，AI则可以帮助提出另一种解释：部分采购者需要的，是判断产品能否进入自己的工作，而不只是阅读一篇流畅介绍。\n\n这个解释要继续与真实材料核对，区分稳定需要与某次偶然反馈。若反复成立，企业就获得了新的客户认识：哪些问题值得优先回答，什么证据能够帮助客户判断，哪些内容需要与销售动作连接。\n\n## 把新认识做成小而完整的交付\n\n服务可以先选一个客户、一类产品和一个明确采购问题。团队整理相关询价，形成有依据的问题清单；AI协助构思回应，专业人员核验事实；再把可用材料交给内容和销售岗位使用。\n\n随后追踪：哪些材料被采用，产生的询问是否相关，销售是否继续跟进，卡在哪一步。得到这些反馈，才能调整问题和材料。若只多发文章，没有后续记录，就无法判断它是否改善了获客过程。\n\nFDE在这里要实现的，不只是写作按钮，而是使产品资料、内容、询价与跟进能够对应。专业人员负责准确性，客户销售负责真实行动，双方还需要约定哪些反馈可以持续提供。\n\n这种服务仍不应一开始就承诺全面代管获客。先对一个可观察问题承担清楚范围，才能知道新增责任需要多少人员与工具，客户是否认可。\n\n## 新收费方式必须对应新的责任\n\n按篇收费容易理解：交付一篇合格材料，收取相应费用。持续服务则包含资料更新、问题研究、专业支持和结果解释。按月收费可以支持这些工作，但也可能使服务商承担超过能力的责任。\n\n如果客户只需要准确材料，一次性交付或固定内容服务可能已经足够；如果希望持续改善询价质量，却不愿提供后续记录，服务商就难以承担完整判断。合同名称变成订阅，并不会自动使交付形成持续价值。\n\n案例中的月度账已经显示，核验能力提高到每天6篇，也需要真实付费需求。若客户仍只买80篇，新增共建费用可能降低贡献。新服务同样要回答：谁愿意为什么付费，收入是否足以支持持续人工、工具与配合。\n\nTeece的商业模式研究将客户价值、交付方式和价值获取联系起来。[原始研究](https://www.sciencedirect.com/science/article/pii/S002463010900051X) 宝洁研究提供AI参与跨专业构思的参照，但并未替任何具体新产品证明市场收入。[创新研究](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n## 哪些结果意味着应当改变产品方向\n\n若技术内容准确性改善，客户已经得到主要价值，可以先把这项服务做稳。若询价质量提高，却没有销售接续，应讨论双方协作和服务边界。若客户愿意提供反馈并持续采用，才有理由扩大问题范围和支持周期。\n\n烘焙企业发展预订、设备企业发展持续服务、经销商发展适配支持，也可以沿相似过程探索。它们都从原业务积累出发，却需要重新认识新客户处境、交付条件和收费逻辑。\n\nAI帮助企业创造新生意的途径，既包括提出更多想法，也包括让过去分散的线索被一起理解。持续生产提供材料，专业与经营判断检验解释，FDE将可行认识做进服务。新的know-how和新的产品，才可能在这个过程中一起形成。\n","exportSingleMd":"# 第38章｜企业自己的AI，怎样帮助创造原来没有的生意\n\n工业品牌客户原来按篇购买产品文章，后来可以自己用AI起草。服务商的旧收费理由受到压力，但客户仍有一组问题没有解决：材料是否准确，是否回应采购者关心的工况，带来的询价是否合适，销售跟进以后为什么没有成交？\n\n这些问题可能打开新的服务空间，也可能只是原有交付需要补足的部分。企业需要从持续工作中发现具体需要，再验证自己是否能够提供、客户是否愿意付费。\n\n## 新需求往往藏在客户反复修改的地方\n\n在[工业品牌内容教学案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-d)中，一篇文章混用了型号性能，客户不能发布；另一篇虽然准确，却没有回应采购者关于替代旧型号、适用条件和交期的疑问，销售仍要重新解释。\n\n如果只统计稿件通过率，团队容易把这些都归为写作问题。把产品资料、客户修改、销售常见问题和未成交理由放在一起，AI则可以帮助提出另一种解释：部分采购者需要的，是判断产品能否进入自己的工作，而不只是阅读一篇流畅介绍。\n\n这个解释要继续与真实材料核对，区分稳定需要与某次偶然反馈。若反复成立，企业就获得了新的客户认识：哪些问题值得优先回答，什么证据能够帮助客户判断，哪些内容需要与销售动作连接。\n\n## 把新认识做成小而完整的交付\n\n服务可以先选一个客户、一类产品和一个明确采购问题。团队整理相关询价，形成有依据的问题清单；AI协助构思回应，专业人员核验事实；再把可用材料交给内容和销售岗位使用。\n\n随后追踪：哪些材料被采用，产生的询问是否相关，销售是否继续跟进，卡在哪一步。得到这些反馈，才能调整问题和材料。若只多发文章，没有后续记录，就无法判断它是否改善了获客过程。\n\nFDE在这里要实现的，不只是写作按钮，而是使产品资料、内容、询价与跟进能够对应。专业人员负责准确性，客户销售负责真实行动，双方还需要约定哪些反馈可以持续提供。\n\n这种服务仍不应一开始就承诺全面代管获客。先对一个可观察问题承担清楚范围，才能知道新增责任需要多少人员与工具，客户是否认可。\n\n## 新收费方式必须对应新的责任\n\n按篇收费容易理解：交付一篇合格材料，收取相应费用。持续服务则包含资料更新、问题研究、专业支持和结果解释。按月收费可以支持这些工作，但也可能使服务商承担超过能力的责任。\n\n如果客户只需要准确材料，一次性交付或固定内容服务可能已经足够；如果希望持续改善询价质量，却不愿提供后续记录，服务商就难以承担完整判断。合同名称变成订阅，并不会自动使交付形成持续价值。\n\n案例中的月度账已经显示，核验能力提高到每天6篇，也需要真实付费需求。若客户仍只买80篇，新增共建费用可能降低贡献。新服务同样要回答：谁愿意为什么付费，收入是否足以支持持续人工、工具与配合。\n\nTeece的商业模式研究将客户价值、交付方式和价值获取联系起来。[原始研究](https://www.sciencedirect.com/science/article/pii/S002463010900051X) 宝洁研究提供AI参与跨专业构思的参照，但并未替任何具体新产品证明市场收入。[创新研究](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n## 哪些结果意味着应当改变产品方向\n\n若技术内容准确性改善，客户已经得到主要价值，可以先把这项服务做稳。若询价质量提高，却没有销售接续，应讨论双方协作和服务边界。若客户愿意提供反馈并持续采用，才有理由扩大问题范围和支持周期。\n\n烘焙企业发展预订、设备企业发展持续服务、经销商发展适配支持，也可以沿相似过程探索。它们都从原业务积累出发，却需要重新认识新客户处境、交付条件和收费逻辑。\n\nAI帮助企业创造新生意的途径，既包括提出更多想法，也包括让过去分散的线索被一起理解。持续生产提供材料，专业与经营判断检验解释，FDE将可行认识做进服务。新的know-how和新的产品，才可能在这个过程中一起形成。\n","text":"# 第38章｜企业自己的AI，怎样帮助创造原来没有的生意\n\n工业品牌客户原来按篇购买产品文章，后来可以自己用AI起草。服务商的旧收费理由受到压力，但客户仍有一组问题没有解决：材料是否准确，是否回应采购者关心的工况，带来的询价是否合适，销售跟进以后为什么没有成交？\n\n这些问题可能打开新的服务空间，也可能只是原有交付需要补足的部分。企业需要从持续工作中发现具体需要，再验证自己是否能够提供、客户是否愿意付费。\n\n## 新需求往往藏在客户反复修改的地方\n\n在工业品牌内容教学案例中，一篇文章混用了型号性能，客户不能发布；另一篇虽然准确，却没有回应采购者关于替代旧型号、适用条件和交期的疑问，销售仍要重新解释。\n\n如果只统计稿件通过率，团队容易把这些都归为写作问题。把产品资料、客户修改、销售常见问题和未成交理由放在一起，AI则可以帮助提出另一种解释：部分采购者需要的，是判断产品能否进入自己的工作，而不只是阅读一篇流畅介绍。\n\n这个解释要继续与真实材料核对，区分稳定需要与某次偶然反馈。若反复成立，企业就获得了新的客户认识：哪些问题值得优先回答，什么证据能够帮助客户判断，哪些内容需要与销售动作连接。\n\n## 把新认识做成小而完整的交付\n\n服务可以先选一个客户、一类产品和一个明确采购问题。团队整理相关询价，形成有依据的问题清单；AI协助构思回应，专业人员核验事实；再把可用材料交给内容和销售岗位使用。\n\n随后追踪：哪些材料被采用，产生的询问是否相关，销售是否继续跟进，卡在哪一步。得到这些反馈，才能调整问题和材料。若只多发文章，没有后续记录，就无法判断它是否改善了获客过程。\n\nFDE在这里要实现的，不只是写作按钮，而是使产品资料、内容、询价与跟进能够对应。专业人员负责准确性，客户销售负责真实行动，双方还需要约定哪些反馈可以持续提供。\n\n这种服务仍不应一开始就承诺全面代管获客。先对一个可观察问题承担清楚范围，才能知道新增责任需要多少人员与工具，客户是否认可。\n\n## 新收费方式必须对应新的责任\n\n按篇收费容易理解：交付一篇合格材料，收取相应费用。持续服务则包含资料更新、问题研究、专业支持和结果解释。按月收费可以支持这些工作，但也可能使服务商承担超过能力的责任。\n\n如果客户只需要准确材料，一次性交付或固定内容服务可能已经足够；如果希望持续改善询价质量，却不愿提供后续记录，服务商就难以承担完整判断。合同名称变成订阅，并不会自动使交付形成持续价值。\n\n案例中的月度账已经显示，核验能力提高到每天6篇，也需要真实付费需求。若客户仍只买80篇，新增共建费用可能降低贡献。新服务同样要回答：谁愿意为什么付费，收入是否足以支持持续人工、工具与配合。\n\nTeece的商业模式研究将客户价值、交付方式和价值获取联系起来。原始研究 宝洁研究提供AI参与跨专业构思的参照，但并未替任何具体新产品证明市场收入。创新研究\n\n## 哪些结果意味着应当改变产品方向\n\n若技术内容准确性改善，客户已经得到主要价值，可以先把这项服务做稳。若询价质量提高，却没有销售接续，应讨论双方协作和服务边界。若客户愿意提供反馈并持续采用，才有理由扩大问题范围和支持周期。\n\n烘焙企业发展预订、设备企业发展持续服务、经销商发展适配支持，也可以沿相似过程探索。它们都从原业务积累出发，却需要重新认识新客户处境、交付条件和收费逻辑。\n\nAI帮助企业创造新生意的途径，既包括提出更多想法，也包括让过去分散的线索被一起理解。持续生产提供材料，专业与经营判断检验解释，FDE将可行认识做进服务。新的know-how和新的产品，才可能在这个过程中一起形成。\n"},{"file":"39-行业与竞争节奏.md","id":"lesson-39","number":39,"role":"核心课","part":7,"title":"第39章｜同一种AI，为什么会以不同速度改变企业","md":"# 第39章｜同一种AI，为什么会以不同速度改变企业\n\n内容团队几分钟就能生成一篇文章，设备企业却不可能几分钟完成所有上门维修。看上去前者受到AI影响更快，后者似乎可以等待。但若另一家服务商已经利用AI改善准备、少跑一次现场、让客户更早恢复生产，竞争也可能已经开始变化。\n\n判断紧迫性，要看智能能力沿着哪条路径影响客户选择，以及本企业形成相应能力需要多久。行业名称和数字化程度只能提供部分线索。\n\n## 不同业务，技术先改变的环节不同\n\n内容服务中，起草成本可能较快下降，客户可以自行完成一部分工作，也可能重新议价。工业品业务中，材料理解和候选比较变快，但供货、价格与工程确认仍需兑现。连锁企业需要把需求判断接到生产、配送和门店；设备服务则需要把经验调用接到专业支持和现场动作。\n\n| 业务 | 智能可能先改变的工作 | 客户价值还需经过 |\n|---|---|---|\n| 内容服务 | 构思、资料整理、核验辅助 | 采用、发布、询价与跟进 |\n| 工业品 | 理解要求、比较适配、组织方案 | 供货、价格确认和交付 |\n| 连锁经营 | 连接需求线索、比较排产 | 品质、生产、配送和门店销售 |\n| 设备服务 | 调用经验、准备材料、持续跟进 | 专业判断、备件和现场恢复 |\n\n表中的后半段不会因为模型进步自动消失，却可能因智能介入而重新组织。实物环节多，只是改变作用方式，不意味着竞争者无法取得优势。\n\n## 客户怎样改变购买，比工具热度更值得追踪\n\n当一般起草更容易取得，客户可能自己做初稿，只付费购买专业核验；当报价更快成为普遍能力，客户可能转而看谁能可靠履约；当设备服务能提供更连续的支持，客户也可能重新评价一次维修的价格和长期合同。\n\n企业需要观察真实询价、未成交理由、采购范围和价格变化。某项技术很热门，并不证明本企业客户马上改变；客户已经开始拆分采购，也不能因行业整体尚慢就继续沿用原有收费逻辑。\n\n通用能力普及后，一部分改善还可能通过降价让给客户，或流向掌握入口的平台。课程报价算例中，订单从200增加到250，单均贡献却从500降到400，新增费用前的总贡献仍为100000元。规模扩大并不会自动保护利润。\n\n## 形成能力的速度，也决定什么时候开始\n\n外部产品以后可以买到，但企业自己的客户理解、资料关联、工作方法和协作习惯，需要在任务中形成。反馈越慢、业务越复杂，可能越需要提前建立学习条件。\n\n例如设备服务要知道一种方法是否减少复发，可能需要跟踪后续；新门店要了解当地客流，也需要经历实际经营。等竞争压力已经很大时再开始，企业不仅要采购工具，还要同时补这些认识。\n\n吸收能力和动态能力研究分别关注相关知识如何帮助应用新知识，以及组织如何在变化中重新组合能力。[吸收能力研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)、[动态能力研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf) 它们支持重视持续学习，而不是仅等待一个最终成熟产品。\n\n## 怎样使用研究，而不把平均效果当预算\n\n客服、创新、办公和开发研究涉及不同任务、人员、工具和时期。它们提供的是在特定条件下发生了什么，以及哪些机制值得研究，不能平均成一个通用的效率提升比例。[研究与延伸阅读](延伸阅读.md)\n\n阅读时应先看原任务是什么、与什么比较、人员承担哪些补救、结果量的是时间还是质量，再判断与本企业有哪些相似条件。反向结果也不意味着技术永远无效，而是帮助发现在哪些安排下额外工作抵消了收益。\n\n由此形成的紧迫感可以很具体：客户的购买方式正在改变，企业哪种能力还没形成，哪段工程和学习能够缩短差距。主动转型不必依靠一个确定的行业终局，而可以从这些已经能够观察和改变的关系开始。\n","html":"\u003ch1>第39章｜同一种AI，为什么会以不同速度改变企业\u003c/h1>\n\u003cp>内容团队几分钟就能生成一篇文章，
