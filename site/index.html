n\n一次有效修订应明确：原始事实保留，哪条解释或方法变化，当前采用入口显示什么，谁负责后续观察。必要时把反例加入代表任务，检查下一次模型或规则变更是否重新带回旧错误。\n\n“遗忘”在经营上可以表现为停止主动采用，不必删除原始证据。保留历史有助于理解为什么改变，而当前工作应能辨认最新状态。\n\n## 让更新成为正常生产\n\n可以定期回看未采用、失败、重复处理与条件变化，不只统计成功调用。修订需要有负责者与资源，否则团队会把它不断推迟。\n\n工具和工作方式变化也要求更新证据。METR后续方法讨论显示，新的使用条件需要新的观察设计，旧结论不应永久冻结。[方法更新](https://metr.org/blog/2026-02-24-uplift-update/)\n\n持续积累要有两种能力：让有效经验进入更多任务，也让新事实有机会改变旧经验。后者需要岗位愿意提供真实反馈，并有力量把发现改进系统。组织与长期共建由此成为转型的一部分。\n","text":"# 第32章｜企业怎样避免越积累越相信旧错误\n\n设想某店长期配货偏少，常在高峰前卖完。系统记录销量不高，于是下一轮继续少配。低供给制造低销量，低销量又被用来支持低供给。\n\n没有任何一条销售记录造假，企业却可能在不断积累支持错误判断的材料。\n\n**经验更新不仅是增加内容，还包括改变适用范围、修订方法和停止采用。** 反馈质量决定企业是在学习，还是在强化旧偏差。\n\n## 行动会改变未来看见的数据\n\n如果某类客户没有被服务，就很难观察其后续需求；如果工单提前关闭，复发可能变成另一张新单；如果只保存已采用建议，未被采用的理由就消失。\n\nAI进入生产后，这些关系不会自动消除。系统可能以更快速度重复同一种选择，使后续材料更像原判断正确。\n\n机器学习系统研究把模型行动影响未来数据的反馈视为重要维护问题。企业需要检查哪些结果可见，哪些因当前安排而被遮蔽。原始研究\n\n \n\n## 一个成功方法，也可能因环境变化失效\n\n另设独立教学条件：总产量仍为160，X附近交通入口关闭，需求变为X50、Y90。价格12元、生产变动成本4元，未售无残值，其余条件与算例一致。\n\n| 分配 | 售出 | 剩余 | 收入 | 列示贡献 |\n|---|---:|---:|---:|---:|\n| 80/80 | 130 | 30 | 1560元 | 920元 |\n| 100/60 | 110 | 50 | 1320元 | 680元 |\n\n照搬原100/60，比等量分配少240元列示贡献。应保留的经验因此不是某个固定数量，而是如何使用事件、需求线索与约束形成判断。\n\n如果交通信息决策前已知却没用，是调用或工作设计缺口；如果事后才出现，则需要调整而非事后苛责。区分这两种情况，也影响人员是否愿意报告真实例外。\n\n## 反例不一定推翻全部方法\n\n一次失败可能来自执行偏离、资料缺失、方法错误或环境变化。若不分原因，团队可能在过度保守与频繁推倒之间摇摆。\n\n需要回到当时事实与实际动作，明确改哪一部分。可能只缩小某版本适用范围，也可能增加一个关键观察；有时则应停止整项方法。\n\n探索与利用研究提醒我们，既有成功会吸引资源和注意力。保留挑战旧认识的入口，有助于避免所有新情况都被解释成执行不够好。原始研究\n\n## 修改文档，还不等于完成纠错\n\n教学工单把“更换部件”纠正为“未换件”，最终记录如果改了，旧总结却仍被检索成确定方法，后续行为不会改变。\n\n一次有效修订应明确：原始事实保留，哪条解释或方法变化，当前采用入口显示什么，谁负责后续观察。必要时把反例加入代表任务，检查下一次模型或规则变更是否重新带回旧错误。\n\n“遗忘”在经营上可以表现为停止主动采用，不必删除原始证据。保留历史有助于理解为什么改变，而当前工作应能辨认最新状态。\n\n## 让更新成为正常生产\n\n可以定期回看未采用、失败、重复处理与条件变化，不只统计成功调用。修订需要有负责者与资源，否则团队会把它不断推迟。\n\n工具和工作方式变化也要求更新证据。METR后续方法讨论显示，新的使用条件需要新的观察设计，旧结论不应永久冻结。方法更新\n\n持续积累要有两种能力：让有效经验进入更多任务，也让新事实有机会改变旧经验。后者需要岗位愿意提供真实反馈，并有力量把发现改进系统。组织与长期共建由此成为转型的一部分。\n"},{"file":"33-岗位权责与激励.md","id":"lesson-33","number":33,"role":"核心课","part":6,"title":"第33章｜员工为什么未必愿意留下最有价值的经验","md":"# 第33章｜员工为什么未必愿意留下最有价值的经验\n\n如果企业让技术员认真记录异常，又按当天关闭工单数量评价，两项要求就可能相互牵制。技术员花时间解释一个复杂问题，数字可能不如快速关单好看。新增AI可以更快写总结，也可能更快制造看起来完整的记录。\n\n如果当期任务与经验贡献没有共同支持，积累很容易停留在口号。\n\n**知识贡献、AI采用与真实反馈，需要在岗位目标、负担、决定权和收益之间形成一致安排。** 只靠员工学习热情，难以持续承担组织转型。\n\n## 一个指标怎样改变注意力\n\n只考核关闭速度，人员会优先关注结束状态；只考核剩余量，店长可能倾向少配；只考核记录数量，团队可能生成更多低价值文字。\n\n这些行为未必来自主观不认真。一个岗位有多种工作，而评价只看容易计量的一部分，注意力就会被重新分配。Holmström与Milgrom的多任务激励研究解释了这种机制，不提供通用薪酬公式。[原始研究](https://web.stanford.edu/~milgrom/publishedarticles/Multitask%20Principal%20Agent.pdf)\n\n因此，增加AI后不能只问人员是否使用，还要看原评价是否引导他们使用正确方式。\n\n## 用结果差别检查指标\n\n教学设备案例中，两张工单都当日关闭，一张客户恢复并有后续观察，另一张次日重新报修。若第二张也被视为好绩效，团队就可能把快速记录替代真实解决。\n\n教学连锁中，少配可以降低剩余，却损失晚间可得性。需要同时理解商品可得性、未满足请求、剩余与实际贡献，不能让任何一个数字独自代表经营目标。\n\n这不要求把所有指标都堆给员工。指标越多，也可能增加填报和相互矛盾。关键是保留会改变判断的结果，以及必要的解释空间。\n\n## 贡献经验本身，也要有生产条件\n\n如果每次都要求专家事后写长文，贡献会与交付争时间。可以让AI从自然材料起草，专家纠正关键差别；把重要纠正接回方法和评价，减少反复解释。\n\n还要让员工看见贡献怎样被使用。若记录只进入一个无人阅读的空间，或主要成为追责材料，人员可能减少真实异常反馈。经验贡献应帮助当前与后续工作，而非只增加可见劳动。\n\n不同经验人员也需要不同安排。客服与创新研究提示，AI作用存在人员和阶段差异。统一使用率不等于统一有效性。[客服研究](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)、[创新研究](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n## 谁有权改变，谁就要进入工作\n\nFDE可以发现问题、实现工具、组织证据，却不能独自调动所有岗位和资源。业务负责人需要决定价值取舍，专业人员判断方法，调度或运营人员安排实际执行。\n\n若系统给出建议，却没有人有权采用，工作就停在中间；若执行人员承担结果，却无法影响资料和规则，错误又会持续。\n\n可以围绕一笔业务说明：谁提供事实，谁决定什么，谁实施，谁确认结果，谁修订方法。这里的职责应对应真实工作，不是把每个按钮再加一层审批。\n\n## 让纠正成为能力贡献\n\nAI误写“换件”，技术员指出实际没有换件。这次纠正不仅修复当前工单，也暴露了未来可能反复发生的错误。若它进入系统改进和代表任务，贡献就超出当次记录。\n\n企业可以把这种发现、修订与接任支持纳入正常工作安排，给予必要时间与认可。具体激励需结合岗位与业务，不宜把“每条经验奖励多少”作为统一答案。\n\n组织变化因此与技术建设同步发生。长期FDE合作若要有效，也需要明确企业侧谁持续承担价值判断和采用，而非把一切交给外部工程团队。\n","html":"\u003ch1>第33章｜员工为什么未必愿意留下最有价值的经验\u003c/h1>\n\u003cp>如果企业让技术员认真记录异常，又按当天关闭工单数量评价，两项要求就可能相互牵制。技术员花时间解释一个复杂问题，数字可能不如快速关单好看。新增AI可以更快写总结，也可能更快制造看起来完整的记录。\u003c/p>\n\u003cp>如果当期任务与经验贡献没有共同支持，积累很容易停留在口号。\u003c/p>\n\u003cp>\u003cstrong>知识贡献、AI采用与真实反馈，需要在岗位目标、负担、决定权和收益之间形成一致安排。\u003c/strong> 只靠员工学习热情，难以持续承担组织转型。\u003c/p>\n\u003ch2 id=\"lesson-33-section-1\">一个指标怎样改变注意力\u003c/h2>\n\u003cp>只考核关闭速度，人员会优先关注结束状态；只考核剩余量，店长可能倾向少配；只考核记录数量，团队可 esson-33-section-3","label":"贡献经验本身，也要有生产条件"},{"id":"lesson-33-section-4","label":"谁有权改变，谁就要进入工作"},{"id":"lesson-33-section-5","label":"让纠正成为能力贡献"}],"exportMd":"# 第33章｜员工为什么未必愿意留下最有价值的经验\n\n如果企业让技术员认真记录异常，又按当天关闭工单数量评价，两项要求就可能相互牵制。技术员花时间解释一个复杂问题，数字可能不如快速关单好看。新增AI可以更快写总结，也可能更快制造看起来完整的记录。\n\n如果当期任务与经验贡献没有共同支持，积累很容易停留在口号。\n\n**知识贡献、AI采用与真实反馈，需要在岗位目标、负担、决定权和收益之间形成一致安排。** 只靠员工学习热情，难以持续承担组织转型。\n\n## 一个指标怎样改变注意力\n\n只考核关闭速度，人员会优先关注结束状态；只考核剩余量，店长可能倾向少配；只考核记录数量，团队可能生成更多低价值文字。\n\n这些行为未必来自主观不认真。一个岗位有多种工作，而评价只看容易计量的一部分，注意力就会被重新分配。Holmström与Milgrom的多任务激励研究解释了这种机制，不提供通用薪酬公式。[原始研究](https://web.stanford.edu/~milgrom/publishedarticles/Multitask%20Principal%20Agent.pdf)\n\n因此，增加AI后不能只问人员是否使用，还要看原评价是否引导他们使用正确方式。\n\n## 用结果差别检查指标\n\n教学设备案例中，两张工单都当日关闭，一张客户恢复并有后续观察，另一张次日重新报修。若第二张也被视为好绩效，团队就可能把快速记录替代真实解决。\n\n教学连锁中，少配可以降低剩余，却损失晚间可得性。需要同时理解商品可得性、未满足请求、剩余与实际贡献，不能让任何一个数字独自代表经营目标。\n\n这不要求把所有指标都堆给员工。指标越多，也可能增加填报和相互矛盾。关键是保留会改变判断的结果，以及必要的解释空间。\n\n## 贡献经验本身，也要有生产条件\n\n如果每次都要求专家事后写长文，贡献会与交付争时间。可以让AI从自然材料起草，专家纠正关键差别；把重要纠正接回方法和评价，减少反复解释。\n\n还要让员工看见贡献怎样被使用。若记录只进入一个无人阅读的空间，或主要成为追责材料，人员可能减少真实异常反馈。经验贡献应帮助当前与后续工作，而非只增加可见劳动。\n\n不同经验人员也需要不同安排。客服与创新研究提示，AI作用存在人员和阶段差异。统一使用率不等于统一有效性。[客服研究](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)、[创新研究](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n## 谁有权改变，谁就要进入工作\n\nFDE可以发现问题、实现工具、组织证据，却不能独自调动所有岗位和资源。业务负责人需要决定价值取舍，专业人员判断方法，调度或运营人员安排实际执行。\n\n若系统给出建议，却没有人有权采用，工作就停在中间；若执行人员承担结果，却无法影响资料和规则，错误又会持续。\n\n可以围绕一笔业务说明：谁提供事实，谁决定什么，谁实施，谁确认结果，谁修订方法。这里的职责应对应真实工作，不是把每个按钮再加一层审批。\n\n## 让纠正成为能力贡献\n\nAI误写“换件”，技术员指出实际没有换件。这次纠正不仅修复当前工单，也暴露了未来可能反复发生的错误。若它进入系统改进和代表任务，贡献就超出当次记录。\n\n企业可以把这种发现、修订与接任支持纳入正常工作安排，给予必要时间与认可。具体激励需结合岗位与业务，不宜把“每条经验奖励多少”作为统一答案。\n\n组织变化因此与技术建设同步发生。长期FDE合作若要有效，也需要明确企业侧谁持续承担价值判断和采用，而非把一切交给外部工程团队。\n","exportSingleMd":"# 第33章｜员工为什么未必愿意留下最有价值的经验\n\n如果企业让技术员认真记录异常，又按当天关闭工单数量评价，两项要求就可能相互牵制。技术员花时间解释一个复杂问题，数字可能不如快速关单好看。新增AI可以更快写总结，也可能更快制造看起来完整的记录。\n\n如果当期任务与经验贡献没有共同支持，积累很容易停留在口号。\n\n**知识贡献、AI采用与真实反馈，需要在岗位目标、负担、决定权和收益之间形成一致安排。** 只靠员工学习热情，难以持续承担组织转型。\n\n## 增加填报和相互矛盾。关键是保留会改变判断的结果，以及必要的解释空间。\n\n## 贡献经验本身，也要有生产条件\n\n如果每次都要求专家事后写长文，贡献会与交付争时间。可以让AI从自然材料起草，专家纠正关键差别；把重要纠正接回方法和评价，减少反复解释。\n\n还要让员工看见贡献怎样被使用。若记录只进入一个无人阅读的空间，或主要成为追责材料，人员可能减少真实异常反馈。经验贡献应帮助当前与后续工作，而非只增加可见劳动。\n\n不同经验人员也需要不同安排。客服与创新研究提示，AI作用存在人员和阶段差异。统一使用率不等于统一有效性。客服研究、创新研究\n\n## 谁有权改变，谁就要进入工作\n\nFDE可以发现问题、实现工具、组织证据，却不能独自调动所有岗位和资源。业务负责人需要决定价值取舍，专业人员判断方法，调度或运营人员安排实际执行。\n\n若系统给出建议，却没有人有权采用，工作就停在中间；若执行人员承担结果，却无法影响资料和规则，错误又会持续。\n\n可以围绕一笔业务说明：谁提供事实，谁决定什么，谁实施，谁确认结果，谁修订方法。这里的职责应对应真实工作，不是把每个按钮再加一层审批。\n\n## 让纠正成为能力贡献\n\nAI误写“换件”，技术员指出实际没有换件。这次纠正不仅修复当前工单，也暴露了未来可能反复发生的错误。若它进入系统改进和代表任务，贡献就超出当次记录。\n\n企业可以把这种发现、修订与接任支持纳入正常工作安排，给予必要时间与认可。具体激励需结合岗位与业务，不宜把“每条经验奖励多少”作为统一答案。\n\n组织变化因此与技术建设同步发生。长期FDE合作若要有效，也需要明确企业侧谁持续承担价值判断和采用，而非把一切交给外部工程团队。\n"},{"file":"34-长期FDE共建.md","id":"lesson-34","number":34,"role":"核心课","part":6,"title":"第34章｜长期FDE为什么可能成为转型支柱","md":"# 第34章｜长期FDE为什么可能成为转型支柱\n\n设备服务改造可能这样发展：第一阶段，企业需要让工单记录可信；运行后发现重复报修更重要；继续深入，又发现派工与专业支持决定能否及时恢复。这些工作彼此连接，却很难在最初一次性写成全部需求。\n\n如果每次变化都重新找人、重新解释现场，企业会不断支付认识成本。若长期团队只是维持原功能，又可能形成新的惯性。\n\n**当业务认识与工程持续共同变化时，连续FDE能力可以成为转型支柱。合作的价值应表现为更新速度、采用结果与企业能力。**\n\n## 连续参与为什么有作用\n\n团队持续接触实际工作，会积累业务语言、历史选择、失效方法与系统依赖。新的反馈到来时，不必每次从背景重新理解，可以更快判断改资料、改工具还是改工作安排。\n\n它还提供推进力量。很多跨岗位改造没有自然负责者：业务人员忙于生产，技术人员只接到分散需求。持续现场工程可以把发现组织成可用安排，推动企业更快进入实际使用。\n\n这正是一次培训或单次系统上线难以替代的部分。培训增加理解，上线提供当时能力，后续变化仍需要有人承担工程与学习。\n\n## 长期关系也需要有效安排\n\n有些工作很难在事前描述全部质量与适应要求，双方需要依靠重复合作、共同认识和未来关系支持。Baker等关于关系合作的研究解释了这种可能，也强调激励与组织边界的重要性。[原始研究](https://faculty.washington.edu/mfan/is582/articles/Baker2002.pdf)\n\n它并不证明签得越久越好。长期合作可能降低更换成本，也可能增加锁定；可能保留现场理解，也可能维护过时路线。需要用实际阶段结果判断。\n\n| 连续合作应留下 | 阶段检查可以看什么 |\n|---|---|\n| 对客户价值与业务的理解 | 新发现是否改变问题与实现 |\n| 可用的系统和工具 | 真实任务是否采用，失败能否恢复 |\n| 有条件的经验与评价材料 | 后续任务与新变化能否使用 |\n| 企业内部接续能力 | 关键人员能否判断、维护和协调 |\n\n这些内容比驻场天数更接近长期价值，也能帮助双方决定下一阶段重心。\n\n## 企业与FDE怎样共同承担\n\nFDE负责现场认识进入工程，业务负责人负责价值与资源取舍，专业人员负责方法判断，内部人员逐步承担运行和知识维护。角色可以由不同规模团队组合，不要求每家企业复制同一编制。\n\nPalantir岗位自述确认实际开发、集成与反馈职责；AWS共建表述包含生产部署和客户接续目标。它们为角色提供实际参照，却不是独立的长期效果研究。[Palantir](https://jobs.lever.co/palantir/84131e3f-455e-47fc-9c11-898d95f09048)、[AWS](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)\n\n在教学设备公司里，下一阶段从记录转向复发与派工，并不必然代表前一阶段失败。只要能说明新认识如何由运行产生，如何继续服务客户结果，范围变化就有业务依据。\n\n## 稳定合作与企业自立可以同时推进\n\n外部团队不必为了证明价值而保留全部关键入口。企业也不必为自立而内化所有技术。更合理的是明确哪些判断与能力必须能在企业内部接住，哪些持续使用外部专业力量更经济。\n\n如果原团队不在，企业至少应知道系统服务什么目标、依据从哪里来、结果怎样判断、出现问题找谁，以及下一项改变为什么值得做。技术细节可以有专业依赖，经营判断不应完全消失。\n\n## 何时调整合作强度\n\n业务稳定后，可以减少日常驻场，保留维护与阶段改进；新产品或新场景打开时，又可能需要更强现场投入。若没有真实采用、负责人缺席或长期无认识变化，应重新审查安排。\n\n长期稳定的价值，在于连续建设能力，而不是永久固定服务费或同一套技术。这样的理解，既保留转型所需发展力量，也使企业能够按证据选择合作方式。\n","html":"\u003ch1>第34章｜长期FDE为什么可能成为转型支柱\u003c/h1>\n\u003cp>设备服务改造可能这样发展：第一阶段，企业需要让工单记录可信；运行后发现重复报修更重要；继续深入，又发现派工与专业支持决定能否及时恢复。这些工作彼此连接，却很难在最初一次性写成全部需求。\u003c/p>\n\u003cp>如果每次变化都重新找人、重新解释现场，企业会不断支付认识成本。若长期团队只是维持原功能，又可能形成新的惯性。\u003c/p>\n\u003cp>\u003cstrong>当业务认识与工程持续共同变化时，连续FDE能力可以成为转型支柱。合作的价值应表现为更新速度、采用结果与企业能力。\u003c/strong>\u003c/p>\n\u003ch2 id=\"lesson-34-section-1\">连续参与为什么有作用\u003c/h2>\n\u003cp>团队持续接触实际工作，会积累业务语言、历史选择、失效方法与系统依赖。新的反馈到来时，不必每次从背景重新理解，可以更快判断改资料、改工具还是改工作安排。\u003c/p>\n\u003cp>它还提供推进力量。很多跨岗位改造没有自然负责者：业务人员忙于生产，技术人员只接到分散需求。持续现场工程可以把发现组织成可用安排，推动企业更快进入实际使用。\u003c/p>\n\u003cp>这正是一次培训或单次系统上线难以替代的部分。培训增加理解，上线提供当时能力，后续变化仍需要有人承担工程与学习。\u003c/p>\n\u003ch2 id=\"lesson-34-section-2\">长期关系也需要有效安排\u003c/h2>\n\u003cp>有些工作很难在事前描述全部质量与适应要求，双方需要依靠重复合作、共同认识和未来关系支持。Baker等关于关系合作的研究解释了这种可能，也强调激励与组织边界的重要性。\u003ca href=\"https://faculty.washington.edu/mfan/is582/articles/Baker2002.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003cp>它并不证明签得越久越好。长期合作可能降低更换成本，也可能增加锁定；可能保留现场理解，也可能维护过时路线。需要用实际阶段结果判断。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>连续合作应留下\u003c/th>\n\u003cth>阶段检查可以看什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>对客户价值与业务的理解\u003c/td>\n\u003ctd>新发现是否改变问题与实现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可用的系统和工具\u003c/td>\n\u003ctd>真实任务是否采用，失败能否恢复\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>有条件的经验与评价材料\u003c/td>\n\u003ctd>后续任务与新变化能否使用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>企业内部接续能力\u003c/td>\n\u003ctd>关键人员能否判断、维护和协调\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>这些内容比驻场天数更接近长期价值，也能帮助双方决定下一阶段重心。\u003c/p>\n\u003ch2 id=\"lesson-34-section-3\">企业与FDE怎样共同承担\u003c/h2>\n\u003cp>FDE负责现场认识进入工程，业务负责人负责价值与资源取舍，专业人员负责方法判断，内部人员逐步承担运行和知识维护。角色可以由不同规模团队组合，不要求每家企业复制同一编制。\u003c/p>\n\u003cp>Palantir岗位自述确认实际开发、集成与反馈职责；AWS共建表述包含生产部署和客户接续目标。它们为角色提供实际参照，却不是独立的长期效果研究。\u003ca href=\"https://jobs.lever.co/palantir/84131e3f-455e-47fc-9c11-898d95f09048\" target=\"_blank\" rel=\"noopener noreferrer\">Palantir\u003c/a>、\u003ca href=\"https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers\" target=\"_blank\" rel=\"noopener noreferrer\">AWS\u003c/a>\u003c/p>\n\u003cp>在教学设备公司里，下一阶段从记录转向复发与派工，并不必然代表前一阶段失败。只要能说明新认识如何由运行产生，如何继续服务客户结果，范围变化就有业务依据。\u003c/p>\n\u003ch2 id=\"lesson-34-section-4\">稳定合作与企业自立可以同时推进\u003c/h2>\n\u003cp>外部团队不必为了证明价值而保留全部关键入口。企业也不必为自立而内化所有技术。更合理的是明确哪些判断与能力必须能在企业内部接住，哪些持续使用外部专业力量更经济。\u003c/p>\n\u003cp>如果原团队不在，企业至少应知道系统服务什么目标、依据从哪里来、结果怎样判断、出现问题找谁，以及下一项改变为什么值得做。技术细节可以有专业依赖，经营判断不应完全消失。\u003c/p>\n\u003ch2 id=\"lesson-34-section-5\">何时调整合作强度\u003c/h2>\n\u003cp>业务稳定后，可以减少日常驻场，保留维护与阶段改进；新产品或新场景打开时，又可能需要更强现场投入。若没有真实采用、负责人缺席或长期无认识变化，应重新审查安排。\u003c/p>\n\u003cp>长期稳定的价值，在于连续建设能力，而不是永久固定服务费或同一套技术。这样的理解，既保留转型所需发展力量，也使企业能够按证据选择合作方式。\u003c/p>\n","headings":[{"id":"lesson-34-section-1","label":"连续参与为什么有作用"},{"id":"lesson-34-section-2","label":"长期关系也需要有效安排"},{"id":"lesson-34-section-3","label":"企业与FDE怎样共同承担"},{"id":"lesson-34-section-4","label":"稳定合作与企业自立可以同时推进"},{"id":"lesson-34-section-5","label":"何时调整合作强度"}],"exportMd":"# 第34章｜长期FDE为什么可能成为转型支柱\n\n设备服务改造可能这样发展：第一阶段，企业需要让工单记录可信；运行后发现重复报修更重要；继续深入，又发现派工与专业支持决定能否及时恢复。这些工作彼此连接，却很难在最初一次性写成全部需求。\n\n如果每次变化都重新找人、重新解释现场，企业会不断支付认识成本。若长期团队只是维持原功能，又可能形成新的惯性。\n\n**当业务认识与工程持续共同变化时，连续FDE能力可以成为转型支柱。合作的价值应表现为更新速度、采用结果与企业能力。**\n\n## 连续参与为什么有作用\n\n团队持续接触实际工作，会积累业务语言、历史选择、失效方法与系统依赖。新的反馈到来时，不必每次从背景重新理解，可以更快判断改资料、改工具还是改工作安排。\n\n它还提供推进力量。很多跨岗位改造没有自然负责者：业务人员忙于生产，技术人员只接到分散需求。持续现场工程可以把发现组织成可用安排，推动企业更快进入实际使用。\n\n这正是一次培训或单次系统上线难以替代的部分。培训增加理解，上线提供当时能力，后续变化仍需要有人承担工程与学习。\n\n## 长期关系也需要有效安排\n\n有些工作很难在事前描述全部质量与适应要求，双方需要依靠重复合作、共同认识和未来关系支持。Baker等关于关系合作的研究解释了这种可能，也强调激励与组织边界的重要性。[原始研究](https://faculty.washington.edu/mfan/is582/articles/Baker2002.pdf)\n\n它并不证明签得越久越好。长期合作可能降低更换成本，也可能增加锁定；可能保留现场理解，也可能维护过时路线。需要用实际阶段结果判断。\n\n| 连续合作应留下 | 阶段检查可以看什么 |\n|---|---|\n| 对客户价值与业务的理解 | 新发现是否改变问题与实现 |\n| 可用的系统和工具 | 真实任务是否采用，失败能否恢复 |\n| 有条件的经验与评价材料 | 后续任务与新变化能否使用 |\n| 企业内部接续能力 | 关键人员能否判断、维护和协调 |\n\n这些内容比驻场天数更接近长期价值，也能帮助双方决定下一阶段重心。\n\n## 企业与FDE怎样共同承担\n\nFDE负责现场认识进入工程，业务负责人负责价值与资源取舍，专业人员负责方法判断，内部人员逐步承担运行和知识维护。角色可以由不同规模团队组合，不要求每家企业复制同一编制。\n\nPalantir岗位自述确认实际开发、集成与反馈职责；AWS共建表述包含生产部署和客户接续目标。它们为角色提供实际参照，却不是独立的长期效果研究。[Palantir](https://jobs.lever.co/palantir/84131e3f-455e-47fc-9c11-898d95f09048)、[AWS](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)\n\n在教学设备公司里，下一阶段从记录转向复发与派工，并不必然代表前一阶段失败。只要能说明新认识如何由运行产生，如何继续服务客户结果，范围变化就有业务依据。\n\n## 稳定合作与企业自立可以同时推进\n\n外部团队不必为了证明价值而保留全部关键入口。企业也不必为自立而内化所有技术。更合理的是明确哪些判断与能力必须能在企业内部接住，哪些持续使用外部专业力量更经济。\n\n如果原团队不在，企业至少应知道系统服务什么目标、依据从哪里来、结果怎样判断、出现问题找谁，以及下一项改变为什么值得做。技术细节可以有专业依赖，经营判断不应完全消失。\n\n## 何时调整合作强度\n\n业务稳定后，可以减少日常驻场，保留维护与阶段改进；新产品或新场景打开时，又可能需要更强现场投入。若没有真实采用、负责人缺席或长期无认识变化，应重新审查安排。\n\n长期稳定的价值，在于连续建设能力，而不是永久固定服务费或同一套技术。这样的理解，既保留转型所需发展力量，也使企业能够按证据选择合作方式。\n","exportSingleMd":"# 第34章｜长期FDE为什么可能成为转型支柱\n\n设备服务改造可能这样发展：第一阶段，企业需要让工单记录可信；运行后发现重复报修更重要；继续深入，又发现派工与专业支持决定能否及时恢复。这些工作彼此连接，却很难在最初一次性写成全部需求。\n\n如果每次变化都重新找人、重新解释现场，企业会不断支付认识成本。若长期团队只是维持原功能，又可能形成新的惯性。\n\n**当业务认识与工程持续共同变化时，连续FDE能力可以成为转型支柱。合作的价值应表现为更新速度、采用结果与企业能力。**\n\n## 连续参与为什么有作用\n\n团队持续接触实际工作，会积累业务语言、历史选择、失效方法与系统依赖。新的反馈到来时，不必每次从背景重新理解，可以更快判断改资料、改工具还是改工作安排。\n\n它还提供推进力量。很多跨岗位改造没有自然负责者：业务人员忙于生产，技术人员只接到分散需求。持续现场工程可以把发现组织成可用安排，推动企业更快进入实际使用。\n\n这正是一次培训或单次系统上线难以替代的部分。培训增加理解，上线提供当时能力，后续变化仍需要有人承担工程与学习。\n\n## 长期关系也需要有效安排\n\n有些工作很难在事前描述全部质量与适应要求，双方需要依靠重复合作、共同认识和未来关系支持。Baker等关于关系合作的研究解释了这种可能， 助双方决定下一阶段重心。\n\n## 企业与FDE怎样共同承担\n\nFDE负责现场认识进入工程，业务负责人负责价值与资源取舍，专业人员负责方法判断，内部人员逐步承担运行和知识维护。角色可以由不同规模团队组合，不要求每家企业复制同一编制。\n\nPalantir岗位自述确认实际开发、集成与反馈职责；AWS共建表述包含生产部署和客户接续目标。它们为角色提供实际参照，却不是独立的长期效果研究。Palantir、AWS\n\n在教学设备公司里，下一阶段从记录转向复发与派工，并不必然代表前一阶段失败。只要能说明新认识如何由运行产生，如何继续服务客户结果，范围变化就有业务依据。\n\n## 稳定合作与企业自立可以同时推进\n\n外部团队不必为了证明价值而保留全部关键入口。企业也不必为自立而内化所有技术。更合理的是明确哪些判断与能力必须能在企业内部接住，哪些持续使用外部专业力量更经济。\n\n如果原团队不在，企业至少应知道系统服务什么目标、依据从哪里来、结果怎样判断、出现问题找谁，以及下一项改变为什么值得做。技术细节可以有专业依赖，经营判断不应完全消失。\n\n## 何时调整合作强度\n\n业务稳定后，可以减少日常驻场，保留维护与阶段改进；新产品或新场景打开时，又可能需要更强现场投入。若没有真实采用、负责人缺席或长期无认识变化，应重新审查安排。\n\n长期稳定的价值，在于连续建设能力，而不是永久固定服务费或同一套技术。这样的理解，既保留转型所需发展力量，也使企业能够按证据选择合作方式。\n"},{"file":"35-内部吸收与接续.md","id":"lesson-35","number":35,"role":"核心课","part":6,"title":"第35章｜培训之后，企业自己的能力怎样长出来","md":"# 第35章｜培训之后，企业自己的能力怎样长出来\n\n假设团队完成AI培训，能够解释模型、知识库和Agent，也能演示工具。遇到设备版本变化，仍不知道该改哪份资料；新模型上线，也无法判断是否影响原任务。\n\n知道概念与承担工作之间，还隔着事实判断、工程认识和组织配合。\n\n**企业应在真实改造中逐步接住业务判断、知识维护、系统接续和智能资源经营。** 培训服务于这个过程，实际承担才能证明能力形成。\n\n## 内部需要掌握哪些关键工作\n\n业务侧需要知道什么客户价值值得发展，当前结果与成本怎样解释，哪些证据支持扩大。专业侧需要辨认事实、方法与适用条件。运行侧需要让资料、工具和结果持续对应。\n\n这些能力可以分布在多人之间，不必集中到一个“最懂AI的人”。组织吸收能力不同于个人知识简单相加，内部沟通和共同应用条件同样重要。[吸收能力研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n企业也不必理解所有模型内部原理。需要掌握到足以作出业务选择、识别重要缺口、协调正确专业支持的程度。\n\n## 用真实责任逐步培养\n\n教学设备公司的内部负责人可以先检查AI工单是否忠实反映实际动作，发现“未换件”被误写。随后参与维护有效案例、设备版本与方法状态，知道纠正应进入哪里。\n\n再往后，他可以组织一次模型或规则变更比较：选取代表任务，确认关键差别，与专业人员解释结果，并据此建议采用范围。工程团队仍可负责具体实现。\n\n最后，通过原承担者暂时退出某项工作，观察其他人能否接续。交接不是把文件发出，而是相关工作确实能继续。\n\n| 能力发展 | 更有内容的证据 |\n|---|---|\n| 理解当前任务 | 能说明输出用于谁的什么决定 |\n| 判断资料与经验 | 能发现冲突、缺项与不适用条件 |\n| 参与系统改变 | 能解释改什么、为什么、怎样比较 |\n| 接续运行 | 换人后仍能处理正常情况与必要异常 |\n\n## 共建怎样避免变成旁观\n\n如果外部团队独自处理全部材料、修改和评价，内部人员只在验收时看演示，很难形成相关认识。可以让内部成员参与关键真实任务，而非被动接收最终文档。\n\n参与也应有具体用途。长期旁听所有技术会议，不一定比共同处理一项版本冲突更有学习价值。FDE可以解释取舍，内部人员提供业务判断，双方通过实际结果建立共同语言。\n\nAWS官方共建安排提出客户在部署后取得接续能力，这是有用的目标参照；它仍是机构主张，不能代替某企业自己的学习检验。[官方材料](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)\n\n## 小企业怎样避免过度内建\n\n小企业可能没有足够任务支撑完整技术部门，可以共享外部专业力量。但应明确自己必须保留什么：客户价值判断、关键资料与方法的理解、资源安排，以及对结果的解释。\n\n高度专业的模型与系统维护可以外部承担，企业内部则保有清楚接口与责任。目标是合理的能力组合，不是把所有工作都搬回自己。\n\n## 培训应该怎样改变\n\n基础概念可以集中学习，后续则围绕真实工作：追一张工单的事实与执行，解释一次失败，比较一种智能投入，维护一条经验，再参与一次阶段选择。\n\n评价由“听过多少课、会多少术语”，转向能完成何种判断与接续。只有当这些能力在企业中逐渐分布、可以交接，长期共建才开始形成自己的支撑。\n\n已有能力还可以进入更多业务，但迁移需要分清共同部分与新情境，不能把复制入口当作复制结果。\n","html":"\u003ch1>第35章｜培训之后，企业自己的能力怎样长出来\u003c/h1>\n\u003cp>假设团队完成AI培训，能够解释模型、知识库和Agent，也能演示工具。遇到设备版本变化，仍不知道该改哪份资料；新模型上线，也无法判断是否影响原任务。\u003c/p>\n\u003cp>知道概念与承担工作之间，还隔着事实判断、工程认识和组织配合。\u003c/p>\n\u003cp>\u003cstrong>企业应在真实改造中逐步接住业务判断、知识维护、系统接续和智能资源经营。\u003c/strong> 培训服务于这个过程，实际承担才能证明能力形成。\u003c/p>\n\u003ch2 id=\"lesson-35-section-1\">内部需要掌握哪些关键工作\u003c/h2>\n\u003cp>业务侧需要知道什么客户价值值得发展，当前结果与成本怎样解释，哪些证据支持扩大。专业侧需要辨认事实、方法与适用条件。运行侧需要让资料、工具和结果持续对应。\u003c/p>\n\u003cp>这些能力可以分布在多人之间，不必集中到一个“最懂AI的人”。组织吸收能力不同于个人知识简单相加，内部沟通和共同应用条件同样重要。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">吸收能力研究\u003c/a>\u003c/p>\n\u003cp>企业也不必理解所有模型内部原理。需要掌握到足以作出业务选择、识别重要缺口、协调正确专业支持的程度。\u003c/p>\n\u003ch2 id=\"lesson-35-section-2\">用真实责任逐步培养\u003c/h2>\n\u003cp>教学设备公司的内部负责人可以先检查AI工单是否忠实反映实际动作，发现“未换件”被误写。随后参与维护有效案例、设备版本与方法状态，知道纠正应进入哪里。\u003c/p>\n\u003cp>再往后，他可以组织一次模型或规则变更比较：选取代表任务，确认关键差别，与专业人员解释结果，并据此建议采用范围。工程团队仍可负责具体实现。\u003c/p>\n\u003cp>最后，通过原承担者暂时退出某项工作，观察其他人能否接续。交接不是把文件发出，而是相关工作确实能继续。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>能力发展\u003c/th>\n\u003cth>更有内容的证据\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>理解当前任务\u003c/td>\n\u003ctd>能说明输出用于谁的什么决定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>判断资料与经验\u003c/td>\n\u003ctd>能发现冲突、缺项与不适用条件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>参与系统改变\u003c/td>\n\u003ctd>能解释改什么、为什么、怎样比较\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接续运行\u003c/td>\n\u003ctd>换人后仍能处理正常情况与必要异常\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"lesson-35-section-3\">共建怎样避免变成旁观\u003c/h2>\n\u003cp>如果外部团队独自处理全部材料、修改和评价，内部人员只在验收时看演示，很难形成相关认识。可以让内部成员参与关键真实任务，而非被动接收最终文档。\u003c/p>\n\u003cp>参与也应有具体用途。长期旁听所有技术会议，不一定比共同处理一项版本冲突更有学习价值。FDE可以解释取舍，内部人员提供业务判断，双方通过实际结果建立共同语言。\u003c/p>\n\u003cp>AWS官方共建安排提出客户在部署后取得接续能力，这是有用的目标参照；它仍是机构主张，不能代替某企业自己的学习检验。\u003ca href=\"https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers\" target=\"_blank\" rel=\"noopener noreferrer\">官方材料\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-35-section-4\">小企业怎样避免过度内建\u003c/h2>\n\u003cp>小企业可能没有足够任务支撑完整技术部门，可以共享外部专业力量。但应明确自己必须保留什么：客户价值判断、关键资料与方法的理解、资源安排，以及对结果的解释。\u003c/p>\n\u003cp>高度专业的模型与系统维护可以外部承担，企业内部则保有清楚接口与责任。目标是合理的能力组合，不是把所有工作都搬回自己。\u003c/p>\n\u003ch2 id=\"lesson-35-section-5\">培训应该怎样改变\u003c/h2>\n\u003cp>基础概念可以集中学习，后续则围绕真实工作：追一张工单的事实与执行，解释一次失败，比较一种智能投入，维护一条经验，再参与一次阶段选择。\u003c/p>\n\u003cp>评价由“听过多少课、会多少术语”，转向能完成何种判断与接续。只有当这些能力在企业中逐渐分布、可以交接，长期共建才开始形成自己的支撑。\u003c/p>\n\u003cp>已有能力还可以进入更多业务，但迁移需要分清共同部分与新情境，不能把复制入口当作复制结果。\u003c/p>\n","headings":[{"id":"lesson-35-section-1","label":"内部需要掌握哪些关键工作"},{"id":"lesson-35-section-2","label":"用真实责任逐步培养"},{"id":"lesson-35-section-3","label":"共建怎样避免变成旁观"},{"id":"lesson-35-section-4","label":"小企业怎样避免过度内建"},{"id":"lesson-35-section-5","label":"培训应该怎样改变"}],"exportMd":"# 第35章｜培训之后，企业自己的能力怎样长出来\n\n假设团队完成AI培训，能够解释模型、知识库和Agent，也能演示工具。遇到设备版本变化，仍不知道该改哪份资料；新模型上线，也无法判断是否影响原任务。\n\n知道概念与承担工作之间，还隔着事实判断、工程认识和组织配合。\n\n**企业应在真实改造中逐步接住业务判断、知识维护、系统接续和智能资源经营。** 培训服务于这个过程，实际承担才能证明能力形成。\n\n## 内部需要掌握哪些关键工作\n\n业务侧需要知道什么客户价值值得发展，当前结果与成本怎样解释，哪些证据支持扩大。专业侧需要辨认事实、方法与适用条件。运行侧需要让资料、工具和结果持续对应。\n\n这些能力可以分布在多人之间，不必集中到一个“最懂AI的人”。组织吸收能力不同于个人知识简单相加，内部沟通和共同应用条件同样重要。[吸收能力研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n企业也不必理解所有模型内部原理。需要掌握到足以作出业务选择、识别重要缺口、协调正确专业支持的程度。\n\n## 用真实责任逐步培养\n\n教学设备公司的内部负责人可以先检查AI工单是否忠实反映实际动作，发现“未换件”被误写。随后参与维护有效案例、设备版本与方法状态，知道纠正应进入哪里。\n\n再往后，他可以组织一次模型或规则变更比较：选取代表任务，确认关键差别，与专业人员解释结果，并据此建议采用范围。工程团队仍可负责具体实现。\n\n最后，通过原承担者暂时退出某项工作，观察其他人能否接续。交接不是把文件发出，而是相关工作确实能继续。\n\n| 能力发展 | 更有内容的证据 |\n|---|---|\n| 理解当前任务 | 能说明输出用于谁的什么决定 |\n| 判断资料与经验 | 能发现冲突、缺项与不适用条件 |\n| 参与系统改变 | 能解释改什么、为什么、怎样比较 |\n| 接续运行 | 换人后仍能处理正常情况与必要异常 |\n\n## 共建怎样避免变成旁观\n\n如果外部团队独自处理全部材料、修改和评价，内部人员只在验收时看演示，很难形成相关认识。可以让内部成员参与关键真实任务，而非被动接收最终文档。\n\n参与也应有具体用途。长期旁听所有技术会议，不一定比共同处理一项版本冲突更有学习价值。FDE可以解释取舍，内部人员提供业务判断，双方通过实际结果建立共同语言。\n\nAWS官方共建安排提出客户在部署后取得接续能力，这是有用的目标参照；它仍是机构主张，不能代替某企业自己的学习检验。[官方材料](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)\n\n## 小企业怎样避免过度内建\n\n小企业可能没有足够任务支撑完整技术部门，可以共享外部专业力量。但应明确自己必须保留什么：客户价值判断、关键资料与方法的理解、资源安排，以及对结果的解释。\n\n高度专业的模型与系统维护可以外部承担，企业内部则保有清楚接口与责任。目标是合理的能力组合，不是把所有工作都搬回自己。\n\n## 培训应该怎样改变\n\n基础概念可以集中学习，后续则围绕真实工作：追一张工单的事实与执行，解释一次失败，比较一种智能投入，维护一条经验，再参与一次阶段选择。\n\n评价由“听过多少课、会多少术语”，转向能完成何种判断与接续。只有当这些能力在企业中逐渐分布、可以交接，长期共建才开始形成自己的支撑。\n\n已有能力还可以进入更多业务，但迁移需要分清共同部分与新情境，不能把复制入口当作复制结果。\n","exportSingleMd":"# 第35章｜培训之后，企业自己的能力怎样长出来\n\n假设团队完成AI培训，能够解释模型、知识库和Agent，也能演示工具。遇到设备版本变化，仍不知道该改哪份资料；新模型上线，也无法判断是否影响原任务。\n\n知道概念与承担工作之间，还隔着事实判断、工程认识和组织配合。\n\n**企业应在真实改造中逐步接住业务判断、知识维护、系统接续和智能资源经营。** 培训服务于这个过程，实际承担才能证明能力形成。\n\n## 内部需要掌握哪些关键工作\n\n业务侧需要知道什么客户价值值得发展，当前结果与成本怎样解释，哪些证据支持扩大。专业侧需要辨认事实、方法与适用条件。运行侧需要让资料、工具和结果持续对应。\n\n这些能力可以分布在多人之间，不必集中到一个“最懂AI的人”。组织吸收能力不同于个人知识简单相加，内部沟通和共同应用条件同样重要。[吸收能力研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n企业也不必理解所有模型内部原理。需要掌握到足以作出业务选择、识别重要缺口、协调正确专业支持的程度。\n\n## 用真实责任逐步培养\n\n教学设备公司的内部负责人可以先检查AI工单是否忠实反映实际动作，发现“未换件”被误写。随后参与维护有效案例、设备版本与方法状态，知道纠正应进入哪里。\n\n再往后，他可以组织一次模型或规则变更比较：选取代表任务，确认关键差别，与专业人员解释结果，并据此建议采用范围。工程团队仍可负责具体实现。\n\n最后，通过原承担者暂时退出某项工作，观察其他人能否接续。交接不是把文件发出，而是相关工作确实能继续。\n\n| 能力发展 | 更有内容的证据 |\n|---|---|\n| 理解当前任务 | 能说明输出用于谁的什么决定 |\n| 判断资料与经验 | 能发现冲突、缺项与不适用条件 |\n| 参与系统改变 | 能解释改什么、为什么、怎样比较 |\n| 接续运行 | 换人后仍能处理正常情况与必要异常 |\n\n## 共建怎样避免变成旁观\n\n如果外部团队独自处理全部材料、修改和评价，内部人员只在验收时看演示，很难形成相关认识。可以让内部成员参与关键真实任务，而非被动接收最终文档。\n\n参与也应有具体用途。长期旁听所有技术会议，不一定比共同处理一项版本冲突更有学习价值。FDE可以解释取舍，内部人员提供业务判断，双方通过实际结果建立共同语言。\n\nAWS官方共建安排提出客户在部署后取得接续能力，这是有用的目标参照；它仍是机构主张，不能代替某企业自己的学习检验。[官方材料](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)\n\n## 小企业怎样避免过度内建\n\n小企业可能没有足够任务支撑完整技术部门，可以共享外部专业力量。但应明确自己必须保留什么：客户价值判断、关键资料与方法的理解、资源安排，以及对结果的解释。\n\n高度专业的模型与系统维护可以外部承担，企业内部则保有清楚接口与责任。目标是合理的能力组合，不是把所有工作都搬回自己。\n\n## 培训应该怎样改变\n\n基础概念可以集中学习，后续则围绕真实工作：追一张工单的事实与执行，解释一次失败，比较一种智能投入，维护一条经验，再参与一次阶段选择。\n\n评价由“听过多少课、会多少术语”，转向能完成何种判断与接续。只有当这些能力在企业中逐渐分布、可以交接，长期共建才开始形成自己的支撑。\n\n已有能力还可以进入更多业务，但迁移需要分清共同部分与新情境，不能把复制入口当作复制结果。\n","text":"# 第35章｜培训之后，企业自己的能力怎样长出来\n\n假设团队完成AI培训，能够解释模型、知识库和Agent，也能演示工具。遇到设备版本变化，仍不知道该改哪份资料；新模型上线，也无法判断是否影响原任务。\n\n知道概念与承担工作之间，还隔着事实判断、工程认识和组织配合。\n\n**企业应在真实改造中逐步接住业务判断、知识维护、系统接续和智能资源经营。** 培训服务于这个过程，实际承担才能证明能力形成。\n\n## 内部需要掌握哪些关键工作\n\n业务侧需要知道什么客户价值值得发展，当前结果与成本怎样解释，哪些证据支持扩大。专业侧需要辨认事实、方法与适用条件。运行侧需要让资料、工具和结果持续对应。\n\n这些能力可以分布在多人之间，不必集中到一个“最懂AI的人”。组织吸收能力不同于个人知识简单相加，内部沟通和共同应用条件同样重要。吸收能力研究\n\n企业也不必理解所有模型内部原理。需要掌握到足以作出业务选择、识别重要缺口、协调正确专业支持的程度。\n\n## 用真实责任逐步培养\n\n教学设备公司的内部负责人可以先检查AI工单是否忠实反映实际动作，发现“未换件”被误写。随后参与维护有效案例、设备版本与方法状态，知道纠正应进入哪里。\n\n再往后，他可以组织一次模型或规则变更比较：选取代表任务，确认关键差别，与专业人员解释结果，并据此建议采用范围。工程团队仍可负责具体实现。\n\n最后，通过原承担者暂时退出某项工作，观察其他人能否接续。交接不是把文件发出，而是相关工作确实能继续。\n\n| 能力发展 | 更有内容的证据 |\n|---|---|\n| 理解当前任务 | 能说明输出用于谁的什么决定 |\n| 判断资料与经验 | 能发现冲突、缺项与不适用条件 |\n| 参与系统改变 | 能解释改什么、为什么、怎样比较 |\n| 接续运行 | 换人后仍能处理正常情况与必要异常 |\n\n## 共建怎样避免变成旁观\n\n如果外部团队独自处理全部材料、修改和评价，内部人员只在验收时看演示，很难形成相关认识。可以让内部成员参与关键真实任务，而非被动接收最终文档。\n\n参与也应有具体用途。长期旁听所有技术会议，不一定比共同处理一项版本冲突更有学习价值。FDE可以解释取舍，内部人员提供业务判断，双方通过实际结果建立共同语言。\n\nAWS官方共建安排提出客户在部署后取得接续能力，这是有用的目标参照；它仍是机构主张，不能代替某企业自己的学习检验。官方材料\n\n## 小企业怎样避免过度内建\n\n小企业可能没有足够任务支撑完整技术部门，可以共享外部专业力量。但应明确自己必须保留什么：客户价值判断、关键资料与方法的理解、资源安排，以及对结果的解释。\n\n高度专业的模型与系统维护可以外部承担，企业内部则保有清楚接口与责任。目标是合理的能力组合，不是把所有工作都搬回自己。\n\n## 培训应该怎样改变\n\n基础概念可以集中学习，后续则围绕真实工作：追一张工单的事实与执行，解释一次失败，比较一种智能投入，维护一条经验，再参与一次阶段选择。\n\n评价由“听过多少课、会多少术语”，转向能完成何种判断与接续。只有当这些能力在企业中逐渐分布、可以交接，长期共建才开始形成自己的支撑。\n\n已有能力还可以进入更多业务，但迁移需要分清共同部分与新情境，不能把复制入口当作复制结果。\n"},{"file":"36-复用与迁移.md","id":"lesson-36","number":36,"role":"核心课","part":6,"title":"第36章｜扩到第九家店，为什么不能直接复制答案","md":"# 第36章｜扩到第九家店，为什么不能直接复制答案\n\n教学连锁已在部分门店形成售罄记录、事件说明、候选分配与结果反馈。进入第九家店时，团队很容易说：“把原系统复制一份就行。”\n\n系统入口可以复制，客群、配送周期与营业时段却未必相同。原经验既能减少准备，也可能诱导照搬。\n\n**复用应减少重复建设，迁移仍需重新认识变化的条件。** 企业自有特色可以体现在学习与交付机制，不必表现为所有组件都独有。\n\n## 哪些东西可以共同使用\n\n门店、商品和营业日的身份，事件与售罄含义，建议与正式执行的区分，反馈方式和评价材料，都可能共享。它们让新店更快进入可比较工作。\n\n工具连接、数据关联和培训方式，也可能减少重复投入。共同部分越清楚，新的现场认识越不必从空白开始。\n\n但配货数量、客流判断与当地事件不能直接沿用。即使同一方法适合，新店也可能需要一段观察才能确定参数和适用范围。\n\n![共同结构和工具支持多个门店；每个门店仍保留自己的客群、时段与配送条件，局部结果再帮助修订共同方法。](assets/36-共性与迁移.svg)\n\n## 迁移的工作，不只是技术适配\n\n首先要辨认业务是否仍在解决相同问题。新店可能以预订为主，原店以即买为主，未满足需求的观察方式就不同。\n\n其次检查关键事实是否可取得，工作岗位能否采用，实物资源是否支持。技术接口相同，也可能因人员安排不同而无法运行。\n\n最后重新观察方法作用。新场景的好结果不能全部归于旧资产，也不能因为需要适配，就认为原积累毫无价值。\n\n吸收能力研究解释相关经验如何帮助取得新知识，动态能力研究解释资源如何被重组；两者共同支持有条件迁移，而非机械复制。[吸收能力](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)、[动态能力](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)\n\n## 用下一次建设负担看复用\n\n可以记录新场景少了哪些准备，又新增哪些理解、集成、带教和维护。若共同结构帮助更快形成可靠记录，评价材料帮助更快识别缺口，就有具体作用。\n\n如果为了沿用旧系统不断增加例外，维护成本上升，也应允许改写或替换。系统技术债研究提醒我们，复用组件会带来依赖，不是复制一次后永久免费。[原始研究](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n| 可以沿用 | 需要适配 | 需要重新认识 |\n|---|---|---|\n| 共同事实与状态结构 | 当地资料与工具入口 | 客群与需求 |\n| 代表任务的设计方式 | 岗位、培训与工作节奏 | 新约束与例外 |\n| 经验证的通用组件 | 方法适用条件 | 新客户价值假设 |\n\n这是一份迁移判断，不是要求所有场景都完整分成三栏。\n\n## 什么时候才值得平台化\n\n多个场景反复出现真实共性，且共享能降低总负担时，统一平台可能有意义。若只有一个场景尚未理解清楚，就先为所有未来场景搭平台，容易把猜测固定成结构。\n\n相反，各场景完全独立也会重复建设。可以先保留清楚的共同部分，随着实际迁移增加再抽象，使结构来自业务证据。\n\n设备服务进入另一系列也可采用相同判断：共享工单链和评价方法，技术经验重新检查版本与条件。专业服务跨行业，则需重新认识客户问题，不能只替换报告中的行业名称。\n\n## 真正可扩展的，是带着基础继续学习\n\n一项好的积累，不只给新场景一个答案，还帮助它更快找事实、辨差异、形成方法并验证结果。企业因此获得的是下一次改变的能力。\n\n这把课程从某个系统的推广，带向持续发展路线。下一步需要根据阶段证据选择扩大哪里、投入什么，以及何时探索新的产品和服务。\n","html":"\u003ch1>第36章｜扩到第九家店，为什么不能直接复制答案\u003c/h1>\n\u003cp>教学连锁已在部分门店形成售罄记录、事件说明、候选分配与结果反馈。进入第九家店时，团队很容易说：“把原系统复制一份就行。”\u003c/p>\n\u003cp>系统入口可以复制，客群、配送周期与营业时段却未必相同。原经验既能减少准备，也可能诱导照搬。\u003c/p>\n\u003cp>\u003cstrong>复用应减少重复建设，迁移仍需重新认识变化的条件。\u003c/strong> 企业自有特色可以体现在学习与交付机制，不必表现为所有组件都独有。\u003c/p>\n\u003ch2 id=\"lesson-36-section-1\">哪些东西可以共同使用\u003c/h2>\n\u003cp>门店、商品和营业日的身份，事件与售罄含义，建议与正式执行的区分，反馈方式和评价材料，都可能共享。它们让新店更快进入可比较工作。\u003c/p>\n\u003cp>工具连接、数据关联和培训方式，也可能减少重复投入。共同部分越清楚，新的现场认识越不必从空白开始。\u003c/p>\n\u003cp>但配货数量、客流判断与当地事件不能直接沿用。即使同一方法适合，新店也可能需要一段观察才能确定参数和适用范围。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNDgwIiB2aWV3Qm94PSIwIDAgMzYwIDQ4MCIgcm9sZT0iaW1nIj48dGl0bGU+5aSN5Yi257uT5p6E77yM6YeN5a2m5p2h5Lu2PC90aXRsZT48ZGVzYz7lhbHlkIzouqvku73jgIHkuovku7bjgIHmiafooYznu5PmnoTkuI7lt6XlhbfmlK/mjIHlpJrlupfvvJvlkITlupflrqLnvqTml7bmrrXphY3pgIHku43pnIDlsYDpg6jorqTor4bjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjQ4MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7lpI3liLbnu5PmnoTvvIzph43lrabmnaHku7Y8L3RleHQ+PHJlY3QgeD0iNjIiIHk9IjgyIiB3aWR0aD0iMjM2IiBoZWlnaHQ9IjExOSIgcng9IjYiIGZpbGw9IndoaXRlIiBzdHJva2U9IiMxNjVkNTIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PHRleHQgeD0iMTgwIiB5PSIxMTMiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyMSIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC13ZWlnaHQ9IjYwMCI+5YWx5ZCM57uT5p6E5LiO5bel5YW3PC90ZXh0Pjx0ZXh0IHg9IjE4MCIgeT0iMTQzIiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyMTM0M 题。新店可能以预订为主，原店以即买为主，未满足需求的观察方式就不同。\u003c/p>\n\u003cp>其次检查关键事实是否可取得，工作岗位能否采用，实物资源是否支持。技术接口相同，也可能因人员安排不同而无法运行。\u003c/p>\n\u003cp>最后重新观察方法作用。新场景的好结果不能全部归于旧资产，也不能因为需要适配，就认为原积累毫无价值。\u003c/p>\n\u003cp>吸收能力研究解释相关经验如何帮助取得新知识，动态能力研究解释资源如何被重组；两者共同支持有条件迁移，而非机械复制。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">吸收能力\u003c/a>、\u003ca href=\"https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">动态能力\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-36-section-3\">用下一次建设负担看复用\u003c/h2>\n\u003cp>可以记录新场景少了哪些准备，又新增哪些理解、集成、带教和维护。若共同结构帮助更快形成可靠记录，评价材料帮助更快识别缺口，就有具体作用。\u003c/p>\n\u003cp>如果为了沿用旧系统不断增加例外，维护成本上升，也应允许改写或替换。系统技术债研究提醒我们，复用组件会带来依赖，不是复制一次后永久免费。\u003ca href=\"https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可以沿用\u003c/th>\n\u003cth>需要适配\u003c/th>\n\u003cth>需要重新认识\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>共同事实与状态结构\u003c/td>\n\u003ctd>当地资料与工具入口\u003c/td>\n\u003ctd>客群与需求\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>代表任务的设计方式\u003c/td>\n\u003ctd>岗位、培训与工作节奏\u003c/td>\n\u003ctd>新约束与例外\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>经验证的通用组件\u003c/td>\n\u003ctd>方法适用条件\u003c/td>\n\u003ctd>新客户价值假设\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>这是一份迁移判断，不是要求所有场景都完整分成三栏。\u003c/p>\n\u003ch2 id=\"lesson-36-section-4\">什么时候才值得平台化\u003c/h2>\n\u003cp>多个场景反复出现真实共性，且共享能降低总负担时，统一平台可能有意义。若只有一个场景尚未理解清楚，就先为所有未来场景搭平台，容易把猜测固定成结构。\u003c/p>\n\u003cp>相反，各场景完全独立也会重复建设。可以先保留清楚的共同部分，随着实际迁移增加再抽象，使结构来自业务证据。\u003c/p>\n\u003cp>设备服务进入另一系列也可采用相同判断：共享工单链和评价方法，技术经验重新检查版本与条件。专业服务跨行业，则需重新认识客户问题，不能只替换报告中的行业名称。\u003c/p>\n\u003ch2 id=\"lesson-36-section-5\">真正可扩展的，是带着基础继续学习\u003c/h2>\n\u003cp>一项好的积累，不只给新场景一个答案，还帮助它更快找事实、辨差异、形成方法并验证结果。企业因此获得的是下一次改变的能力。\u003c/p>\n\u003cp>这把课程从某个系统的推广，带向持续发展路线。下一步需要根据阶段证据选择扩大哪里、投入什么，以及何时探索新的产品和服务。\u003c/p>\n","headings":[{"id":"lesson-36-section-1","label":"哪些东西可以共同使用"},{"id":"lesson-36-section-2","label":"迁移的工作，不只是技术适配"},{"id":"lesson-36-section-3","label":"用下一次建设负担看复用"},{"id":"lesson-36-section-4","label":"什么时候才值得平台化"},{"id":"lesson-36-section-5","label":"真正可扩展的，是带着基础继续学习"}],"exportMd":"# 第36章｜扩到第九家店，为什么不能直接复制答案\n\n教学连锁已在部分门店形成售罄记录、事件说明、候选分配与结果反馈。进入第九家店时，团队很容易说：“把原系统复制一份就行。”\n\n系统入口可以复制，客群、配送周期与营业时段却未必相同。原经验既能减少准备，也可能诱导照搬。\n\n**复用应减少重复建设，迁移仍需重新认识变化的条件。** 企业自有特色可以体现在学习与交付机制，不必表现为所有组件都独有。\n\n## 哪些东西可以共同使用\n\n门店、商品和营业日的身份，事件与售罄含义，建议与正式执行的区分，反馈方式和评价材料，都可能共享。它们让新店更快进入可比较工作。\n\n工具连接、数据关联和培训方式，也可能减少重复投入。共同部分越清楚，新的现场认识越不必从空白开始。\n\n但配货数量、客流判断与当地事件不能直接沿用。即使同一方法适合，新店也可能需要一段观察才能确定参数和适用范围。\n\n![共同结构和工具支持多个门店；每个门店仍保留自己的客群、时段与配送条件，局部结果再帮助修订共同方法。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNDgwIiB2aWV3Qm94PSIwIDAgMzYwIDQ4MCIgcm9sZT0iaW1nIj48dGl0bGU+5aSN5Yi257uT5p6E77yM6YeN5a2m5p2h5Lu2PC90aXRsZT48ZGVzYz7lhbHlkIzouqvku73jgIHkuovku7bjgIHmiafooYznu5PmnoTkuI7lt6XlhbfmlK/mjIHlpJrlupfvvJvlkITlupflrqLnvqTml7bmrrXphY3pgIHku43pnIDlsYDpg6jorqTor4bjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjQ4MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7lpI3liLbnu5Pmn SIxOCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC13ZWlnaHQ9IjQwMCI+5YWx5ZCM5Z+656GA5YeP5bCR6YeN5aSN5YeG5aSHPC90ZXh0Pjx0ZXh0IHg9IjE4MCIgeT0iNDcyIiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyMTM0MmYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSI0MDAiPuacrOWcsOe7k+aenOmqjOivgemAgueUqOaApzwvdGV4dD48L3N2Zz4=)\n\n## 迁移的工作，不只是技术适配\n\n首先要辨认业务是否仍在解决相同问题。新店可能以预订为主，原店以即买为主，未满足需求的观察方式就不同。\n\n其次检查关键事实是否可取得，工作岗位能否采用，实物资源是否支持。技术接口相同，也可能因人员安排不同而无法运行。\n\n最后重新观察方法作用。新场景的好结果不能全部归于旧资产，也不能因为需要适配，就认为原积累毫无价值。\n\n吸收能力研究解释相关经验如何帮助取得新知识，动态能力研究解释资源如何被重组；两者共同支持有条件迁移，而非机械复制。[吸收能力](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)、[动态能力](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)\n\n## 用下一次建设负担看复用\n\n可以记录新场景少了哪些准备，又新增哪些理解、集成、带教和维护。若共同结构帮助更快形成可靠记录，评价材料帮助更快识别缺口，就有具体作用。\n\n如果为了沿用旧系统不断增加例外，维护成本上升，也应允许改写或替换。系统技术债研究提醒我们，复用组件会带来依赖，不是复制一次后永久免费。[原始研究](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n| 可以沿用 | 需要适配 | 需要重新认识 |\n|---|---|---|\n| 共同事实与状态结构 | 当地资料与工具入口 | 客群与需求 |\n| 代表任务的设计方式 | 岗位、培训与工作节奏 | 新约束与例外 |\n| 经验证的通用组件 | 方法适用条件 | 新客户价值假设 |\n\n这是一份迁移判断，不是要求所有场景都完整分成三栏。\n\n## 什么时候才值得平台化\n\n多个场景反复出现真实共性，且共享能降低总负担时，统一平台可能有意义。若只有一个场景尚未理解清楚，就先为所有未来场景搭平台，容易把猜测固定成结构。\n\n相反，各场景完全独立也会重复建设。可以先保留清楚的共同部分，随着实际迁移增加再抽象，使结构来自业务证据。\n\n设备服务进入另一系列也可采用相同判断：共享工单链和评价方法，技术经验重新检查版本与条件。专业服务跨行业，则需重新认识客户问题，不能只替换报告中的行业名称。\n\n## 真正可扩展的，是带着基础继续学习\n\n一项好的积累，不只给新场景一个答案，还帮助它更快找事实、辨差异、形成方法并验证结果。企业因此获得的是下一次改变的能力。\n\n这把课程从某个系统的推广，带向持续发展路线。下一步需要根据阶段证据选择扩大哪里、投入什么，以及何时探索新的产品和服务。\n","exportSingleMd":"# 第36章｜扩到第九家店，为什么不能直接复制答案\n\n教学连锁已在部分门店形成售罄记录、事件说明、候选分配与结果反馈。进入第九家店时，团队很容易说：“把原系统复制一份就行。”\n\n系统入口可以复制，客群、配送周期与营业时段却未必相同。原经验既能减少准备，也可能诱导照搬。\n\n**复用应减少重复建设，迁移仍需重新认识变化的条件。** 企业自有特色可以体现在学习与交付机制，不必表现为所有组件都独有。\n\n## 哪些东西可以共同使用\n\n门店、商品和营业日的身份，事件与售罄含义，建议与正式执行的区分，反馈方式和评价材料，都可能共享。它们让新店更快进入可比较工作。\n\n工具连接、数据关联和培训方式，也可能减少重复投入。共同部分越清楚，新的现场认识越不必从空白开始。\n\n但配货数量、客流判断与当地事件不能直接沿用。即使同一方法适合，新店也可能需要一段观察才能确定参数和适用范围。\n\n![共同结构和工具支持多个门店；每个门店仍保留自己的客群、时段与配送条件，局部结果再帮助修订共同方法。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNDgwIiB2aWV3Qm94PSIwIDAgMzYwIDQ4MCIgcm9sZT0iaW1nIj48dGl0bGU+5aSN5Yi257uT5p6E77yM6YeN5a2m5p2h5Lu2PC90aXRsZT48ZGVzYz7lhbHlkIzouqvku73jgIHkuovku7bjgIHmiafooYznu5PmnoTkuI7lt6XlhbfmlK/mjIHlpJrlupfvvJvlkITlupflrqLnvqTml7bmrrXphY3pgIHku43pnIDlsYDpg6jorqTor4bjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjQ4MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7lpI3liLbnu5PmnoTvvIzph43lrabmnaHku7Y8L3RleHQ+PHJlY3QgeD0iNjIiIHk9IjgyIiB3aWR0aD0iMjM2IiBoZWlnaHQ9IjExOSIgcng9IjYiIGZpbGw9IndoaXRlIiBzdHJva2U9IiMxNjVkNTIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PHRleHQgeD0iMTgwIiB5PSIxMTMiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyMSIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC13ZWlnaHQ9IjYwMCI+5YWx5ZCM57uT5p6E5LiO5bel5YW3PC90ZXh0Pjx0ZXh0IHg9IjE4MCIgeT0iMTQzIiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyMTM0MmYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSI0MDAiPui6q+S7vSDCtyDkuovku7Y8L3RleHQ+PHRleHQgeD0iMTgwIiB5PSIxNzciIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxOCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC13ZWlnaHQ9Ij 次建设负担看复用\n\n可以记录新场景少了哪些准备，又新增哪些理解、集成、带教和维护。若共同结构帮助更快形成可靠记录，评价材料帮助更快识别缺口，就有具体作用。\n\n如果为了沿用旧系统不断增加例外，维护成本上升，也应允许改写或替换。系统技术债研究提醒我们，复用组件会带来依赖，不是复制一次后永久免费。[原始研究](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n| 可以沿用 | 需要适配 | 需要重新认识 |\n|---|---|---|\n| 共同事实与状态结构 | 当地资料与工具入口 | 客群与需求 |\n| 代表任务的设计方式 | 岗位、培训与工作节奏 | 新约束与例外 |\n| 经验证的通用组件 | 方法适用条件 | 新客户价值假设 |\n\n这是一份迁移判断，不是要求所有场景都完整分成三栏。\n\n## 什么时候才值得平台化\n\n多个场景反复出现真实共性，且共享能降低总负担时，统一平台可能有意义。若只有一个场景尚未理解清楚，就先为所有未来场景搭平台，容易把猜测固定成结构。\n\n相反，各场景完全独立也会重复建设。可以先保留清楚的共同部分，随着实际迁移增加再抽象，使结构来自业务证据。\n\n设备服务进入另一系列也可采用相同判断：共享工单链和评价方法，技术经验重新检查版本与条件。专业服务跨行业，则需重新认识客户问题，不能只替换报告中的行业名称。\n\n## 真正可扩展的，是带着基础继续学习\n\n一项好的积累，不只给新场景一个答案，还帮助它更快找事实、辨差异、形成方法并验证结果。企业因此获得的是下一次改变的能力。\n\n这把课程从某个系统的推广，带向持续发展路线。下一步需要根据阶段证据选择扩大哪里、投入什么，以及何时探索新的产品和服务。\n","text":"# 第36章｜扩到第九家店，为什么不能直接复制答案\n\n教学连锁已在部分门店形成售罄记录、事件说明、候选分配与结果反馈。进入第九家店时，团队很容易说：“把原系统复制一份就行。”\n\n系统入口可以复制，客群、配送周期与营业时段却未必相同。原经验既能减少准备，也可能诱导照搬。\n\n**复用应减少重复建设，迁移仍需重新认识变化的条件。** 企业自有特色可以体现在学习与交付机制，不必表现为所有组件都独有。\n\n## 哪些东西可以共同使用\n\n门店、商品和营业日的身份，事件与售罄含义，建议与正式执行的区分，反馈方式和评价材料，都可能共享。它们让新店更快进入可比较工作。\n\n工具连接、数据关联和培训方式，也可能减少重复投入。共同部分越清楚，新的现场认识越不必从空白开始。\n\n但配货数量、客流判断与当地事件不能直接沿用。即使同一方法适合，新店也可能需要一段观察才能确定参数和适用范围。\n\n \n\n## 迁移的工作，不只是技术适配\n\n首先要辨认业务是否仍在解决相同问题。新店可能以预订为主，原店以即买为主，未满足需求的观察方式就不同。\n\n其次检查关键事实是否可取得，工作岗位能否采用，实物资源是否支持。技术接口相同，也可能因人员安排不同而无法运行。\n\n最后重新观察方法作用。新场景的好结果不能全部归于旧资产，也不能因为需要适配，就认为原积累毫无价值。\n\n吸收能力研究解释相关经验如何帮助取得新知识，动态能力研究解释资源如何被重组；两者共同支持有条件迁移，而非机械复制。吸收能力、动态能力\n\n## 用下一次建设负担看复用\n\n可以记录新场景少了哪些准备，又新增哪些理解、集成、带教和维护。若共同结构帮助更快形成可靠记录，评价材料帮助更快识别缺口，就有具体作用。\n\n如果为了沿用旧系统不断增加例外，维护成本上升，也应允许改写或替换。系统技术债研究提醒我们，复用组件会带来依赖，不是复制一次后永久免费。原始研究\n\n| 可以沿用 | 需要适配 | 需要重新认识 |\n|---|---|---|\n| 共同事实与状态结构 | 当地资料与工具入口 | 客群与需求 |\n| 代表任务的设计方式 | 岗位、培训与工作节奏 | 新约束与例外 |\n| 经验证的通用组件 | 方法适用条件 | 新客户价值假设 |\n\n这是一份迁移判断，不是要求所有场景都完整分成三栏。\n\n## 什么时候才值得平台化\n\n多个场景反复出现真实共性，且共享能降低总负担时，统一平台可能有意义。若只有一个场景尚未理解清楚，就先为所有未来场景搭平台，容易把猜测固定成结构。\n\n相反，各场景完全独立也会重复建设。可以先保留清楚的共同部分，随着实际迁移增加再抽象，使结构来自业务证据。\n\n设备服务进入另一系列也可采用相同判断：共享工单链和评价方法，技术经验重新检查版本与条件。专业服务跨行业，则需重新认识客户问题，不能只替换报告中的行业名称。\n\n## 真正可扩展的，是带着基础继续学习\n\n一项好的积累，不只给新场景一个答案，还帮助它更快找事实、辨差异、形成方法并验证结果。企业因此获得的是下一次改变的能力。\n\n这把课程从某个系统的推广，带向持续发展路线。下一步需要根据阶段证据选择扩大哪里、投入什么，以及何时探索新的产品和服务。\n"},{"file":"37-阶段发展路线.md","id":"lesson-37","number":37,"role":"核心课","part":7,"title":"第37章｜路线怎样既有方向，又能被证据改变","md":"# 第37章｜路线怎样既有方向，又能被证据改变\n\n设想一份转型计划列出三个阶段：建知识库、上Agent、实现自动化。每一步都有日期，却没有说明为什么要按这个顺序，也没有写结果不理想时该怎样改变。\n\n日期能帮助执行，功能清单能说明制作内容，但发展路线还需要解释：下一项投入为什么由当前认识支持。\n\n**AI转型路线应由客户价值、现有能力和阶段证据共同推动。** 方向可以稳定，具体方法与投入顺序需要更新。\n\n## 先确定要发展的能力\n\n教学连锁的方向可以是：在控制剩余的同时，让顾客更可靠地买到新鲜商品，并把有效判断留在组织。这比“建设智能备货系统”更能解释为什么改变。\n\n由此可以识别当前缺口：售罄条件未进入分配，建议与实际执行难对应，方法依赖原店长。每项缺口对应不同建设，不必先假定全部由AI解决。\n\n动态能力研究强调企业使资源持续相关、适应与重组。路线因而不仅是取得能力，还包括发现哪些旧做法需要改变。[原始研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)\n\n## 让阶段结束产生选择\n\n第一阶段可以先使必要事实与结果对应，判断资料链是否可用。若采集负担太高，就改采集方式；若真实结果无法取得，就先修反馈。\n\n第二阶段比较合理替代，观察新信息是否改变决定、能否执行、结果是否有增量。若改善主要来自普通SOP，应选择合适方案，而非为了AI继续复杂化。\n\n第三阶段检验接任与新情境。若方法仅原店长会用，就补解释和带教；若第九店条件不同，就重新学习局部需求。扩张不是预定奖励，而是一项有条件选择。\n\n| 当前阶段的证据 | 下一步可能方向 |\n|---|---|\n| 记录可用，但价值假设未获支持 | 回看客户问题，调整或停止 |\n| 判断改善，配送阻碍执行 | 改资源与协作，暂不只升级模型 |\n| 当期有效，接任困难 | 建内部理解与可接续方法 |\n| 共性可复用，局部条件明确 | 有依据地扩任务或场景 |\n| 新需求出现，旧产品不足 | 小范围探索新服务 |\n\n## 保留未来选择，也要有当前交付\n\n早期不必承诺最终系统形态。可以先做一个有完整反馈的小范围，使下一项决定更有依据。已经形成的案例、工具与评价材料，会帮助识别新技术的用途。\n\n吸收能力研究解释相关积累对后续采用的作用；探索与利用研究则解释当前改善与新可能之间的资源竞争。[吸收能力](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)、[探索与利用](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)\n\n但“保留选择”不能成为无限拖延。每阶段仍应有可用产物、责任、资源与复查时点。学习成果也要说明它改变了哪项选择，不能只写取得更多认识。\n\n## 技术变化怎样进入路线\n\n新模型可能让原先不可做的工作变得可行，也可能使原组件不再值得维护。企业需要比较新供给在自己任务上的作用，而不是追逐所有发布。\n\n如果客户需求与生产约束没有改变，新技术可以只替换一部分；如果新能力打开新的服务组合，就需要重新研究客户与交付，而非只作技术升级。\n\n连续FDE与内部负责人共同维护这条判断链：现场变化如何进入工程，工程变化如何接受真实采用，结果如何改变下一项投入。\n\n## 路线的连续性在哪里\n\n连续性在于始终围绕客户价值、能力积累和可持续交付，而不在于每一阶段都增加自主程度或组件数量。停止无效方向，也可以是路线正确更新的一部分。\n\n企业由此能够主动融入AI，同时避免把当前工具当最终答案。已有能力进一步支持新产品与服务探索，这是下一项更高层的经营选择。\n","html":"\u003ch1>第37章｜路线怎样既有方向，又能被证据改变\u003c/h1>\n\u003cp>设想一份转型计划列出三个阶段：建知识库、上Agent、实现自动化。每一步都有日期，却没有说明为什么要按这个顺序，也没有写结果不理想时该怎样改变。\u003c/p>\n\u003cp>日期能帮助执行，功能清单能说明制作内容，但发展路线还需要解释：下一项投入为什么由当前认识支持。\u003c/p>\n\u003cp>\u003cstrong>AI转型路线应由客户价值、现有能力和阶段证据共同推动。\u003c/strong> 方向可以稳定，具体方法与投入顺序需要更新。\u003c/p>\n\u003ch2 id=\"lesson-37-section-1\">先确定要发展的能力\u003c/h2>\n\u003cp>教学连锁的方向可以是：在控制剩余的同时，让顾客更可靠地买到新鲜商品，并把有效判断留在组织。这比“建设智能备货系统”更能解释为什么改变。\u003c/p>\n\u003cp>由此可以识别当前缺口：售罄条件未进入分配，建议与实际执行难对应，方法依赖原店长。每项缺口对应不同建设，不必先假定全部由AI解决。\u003c/p>\n\u003cp>动态能力研究强调企业使资源持续相关、适应与重组。路线因而不仅是取得能力，还包括发现哪些旧做法需要改变。\u003ca href=\"https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-37-section-2\">让阶段结束产生选择\u003c/h2>\n\u003cp>第一阶段可以先使必要事实与结果对应，判断资料链是否可用。若采集负担太高，就改采集方式；若真实结果无法取得，就先修反馈。\u003c/p>\n\u003cp>第二阶段比较合理替代，观察新信息是否改变决定、能否执行、结果是否有增量。若改善主要来自普通SOP，应选择合适方案，而非为了AI继续复杂化。\u003c/p>\n\u003cp>第三阶段检验接任与新情境。若方法仅原店长会用，就补解释和带教；若第九店条件不同，就重新学习局部需求。扩张不是预定奖励，而是一项有条件选择。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>当前阶段的证据\u003c/th>\n\u003cth>下一步可能方向\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>记录可用，但价值假设未获支持\u003c/td>\n\u003ctd>回看客户问题，调整或停止\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>判断改善，配送阻碍执行\u003c/td>\n\u003ctd>改资源与协作，暂不只升级模型\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>当期有效，接任困难\u003c/td>\n\u003ctd>建内部理解与可接续方法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>共性可复用，局部条件明确\u003c/td>\n\u003ctd>有依据地扩任务或场景\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新需求出现，旧产品不足\u003c/td>\n\u003ctd>小范围探索新服务\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"lesson-37-section-3\">保留未来选择，也要有当前交付\u003c/h2>\n\u003cp>早期不必承诺最终系统形态。可以先做一个有完整反馈的小范围，使下一项决定更有依据。已经形成的案例、工具与评价材料，会帮助识别新技术的用途。\u003c/p>\n\u003cp>吸收能力研究解释相关积累对后续采用的作用；探索与利用研究则解释当前改善与新可能之间的资源竞争。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">吸收能力\u003c/a>、\u003ca href=\"https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">探索与利用\u003c/a>\u003c/p>\n\u003cp>但“保留选择”不能成为无限拖延。每阶段仍应有可用产物、责任、资源与复查时点。学习成果也要说明它改变了哪项选择，不能只写取得更多认识。\u003c/p>\n\u003ch2 id=\"lesson-37-section-4\">技术变化怎样进入路线\u003c/h2>\n\u003cp>新模型可能让原先不可做的工作变得可行，也可能使原组件不再值得维护。企业需要比较新供给在自己任务上的作用，而不是追逐所有发布。\u003c/p>\n\u003cp>如果客户需求与生产约束没有改变，新技术可以只替换一部分；如果新能力打开新的服务组合，就需要重新研究客户与交付，而非只作技术升级。\u003c/p>\n\u003cp>连续FDE与内部负责人共同维护这条判断链：现场变化如何进入工程，工程变化如何接受真实采用，结果如何改变下一项投入。\u003c/p>\n\u003ch2 id=\"lesson-37-section-5\">路线的连续性在哪里\u003c/h2>\n\u003cp>连续性在于始终围绕客户价值、能力积累和可持续交付，而不在于每一阶段都增加自主程度或组件数量。停止无效方向，也可以是路线正确更新的一部分。\u003c/p>\n\u003cp>企业由此能够主动融入AI，同时避免把当前工具当最终答案。已有能力进一步支持新产品与服务探索，这是下一项更高层的经营选择。\u003c/p>\n","headings":[{"id":"lesson-37-section-1","label":"先确定要发展的能力"},{"id":"lesson-37-section-2","label":"让阶段结束产生选择"},{"id":"lesson-37-section-3","label":"保留未来选择，也要有当前交付"},{"id":"lesson-37-section-4","label":"技术变化怎样进入路线"},{"id":"lesson-37-section-5","label":"路线的连续性在哪里"}],"exportMd":"# 第37章｜路线怎样既有方向，又能被证据改变\n\n设想一份转型计划列出三个阶段：建知识库、上Agent、实现自动化。每一步都有日期，却没有说明为什么要按这个顺序，也没有写结果不理想时该怎样改变。\n\n日期能帮助执行，功能清单能说明制作内容，但发展路线还需要解释：下一项投入为什么由当前认识支持。\n\n**AI转型路线应由客户价值、现有能力和阶段证据共同推动。** 方向可以稳定，具体方法与投入顺序需要更新。\n\n## 先确定要发展的能力\n\n教学连锁的方向可以是：在控制剩余的同时，让顾客更可靠地买到新鲜商品，并把有效判断留在组织。这比“建设智能备货系统”更能解释为什么改变。\n\n由此可以识别当前缺口：售罄条件未进入分配，建议与实际执行难对应，方法依赖原店长。每项缺口对应不同建设，不必先假定全部由AI解决。\n\n动态能力研究强调企业使资源持续相关、适应与重组。路线因而不仅是取得能力，还包括发现哪些旧做法需要改变。[原始研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)\n\n## 让阶段结束产生选择\n\n第一阶段可以先使必要事实与结果对应，判断资料链是否可用。若采集负担太高，就改采集方式；若真实结果无法取得，就先修反馈。\n\n第二阶段比较合理替代，观察新信息是否改变决定、能否执行、结果是否有增量。若改善主要来自普通SOP，应选择合适方案，而非为了AI继续复杂化。\n\n第三阶段检验接任与新情境。若方法仅原店长会用，就补解释和带教；若第九店条件不同，就重新学习局部需求。扩张不是预定奖励，而是一项有条件选择。\n\n| 当前阶段的证据 | 下一步可能方向 |\n|---|---|\n| 记录可用，但价值假设未获支持 | 回看客户问题，调整或停止 |\n| 判断改善，配送阻碍执行 | 改资源与协作，暂不只升级模型 |\n| 当期有效，接任困难 | 建内部理解与可接续方法 |\n| 共性可复用，局部条件明确 | 有依据地扩任务或场景 |\n| 新需求出现，旧产品不足 | 小范围探索新服务 |\n\n## 保留未来选择，也要有当前交付\n\n早期不必承诺最终系统形态。可以先做一个有完整反馈的小范围，使下一项决定更有依据。已经形成的案例、工具与评价材料，会帮助识别新技术的用途。\n\n吸收能力研究解释相关积累对后续采用的作用；探索与利用研究则解释当前改善与新可能之间的资源竞争。[吸收能力](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)、[探索与利用](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)\n\n但“保留选择”不能成为无限拖延。每阶段仍应有可用产物、责任、资源与复查时点。学习成果也要说明它改变了哪项选择，不能只写取得更多认识。\n\n## 技术变化怎样进入路线\n\n新模型可能让原先不可做的工作变得可行，也可能使原组件不再值得维护。企业需要比较新供给在自己任务上的作用，而不是追逐所有发布。\n\n如果客户需求与生产约束没有改变，新技术可以只替换一部分；如果新能力打开新的服务组合，就需要重新研究客户与交付，而非只作技术升级。\n\n连续FDE与内部负责人共同维护这条判断链：现场变化如何进入工程，工程变化如何接受真实采用，结果如何改变下一项投入。\n\n## 路线的连续性在哪里\n\n连续性在于始终围绕客户价值、能力积累和可持续交付，而不在于每一阶段都增加自主程度或组件数量。停止无效方向，也可以是路线正确更新的一部分。\n\n企业由此能够主动融入AI，同时避免把当前工具当最终答案。已有能力进一步支持新产品与服务探索，这是下一项更高层的经营选择。\n","exportSingleMd":"# 第37章｜路线怎样既有方向，又能被证据改变\n\n设想一份转型计划列出三个阶段：建知识库、上Agent、实现自动化。每一步都有日期，却没有说明为什么要按这个顺序，也没有写结果不理想时该怎样改变。\n\n日期能帮助执行，功能清单能说明制作内容，但发展路线还需要解释：下一项投入为什么由当前认识支持。\n\n**AI转型路线应由客户价值、现有能力和阶段证据共同推动。** 方向可以稳定，具体方法与投入顺序需要更新。\n\n## 先确定要发展的能力\n\n教学连锁的方向可以是：在控制剩余的同时，让顾客更可靠地买到新鲜商品，并把有效判断留在组织。这比“建设智能备货系统”更能解释为什么改变。\n\n由此可以识别当前缺口：售罄条件未进入分配，建议与实际执行难对应，方法依赖原店长。每项缺口对应不同建设，不必先假定全部由AI解决。\n\n动态能力研究强调企业使资源持续相关、适应与重组。路线因而不仅是取得能力，还包括发现哪些旧做法需要改变。[原始研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)\n\n## 让阶段结束产生选择\n\n第一阶段可以先使必要事实与结果对应，判断资料链是否可用。若采集负担太高，就改采集方式；若真实结果无法取得，就先修反馈。\n\n第二阶段比较合理替代，观察新信息是否改变决定、能否执行、结果是否有增量。若改善主要来自普通SOP，应选择合适方案，而非为了AI继续复杂化。\n\n第三阶段检验接任与新情境。若方法仅原店长会用，就补解释和带教；若第九店条件不同，就重新学习局部需求。扩张不是预定奖励，而是一项有条件选择。\n\n| 当前阶段的证据 | 下一步可能方向 |\n|---|---|\n| 记录可用，但价值假设未获支持 | 回看客户问题，调整或停止 |\n| 判断改善，配送阻碍执行 | 改资源与协作，暂不只升级模型 |\n| 当期有效，接任困难 | 建内部理解与可接续方法 |\n| 共性可复用，局部条件明确 | 有依据地扩任务或场景 |\n| 新需求出现，旧产品不足 | 小范围探索新服务 |\n\n## 保留未来选择，也要有当前交付\n\n早期不必承诺最终系统形态。可以先做一个有完整反馈的小范围，使下一项决定更有依据。已经形成的案例、工具与评价材料，会帮助识别新技术的用途。\n\n吸收能力研究解释相关积累对后续采用的作用；探索与利用研究则解释当前改善与新可能之间的资源竞争。[吸收能力](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)、[探索与利用](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)\n\n但“保留选择”不能成为无限拖延。每阶段仍应有可用产物、责任、资源与复查时点。学习成果也要说明它改变了哪项选择，不能只写取得更多认识。\n\n## 技术变化怎样进入路线\n\n新模型可能让原先不可做的工作变得可行，也可能使原组件不再值得维护。企业需要比较新供给在自己任务上的作用，而不是追逐所有发布。\n\n如果客户需求与生产约束没有改变，新技术可以只替换一部分；如果新能力打开新的服务组合，就需要重新研究客户与交付，而非只作技术升级。\n\n连续FDE与内部负责人共同维护这条判断链：现场变化如何进入工程，工程变化如何接受真实采用，结果如何改变下一项投入。\n\n## 路线的连续性在哪里\n\n连续性在于始终围绕客户价值、能力积累和可持续交付，而不在于每一阶段都增加自主程度或组件数量。停止无效方向，也可以是路线正确更新的一部分。\n\n企业由此能够主动融入AI，同时避免把当前工具当最终答案。已有能力进一步支持新产品与服务探索，这是下一项更高层的经营选择。\n","text":"# 第37章｜路线怎样既有方向，又能被证据改变\n\n设想一份转型计划列出三个阶段：建知识库、上Agent、实现自动化。每一步都有日期，却没有说明为什么要按这个顺序，也没有写结果不理想时该怎样改变。\n\n日期能帮助执行，功能清单能说明制作内容，但发展路线还需要解释：下一项投入为什么由当前认识支持。\n\n**AI转型路线应由客户价值、现有能力和阶段证据共同推动。** 方向可以稳定，具体方法与投入顺序需要更新。\n\n## 先确定要发展的能力\n\n教学连锁的方向可以是：在控制剩余的同时，让顾客更可靠地买到新鲜商品，并把有效判断留在组织。这比“建设智能备货系统”更能解释为什么改变。\n\n由此可以识别当前缺口：售罄条件未进入分配，建议与实际执行难对应，方法依赖原店长。每项缺口对应不同建设，不必先假定全部由AI解决。\n\n动态能力研究强调企业使资源持续相关、适应与重组。路线因而不仅是取得能力，还包括发现哪些旧做法需要改变。原始研究\n\n## 让阶段结束产生选择\n\n第一阶段可以先使必要事实与结果对应，判断资料链是否可用。若采集负担太高，就改采集方式；若真实结果无法取得，就先修反馈。\n\n第二阶段比较合理替代，观察新信息是否改变决定、能否执行、结果是否有增量。若改善主要来自普通SOP，应选择合适方案，而非为了AI继续复杂化。\n\n第三阶段检验接任与新情境。若方法仅原店长会用，就补解释和带教；若第九店条件不同，就重新学习局部需求。扩张不是预定奖励，而是一项有条件选择。\n\n| 当前阶段的证据 | 下一步可能方向 |\n|---|---|\n| 记录可用，但价值假设未获支持 | 回看客户问题，调整或停止 |\n| 判断改善，配送阻碍执行 | 改资源与协作，暂不只升级模型 |\n| 当期有效，接任困难 | 建内部理解与可接续方法 |\n| 共性可复用，局部条件明确 | 有依据地扩任务或场景 |\n| 新需求出现，旧产品不足 | 小范围探索新服务 |\n\n## 保留未来选择，也要有当前交付\n\n早期不必承诺最终系统形态。可以先做一个有完整反馈的小范围，使下一项决定更有依据。已经形成的案例、工具与评价材料，会帮助识别新技术的用途。\n\n吸收能力研究解释相关积累对后续采用的作用；探索与利用研究则解释当前改善与新可能之间的资源竞争。吸收能力、探索与利用\n\n但“保留选择”不能成为无限拖延。每阶段仍应有可用产物、责任、资源与复查时点。学习成果也要说明它改变了哪项选择，不能只写取得更多认识。\n\n## 技术变化怎样进入路线\n\n新模型可能让原先不可做的工作变得可行，也可能使原组件不再值得维护。企业需要比较新供给在自己任务上的作用，而不是追逐所有发布。\n\n如果客户需求与生产约束没有改变，新技术可以只替换一部分；如果新能力打开新的服务组合，就需要重新研究客户与交付，而非只作技术升级。\n\n连续FDE与内部负责人共同维护这条判断链：现场变化如何进入工程，工程变化如何接受真实采用，结果如何改变下一项投入。\n\n## 路线的连续性在哪里\n\n连续性在于始终围绕客户价值、能力积累和可持续交付，而不在于每一阶段都增加自主程度或组件数量。停止无效方向，也可以是路线正确更新的一部分。\n\n企业由此能够主动融入AI，同时避免把当前工具当最终答案。已有能力进一步支持新产品与服务探索，这是下一项更高层的经营选择。\n"},{"file":"38-新产品与服务.md","id":"lesson-38","number":38,"role":"核心课","part":7,"title":"第38章｜企业自己的AI，怎样参与创造新价值","md":"# 第38章｜企业自己的AI，怎样参与创造新价值\n\n在专业服务教学情境中，AI帮机构更快写报告，第一步可能只是减少制作劳动。更长远的问题是：客户是否还需要一份独立报告，还是需要持续发现变化、推进决定和跟踪行动？\n\n这个问题把AI从旧工作提效带向新服务设计。\n\n**企业的AI能力不应只保存过去，还应参与发现新需求、提出新方法与验证新组合。** 新价值仍需把客户、交付和收益连在一起。\n\n## 从重复问题中发现候选需求\n\n持续服务会产生材料：客户反复问什么，建议为什么没有执行，哪些变化经常被漏掉，哪类决定需要专业支持。AI可以帮助整理这些线索、提出解释与候选服务。\n\n例如报告已经交付，客户却不断追问“现在应该先做什么”。这可能提示行动支持需求，也可能只是原报告不清楚。不能从重复提问直接推导一个新产品，仍要区分原因。\n\nAI可以扩大探索范围，使团队比较更多可能。宝洁创新实验为AI参与跨专业构思提供了实际参照，但研究没有证明候选方案已取得商业成功。[研究原文](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n## 三项设计必须共同成立\n\n第一是客户价值：客户在什么处境下需要什么结果，为什么当前办法不足，是否愿意采用并支付。\n\n第二是交付：需要怎样持续取得资料，哪些判断与行动由谁承担，专业与执行容量能否支持。AI能持续生成，不代表企业能持续服务。\n\n第三是价值获取：按什么单位收费，谁承担额外成本，客户关系与关键资源由谁掌握，收入能否支持交付。\n\nTeece的商业模式研究将价值创造、交付和获取联系起来，提醒企业技术创新需要相应经营安排。[原始研究](https://www.sciencedirect.com/science/article/pii/S002463010900051X)\n\n## 用专业服务作一份候选设计\n\n下面是教学方案，尚未验证需求、付费或效果。\n\n| 问题 | 一次性报告 | 持续行动支持的候选安排 |\n|---|---|---|\n| 客户结果 | 获得一次分析与建议 | 发现变化、推进决定并跟踪执行 |\n| 资料 | 约定时点收集 | 有持续入口、更新频率和缺项处理 |\n| 智能工作 | 整理与构思 | 识别变化、提出下一步、维护任务记忆 |\n| 人的工作 | 分析核验与沟通 | 专业判断、客户协调和必要执行 |\n| 收费 | 按次的候选方式 | 按次、按期或其他安排仍需比较 |\n| 新未知 | 能否被理解与采用 | 是否需要持续支持、能否持续交付 |\n\n新服务不是简单给旧报告增加推送。它改变工作关系、持续责任与资源结构，需要新的现场认识。\n\n## 新know-how怎样在探索中形成\n\n团队提出一个服务假设，选择小范围客户处境取得反馈；AI组织材料、候选与变化，人员结合行业和客户知识判断；FDE把可用安排接进实际工作；结果再修正服务。\n\n留下的可能是客户情境分类、有效干预时点、工作组织方法和新的工具。这些都不是最初已有经验的简单复制，而是在共同生产中形成的新认识。\n\n探索与已有业务会竞争资源，回报节奏也不同。应保留有限投入，并说明试做结束后哪项选择会改变，而不把新产品想法数量当成果。[探索与利用研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)\n\n## 什么时候应该回头\n\n若客户主要需要一次明确分析，持续支持可能增加协调而无增量；若资料无法持续取得，服务可能不稳定；若专家核验成为瓶颈，订阅增长反而放大交付压力。\n\n这些反向结果能帮助企业改变产品边界、收费单位或停止方向。持续化不天然优于一次交付，AI伙伴也不要求所有商业模式都变成按月收费。\n\n同样，设备公司从被动维修探索持续设备服务，要重新验证客户需求、现场资源与专业工作；烘焙连锁探索预订服务，也要重新理解顾客选择。现有优势提供基础，新的价值仍需被创造和证明。\n","html":"\u003ch1>第38章｜企业自己的AI，怎样参与创造新价值\u003c/h1>\n\u003cp>在专业服务教学情境中，AI帮机构更快写报告，第一步可能只是减少制作劳动。更长远的问题是：客户是否还需要一份独立报告，还是需要持续发现变化、推进决定和跟踪行动？\u003c/p>\n\u003cp>这个问题把AI从旧工作提效带向新服务设计。\u003c/p>\n\u003cp>\u003cstrong>企业的AI能力不应只保存过去，还应参与发现新需求、提出新方法与验证新组合。\u003c/strong> 新价值仍需把客户、交付和收益连在一起。\u003c/p>\n\u003ch2 id=\"lesson-38-section-1\">从重复问题中发现候选需求\u003c/h2>\n\u003cp>持续服务会产生材料：客户反复问什么，建议为什么没有执行，哪些变化经常被漏掉，哪类决定需要专业支持。AI可以帮助整理这些线索、提出解释与候选服务。\u003c/p>\n\u003cp>例如报告已经交付，客户却不断追问“现在应该先做什么”。这可能提示行动支持需求，也可能只是原报告不清楚。不能从重复提问直接推导一个新产品，仍要区分原因。\u003c/p>\n\u003cp>AI可以扩大探索范围，使团队比较更多可能。宝洁创新实验为AI参与跨专业构思提供了实际参照，但研究没有证明候选方案已取得商业成功。\u003ca href=\"https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702\" target=\"_blank\" rel=\"noopener noreferrer\">研究原文\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-38-section-2\">三项设计必须共同成立\u003c/h2>\n\u003cp>第一是客户价值：客户在什么处境下需要什么结果，为什么当前办法不足，是否愿意采用并支付。\u003c/p>\n\u003cp>第二是交付：需要怎样持续取得资料，哪些判断与行动由谁承担，专业与执行容量能否支持。AI能持续生成，不代表企业能持续服务。\u003c/p>\n\u003cp>第三是价值获取：按什么单位收费，谁承担额外成本，客户关系与关键资源由谁掌握，收入能否支持交付。\u003c/p>\n\u003cp>Teece的商业模式研究将价值创造、交付和获取联系起来，提醒企业技术创新需要相应经营安排。\u003ca href=\"https://www.sciencedirect.com/science/article/pii/S002463010900051X\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-38-section-3\">用专业服务作一份候选设计\u003c/h2>\n\u003cp>下面是教学方案，尚未验证需求、付费或效果。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>问题\u003c/th>\n\u003cth>一次性报告\u003c/th>\n\u003cth>持续行动支持的候选安排\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>客户结果\u003c/td>\n\u003ctd>获得一次分析与建议\u003c/td>\n\u003ctd>发现变化、推进决定并跟踪执行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>资料\u003c/td>\n\u003ctd>约定时点收集\u003c/td>\n\u003ctd>有持续入口、更新频率和缺项处理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>智能工作\u003c/td>\n\u003ctd>整理与构思\u003c/td>\n\u003ctd>识别变化、提出下一步、维护任务记忆\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>人的工作\u003c/td>\n\u003ctd>分析核验与沟通\u003c/td>\n\u003ctd>专业判断、客户协调和必要执行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>收费\u003c/td>\n\u003ctd>按次的候选方式\u003c/td>\n\u003ctd>按次、按期或其他安排仍需比较\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新未知\u003c/td>\n\u003ctd>能否被理解与采用\u003c/td>\n\u003ctd>是否需要持续支持、能否持续交付\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>新服务不是简单给旧报告增加推送。它改变工作关系、持续责任与资源结构，需要新的现场认识。\u003c/p>\n\u003ch2 id=\"lesson-38-section-4\">新know-how怎样在探索中形成\u003c/h2>\n\u003cp>团队提出一个服务假设，选择小范围客户处境取得反馈；AI组织材料、候选与变化，人员结合行业和客户知识判断；FDE把可用安排接进实际工作；结果再修正服务。\u003c/p>\n\u003cp>留下的可能是客户情境分类、有效干预时点、工作组织方法和新的工具。这些都不是最初已有经验的简单复制，而是在共同生产中形成的新认识。\u003c/p>\n\u003cp>探索与已有业务会竞争资源，回报节奏也不同。应保留有限投入，并说明试做结束后哪项选择会改变，而不把新产品想法数量当成果。\u003ca href=\"https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">探索与利用研究\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-38-section-5\">什么时候应该回头\u003c/h2>\n\u003cp>若客户主要需要一次明确分析，持续支持可能增加协调而无增量；若资料无法持续取得，服务可能不稳定；若专家核验成为瓶颈，订阅增长反而放大交付压力。\u003c/p>\n\u003cp>这些反向结果能帮助企业改变产品边界、收费单位或停止方向。持续化不天然优于一次交付，AI伙伴也不要求所有商业模式都变成按月收费。\u003c/p>\n\u003cp>同样，设备公司从被动维修探索持续设备服务，要重新验证客户需求、现场资源与专业工作；烘焙连锁探索预订服务，也要重新理解顾客选择。现有优势提供基础，新的价值仍需被创造和证明。\u003c/p>\n","headings":[{"id":"lesson-38-section-1","label":"从重复问题中发现候选需求"},{"id":"lesson-38-section-2","label":"三项设计必须共同成立"},{"id":"lesson-38-section-3","label":"用专业服务作一份候选设计"},{"id":"lesson-38-section-4","label":"新know-how怎样在探索中形成"},{"id":"lesson-38-section-5","label":"什么时候应该回头"}],"exportMd":"# 第38章｜企业自己的AI，怎样参与创造新价值\n\n在专业服务教学情境中，AI帮机构更快写报告，第一步可能只是减少制作劳动。更长远的问题是：客户是否还需要一份独立报告，还是需要持续发现变化、推进决定和跟踪行动？\n\n这个问题把AI从旧工作提效带向新服务设计。\n\n**企业的AI能力不应只保存过去，还应参与发现新需求、提出新方法与验证新组合。** 新价值仍需把客户、交付和收益连在一起。\n\n## 从重复问题中发现候选需求\n\n持续服务会产生材料：客户反复问什么，建议为什么没有执行，哪些变化经常被漏掉，哪类决定需要专业支持。AI可以帮助整理这些线索、提出解释与候选服务。\n\n例如报告已经交付，客户却不断追问“现在应该先做什么”。这可能提示行动支持需求，也可能只是原报告不清楚。不能从重复提问直接推导一个新产品，仍要区分原因。\n\nAI可以扩大探索范围，使团队比较更多可能。宝洁创新实验为AI参与跨专业构思提供了实际参照，但研究没有证明候选方案已取得商业成功。[研究原文](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n## 三项设计必须共同成立\n\n第一是客户价值：客户在什么处境下需要什么结果，为什么当前办法不足，是否愿意采用并支付。\n\n第二是交付：需要怎样持续取得资料，哪些判断与行动由谁承担，专业与执行容量能否支持。AI能持续生成，不代表企业能持续服务。\n\n第三是价值获取：按什么单位收费，谁承担额外成本，客户关系与关键资源由谁掌握，收入能否支持交付。\n\nTeece的商业模式研究将价值创造、交付和获取联系起来，提醒企业技术创新需要相应经营安排。[原始研究](https://www.sciencedirect.com/science/article/pii/S002463010900051X)\n\n## 用专业服务作一份候选设计\n\n下面是教学方案，尚未验证需求、付费或效果。\n\n| 问题 | 一次性报告 | 持续行动支持的候选安排 |\n|---|---|---|\n| 客户结果 | 获得一次分析与建议 | 发现变化、推进决定并跟踪执行 |\n| 资料 | 约定时点收集 | 有持续入口、更新频率和缺项处理 |\n| 智能工作 | 整理与构思 | 识别变化、提出下一步、维护任务记忆 |\n| 人的工作 | 分析核验与沟通 | 专业判断、客户协调和必要执行 |\n| 收费 | 按次的候选方式 | 按次、按期或其他安排仍需比较 |\n| 新未知 | 能否被理解与采用 | 是否需要持续支持、能否持续交付 |\n\n新服务不是简单给旧报告增加推送。它改变工作关系、持续责任与资源结构，需要新的现场认识。\n\n## 新know-how怎样在探索中形成\n\n团队提出一个服务假设，选择小范围客户处境取得反馈；AI组织材料、候选与变化，人员结合行业和客户知识判断；FDE把可用安排接进实际工作；结果再修正服务。\n\n留下的可能是客户情境分类、有效干预时点、工作组织方法和新的工具。这些都不是最初已有经验的简单复制，而是在共同生产中形成的新认识。\n\n探索与已有业务会竞争资源，回报节奏也不同。应保留有限投入，并说明试做结束后哪项选择会改变，而不把新产品想法数量当成果。[探索与利用研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)\n\n## 什么时候应该回头\n\n若客户主要需要一次明确分析，持续支持可能增加协调而无增量；若资料无法持续取得，服务可能不稳定；若专家核验成为瓶颈，订阅增长反而放大交付压力。\n\n这些反向结果能帮助企业改变产品边界、收费单位或停止方向。持续化不天然优于一次交付，AI伙伴也不要求所有商业模式都变成按月收费。\n\n同样，设备公司从被动维修探索持续设备服务，要重新验证客户需求、现场资源与专业工作；烘焙连锁探索预订服务，也要重新理解顾客选择。现有优势提供基础，新的价值仍需被创造和证明。\n","exportSingleMd":"# 第38章｜企业自己的AI，怎样参与创造新价值\n\n在专业服务教学情境中，AI帮机构更快写报告，第一步可能只是减少制作劳动。更长远的问题是：客户是否还需要一份独立报告，还是需要持续发现变化、推进决定和跟踪行动？\n\n这个问题把AI从旧工作提效带向新服务设计。\n\n**企业的AI能力不应只保存过去，还应参与发现新需求、提出新方法与验证新组合。** 新价值仍需把客户、交付和收益连在一起。\n\n## 从重复问题中发现候选需求\n\n持续服务会产生材料：客户反复问什么，建议为什么没有执行，哪些变化经常被漏掉，哪类决定需要专业支持。AI可以帮助整理这些线索、提出解释与候选服务。\n\n例如报告已经交付，客户却不断追问“现在应该先做什么”。这可能提示行动支持需求，也可能只是原报告不清楚。不能从重复提问直接推导一个新产品，仍要区分原因。\n\nAI可以扩大探索范围，使团队比较更多可能。宝洁创新实验为AI参与跨专业构思提供了实际参照，但研究没有证明候选方案已取得商业成功。[研究原文](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n## 三项设计必须共同成立\n\n第一是客户价值：客户在什么处境下需要什么结果，为什么当前办法不足，是否愿意采用并支付。\n\n第二是交付：需要怎样持续取得资料，哪些判断与行动由谁承担，专业与执行容量能否支持。AI能持续生成，不代表企业能持续服务。\n\n第三是价值获取：按什么单位收费，谁承担额外成本，客户关系与关键资源由谁掌握，收入能否支持交付。\n\nTeece的商业模式研究将价值创造、交付和获取联系起来，提醒企业技术创新需要相应经营安排。[原始研究](https://www.sciencedirect.com/science/article/pii/S002463010900051X)\n\n## 用专业服务作一份候选设计\n\n下面是教学方案，尚未验证需求、付费或效果。\n\n| 问题 | 一次性报告 | 持续行动支持的候选安排 |\n|---|---|---|\n| 客户结果 | 获得一次分析与建议 | 发现变化、推进决定并跟踪执行 |\n| 资料 | 约定时点收集 | 有持续入口、更新频率和缺项处理 |\n| 智能工作 | 整理与构思 | 识别变化、提出下一步、维护任务记忆 |\n| 人的工作 | 分析核验与沟通 | 专业判断、客户协调和必要执行 |\n| 收费 | 按次的候选方式 | 按次、按期或其他安排仍需比较 |\n| 新未知 | 能否被理解与采用 | 是否需要持续支持、能否持续交付 |\n\n新服务不是简单给旧报告增加推送。它改变工作关系、持续责任与资源结构，需要新的现场认识。\n\n## 新know-how怎样在探索中形成\n\n团队提出一个服务假设，选择小范围客户处境取得反馈；AI组织材料、候选与变化，人员结合行业和客户知识判断；FDE把可用安排接进实际工作；结果再修正服务。\n\n留下的可能是客户情境分类、有效干预时点、工作组织方法和新的工具。这些都不是最初已有经验的简单复制，而是在共同生产中形成的新认识。\n\n探索与已有业务会竞争资源，回报节奏也不同。应保留有限投入，并说明试做结束后哪项选择会改变，而不把新产品想法数量当成果。[探索与利用研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)\n\n## 什么时候应该回头\n\n若客户主要需要一次明确分析，持续支持可能增加协调而无增量；若资料无法持续取得，服务可能不稳定；若专家核验成为瓶颈，订阅增长反而放大交付压力。\n\n这些反向结果能帮助企业改变产品边界、收费单位或停止方向。持续化不天然优于一次交付，AI伙伴也不要求所有商业模式都变成按月收费。\n\n同样，设备公司从被动维修探索持续设备服务，要重新验证客户需求、现场资源与专业工作；烘焙连锁探索预订服务，也要重新理解顾客选择。现有优势提供基础，新的价值仍需被创造和证明。\n","text":"# 第38章｜企业自己的AI，怎样参与创造新价值\n\n在专业服务教学情境中，AI帮机构更快写报告，第一步可能只是减少制作劳动。更长远的问题是：客户是否还需要一份独立报告，还是需要持续发现变化、推进决定和跟踪行动？\n\n这个问题把AI从旧工作提效带向新服务设计。\n\n**企业的AI能力不应只保存过去，还应参与发现新需求、提出新方法与验证新组合。** 新价值仍需把客户、交付和收益连在一起。\n\n## 从重复问题中发现候选需求\n\n持续服务会产生材料：客户反复问什么，建议为什么没有执行，哪些变化经常被漏掉，哪类决定需要专业支持。AI可以帮助整理这些线索、提出解释与候选服务。\n\n例如报告已经交付，客户却不断追问“现在应该先做什么”。这可能提示行动支持需求，也可能只是原报告不清楚。不能从重复提问直接推导一个新产品，仍要区分原因。\n\nAI可以扩大探索范围，使团队比较更多可能。宝洁创新实验为AI参与跨专业构思提供了实际参照，但研究没有证明候选方案已取得商业成功。研究原文\n\n## 三项设计必须共同成立\n\n第一是客户价值：客户在什么处境下需要什么结果，为什么当前办法不足，是否愿意采用并支付。\n\n第二是交付：需要怎样持续取得资料，哪些判断与行动由谁承担，专业与执行容量能否支持。AI能持续生成，不代表企业能持续服务。\n\n第三是价值获取：按什么单位收费，谁承担额外成本，客户关系与关键资源由谁掌握，收入能否支持交付。\n\nTeece的商业模式研究将价值创造、交付和获取联系起来，提醒企业技术创新需要相应经营安排。原始研究\n\n## 用专业服务作一份候选设计\n\n下面是教学方案，尚未验证需求、付费或效果。\n\n| 问题 | 一次性报告 | 持续行动支持的候选安排 |\n|---|---|---|\n| 客户结果 | 获得一次分析与建议 | 发现变化、推进决定并跟踪执行 |\n| 资料 | 约定时点收集 | 有持续入口、更新频率和缺项处理 |\n| 智能工作 | 整理与构思 | 识别变化、提出下一步、维护任务记忆 |\n| 人的工作 | 分析核验与沟通 | 专业判断、客户协调和必要执行 |\n| 收费 | 按次的候选方式 | 按次、按期或其他安排仍需比较 |\n| 新未知 | 能否被理解与采用 | 是否需要持续支持、能否持续交付 |\n\n新服务不是简单给旧报告增加推送。它改变工作关系、持续责任与资源结构，需要新的现场认识。\n\n## 新know-how怎样在探索中形成\n\n团队提出一个服务假设，选择小范围客户处境取得反馈；AI组织材料、候选与变化，人员结合行业和客户知识判断；FDE把可用安排接进实际工作；结果再修正服务。\n\n留下的可能是客户情境分类、有效干预时点、工作组织方法和新的工具。这些都不是最初已有经验的简单复制，而是在共同生产中形成的新认识。\n\n探索与已有业务会竞争资源，回报节奏也不同。应保留有限投入，并说明试做结束后哪项选择会改变，而不把新产品想法数量当成果。探索与利用研究\n\n## 什么时候应该回头\n\n若客户主要需要一次明确分析，持续支持可能增加协调而无增量；若资料无法持续取得，服务可能不稳定；若专家核验成为瓶颈，订阅增长反而放大交付压力。\n\n这些反向结果能帮助企业改变产品边界、收费单位或停止方向。持续化不天然优于一次交付，AI伙伴也不要求所有商业模式都变成按月收费。\n\n同样，设备公司从被动维修探索持续设备服务，要重新验证客户需求、现场资源与专业工作；烘焙连锁探索预订服务，也要重新理解顾客选择。现有优势提供基础，新的价值仍需被创造和证明。\n"},{"file":"39-行业与竞争节奏.md","id":"lesson-39","number":39,"role":"核心课","part":7,"title":"第39章｜同一种AI，为什么改变企业的节奏不同","md":"# 第39章｜同一种AI，为什么改变企业的节奏不同\n\n比较三组教学情境：专业服务可以很快增加候选报告；烘焙连锁仍受每日生产与配送限制；设备公司即使远程分析更快，也可能需要技术员到场。三家企业都在使用AI，经营变化却不会同步。\n\n**转型紧迫性应沿具体业务的传导机制判断：哪些工作可改变，结果多久返回，履约受什么限制，价值由谁保留。** 行业标签只提供起点。\n\n## 可改变工作的占比与位置\n\n一种智能能力若直接影响关键客户结果，作用可能更快显现；若只改善远离瓶颈的内部制作，收益可能需要额外重组才能兑现。\n\n在专业服务里，生成成本可能显著下降，但专家判断、客户采用和执行仍有限；在实物业务里，判断改善也可能减少浪费、改善网络，却不能越过真实产能。\n\n因此不能从“数字业务”推导更容易获利，也不能从“实物行业”推导转型不紧迫。关键是智能作用于哪一环节，它怎样改变其他环节。\n\n## 反馈速度影响学习速度\n\n有些任务当天能观察质量，有些客户结果要长期才出现。反馈快有助于修订，但只看容易观察的短期结果，也可能忽略长期质量。\n\n若企业能可靠连接行动与结果、保留反例并迁移有效经验，早期建设更可能帮助后续采用。若反馈持续偏斜，早开始也可能积累更强惯性。\n\n吸收能力解释相关知识如何影响新供给应用，动态能力解释企业如何更新资源。它们为路径差异提供机制，不能预测每家企业的生存概率。[吸收能力](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)、[动态能力](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)\n\n## 相似技术，可能形成不同竞争位置\n\n如果能力很快普及，客户可以自行完成，企业的原收费环节可能收缩。如果智能与独特客户理解、渠道或履约资源形成组合，企业又可能发展新的价值。\n\n价值创造后能否保留，仍取决于竞争与商业模式。把所有改善让渡为降价，或主要由平台取得收益，技术领先也未必转为企业优势。[商业模式研究](https://www.sciencedirect.com/science/article/pii/S002463010900051X)\n\n| 教学业务 | 主要可改变部分 | 仍需配合的条件 | 可能优先的FDE工作 |\n|---|---|---|---|\n| 连锁备货 | 情境信息与分配判断 | 生产、配送、门店执行 | 现场记录与实际反馈 |\n| 设备售后 | 资料理解、经验调用与跟进 | 专业判断、工具与到场 | 真实动作、接任与服务链 |\n| 专业服务 | 材料、构思、持续支持 | 核验、客户协作与行动 | 阶段分工、容量与产品探索 |\n\n这张表是案例分析，不是行业成熟度排名。\n\n## 为什么公开研究不能合成一个通用结论\n\n客服研究观察真实对话与员工表现，宝洁研究观察创新方案，办公研究观察软件活动，开发实验观察特定任务耗时。它们的工作、时期、工具与结果不同。\n\n将其平均成“AI普遍提高多少效率”，会抹掉企业最需要理解的条件。反向结果也不能独自否定整个技术方向。专业依据的作用，是帮助定位可能机制与判断边界。\n\n课程的[研究与延伸阅读](延伸阅读.md)保留这些来源的具体用途，便于回到原始研究。企业自己的关键决定仍需自己的任务与客户证据。\n\n## 把紧迫感变成建设选择\n\n可以说明：竞争者若取得类似智能供给，会改变哪项客户选择；本企业当前哪项学习或履约条件最薄弱；若持续不建设，差距可能怎样扩大；眼下什么投入能够改善这条路径。\n\n这比统一倒计时更有行动内容，也不削弱主动转型的必要性。企业不必等产业答案形成，才能建设自己的吸收、工程和学习能力；但应知道自己为何开始、如何判断和怎样调整。\n\n最后，需要把这些关系写成一份完整提案，让经营、业务与工程能够围绕同一条论证合作。\n","html":"\u003ch1>第39章｜同一种AI，为什么改变企业的节奏不同\u003c/h1>\n\u003cp>比较三组教学情境：专业服务可以很快增加候选报告；烘焙连锁仍受每日生产与配送限制；设备公司即使远程分析更快，也可能需要技术员到场。三家企业都在使用AI，经营变化却不会同步。\u003c/p>\n\u003cp>\u003cstrong>转型紧迫性应沿具体业务的传导机制判断：哪些工作可改变，结果多久返回，履约受什么限制，价值由谁保留。\u003c/strong> 行业标签只提供起点。\u003c/p>\n\u003ch2 id=\"lesson-39-section-1\">可改变工作的占比与位置\u003c/h2>\n\u003cp>一种智能能力若直接影响关键客户结果，作用可能更快显现；若只改善远离瓶颈的内部制作，收益可能需要额外重组才能兑现。\u003c/p>\n\u003cp>在专业服务里，生成成本可能显著下降，但专家判断、客户采用和执行仍有限；在实物业务里，判断改善也可能减少浪费、改善网络，却不能越过真实产能。\u003c/p>\n\u003cp>因此不能从“数字业务”推导更容易获利，也不能从“实物行业”推导转型不紧迫。关键是智能作用于哪一环节，它怎样改变其他环节。\u003c/p>\n\u003ch2 id=\"lesson-39-section-2\">反馈速度影响学习速度\u003c/h2>\n\u003cp>有些任务当天能观察质量，有些客户结果要长期才出现。反馈快有助于修订，但只看容易观察的短期结果，也可能忽略长期质量。\u003c/p>\n\u003cp>若企业能可靠连接行动与结果、保留反例并迁移有效经验，早期建设更可能帮助后续采用。若反馈持续偏斜，早开始也可能积累更强惯性。\u003c/p>\n\u003cp>吸收能力解释相关知识如何影响新供给应用，动态能力解释企业如何更新资源。它们为路径差异提供机制，不能预测每家企业的生存概率。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">吸收能力\u003c/a>、\u003ca href=\"https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">动态能力\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-39-section-3\">相似技术，可能形成不同竞争位置\u003c/h2>\n\u003cp>如果能力很快普及，客户可以自行完成，企业的原收费环节可能收缩。如果智能与独特客户理解、渠道或履约资源形成组合，企业又可能发展新的价值。\u003c/p>\n\u003cp>价值创造后能否保留，仍取决于竞争与商业模式。把所有改善让渡为降价，或主要由平台取得收益，技术领先也未必转为企业优势。\u003ca href=\"https://www.sciencedirect.com/science/article/pii/S002463010900051X\" target=\"_blank\" rel=\"noopener noreferrer\">商业模式研究\u003c/a>\u003c/p>\n\u003cdiv class=\"table-scroll table-wide\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>教学业务\u003c/th>\n\u003cth>主要可改变部分\u003c/th>\n\u003cth>仍需配合的条件\u003c/th>\n\u003cth>可能优先的FDE工作\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>连锁备货\u003c/td>\n\u003ctd>情境信息与分配判断\u003c/td>\n\u003ctd>生产、配送、门店执行\u003c/td>\n\u003ctd>现场记录与实际反馈\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>设备售后\u003c/td>\n\u003ctd>资料理解、经验调用与跟进\u003c/td>\n\u003ctd>专业判断、工具与到场\u003c/td>\n\u003ctd>真实动作、接任与服务链\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>专业服务\u003c/td>\n\u003ctd>材料、构思、持续支持\u003c/td>\n\u003ctd>核验、客户协作与行动\u003c/td>\n\u003ctd>阶段分工、容量与产品探索\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"table-hint\">表格可左右滑动查看\u003c/p>\n\u003cp>这张表是案例分析，不是行业成熟度排名。\u003c/p>\n\u003ch2 id=\"lesson-39-section-4\">为什么公开研究不能合成一个通用结论\u003c/h2>\n\u003cp>客服研究观察真实对话与员工表现，宝洁研究观察创新方案，办公研究观察软件活动，开发实验观察特定任务耗时。它们的工作、时期、工具与结果不同。\u003c/p>\n\u003cp>将其平均成“AI普遍提高多少效率”，会抹掉企业最需要理解的条件。反向结果也不能独自否定整个技术方向。专业依据的作用，是帮助定位可能机制与判断边界。\u003c/p>\n\u003cp>课程的\u003ca href=\"#reading\">研究与延伸阅读\u003c/a>保留这些来源的具体用途，便于回到原始研究。企业自己的关键决定仍需自己的任务与客户证据。\u003c/p>\n\u003ch2 id=\"lesson-39-section-5\">把紧迫感变成建设选择\u003c/h2>\n\u003cp>可以说明：竞争者若取得类似智能供给，会改变哪项客户选择；本企业当前哪项学习或履约条件最薄弱；若持续不建设，差距可能怎样扩大；眼下什么投入能够改善这条路径。\u003c/p>\n\u003cp>这比统一倒计时更有行动内容，也不削弱主动转型的必要性。企业不必等产业答案形成，才能建设自己的吸收、工程和学习能力；但应知道自己为何开始、如何判断和怎样调整。\u003c/p>\n\u003cp>最后，需要把这些关系写成一份完整提案，让经营、业务与工程能够围绕同一条论证合作。\u003c/p>\n","headings":[{"id":"lesson-39-section-1","label":"可改变工作的占比与位置"},{"id":"lesson-39-section-2","label":"反馈速度影响学习速度"},{"id":"lesson-39-section-3","label":"相似技术，可能形成不同竞争位置"},{"id":"lesson-39-section-4","label":"为什么公开研究不能合成一个通用结论"},{"id":"lesson-39-section-5","label":"把紧迫感变成建设选择"}],"exportMd":"# 第39章｜同一种AI，为什么改变企业的节奏不同\n\n比较三组教学情境：专业服务可以很快增加候选报告；烘焙连锁仍受每日生产与配送限制；设备公司即使远程分析更快，也可能需要技术员到场。三家企业都在使用AI，经营变化却不会同步。\n\n**转型紧迫性应沿具体业务的传导机制判断：哪些工作可改变，结果多久返回，履约受什么限制，价值由谁保留。** 行业标签只提供起点。\n\n## 可改变工作的占比与位置\n\n一种智能能力若直接影响关键客户结果，作用可能更快显现；若只改善远离瓶颈的内部制作，收益可能需要额外重组才能兑现。\n\n在专业服务里，生成成本可能显著下降，但专家判断、客户采用和执行仍有限；在实物业务里，判断改善也可能减少浪费、改善网络，却不能越过真实产能。\n\n因此不能从“数字业务”推导更容易获利，也不能从“实物行业”推导转型不紧迫。关键是智能作用于哪一环节，它怎样改变其他环节。\n\n## 反馈速度影响学习速度\n\n有些任务当天能观察质量，有些客户结果要长期才出现。反馈快有助于修订，但只看容易观察的短期结果，也可能忽略长期质量。\n\n若企业能可靠连接行动与结果、保留反例并迁移有效经验，早期建设更可能帮助后续采用。若反馈持续偏斜，早开始也可能积累更强惯性。\n\n吸收能力解释相关知识如何影响新供给应用，动态能力解释企业如何更新资源。它们为路径差异提供机制，不能预测每家企业的生存概率。[吸收能力](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)、[动态能力](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)\n\n## 相似技术，可能形成不同竞争位置\n\n如果能力很快普及，客户可以自行完成，企业的原收费环节可能收缩。如果智能与独特客户理解、渠道或履约资源形成组合，企业又可能发展新的价值。\n\n价值创造后能否保留，仍取决于竞争与商业模式。把所有改善让渡为降价，或主要由平台取得收益，技术领先也未必转为企业优势。[商业模式研究](https://www.sciencedirect.com/science/article/pii/S002463010900051X)\n\n| 教学业务 | 主要可改变部分 | 仍需配合的条件 | 可能优先的FDE工作 |\n|---|---|---|---|\n| 连锁备货 | 情境信息与分配判断 | 生产、配送、门店执行 | 现场记录与实际反馈 |\n| 设备售后 | 资料理解、经验调用与跟进 | 专业判断、工具与到场 | 真实动作、接任与服务链 |\n| 专业服务 | 材料、构思、持续支持 | 核验、客户协作与行动 | 阶段分工、容量与产品探索 |\n\n这张表是案例分析，不是行业成熟度排名。\n\n## 为什么公开研究不能合成一个通用结论\n\n客服研究观察真实对话与员工表现，宝洁研究观察创新方案，办公研究观察软件活动，开发实验观察特定任务耗时。它们的工作、时期、工具与结果不同。\n\n将其平均成“AI普遍提高多少效率”，会抹掉企业最需要理解的条件。反向结果也不能独自否定整个技术方向。专业依据的作用，是帮助定位可能机制与判断边界。\n\n课程的[研究与延伸阅读](#reading)保留这些来源的具体用途，便于回到原始研究。企业自己的关键决定仍需自己的任务与客户证据。\n\n## 把紧迫感变成建设选择\n\n可以说明：竞争者若取得类似智能供给，会改变哪项客户选择；本企业当前哪项学习或履约条件最薄弱；若持续不建设，差距可能怎样扩大；眼下什么投入能够改善这条路径。\n\n这比统一倒计时更有行动内容，也不削弱主动转型的必要性。企业不必等产业答案形成，才能建设自己的吸收、工程和学习能力；但应知道自己为何开始、如何判断和怎样调整。\n\n最后，需要把这些关系写成一份完整提案，让经营、业务与工程能够围绕同一条论证合作。\n","exportSingleMd":"# 第39章｜同一种AI，为什么改变企业的节奏不同\n\n比较三组教学情境：专业服务可以很快增加候选报告；烘焙连锁仍受每日生产与配送限制；设备公司即使远程分析更快，也可能需要技术员到场。三家企业都在使用AI，经营变化却不会同步。\n\n**转型紧迫性应沿具体业务的传导机制判断：哪些工作可改变，结果多久返回，履约受什么限制，价值由谁保留。** 行业标签只提供起点。\n\n## 可改变工作的占比与位置\n\n一种智能能力若直接影响关键客户结果，作用可能更快显现；若只改善远离瓶颈的内部制作，收益可能需要额外重组才能兑现。\n\n在专业服务里，生成成本可能显著下降，但专家判断、客户采用和执行仍有限；在实物业务里，判断改善也可能减少浪费、改善网络，却不能越过真实产能。\n\n因此不能从“数字业务”推导更容易获利，也不能从“实物行业”推导转型不紧迫。关键是智能作用于哪一环节，它怎样改变其他环节。\n\n## 反馈速度影响学习速度\n\n有些任务当天能观察质量，有些客户结果要长期才出现。反馈快有助于修
