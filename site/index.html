n\n## 人工确认应当承担什么作用\n\n资源分配、特殊成本和客户承诺需要相应决定者判断。稳定且可核验的记录或查询，则可以由系统完成并提供证据。把每一步都设成“人点一下”，不一定更可靠；如果确认者不知道该核什么，增加的只是操作。\n\n验收时，可以沿一笔真实工作看：建议怎样形成，谁决定采用，系统怎样接受，下一岗位看到了什么，客户结果怎样回来。也应看中断和异常时能否接续，而不是只测顺利的一次提交。\n\n当每一步完成都有清楚含义，企业才能逐渐扩大AI的职责。智能参与生产的可靠性，最终体现在实际动作和业务结果之间能够追得通。\n","text":"# 第21章｜AI说“已经安排”，业务究竟发生到了哪一步\n\n客户仍在等待技术员上门，调度员却看到AI回复“已经安排”。这句话可能对应几种完全不同的情况：AI只是写好了派工建议；调度员已经批准，但尚未提交；派工系统已经接受，只是网络中断，没有把结果返回。\n\n如果不分清就再提交一次，第一种情况仍需完成审批，第三种情况却可能重复占用人员。企业把AI接进真实生产时，必须让“做到了哪一步”能够由实际记录证明。\n\n## 同一张工单，会经过几种不同的完成\n\n在设备售后教学案例中，AI准备好设备历史和建议人员，只表示材料完成。调度员决定采用，表示作出了派工选择。派工系统接受，表示形成了正式任务。技术员到场、设备恢复、后续没有复发，则分别是更后面的事实。\n\n这些状态之所以要区分，是因为下一位同事要据此行动。建议尚未采用时，不能通知客户已经有人出发；系统接受以后，应跟进到场，而不是再次派工；设备恢复以后，还可能需要观察复发，不能把内部关闭工单当成长期解决。\n\n \n\n图中每一步都需要相应证据。例如系统任务编号可以证明接受，技术员反馈可以证明到场，客户或设备状态可以支持恢复判断。AI自然语言说得多确定，不会改变这些证据是否存在。\n\n## 工具接入，实际改变了什么\n\n模型能够调用工具，意味着它可以通过指定方式查询或操作业务系统。例如查询工单、检查人员安排、创建派工。企业不需要管理者记住接口参数，但应能说明：作用于哪张工单，以什么身份执行，哪些动作可以直接完成，哪些需要谁决定，完成后到哪里查结果。\n\n对象不清，可能把同名客户的设备混淆；权限不清，可能把一个建议直接变成客户承诺；返回结果不清，人员就不知道应该继续等待还是重新操作。这些都直接影响交付，而不只是技术细节。Agent工程材料\n\nFDE应把工具含义翻译成业务能够核对的动作。比如“准备派工”和“正式创建派工”是两个不同操作，不能因为界面上只有一个按钮就合并责任。\n\n## 网络中断以后，怎样接着做\n\n假设系统提交派工后没有回显。此时需要查询的是这一次提交，而不是泛泛地查“这张工单有没有派过人”。同一设备可能以前已经服务过，查到旧派工记录，并不能证明本次成功。\n\n因此，提交前应保留本次请求与工单的对应关系。恢复后，用它确认本次是否已被接受：已接受，就继续跟进；明确未接受，再按当前安排重试；仍无法确认，则保留待核状态，交给相应处理。这样既避免重复，也避免把未知当成失败后漏掉已经发生的动作。\n\n这是让AI能够可靠接续工作的基础。若没有这种记录，再强的模型也只能根据不完整的文字猜测，无法从现实中恢复事实。\n\n## 人工确认应当承担什么作用\n\n资源分配、特殊成本和客户承诺需要相应决定者判断。稳定且可核验的记录或查询，则可以由系统完成并提供证据。把每一步都设成“人点一下”，不一定更可靠；如果确认者不知道该核什么，增加的只是操作。\n\n验收时，可以沿一笔真实工作看：建议怎样形成，谁决定采用，系统怎样接受，下一岗位看到了什么，客户结果怎样回来。也应看中断和异常时能否接续，而不是只测顺利的一次提交。\n\n当每一步完成都有清楚含义，企业才能逐渐扩大AI的职责。智能参与生产的可靠性，最终体现在实际动作和业务结果之间能够追得通。\n"},{"file":"22-持续运行与系统演化.md","id":"lesson-22","number":22,"role":"核心课","part":3,"title":"第22章｜上线以后，哪些变化会让原来的好系统逐渐失效","md":"# 第22章｜上线以后，哪些变化会让原来的好系统逐渐失效\n\n设备服务系统上线时，团队主要处理V1版本，知识库和检查方法也围绕这一版本建立。几个月后客户开始使用V2，界面仍能正常打开，AI仍然流畅回答，但旧方法的适用条件已经变化。\n\n类似情况也会发生在报价和内容业务：供应商改变交期，旧承诺仍被搜索出来；客户更新产品，草稿仍使用旧性能；原负责人离开，一些靠他临时处理的例外突然无人接住。系统没有明显故障，工作却可能逐渐失效。\n\n## 业务变化会沿着几处同时传播\n\n新设备版本首先影响经验能否继续使用，也可能影响备件、查询方式和专业支持。若只是把新说明书上传，却没有改变旧方法的默认推荐，接任者仍可能先看到旧答案。\n\n价格更新则不仅影响下一份报价，还可能影响已经在准备、尚未确认的业务。企业需要明确新价格从何时生效、哪些在途任务应重新核对。维护由此不只是修改一张表，而是使相关工作使用正确条件。\n\n换模型也有类似问题。新模型可能写得更流畅，却改变工具选择、引用或停止行为。需要用原系统承担的代表任务比较，观察重要能力是否保留。升级演示只能说明它能完成演示中的任务，不能替代本企业工作检查。\n\n## 为什么扩大使用后，维护负担才变得明显\n\n原型通常由熟悉背景的人照看。材料缺一点，他会补；输出含糊，他知道怎么理解；某个工具失败，他会手动处理。许多条件因此没有进入正式系统。\n\n更多人员开始使用，任务和版本增多，原来依靠个人补足的部分才暴露。权限不同、记录不完整、新旧方法混用，都会增加支持工作。机器学习系统的技术债研究指出，模型之外的依赖、反馈和维护也是长期负担的重要来源。[原始研究](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n因此，模型调用费很低，并不代表系统运行成本低。企业还需要安排资料更新、专业评价、工程支持和业务配合。如果这些工作长期由专家加班承担，成本只是没有出现在同一张账里。\n\n## 维护怎样进入一项真实的经营安排\n\n[设备售后教学案例](案例C-设备售后.md)假设新安排每月需要6000元AI与FDE维护费用。企业应知道这笔费用具体支持什么：新版本的方法检查、复访原因整理、派工准备修订，还是工具与状态的可靠运行。\n\n若减少一次可取消的外协复访能少付500元，那么每月减少12次才刚好覆盖这6000元。实际效果也可以包含专业容量和客户体验，但应分别说明，不能仅凭“系统需要维护”就认为任何费用都合理。\n\n维护还有优先顺序。影响当前正式报价的价格错误，应优先处理；低频功能的小改进可以排后。每次业务变化，也不必重测全部系统。先知道它会影响哪种行为，再选择相关任务核对，才能控制负担。\n\n## 哪些积累能帮助企业跨过下一次变化\n\n保留可追溯原件、清楚的业务状态、代表任务、方法适用条件和内部理解，可以减少换模型或换团队时重新解释背景的成本。它们使企业能够检查新方案，而不是完全依赖供应商说“已经升级”。\n\n技术互补投入研究将流程、组织和人员建设与技术发挥作用联系起来。[研究记录](https://www.nber.org/papers/w25148) 这些投入应有实际用途，例如让新人员接任、让新版本能被识别、让旧方法能够停用，而不只是以“长期资产”为名不断积累文件。\n\n业务稳定以后，也可以减少高强度驻场，删除低价值复杂功能，把成熟部分交给常规维护。持续运行的目标是保持有效能力，并及时改变已经不合适的部分。能保留、能修订、也能撤掉，才是一套可以长期经营的系统。\n","html":"\u003ch1>第22章｜上线以后，哪些变化会让原来的好系统逐渐失效\u003c/h1>\n\u003cp>设备服务系统上线时，团队主要处理V1版本，知识库和检查方法也围绕这一版本建立。几个月后客户开始使用V2，界面仍能正常打开，AI仍然流畅回答，但旧方法的适用条件已经变化。\u003c/p>\n\u003cp>类似情况也会发生在报价和内容业务：供应商改变交期，旧承诺仍被搜索出来；客户更新产品，草稿仍使用旧性能；原负责人离开，一些靠他临时处理的例外突然无人接住。系统没有明显故障，工作却可能逐渐失效。\u003c/p>\n\u003ch2 id=\"lesson-22-section-1\">业务变化会沿着几处同时传播\u003c/h2>\n\u003cp>新设备版本首先影响经验能否继续使用，也可能影响备件、查询方式和专业支持。若只是把新说明书上传，却没有改变旧方法的默认推荐，接任者仍可能先看到旧答案。\u003c/p>\n\u003cp>价格更新则不仅影响下一份报价，还可能影响已经在准备、尚未确认的业务。企业需要明确新价格从何时生效、哪些在途任务应重新核对。维护由此不只是修改一张表，而是使相关工作使用正确条件。\u003c/p>\n\u003cp>换模型也有类似问题。新模型可能写得更流畅，却改变工具选择、引用或停止行为。需要用原系统承担的代表任务比较，观察重要能力是否保留。升级演示只能说明它能完成演示中的任务，不能替代本企业工作检查。\u003c/p>\n\u003ch2 id=\"lesson-22-section-2\">为什么扩大使用后，维护负担才变得明显\u003c/h2>\n\u003cp>原型通常由熟悉背景的人照看。材料缺一点，他会补；输出含糊，他知道怎么理解；某个工具失败，他会手动处理。许多条件因此没有进入正式系统。\u003c/p>\n\u003cp>更多人员开始使用，任务和版本增多，原来依靠个人补足的部分才暴露。权限不同、记录不完整、新旧方法混用，都会增加支持工作。机器学习系统的技术债研究指出，模型之外的依赖、反馈和维护也是长期负担的重要来源。\u003ca href=\"https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003cp>因此，模型调用费很低，并不代表系统运行成本低。企业还需要安排资料更新、专业评价、工程支持和业务配合。如果这些工作长期由专家加班承担，成本只是没有出现在同一张账里。\u003c/p>\n\u003ch2 id=\"lesson-22-section-3\">维护怎样进入一项真实的经营安排\u003c/h2>\n\u003cp>\u003ca href=\"#case-c\">设备售后教学案例\u003c/a>假设新安排每月需要6000元AI与FDE维护费用。企业应知道这笔费用具体支持什么：新版本的方法检查、复访原因整理、派工准备修订，还是工具与状态的可靠运行。\u003c/p>\n\u003cp>若减少一次可取消的外协复访能少付500元，那么每月减少12次才刚好覆盖这6000元。实际效果也可以包含专业容量和客户体验，但应分别说明，不能仅凭“系统需要维护”就认为任何费用都合理。\u003c/p>\n\u003cp>维护还有优先顺序。影响当前正式报价的价格错误，应优先处理；低频功能的小改进可以排后。每次业务变化，也不必重测全部系统。先知道它会影响哪种行为，再选择相关任务核对，才能控制负担。\u003c/p>\n\u003ch2 id=\"lesson-22-section-4\">哪些积累能帮助企业跨过下一次变化\u003c/h2>\n\u003cp>保留可追溯原件、清楚的业务状态、代表任务、方法适用条件和内部理解，可以减少换模型或换团队时重新解释背景的成本。它们使企业能够检查新方案，而不是完全依赖供应商说“已经升级”。\u003c/p>\n\u003cp>技术互补投入研究将流程、组织和人员建设与技术发挥作用联系起来。\u003ca href=\"https://www.nber.org/papers/w25148\" target=\"_blank\" rel=\"noopener noreferrer\">研究记录\u003c/a> 这些投入应有实际用途，例如让新人员接任、让新版本能被识别、让旧方法能够停用，而不只是以“长期资产”为名不断积累文件。\u003c/p>\n\u003cp>业务稳定以后，也可以减少高强度驻场，删除低价值复杂功能，把成熟部分交给常规维护。持续运行的目标是保持有效能力，并及时改变已经不合适的部分。能保留、能修订、也能撤掉，才是一套可以长期经营的系统。\u003c/p>\n","headings":[{"id":"lesson-22-section-1","label":"业务变化会沿着几处同时传播"},{"id":"lesson-22-section-2","label":"为什么扩大使用后，维护负担才变得明显"},{"id":"lesson-22-section-3","label":"维护怎样进入一项真实的经营安排"},{"id":"lesson-22-section-4","label":"哪些积累能帮助企业跨过下一次变化"}],"exportMd":"# 第22章｜上线以后，哪些变化会让原来的好系统逐渐失效\n\n设备服务系统上线时，团队主要处理V1版本，知识库和检查方法也围绕这一版本建立。几个月后客户开始使用V2，界面仍能正常打开，AI仍然流畅回答，但旧方法的适用条件已经变化。\n\n类似情况也会发生在报价和内容业务：供应商改变交期，旧承诺仍被搜索出来；客户更新产品，草稿仍使用旧性能；原负责人离开，一些靠他临时处理的例外突然无人接住。系统没有明显故障，工作却可能逐渐失效。\n\n## 业务变化会沿着几处同时传播\n\n新设备版本首先影响经验能否继续使用，也可能影响备件、查询方式和专业支持。若只是把新说明书上传，却没有改变旧方法的默认推荐，接任者仍可能先看到旧答案。\n\n价格更新则不仅影响下一份报价，还可能影响已经在准备、尚未确认的业务。企业需要明确新价格从何时生效、哪些在途任务应重新核对。维护由此不只是修改一张表，而是使相关工作使用正确条件。\n\n换模型也有类似问题。新模型可能写得更流畅，却改变工具选择、引用或停止行为。需要用原系统承担的代表任务比较，观察重要能力是否保留。升级演示只能说明它能完成演示中的任务，不能替代本企业工作检查。\n\n## 为什么扩大使用后，维护负担才变得明显\n\n原型通常由熟悉背景的人照看。材料缺一点，他会补；输出含糊，他知道怎么理解；某个工具失败，他会手动处理。许多条件因此没有进入正式系统。\n\n更多人员开始使用，任务和版本增多，原来依靠个人补足的部分才暴露。权限不同、记录不完整、新旧方法混用，都会增加支持工作。机器学习系统的技术债研究指出，模型之外的依赖、反馈和维护也是长期负担的重要来源。[原始研究](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n因此，模型调用费很低，并不代表系统运行成本低。企业还需要安排资料更新、专业评价、工程支持和业务配合。如果这些工作长期由专家加班承担，成本只是没有出现在同一张账里。\n\n## 维护怎样进入一项真实的经营安排\n\n[设备售后教学案例](#case-c)假设新安排每月需要6000元AI与FDE维护费用。企业应知道这笔费用具体支持什么：新版本的方法检查、复访原因整理、派工准备修订，还是工具与状态的可靠运行。\n\n若减少一次可取消的外协复访能少付500元，那么每月减少12次才刚好覆盖这6000元。实际效果也可以包含专业容量和客户体验，但应分别说明，不能仅凭“系统需要维护”就认为任何费用都合理。\n\n维护还有优先顺序。影响当前正式报价的价格错误，应优先处理；低频功能的小改进可以排后。每次业务变化，也不必重测全部系统。先知道它会影响哪种行为，再选择相关任务核对，才能控制负担。\n\n## 哪些积累能帮助企业跨过下一次变化\n\n保留可追溯原件、清楚的业务状态、代表任务、方法适用条件和内部理解，可以减少换模型或换团队时重新解释背景的成本。它们使企业能够检查新方案，而不是完全依赖供应商说“已经升级”。\n\n技术互补投入研究将流程、组织和人员建设与技术发挥作用联系起来。[研究记录](https://www.nber.org/papers/w25148) 这些投入应有实际用途，例如让新人员接任、让新版本能被识别、让旧方法能够停用，而不只是以“长期资产”为名不断积累文件。\n\n业务稳定以后，也可以减少高强度驻场，删除低价值复杂功能，把成熟部分交给常规维护。持续运行的目标是保持有效能力，并及时改变已经不合适的部分。能保留、能修订、也能撤掉，才是一套可以长期经营的系统。\n","exportSingleMd":"# 第22章｜上线以后，哪些变化会让原来的好系统逐渐失效\n\n设备服务系统上线时，团队主要处理V1版本，知识库和检查方法也围绕这一版本建立。几个月后客户开始使用V2，界面仍能正常打开，AI仍然流畅回答，但旧方法的适用条件已经变化。\n\n类似情况也会发生在报价和内容业务：供应商改变交期，旧承诺仍被搜索出来；客户更新产品，草稿仍使用旧性能；原负责人离开，一些靠他临时处理的例外突然无人接住。系统没有明显故障，工作却可能逐渐失效。\n\n## 业务变化会沿着几处同时传播\n\n新设备版本首先影响经验能否继续使用，也可能影响备件、查询方式和专业支持。若只是把新说明书上传，却没有改变旧方法的默认推荐，接任者仍可能先看到旧答案。\n\n价格更新则不仅影响下一份报价，还可能影响已经在准备、尚未确认的业务。企业需要明确新价格从何时生效、哪些在途任务应重新核对。维护由此不只是修改一张表，而是使相关工作使用正确条件。\n\n换模型也有类似问题。新模型可能写得更流畅，却改变工具选择、引用或停止行为。需要用原系统承担的代表任务比较，观察重要能力是否保留。升级演示只能说明它能完成演示中的任务，不能替代本企业工作检查。\n\n## 为什么扩大使用后，维护负担才变得明显\n\n原型通常由熟悉背景的人照看。材料缺一点，他会补；输出含糊，他知道怎么理解；某个工具失败，他会手动处理。许多条件因此没有进入正式系统。\n\n更多人员开始使用，任务和版本增多，原来依靠个人补足的部分才暴露。权限不同、记录不完整、新旧方法混用，都会增加支持工作。机器学习系统的技术债研究指出，模型之外的依赖、反馈和维护也是长期负担的重要来源。[原始研究](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n因此，模型调用费很低，并不代表系统运行成本低。企业还需要安排资料更新、专业评价、工程支持和业务配合。如果这些工作长期由专家加班承担，成本只是没有出现在同一张账里。\n\n## 维护怎样进入一项真实的经营安排\n\n[设备售后教学案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-c)假设新安排每月需要6000元AI与FDE维护费用。企业应知道这笔费用具体支持什么：新版本的方法检查、复访原因整理、派工准备修订，还是工具与状态的可靠运行。\n\n若减少一次可取消的外协复访能少付500元，那么每月减少12次才刚好覆盖这6000元。实际效果也可以包含专业容量和客户体验，但应分别说明，不能仅凭“系统需要维护”就认为任何费用都合理。\n\n维护还有优先顺序。影响当前正式报价的价格错误，应优先处理；低频功能的小改进可以排后。每次业务变化，也不必重测全部系统。先知道它会影响哪种行为，再选择相关任务核对，才能控制负担。\n\n## 哪些积累能帮助企业跨过下一次变化\n\n保留可追溯原件、清楚的业务状态、代表任务、方法适用条件和内部理解，可以减少换模型或换团队时重新解释背景的成本。它们使企业能够检查新方案，而不是完全依赖供应商说“已经升级”。\n\n技术互补投入研究将流程、组织和人员建设与技术发挥作用联系起来。[研究记录](https://www.nber.org/papers/w25148) 这些投入应有实际用途，例如让新人员接任、让新版本能被识别、让旧方法能够停用，而不只是以“长期资产”为名不断积累文件。\n\n业务稳定以后，也可以减少高强度驻场，删除低价值复杂功能，把成熟部分交给常规维护。持续运行的目标是保持有效能力，并及时改变已经不合适的部分。能保留、能修订、也能撤掉，才是一套可以长期经营的系统。\n","text":"# 第22章｜上线以后，哪些变化会让原来的好系统逐渐失效\n\n设备服务系统上线时，团队主要处理V1版本，知识库和检查方法也围绕这一版本建立。几个月后客户开始使用V2，界面仍能正常打开，AI仍然流畅回答，但旧方法的适用条件已经变化。\n\n类似情况也会发生在报价和内容业务：供应商改变交期，旧承诺仍被搜索出来；客户更新产品，草稿仍使用旧性能；原负责人离开，一些靠他临时处理的例外突然无人接住。系统没有明显故障，工作却可能逐渐失效。\n\n## 业务变化会沿着几处同时传播\n\n新设备版本首先影响经验能否继续使用，也可能影响备件、查询方式和专业支持。若只是把新说明书上传，却没有改变旧方法的默认推荐，接任者仍可能先看到旧答案。\n\n价格更新则不仅影响下一份报价，还可能影响已经在准备、尚未确认的业务。企业需要明确新价格从何时生效、哪些在途任务应重新核对。维护由此不只是修改一张表，而是使相关工作使用正确条件。\n\n换模型也有类似问题。新模型可能写得更流畅，却改变工具选择、引用或停止行为。需要用原系统承担的代表任务比较，观察重要能力是否保留。升级演示只能说明它能完成演示中的任务，不能替代本企业工作检查。\n\n## 为什么扩大使用后，维护负担才变得明显\n\n原型通常由熟悉背景的人照看。材料缺一点，他会补；输出含糊，他知道怎么理解；某个工具失败，他会手动处理。许多条件因此没有进入正式系统。\n\n更多人员开始使用，任务和版本增多，原来依靠个人补足的部分才暴露。权限不同、记录不完整、新旧方法混用，都会增加支持工作。机器学习系统的技术债研究指出，模型之外的依赖、反馈和维护也是长期负担的重要来源。原始研究\n\n因此，模型调用费很低，并不代表系统运行成本低。企业还需要安排资料更新、专业评价、工程支持和业务配合。如果这些工作长期由专家加班承担，成本只是没有出现在同一张账里。\n\n## 维护怎样进入一项真实的经营安排\n\n设备售后教学案例假设新安排每月需要6000元AI与FDE维护费用。企业应知道这笔费用具体支持什么：新版本的方法检查、复访原因整理、派工准备修订，还是工具与状态的可靠运行。\n\n若减少一次可取消的外协复访能少付500元，那么每月减少12次才刚好覆盖这6000元。实际效果也可以包含专业容量和客户体验，但应分别说明，不能仅凭“系统需要维护”就认为任何费用都合理。\n\n维护还有优先顺序。影响当前正式报价的价格错误，应优先处理；低频功能的小改进可以排后。每次业务变化，也不必重测全部系统。先知道它会影响哪种行为，再选择相关任务核对，才能控制负担。\n\n## 哪些积累能帮助企业跨过下一次变化\n\n保留可追溯原件、清楚的业务状态、代表任务、方法适用条件和内部理解，可以减少换模型或换团队时重新解释背景的成本。它们使企业能够检查新方案，而不是完全依赖供应商说“已经升级”。\n\n技术互补投入研究将流程、组织和人员建设与技术发挥作用联系起来。研究记录 这些投入应有实际用途，例如让新人员接任、让新版本能被识别、让旧方法能够停用，而不只是以“长期资产”为名不断积累文件。\n\n业务稳定以后，也可以减少高强度驻场，删除低价值复杂功能，把成熟部分交给常规维护。持续运行的目标是保持有效能力，并及时改变已经不合适的部分。能保留、能修订、也能撤掉，才是一套可以长期经营的系统。\n"},{"file":"23-token与智能资源.md","id":"lesson-23","number":23,"role":"核心课","part":4,"title":"第23章｜经营智能资源，为什么不能只盯token账单","md":"# 第23章｜经营智能资源，为什么不能只盯token账单\n\n两家经销商使用同一个模型、支付相近的调用费用。一家将客户原件、现行库存、专业判断和结果关联起来；另一家仍由销售在个人聊天里反复复制材料，错误改完以后也只留在当事人手中。\n\n第一家处理下一笔询价时，可以少做部分准备，并避免一些已经发现的错误。第二家可能仍然从头解释。它们购买的通用供给相近，最终形成的工作能力却逐渐不同。智能资源的经营问题，就在这种转换过程中出现。\n\n## token是什么，为什么它还不是企业收益\n\ntoken是模型处理输入和输出的计量单位，可以对应字词或文本片段。它帮助计算使用量和费用，但不是一个固定的“智力单位”：相同数量的token，用于不同模型和任务，取得的结果可能不同。\n\n企业实际需要安排的是可使用的智能能力。某项任务需要什么能力，什么时候可用，允许等待多久，能否取得资料和使用工具，结果是否达到采用要求，都比单独的用量更接近生产问题。通用模型提供可复用能力，企业仍要接入自己的事实与条件。[基础模型研究](https://arxiv.org/abs/2108.07258v3)\n\n因此，把智能资源视为核心经营资源是有意义的，但不宜把累计消耗的token直接称为已形成的资产。调用会被消耗，企业是否留下价值，要看它完成了什么工作，以及这次工作如何影响当期和未来。\n\n## 一笔询价，怎样经历三层转换\n\n先看第一层。模型读取客户材料、比较产品说明、发现交期冲突，形成可以供人员使用的候选。这一层是从智能消耗到合格工作。若生成很多文字却需要专家全部重写，资源利用效果就不高。\n\n第二层是从工作到经营结果。候选需要经过技术确认、供应确认和客户选择，才可能成为订单；订单还要交付，才可能留下贡献。即使模型比较得很好，库存不足或客户不购买，结果也不会自动发生。\n\n第三层发生在任务结束以后。客户原要求、人员纠正、未成交理由和实际结果，如果能帮助下一次询价更快、更可靠，企业就开始留下可再用能力。它可能是方法、工具或共同认识，也需要维护和使用才能保持价值。\n\n![智能投入经合格工作、采用执行影响客户与经营结果；经验经整理和再用检验成为下一轮的方法与工具。](assets/23-智能资源的转换.svg)\n\n图中上方关注当期如何形成结果，下方关注本次经历怎样返回下一轮。两者有联系，但不能相互代替：一项当前有收益的工作未必留下长期能力，一次有价值的探索也未必马上产生订单。\n\n## 三层转换，应分别看什么\n\n对第一层，可以看合格任务数量、核验与返工、总资源投入。对第二层，看建议是否被采用、实际动作是否发生、客户是否购买和每单贡献。对第三层，则用新的任务或接任人员，观察旧积累是否减少了准备和错误。\n\n这些观察比“调用量增长了多少”更能帮助经营。用量上升可能意味着业务扩大，也可能是重复尝试和返工增加；用量下降可能意味着使用不足，也可能是方法更清楚、无效生成减少。要结合工作解释，数字才有意义。\n\n## 哪些东西值得成为企业自己的AI能力\n\n企业不必从头训练独有模型，才能形成自身特色。通用模型与企业的客户理解、专业方法、工具和生产网络结合，也可以形成难以简单复制的工作能力。\n\n例如，某日报价中的价格会过期，不能永久照搬；但遇到替代需求时先核使用条件、将交期与适配一起比较的方法，可能持续有用。一次备货数量会失效，识别供给限制并把门店反馈接回排产的能力，可以继续帮助新门店。\n\n这种能力的资产价值应由未来用途说明。谁会再用，能少做什么，条件变化后怎样更新，比文件数量或累计token更接近评价依据。\n\n## 资源有限时，先改善哪一层\n\n如果模型无法理解重要冲突，更适合的能力可能有价值；如果客户事实没有取得，应先改善资料；如果专家已经处理不过来，继续增加候选只会积压；如果客户不愿购买，则需要重新判断服务价值。\n\n经营智能资源，意味着能分清这些限制，并把下一笔投入放到会改变结果的地方。长期差距可能来自同样资源被怎样组织、怎样进入交付、怎样留下可再用经验，而不仅来自购买价格。\n","html":"\u003ch1>第23章｜经营智能资源，为什么不能只盯token账单\u003c/h1>\n\u003cp>两家经销商使用同一个模型、支付相近的调用费用。一家将客户原件、现行库存、专业判断和结果关联起来；另一家仍由销售在个人聊天里反复复制材料，错误改完以后也只留在当事人手中。\u003c/p>\n\u003cp>第一家处理下一笔询价时，可以少做部分准备，并避免一些已经发现的错误。第二家可能仍然从头解释。它们购买的通用供给相近，最终形成的工作能力却逐渐不同。智能资源的经营问题，就在这种转换过程中出现。\u003c/p>\n\u003ch2 id=\"lesson-23-section-1\">token是什么，为什么它还不是企业收益\u003c/h2>\n\u003cp>token是模型处理输入和输出的计量单位，可以对应字词或文本片段。它帮助计算使用量和费用，但不是一个固定的“智力单位”：相同数量的token，用于不同模型和任务，取得的结果可能不同。\u003c/p>\n\u003cp>企业实际需要安排的是可使用的智能能力。某项任务需要什么能力，什么时候可用，允许等待多久，能否取得资料和使用工具，结果是否达到采用要求，都比单独的用量更接近生产问题。通用模型提供可复用能力，企业仍要接入自己的事实与条件。\u003ca href=\"https://arxiv.org/abs/2108.07258v3\" target=\"_blank\" rel=\"noopener noreferrer\">基础模型研究\u003c/a>\u003c/p>\n\u003cp>因此，把智能资源视为核心经营资源是有意义的，但不宜把累计消耗的token直接称为已形成的资产。调用会被消耗，企业是否留下价值，要看它完成了什么工作，以及这次工作如何影响当期和未来。\u003c/p>\n\u003ch2 id=\"lesson-23-section-2\">一笔询价，怎样经历三层转换\u003c/h2>\n\u003cp>先看第一层。模型读取客户材料、比较产品说明、发现交期冲突，形成可以供人员使用的候选。这一层是从智能消耗到合格工作。若生成很多文字却需要专家全部重写，资源利用效果就不高。\u003c/p>\n\u003cp>第二层是从工作到经营结果。候选需要经过技术确认、供应确认和客户选择，才可能成为订单；订单还要交付，才可能留下贡献。即使模型比较得很好，库存不足或客户不购买，结果也不会自动发生。\u003c/p>\n\u003cp>第三层发生在任务结束以后。客户原要求、人员纠正、未成交理由和实际结果，如果能帮助下一次询价更快、更可靠，企业就开始留下可再用能力。它可能是方法、工具或共同认识，也需要维护和使用才能保持价值。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNjYwIiB2aWV3Qm94PSIwIDAgMzYwIDY2MCIgcm9sZT0iaW1nIj48dGl0bGU+5pm66IO95oCO5qC36L+b5YWl57uP6JClPC90aXRsZT48ZGVzYz7mipXlhaXnu4/lkIjmoLzlt6XkvZzjgIHph4fnlKjmiafooYzlvbHlk43lrqLmiLfnu5PmnpzvvJvlj6/nlKjnu4/pqozpnIDmlbTnkIblkozlho3nlKjmo4DpqozvvIzmiY3mlK/mjIHkuIvkuIDova7ku7vliqHjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjx tZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxOCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC13ZWlnaHQ9IjQwMCI+6L2uPC90ZXh0Pjx0ZXh0IHg9IjI0IiB5PSI2NDUiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxOCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7mr4/kuIDmrrXpg73pnIDopoHoh6rlt7HnmoTor4Hmja48L3RleHQ+PC9zdmc+\" alt=\"智能投入经合格工作、采用执行影响客户与经营结果；经验经整理和再用检验成为下一轮的方法与工具。\">\u003c/p>\n\u003cp>图中上方关注当期如何形成结果，下方关注本次经历怎样返回下一轮。两者有联系，但不能相互代替：一项当前有收益的工作未必留下长期能力，一次有价值的探索也未必马上产生订单。\u003c/p>\n\u003ch2 id=\"lesson-23-section-3\">三层转换，应分别看什么\u003c/h2>\n\u003cp>对第一层，可以看合格任务数量、核验与返工、总资源投入。对第二层，看建议是否被采用、实际动作是否发生、客户是否购买和每单贡献。对第三层，则用新的任务或接任人员，观察旧积累是否减少了准备和错误。\u003c/p>\n\u003cp>这些观察比“调用量增长了多少”更能帮助经营。用量上升可能意味着业务扩大，也可能是重复尝试和返工增加；用量下降可能意味着使用不足，也可能是方法更清楚、无效生成减少。要结合工作解释，数字才有意义。\u003c/p>\n\u003ch2 id=\"lesson-23-section-4\">哪些东西值得成为企业自己的AI能力\u003c/h2>\n\u003cp>企业不必从头训练独有模型，才能形成自身特色。通用模型与企业的客户理解、专业方法、工具和生产网络结合，也可以形成难以简单复制的工作能力。\u003c/p>\n\u003cp>例如，某日报价中的价格会过期，不能永久照搬；但遇到替代需求时先核使用条件、将交期与适配一起比较的方法，可能持续有用。一次备货数量会失效，识别供给限制并把门店反馈接回排产的能力，可以继续帮助新门店。\u003c/p>\n\u003cp>这种能力的资产价值应由未来用途说明。谁会再用，能少做什么，条件变化后怎样更新，比文件数量或累计token更接近评价依据。\u003c/p>\n\u003ch2 id=\"lesson-23-section-5\">资源有限时，先改善哪一层\u003c/h2>\n\u003cp>如果模型无法理解重要冲突，更适合的能力可能有价值；如果客户事实没有取得，应先改善资料；如果专家已经处理不过来，继续增加候选只会积压；如果客户不愿购买，则需要重新判断服务价值。\u003c/p>\n\u003cp>经营智能资源，意味着能分清这些限制，并把下一笔投入放到会改变结果的地方。长期差距可能来自同样资源被怎样组织、怎样进入交付、怎样留下可再用经验，而不仅来自购买价格。\u003c/p>\n","headings":[{"id":"lesson-23-section-1","label":"token是什么，为什么它还不是企业收益"},{"id":"lesson-23-section-2","label":"一笔询价，怎样经历三层转换"},{"id":"lesson-23-section-3","label":"三层转换，应分别看什么"},{"id":"lesson-23-section-4","label":"哪些东西值得成为企业自己的AI能力"},{"id":"lesson-23-section-5","label":"资源有限时，先改善哪一层"}],"exportMd":"# 第23章｜经营智能资源，为什么不能只盯token账单\n\n两家经销商使用同一个模型、支付相近的调用费用。一家将客户原件、现行库存、专业判断和结果关联起来；另一家仍由销售在个人聊天里反复复制材料，错误改完以后也只留在当事人手中。\n\n第一家处理下一笔询价时，可以少做部分准备，并避免一些已经发现的错误。第二家可能仍然从头解释。它们购买的通用供给相近，最终形成的工作能力却逐渐不同。智能资源的经营问题，就在这种转换过程中出现。\n\n## token是什么，为什么它还不是企业收益\n\ntoken是模型处理输入和输出的计量单位，可以对应字词或文本片段。它帮助计算使用量和费用，但不是一个固定的“智力单位”：相同数量的token，用于不同模型和任务，取得的结果可能不同。\n\n企业实际需要安排的是可使用的智能能力。某项任务需要什么能力，什么时候可用，允许等待多久，能否取得资料和使用工具，结果是否达到采用要求，都比单独的用量更接近生产问题。通用模型提供可复用能力，企业仍要接入自己的事实与条件。[基础模型研究](https://arxiv.org/abs/2108.07258v3)\n\n因此，把智能资源视为核心经营资源是有意义的，但不宜把累计消耗的token直接称为已形成的资产。调用会被消耗，企业是否留下价值，要看它完成了什么工作，以及这次工作如何影响当期和未来。\n\n## 一笔询价，怎样经历三层转换\n\n先看第一层。模型读取客户材料、比较产品说明、发现交期冲突，形成可以供人员使用的候选。这一层是从智能消耗到合格工作。若生成很多文字却需要专家全部重写，资源利用效果就不高。\n\n第二层是从工作到经营结果。候选需要经过技术确认、供应确认和客户选择，才可能成为订单；订单还要交付，才可能留下贡献。即使模型比较得很好，库存不足或客户不购买，结果也不会自动发生。\n\n第三层发生在任务结束以后。客户原要求、人员纠正、未成交理由和实际结果，如果能帮助下一次询价更快、更可靠，企业就开始留下可再用能力。它可能是方法、工具或共同认识，也需要维护和使用才能保持价值。\n\n![智能投入经合格工作、采用执行影响客户与经营结果；经验经整理和再用检验成为下一轮的方法与工具。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNjYwIiB2aWV3Qm94PSIwIDAgMzYwIDY2MCIgcm9sZT0iaW1nIj48dGl0bGU+5pm66IO95oCO5qC36L+b5YWl57uP6JClPC90aXRsZT48ZGVzYz7mipXlhaXnu4/lkIjmoLzlt6XkvZzjgIHph4fnlKjmiafooYzlvbHlk43lrqLmiLfnu5PmnpzvvJvlj6/nlKjnu4/pqozpnIDmlbTnkIblkozlho3nlKjmo4DpqozvvIzmiY3mlK/mjIHkuIvkuIDova7ku7vliqHjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjY2MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7mmbrog73mgI7moLfov5vlhaXnu4/okKU8L3RleHQ+PHBhdGggZD0iTTExOSA4MEgyNTVMMjcxIDk2VjE0MkgxMTlaIiBmaWxsPSJ3aGl0ZSIgc3Ryb2tlPSIjNjA3MzZjIiBzdHJva2Utd2lkdGg9IjEuNSIvPjxwY 少”更能帮助经营。用量上升可能意味着业务扩大，也可能是重复尝试和返工增加；用量下降可能意味着使用不足，也可能是方法更清楚、无效生成减少。要结合工作解释，数字才有意义。\n\n## 哪些东西值得成为企业自己的AI能力\n\n企业不必从头训练独有模型，才能形成自身特色。通用模型与企业的客户理解、专业方法、工具和生产网络结合，也可以形成难以简单复制的工作能力。\n\n例如，某日报价中的价格会过期，不能永久照搬；但遇到替代需求时先核使用条件、将交期与适配一起比较的方法，可能持续有用。一次备货数量会失效，识别供给限制并把门店反馈接回排产的能力，可以继续帮助新门店。\n\n这种能力的资产价值应由未来用途说明。谁会再用，能少做什么，条件变化后怎样更新，比文件数量或累计token更接近评价依据。\n\n## 资源有限时，先改善哪一层\n\n如果模型无法理解重要冲突，更适合的能力可能有价值；如果客户事实没有取得，应先改善资料；如果专家已经处理不过来，继续增加候选只会积压；如果客户不愿购买，则需要重新判断服务价值。\n\n经营智能资源，意味着能分清这些限制，并把下一笔投入放到会改变结果的地方。长期差距可能来自同样资源被怎样组织、怎样进入交付、怎样留下可再用经验，而不仅来自购买价格。\n","exportSingleMd":"# 第23章｜经营智能资源，为什么不能只盯token账单\n\n两家经销商使用同一个模型、支付相近的调用费用。一家将客户原件、现行库存、专业判断和结果关联起来；另一家仍由销售在个人聊天里反复复制材料，错误改完以后也只留在当事人手中。\n\n第一家处理下一笔询价时，可以少做部分准备，并避免一些已经发现的错误。第二家可能仍然从头解释。它们购买的通用供给相近，最终形成的工作能力却逐渐不同。智能资源的经营问题，就在这种转换过程中出现。\n\n## token是什么，为什么它还不是企业收益\n\ntoken是模型处理输入和输出的计量单位，可以对应字词或文本片段。它帮助计算使用量和费用，但不是一个固定的“智力单位”：相同数量的token，用于不同模型和任务，取得的结果可能不同。\n\n企业实际需要安排的是可使用的智能能力。某项任务需要什么能力，什么时候可用，允许等待多久，能否取得资料和使用工具，结果是否达到采用要求，都比单独的用量更接近生产问题。通用模型提供可复用能力，企业仍要接入自己的事实与条件。[基础模型研究](https://arxiv.org/abs/2108.07258v3)\n\n因此，把智能资源视为核心经营资源是有意义的，但不宜把累计消耗的token直接称为已形成的资产。调用会被消耗，企业是否留下价值，要看它完成了什么工作，以及这次工作如何影响当期和未来。\n\n## 一笔询价，怎样经历三层转换\n\n先看第一层。模型读取客户材料、比较产品说明、发现交期冲突，形成可以供人员使用的候选。这一层是从智能消耗到合格工作。若生成很多文字却需要专家全部重写，资源利用效果就不高。\n\n第二层是从工作到经营结果。候选需要经过技术确认、供应确认和客户选择，才可能成为订单；订单还要交付，才可能留下贡献。即使模型比较得很好，库存不足或客户不购买，结果也不会自动发生。\n\n第三层发生在任务结束以后。客户原要求、人员纠正、未成交理由和实际结果，如果能帮助下一次询价更快、更可靠，企业就开始留下可再用能力。它可能是方法、工具或共同认识，也需要维护和使用才能保持价值。\n\n![智能投入经合格工作、采用执行影响客户与经营结果；经验经整理和再用检验成为下一轮的方法与工具。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNjYwIiB2aWV3Qm94PSIwIDAgMzYwIDY2MCIgcm9sZT0iaW1nIj48dGl0bGU+5pm66IO95oCO5qC36L+b5YWl57uP6JClPC90aXRsZT48ZGVzYz7mipXlhaXnu4/lkIjmoLzlt6XkvZzjgIHph4fnlKjmiafooYzlvbHlk43lrqLmiLfnu5PmnpzvvJvlj6/nlKjnu4/pqozpnIDmlbTnkIblkozlho3nlKjmo4DpqozvvIzmiY3mlK/mjIHkuIvkuIDova7ku7vliqHjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1h 过技术确认、供应确认和客户选择，才可能成为订单；订单还要交付，才可能留下贡献。即使模型比较得很好，库存不足或客户不购买，结果也不会自动发生。\n\n第三层发生在任务结束以后。客户原要求、人员纠正、未成交理由和实际结果，如果能帮助下一次询价更快、更可靠，企业就开始留下可再用能力。它可能是方法、工具或共同认识，也需要维护和使用才能保持价值。\n\n \n\n图中上方关注当期如何形成结果，下方关注本次经历怎样返回下一轮。两者有联系，但不能相互代替：一项当前有收益的工作未必留下长期能力，一次有价值的探索也未必马上产生订单。\n\n## 三层转换，应分别看什么\n\n对第一层，可以看合格任务数量、核验与返工、总资源投入。对第二层，看建议是否被采用、实际动作是否发生、客户是否购买和每单贡献。对第三层，则用新的任务或接任人员，观察旧积累是否减少了准备和错误。\n\n这些观察比“调用量增长了多少”更能帮助经营。用量上升可能意味着业务扩大，也可能是重复尝试和返工增加；用量下降可能意味着使用不足，也可能是方法更清楚、无效生成减少。要结合工作解释，数字才有意义。\n\n## 哪些东西值得成为企业自己的AI能力\n\n企业不必从头训练独有模型，才能形成自身特色。通用模型与企业的客户理解、专业方法、工具和生产网络结合，也可以形成难以简单复制的工作能力。\n\n例如，某日报价中的价格会过期，不能永久照搬；但遇到替代需求时先核使用条件、将交期与适配一起比较的方法，可能持续有用。一次备货数量会失效，识别供给限制并把门店反馈接回排产的能力，可以继续帮助新门店。\n\n这种能力的资产价值应由未来用途说明。谁会再用，能少做什么，条件变化后怎样更新，比文件数量或累计token更接近评价依据。\n\n## 资源有限时，先改善哪一层\n\n如果模型无法理解重要冲突，更适合的能力可能有价值；如果客户事实没有取得，应先改善资料；如果专家已经处理不过来，继续增加候选只会积压；如果客户不愿购买，则需要重新判断服务价值。\n\n经营智能资源，意味着能分清这些限制，并把下一笔投入放到会改变结果的地方。长期差距可能来自同样资源被怎样组织、怎样进入交付、怎样留下可再用经验，而不仅来自购买价格。\n"},{"file":"24-任务与资源配置.md","id":"lesson-24","number":24,"role":"核心课","part":4,"title":"第24章｜多付一点智能费用，什么时候反而值得","md":"# 第24章｜多付一点智能费用，什么时候反而值得\n\n一家工业品经销商比较两种技术草稿方案。A方案每份模型费用0.4元，B方案1.2元。只看采购价格，B贵了三倍；工程师却认为B更值得用，因为核对和返工较少。\n\n这不是采购和工程谁更懂成本的问题，而是两个人暂时只看见了不同部分。要选择，就应把同一项合格工作需要的全部相关投入放在一起。\n\n## 先确定更强能力有没有机会改变结果\n\n[报价教学案例](案例B-智能资源成本.md)里，日期计算和现行价格查询较稳定，可以交给成熟程序。客户使用条件没有取得时，先需要补问；多个候选之间的适配比较做不好时，才可能需要更合适的模型或专业支持。\n\n这个顺序很重要。如果供应商还没确认是否有货，增加推理次数不能创造真实库存；如果模型已经形成可用候选，客户却没有采购需求，继续提高草稿质量也未必改变订单。加强智能的理由，应落在它能影响的那一段工作。\n\n## 用同等任务看多付的钱换回了什么\n\n案例提供一个独立的教学比较：两种方案处理同样1000份技术草稿，全部由人员复核，发现的错误都返工到相同最终标准。人工按每小时60元估价，即每分钟1元。\n\nA每份常规核验4分钟，另有20%的草稿需要多花10分钟返工。平均到每份，额外返工为2分钟，因此总共占6分钟。B每份常规核验2分钟，另有5%需要10分钟返工，平均额外0.5分钟，共2.5分钟。\n\nB每份多付0.8元模型费，却平均少占3.5分钟人员时间。按给定的时间估价，减少的负担超过新增模型费。这解释了为什么调用价格更高，完整工作反而可能更便宜。具体千份总账会在下一章展开。\n\n这种比较看的是“多投入一点，是否改变了足够多的工作”，也就是边际作用。它不支持贵模型总是更划算；换一种任务，节省时间可能很少，甚至需要更多核验。\n\n## 加强方案也可以来自更好的组织方式\n\n如果错误主要源于产品资料混乱，先整理现行版本可能比换模型更有效。如果专家反复查同一份依据，把依据放到草稿旁边可能减少核验。如果生成大量不合适候选，缩小任务范围和改善选择可能比继续生成更有用。\n\n因此，应把模型、资料组织、工具连接和人员支持作为可比较的安排。企业购买的是更好的任务结果，而不是某个单独参数的提升。\n\n测试时计算研究显示，在特定推理任务中，计算资源的配置效果与策略和难度有关。[原始研究](https://arxiv.org/abs/2408.03314) 对企业的启发是资源需要按任务配置；不能把数学题上的效果直接换算成订单回报。\n\n## 按难度分流，也会产生自己的成本\n\n假如B只对复杂适配有明显帮助，企业可以考虑让普通查询走低成本路径，复杂问题走加强路径。但谁来识别复杂问题？如果分类不准，困难任务被送到简单路径，会影响质量；大量普通任务被送到加强路径，又会浪费资源。\n\n分流还需要维护规则和处理例外。节省不多时，暂时统一采用一种可靠方案可能更合算。不能只算便宜路径少付了多少钱，却不算识别与支持工作。\n\n## 怎样形成一次可用的比较\n\n选择覆盖本企业常见情况和重要差别的材料，让原安排和加强安排按同一要求完成。记录重要错误、人员核验、返工和总时间；把用于反复调整的材料与最终检查材料分开，避免只对见过的题有效。\n\n之后再看释放的时间如何使用。若工资固定、没有可取消支出，时间估价下降不等于现金马上减少；若专家正是订单增长的瓶颈，少占的时间则可能支持更多有效交付。经营条件会改变对同一技术结果的评价。\n\n额外调用不再改善可采用结果时，就应该停止加码。资源配置的精细程度，最终来自企业知道自己的工作在哪里受限，而不是来自把每个任务都交给最强或最便宜的模型。\n","html":"\u003ch1>第24章｜多付一点智能费用，什么时候反而值得\u003c/h1>\n\u003cp>一家工业品经销商比较两种技术草稿方案。A方案每份模型费用0.4元，B方案1.2元。只看采购价格，B贵了三倍；工程师却认为B更值得用，因为核对和返工较少。\u003c/p>\n\u003cp>这不是采购和工程谁更懂成本的问题，而是两个人暂时只看见了不同部分。要选择，就应把同一项合格工作需要的全部相关投入放在一起。\u003c/p>\n\u003ch2 id=\"lesson-24-section-1\">先确定更强能力有没有机会改变结果\u003c/h2>\n\u003cp>\u003ca href=\"#case-b\">报价教学案例\u003c/a>里，日期计算和现行价格查询较稳定，可以交给成熟程序。客户使用条件没有取得时，先需要补问；多个候选之间的适配比较做不好时，才可能需要更合适的模型或专业支持。\u003c/p>\n\u003cp>这个顺序很重要。如果供应商还没确认是否有货，增加推理次数不能创造真实库存；如果模型已经形成可用候选，客户却没有采购需求，继续提高草稿质量也未必改变订单。加强智能的理由，应落在它能影响的那一段工作。\u003c/p>\n\u003ch2 id=\"lesson-24-section-2\">用同等任务看多付的钱换回了什么\u003c/h2>\n\u003cp>案例提供一个独立的教学比较：两种方案处理同样1000份技术草稿，全部由人员复核，发现的错误都返工到相同最终标准。人工按每小时60元估价，即每分钟1元。\u003c/p>\n\u003cp>A每份常规核验4分钟，另有20%的草稿需要多花10分钟返工。平均到每份，额外返工为2分钟，因此总共占6分钟。B每份常规核验2分钟，另有5%需要10分钟返工，平均额外0.5分钟，共2.5分钟。\u003c/p>\n\u003cp>B每份多付0.8元模型费，却平均少占3.5分钟人员时间。按给定的时间估价，减少的负担超过新增模型费。这解释了为什么调用价格更高，完整工作反而可能更便宜。具体千份总账会在下一章展开。\u003c/p>\n\u003cp>这种比较看的是“多投入一点，是否改变了足够多的工作”，也就是边际作用。它不支持贵模型总是更划算；换一种任务，节省时间可能很少，甚至需要更多核验。\u003c/p>\n\u003ch2 id=\"lesson-24-section-3\">加强方案也可以来自更好的组织方式\u003c/h2>\n\u003cp>如果错误主要源于产品资料混乱，先整理现行版本可能比换模型更有效。如果专家反复查同一份依据，把依据放到草稿旁边可能减少核验。如果生成大量不合适候选，缩小任务范围和改善选择可能比继续生成更有用。\u003c/p>\n\u003cp>因此，应把模型、资料组织、工具连接和人员支持作为可比较的安排。企业购买的是更好的任务结果，而不是某个单独参数的提升。\u003c/p>\n\u003cp>测试时计算研究显示，在特定推理任务中，计算资源的配置效果与策略和难度有关。\u003ca href=\"https://arxiv.org/abs/2408.03314\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a> 对企业的启发是资源需要按任务配置；不能把数学题上的效果直接换算成订单回报。\u003c/p>\n\u003ch2 id=\"lesson-24-section-4\">按难度分流，也会产生自己的成本\u003c/h2>\n\u003cp>假如B只对复杂适配有明显帮助，企业可以考虑让普通查询走低成本路径，复杂问题走加强路径。但谁来识别复杂问题？如果分类不准，困难任务被送到简单路径，会影响质量；大量普通任务被送到加强路径，又会浪费资源。\u003c/p>\n\u003cp>分流还需要维护规则和处理例外。节省不多时，暂时统一采用一种可靠方案可能更合算。不能只算便宜路径少付了多少钱，却不算识别与支持工作。\u003c/p>\n\u003ch2 id=\"lesson-24-section-5\">怎样形成一次可用的比较\u003c/h2>\n\u003cp>选择覆盖本企业常见情况和重要差别的材料，让原安排和加强安排按同一要求完成。记录重要错误、人员核验、返工和总时间；把用于反复调整的材料与最终检查材料分开，避免只对见过的题有效。\u003c/p>\n\u003cp>之后再看释放的时间如何使用。若工资固定、没有可取消支出，时间估价下降不等于现金马上减少；若专家正是订单增长的瓶颈，少占的时间则可能支持更多有效交付。经营条件会改变对同一技术结果的评价。\u003c/p>\n\u003cp>额外调用不再改善可采用结果时，就应该停止加码。资源配置的精细程度，最终来自企业知道自己的工作在哪里受限，而不是来自把每个任务都交给最强或最便宜的模型。\u003c/p>\n","headings":[{"id":"lesson-24-section-1","label":"先确定更强能力有没有机会改变结果"},{"id":"lesson-24-section-2","label":"用同等任务看多付的钱换回了什么"},{"id":"lesson-24-section-3","label":"加强方案也可以来自更好的组织方式"},{"id":"lesson-24-section-4","label":"按难度分流，也会产生自己的成本"},{"id":"lesson-24-section-5","label":"怎样形成一次可用的比较"}],"exportMd":"# 第24章｜多付一点智能费用，什么时候反而值得\n\n一家工业品经销商比较两种技术草稿方案。A方案每份模型费用0.4元，B方案1.2元。只看采购价格，B贵了三倍；工程师却认为B更值得用，因为核对和返工较少。\n\n这不是采购和工程谁更懂成本的问题，而是两个人暂时只看见了不同部分。要选择，就应把同一项合格工作需要的全部相关投入放在一起。\n\n## 先确定更强能力有没有机会改变结果\n\n[报价教学案例](#case-b)里，日期计算和现行价格查询较稳定，可以交给成熟程序。客户使用条件没有取得时，先需要补问；多个候选之间的适配比较做不好时，才可能需要更合适的模型或专业支持。\n\n这个顺序很重要。如果供应商还没确认是否有货，增加推理次数不能创造真实库存；如果模型已经形成可用候选，客户却没有采购需求，继续提高草稿质量也未必改变订单。加强智能的理由，应落在它能影响的那一段工作。\n\n## 用同等任务看多付的钱换回了什么\n\n案例提供一个独立的教学比较：两种方案处理同样1000份技术草稿，全部由人员复核，发现的错误都返工到相同最终标准。人工按每小时60元估价，即每分钟1元。\n\nA每份常规核验4分钟，另有20%的草稿需要多花10分钟返工。平均到每份，额外返工为2分钟，因此总共占6分钟。B每份常规核验2分钟，另有5%需要10分钟返工，平均额外0.5分钟，共2.5分钟。\n\nB每份多付0.8元模型费，却平均少占3.5分钟人员时间。按给定的时间估价，减少的负担超过新增模型费。这解释了为什么调用价格更高，完整工作反而可能更便宜。具体千份总账会在下一章展开。\n\n这种比较看的是“多投入一点，是否改变了足够多的工作”，也就是边际作用。它不支持贵模型总是更划算；换一种任务，节省时间可能很少，甚至需要更多核验。\n\n## 加强方案也可以来自更好的组织方式\n\n如果错误主要源于产品资料混乱，先整理现行版本可能比换模型更有效。如果专家反复查同一份依据，把依据放到草稿旁边可能减少核验。如果生成大量不合适候选，缩小任务范围和改善选择可能比继续生成更有用。\n\n因此，应把模型、资料组织、工具连接和人员支持作为可比较的安排。企业购买的是更好的任务结果，而不是某个单独参数的提升。\n\n测试时计算研究显示，在特定推理任务中，计算资源的配置效果与策略和难度有关。[原始研究](https://arxiv.org/abs/2408.03314) 对企业的启发是资源需要按任务配置；不能把数学题上的效果直接换算成订单回报。\n\n## 按难度分流，也会产生自己的成本\n\n假如B只对复杂适配有明显帮助，企业可以考虑让普通查询走低成本路径，复杂问题走加强路径。但谁来识别复杂问题？如果分类不准，困难任务被送到简单路径，会影响质量；大量普通任务被送到加强路径，又会浪费资源。\n\n分流还需要维护规则和处理例外。节省不多时，暂时统一采用一种可靠方案可能更合算。不能只算便宜路径少付了多少钱，却不算识别与支持工作。\n\n## 怎样形成一次可用的比较\n\n选择覆盖本企业常见情况和重要差别的材料，让原安排和加强安排按同一要求完成。记录重要错误、人员核验、返工和总时间；把用于反复调整的材料与最终检查材料分开，避免只对见过的题有效。\n\n之后再看释放的时间如何使用。若工资固定、没有可取消支出，时间估价下降不等于现金马上减少；若专家正是订单增长的瓶颈，少占的时间则可能支持更多有效交付。经营条件会改变对同一技术结果的评价。\n\n额外调用不再改善可采用结果时，就应该停止加码。资源配置的精细程度，最终来自企业知道自己的工作在哪里受限，而不是来自把每个任务都交给最强或最便宜的模型。\n","exportSingleMd":"# 第24章｜多付一点智能费用，什么时候反而值得\n\n一家工业品经销商比较两种技术草稿方案。A方案每份模型费用0.4元，B方案1.2元。只看采购价格，B贵了三倍；工程师却认为B更值得用，因为核对和返工较少。\n\n这不是采购和工程谁更懂成本的问题，而是两个人暂时只看见了不同部分。要选择，就应把同一项合格工作需要的全部相关投入放在一起。\n\n## 先确定更强能力有没有机会改变结果\n\n[报价教学案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-b)里，日期计算和现行价格查询较稳定，可以交给成熟程序。客户使用条件没有取得时，先需要补问；多个候选之间的适配比较做不好时，才可能需要更合适的模型或专业支持。\n\n这个顺序很重要。如果供应商还没确认是否有货，增加推理次数不能创造真实库存；如果模型已经形成可用候选，客户却没有采购需求，继续提高草稿质量也未必改变订单。加强智能的理由，应落在它能影响的那一段工作。\n\n## 用同等任务看多付的钱换回了什么\n\n案例提供一个独立的教学比较：两种方案处理同样1000份技术草稿，全部由人员复核，发现的错误都返工到相同最终标准。人工按每小时60元估价，即每分钟1元。\n\nA每份常规核验4分钟，另有20%的草稿需要多花10分钟返工。平均到每份，额外返工为2分钟，因此总共占6分钟。B每份常规核验2分钟，另有5%需要10分钟返工，平均额外0.5分钟，共2.5分钟。\n\nB每份多付0.8元模型费，却平均少占3.5分钟人员时间。按给定的时间估价，减少的负担超过新增模型费。这解释了为什么调用价格更高，完整工作反而可能更便宜。具体千份总账会在下一章展开。\n\n这种比较看的是“多投入一点，是否改变了足够多的工作”，也就是边际作用。它不支持贵模型总是更划算；换一种任务，节省时间可能很少，甚至需要更多核验。\n\n## 加强方案也可以来自更好的组织方式\n\n如果错误主要源于产品资料混乱，先整理现行版本可能比换模型更有效。如果专家反复查同一份依据，把依据放到草稿旁边可能减少核验。如果生成大量不合适候选，缩小任务范围和改善选择可能比继续生成更有用。\n\n因此，应把模型、资料组织、工具连接和人员支持作为可比较的安排。企业购买的是更好的任务结果，而不是某个单独参数的提升。\n\n测试时计算研究显示，在特定推理任务中，计算资源的配置效果与策略和难度有关。[原始研究](https://arxiv.org/abs/2408.03314) 对企业的启发是资源需要按任务配置；不能把数学题上的效果直接换算成订单回报。\n\n## 按难度分流，也会产生自己的成本\n\n假如B只对复杂适配有明显帮助，企业可以考虑让普通查询走低成本路径，复杂问题走加强路径。但谁来识别复杂问题？如果分类不准，困难任务被送到简单路径，会影响质量；大量普通任务被送到加强路径，又会浪费资源。\n\n分流还需要维护规则和处理例外。节省不多时，暂时统一采用一种可靠方案可能更合算。不能只算便宜路径少付了多少钱，却不算识别与支持工作。\n\n## 怎样形成一次可用的比较\n\n选择覆盖本企业常见情况和重要差别的材料，让原安排和加强安排按同一要求完成。记录重要错误、人员核验、返工和总时间；把用于反复调整的材料与最终检查材料分开，避免只对见过的题有效。\n\n之后再看释放的时间如何使用。若工资固定、没有可取消支出，时间估价下降不等于现金马上减少；若专家正是订单增长的瓶颈，少占的时间则可能支持更多有效交付。经营条件会改变对同一技术结果的评价。\n\n额外调用不再改善可采用结果时，就应该停止加码。资源配置的精细程度，最终来自企业知道自己的工作在哪里受限，而不是来自把每个任务都交给最强或最便宜的模型。\n","text":"# 第24章｜多付一点智能费用，什么时候反而值得\n\n一家工业品经销商比较两种技术草稿方案。A方案每份模型费用0.4元，B方案1.2元。只看采购价格，B贵了三倍；工程师却认为B更值得用，因为核对和返工较少。\n\n这不是采购和工程谁更懂成本的问题，而是两个人暂时只看见了不同部分。要选择，就应把同一项合格工作需要的全部相关投入放在一起。\n\n## 先确定更强能力有没有机会改变结果\n\n报价教学案例里，日期计算和现行价格查询较稳定，可以交给成熟程序。客户使用条件没有取得时，先需要补问；多个候选之间的适配比较做不好时，才可能需要更合适的模型或专业支持。\n\n这个顺序很重要。如果供应商还没确认是否有货，增加推理次数不能创造真实库存；如果模型已经形成可用候选，客户却没有采购需求，继续提高草稿质量也未必改变订单。加强智能的理由，应落在它能影响的那一段工作。\n\n## 用同等任务看多付的钱换回了什么\n\n案例提供一个独立的教学比较：两种方案处理同样1000份技术草稿，全部由人员复核，发现的错误都返工到相同最终标准。人工按每小时60元估价，即每分钟1元。\n\nA每份常规核验4分钟，另有20%的草稿需要多花10分钟返工。平均到每份，额外返工为2分钟，因此总共占6分钟。B每份常规核验2分钟，另有5%需要10分钟返工，平均额外0.5分钟，共2.5分钟。\n\nB每份多付0.8元模型费，却平均少占3.5分钟人员时间。按给定的时间估价，减少的负担超过新增模型费。这解释了为什么调用价格更高，完整工作反而可能更便宜。具体千份总账会在下一章展开。\n\n这种比较看的是“多投入一点，是否改变了足够多的工作”，也就是边际作用。它不支持贵模型总是更划算；换一种任务，节省时间可能很少，甚至需要更多核验。\n\n## 加强方案也可以来自更好的组织方式\n\n如果错误主要源于产品资料混乱，先整理现行版本可能比换模型更有效。如果专家反复查同一份依据，把依据放到草稿旁边可能减少核验。如果生成大量不合适候选，缩小任务范围和改善选择可能比继续生成更有用。\n\n因此，应把模型、资料组织、工具连接和人员支持作为可比较的安排。企业购买的是更好的任务结果，而不是某个单独参数的提升。\n\n测试时计算研究显示，在特定推理任务中，计算资源的配置效果与策略和难度有关。原始研究 对企业的启发是资源需要按任务配置；不能把数学题上的效果直接换算成订单回报。\n\n## 按难度分流，也会产生自己的成本\n\n假如B只对复杂适配有明显帮助，企业可以考虑让普通查询走低成本路径，复杂问题走加强路径。但谁来识别复杂问题？如果分类不准，困难任务被送到简单路径，会影响质量；大量普通任务被送到加强路径，又会浪费资源。\n\n分流还需要维护规则和处理例外。节省不多时，暂时统一采用一种可靠方案可能更合算。不能只算便宜路径少付了多少钱，却不算识别与支持工作。\n\n## 怎样形成一次可用的比较\n\n选择覆盖本企业常见情况和重要差别的材料，让原安排和加强安排按同一要求完成。记录重要错误、人员核验、返工和总时间；把用于反复调整的材料与最终检查材料分开，避免只对见过的题有效。\n\n之后再看释放的时间如何使用。若工资固定、没有可取消支出，时间估价下降不等于现金马上减少；若专家正是订单增长的瓶颈，少占的时间则可能支持更多有效交付。经营条件会改变对同一技术结果的评价。\n\n额外调用不再改善可采用结果时，就应该停止加码。资源配置的精细程度，最终来自企业知道自己的工作在哪里受限，而不是来自把每个任务都交给最强或最便宜的模型。\n"},{"file":"25-产能与瓶颈.md","id":"lesson-25","number":25,"role":"核心课","part":4,"title":"第25章｜每天20份初稿，为什么仍然只能交4篇","md":"# 第25章｜每天20份初稿，为什么仍然只能交4篇\n\n一家为工业品牌制作产品文章的团队，用AI以后每天能够起草20份材料。负责人看到生成很快，想继续增加并行，争取一天40份。但客户收到的正式稿仍然只有4篇，而且等待越来越长。\n\n[工业品牌内容教学案例](案例D-专业服务.md)给出了原因：每篇都需要技术专家核验，专家每天只能为这项工作投入两小时，每篇30分钟，所以一天最多完成4篇。客户购买的是准确、可发布的交付，待核初稿还不能算完成。\n\n## 先看积压怎样一天一天形成\n\n假设开始时没有待核稿，每天20份进入，4份核验完成，也没有取消、返工或丢失。第一天结束还有16份；第二天又进20、出4，剩32份；第五天就积压80份。\n\n![每天20份进入、4份完成核验，待核积压在第1、2、5天增至16、32、80；增加上游生成没有改变下游瓶颈。](assets/25-生成与积压.svg)\n\n图中不断增加的是尚未完成的工作，不是可交付库存。等待期间客户要求和产品资料还可能变化，轮到核验时又要重新确认。上游生成越快，不一定使客户更快拿到稿件，反而可能增加管理和返工。\n\n把每天20份提高到40份，专家的两小时没有增加，交付上限仍是4篇。新的模型开支只让积压更快增长。这就是瓶颈的含义：某个环节的能力限制了整条交付链，其他环节单独加速，未必增加最终完成量。\n\n## 要改善瓶颈，先看专家在做什么\n\nFDE观察核验过程，发现专家不仅判断技术内容，还反复寻找产品说明、辨别型号和版本、检查适用场景，再改写错误。于是提出一个改法：生成前组织现行资料，核验时带上重要事实的依据和冲突，专家修订再用于下一轮。\n\n如果这些改变使每篇核验从30分钟减少到20分钟，且最终质量不降，同样两小时就能核6篇。增加的产能来自核验工作实际减少，而不是来自“系统已经接入知识库”这句话。是否真的少了十分钟，需要在同类任务中确认。\n\n案例进一步设定，每天生成8份更有针对性的候选，编辑在原有排题工时内选6份送专家，另2份明确终止，不进入待核队列。若仍把8份全部送审，就会每天新增2份积压；若筛选占用专家时间，也应从同样的两小时扣除，不能同时宣称核6篇。\n\n## 多交付两篇，怎样进入月度收益\n\n为便于比较，假设每月20个工作日，客户为每篇合格交付支付800元；配图等后续外部变动成本为每篇300元；每份初稿的模型费用2元。原有固定工资不变，改善方案另外每月支付8000元FDE费用。先假定客户确有120篇付费需求，后续制作也能接住。\n\n原安排每月生成400份、交付80篇。收入64000元，后续成本24000元，模型费800元，扣这些支出后留下39200元。若只把生成提高到每天40份，仍交80篇，模型费变成1600元，留下38400元，反而少800元。\n\n改善核验后，每月生成160份、交付120篇。收入96000元，后续成本36000元，模型费320元，再扣8000元FDE费用，留下51680元，比原来多12480元。\n\n| 月度安排 | 初稿数量 | 付费交付 | 扣除上述支出后留下 |\n|---|---:|---:|---:|\n| 原20稿、4篇核验/日 | 400份 | 80篇 | 39200元 |\n| 只把生成增加到40稿/日 | 800份 | 80篇 | 38400元 |\n| 改为8稿、6篇核验/日 | 160份 | 120篇 | 51680元 |\n\n这些金额用于方案比较，还没有扣原有固定工资等公司费用，不能称为净利润。它们说明的是：较少的生成量，如果进入更有效的交付链，也可能形成更好的经营结果。\n\n## 产能能增加，客户是否愿意购买还需单独判断\n\n如果客户只买80篇，改善方案仍承担8000元费用和320元模型费，按相同条件只留下31680元，比原来少7520元。释放产能不会自动创造需求。在这个算例中，每新增一篇付费交付留下500元，至少增加16篇才有正增量。\n\n核验改善以后，客户确认、配图或销售也可能成为新的限制。需要沿整条链继续观察，而不是把“每天核6篇”永久当成企业产能。\n\n排队研究中的Little关系在相应稳定条件下连接平均在制量、完成流量和停留时间。[原始摘要](https://pubsonline.informs.org/doi/abs/10.1287/opre.9.3.383) 例如独立的稳定系统每天完成4份、平均停留3天，则平均在制12份；前面20进4出的持续超载系统并不满足稳定前提，不能借公式算出一个固定等待天数。\n\n经营者要持续看的是客户需求、进入节奏和合格完成量能否匹配。AI的速度只有转化成整条链的能力，才会减少等待并增加有效交付。\n","html":"\u003ch1>第25章｜每天20份初稿，为什么仍然只能交4篇\u003c/h1>\n\u003cp>一家为工业品牌制作产品文章的团队，用AI以后每天能够起草20份材料。负责人看到生成很快，想继续增加并行，争取一天40份。但客户收到的正式稿仍然只有4篇，而且等待越来越长。\u003c/p>\n\u003cp>\u003ca href=\"#case-d\">工业品牌内容教学案例\u003c/a>给出了原因：每篇都需要技术专家核验，专家每天只能为这项工作投入两小时，每篇30分钟，所以一天最多完成4篇。客户购买的是准确、可发布的交付，待核初稿还不能算完成。\u003c/p>\n\u003ch2 id=\"lesson-25-section-1\">先看积压怎样一天一天形成\u003c/h2>\n\u003cp>假设开始时没有待核稿，每天20份进入，4份核验完成，也没有取消、返工或丢失。第一天结束还有16份；第二天又进20、出4，剩32份；第五天就积压80份。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTIwIiB2aWV3Qm94PSIwIDAgMzYwIDUyMCIgcm9sZT0iaW1nIj48dGl0bGU+55Sf5oiQ5aKe6ZW/77yM5b6F5qC45Lmf5aKe6ZW/PC90aXRsZT48ZGVzYz7mr4/ml6Xov5vlhaUyMOS7veOAgeWujOaIkDTku73vvIzotbflp4vml6Dnp6/ljovvvIzml6XmnKvlvoXmoLjliIbliKsxNuOAgTMy44CBODDku73jgILmlbDph4/lrojmgZLmlZnlrabnrpfkvovjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjUyMCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7nlJ/miJDlop7plb/vvIzlvoXmoLjkuZ/lop7plb88L3RleHQ+PHRleHQgeD0iMjQiIHk9IjgwIiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM1MjY4NWUiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjQwMCI+5pWZ5a2m5YGH6K6+IMK3IOWNleS9je+8muS7vTwvdGV4dD48cmVjdCB4PSIyNCIgeT0iMTAxIiB3aWR0aD0iMTM3IiBoZWlnaHQ9IjYxIiByeD0iNiIgZmlsbD0iI2VkZjNlZCIgc3Ryb2tlPSIjNjA3MzZjIiBzdHJva2Utd2lkdGg9IjEuNSIvPjx0ZXh0IHg9IjkyLjUiIHk9IjEzNy41IiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyMTM0MmYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSI0MDAiPuavj+W 变动成本为每篇300元；每份初稿的模型费用2元。原有固定工资不变，改善方案另外每月支付8000元FDE费用。先假定客户确有120篇付费需求，后续制作也能接住。\u003c/p>\n\u003cp>原安排每月生成400份、交付80篇。收入64000元，后续成本24000元，模型费800元，扣这些支出后留下39200元。若只把生成提高到每天40份，仍交80篇，模型费变成1600元，留下38400元，反而少800元。\u003c/p>\n\u003cp>改善核验后，每月生成160份、交付120篇。收入96000元，后续成本36000元，模型费320元，再扣8000元FDE费用，留下51680元，比原来多12480元。\u003c/p>\n\u003cdiv class=\"table-scroll table-wide\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>月度安排\u003c/th>\n\u003cth align=\"right\">初稿数量\u003c/th>\n\u003cth align=\"right\">付费交付\u003c/th>\n\u003cth align=\"right\">扣除上述支出后留下\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>原20稿、4篇核验/日\u003c/td>\n\u003ctd align=\"right\">400份\u003c/td>\n\u003ctd align=\"right\">80篇\u003c/td>\n\u003ctd align=\"right\">39200元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>只把生成增加到40稿/日\u003c/td>\n\u003ctd align=\"right\">800份\u003c/td>\n\u003ctd align=\"right\">80篇\u003c/td>\n\u003ctd align=\"right\">38400元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>改为8稿、6篇核验/日\u003c/td>\n\u003ctd align=\"right\">160份\u003c/td>\n\u003ctd align=\"right\">120篇\u003c/td>\n\u003ctd align=\"right\">51680元\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"table-hint\">表格可左右滑动查看\u003c/p>\n\u003cp>这些金额用于方案比较，还没有扣原有固定工资等公司费用，不能称为净利润。它们说明的是：较少的生成量，如果进入更有效的交付链，也可能形成更好的经营结果。\u003c/p>\n\u003ch2 id=\"lesson-25-section-4\">产能能增加，客户是否愿意购买还需单独判断\u003c/h2>\n\u003cp>如果客户只买80篇，改善方案仍承担8000元费用和320元模型费，按相同条件只留下31680元，比原来少7520元。释放产能不会自动创造需求。在这个算例中，每新增一篇付费交付留下500元，至少增加16篇才有正增量。\u003c/p>\n\u003cp>核验改善以后，客户确认、配图或销售也可能成为新的限制。需要沿整条链继续观察，而不是把“每天核6篇”永久当成企业产能。\u003c/p>\n\u003cp>排队研究中的Little关系在相应稳定条件下连接平均在制量、完成流量和停留时间。\u003ca href=\"https://pubsonline.informs.org/doi/abs/10.1287/opre.9.3.383\" target=\"_blank\" rel=\"noopener noreferrer\">原始摘要\u003c/a> 例如独立的稳定系统每天完成4份、平均停留3天，则平均在制12份；前面20进4出的持续超载系统并不满足稳定前提，不能借公式算出一个固定等待天数。\u003c/p>\n\u003cp>经营者要持续看的是客户需求、进入节奏和合格完成量能否匹配。AI的速度只有转化成整条链的能力，才会减少等待并增加有效交付。\u003c/p>\n","headings":[{"id":"lesson-25-section-1","label":"先看积压怎样一天一天形成"},{"id":"lesson-25-section-2","label":"要改善瓶颈，先看专家在做什么"},{"id":"lesson-25-section-3","label":"多交付两篇，怎样进入月度收益"},{"id":"lesson-25-section-4","label":"产能能增加，客户是否愿意购买还需单独判断"}],"exportMd":"# 第25章｜每天20份初稿，为什么仍然只能交4篇\n\n一家为工业品牌制作产品文章的团队，用AI以后每天能够起草20份材料。负责人看到生成很快，想继续增加并行，争取一天40份。但客户收到的正式稿仍然只有4篇，而且等待越来越长。\n\n[工业品牌内容教学案例](#case-d)给出了原因：每篇都需要技术专家核验，专家每天只能为这项工作投入两小时，每篇30分钟，所以一天最多完成4篇。客户购买的是准确、可发布的交付，待核初稿还不能算完成。\n\n## 先看积压怎样一天一天形成\n\n假设开始时没有待核稿，每天20份进入，4份核验完成，也没有取消、返工或丢失。第一天结束还有16份；第二天又进20、出4，剩32份；第五天就积压80份。\n\n![每天20份进入、4份完成核验，待核积压在第1、2、5天增至16、32、80；增加上游生成没有改变下游瓶颈。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTIwIiB2aWV3Qm94PSIwIDAgMzYwIDUyMCIgcm9sZT0iaW1nIj48dGl0bGU+55Sf5oiQ5aKe6ZW/77yM5b6F5qC45Lmf5aKe6ZW/PC90aXRsZT48ZGVzYz7mr4/ml6Xov5vlhaUyMOS7veOAgeWujOaIkDTku73vvIzotbflp4vml6Dnp6/ljovvvIzml6XmnKvlvoXmoLjliIbliKsxNuOAgTMy44CBODDku73jgILmlbDph4/lrojmgZLmlZnlrabnrpfkvovjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjUyMCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7nlJ/miJDlop7plb/vvIzlvoXmoLjkuZ/lop7plb88L3RleHQ+PHRleHQgeD0iMjQiIHk9IjgwIiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM1MjY4NWUiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjQwMCI+5pWZ5a2m5YGH6K6+IMK3IOWNleS9je+8muS7vTwvdGV4dD48cmVjdCB4PSIyNCIgeT0 同样的两小时扣除，不能同时宣称核6篇。\n\n## 多交付两篇，怎样进入月度收益\n\n为便于比较，假设每月20个工作日，客户为每篇合格交付支付800元；配图等后续外部变动成本为每篇300元；每份初稿的模型费用2元。原有固定工资不变，改善方案另外每月支付8000元FDE费用。先假定客户确有120篇付费需求，后续制作也能接住。\n\n原安排每月生成400份、交付80篇。收入64000元，后续成本24000元，模型费800元，扣这些支出后留下39200元。若只把生成提高到每天40份，仍交80篇，模型费变成1600元，留下38400元，反而少800元。\n\n改善核验后，每月生成160份、交付120篇。收入96000元，后续成本36000元，模型费320元，再扣8000元FDE费用，留下51680元，比原来多12480元。\n\n| 月度安排 | 初稿数量 | 付费交付 | 扣除上述支出后留下 |\n|---|---:|---:|---:|\n| 原20稿、4篇核验/日 | 400份 | 80篇 | 39200元 |\n| 只把生成增加到40稿/日 | 800份 | 80篇 | 38400元 |\n| 改为8稿、6篇核验/日 | 160份 | 120篇 | 51680元 |\n\n这些金额用于方案比较，还没有扣原有固定工资等公司费用，不能称为净利润。它们说明的是：较少的生成量，如果进入更有效的交付链，也可能形成更好的经营结果。\n\n## 产能能增加，客户是否愿意购买还需单独判断\n\n如果客户只买80篇，改善方案仍承担8000元费用和320元模型费，按相同条件只留下31680元，比原来少7520元。释放产能不会自动创造需求。在这个算例中，每新增一篇付费交付留下500元，至少增加16篇才有正增量。\n\n核验改善以后，客户确认、配图或销售也可能成为新的限制。需要沿整条链继续观察，而不是把“每天核6篇”永久当成企业产能。\n\n排队研究中的Little关系在相应稳定条件下连接平均在制量、完成流量和停留时间。[原始摘要](https://pubsonline.informs.org/doi/abs/10.1287/opre.9.3.383) 例如独立的稳定系统每天完成4份、平均停留3天，则平均在制12份；前面20进4出的持续超载系统并不满足稳定前提，不能借公式算出一个固定等待天数。\n\n经营者要持续看的是客户需求、进入节奏和合格完成量能否匹配。AI的速度只有转化成整条链的能力，才会减少等待并增加有效交付。\n","exportSingleMd":"# 第25章｜每天20份初稿，为什么仍然只能交4篇\n\n一家为工业品牌制作产品文章的团队，用AI以后每天能够起草20份材料。负责人看到生成很快，想继续增加并行，争取一天40份。但客户收到的正式稿仍然只有4篇，而且等待越来越长。\n\n[工业品牌内容教学案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-d)给出了原因：每篇都需要技术专家核验，专家每天只能为这项工作投入两小时，每篇30分钟，所以一天最多完成4篇。客户购买的是准确、可发布的交付，待核初稿还不能算完成。\n\n## 先看积压怎样一天一天形成\n\n假设开始时没有待核稿，每天20份进入，4份核验完成，也没有取消、返工或丢失。第一天结束还有16份；第二天又进20、出4，剩32份；第五天就积压80份。\n\n![每天20份进入、4份完成核验，待核积压在第1、2、5天增至16、32、80；增加上游生成没有改变下游瓶颈。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTIwIiB2aWV3Qm94PSIwIDAgMzYwIDUyMCIgcm9sZT0iaW1nIj48dGl0bGU+55Sf5oiQ5aKe6ZW/77yM5b6F5qC45Lmf5aKe6ZW/PC90aXRsZT48ZGVzYz7mr4/ml6Xov5vlhaUyMOS7veOAgeWujOaIkDTku73vvIzotbflp4vml6Dnp6/ljovvvIzml6XmnKvlvoXmoLjliIbliKsxNuOAgTMy44CBODDku73jgILmlbDph4/lrojmgZLmlZnlrabnrpfkvovjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdG dGYW5nIFNDLE1pY3Jvc29mdCBZYUhlaSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmaWxsPSIjMjEzNDJmIiB0ZXh0LWFuY2hvcj0iZW5kIiBmb250LXdlaWdodD0iNDAwIj44MDwvdGV4dD48dGV4dCB4PSIyNCIgeT0iNDk5IiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM4NzVkMjIiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjQwMCI+5oyB57ut6LaF6LSf6I2377yM5peg56iz5a6a5bmz5Z2H562J5b6FPC90ZXh0Pjwvc3ZnPg==)\n\n图中不断增加的是尚未完成的工作，不是可交付库存。等待期间客户要求和产品资料还可能变化，轮到核验时又要重新确认。上游生成越快，不一定使客户更快拿到稿件，反而可能增加管理和返工。\n\n把每天20份提高到40份，专家的两小时没有增加，交付上限仍是4篇。新的模型开支只让积压更快增长。这就是瓶颈的含义：某个环节的能力限制了整条交付链，其他环节单独加速，未必增加最终完成量。\n\n## 要改善瓶颈，先看专家在做什么\n\nFDE观察核验过程，发现专家不仅判断技术内容，还反复寻找产品说明、辨别型号和版本、检查适用场景，再改写错误。于是提出一个改法：生成前组织现行资料，核验时带上重要事实的依据和冲突，专家修订再用于下一轮。\n\n如果这些改变使每篇核验从30分钟减少到20分钟，且最终质量不降，同样两小时就能核6篇。增加的产能来自核验工作实际减少，而不是来自“系统已经接入知识库”这句话。是否真的少了十分钟，需要在同类任务中确认。\n\n案例进一步设定，每天生成8份更有针对性的候选，编辑在原有排题工时内选6份送专家，另2份明确终止，不进入待核队列。若仍把8份全部送审，就会每天新增2份积压；若筛选占用专家时间，也应从同样的两小时扣除，不能同时宣称核6篇。\n\n## 多交付两篇，怎样进入月度收益\n\n为便于比较，假设每月20个工作日，客户为每篇合格交付支付800元；配图等后续外部变动成本为每篇300元；每份初稿的模型费用2元。原有固定工资不变，改善方案另外每月支付8000元FDE费用。先假定客户确有120篇付费需求，后续制作也能接住。\n\n原安排每月生成400份、交付80篇。收入64000元，后续成本24000元，模型费800元，扣这些支出后留下39200元。若只把生成提高到每天40份，仍交80篇，模型费变成1600元，留下38400元，反而少800元。\n\n改善核验后，每月生成160份、交付120篇。收入96000元，后续成本36000元，模型费320元，再扣8000元FDE费用，留下51680元，比原来多12480元。\n\n| 月度安排 | 初稿数量 | 付费交付 | 扣除上述支出后留下 |\n|---|---:|---:|---:|\n| 原20稿、4篇核验/日 | 400份 | 80篇 | 39200元 |\n| 只把生成增加到40稿/日 | 800份 | 80篇 | 38400元 |\n| 改为8稿、6篇核验/日 | 160份 | 120篇 | 51680元 |\n\n这些金额用于方案比较，还没有扣原有固定工资等公司费用，不能称为净利润。它们说明的是：较少的生成量，如果进入更有效的交付链，也可能形成更好的经营结果。\n\n## 产能能增加，客户是否愿意购买还需单独判断\n\n如果客户只买80篇，改善方案仍承担8000元费用和320元模型费，按相同条件只留下31680元，比原来少7520元。释放产能不会自动创造需求。在这个算例中，每新增一篇付费交付留下500元，至少增加16篇才有正增量。\n\n核验改善以后，客户确认、配图或销售也可能成为新的限制。需要沿整条链继续观察，而不是把“每天核6篇”永久当成企业产能。\n\n排队研究中的Little关系在相应稳定条件下连接平均在制量、完成流量和停留时间。[原始摘要](https://pubsonline.informs.org/doi/abs/10.1287/opre.9.3.383) 例如独立的稳定系统每天完成4份、平均停留3天，则平均在制12份；前面20进4出的持续超载系统并不满足稳定前提，不能借公式算出一个固定等待天数。\n\n经营者要持续看的是客户需求、进入节奏和合格完成量能否匹配。AI的速度只有转化成整条链的能力，才会减少等待并增加有效交付。\n","text":"# 第25章｜每天20份初稿，为什么仍然只能交4篇\n\n一家为工业品牌制作产品文章的团队，用AI以后每天能够起草20份材料。负责人看到生成很快，想继续增加并行，争取一天40份。但客户收到的正式稿仍然只有4篇，而且等待越来越长。\n\n工业品牌内容教学案例给出了原因：每篇都需要技术专家核验，专家每天只能为这项工作投入两小时，每篇30分钟，所以一天最多完成4篇。客户购买的是准确、可发布的交付，待核初稿还不能算完成。\n\n## 先看积压怎样一天一天形成\n\n假设开始时没有待核稿，每天20份进入，4份核验完成，也没有取消、返工或丢失。第一天结束还有16份；第二天又进20、出4，剩32份；第五天就积压80份。\n\n \n\n图中不断增加的是尚未完成的工作，不是可交付库存。等待期间客户要求和产品资料还可能变化，轮到核验时又要重新确认。上游生成越快，不一定使客户更快拿到稿件，反而可能增加管理和返工。\n\n把每天20份提高到40份，专家的两小时没有增加，交付上限仍是4篇。新的模型开支只让积压更快增长。这就是瓶颈的含义：某个环节的能力限制了整条交付链，其他环节单独加速，未必增加最终完成量。\n\n## 要改善瓶颈，先看专家在做什么\n\nFDE观察核验过程，发现专家不仅判断技术内容，还反复寻找产品说明、辨别型号和版本、检查适用场景，再改写错误。于是提出一个改法：生成前组织现行资料，核验时带上重要事实的依据和冲突，专家修订再用于下一轮。\n\n如果这些改变使每篇核验从30分钟减少到20分钟，且最终质量不降，同样两小时就能核6篇。增加的产能来自核验工作实际减少，而不是来自“系统已经接入知识库”这句话。是否真的少了十分钟，需要在同类任务中确认。\n\n案例进一步设定，每天生成8份更有针对性的候选，编辑在原有排题工时内选6份送专家，另2份明确终止，不进入待核队列。若仍把8份全部送审，就会每天新增2份积压；若筛选占用专家时间，也应从同样的两小时扣除，不能同时宣称核6篇。\n\n## 多交付两篇，怎样进入月度收益\n\n为便于比较，假设每月20个工作日，客户为每篇合格交付支付800元；配图等后续外部变动成本为每篇300元；每份初稿的模型费用2元。原有固定工资不变，改善方案另外每月支付8000元FDE费用。先假定客户确有120篇付费需求，后续制作也能接住。\n\n原安排每月生成400份、交付80篇。收入64000元，后续成本24000元，模型费800元，扣这些支出后留下39200元。若只把生成提高到每天40份，仍交80篇，模型费变成1600元，留下38400元，反而少800元。\n\n改善核验后，每月生成160份、交付120篇。收入96000元，后续成本36000元，模型费320元，再扣8000元FDE费用，留下51680元，比原来多12480元。\n\n| 月度安排 | 初稿数量 | 付费交付 | 扣除上述支出后留下 |\n|---|---:|---:|---:|\n| 原20稿、4篇核验/日 | 400份 | 80篇 | 39200元 |\n| 只把生成增加到40稿/日 | 800份 | 80篇 | 38400元 |\n| 改为8稿、6篇核验/日 | 160份 | 120篇 | 51680元 |\n\n这些金额用于方案比较，还没有扣原有固定工资等公司费用，不能称为净利润。它们说明的是：较少的生成量，如果进入更有效的交付链，也可能形成更好的经营结果。\n\n## 产能能增加，客户是否愿意购买还需单独判断\n\n如果客户只买80篇，改善方案仍承担8000元费用和320元模型费，按相同条件只留下31680元，比原来少7520元。释放产能不会自动创造需求。在这个算例中，每新增一篇付费交付留下500元，至少增加16篇才有正增量。\n\n核验改善以后，客户确认、配图或销售也可能成为新的限制。需要沿整条链继续观察，而不是把“每天核6篇”永久当成企业产能。\n\n排队研究中的Little关系在相应稳定条件下连接平均在制量、完成流量和停留时间。原始摘要 例如独立的稳定系统每天完成4份、平均停留3天，则平均在制12份；前面20进4出的持续超载系统并不满足稳定前提，不能借公式算出一个固定等待天数。\n\n经营者要持续看的是客户需求、进入节奏和合格完成量能否匹配。AI的速度只有转化成整条链的能力，才会减少等待并增加有效交付。\n"},{"file":"26-完整成本与兑现.md","id":"lesson-26","number":26,"role":"核心课","part":4,"title":"第26章｜便宜的调用，为什么可能得到更贵的工作","md":"# 第26章｜便宜的调用，为什么可能得到更贵的工作\n\n企业采购模型时，调用费用可以直接从账单看到；专家为了查错花了多少时间，返工又占用了谁，通常散在不同岗位。若只按模型单价选择，便宜方案可能把成本转给人员。另一种相反的误判，是把少占用的每一分钟都当作已经省下的现金。\n\n要判断一项投入，需要先比较同等质量的完整任务，再追踪减少的工作如何变成现金、交付能力或其他用途。以下沿[工业品报价教学案例](案例B-智能资源成本.md)逐步算清这几层账。\n\n## 同样1000份技术草稿，先算完成它们要付出什么\n\n比较条件是：A、B处理同样的1000份材料，每份都由人复核；错误全部被发现，并返工到同样最终标准。人工时间按每小时60元估价，也就是每分钟1元。这是一张局部工作成本表，暂不包括建设、维护和业务成交。\n\n| 给定条件 | A方案 | B方案 |\n|---|---:|---:|\n| 每份模型费用 | 0.4元 | 1.2元 |\n| 每份常规复核 | 4分钟 | 2分钟 |\n| 需要额外返工的比例 | 20% | 5% |\n| 每份返工另需时间 | 10分钟 | 10分钟 |\n\nA的模型费为1000×0.4＝400元。常规复核1000份，每份4分钟，共4000分钟；另有200份需要返工，每份10分钟，共2000分钟。因此人员总时间6000分钟，即100小时，估价6000元，加模型费合计6400元。\n\nB的模型费为1200元。常规复核2000分钟，50份返工另需500分钟，总共2500分钟，约41.67小时，估价2500元。加模型费后合计3700元。\n\n![同等千份合格技术草稿中，A列示模型、复核与返工总负担6400元，B3700元；图未包含建设维护，也不等同现金。](assets/26-合格工作的成本.svg)\n\n图中B的模型支出更高，但人员负担减少更多：多付800元模型费，少占约58.33小时，总估价减少2700元。这个结论依赖同等最终质量。若B漏掉了重要错误，或者处理的是更容易的材料，就不能据此判断它更合算。\n\n## 少占时间以后，现金怎样才会减少\n\n如果工程师工资固定，完成任务快一些，不会自动少发工资。2700元因此是按时间估价得到的成本差，不是银行账户已经多出2700元。\n\n假设原来其中20小时需要外包，现在确实取消了这项采购，每小时少付60元，就少支出1200元。再扣B增加的800元模型费，现金改善为400元。剩余释放的时间可以用于更多报价、质量改进或减少过量工作，但要按实际用途说明，不能又全部计作取消支出。\n\n若专家本来处理不过来，释放时间可能支持更多有效订单；若没有新增需求，容量仍有价值，但不宜立刻换算成新增收入。同样一段时间，也不能同时算成省掉的工资和新业务收益，重复获得两次回报。\n\n## 整条报价业务是否值得投入，要另算一张账\n\n案例还设定每月1000笔有效询价，原来成交200单，每单扣除采购与变动履约支出后留下500元，共100000元。新安排每月需要FDE共建9000元、模型1200元、工具800元，共11000元。\n\n如果成交增加到220单，增加的20单留下10000元，仍不足覆盖11000元，新安排比原来少1000元。如果成交达到250单且每单贡献保持500元，增加的25000元扣费用后，净增14000元。多22单刚好覆盖费用，要超过这个数量才有正增量。\n\n若250单是靠降价取得，每单只留下400元，总贡献又回到100000元，扣新增11000元后比原来更少。这说明报价更快、订单更多、企业留下更多钱，是三项需要分别核实的变化。\n\n前面的草稿成本比较，回答内部应该采用哪种供给安排；这张月度账回答整条业务是否值得新增投入。月账已经包含模型和共建费用，不能把局部估价节省2700元再直接加上去，否则容易重复计算。\n\n## 一次性建设和未来能力也要有位置\n\n连锁烘焙案例另有一次接入投入6000元。假定正常条件下相对原安排每天增加640元，连续20天，则累计增加12800元，扣一次投入后为6800元。这只是条件算例，实际需求和执行不同，应使用实际结果替换。\n\n本轮留下的案例、工具和评价材料，如果以后减少准备和错误，可以说明其未来用途，但不能因为称为“资产”就先填一个没有依据的收益。技术互补投入和办公工作研究也提醒我们，技术使用、个人省时与组织重组需要分别观察。[互补投入研究](https://www.nber.org/papers/w25148)、[办公研究](https://arxiv.org/html/2504.11436v4)\n\n将当期工作负担、现金、业务贡献和未来能力分开，再说明它们如何相连，负责人才能知道为哪种结果付钱，以及哪些价值还需要后续兑现。\n","html":"\u003ch1>第26章｜便宜的调用，为什么可能得到更贵的工作\u003c/h1>\n\u003cp>企业采购模型时，调用费用可以直接从账单看到；专家为了查错花了多少时间，返工又占用了谁，通常散在不同岗位。若只按模型单价选择，便宜方案可能把成本转给人员。另一种相反的误判，是把少占用的每一分钟都当作已经省下的现金。\u003c/p>\n\u003cp>要判断一项投入，需要先比较同等质量的完整任务，再追踪减少的工作如何变成现金、交付能力或其他用途。以下沿\u003ca href=\"#case-b\">工业品报价教学案例\u003c/a>逐步算清这几层账。\u003c/p>\n\u003ch2 id=\"lesson-26-section-1\">同样1000份技术草稿，先算完成它们要付出什么\u003c/h2>\n\u003cp>比较条件是：A、B处理同样的1000份材料，每份都由人复核；错误全部被发现，并返工到同样最终标准。人工时间按每小时60元估价，也就是每分钟1元。这是一张局部工作成本表，暂不包括建设、维护和业务成交。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>给定条件\u003c/th>\n\u003cth align=\"right\">A方案\u003c/th>\n\u003cth align=\"right\">B方案\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>每份模型费用\u003c/td>\n\u003ctd align=\"right\">0.4元\u003c/td>\n\u003ctd align=\"right\">1.2元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>每份常规复核\u003c/td>\n\u003ctd align=\"right\">4分钟\u003c/td>\n\u003ctd align=\"right\">2分钟\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>需要额外返工的比例\u003c/td>\n\u003ctd align=\"right\">20%\u003c/td>\n\u003ctd align=\"right\">5%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>每份返工另需时间\u003c/td>\n\u003ctd align=\"right\">10分钟\u003c/td>\n\u003ctd align=\"right\">10分钟\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A的模型费为1000×0.4＝400元。常规复核1000份，每份4分钟，共4000分钟；另有200份需要返工，每份10分钟，共2000分钟。因此人员总时间6000分钟，即100小时，估价6000元，加模型费合计6400元。\u003c/p>\n\u003cp>B的模型费为1200元。常规复核2000分钟，50份返工另需500分钟，总共2500分钟，约41.67小时，估价2500元。加模型费后合计3700元。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNDMwIiB2aWV3Qm94PSIwIDAgMzYwIDQzMCIgcm9sZT0iaW1nIj48dGl0bGU+5q+U6L6D5ZCI5qC85bel5L2c55qE5oC76LSf5ouFPC90aXRsZT48ZGVzYz7lkIznrYnljYPpobnlkIjmoLzku7vliqHkuK3vvIxB5Li6NjQwMOWFg++8jELkuLozNzAw5YWD77yM5YyF5ZCr5qih5Z6L44CB5aSN5qC45LiO6L+U5bel5Lyw5Lu377yM5pyq5ZCr5bu66K6+57u05oqk44CCPC9kZXNjPjxkZWZzPjxtYXJrZXIgaWQ9ImFycm93IiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJl d2VpZ2h0PSI0MDAiPui/lOW3pTwvdGV4dD48dGV4dCB4PSIyNCIgeT0iNDA3IiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM4NzVkMjIiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjQwMCI+5YiX56S65Lyw5Lu3IOKJoCDoh6rliqjlhZHnjrDnmoTnjrDph5E8L3RleHQ+PC9zdmc+\" alt=\"同等千份合格技术草稿中，A列示模型、复核与返工总负担6400元，B3700元；图未包含建设维护，也不等同现金。\">\u003c/p>\n\u003cp>图中B的模型支出更高，但人员负担减少更多：多付800元模型费，少占约58.33小时，总估价减少2700元。这个结论依赖同等最终质量。若B漏掉了重要错误，或者处理的是更容易的材料，就不能据此判断它更合算。\u003c/p>\n\u003ch2 id=\"lesson-26-section-2\">少占时间以后，现金怎样才会减少\u003c/h2>\n\u003cp>如果工程师工资固定，完成任务快一些，不会自动少发工资。2700元因此是按时间估价得到的成本差，不是银行账户已经多出2700元。\u003c/p>\n\u003cp>假设原来其中20小时需要外包，现在确实取消了这项采购，每小时少付60元，就少支出1200元。再扣B增加的800元模型费，现金改善为400元。剩余释放的时间可以用于更多报价、质量改进或减少过量工作，但要按实际用途说明，不能又全部计作取消支出。\u003c/p>\n\u003cp>若专家本来处理不过来，释放时间可能支持更多有效订单；若没有新增需求，容量仍有价值，但不宜立刻换算成新增收入。同样一段时间，也不能同时算成省掉的工资和新业务收益，重复获得两次回报。\u003c/p>\n\u003ch2 id=\"lesson-26-section-3\">整条报价业务是否值得投入，要另算一张账\u003c/h2>\n\u003cp>案例还设定每月1000笔有效询价，原来成交200单，每单扣除采购与变动履约支出后留下500元，共100000元。新安排每月需要FDE共建9000元、模型1200元、工具800元，共11000元。\u003c/p>\n\u003cp>如果成交增加到220单，增加的20单留下10000元，仍不足覆盖11000元，新安排比原来少1000元。如果成交达到250单且每单贡献保持500元，增加的25000元扣费用后，净增14000元。多22单刚好覆盖费用，要超过这个数量才有正增量。\u003c/p>\n\u003cp>若250单是靠降价取得，每单只留下400元，总贡献又回到100000元，扣新增11000元后比原来更少。这说明报价更快、订单更多、企业留下更多钱，是三项需要分别核实的变化。\u003c/p>\n\u003cp>前面的草稿成本比较，回答内部应该采用哪种供给安排；这张月度账回答整条业务是否值得新增投入。月账已经包含模型和共建费用，不能把局部估价节省2700元再直接加上去，否则容易重复计算。\u003c/p>\n\u003ch2 id=\"lesson-26-section-4\">一次性建设和未来能力也要有位置\u003c/h2>\n\u003cp>连锁烘焙案例另有一次接入投入6000元。假定正常条件下相对原安排每天增加640元，连续20天，则累计增加12800元，扣一次投入后为6800元。这只是条件算例，实际需求和执行不同，应使用实际结果替换。\u003c/p>\n\u003cp>本轮留下的案例、工具和评价材料，如果以后减少准备和错误，可以说明其未来用途，但不能因为称为“资产”就先填一个没有依据的收益。技术互补投入和办公工作研究也提醒我们，技术使用、个人省时与组织重组需要分别观察。\u003ca href=\"https://www.nber.org/papers/w25148\" target=\"_blank\" rel=\"noopener noreferrer\">互补投入研究\u003c/a>、\u003ca href=\"https://arxiv.org/html/2504.11436v4\" target=\"_blank\" rel=\"noopener noreferrer\">办公研究\u003c/a>\u003c/p>\n\u003cp>将当期工作负担、现金、业务贡献和未来能力分开，再说明它们如何相连，负责人才能知道为哪种结果付钱，以及哪些价值还需要后续兑现。\u003c/p>\n","headings":[{"id":"lesson-26-section-1","label":"同样1000份技术草稿，先算完成它们要付出什么"},{"id":"lesson-26-section-2","label":"少占时间以后，现金怎样才会减少"},{"id":"lesson-26-section-3","label":"整条报价业务是否值得投入，要另算一张账"},{"id":"lesson-26-section-4","label":"一次性建设和未来能力也要有位置"}],"exportMd":"# 第26章｜便宜的调用，为什么可能得到更贵的工作\n\n企业采购模型时，调用费用可以直接从账单看到；专家为了查错花了多少时间，返工又占用了谁，通常散在不同岗位。若只按模型单价选择，便宜方案可能把成本转给人员。另一种相反的误判，是把少占用的每一分钟都当作已经省下的现金。\n\n要判断一项投入，需要先比较同等质量的完整任务，再追踪减少的工作如何变成现金、交付能力或其他用途。以下沿[工业品报价教学案例](#case-b)逐步算清这几层账。\n\n## 同样1000份技术草稿，先算完成它们要付出什么\n\n比较条件是：A、B处理同样的1000份材料，每份都由人复核；错误全部被发现，并返工到同样最终标准。人工时间按每小时60元估价，也就是每分钟1元。这是一张局部工作成本表，暂不包括建设、维护和业务成交。\n\n| 给定条件 | A方案 | B方案 |\n|---|---:|---:|\n| 每份模型费用 | 0.4元 | 1.2元 |\n| 每份常规复核 | 4分钟 | 2分钟 |\n| 需要额外返工的比例 | 20% | 5% |\n| 每份返工另需时间 | 10分钟 | 10分钟 |\n\nA的模型费为1000×0.4＝400元。常规复核1000份，每份4分钟，共4000分钟；另有200份需要返工，每份10分钟，共2000分钟。因此人员总时间6000分钟，即100小时，估价6000元，加模型费合计6400元。\n\nB的模型费为1200元。常规复核2000分钟，50份返工另需500分钟，总共2500分钟，约41.67小时，估价2500元。加模型费后合计3700元。\n\n![同等千份合格技术草稿中，A列示模型、复核与返工总负担6400元，B3700元；图未包含建设维护，也不等同现金。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNDMwIiB2aWV3Qm94PSIwIDAgMzYwIDQzMCIgcm9sZT0iaW1nIj48dGl0bGU+5q+U6L6D5ZCI5qC85bel5L2c55qE5oC76LSf5ouFPC90aXRsZT48ZGVzYz7lkIznrYnljYPpobnlkIjmoLzku7vliqHkuK3vvIxB5Li6NjQwMOWFg++8jELkuLozNzAw5YWD77yM5YyF5ZCr5qih5Z6L44CB5aSN5qC45LiO6L+U5bel5Lyw5Lu377yM5pyq5ZCr5bu66K6+57u05oqk44CCPC9kZXNjPjxkZWZzPjxtYXJrZXIgaWQ9ImFycm93IiB2aWV3Qm94PSIwIDAgMTAgMTAiIHJlZlg9IjkiIHJlZlk9IjUiIG1hcmtlcldpZHRoPSI3IiBtYXJrZXJIZWlnaHQ9IjciIG9yaWVudD0iYXV0by1zdGFydC1yZXZlcnNlIj48cGF0aCBkPSJNMCAwTDEwIDVMMCAxMHoiIGZpbGw9IiMxNjVkNTIiLz48L21hcmtlcj48cGF0dGVybiBpZD0idW5rbm93biIgd2lkdGg9IjgiIGhlaWdodD0iOCIgcGF0dGVyblVuaXRzPSJ1c2VyU3BhY2VPblVzZSI+PHBhdGggZD0iTS0yIDJMMiAtMk0wIDhMOCAwTTYgMTBMMTAgNiIgc3Ryb2tlPSIjODc1ZDIyIiBzdHJva2Utd2lkdGg9IjEuNSIvPjwvcGF0dGVybj48L2RlZnM+PHJlY3Qgd2lkdGg9IjM2MCIgaGVpZ2h0PSI0MzAiIHJ4PSI4IiBmaWxsPSIjZjZmOGYzIi8+PHRleHQgeD0iMjQiIHk9IjM5IiBmb250LWZhbWlse ，现在确实取消了这项采购，每小时少付60元，就少支出1200元。再扣B增加的800元模型费，现金改善为400元。剩余释放的时间可以用于更多报价、质量改进或减少过量工作，但要按实际用途说明，不能又全部计作取消支出。\n\n若专家本来处理不过来，释放时间可能支持更多有效订单；若没有新增需求，容量仍有价值，但不宜立刻换算成新增收入。同样一段时间，也不能同时算成省掉的工资和新业务收益，重复获得两次回报。\n\n## 整条报价业务是否值得投入，要另算一张账\n\n案例还设定每月1000笔有效询价，原来成交200单，每单扣除采购与变动履约支出后留下500元，共100000元。新安排每月需要FDE共建9000元、模型1200元、工具800元，共11000元。\n\n如果成交增加到220单，增加的20单留下10000元，仍不足覆盖11000元，新安排比原来少1000元。如果成交达到250单且每单贡献保持500元，增加的25000元扣费用后，净增14000元。多22单刚好覆盖费用，要超过这个数量才有正增量。\n\n若250单是靠降价取得，每单只留下400元，总贡献又回到100000元，扣新增11000元后比原来更少。这说明报价更快、订单更多、企业留下更多钱，是三项需要分别核实的变化。\n\n前面的草稿成本比较，回答内部应该采用哪种供给安排；这张月度账回答整条业务是否值得新增投入。月账已经包含模型和共建费用，不能把局部估价节省2700元再直接加上去，否则容易重复计算。\n\n## 一次性建设和未来能力也要有位置\n\n连锁烘焙案例另有一次接入投入6000元。假定正常条件下相对原安排每天增加640元，连续20天，则累计增加12800元，扣一次投入后为6800元。这只是条件算例，实际需求和执行不同，应使用实际结果替换。\n\n本轮留下的案例、工具和评价材料，如果以后减少准备和错误，可以说明其未来用途，但不能因为称为“资产”就先填一个没有依据的收益。技术互补投入和办公工作研究也提醒我们，技术使用、个人省时与组织重组需要分别观察。[互补投入研究](https://www.nber.org/papers/w25148)、[办公研究](https://arxiv.org/html/2504.11436v4)\n\n将当期工作负担、现金、业务贡献和未来能力分开，再说明它们如何相连，负责人才能知道为哪种结果付钱，以及哪些价值还需要后续兑现。\n","exportSingleMd":"# 第26章｜便宜的调用，为什么可能得到更贵的工作\n\n企业采购模型时，调用费用可以直接从账单看到；专家为了查错花了多少时间，返工又占用了谁，通常散在不同岗位。若只按模型单价选择，便宜方案可能把成本转给人员。另一种相反的误判，是把少占用的每一分钟都当作已经省下的现金。\n\n要判断一项投入，需要先比较同等质量的完整任务，再追踪减少的工作如何变成现金、交付能力或其他用途。以下沿[工业品报价教学案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-b)逐步算清这几层账。\n\n## 同样1000份技术草稿，先算完成它们要付出什么\n\n比较条件是：A、B处理同样的1000份材料，每份都由人复核；错误全部被发现，并返工到同样最终标准。人工时间按每小时60元估价，也就是每分钟1元。这是一张局部工作成本表，暂不包括建设、维护和业务成交。\n\n| 给定条件 | A方案 | B方案 |\n|---|---:|---:|\n| 每份模型费用 | 0.4元 | 1.2元 |\n| 每份常规复核 | 4分钟 | 2分钟 |\n| 需要额外返工的比例 | 20% | 5% |\n| 每份返工另需时间 | 10分钟 | 10分钟 |\n\nA的模型费为1000×0.4＝400元。常规复核1000份，每份4分钟，共4000分钟；另有200份需要返工，每份10分钟，共2000分钟。因此人员总时间6000分钟，即100小时，估价6000元，加模型费合计6400元。\n\nB的模型费为1200元。常规复核2000分钟，50份返工另需500分钟，总共2500分钟，约41.67小时，估价2500元。加模型费后合计3700元。\n\n![同等千份合格技术草稿中，A列示模型、复核与返工总负担6400元，B3700元；图未包含建设维护，也不等同现金。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNDMwIiB2aWV3Qm94PSIwIDAgMzYwIDQzMCIgcm9sZT0iaW1nI jQ2IiB5PSIzNTEiIHdpZHRoPSIxOCIgaGVpZ2h0PSIxOCIgcng9IjAiIGZpbGw9IiM4NzVkMjIiIHN0cm9rZT0iIzg3NWQyMiIgc3Ryb2tlLXdpZHRoPSIxLjUiLz48dGV4dCB4PSIyNzIiIHk9IjM2OCIgZm9udC1mYW1pbHk9IlBpbmdGYW5nIFNDLE1pY3Jvc29mdCBZYUhlaSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmaWxsPSIjMjEzNDJmIiB0ZXh0LWFuY2hvcj0ic3RhcnQiIGZvbnQtd2VpZ2h0PSI0MDAiPui/lOW3pTwvdGV4dD48dGV4dCB4PSIyNCIgeT0iNDA3IiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM4NzVkMjIiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjQwMCI+5YiX56S65Lyw5Lu3IOKJoCDoh6rliqjlhZHnjrDnmoTnjrDph5E8L3RleHQ+PC9zdmc+)\n\n图中B的模型支出更高，但人员负担减少更多：多付800元模型费，少占约58.33小时，总估价减少2700元。这个结论依赖同等最终质量。若B漏掉了重要错误，或者处理的是更容易的材料，就不能据此判断它更合算。\n\n## 少占时间以后，现金怎样才会减少\n\n如果工程师工资固定，完成任务快一些，不会自动少发工资。2700元因此是按时间估价得到的成本差，不是银行账户已经多出2700元。\n\n假设原来其中20小时需要外包，现在确实取消了这项采购，每小时少付60元，就少支出1200元。再扣B增加的800元模型费，现金改善为400元。剩余释放的时间可以用于更多报价、质量改进或减少过量工作，但要按实际用途说明，不能又全部计作取消支出。\n\n若专家本来处理不过来，释放时间可能支持更多有效订单；若没有新增需求，容量仍有价值，但不宜立刻换算成新增收入。同样一段时间，也不能同时算成省掉的工资和新业务收益，重复获得两次回报。\n\n## 整条报价业务是否值得投入，要另算一张账\n\n案例还设定每月1000笔有效询价，原来成交200单，每单扣除采购与变动履约支出后留下500元，共100000元。新安排每月需要FDE共建9000元、模型1200元、工具800元，共11000元。\n\n如果成交增加到220单，增加的20单留下10000元，仍不足覆盖11000元，新安排比原来少1000元。如果成交达到250单且每单贡献保持500元，增加的25000元扣费用后，净增14000元。多22单刚好覆盖费用，要超过这个数量才有正增量。\n\n若250单是靠降价取得，每单只留下400元，总贡献又回到100000元，扣新增11000元后比原来更少。这说明报价更快、订单更多、企业留下更多钱，是三项需要分别核实的变化。\n\n前面的草稿成本比较，回答内部应该采用哪种供给安排；这张月度账回答整条业务是否值得新增投入。月账已经包含模型和共建费用，不能把局部估价节省2700元再直接加上去，否则容易重复计算。\n\n## 一次性建设和未来能力也要有位置\n\n连锁烘焙案例另有一次接入投入6000元。假定正常条件下相对原安排每天增加640元，连续20天，则累计增加12800元，扣一次投入后为6800元。这只是条件算例，实际需求和执行不同，应使用实际结果替换。\n\n本轮留下的案例、工具和评价材料，如果以后减少准备和错误，可以说明其未来用途，但不能因为称为“资产”就先填一个没有依据的收益。技术互补投入和办公工作研究也提醒我们，技术使用、个人省时与组织重组需要分别观察。[互补投入研究](https://www.nber.org/papers/w25148)、[办公研究](https://arxiv.org/html/2504.11436v4)\n\n将当期工作负担、现金、业务贡献和未来能力分开，再说明它们如何相连，负责人才能知道为哪种结果付钱，以及哪些价值还需要后续兑现。\n","text":"# 第26章｜便宜的调用，为什么可能得到更贵的工作\n\n企业采购模型时，调用费用可以直接从账单看到；专家为了查错花了多少时间，返工又占用了谁，通常散在不同岗位。若只按模型单价选择，便宜方案可能把成本转给人员。另一种相反的误判，是把少占用的每一分钟都当作已经省下的现金。\n\n要判断一项投入，需要先比较同等质量的完整任务，再追踪减少的工作如何变成现金、交付能力或其他用途。以下沿工业品报价教学案例逐步算清这几层账。\n\n## 同样1000份技术草稿，先算完成它们要付出什么\n\n比较条件是：A、B处理同样的1000份材料，每份都由人复核；错误全部被发现，并返工到同样最终标准。人工时间按每小时60元估价，也就是每分钟1元。这是一张局部工作成本表，暂不包括建设、维护和业务成交。\n\n| 给定条件 | A方案 | B方案 |\n|---|---:|---:|\n| 每份模型费用 | 0.4元 | 1.2元 |\n| 每份常规复核 | 4分钟 | 2分钟 |\n| 需要额外返工的比例 | 20% | 5% |\n| 每份返工另需时间 | 10分钟 | 10分钟 |\n\nA的模型费为1000×0.4＝400元。常规复核1000份，每份4分钟，共4000分钟；另有200份需要返工，每份10分钟，共2000分钟。因此人员总时间6000分钟，即100小时，估价6000元，加模型费合计6400元。\n\nB的模型费为1200元。常规复核2000分钟，50份返工另需500分钟，总共2500分钟，约41.67小时，估价2500元。加模型费后合计3700元。\n\n \n\n图中B的模型支出更高，但人员负担减少更多：多付800元模型费，少占约58.33小时，总估价减少2700元。这个结论依赖同等最终质量。若B漏掉了重要错误，或者处理的是更容易的材料，就不能据此判断它更合算。\n\n## 少占时间以后，现金怎样才会减少\n\n如果工程师工资固定，完成任务快一些，不会自动少发工资。2700元因此是按时间估价得到的成本差，不是银行账户已经多出2700元。\n\n假设原来其中20小时需要外包，现在确实取消了这项采购，每小时少付60元，就少支出1200元。再扣B增加的800元模型费，现金改善为400元。剩余释放的时间可以用于更多报价、质量改进或减少过量工作，但要按实际用途说明，不能又全部计作取消支出。\n\n若专家本来处理不过来，释放时间可能支持更多有效订单；若没有新增需求，容量仍有价值，但不宜立刻换算成新增收入。同样一段时间，也不能同时算成省掉的工资和新业务收益，重复获得两次回报。\n\n## 整条报价业务是否值得投入，要另算一张账\n\n案例还设定每月1000笔有效询价，原来成交200单，每单扣除采购与变动履约支出后留下500元，共100000元。新安排每月需要FDE共建9000元、模型1200元、工具800元，共11000元。\n\n如果成交增加到220单，增加的20单留下10000元，仍不足覆盖11000元，新安排比原来少1000元。如果成交达到250单且每单贡献保持500元，增加的25000元扣费用后，净增14000元。多22单刚好覆盖费用，要超过这个数量才有正增量。\n\n若250单是靠降价取得，每单只留下400元，总贡献又回到100000元，扣新增11000元后比原来更少。这说明报价更快、订单更多、企业留下更多钱，是三项需要分别核实的变化。\n\n前面的草稿成本比较，回答内部应该采用哪种供给安排；这张月度账回答整条业务是否值得新增投入。月账已经包含模型和共建费用，不能把局部估价节省2700元再直接加上去，否则容易重复计算。\n\n## 一次性建设和未来能力也要有位置\n\n连锁烘焙案例另有一次接入投入6000元。假定正常条件下相对原安排每天增加640元，连续20天，则累计增加12800元，扣一次投入后为6800元。这只是条件算例，实际需求和执行不同，应使用实际结果替换。\n\n本轮留下的案例、工具和评价材料，如果以后减少准备和错误，可以说明其未来用途，但不能因为称为“资产”就先填一个没有依据的收益。技术互补投入和办公工作研究也提醒我们，技术使用、个人省时与组织重组需要分别观察。互补投入研究、办公研究\n\n将当期工作负担、现金、业务贡献和未来能力分开，再说明它们如何相连，负责人才能知道为哪种结果付钱，以及哪些价值还需要后续兑现。\n"},{"file":"27-能力留存.md","id":"lesson-27","number":27,"role":"核心课","part":4,"title":"第27章｜本轮智能消耗以后，什么值得留给企业","md":"# 第27章｜本轮智能消耗以后，什么值得留给企业\n\n一笔复杂报价完成，企业保存了客户材料、几十次AI回答和最终报价。一个月后，新销售遇到相似问题，却不知道从哪一段开始看，也分不清当时价格和供货承诺是否仍然有效。保存很多，并没有使下一次工作明显更容易。\n\n企业需要留下的，应从未来用途判断：哪些内容能够减少重复准备，帮助识别重要差别，或者使团队更快改变方法。智能被消耗以后，能够继续发挥作用的部分才值得持续经营。\n\n## 同一笔业务里，材料的未来用途不同\n\n在[工业品报价教学案例](案例B-智能资源成本.md)中，某日某型号的价格是历史事实，值得用于追查当时决定，却不应成为今天报价的默认依据。与之相比，遇到替代要求先核使用条件和期限的方法，可能继续帮助新询价。\n\n被否决方案的理由也有用途。例如某型号因十天货期而不适合本次三天要求，并不意味着它永远不能推荐。保留这个条件，下一次允许较长交期时，团队就能重新考虑。若只留下“不可用”，经验反而限制了选择。\n\n同样，烘焙案例中的160/60是特定需求条件下的备货安排。更有长期用途的是怎样识别销量受到供给限制，怎样连接门店反馈、工坊排产与配送，再按结果修订。数量会改变，认识和比较的方法可以继续发展。\n\n## 除了内容，还有哪些东西会留下能力\n\n一套可靠的查询工具，可以使新任务不再重复连接现行库存；清楚的工单身份和业务状态，可以使不同人员接着工作；保留的代表任务，可以帮助以后更换模型时检查能力是否丢失。团队共同理解谁负责什么，也能减少重新协调。\n\n这些积累并不都表现为知识文章。资料适合解释，工具支持动作，代表任务支持比较，带教帮助人员形成实际判断。组织知识和吸收能力研究都提醒我们，能力存在于相关实践与使用中，不能仅用文件数衡量。[知识研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)、[吸收能力研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n因此，一项项目交付不应只问生成了多少内容，还要看这些内容、工具和人员认识怎样进入下一项工作。\n\n## 留存也需要选择，因为维护并不免费\n\n可以从三方面判断优先级：以后是否可能再用，是否影响重要决定，维持有效需要多少资源。低频但后果重要的版本差别，可能值得保留；变化很快的价格和库存，则更适合在使用时查询现行来源。\n\n如果某条经验无人使用，适用条件也无法解释，却不断占专家维护时间，可以停止主动推荐，退回历史材料。保留原始证据与让它继续作为当前方法，是不同决定。这样既不丢失过去，也不让过去持续误导现在。\n\n工具也一样。一个共享功能不断为旧场景增加例外，可能越来越难维护，应考虑拆分或替换。系统技术债研究指出，依赖和维护会累积负担。[原始研究](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf) “已经投入很多”不能自动成为继续维护的理由。\n\n## 用下一项工作验证，留下的东西有没有作用\n\n让新销售处理没见过的询价，看他是否更早确定缺项、取得现行事实；让接任技术员面对新版本，看他是否识别旧方法边界并取得支持；让新门店使用共同安排，看它是否少做基础准备，同时仍能认识当地需求。\n\n这些任务会暴露留存的实际价值。若仍然需要原作者从头解释，应追查缺的是背景、入口、工具还是方法。若已经能够顺利接续，就有更具体的依据说明企业能力得到了保留。\n\n企业自己的AI能力，可以建立在可更换的通用模型之上。它的特色体现在客户理解、方法、工具和协作如何组合，并持续影响工作。为本轮值得保留的部分说明谁会再用、怎样维护、如何知道有帮助，就比把所有输出都称为资产更有经营意义。\n","html":"\u003ch1>第27章｜本轮智能消耗以后，什么值得留给企业\u003c/h1>\n\u003cp>一笔复杂报价完成，企业保存了客户材料、几十次AI回答和最终报价。一个月后，新销售遇到相似问题，却不知道从哪一段开始看，也分不清当时价格和供货承诺是否仍然有效。保存很多，并没有使下一次工作明显更容易。\u003c/p>\n\u003cp>企业需要留下的，应从未来用途判断：哪些内容能够减少重复准备，帮助识别重要差别，或者使团队更快改变方法。智能被消耗以后，能够继续发挥作用的部分才值得持续经营。\u003c/p>\n\u003ch2 id=\"lesson-27-section-1\">同一笔业务里，材料的未来用途不同\u003c/h2>\n\u003cp>在\u003ca href=\"#case-b\">工业品报价教学案例\u003c/a>中，某日某型号的价格是历史事实，值得用于追查当时决定，却不应成为今天报价的默认依据。与之相比，遇到替代要求先核使用条件和期限的方 用途不同"},{"id":"lesson-27-section-2","label":"除了内容，还有哪些东西会留下能力"},{"id":"lesson-27-section-3","label":"留存也需要选择，因为维护并不免费"},{"id":"lesson-27-section-4","label":"用下一项工作验证，留下的东西有没有作用"}],"exportMd":"# 第27章｜本轮智能消耗以后，什么值得留给企业\n\n一笔复杂报价完成，企业保存了客户材料、几十次AI回答和最终报价。一个月后，新销售遇到相似问题，却不知道从哪一段开始看，也分不清当时价格和供货承诺是否仍然有效。保存很多，并没有使下一次工作明显更容易。\n\n企业需要留下的，应从未来用途判断：哪些内容能够减少重复准备，帮助识别重要差别，或者使团队更快改变方法。智能被消耗以后，能够继续发挥作用的部分才值得持续经营。\n\n## 同一笔业务里，材料的未来用途不同\n\n在[工业品报价教学案例](#case-b)中，某日某型号的价格是历史事实，值得用于追查当时决定，却不应成为今天报价的默认依据。与之相比，遇到替代要求先核使用条件和期限的方法，可能继续帮助新询价。\n\n被否决方案的理由也有用途。例如某型号因十天货期而不适合本次三天要求，并不意味着它永远不能推荐。保留这个条件，下一次允许较长交期时，团队就能重新考虑。若只留下“不可用”，经验反而限制了选择。\n\n同样，烘焙案例中的160/60是特定需求条件下的备货安排。更有长期用途的是怎样识别销量受到供给限制，怎样连接门店反馈、工坊排产与配送，再按结果修订。数量会改变，认识和比较的方法可以继续发展。\n\n## 除了内容，还有哪些东西会留下能力\n\n一套可靠的查询工具，可以使新任务不再重复连接现行库存；清楚的工单身份和业务状态，可以使不同人员接着工作；保留的代表任务，可以帮助以后更换模型时检查能力是否丢失。团队共同理解谁负责什么，也能减少重新协调。\n\n这些积累并不都表现为知识文章。资料适合解释，工具支持动作，代表任务支持比较，带教帮助人员形成实际判断。组织知识和吸收能力研究都提醒我们，能力存在于相关实践与使用中，不能仅用文件数衡量。[知识研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)、[吸收能力研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n因此，一项项目交付不应只问生成了多少内容，还要看这些内容、工具和人员认识怎样进入下一项工作。\n\n## 留存也需要选择，因为维护并不免费\n\n可以从三方面判断优先级：以后是否可能再用，是否影响重要决定，维持有效需要多少资源。低频但后果重要的版本差别，可能值得保留；变化很快的价格和库存，则更适合在使用时查询现行来源。\n\n如果某条经验无人使用，适用条件也无法解释，却不断占专家维护时间，可以停止主动推荐，退回历史材料。保留原始证据与让它继续作为当前方法，是不同决定。这样既不丢失过去，也不让过去持续误导现在。\n\n工具也一样。一个共享功能不断为旧场景增加例外，可能越来越难维护，应考虑拆分或替换。系统技术债研究指出，依赖和维护会累积负担。[原始研究](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf) “已经投入很多”不能自动成为继续维护的理由。\n\n## 用下一项工作验证，留下的东西有没有作用\n\n让新销售处理没见过的询价，看他是否更早确定缺项、取得现行事实；让接任技术员面对新版本，看他是否识别旧方法边界并取得支持；让新门店使用共同安排，看它是否少做基础准备，同时仍能认识当地需求。\n\n这些任务会暴露留存的实际价值。若仍然需要原作者从头解释，应追查缺的是背景、入口、工具还是方法。若已经能够顺利接续，就有更具体的依据说明企业能力得到了保留。\n\n企业自己的AI能力，可以建立在可更换的通用模型之上。它的特色体现在客户理解、方法、工具和协作如何组合，并持续影响工作。为本轮值得保留的部分说明谁会再用、怎样维护、如何知道有帮助，就比把所有输出都称为资产更有经营意义。\n","exportSingleMd":"# 第27章｜本轮智能消耗以后，什么值得留给企业\n\n一笔复杂报价完成，企业保存了客户材料、几十次AI回答和最终报价。一个月后，新销售遇到相似问题，却不知道从哪一段开始看，也分不清当时价格和供货承诺是否仍然有效。保存很多，并没有使下一次工作明显更容易。\n\n企业需要留下的，应从未来用途判断：哪些内容能够减少重复准备，帮助识别重要差别，或者使团队更快改变方法。智能被消耗以后，能够继续发挥作用的部分才值得持续经营。\n\n## 同一笔业务里，材料的未来用途不同\n\n在[工业品报价教学案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-b)中，某日某型号的价格是历史事实，值得用于追查当时决定，却不应成为今天报价的默认依据。与之相比，遇到替代要求先核使用条件和期限的方法，可能继续帮助新询价。\n\n被否决方案的理由也有用途。例如某型号因十天货期而不适合本次三天要求，并不意味着它永远不能推荐。保留这个条件，下一次允许较长交期时，团队就能重新考虑。若只留下“不可用”，经验反而限制了选择。\n\n同样，烘焙案例中的160/60是特定需求条件下的备货安排。更有长期用途的是怎样识别销量受到供给限制，怎样连接门店反馈、工坊排产与配送，再按结果修订。数量会改变，认识和比较的方法可以继续发展。\n\n## 除了内容，还有哪些东西会留下能力\n\n一套可靠的查询工具，可以使新任务不再重复连接现行库存；清楚的工单身份和业务状态，可以使不同人员接着工作；保留的代表任务，可以帮助以后更换模型时检查能力是否丢失。团队共同理解谁负责什么，也能减少重新协调。\n\n这些积累并不都表现为知识文章。资料适合解释，工具支持动作，代表任务支持比较，带教帮助人员形成实际判断。组织知识和吸收能力研究都提醒我们，能力存在于相关实践与使用中，不能仅用文件数衡量。[知识研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)、[吸收能力研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)\n\n因此，一项项目交付不应只问生成了多少内容，还要看这些内容、工具和人员认识怎样进入下一项工作。\n\n## 留存也需要选择，因为维护并不免费\n\n可以从三方面判断优先级：以后是否可能再用，是否影响重要决定，维持有效需要多少资源。低频但后果重要的版本差别，可能值得保留；变化很快的价格和库存，则更适合在使用时查询现行来源。\n\n如果某条经验无人使用，适用条件也无法解释，却不断占专家维护时间，可以停止主动推荐，退回历史材料。保留原始证据与让它继续作为当前方法，是不同决定。这样既不丢失过去，也不让过去持续误导现在。\n\n工具也一样。一个共享功能不断为旧场景增加例外，可能越来越难维护，应考虑拆分或替换。系统技术债研究指出，依赖和维护会累积负担。[原始研究](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf) “已经投入很多”不能自动成为继续维护的理由。\n\n## 用下一项工作验证，留下的东西有没有作用\n\n让新销售处理没见过的询价，看他是否更早确定缺项、取得现行事实；让接任技术员面对新版本，看他是否识别旧方法边界并取得支持；让新门店使用共同安排，看它是否少做基础准备，同时仍能认识当地需求。\n\n这些任务会暴露留存的实际价值。若仍然需要原作者从头解释，应追查缺的是背景、入口、工具还是方法。若已经能够顺利接续，就有更具体的依据说明企业能力得到了保留。\n\n企业自己的AI能力，可以建立在可更换的通用模型之上。它的特色体现在客户理解、方法、工具和协作如何组合，并持续影响工作。为本轮值得保留的部分说明谁会再用、怎样维护、如何知道有帮助，就比把所有输出都称为资产更有经营意义。\n","text":"# 第27章｜本轮智能消耗以后，什么值得留给企业\n\n一笔复杂报价完成，企业保存了客户材料、几十次AI回答和最终报价。一个月后，新销售遇到相似问题，却不知道从哪一段开始看，也分不清当时价格和供货承诺是否仍然有效。保存很多，并没有使下一次工作明显更容易。\n\n企业需要留下的，应从未来用途判断：哪些内容能够减少重复准备，帮助识别重要差别，或者使团队更快改变方法。智能被消耗以后，能够继续发挥作用的部分才值得持续经营。\n\n## 同一笔业务里，材料的未来用途不同\n\n在工业品报价教学案例中，某日某型号的价格是历史事实，值得用于追查当时决定，却不应成为今天报价的默认依据。与之相比，遇到替代要求先核使用条件和期限的方法，可能继续帮助新询价。\n\n被否决方案的理由也有用途。例如某型号因十天货期而不适合本次三天要求，并不意味着它永远不能推荐。保留这个条件，下一次允许较长交期时，团队就能重新考虑。若只留下“不可用”，经验反而限制了选择。\n\n同样，烘焙案例中的160/60是特定需求条件下的备货安排。更有长期用途的是怎样识别销量受到供给限制，怎样连接门店反馈、工坊排产与配送，再按结果修订。数量会改变，认识和比较的方法可以继续发展。\n\n## 除了内容，还有哪些东西会留下能力\n\n一套可靠的查询工具，可以使新任务不再重复连接现行库存；清楚的工单身份和业务状态，可以使不同人员接着工作；保留的代表任务，可以帮助以后更换模型时检查能力是否丢失。团队共同理解谁负责什么，也能减少重新协调。\n\n这些积累并不都表现为知识文章。资料适合解释，工具支持动作，代表任务支持比较，带教帮助人员形成实际判断。组织知识和吸收能力研究都提醒我们，能力存在于相关实践与使用中，不能仅用文件数衡量。知识研究、吸收能力研究\n\n因此，一项项目交付不应只问生成了多少内容，还要看这些内容、工具和人员认识怎样进入下一项工作。\n\n## 留存也需要选择，因为维护并不免费\n\n可以从三方面判断优先级：以后是否可能再用，是否影响重要决定，维持有效需要多少资源。低频但后果重要的版本差别，可能值得保留；变化很快的价格和库存，则更适合在使用时查询现行来源。\n\n如果某条经验无人使用，适用条件也无法解释，却不断占专家维护时间，可以停止主动推荐，退回历史材料。保留原始证据与让它继续作为当前方法，是不同决定。这样既不丢失过去，也不让过去持续误导现在。\n\n工具也一样。一个共享功能不断为旧场景增加例外，可能越来越难维护，应考虑拆分或替换。系统技术债研究指出，依赖和维护会累积负担。原始研究 “已经投入很多”不能自动成为继续维护的理由。\n\n## 用下一项工作验证，留下的东西有没有作用\n\n让新销售处理没见过的询价，看他是否更早确定缺项、取得现行事实；让接任技术员面对新版本，看他是否识别旧方法边界并取得支持；让新门店使用共同安排，看它是否少做基础准备，同时仍能认识当地需求。\n\n这些任务会暴露留存的实际价值。若仍然需要原作者从头解释，应追查缺的是背景、入口、工具还是方法。若已经能够顺利接续，就有更具体的依据说明企业能力得到了保留。\n\n企业自己的AI能力，可以建立在可更换的通用模型之上。它的特色体现在客户理解、方法、工具和协作如何组合，并持续影响工作。为本轮值得保留的部分说明谁会再用、怎样维护、如何知道有帮助，就比把所有输出都称为资产更有经营意义。\n"},{"file":"28-投入组合.md","id":"lesson-28","number":28,"role":"核心课","part":4,"title":"第28章｜当期交付、探索与维护，为什么不能都靠同一段空余时间","md":"# 第28章｜当期交付、探索与维护，为什么不能都靠同一段空余时间\n\n一家内容团队经过改进，计划把专家核验从每篇30分钟降到20分钟。专家每天有两小时，理论上可以核6篇。负责人又希望他每天拿40分钟整理反例、验证新方法，同时仍向客户承诺6篇交付。\n\n这两项计划使用的是同一段时间。两小时中扣去40分钟，只剩80分钟，按每篇20分钟只能核4篇。若不增加支持或改变范围，交付、验证和加班之间必然发生取舍。\n\nAI可以让不同工作共享材料，却不会使同一位专家的时间被同时使用两次。“边做边沉淀”需要落实为具体安排。\n\n## 四类工作为什么都不可少\n\n当前生产让客户得到合格交付。探索研究尚不确定的新需求和新方法。验证帮助企业决定是否采用、扩大或停止。维护则使规则、资料和工具继续适合正在变化的业务。\n\n它们的成果显现方式不同。交付篇数容易统计，探索可能只是证明一个方向不值得继续，维护的效果则常常是错误没有发生。如果只奖励新增产出，后面三类工作很容易被挤到“有空再做”。\n\n探索与利用研究讨论了尝试新办法与利用已有办法之间的资源竞争，并没有给所有企业规定一个统一比例。[原始研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf) 企业需要根据当前限制决定分配，而不是套用一个看似科学的百分比。\n\n## 在瓶颈上，把真实选择说出来\n\n在[内容服务教学案例](案例D-专业服务.md)中，20分钟核验仍是一项需要验证的改进假设。验证期间，专家要记录错误、检查质量并判断哪些工作确实减少了。此时就把6篇全部承诺出去，会使验证被当前交付挤掉，或者只能靠加班完成。\n\n可以选择暂时保持较少交付，为验证留时间；也可以安排额外专业支持；还可以缩小本轮要验证的材料范围。不同选择有不同成本，但都比在计划里同时写满更诚实，也更便于追踪。\n\n设备服务也一样。专家既处理复杂工单，又要判断新版本是否适用旧方法，还承担带教。如果旧方法已经可能误导当前派工，维护应优先；若常规服务稳定，而新客户需求不清，探索可能更值得增加。\n\n## 学习与维护都应说明自己会改变什么\n\n烘焙连锁研究下午补货时，应说明准备区分哪项未知，以及不同结果会怎样改变排产。若反复试做，企业仍不能判断扩产、只改分配或停止，试验范围和观察方式就需要调整。不能只以“创新需要时间”解释没有进展。\n\n维护也应有具体对象。例如价格更新后，当前报价能否使用新版本；设备增加V2以后，旧方法是否仍被默认推荐；派工中断后，系统能否查回同一次提交。维护成果由这些持续可用的工作能力说明，而不只是统计处理了多少工单。\n\n这样，四类投入才可以被放在同一张经营安排中讨论：哪些直接支持当前客户，哪些减少下一次投入的不确定，哪些保护现有能力，哪些开辟新的价值。\n\n## 随证据调整，而不是把一次比例固定下来\n\n业务刚启动时，事实和方法都不稳定，可能需要较多现场观察与验证。某项方法已可靠且客户需求明确时，可以扩大生产，同时保留必要抽查。进入新行业或新产品线后，又需要增加探索和适配。\n\n一份可执行的资源安排，应写清当前最重要的结果和未知，由哪些人承担，使用多少时间与智能资源，哪些工作因此延后，以及何时重新判断。特别是共享专家、设备和客户资源的项目，应共同核对容量，不能各自按全部可用资源计算。\n\n当积累和改进拥有真实的时间、责任和成果要求，它们才可能长期发生。否则，即使AI承担了很多整理，企业仍会在日常压力下把学习推迟到下一次。\n","html":"\u003ch1>第28章｜当期交付、探索与维护，为什么不能都靠同一段空余时间\u003c/h1>\n\u003cp>一家内容团队经过改进，计划把专家核验从每篇30分钟降到20分钟。专家每天有两小时，理论上可以核6篇。负责人又希望他每天拿40分钟整理反例、验证新方法，同时仍向客户承诺6篇交付。\u003c/p>\n\u003cp>这两项计划使用的是同一段时间。两小时中扣去40分钟，只剩80分钟，按每篇20分钟只能核4篇。若不增加支持或改变范围，交付、验证和加班之间必然发生取舍。\u003c/p>\n\u003cp>AI可以让不同工作共享材料，却不会使同一位专家的时间被同时使用两次。“边做边沉淀”需要落实为具体安排。\u003c/p>\n\u003ch2 id=\"lesson-28-section-1\">四类工作为什么都不可少\u003c/h2>\n\u003cp>当前生产让客户得到合格交付。探索研究尚不确定的新需求和新方法。验证帮助企业决定是否采用、扩大或停止。维护则使规则、资料和工具继续适合正在变化的业务。\u003c/p>\n\u003cp>它们的成果显现方式不同。交付篇数容易统计，探索可能只是证明一个方向不值得继续，维护的效果则常常是错误没有发生。如果只奖励新增产出，后面三类工作很容易被挤到“有空再做”。\u003c/p>\n\u003cp>探索与利用研究讨论了尝试新办法与利用已有办法之间的资源竞争，并没有给所有企业规定一个统一比例。\u003ca href=\"https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a> 企业需要根据当前限制决定分配，而不是套用一个看似科学的百分比。\u003c/p>\n\u003ch2 id=\"lesson-28-section-2\">在瓶颈上，把真实选择说出来\u003c/h2>\n\u003cp>在\u003ca href=\"#case-d\">内容服务教学案例\u003c/a>中，20分钟核验仍是一项需要验证的改进假设。验证期间，专家要记录错误、检查质量并判断哪些工作确实减少了。此时就把6篇全部承诺出去，会使验证被当前交付挤掉，或者只能靠加班完成。\u003c/p>\n\u003cp>可以选择 选择暂时保持较少交付，为验证留时间；也可以安排额外专业支持；还可以缩小本轮要验证的材料范围。不同选择有不同成本，但都比在计划里同时写满更诚实，也更便于追踪。\n\n设备服务也一样。专家既处理复杂工单，又要判断新版本是否适用旧方法，还承担带教。如果旧方法已经可能误导当前派工，维护应优先；若常规服务稳定，而新客户需求不清，探索可能更值得增加。\n\n## 学习与维护都应说明自己会改变什么\n\n烘焙连锁研究下午补货时，应说明准备区分哪项未知，以及不同结果会怎样改变排产。若反复试做，企业仍不能判断扩产、只改分配或停止，试验范围和观察方式就需要调整。不能只以“创新需要时间”解释没有进展。\n\n维护也应有具体对象。例如价格更新后，当前报价能否使用新版本；设备增加V2以后，旧方法是否仍被默认推荐；派工中断后，系统能否查回同一次提交。维护成果由这些持续可用的工作能力说明，而不只是统计处理了多少工单。\n\n这样，四类投入才可以被放在同一张经营安排中讨论：哪些直接支持当前客户，哪些减少下一次投入的不确定，哪些保护现有能力，哪些开辟新的价值。\n\n## 随证据调整，而不是把一次比例固定下来\n\n业务刚启动时，事实和方法都不稳定，可能需要较多现场观察与验证。某项方法已可靠且客户需求明确时，可以扩大生产，同时保留必要抽查。进入新行业或新产品线后，又需要增加探索和适配。\n\n一份可执行的资源安排，应写清当前最重要的结果和未知，由哪些人承担，使用多少时间与智能资源，哪些工作因此延后，以及何时重新判断。特别是共享专家、设备和客户资源的项目，应共同核对容量，不能各自按全部可用资源计算。\n\n当积累和改进拥有真实的时间、责任和成果要求，它们才可能长期发生。否则，即使AI承担了很多整理，企业仍会在日常压力下把学习推迟到下一次。\n","exportSingleMd":"# 第28章｜当期交付、探索与维护，为什么不能都靠同一段空余时间\n\n一家内容团队经过改进，计划把专家核验从每篇30分钟降到20分钟。专家每天有两小时，理论上可以核6篇。负责人又希望他每天拿40分钟整理反例、验证新方法，同时仍向客户承诺6篇交付。\n\n这两项计划使用的是同一段时间。两小时中扣去40分钟，只剩80分钟，按每篇20分钟只能核4篇。若不增加支持或改变范围，交付、验证和加班之间必然发生取舍。\n\nAI可以让不同工作共享材料，却不会使同一位专家的时间被同时使用两次。“边做边沉淀”需要落实为具体安排。\n\n## 四类工作为什么都不可少\n\n当前生产让客户得到合格交付。探索研究尚不确定的新需求和新方法。验证帮助企业决定是否采用、扩大或停止。维护则使规则、资料和工具继续适合正在变化的业务。\n\n它们的成果显现方式不同。交付篇数容易统计，探索可能只是证明一个方向不值得继续，维护的效果则常常是错误没有发生。如果只奖励新增产出，后面三类工作很容易被挤到“有空再做”。\n\n探索与利用研究讨论了尝试新办法与利用已有办法之间的资源竞争，并没有给所有企业规定一个统一比例。[原始研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf) 企业需要根据当前限制决定分配，而不是套用一个看似科学的百分比。\n\n## 在瓶颈上，把真实选择说出来\n\n在[内容服务教学案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-d)中，20分钟核验仍是一项需要验证的改进假设。验证期间，专家要记录错误、检查质量并判断哪些工作确实减少了。此时就把6篇全部承诺出去，会使验证被当前交付挤掉，或者只能靠加班完成。\n\n可以选择暂时保持较少交付，为验证留时间；也可以安排额外专业支持；还可以缩小本轮要验证的材料范围。不同选择有不同成本，但都比在计划里同时写满更诚实，也更便于追踪。\n\n设备服务也一样。专家既处理复杂工单，又要判断新版本是否适用旧方法，还承担带教。如果旧方法已经可能误导当前派工，维护应优先；若常规服务稳定，而新客户需求不清，探索可能更值得增加。\n\n## 学习与维护都应说明自己会改变什么\n\n烘焙连锁研究下午补货时，应说明准备区分哪项未知，以及不同结果会怎样改变排产。若反复试做，企业仍不能判断扩产、只改分配或停止，试验范围和观察方式就需要调整。不能只以“创新需要时间”解释没有进展。\n\n维护也应有具体对象。例如价格更新后，当前报价能否使用新版本；设备增加V2以后，旧方法是否仍被默认推荐；派工中断后，系统能否查回同一次提交。维护成果由这些持续可用的工作能力说明，而不只是统计处理了多少工单。\n\n这样，四类投入才可以被放在同一张经营安排中讨论：哪些直接支持当前客户，哪些减少下一次投入的不确定，哪些保护现有能力，哪些开辟新的价值。\n\n## 随证据调整，而不是把一次比例固定下来\n\n业务刚启动时，事实和方法都不稳定，可能需要较多现场观察与验证。某项方法已可靠且客户需求明确时，可以扩大生产，同时保留必要抽查。进入新行业或新产品线后，又需要增加探索和适配。\n\n一份可执行的资源安排，应写清当前最重要的结果和未知，由哪些人承担，使用多少时间与智能资源，哪些工作因此延后，以及何时重新判断。特别是共享专家、设备和客户资源的项目，应共同核对容量，不能各自按全部可用资源计算。\n\n当积累和改进拥有真实的时间、责任和成果要求，它们才可能长期发生。否则，即使AI承担了很多整理，企业仍会在日常压力下把学习推迟到下一次。\n","text":"# 第28章｜当期交付、探索与维护，为什么不能都靠同一段空余时间\n\n一家内容团队经过改进，计划把专家核验从每篇30分钟降到20分钟。专家每天有两小时，理论上可以核6篇。负责人又希望他每天拿40分钟整理反例、验证新方法，同时仍向客户承诺6篇交付。\n\n这两项计划使用的是同一段时间。两小时中扣去40分钟，只剩80分钟，按每篇20分钟只能核4篇。若不增加支持或改变范围，交付、验证和加班之间必然发生取舍。\n\nAI可以让不同工作共享材料，却不会使同一位专家的时间被同时使用两次。“边做边沉淀”需要落实为具体安排。\n\n## 四类工作为什么都不可少\n\n当前生产让客户得到合格交付。探索研究尚不确定的新需求和新方法。验证帮助企业决定是否采用、扩大或停止。维护则使规则、资料和工具继续适合正在变化的业务。\n\n它们的成果显现方式不同。交付篇数容易统计，探索可能只是证明一个方向不值得继续，维护的效果则常常是错误没有发生。如果只奖励新增产出，后面三类工作很容易被挤到“有空再做”。\n\n探索与利用研究讨论了尝试新办法与利用已有办法之间的资源竞争，并没有给所有企业规定一个统一比例。原始研究 企业需要根据当前限制决定分配，而不是套用一个看似科学的百分比。\n\n## 在瓶颈上，把真实选择说出来\n\n在内容服务教学案例中，20分钟核验仍是一项需要验证的改进假设。验证期间，专家要记录错误、检查质量并判断哪些工作确实减少了。此时就把6篇全部承诺出去，会使验证被当前交付挤掉，或者只能靠加班完成。\n\n可以选择暂时保持较少交付，为验证留时间；也可以安排额外专业支持；还可以缩小本轮要验证的材料范围。不同选择有不同成本，但都比在计划里同时写满更诚实，也更便于追踪。\n\n设备服务也一样。专家既处理复杂工单，又要判断新版本是否适用旧方法，还承担带教。如果旧方法已经可能误导当前派工，维护应优先；若常规服务稳定，而新客户需求不清，探索可能更值得增加。\n\n## 学习与维护都应说明自己会改变什么\n\n烘焙连锁研究下午补货时，应说明准备区分哪项未知，以及不同结果会怎样改变排产。若反复试做，企业仍不能判断扩产、只改分配或停止，试验范围和观察方式就需要调整。不能只以“创新需要时间”解释没有进展。\n\n维护也应有具体对象。例如价格更新后，当前报价能否使用新版本；设备增加V2以后，旧方法是否仍被默认推荐；派工中断后，系统能否查回同一次提交。维护成果由这些持续可用的工作能力说明，而不只是统计处理了多少工单。\n\n这样，四类投入才可以被放在同一张经营安排中讨论：哪些直接支持当前客户，哪些减少下一次投入的不确定，哪些保护现有能力，哪些开辟新的价值。\n\n## 随证据调整，而不是把一次比例固定下来\n\n业务刚启动时，事实和方法都不稳定，可能需要较多现场观察与验证。某项方法已可靠且客户需求明确时，可以扩大生产，同时保留必要抽查。进入新行业或新产品线后，又需要增加探索和适配。\n\n一份可执行的资源安排，应写清当前最重要的结果和未知，由哪些人承担，使用多少时间与智能资源，哪些工作因此延后，以及何时重新判断。特别是共享专家、设备和客户资源的项目，应共同核对容量，不能各自按全部可用资源计算。\n\n当积累和改进拥有真实的时间、责任和成果要求，它们才可能长期发生。否则，即使AI承担了很多整理，企业仍会在日常压力下把学习推迟到下一次。\n"},{"file":"29-任务质量.md","id":"lesson-29","number":29,"role":"核心课","part":5,"title":"第29章｜一份看起来专业的材料，怎样判断能不能真的采用","md":"# 第29章｜一份看起来专业的材料，怎样判断能不能真的采用\n\n一篇产品文章写得流畅，却把另一型号的性能放进当前产品；一份报价方案格式完整，却没有说明供应商只能十天后交货，而客户三天内就要使用。若只评价“清楚、专业、结构好”，两份材料都可能得分不低。\n\n质量应由材料要支持的工作决定。企业首先要知道下一位使用者准备据此做什么，再判断哪些条件必须满足。文风可以影响阅读，但不能抵消会使行动出错的事实问题。\n\n## 不同阶段，需要不同程度的确定\n\n以[工业品报价案例](案例B-智能资源成本.md)为例。前期整理材料时，AI应忠实保留客户期限、工况、已知依据和缺项。形成候选时，可以提出尚待确认的路线，但要让使用者知道哪些条件未定。正式报价时，则需要对应有效价格、数量和可承诺交期。\n\n若把前期候选按正式交付要求全部筛掉，可能过早压缩探索；若把候选中的可能性写成已确认事实，又会使销售作出错误承诺。评价需要与阶段相配。\n\n内容服务同样如此。构思文章角度时，可以保留待研究问题；发给客户的正式稿，则必须核实重要产品事实。判断标准不同，并不意味着质量要求降低，而是每种材料承担不同职责。\n\n## 重要错误为什么不能靠平均分抵消\n\n设备身份错误、未换件写成换件、客户三天期限被遗漏，都会改变后续行动。标题稍长或段落不够漂亮，通常影响没有这么直接。如果把所有问题混成一个平均分，格式与文风得分可能掩盖关键事实错误。\n\n可以先检查采用所必需的条件：对象是否正确，关键事实是否有依据，正式承诺是否得到确认。满足这些条件以后，再比较完整程度、表达和人员负担。这样使用者才知道材料是否可以进入下一步，而不只是得到一个抽象分数。\n\n对工业内容团队，重要性能描述能否对应当前型号的资料，就是比润色更早的要求。对派工材料，设备版本和实际操作记录则可能决定准备是否正确。\n\n## 检查材料要能暴露真实工作中的差别\n\n只选最齐全、最熟悉的任务，很容易得到漂亮结果。企业需要保留常规任务，也保留缺项、版本冲突、曾经失败或未被采用的情况。目的不是故意出难题，而是覆盖会影响本企业使用决定的差别。\n\n反复用于调整系统的材料，团队已经越来越熟悉，应另留一部分未用于调试的任务，观察方法能否迁移。否则系统可能只对见过的例子表现很好，到了新客户就重新出错。\n\n人员补救也应被看见。专家从头重写才得到正确交付，与AI已经提供可用材料，经营含义完全不同。记录核验和返工，才能知道系统承担了多少工作，是否只是把错误发现留给了人。\n\n工作任务研究提醒我们，主观顺畅与总耗时应分开观察；创新研究也提示，最终方案变好不等于选择环节同样成熟。[任务研究](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)、[创新研究](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n## 评价结论应能指导下一步\n\n“准确率不错”仍然过于笼统。更有用的说明是：对哪类材料，在什么要求下取得怎样结果，人员补了哪些工作，哪些差别仍容易出错。由此才能决定改资料、模型、任务范围，还是核验和协作方式。\n\n例如常规型号整理可靠，新版本容易混用，就可以先在常规范围采用，同时补版本识别；若关键事实经常缺失，先修资料取得；若结果准确却需要过多核验，再研究如何减少查找和重复检查。\n\n一份合格材料说明它可以支持下一阶段，不等于整项业务已经成功。还要看人员是否采用、动作是否发生、客户是否取得价值。质量评价把第一道问题讲清，才能使后面的经营判断建立在可靠基础上。\n","html":"\u003ch1>第29章｜一份看起来专业的材料，怎样判断能不能真的采用\u003c/h1>\n\u003cp>一篇产品文章写得流畅，却把另一型号的性能放进当前产品；一份报价方案格式完整，却没有说明供应商只能十天后交货，而客户三天内就要使用。若只评价“清楚、专业、结构好”，两份材料都可能得分不低。\u003c/p>\n\u003cp>质量应由材料要支持的工作决定。企业首先要知道下一位使用者准备据此做什么，再判断哪些条件必须满足。文风可以影响阅读，但不能抵消会使行动出错的事实问题。\u003c/p>\n\u003ch2 id=\"lesson-29-section-1\">不同阶段，需要不同程度的确定\u003c/h2>\n\u003cp>以\u003ca href=\"#case-b\">工业品报价案例\u003c/a>为例。前期整理材料时，AI应忠实保留客户期限、工况、已知依据和缺项。形成候选时，可以提出尚待确认的路线，但要让使用者知道哪些条件未定。正式报价时，则需要对应有效价格、数量和可承诺交期。\u003c/p>\n\u003cp>若把前期候选按正式交付要求全部筛掉，可能过早压缩探索；若把候选中的可能性写成已确认事实，又会使销售作出错误承诺。评价需要与阶段相配。\u003c/p>\n\u003cp>内容服务同样如此。构思文章角度时，可以保留待研究问题；发给客户的正式稿，则必须核实重要产品事实。判断标准不同，并不意味着质量要求降低，而是每种材料承担不同职责。\u003c/p>\n\u003ch2 id=\"lesson-29-section-2\">重要错误为什么不能靠平均分抵消\u003c/h2>\n\u003cp>设备身份错误、未换件写成换件、客户三天期限被遗漏，都会改变后续行动。标题稍长或段落不够漂亮，通常影响没有这么直接。如果把所有问题混成一个平均分，格式与文风得分可能掩盖关键事实错误。\u003c/p>\n\u003cp>可以先检查采用所必需的条件：对象是否正确，关键事实是否有依据，正式承诺是否得到确认。满足这些条件以后，再比较完整程度、表达和人员负担。这样使用者才知道材料是否可以进入下一步，而不只是得到一个抽象分数。\u003c/p>\n\u003cp>对工业内容团队，重要性能描述能否对应当前型号的资料，就是比润色更早的要求。对派工材料，设备版本和实际操作记录则可能决定准备是否正确。\u003c/p>\n\u003ch2 id=\"lesson-29-section-3\">检查材料要能暴露真实工作中的差别\u003c/h2>\n\u003cp>只选最齐全、最熟悉的任务，很容易得到漂亮结果。企业需要保留常规任务，也保留缺项、版本冲突、曾经失败或未被采用的情况。目的不是故意出难题，而是覆盖会影响本企业使用决定的差别。\u003c/p>\n\u003cp>反复用于调整系统的材料，团队已经越来越熟悉，应另留一部分未用于调试的任务，观察方法能否迁移。否则系统可能只对见过的例子表现很好，到了新客户就重新出错。\u003c/p>\n\u003cp>人员补救也应被看见。专家从头重写才得到正确交付，与AI已经提供可用材料，经营含义完全不同。记录核验和返工，才能知道系统承担了多少工作，是否只是把错误发现留给了人。\u003c/p>\n\u003cp>工作任务研究提醒我们，主观顺畅与总耗时应分开观察；创新研究也提示，最终方案变好不等于选择环节同样成熟。\u003ca href=\"https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">任务研究\u003c/a>、\u003ca href=\"https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702\" target=\"_blank\" rel=\"noopener noreferrer\">创新研究\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-29-section-4\">评价结论应能指导下一步\u003c/h2>\n\u003cp>“准确率不错”仍然过于笼统。更有用的说明是：对哪类材料，在什么要求下取得怎样结果，人员补了哪些工作，哪些差别仍容易出错。由此才能决定改资料、模型、任务范围，还是核验和协作方式。\u003c/p>\n\u003cp>例如常规型号整理可靠，新版本容易混用，就可以先在常规范围采用，同时补版本识别；若关键事实经常缺失，先修资料取得；若结果准确却需要过多核验，再研究如何减少查找和重复检查。\u003c/p>\n\u003cp>一份合格材料说明它可以支持下一阶段，不等于整项业务已经成功。还要看人员是否采用、动作是否发生、客户是否取得价值。质量评价把第一道问题讲清，才能使后面的经营判断建立在可靠基础上。\u003c/p>\n","headings":[{"id":"lesson-29-section-1","label":"不同阶段，需要不同程度的确定"},{"id":"lesson-29-section-2","label":"重要错误为什么不能靠平均分抵消"},{"id":"lesson-29-section-3","label":"检查材料要能暴露真实工作中的差别"},{"id":"lesson-29-section-4","label":"评价结论应能指导下一步"}],"exportMd":"# 第29章｜一份看起来专业的材料，怎样判断能不能真的采用\n\n一篇产品文章写得流畅，却把另一型号的性能放进当前产品；一份报价方案格式完整，却没有说明供应商只能十天后交货，而客户三天内就要使用。若只评价“清楚、专业、结构好”，两份材料都可能得分不低。\n\n质量应由材料要支持的工作决定。企业首先要知道下一位使用者准备据此做什么，再判断哪些条件必须满足。文风可以影响阅读，但不能抵消会使行动出错的事实问题。\n\n## 不同阶段，需要不同程度的确定\n\n以[工业品报价案例](#case-b)为例。前期整理材料时，AI应忠实保留客户期限、工况、已知依据和缺项。形成候选时，可以提出尚待确认的路线，但要让使用者知道哪些条件未定。正式报价时，则需要对应有效价格、数量和可承诺交期。\n\n若把前期候选按正式交付要求全部筛掉，可能过早压缩探索；若把候选中的可能性写成已确认事实，又会使销售作出错误承诺。评价需要与阶段相配。\n\n内容服务同样如此。构思文章角度时，可以保留待研究问题；发给客户的正式稿，则必须核实重要产品事实。判断标准不同，并不意味着质量要求降低，而是每种材料承担不同职责。\n\n## 重要错误为什么不能靠平均分抵消\n\n设备身份错误、未换件写成换件、客户三天期限被遗漏，都会改变后续行动。标题稍长或段落不够漂亮，通常影响没有这么直接。如果把所有问题混成一个平均分，格式与文风得分可能掩盖关键事实错误。\n\n可以先检查采用所必需的条件：对象是否正确，关键事实是否有依据，正式承诺是否得到确认。满足这些条件以后，再比较完整程度、表达和人员负担。这样使用者才知道材料是否可以进入下一步，而不只是得到一个抽象分数。\n\n对工业内容团队，重要性能描述能否对应当前型号的资料，就是比润色更早的要求。对派工材料，设备版本和实际操作记录则可能决定准备是否正确。\n\n## 检查材料要能暴露真实工作中的差别\n\n只选最齐全、最熟悉的任务，很容易得到漂亮结果。企业需要保留常规任务，也保留缺项、版本冲突、曾经失败或未被采用的情况。目的不是故意出难题，而是覆盖会影响本企业使用决定的差别。\n\n反复用于调整系统的材料，团队已经越来越熟悉，应另留一部分未用于调试的任务，观察方法能否迁移。否则系统可能只对见过的例子表现很好，到了新客户就重新出错。\n\n人员补救也应被看见。专家从头重写才得到正确交付，与AI已经提供可用材料，经营含义完全不同。记录核验和返工，才能知道系统承担了多少工作，是否只是把错误发现留给了人。\n\n工作任务研究提醒我们，主观顺畅与总耗时应分开观察；创新研究也提示，最终方案变好不等于选择环节同样成熟。[任务研究](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)、[创新研究](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n## 评价结论应能指导下一步\n\n“准确率不错”仍然过于笼统。更有用的说明是：对哪类材料，在什么要求下取得怎样结果，人员补了哪些工作，哪些差别仍容易出错。由此才能决定改资料、模型、任务范围，还是核验和协作方式。\n\n例如常规型号整理可靠，新版本容易混用，就可以先在常规范围采用，同时补版本识别；若关键事实经常缺失，先修资料取得；若结果准确却需要过多核验，再研究如何减少查找和重复检查。\n\n一份合格材料说明它可以支持下一阶段，不等于整项业务已经成功。还要看人员是否采用、动作是否发生、客户是否取得价值。质量评价把第一道问题讲清，才能使后面的经营判断建立在可靠基础上。\n","exportSingleMd":"# 第29章｜一份看起来专业的材料，怎样判断能不能真的采用\n\n一篇产品文章写得流畅，却把另一型号的性能放进当前产品；一份报价方案格式完整，却没有说明供应商只能十天后交货，而客户三天内就要使用。若只评价“清楚、专业、结构好”，两份材料都可能得分不低。\n\n质量应由材料要支持的工作决定。企业首先要知道下一位使用者准备据此做什么，再判断哪些条件必须满足。文风可以影响阅读，但不能抵消会使行动出错的事实问题。\n\n## 不同阶段，需要不同程度的确定\n\n以[工业品报价案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-b)为例。前期整理材料时，AI应忠实保留客户期限、工况、已知依据和缺项。形成候选时，可以提出尚待确认的路线，但要让使用者知道哪些条件未定。正式报价时，则需要对应有效价格、数量和可承诺交期。\n\n若把前期候选按正式交付要求全部筛掉，可能过早压缩探索；若把候选中的可能性写成已确认事实，又会使销售作出错误承诺。评价需要与阶段相配。\n\n内容服务同样如此。构思文章角度时，可以保留待研究问题；发给客户的正式稿，则必须核实重要产品事实。判断标准不同，并不意味着质量要求降低，而是每种材料承担不同职责。\n\n## 重要错误为什么不能靠平均分抵消\n\n设备身份错误、未换件写成换件、客户三天期限被遗漏，都会改变后续行动。标题稍长或段落不够漂亮，通常影响没有这么直接。如果把所有问题混成一个平均分，格式与文风得分可能掩盖关键事实错误。\n\n可以先检查采用所必需的条件：对象是否正确，关键事实是否有依据，正式承诺是否得到确认。满足这些条件以后，再比较完整程度、表达和人员负担。这样使用者才知道材料是否可以进入下一步，而不只是得到一个抽象分数。\n\n对工业内容团队，重要性能描述能否对应当前型号的资料，就是比润色更早的要求。对派工材料，设备版本和实际操作记录则可能决定准备是否正确。\n\n## 检查材料要能暴露真实工作中的差别\n\n只选最齐全、最熟悉的任务，很容易得到漂亮结果。企业需要保留常规任务，也保留缺项、版本冲突、曾经失败或未被采用的情况。目的不是故意出难题，而是覆盖会影响本企业使用决定的差别。\n\n反复用于调整系统的材料，团队已经越来越熟悉，应另留一部分未用于调试的任务，观察方法能否迁移。否则系统可能只对见过的例子表现很好，到了新客户就重新出错。\n\n人员补救也应被看见。专家从头重写才得到正确交付，与AI已经提供可用材料，经营含义完全不同。记录核验和返工，才能知道系统承担了多少工作，是否只是把错误发现留给了人。\n\n工作任务研究提醒我们，主观顺畅与总耗时应分开观察；创新研究也提示，最终方案变好不等于选择环节同样成熟。[任务研究](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)、[创新研究](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n## 评价结论应能指导下一步\n\n“准确率不错”仍然过于笼统。更有用的说明是：对哪类材料，在什么要求下取得怎样结果，人员补了哪些工作，哪些差别仍容易出错。由此才能决定改资料、模型、任务范围，还是核验和协作方式。\n\n例如常规型号整理可靠，新版本容易混用，就可以先在常规范围采用，同时补版本识别；若关键事实经常缺失，先修资料取得；若结果准确却需要过多核验，再研究如何减少查找和重复检查。\n\n一份合格材料说明它可以支持下一阶段，不等于整项业务已经成功。还要看人员是否采用、动作是否发生、客户是否取得价值。质量评价把第一道问题讲清，才能使后面的经营判断建立在可靠基础上。\n","text":"# 第29章｜一份看起来专业的材料，怎样判断能不能真的采用\n\n一篇产品文章写得流畅，却把另一型号的性能放进当前产品；一份报价方案格式完整，却没有说明供应商只能十天后交货，而客户三天内就要使用。若只评价“清楚、专业、结构好”，两份材料都可能得分不低。\n\n质量应由材料要支持的工作决定。企业首先要知道下一位使用者准备据此做什么，再判断哪些条件必须满足。文风可以影响阅读，但不能抵消会使行动出错的事实问题。\n\n## 不同阶段，需要不同程度的确定\n\n以工业品报价案例为例。前期整理材料时，AI应忠实保留客户期限、工况、已知依据和缺项。形成候选时，可以提出尚待确认的路线，但要让使用者知道哪些条件未定。正式报价时，则需要对应有效价格、数量和可承诺交期。\n\n若把前期候选按正式交付要求全部筛掉，可能过早压缩探索；若把候选中的可能性写成已确认事实，又会使销售作出错误承诺。评价需要与阶段相配。\n\n内容服务同样如此。构思文章角度时，可以保留待研究问题；发给客户的正式稿，则必须核实重要产品事实。判断标准不同，并不意味着质量要求降低，而是每种材料承担不同职责。\n\n## 重要错误为什么不能靠平均分抵消\n\n设备身份错误、未换件写成换件、客户三天期限被遗漏，都会改变后续行动。标题稍长或段落不够漂亮，通常影响没有这么直接。如果把所有问题混成一个平均分，格式与文风得分可能掩盖关键事实错误。\n\n可以先检查采用所必需的条件：对象是否正确，关键事实是否有依据，正式承诺是否得到确认。满足这些条件以后，再比较完整程度、表达和人员负担。这样使用者才知道材料是否可以进入下一步，而不只是得到一个抽象分数。\n\n对工业内容团队，重要性能描述能否对应当前型号的资料，就是比润色更早的要求。对派工材料，设备版本和实际操作记录则可能决定准备是否正确。\n\n## 检查材料要能暴露真实工作中的差别\n\n只选最齐全、最熟悉的任务，很容易得到漂亮结果。企业需要保留常规任务，也保留缺项、版本冲突、曾经失败或未被采用的情况。目的不是故意出难题，而是覆盖会影响本企业使用决定的差别。\n\n反复用于调整系统的材料，团队已经越来越熟悉，应另留一部分未用于调试的任务，观察方法能否迁移。否
