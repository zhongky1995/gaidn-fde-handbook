么\n\n案例中的一张工单代号为M1。原始经过是：设备属于V1版本，技术员进行了调整和重启，没有更换零件；设备当次恢复，记录跟踪到次日。AI整理时却曾将它写成更换零件后恢复。只看整理后的句子，新人可能带上不必要的零件，也可能误解原来的处理过程。\n\n因此，积累的第一步是保留事实：同一台设备、同一次问题、实际动作和观察结果应能对应起来。AI可以把散在记录中的内容组织好，人则核对会改变后续判断的差别。这里的价值是让下一位使用者不用重新找齐所有当事人，才能知道前面发生过什么。\n\n事实完整之后，仍然不能立即说“调整就是恢复的原因”。因为M1同时发生了调整和重启，我们还不知道究竟哪一步起主要作用，或者是否有其他条件一起改变。前者是记录发生了什么，后者是解释为什么发生，不能省掉中间的判断。\n\n## 一条解释，怎样逐渐成为可用的方法\n\n案例里另一张V1工单只记录了重启，也恢复了；还有一张V2工单记录调整，一小时后才报告恢复，中间经过不完整。这些差别提醒团队，同样写着“恢复”，可能包含不同问题。\n\n企业可以据此形成一个待检验的解释，例如某些情况下重启本身可能有效。但若直接把它写成“遇到此症状就重启”，就跳过了设备条件和专业判断。更有用的下一步，是让技术员先核对版本、补清实际动作、区分持续故障和间歇问题，再按适用的专业要求处理。\n\n方法因此比一句结论多了几层内容：什么时候开始用，先看什么，遇到不同情况如何分支，什么时候需要停止并求助。一个新人未必能立刻独立判断所有故障，但他可以依照方法取得正确资料、避免明显误用，并把问题交给合适的人。\n\n## 方法写出来以后，怎样才算企业能够使用\n\n假设技术员知道某种版本需要特定备件，却没有权限查询库存；或者知道需要专家支持，却不知道谁负责。这时知识没有缺失，工作仍然做不下去。要形成组织能力，还要配齐工具、资源和协作安排。\n\n可以让一位具备基本专业资格、但没有参与原整理的接任者处理新工单。他能否找到相关记录，识别与旧案例不同的条件，拿到需要的工具和支持，并把本次结果接回？这个过程比检查知识库里有多少条内容，更能显示企业究竟积累了什么。\n\n \n\n图中每向右走一步，都增加了一项要求。记录能被找到，不等于解释成立；解释有道理，不等于接任者能完成；企业能稳定完成，也不等于客户会因此更愿意购买。这些区别帮助管理者决定下一笔投入应该补在哪里。\n\n知识研究强调，个人经验要通过表达、共同实践和再使用，才可能成为组织知识。原始研究 有些判断可以通过文字传递，有些现场动作仍需要示范和带教。AI降低整理与调用的成本，可以帮助这个过程持续发生，但不会使所有专业能力自动变成一份文档。\n\n## 能力与竞争优势之间，还要经过客户\n\n如果企业改善准备，减少了一次本可避免的外协上门，可能直接少支付一笔派工费用。客户也可能更早恢复生产，但客户少停机的价值，并不自动等于服务商获得同额利润。服务商能否通过更稳定的服务保持续约或取得更好的价格，还需要客户认可和合同安排。\n\n有些积累只是让企业达到应有水准，例如不再带错备件。有些积累则可以使企业持续比竞争者更快理解复杂问题。前一种也值得做，只是不能把每项改善都称为独有壁垒。\n\n对这家企业，最先应该争取的变化很明确：原来的老师傅不在时，新任务仍能沿着合适的方法推进；新情况出现时，团队能够修订方法，而不是照抄旧答案。到这一步，过去一次工作产生的价值，才开始进入企业下一次工作的能力。\n"},{"file":"06-人的衔接损耗.md","id":"lesson-06","number":6,"role":"核心课","part":1,"title":"第6章｜消息传到了，客户要求为什么仍会在交接中消失","md":"# 第6章｜消息传到了，客户要求为什么仍会在交接中消失\n\n一家工业品经销商正在为客户寻找旧连接器的替代品。客户提供照片和图纸，明确说三天内需要拿到能用的货。销售把材料转给工程师时，概括成“客户很急，帮忙找个替代型号”；工程师再请采购查货，重点变成“这个型号能否买到”。\n\n采购找到了技术条件较合适的货源，但十天才能到货。几个人都完成了自己的任务，方案却无法满足客户最初的期限。团队只好重新查库存、讨论其他替代方式，客户仍在等待。本课的[工业品报价教学案例](案例B-智能资源成本.md)关注的，就是这种信息已经传递、约束却没有继续起作用的情况。\n\n## 每个人都在简化材料，为什么会损害同一笔生意\n\n销售关心尽快回应客户，工程师关心产品能否适用，采购关心供货与成本。面对一大段材料，他们会自然挑出与自己工作有关的部分。这样的简化通常是为了提高效率，并不意味着谁故意忽略客户。\n\n问题在于，某些信息虽然不是当前岗位首先要回答的内容，却会决定整个方案是否成立。“三天内到货”就是这样一个条件。工程师可能把它看成销售需要处理的事情，采购可能以为自己只需要查到货源。结果，技术适配和交期分别有人负责，却没有一项工作确认它们能否同时满足。\n\n到了最后汇总时，矛盾才显露出来。先前完成的部分工作不得不重做，销售还要再次向客户解释。这种损耗不一定出现在某个人的工时异常中，因为每次补问都很短；但累加起来，可能消耗掉客户允许的整个采购窗口。\n\n![客户原话包含三天期限和替代目标，转述压成“客户很急”；把原始条件关联到方案和采购，才能让期限继续约束报价。](assets/06-交接中的丢失.svg)\n\n图中需要关注的不是消息经过了多少个人，而是一个条件是否始终能影响后面的选择。即使客户原话还保存在聊天里，只要采购作决定时看不见，它对这一步工作就没有实际作用。\n\n## 为什么把聊天全部转发，也未必解决问题\n\n一种直觉做法是把所有人拉进群，让每个人看到全部消息。这样能减少部分信息遗漏，却也增加阅读和判断负担。客户修改过期限，销售补充过数量，工程师讨论过被放弃的方案，后来加入的人仍要弄清哪条是当前有效要求。\n\n更可行的做法，是围绕同一笔询价保留一份持续更新的工作材料。客户原话可以回查；当前数量、用途和期限清楚列出；每个候选旁边写明适配依据、库存和确认时间；尚未核实的事项保留为待办。它的作用不是再造一份汇报，而是让下一位处理者能够接着工作。\n\nAI可以先从原件和讨论中整理这份材料，在采购返回十天货期时指出它与三天期限冲突，并说明哪些候选仍可能满足要求。采购据此寻找其他供货方式，工程师判断替代条件，销售与客户确认能否接受调整。FDE则把这些材料和动作接进团队已经使用的入口，避免要求员工在业务之外维护第二套过程。\n\n## 看清信息以后，仍需分辨另外两类困难\n\n如果客户条件和工程资料都齐了，工单却一直排不到工程师，主要问题是专业时间不足。再生成一份摘要，不会使工程师多出时间。负责人可能需要调整优先顺序、安排其他支持，或缩小当前承诺。\n\n如果采购明知三天期限，却只被考核最低进价，就可能选择十天到货的便宜方案。这时信息并没有丢失，岗位目标与客户结果发生了冲突。多任务激励研究解释了为什么人会把注意力放在容易被衡量和奖励的工作上。[原始研究](https://web.stanford.edu/~milgrom/publishedarticles/Multitask%20Principal%20Agent.pdf) 企业应明确谁可以决定加急成本，以及如何评价按期交付，而不能期待AI替代这项管理选择。\n\n## 怎样找到本企业真正的交接损耗\n\n选择一笔已经完成或失败的真实业务，从客户最初要求追到最终交付。每次换人处理时，查看当时取得了哪些材料、作出了什么判断、后面又补问了什么。重复补问能够帮助定位断点，但还要继续问：信息原来就没人取得，还是已经取得却没有送到决定处？人员是看不懂，还是没有时间或权限行动？\n\n这些原因会导向不同改法。缺少客户使用条件，需要改变前端询问；现有资料找不到，需要改善关联与入口；权限不明，需要负责人重新安排责任。AI的价值在于帮助这些关系持续可见，并减少资料组织的负担。交接真正改善的标志，则是下一位同事更早形成可用判断，客户的要求能够完整走到最终动作。\n","html":"\u003ch1>第6章｜消息传到了，客户要求为什么仍会在交接中消失\u003c/h1>\n\u003cp>一家工业品经销商正在为客户寻找旧连接器的替代品。客户提供照片和图纸，明确说三天内需要拿到能用的货。销售把材料转给工程师时，概括成“客户很急，帮忙找个替代型号”；工程师再请采购查货，重点变成“这个型号能否买到”。\u003c/p>\n\u003cp>采购找到了技术条件较合适的货源，但十天才能到货。几个人都完成了自己的任务，方案却无法满足客户最初的期限。团队只好重新查库存、讨论其他替代方式，客户仍在等待。本课的\u003ca href=\"#case-b\">工业品报价教学案例\u003c/a>关注的，就是这种信息已经传递、约束却没有继续起作用的情况。\u003c/p>\n\u003ch2 id=\"lesson-06-section-1\">每个人都在简化材料，为什么会损害同一笔生意\u003c/h2>\n\u003cp>销售关心尽快回应客户，工程师关心产品能否适用，采购关心供货与成本。面对一大段材料，他们会自然挑出与自己工作有关的部分。这样的简化通常是为了提高效率，并不意味着谁故意忽略客户。\u003c/p>\n\u003cp>问题在于，某些信息虽然不是当前岗位首先要回答的内容，却会决定整个方案是否成立。“三天内到货”就是这样一个条件。工程师可能把它看成销售需要处理的事情，采购可能以为自己只需要查到货源。结果，技术适配和交期分别有人负责，却没有一项工作确认它们能否同时满足。\u003c/p>\n\u003cp>到了最后汇总时，矛盾才显露出来。先前完成的部分工作不得不重做，销售还要再次向客户解释。这种损耗不一定出现在某个人的工时异常中，因为每次补问都很短；但累加起来，可能消耗掉客户允许的整个采购窗口。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTIwIiB2aWV3Qm94PSIwIDAgMzYwIDUyMCIgcm9sZT0iaW1nIj48dGl0bGU+5Lqk5o6l5Lit5Lii5o6J55qE5piv5p2h5Lu2PC90aXRsZT48ZGVzYz7lrqLmiLfljp/ku7bljIXlkKvkuInlpKnmnJ/pmZDjgIHnhafniYflm77nurjkuI7lvoXmoLjlt6XlhrXvvIzovazov7Dlj6rlianlrqLmiLflvojmgKXvvJvljp/mnZDmlpnlhbPogZTliLDpgInlnovmiqXku7fvvIzooaXlm57lhrPlrprmnaHku7bjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjUyMCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7kuqTmjqXkuK3kuKLmjonnmoTmmK/mnaHku7Y8L3RleHQ+PHJlY3QgeD0iMzgiIHk9Ijc4IiB3aWR0aD0iMjg0IiBoZWlnaHQ9IjExMiIgcng9IjYiIGZpbGw9IndoaXRlIiBzdHJva2U9IiM2MDczNmMiIHN0cm9rZS13aWR0aD0iMS41Ii8+PHRleHQgeD0iMTgwLjAiIHk9IjExNS4wIiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyMTM0MmYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSI0MDAiPuS4ieWkqeWGheimgeWPr+eUqOabv+S7ozwvdGV4dD48dGV4dCB4PSIxODAuMCIgeT0iMTQwLjAiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxOCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC13ZWlnaHQ9IjQwMCI+54Wn54mH44CB5Zu -4","label":"怎样找到本企业真正的交接损耗"}],"exportMd":"# 第6章｜消息传到了，客户要求为什么仍会在交接中消失\n\n一家工业品经销商正在为客户寻找旧连接器的替代品。客户提供照片和图纸，明确说三天内需要拿到能用的货。销售把材料转给工程师时，概括成“客户很急，帮忙找个替代型号”；工程师再请采购查货，重点变成“这个型号能否买到”。\n\n采购找到了技术条件较合适的货源，但十天才能到货。几个人都完成了自己的任务，方案却无法满足客户最初的期限。团队只好重新查库存、讨论其他替代方式，客户仍在等待。本课的[工业品报价教学案例](#case-b)关注的，就是这种信息已经传递、约束却没有继续起作用的情况。\n\n## 每个人都在简化材料，为什么会损害同一笔生意\n\n销售关心尽快回应客户，工程师关心产品能否适用，采购关心供货与成本。面对一大段材料，他们会自然挑出与自己工作有关的部分。这样的简化通常是为了提高效率，并不意味着谁故意忽略客户。\n\n问题在于，某些信息虽然不是当前岗位首先要回答的内容，却会决定整个方案是否成立。“三天内到货”就是这样一个条件。工程师可能把它看成销售需要处理的事情，采购可能以为自己只需要查到货源。结果，技术适配和交期分别有人负责，却没有一项工作确认它们能否同时满足。\n\n到了最后汇总时，矛盾才显露出来。先前完成的部分工作不得不重做，销售还要再次向客户解释。这种损耗不一定出现在某个人的工时异常中，因为每次补问都很短；但累加起来，可能消耗掉客户允许的整个采购窗口。\n\n![客户原话包含三天期限和替代目标，转述压成“客户很急”；把原始条件关联到方案和采购，才能让期限继续约束报价。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTIwIiB2aWV3Qm94PSIwIDAgMzYwIDUyMCIgcm9sZT0iaW1nIj48dGl0bGU+5Lqk5o6l5Lit5Lii5o6J55qE5piv5p2h5Lu2PC90aXRsZT48ZGVzYz7lrqLmiLfljp/ku7bljIXlkKvkuInlpKnmnJ/pmZDjgIHnhafniYflm77nurjkuI7lvoXmoLjlt6XlhrXvvIzovazov7Dlj6rlianlrqLmiLflvojmgKXvvJvljp/mnZDmlpnlhbPogZTliLDpgInlnovmiqXku7fvvIzooaXlm57lhrPlrprmnaHku7bjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjUyMCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7kuqTmjqXkuK3kuKLmjonnmoTmmK/mnaHku7Y8L3RleHQ+PHJlY3QgeD0iMzgiIHk9Ijc4IiB3aWR0aD0iMjg0IiBoZWlnaHQ9IjExMiIgcng9IjYiIGZpbGw9IndoaXRlIiBzdHJva2U9 程师时，概括成“客户很急，帮忙找个替代型号”；工程师再请采购查货，重点变成“这个型号能否买到”。\n\n采购找到了技术条件较合适的货源，但十天才能到货。几个人都完成了自己的任务，方案却无法满足客户最初的期限。团队只好重新查库存、讨论其他替代方式，客户仍在等待。本课的[工业品报价教学案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-b)关注的，就是这种信息已经传递、约束却没有继续起作用的情况。\n\n## 每个人都在简化材料，为什么会损害同一笔生意\n\n销售关心尽快回应客户，工程师关心产品能否适用，采购关心供货与成本。面对一大段材料，他们会自然挑出与自己工作有关的部分。这样的简化通常是为了提高效率，并不意味着谁故意忽略客户。\n\n问题在于，某些信息虽然不是当前岗位首先要回答的内容，却会决定整个方案是否成立。“三天内到货”就是这样一个条件。工程师可能把它看成销售需要处理的事情，采购可能以为自己只需要查到货源。结果，技术适配和交期分别有人负责，却没有一项工作确认它们能否同时满足。\n\n到了最后汇总时，矛盾才显露出来。先前完成的部分工作不得不重做，销售还要再次向客户解释。这种损耗不一定出现在某个人的工时异常中，因为每次补问都很短；但累加起来，可能消耗掉客户允许的整个采购窗口。\n\n![客户原话包含三天期限和替代目标，转述压成“客户很急”；把原始条件关联到方案和采购，才能让期限继续约束报价。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTIwIiB2aWV3Qm94PSIwIDAgMzYwIDUyMCIgcm9sZT0iaW1nIj48dGl0bGU+5Lqk5o6l5Lit5Lii5o6J55qE5piv5p2h5Lu2PC90aXRsZT48ZGVzYz7lrqLmiLfljp/ku7bljIXlkKvkuInlpKnmnJ/pmZDjgIHnhafniYflm77nurjkuI7lvoXmoLjlt6XlhrXvvIzovazov7Dlj6rlianlrqLmiLflvojmgKXvvJvljp/mnZDmlpnlhbPogZTliLDpgInlnovmiqXku7fvvIzooaXlm57lhrPlrprmnaHku7bjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjUyMCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7kuqTmjqXkuK3kuKLmjonnmoTmmK/mnaHku7Y8L3RleHQ+PHJlY3QgeD0iMzgiIHk9Ijc4IiB3aWR0aD0iMjg0IiBoZWlnaHQ9IjExMiIgcng9IjYiIGZpbGw9IndoaXRlIiBzdHJva2U9IiM2MDczNmMiIHN0cm9rZS13aWR0aD0iMS41Ii8+PHRleHQgeD0iMTgwLjAiIHk9IjExNS4wIiBmb250LW 1pZGRsZSIgZm9udC13ZWlnaHQ9IjQwMCI+6YCJ5Z6L5LiO5oql5Lu3PC90ZXh0Pjx0ZXh0IHg9IjE4MC4wIiB5PSI0NTEuNSIgZm9udC1mYW1pbHk9IlBpbmdGYW5nIFNDLE1pY3Jvc29mdCBZYUhlaSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmaWxsPSIjMjEzNDJmIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXdlaWdodD0iNDAwIj7nu5PlkIjljp/lp4vmnaHku7Y8L3RleHQ+PHBhdGggZD0iTTM4IDEzNEgxOFY0MzRIODUiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzE2NWQ1MiIgc3Ryb2tlLXdpZHRoPSIyIiBtYXJrZXItZW5kPSJ1cmwoI2Fycm93KSIvPjx0ZXh0IHg9IjI0IiB5PSI0OTUiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxOCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7ljp/mnZDmlpnlhbPogZTliLDlhrPlrprlpITvvIzooaXlm57mg4XlooM8L3RleHQ+PC9zdmc+)\n\n图中需要关注的不是消息经过了多少个人，而是一个条件是否始终能影响后面的选择。即使客户原话还保存在聊天里，只要采购作决定时看不见，它对这一步工作就没有实际作用。\n\n## 为什么把聊天全部转发，也未必解决问题\n\n一种直觉做法是把所有人拉进群，让每个人看到全部消息。这样能减少部分信息遗漏，却也增加阅读和判断负担。客户修改过期限，销售补充过数量，工程师讨论过被放弃的方案，后来加入的人仍要弄清哪条是当前有效要求。\n\n更可行的做法，是围绕同一笔询价保留一份持续更新的工作材料。客户原话可以回查；当前数量、用途和期限清楚列出；每个候选旁边写明适配依据、库存和确认时间；尚未核实的事项保留为待办。它的作用不是再造一份汇报，而是让下一位处理者能够接着工作。\n\nAI可以先从原件和讨论中整理这份材料，在采购返回十天货期时指出它与三天期限冲突，并说明哪些候选仍可能满足要求。采购据此寻找其他供货方式，工程师判断替代条件，销售与客户确认能否接受调整。FDE则把这些材料和动作接进团队已经使用的入口，避免要求员工在业务之外维护第二套过程。\n\n## 看清信息以后，仍需分辨另外两类困难\n\n如果客户条件和工程资料都齐了，工单却一直排不到工程师，主要问题是专业时间不足。再生成一份摘要，不会使工程师多出时间。负责人可能需要调整优先顺序、安排其他支持，或缩小当前承诺。\n\n如果采购明知三天期限，却只被考核最低进价，就可能选择十天到货的便宜方案。这时信息并没有丢失，岗位目标与客户结果发生了冲突。多任务激励研究解释了为什么人会把注意力放在容易被衡量和奖励的工作上。[原始研究](https://web.stanford.edu/~milgrom/publishedarticles/Multitask%20Principal%20Agent.pdf) 企业应明确谁可以决定加急成本，以及如何评价按期交付，而不能期待AI替代这项管理选择。\n\n## 怎样找到本企业真正的交接损耗\n\n选择一笔已经完成或失败的真实业务，从客户最初要求追到最终交付。每次换人处理时，查看当时取得了哪些材料、作出了什么判断、后面又补问了什么。重复补问能够帮助定位断点，但还要继续问：信息原来就没人取得，还是已经取得却没有送到决定处？人员是看不懂，还是没有时间或权限行动？\n\n这些原因会导向不同改法。缺少客户使用条件，需要改变前端询问；现有资料找不到，需要改善关联与入口；权限不明，需要负责人重新安排责任。AI的价值在于帮助这些关系持续可见，并减少资料组织的负担。交接真正改善的标志，则是下一位同事更早形成可用判断，客户的要求能够完整走到最终动作。\n","text":"# 第6章｜消息传到了，客户要求为什么仍会在交接中消失\n\n一家工业品经销商正在为客户寻找旧连接器的替代品。客户提供照片和图纸，明确说三天内需要拿到能用的货。销售把材料转给工程师时，概括成“客户很急，帮忙找个替代型号”；工程师再请采购查货，重点变成“这个型号能否买到”。\n\n采购找到了技术条件较合适的货源，但十天才能到货。几个人都完成了自己的任务，方案却无法满足客户最初的期限。团队只好重新查库存、讨论其他替代方式，客户仍在等待。本课的工业品报价教学案例关注的，就是这种信息已经传递、约束却没有继续起作用的情况。\n\n## 每个人都在简化材料，为什么会损害同一笔生意\n\n销售关心尽快回应客户，工程师关心产品能否适用，采购关心供货与成本。面对一大段材料，他们会自然挑出与自己工作有关的部分。这样的简化通常是为了提高效率，并不意味着谁故意忽略客户。\n\n问题在于，某些信息虽然不是当前岗位首先要回答的内容，却会决定整个方案是否成立。“三天内到货”就是这样一个条件。工程师可能把它看成销售需要处理的事情，采购可能以为自己只需要查到货源。结果，技术适配和交期分别有人负责，却没有一项工作确认它们能否同时满足。\n\n到了最后汇总时，矛盾才显露出来。先前完成的部分工作不得不重做，销售还要再次向客户解释。这种损耗不一定出现在某个人的工时异常中，因为每次补问都很短；但累加起来，可能消耗掉客户允许的整个采购窗口。\n\n \n\n图中需要关注的不是消息经过了多少个人，而是一个条件是否始终能影响后面的选择。即使客户原话还保存在聊天里，只要采购作决定时看不见，它对这一步工作就没有实际作用。\n\n## 为什么把聊天全部转发，也未必解决问题\n\n一种直觉做法是把所有人拉进群，让每个人看到全部消息。这样能减少部分信息遗漏，却也增加阅读和判断负担。客户修改过期限，销售补充过数量，工程师讨论过被放弃的方案，后来加入的人仍要弄清哪条是当前有效要求。\n\n更可行的做法，是围绕同一笔询价保留一份持续更新的工作材料。客户原话可以回查；当前数量、用途和期限清楚列出；每个候选旁边写明适配依据、库存和确认时间；尚未核实的事项保留为待办。它的作用不是再造一份汇报，而是让下一位处理者能够接着工作。\n\nAI可以先从原件和讨论中整理这份材料，在采购返回十天货期时指出它与三天期限冲突，并说明哪些候选仍可能满足要求。采购据此寻找其他供货方式，工程师判断替代条件，销售与客户确认能否接受调整。FDE则把这些材料和动作接进团队已经使用的入口，避免要求员工在业务之外维护第二套过程。\n\n## 看清信息以后，仍需分辨另外两类困难\n\n如果客户条件和工程资料都齐了，工单却一直排不到工程师，主要问题是专业时间不足。再生成一份摘要，不会使工程师多出时间。负责人可能需要调整优先顺序、安排其他支持，或缩小当前承诺。\n\n如果采购明知三天期限，却只被考核最低进价，就可能选择十天到货的便宜方案。这时信息并没有丢失，岗位目标与客户结果发生了冲突。多任务激励研究解释了为什么人会把注意力放在容易被衡量和奖励的工作上。原始研究 企业应明确谁可以决定加急成本，以及如何评价按期交付，而不能期待AI替代这项管理选择。\n\n## 怎样找到本企业真正的交接损耗\n\n选择一笔已经完成或失败的真实业务，从客户最初要求追到最终交付。每次换人处理时，查看当时取得了哪些材料、作出了什么判断、后面又补问了什么。重复补问能够帮助定位断点，但还要继续问：信息原来就没人取得，还是已经取得却没有送到决定处？人员是看不懂，还是没有时间或权限行动？\n\n这些原因会导向不同改法。缺少客户使用条件，需要改变前端询问；现有资料找不到，需要改善关联与入口；权限不明，需要负责人重新安排责任。AI的价值在于帮助这些关系持续可见，并减少资料组织的负担。交接真正改善的标志，则是下一位同事更早形成可用判断，客户的要求能够完整走到最终动作。\n"},{"file":"07-生产中的采集.md","id":"lesson-07","number":7,"role":"核心课","part":1,"title":"第7章｜一笔报价怎样同时完成交付，并留下下一次能用的经验","md":"# 第7章｜一笔报价怎样同时完成交付，并留下下一次能用的经验\n\n不少企业知道复盘有价值，却很难坚持。月底整理成功案例时，要先翻聊天、找报价版本，再请销售和工程师回忆当时为什么这样选。业务忙时，这项工作最先被推迟。等有时间整理，当事人又未必记得哪些方案曾被排除，最后只能写成“及时响应，顺利成交”。\n\n这不是一句没有价值的话，但下一位同事很难靠它处理复杂询价。经验沉淀真正昂贵的部分，往往发生在写总结之前：重新找到材料、还原背景、理解各人的判断。如果这些工作能在业务进行时就得到支持，积累的成本结构才会发生变化。\n\n## 先看一次报价本来就要产生什么\n\n在[工业品报价教学案例](案例B-智能资源成本.md)里，客户要求三天内取得连接器替代品。销售收到照片与图纸，工程师比较候选，采购确认货期。一个现货型号还缺少适配依据，另一个技术条件较清楚的型号要十天才能供货，团队还要判断是否能采用其他适配方式。\n\n为了把这笔业务做成，团队本来就需要保存客户要求、查产品说明、记录供应商回复，并反复修改报价。关键并非再让每个人写一篇经验文章，而是让这些已有材料能够对应到同一笔询价，让每次修改保留与前一版本的关系。\n\n例如，采购确认某候选需要十天供货时，AI可以把回复放到该候选旁边，提示它不满足本次期限。工程师否决另一个候选时，留下的是适用条件上的具体差别，而不是一句“不能用”。这些信息首先帮助同事接着推进今天的工作，同时已经为未来保留了选择依据。\n\n![询价原件进入报价与交付，人员修订和结果与原件汇合形成候选经验；后续任务再检验适用性。](assets/07-生产与积累.svg)\n\n图中的两条用途共享输入。客户材料和人员修改不用等到月底重新收集，它们在服务当前交付的同时，成为后续整理经验的基础。这才是“在生产中积累”的具体含义。\n\n## 为什么不能只保留最终成交方案\n\n假如最终报价选用了某个型号，新人下次看到相似照片，可能直接照用。但这次选择可能依赖客户的期限、供货状态和可接受的适配方式。换一个期限，原来被排除的型号可能更合适；库存改变，原方案也可能无法兑现。\n\n因此，值得留下的不只是“选了什么”，还有“为何没选其他方案”。否决理由把企业的取舍显露出来：哪个条件必须满足，哪项缺口需要补问，什么代价可以接受。这些信息使下一位使用者能够比较当前情境，而不只是复制旧答案。\n\n正式报价以后，记录还需要延伸到交付。供应商是否按时到货，客户是否接受，方案后来有没有出现问题，会改变我们对前面判断的评价。若只保留成交时的顺利状态，企业容易把尚未兑现的承诺当成成功经验。\n\n## 下一次使用，才使材料逐渐成为方法\n\n新询价到来时，AI可以找到相关旧案，并指出相似处与差异。例如两次都需要替代同类连接器，但这次允许十天交付，工况也不同。人员据此重新确认候选，而不是默认旧选择继续有效。\n\n如果多次工作都显示，某类询价常因使用条件不清而返工，团队就可以把这项发现变成前端补问规则：销售接单时先取得哪些条件，缺失时怎样向客户确认。FDE将它做进实际工作，再看返工是否减少。新经验由此产生于一次次采用和修订，而不是只由总结者从历史材料中写出来。\n\n知识形成研究关注个人实践、表达和共同使用之间的转换。[原始研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf) AI可以帮助材料被组织、差别被看见；业务人员和实际结果则不断约束解释。这样的配合，让经验既能保存，也能继续发展。\n\n## 整理更容易，并不意味着不用付出组织成本\n\n自动生成一段总结很容易，纠正一段错误总结可能很费专业时间。如果AI反复混淆型号或把候选写成已采用，专家仍要从头核对，积累成本并没有真正降下来。\n\n因此，开始时应围绕一类高价值工作，观察哪些材料本来就在产生，哪些差别值得人工确认，以及下一次是否真的用得上。对象与时间对应可由业务系统负责，AI负责非标准材料的整理和比较，人员集中确认会改变决策的关键内容。不要让模型承担所有身份匹配，也不要让专家替模型逐字重写所有材料。\n\n企业不必先把多年经验整理完，才能开始使用AI。先在一条正在运行的业务里，使原要求、选择依据、实际动作和后续结果能够接续。只要下一位同事少一次重复寻找，少一次无根据的照搬，积累就已经开始为生产服务，而不再只是生产结束后的一项额外任务。\n","html":"\u003ch1>第7章｜一笔报价怎样同时完成交付，并留下下一次能用的经验\u003c/h1>\n\u003cp>不少企业知道复盘有价值，却很难坚持。月底整理成功案例时，要先翻聊天、找报价版本，再请销售和工程师回忆当时为什么这样选。业务忙时，这项工作最先被推迟。等有时间整理，当事人又未必记得哪些方案曾被排除，最后只能写成“及时响应，顺利成交”。\u003c/p>\n\u003cp>这不是一句没有价值的话，但下一位同事很难靠它处理复杂询价。经验沉淀真正昂贵的部分，往往发生在写总结之前：重新找到材料、还原背景、理解各人的判断。如果这些工作能在业务进行时就得到支持，积累的成本结构才会发生变化。\u003c/p>\n\u003ch2 id=\"lesson-07-section-1\">先看一次报价本来就要产生什么\u003c/h2>\n\u003cp>在\u003ca href=\"#case-b\">工业品报价教学案例\u003c/a>里，客户要求三天内取得连接器替代品。销售收到照片与图纸，工程师比较候选，采购确认货期。一个现货型号还缺少适配依据，另一个技术条件较清楚的型号要十天才能供货，团队还要判断是否能采用其他适配方式。\u003c/p>\n\u003cp>为了把这笔业务做成，团队本来就需要保存客户要求、查产品说明、记录供应商回复，并反复修改报价。关键并非再让每个人写一篇经验文章，而是让这些已有材料能够对应到同一笔询价，让每次修改保留与前一版本的关系。\u003c/p>\n\u003cp>例如，采购确认某候选需要十天供货时，AI可以把回复放到该候选旁边，提示它不满足本次期限。工程师否决另一个候选时，留下的是适用条件上的具体差别，而不是一句“不能用”。这些信息首先帮助同事接着推进今天的工作，同时已经为未来保留了选择依据。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNjUwIiB2aWV3Qm94PSIwIDAgMzYwIDY1MCIgcm9sZT0iaW1nIj48dGl0bGU+5LuO55Sf5Lqn5Lit55WZ5LiL5Y+v55So5p2Q5paZPC90aXRsZT48ZGVzYz7ljp/lp4vor6Lku7fov5vlhaXmiqXku7fkuI7kuqTku5jvvIzkurrlkZjkv67orqLov57lkIzljp/ku7blkoznu5PmnpzlvaLmiJDlgJnpgInnu4/pqozvvIzlho3nlLHlkI7nu63or6Lku7fmo4DpqozjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjY1MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7ku47nlJ/kuqfkuK3nlZnkuIvlj6/nlKjmnZDmlpk8L3RleHQ+PHBhdGggZD0iTTEwOCA3OEgyMzZMMjUyIDk0VjE0NEgxMDhaIiBmaWxsPSJ3aGl0ZSIgc3Ryb2tlPSIjNjA3MzZjIiBzdHJva2Utd2lkdGg9IjEuNSIvPjxwYXRoIGQ9Ik0yMzYgNzhWOTRIMjUyIiBmaWxsPSJub25lIiBzdHJva2U9IiM2MDczNmMiIHN0cm9rZS13aWR0aD0iMS41Ii8+PHRleHQgeD0iMTgwLjAiIHk9IjExNy4wIiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyMTM0MmYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSI0MDAiPuWOn+Wni+ivouS7tzwvdGV4dD48cGF0aCBkPSJNMTgwIDE0NFYxNzRIMTA2VjIwMiIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMTY1ZDUyIi 1hbmNob3I9Im1pZGRsZSIgZm9udC13ZWlnaHQ9IjQwMCI+5pyJ5p2h5Lu255qE5YCZ6YCJ57uP6aqMPC90ZXh0PjxwYXRoIGQ9Ik0xODAgNDY2TDE4MCA1MjYiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzE2NWQ1MiIgc3Ryb2tlLXdpZHRoPSIyIiBtYXJrZXItZW5kPSJ1cmwoI2Fycm93KSIvPjx0ZXh0IHg9IjIwMCIgeT0iNTAzIiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM4NzVkMjIiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjQwMCI+5YaN55So5qOA6aqMPC90ZXh0PjxyZWN0IHg9IjcwIiB5PSI1MjYiIHdpZHRoPSIyMjAiIGhlaWdodD0iNTgiIHJ4PSI2IiBmaWxsPSJ3aGl0ZSIgc3Ryb2tlPSIjNjA3MzZjIiBzdHJva2Utd2lkdGg9IjEuNSIvPjx0ZXh0IHg9IjE4MC4wIiB5PSI1NjEuMCIgZm9udC1mYW1pbHk9IlBpbmdGYW5nIFNDLE1pY3Jvc29mdCBZYUhlaSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmaWxsPSIjMjEzNDJmIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXdlaWdodD0iNDAwIj7kuIvkuIDmrKHku7vliqE8L3RleHQ+PHRleHQgeD0iMjQiIHk9IjYyNiIgZm9udC1mYW1pbHk9IlBpbmdGYW5nIFNDLE1pY3Jvc29mdCBZYUhlaSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmaWxsPSIjMjEzNDJmIiB0ZXh0LWFuY2hvcj0ic3RhcnQiIGZvbnQtd2VpZ2h0PSI0MDAiPuWFseS6q+i+k+WFpe+8jOS7jemcgOe7k+aenOS4juajgOmqjDwvdGV4dD48L3N2Zz4=\" alt=\"询价原件进入报价与交付，人员修订和结果与原件汇合形成候选经验；后续任务再检验适用性。\">\u003c/p>\n\u003cp>图中的两条用途共享输入。客户材料和人员修改不用等到月底重新收集，它们在服务当前交付的同时，成为后续整理经验的基础。这才是“在生产中积累”的具体含义。\u003c/p>\n\u003ch2 id=\"lesson-07-section-2\">为什么不能只保留最终成交方案\u003c/h2>\n\u003cp>假如最终报价选用了某个型号，新人下次看到相似照片，可能直接照用。但这次选择可能依赖客户的期限、供货状态和可接受的适配方式。换一个期限，原来被排除的型号可能更合适；库存改变，原方案也可能无法兑现。\u003c/p>\n\u003cp>因此，值得留下的不只是“选了什么”，还有“为何没选其他方案”。否决理由把企业的取舍显露出来：哪个条件必须满足，哪项缺口需要补问，什么代价可以接受。这些信息使下一位使用者能够比较当前情境，而不只是复制旧答案。\u003c/p>\n\u003cp>正式报价以后，记录还需要延伸到交付。供应商是否按时到货，客户是否接受，方案后来有没有出现问题，会改变我们对前面判断的评价。若只保留成交时的顺利状态，企业容易把尚未兑现的承诺当成成功经验。\u003c/p>\n\u003ch2 id=\"lesson-07-section-3\">下一次使用，才使材料逐渐成为方法\u003c/h2>\n\u003cp>新询价到来时，AI可以找到相关旧案，并指出相似处与差异。例如两次都需要替代同类连接器，但这次允许十天交付，工况也不同。人员据此重新确认候选，而不是默认旧选择继续有效。\u003c/p>\n\u003cp>如果多次工作都显示，某类询价常因使用条件不清而返工，团队就可以把这项发现变成前端补问规则：销售接单时先取得哪些条件，缺失时怎样向客户确认。FDE将它做进实际工作，再看返工是否减少。新经验由此产生于一次次采用和修订，而不是只由总结者从历史材料中写出来。\u003c/p>\n\u003cp>知识形成研究关注个人实践、表达和共同使用之间的转换。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a> AI可以帮助材料被组织、差别被看见；业务人员和实际结果则不断约束解释。这样的配合，让经验既能保存，也能继续发展。\u003c/p>\n\u003ch2 id=\"lesson-07-section-4\">整理更容易，并不意味着不用付出组织成本\u003c/h2>\n\u003cp>自动生成一段总结很容易，纠正一段错误总结可能很费专业时间。如果AI反复混淆型号或把候选写成已采用，专家仍要从头核对，积累成本并没有真正降下来。\u003c/p>\n\u003cp>因此，开始时应围绕一类高价值工作，观察哪些材料本来就在产生，哪些差别值得人工确认，以及下一次是否真的用得上。对象与时间对应可由业务系统负责，AI负责非标准材料的整理和比较，人员集中确认会改变决策的关键内容。不要让模型承担所有身份匹配，也不要让专家替模型逐字重写所有材料。\u003c/p>\n\u003cp>企业不必先把多年经验整理完，才能开始使用AI。先在一条正在运行的业务里，使原要求、选择依据、实际动作和后续结果能够接续。只要下一位同事少一次重复寻找，少一次无根据的照搬，积累就已经开始为生产服务，而不再只是生产结束后的一项额外任务。\u003c/p>\n","headings":[{"id":"lesson-07-section-1","label":"先看一次报价本来就要产生什么"},{"id":"lesson-07-section-2","label":"为什么不能只保留最终成交方案"},{"id":"lesson-07-section-3","label":"下一次使用，才使材料逐渐成为方法"},{"id":"lesson-07-section-4","label":"整理更容易，并不意味着不用付出组织成本"}],"exportMd":"# 第7章｜一笔报价怎样同时完成交付，并留下下一次能用的经验\n\n不少企业知道复盘有价值，却很难坚持。月底整理成功案例时，要先翻聊天、找报价版本，再请销售和工程师回忆当时为什么这样选。业务忙时，这项工作最先被推迟。等有时间整理，当事人又未必记得哪些方案曾被排除，最后只能写成“及时响应，顺利成交”。\n\n这不是一句没有价值的话，但下一位同事很难靠它处理复杂询价。经验沉淀真正昂贵的部分，往往发生在写总结之前：重新找到材料、还原背景、理解各人的判断。如果这些工作能在业务进行时就得到支持，积累的成本结构才会发生变化。\n\n## 先看一次报价本来就要产生什么\n\n在[工业品报价教学案例](#case-b)里，客户要求三天内取得连接器替代品。销售收到照片与图纸，工程师比较候选，采购确认货期。一个现货型号还缺少适配依据，另一个技术条件较清楚的型号要十天才能供货，团队还要判断是否能采用其他适配方式。\n\n为了把这笔业务做成，团队本来就需要保存客户要求、查产品说明、记录供应商回复，并反复修改报价。关键并非再让每个人写一篇经验文章，而是让这些已有材料能够对应到同一笔询价，让每次修改保留与前一版本的关系。\n\n例如，采购确认某候选需要十天供货时，AI可以把回复放到该候选旁边，提示它不满足本次期限。工程师否决另一个候选时，留下的是适用条件上的具体差别，而不是一句“不能用”。这些信息首先帮助同事接着推进今天的工作，同时已经为未来保留了选择依据。\n\n![询价原件进入报价与交付，人员修订和结果与原件汇合形成候选经验；后续任务再检验适用性。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNjUwIiB2aWV3Qm94PSIwIDAgMzYwIDY1MCIgcm9sZT0iaW1nIj48dGl0bGU+5LuO55Sf5Lqn5Lit55WZ5LiL5Y+v55So5p2Q5paZPC90aXRsZT48ZGVzYz7ljp/lp4vor6Lku7fov5vlhaXmiqXku7fkuI7kuqTku5jvvIzkurrlkZjkv67orqLov57lkIzljp/ku7blkoznu5PmnpzlvaLmiJDlgJnpgInnu4/pqozvvIzlho3nlLHlkI7nu63or6Lku7fmo4DpqozjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciB 了把这笔业务做成，团队本来就需要保存客户要求、查产品说明、记录供应商回复，并反复修改报价。关键并非再让每个人写一篇经验文章，而是让这些已有材料能够对应到同一笔询价，让每次修改保留与前一版本的关系。\n\n例如，采购确认某候选需要十天供货时，AI可以把回复放到该候选旁边，提示它不满足本次期限。工程师否决另一个候选时，留下的是适用条件上的具体差别，而不是一句“不能用”。这些信息首先帮助同事接着推进今天的工作，同时已经为未来保留了选择依据。\n\n![询价原件进入报价与交付，人员修订和结果与原件汇合形成候选经验；后续任务再检验适用性。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNjUwIiB2aWV3Qm94PSIwIDAgMzYwIDY1MCIgcm9sZT0iaW1nIj48dGl0bGU+5LuO55Sf5Lqn5Lit55WZ5LiL5Y+v55So5p2Q5paZPC90aXRsZT48ZGVzYz7ljp/lp4vor6Lku7fov5vlhaXmiqXku7fkuI7kuqTku5jvvIzkurrlkZjkv67orqLov57lkIzljp/ku7blkoznu5PmnpzlvaLmiJDlgJnpgInnu4/pqozvvIzlho3nlLHlkI7nu63or6Lku7fmo4DpqozjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjY1MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7ku47nlJ/kuqfkuK3nlZnkuIvlj6/nlKjmnZDmlpk8L3RleHQ+PHBhdGggZD0iTTEwOCA3OEgyMzZMMjUyIDk0VjE0NEgxMDhaIiBmaWxsPSJ3aGl0ZSIgc3Ryb2tlPSIjNjA3MzZjIiBzdHJva2Utd2lkdGg9IjEuNSIvPjxwYXRoIGQ9Ik0yMzYgNzhWOTRIMjUyIiBmaWxsPSJub25lIiBzdHJva2U9IiM2MDczNmMiIHN0cm9rZS13aWR0aD0iMS41Ii8+PHRleHQgeD0iMTgwLjAiIHk9IjExNy4wIiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyMTM0MmYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSI0MDAiPuWOn+Wni+ivouS7tzwvdGV4dD48cGF0aCBkPSJNMTgwIDE0NFYxNzRIMTA2VjIwMiIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMTY1ZDUyIiBzdHJva2Utd2lkdGg9IjIiIG1hcmtlci1lbmQ9InVybCgjYXJyb3cpIi8+P 对象与时间对应可由业务系统负责，AI负责非标准材料的整理和比较，人员集中确认会改变决策的关键内容。不要让模型承担所有身份匹配，也不要让专家替模型逐字重写所有材料。\n\n企业不必先把多年经验整理完，才能开始使用AI。先在一条正在运行的业务里，使原要求、选择依据、实际动作和后续结果能够接续。只要下一位同事少一次重复寻找，少一次无根据的照搬，积累就已经开始为生产服务，而不再只是生产结束后的一项额外任务。\n","text":"# 第7章｜一笔报价怎样同时完成交付，并留下下一次能用的经验\n\n不少企业知道复盘有价值，却很难坚持。月底整理成功案例时，要先翻聊天、找报价版本，再请销售和工程师回忆当时为什么这样选。业务忙时，这项工作最先被推迟。等有时间整理，当事人又未必记得哪些方案曾被排除，最后只能写成“及时响应，顺利成交”。\n\n这不是一句没有价值的话，但下一位同事很难靠它处理复杂询价。经验沉淀真正昂贵的部分，往往发生在写总结之前：重新找到材料、还原背景、理解各人的判断。如果这些工作能在业务进行时就得到支持，积累的成本结构才会发生变化。\n\n## 先看一次报价本来就要产生什么\n\n在工业品报价教学案例里，客户要求三天内取得连接器替代品。销售收到照片与图纸，工程师比较候选，采购确认货期。一个现货型号还缺少适配依据，另一个技术条件较清楚的型号要十天才能供货，团队还要判断是否能采用其他适配方式。\n\n为了把这笔业务做成，团队本来就需要保存客户要求、查产品说明、记录供应商回复，并反复修改报价。关键并非再让每个人写一篇经验文章，而是让这些已有材料能够对应到同一笔询价，让每次修改保留与前一版本的关系。\n\n例如，采购确认某候选需要十天供货时，AI可以把回复放到该候选旁边，提示它不满足本次期限。工程师否决另一个候选时，留下的是适用条件上的具体差别，而不是一句“不能用”。这些信息首先帮助同事接着推进今天的工作，同时已经为未来保留了选择依据。\n\n \n\n图中的两条用途共享输入。客户材料和人员修改不用等到月底重新收集，它们在服务当前交付的同时，成为后续整理经验的基础。这才是“在生产中积累”的具体含义。\n\n## 为什么不能只保留最终成交方案\n\n假如最终报价选用了某个型号，新人下次看到相似照片，可能直接照用。但这次选择可能依赖客户的期限、供货状态和可接受的适配方式。换一个期限，原来被排除的型号可能更合适；库存改变，原方案也可能无法兑现。\n\n因此，值得留下的不只是“选了什么”，还有“为何没选其他方案”。否决理由把企业的取舍显露出来：哪个条件必须满足，哪项缺口需要补问，什么代价可以接受。这些信息使下一位使用者能够比较当前情境，而不只是复制旧答案。\n\n正式报价以后，记录还需要延伸到交付。供应商是否按时到货，客户是否接受，方案后来有没有出现问题，会改变我们对前面判断的评价。若只保留成交时的顺利状态，企业容易把尚未兑现的承诺当成成功经验。\n\n## 下一次使用，才使材料逐渐成为方法\n\n新询价到来时，AI可以找到相关旧案，并指出相似处与差异。例如两次都需要替代同类连接器，但这次允许十天交付，工况也不同。人员据此重新确认候选，而不是默认旧选择继续有效。\n\n如果多次工作都显示，某类询价常因使用条件不清而返工，团队就可以把这项发现变成前端补问规则：销售接单时先取得哪些条件，缺失时怎样向客户确认。FDE将它做进实际工作，再看返工是否减少。新经验由此产生于一次次采用和修订，而不是只由总结者从历史材料中写出来。\n\n知识形成研究关注个人实践、表达和共同使用之间的转换。原始研究 AI可以帮助材料被组织、差别被看见；业务人员和实际结果则不断约束解释。这样的配合，让经验既能保存，也能继续发展。\n\n## 整理更容易，并不意味着不用付出组织成本\n\n自动生成一段总结很容易，纠正一段错误总结可能很费专业时间。如果AI反复混淆型号或把候选写成已采用，专家仍要从头核对，积累成本并没有真正降下来。\n\n因此，开始时应围绕一类高价值工作，观察哪些材料本来就在产生，哪些差别值得人工确认，以及下一次是否真的用得上。对象与时间对应可由业务系统负责，AI负责非标准材料的整理和比较，人员集中确认会改变决策的关键内容。不要让模型承担所有身份匹配，也不要让专家替模型逐字重写所有材料。\n\n企业不必先把多年经验整理完，才能开始使用AI。先在一条正在运行的业务里，使原要求、选择依据、实际动作和后续结果能够接续。只要下一位同事少一次重复寻找，少一次无根据的照搬，积累就已经开始为生产服务，而不再只是生产结束后的一项额外任务。\n"},{"file":"08-经验的可信度.md","id":"lesson-08","number":8,"role":"核心课","part":1,"title":"第8章｜经验越整理越像规律，怎样判断它是否真的可靠","md":"# 第8章｜经验越整理越像规律，怎样判断它是否真的可靠\n\n一家设备服务企业把维修工单交给AI整理，希望找出常见问题的处理办法。四张工单都有同一种表面症状，最后都写着“恢复”。AI很容易据此写出一段完整说明：遇到这种问题，采用某项调整即可恢复。\n\n这段话读起来比原记录清楚，但服务负责人必须继续追问：记录是否真的支持这个原因？如果新人下次照着做，哪些条件需要先确认？本章用[设备售后教学案例](案例C-设备售后.md)说明，经验的可信度应怎样在具体比较中建立。\n\n## 看似相同的四次成功，经过并不相同\n\n案例将四次工单分别记为M1到M4，V1和V2表示设备版本。它们只是便于对照的代号，关键在于每次实际发生的动作和后续观察。\n\n| 工单 | 版本与已记录动作 | 观察到的结果 |\n|---|---|---|\n| M1 | V1，调整并重启，未换件 | 当次恢复，记录到次日 |\n| M2 | V1，调整并重启 | 当次恢复，记录到次日 |\n| M3 | V2，调整，未记录重启 | 一小时后报告恢复 |\n| M4 | V1，仅记录重启 | 当次恢复，记录到次日 |\n\n先看M1、M2，两次都做了调整和重启，之后恢复。我们可以提出“调整可能有效”，但也可能是重启起作用，或者两个动作共同起作用。仅靠这两次记录，还分不开这些解释。\n\nM4只记录了重启，也恢复了。这使“必须经过调整才能恢复”的说法受到挑战。不过，记录没有写其他动作，不等于我们已经确认其他动作没有发生。M3的版本又不同，报告恢复的时间也更晚，中间是否还有别的操作并不清楚。它不能直接充当一次“只调整、不重启”的严格对照。\n\n读到这里，应当得到一个更准确的认识：我们确实观察到了恢复，但还没有完整区分恢复的原因，也没有观察到很长时间以后的效果。整理使问题更清楚，不能把原来缺失的证据补成确定结论。\n\n## 不同解释，应该引导不同的追查\n\n如果团队认为调整最关键，后续就应特别记录调整了什么，以及相近条件下采用其他处置时发生什么。如果怀疑运行负载影响恢复，就要补运行条件；如果相同症状可能来自不同问题，就要先改善分类。\n\nAI可以协助把这些解释列出来，并对照现有材料指出各自缺少什么。专业人员再决定哪些观察可行、哪些操作符合设备与服务要求。这里无需为了做实验而随意改变客户设备的处置；很多时候，先完整记录正常工作，就能排除一部分原先混在一起的解释。\n\n这种追查也会改变经验的写法。与其写“此症状的解决办法是某项调整”，不如先写清：目前在哪些版本和条件下观察到恢复，哪些原因尚未区分，下一次应先核对什么。这样的说明使接任者知道该怎样继续工作。\n\n## 技术原因没完全查清，仍然可以改进服务\n\n负责人可能担心：如果每条经验都要等原因完全证明，企业是不是永远不能行动？实际上，可以把不同决定分开。\n\n当前材料已经显示版本、动作和后续结果不完整，因此可以立即改善记录方式，让下一次工单能够保留这些内容。即使故障机理尚未查明，也可以在上门前核对设备版本、准备匹配备件、确认客户现场条件。这些动作改善的是服务准备，并不依赖某个尚未成立的技术结论。\n\n对仍在验证的经验，可以先让它帮助人员补问和比较；对已有充分依据的常规方法，再承担更多实际处理。新版本或相反结果出现时，明确交给谁复核。采用范围随着证据增加而扩大，比把所有经验都当成同样可靠更有用。\n\n## 为什么经验库天然容易偏向成功故事\n\n顺利完成的工单通常更容易关闭，也更容易被选作案例。仍在反复处理的问题可能一直挂着，停止联系的客户也可能不再反馈。只从结案材料里整理，系统看到的就可能是被筛选过的一部分工作。\n\n更进一步，企业自己的行动也会改变以后能看见什么。门店长期少备货，后面的成交量就一直受供给限制；服务团队只记录当次恢复，后续复发就可能在经验里消失。机器学习系统研究讨论了这种行动与后续数据相互影响的问题。[原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n因此，要让失败、未采用方案和后续异常有机会回到原经验旁边。企业积累的目的不是证明过去做得对，而是使下一次判断更可靠。一次明确的反例，可能比十篇没有上下文的成功总结，更能帮助团队改进方法。\n","html":"\u003ch1>第8章｜经验越整理越像规律，怎样判断它是否真的可靠\u003c/h1>\n\u003cp>一家设备服务企业把维修工单交给AI整理，希望找出常见问题的处理办法。四张工单都有同一种表面症状，最后都写着“恢复”。AI很容易据此写出一段完整说明：遇到这种问题，采用某项调整即可恢复。\u003c/p>\n\u003cp>这段话读起来比原记录清楚，但服务负责人必须继续追问：记录是否真的支持这个原因？如果新人下次照着做，哪些条件需要先确认？本章用\u003ca href=\"#case-c\">设备售后教学案例\u003c/a>说明，经验的可信度应怎样在具体比较中建立。\u003c/p>\n\u003ch2 id=\"lesson-08-section-1\">看似相同的四次成功，经过并不相同\u003c/h2>\n\u003cp>案例将四次工单分别记为M1到M4，V1和V2表示设备版本。它们只是便于对照的代号，关键在于每次实际发生的动作和后续观察。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>工单\u003c/th>\n\u003cth>版本与已记录动作\u003c/th>\n\u003cth>观察到的结果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>M1\u003c/td>\n\u003ctd>V1，调整并重启，未换件\u003c/td>\n\u003ctd>当次恢复，记录到次日\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M2\u003c/td>\n\u003ctd>V1，调整并重启\u003c/td>\n\u003ctd>当次恢复，记录到次日\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M3\u003c/td>\n\u003ctd>V2，调整，未记录重启\u003c/td>\n\u003ctd>一小时后报告恢复\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M4\u003c/td>\n\u003ctd>V1，仅记录重启\u003c/td>\n\u003ctd>当次恢复，记录到次日\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>先看M1、M2，两次都做了调整和重启，之后恢复。我们可以提出“调整可能有效”，但也可能是重启起作用，或者两个动作共同起作用。仅靠这两次记录，还分不开这些解释。\u003c/p>\n\u003cp>M4只记录了重启，也恢复了。这使“必须经过调整才能恢复”的说法受到挑战。不过，记录没有写其他动作，不等于我们已经确认其他动作没有发生。M3的版本又不同，报告恢复的时间也更晚，中间是否还有别的操作并不清楚。它不能直接充当一次“只调整、不重启”的严格对照。\u003c/p>\n\u003cp>读到这里，应当得到一个更准确的认识：我们确实观察到了恢复，但还没有完整区分恢复的原因，也没有观察到很长时间以后的效果。整理使问题更清楚，不能把原来缺失的证据补成确定结论。\u003c/p>\n\u003ch2 id=\"lesson-08-section-2\">不同解释，应该引导不同的追查\u003c/h2>\n\u003cp>如果团队认为调整最关键，后续就应特别记录调整了什么，以及相近条件下采用其他处置时发生什么。如果怀疑运行负载影响恢复，就要补运行条件；如果相同症状可能来自不同问题，就要先改善分类。\u003c/p>\n\u003cp>AI可以协助把这些解释列出来，并对照现有材料指出各自缺少什么。专业人员再决定哪些观察可行、哪些操作符合设备与服务要求。这里无需为了做实验而随意改变客户设备的处置；很多时候，先完整记录正常工作，就能排除一部分原先混在一起的解释。\u003c/p>\n\u003cp>这种追查也会改变经验的写法。与其写“此症状的解决办法是某项调整”，不如先写清：目前在哪些版本和条件下观察到恢复，哪些原因尚未区分，下一次应先核对什么。这样的说明使接任者知道该怎样继续工作。\u003c/p>\n\u003ch2 id=\"lesson-08-section-3\">技术原因没完全查清，仍然可以改进服务\u003c/h2>\n\u003cp>负责人可能担心：如果每条经验都要等原因完全证明，企业是不是永远不能行动？实际上，可以把不同决定分开。\u003c/p>\n\u003cp>当前材料已经显示版本、动作和后续结果不完整，因此可以立即改善记录方式，让下一次工单能够保留这些内容。即使故障机理尚未查明，也可以在上门前核对设备版本、准备匹配备件、确认客户现场条件。这些动作改善的是服务准备，并不依赖某个尚未成立的技术结论。\u003c/p>\n\u003cp>对仍在验证的经验，可以先让它帮助人员补问和比较；对已有充分依据的常规方法，再承担更多实际处理。新版本或相反结果出现时，明确交给谁复核。采用范围随着证据增加而扩大，比把所有经验都当成同样可靠更有用。\u003c/p>\n\u003ch2 id=\"lesson-08-section-4\">为什么经验库天然容易偏向成功故事\u003c/h2>\n\u003cp>顺利完成的工单通常更容易关闭，也更容易被选作案例。仍在反复处理的问题可能一直挂着，停止联系的客户也可能不再反馈。只从结案材料里整理，系统看到的就可能是被筛选过的一部分工作。\u003c/p>\n\u003cp>更进一步，企业自己的行动也会改变以后能看见什么。门店长期少备货，后面的成交量就一直受供给限制；服务团队只记录当次恢复，后续复发就可能在经验里消失。机器学习系统研究讨论了这种行动与后续数据相互影响的问题。\u003ca href=\"https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始论文\u003c/a>\u003c/p>\n\u003cp>因此，要让失败、未采用方案和后续异常有机会回到原经验旁边。企业积累的目的不是证明过去做得对，而是使下一次判断更可靠。一次明确的反例，可能比十篇没有上下文的成功总结，更能帮助团队改进方法。\u003c/p>\n","headings":[{"id":"lesson-08-section-1","label":"看似相同的四次成功，经过并不相同"},{"id":"lesson-08-section-2","label":"不同解释，应该引导不同的追查"},{"id":"lesson-08-section-3","label":"技术原因没完全查清，仍然可以改进服务"},{"id":"lesson-08-section-4","label":"为什么经验库天然容易偏向成功故事"}],"exportMd":"# 第8章｜经验越整理越像规律，怎样判断它是否真的可靠\n\n一家设备服务企业把维修工单交给AI整理，希望找出常见问题的处理办法。四张工单都有同一种表面症状，最后都写着“恢复”。AI很容易据此写出一段完整说明：遇到这种问题，采用某项调整即可恢复。\n\n这段话读起来比原记录清楚，但服务负责人必须继续追问：记录是否真的支持这个原因？如果新人下次照着做，哪些条件需要先确认？本章用[设备售后教学案例](#case-c)说明，经验的可信度应怎样在具体比较中建立。\n\n## 看似相同的四次成功，经过并不相同\n\n案例将四次工单分别记为M1到M4，V1和V2表示设备版本。它们只是便于对照的代号，关键在于每次实际发生的动作和后续观察。\n\n| 工单 | 版本与已记录动作 | 观察到的结果 |\n|---|---|---|\n| M1 | V1，调整并重启，未换件 | 当次恢复，记录到次日 |\n| M2 | V1，调整并重启 | 当次恢复，记录到次日 |\n| M3 | V2，调整，未记录重启 | 一小时后报告恢复 |\n| M4 | V1，仅记录重启 | 当次恢复，记录到次日 |\n\n先看M1、M2，两次都做了调整和重启，之后恢复。我们可以提出“调整可能有效”，但也可能是重启起作用，或者两个动作共同起作用。仅靠这两次记录，还分不开这些解释。\n\nM4只记录了重启，也恢复了。这使“必须经过调整才能恢复”的说法受到挑战。不过，记录没有写其他动作，不等于我们已经确认其他动作没有发生。M3的版本又不同，报告恢复的时间也更晚，中间是否还有别的操作并不清楚。它不能直接充当一次“只调整、不重启”的严格对照。\n\n读到这里，应当得到一个更准确的认识：我们确实观察到了恢复，但还没有完整区分恢复的原因，也没有观察到很长时间以后的效果。整理使问题更清楚，不能把原来缺失的证据补成确定结论。\n\n## 不同解释，应该引导不同的追查\n\n如果团队认为调整最关键，后续就应特别记录调整了什么，以及相近条件下采用其他处置时发生什么。如果怀疑运行负载影响恢复，就要补运行条件；如果相同症状可能来自不同问题，就要先改善分类。\n\nAI可以协助把这些解释列出来，并对照现有材料指出各自缺少什么。专业人员再决定哪些观察可行、哪些操作符合设备与服务要求。这里无需为了做实验而随意改变客户设备的处置；很多时候，先完整记录正常工作，就能排除一部分原先混在一起的解释。\n\n这种追查也会改变经验的写法。与其写“此症状的解决办法是某项调整”，不如先写清：目前在哪些版本和条件下观察到恢复，哪些原因尚未区分，下一次应先核对什么。这样的说明使接任者知道该怎样继续工作。\n\n## 技术原因没完全查清，仍然可以改进服务\n\n负责人可能担心：如果每条经验都要等原因完全证明，企业是不是永远不能行动？实际上，可以把不同决定分开。\n\n当前材料已经显示版本、动作和后续结果不完整，因此可以立即改善记录方式，让下一次工单能够保留这些内容。即使故障机理尚未查明，也可以在上门前核对设备版本、准备匹配备件、确认客户现场条件。这些动作改善的是服务准备，并不依赖某个尚未成立的技术结论。\n\n对仍在验证的经验，可以先让它帮助人员补问和比较；对已有充分依据的常规方法，再承担更多实际处理。新版本或相反结果出现时，明确交给谁复核。采用范围随着证据增加而扩大，比把所有经验都当成同样可靠更有用。\n\n## 为什么经验库天然容易偏向成功故事\n\n顺利完成的工单通常更容易关闭，也更容易被选作案例。仍在反复处理的问题可能一直挂着，停止联系的客户也可能不再反馈。只从结案材料里整理，系统看到的就可能是被筛选过的一部分工作。\n\n更进一步，企业自己的行动也会改变以后能看见什么。门店长期少备货，后面的成交量就一直受供给限制；服务团队只记录当次恢复，后续复发就可能在经验里消失。机器学习系统研究讨论了这种行动与后续数据相互影响的问题。[原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n因此，要让失败、未采用方案和后续异常有机会回到原经验旁边。企业积累的目的不是证明过去做得对，而是使下一次判断更可靠。一次明确的反例，可能比十篇没有上下文的成功总结，更能帮助团队改进方法。\n","exportSingleMd":"# 第8章｜经验越整理越像规律，怎样判断它是否真的可靠\n\n一家设备服务企业把维修工单交给AI整理，希望找出常见问题的处理办法。四张工单都有同一种表面症状，最后都写着“恢复”。AI很容易据此写出一段完整说明：遇到这种问题，采用某项调整即可恢复。\n\n这段话读起来比原记录清楚，但服务负责人必须继续追问：记录是否真的支持这个原因？如果新人下次照着做，哪些条件需要先确认？本章用[设备售后教学案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-c)说明，经验的可信度应怎样在具体比较中建立。\n\n## 看似相同的四次成功，经过并不相同\n\n案例将四次工单分别记为M1到M4，V1和V2表示设备版本。它们只是便于对照的代号，关键在于每次实际发生的动作和后续观察。\n\n| 工单 | 版本与已记录动作 | 观察到的结果 |\n|---|---|---|\n| M1 | V1，调整并重启，未换件 | 当次恢复，记录到次日 |\n| M2 | V1，调整并重启 | 当次恢复，记录到次日 |\n| M3 | V2，调整，未记录重启 | 一小时后报告恢复 |\n| M4 | V1，仅记录重启 | 当次恢复，记录到次日 |\n\n先看M1、M2，两次都做了调整和重启，之后恢复。我们可以提出“调整可能有效”，但也可能是重启起作用，或者两个动作共同起作用。仅靠这两次记录，还分不开这些解释。\n\nM4只记录了重启，也恢复了。这使“必须经过调整才能恢复”的说法受到挑战。不过，记录没有写其他动作，不等于我们已经确认其他动作没有发生。M3的版本又不同，报告恢复的时间也更晚，中间是否还有别的操作并不清楚。它不能直接充当一次“只调整、不重启”的严格对照。\n\n读到这里，应当得到一个更准确的认识：我们确实观察到了恢复，但还没有完整区分恢复的原因，也没有观察到很长时间以后的效果。整理使问题更清楚，不能把原来缺失的证据补成确定结论。\n\n## 不同解释，应该引导不同的追查\n\n如果团队认为调整最关键，后续就应特别记录调整了什么，以及相近条件下采用其他处置时发生什么。如果怀疑运行负载影响恢复，就要补运行条件；如果相同症状可能来自不同问题，就要先改善分类。\n\nAI可以协助把这些解释列出来，并对照现有材料指出各自缺少什么。专业人员再决定哪些观察可行、哪些操作符合设备与服务要求。这里无需为了做实验而随意改变客户设备的处置；很多时候，先完整记录正常工作，就能排除一部分原先混在一起的解释。\n\n这种追查也会改变经验的写法。与其写“此症状的解决办法是某项调整”，不如先写清：目前在哪些版本和条件下观察到恢复，哪些原因尚未区分，下一次应先核对什么。这样的说明使接任者知道该怎样继续工作。\n\n## 技术原因没完全查清，仍然可以改进服务\n\n负责人可能担心：如果每条经验都要等原因完全证明，企业是不是永远不能行动？实际上，可以把不同决定分开。\n\n当前材料已经显示版本、动作和后续结果不完整，因此可以立即改善记录方式，让下一次工单能够保留这些内容。即使故障机理尚未查明，也可以在上门前核对设备版本、准备匹配备件、确认客户现场条件。这些动作改善的是服务准备，并不依赖某个尚未成立的技术结论。\n\n对仍在验证的经验，可以先让它帮助人员补问和比较；对已有充分依据的常规方法，再承担更多实际处理。新版本或相反结果出现时，明确交给谁复核。采用范围随着证据增加而扩大，比把所有经验都当成同样可靠更有用。\n\n## 为什么经验库天然容易偏向成功故事\n\n顺利完成的工单通常更容易关闭，也更容易被选作案例。仍在反复处理的问题可能一直挂着，停止联系的客户也可能不再反馈。只从结案材料里整理，系统看到的就可能是被筛选过的一部分工作。\n\n更进一步，企业自己的行动也会改变以后能看见什么。门店长期少备货，后面的成交量就一直受供给限制；服务团队只记录当次恢复，后续复发就可能在经验里消失。机器学习系统研究讨论了这种行动与后续数据相互影响的问题。[原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n因此，要让失败、未采用方案和后续异常有机会回到原经验旁边。企业积累的目的不是证明过去做得对，而是使下一次判断更可靠。一次明确的反例，可能比十篇没有上下文的成功总结，更能帮助团队改进方法。\n","text":"# 第8章｜经验越整理越像规律，怎样判断它是否真的可靠\n\n一家设备服务企业把维修工单交给AI整理，希望找出常见问题的处理办法。四张工单都有同一种表面症状，最后都写着“恢复”。AI很容易据此写出一段完整说明：遇到这种问题，采用某项调整即可恢复。\n\n这段话读起来比原记录清楚，但服务负责人必须继续追问：记录是否真的支持这个原因？如果新人下次照着做，哪些条件需要先确认？本章用设备售后教学案例说明，经验的可信度应怎样在具体比较中建立。\n\n## 看似相同的四次成功，经过并不相同\n\n案例将四次工单分别记为M1到M4，V1和V2表示设备版本。它们只是便于对照的代号，关键在于每次实际发生的动作和后续观察。\n\n| 工单 | 版本与已记录动作 | 观察到的结果 |\n|---|---|---|\n| M1 | V1，调整并重启，未换件 | 当次恢复，记录到次日 |\n| M2 | V1，调整并重启 | 当次恢复，记录到次日 |\n| M3 | V2，调整，未记录重启 | 一小时后报告恢复 |\n| M4 | V1，仅记录重启 | 当次恢复，记录到次日 |\n\n先看M1、M2，两次都做了调整和重启，之后恢复。我们可以提出“调整可能有效”，但也可能是重启起作用，或者两个动作共同起作用。仅靠这两次记录，还分不开这些解释。\n\nM4只记录了重启，也恢复了。这使“必须经过调整才能恢复”的说法受到挑战。不过，记录没有写其他动作，不等于我们已经确认其他动作没有发生。M3的版本又不同，报告恢复的时间也更晚，中间是否还有别的操作并不清楚。它不能直接充当一次“只调整、不重启”的严格对照。\n\n读到这里，应当得到一个更准确的认识：我们确实观察到了恢复，但还没有完整区分恢复的原因，也没有观察到很长时间以后的效果。整理使问题更清楚，不能把原来缺失的证据补成确定结论。\n\n## 不同解释，应该引导不同的追查\n\n如果团队认为调整最关键，后续就应特别记录调整了什么，以及相近条件下采用其他处置时发生什么。如果怀疑运行负载影响恢复，就要补运行条件；如果相同症状可能来自不同问题，就要先改善分类。\n\nAI可以协助把这些解释列出来，并对照现有材料指出各自缺少什么。专业人员再决定哪些观察可行、哪些操作符合设备与服务要求。这里无需为了做实验而随意改变客户设备的处置；很多时候，先完整记录正常工作，就能排除一部分原先混在一起的解释。\n\n这种追查也会改变经验的写法。与其写“此症状的解决办法是某项调整”，不如先写清：目前在哪些版本和条件下观察到恢复，哪些原因尚未区分，下一次应先核对什么。这样的说明使接任者知道该怎样继续工作。\n\n## 技术原因没完全查清，仍然可以改进服务\n\n负责人可能担心：如果每条经验都要等原因完全证明，企业是不是永远不能行动？实际上，可以把不同决定分开。\n\n当前材料已经显示版本、动作和后续结果不完整，因此可以立即改善记录方式，让下一次工单能够保留这些内容。即使故障机理尚未查明，也可以在上门前核对设备版本、准备匹配备件、确认客户现场条件。这些动作改善的是服务准备，并不依赖某个尚未成立的技术结论。\n\n对仍在验证的经验，可以先让它帮助人员补问和比较；对已有充分依据的常规方法，再承担更多实际处理。新版本或相反结果出现时，明确交给谁复核。采用范围随着证据增加而扩大，比把所有经验都当成同样可靠更有用。\n\n## 为什么经验库天然容易偏向成功故事\n\n顺利完成的工单通常更容易关闭，也更容易被选作案例。仍在反复处理的问题可能一直挂着，停止联系的客户也可能不再反馈。只从结案材料里整理，系统看到的就可能是被筛选过的一部分工作。\n\n更进一步，企业自己的行动也会改变以后能看见什么。门店长期少备货，后面的成交量就一直受供给限制；服务团队只记录当次恢复，后续复发就可能在经验里消失。机器学习系统研究讨论了这种行动与后续数据相互影响的问题。原始论文\n\n因此，要让失败、未采用方案和后续异常有机会回到原经验旁边。企业积累的目的不是证明过去做得对，而是使下一次判断更可靠。一次明确的反例，可能比十篇没有上下文的成功总结，更能帮助团队改进方法。\n"},{"file":"09-组织记忆.md","id":"lesson-09","number":9,"role":"核心课","part":1,"title":"第9章｜人离开以后，企业留下的经验还能不能工作","md":"# 第9章｜人离开以后，企业留下的经验还能不能工作\n\n一位资深技术员休假前，把维修文档、客户说明和常用表格全部交给接任者。文件没有少，接任者却仍然不断打电话询问：哪份方法是最新的，这台设备以前到底做过什么，特殊备件在哪里申请，遇到新版本应该找谁？\n\n这些问题说明，经验的保存与能力的接续并不是同一件事。组织记忆需要帮助后来的人找到相关事实，理解过去的判断，并取得继续工作的条件。文档是其中一部分，但文件夹完整并不代表交接已经完成。\n\n## 一台设备为什么会被多次当成“第一次处理”\n\n在[设备售后教学案例](案例C-设备售后.md)里，客户每次报修都会生成工单。原工单写着已关闭，过几天出现相似问题，又新建一单。若两张工单没有关联到同一台设备，接任者就可能重新询问、重新诊断，甚至重复上次已经没有解决问题的操作。\n\n把设备身份、历次报修、实际动作和后续结果对应起来，接任者才会看见一段连续经过。他可以先判断：这是另一种新问题，还是原问题又出现了？上次使用的是哪个版本的方法？客户这次补充的信息是否改变了原来的理解？\n\nAI适合按照当前问题组织这段经过，帮助新人不必先知道某个文件叫什么。但前提是材料本身存在，设备和工单能够正确对应。几份写得流畅的摘要，不能代替已经丢失的关系。\n\n## 一次可用的交接，应当接住哪些东西\n\n接任者首先需要原始事实，例如设备版本、客户要求和实际操作。其次需要理解方法：为什么先做这一步，哪些情况不能照用，过去出现过什么反例。否则，找到了答案也可能用错。\n\n接着，他还需要工具和协作条件。知道应检查备件库存，却没有查询入口；知道需要专家确认，却不知道由谁接手，工作仍然会停住。最后，接任者要能把本次新情况和结果交回，使后面的人不必再次从头追问。\n\n这些内容的保存方式可以不同。正式流程适合有明确版本的文档，操作技能可能需要示范，专家支持需要稳定的联系与响应安排。知识研究把表达和共同实践联系起来，正是因为不少能力只能在使用中学会。[原始研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)\n\n## 用一项新任务，找出真正缺失的部分\n\n要检查交接是否有效，可以让一位具备专业基础、没有参与原整理的人员处理一张新版本工单。这里并不要求他独立解决所有故障，而是观察他能否沿着合理路径推进。\n\n如果他不知道从哪里找到历史，问题在入口和关联。如果找到了旧方法，却没发现当前版本不同，问题在适用说明。如果已经识别差异，知道应该请专家判断，却联系不到人，缺的是协作安排。不同断点需要不同修复，不能都归结为“再培训一次”或“再补一篇文档”。\n\nFDE可以根据这些真实断点改工具和工作入口：让当前工单显示关联历史，在旧方法旁明确适用版本，将未解决问题送到对应人员，并让新结果返回。改完以后，再用一项新的任务看接任者是否更顺利，而不是只演示作者自己熟悉的路径。\n\n## 企业不必保存所有东西，但要知道关键依赖在哪里\n\n低频、非核心的工作可以继续依赖外部专业支持，不一定要全部内化。经常影响核心客户的服务能力，则需要考虑多人接任、资料连续性和必要工具的可用性。\n\n判断优先级时，可以看原人离开几天会发生什么：只是稍慢一些，还是重要客户无人能处理？过去材料能否帮助接任者，还是必须由原人重新解释？这些差异会影响企业应投入多少资源。\n\n组织记忆也需要清理。已经被新版本替代的方法，仍可作为历史保留，但应避免继续作为默认答案。否则资料越多，接任者反而越难判断该用哪一份。\n\n当原技术员不在，一项未见过的新任务仍然能够找到依据、取得支持并留下结果，企业才真正接住了一部分经验。专家的价值并没有减少，而是通过可接续的工作方式，影响了更多同事和更多任务。\n","html":"\u003ch1>第9章｜人离开以后，企业留下的经验还能不能工作\u003c/h1>\n\u003cp>一位资深技术员休假前，把维修文档、客户说明和常用表格全部交给接任者。文件没有少，接任者却仍然不断打电话询问：哪份方法是最新的，这台设备以前到底做过什么，特殊备件在哪里申请，遇到新版本应该找谁？\u003c/p>\n\u003cp>这些问题说明，经验的保存与能力的接续并不是同一件事。组织记忆需要帮助后来的人找到相关事实，理解过去的判断，并取得继续工作的条件。文档是其中一部分，但文件夹完整并不代表交接已经完成。\u003c/p>\n\u003ch2 id=\"lesson-09-section-1\">一台设备为什么会被多次当成“第一次处理”\u003c/h2>\n\u003cp>在\u003ca href=\"#case-c\">设备售后教学案例\u003c/a>里，客户每次报修都会生成工单。原工单写着已关闭，过几天出现相似问题，又新建一单。若两张工单没有关联到同一台设备，接任者就可能重新询问、重新诊断，甚至重复上次已经没有解决问题的操作。\u003c/p>\n\u003cp>把设备身份、历次报修、实际动作和后续结果对应起来，接任者才会看见一段连续经过。他可以先判断：这是另一种新问题，还是原问题又出现了？上次使用的是哪个版本的方法？客户这次补充的信息是否改变了原来的理解？\u003c/p>\n\u003cp>AI适合按照当前问题组织这段经过，帮助新人不必先知道某个文件叫什么。但前提是材料本身存在，设备和工单能够正确对应。几份写得流畅的摘要，不能代替已经丢失的关系。\u003c/p>\n\u003ch2 id=\"lesson-09-section-2\">一次可用的交接，应当接住哪些东西\u003c/h2>\n\u003cp>接任者首先需要原始事实，例如设备版本、客户要求和实际操作。其次需要理解方法：为什么先做这一步，哪些情况不能照用，过去出现过什么反例。否则，找到了答案也可能用错。\u003c/p>\n\u003cp>接着，他还需要工具和协作条件。知道应检查备件库存，却没有查询入口；知道需要专家确认，却不知道由谁接手，工作仍然会停住。最后，接任者要能把本次新情况和结果交回，使后面的人不必再次从头追问。\u003c/p>\n\u003cp>这些内容的保存方式可以不同。正式流程适合有明确版本的文档，操作技能可能需要示范，专家支持需要稳定的联系与响应安排。知识研究把表达和共同实践联系起来，正是因为不少能力只能在使用中学会。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-09-section-3\">用一项新任务，找出真正缺失的部分\u003c/h2>\n\u003cp>要检查交接是否有效，可以让一位具备专业基础、没有参与原整理的人员处理一张新版本工单。这里并不要求他独立解决所有故障，而是观察他能否沿着合理路径推进。\u003c/p>\n\u003cp>如果他不知道从哪里找到历史，问题在入口和关联。如果找到了旧方法，却没发现当前版本不同，问题在适用说明。如果已经识别差异，知道应该请专家判断，却联系不到人，缺的是协作安排。不同断点需要不同修复，不能都归结为“再培训一次”或“再补一篇文档”。\u003c/p>\n\u003cp>FDE可以根据这些真实断点改工具和工作入口：让当前工单显示关联历史，在旧方法旁明确适用版本，将未解决问题送到对应人员，并让新结果返回。改完以后，再用一项新的任务看接任者是否更顺利，而不是只演示作者自己熟悉的路径。\u003c/p>\n\u003ch2 id=\"lesson-09-section-4\">企业不必保存所有东西，但要知道关键依赖在哪里\u003c/h2>\n\u003cp>低频、非核心的工作可以继续依赖外部专业支持，不一定要全部内化。经常影响核心客户的服务能力，则需要考虑多人接任、资料连续性和必要工具的可用性。\u003c/p>\n\u003cp>判断优先级时，可以看原人离开几天会发生什么：只是稍慢一些，还是重要客户无人能处理？过去材料能否帮助接任者，还是必须由原人重新解释？这些差异会影响企业应投入多少资源。\u003c/p>\n\u003cp>组织记忆也需要清理。已经被新版本替代的方法，仍可作为历史保留，但应避免继续作为默认答案。否则资料越多，接任者反而越难判断该用哪一份。\u003c/p>\n\u003cp>当原技术员不在，一项未见过的新任务仍然能够找到依据、取得支持并留下结果，企业才真正接住了一部分经验。专家的价值并没有减少，而是通过可接续的工作方式，影响了更多同事和更多任务。\u003c/p>\n","headings":[{"id":"lesson-09-section-1","label":"一台设备为什么会被多次当成“第一次处理”"},{"id":"lesson-09-section-2","label":"一次可用的交接，应当接住哪些东西"},{"id":"lesson-09-section-3","label":"用一项新任务，找出真正缺失的部分"},{"id":"lesson-09-section-4","label":"企业不必保存所有东西，但要知道关键依赖在哪里"}],"exportMd":"# 第9章｜人离开以后，企业留下的经验还能不能工作\n\n一位资深技术员休假前，把维修文档、客户说明和常用表格全部交给接任者。文件没有少，接任者却仍然不断打电话询问：哪份方法是最新的，这台设备以前到底做过什么，特殊备件在哪里申请，遇到新版本应该找谁？\n\n这些问题说明，经验的保存与能力的接续并不是同一件事。组织记忆需要帮助后来的人找到相关事实，理解过去的判断，并取得继续工作的条件。文档是其中一部分，但文件夹完整并不代表交接已经完成。\n\n## 一台设备为什么会被多次当成“第一次处理”\n\n在[设备售后教学案例](#case-c)里，客户每次报修都会生成工单。原工单写着已关闭，过几天出现相似问题，又新建一单。若两张工单没有关联到同一台设备，接任者就可能重新询问、重新诊断，甚至重复上次已经没有解决问题的操作。\n\n把设备身份、历次报修、实际动作和后续结果对应起来，接任者才会看见一段连续经过。他可以先判断：这是另一种新问题，还是原问题又出现了？上次使用的是哪个版本的方法？客户这次补充的信息是否改变了原来的理解？\n\nAI适合按照当前问题组织这段经过，帮助新人不必先知道某个文件叫什么。但前提是材料本身存在，设备和工单能够正确对应。几份写得流畅的摘要，不能代替已经丢失的关系。\n\n## 一次可用的交接，应当接住哪些东西\n\n接任者首先需要原始事实，例如设备版本、客户要求和实际操作。其次需要理解方法：为什么先做这一步，哪些情况不能照用，过去出现过什么反例。否则，找到了答案也可能用错。\n\n接着，他还需要工具和协作条件。知道应检查备件库存，却没有查询入口；知道需要专家确认，却不知道由谁接手，工作仍然会停住。最后，接任者要能把本次新情况和结果交回，使后面的人不必再次从头追问。\n\n这些内容的保存方式可以不同。正式流程适合有明确版本的文档，操作技能可能需要示范，专家支持需要稳定的联系与响应安排。知识研究把表达和共同实践联系起来，正是因为不少能力只能在使用中学会。[原始研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)\n\n## 用一项新任务，找出真正缺失的部分\n\n要检查交接是否有效，可以让一位具备专业基础、没有参与原整理的人员处理一张新版本工单。这里并不要求他独立解决所有故障，而是观察他能否沿着合理路径推进。\n\n如果他不知道从哪里找到历史，问题在入口和关联。如果找到了旧方法，却没发现当前版本不同，问题在适用说明。如果已经识别差异，知道应该请专家判断，却联系不到人，缺的是协作安排。不同断点需要不同修复，不能都归结为“再培训一次”或“再补一篇文档”。\n\nFDE可以根据这些真实断点改工具和工作入口：让当前工单显示关联历史，在旧方法旁明确适用版本，将未解决问题送到对应人员，并让新结果返回。改完以后，再用一项新的任务看接任者是否更顺利，而不是只演示作者自己熟悉的路径。\n\n## 企业不必保存所有东西，但要知道关键依赖在哪里\n\n低频、非核心的工作可以继续依赖外部专业支持，不一定要全部内化。经常影响核心客户的服务能力，则需要考虑多人接任、资料连续性和必要工具的可用性。\n\n判断优先级时，可以看原人离开几天会发生什么：只是稍慢一些，还是重要客户无人能处理？过去材料能否帮助接任者，还是必须由原人重新解释？这些差异会影响企业应投入多少资源。\n\n组织记忆也需要清理。已经被新版本替代的方法，仍可作为历史保留，但应避免继续作为默认答案。否则资料越多，接任者反而越难判断该用哪一份。\n\n当原技术员不在，一项未见过的新任务仍然能够找到依据、取得支持并留下结果，企业才真正接住了一部分经验。专家的价值并没有减少，而是通过可接续的工作方式，影响了更多同事和更多任务。\n","exportSingleMd":"# 第9章｜人离开以后，企业留下的经验还能不能工作\n\n一位资深技术员休假前，把维修文档、客户说明和常用表格全部交给接任者。文件没有少，接任者却仍然不断打电话询问：哪份方法是最新的，这台设备以前到底做过什么，特殊备件在哪里申请，遇到新版本应该找谁？\n\n这些问题说明，经验的保存与能力的接续并不是同一件事。组织记忆需要帮助后来的人找到相关事实，理解过去的判断，并取得继续工作的条件。文档是其中一部分，但文件夹完整并不代表交接已经完成。\n\n## 一台设备为什么会被多次当成“第一次处理”\n\n在[设备售后教学案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-c)里，客户每次报修都会生成工单。原工单写着已关闭，过几天出现相似问题，又新建一单。若两张工单没有关联到同一台设备，接任者就可能重新询问、重新诊断，甚至重复上次已经没有解决问题的操作。\n\n把设备身份、历次报修、实际动作和后续结果对应起来，接任者才会看见一段连续经过。他可以先判断：这是另一种新问题，还是原问题又出现了？上次使用的是哪个版本的方法？客户这次补充的信息是否改变了原来的理解？\n\nAI适合按照当前问题组织这段经过，帮助新人不必先知道某个文件叫什么。但前提是材料本身存在，设备和工单能够正确对应。几份写得流畅的摘要，不能代替已经丢失的关系。\n\n## 一次可用的交接，应当接住哪些东西\n\n接任者首先需要原始事实，例如设备版本、客户要求和实际操作。其次需要理解方法：为什么先做这一步，哪些情况不能照用，过去出现过什么反例。否则，找到了答案也可能用错。\n\n接着，他还需要工具和协作条件。知道应检查备件库存，却没有查询入口；知道需要专家确认，却不知道由谁接手，工作仍然会停住。最后，接任者要能把本次新情况和结果交回，使后面的人不必再次从头追问。\n\n这些内容的保存方式可以不同。正式流程适合有明确版本的文档，操作技能可能需要示范，专家支持需要稳定的联系与响应安排。知识研究把表达和共同实践联系起来，正是因为不少能力只能在使用中学会。[原始研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)\n\n## 用一项新任务，找出真正缺失的部分\n\n要检查交接是否有效，可以让一位具备专业基础、没有参与原整理的人员处理一张新版本工单。这里并不要求他独立解决所有故障，而是观察他能否沿着合理路径推进。\n\n如果他不知道从哪里找到历史，问题在入口和关联。如果找到了旧方法，却没发现当前版本不同，问题在适用说明。如果已经识别差异，知道应该请专家判断，却联系不到人，缺的是协作安排。不同断点需要不同修复，不能都归结为“再培训一次”或“再补一篇文档”。\n\nFDE可以根据这些真实断点改工具和工作入口：让当前工单显示关联历史，在旧方法旁明确适用版本，将未解决问题送到对应人员，并让新结果返回。改完以后，再用一项新的任务看接任者是否更顺利，而不是只演示作者自己熟悉的路径。\n\n## 企业不必保存所有东西，但要知道关键依赖在哪里\n\n低频、非核心的工作可以继续依赖外部专业支持，不一定要全部内化。经常影响核心客户的服务能力，则需要考虑多人接任、资料连续性和必要工具的可用性。\n\n判断优先级时，可以看原人离开几天会发生什么：只是稍慢一些，还是重要客户无人能处理？过去材料能否帮助接任者，还是必须由原人重新解释？这些差异会影响企业应投入多少资源。\n\n组织记忆也需要清理。已经被新版本替代的方法，仍可作为历史保留，但应避免继续作为默认答案。否则资料越多，接任者反而越难判断该用哪一份。\n\n当原技术员不在，一项未见过的新任务仍然能够找到依据、取得支持并留下结果，企业才真正接住了一部分经验。专家的价值并没有减少，而是通过可接续的工作方式，影响了更多同事和更多任务。\n","text":"# 第9章｜人离开以后，企业留下的经验还能不能工作\n\n一位资深技术员休假前，把维修文档、客户说明和常用表格全部交给接任者。文件没有少，接任者却仍然不断打电话询问：哪份方法是最新的，这台设备以前到底做过什么，特殊备件在哪里申请，遇到新版本应该找谁？\n\n这些问题说明，经验的保存与能力的接续并不是同一件事。组织记忆需要帮助后来的人找到相关事实，理解过去的判断，并取得继续工作的条件。文档是其中一部分，但文件夹完整并不代表交接已经完成。\n\n## 一台设备为什么会被多次当成“第一次处理”\n\n在设备售后教学案例里，客户每次报修都会生成工单。原工单写着已关闭，过几天出现相似问题，又新建一单。若两张工单没有关联到同一台设备，接任者就可能重新询问、重新诊断，甚至重复上次已经没有解决问题的操作。\n\n把设备身份、历次报修、实际动作和后续结果对应起来，接任者才会看见一段连续经过。他可以先判断：这是另一种新问题，还是原问题又出现了？上次使用的是哪个版本的方法？客户这次补充的信息是否改变了原来的理解？\n\nAI适合按照当前问题组织这段经过，帮助新人不必先知道某个文件叫什么。但前提是材料本身存在，设备和工单能够正确对应。几份写得流畅的摘要，不能代替已经丢失的关系。\n\n## 一次可用的交接，应当接住哪些东西\n\n接任者首先需要原始事实，例如设备版本、客户要求和实际操作。其次需要理解方法：为什么先做这一步，哪些情况不能照用，过去出现过什么反例。否则，找到了答案也可能用错。\n\n接着，他还需要工具和协作条件。知道应检查备件库存，却没有查询入口；知道需要专家确认，却不知道由谁接手，工作仍然会停住。最后，接任者要能把本次新情况和结果交回，使后面的人不必再次从头追问。\n\n这些内容的保存方式可以不同。正式流程适合有明确版本的文档，操作技能可能需要示范，专家支持需要稳定的联系与响应安排。知识研究把表达和共同实践联系起来，正是因为不少能力只能在使用中学会。原始研究\n\n## 用一项新任务，找出真正缺失的部分\n\n要检查交接是否有效，可以让一位具备专业基础、没有参与原整理的人员处理一张新版本工单。这里并不要求他独立解决所有故障，而是观察他能否沿着合理路径推进。\n\n如果他不知道从哪里找到历史，问题在入口和关联。如果找到了旧方法，却没发现当前版本不同，问题在适用说明。如果已经识别差异，知道应该请专家判断，却联系不到人，缺的是协作安排。不同断点需要不同修复，不能都归结为“再培训一次”或“再补一篇文档”。\n\nFDE可以根据这些真实断点改工具和工作入口：让当前工单显示关联历史，在旧方法旁明确适用版本，将未解决问题送到对应人员，并让新结果返回。改完以后，再用一项新的任务看接任者是否更顺利，而不是只演示作者自己熟悉的路径。\n\n## 企业不必保存所有东西，但要知道关键依赖在哪里\n\n低频、非核心的工作可以继续依赖外部专业支持，不一定要全部内化。经常影响核心客户的服务能力，则需要考虑多人接任、资料连续性和必要工具的可用性。\n\n判断优先级时，可以看原人离开几天会发生什么：只是稍慢一些，还是重要客户无人能处理？过去材料能否帮助接任者，还是必须由原人重新解释？这些差异会影响企业应投入多少资源。\n\n组织记忆也需要清理。已经被新版本替代的方法，仍可作为历史保留，但应避免继续作为默认答案。否则资料越多，接任者反而越难判断该用哪一份。\n\n当原技术员不在，一项未见过的新任务仍然能够找到依据、取得支持并留下结果，企业才真正接住了一部分经验。专家的价值并没有减少，而是通过可接续的工作方式，影响了更多同事和更多任务。\n"},{"file":"10-标准与情境.md","id":"lesson-10","number":10,"role":"核心课","part":1,"title":"第10章｜先统一哪些东西，才能让经验复用而不压平差异","md":"# 第10章｜先统一哪些东西，才能让经验复用而不压平差异\n\n一家连锁企业希望比较各门店何时卖完主打商品。表格发下去以后，X店填的是货架最后一份售出的时间，Y店填的是盘点发现库存为零的时间，还有门店把临时下架也记成售罄。总部得到一张整齐的表，却无法确定不同店的数据是否在说同一件事。\n\n这时确实需要标准化。但如果总部进一步规定所有门店每天都配相同数量，又会把交通枢纽店、社区店和新店的差异抹掉。标准化的难点不只是“统一得够不够”，而是哪些内容必须共同理解，哪些判断应留给实际条件。\n\n## 先使同一件事，在不同人那里仍是同一件事\n\n课程的[连锁烘焙案例](案例A-连锁备货.md)中，X店在交通枢纽附近，Y店位于居民区。同一款点心由工坊生产、总部安排、配送送到门店，最后由门店销售。一次补货会经过多个岗位。\n\n如果总部说“给X店补160份”，有人理解为当天总量160份，有人理解为在原来80份之外再补160份，执行结果就会完全不同。因此，商品、门店、营业日、数量含义需要清楚；计划数量、批准数量和实际收到数量，也要分别记录。\n\n这种统一不是给员工增加术语，而是使他们能够可靠地接着前一个人的工作。后面复盘时，也才能知道销售结果对应哪次真实安排，而不是对应一条从未执行的建议。\n\n## 共同事实，并不要求共同答案\n\nX店和Y店客流结构不同，即使使用同样的销量和库存定义，也不应自动得出同样的备货量。X店提前售罄，说明成交记录可能没有显示全部需求；Y店有剩余，则需要考虑需求时段、产品组合或其他因素。\n\n两店可以共同遵守一种分析方法：先查实际销售和售罄时点，再取得需求线索，核对生产与配送条件，最后比较不同安排。这个方法使判断过程可讨论、结果可追查，具体配多少则由当前事实决定。\n\n在案例的正常日假设下，X店需求160份、Y店60份，按160/60安排可能有利。但若交通变化使X店需求降到50份、Y店升到90份，原来的安排就会把过多商品送到X店。成功过一次的数量，不能直接成为下一次不再讨论的统一配额。\n\nAI可以帮助保留“为什么当时这样决定”，并在新任务中提示当前条件不同。这样企业可以在尚未把所有情境写成规则之前，先共享相关经验。[知识研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)、[上下文工程](https://www.anthropic.com/research/effective-context-engineering-for-ai-agents)\n\n## 允许现场调整，怎样避免变成各行其是\n\n假如店长知道明天附近交通将改变，可以提出调整备货，并说明消息来源、预计影响和建议数量。总部或授权负责人作出决定后，保留实际执行和结果。下一次遇到类似情况，团队就有材料比较。\n\n这里应区分两个问题：决定当时是否使用了可取得的信息，以及最后结果是否符合预期。如果交通信息在决定前已经知道却无人处理，需要修复信息和责任；如果决定后才突然变化，就需要评价响应能力。只按最终销量奖惩，会把两种情况混在一起，也会使员工不愿报告不确定信息。\n\n并非所有规则都应随意调整。涉及品质、安全、财务等已有明确要求的部分，继续按正式制度执行；尚在探索的需求判断，则可以在约定范围内试验。把这两类工作分清，才既有稳定性，也容得下新认识。\n\n## 标准可以随业务学习逐步形成\n\n企业进入数字化时，容易以为必须先把全部流程和SOP写完整，系统才能开始使用。对变化多、依赖经验的工作，这可能是一项很大的前置投入，而且写完时现场又已改变。\n\n可以先从共同事实和少数关键动作开始：大家知道什么算售罄，什么算实际到货，异常由谁确认，结果怎样回到原决定。AI协助整理自然工作材料，人员在使用中发现反复出现的差别，再把经过检验的部分稳定为方法。\n\n这样形成的标准，既让不同岗位能够合作，也保留企业认识新情况的能力。真正可复用的东西，是理解事实、作出判断并持续修订的方法；每家门店在某一天应当得到的答案，仍要回到它自己的经营条件。\n","html":"\u003ch1>第10章｜先统一哪些东西，才能让经验复用而不压平差异\u003c/h1>\n\u003cp>一家连锁企业希望比较各门店何时卖完主打商品。表格发下去以后，X店填的是货架最后一份售出的时间，Y店填的是盘点发现库存为零的时间，还有门店把临时下架也记成售罄。总部得到一张整齐的表，却无法确定不同店的数据是否在说同一件事。\u003c/p>\n\u003cp>这时确实需要标准化。但如果总部进一步规定所有门店每天都配相同数量，又会把交通枢纽店、社区店和新店的差异抹掉。标准化的难点不只是“统一得够不够”，而是哪些内容必须共同理解，哪些判断应留给实际条件。\u003c/p>\n\u003ch2 id=\"lesson-10-section-1\">先使同一件事，在不同人那里仍是同一件事\u003c/h2>\n\u003cp>课程的\u003ca href=\"#case-a\">连锁烘焙案例\u003c/a>中，X店在交通枢纽附近，Y店位于居民区。同一款点心由工坊生产、总部安排、配送送到门店，最后由门店销售。一次补货会经过多个岗位。\u003c/p>\n\u003cp>如果总部说“给X店补160份”，有人理解为当天总量160份，有人理解为在原来80份之外再补160份，执行结果就会完全不同。因此，商品、门店、营业日、数量含义需要清楚；计划数量、批准数量和实际收到数量，也要分别记录。\u003c/p>\n\u003cp>这种统一不是给员工增加术语，而是使他们能够可靠地接着前一个人的工作。后面复盘时，也才能知道销售结果对应哪次真实安排，而不是对应一条从未执行的建议。\u003c/p>\n\u003ch2 id=\"lesson-10-section-2\">共同事实，并不要求共同答案\u003c/h2>\n\u003cp>X店和Y店客流结构不同，即使使用同样的销量和库存定义，也不应自动得出同样的备货量。X店提前售罄，说明成交记录可能没有显示全部需求；Y店有剩余，则需要考虑需求时段、产品组合或其他因素。\u003c/p>\n\u003cp>两店可以共同遵守一种分析方法：先查实际销售和售罄时点，再取得需求线索，核对生产与配送条件，最后比较不同安排。这个方法使判断过程可讨论、结果可追查，具体配多少则由当前事实决定。\u003c/p>\n\u003cp>在案例的正常日假设下，X店需求160份、Y店60份，按160/60安排可能有利。但若交通变化使X店需求降到50份、Y店升到90份，原来的安排就会把过多商品送到X店。成功过一次的数量，不能直接成为下一次不再讨论的统一配额。\u003c/p>\n\u003cp>AI可以帮助保留“为什么当时这样决定”，并在新任务中提示当前条件不同。这样企业可以在尚未把所有情境写成规则之前，先共享相关经验。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">知识研究\u003c/a>、\u003ca href=\"https://www.anthropic.com/research/effective-context-engineering-for-ai-agents\" target=\"_blank\" rel=\"noopener noreferrer\">上下文工程\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-10-section-3\">允许现场调整，怎样避免变成各行其是\u003c/h2>\n\u003cp>假如店长知道明天附近交通将改变，可以提出调整备货，并说明消息来源、预计影响和建议数量。总部或授权负责人作出决定后，保留实际执行和结果。下一次遇到类似情况，团队就有材料比较。\u003c/p>\n\u003cp>这里应区分两个问题：决定当时是否使用了可取得的信息，以及最后结果是否符合预期。如果交通信息在决定前已经知道却无人处理，需要修复信息和责任；如果决定后才突然变化，就需要评价响应能力。只按最终销量奖惩，会把两种情况混在一起，也会使员工不愿报告不确定信息。\u003c/p>\n\u003cp>并非所有规则都应随意调整。涉及品质、安全、财务等已有明确要求的部分，继续按正式制度执行；尚在探索的需求判断，则可以在约定范围内试验。把这两类工作分清，才既有稳定性，也容得下新认识。\u003c/p>\n\u003ch2 id=\"lesson-10-section-4\">标准可以随业务学习逐步形成\u003c/h2>\n\u003cp>企业进入数字化时，容易以为必须先把全部流程和SOP写完整，系统才能开始使用。对变化多、依赖经验的工作，这可能是一项很大的前置投入，而且写完时现场又已改变。\u003c/p>\n\u003cp>可以先从共同事实和少数关键动作开始：大家知道什么算售罄，什么算实际到货，异常由谁确认，结果怎样回到原决定。AI协助整理自然工作材料，人员在使用中发现反复出现的差别，再把经过检验的部分稳定为方法。\u003c/p>\n\u003cp>这样形成的标准，既让不同岗位能够合作，也保留企业认识新情况的能力。真正可复用的东西，是理解事实、作出判断并持续修订的方法；每家门店在某一天应当得到的答案，仍要回到它自己的经营条件。\u003c/p>\n","headings":[{"id":"lesson-10-section-1","label":"先使同一件事，在不同人那里仍是同一件事"},{"id":"lesson-10-section-2","label":"共同事实，并不要求共同答案"},{"id":"lesson-10-section-3","label":"允许现场调整，怎样避免变成各行其是"},{"id":"lesson-10-section-4","label":"标准可以随业务学习逐步形成"}],"exportMd":"# 第10章｜先统一哪些东西，才能让经验复用而不压平差异\n\n一家连锁企业希望比较各门店何时卖完主打商品。表格发下去以后，X店填的是货架最后一份售出的时间，Y店填的是盘点发现库存为零的时间，还有门店把临时下架也记成售罄。总部得到一张整齐的表，却无法确定不同店的数据是否在说同一件事。\n\n这时确实需要标准化。但如果总部进一步规定所有门店每天都配相同数量，又会把交通枢纽店、社区店和新店的差异抹掉。标准化的难点不只是“统一得够不够”，而是哪些内容必须共同理解，哪些判断应留给实际条件。\n\n## 先使同一件事，在不同人那里仍是同一件事\n\n课程的[连锁烘焙案例](#case-a)中，X店在交通枢纽附近，Y店位于居民区。同一款点心由工坊生产、总部安排、配送送到门店，最后由门店销售。一次补货会经过多个岗位。\n\n如果总部说“给X店补160份”，有人理解为当天总量160份，有人理解为在原来80份之外再补160份，执行结果就会完全不同。因此，商品、门店、营业日、数量含义需要清楚；计划数量、批准数量和实际收到数量，也要分别记录。\n\n这种统一不是给员工增加术语，而是使他们能够可靠地接着前一个人的工作。后面复盘时，也才能知道销售结果对应哪次真实安排，而不是对应一条从未执行的建议。\n\n## 共同事实，并不要求共同答案\n\nX店和Y店客流结构不同，即使使用同样的销量和库存定义，也不应自动得出同样的备货量。X店提前售罄，说明成交记录可能没有显示全部需求；Y店有剩余，则需要考虑需求时段、产品组合或其他因素。\n\n两店可以共同遵守一种分析方法：先查实际销售和售罄时点，再取得需求线索，核对生产与配送条件，最后比较不同安排。这个方法使判断过程可讨论、结果可追查，具体配多少则由当前事实决定。\n\n在案例的正常日假设下，X店需求160份、Y店60份，按160/60安排可能有利。但若交通变化使X店需求降到50份、Y店升到90份，原来的安排就会把过多商品送到X店。成功过一次的数量，不能直接成为下一次不再讨论的统一配额。\n\nAI可以帮助保留“为什么当时这样决定”，并在新任务中提示当前条件不同。这样企业可以在尚未把所有情境写成规则之前，先共享相关经验。[知识研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)、[上下文工程](https://www.anthropic.com/research/effective-context-engineering-for-ai-agents)\n\n## 允许现场调整，怎样避免变成各行其是\n\n假如店长知道明天附近交通将改变，可以提出调整备货，并说明消息来源、预计影响和建议数量。总部或授权负责人作出决定后，保留实际执行和结果。下一次遇到类似情况，团队就有材料比较。\n\n这里应区分两个问题：决定当时是否使用了可取得的信息，以及最后结果是否符合预期。如果交通信息在决定前已经知道却无人处理，需要修复信息和责任；如果决定后才突然变化，就需要评价响应能力。只按最终销量奖惩，会把两种情况混在一起，也会使员工不愿报告不确定信息。\n\n并非所有规则都应随意调整。涉及品质、安全、财务等已有明确要求的部分，继续按正式制度执行；尚在探索的需求判断，则可以在约定范围内试验。把这两类工作分清，才既有稳定性，也容得下新认识。\n\n## 标准可以随业务学习逐步形成\n\n企业进入数字化时，容易以为必须先把全部流程和SOP写完整，系统才能开始使用。对变化多、依赖经验的工作，这可能是一项很大的前置投入，而且写完时现场又已改变。\n\n可以先从共同事实和少数关键动作开始：大家知道什么算售罄，什么算实际到货，异常由谁确认，结果怎样回到原决定。AI协助整理自然工作材料，人员在使用中发现反复出现的差别，再把经过检验的部分稳定为方法。\n\n这样形成的标准，既让不同岗位能够合作，也保留企业认识新情况的能力。真正可复用的东西，是理解事实、作出判断并持续修订的方法；每家门店在某一天应当得到的答案，仍要回到它自己的经营条件。\n","exportSingleMd":"# 第10章｜先统一哪些东西，才能让经验复用而不压平差异\n\n一家连锁企业希望比较各门店何时卖完主打商品。表格发下去以后，X店填的是货架最后 。\n\n## 先使同一件事，在不同人那里仍是同一件事\n\n课程的连锁烘焙案例中，X店在交通枢纽附近，Y店位于居民区。同一款点心由工坊生产、总部安排、配送送到门店，最后由门店销售。一次补货会经过多个岗位。\n\n如果总部说“给X店补160份”，有人理解为当天总量160份，有人理解为在原来80份之外再补160份，执行结果就会完全不同。因此，商品、门店、营业日、数量含义需要清楚；计划数量、批准数量和实际收到数量，也要分别记录。\n\n这种统一不是给员工增加术语，而是使他们能够可靠地接着前一个人的工作。后面复盘时，也才能知道销售结果对应哪次真实安排，而不是对应一条从未执行的建议。\n\n## 共同事实，并不要求共同答案\n\nX店和Y店客流结构不同，即使使用同样的销量和库存定义，也不应自动得出同样的备货量。X店提前售罄，说明成交记录可能没有显示全部需求；Y店有剩余，则需要考虑需求时段、产品组合或其他因素。\n\n两店可以共同遵守一种分析方法：先查实际销售和售罄时点，再取得需求线索，核对生产与配送条件，最后比较不同安排。这个方法使判断过程可讨论、结果可追查，具体配多少则由当前事实决定。\n\n在案例的正常日假设下，X店需求160份、Y店60份，按160/60安排可能有利。但若交通变化使X店需求降到50份、Y店升到90份，原来的安排就会把过多商品送到X店。成功过一次的数量，不能直接成为下一次不再讨论的统一配额。\n\nAI可以帮助保留“为什么当时这样决定”，并在新任务中提示当前条件不同。这样企业可以在尚未把所有情境写成规则之前，先共享相关经验。知识研究、上下文工程\n\n## 允许现场调整，怎样避免变成各行其是\n\n假如店长知道明天附近交通将改变，可以提出调整备货，并说明消息来源、预计影响和建议数量。总部或授权负责人作出决定后，保留实际执行和结果。下一次遇到类似情况，团队就有材料比较。\n\n这里应区分两个问题：决定当时是否使用了可取得的信息，以及最后结果是否符合预期。如果交通信息在决定前已经知道却无人处理，需要修复信息和责任；如果决定后才突然变化，就需要评价响应能力。只按最终销量奖惩，会把两种情况混在一起，也会使员工不愿报告不确定信息。\n\n并非所有规则都应随意调整。涉及品质、安全、财务等已有明确要求的部分，继续按正式制度执行；尚在探索的需求判断，则可以在约定范围内试验。把这两类工作分清，才既有稳定性，也容得下新认识。\n\n## 标准可以随业务学习逐步形成\n\n企业进入数字化时，容易以为必须先把全部流程和SOP写完整，系统才能开始使用。对变化多、依赖经验的工作，这可能是一项很大的前置投入，而且写完时现场又已改变。\n\n可以先从共同事实和少数关键动作开始：大家知道什么算售罄，什么算实际到货，异常由谁确认，结果怎样回到原决定。AI协助整理自然工作材料，人员在使用中发现反复出现的差别，再把经过检验的部分稳定为方法。\n\n这样形成的标准，既让不同岗位能够合作，也保留企业认识新情况的能力。真正可复用的东西，是理解事实、作出判断并持续修订的方法；每家门店在某一天应当得到的答案，仍要回到它自己的经营条件。\n"},{"file":"11-客户认可的价值.md","id":"lesson-11","number":11,"role":"核心课","part":2,"title":"第11章｜企业的独特做法，什么时候值得用AI放大","md":"# 第11章｜企业的独特做法，什么时候值得用AI放大\n\n一家工业品经销商介绍自己的优势时说：“我们有经验丰富的工程师，能够按客户要求定制。”这可能是真的，却还不足以决定AI项目应当做什么。工程师的哪些经验影响客户选择？哪些定制只是企业长期形成的内部习惯？如果不先分清，项目很容易把所有现有做法都当成值得保留的特色。\n\n企业需要找到的，是客户遇到某种困难时，本企业能以什么方式提供更好的结果。AI降低了复制一般性工作的门槛，更应该把资源集中到这些有价值的差别上。\n\n## 先把内部长处翻译成客户实际遇到的事\n\n在[工业品报价教学案例](案例B-智能资源成本.md)中，客户拿着旧连接器的照片，希望三天内得到能用的替代品。对客户而言，“经验丰富”有没有价值，要看工程师能否在材料不全时识别关键条件，找到适配与交期都成立的路线。\n\n工程师也许很快看出某个现货型号不能直接使用，于是让销售补问工作环境，再与供应商确认另一种适配方式。这些动作使客户避免买到不能用的产品，也可能赶上原本很紧的期限。此时，“经验丰富”才有了可观察的含义。\n\n但如果客户最终选择这家经销商，主要是因为价格最低或长期采购协议，就不能把成交全部归因于工程判断。应该结合客户为什么选、为什么没选，以及实际业务经过，判断哪些差别真正起了作用。对客户的访谈提供线索，选择行为和交付结果则帮助检验这些线索。\n\n## 可靠经营的基础，与差异化投入要分别看\n\n报价中的型号和价格准确，是企业应当具备的基础。即使客户不会单独为“没有写错”多付钱，企业也值得改善，因为错误会带来损失和信任下降。\n\n另一类能力可能影响特定客户持续选择，例如在紧急、非标准的需求下，能够快速找到可靠替代并组织交付。这类能力值得进一步研究能否扩展到更多销售和更多客户。两种投入都有价值，只是理由不同：前者保证企业可靠运转，后者争取更有利的客户选择。\n\n若把每项基础改进都包装成竞争壁垒，容易高估收益；若只做独特功能，又可能在基础事实和交付上不断出错。企业可以使用成熟工具承担通用部分，将有限的FDE和专业资源投入那些需要结合自身方法、资料与关系才能完成的部分。\n\nTeece的研究把资源、客户价值与交付安排联系起来。[动态能力研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)、[商业模式研究](https://www.sciencedirect.com/science/article/pii/S002463010900051X) 从这个角度看，独特做法本身不是优势，只有当它持续产生客户在意的结果，并且企业能够承担成本，它才具有经营意义。\n\n## 怎样分辨“企业特色”与“历史包袱”\n\n假设所有复杂询价都必须等同一位工程师审批，企业可能把这称为严格把关。进一步观察，却要区分其中哪些事项确实需要他的专业判断，哪些只是销售没拿到完整资料，或者其他人没有查询权限。\n\n如果大量时间用在反复找同一份说明书、重新确认客户期限，AI可以帮助把这些准备提前完成。这会保护专家真正稀缺的判断时间。如果某种复杂适配仍需要他亲自判断，就应保留支持安排，并逐步研究哪些判断能够通过案例、带教和工具传播。\n\n不能因为一种做法存在多年，就原样固化成系统。FDE需要和业务人员一起看它解决过什么问题，现在是否仍然必要，以及新的技术条件能否让企业以更好的方式保留原来的价值。\n\n## 放大之前，还要考虑能否接住更多业务\n\n更多销售掌握判断方法以后，询价可能更快进入可成交阶段。但库存、采购和交付若没有相应容量，企业就可能承诺得更多、兑现得更差。优势的扩展需要看整项交付，而不只看某个岗位处理了多少份材料。\n\n因此，这家经销商可以提出一个具体的改造方向：让更多销售在承诺前看清客户条件和可履约路线，减少重复补问，同时保持每单应有的贡献。这个方向同时说明了要帮助谁、改善什么、保留什么经营条件。\n\n接下来才适合决定需要什么工具。也许需要关联原询价与产品依据，也许需要连接实时库存，也许要改变专家支持的方式。客户价值先被讲清，技术选择才能围绕企业真正值得发展的长处展开。\n","html":"\u003ch1>第11章｜企业的独特做法，什么时候值得用AI放大\u003c/h1>\n\u003cp>一家工业品经销商介绍自己的优势时说：“我们有经验丰富的工程师，能够按客户要求定制。”这可能是真的，却还不足以决定AI项目应当做什么。工程师的哪些经验影响客户选择？哪些定制只是企业长期形成的内部习惯？如果不先分清，项目很容易把所有现有做法都当成值得保留的特色。\u003c/p>\n\u003cp>企业需要找到的，是客户遇到某种困难时，本企业能以什么方式提供更好的结果。AI降低了复制一般性工作的门槛，更应该把资源集中到这些有价值的差别上。\u003c/p>\n\u003ch2 id=\"lesson-11-section-1\">先把内部长处翻译成客户实际遇到的事\u003c/h2>\n\u003cp>在\u003ca href=\"#case-b\">工业品报价教学案例\u003c/a>中，客户拿着旧连接器的照片，希望三天内得到能用的替代品。对客户而言，“经验丰富”有没有价值，要看工程师能否在材料不全时识别关键条件，找到适配与交期都成立的路线。\u003c/p>\n\u003cp>工程师也许很快看出某个现货型号不能直接使用，于是让销售补问工作环境，再与供应商确认另一种适配方式。这些动作使客户避免买到不能用的产品，也可能赶上原本很紧的期限。此时，“经验丰富”才有了可观察的含义。\u003c/p>\n\u003cp>但如果客户最终选择这家经销商，主要是因为价格最低或长期采购协议，就不能把成交全部归因于工程判断。应该结合客户为什么选、为什么没选，以及实际业务经过，判断哪些差别真正起了作用。对客户的访谈提供线索，选择行为和交付结果则帮助检验这些线索。\u003c/p>\n\u003ch2 id=\"lesson-11-section-2\">可靠经营的基础，与差异化投入要分别看\u003c/h2>\n\u003cp>报价中的型号和价格准确，是企业应当具备的基础。即使客户不会单独为“没有写错”多付钱，企业也值得改善，因为错误会带来损失和信任下降。\u003c/p>\n\u003cp>另一类能力可能影响特定客户持续选择，例如在紧急、非标准的需求下，能够快速找到可靠替代并组织交付。这类能力值得进一步研究能否扩展到更多销售和更多客户。两种投入都有价值，只是理由不同：前者保证企业可靠运转，后者争取更有利的客户选择。\u003c/p>\n\u003cp>若把每项基础改进都包装成竞争壁垒，容易高估收益；若只做独特功能，又可能在基础事实和交付上不断出错。企业可以使用成熟工具承担通用部分，将有限的FDE和专业资源投入那些需要结合自身方法、资料与关系才能完成的部分。\u003c/p>\n\u003cp>Teece的研究把资源、客户价值与交付安排联系起来。\u003ca href=\"https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">动态能力研究\u003c/a>、\u003ca href=\"https://www.sciencedirect.com/science/article/pii/S002463010900051X\" target=\"_blank\" rel=\"noopener noreferrer\">商业模式研究\u003c/a> 从这个角度看，独特做法本身不是优势，只有当它持续产生客户在意的结果，并且企业能够承担成本，它才具有经营意义。\u003c/p>\n\u003ch2 id=\"lesson-11-section-3\">怎样分辨“企业特色”与“历史包袱”\u003c/h2>\n\u003cp>假设所有复杂询价都必须等同一位工程师审批，企业可能把这称为严格把关。进一步观察，却要区分其中哪些事项确实需要他的专业判断，哪些只是销售没拿到完整资料，或者其他人没有查询权限。\u003c/p>\n\u003cp>如果大量时间用在反复找同一份说明书、重新确认客户期限，AI可以帮助把这些准备提前完成。这会保护专家真正稀缺的判断时间。如果某种复杂适配仍需要他亲自判断，就应保留支持安排，并逐步研究哪些判断能够通过案例、带教和工具传播。\u003c/p>\n\u003cp>不能因为一种做法存在多年，就原样固化成系统。FDE需要和业务人员一起看它解决过什么问题，现在是否仍然必要，以及新的技术条件能否让企业以更好的方式保留原来的价值。\u003c/p>\n\u003ch2 id=\"lesson-11-section-4\">放大之前，还要考虑能否接住更多业务\u003c/h2>\n\u003cp>更多销售掌握判断方法以后，询价可能更快进入可成交阶段。但库存、采购和交付若没有相应容量，企业就可能承诺得更多、兑现得更差。优势的扩展需要看整项交付，而不只看某个岗位处理了多少份材料。\u003c/p>\n\u003cp>因此，这家经销商可以提出一个具体的改造方向：让更多销售在承诺前看清客户条件和可履约路线，减少重复补问，同时保持每单应有的贡献。这个方向同时说明了要帮助谁、改善什么、保留什么经营条件。\u003c/p>\n\u003cp>接下来才适合决定需要什么工具。也许需要关联原询价与产品依据，也许需要连接实时库存，也许要改变专家支持的方式。客户价值先被讲清，技术选择才能围绕企业真正值得发展的长处展开。\u003c/p>\n","headings":[{"id":"lesson-11-section-1","label":"先把内部长处翻译成客户实际遇到的事"},{"id":"lesson-11-section-2","label":"可靠经营的基础，与差异化投入要分别看"},{"id":"lesson-11-section-3","label":"怎样分辨“企业特色”与“历史包袱”"},{"id":"lesson-11-section-4","label":"放大之前，还要考虑能否接住更多业务"}],"exportMd":"# 第11章｜企业的独特做法，什么时候值得用AI放大\n\n一家工业品经销商介绍自己的优势时说：“我们有经验丰富的工程师，能够按客户要求定制。”这可能是真的，却还不足以决定AI项目应当做什么。工程师的哪些经验影响客户选择？哪些定制只是企业长期形成的内部习惯？如果不先分清，项目很容易把所有现有做法都当成值得保留的特色。\n\n企业需要找到的，是客户遇到某种困难时，本企业能以什么方式提供更好的结果。AI降低了复制一般性工作的门槛，更应该把资源集中到这些有价值的差别上。\n\n## 先把内部长处翻译成客户实际遇到的事\n\n在[工业品报价教学案例](#case-b)中，客户拿着旧连接器的照片，希望三天内得到能用的替代品。对客户而言，“经验丰富”有没有价值，要看工程师能否在材料不全时识别关键条件，找到适配与交期都成立的路线。\n\n工程师也许很快看出某个现货型号不能直接使用，于是让销售补问工作环境，再与供应商确认另一种适配方式。这些动作使客户避免买到不能用的产品，也可能赶上原本很紧的期限。此时，“经验丰富”才有了可观察的含义。\n\n但如果客户最终选择这家经销商，主要是因为价格最低或长期采购协议，就不能把成交全部归因于工程判断。应该结合客户为什么选、为什么没选，以及实际业务经过，判断哪些差别真正起了作用。对客户的访谈提供线索，选择行为和交付结果则帮助检验这些线索。\n\n## 可靠经营的基础，与差异化投入要分别看\n\n报价中的型号和价格准确，是企业应当具备的基础。即使客户不会单独为“没有写错”多付钱，企业也值得改善，因为错误会带来损失和信任下降。\n\n另一类能力可能影响特定客户持续选择，例如在紧急、非标准的需求下，能够快速找到可靠替代并组织交付。这类能力值得进一步研究能否扩展到更多销售和更多客户。两种投入都有价值，只是理由不同：前者保证企业可靠运转，后者争取更有利的客户选择。\n\n若把每项基础改进都包装成竞争壁垒，容易高估收益；若只做独特功能，又可能在基础事实和交付上不断出错。企业可以使用成熟工具承担通用部分，将有限的FDE和专业资源投入那些需要结合自身方法、资料与关系才能完成的部分。\n\nTeece的研究把资源、客户价值与交付安排联系起来。[动态能力研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)、[商业模式研究](https://www.sciencedirect.com/science/article/pii/S002463010900051X) 从这个角度看，独特做法本身不是优势，只有当它持续产生客户在意的结果，并且企业能够承担成本，它才具有经营意义。\n\n## 怎样分辨“企业特色”与“历史包袱”\n\n假设所有复杂询价都必须等同一位工程师审批，企业可能把这称为严格把关。进一步观察，却要区分其中哪些事项确实需要他的专业判断，哪些只是销售没拿到完整资料，或者其他人没有查询权限。\n\n如果大量时间用在反复找同一份说明书、重新确认客户期限，AI可以帮助把这些准备提前完成。这会保护专家真正稀缺的判断时间。如果某种复杂适配仍需要他亲自判断，就应保留支持安排，并逐步研究哪些判断能够通过案例、带教和工具传播。\n\n不能因为一种做法存在多年，就原样固化成系统。FDE需要和业务人员一起看它解决过什么问题，现在是否仍然必要，以及新的技术条件能否让企业以更好的方式保留原来的价值。\n\n## 放大之前，还要考虑能否接住更多业务\n\n更多销售掌握判断方法以后，询价可能更快进入可成交阶段。但库存、采购和交付若没有相应容量，企业就可能承诺得更多、兑现得更差。优势的扩展需要看整项交付，而不只看某个岗位处理了多少份材料。\n\n因此，这家经销商可以提出一个具体的改造方向：让更多销售在承诺前看清客户条件和可履约路线，减少重复补问，同时保持每单应有的贡献。这个方向同时说明了要帮助谁、改善什么、保留什么经营条件。\n\n接下来才适合决定需要什么工具。也许需要关联原询价与产品依据，也许需要连接实时库存，也许要改变专家支持的方式。客户价值先被讲清，技术选择才能围绕企业真正值得发展的长处展开。\n","exportSingleMd":"# 第11章｜企业的独特做法，什么时候值得用AI放大\n\n一家工业品经销商介绍自己的优势时说：“我们有经验丰富的工程师，能够按客户要求定制。”这可能是真的，却还不足以决定AI项目应当做什么。工程师的哪些经验影响客户选择？哪些定制只是企业长期形成的内部习惯？如果不先分清，项目很容易把所有现有做法都当成值得保留的特色。\n\n企业需要找到的，是客户遇到某种困难时，本企业能以什么方式提供更好的结果。AI降低了复制一般性工作的门槛，更应该把资源集中到这些有价值的差别上。\n\n## 先把内部长处翻译成客户实际遇到的事\n\n在[工业品报价教学案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-b)中，客户拿着旧连接器的照片，希望三天内得到能用的替代品。对客户而言，“经验丰富”有没有价值，要看工程师能否在材料不全时识别关键条件，找到适配与交期都成立的路线。\n\n工程师也许很快看出某个现货型号不能直接使用，于是让销售补问工作环境，再与供应商确认另一种适配方式。这些动作使客户避免买到不能用的产品，也可能赶上原本很紧的期限。此时，“经验丰富”才有了可观察的含义。\n\n但如果客户最终选择这家经销商，主要是因为价格最低或长期采购协议，就不能把成交全部归因于工程判断。应该结合客户为什么选、为什么没选，以及实际业务经过，判断哪些差别真正起了作用。对客户的访谈提供线索，选择行为和交付结果则帮助检验这些线索。\n\n## 可靠经营的基础，与差异化投入要分别看\n\n报价中的型号和价格准确，是企业应当具备的基础。即使客户不会单独为“没有写错”多付钱，企业也值得改善，因为错误会带来损失和信任下降。\n\n另一类能力可能影响特定客户持续选择，例如在紧急、非标准的需求下，能够快速找到可靠替代并组织交付。这类能力值得进一步研究能否扩展到更多销售和更多客户。两种投入都有价值，只是理由不同：前者保证企业可靠运转，后者争取更有利的客户选择。\n\n若把每项基础改进都包装成竞争壁垒，容易高估收益；若只做独特功能，又可能在基础事实和交付上不断出错。企业可以使用成熟工具承担通用部分，将有限的FDE和专业资源投入那些需要结合自身方法、资料与关系才能完成的部分。\n\nTeece的研究把资源、客户价值与交付安排联系起来。[动态能力研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)、[商业模式研究](https://www.sciencedirect.com/science/article/pii/S002463010900051X) 从这个角度看，独特做法本身不是优势，只有当它持续产生客户在意的结果，并且企业能够承担成本，它才具有经营意义。\n\n## 怎样分辨“企业特色”与“历史包袱”\n\n假设所有复杂询价都必须等同一位工程师审批，企业可能把这称为严格把关。进一步观察，却要区分其中哪些事项确实需要他的专业判断，哪些只是销售没拿到完整资料，或者其他人没有查询权限。\n\n如果大量时间用在反复找同一份说明书、重新确认客户期限，AI可以帮助把这些准备提前完成。这会保护专家真正稀缺的判断时间。如果某种复杂适配仍需要他亲自判断，就应保留支持安排，并逐步研究哪些判断能够通过案例、带教和工具传播。\n\n不能因为一种做法存在多年，就原样固化成系统。FDE需要和业务人员一起看它解决过什么问题，现在是否仍然必要，以及新的技术条件能否让企业以更好的方式保留原来的价值。\n\n## 放大之前，还要考虑能否接住更多业务\n\n更多销售掌握判断方法以后，询价可能更快进入可成交阶段。但库存、采购和交付若没有相应容量，企业就可能承诺得更多、兑现得更差。优势的扩展需要看整项交付，而不只看某个岗位处理了多少份材料。\n\n因此，这家经销商可以提出一个具体的改造方向：让更多销售在承诺前看清客户条件和可履约路线，减少重复补问，同时保持每单应有的贡献。这个方向同时说明了要帮助谁、改善什么、保留什么经营条件。\n\n接下来才适合决定需要什么工具。也许需要关联原询价与产品依据，也许需要连接实时库存，也许要改变专家支持的方式。客户价值先被讲清，技术选择才能围绕企业真正值得发展的长处展开。\n","text":"# 第11章｜企业的独特做法，什么时候值得用AI放大\n\n一家工业品经销商介绍自己的优势时说：“我们有经验丰富的工程师，能够按客户要求定制。”这可能是真的，却还不足以决定AI项目应当做什么。工程师的哪些经验影响客户选择？哪些定制只是企业长期形成的内部习惯？如果不先分清，项目很容易把所有现有做法都当成值得保留的特色。\n\n企业需要找到的，是客户遇到某种困难时，本企业能以什么方式提供更好的结果。AI降低了复制一般性工作的门槛，更应该把资源集中到这些有价值的差别上。\n\n## 先把内部长处翻译成客户实际遇到的事\n\n在工业品报价教学案例中，客户拿着旧连接器的照片，希望三天内得到能用的替代品。对客户而言，“经验丰富”有没有价值，要看工程师能否在材料不全时识别关键条件，找到适配与交期都成立的路线。\n\n工程师也许很快看出某个现货型号不能直接使用，于是让销售补问工作环境，再与供应商确认另一种适配方式。这些动作使客户避免买到不能用的产品，也可能赶上原本很紧的期限。此时，“经验丰富”才有了可观察的含义。\n\n但如果客户最终选择这家经销商，主要是因为价格最低或长期采购协议，就不能把成交全部归因于工程判断。应该结合客户为什么选、为什么没选，以及实际业务经过，判断哪些差别真正起了作用。对客户的访谈提供线索，选择行为和交付结果则帮助检验这些线索。\n\n## 可靠经营的基础，与差异化投入要分别看\n\n报价中的型号和价格准确，是企业应当具备的基础。即使客户不会单独为“没有写错”多付钱，企业也值得改善，因为错误会带来损失和信任下降。\n\n另一类能力可能影响特定客户持续选择，例如在紧急、非标准的需求下，能够快速找到可靠替代并组织交付。这类能力值得进一步研究能否扩展到更多销售和更多客户。两种投入都有价值，只是理由不同：前者保证企业可靠运转，后者争取更有利的客户选择。\n\n若把每项基础改进都包装成竞争壁垒，容易高估收益；若只做独特功能，又可能在基础事实和交付上不断出错。企业可以使用成熟工具承担通用部分，将有限的FDE和专业资源投入那些需要结合自身方法、资料与关系才能完成的部分。\n\nTeece的研究把资源、客户价值与交付安排联系起来。动态能力研究、商业模式研究 从这个角度看，独特做法本身不是优势，只有当它持续产生客户在意的结果，并且企业能够承担成本，它才具有经营意义。\n\n## 怎样分辨“企业特色”与“历史包袱”\n\n假设所有复杂询价都必须等同一位工程师审批，企业可能把这称为严格把关。进一步观察，却要区分其中哪些事项确实需要他的专业判断，哪些只是销售没拿到完整资料，或者其他人没有查询权限。\n\n如果大量时间用在反复找同一份说明书、重新确认客户期限，AI可以帮助把这些准备提前完成。这会保护专家真正稀缺的判断时间。如果某种复杂适配仍需要他亲自判断，就应保留支持安排，并逐步研究哪些判断能够通过案例、带教和工具传播。\n\n不能因为一种做法存在多年，就原样固化成系统。FDE需要和业务人员一起看它解决过什么问题，现在是否仍然必要，以及新的技术条件能否让企业以更好的方式保留原来的价值。\n\n## 放大之前，还要考虑能否接住更多业务\n\n更多销售掌握判断方法以后，询价可能更快进入可成交阶段。但库存、采购和交付若没有相应容量，企业就可能承诺得更多、兑现得更差。优势的扩展需要看整项交付，而不只看某个岗位处理了多少份材料。\n\n因此，这家经销商可以提出一个具体的改造方向：让更多销售在承诺前看清客户条件和可履约路线，减少重复补问，同时保持每单应有的贡献。这个方向同时说明了要帮助谁、改善什么、保留什么经营条件。\n\n接下来才适合决定需要什么工具。也许需要关联原询价与产品依据，也许需要连接实时库存，也许要改变专家支持的方式。客户价值先被讲清，技术选择才能围绕企业真正值得发展的长处展开。\n"},{"file":"12-优势的生成机制.md","id":"lesson-12","number":12,"role":"核心课","part":2,"title":"第12章｜从一个好结果，追到真正产生优势的地方","md":"# 第12章｜从一个好结果，追到真正产生优势的地方\n\n某家店总是很早卖完主打商品，总部可能认为店长选货准；某个维修团队当天关闭很多工单，负责人可能认为响应快。这些判断都有可能成立，但数字本身还没有说明结果是怎样产生的。提前售罄也可能是长期少配货，快速结案也可能没有包括后续复发。\n\n如果AI项目直接把这些数字当作优化目标，就可能把原来没有看清的偏差扩大。现场诊断要做的，是追到结果发生的过程，找出哪些关系真正影响客户和收益。\n\n## 一个零售研究，怎样改变了“分货”的问题\n\nZara的一项真实分配研究关注到，门店里某些关键尺码缺货后，整款商品会从展示中撤下。假设一款服装仍有部分尺码库存，按普通库存表看，门店似乎还可以继续销售；但如果关键尺码的缺失使整款不再展示，剩余尺码也更难被顾客看到。\n\n因此，分配时不能只问每店还缺多少件，还要考虑尺码组合怎样影响展示和销售。研究将需求、尺码组合与门店规则纳入分配，2006年试点以10款商品作匹配比较，作者估计销售改善约3%—4%。这是一项运筹与数字化研究，不是生成式AI实验。[原始论文](https://web.mit.edu/people/jgallien/ZaraOR2010.pdf)\n\n它对本课的启发在于问题定义。若不知道整款撤展这一现场规则，即使预测每个尺码的销量很精细，也可能错过重要影响。真正有价值的工程，有时从一个原来未进入系统的业务关系开始。\n\n## 烘焙店提前售罄，也需要继续追问\n\n本课的[连锁烘焙教学案例](案例A-连锁备货.md)中，交通枢纽附近的X店提前卖完点心，售罄后停止该商品的社群推介和预订记录。工坊在相关时段还有生产余量，但只有早晨一次配送。这几项信息原来分别存在于门店、排产和配送安排中。\n\n把它们连起来，可以提出一种解释：供给限制了当日销量，也使门店停止继续获取需求；总部又按这些销量安排下一轮生产，于是长期低估机会。若这个解释成立，只调整预测模型未必够，还要同时考虑下午补货和门店动作。\n\n但还有其他可能。顾客也许只愿意购买刚出炉的点心，下午增加的商品未必能卖；可能询问很多，真正愿意下单的人少；也可能新增配送的成本超过销售贡献。现场诊断需要让这些解释进入比较，而不是只收集支持扩产的材料。\n\n## 怎样使不同解释导向不同的调查\n\n如果怀疑供给压住需求，就要记录售罄后的询问、可确认预订和追加供给后的购买。如果怀疑品质与时段不合适，就看补货到店的状态、顾客选择和退换反馈。如果配送受限，则要核对实际路线、到店时间、接货和上架条件。\n\n这些观察各有用途。它们不是为了做一份更厚的调研报告，而是为了决定下一步应该改生产、改商品、改配送，还是暂时保留原方案。AI可以帮助从分散材料中找矛盾、列出待确认关系，并比较后续结果；FDE需要把资料和实际动作接起来，使解释能够接受检验。\n\n一个有用的判断应当能够说明：“如果这项解释成立，我们会看到什么；如果看不到，哪种改法就不再有理由。”例如补货后仍有大量剩余，就应重新考虑有效需求，而不是继续把原来的售罄次数当作扩产依据。\n\n## 诊断越具体，工程越容易做对\n\n“员工效率低”可以指资料找不到、专业能力不足、等待审批、资源不足等完全不同的问题。“信息不通”也可能只是一个笼统感受。这样的描述很容易让团队各自拿熟悉的工具来回答。\n\n工业品报价案例提供了更具体的说法：客户三天内到货的要求，在几次转述后没有进入采购比较，采购找到的候选十天才能到，团队因此重新找方案。这个解释已经指出，应在什么决定之前保留哪个条件。技术可以围绕它实现，而不必先建设一个包罗万象的平台。\n\n设备服务同样需要分辨。重复上门可能是带错备件，也可能是按计划完成多个阶段。前者有减少无效出行的机会，后者未必应被取消。把两者混在一个“复访率”里，会同时误导系统目标和员工评价。\n\n现场诊断的成果，不是给企业贴一个“数字化程度不足”的标签。它应让团队更清楚，一项有价值的结果被什么条件限制，哪些事实支持这个解释，以及下一次行动怎样帮助决定是否继续。这样的认识才足以指导投入。\n","html":"\u003ch1>第12章｜从一个好结果，追到真正产生优势的地方\u003c/h1>\n\u003cp>某家店总是很早卖完主打商品，总部可能认为店长选货准；某个维修团队当天关闭很多工单，负责人可能认为响应快。这些判断都有可能成立，但数字本身还没有说明结果是怎样产生的。提前售罄也可能是长期少配货，快速结案也可能没有包括后续复发。\u003c/p>\n\u003cp>如果AI项目直接把这些数字当作优化目标，就可能把原来没有看清的偏差扩大。现场诊断要做的，是追到结果发生的过程，找出哪些关系真正影响客户和收益。\u003c/p>\n\u003ch2 id=\"lesson-12-section-1\">一个零售研究，怎样改变了“分货”的问题\u003c/h2>\n\u003cp>Zara的一项真实分配研究关注到，门店里某些关键尺码缺货后，整款商品会从展示中撤下。假设一款服装仍有部分尺码库存，按普通库存表看，门店似乎还可以继续销售；但如果关键尺码的缺失使整款不再展示，剩余尺码也更难被顾客看到。\u003c/p>\n\u003cp>因此，分配时不能只问每店还缺多少件，还要考虑尺码组合怎样影响展示和销售。研究将需求、尺码组合与门店规则纳入分配，2006年试点以10款商品作匹配比较，作者估计销售改善约3%—4%。这是一项运筹与数字化研究，不是生成式AI实验。\u003ca href=\"https://web.mit.edu/people/jgallien/ZaraOR2010.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始论文\u003c/a>\u003c/p>\n\u003cp>它对本课的启发在于问题定义。若不知道整款撤展这一现场规则，即使预测每个尺码的销量很精细，也可能错过重要影响。真正有价值的工程，有时从一个原来未进入系统的业务关系开始。\u003c/p>\n\u003ch2 id=\"lesson-12-section-2\">烘焙店提前售罄，也需要继续追问\u003c/h2>\n\u003cp>本课的\u003ca href=\"#case-a\">连锁烘焙教学案例\u003c/a>中，交通枢纽附近的X店提前卖完点心，售罄后停止该商品的社群推介和预订记录。工坊在相关时段还有生产余量，但只有早晨一次配送。这几项信息原来分别存在于门店、排产和配送安排中。\u003c/p>\n\u003cp>把它们连起来，可以提出一种解释：供给限制了当日销量，也使门店停止继续获取需求；总部又按这些销量安排下一轮生产，于是长期低估机会。若这个解释成立，只调整预测模型未必够，还要同时考虑下午补货和门店动作。\u003c/p>\n\u003cp>但还有其他可能。顾客也许只愿意购买刚出炉的点心，下午增加的商品未必能卖；可能询问很多，真正愿意下单的人少；也可能新增配送的成本超过销售贡献。现场诊断需要让这些解释进入比较，而不是只收集支持扩产的材料。\u003c/p>\n\u003ch2 id=\"lesson-12-section-3\">怎样使不同解释导向不同的调查\u003c/h2>\n\u003cp>如果怀疑供给压住需求，就要记录售罄后的询问、可确认预订和追加供给后的购买。如果怀疑品质与时段不合适，就看补货到店的状态、顾客选择和退换反馈。如果配送受限，则要核对实际路线、到店时间、接货和上架条件。\u003c/p>\n\u003cp>这些观察各有用途。它们不是为了做一份更厚的调研报告，而是为了决定下一步应该改生产、改商品、改配送，还是暂时保留原方案。AI可以帮助从分散材料中找矛盾、列出待确认关系，并比较后续结果；FDE需要把资料和实际动作接起来，使解释能够接受检验。\u003c/p>\n\u003cp>一个有用的判断应当能够说明：“如果这项解释成立，我们会看到什么；如果看不到，哪种改法就不再有理由。”例如补货后仍有大量剩余，就应重新考虑有效需求，而不是继续把原来的售罄次数当作扩产依据。\u003c/p>\n\u003ch2 id=\"lesson-12-section-4\">诊断越具体，工程越容易做对\u003c/h2>\n\u003cp>“员工效率低”可以指资料找不到、专业能力不足、等待审批、资源不足等完全不同的问题。“信息不通”也可能只是一个笼统感受。这样的描述很容易让团队各自拿熟悉的工具来回答。\u003c/p>\n\u003cp>工业品报价案例提供了更具体的说法：客户三天内到货的要求，在几次转述后没有进入采购比较，采购找到的候选十天才能到，团队因此重新找方案。这个解释已经指出，应在什么决定之前保留哪个条件。技术可以围绕它实现，而不必先建设一个包罗万象的平台。\u003c/p>\n\u003cp>设备服务同样需要分辨。重复上门可能是带错备件，也可能是按计划完成多个阶段。前者有减少无效出行的机会，后者未必应被取消。把两者混在一个“复访率”里，会同时误导系统目标和员工评价。\u003c/p>\n\u003cp>现场诊断的成果，不是给企业贴一个“数字化程度不足”的标签。它应让团队更清楚，一项有价值的结果被什么条件限制，哪些事实支持这个解释，以及下一次行动怎样帮助决定是否继续。这样的认识才足以指导投入。\u003c/p>\n","headings":[{"id":"lesson-12-section-1","label":"一个零售研究，怎样改变了“分货”的问题"},{"id":"lesson-12-section-2","label":"烘焙店提前售罄，也需要继续追问"},{"id":"lesson-12-section-3","label":"怎样使不同解释导向不同的调查"},{"id":"lesson-12-section-4","label":"诊断越具体，工程越容易做对"}],"exportMd":"# 第12章｜从一个好结果，追到真正产生优势的地方\n\n某家店总是很早卖完主打商品，总部可能认为店长选货准；某个维修团队当天关闭很多工单，负责人可能认为响应快。这些判断都有可能成立，但数字本身还没有说明结果是怎样产生的。提前售罄也可能是长期少配货，快速结案也可能没有包括后续复发。\n\n如果AI项目直接把这些数字当作优化目标，就可能把原来没有看清的偏差扩大。现场诊断要做的，是追到结果发生的过程，找出哪些关系真正影响客户和收益。\n\n## 一个零售研究，怎样改变了“分货”的问题\n\nZara的一项真实分配研究关注到，门店里某些关键尺码缺货后，整款商品会从展示中撤下。假设一款服装仍有部分尺码库存，按普通库存表看，门店似乎还可以继续销售；但如果关键尺码的缺失使整款不再展示，剩余尺码也更难被顾客看到。\n\n因此，分配时不能只问每店还缺多少件，还要考虑尺码组合怎样影响展示和销售。研究将需求、尺码组合与门店规则纳入分配，2006年试点以10款商品作匹配比较，作者估计销售改善约3%—4%。这是一项运筹与数字化研究，不是生成式AI实验。[原始论文](https://web.mit.edu/people/jgallien/ZaraOR2010.pdf)\n\n它对本课的启发在于问题定义。若不知道整款撤展这一现场规则，即使预测每个尺码的销量很精细，也可能错过重要影响。真正有价值的工程，有时从一个原来未进入系统的业务关系开始。\n\n## 烘焙店提前售罄，也需要继续追问\n\n本课的[连锁烘焙教学案例](#case-a)中，交通枢纽附近的X店提前卖完点心，售罄后停止该商品的社群推介和预订记录。工坊在相关时段还有生产余量，但只有早晨一次配送。这几项信息原来分别存在于门店、排产和配送安排中。\n\n把它们连起来，可以提出一种解释：供给限制了当日销量，也使门店停止继续获取需求；总部又按这些销量安排下一轮生产，于是长期低估机会。若这个解释成立，只调整预测模型未必够，还要同时考虑下午补货和门店动作。\n\n但还有其他可能。顾客也许只愿意购买刚出炉的点心，下午增加的商品未必能卖；可能询问很多，真正愿意下单的人少；也可能新增配送的成本超过销售贡献。现场诊断需要让这些解释进入比较，而不是只收集支持扩产的材料。\n\n## 怎样使不同解释导向不同的调查\n\n如果怀疑供给压住需求，就要记录售罄后的询问、可确认预订和追加供给后的购买。如果怀疑品质与时段不合适，就看补货到店的状态、顾客选择和退换反馈。如果配送受限，则要核对实际路线、到店时间、接货和上架条件。\n\n这些观察各有用途。它们不是为了做一份更厚的调研报告，而是为了决定下一步应该改生产、改商品、改配送，还是暂时保留原方案。AI可以帮助从分散材料中找矛盾、列出待确认关系，并比较后续结果；FDE需要把资料和实际动作接起来，使解释能够接受检验。\n\n一个有用的判断应当能够说明：“如果这项解释成立，我们会看到什么；如果看不到，哪种改法就不再有理由。”例如补货后仍有大量剩余，就应重新考虑有效需求，而不是继续把原来的售罄次数当作扩产依据。\n\n## 诊断越具体，工程越容易做对\n\n“员工效率低”可以指资料找不到、专业能力不足、等待审批、资源不足等完全不同的问题。“信息不通”也可能只是一个笼统感受。这样的描述很容易让团队各自拿熟悉的工具来回答。\n\n工业品报价案例提供了更具体的说法：客户三天内到货的要求，在几次转述后没有进入采购比较，采购找到的候选十天才能到，团队因此重新找方案。这个解释已经指出，应在什么决定之前保留哪个条件。技术可以围绕它实现，而不必先建设一个包罗万象的平台。\n\n设备服务同样需要分辨。重复上门可能是带错备件，也可能是按计划完成多个阶段。前者有减少无效出行的机会，后者未必应被取消。把两者混在一个“复访率”里，会同时误导系统目标和员工评价。\n\n现场诊断的成果，不是给企业贴一个“数字化程度不足”的标签。它应让团队更清楚，一项有价值的结果被什么条件限制，哪些事实支持这个解释，以及下一次行动怎样帮助决定是否继续。这样的认识才足以指导投入。\n","exportSingleMd":"# 第12章｜从一个好结果，追到真正产生优势的地方\n\n某家店总是很早卖完主打商品，总部可能认为店长选货准；某个维修团队当天关闭很多工单，负责人可能认为响应快。这些判断都有可能成立，但数字本身还没有说明结果是怎样产生的。提前售罄也可能是长期少配货，快速结案也可能没有包括后续复发。\n\n如果AI项目直接把这些数字当作优化目标，就可能把原来没有看清的偏差扩大。现场诊断要做的，是追到结果发生的过程，找出哪些关系真正影响客户和收益。\n\n## 一个零售研究，怎样改变了“分货”的问题\n\nZara的一项真实分配研究关注到，门店里某些关键尺码缺货后，整款商品会从展示中撤下。假设一款服装仍有部分尺码库存，按普通库存表看，门店似乎还可以继续销售；但如果关键尺码的缺失使整款不再展示，剩余尺码也更难被顾客看到。\n\n因此，分配时不能只问每店还缺多少件，还要考虑尺码组合怎样影响展示和销售。研究将需求、尺码组合与门店规则纳入分配，2006年试点以10款商品作匹配比较，作者估计销售改善约3%—4%。这是一项运筹与数字化研究，不是生成式AI实验。[原始论文](https://web.mit.edu/people/jgallien/ZaraOR2010.pdf)\n\n它对本课的启发在于问题定义。若不知道整款撤展这一现场规则，即使预测每个尺码的销量很精细，也可能错过重要影响。真正有价值的工程，有时从一个原来未进入系统的业务关系开始。\n\n## 烘焙店提前售罄，也需要继续追问\n\n本课的[连锁烘焙教学案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-a)中，交通枢纽附近的X店提前卖完点心，售罄后停止该商品的社群推介和预订记录。工坊在相关时段还有生产余量，但只有早晨一次配送。这几项信息原来分别存在于门店、排产和配送安排中。\n\n把它们连起来，可以提出一种解释：供给限制了当日销量，也使门店停止继续获取需求；总部又按这些销量安排下一轮生产，于是长期低估机会。若这个解释成立，只调整预测模型未必够，还要同时考虑下午补货和门店动作。\n\n但还有其他可能。顾客也许只愿意购买刚出炉的点心，下午增加的商品未必能卖；可能询问很多，真正愿意下单的人少；也可能新增配送的成本超过销售贡献。现场诊断需要让这些解释进入比较，而不是只收集支持扩产的材料。\n\n## 怎样使不同解释导向不同的调查\n\n如果怀疑供给压住需求，就要记录售罄后的询问、可确认预订和追加供给后的购买。如果怀疑品质与时段不合适，就看补货到店的状态、顾客选择和退换反馈。如果配送受限，则要核对实际路线、到店时间、接货和上架条件。\n\n这些观察各有用途。它们不是为了做一份更厚的调研报告，而是为了决定下一步应该改生产、改商品、改配送，还是暂时保留原方案。AI可以帮助从分散材料中找矛盾、列出待确认关系，并比较后续结果；FDE需要把资料和实际动作接起来，使解释能够接受检验。\n\n一个有用的判断应当能够说明：“如果这项解释成立，我们会看到什么；如果看不到，哪种改法就不再有理由。”例如补货后仍有大量剩余，就应重新考虑有效需求，而不是继续把原来的售罄次数当作扩产依据。\n\n## 诊断越具体，工程越容易做对\n\n“员工效率低”可以指资料找不到、专业能力不足、等待审批、资源不足等完全不同的问题。“信息不通”也可能只是一个笼统感受。这样的描述很容易让团队各自拿熟悉的工具来回答。\n\n工业品报价案例提供了更具体的说法：客户三天内到货的要求，在几次转述后没有进入采购比较，采购找到的候选十天才能到，团队因此重新找方案。这个解释已经指出，应在什么决定之前保留哪个条件。技术可以围绕它实现，而不必先建设一个包罗万象的平台。\n\n设备服务同样需要分辨。重复上门可能是带错备件，也可能是按计划完成多个阶段。前者有减少无效出行的机会，后者未必应被取消。把两者混在一个“复访率”里，会同时误导系统目标和员工评价。\n\n现场诊断的成果，不是给企业贴一个“数字化程度不足”的标签。它应让团队更清楚，一项有价值的结果被什么条件限制，哪些事实支持这个解释，以及下一次行动怎样帮助决定是否继续。这样的认识才足以指导投入。\n","text":"# 第12章｜从一个好结果，追到真正产生优势的地方\n\n某家店总是很早卖完主打商品，总部可能认为店长选货准；某个维修团队当天关闭很多工单，负责人可能认为响应快。这些判断都有可能成立，但数字本身还没有说明结果是怎样产生的。提前售罄也可能是长期少配货，快速结案也可能没有包括后续复发。\n\n如果AI项目直接把这些数字当作优化目标，就可能把原来没有看清的偏差扩大。现场诊断要做的，是追到结果发生的过程，找出哪些关系真正影响客户和收益。\n\n## 一个零售研究，怎样改变了“分货”的问题\n\nZara的一项真实分配研究关注到，门店里某些关键尺码缺货后，整款商品会从展示中撤下。假设一款服装仍有部分尺码库存，按普通库存表看，门店似乎还可以继续销售；但如果关键尺码的缺失使整款不再展示，剩余尺码也更难被顾客看到。\n\n因此，分配时不能只问每店还缺多少件，还要考虑尺码组合怎样影响展示和销售。研究将需求、尺码组合与门店规则纳入分配，2006年试点以10款商品作匹配比较，作者估计销售改善约3%—4%。这是一项运筹与数字化研究，不是生成式AI实验。原始论文\n\n它对本课的启发在于问题定义。若不知道整款撤展这一现场规则，即使预测每个尺码的销量很精细，也可能错过重要影响。真正有价值的工程，有时从一个原来未进入系统的业务关系开始。\n\n## 烘焙店提前售罄，也需要继续追问\n\n本课的连锁烘焙教学案例中，交通枢纽附近的X店提前卖完点心，售罄后停止该商品的社群推介和预订记录。工坊在相关时段还有生产余量，但只有早晨一次配送。这几项信息原来分别存在于门店、排产和配送安排中。\n\n把它们连起来，可以提出一种解释：供给限制了当日销量，也使门店停止继续获取需求；总部又按这些销量安排下一轮生产，于是长期低估机会。若这个解释成立，只调整预测模型未必够，还要同时考虑下午补货和门店动作。\n\n但还有其他可能。顾客也许只愿意购买刚出炉的点心，下午增加的商品未必能卖；可能询问很多，真正愿意下单的人少；也可能新增配送的成本超过销售贡献。现场诊断需要让这些解释进入比较，而不是只收集支持扩产的材料。\n\n## 怎样使不同解释导向不同的调查\n\n如果怀疑供给压住需求，就要记录售罄后的询问、可确认预订和追加供给后的购买。如果怀疑品质与时段不合适，就看补货到店的状态、顾客选择和退换反馈。如果配送受限，则要核对实际路线、到店时间、接货和上架条件。\n\n这些观察各有用途。它们不是为了做一份更厚的调研报告，而是为了决定下一步应该改生产、改商品、改配送，还是暂时保留原方案。AI可以帮助从分散材料中找矛盾、列出待确认关系，并比较后续结果；FDE需要把资料和实际动作接起来，使解释能够接受检验。\n\n一个有用的判断应当能够说明：“如果这项解释成立，我们会看到什么；如果看不到，哪种改法就不再有理由。”例如补货后仍有大量剩余，就应重新考虑有效需求，而不是继续把原来的售罄次数当作扩产依据。\n\n## 诊断越具体，工程越容易做对\n\n“员工效率低”可以指资料找不到、专业能力不足、等待审批、资源不足等完全不同的问题。“信息不通”也可能只是一个笼统感受。这样的描述很容易让团队各自拿熟悉的工具来回答。\n\n工业品报价案例提供了更具体的说法：客户三天内到货的要求，在几次转述后没有进入采购比较，采购找到的候选十天才能到，团队因此重新找方案。这个解释已经指出，应在什么决定之前保留哪个条件。技术可以围绕它实现，而不必先建设一个包罗万象的平台。\n\n设备服务同样需要分辨。重复上门可能是带错备件，也可能是按计划完成多个阶段。前者有减少无效出行的机会，后者未必应被取消。把两者混在一个“复访率”里，会同时误导系统目标和员工评价。\n\n现场诊断的成果，不是给企业贴一个“数字化程度不足”的标签。它应让团队更清楚，一项有价值的结果被什么条件限制，哪些事实支持这个解释，以及下一次行动怎样帮助决定是否继续。这样的认识才足以指导投入。\n"},{"file":"13-系统化放大优势.md","id":"lesson-13","number":13,"role":"核心课","part":2,"title":"第13章｜放大企业优势，为什么要同时改变判断、执行和纠错","md":"# 第13章｜放大企业优势，为什么要同时改变判断、执行和纠错\n\n一家工业品经销商依赖资深工程师处理复杂询价。工程师看到旧零件照片，会先问使用环境；听到客户说“急用”，会继续确认最晚到货时间。经验较少的销售则可能直接寻找外形相近的型号，等报价快完成时，才发现适配或交期不成立。\n\n企业希望用AI传播专家经验，这是一个有价值的方向。但如果只把专家过去给过的型号整理成问答，新人仍不知道什么时候不能照用；如果所有AI建议最后都堆给专家确认，他也可能比以前更忙。怎样扩大能力，需要把后面的执行和纠错一起考虑。\n\n## 先传播判断所依赖的条件\n\n在[工业品报价教学案例](案例B-智能资源成本.md)中，专家真正有用的经验包括：先确认什么、怎样比较候选、哪些差别需要供应商或客户补充。把这些过程留下，AI在新询价里才能提示销售先补关键条件，而不只是返回一个历史型号。\n\n例如，客户要求三天内取得替代品。系统找到一个技术上合适、十天后才到货的型号时，应把交期冲突显示出来，让销售继续找其他路线。这样，原来只有专家经常注意的条件，开始进入更多人的日常判断。\n\n一项2025年发表的客服研究提供了经验扩散的实证参照。研究观察5172名客服分批取得AI辅助后的工作，每小时解决问题量平均提高约15%，不同经验群体的作用并不相同。[研究原文](https://danielle.li/assets/docs/GenerativeAIatWork.pdf) 它提示AI辅助可能使有效做法被更多人员使用，但不能把这一比例直接当作工业品经销商的订单增长预测。\n\n企业要在自己的任务中观察：销售是否更早发现缺项，补问是否减少，面对不同条件时能否调整。打开资料的次数和生成建议的数量，都不足以回答这些问题。\n\n## 好判断要经过履约，才会成为客户价值\n\n假设团队现在能形成更多可成交方案，采购和库存却没有相应准备，新增机会就可能卡在交付。更快给出承诺还可能占用原本服务老客户的资源，反而损害企业信誉。\n\n因此，放大判断能力以后，要继续看方案被谁采用，库存是否真实可用，供应商是否确认，客户最终有没有按期收到。工业品客户需要的是能用的零件按时到手，销售更懂方案只是其中一个必要环节。\n\n烘焙案例也有同样关系。知道X店可能多卖，并不使销量自动增长；工坊要能生产，配送要赶得上，门店要能接货、上架并继续获取需求。原来某个人的好判断，只有与这些条件配合，才可能扩大成企业的交付能力。\n\n![共同方法进入标准、适配与新类型任务，每项任务仍需条件和执行，结果回流修订方法；传播、交付与更新共同支持能力扩大。](assets/13-放大优势.svg)\n\n这张图应从中间的实际任务来读：左边的方法帮助人员作出判断，右边的结果再回来修订方法。若只有左向右的传播，没有结果回来，企业只能越来越熟练地重复过去的认识。\n\n## 使用范围越大，越需要接住反例\n\n原专家熟悉的客户和设备可能相对集中。AI进入更多销售和产品线后，会遇到新工况、新供应商和新的客户要求。一条过去有效的方法，可能在这些条件下失效。\n\n员工应能够说明“这个建议为什么不适用”，并将实际修改关联到原任务。专业人员据此判断是资料错误、方法范围需要收窄，还是出现了值得发展的新经验。FDE再使修订进入后续调用，避免其他人继续取得旧答案。\n\n动态能力研究强调组织在变化中重新安排资源、保持能力相关性的必要性。[原始研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf) 对企业来说，放大不只是让更多人复制旧办法，也包括让更多现场帮助改进共同办法。\n\n## 下一笔投入应当补在哪一段\n\n若销售仍频繁拿错材料，先改善资料和判断；若方案已经可靠，却大量等采购确认，就把资源用于履约衔接；若新场景不断产生错误，又没有人处理反馈，就先补纠错和方法维护。\n\n这三种情况都可能表现为“AI项目没有带来增长”，但需要的投入不同。把传播、执行和更新分别看清，再观察它们怎样连成客户结果，企业才不会只在最容易展示的生成环节不断加功能。\n","html":"\u003ch1>第13章｜放大企业优势，为什么要同时改变判断、执行和纠错\u003c/h1>\n\u003cp>一家工业品经销商依赖资深工程师处理复杂询价。工程师看到旧零件照片，会先问使用环境；听到客户说“急用”，会继续确认最晚到货时间。经验较少的销售则可能直接寻找外形相近的型号，等报价快完成时，才发现适配或交期不成立。\u003c/p>\n\u003cp>企业希望用AI传播专家经验，这是一个有价值的方向。但如果只把专家过去给过的型号整理成问答，新人仍不知道什么时候不能照用；如果所有AI建议最后都堆给专家确认，他也可能比以前更忙。怎样扩大能力，需要把后面的执行和纠错一起考虑。\u003c/p>\n\u003ch2 id=\"lesson-13-section-1\">先传播判断所依赖的条件\u003c/h2>\n\u003cp>在\u003ca href=\"#case-b\">工业品报价教学案例\u003c/a>中，专家真正有用的经验包括：先确认什么、怎样比较候选、哪些差别需要供应商或客户补充。把这些过程留下，AI在新询价里才能提示销售先补关键条件，而不只是返回一个历史型号。\u003c/p>\n\u003cp>例如，客户要求三天内取得替代品。系统找到一个技术上合适、十天后才到货的型号时，应把交期冲突显示出来，让销售继续找其他路线。这样，原来只有专家经常注意的条件，开始进入更多人的日常判断。\u003c/p>\n\u003cp>一项2025年发表的客服研究提供了经验扩散的实证参照。研究观察5172名客服分批取得AI辅助后的工作，每小时解决问题量平均提高约15%，不同经验群体的作用并不相同。\u003ca href=\"https://danielle.li/assets/docs/GenerativeAIatWork.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">研究原文\u003c/a> 它提示AI辅助可能使有效做法被更多人员使用，但不能把这一比例直接当作工业品经销商的订单增长预测。\u003c/p>\n\u003cp>企业要在自己的任务中观察：销售是否更早发现缺项，补问是否减少，面对不同条件时能否调整。打开资料的次数和生成建议的数量，都不足以回答这些问题。\u003c/p>\n\u003ch2 id=\"lesson-13-section-2\">好判断要经过履约，才会成为客户价值\u003c/h2>\n\u003cp>假设团队现在能形成更多可成交方案，采购和库存却没有相应准备，新增机会就可能卡在交付。更快给出承诺还可能占用原本服务老客户的资源，反而损害企业信誉。\u003c/p>\n\u003cp>因此，放大判断能力以后，要继续看方案被谁采用，库存是否真实可用，供应商是否确认，客户最终有没有按期收到。工业品客户需要的是能用的零件按时到手，销售更懂方案只是其中一个必要环节。\u003c/p>\n\u003cp>烘焙案例也有同样关系。知道X店可能多卖，并不使销量自动增长；工坊要能生产，配送要赶得上，门店要能接货、上架并继续获取需求。原来某个人的好判断，只有与这些条件配合，才可能扩大成企业的交付能力。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTEwIiB2aWV3Qm94PSIwIDAgMzYwIDUxMCIgcm9sZT0iaW1nIj48dGl0bGU+5pS+5aSn5LiN5Y+q5Lyg5pKt562U5qGIPC90aXRsZT48ZGVzYz7lhbHlkIzpgInlnovmlrnm 大不只是让更多人复制旧办法，也包括让更多现场帮助改进共同办法。\u003c/p>\n\u003ch2 id=\"lesson-13-section-4\">下一笔投入应当补在哪一段\u003c/h2>\n\u003cp>若销售仍频繁拿错材料，先改善资料和判断；若方案已经可靠，却大量等采购确认，就把资源用于履约衔接；若新场景不断产生错误，又没有人处理反馈，就先补纠错和方法维护。\u003c/p>\n\u003cp>这三种情况都可能表现为“AI项目没有带来增长”，但需要的投入不同。把传播、执行和更新分别看清，再观察它们怎样连成客户结果，企业才不会只在最容易展示的生成环节不断加功能。\u003c/p>\n","headings":[{"id":"lesson-13-section-1","label":"先传播判断所依赖的条件"},{"id":"lesson-13-section-2","label":"好判断要经过履约，才会成为客户价值"},{"id":"lesson-13-section-3","label":"使用范围越大，越需要接住反例"},{"id":"lesson-13-section-4","label":"下一笔投入应当补在哪一段"}],"exportMd":"# 第13章｜放大企业优势，为什么要同时改变判断、执行和纠错\n\n一家工业品经销商依赖资深工程师处理复杂询价。工程师看到旧零件照片，会先问使用环境；听到客户说“急用”，会继续确认最晚到货时间。经验较少的销售则可能直接寻找外形相近的型号，等报价快完成时，才发现适配或交期不成立。\n\n企业希望用AI传播专家经验，这是一个有价值的方向。但如果只把专家过去给过的型号整理成问答，新人仍不知道什么时候不能照用；如果所有AI建议最后都堆给专家确认，他也可能比以前更忙。怎样扩大能力，需要把后面的执行和纠错一起考虑。\n\n## 先传播判断所依赖的条件\n\n在[工业品报价教学案例](#case-b)中，专家真正有用的经验包括：先确认什么、怎样比较候选、哪些差别需要供应商或客户补充。把这些过程留下，AI在新询价里才能提示销售先补关键条件，而不只是返回一个历史型号。\n\n例如，客户要求三天内取得替代品。系统找到一个技术上合适、十天后才到货的型号时，应把交期冲突显示出来，让销售继续找其他路线。这样，原来只有专家经常注意的条件，开始进入更多人的日常判断。\n\n一项2025年发表的客服研究提供了经验扩散的实证参照。研究观察5172名客服分批取得AI辅助后的工作，每小时解决问题量平均提高约15%，不同经验群体的作用并不相同。[研究原文](https://danielle.li/assets/docs/GenerativeAIatWork.pdf) 它提示AI辅助可能使有效做法被更多人员使用，但不能把这一比例直接当作工业品经销商的订单增长预测。\n\n企业要在自己的任务中观察：销售是否更早发现缺项，补问是否减少，面对不同条件时能否调整。打开资料的次数和生成建议的数量，都不足以回答这些问题。\n\n## 好判断要经过履约，才会成为客户价值\n\n假设团队现在能形成更多可成交方案，采购和库存却没有相应准备，新增机会就可能卡在交付。更快给出承诺还可能占用原本服务老客户的资源，反而损害企业信誉。\n\n因此，放大判断能力以后，要继续看方案被谁采用，库存是否真实可用，供应商是否确认，客户最终有没有按期收到。工业品客户需要的是能用的零件按时到手，销售更懂方案只是其中一个必要环节。\n\n烘焙案例也有同样关系。知道X店可能多卖，并不使销量自动增长；工坊要能生产，配送要赶得上，门店要能接货、上架并继续获取需求。原来某个人的好判断，只有与这些条件配合，才可能扩大成企业的交付能力。\n\n![共同方法进入标准、适配与新类型任务，每项任务仍需条件和执行，结果回流修订方法；传播、交付与更新共同支持能力扩大。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTEwIiB2aWV3Qm94PSIwIDAgMzYwIDUxMCIgcm9sZT0iaW1nIj48dGl0bGU+5pS+5aSn5LiN5Y+q5Lyg5pKt562U5qGIPC90aXRsZT48ZGVzYz7lhbHlkIzpgInlnovmlrnms5Xov5vlhaXmoIflh4bjgIHpgILphY3lkozmlrDlnovor6Lku7fvvIzku43pnIDliKTmlq3mnaHku7blkozmiafooYzotYTmupDvvJvnu5Pmnpzlm57m 找外形相近的型号，等报价快完成时，才发现适配或交期不成立。\n\n企业希望用AI传播专家经验，这是一个有价值的方向。但如果只把专家过去给过的型号整理成问答，新人仍不知道什么时候不能照用；如果所有AI建议最后都堆给专家确认，他也可能比以前更忙。怎样扩大能力，需要把后面的执行和纠错一起考虑。\n\n## 先传播判断所依赖的条件\n\n在[工业品报价教学案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-b)中，专家真正有用的经验包括：先确认什么、怎样比较候选、哪些差别需要供应商或客户补充。把这些过程留下，AI在新询价里才能提示销售先补关键条件，而不只是返回一个历史型号。\n\n例如，客户要求三天内取得替代品。系统找到一个技术上合适、十天后才到货的型号时，应把交期冲突显示出来，让销售继续找其他路线。这样，原来只有专家经常注意的条件，开始进入更多人的日常判断。\n\n一项2025年发表的客服研究提供了经验扩散的实证参照。研究观察5172名客服分批取得AI辅助后的工作，每小时解决问题量平均提高约15%，不同经验群体的作用并不相同。[研究原文](https://danielle.li/assets/docs/GenerativeAIatWork.pdf) 它提示AI辅助可能使有效做法被更多人员使用，但不能把这一比例直接当作工业品经销商的订单增长预测。\n\n企业要在自己的任务中观察：销售是否更早发现缺项，补问是否减少，面对不同条件时能否调整。打开资料的次数和生成建议的数量，都不足以回答这些问题。\n\n## 好判断要经过履约，才会成为客户价值\n\n假设团队现在能形成更多可成交方案，采购和库存却没有相应准备，新增机会就可能卡在交付。更快给出承诺还可能占用原本服务老客户的资源，反而损害企业信誉。\n\n因此，放大判断能力以后，要继续看方案被谁采用，库存是否真实可用，供应商是否确认，客户最终有没有按期收到。工业品客户需要的是能用的零件按时到手，销售更懂方案只是其中一个必要环节。\n\n烘焙案例也有同样关系。知道X店可能多卖，并不使销量自动增长；工坊要能生产，配送要赶得上，门店要能接货、上架并继续获取需求。原来某个人的好判断，只有与这些条件配合，才可能扩大成企业的交付能力。\n\n![共同方法进入标准、适配与新类型任务，每项任务仍需条件和执行，结果回流修订方法；传播、交付与更新共同支持能力扩大。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTEwIiB2aWV3Qm94PSIwIDAgMzYwIDUxMCIgcm9sZT0iaW1nIj48dGl0bGU+5pS+5aSn5LiN5Y+q5Lyg5pKt562U5qGIPC90aXRsZT48ZGVzYz7lhbHlkIzpgInlnovmlrnms5Xov5vlhaXmoIflh4bjgIHpgILphY3lkozmlrDlnovor6Lku7fvvIzku43pnIDliKTmlq3mnaHku7blkozmiafooYzotYTmupDvvJvnu5Pmnpzlm57mtYHkv67orqLlhbHlkIzmlrnms5XjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjUxMCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFta
