ky1995.github.io/gaidn-fde-handbook/#lesson-32) |\n| 动态能力 | 使资源和能力持续适应、重组并保持相关 | [第37章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-37) |\n| 商业模式 | 客户价值、交付与价值获取的经营关系 | [第38章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-38) |\n\n这些解释服务课程判断。具体选择仍要回到相应情境、条件与证据。\n","text":"# 概念回查｜把词放回经营问题\n\n遇到概念时，先看它解释什么，再回正文。这里用于查询，不要求先背术语。\n\n| 概念 | 在本课中的用途 | 正文 |\n|---|---|---|\n| 基础模型 | 先取得可适配多类任务的通用能力，再补企业条件 | 第1章 |\n| 吸收能力 | 企业怎样识别、理解并应用新知识 | 第4章、第35章 |\n| know-how | 做一类工作时，知道先看什么、怎样判断、如何行动，以及条件变化后怎样调整的经验和方法 | 第5章 |\n| 候选经验 | 有待进一步区分的解释，先用于补问与观察 | 第8章 |\n| 组织记忆 | 跨人、跨任务仍能找到、理解、采用和更新经验的条件 | 第9章 |\n| 标准化 | 让事实和协作含义可共同理解，方法随证据稳定 | 第10章 |\n| 差异化 | 与客户选择和可持续交付有关的能力组合 | 第11章 |\n| 互补能力 | 与智能共同产生结果的客户、专业、渠道或履约条件 | 第3章 |\n| 优势生成机制 | 条件怎样经判断、协作和资源形成客户结果 | 第12章 |\n| FDE | 靠近现场，把认识、工程和反馈连续连接的专业力量 | 第14章 |\n| 试点学习价值 | 取得会改变下一笔选择的证据 | 第16章 |\n| 智能伙伴 | 有持续职责、任务记忆、行动与反馈的AI参与者 | 第17章 |\n| 工作流 | 主要路径由预设程序组织，可含模型、分支与循环 | 第19章 |\n| Agent | 模型在目标与工具范围内，动态选择部分下一步 | 第19章 |\n| 上下文与检索 | 上下文是本次实际交给模型使用的目标、事实、规则等材料；检索帮助从保存的资料中找到相关部分，使用前还要判断是否适用 | 第20章 |\n| 业务状态 | 建议、采用、接受、实际完成与客户结果等不同事实 | 第21章 |\n| 互补投入 | 技术作用所需的流程、人员、组织和工具建设 | 第22章 |\n| token | 模型输入输出的计量单位，不是价值单位 | 第23章 |\n| 有效利用 | 智能投入形成合格工作的过程 | 第23章 |\n| 价值转换 | 工作经采用、执行和客户选择进入经营 | 第26章 |\n| 产能瓶颈 | 限制整条交付的环节，上游扩量可能只增加等待 | 第25章 |\n| 能力留存 | 本轮工作对后续任务、接任或迁移的作用 | 第27章 |\n| 探索与利用 | 研究新可能与改善已有能力的资源取舍 | 第28章 |\n| 留出任务 | 不用于调方案，用来观察新材料表现的任务 | 第29章 |\n| 列示贡献 | 为比较方案，用收入扣除案例中列出的生产、模型等相关支出后剩下的金额；未扣全部固定费用，因此不是公司净利润 | 第30章 |\n| 因果与比较 | 区分方法作用、选择差异和同期变化 | 第30章 |\n| 组织学习 | 后续工作因经验改变，且能有条件地接任与迁移 | 第31章 |\n| 反馈循环 | 行动改变未来可见数据，可能改进也可能强化偏差 | 第32章 |\n| 动态能力 | 使资源和能力持续适应、重组并保持相关 | 第37章 |\n| 商业模式 | 客户价值、交付与价值获取的经营关系 | 第38章 |\n\n这些解释服务课程判断。具体选择仍要回到相应情境、条件与证据。\n"},{"file":"延伸阅读.md","id":"reading","number":null,"role":"参考","part":-1,"title":"研究与延伸阅读","md":"# 研究与延伸阅读\n\n课程把理论、实际研究、工程经验和机构自述用于不同问题。它们共同支持机制推导，不构成一个适用于所有企业的提效数字。教学案例与业务算例全部是独立设定。\n\n## 理解知识、能力与持续发展\n\n**Nonaka，1994，组织知识创造。** [原始论文的大学存档](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)。用于理解实践、表达、个人与组织之间的知识发展。本课主要采用可核原文片段；扫描件读取受限。它不证明所有隐性技能都能被语言或AI完整提取。\n\n**Cohen与Levinthal，1990，吸收能力。** [原始论文](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)。采用摘要、引言与相关知识讨论，解释企业为何需要自己的认识与组织条件。它不是AI或FDE长期效果研究。\n\n**Teece，2007，动态能力。** [机构原文](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)。采用引言与框架段落，理解能力如何持续适应与重组。框架不能替企业判断具体优势，也不估计生存率。\n\n**March，1991，探索与利用。** [原始论文](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)。采用摘要与开篇机制，讨论资源竞争与回报节奏。没有导出固定预算比例。\n\n**Brynjolfsson、Rock、Syverson，生产率J曲线。** [NBER研究记录](https://www.nber.org/papers/w25148)，期刊版2021。用于互补投入与测量关系；宏观J曲线不是单项目现金回本承诺。\n\n## 比较真实工作中的AI作用\n\n**Generative AI at Work，2025期刊版。** [作者提供的原文](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)。企业软件客服的分批上线研究，员工可以采用、修改或忽略建议。用于讨论经验差异、传播与学习，不推成全行业利润。本课重读摘要、引言与上线安排，并核对2025版本5172名客服、每小时解决量平均提高15%的定义；这是分批上线的单企业研究，不能当成本课其他行业的提升率。\n\n**The Cybernetic Teammate，2026期刊版。** [期刊原文](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)。采用宝洁创新实验的设计与阶段结果，分清生成、组内选择与最终质量。最终方案改善不代表商业实施成功；不能据组内选择结果推断AI一般不擅判断，也未确认参与者在选择时均使用AI。\n\n**Shifting Work Patterns with Generative AI。** [实际采用页面](https://arxiv.org/html/2504.11436v4)。跨企业随机获得办公AI使用权，利用软件活动观察时间与任务。采用摘要、设计及观测限制。页面版本元信息与正文日期存在差异；不把软件活动直接解释成完整质量或利润。\n\n**METR开发任务研究，早期2025。** [原始论文](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)及[2026方法更新](https://metr.org/blog/2026-02-24-uplift-update/)。用于主观感受、总任务时间、选择与并行测量。旧工具和特定开发者结果不作当前AI编程通用结论。\n\n**Caro与Gallien，2010，Zara分配。** [作者机构原文](https://web.mit.edu/people/jgallien/ZaraOR2010.pdf)。本轮重读现场流程、试点设计和结果段落：关键尺码、展示、分配与激励相互作用；10款试点与匹配商品的比较支持作者估计的销售改善约3%—4%。它是运筹与数字化案例，不是生成式AI/FDE项目；全年财务影响包含推算，本课不把它写成实测AI收益，也未复算原始数据。\n\n## 理解模型与工程条件\n\n**CRFM基础模型报告，2021/2022版本。** [原始摘要](https://arxiv.org/abs/2108.07258v3)。用于广泛训练、下游适配与共同依赖；未全文采用长报告，也不证明每项任务经济可行。\n\n**Anthropic，Building effective agents，2024。** [原文](https://www.anthropic.com/research/building-effective-agents)。用于固定工作流、动态工具选择与复杂度取舍。属于工程经验，不是长期经营实验。\n\n**Anthropic，上下文工程，2025。** [原文](https://www.anthropic.com/research/effective-context-engineering-for-ai-agents)。用于当前信息、持久记录与调用。记忆工程不能保证业务经验正确。\n\n**Sculley等，2015，Hidden Technical Debt in Machine Learning Systems。** [原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)。采用摘要、反馈循环与系统依赖讨论。早期ML经验不能直接量化当前Agent成本。\n\n**Snell等，2024，测试时计算配置。** [原始预印本摘要](https://arxiv.org/abs/2408.03314)。用于资源、策略与任务难度关系；没有把数学实验倍数转成企业投资回报。\n\n## 理解人员、长期合作与经营机制\n\n**Holmström与Milgrom，1991，多任务激励。** [作者存档](https://web.stanford.edu/~milgrom/publishedarticles/Multitask%20Principal%20Agent.pdf)。采用可核引言片段，扫描全文读取受限。解释评价怎样改变注意力，不给出统一奖金规则。\n\n**Baker、Gibbons、Murphy，2002，关系合作。** [原始论文](https://faculty.washington.edu/mfan/is582/articles/Baker2002.pdf)。采用摘要与开篇关于重复合作、难以事前完整约定的结果。它不证明长期外部合同必然更优。\n\n**Palantir FDSE岗位。** [官方说明](https://jobs.lever.co/palantir/84131e3f-455e-47fc-9c11-898d95f09048)。用于模糊问题、原型、代码、集成和反馈等实际职责。属于机构自述，不是统一行业定义。\n\n**AWS FDE共建安排。** [官方材料](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)。用于生产共建与客户接续目标；机构主张不等于独立效果证明。\n\n**Little，1961，排队公式。** [原始摘要](https://pubsonline.informs.org/doi/abs/10.1287/opre.9.3.383)。仅读取摘要与成立条件。课程持续超负荷算例使用数量守恒，不套平稳平均等待公式。\n\n**Teece，2010，商业模式、战略与创新。** [原始出版页](https://www.sciencedirect.com/science/article/pii/S002463010900051X)。直接入口受限，采用出版页检索返回的摘要、引言与部分段落。用于价值创造、交付与获取，不证明当前AI新产品需求。\n\n**Teece，1988，技术创新的价值获取。** [原始出版摘要](https://pubsonline.informs.org/doi/abs/10.1287/inte.18.3.46)。本轮读取摘要，采用制造、分销等互补能力影响创新收益归属的关系；没有采用全文案例，也不由旧产业研究预测某家AI企业的利润。\n\n## 怎样把研究带回决定\n\n先看研究处理何种工作、比较什么、观察什么，再判断它与自己的场景哪些相同、哪些不同。一个平均效果不应抹掉经验与阶段差异，一项反向结果也不应冻结后续技术判断。\n\n课程中关于长期FDE、能力留存与竞争节奏的立场，是在这些依据上作出的机制推导，仍需要真实企业持续观察。可以据此主动建设，同时保留被证据改变的空间。\n","html":"\u003ch1>研究与延伸阅读\u003c/h1>\n\u003cp>课程把理论、实际研究、工程经验和机构自述用于不同问题。它们共同支持机制推导，不构成一个适用于所有企业的提效数字。教学案例与业务算例全部是独立设定。\u003c/p>\n\u003ch2 id=\"reading-section-1\">理解知识、能力与持续发展\u003c/h2>\n\u003cp>\u003cstrong>Nonaka，1994，组织知识创造。\u003c/strong> \u003ca href=\"https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始论文的大学存档\u003c/a>。用于理解实践、表达、个人与组织之间的知识发展。本课主要采用可核原文片段；扫描件读取受限。它不证明所有隐性技能都能被语言或AI完整提取。\u003c/p>\n\u003cp>\u003cstrong>Cohen与Levinthal，1990，吸收能力。\u003c/strong> \u003ca href=\"https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始论文\u003c/a>。采用摘要、引言与相关知识讨论，解释企业为何需要自己的认识与组织条件。它不是AI或FDE长期效果研究。\u003c/p>\n\u003cp>\u003cstrong>Teece，2007，动态能力。\u003c/strong> \u003ca href=\"https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">机构原文\u003c/a>。采用引言与框架段落，理解能力如何持续适应与重组。框架不能替企业判断具体优势，也不估计生存率。\u003c/p>\n\u003cp>\u003cstrong>March，1991，探索与利用。\u003c/strong> \u003ca href=\"https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始论文\u003c/a>。采用摘要与开篇机制，讨论资源竞争与回报节奏。没有导出固定预算比例。\u003c/p>\n\u003cp>\u003cstrong>Brynjolfsson、Rock、Syverson，生产率J曲线。\u003c/strong> \u003ca href=\"https://www.nber.org/papers/w25148\" target=\"_blank\" rel=\"noopener noreferrer\">NBER研究记录\u003c/a>，期刊版2021。用于互补投入与测量关系；宏观J曲线不是单项目现金回本承诺。\u003c/p>\n\u003ch2 id=\"reading-section-2\">比较真实工作中的AI作用\u003c/h2>\n\u003cp>\u003cstrong>Generative AI at Work，2025期刊版。\u003c/strong> \u003ca href=\"https://danielle.li/assets/docs/GenerativeAIatWork.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">作者提供的原文\u003c/a>。企业软件客服的分批上线研究，员工可以采用、修改或忽略建议。用于讨论经验差异、传播与学习，不推成全行业利润。本课重读摘要、引言与上线安排，并核对2025版本5172名客服、每小时解决量平均提高15%的定义；这是分批上线的单企业研究，不能当成本课其他行业的提升率。\u003c/p>\n\u003cp>\u003cstrong>The Cybernetic Teammate，2026期刊版。\u003c/strong> \u003ca href=\"https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702\" target=\"_blank\" rel=\"noopener noreferrer\">期刊原文\u003c/a>。采用宝洁创新实验的设计与阶段结果，分清生成、组内选择与最终质量。最终方案改善不代表商业实施成功；不能据组内选择结果推断AI一般不擅判断，也未确认参与者在选择时均使用AI。\u003c/p>\n\u003cp>\u003cstrong>Shifting Work Patterns with Generative AI。\u003c/strong> \u003ca href=\"https://arxiv.org/html/2504.11436v4\" target=\"_blank\" rel=\"noopener noreferrer\">实际采用页面\u003c/a>。跨企业随机获得办公AI使用权，利用软件活动观察时间与任务。采用摘要、设计及观测限制。页面版本元信息与正文日期存在差异；不把软件活动直接解释成完整质量或利润。\u003c/p>\n\u003cp>\u003cstrong>METR开发任务研究，早期2025。\u003c/strong> \u003ca href=\"https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始论文\u003c/a>及\u003ca href=\"https://metr.org/blog/2026-02-24-uplift-update/\" target=\"_blank\" rel=\"noopener noreferrer\">2026方法更新\u003c/a>。用于主观感受、总任务时间、选择与并行测量。旧工具和特定开发者结果不作当前AI编程通用结论。\u003c/p>\n\u003cp>\u003cstrong>Caro与Gallien，2010，Zara分配。\u003c/strong> \u003ca href=\"https://web.mit.edu/people/jgallien/ZaraOR2010.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">作者机构原文\u003c/a>。本轮重读现场流程、试点设计和结果段落：关键尺码、展示、分配与激励相互作用；10款试点与匹配商品的比较支持作者估计的销售改善约3%—4%。它是运筹与数字化案例，不是生成式AI/FDE项目；全年财务影响包含推算，本课不把它写成实测AI收益，也未复算原始数据。\u003c/p>\n\u003ch2 id=\"reading-section-3\">理解模型与工程条件\u003c/h2>\n\u003cp>\u003cstrong>CRFM基础模型报告，2021/2022版本。\u003c/strong> \u003ca href=\"https://arxiv.org/abs/2108.07258v3\" target=\"_blank\" rel=\"noopener noreferrer\">原始摘要\u003c/a>。用于广泛训练、下游适配与共同依赖；未全文采用长报告，也不证明每项任务经济可行。\u003c/p>\n\u003cp>\u003cstrong>Anthropic，Building effective agents，2024。\u003c/strong> \u003ca href=\"https://www.anthropic.com/research/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">原文\u003c/a>。用于固定工作流、动态工具选择与复杂度取舍。属于工程经验，不是长期经营实验。\u003c/p>\n\u003cp>\u003cstrong>Anthropic，上下文工程，2025。\u003c/strong> \u003ca href=\"https://www.anthropic.com/research/effective-context-engineering-for-ai-agents\" target=\"_blank\" rel=\"noopener noreferrer\">原文\u003c/a>。用于当前信息、持久记录与调用。记忆工程不能保证业务经验正确。\u003c/p>\n\u003cp>\u003cstrong>Sculley等，2015，Hidden Technical Debt in Machine Learning Systems。\ 排，并核对2025版本5172名客服、每小时解决量平均提高15%的定义；这是分批上线的单企业研究，不能当成本课其他行业的提升率。\n\n**The Cybernetic Teammate，2026期刊版。** [期刊原文](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)。采用宝洁创新实验的设计与阶段结果，分清生成、组内选择与最终质量。最终方案改善不代表商业实施成功；不能据组内选择结果推断AI一般不擅判断，也未确认参与者在选择时均使用AI。\n\n**Shifting Work Patterns with Generative AI。** [实际采用页面](https://arxiv.org/html/2504.11436v4)。跨企业随机获得办公AI使用权，利用软件活动观察时间与任务。采用摘要、设计及观测限制。页面版本元信息与正文日期存在差异；不把软件活动直接解释成完整质量或利润。\n\n**METR开发任务研究，早期2025。** [原始论文](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)及[2026方法更新](https://metr.org/blog/2026-02-24-uplift-update/)。用于主观感受、总任务时间、选择与并行测量。旧工具和特定开发者结果不作当前AI编程通用结论。\n\n**Caro与Gallien，2010，Zara分配。** [作者机构原文](https://web.mit.edu/people/jgallien/ZaraOR2010.pdf)。本轮重读现场流程、试点设计和结果段落：关键尺码、展示、分配与激励相互作用；10款试点与匹配商品的比较支持作者估计的销售改善约3%—4%。它是运筹与数字化案例，不是生成式AI/FDE项目；全年财务影响包含推算，本课不把它写成实测AI收益，也未复算原始数据。\n\n## 理解模型与工程条件\n\n**CRFM基础模型报告，2021/2022版本。** [原始摘要](https://arxiv.org/abs/2108.07258v3)。用于广泛训练、下游适配与共同依赖；未全文采用长报告，也不证明每项任务经济可行。\n\n**Anthropic，Building effective agents，2024。** [原文](https://www.anthropic.com/research/building-effective-agents)。用于固定工作流、动态工具选择与复杂度取舍。属于工程经验，不是长期经营实验。\n\n**Anthropic，上下文工程，2025。** [原文](https://www.anthropic.com/research/effective-context-engineering-for-ai-agents)。用于当前信息、持久记录与调用。记忆工程不能保证业务经验正确。\n\n**Sculley等，2015，Hidden Technical Debt in Machine Learning Systems。** [原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)。采用摘要、反馈循环与系统依赖讨论。早期ML经验不能直接量化当前Agent成本。\n\n**Snell等，2024，测试时计算配置。** [原始预印本摘要](https://arxiv.org/abs/2408.03314)。用于资源、策略与任务难度关系；没有把数学实验倍数转成企业投资回报。\n\n## 理解人员、长期合作与经营机制\n\n**Holmström与Milgrom，1991，多任务激励。** [作者存档](https://web.stanford.edu/~milgrom/publishedarticles/Multitask%20Principal%20Agent.pdf)。采用可核引言片段，扫描全文读取受限。解释评价怎样改变注意力，不给出统一奖金规则。\n\n**Baker、Gibbons、Murphy，2002，关系合作。** [原始论文](https://faculty.washington.edu/mfan/is582/articles/Baker2002.pdf)。采用摘要与开篇关于重复合作、难以事前完整约定的结果。它不证明长期外部合同必然更优。\n\n**Palantir FDSE岗位。** [官方说明](https://jobs.lever.co/palantir/84131e3f-455e-47fc-9c11-898d95f09048)。用于模糊问题、原型、代码、集成和反馈等实际职责。属于机构自述，不是统一行业定义。\n\n**AWS FDE共建安排。** [官方材料](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)。用于生产共建与客户接续目标；机构主张不等于独立效果证明。\n\n**Little，1961，排队公式。** [原始摘要](https://pubsonline.informs.org/doi/abs/10.1287/opre.9.3.383)。仅读取摘要与成立条件。课程持续超负荷算例使用数量守恒，不套平稳平均等待公式。\n\n**Teece，2010，商业模式、战略与创新。** [原始出版页](https://www.sciencedirect.com/science/article/pii/S002463010900051X)。直接入口受限，采用出版页检索返回的摘要、引言与部分段落。用于价值创造、交付与获取，不证明当前AI新产品需求。\n\n**Teece，1988，技术创新的价值获取。** [原始出版摘要](https://pubsonline.informs.org/doi/abs/10.1287/inte.18.3.46)。本轮读取摘要，采用制造、分销等互补能力影响创新收益归属的关系；没有采用全文案例，也不由旧产业研究预测某家AI企业的利润。\n\n## 怎样把研究带回决定\n\n先看研究处理何种工作、比较什么、观察什么，再判断它与自己的场景哪些相同、哪些不同。一个平均效果不应抹掉经验与阶段差异，一项反向结果也不应冻结后续技术判断。\n\n课程中关于长期FDE、能力留存与竞争节奏的立场，是在这些依据上作出的机制推导，仍需要真实企业持续观察。可以据此主动建设，同时保留被证据改变的空间。\n","exportSingleMd":"# 研究与延伸阅读\n\n课程把理论、实际研究、工程经验和机构自述用于不同问题。它们共同支持机制推导，不构成一个适用于所有企业的提效数字。教学案例与业务算例全部是独立设定。\n\n## 理解知识、能力与持续发展\n\n**Nonaka，1994，组织知识创造。** [原始论文的大学存档](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)。用于理解实践、表达、个人与组织之间的知识发展。本课主要采用可核原文片段；扫描件读取受限。它不证明所有隐性技能都能被语言或AI完整提取。\n\n**Cohen与Levinthal，1990，吸收能力。** [原始论文](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)。采用摘要、引言与相关知识讨论，解释企业为何需要自己的认识与组织条件。它不是AI或FDE长期效果研究。\n\n**Teece，2007，动态能力。** [机构原文](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)。采用引言与框架段落，理解能力如何持续适应与重组。框架不能替企业判断具体优势，也不估计生存率。\n\n**March，1991，探索与利用。** [原始论文](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)。采用摘要与开篇机制，讨论资源竞争与回报节奏。没有导出固定预算比例。\n\n**Brynjolfsson、Rock、Syverson，生产率J曲线。** [NBER研究记录](https://www.nber.org/papers/w25148)，期刊版2021。用于互补投入与测量关系；宏观J曲线不是单项目现金回本承诺。\n\n## 比较真实工作中的AI作用\n\n**Generative AI at Work，2025期刊版。** [作者提供的原文](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)。企业软件客服的分 难以事前完整约定的结果。它不证明长期外部合同必然更优。\n\n**Palantir FDSE岗位。** [官方说明](https://jobs.lever.co/palantir/84131e3f-455e-47fc-9c11-898d95f09048)。用于模糊问题、原型、代码、集成和反馈等实际职责。属于机构自述，不是统一行业定义。\n\n**AWS FDE共建安排。** [官方材料](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)。用于生产共建与客户接续目标；机构主张不等于独立效果证明。\n\n**Little，1961，排队公式。** [原始摘要](https://pubsonline.informs.org/doi/abs/10.1287/opre.9.3.383)。仅读取摘要与成立条件。课程持续超负荷算例使用数量守恒，不套平稳平均等待公式。\n\n**Teece，2010，商业模式、战略与创新。** [原始出版页](https://www.sciencedirect.com/science/article/pii/S002463010900051X)。直接入口受限，采用出版页检索返回的摘要、引言与部分段落。用于价值创造、交付与获取，不证明当前AI新产品需求。\n\n**Teece，1988，技术创新的价值获取。** [原始出版摘要](https://pubsonline.informs.org/doi/abs/10.1287/inte.18.3.46)。本轮读取摘要，采用制造、分销等互补能力影响创新收益归属的关系；没有采用全文案例，也不由旧产业研究预测某家AI企业的利润。\n\n## 怎样把研究带回决定\n\n先看研究处理何种工作、比较什么、观察什么，再判断它与自己的场景哪些相同、哪些不同。一个平均效果不应抹掉经验与阶段差异，一项反向结果也不应冻结后续技术判断。\n\n课程中关于长期FDE、能力留存与竞争节奏的立场，是在这些依据上作出的机制推导，仍需要真实企业持续观察。可以据此主动建设，同时保留被证据改变的空间。\n","text":"# 研究与延伸阅读\n\n课程把理论、实际研究、工程经验和机构自述用于不同问题。它们共同支持机制推导，不构成一个适用于所有企业的提效数字。教学案例与业务算例全部是独立设定。\n\n## 理解知识、能力与持续发展\n\n**Nonaka，1994，组织知识创造。** 原始论文的大学存档。用于理解实践、表达、个人与组织之间的知识发展。本课主要采用可核原文片段；扫描件读取受限。它不证明所有隐性技能都能被语言或AI完整提取。\n\n**Cohen与Levinthal，1990，吸收能力。** 原始论文。采用摘要、引言与相关知识讨论，解释企业为何需要自己的认识与组织条件。它不是AI或FDE长期效果研究。\n\n**Teece，2007，动态能力。** 机构原文。采用引言与框架段落，理解能力如何持续适应与重组。框架不能替企业判断具体优势，也不估计生存率。\n\n**March，1991，探索与利用。** 原始论文。采用摘要与开篇机制，讨论资源竞争与回报节奏。没有导出固定预算比例。\n\n**Brynjolfsson、Rock、Syverson，生产率J曲线。** NBER研究记录，期刊版2021。用于互补投入与测量关系；宏观J曲线不是单项目现金回本承诺。\n\n## 比较真实工作中的AI作用\n\n**Generative AI at Work，2025期刊版。** 作者提供的原文。企业软件客服的分批上线研究，员工可以采用、修改或忽略建议。用于讨论经验差异、传播与学习，不推成全行业利润。本课重读摘要、引言与上线安排，并核对2025版本5172名客服、每小时解决量平均提高15%的定义；这是分批上线的单企业研究，不能当成本课其他行业的提升率。\n\n**The Cybernetic Teammate，2026期刊版。** 期刊原文。采用宝洁创新实验的设计与阶段结果，分清生成、组内选择与最终质量。最终方案改善不代表商业实施成功；不能据组内选择结果推断AI一般不擅判断，也未确认参与者在选择时均使用AI。\n\n**Shifting Work Patterns with Generative AI。** 实际采用页面。跨企业随机获得办公AI使用权，利用软件活动观察时间与任务。采用摘要、设计及观测限制。页面版本元信息与正文日期存在差异；不把软件活动直接解释成完整质量或利润。\n\n**METR开发任务研究，早期2025。** 原始论文及2026方法更新。用于主观感受、总任务时间、选择与并行测量。旧工具和特定开发者结果不作当前AI编程通用结论。\n\n**Caro与Gallien，2010，Zara分配。** 作者机构原文。本轮重读现场流程、试点设计和结果段落：关键尺码、展示、分配与激励相互作用；10款试点与匹配商品的比较支持作者估计的销售改善约3%—4%。它是运筹与数字化案例，不是生成式AI/FDE项目；全年财务影响包含推算，本课不把它写成实测AI收益，也未复算原始数据。\n\n## 理解模型与工程条件\n\n**CRFM基础模型报告，2021/2022版本。** 原始摘要。用于广泛训练、下游适配与共同依赖；未全文采用长报告，也不证明每项任务经济可行。\n\n**Anthropic，Building effective agents，2024。** 原文。用于固定工作流、动态工具选择与复杂度取舍。属于工程经验，不是长期经营实验。\n\n**Anthropic，上下文工程，2025。** 原文。用于当前信息、持久记录与调用。记忆工程不能保证业务经验正确。\n\n**Sculley等，2015，Hidden Technical Debt in Machine Learning Systems。** 原始论文。采用摘要、反馈循环与系统依赖讨论。早期ML经验不能直接量化当前Agent成本。\n\n**Snell等，2024，测试时计算配置。** 原始预印本摘要。用于资源、策略与任务难度关系；没有把数学实验倍数转成企业投资回报。\n\n## 理解人员、长期合作与经营机制\n\n**Holmström与Milgrom，1991，多任务激励。** 作者存档。采用可核引言片段，扫描全文读取受限。解释评价怎样改变注意力，不给出统一奖金规则。\n\n**Baker、Gibbons、Murphy，2002，关系合作。** 原始论文。采用摘要与开篇关于重复合作、难以事前完整约定的结果。它不证明长期外部合同必然更优。\n\n**Palantir FDSE岗位。** 官方说明。用于模糊问题、原型、代码、集成和反馈等实际职责。属于机构自述，不是统一行业定义。\n\n**AWS FDE共建安排。** 官方材料。用于生产共建与客户接续目标；机构主张不等于独立效果证明。\n\n**Little，1961，排队公式。** 原始摘要。仅读取摘要与成立条件。课程持续超负荷算例使用数量守恒，不套平稳平均等待公式。\n\n**Teece，2010，商业模式、战略与创新。** 原始出版页。直接入口受限，采用出版页检索返回的摘要、引言与部分段落。用于价值创造、交付与获取，不证明当前AI新产品需求。\n\n**Teece，1988，技术创新的价值获取。** 原始出版摘要。本轮读取摘要，采用制造、分销等互补能力影响创新收益归属的关系；没有采用全文案例，也不由旧产业研究预测某家AI企业的利润。\n\n## 怎样把研究带回决定\n\n先看研究处理何种工作、比较什么、观察什么，再判断它与自己的场景哪些相同、哪些不同。一个平均效果不应抹掉经验与阶段差异，一项反向结果也不应冻结后续技术判断。\n\n课程中关于长期FDE、能力留存与竞争节奏的立场，是在这些依据上作出的机制推导，仍需要真实企业持续观察。可以据此主动建设，同时保留被证据改变的空间。\n"},{"file":"工作簿-改造提案.md","id":"workbook","number":null,"role":"工作簿","part":-1,"title":"工作簿｜把一条业务写成可以讨论和决定的改造提案","md":"# 工作簿｜把一条业务写成可以讨论和决定的改造提案\n\n可以复制或下载后编辑，也可以先用四组教学案例练习。不必填满所有格子；要让不在前几次会议里的人，也能理解这项投入为什么值得。\n\n## 先写完整背景，再给项目起名\n\n说清客户在什么处境下需要什么，原工作怎样完成，当前事实与矛盾在哪里。避免只写“效率低、知识没沉淀”。\n\n连锁案例可以这样开头：“这是一家有八家门店和中央工坊的烘焙企业。我们先研究其中两家店的一款主打点心。交通枢纽附近的X店每天收到80份，18点售罄后仍有顾客询问；社区里的Y店同样收到80份，却只售出60份。工坊在其他订单已安排后，可用于这两店的生产时间最多能做320份，现在只安排160份。原配送每天早晨一次，门店售罄后也停止这款商品的推介和预订记录。因此，需要研究的既是两店分配，也包括是否有需求被供给、配送和销售安排共同限制。”\n\n这段背景给出了角色、事实与相互关系，也保留了尚需检验的解释。自己的材料应有可追溯出处，不把故事细节补成事实。\n\n| 要交代的背景 | 自己的材料 |\n|---|---|\n| 客户或使用者、所需结果 | 待填写 |\n| 原工作与相关人员、系统 | 待填写 |\n| 关键观察、时间与出处 | 待填写 |\n| 想解释的差别与其他可能原因 | 待填写 |\n\n## 把几种可实施选择放在同一口径下\n\n至少保留一个合理的普通改进或现成方案，再提出AI参与的安排。说明各自改变什么，依赖哪些条件，而非让新方案只与最差旧流程比较。\n\n| 选择 | 机制与实际动作 | 条件、成本与未知 |\n|---|---|---|\n| 原工作或改进人工/SOP | 待填写 | 待填写 |\n| 成熟软件或较简单方法 | 待填写 | 待填写 |\n| AI与工程共同改造 | 待填写 | 待填写 |\n\n例如，连锁可以将原160份总产量重新分给两店，也可以增加总产量并安排下午补货。前者主要减少分配不当造成的剩余，后者争取新增需求，但要承担更多成本。把两种选择讲清楚，负责人才能判断哪种更适合。\n\n其他案例也需要作相应区分：工业品业务先形成可靠候选，再经过客户选择和实际交付；设备业务要分清必要的多阶段服务与可避免复访；内容业务则要把待核初稿和客户愿意付费的正式交付分开。\n\n## 沿一笔工作写出改变如何发生\n\n从自然输入出发，写谁取得什么、怎样比较、谁采用、怎样执行、结果返回哪里，以及哪部分会帮助下一次。重要未知要有名字。\n\n例如，工业品客户提供旧零件照片，希望三天内拿到替代品。销售先保留原要求并补问使用条件，AI将候选产品与当前供应材料放在一起，指出适配或交期上的冲突。工程师确认能否使用，采购确认是否能按期取得，销售再发出正式报价。之后继续记录客户是否采用、实际是否交付，以及未成交的理由。这些步骤分别解释了智能怎样帮助工作、工作怎样才有机会形成订单，也指出下一轮可以复用什么。\n\n| 关键连接 | 对象、动作与承担者 |\n|---|---|\n| 当前目标、事实与相关经验 | 待填写 |\n| AI、人和现有系统的分工 | 待填写 |\n| 正式决定与实际动作 | 待填写 |\n| 客户结果、未采用与反例 | 待填写 |\n| 下一次可使用的方法与入口 | 待填写 |\n\n## 写一张收益账，也写出它的成立条件\n\n使用相同需求、任务、质量与时期。收入、变动成本、新支出、工时与一次建设分别列，未来能力说明用途，不任意标价补回本。\n\n| 项目 | 当前依据 | 如何进入比较 |\n|---|---|---|\n| 需求、销量或付费交付 | 待填写 | 待填写 |\n| 价格、单均贡献及履约成本 | 待填写 | 待填写 |\n| 模型、工具与持续共建 | 待填写 | 待填写 |\n| 核验、返工与瓶颈容量 | 待填写 | 待填写 |\n| 实际可取消支出 | 待填写 | 待填写 |\n| 一次性建设和维护 | 待填写 | 待填写 |\n| 留下的能力与再用检验 | 待填写 | 待填写 |\n\n固定工资下释放时间，先是容量；实际取消外协或新增付费交付后，再说明现金路径。同一小时或同一费用不重复计算，局部模型比较也不要再加到已包含它的项目账。\n\n## 让试点围绕一项会改变选择的未知\n\n在A里，扩大方案相对已改分配多240元生产成本和80元日支出，需要新增销售至少27份。试点可以围绕新增有效需求、品质、补货与推介共同取得证据，而非泛问“AI能否促进增长”。\n\n分别设计三层观察：任务有没有用对事实，实际业务相对替代是否改善，后续人员或新场景能否用对积累。共享库存、同期活动、人员和价格变化应进入比较条件。\n\n| 观察与比较 | 取得什么证据 | 哪种结果使采用范围改变 |\n|---|---|---|\n| 任务合格 | 待填写 | 待填写 |\n| 业务效果 | 待填写 | 待填写 |\n| 接任或迁移 | 待填写 | 待填写 |\n\n## 给持续工作安排真实资源\n\n业务负责人承担价值和取舍，专业人员判断方法，FDE实现与改进，内部成员接住资料、运行和评价。岗位激励、时间与决定权也写进安排。\n\n内容专家每天2小时，若按20分钟核6篇，就不能又拿其中40分钟做验证而仍承诺6篇。阶段交付、探索和维护应放在共同容量下选择。\n\n写明本轮可投入范围、实际承担者与复查时点，以及继续、改法和停止的条件。未知预算和负责人是开工前要确定的事项，不能用模板替真实企业决定。\n\n## 变一个条件，检查自己是否会判断\n\n仍用A，售价12元、额外生产60份成本240元不变，新增日常支出从80变120元。扩产相对100/60，要多卖多少份才更好？正常日需求X160/Y60时，扩产的贡献又是多少？\n\n先写计算与选择，再看参考：新增投入240＋120=360元，卖30份恰好覆盖，至少31份才更好；正常日扩产贡献2640−880−120=1640元，比只改分配1280元多360元。原来的“至少27份”不能直接沿用。\n\n再用B思考：订单增至250但单均贡献降到400，为什么仍可能比原来差？参考是250×400与200×500相等，新费用11000元还没有被覆盖。\n\n## 把表格重新连成一段提案\n\n最后应能用连续文字说明：为什么选这个客户结果，问题如何发生，什么改变会起作用，为什么优于替代，怎样证明、谁承担、下一步怎样调整。表格帮助核对，完整论证让人作决定。\n\n对应完整条件：[案例A](案例A-连锁备货.md)、[案例B](案例B-智能资源成本.md)、[案例C](案例C-设备售后.md)、[案例D](案例D-专业服务.md)；综合示范见[第40章](40-完整改造提案.md)。\n","html":"\u003ch1>工作簿｜把一条业务写成可以讨论和决定的改造提案\u003c/h1>\n\u003cp>可以复制或下载后编辑，也可以先用四组教学案例练习。不必填满所有格子；要让不在前几次会议里的人，也能理解这项投入为什么值得。\u003c/p>\n\u003ch2 id=\"workbook-section-1\">先写完整背景，再给项目起名\u003c/h2>\n\u003cp>说清客户在什么处境下需要什么，原工作怎样完成，当前事实与矛盾在哪里。避免只写“效率低、知识没沉淀”。\u003c/p>\n\u003cp>连锁案例可以这样开头：“这是一家有八家门店和中央工坊的烘焙企业。我们先研究其中两家店的一款主打点心。交通枢纽附近的X店每天收到80份，18点售罄后仍有顾客询问；社区里的Y店同样收到80份，却只售出60份。工坊在其他订单已安排后，可用于这两店的生产时间最多能做320份，现在只安排160份。原配送每天早晨一次，门店售罄后也停止这款商品的推介和预订记录。因此，需要研究的既是两店分配，也包括是否有需求被供给、配送和销售安排共同限制。”\u003c/p>\n\u003cp>这段背景给出了角色、事实与相互关系，也保留了尚需检验的解释。自己的材料应有可追溯出处，不把故事细节补成事实。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>要交代的背景\u003c/th>\n\u003cth>自己的材料\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>客户或使用者、所需结果\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>原工作与相关人员、系统\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>关键观察、时间与出处\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>想解释的差别与其他可能原因\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"workbook-section-2\">把几种可实施选择放在同一口径下\u003c/h2>\n\u003cp>至少保留一个合理的普通改进或现成方案，再提出AI参与的安排。说明各自改变什么，依赖哪些条件，而非让新方案只与最差旧流程比较。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>选择\u003c/th>\n\u003cth>机制与实际动作\u003c/th>\n\u003cth>条件、成本与未知\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>原工作或改进人工/SOP\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>成熟软件或较简单方法\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AI与工程共同改造\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>例如，连锁可以将原160份总产量重新分给两店，也可以增加总产量并安排下午补货。前者主要减少分配不当造成的剩余，后者争取新增需求，但要承担更多成本。把两种选择讲清楚，负责人才能判断哪种更适合。\u003c/p>\n\u003cp>其他案例也需要作相应区分：工业品业务先形成可靠候选，再经过客户选择和实际交付；设备业务要分清必要的多阶段服务与可避免复访；内容业务则要把待核初稿和客户愿意付费的正式交付分开。\u003c/p>\n\u003ch2 id=\"workbook-section-3\">沿一笔工作写出改变如何发生\u003c/h2>\n\u003cp>从自然输入出发，写谁取得什么、怎样比较、谁采用、怎样执行、结果返回哪里，以及哪部分会帮助下一次。重要未知要有名字。\u003c/p>\n\u003cp>例如，工业品客户提供旧零件照片，希望三天内拿到替代品。销售先保留原要求并补问使用条件，AI将候选产品与当前供应材料放在一起，指出适配或交期上的冲突。工程师确认能否使用，采购确认是否能按期取得，销售再发出正式报价。之后继续记录客户是否采用、实际是否交付，以及未成交的理由。这些步骤分别解释了智能怎样帮助工作、工作怎样才有机会形成订单，也指出下一轮可以复用什么。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>关键连接\u003c/th>\n\u003cth>对象、动作与承担者\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>当前目标、事实与相关经验\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AI、人和现有系统的分工\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>正式决定与实际动作\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>客户结果、未采用与反例\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>下一次可使用的方法与入口\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"workbook-section-4\">写一张收益账，也写出它的成立条件\u003c/h2>\n\u003cp>使用相同需求、任务、质量与时期。收入、变动成本、新支出、工时与一次建设分别列，未来能力说明用途，不任意标价补回本。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项目\u003c/th>\n\u003cth>当前依据\u003c/th>\n\u003cth>如何进入比较\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>需求、销量或付费交付\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>价格、单均贡献及履约成本\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型、工具与持续共建\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>核验、返工与瓶颈容量\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>实际可取消支出\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>一次性建设和维护\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>留下的能力与再用检验\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>固定工资下释放时间，先是容量；实际取消外协或新增付费交付后，再说明现金路径。同一小时或同一费用不重复计算，局部模型比较也不要再加到已包含它的项目账。\u003c/p>\n\u003ch2 id=\"workbook-section-5\">让试点围绕一项会改变选择的未知\u003c/h2>\n\u003cp>在A里，扩大方案相对已改分配多240元生产成本和80元日支出，需要新增销售至少27份。试点可以围绕新增有效需求、品质、补货与推介共同取得证据，而非泛问“AI能否促进增长”。\u003c/p>\n\u003cp>分别设计三层观察：任务有没有用对事实，实际业务相对替代是否改善，后续人员或新场景能否用对积累。共享库存、同期活动、人员和价格变化应进入比较条件。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>观察与比较\u003c/th>\n\u003cth>取得什么证据\u003c/th>\n\u003cth>哪种结果使采用范围改变\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>任务合格\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>业务效果\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接任或迁移\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"workbook-section-6\">给持续工作安排真实资源\u003c/h2>\n\u003cp>业务负责人承担价值和取舍，专业人员判断方法，FDE实现与改进，内部成员接住资料、运行和评价。岗位激励、时间与决定权也写进安排。\u003c/p>\n\u003cp>内容专家每天2小时，若按20分钟核6篇，就不能又拿其中40分钟做验证而仍承诺6篇。阶段交付、探索和维护应放在共同容量下选择。\u003c/p>\n\u003cp>写明本轮可投入范围、实际承担者与复查时点，以及继续、改法和停止的条件。未知预算和负责人是开工前要确定的事项，不能用模板替真实企业决定。\u003c/p>\n\u003ch2 id=\"workbook-section-7\">变一个条件，检查自己是否会判断\u003c/h2>\n\u003cp>仍用A，售价12元、额外生产60份成本240元不变，新增日常支出从80变120元。扩产相对100/60，要多卖多少份才更好？正常日需求X160/Y60时，扩产的贡献又是多少？\u003c/p>\n\u003cp>先写计算与选择，再看参考：新增投入240＋120=360元，卖30份恰好覆盖，至少31份才更好；正常日扩产贡献2640−880−120=1640元，比只改分配1280元多360元。原来的“至少27份”不能直接沿用。\u003c/p>\n\u003cp>再用B思考：订单增至250但单均贡献降到400，为什么仍可能比原来差？参考是250×400与200×500相等，新费用11000元还没有被覆盖。\u003c/p>\n\u003ch2 id=\"workbook-section-8\">把表格重新连成一段提案\u003c/h2>\n\u003cp>最后应能用连续文字说明：为什么选这个客户结果，问题如何发生，什么改变会起作用，为什么优于替代，怎样证明、谁承担、下一步怎样调整。表格帮助核对，完整论证让人作决定。\u003c/p>\n\u003cp>对应完整条件：\u003ca href=\"#case-a\">案例A\u003c/a>、\u003ca href=\"#case-b\">案例B\u003c/a>、\u003ca href=\"#case-c\">案例C\u003c/a>、\u003ca href=\"#case-d\">案例D\u003c/a>；综合示范见\u003ca href=\"#lesson-40\">第40章\u003c/a>。\u003c/p>\n","headings":[{"id":"workbook-section-1","label":"先写完整背景，再给项目起名"},{"id":"workbook-section-2","label":"把几种可实施选择放在同一口径下"},{"id":"workbook-section-3","label":"沿一笔工作写出改变如何发生"},{"id":"workbook-section-4","label":"写一张收益账，也写出它的成立条件"},{"id":"workbook-section-5","label":"让试点围绕一项会改变选择的未知"},{"id":"workbook-section-6","label":"给持续工作安排真实资源"},{"id":"workbook-section-7","label":"变一个条件，检查自己是否会判断"},{"id":"workbook-section-8","label":"把表格重新连成一段提案"}],"exportMd":"# 工作簿｜把一条业务写成可以讨论和决定的改造提案\n\n可以复制或下载后编辑，也可以先用四组教学案例练习。不必填满所有格子；要让不在前几次会议里的人，也能理解这项投入为什么值得。\n\n## 先写完整背景，再给项目起名\n\n说清客户在什么处境下需要什么，原工作怎样完成，当前事实与矛盾在哪里。避免只写“效率低、知识没沉淀”。\n\n连锁案例可以这样开头：“这是一家有八家门店和中央工坊的烘焙企业。我们先研究其中两家店的一款主打点心。交通枢纽附近的X店每天收到80份，18点售罄后仍有顾客询问；社区里的Y店同样收到80份，却只售出60份。工坊在其他订单已安排后，可用于这两店的生产时间最多能做320份，现在只安排160份。原配送每天早晨一次，门店售罄后也停止这款商品的推介和预订记录。因此，需要研究的既是两店分配，也包括是否有需求被供给、配送和销售安排共同限制。”\n\n这段背景给出了角色、事实与相互关系，也保留了尚需检验的解释。自己的材料应有可追溯出处，不把故事细节补成事实。\n\n| 要交代的背景 | 自己的材料 |\n|---|---|\n| 客户或使用者、所需结果 | 待填写 |\n| 原工作与相关人员、系统 | 待填写 |\n| 关键观察、时间与出处 | 待填写 |\n| 想解释的差别与其他可能原因 | 待填写 |\n\n## 把几种可实施选择放在同一口径下\n\n至少保留一个合理的普通改进或现成方案，再提出AI参与的安排。说明各自改变什么，依赖哪些条件，而非让新方案只与最差旧流程比较。\n\n| 选择 | 机制与实际动作 | 条件、成本与未知 |\n|---|---|---|\n| 原工作或改进人工/SOP | 待填写 | 待填写 |\n| 成熟软件或较简单方法 | 待填写 | 待填写 |\n| AI与工程共同改造 | 待填写 | 待填写 |\n\n例如，连锁可以将原160份总产量重新分给两店，也可以增加总产量并安排下午补货。前者主要减少分配不当造成的剩余，后者争取新增需求，但要承担更多成本。把两种选择讲清楚，负责人才能判断哪种更适合。\n\n其他案例也需要作相应区分：工业品业务先形成可靠候选，再经过客户选择和实际交付；设备业务要分清必要的多阶段服务与可避免复访；内容业务则要把待核初稿和客户愿意付费的正式交付分开。\n\n## 沿一笔工作写出改变如何发生\n\n从自然输入出发，写谁取得什么、怎样比较、谁采用、怎样执行、结果返回哪里，以及哪部分会帮助下一次。重要未知要有名字。\n\n例如，工业品客户提供旧零件照片，希望三天内拿到替代品。销售先保留原要求并补问使用条件，AI将候选产品与当前供应材料放在一起，指出适配或交期上的冲突。工程师确认能否使用，采购确认是否能按期取得，销售再发出正式报价。之后继续记录客户是否采用、实际是否交付，以及未成交的理由。这些步骤分别解释了智能怎样帮助工作、工作怎样才有机会形成订单，也指出下一轮可以复用什么。\n\n| 关键连接 | 对象、动作与承担者 |\n|---|---|\n| 当前目标、事实与相关经验 | 待填写 |\n| AI、人和现有系统的分工 | 待填写 |\n| 正式决定与实际动作 | 待填写 |\n| 客户结果、未采用与反例 | 待填写 |\n| 下一次可使用的方法与入口 | 待填写 |\n\n## 写一张收益账，也写出它的成立条件\n\n使用相同需求、任务、质量与时期。收入、变动成本、新支出、工时与一次建设分别列，未来能力说明用途，不任意标价补回本。\n\n| 项目 | 当前依据 | 如何进入比较 |\n|---|---|---|\n| 需求、销量或付费交付 | 待填写 | 待填写 |\n| 价格、单均贡献及履约成本 | 待填写 | 待填写 |\n| 模型、工具与持续共建 | 待填写 | 待填写 |\n| 核验、返工与瓶颈容量 | 待填写 | 待填写 |\n| 实际可取消支出 | 待填写 | 待填写 |\n| 一次性建设和维护 | 待填写 | 待填写 |\n| 留下的能力与再用检验 | 待填写 | 待填写 |\n\n固定工资下释放时间，先是容量；实际取消外协或新增付费交付后，再说明现金路径。同一小时或同一费用不重复计算，局部模型比较也不要再加到已包含它的项目账。\n\n## 让试点围绕一项会改变选择的未知\n\n在A里，扩大方案相对已改分配多240元生产成本和80元日支出，需要新增销售至少27份。试点可以围绕新增有效需求、品质、补货与推介共同取得证据，而非泛问“AI能否促进增长”。\n\n分别设计三层观察：任务有没有用对事实，实际业务相对替代是否改善，后续人员或新场景能否用对积累。共享库存、同期活动、人员和价格变化应进入比较条件。\n\n| 观察与比较 | 取得什么证据 | 哪种结果使采用范围改变 |\n|---|---|---|\n| 任务合格 | 待填写 | 待填写 |\n| 业务效果 | 待填写 | 待填写 |\n| 接任或迁移 | 待填写 | 待填写 |\n\n## 给持续工作安排真实资源\n\n业务负责人承担价值和取舍，专业人员判断方法，FDE实现与改进，内部成员接住资料、运行和评价。岗位激励、时间与决定权也写进安排。\n\n内容专家每天2小时，若按20分钟核6篇，就不能又拿其中40分钟做验证而仍承诺6篇。阶段交付、探索和维护应放在共同容量下选择。\n\n写明本轮可投入范围、实际承担者与复查时点，以及继续、改法和停止的条件。未知预算和负责人是开工前要确定的事项，不能用模板替真实企业决定。\n\n## 变一个条件，检查自己是否会判断\n\n仍用A，售价12元、额外生产60份成本240元不变，新增日常支出从80变120元。扩产相对100/60，要多卖多少份才更好？正常日需求X160/Y60时，扩产的贡献又是多少？\n\n先写计算与选择，再看参考：新增投入240＋120=360元，卖30份恰好覆盖，至少31份才更好；正常日扩产贡献2640−880−120=1640元，比只改分配1280元多360元。原来的“至少27份”不能直接沿用。\n\n再用B思考：订单增至250但单均贡献降到400，为什么仍可能比原来差？参考是250×400与200×500相等，新费用11000元还没有被覆盖。\n\n## 把表格重新连成一段提案\n\n最后应能用连续文字说明：为什么选这个客户结果，问题如何发生，什么改变会起作用，为什么优于替代，怎样证明、谁承担、下一步怎样调整。表格帮助核对，完整论证让人作决定。\n\n对应完整条件：[案例A](#case-a)、[案例B](#case-b)、[案例C](#case-c)、[案例D](#case-d)；综合示范见[第40章](#lesson-40)。\n","exportSingleMd":"# 工作簿｜把一条业务写成可以讨论和决定的改造提案\n\n可以复制或下载后编辑，也可以先用四组教学案例练习。不必填满所有格子；要让不在前几次会议里的人，也能理解这项投入为什么值得。\n\n## 先写完整背景，再给项目起名\n\n说清客户在什么处境下需要什么，原工作怎样完成，当前事实与矛盾在哪里。避免只写“效率低、知识没沉淀”。\n\n连锁案例可以这样开头：“这是一家有八家门店和中央工坊的烘焙企业。我们先研究其中两家店的一款主打点心。交通枢纽附 const {pages,parts}=COURSE;
const pageMap=Object.fromEntries(pages.map(p=>[p.id,p]));
const storeKey='gaidn-fde-course-40-20261025';
let active='home',restorePosition=false,scrollTimer=null;
const main=document.getElementById('main'),sidebar=document.getElementById('sidebar'),overlay=document.getElementById('overlay');
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function readState(){try{const d=JSON.parse(localStorage.getItem(storeKey));return d&&pageMap[d.id]?d:null}catch{return null}}
function saveState(){if(!pageMap[active])return;try{localStorage.setItem(storeKey,JSON.stringify({id:active,y:Math.max(0,window.scrollY),at:Date.now()}))}catch{}}
function menu(open){const wasOpen=sidebar.classList.contains('open');sidebar.classList.toggle('open',open);overlay.classList.toggle('open',open);document.getElementById('menu-toggle').setAttribute('aria-expanded',String(open));if(open)sidebar.querySelector('input').focus();else if(wasOpen)document.getElementById('menu-toggle').focus()}
document.getElementById('menu-toggle').onclick=()=>menu(!sidebar.classList.contains('open'));
document.getElementById('menu-close').onclick=()=>menu(false);overlay.onclick=()=>menu(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape')menu(false)});
function renderCatalog(){document.getElementById('catalog').innerHTML=`<a href="#home">课程首页</a><a href="#intro">导学 · 从这里开始</a><h2>八部分 · 40章</h2>`+parts.map((p,i)=>`<details data-part="${i}" ${i===0?'open':''}><summary>${['一','二','三','四','五','六','七','八'][i]} · ${p.title}</summary>${pages.filter(x=>x.part===i).map(x=>`<a href="#${x.id}">${esc(x.title.replace(/^第\d+章｜/,''))}</a>`).join('')}</details>`).join('')+`<h2>案例、工作与回查</h2>`+['case-a','case-b','case-c','case-d','workbook','glossary','reading'].map(id=>`<a href="#${id}">${esc(pageMap[id].title)}</a>`).join('');}
renderCatalog();
function updateCatalog(){document.querySelectorAll('#catalog a').forEach(a=>{if(a.hash==='#'+active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});if(pageMap[active]?.part>=0)document.querySelector(`details[data-part="${pageMap[active].part}"]`).open=true;}
function home(migration=''){
const state=readState();main.innerHTML=`<section class="home">${migration?`<div class="migration" role="status">${esc(migration)}</div>`:''}<div class="hero"><p class="eyebrow">企业视角的完整课程 · 2026</p><h1>企业 AI 转型与 FDE</h1><p class="sub">企业自己的AI能力：经验、优势与智能资源经营</p><p class="lead">从企业的客户价值出发，理解经验怎样留下、优势怎样放大，以及AI伙伴与FDE怎样共同改变生产和持续发展的能力。</p><div class="actions"><a class="button primary" href="#intro">从头学习 →</a>${state?'<button id="resume">继续阅读</button>':''}<a class="button" href="#workbook">打开改造提案</a></div>${state?`<p class="search-note">上次读到：${esc(pageMap[state.id].title)}</p>`:''}</div><p class="section-label">一条从技术变化走向企业能力的路径</p><div class="route-list">${parts.map((p,i)=>`<a class="route-row" href="#lesson-${String(p.from).padStart(2,'0')}"><span class="n">0${i+1}</span><div><h2>${p.title}</h2><p>${p.description} · 第${p.from}—${p.to}章</p></div><span aria-hidden="true">→</span></a>`).join('')}</div><section class="resources"><p class="section-label">带着材料推演，再回到自己的业务</p><div class="resource-links"><a href="#case-a">连锁备货</a><a href="#case-b">工业品报价</a><a href="#case-c">设备售后</a><a href="#case-d">工业品牌内容服务</a><a href="#glossary">概念回查</a></div></section><p class="fineprint">40章 · 4组教学案例 · 改造提案工作簿<br>案例采用标明的教学材料与假设数字。阅读进度只保存在本机，表示阅读位置。<br><a href="index.html" download="企业AI转型与FDE-离线阅读.html">下载离线阅读版</a> · <button class="quiet" data-download="book">下载完整可编辑稿</button></p></section>`;
if(state)document.getElementById('resume').onclick=()=>{restorePosition=true;location.hash=state.id;};
}
function reader(page){const sequential=pages.filter(p=>p.number!==null);const i=sequential.findIndex(p=>p.id===page.id),prev=i>0?sequential[i-1]:null,next=i>=0?sequential[i+1]:null;const kicker=page.part>=0?`${['一','二','三','四','五','六','七','八'][page.part]} · ${parts[page.part].title} / ${page.number} / 40`:page.role;
 const outline=page.headings?.length?'<details class="article-outline"><summary>本篇内容</summary><div>'+page.headings.map(h=>'<button type="button" data-jump="'+h.id+'">'+esc(h.label)+'</button>').join('')+'</div></details>':'';
 const article=page.html.replace(/(<h1>[\s\S]*?<\/h1>)/,'$1'+outline);
 main.innerHTML=`<div class="reading"><p class="eyebrow">${kicker}</p><div class="reader-tools"><a href="#home">课程首页</a><button class="quiet" data-download="${page.id==='workbook'?'workbook':'current'}">下载${page.id==='workbook'?'工作簿':'本篇'}</button><button class="quiet" id="print-current">打印本篇</button><button class="quiet" id="print-all">打印全书</button></div><article class="article" id="article">${article}</article><nav class="course-nav" aria-label="前后课程">${prev?`<a href="#${prev.id}"><small>上一课</small>${esc(prev.title)}</a>`:'<a href="#home"><small>返回</small>课程首页</a>'}${next?`<a href="#${next.id}"><small>接着学习 →</small>${esc(next.title)}</a>`:'<a href="#workbook"><small>带回自己的业务 →</small>改造提案工作簿</a>'}</nav><p class="fineprint"><a href="#reading">研究与延伸阅读</a> · <a href="index.html" download="企业AI转型与FDE-离线阅读.html">离线阅读版</a><br>GAIDN · 2026-10-25 · 40章版</p></div>`;
 document.getElementById('print-current').onclick=()=>window.print();document.getElementById('print-all').onclick=()=>{document.getElementById('print-book').innerHTML=pages.map(p=>`<article class="article">${p.html}</article>`).join('');document.body.classList.add('print-all');window.print();};}
window.addEventListener('afterprint',()=>document.body.classList.remove('print-all'));
function route(){saveState();let raw;try{raw=decodeURIComponent(location.hash.slice(1))}catch{raw='unknown'}active=raw||'home';let message='';if(/^c\d+/i.test(active)||(new URLSearchParams(location.search).get('v')==='69a4d9f'&&/^lesson-/.test(active))){active='home';message='课程已从头重构，原章节编号不再沿用。请从新版导学开始，或使用目录和搜索查找。';}else if(active!=='home'&&!pageMap[active]){active='home';message='这个阅读位置未找到，可以从新版导学或目录继续。';}const state=readState();if(active==='home'){home(message);document.title='企业 AI 转型与 FDE · GAIDN'}else{reader(pageMap[active]);document.title=pageMap[active].title+' · 企业 AI 转型与 FDE'}updateCatalog();menu(false);const y=restorePosition&&state?.id===active?state.y:0;restorePosition=false;window.scrollTo(0,y);if(active!=='home'&&!y)saveState();main.focus({preventScroll:true});}
document.addEventListener('click',e=>{const jump=e.target.closest('[data-jump]');if(jump){document.getElementById(jump.dataset.jump)?.scrollIntoView({block:'start'});return;}const dl=e.target.closest('[data-download]');if(!dl)return;const kind=dl.dataset.download;let text,name;if(kind==='book'){text=pages.map(p=>`<a id="${p.id}"></a>\n\n${p.exportMd}`).join('\n\n---\n\n');name='企业AI转型与FDE-完整稿.md';}else{const p=kind==='workbook'?pageMap.workbook:pageMap[active];text=p.exportSingleMd;name=p.file;}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);});
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLocaleLowerCase(),out=document.getElementById('search-results');document.getElementById('catalog').hidden=Boolean(q);if(!q){out.innerHTML='';return;}const terms=q.split(/\s+/);const matches=pages.filter(p=>terms.every(t=>(p.title+' '+p.text).toLocaleLowerCase().includes(t)));out.innerHTML=`<p class="search-note">全部课程与案例 · ${matches.length}篇</p>`+(matches.length?matches.map(p=>`<a class="search-hit" href="#${p.id}"><small>${p.role}${p.part>=0?' · '+parts[p.part].title:''}</small>${esc(p.title)}</a>`).join(''):'<p class="empty">没有找到对应内容。可以试试“投入”“权限”或“资料”。</p>');});
window.addEventListener('hashchange',route);window.addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(saveState,160)},{passive:true});window.addEventListener('pagehide',saveState);route();
</script>
</body></html>
