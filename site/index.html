<script>
const COURSE={"pages":[{"file":"00-导学.md","id":"intro","number":0,"role":"导学","part":-1,"title":"企业 AI 转型与 FDE","md":"# 企业 AI 转型与 FDE\n\n畅销商品早早卖完，生产窗口却没用满；报价单越来越快，客户仍等不到能交付的方案；专家每天核验，AI生成的稿件却越积越多。企业面对的机会，常常藏在这些分开管理的事情之间。\n\n如果AI只用于加快原来的一个动作，企业可能只得到一张更快的日报。把客户、专业判断、生产资源和结果重新连接起来，它才有机会帮助企业发现系统性问题，发展自己的方法，并创造新的增长。\n\n这门课从企业经营与能力发展看FDE。FDE是Forward Deployed Engineer，通常译为前线部署工程师，核心是靠近现场，把认识做成可用工程，再由真实采用继续修正。AI提供通用智能，企业提供自身事实、经验和生产条件，二者在连续工作中共同发展。\n\n## 四组案例，各自面对什么生意\n\n| 案例 | 要看清的经营矛盾 | 从哪里读 |\n|---|---|---|\n| 连锁烘焙 | 缺货、排产、推介与需求反馈怎样共同压住增长 | [完整案例A](案例A-连锁备货.md) |\n| 工业品选型报价 | 多次交接怎样损失期限、订单和毛利，AI怎样放大适配判断 | [完整案例B](案例B-智能资源成本.md) |\n| 设备售后 | 经验、准备和派工怎样影响复访，能力如何跨人接任 | [完整案例C](案例C-设备售后.md) |\n| 工业品牌内容服务 | 生成扩产与专业瓶颈、客户付费需求和新服务怎样连接 | [完整案例D](案例D-专业服务.md) |\n\n四组企业和业务数字为教学构造。收益比较给出需求、成本、产能和采用条件，可以改变条件重新推演；公开研究另注明出处。案例不代表真实客户已经取得相应收益。\n\n## 全课要逐步回答的四件事\n\n第一，经验为什么难留下，AI怎样让更多自然工作材料进入下一次判断。会区分事件、解释、方法、组织能力与竞争优势，研究如何从生产开始形成积累。\n\n第二，FDE怎样找到企业真正有客户价值的差异，连同执行与纠错一起放大。企业不必处处定制，而应知道自己的能力怎样发生作用。\n\n第三，技术和产业仍在变化，企业怎样边采用边发展有自身特色的AI。长期工程、内部吸收和阶段选择，需要在持续工作里共同形成。\n\n第四，怎样经营可调度智能资源。token投入怎样形成合格工作，工作怎样兑现客户和经营结果，本轮又怎样留下未来能力；模型、人员、容量和维护都在同一条链中。\n\n## 怎样沿40章前进\n\n不要求先会软件开发。课程假定你熟悉人员、业务和经营取舍，新概念放在具体工作中解释。\n\n| 部分 | 主要判断 | 起点 |\n|---|---|---|\n| 变化 | 新智能供给怎样传到成本、分工和竞争 | [第1章](01-智能供给.md) |\n| 积累 | 经验怎样在生产中成为下一次能用的能力 | [第5章](05-从经验到能力.md) |\n| 优势与现场 | 哪种差异值得发展，FDE怎样发现和实现 | [第11章](11-客户认可的价值.md) |\n| 智能伙伴 | 持续职责、分工、信息与实际行动 | [第17章](17-智能伙伴的持续职责.md) |\n| 智能资源经营 | 配置、整链产能、成本和能力留存 | [第23章](23-token与智能资源.md) |\n| 证据与更新 | 任务合格、业务有效、组织学会及纠错 | [第29章](29-任务质量.md) |\n| 组织与共建 | 岗位、长期FDE、内部承担和迁移 | [第33章](33-岗位权责与激励.md) |\n| 持续发展 | 路线、新产品、行业节奏与完整提案 | [第37章](37-阶段发展路线.md) |\n\n顺序阅读可形成完整判断，也可以从自己的问题进入，再补前置材料。每章只展开与该问题有关的案例部分，完整条件在四份案例中汇总。目录、搜索和概念回查帮助定位，不以填写作业阻止继续阅读。\n\n最终用[改造提案工作簿](工作簿-改造提案.md)把一条真实业务写完整：客户为什么需要，问题如何发生，几种选择谁更好，AI与FDE分别做什么，结果怎样检验，谁持续承担，以及什么证据会改变下一步。\n\n从[第1章](01-智能供给.md)进入这条路线。\n","html":"\u003ch1>企业 AI 转型与 FDE\u003c/h1>\n\u003cp>畅销商品早早卖完，生产窗口却没用满；报价单越来越快，客户仍等不到能交付的方案；专家每天核验，AI生成的稿件却越积越多。企业面对的机会，常常藏在这些分开管理的事情之间。\u003c/p>\n\u003cp>如果AI只用于加快原来的一个动作，企业可能只得到一张更快的日报。把客户、专业判断、生产资源和结果重新连接起来，它才有机会帮助企业发现系统性问题，发展自己的方法，并创造新的增长。\u003c/p>\n\u003cp>这门课从企业经营与能力发展看FDE。FDE是Forward Deployed Engineer，通常译为前线部署工程师，核心是靠近现场，把认识做成可用工程，再由真实采用继续修正。AI提供通用智能，企业提供自身事实、经验和生产条件，二者在连续工作中共同发展。\u003c/p>\n\u003ch2 id=\"intro-section-1\">四组案例，各自面对什么生意\u003c/h2>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>案例\u003c/th>\n\u003cth>要看清的经营矛盾\u003c/th>\n\u003cth>从哪里读\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>连锁烘焙\u003c/td>\n\u003ctd>缺货、排产、推介与需求反馈怎样共同压住增长\u003c/td>\n\u003ctd>\u003ca href=\"#case-a\">完整案例A\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工业品选型报价\u003c/td>\n\u003ctd>多次交接怎样损失期限、订单和毛利，AI怎样放大适配判断\u003c/td>\n\u003ctd>\u003ca href=\"#case-b\">完整案例B\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>设备售后\u003c/td>\n\u003ctd>经验、准备和派工怎样影响复访，能力如何跨人接任\u003c/td>\n\u003ctd>\u003ca href=\"#case-c\">完整案例C\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工业品牌内容服务\u003c/td>\n\u003ctd>生成扩产与专业瓶颈、客户付费需求和新服务怎样连接\u003c/td>\n\u003ctd>\u003ca href=\"#case-d\">完整案例D\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>四组企业和业务数字为教学构造。收益比较给出需求、成本、产能和采用条件，可以改变条件重新推演；公开研究另注明出处。案例不代表真实客户已经取得相应收益。\u003c/p>\n\u003ch2 id=\"intro-section-2\">全课要逐步回答的四件事\u003c/h2>\n\u003cp>第一，经验为什么难留下，AI怎样让更多自然工作材料进入下一次判断。会区分事件、解释、方法、组织能力与竞争优势，研究如何从生产开始形成积累。\u003c/p>\n\u003cp>第二，FDE怎样找到企业真正有客户价值的差异，连同执行与纠错一起放大。企业不必处处定制，而应知道自己的能力怎样发生作用。\u003c/p>\n\u003cp>第三，技术和产业仍在变化，企业怎样边采用边发展有自身特色的AI。长期工程、内部吸收和阶段选择，需要在持续工作里共同形成。\u003c/p>\n\u003cp>第四，怎样经营可调度智能资源。token投入怎样形成合格工作，工作怎样兑现客户和经营结果，本轮又怎样留下未来能力；模型、人员、容量和维护都在同一条链中。\u003c/p>\n\u003ch2 id=\"intro-section-3\">怎样沿40章前进\u003c/h2>\n\u003cp>不要求先会软件开发。课程假定你熟悉人员、业务和经营取舍，新概念放在具体工作中解释。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>部分\u003c/th>\n\u003cth>主要判断\u003c/th>\n\u003cth>起 样损失期限、订单和毛利，AI怎样放大适配判断 | [完整案例B](https://zhongky1995.github.io/gaidn-fde-handbook/#case-b) |\n| 设备售后 | 经验、准备和派工怎样影响复访，能力如何跨人接任 | [完整案例C](https://zhongky1995.github.io/gaidn-fde-handbook/#case-c) |\n| 工业品牌内容服务 | 生成扩产与专业瓶颈、客户付费需求和新服务怎样连接 | [完整案例D](https://zhongky1995.github.io/gaidn-fde-handbook/#case-d) |\n\n四组企业和业务数字为教学构造。收益比较给出需求、成本、产能和采用条件，可以改变条件重新推演；公开研究另注明出处。案例不代表真实客户已经取得相应收益。\n\n## 全课要逐步回答的四件事\n\n第一，经验为什么难留下，AI怎样让更多自然工作材料进入下一次判断。会区分事件、解释、方法、组织能力与竞争优势，研究如何从生产开始形成积累。\n\n第二，FDE怎样找到企业真正有客户价值的差异，连同执行与纠错一起放大。企业不必处处定制，而应知道自己的能力怎样发生作用。\n\n第三，技术和产业仍在变化，企业怎样边采用边发展有自身特色的AI。长期工程、内部吸收和阶段选择，需要在持续工作里共同形成。\n\n第四，怎样经营可调度智能资源。token投入怎样形成合格工作，工作怎样兑现客户和经营结果，本轮又怎样留下未来能力；模型、人员、容量和维护都在同一条链中。\n\n## 怎样沿40章前进\n\n不要求先会软件开发。课程假定你熟悉人员、业务和经营取舍，新概念放在具体工作中解释。\n\n| 部分 | 主要判断 | 起点 |\n|---|---|---|\n| 变化 | 新智能供给怎样传到成本、分工和竞争 | [第1章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-01) |\n| 积累 | 经验怎样在生产中成为下一次能用的能力 | [第5章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-05) |\n| 优势与现场 | 哪种差异值得发展，FDE怎样发现和实现 | [第11章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-11) |\n| 智能伙伴 | 持续职责、分工、信息与实际行动 | [第17章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-17) |\n| 智能资源经营 | 配置、整链产能、成本和能力留存 | [第23章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-23) |\n| 证据与更新 | 任务合格、业务有效、组织学会及纠错 | [第29章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-29) |\n| 组织与共建 | 岗位、长期FDE、内部承担和迁移 | [第33章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-33) |\n| 持续发展 | 路线、新产品、行业节奏与完整提案 | [第37章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-37) |\n\n顺序阅读可形成完整判断，也可以从自己的问题进入，再补前置材料。每章只展开与该问题有关的案例部分，完整条件在四份案例中汇总。目录、搜索和概念回查帮助定位，不以填写作业阻止继续阅读。\n\n最终用[改造提案工作簿](https://zhongky1995.github.io/gaidn-fde-handbook/#workbook)把一条真实业务写完整：客户为什么需要，问题如何发生，几种选择谁更好，AI与FDE分别做什么，结果怎样检验，谁持续承担，以及什么证据会改变下一步。\n\n从[第1章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-01)进入这条路线。\n","text":"# 企业 AI 转型与 FDE\n\n畅销商品早早卖完，生产窗口却没用满；报价单越来越快，客户仍等不到能交付的方案；专家每天核验，AI生成的稿件却越积越多。企业面对的机会，常常藏在这些分开管理的事情之间。\n\n如果AI只用于加快原来的一个动作，企业可能只得到一张更快的日报。把客户、专业判断、生产资源和结果重新连接起来，它才有机会帮助企业发现系统性问题，发展自己的方法，并创造新的增长。\n\n这门课从企业经营与能力发展看FDE。FDE是Forward Deployed Engineer，通常译为前线部署工程师，核心是靠近现场，把认识做成可用工程，再由真实采用继续修正。AI提供通用智能，企业提供自身事实、经验和生产条件，二者在连续工作中共同发展。\n\n## 四组案例，各自面对什么生意\n\n| 案例 | 要看清的经营矛盾 | 从哪里读 |\n|---|---|---|\n| 连锁烘焙 | 缺货、排产、推介与需求反馈怎样共同压住增长 | 完整案例A |\n| 工业品选型报价 | 多次交接怎样损失期限、订单和毛利，AI怎样放大适配判断 | 完整案例B |\n| 设备售后 | 经验、准备和派工怎样影响复访，能力如何跨人接任 | 完整案例C |\n| 工业品牌内容服务 | 生成扩产与专业瓶颈、客户付费需求和新服务怎样连接 | 完整案例D |\n\n四组企业和业务数字为教学构造。收益比较给出需求、成本、产能和采用条件，可以改变条件重新推演；公开研究另注明出处。案例不代表真实客户已经取得相应收益。\n\n## 全课要逐步回答的四件事\n\n第一，经验为什么难留下，AI怎样让更多自然工作材料进入下一次判断。会区分事件、解释、方法、组织能力与竞争优势，研究如何从生产开始形成积累。\n\n第二，FDE怎样找到企业真正有客户价值的差异，连同执行与纠错一起放大。企业不必处处定制，而应知道自己的能力怎样发生作用。\n\n第三，技术和产业仍在变化，企业怎样边采用边发展有自身特色的AI。长期工程、内部吸收和阶段选择，需要在持续工作里共同形成。\n\n第四，怎样经营可调度智能资源。token投入怎样形成合格工作，工作怎样兑现客户和经营结果，本轮又怎样留下未来能力；模型、人员、容量和维护都在同一条链中。\n\n## 怎样沿40章前进\n\n不要求先会软件开发。课程假定你熟悉人员、业务和经营取舍，新概念放在具体工作中解释。\n\n| 部分 | 主要判断 | 起点 |\n|---|---|---|\n| 变化 | 新智能供给怎样传到成本、分工和竞争 | 第1章 |\n| 积累 | 经验怎样在生产中成为下一次能用的能力 | 第5章 |\n| 优势与现场 | 哪种差异值得发展，FDE怎样发现和实现 | 第11章 |\n| 智能伙伴 | 持续职责、分工、信息与实际行动 | 第17章 |\n| 智能资源经营 | 配置、整链产能、成本和能力留存 | 第23章 |\n| 证据与更新 | 任务合格、业务有效、组织学会及纠错 | 第29章 |\n| 组织与共建 | 岗位、长期FDE、内部承担和迁移 | 第33章 |\n| 持续发展 | 路线、新产品、行业节奏与完整提案 | 第37章 |\n\n顺序阅读可形成完整判断，也可以从自己的问题进入，再补前置材料。每章只展开与该问题有关的案例部分，完整条件在四份案例中汇总。目录、搜索和概念回查帮助定位，不以填写作业阻止继续阅读。\n\n最终用改造提案工作簿把一条真实业务写完整：客户为什么需要，问题如何发生，几种选择谁更好，AI与FDE分别做什么，结果怎样检验，谁持续承担，以及什么证据会改变下一步。\n\n从第1章进入这条路线。\n"},{"file":"01-智能供给.md","id":"lesson-01","number":1,"role":"核心课","part":0,"title":"第1章｜从购买软件到调用智能，企业得到了什么","md":"# 第1章｜从购买软件到调用智能，企业得到了什么\n\n客户发来一张旧连接器照片、一页图纸，要求三天内交付替代品。销售能查库存，却不知道外形相同的型号能否在客户工况下使用；工程师能判断，却还要补问；采购知道另一型号的货期，又未必知道客户期限。这是本课[工业品报价案例](案例B-智能资源成本.md)的起点。\n\n这样的工作过去也能做成系统：登记型号、查价格、计算保修或生成报价单，都有成熟办法。困难出现在标准信息之间：客户说法不一致，照片不完整，材料彼此冲突，下一步要先问什么也随情况变化。大量劳动用在理解、比较和重新组织上。\n\n## 新供给减少了哪一种准备\n\n规则程序把明确要求写成可重复步骤。日期、数量、现行价格等条件齐备时，它可以稳定、低成本地计算。专用机器学习则从相关样本学习模式，例如预测某类设备故障，企业需准备相应样本和目标。\n\n基础模型提供另一种起点：同一套在广泛材料中形成的能力，可以用于读客户说明、比较文本、组织候选、撰写材料或生成代码。企业先取得一部分通用能力，再适配自己的任务，不必每遇到一种非标准表达就从零制造一套模型。[基础模型研究](https://arxiv.org/abs/2108.07258v3)\n\n在这笔询价里，AI可以先把照片说明、图纸与产品材料放在一起，指出现货方案尚缺工况依据，另一个方案虽然技术条件较完整，十天货期却不满足三天要求。它把原来需要不同岗位多次转述的关系提前摆出来，让人员更快进入有意义的判断。\n\n## 采用成本怎样改变\n\n专用系统通常先花时间定义任务、编码、处理例外，做成后重复执行很便宜。通用模型减少部分前期专门准备，但每次使用仍要取得背景、核对事实和处理不确定输出。\n\n因此，大量重复且稳定的价格计算，值得用现有程序；种类多、每类数量不大、材料又常变化的技术询价，可能更适合先调用通用能力。后者过去难以逐类开发，AI使一部分原来只能靠人工的工作开始有了新的经济选择。\n\n判断应落在完整任务上：少了哪些准备，新增多少核验，最后有没有形成可采用方案。只看一句回答写得快，尚未触及企业真正支付的成本。\n\n## 企业自己的部分在哪里\n\n模型可以比较方案，却不知道当前库存是否真实、供应商是否确认货期、客户能否接受适配、谁可以作出价格承诺。这些事实和决定权来自企业。\n\n把模型与查询、行动和结果反馈组织起来，AI就能进一步承担连续任务：发现缺项后补问，取得新信息后重新比较，动作完成后检查状态。这类工作常用Agent承载，具体实现将在后文展开。它的可用能力来自模型与企业条件的组合。\n\n吸收能力研究把识别、吸收并应用外部知识视为组织能力，强调已有相关认识的重要性。[原始研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf) 对企业的含义很实际：通用供给可以买到，哪些问题值得交给它、怎样让结果进入生产，需要在自己的工作中形成认识。\n\n这家经销商最值得建设的，因而是把零散询价变成可履约方案的能力。软件、模型和专业人员各承担适合的部分，客户最后拿到的才可能既快又能用。\n","html":"\u003ch1>第1章｜从购买软件到调用智能，企业得到了什么\u003c/h1>\n\u003cp>客户发来一张旧连接器照片、一页图纸，要求三天内交付替代品。销售能查库存，却不知道外形相同的型号能否在客户工况下使用；工程师能判断，却还要补问；采购知道另一型号的货期，又未必知道客户期限。这是本课\u003ca href=\"#case-b\">工业品报价案例\u003c/a>的起点。\u003c/p>\n\u003cp>这样的工作过去也能做成系统：登记型号、查价格、计算保修或生成报价单，都有成熟办法。困难出现在标准信息之间：客户说法不一致，照片不完整，材料彼此冲突，下一步要先问什么也随情况变化。大量劳动用在理解、比较和重新组织上。\u003c/p>\n\u003ch2 id=\"lesson-01-section-1\">新供给减少了哪一种准备\u003c/h2>\n\u003cp>规则程序把明确要求写成可重复步骤。日期、数量、现行价格等条件齐备时，它可以稳定、低成本地计算。专用机器学习则从相关样本学习模式，例如预测某类设备故障，企业需准备相应样本和目标。\u003c/p>\n\u003cp>基础模型提供另一种起点：同一套在广泛材料中形成的能力，可以用于读客户说明、比较文本、组织候选、撰写材料或生成代码。企业先取得一部分通用能力，再适配自己的任务，不必每遇到一种非标准表达就从零制造一套模型。\u003ca href=\"https://arxiv.org/abs/2108.07258v3\" target=\"_blank\" rel=\"noopener noreferrer\">基础模型研究\u003c/a>\u003c/p>\n\u003cp>在这笔询价里，AI可以先把照片说明、图纸与产品材料放在一起，指出现货方案尚缺工况依据，另一个方案虽然技术条件较完整，十天货期却不满足三天要求。它把原来需要不同岗位多次转述的关系提前摆出来，让人员更快进入有意义的判断。\u003c/p>\n\u003ch2 id=\"lesson-01-section-2\">采用成本怎样改变\u003c/h2>\n\u003cp>专用系统通常先花时间定义任务、编码、处理例外，做成后重复执行很便宜。通用模型减少部分前期专门准备，但每次使用仍要取得背景、核对事实和处理不确定输出。\u003c/p>\n\u003cp>因此，大量重复且稳定的价格计算，值得用现有程序；种类多、每类数量不大、材料又常变化的技术询价，可能更适合先调用通 载，具体实现将在后文展开。它的可用能力来自模型与企业条件的组合。\n\n吸收能力研究把识别、吸收并应用外部知识视为组织能力，强调已有相关认识的重要性。[原始研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf) 对企业的含义很实际：通用供给可以买到，哪些问题值得交给它、怎样让结果进入生产，需要在自己的工作中形成认识。\n\n这家经销商最值得建设的，因而是把零散询价变成可履约方案的能力。软件、模型和专业人员各承担适合的部分，客户最后拿到的才可能既快又能用。\n","exportSingleMd":"# 第1章｜从购买软件到调用智能，企业得到了什么\n\n客户发来一张旧连接器照片、一页图纸，要求三天内交付替代品。销售能查库存，却不知道外形相同的型号能否在客户工况下使用；工程师能判断，却还要补问；采购知道另一型号的货期，又未必知道客户期限。这是本课[工业品报价案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-b)的起点。\n\n这样的工作过去也能做成系统：登记型号、查价格、计算保修或生成报价单，都有成熟办法。困难出现在标准信息之间：客户说法不一致，照片不完整，材料彼此冲突，下一步要先问什么也随情况变化。大量劳动用在理解、比较和重新组织上。\n\n## 新供给减少了哪一种准备\n\n规则程序把明确要求写成可重复步骤。日期、数量、现行价格等条件齐备时，它可以稳定、低成本地计算。专用机器学习则从相关样本学习模式，例如预测某类设备故障，企业需准备相应样本和目标。\n\n基础模型提供另一种起点：同一套在广泛材料中形成的能力，可以用于读客户说明、比较文本、组织候选、撰写材料或生成代码。企业先取得一部分通用能力，再适配自己的任务，不必每遇到一种非标准表达就从零制造一套模型。[基础模型研究](https://arxiv.org/abs/2108.07258v3)\n\n在这笔询价里，AI可以先把照片说明、图纸与产品材料放在一起，指出现货方案尚缺工况依据，另一个方案虽然技术条件较完整，十天货期却不满足三天要求。它把原来需要不同岗位多次转述的关系提前摆出来，让人员更快进入有意义的判断。\n\n## 采用成本怎样改变\n\n专用系统通常先花时间定义任务、编码、处理例外，做成后重复执行很便宜。通用模型减少部分前期专门准备，但每次使用仍要取得背景、核对事实和处理不确定输出。\n\n因此，大量重复且稳定的价格计算，值得用现有程序；种类多、每类数量不大、材料又常变化的技术询价，可能更适合先调用通用能力。后者过去难以逐类开发，AI使一部分原来只能靠人工的工作开始有了新的经济选择。\n\n判断应落在完整任务上：少了哪些准备，新增多少核验，最后有没有形成可采用方案。只看一句回答写得快，尚未触及企业真正支付的成本。\n\n## 企业自己的部分在哪里\n\n模型可以比较方案，却不知道当前库存是否真实、供应商是否确认货期、客户能否接受适配、谁可以作出价格承诺。这些事实和决定权来自企业。\n\n把模型与查询、行动和结果反馈组织起来，AI就能进一步承担连续任务：发现缺项后补问，取得新信息后重新比较，动作完成后检查状态。这类工作常用Agent承载，具体实现将在后文展开。它的可用能力来自模型与企业条件的组合。\n\n吸收能力研究把识别、吸收并应用外部知识视为组织能力，强调已有相关认识的重要性。[原始研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf) 对企业的含义很实际：通用供给可以买到，哪些问题值得交给它、怎样让结果进入生产，需要在自己的工作中形成认识。\n\n这家经销商最值得建设的，因而是把零散询价变成可履约方案的能力。软件、模型和专业人员各承担适合的部分，客户最后拿到的才可能既快又能用。\n","text":"# 第1章｜从购买软件到调用智能，企业得到了什么\n\n客户发来一张旧连接器照片、一页图纸，要求三天内交付替代品。销售能查库存，却不知道外形相同的型号能否在客户工况下使用；工程师能判断，却还要补问；采购知道另一型号的货期，又未必知道客户期限。这是本课工业品报价案例的起点。\n\n这样的工作过去也能做成系统：登记型号、查价格、计算保修或生成报价单，都有成熟办法。困难出现在标准信息之间：客户说法不一致，照片不完整，材料彼此冲突，下一步要先问什么也随情况变化。大量劳动用在理解、比较和重新组织上。\n\n## 新供 每份生产变动成本4元，未售无残值；原工资租金不变。扩产方案新增补货和AI整理支出共80元/日。\n\n| 选择 | 当日售出 | 列示贡献 |\n|---|---:|---:|\n| 原来80/80，生产160 | 140份 | 1040元 |\n| 只改100/60，仍生产160 | 160份 | 1280元 |\n| 扩到160/60，生产220 | 220份 | 1680元 |\n\n扩产比原安排多640元贡献，比已经改好分配的方案多400元。X这款商品销量翻倍，两店合计销量增加约57.1%；它不是整店收入翻倍。这个潜力要求真实需求、产能、品质、配送与销售动作共同成立。\n\n## 积累的内容也因此改变\n\n如果项目只是自动写日报，企业留下的是更整齐的销量。如果项目把售罄后的顾客行为、补货决定、员工推介、实际到店和结果关联起来，下一次就能研究：哪些条件值得补货，什么时候推介有用，新增生产是否赚钱。\n\n同一份自然工作材料既支持当期决定，也减少以后重新翻聊天、问当事人和解释背景的负担。AI降低部分组织与比较成本，使更多原来不值得专门整理的经验进入可积累范围。个人实践还要经过共同理解和使用，才形成组织知识。[知识研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)\n\n对这家连锁，数字化的新边界不是再多一张表，而是把原来分散、容易消失的经营关系带回下一轮生产。这样留下的经验，才可能持续帮助企业找到新的增长空间。\n","html":"\u003ch1>第2章｜畅销商品卖完了，企业为什么仍可能错过增长\u003c/h1>\n\u003cp>X店18点卖完80份主打点心，之后仍有顾客询问；Y店配了80份，只卖60份。对总部来说，最直接的改法是把Y店的20份转给X店。\u003c/p>\n\u003cp>这个判断没有错，却可能只看到机会的一小部分。在本课的\u003ca href=\"#case-a\">连锁烘焙案例\u003c/a>中，销量、工坊排产、配送和门店推介分别被管理，没人持续把它们放在一起。\u003c/p>\n\u003ch2 id=\"lesson-02-section-1\">数字正确，含义却没有被保留下来\u003c/h2>\n\u003cp>X店的收银记录准确写着80，但18点以后已经没有商品可卖，后面多少人愿意买不会继续变成成交。销量受到供给上限限制，不能独自代表全部需求。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNDYwIiB2aWV3Qm94PSIwIDAgMzYwIDQ2MCIgcm9sZT0iaW1nIj48dGl0bGU+6ZSA6YeP5LiN562J5LqO5YWo6YOo6ZyA5rGCPC90aXRsZT48ZGVzYz7mlZnlrabmoYjkvovvvJpY5Y2W5a6MODDkuKrlkI7pnIDmsYLmnKrnn6XvvIxZ5Y2W5Ye6NjDkuKrliakyMOS4quOAguaWnOe6ueWPquihqOekuuacquiuoemHj++8jOS4jeaMiemrmOW6puS8sOeul+mcgOaxguOAgjwvZGVzYz48ZGVmcz48bWFya2VyIGlkPSJhcnJvdyIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8tc3RhcnQtcmV2ZXJzZSI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTB6IiBmaWxsPSIjMTY1ZDUyIi8+PC9tYXJrZXI+PHBhdHRlcm4gaWQ9InVua25vd24iIHdpZHRoPSI4IiBoZWlnaHQ9IjgiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPjxwYXRoIGQ9Ik0tMiAyTDIgLTJNMCA4TDggME02IDEwTDEwIDYiIHN0cm9rZT0iIzg3NWQyMiIgc3Ryb2tlLXdpZHRoPSIxLjUiLz48L3BhdHRlcm4+PC9k 卖其他商品，但围绕这款商品的需求获取提前停止了。工坊按已经成交的数量安排，门店按手里有多少货行动，总部又用受限销量估计下一轮，于是几项局部合理的安排共同压住增长。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNjUwIiB2aWV3Qm94PSIwIDAgMzYwIDY1MCIgcm9sZT0iaW1nIj48dGl0bGU+57y66LSn5oCO5qC35Y6L5L2P5LiL5LiA6L2u5aKe6ZW/PC90aXRsZT48ZGVzYz7mlZnlrabmoYjkvovkuK3nmoTogZTliqjvvJrlj5fpmZDplIDph4/lhrPlrprmjpLkuqfvvIzmj5DliY3llK7nvYTkvb/mjqjku4vkuI7pooTorqLlgZzmraLvvIzpnIDmsYLnur/ntKLlh4/lsJHvvIzlho3lm57liLDlgY/kvY7mjpLkuqfjgILnjrDlnLrmoLjlrp7nmoTnlJ/kuqfnqpflj6Pku43mnInkvZnph4/jgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjY1MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7nvLrotKfmgI7moLfljovkvY/kuIvkuIDova7lop7plb88L3RleHQ+PHRleHQgeD0iMjQiIHk9Ijc2IiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM1MjY4NWUiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjQwMCI+5pys5qGI6KeC5a+fIMK3IOS4jeeUsee8uui0p+iHquWKqOaOqOWHujwvdGV4dD48cmVjdCB4PSIzMCIgeT0iMTA0IiB3aWR0aD0iMjkwIiBoZWlnaHQ9Ijk2IiByeD0iNiIgZmlsbD0id2hpdGUiIHN0cm9rZT0iIzYwNzM2YyIgc3Ryb2tlLXdpZHRoPSIxLjUiLz48dGV4dCB4PSI0OCIgeT0iMTM1IiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyMTM0MmYiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjQwMCI+5Lik5bqX5Y+v55So56qX5Y+j77yaMzIw5Lu9PC90ZX section-4\">积累的内容也因此改变\u003c/h2>\n\u003cp>如果项目只是自动写日报，企业留下的是更整齐的销量。如果项目把售罄后的顾客行为、补货决定、员工推介、实际到店和结果关联起来，下一次就能研究：哪些条件值得补货，什么时候推介有用，新增生产是否赚钱。\u003c/p>\n\u003cp>同一份自然工作材料既支持当期决定，也减少以后重新翻聊天、问当事人和解释背景的负担。AI降低部分组织与比较成本，使更多原来不值得专门整理的经验进入可积累范围。个人实践还要经过共同理解和使用，才形成组织知识。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">知识研究\u003c/a>\u003c/p>\n\u003cp>对这家连锁，数字化的新边界不是再多一张表，而是把原来分散、容易消失的经营关系带回下一轮生产。这样留下的经验，才可能持续帮助企业找到新的增长空间。\u003c/p>\n","headings":[{"id":"lesson-02-section-1","label":"数字正确，含义却没有被保留下来"},{"id":"lesson-02-section-2","label":"从一个缺货问题，追到一组相互强化的安排"},{"id":"lesson-02-section-3","label":"当供给与工作一起改变，收益可能来自哪里"},{"id":"lesson-02-section-4","label":"积累的内容也因此改变"}],"exportMd":"# 第2章｜畅销商品卖完了，企业为什么仍可能错过增长\n\nX店18点卖完80份主打点心，之后仍有顾客询问；Y店配了80份，只卖60份。对总部来说，最直接的改法是把Y店的20份转给X店。\n\n这个判断没有错，却可能只看到机会的一小部分。在本课的[连锁烘焙案例](#case-a)中，销量、工坊排产、配送和门店推介分别被管理，没人持续把它们放在一起。\n\n## 数字正确，含义却没有被保留下来\n\nX店的收银记录准确写着80，但18点以后已经没有商品可卖，后面多少人愿意买不会继续变成成交。销量受到供给上限限制，不能独自代表全部需求。\n\n![X店售出80份后未满足需求未知；Y店售60份余20份。销量正确，但X的成交被供给上限截住。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNDYwIiB2aWV3Qm94PSIwIDAgMzYwIDQ2MCIgcm9sZT0iaW1nIj48dGl0bGU+6ZSA6YeP5LiN562J5LqO5YWo6YOo6ZyA5rGCPC90aXRsZT48ZGVzYz7mlZnlrabmoYjkvovvvJpY5Y2W5a6MODDkuKrlkI7pnIDmsYLmnKrnn6XvvIxZ5Y2W5Ye6NjDkuKrliakyMOS4quOAguaWnOe6ueWPquihqOekuuacquiuoemHj++8jOS4jeaMiemrmOW6puS8sOeul+mcgOaxguOAgjwvZGVzYz48ZGVmcz48bWFya2VyIGlkPSJhcnJvdyIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8tc3RhcnQtcmV2ZXJzZSI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTB6IiBmaWxsPSIjMTY1ZDUyIi8+PC9tYXJrZXI+PHBhdHRlcm4gaWQ9InVua25vd24iIHdpZHRoPSI4IiBoZWlnaHQ9IjgiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPjxwYXRoIGQ9Ik0tMiAyTDIgLTJNMCA4TDggME02IDEwTDEwIDYiIHN0cm9rZT0iIzg3NWQyMiIgc3Ryb2tlLXdpZHRoPSIxLjUiLz48L3BhdHRlcm4+PC9kZWZzPjxyZWN0IHdpZHRoPSIzNjAiIGhlaWdodD0iN 整理的经验进入可积累范围。个人实践还要经过共同理解和使用，才形成组织知识。[知识研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)\n\n对这家连锁，数字化的新边界不是再多一张表，而是把原来分散、容易消失的经营关系带回下一轮生产。这样留下的经验，才可能持续帮助企业找到新的增长空间。\n","text":"# 第2章｜畅销商品卖完了，企业为什么仍可能错过增长\n\nX店18点卖完80份主打点心，之后仍有顾客询问；Y店配了80份，只卖60份。对总部来说，最直接的改法是把Y店的20份转给X店。\n\n这个判断没有错，却可能只看到机会的一小部分。在本课的连锁烘焙案例中，销量、工坊排产、配送和门店推介分别被管理，没人持续把它们放在一起。\n\n## 数字正确，含义却没有被保留下来\n\nX店的收银记录准确写着80，但18点以后已经没有商品可卖，后面多少人愿意买不会继续变成成交。销量受到供给上限限制，不能独自代表全部需求。\n\n \n\n店长在群里说“18点卖光，后来还有人问”，日报只剩“销量80”。从中丢掉的售罄时点和后续行为，恰好影响下一次排产。传统数字化保存了已定义的交易事实，却较难以可承受成本持续保存判断背景、例外与跨岗位关系。\n\n## 从一个缺货问题，追到一组相互强化的安排\n\n进一步核对现场，得到三项教学条件：其他六店订单已安排后，对这两店开放的生产窗口还能做320份，目前只排160；下午补货要增一趟路线；门店在该商品售罄后停止社群推介，也不再持续登记预订。\n\n这里既有产能空间，也有工作行为变化。员工仍在卖其他商品，但围绕这款商品的需求获取提前停止了。工坊按已经成交的数量安排，门店按手里有多少货行动，总部又用受限销量估计下一轮，于是几项局部合理的安排共同压住增长。\n\n \n\n这些联系需要核对，不能由“卖完了”直接推断工坊闲置或员工缺少积极性。AI的作用，是把聊天、销售时段、排产、配送和推广材料组织成可比较的现场，让团队提出并检验一套系统解释。\n\n## 当供给与工作一起改变，收益可能来自哪里\n\n用相同口径比较三种选择。给定正常日X可购买需求160份、Y60份，售价12元、每份生产变动成本4元，未售无残值；原工资租金不变。扩产方案新增补货和AI整理支出共80元/日。\n\n| 选择 | 当日售出 | 列示贡献 |\n|---|---:|---:|\n| 原来80/80，生产160 | 140份 | 1040元 |\n| 只改100/60，仍生产160 | 160份 | 1280元 |\n| 扩到160/60，生产220 | 220份 | 1680元 |\n\n扩产比原安排多640元贡献，比已经改好分配的方案多400元。X这款商品销量翻倍，两店合计销量增加约57.1%；它不是整店收入翻倍。这个潜力要求真实需求、产能、品质、配送与销售动作共同成立。\n\n## 积累的内容也因此改变\n\n如果项目只是自动写日报，企业留下的是更整齐的销量。如果项目把售罄后的顾客行为、补货决定、员工推介、实际到店和结果关联起来，下一次就能研究：哪些条件值得补货，什么时候推介有用，新增生产是否赚钱。\n\n同一份自然工作材料既支持当期决定，也减少以后重新翻聊天、问当事人和解释背景的负担。AI降低部分组织与比较成本，使更多原来不值得专门整理的经验进入可积累范围。个人实践还要经过共同理解和使用，才形成组织知识。知识研究\n\n对这家连锁，数字化的新边界不是再多一张表，而是把原来分散、容易消失的经营关系带回下一轮生产。这样留下的经验，才可能持续帮助企业找到新的增长空间。\n"},{"file":"03-产业重构.md","id":"lesson-03","number":3,"role":"核心课","part":0,"title":"第3章｜AI改变成本以后，谁会得到新的价值","md":"# 第3章｜AI改变成本以后，谁会得到新的价值\n\n一家工业品牌内容团队原来靠制作文章和产品资料收费。AI提高起草速度后，团队可以交更多稿，也可能发现客户开始自己写初稿，只为技术核验、渠道判断或持续获客支持付费。技术提高效率的同时，客户购买的东西也可能改变。\n\n这是[内容服务案例](案例D-专业服务.md)提出的经营问题：企业如果只加快旧交付，能否保住原来的收入和利润？\n\n## 一项工作变便宜，会沿着业务继续传导\n\n材料整理成本下降，可以让过去买不起专业服务的小客户进入市场，也可以让原客户把部分工作拿回内部。竞争者取得相近能力后，还可能压低旧产品价格。\n\n因此，成本变化先改变哪些事做得起，再改变谁来做、怎样组合和按什么收费。工序减少不等于整条业务消失，新的现场集成、可靠判断和持续责任也可能变得更重要。\n\n工业品经销商同样如此。AI可以帮助更多销售理解询价，原先依靠信息不透明取得的报价优势可能减弱；能找到可用替代、确认真实交期并可靠交付的组合，却仍对客户有价值。\n\n## 订单增长与企业获利之间，还隔着竞争\n\n在报价案例的给定月账中，200单、每单贡献500元，贡献是100000元。如果更快报价带来250单，但竞争和降价使每单贡献降至400元，总贡献仍是100000元；新系统费用还要另外支付。\n\n企业创造了更多成交，未必留下更多收益。价值可能被客户通过低价取得，也可能流向掌握客户入口、关键供给或履约资源的一方。Teece关于商业模式与互补能力的研究，把技术、交付安排和价值获取连在一起讨论。[商业模式](https://www.sciencedirect.com/science/article/pii/S002463010900051X)、[互补能力](https://pubsonline.informs.org/doi/abs/10.1287/inte.18.3.46)\n\n对经营判断，更有用的问题是：当通用智能更容易取得后，本企业还掌握什么能影响客户选择，形成结果又依赖谁？答案可能在客户理解、独特方法、渠道、生产网络或专业责任中。\n\n## 新产品通常要重新组织交付\n\n内容团队从按篇制作转向持续获客支持，需要知道哪些产品问题吸引合适询价、销售是否跟进、客户最终为何成交。只有更多文章，没有后续资料和行动，就承担不起这种新承诺。\n\n| 候选路线 | 客户购买的结果 | 企业新增责任 |\n|---|---|---|\n| 更快的技术内容 | 准确且可发布的材料 | 核验、版本与交付时效 |\n| 独立核验 | 对客户自制材料作专业检查 | 明确依据、范围与修改责任 |\n| 持续获客支持 | 连接内容、询价和行动的改进 | 资料持续进入、跨团队协作与结果追踪 |\n\n三条路线可以使用相近模型，却有不同成本、容量与收费逻辑。持续服务也不天然优于一次性交付，必须有客户需要和可持续履约支持。\n\n产业重构对企业的压力，正在这种传导中发生。原来最耗时、最容易收费的环节，未必仍是新周期最稀缺的部分。FDE进入现场，应帮助企业辨认这种变化，再把值得发展的组合做进生产。\n","html":"\u003ch1>第3章｜AI改变成本以后，谁会得到新的价值\u003c/h1>\n\u003cp>一家工业品牌内容团队原来靠制作文章和产品资料收费。AI提高起草速度后，团队可以交更多稿，也可能发现客户开始自己写初稿，只为技术核验、渠道判断或持续获客支持付费。技术提高效率的同时，客户购买的东西也可能改变。\u003c/p>\n\u003cp>这是\u003ca href=\"#case-d\">内容服务案例\u003c/a>提出的经营问题：企业如果只加快旧交付，能否保住原来的收入和利润？\u003c/p>\n\u003ch2 id=\"lesson-03-section-1\">一项工作变便宜，会沿着业务继续传导\u003c/h2>\n\u003cp>材料整理成本下降，可以让过去买不起专业服务的小客户进入市场，也可以让原客户把部分工作拿回内部。竞争者取得相近能力后，还可能压低旧产品价格。\u003c/p>\n\u003cp>因此，成本变化先改变哪些事做得起，再改变谁来做、怎样组合和按什么收费。工序减少不等于整条业务消失，新的现场集成、可靠判断和持续责任也可能变得更重要。\u003c/p>\n\u003cp>工业品经销商同样如此。AI可以帮助更多销售理解询价，原先依靠信息不透明取得的报价优势可能减弱；能找到可用替代、确认真实交期并可靠交付的组合，却仍对客户有价值。\u003c/p>\n\u003ch2 id=\"lesson-03-section-2\">订单增长与企业获利之间，还隔着竞争\u003c/h2>\n\u003cp>在报价案例的给定月账中，200单、每单贡献500元，贡献是100000元。如果更快报价带来250单，但竞争和降价使每单贡献降至400元，总贡献仍是100000元；新系统费用还要另外支付。\u003c/p>\n\u003cp>企业创造了更多成交，未必留下更多收益。价值可能被客户通过低价取得，也可能流向掌握客户入口、关键供给或履约资源的一方。Teece关于商业模式与互补能力的研究，把技术、交付安排和价值获取连在一起讨论。\u003ca href=\"https://www.sciencedirect.com/science/article/pii/S002463010900051X\" target=\"_blank\" rel=\"noopener noreferrer\">商业模式\u003c/a>、\u003ca href=\"https://pubsonline.informs.org/doi/abs/10.1287/inte.18.3.46\" target=\"_blank\" rel=\"noopener noreferrer\">互补能力\u003c/a>\u003c/p>\n\u003cp>对经营判断，更有用的问题是：当通用智能更容易取得后，本企业还掌握什么能影响客户选择，形成结果又依赖谁？答案可能在客户理解、独特方法、渠道、生产网络或专业责任中。\u003c/p>\n\u003ch2 id=\"lesson-03-section-3\">新产品通常要重新组织交付\u003c/h2>\n\u003cp>内容团队从按篇制作转向持续获客支持，需要知道哪些产品问题吸引合适询价、销售是否跟进、客户最终为何成交。只有更多文章，没有后续资料和行动，就承担不起这种新承诺。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>候选路线\u003c/th>\n\u003cth>客户购买的结果\u003c/th>\n\u003cth>企业新增责任\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>更快的技术内容\u003c/td>\n\u003ctd>准确且可发布的材料\u003c/td>\n\u003ctd>核验、版本与交付时效\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>独立核验\u003c/td>\n\u003ctd>对客户自制材料作专业检查\u003c/td>\n\u003ctd>明确依据、范围与修改责任\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>持续获客支持\u003c/td>\n\u003ctd>连接内容、询价和行动的改进\u003c/td>\n\u003ctd>资料持续进入、跨团队协作与结果追踪\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>三条路线可以使用相近模型，却有不同成本、容量与收费逻辑。持续服务也不天然优于一次性交付，必须有客户需要和可持续履约支持。\u003c/p>\n\u003cp>产业重构对企业的压力，正在这种传导中发生。原来最耗时、最容易收费的环节，未必仍是新周期最稀缺的部分。FDE进入现场，应帮助企业辨认这种变化，再把值得发展的组合做进生产。\u003c/p>\n","headings":[{"id":"lesson-03-section-1","label":"一项工作变便宜，会沿着业务继续传导"},{"id":"lesson-03-section-2","label":"订单增长与企业获利之间，还隔着竞争"},{"id":"lesson-03-section-3","label":"新产品通常要重新组织交付"}],"exportMd":"# 第3章｜AI改变成本以后，谁会得到新的价值\n\n一家工业品牌内容团队原来靠制作文章和产品资料收费。AI提高起草速度后，团队可以交更多稿，也可能发现客户开始自己写初稿，只为技术核验、渠道判断或持续获客支持付费。技术提高效率的同时，客户购买的东西也可能改变。\n\n这是[内容服务案例](#case-d)提出的经营问题：企业如果只加快旧交付，能否保住原来的收入和利润？\n\n## 一项工作变便宜，会沿着业务继续传导\n\n材料整理成本下降，可以让过去买不起专业服务的小客户进入市场，也可以让原客户把部分工作拿回内部。竞争者取得相近能力后，还可能压低旧产品价格。\n\n因此，成本变化先改变哪些事做得起，再改变谁来做、怎样组合和按什么收费。工序减少不等于整条业务消失，新的现场集成、可靠判断和持续责任也可能变得更重要。\n\n工业品经销商同样如此。AI可以帮助更多销售理解询价，原先依靠信息不透明取得的报价优势可能减弱；能找到可用替代、确认真实交期并可靠交付的组合，却仍对客户有价值。\n\n## 订单增长与企业获利之间，还隔着竞争\n\n在报价案例的给定月账中，200单、每单贡献500元，贡献是100000元。如果更快报价带来250单，但竞争和降价使每单贡献降至400元，总贡献仍是100000元；新系统费用还要另外支付。\n\n企业创造了更多成交，未必留下更多收益。价值可能被客户通过低价取得，也可能流向掌握客户入口、关键供给或履约资源的一方。Teece关于商业模式与互补能力的研究，把技术、交付安排和价值获取连在一起讨论。[商业模式](https://www.sciencedirect.com/science/article/pii/S002463010900051X)、[互补能力](https://pubsonline.informs.org/doi/abs/10.1287/inte.18.3.46)\n\n对经营判断，更有用的问题是：当通用智能更容易取得后，本企业还掌握什么能影响客户选择，形成结果又依赖谁？答案可能在客户理解、独特方法、渠道、生产网络或专业责任中。\n\n## 新产品通常要重新组织交付\n\n内容团队从按篇制作转向持续获客支持，需要知道哪些产品问题吸引合适询价、销售是否跟进、客户最终为何成交。只有更多文章，没有后续资料和行动，就承担不起这种新承诺。\n\n| 候选路线 | 客户购买的结果 | 企业新增责任 |\n|---|---|---|\n| 更快的技术内容 | 准确且可发布的材料 | 核验、版本与交付时效 |\n| 独立核验 | 对客户自制材料作专业检查 | 明确依据、范围与修改责任 |\n| 持续获客支持 | 连接内容、询价和行动的改进 | 资料持续进入、跨团队协作与结果追踪 |\n\n三条路线可以使用相近模型，却有不同成本、容量与收费逻辑。持续服务也不天然优于一次性交付，必须有客户需要和可持续履约支持。\n\n产业重构对企业的压力，正在这种传导中发生。原来最耗时、最容易收费的环节，未必仍是新周期最稀缺的部分。FDE进入现场，应帮助企业辨认这种变化，再把值得发展的组合做进生产。\n","exportSingleMd":"# 第3章｜AI改变成本以后，谁会得到新的价值\n\n一家工业品牌内容团队原来靠制作文章和产品资料收费。AI提高起草速度后，团队可以交更多稿，也可能发现客户开始自己写初稿，只为技术核验、渠道判断或持续获客支持付费。技术提高效率的同时，客户购买的东西也可能改变。\n\n这是[内容服务案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-d)提出的经营问题：企业如果只加快旧交付，能否保住原来的收入和利润？\n\n## 一项工作变便宜，会沿着业务继续传导\n\n材料整理成本下降，可以让过去买不起专业服务的小客户进入市场，也可以让原客户把部分工作拿回内部。竞争者取得相近能力后，还可能压低旧产品价格。\n\n因此，成本变化先改变哪些事做得起，再改变谁来做、怎样组合和按什么收费。工序减少不等于整条业务消失，新的现场集成、可靠判断和持续责任也可能变得更重要。\n\n工业品经销商同样如此。AI可以帮助更多销售理解询价，原先依靠信息不透明取得的报价优势可能减弱；能找到可用替代、确认真实交期并可靠交付的组合，却仍对客户有价值。\n\n## 订单增长与企业获利之间，还隔着竞争\n\n在报价案例的给定月账中，200单、每单贡献500元，贡献是100000元。如果更快报价带来250单，但竞争和降价使每单贡献降至400元，总贡献仍是100000元；新系统费用还要另外支付。\n\n企业创造了更多成交，未必留下更多收益。价值可能被客户通过低价取得，也可能流向掌握客户入口、关键供给或履约资源的一方。Teece关于商业模式与互补能力的研究，把技术、交付安排和价值获取连在一起讨论。[商业模式](https://www.sciencedirect.com/science/article/pii/S002463010900051X)、[互补能力](https://pubsonline.informs.org/doi/abs/10.1287/inte.18.3.46)\n\n对经营判断，更有用的问题是：当通用智能更容易取得后，本企业还掌握什么能影响客户选择，形成结果又依赖谁？答案可能在客户理解、独特方法、渠道、生产网络或专业责任中。\n\n## 新产品通常要重新组织交付\n\n内容团队从按篇制作转向持续获客支持，需要知道哪些产品问题吸引合适询价、销售是否跟进、客户最终为何成交。只有更多文章，没有后续资料和行动，就承担不起这种新承诺。\n\n| 候选路线 | 客户购买的结果 | 企业新增责任 |\n|---|---|---|\n| 更快的技术内容 | 准确且可发布的材料 | 核验、版本与交付时效 |\n| 独立核验 | 对客户自制材料作专业检查 | 明确依据、范围与修改责任 |\n| 持续获客支持 | 连接内容、询价和行动的改进 | 资料持续进入、跨团队协作与结果追踪 |\n\n三条路线可以使用相近模型，却有不同成本、容量与收费逻辑。持续服务也不天然优于一次性交付，必须有客户需要和可持续履约支持。\n\n产业重构对企业的压力，正在这种传导中发生。原来最耗时、最容易收费的环节，未必仍是新周期最稀缺的部分。FDE进入现场，应帮助企业辨认这种变化，再把值得发展的组合做进生产。\n","text":"# 第3章｜AI改变成本以后，谁会得到新的价值\n\n一家工业品牌内容团队原来靠制作文章和产品资料收费。AI提高起草速度后，团队可以交更多稿，也可能发现客户开始自己写初稿，只为技术核验、渠道判断或持续获客支持付费。技术提高效率的同时，客户购买的东西也可能改变。\n\n这是内容服务案例提出的经营问题：企业如果只加快旧交付，能否保住原来的收入和利润？\n\n## 一项工作变便宜，会沿着业务继续传导\n\n材料整理成本下降，可以让过去买不起专业服务的小客户进入市场，也可以让原客户把部分工作拿回内部。竞争者取得相近能力后，还可能压低旧产品价格。\n\n因此，成本变化先改变哪些事做得起，再改变谁来做、怎样组合和按什么收费。工序减少不等于整条业务消失，新的现场集成、可靠判断和持续责任也可能变得更重要。\n\n工业品经销商同样如此。AI可以帮助更多销售理解询价，原先依靠信息不透明取得的报价优势可能减弱；能找到可用替代、确认真实交期并可靠交付的组合，却仍对客户有价值。\n\n## 订单增长与企业获利之间，还隔着竞争\n\n在报价案例的给定月账中，200单、每单贡献500元，贡献是100000元。如果更快报价带来250单，但竞争和降价使每单贡献降至400元，总贡献仍是100000元；新系统费用还要另外支付。\n\n企业创造了更多成交，未必留下更多收益。价值可能被客户通过低价取得，也可能流向掌握客户入口、关键供给或履约资源的一方。Teece关于商业模式与互补能力的研究，把技术、交付安排和价值获取连在一起讨论。商业模式、互补能力\n\n对经营判断，更有用的问题是：当通用智能更容易取得后，本企业还掌握什么能影响客户选择，形成结果又依赖谁？答案可能在客户理解、独特方法、渠道、生产网络或专业责任中。\n\n## 新产品通常要重新组织交付\n\n内容团队从按篇制作转向持续获客支持，需要知道哪些产品问题吸引合适询价、销售是否跟进、客户最终为何成交。只有更多文章，没有后续资料和行动，就承担不起这种新承诺。\n\n| 候选路线 | 客户购买的结果 | 企业新增责任 |\n|---|---|---|\n| 更快的技术内容 | 准确且可发布的材料 | 核验、版本与交付时效 |\n| 独立核验 | 对客户自制材料作专业检查 | 明确依据、范围与修改责任 |\n| 持续获客支持 | 连接内容、询价和行动的改进 | 资料持续进入、跨团队协作与结果追踪 |\n\n三条路线可以使用相近模型，却有不同成本、容量与收费逻辑。持续服务也不天然优于一次性交付，必须有客户需要和可持续履约支持。\n\n产业重构对企业的压力，正在这种传导中发生。原来最耗时、最容易收费的环节，未必仍是新周期最稀缺的部分。FDE进入现场，应帮助企业辨认这种变化，再把值得发展的组合做进生产。\n"},{"file":"04-共同发展.md","id":"lesson-04","number":4,"role":"核心课","part":0,"title":"第4章｜路线还没有定下来，企业为什么需要开始","md":"# 第4章｜路线还没有定下来，企业为什么需要开始\n\n设备服务企业刚把工单整理好，接任技术员就遇到新版本；团队开始追复访，又发现有些重复上门来自备件和派工；客户希望更少停机，原来的按次维修合同也可能需要调整。新问题在采用中出现，很难靠第一次需求会议写出全部终稿。\n\n本课的[设备售后案例](案例C-设备售后.md)因此把转型看成双向靠近：企业把真实事实、约束和结果交给AI与工程，工程再把新能力做进工作，使用结果反过来改变企业的认识。\n\n## 有些东西可以买，有些认识需要亲历\n\n等工具成熟，可以减少一部分技术选择成本；但哪类客户问题值得处理、员工会怎样使用、错误从哪里来、结果怎样返回，仍需要本企业经历真实任务。\n\n吸收能力研究指出，已有相关知识影响识别和应用外部知识。[原始研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf) 企业连续观察一条服务链后，能区分资料缺失、判断错误与执行受限，下次面对新模型就更容易判断它解决哪一段。没有这些认识，模型再强，也可能继续用演示代替采用。\n\n现在开始的价值，首先在于形成这种相关学习，而不在于最早买齐一套系统。\n\n## 等待与抢跑，都需要说明理由\n\n烘焙连锁可以先连起售罄、排产和真实结果，暂缓全网自动化。这些业务认识即使以后换模型或供应商，仍有用途。反之，尚未证实需求就为所有门店固化配额，可能把错误假设扩大。\n\n| 当下条件 | 更有理由的投入 |\n|---|---|\n| 价值方向清楚，现场事实分散 | 先建立小范围完整采用与反馈 |\n| 现成方法已经可用 | 直接采用，并保留本企业比较依据 |\n| 客户价值尚不明确 | 先查需求和替代，不急于大规模建系统 |\n| 新能力打开了原来做不到的工作 | 在有限范围试出新交付与资源要求 |\n\n这使“积极转型”成为可执行选择，而不是所有项目都加速。对变化中的资源和方法持续重组，是动态能力研究关心的问题。[原始研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)\n\n## 为什么需要连续工程力量\n\n一项现场发现只有进入实际工作，才能继续接受挑战。发现复访原因却无人改派工，认识就停在讨论；改了系统却不接回恢复与复发，又不知道是否有效。\n\nFDE可以承担连续往返，把发现做成原型、工具和运行安排，再按采用结果修订。企业内部负责人则持续判断客户价值和资源取舍。培训提供理解，系统提供当时能力，之后仍要有人推进这种变化。\n\n连续性不要求同一家外部团队永久驻场。关键经验、评价材料、工具含义和内部接续要留下，使企业能够更换技术、调整合作，也能在新问题出现时迅速再动起来。\n\n一家正在形成自身AI能力的企业，既使用当前可行方法，也保留挑战旧方法的空间。它的方向可以稳定，答案却要在生产和学习中不断长出来。\n","html":"\u003ch1>第4章｜路线还没有定下来，企业为什么需要开始\u003c/h1>\n\u003cp>设备服务企业刚把工单整理好，接任技术员就遇到新版本；团队开始追复访，又发现有些重复上门来自备件和派工；客户希望更少停机，原来的按次维修合同也可能需要调整。新问题在采用中出现，很难靠第一次需求会议写出全部终稿。\u003c/p>\n\u003cp>本课的\u003ca href=\"#case-c\">设备售后案例\u003c/a>因此把转型看成双向靠近：企业把真实事实、约束和结果交给AI与工程，工程再把新能力做进工作，使用结果反过来改变企业的认识。\u003c/p>\n\u003ch2 id=\"lesson-04-section-1\">有些东西可以买，有些认识需要亲历\u003c/h2>\n\u003cp>等工具成熟，可以减少一部分技术选择成本；但哪类客户问题值得处理、员工会怎样使用、错误从哪里来、结果怎样返回，仍需要本企业经历真实任务。\u003c/p>\n\u003cp>吸收能力研究指出，已有相关知识影响识别和应用外部知识。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a> 企业连续观察一条服务链后，能区分资料缺失、判断错误与执行受限，下次面对新模型就更容易判断它解决哪一段。没有这些认识，模型再强，也可能继续用演示代替采用。\u003c/p>\n\u003cp>现在开始的价值，首先在于形成这种相关学习，而不在于最早买齐一套系统。\u003c/p>\n\u003ch2 id=\"lesson-04-section-2\">等待与抢跑，都需要说明理由\u003c/h2>\n\u003cp>烘焙连锁可以先连起售罄、排产和真实结果，暂缓全网自动化。这些业务认识即使以后换模型或供应商，仍有用途。反之，尚未证实需求就为所有门店固化配额，可能把错误假设扩大。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>当下条件\u003c/th>\n\u003cth>更有理由的投入\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>价值方向清楚，现场事实分散\u003c/td>\n\u003ctd>先建立小范围完整采用与反馈\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>现成方法已经可用\u003c/td>\n\u003ctd>直接采用，并保留本企业比较依据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>客户价值尚不明确\u003c/td>\n\u003ctd>先查需求和替代，不急于大规模建系统\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新能力打开了原来做不到的工作\u003c/td>\n\u003ctd>在有限范围试出新交付与资源要求\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>这使“积极转型”成为可执行选择，而不是所有项目都加速。对变化中的资源和方法持续重组，是动态能力研究关心的问题。\u003ca href=\"https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-04-section-3\">为什么需要连续工程力量\u003c/h2>\n\u003cp>一项现场发现只有进入实际工作，才能继续接受挑战。发现复访原因却无人改派工，认识就停在讨论；改了系统却不接回恢复与复发，又不知道是否有效。\u003c/p>\n\u003cp>FDE可以承担连续往返，把发现做成原型、工具和运行安排，再按采用结果修订。企业内部负责人则持续判断客户价值和资源取舍。培训提供理解，系统提供当时能力，之后仍要有人推进这种变化。\u003c/p>\n\u003cp>连续性不要求同一家外部团队永久驻场。关键经验、评价材料、工具含义和内部接续要留下，使企业能够更换技术、调整合作，也能在新问题出现时迅速再动起来。\u003c/p>\n\u003cp>一家正在形成自身AI能力的企业，既使用当前可行方法，也保留挑战旧方法的空间。它的方向可以稳定，答案却要在生产和学习中不断长出来。\u003c/p>\n","headings":[{"id":"lesson-04-section-1","label":"有些东西可以买，有些认识需要亲历"},{"id":"lesson-04-section-2","label":"等待与抢跑，都需要说明理由"},{"id":"lesson-04-section-3","label":"为什么需要连续工程力量"}],"exportMd":"# 第4章｜路线还没有定下来，企业为什么需要开始\n\n设备服务企业刚把工单整理好，接任技术员就遇到新版本；团队开始追复访，又发现有些重复上门来自备件和派工；客户希望更少停机，原来的按次维修合同也可能需要调整。新问题在采用中出现，很难靠第一次需求会议写出全部终稿。\n\n本课的[设备售后案例](#case-c)因此把转型看成双向靠近：企业把真实事实、约束和结果交给AI与工程，工程再把新能力做进工作，使用结果反过来改变企业的认识。\n\n## 有些东西可以买，有些认识需要亲历\n\n等工具成熟，可以减少一部分技术选择成本；但哪类客户问题值得处理、员工会怎样使用、错误从哪里来、结果怎样返回，仍需要本企业经历真实任务。\n\n吸收能力研究指出，已有相关知识影响识别和应用外部知识。[原始研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf) 企业连续观察一条服务链后，能区分资料缺失、判断错误与执行受限，下次面对新模型就更容易判断它解决哪一段。没有这些认识，模型再强，也可能继续用演示代替采用。\n\n现在开始的价值，首先在于形成这种相关学习，而不在于最早买齐一套系统。\n\n## 等待与抢跑，都需要说明理由\n\n烘焙连锁可以先连起售罄、排产和真实结果，暂缓全网自动化。这些业务认识即使以后换模型或供应商，仍有用途。反之，尚未证实需求就为所有门店固化配额，可能把错误假设扩大。\n\n| 当下条件 | 更有理由的投入 |\n|---|---|\n| 价值方向清楚，现场事实分散 | 先建立小范围完整采用与反馈 |\n| 现成方法已经可用 | 直接采用，并保留本企业比较依据 |\n| 客户价值尚不明确 | 先查需求和替代，不急于大规模建系统 |\n| 新能力打开了原来做不到的工作 | 在有限范围试出新交付与资源要求 |\n\n这使“积极转型”成为可执行选择，而不是所有项目都加速。对变化中的资源和方法持续重组，是动态能力研究关心的问题。[原始研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)\n\n## 为什么需要连续工程力量\n\n一项现场发现只有进入实际工作，才能继续接受挑战。发现复访原因却无人改派工，认识就停在讨论；改了系统却不接回恢复与复发，又不知道是否有效。\n\nFDE可以承担连续往返，把发现做成原型、工具和运行安排，再按采用结果修订。企业内部负责人则持续判断客户价值和资源取舍。培训提供理解，系统提供当时能力，之后仍要有人推进这种变化。\n\n连续性不要求同一家外部团队永久驻场。关键经验、评价材料、工具含义和内部接续要留下，使企业能够更换技术、调整合作，也能在新问题出现时迅速再动起来。\n\n一家正在形成自身AI能力的企业，既使用当前可行方法，也保留挑战旧方法的空间。它的方向可以稳定，答案却要在生产和学习中不断长出来。\n","exportSingleMd":"# 第4章｜路线还没有定下来，企业为什么需要开始\n\n设备服务企业刚把工单整理好，接任技术员就遇到新版本；团队开始追复访，又发现有些重复上门来自备件和派工；客户希望更少停机，原来的按次维修合同也可能需要调整。新问题在采用中出现，很难靠第一次需求会议写出全部终稿。\n\n本课的[设备售后案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-c)因此把转型看成双向靠近：企业把真实事实、约束和结果交给AI与工程，工程再把新能力做进工作，使用结果反过来改变企业的认识。\n\n## 有些东西可以买，有些认识需要亲历\n\n等工具成熟，可以减少一部分技术选择成本；但哪类客户问题值得处理、员工会怎样使用、错误从哪里来、结果怎样返回，仍需要本企业经历真实任务。\n\n吸收能力研究指出，已有相关知识影响识别和应用外部知识。[原始研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf) 企业连续观察一条服务链后，能区分资料缺失、判断错误与执行受限，下次面对新模型就更容易判断它解决哪一段。没有这些认识，模型再强，也可能继续用演示代替采用。\n\n现在开始的价值，首先在于形成这种相关学习，而不在于最早买齐一套系统。\n\n## 等待与抢跑，都需要说明理由\n\n烘焙连锁可以先连起售罄、排产和真实结果，暂缓全网自动化。这些业务认识即使以后换模型或供应商，仍有用途。反之，尚未证实需求就为所有门店固化配额，可能把错误假设扩大。\n\n| 当下条件 | 更有理由的投入 |\n|---|---|\n| 价值方向清楚，现场事实分散 | 先建立小范围完整采用与反馈 |\n| 现成方法已经可用 | 直接采用，并保留本企业比较依据 |\n| 客户价值尚不明确 | 先查需求和替代，不急于大规模建系统 |\n| 新能力打开了原来做不到的工作 | 在有限范围试出新交付与资源要求 |\n\n这使“积极转型”成为可执行选择，而不是所有项目都加速。对变化中的资源和方法持续重组，是动态能力研究关心的问题。[原始研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)\n\n## 为什么需要连续工程力量\n\n一项现场发现只有进入实际工作，才能继续接受挑战。发现复访原因却无人改派工，认识就停在讨论；改了系统却不接回恢复与复发，又不知道是否有效。\n\nFDE可以承担连续往返，把发现做成原型、工具和运行安排，再按采用结果修订。企业内部负责人则持续判断客户价值和资源取舍。培训提供理解，系统提供当时能力，之后仍要有人推进这种变化。\n\n连续性不要求同一家外部团队永久驻场。关键经验、评价材料、工具含义和内部接续要留下，使企业能够更换技术、调整合作，也能在新问题出现时迅速再动起来。\n\n一家正在形成自身AI能力的企业，既使用当前可行方法，也保留挑战旧方法的空间。它的方向可以稳定，答案却要在生产和学习中不断长出来。\n","text":"# 第4章｜路线还没有定下来，企业为什么需要开始\n\n设备服务企业刚把工单整理好，接任技术员就遇到新版本；团队开始追复访，又发现有些重复上门来自备件和派工；客户希望更少停机，原来的按次维修合同也可能需要调整。新问题在采用中出现，很难靠第一次需求会议写出全部终稿。\n\n本课的设备售后案例因此把转型看成双向靠近：企业把真实事实、约束和结 ，资源协调也需要正式安排。它们共同使方法在组织里发生作用。\n\n## 能力怎样连接到生意\n\n接住方法以后，还要看客户是否少等待、少重复停机，企业能否以可持续成本交付。服务商少跑一趟可能减少外协支出；客户少停机可能影响续约；两者相关，却不是同一笔收益。\n\n有些能力只是达到行业应有水准，有些组合才使客户持续选择。积累不必每次都成为壁垒，但应知道自己已经走到哪一层。\n\n对这家服务企业，第一项有意义的沉淀可能很具体：接任者不会再把相似症状当成同一原因，也不会带着不完整材料反复跑现场。这样的变化，比资料库变大更接近企业真正获得了能力。\n","html":"\u003ch1>第5章｜老师傅做对一次，企业怎样获得下一次的能力\u003c/h1>\n\u003cp>“调整后恢复”看起来已经是一条经验。但在\u003ca href=\"#case-c\">设备售后案例\u003c/a>里，实际发生的是调整并重启、没有换件，设备版本和运行条件还会影响判断。如果系统只留下六个字，新人得到的是答案的外壳。\u003c/p>\n\u003cp>管理者要积累的，是人在什么条件下看见什么、据此怎样行动，以及组织如何把行动完成。事件、解释、方法、组织能力与竞争优势之间，分别有不同工作。\u003c/p>\n\u003ch2 id=\"lesson-05-section-1\">从事实到可以检验的解释\u003c/h2>\n\u003cp>先保留真实经过：哪台设备、何时报告、版本是什么、做过哪些动作、观察到什么结果。AI把它整理清楚，能减少后来重新追问的负担。\u003c/p>\n\u003cp>“某项调整使设备恢复”则是解释。M1同时调整和重启，尚不能分辨各自作用；M3涉及另一版本，M4只记录重启也恢复。解释可以提示下一次问什么，但需要新的观察来区分原因。\u003c/p>\n\u003cp>这里保留未知是为了指导动作。例如下一次先补完整操作和运行条件，比把一句“经验有效”写得更坚定更有帮助。\u003c/p>\n\u003ch2 id=\"lesson-05-section-2\">方法比结论多了什么\u003c/h2>\n\u003cp>老师傅的方法可能包括：先核对版本，辨认客户说的是间歇还是持续问题，查上次真实动作，再决定远程核对、专业支持或上门准备。它有输入、条件和停止点，也允许新情况改变原判断。\u003c/p>\n\u003cp>技术原因尚未完全明确时，企业仍能采用已清楚的工作方法：记录完整动作、准备合适配套、把复发接回同一设备。这些改进能够减少无效沟通，为进一步认识原因创造条件。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTcwIiB2aWV3Qm94PSIwIDAgMzYwIDU3MCIgcm9sZT0iaW1nIj48dGl0bGU+5q+P5LiA5bGC6YO95aSa5LiA6aG55p2h5Lu2PC90aXRsZT48ZGVzYz7kuovku7bjgIHop6Pph4rjgIHmlrnms5XjgIHnu4Tnu4fog73lipvkuI7kvJjlir/kuYvpl7TpnIDopoHkuI3lkIzmnaHku7bvvIzkuI3mmK/mlbDph4/oh6rliqjlop7plb/jgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0 来重新追问的负担。\n\n“某项调整使设备恢复”则是解释。M1同时调整和重启，尚不能分辨各自作用；M3涉及另一版本，M4只记录重启也恢复。解释可以提示下一次问什么，但需要新的观察来区分原因。\n\n这里保留未知是为了指导动作。例如下一次先补完整操作和运行条件，比把一句“经验有效”写得更坚定更有帮助。\n\n## 方法比结论多了什么\n\n老师傅的方法可能包括：先核对版本，辨认客户说的是间歇还是持续问题，查上次真实动作，再决定远程核对、专业支持或上门准备。它有输入、条件和停止点，也允许新情况改变原判断。\n\n技术原因尚未完全明确时，企业仍能采用已清楚的工作方法：记录完整动作、准备合适配套、把复发接回同一设备。这些改进能够减少无效沟通，为进一步认识原因创造条件。\n\n![真实事件要经过解释、适用检验、组织采用与客户选择，才可能发展为竞争优势；每一层都需要额外条件。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTcwIiB2aWV3Qm94PSIwIDAgMzYwIDU3MCIgcm9sZT0iaW1nIj48dGl0bGU+5q+P5LiA5bGC6YO95aSa5LiA6aG55p2h5Lu2PC90aXRsZT48ZGVzYz7kuovku7bjgIHop6Pph4rjgIHmlrnms5XjgIHnu4Tnu4fog73lipvkuI7kvJjlir/kuYvpl7TpnIDopoHkuI3lkIzmnaHku7bvvIzkuI3mmK/mlbDph4/oh6rliqjlop7plb/jgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjU3MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7mr4/kuIDlsYLpg73lpJrkuIDpobnmnaHku7Y8L3RleHQ+PHBhdGggZD0iTTU0IDEzMkw1NCAxNjciIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzE2NWQ1MiIgc3Ryb2tlLXdpZHRoPSIyIiBtYXJrZXItZW5kPSJ1cmwoI2Fycm93KSIvPjxwYXRoIGQ9Ik01NCAyMjhMNTQgMjYzIiBmaWxsPSJub25lIiBzdHJva2U9IiMxNjVkNTIiIHN0cm9rZS13aWR0aD0iMiIgbWFya2VyLWVuZD0idXJsKCNhcnJvdykiLz48cGF0aCBkPSJNNTQgMzI0TDU0IDM1OSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMTY1ZDUyIiBzdHJva2Utd2lkdGg9IjIiIG1hcmtlci1lbmQ9InVybCgjYXJyb3cpIi8+PHBhdGggZD0iTTU0IDQyMEw1NCA0NTUiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzE2NWQ1MiIgc3Ryb2tlLXdpZHRoPSIyIiBtY n知识研究强调个人实践、表达与共同使用之间的转换。[原始研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf) 一份文档可以提供线索，熟练技能可能仍需带教，资源协调也需要正式安排。它们共同使方法在组织里发生作用。\n\n## 能力怎样连接到生意\n\n接住方法以后，还要看客户是否少等待、少重复停机，企业能否以可持续成本交付。服务商少跑一趟可能减少外协支出；客户少停机可能影响续约；两者相关，却不是同一笔收益。\n\n有些能力只是达到行业应有水准，有些组合才使客户持续选择。积累不必每次都成为壁垒，但应知道自己已经走到哪一层。\n\n对这家服务企业，第一项有意义的沉淀可能很具体：接任者不会再把相似症状当成同一原因，也不会带着不完整材料反复跑现场。这样的变化，比资料库变大更接近企业真正获得了能力。\n","exportSingleMd":"# 第5章｜老师傅做对一次，企业怎样获得下一次的能力\n\n“调整后恢复”看起来已经是一条经验。但在[设备售后案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-c)里，实际发生的是调整并重启、没有换件，设备版本和运行条件还会影响判断。如果系统只留下六个字，新人得到的是答案的外壳。\n\n管理者要积累的，是人在什么条件下看见什么、据此怎样行动，以及组织如何把行动完成。事件、解释、方法、组织能力与竞争优势之间，分别有不同工作。\n\n## 从事实到可以检验的解释\n\n先保留真实经过：哪台设备、何时报告、版本是什么、做过哪些动作、观察到什么结果。AI把它整理清楚，能减少后来重新追问的负担。\n\n“某项调整使设备恢复”则是解释。M1同时调整和重启，尚不能分辨各自作用；M3涉及另一版本，M4只记录重启也恢复。解释可以提示下一次问什么，但需要新的观察来区分原因。\n\n这里保留未知是为了指导动作。例如下一次先补完整操作和运行条件，比把一句“经验有效”写得更坚定更有帮助。\n\n## 方法比结论多了什么\n\n老师傅的方法可能包括：先核对版本，辨认客户说的是间歇还是持续问题，查上次真实动作，再决定远程核对、专业支持或上门准备。它有输入、条件和停止点，也允许新情况改变原判断。\n\n技术原因尚未完全明确时，企业仍能采用已清楚的工作方法：记录完整动作、准备合适配套、把复发接回同一设备。这些改进能够减少无效沟通，为进一步认识原因创造条件。\n\n![真实事件要经过解释、适用检验、组织采用与客户选择，才可能发展为竞争优势；每一层都需要额外条件。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTcwIiB2aWV3Qm94PSIwIDAgMzYwIDU3MCIgcm9sZT0iaW1nIj48dGl0bGU+5q+P5LiA5bGC6YO95aSa5LiA6aG55p2h5Lu2PC90aXRsZT48ZGVzYz7kuovku7bjgIHop6Pph4rjgIHmlrnms5XjgIHnu4Tnu4fog73lipvkuI7kvJjlir/kuYvpl7TpnIDopoHkuI3lkIzmnaHku7bvvIzkuI3mmK/mlbDph4/oh6rliqjlop7plb/jgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0 怎样连接到生意\n\n接住方法以后，还要看客户是否少等待、少重复停机，企业能否以可持续成本交付。服务商少跑一趟可能减少外协支出；客户少停机可能影响续约；两者相关，却不是同一笔收益。\n\n有些能力只是达到行业应有水准，有些组合才使客户持续选择。积累不必每次都成为壁垒，但应知道自己已经走到哪一层。\n\n对这家服务企业，第一项有意义的沉淀可能很具体：接任者不会再把相似症状当成同一原因，也不会带着不完整材料反复跑现场。这样的变化，比资料库变大更接近企业真正获得了能力。\n"},{"file":"06-人的衔接损耗.md","id":"lesson-06","number":6,"role":"核心课","part":1,"title":"第6章｜消息传到了，客户要求为什么仍会在交接中消失","md":"# 第6章｜消息传到了，客户要求为什么仍会在交接中消失\n\n“三天内需要替代品”，销售转给工程时变成“客户很急”；工程转给采购时变成“查一个能替代的型号”。采购找到技术条件相符的货源，十天能到，大家又回头补问。\n\n在[工业品报价案例](案例B-智能资源成本.md)里，没有人故意删掉客户要求。每个岗位都为自己的任务压缩材料，期限却在几次转述中失去了约束下一步的地位。\n\n## 局部完成，怎样变成整体返工\n\n销售希望推进询价，工程需要判断能不能用，采购需要确认买不买得到。同一笔业务在不同岗位有不同重心。如果没有共同保存用途、期限、已知条件和缺项，下一岗位会按自己熟悉的问题作答。\n\n结果可能是方案技术上可用，交付却来不及；也可能报价很快，成本、适配或实际库存没查清。团队多次重新解释，客户采购窗口却不会因内部补问暂停。\n\n![客户原话包含三天期限和替代目标，转述压成“客户很急”；把原始条件关联到方案和采购，才能让期限继续约束报价。](assets/06-交接中的丢失.svg)\n\n## 传更多消息，为什么还不够\n\n把所有聊天发给每个人，会增加阅读负担。只加一个“请注意交期”的提示，又可能仍没说清承诺的是什么、哪个版本有效。\n\n有用的改法是围绕同一笔询价组织材料：原客户要求保留，工程说明适配依据，采购返回当前供货与成本，新的数量或期限进入当前版本。AI可以比较不同材料中的冲突，提示某个候选满足性能却不满足期限；相关人员据此补事实或改变方案。\n\n它不是把“三天”这个词复制三遍，而是让下一项决定始终能看见这个条件。FDE需要把这种连接做进原来的工作入口。\n\n## 有些等待，应由管理选择解决\n\n如果原话都在，工程师仍无时间处理，问题主要在专业容量；如果各岗位知道客户期限，却争论谁承担加急成本，问题在权力和目标。信息连接能使这些矛盾可见，资源取舍还需要负责人作出。\n\n多任务激励研究解释了人员为何优先关注被评价的工作。[原始研究](https://web.stanford.edu/~milgrom/publishedarticles/Multitask%20Principal%20Agent.pdf) 只考核报价份数，可能鼓励先发一个版本；只考核采购低价，可能忽略客户时效。AI如果只加快各岗位原来的动作，也会加快这些偏离。\n\n## 一笔业务可以怎样追查\n\n从客户最初要求追到正式报价，逐次看谁取得了什么、保留了什么、下一岗位缺了什么，以及最终怎样补回。先分辨事实没被观察、事实没到决定处，还是资源与目标冲突。\n\n这样得到的改造会不同：有时只需让原件与当前任务关联，有时需要改确认与版本，有时要安排专业时间。判断交接有没有改善，应看少了哪些重复解释、可履约方案是否更早形成，客户要求是否完整到达实际动作。\n","html":"\u003ch1>第6章｜消息传到了，客户要求为什么仍会在交接中消失\u003c/h1>\n\u003cp>“三天内需要替代品”，销售转给工程时变成“客户很急”；工程转给采购时变成“查一个能替代的型号”。采购找到技术条件相符的货源，十天能到，大家又回头补问。\u003c/p>\n\u003cp>在\u003ca href=\"#case-b\">工业品报价案例\u003c/a>里，没有人故意删掉客户要求。每个岗位都为自己的任务压缩材料，期限却在几次转述中失去了约束下一步的地位。\u003c/p>\n\u003ch2 id=\"lesson-06-section-1\">局部完成，怎样变成整体返工\u003c/h2>\n\u003cp>销售希望推进询价，工程需要判断能不能用，采购需要确认买不买得到。同一笔业务在不同岗位有不同重心。如果没有共同保存用途、期限、已知条件和缺项，下一岗位会按自己熟悉的问题作答。\u003c/p>\n\u003cp>结果可能是方案技术上可用，交付却来不及；也 给每个人，会增加阅读负担。只加一个“请注意交期”的提示，又可能仍没说清承诺的是什么、哪个版本有效。\n\n有用的改法是围绕同一笔询价组织材料：原客户要求保留，工程说明适配依据，采购返回当前供货与成本，新的数量或期限进入当前版本。AI可以比较不同材料中的冲突，提示某个候选满足性能却不满足期限；相关人员据此补事实或改变方案。\n\n它不是把“三天”这个词复制三遍，而是让下一项决定始终能看见这个条件。FDE需要把这种连接做进原来的工作入口。\n\n## 有些等待，应由管理选择解决\n\n如果原话都在，工程师仍无时间处理，问题主要在专业容量；如果各岗位知道客户期限，却争论谁承担加急成本，问题在权力和目标。信息连接能使这些矛盾可见，资源取舍还需要负责人作出。\n\n多任务激励研究解释了人员为何优先关注被评价的工作。[原始研究](https://web.stanford.edu/~milgrom/publishedarticles/Multitask%20Principal%20Agent.pdf) 只考核报价份数，可能鼓励先发一个版本；只考核采购低价，可能忽略客户时效。AI如果只加快各岗位原来的动作，也会加快这些偏离。\n\n## 一笔业务可以怎样追查\n\n从客户最初要求追到正式报价，逐次看谁取得了什么、保留了什么、下一岗位缺了什么，以及最终怎样补回。先分辨事实没被观察、事实没到决定处，还是资源与目标冲突。\n\n这样得到的改造会不同：有时只需让原件与当前任务关联，有时需要改确认与版本，有时要安排专业时间。判断交接有没有改善，应看少了哪些重复解释、可履约方案是否更早形成，客户要求是否完整到达实际动作。\n","exportSingleMd":"# 第6章｜消息传到了，客户要求为什么仍会在交接中消失\n\n“三天内需要替代品”，销售转给工程时变成“客户很急”；工程转给采购时变成“查一个能替代的型号”。采购找到技术条件相符的货源，十天能到，大家又回头补问。\n\n在[工业品报价案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-b)里，没有人故意删掉客户要求。每个岗位都为自己的任务压缩材料，期限却在几次转述中失去了约束下一步的地位。\n\n## 局部完成，怎样变成整体返工\n\n销售希望推进询价，工程需要判断能不能用，采购需要确认买不买得到。同一笔业务在不同岗位有不同重心。如果没有共同保存用途、期限、已知条件和缺项，下一岗位会按自己熟悉的问题作答。\n\n结果可能是方案技术上可用，交付却来不及；也可能报价很快，成本、适配或实际库存没查清。团队多次重新解释，客户采购窗口却不会因内部补问暂停。\n\n![客户原话包含三天期限和替代目标，转述压成“客户很急”；把原始条件关联到方案和采购，才能让期限继续约束报价。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTIwIiB2aWV3Qm94PSIwIDAgMzYwIDUyMCIgcm9sZT0iaW1nIj48dGl0bGU+5Lqk5o6l5Lit5Lii5o6J55qE5piv5p2h5Lu2PC90aXRsZT48ZGVzYz7lrqLmiLfljp/ku7bljIXlkKvkuInlpKnmnJ/pmZDjgIHnhafniYflm77nurjkuI7lvoXmoLjlt6XlhrXvvIzovazov7Dlj6rlianlrqLmiLflvojmgKXvvJvljp/mnZDmlpnlhbPogZTliLDpgInlnovmiqXku7fvvIzooaXlm57lhrPlrprmnaHku7bjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwx :"# 第6章｜消息传到了，客户要求为什么仍会在交接中消失\n\n“三天内需要替代品”，销售转给工程时变成“客户很急”；工程转给采购时变成“查一个能替代的型号”。采购找到技术条件相符的货源，十天能到，大家又回头补问。\n\n在工业品报价案例里，没有人故意删掉客户要求。每个岗位都为自己的任务压缩材料，期限却在几次转述中失去了约束下一步的地位。\n\n## 局部完成，怎样变成整体返工\n\n销售希望推进询价，工程需要判断能不能用，采购需要确认买不买得到。同一笔业务在不同岗位有不同重心。如果没有共同保存用途、期限、已知条件和缺项，下一岗位会按自己熟悉的问题作答。\n\n结果可能是方案技术上可用，交付却来不及；也可能报价很快，成本、适配或实际库存没查清。团队多次重新解释，客户采购窗口却不会因内部补问暂停。\n\n \n\n## 传更多消息，为什么还不够\n\n把所有聊天发给每个人，会增加阅读负担。只加一个“请注意交期”的提示，又可能仍没说清承诺的是什么、哪个版本有效。\n\n有用的改法是围绕同一笔询价组织材料：原客户要求保留，工程说明适配依据，采购返回当前供货与成本，新的数量或期限进入当前版本。AI可以比较不同材料中的冲突，提示某个候选满足性能却不满足期限；相关人员据此补事实或改变方案。\n\n它不是把“三天”这个词复制三遍，而是让下一项决定始终能看见这个条件。FDE需要把这种连接做进原来的工作入口。\n\n## 有些等待，应由管理选择解决\n\n如果原话都在，工程师仍无时间处理，问题主要在专业容量；如果各岗位知道客户期限，却争论谁承担加急成本，问题在权力和目标。信息连接能使这些矛盾可见，资源取舍还需要负责人作出。\n\n多任务激励研究解释了人员为何优先关注被评价的工作。原始研究 只考核报价份数，可能鼓励先发一个版本；只考核采购低价，可能忽略客户时效。AI如果只加快各岗位原来的动作，也会加快这些偏离。\n\n## 一笔业务可以怎样追查\n\n从客户最初要求追到正式报价，逐次看谁取得了什么、保留了什么、下一岗位缺了什么，以及最终怎样补回。先分辨事实没被观察、事实没到决定处，还是资源与目标冲突。\n\n这样得到的改造会不同：有时只需让原件与当前任务关联，有时需要改确认与版本，有时要安排专业时间。判断交接有没有改善，应看少了哪些重复解释、可履约方案是否更早形成，客户要求是否完整到达实际动作。\n"},{"file":"07-生产中的采集.md","id":"lesson-07","number":7,"role":"核心课","part":1,"title":"第7章｜一笔报价怎样同时完成交付，并留下下一次能用的经验","md":"# 第7章｜一笔报价怎样同时完成交付，并留下下一次能用的经验\n\n工业品经销商希望整理“成功报价案例”，通常要到月底翻客户资料、问销售、请工程师回忆。最后容易留下的是成交故事，客户改过什么、哪些方案被否决、为什么最终能交付，反而散在各处。\n\n如果这些材料在报价发生时就对应起来，经验整理的工作会不同。AI化降低门槛的机会，主要在这里。\n\n## 当前业务已经产生了哪些材料\n\n沿用[报价案例](案例B-智能资源成本.md)：客户给三天期限，现货候选缺工况依据，另一个候选要十天供货，适配方案还需工程与供应商确认。销售和工程在推进中不断取得事实，修改草稿，最后形成正式版本。\n\n这些材料本来就为当前生产服务。把它们关联到同一笔询价，能让模型先整理原要求、候选、否决理由和当前结果，再请当事人纠正关键差别。相比事后从空白写一篇文章，人员少了重新寻找和组织的部分劳动。\n\n![询价原件进入报价与交付，人员修订和结果与原件汇合形成候选经验；后续任务再检验适用性。](assets/07-生产与积累.svg)\n\n对象和时间对应通常依赖业务系统，AI更适合处理非标准表达、比较冲突与整理理由。两类能力配合，才使自然材料进入可再用认识。\n\n## 留下的不只是最终报价\n\n假如只保留最后选中的型号，新人可能以为下次同类客户也用它。把过程留下，会看到这次选择同时依赖期限、工况、价格与供应承诺。\n\n| 当前材料 | 对下一次工作有什么用 |\n|---|---|\n| 原客户要求与补充 | 识别真正限制方案的条件 |\n| 被否决的候选及理由 | 少走已知不通的路线，理解取舍 |\n| 人员对AI草稿的纠正 | 暴露未来容易重复的错误 |\n| 正式报价与实际交付 | 检查承诺是否被履行 |\n| 成交、未成交与后续问题 | 重新判断客户价值与方法适用性 |\n\n某个方案因十天货期被否决，是这次选择的理由；它不意味着这个型号永远不该推荐。记录要把时间与条件留下，而不是把一次否决变成永久规则。\n\n## 工作经验怎样在使用中继续长出来\n\n下一笔相似询价到来，AI带回相关材料，指出当前期限、库存或工况不同。人员采用或修改，新的结果再返回。多次往返后，企业可能形成“哪类要求先核什么、什么条件值得比较适配”的方法。\n\n这既包括保存已有经验，也包括生成新的know-how。AI提出过去没被一起讨论的关系，专业人员与现场事实区分它是否成立，FDE把可用安排接进工作。[知识形成](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)、[工程组织](https://www.anthropic.com/research/building-effective-agents)\n\n## 积累成本要在整项工作中比较\n\n新增核对、追踪客户结果和维护都要花资源；减少的则是事后翻找、重复询问和重新解释。若专家仍要逐篇重写，自动生成再多也没有降低多少负担。\n\n比较应问：同一项交付，额外记录是否可承受；下一位使用者是否少做了重复准备；条件变化时是否会用错。一次成交已经有当期价值，而它是否还形成了可用资产，要在下一次工作中见到作用。\n\n这家企业不必先把全部经验写成SOP。先让关键选择留下依据，让后续工作能接着认识，积累便开始从月底的额外任务进入日常生产。\n","html":"\u003ch1>第7章｜一笔报价怎样同时完成交付，并留下下一次能用的经验\u003c/h1>\n\u003cp>工业品经销商希望整理“成功报价案例”，通常要到月底翻客户资料、问销售、请工程师回忆。最后容易留下的是成交故事，客户改过什么、哪些方案被否决、为什么最终能交付，反而散在各处。\u003c/p>\n\u003cp>如果这些材料在报价发生时就对应起来，经验整理的工作会不同。AI化降低门槛的机会，主要在这里。\u003c/p>\n\u003ch2 id=\"lesson-07-section-1\">当前业务已经产生了哪些材料\u003c/h2>\n\u003cp>沿用\u003ca href=\"#case-b\">报价案例\u003c/a>：客户给三天期限，现货候选缺工况依据，另一个候选要十天供货，适配方案还需工程与供应商确认。销售和工程在推进中不断取得事实，修改草稿，最后形成正式版本。\u003c/p>\n\u003cp>这些材料本来就为当前生产服务。把它们关联到同一笔询价，能让模型先整理原要求、候选、否决理由和当前结果，再请当事人纠正关键差别。相比事后从空白写一篇文章，人员少了重新寻找和组织的部分劳动。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNjUwIiB2aWV3Qm94PSIwIDAgMzYwIDY1MCIgcm9sZT0iaW1nIj48dGl0bGU+5LuO55Sf5Lqn5Lit55WZ5LiL5Y+v55So5p2Q5paZPC90aXRsZT48ZGVzYz7ljp/lp4vor6Lku7fov5vlhaXmiqXku7fkuI7kuqTku5jvvIzkurrlkZjkv67orqLov57lkIzljp/ku7blkoznu5PmnpzlvaLmiJDlgJnpgInnu4/pqozvvIzlho3nlLHlkI7nu63or6Lku7fmo4DpqozjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0a 务系统，AI更适合处理非标准表达、比较冲突与整理理由。两类能力配合，才使自然材料进入可再用认识。\u003c/p>\n\u003ch2 id=\"lesson-07-section-2\">留下的不只是最终报价\u003c/h2>\n\u003cp>假如只保留最后选中的型号，新人可能以为下次同类客户也用它。把过程留下，会看到这次选择同时依赖期限、工况、价格与供应承诺。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>当前材料\u003c/th>\n\u003cth>对下一次工作有什么用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>原客户要求与补充\u003c/td>\n\u003ctd>识别真正限制方案的条件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>被否决的候选及理由\u003c/td>\n\u003ctd>少走已知不通的路线，理解取舍\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>人员对AI草稿的纠正\u003c/td>\n\u003ctd>暴露未来容易重复的错误\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>正式报价与实际交付\u003c/td>\n\u003ctd>检查承诺是否被履行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>成交、未成交与后续问题\u003c/td>\n\u003ctd>重新判断客户价值与方法适用性\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>某个方案因十天货期被否决，是这次选择的理由；它不意味着这个型号永远不该推荐。记录要把时间与条件留下，而不是把一次否决变成永久规则。\u003c/p>\n\u003ch2 id=\"lesson-07-section-3\">工作经验怎样在使用中继续长出来\u003c/h2>\n\u003cp>下一笔相似询价到来，AI带回相关材料，指出当前期限、库存或工况不同。人员采用或修改，新的结果再返回。多次往返后，企业可能形成“哪类要求先核什么、什么条件值得比较适配”的方法。\u003c/p>\n\u003cp>这既包括保存已有经验，也包括生成新的know-how。AI提出过去没被一起讨论的关系，专业人员与现场事实区分它是否成立，FDE把可用安排接进工作。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">知识形成\u003c/a>、\u003ca href=\"https://www.anthropic.com/research/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">工程组织\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-07-section-4\">积累成本要在整项工作中比较\u003c/h2>\n\u003cp>新增核对、追踪客户结果和维护都要花资源；减少的则是事后翻找、重复询问和重新解释。若专家仍要逐篇重写，自动生成再多也没有降低多少负担。\u003c/p>\n\u003cp>比较应问：同一项交付，额外记录是否可承受；下一位使用者是否少做了重复准备；条件变化时是否会用错。一次成交已经有当期价值，而它是否还形成了可用资产，要在下一次工作中见到作用。\u003c/p>\n\u003cp>这家企业不必先把全部经验写成SOP。先让关键选择留下依据，让后续工作能接着认识，积累便开始从月底的额外任务进入日常生产。\u003c/p>\n","headings":[{"id":"lesson-07-section-1","label":"当前业务已经产生了哪些材料"},{"id":"lesson-07-section-2","label":"留下的不只是最终报价"},{"id":"lesson-07-section-3","label":"工作经验怎样在使用中继续长出来"},{"id":"lesson-07-section-4","label":"积累成本要在整项工作中比较"}],"exportMd":"# 第7章｜一笔报价怎样同时完成交付，并留下下一次能用的经验\n\n工业品经销商希望整理“成功报价案例”，通常要到月底翻客户资料、问销售、请工程师回忆。最后容易留下的是成交故事，客户改过什么、哪些方案被否决、为什么最终能交付，反而散在各处。\n\n如果这些材料在报价发生时就对应起来，经验整理的工作会不同。AI化降低门槛的机会，主要在这里。\n\n## 当前业务已经产生了哪些材料\n\n沿用[报价案例](#case-b)：客户给三天期限，现货候选缺工况依据，另一个候选要十天供货，适配方案还需工程与供应商确认。销售和工程在推进中不断取得事实，修改草稿，最后形成正式版本。\n\n这些材料本来就为当前生产服务。把它们关联到同一笔询价，能让模型先整理原要求、候选、否决理由和当前结果，再请当事人纠正关键差别。相比事后从空白写一篇文章，人员少了重新寻找和组织的部分劳动。\n\n![询价原件进入报价与交付，人员修订和结果与原件汇合形成候选经验；后续任务再检验适用性。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNjUwIiB2aWV3Qm94PSIwIDAgMzYwIDY1MCIgcm9sZT0iaW1nIj48dGl0bGU+5LuO55Sf5Lqn5Lit55WZ5LiL5Y+v55So5p2Q5paZPC90aXRsZT48ZGVzYz7ljp/lp4vor6Lku7fov5vlhaXmiqXku7fkuI7kuqTku5jvvIzkurrlkZjkv67orqLov57lkIzljp/ku7blkoznu5PmnpzlvaLmiJDlgJnpgInnu4/pqozvvIzlho3nlLHlkI7nu63or6Lku7fmo4DpqozjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjY1MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7ku47nlJ/kuqfkuK3nlZnkuIvlj6/nlKjmnZDmlpk8L3RleHQ+PHBhdGggZD0iTTEwOCA3OEgyMzZMMjUyIDk0VjE0NEgxMDhaIiBmaWxsPSJ3aGl0ZSIgc3Ryb2tlPSIjNjA3MzZjIiBzdHJva2Utd2lkdGg9IjEuNSIvPjxwYXRoIGQ9Ik0yMzYgNzhWOTRIMjUyIiBmaWxsPSJub25lIiBzdHJva2U9IiM2MDczNmMiIHN0cm9rZS13aWR0aD0iMS41Ii8+PHRleHQgeD0iMTgwLjAiIHk9IjExNy4wIiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhS thropic.com/research/building-effective-agents)\n\n## 积累成本要在整项工作中比较\n\n新增核对、追踪客户结果和维护都要花资源；减少的则是事后翻找、重复询问和重新解释。若专家仍要逐篇重写，自动生成再多也没有降低多少负担。\n\n比较应问：同一项交付，额外记录是否可承受；下一位使用者是否少做了重复准备；条件变化时是否会用错。一次成交已经有当期价值，而它是否还形成了可用资产，要在下一次工作中见到作用。\n\n这家企业不必先把全部经验写成SOP。先让关键选择留下依据，让后续工作能接着认识，积累便开始从月底的额外任务进入日常生产。\n","exportSingleMd":"# 第7章｜一笔报价怎样同时完成交付，并留下下一次能用的经验\n\n工业品经销商希望整理“成功报价案例”，通常要到月底翻客户资料、问销售、请工程师回忆。最后容易留下的是成交故事，客户改过什么、哪些方案被否决、为什么最终能交付，反而散在各处。\n\n如果这些材料在报价发生时就对应起来，经验整理的工作会不同。AI化降低门槛的机会，主要在这里。\n\n## 当前业务已经产生了哪些材料\n\n沿用[报价案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-b)：客户给三天期限，现货候选缺工况依据，另一个候选要十天供货，适配方案还需工程与供应商确认。销售和工程在推进中不断取得事实，修改草稿，最后形成正式版本。\n\n这些材料本来就为当前生产服务。把它们关联到同一笔询价，能让模型先整理原要求、候选、否决理由和当前结果，再请当事人纠正关键差别。相比事后从空白写一篇文章，人员少了重新寻找和组织的部分劳动。\n\n![询价原件进入报价与交付，人员修订和结果与原件汇合形成候选经验；后续任务再检验适用性。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNjUwIiB2aWV3Qm94PSIwIDAgMzYwIDY1MCIgcm9sZT0iaW1nIj48dGl0bGU+5LuO55Sf5Lqn5Lit55WZ5LiL5Y+v55So5p2Q5paZPC90aXRsZT48ZGVzYz7ljp/lp4vor6Lku7fov5vlhaXmiqXku7fkuI7kuqTku5jvvIzkurrlkZjkv67orqLov57lkIzljp/ku7blkoznu5PmnpzlvaLmiJDlgJnpgInnu4/pqozvvIzlho3nlLHlkI7nu63or6Lku7fmo4DpqozjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjY1MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7ku47nlJ/kuqfkuK3nlZnkuIvlj6/nlKjmnZDmlpk8L3RleHQ+PHBhdGggZD0iTTEwOCA3OEgyMzZMMjUyIDk0VjE0NEgxMDhaIiB 次往返后，企业可能形成“哪类要求先核什么、什么条件值得比较适配”的方法。\n\n这既包括保存已有经验，也包括生成新的know-how。AI提出过去没被一起讨论的关系，专业人员与现场事实区分它是否成立，FDE把可用安排接进工作。[知识形成](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)、[工程组织](https://www.anthropic.com/research/building-effective-agents)\n\n## 积累成本要在整项工作中比较\n\n新增核对、追踪客户结果和维护都要花资源；减少的则是事后翻找、重复询问和重新解释。若专家仍要逐篇重写，自动生成再多也没有降低多少负担。\n\n比较应问：同一项交付，额外记录是否可承受；下一位使用者是否少做了重复准备；条件变化时是否会用错。一次成交已经有当期价值，而它是否还形成了可用资产，要在下一次工作中见到作用。\n\n这家企业不必先把全部经验写成SOP。先让关键选择留下依据，让后续工作能接着认识，积累便开始从月底的额外任务进入日常生产。\n","text":"# 第7章｜一笔报价怎样同时完成交付，并留下下一次能用的经验\n\n工业品经销商希望整理“成功报价案例”，通常要到月底翻客户资料、问销售、请工程师回忆。最后容易留下的是成交故事，客户改过什么、哪些方案被否决、为什么最终能交付，反而散在各处。\n\n如果这些材料在报价发生时就对应起来，经验整理的工作会不同。AI化降低门槛的机会，主要在这里。\n\n## 当前业务已经产生了哪些材料\n\n沿用报价案例：客户给三天期限，现货候选缺工况依据，另一个候选要十天供货，适配方案还需工程与供应商确认。销售和工程在推进中不断取得事实，修改草稿，最后形成正式版本。\n\n这些材料本来就为当前生产服务。把它们关联到同一笔询价，能让模型先整理原要求、候选、否决理由和当前结果，再请当事人纠正关键差别。相比事后从空白写一篇文章，人员少了重新寻找和组织的部分劳动。\n\n \n\n对象和时间对应通常依赖业务系统，AI更适合处理非标准表达、比较冲突与整理理由。两类能力配合，才使自然材料进入可再用认识。\n\n## 留下的不只是最终报价\n\n假如只保留最后选中的型号，新人可能以为下次同类客户也用它。把过程留下，会看到这次选择同时依赖期限、工况、价格与供应承诺。\n\n| 当前材料 | 对下一次工作有什么用 |\n|---|---|\n| 原客户要求与补充 | 识别真正限制方案的条件 |\n| 被否决的候选及理由 | 少走已知不通的路线，理解取舍 |\n| 人员对AI草稿的纠正 | 暴露未来容易重复的错误 |\n| 正式报价与实际交付 | 检查承诺是否被履行 |\n| 成交、未成交与后续问题 | 重新判断客户价值与方法适用性 |\n\n某个方案因十天货期被否决，是这次选择的理由；它不意味着这个型号永远不该推荐。记录要把时间与条件留下，而不是把一次否决变成永久规则。\n\n## 工作经验怎样在使用中继续长出来\n\n下一笔相似询价到来，AI带回相关材料，指出当前期限、库存或工况不同。人员采用或修改，新的结果再返回。多次往返后，企业可能形成“哪类要求先核什么、什么条件值得比较适配”的方法。\n\n这既包括保存已有经验，也包括生成新的know-how。AI提出过去没被一起讨论的关系，专业人员与现场事实区分它是否成立，FDE把可用安排接进工作。知识形成、工程组织\n\n## 积累成本要在整项工作中比较\n\n新增核对、追踪客户结果和维护都要花资源；减少的则是事后翻找、重复询问和重新解释。若专家仍要逐篇重写，自动生成再多也没有降低多少负担。\n\n比较应问：同一项交付，额外记录是否可承受；下一位使用者是否少做了重复准备；条件变化时是否会用错。一次成交已经有当期价值，而它是否还形成了可用资产，要在下一次工作中见到作用。\n\n这家企业不必先把全部经验写成SOP。先让关键选择留下依据，让后续工作能接着认识，积累便开始从月底的额外任务进入日常生产。\n"},{"file":"08-经验的可信度.md","id":"lesson-08","number":8,"role":"核心课","part":1,"title":"第8章｜经验越整理越像规律，怎样判断它是否真的可靠","md":"# 第8章｜经验越整理越像规律，怎样判断它是否真的可靠\n\n同一种症状，四张工单都写“恢复”。如果把成功结案放在一起，AI很容易组织出一个完整故事。服务负责人需要的却是：下一次按这个故事做，会减少复访，还是把错误重复得更整齐？\n\n## 从四张记录里，究竟能够看见什么\n\n[设备售后案例](案例C-设备售后.md)保留了以下经过，设备代号只用于教学。\n\n| 工单 | 版本与已记录动作 | 结果 |\n|---|---|---|\n| M1 | V1，调整并重启，未换件 | 当次恢复，记录到次日 |\n| M2 | V1，调整并重启 | 当次恢复，记录到次日 |\n| M3 | V2，调整，未记录重启 | 一小时后报告恢复 |\n| M4 | V1，仅记录重启 | 当次恢复，记录到次日 |\n\n只看M1和M2，可以提出“调整可能有用”；看到M4，还需要研究重启、问题类型或运行条件。M3又提醒团队版本与中间经过不同。未记录重启不等于没重启，表格空白不能被整理成一个动作未发生的对照。\n\n这不是要宣布方法无效，而是把能够指导下一步的问题找出来。\n\n## 让不同解释产生不同观察要求\n\n若调整起主要作用，应能在相近条件下看见与其他处置的差别；若负载变化起作用，就要补运行条件；若表面症状其实包含多类问题，先需要更好的分类。\n\nAI可以帮助找缺项、对照失败和成功、提出候选解释。专业人员据此选择可行观察，资源和客户条件决定能做到哪一步。文本上的合理原因要经过外部事实约束，才会逐渐成为可用认识。\n\n## 证据不足时，仍然可以改工作\n\n企业不必等到唯一技术原因被证明，才核对版本、记录完整动作、准备正确配套、追踪复发。这些工作条件已经能解释为什么某些经验无法接任，也帮助下一轮进一步分辨原因。\n\n采用强度可以分开：候选经验用于补问，经过检验的常规方法承担更多工作，新版本与相反事实进入专业支持。对一项方法，写清什么观察会让团队改法，比一句笼统“谨慎使用”更可操作。\n\n## 只留成功，会怎样影响下一次\n\n失败单可能迟迟未关闭，停止联系的客户可能不再反馈，未采用方案的理由也可能被丢掉。经验库于是天然偏向顺利故事。系统还会改变后续所见材料，例如长期少配的门店只留下受限销量。\n\n机器学习系统研究把这种行动与数据相互影响视为重要维护问题。[原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf) 企业应给反例一个正常入口，使新的事实有机会改变旧认识。\n\n一份可接续的经验，可以明确说：目前观察到恢复，几个原因尚未区分，现阶段先用它确定补问与检查，下次补哪些结果。它不如一个确定答案好展示，却让接任者知道团队已经走到哪里，并能继续向前。\n","html":"\u003ch1>第8章｜经验越整理越像规律，怎样判断它是否真的可靠\u003c/h1>\n\u003cp>同一种症状，四张工单都写“恢复”。如果把成功结案放在一起，AI很容易组织出一个完整故事。服务负责人需要的却是：下一次按这个故事做，会减少复访，还是把错误重复得更整齐？\u003c/p>\n\u003ch2 id=\"lesson-08-section-1\">从四张记录里，究竟能够看见什么\u003c/h2>\n\u003cp>\u003ca href=\"#case-c\">设备售后案例\u003c/a>保留了以下经过，设备代号只用于教学。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>工单\u003c/th>\n\u003cth>版本与已记录动作\u003c/th>\n\u003cth>结果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>M1\u003c/td>\n\u003ctd>V1，调整并重启，未换件\u003c/td>\n\u003ctd>当次恢复，记录到次日\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M2\u003c/td>\n\u003ctd>V1，调整并重启\u003c/td>\n\u003ctd>当次恢复，记录到次日\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M3\u003c/td>\n\u003ctd>V2，调整，未记录重启\u003c/td>\n\u003ctd>一小时后报告恢复\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M4\u003c/
