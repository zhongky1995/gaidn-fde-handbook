能力\u003c/td>\n\u003ctd>统一维护，再供各场景接入\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>这些资产可以配合。例如服务方案同时使用产品知识、选型方法、价格计算和客户记录。企业需要知道每一部分在哪里，由谁维护；一项规则改变时，就能找到受影响的使用者。\u003c/p>\n\u003ch2>让资产真正进入日常工作\u003c/h2>\n\u003cp>可以把方法放进新人真正接到任务的地方。新销售打开“整理客户需求”入口时，同时得到字段说明、容易混淆的原话示例和可查询的历史订单；AI应用启动同类任务时，也按任务配置取得这份方法。使用中发现“期望日期”被写错，反馈就回到维护这份方法的负责人。这样，改一次能影响后续同类任务，而不是每个人各自保存一份旧笔记。\u003c/p>\n\u003cp>一份方法说明应写清解决什么问题、需要什么输入、怎样得出结果，以及如何检查。工具组件则说明参数、输出、权限和异常处理。配上有效样例与已知失败，使用者更容易判断何时采用。\u003c/p>\n\u003cp>资产应放在使用者能够找到的入口。AI任务可以按用途读取相应方法，员工可以沿业务问题找到资料，开发者可以查看可调用工具。版本和负责人跟随资产保存，反馈也回到这个位置。\u003c/p>\n\u003cp>每次复用记录实际变化：减少了哪些准备，修改了哪些部分，增加多少维护。由此决定继续完善、保持现状或退役。企业投入的是后续工作能力，维护资源应流向实际有用的部分。\u003c/p>\n\u003ch2>怎样从项目经验形成企业观点\u003c/h2>\n\u003cp>经验经过比较，可以沉淀成解释和判断原则。比如，系统集成总要核对实际角色与平台条件，原因是同一功能在不同账号和版本下可能有不同能力；技术修改后要重做原任务，原因是业务恢复还依赖资料、权限和接手；内容交付要打开最终文件，原因是制作与实际使用经过了不同环节。\u003c/p>\n\u003cp>把原则与其原因一起说明，再提供一套可执行做法，就能帮助团队在新场景作判断。原项目的客户姓名和过程细节可以留在受控记录，方法则以适合共用的形式进入组织知识。\u003c/p>\n\u003cp>这样的观点会随使用继续完善。遇到不同条件，先解释为什么需要改变做法，再更新适用方法。企业的专业理解因此能够积累，也能被讨论和修正。\u003c/p>\n\u003ch2>平台建设应从共用需求中生长\u003c/h2>\n\u003cp>当多个场景反复读取同一客户、维护同样身份和状态，各自实现开始产生重复成本，就可以比较建设共用能力。计算包括一次建设、迁移、持续维护和每个场景的接入，也包括继续分开维护的成本。\u003c/p>\n\u003cp>共用层首先服务已经存在的工作。可以先统一客户标识和权限，再逐步增加任务状态、运行记录等。业务场景保留自己的专业规则，统一部分则由明确负责人维护。这样，平台建设与实际收益之间有可检查的关系。\u003c/p>\n\u003cp>企业可以用下一次项目来评价沉淀：诊断是否更快，关键条件是否更早确认，实现是否减少重复，接手是否更容易。一次改造能改善下一次改造，组织才开始形成持续积累。\u003c/p>\n","text":"# 第26章｜把项目经验变为组织能力资产\n\n**一项改造值得留下两类成果：当前工作得到改善，下一次同类工作也更容易做好。后者来自能够找到、使用和维护的知识、方法与工具。**\n\n企业可以在项目结束时整理经验，更有效的做法是在工作中持续提取：哪份资料经常使用，哪种判断反复出现，哪项检查曾发现关键错误，哪段工具连接值得共用。这样，沉淀对象来自实际需要。\n\n## 从一次修正提取可沿用的方法\n\n设想一份AI生成方案中出现交期错误。沿过程查看，发现它把客户希望的日期当成企业确认日期。团队据此把“期望日期”和“已确认日期”分成两个字段，并要求后者记录确认依据。\n\n这项改动可以成为一套方法：从原话识别日期含义，查询是否已有确认，分别保存状态，再根据状态安排追问或继续处理。用已确认、尚未确认和反复变更几类材料检验，确认方法能支持工作后，供其他相关任务使用。\n\n迁移到采购时，同样可以区分供应商预计到货与已确认到货，但具体确认规则由采购负责人确定。复用的是区分状态、保存依据的办法，专业内容在新任务中重新明确。经验因此既保持价值，也能适应不同业务。\n\n![工作中的错误与修正形成候选方法，经样例检查后进入共用入口。](assets/26.svg)\n\n## 哪种经验保存在哪种资产里\n\n| 重复出现的需要 | 适合积累的资产 | 使用方式 |\n| --- | --- | --- |\n| 需要知道产品、规则或业务事实 | 有版本的知识资料 | 检索并提供给当前任务 |\n| 需要沿同样步骤判断 | 方法说明、范例或Skill | 组织输入、步骤与检查 |\n| 需要稳定计算或执行相同动作 | 程序、接口与工具组件 | 由应用调用并返回结果 |\n| 多个场景共享身份、对象和状态 | 共用系统能力 | 统一维护，再供各场景接入 |\n\n这些资产可以配合。例如服务方案同时使用产品知识、选型方法、价格计算和客户记录。企业需要知道每一部分在哪里，由谁维护；一项规则改变时，就能找到受影响的使用者。\n\n## 让资产真正进入日常工作\n\n可以把方法放进新人真正接到任务的地方。新销售打开“整理客户需求”入口时，同时得到字段说明、容易混淆的原话示例和可查询的历史订单；AI应用启动同类任务时，也按任务配置取得这份方法。使用中发现“期望日期”被写错，反馈就回到维护这份方法的负责人。这样，改一次能影响后续同类任务，而不是每个人各自保存一份旧笔记。\n\n一份方法说明应写清解决什么问题、需要什么输入、怎样得出结果，以及如何检查。工具组件则说明参数、输出、权限和异常处理。配上有效样例与已知失败，使用者更容易判断何时采用。\n\n资产应放在使用者能够找到的入口。AI任务可以按用途读取相应方法，员工可以沿业务问题找到资料，开发者可以查看可调用工具。版本和负责人跟随资产保存，反馈也回到这个位置。\n\n每次复用记录实际变化：减少了哪些准备，修改了哪些部分，增加多少维护。由此决定继续完善、保持现状或退役。企业投入的是后续工作能力，维护资源应流向实际有用的部分。\n\n## 怎样从项目经验形成企业观点\n\n经验经过比较，可以沉淀成解释和判断原则。比如，系统集成总要核对实际角色与平台条件，原因是同一功能在不同账号和版本下可能有不同能力；技术修改后要重做原任务，原因是业务恢复还依赖资料、权限和接手；内容交付要打开最终文件，原因是制作与实际使用经过了不同环节。\n\n把原则与其原因一起说明，再提供一套可执行做法，就能帮助团队在新场景作判断。原项目的客户姓名和过程细节可以留在受控记录，方法则以适合共用的形式进入组织知识。\n\n这样的观点会随使用继续完善。遇到不同条件，先解释为什么需要改变做法，再更新适用方法。企业的专业理解因此能够积累，也能被讨论和修正。\n\n## 平台建设应从共用需求中生长\n\n当多个场景反复读取同一客户、维护同样身份和状态，各自实现开始产生重复成本，就可以比较建设共用能力。计算包括一次建设、迁移、持续维护和每个场景的接入，也包括继续分开维护的成本。\n\n共用层首先服务已经存在的工作。可以先统一客户标识和权限，再逐步增加任务状态、运行记录等。业务场景保留自己的专业规则，统一部分则由明确负责人维护。这样，平台建设与实际收益之间有可检查的关系。\n\n企业可以用下一次项目来评价沉淀：诊断是否更快，关键条件是否更早确认，实现是否减少重复，接手是否更容易。一次改造能改善下一次改造，组织才开始形成持续积累。\n"},{"id":"c27","file":"27-从局部改进走向企业能力与新服务.md","title":"第27章｜从局部改进走向企业能力与新服务","html":"\u003ch1>第27章｜从局部改进走向企业能力与新服务\u003c/h1>\n\u003cp>\u003cstrong>企业AI化有两种相互支持的增长：把已有工作做得更好，以及利用降低的信息处理成本提供新的服务。扩展时，把经营需要与已经形成的能力放在一起考虑。\u003c/strong>\u003c/p>\n\u003cp>一项试点完成后，企业更清楚模型适合处理什么，也积累了一些资料、方法、工具和协作经验。下一项投入可以因此少做一部分准备，但仍要回应当前业务最值得解决的问题。\u003c/p>\n\u003ch2>局部改善以后，限制会移动\u003c/h2>\n\u003cp>材料整理加快，专业确认可能开始排队；确认加快，资源安排可能成为限制；交付稳定以后，企业可能更需要新的客户。这些变化说明原有改善正在改变工作条件，也提示了新的投入方向。\u003c/p>\n\u003cp>可以沿同一项结果持续观察。若目标是缩短客户响应，就继续看从收到需求到形成可用答复的整段时间。若目标是服务更多客户，就看专业人员负荷和履约容量。团队据此判断下一步是改善相邻环节、增加资源，还是转向新的经营问题。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"27\">\u003cpicture>\u003csource media=\"screen 初步分析变便宜后，企业可以考虑提高服务频次，或者把原来只面向重点客户的服务扩展给更多客户。变化发生在服务经济性：专业人员把时间集中在值得判断的异常，信息整理与基础表达由系统承担。\u003c/p>\n\u003cp>新服务还需要一项完整设计。服务对象是谁，客户在什么时刻需要结果，哪些数据可以取得，专业人员在哪一步参与，结果怎样影响客户行动，后续履约需要多少资源，都要放在一起考虑。\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可能的新供给\u003c/th>\n\u003cth>成本下降带来的机会\u003c/th>\n\u003cth>首轮要观察什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>更细分的客户说明\u003c/td>\n\u003ctd>同一套专业知识按不同需求组织\u003c/td>\n\u003ctd>客户是否更容易选择、追问是否更具体\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>更频繁的经营或使用分析\u003c/td>\n\u003ctd>查询、整理和初步分析更容易开展\u003c/td>\n\u003ctd>发现是否及时、是否支持实际行动\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>小范围专属工具\u003c/td>\n\u003ctd>编程和修改成本降低\u003c/td>\n\u003ctd>用户是否持续使用、维护是否可承担\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>专业服务的初步分诊\u003c/td>\n\u003ctd>先整理材料与识别差异\u003c/td>\n\u003ctd>专家时间是否集中到有价值的问题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>先选择少量适合的对象，保留必要人工支持，观察使用与履约，再决定标准化和定价。若客户使用积极但复核太重，就改资料和服务范围；若结果很少被使用，则重新查看它与客户决定的关系。新服务通过这种实际往返形成。\u003c/p>\n\u003ch2>企业的差异怎样逐渐积累\u003c/h2>\n\u003cp>竞争者也可以使用通用模型，但未必拥有同样的客户理解、专业方法和履约反馈。企业持续把这些经验放进任务，并用结果修正，才能形成更符合自身业务的能力。\u003c/p>\n\u003cp>其中一个关键是让反馈回到方法。客户的追问可以改进资料，专业人员的修正可以完善判断，运行问题可以改善工具。每一次使用都可能为下一次提供更好的条件。规模扩大时，这种积累有助于减少重复探索。\u003c/p>\n\u003cp>企业应保有重要资料、方法和业务记录的可用形式，并明确供应商与内部团队的维护分工。需要换模型或工具时，能够迁移已有知识与工作方法，就能保住已经积累的价值。\u003c/p>\n\u003ch2>怎样管理这条发展路径\u003c/h2>\n\u003cp>把改进项目与经营方向一起回顾：当前哪些限制最值得解决，已有能力能减少哪些投入，哪些新的供给值得小范围尝试。随后给每项工作安排负责人、资源和下一次决定的依据。\u003c/p>\n\u003cp>局部提效、服务扩展与组织积累可以相互促进。企业逐步学会用更低成本试验，用实际结果选择，再把有效方法留给团队。这种持续调整能力，是组织AI化值得追求的长期成果。\u003c/p>\n","text":"# 第27章｜从局部改进走向企业能力与新服务\n\n**企业AI化有两种相互支持的增长：把已有工作做得更好，以及利用降低的信息处理成本提供新的服务。扩展时，把经营需要与已经形成的能力放在一起考虑。**\n\n一项试点完成后，企业更清楚模型适合处理什么，也积累了一些资料、方法、工具和协作经验。下一项投入可以因此少做一部分准备，但仍要回应当前业务最值得解决的问题。\n\n## 局部改善以后，限制会移动\n\n材料整理加快，专业确认可能开始排队；确认加快，资源安排可能成为限制；交付稳定以后，企业可能更需要新的客户。这些变化说明原有改善正在改变工作条件，也提示了新的投入方向。\n\n可以沿同一项结果持续观察。若目标是缩短客户响应，就继续看从收到需求到形成可用答复的整段时间。若目标是服务更多客户，就看专业人员负荷和履约容量。团队据此判断下一步是改善相邻环节、增加资源，还是转向新的经营问题。\n\n![经营限制决定改进方向，共用能力降低实施成本，新服务试验检验新的供给机会。](assets/27.svg)\n\n## 从共用方法走向可组合的能力\n\n准确关联客户与订单、按身份提供资料、采用统一计算方法、保存任务状态，这些能力可以被多个场景使用。销售方案与售后处理各有专业流程，却可能共用客户记录和产品知识。\n\n企业可以把稳定共用部分维护好，再允许各业务组合使用。新的场景因此不必重新整理全部资料或重建每个连接，团队可以把更多精力用于理解新任务的特殊要求。\n\n人员同样积累能力。业务骨干更会表达判断，负责人更会管理跨岗结果，技术人员更熟悉真实环境，管理者更能判断投入。这些人与方法、数据、工具共同构成企业的改造能力。\n\n## 成本结构改变以后，什么新服务值得尝试\n\n回到第1章的设备服务设想。整理使用记录和制作初步分析变便宜后，企业可以考虑提高服务频次，或者把原来只面向重点客户的服务扩展给更多客户。变化发生在服务经济性：专业人员把时间集中在值得判断的异常，信息整理与基础表达由系统承担。\n\n新服务还需要一项完整设计。服务对象是谁，客户在什么时刻需要结果，哪些数据可以取得，专业人员在哪一步参与，结果怎样影响客户行动，后续履约需要多少资源，都要放在一起考虑。\n\n| 可能的新供给 | 成本下降带来的机会 | 首轮要观察什么 |\n| --- | --- | --- |\n| 更细分的客户说明 | 同一套专业知识按不同需求组织 | 客户是否更容易选择、追问是否更具体 |\n| 更频繁的经营或使用分析 | 查询、整理和初步分析更容易开展 | 发现是否及时、是否支持实际行动 |\n| 小范围专属工具 | 编程和修改成本降低 | 用户是否持续使用、维护是否可承担 |\n| 专业服务的初步分诊 | 先整理材料与识别差异 | 专家时间是否集中到有价值的问题 |\n\n先选择少量适合的对象，保留必要人工支持，观察使用与履约，再决定标准化和定价。若客户使用积极但复核太重，就改资料和服务范围；若结果很少被使用，则重新查看它与客户决定的关系。新服务通过这种实际往返形成。\n\n## 企业的差异怎样逐渐积累\n\n竞争者也可以使用通用模型，但未必拥有同样的客户理解、专业方法和履约反馈。企业持续把这些经验放进任务，并用结果修正，才能形成更符合自身业务的能力。\n\n其中一个关键是让反馈回到方法。客户的追问可以改进资料，专业人员的修正可以完善判断，运行问题可以改善工具。每一次使用都可能为下一次提供更好的条件。规模扩大时，这种积累有助于减少重复探索。\n\n企业应保有重要资料、方法和业务记录的可用形式，并明确供应商与内部团队的维护分工。需要换模型或工具时，能够迁移已有知识与工作方法，就能保住已经积累的价值。\n\n## 怎样管理这条发展路径\n\n把改进项目与经营方向一起回顾：当前哪些限制最值得解决，已有能力能减少哪些投入，哪些新的供给值得小范围尝试。随后给每项工作安排负责人、资源和下一次决定的依据。\n\n局部提效、服务扩展与组织积累可以相互促进。企业逐步学会用更低成本试验，用实际结果选择，再把有效方法留给团队。这种持续调整能力，是组织AI化值得追求的长期成果。\n"},{"id":"c28","file":"28-企业主的行动路线与阶段决定.md","title":"第28章｜从哪里开始：行动路线与阶段决定","html":"\u003ch1>第28章｜从哪里开始：行动路线与阶段决定\u003c/h1>\n\u003cp>\u003cstrong>企业可以从一类熟悉的工作开始，完成诊断、实现、试用与接手，再据此决定下一轮投入。每个阶段都应交出可使用的结果，也帮助企业回答一个具体问题。\u003c/strong>\u003c/p>\n\u003cp>行动的起点是一项经营选择：当前最值得改善什么。可以是客户等待、专业人员负荷、重复返工，也可以是某种原本成本太高的新服务。选择一个足够重要、能得到材料和人员支持的切口，就有了第一轮工作。\u003c/p>\n\u003ch2>准备一次能形成决定的工作会\u003c/h2>\n\u003cp>请实际操作者、下游接手者和能够判断实现条件的人一起参加。项目发起人或授权负责人说明目标与可用资源。带来几笔正常完成、返工和未完成的任务，以及当前规则、系统入口和主要时间成本。\u003c/p>\n\u003cp>先沿任务还原过程：收到什么，谁怎样处理，等待在哪里，结果交给谁。接着讨论主要原因，列出AI能力和其他办法分别能改变什么。最后选择首轮切口，明确交出物、参与者、必要条件和检查方法。\u003c/p>\n\u003cp>会议可以形成这样一项约定：“先改善标准服务需求进入专业确认之前的资料整理。专业负责人确定必要条件，销售提供原始任务并核对，实施者做出提取与缺项提示，接手人员判断材料能否支持下一步。第一轮记录整理、核对与退回情况，再决定是否连接正式系统。”这比一个宽泛项目名称更能组织工作。\u003c/p>\n\u003ch2>四段推进，各有一个主要决定\u003c/h2>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>阶段\u003c/th>\n\u003cth>工作重点\u003c/th>\n\u003cth>主要决定\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>诊断与准备\u003c/td>\n\u003ctd>原始任务、原因、可选办法和实施条件\u003c/td>\n\u003ctd>先试哪一段，投入哪些人员与资源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>有限原型\u003c/td>\n\u003ctd>真实输入、关键能力、必要交接\u003c/td>\n\u003ctd>哪种实现值得进入日常试用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>日常试用\u003c/td>\n\u003ctd>任务质量、完整负担、员工采用和经济性\u003c/td>\n\u003ctd>正式使用哪些范围，怎样调整分工\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>运行与积累\u003c/td>\n\u003ctd>日常入口、维护、例外接手和经验复用\u003c/td>\n\u003ctd>下一轮改善什么，哪些做法继续保留\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>阶段可以往返。核接口时发现条件变化，就调整实现；试用时发现输入类型不同，就补材料与处理方法；运行时规则更新，就修改并检查。每次往返说明新发现以及受影响的部分，工作就能持续推进。\u003c/p>\n\u003ch2>把资源投入与下一项结果对应起来\u003c/h2>\n\u003cp>诊断阶段需要业务人员解释工作，原型阶段需要实施与反馈，试用阶段需要日常操作和记录，运行阶段需要持续维护。企业应为这些工作安排真实时间，并在每一段结束时讨论下一段价值。\u003c/p>\n\u003cp>团队的阶段汇报可以围绕三件事展开：得到的结果是什么，它改变了哪些原有判断，建议接下来做什么。决策者据此决定采用范围、资源和责任。第29章的工作文件可以帮助保存这些决定。\u003c/p>\n\u003ch2>根据结果调整实现形态\u003c/h2>\n\u003cp>若AI整理确实有帮助，但当前连接成本较高，可以先作为团队辅助使用；若专业规则仍在争议中，先组织规则确认；若完整流程已表现稳定，就讨论取消重复录入、扩大任务范围。每一种结果都对应具体动作。\u003c/p>\n\u003cp>新服务探索也一样。客户愿意使用时，继续核算履约与价格；客户觉得结果用不上时，查看是否选错时刻、问题或服务内容。阶段结果应推动选择，让投入朝更有价值的方向移动。\u003c/p>\n\u003ch2>第一轮要给企业留下什么\u003c/h2>\n\u003cp>留下一个实际使用入口，一套当前有效的资料与方法，一位业务负责人，以及清楚的维护和接手安排。让内部人员独立完成正常任务，处理一次常见异常，找到需要的规则和记录。再把典型错误与有效修正纳入下次工作。\u003c/p>\n\u003cp>同时确认释放的时间怎样使用、持续费用怎样承担、下一项改进从哪里开始。这个项目至此进入企业的日常运行，并为后续提供经验。\u003c/p>\n\u003cp>回到本书开头，企业AI化要改变的是工作的完成方式。理解模型使企业看见机会，FDE式推进把机会做成可用工作，组织安排让有效方法继续发挥作用。决策者的任务，是把这几个部分组织在一起，持续作出有依据的选择。\u003c/p>\n","text":"# 第28章｜从哪里开始：行动路线与阶段决定\n\n**企业可以从一类熟悉的工作开始，完成诊断、实现、试用与接手，再据此决定下一轮投入。每个阶段都应交出可使用的结果，也帮助企业回答一个具体问题。**\n\n行动的起点是一项经营选择：当前最值得改善什么。可以是客户等待、专业人员负荷、重复返工，也可以是某种原本成本太高的新服务。选择一个足够重要、能得到材料和人员支持的切口，就有了第一轮工作。\n\n## 准备一次能形成决定的工作会\n\n请实际操作者、下游接手者和能够判断实现条件的人一起参加。项目发起人或授权负责人说明目标与可用资源。带来几笔正常完成、返工和未完成的任务，以及当前规则、系统入口和主要时间成本。\n\n先沿任务还原过程：收到什么，谁怎样处理，等待在哪里，结果交给谁。接着讨论主要原因，列出AI能力和其他办法分别能改变什么。最后选择首轮切口，明确交出物、参与者、必要条件和检查方法。\n\n会议可以形成这样一项约定：“先改善标准服务需求进入专业确认之前的资料整理。专业负责人确定必要条件，销售提供原始任务并核对，实施者做出提取与缺项提示，接手人员判断材料能否支持下一步。第一轮记录整理、核对与退回情况，再决定是否连接正式系统。”这比一个宽泛项目名称更能组织工作。\n\n## 四段推进，各有一个主要决定\n\n| 阶段 | 工作重点 | 主要决定 |\n| --- | --- | --- |\n| 诊断与准备 | 原始任务、原因、可选办法和实施条件 | 先试哪一段，投入哪些人员与资源 |\n| 有限原型 | 真实输入、关键能力、必要交接 | 哪种实现值得进入日常试用 |\n| 日常试用 | 任务质量、完整负担、员工采用和经济性 | 正式使用哪些范围，怎样调整分工 |\n| 运行与积累 | 日常入口、维护、例外接手和经验复用 | 下一轮改善什么，哪些做法继续保留 |\n\n阶段可以往返。核接口时发现条件变化，就调整实现；试用时发现输入类型不同，就补材料与处理方法；运行时规则更新，就修改并检查。每次往返说明新发现以及受影响的部分，工作就能持续推进。\n\n## 把资源投入与下一项结果对应起来\n\n诊断阶段需要业务人员解释工作，原型阶段需要实施与反馈，试用阶段需要日常操作和记录，运行阶段需要持续维护。企业应为这些工作安排真实时间，并在每一段结束时讨论下一段价值。\n\n团队的阶段汇报可以围绕三件事展开：得到的结果是什么，它改变了哪些原有判断，建议接下来做什么。决策者据此决定采用范围、资源和责任。第29章的工作文件可以帮助保存这些决定。\n\n## 根据结果调整实现形态\n\n若AI整理确实有帮助，但当前连接成本较高，可以先作为团队辅助使用；若专业规则仍在争议中，先组织规则确认；若完整流程已表现稳定，就讨论取消重复录入、扩大任务范围。每一种结果都对应具体动作。\n\n新服务探索也一样。客户愿意使用时，继续核算履约与价格；客户觉得结果用不上时，查看是否选错时刻、问题或服务内容。阶段结果应推动选择，让投入朝更有价值的方向移动。\n\n## 第一轮要给企业留下什么\n\n留下一个实际使用入口，一套当前有效的资料与方法，一位业务负责人，以及清楚的维护和接手安排。让内部人员独立完成正常任务，处理一次常见异常，找到需要的规则和记录。再把典型错误与有效修正纳入下次工作。\n\n同时确认释放的时间怎样使用、持续费用怎样承担、下一项改进从哪里开始。这个项目至此进入企业的日常运行，并为后续提供经验。\n\n回到本书开头，企业AI化要改变的是工作的完成方式。理解模型使企业看见机会，FDE式推进把机会做成可用工作，组织安排让有效方法继续发挥作用。决策者的任务，是把这几个部分组织在一起，持续作出有依据的选择。\n"},{"id":"c29","file":"29-工作文件与经营判断工具.md","title":"工作文件与经营判断工具","html":"\u003ch1>工作文件与经营判断工具\u003c/h1>\n\u003cp>这些工作文件用于保存一项改造中的判断与约定。按当前阶段选择相应文件，填写后交给下一位参与者继续。以下填写内容为方法示意，经济性数字沿用第23章的假设算例。\u003c/p>\n\u003ch2>一、能力机会卡：把愿望改成可检查的工作\u003c/h2>\n\u003cp>在提出“AI销售”“智能知识库”等方向时使用。它连接经营问题与具体能力，防止直接从技术名称进入采购。\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项目\u003c/th>\n\u003cth>填写示意\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>希望改善的结果\u003c/td>\n\u003ctd>标准服务需求进入专业确认时，减少因缺项反复退回\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>当前观察\u003c/td>\n\u003ctd>近期抽取任务出现现场条件缺失；总体比例尚未统计\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>原因假设\u003c/td>\n\u003ctd>上游不知道必要条件，输入形式又分散\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AI可能改变的动作\u003c/td>\n\u003ctd>从原始消息提取条件，保留未定项并提出追问\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>其他必要改变\u003c/td>\n\u003ctd>专业负责人确定必要字段；销售核对；结果进入共同记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>更轻的替代\u003c/td>\n\u003ctd>统一表单和字段提示，先比较是否已经足够\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>首轮终点\u003c/td>\n\u003ctd>专业人员收到足以开始判断的材料，进入专业确认\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可能推翻判断的证据\u003c/td>\n\u003ctd>资料完整后仍长期等待，说明主要限制另在责任或资源\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>卡片完成后，收集正常与返工任务，核实原因，再选择有限原型。试用结果回来时更新“当前观察”，据此调整后续工作。\u003c/p>\n\u003ch2>二、AI任务说明：使能力获得正确条件\u003c/h2>\n\u003cp>交给模型或实现者前，明确任务所需材料、输出与使用方式。\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项目\u003c/th>\n\u003cth>填写示意\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>目标\u003c/td>\n\u003ctd>整理本次需求，供销售核对和追问\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>输入\u003c/td>\n\u003ctd>客户原始消息，已确认产品范围，必要字段说明\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>输出\u003c/td>\n\u003ctd>字段、原句依据、状态和待确认问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>核心区别\u003c/td>\n\u003ctd>本次确认、历史引用、未来意向、否定与未定分别保留\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>信息缺口\u003c/td>\n\u003ctd>“上次”对应历史订单；期望日期等待资源确认\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可用动作\u003c/td>\n\u003ctd>整理需求，形成销售待核对记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>完成条件\u003c/td>\n\u003ctd>接手人能逐项核对，并知道缺什么和向谁补\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>增加工具时，把实际入口、运行身份、操作范围和失败接手一并补入任务说明，方便实施者配置与检查。\u003c/p>\n\u003ch2>三、事实与规则记录：把判断依据留下来\u003c/h2>\n\u003cp>发现资料冲突、一次特殊批准或新经验时使用。先说明信息属于哪一层，再决定是否成为共用规则。\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项目\u003c/th>\n\u003cth>填写示意\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>当前事实\u003c/td>\n\u003ctd>本次客户希望月底完成，企业尚未确认资源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>适用规则\u003c/td>\n\u003ctd>资源确认后才可作交付承诺；规则负责人和有效版本明确\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>本次决定\u003c/td>\n\u003ctd>保留期望日期，先安排资源核实\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>特殊例外\u003c/td>\n\u003ctd>若需加急，由有权人员批准，不自动沿用到其他客户\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>待确认项\u003c/td>\n\u003ctd>设备、人员与现场条件，由对应责任人核实\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>保存位置\u003c/td>\n\u003ctd>绑定本次任务；共用规则仍在权威入口维护\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>下一次使用时，按对象取得本次决定，按范围取得共用规则，再核对当前状态。\u003c/p>\n\u003ch2>四、系统现实核对：先证明环境成立\u003c/h2>\n\u003cp>在原型前检查会影响方案可行性的关键依赖。用实际角色与低影响测试记录验证。\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>核对项\u003c/th>\n\u003cth>必须取得的结果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>账号与身份\u003c/td>\n\u003ctd>最终使用者可以登录，身份对应范围明确\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>套餐与平台\u003c/td>\n\u003ctd>当前版本具备所需接口及数据权限，未具备的明确记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>读取\u003c/td>\n\u003ctd>读到正确对象；无权数据实际不可见\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>写入\u003c/td>\n\u003ctd>创建后能读回正确记录，接手方能从正式入口看见\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>内容变化与同时操作\u003c/td>\n\u003ctd>内容或状态变化后，不会沿用已失效的检查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>超时与重复\u003c/td>\n\u003ctd>先核结果；幂等保证由实际接收端支持，否则安排人工核实\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>逐项记录操作条件与实际结果，尚未操作的项目注明负责人和下一次核实安排。\u003c/p>\n\u003ch2>五、验证记录：让每次失败指向改进\u003c/h2>\n\u003cp>可按一项任务记录，不必追求庞大表格。必要字段是输入、条件、预期、实际、原因、修改与复测。\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项目\u003c/th>\n\u003cth>填写示意\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>测试输入\u003c/td>\n\u003ctd>客户改变数量，原内容已有批准\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>预期\u003c/td>\n\u003ctd>重算并检查受影响条件；原批准不能直接支持新内容\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>实际\u003c/td>\n\u003ctd>金额更新，但批准仍显示有效\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>判断\u003c/td>\n\u003ctd>批准只绑定任务，没有绑定具体内容版本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>修改\u003c/td>\n\u003ctd>将批准关联内容版本，执行前再次核对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>原失败复测\u003c/td>\n\u003ctd>改数量后要求重新检查，核实际保存状态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>正常任务复测\u003c/td>\n\u003ctd>未变更的合法批准仍可继续；其他角色不能绕过\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>下一轮观察\u003c/td>\n\u003ctd>在日常试用中记录采用情况与完整成本\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>原因尚未确定时保留候选解释，按输入、资料、方法与实际动作继续查找。复测记录对应当前版本，方便后续改动时比较。\u003c/p>\n\u003ch2>六、经济性记录：分别算工时、现金与质量\u003c/h2>\n\u003cp>先确定同类任务范围，再计算全链时间。使用第23章教学数值：200项×（30−18）分钟÷60＝40小时，扣8小时维护＝32小时净容量。按80元每小时估算为2,560元劳动价值，月服务费用另计1,200元。\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>需要补齐\u003c/th>\n\u003cth>为什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>任务量及复杂度\u003c/td>\n\u003ctd>试用与原工作是否可比\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>复核、重试和返工\u003c/td>\n\u003ctd>避免只算顺利生成时间\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>固定维护与内部配合\u003c/td>\n\u003ctd>低任务量时仍会发生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>一次性建设和培训\u003c/td>\n\u003ctd>决定整个使用周期是否值得\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>容量怎样使用\u003c/td>\n\u003ctd>区分减少现金支出、增加产能或未被使用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>质量与新收入\u003c/td>\n\u003ctd>分别说明证据，不重复计算同一收益\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>下一步改变最敏感的条件重算。任务量为50项时，净容量为2小时；据此比较轻量工具、增加合理使用范围或暂缓投入。\u003c/p>\n\u003ch2>七、运行与交接记录：让原实施者可以离开\u003c/h2>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项目\u003c/th>\n\u003cth>应留下什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>使用范围\u003c/td>\n\u003ctd>当前任务类型、允许动作与明确限制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>企业可控入口\u003c/td>\n\u003ctd>必要账号、数据、配置及文件的管理安排\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>正常操作\u003c/td>\n\u003ctd>实际使用者能够独立完成的路径\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>常见异常\u003c/td>\n\u003ctd>缺资料、无权限、工具失败、结果未知分别交给谁\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>变更\u003c/td>\n\u003ctd>规则、模型和接口由谁更新，怎样核影响\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>外部影响\u003c/td>\n\u003ctd>错误承诺或重复动作怎样核实和补救\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>持续费用\u003c/td>\n\u003ctd>平台、模型、维护和内部工时的承担方式\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>交接时安排内部人员独立操作和异常接手，发现缺少的说明或能力后补齐。\u003c/p>\n\u003ch2>八、经验资产卡：决定什么值得复用\u003c/h2>\n\u003cp>先写机制与适用条件。例如：“技术修改后，用原来失败的任务和相应身份重做，再请接收方确认能否继续。”这项方法可以用于多种系统，具体需要检查的资料、配置与业务规则随任务确定。\u003c/p>\n\u003cp>记录原始问题、采用方法、验证范围、依赖、负责人和版本。进入新场景后补充迁移结果：减少什么工作，怎样调整，维护是否值得。用这些信息决定方法继续沿用还是修订。\u003c/p>\n\u003ch2>九、阶段决定：让下一笔投入有问题可答\u003c/h2>\n\u003cp>每段结束，用一页说明当前结果、解释、建议下一步与资源需求，附上扩大、调整或停止的依据。决策者据此决定下一段范围与投入。\u003c/p>\n\u003cp>例如平台连接条件不足时，先保留草稿辅助；复核过重时，调整资料展示与自动范围；新服务获得客户采用后，继续观察履约成本。阶段决定把本轮发现转成下一项具体工作。\u003c/p>\n","text":"# 工作文件与经营判断工具\n\n这些工作文件用于保存一项改造中的判断与约定。按当前阶段选择相应文件，填写后交给下一位参与者继续。以下填写内容为方法示意，经济性数字沿用第23章的假设算例。\n\n## 一、能力机会卡：把愿望改成可检查的工作\n\n在提出“AI销售”“智能知识库”等方向时使用。它连接经营问题与具体能力，防止直接从技术名称进入采购。\n\n| 项目 | 填写示意 |\n| --- | --- |\n| 希望改善的结果 | 标准服务需求进入专业确认时，减少因缺项反复退回 |\n| 当前观察 | 近期抽取任务出现现场条件缺失；总体比例尚未统计 |\n| 原因假设 | 上游不知道必要条件，输入形式又分散 |\n| AI可能改变的动作 | 从原始消息提取条件，保留未定项并提出追问 |\n| 其他必要改变 | 专业负责人确定必要字段；销售核对；结果进入共同记录 |\n| 更轻的替代 | 统一表单和字段提示，先比较是否已经足够 |\n| 首轮终点 | 专业人员收到足以开始判断的材料，进入专业确认 |\n| 可能推翻判断的证据 | 资料完整后仍长期等待，说明主要限制另在责任或资源 |\n\n卡片完成后，收集正常与返工任务，核实原因，再选择有限原型。试用结果回来时更新“当前观察”，据此调整后续工作。\n\n## 二、AI任务说明：使能力获得正确条件\n\n交给模型或实现者前，明确任务所需材料、输出与使用方式。\n\n| 项目 | 填写示意 |\n| --- | --- |\n| 目标 | 整理本次需求，供销售核对和追问 |\n| 输入 | 客户原始消息，已确认产品范围，必要字段说明 |\n| 输出 | 字段、原句依据、状态和待确认问题 |\n| 核心区别 | 本次确认、历史引用、未来意向、否定与未定分别保留 |\n| 信息缺口 | “上次”对应历史订单；期望日期等待资源确认 |\n| 可用动作 | 整理需求，形成销售待核对记录 |\n| 完成条件 | 接手人能逐项核对，并知道缺什么和向谁补 |\n\n增加工具时，把实际入口、运行身份、操作范围和失败接手一并补入任务说明，方便实施者配置与检查。\n\n## 三、事实与规则记录：把判断依据留下来\n\n发现资料冲突、一次特殊批准或新经验时使用。先说明信息属于哪一层，再决定是否成为共用规则。\n\n| 项目 | 填写示意 |\n| --- | --- |\n| 当前事实 | 本次客户希望月底完成，企业尚未确认资源 |\n| 适用规则 | 资源确认后才可作交付承诺；规则负责人和有效版本明确 |\n| 本次决定 | 保留期望日期，先安排资源核实 |\n| 特殊例外 | 若需加急，由有权人员批准，不自动沿用到其他客户 |\n| 待确认项 | 设备、人员与现场条件，由对应责任人核实 |\n| 保存位置 | 绑定本次任务；共用规则仍在权威入口维护 |\n\n下一次使用时，按对象取得本次决定，按范围取得共用规则，再核对当前状态。\n\n## 四、系统现实核对：先证明环境成立\n\n在原型前检查会影响方案可行性的关键依赖。用实际角色与低影响测试记录验证。\n\n| 核对项 | 必须取得的结果 |\n| --- | --- |\n| 账号与身份 | 最终使用者可以登录，身份对应范围明确 |\n| 套餐与平台 | 当前版本具备所需接口及数据权限，未具备的明确记录 |\n| 读取 | 读到正确对象；无权数据实际不可见 |\n| 写入 | 创建后能读回正确记录，接手方能从正式入口看见 |\n| 内容变化与同时操作 | 内容或状态变化后，不会沿用已失效的检查 |\n| 超时与重复 | 先核结果；幂等保证由实际接收端支持，否则安排人工核实 |\n\n逐项记录操作条件与实际结果，尚未操作的项目注明负责人和下一次核实安排。\n\n## 五、验证记录：让每次失败指向改进\n\n可按一项任务记录，不必追求庞大表格。必要字段是输入、条件、预期、实际、原因、修改与复测。\n\n| 项目 | 填写示意 |\n| --- | --- |\n| 测试输入 | 客户改变数量，原内容已有批准 |\n| 预期 | 重算并检查受影响条件；原批准不能直接支持新内容 |\n| 实际 | 金额更新，但批准仍显示有效 |\n| 判断 | 批准只绑定任务，没有绑定具体内容版本 |\n| 修改 | 将批准关联内容版本，执行前再次核对 |\n| 原失败复测 | 改数量后要求重新检查，核实际保存状态 |\n| 正常任务复测 | 未变更的合法批准仍可继续；其他角色不能绕过 |\n| 下一轮观察 | 在日常试用中记录采用情况与完整成本 |\n\n原因尚未确定时保留候选解释，按输入、资料、方法与实际动作继续查找。复测记录对应当前版本，方便后续改动时比较。\n\n## 六、经济性记录：分别算工时、现金与质量\n\n先确定同类任务范围，再计算全链时间。使用第23章教学数值：200项×（30−18）分钟÷60＝40小时，扣8小时维护＝32小时净容量。按80元每小时估算为2,560元劳动价值，月服务费用另计1,200元。\n\n| 需要补齐 | 为什么 |\n| --- | --- |\n| 任务量及复杂度 | 试用与原工作是否可比 |\n| 复核、重试和返工 | 避免只算顺利生成时间 |\n| 固定维护与内部配合 | 低任务量时仍会发生 |\n| 一次性建设和培训 | 决定整个使用周期是否值得 |\n| 容量怎样使用 | 区分减少现金支出、增加产能或未被使用 |\n| 质量与新收入 | 分别说明证据，不重复计算同一收益 |\n\n下一步改变最敏感的条件重算。任务量为50项时，净容量为2小时；据此比较轻量工具、增加合理使用范围或暂缓投入。\n\n## 七、运行与交接记录：让原实施者可以离开\n\n| 项目 | 应留下什么 |\n| --- | --- |\n| 使用范围 | 当前任务类型、允许动作与明确限制 |\n| 企业可控入口 | 必要账号、数据、配置及文件的管理安排 |\n| 正常操作 | 实际使用者能够独立完成的路径 |\n| 常见异常 | 缺资料、无权限、工具失败、结果未知分别交给谁 |\n| 变更 | 规则、模型和接口由谁更新，怎样核影响 |\n| 外部影响 | 错误承诺或重复动作怎样核实和补救 |\n| 持续费用 | 平台、模型、维护和内部工时的承担方式 |\n\n交接时安排内部人员独立操作和异常接手，发现缺少的说明或能力后补齐。\n\n## 八、经验资产卡：决定什么值得复用\n\n先写机制与适用条件。例如：“技术修改后，用原来失败的任务和相应身份重做，再请接收方确认能否继续。”这项方法可以用于多种系统，具体需要检查的资料、配置与业务规则随任务确定。\n\n记录原始问题、采用方法、验证范围、依赖、负责人和版本。进入新场景后补充迁移结果：减少什么工作，怎样调整，维护是否值得。用这些信息决定方法继续沿用还是修订。\n\n## 九、阶段决定：让下一笔投入有问题可答\n\n每段结束，用一页说明当前结果、解释、建议下一步与资源需求，附上扩大、调整或停止的依据。决策者据此决定下一段范围与投入。\n\n例如平台连接条件不足时，先保留草稿辅助；复核过重时，调整资料展示与自动范围；新服务获得客户采用后，继续观察履约成本。阶段决定把本轮发现转成下一项具体工作。"},{"id":"c30","file":"30-关键观点与术语索引.md","title":"关键观点与术语索引","html":"\u003ch1>关键观点与术语索引\u003c/h1>\n\u003cp>本页汇总全书观点，并按当前问题提供阅读入口。每条观点可回到相应章节查看机制、例子与实施方法。\u003c/p>\n\u003ch2>从当前问题找到入口\u003c/h2>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>当前问题\u003c/th>\n\u003cth>阅读入口\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>不清楚AI化要改变什么\u003c/td>\n\u003ctd>\u003ca href=\"#c01\">第1章\u003c/a>、\u003ca href=\"#c02\">第2章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>想了解模型怎样工作、为何会出错\u003c/td>\n\u003ctd>\u003ca href=\"#c03\">第3章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>想识别语言、推理、研究、视觉、分析、创作与编程机会\u003c/td>\n\u003ctd>\u003ca href=\"#c04\">第4章\u003c/a>至\u003ca href=\"#c10\">第10章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已有工具，但AI常拿错资料或忘记条件\u003c/td>\n\u003ctd>\u003ca href=\"#c11\">第11章\u003c/a>、\u003ca href=\"#c12\">第12章\u003c/a>、\u003ca href=\"#c13\">第13章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>需要让AI执行、持续完成多步工作\u003c/td>\n\u003ctd>\u003ca href=\"#c14\">第14章\u003c/a>、\u003ca href=\"#c15\">第15章\u003c/a>、\u003ca href=\"#c16\">第16章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>想选模型与核对能力\u003c/td>\n\u003ctd>\u003ca href=\"#c17\">第17章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>不知先改哪里、怎样推动试点\u003c/td>\n\u003ctd>\u003ca href=\"#c18\">第18章\u003c/a>、\u003ca href=\"#c19\">第19章\u003c/a>、\u003ca href=\"#c28\">第28章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>跨部门与系统接续困难\u003c/td>\n\u003ctd>\u003ca href=\"#c20\">第20章\u003c/a>、\u003ca href=\"#c21\">第21章\u003c/a>、\u003ca href=\"#c24\">第24章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>想判断是否可用、是否值得\u003c/td>\n\u003ctd>\u003ca href=\"#c22\">第22章\u003c/a>、\u003ca href=\"#c23\">第23章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已经运行，需要维护与扩大\u003c/td>\n\u003ctd>\u003ca href=\"#c25\">第25章\u003c/a>、\u003ca href=\"#c26\">第26章\u003c/a>、\u003ca href=\"#c27\">第27章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>要把讨论落成工作约定\u003c/td>\n\u003ctd>\u003ca href=\"#c29\">第29章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch2>关键观点：从能力到企业改造\u003c/h2>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>观点\u003c/th>\n\u003cth>如何落到工作中\u003c/th>\n\u003cth>论证位置\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>AI化从一类工作的完成方式入手\u003c/td>\n\u003ctd>信息加工成本下降，为流程重组和服务扩展创造机会。\u003c/td>\n\u003ctd>\u003ca href=\"#c01\">第1章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FDE把业务发现与工程实现放在同一轮推进\u003c/td>\n\u003ctd>用真实输入构建，用使用结果修改，企业及时提供判断和资源。\u003c/td>\n\u003ctd>\u003ca href=\"#c02\">第2章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>通用模型可以组成企业专属能力\u003c/td>\n\u003ctd>知识、方法、工具与任务组织共同决定实际表现。\u003c/td>\n\u003ctd>\u003ca href=\"#c03\">第3章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>自然语言成为新的业务入口\u003c/td>\n\u003ctd>把多样表达转成带状态的信息，减少消息与系统之间的人工搬运。\u003c/td>\n\u003ctd>\u003ca href=\"#c04\">第4章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>推理帮助企业组织选择与调查\u003c/td>\n\u003ctd>展开条件和后果，找出最值得取得的事实。\u003c/td>\n\u003ctd>\u003ca href=\"#c05\">第5章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>研究围绕经营决定持续积累\u003c/td>\n\u003ctd>先明确证据需要，再调查、比较并形成下一步。\u003c/td>\n\u003ctd>\u003ca href=\"#c06\">第6章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>现场信息可以更直接地参与工作\u003c/td>\n\u003ctd>照片、声音和文件经过提取、核对，进入专业判断。\u003c/td>\n\u003ctd>\u003ca href=\"#c07\">第7章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>自然语言问数应接到实际计算\u003c/td>\n\u003ctd>统一业务定义，执行查询，再检验原因解释。\u003c/td>\n\u003ctd>\u003ca href=\"#c08\">第8章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>内容生产可以从重复制作走向方法复用\u003c/td>\n\u003ctd>组织简报、结构、素材与使用反馈，服务不同读者。\u003c/td>\n\u003ctd>\u003ca href=\"#c09\">第9章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>编程成本下降让小范围改造更值得尝试\u003c/td>\n\u003ctd>用有限实现连接现有工作，再按实际用途持续修改。\u003c/td>\n\u003ctd>\u003ca href=\"#c10\">第10章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>按任务提供信息，是建设能力的直接手段\u003c/td>\n\u003ctd>稳定说明、当前事实与按需查询共同形成上下文。\u003c/td>\n\u003ctd>\u003ca href=\"#c11\">第11章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>知识与业务系统共同供给企业事实\u003c/td>\n\u003ctd>资料保存稳定方法，查询取得当前状态，按需组合。\u003c/td>\n\u003ctd>\u003ca href=\"#c12\">第12章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>企业学习要改变下一次工作的条件\u003c/td>\n\u003ctd>将有效修正转成方法、知识或程序，并通过使用继续完善。\u003c/td>\n\u003ctd>\u003ca href=\"#c13\">第13章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工具调用把理解接到实际操作\u003c/td>\n\u003ctd>模型提出请求，应用执行，结果交回业务继续。\u003c/td>\n\u003ctd>\u003ca href=\"#c14\">第14章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>固定流程和动态判断可以组合\u003c/td>\n\u003ctd>稳定要求交给规则，多变路径交给模型，按收益决定分工。\u003c/td>\n\u003ctd>\u003ca href=\"#c15\">第15章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>长期工作通过状态保存与恢复接续\u003c/td>\n\u003ctd>保留任务、证据和动作进展，中断后从事实继续。\u003c/td>\n\u003ctd>\u003ca href=\"#c16\">第16章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型组合以企业任务为选择单位\u003c/td>\n\u003ctd>同时比较质量、成本、响应时间与维护。\u003c/td>\n\u003ctd>\u003ca href=\"#c17\">第17章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>诊断把经营结果追到可改变的原因\u003c/td>\n\u003ctd>查看处理、等待和返工，再选择具体改法。\u003c/td>\n\u003ctd>\u003ca href=\"#c18\">第18章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>试点要交出可使用的结果\u003c/td>\n\u003ctd>限定有价值的范围，让下一岗位能够接手。\u003c/td>\n\u003ctd>\u003ca href=\"#c19\">第19章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>流程改造要重新分工并撤去重复工作\u003c/td>\n\u003ctd>围绕交出物组织人、模型和程序。\u003c/td>\n\u003ctd>\u003ca href=\"#c20\">第20章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>共同事实依赖清楚的对象与权威记录\u003c/td>\n\u003ctd>按稳定标识关联不同系统，各自维护负责的数据。\u003c/td>\n\u003ctd>\u003ca href=\"#c21\">第21章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>验证为每个阶段的采用决定提供依据\u003c/td>\n\u003ctd>按可行性、任务质量、实际采用和运行接手逐步检查。\u003c/td>\n\u003ctd>\u003ca href=\"#c22\">第22章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>省出的时间需要明确的经营去处\u003c/td>\n\u003ctd>减少现金支出、扩大交付和改善质量分别核算。\u003c/td>\n\u003ctd>\u003ca href=\"#c23\">第23章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>岗位变化需要时间、权责和利益安排\u003c/td>\n\u003ctd>为专业判断、方法维护和跨岗协作留出真实资源。\u003c/td>\n\u003ctd>\u003ca href=\"#c24\">第24章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>持续治理让成熟能力能够放心交给团队\u003c/td>\n\u003ctd>更新有负责人，变化有检查，异常有接手。\u003c/td>\n\u003ctd>\u003ca href=\"#c25\">第25章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>下一次工作检验资产的复用价值\u003c/td>\n\u003ctd>知识、方法和工具减少重复准备，维护按实际收益安排。\u003c/td>\n\u003ctd>\u003ca href=\"#c26\">第26章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已有能力可以支持新的经营供给\u003c/td>\n\u003ctd>从客户需要出发试验新服务，观察使用与履约经济性。\u003c/td>\n\u003ctd>\u003ca href=\"#c27\">第27章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>一轮改造留下结果，也留下继续改造的能力\u003c/td>\n\u003ctd>以诊断、实现、试用和接手形成持续推进。\u003c/td>\n\u003ctd>\u003ca href=\"#c28\">第28章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch2>常见术语：理解到足以参与讨论\u003c/h2>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>术语\u003c/th>\n\u003cth>本书中的意思\u003c/th>\n\u003cth>决策时应问什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>FDE\u003c/td>\n\u003ctd>深入业务现场，把问题定义、工程实现与使用反馈紧密结合的工作方式与角色\u003c/td>\n\u003ctd>谁负责结果，企业需要提供哪些决定与资源？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型与应用\u003c/td>\n\u003ctd>模型执行理解、推理和生成，应用负责界面、资料、工具及保存\u003c/td>\n\u003ctd>这项能力来自哪里，结果怎样进入实际工作？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>提示词\u003c/td>\n\u003ctd>交给模型的任务要求与处理说明\u003c/td>\n\u003ctd>目标、输入、输出与检查要求是否清楚？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>大模型\u003c/td>\n\u003ctd>通过训练形成广泛信息处理能力、运行时依据输入生成结果的模型\u003c/td>\n\u003ctd>当前任务采用哪些能力，提供哪些材料与工具？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>参数、训练、微调\u003c/td>\n\u003ctd>参数参与模型计算；训练更新参数；微调是在已有模型上进一步训练\u003c/td>\n\u003ctd>问题真的需要训练，还是缺资料、方法或工具？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Token\u003c/td>\n\u003ctd>模型处理文字等内容时使用的编码单位\u003c/td>\n\u003ctd>输入、输出和额外计算怎样影响成本与时延？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>上下文\u003c/td>\n\u003ctd>模型这次能够使用的指令、资料、历史与工具结果\u003c/td>\n\u003ctd>当前资料是否真的进入，版本是否适用？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Embedding、向量检索\u003c/td>\n\u003ctd>将内容转换为数值表示，并按相近关系寻找候选资料\u003c/td>\n\u003ctd>相似材料是否满足权限与适用条件？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RAG\u003c/td>\n\u003ctd>先检索资料，再把相关内容提供给模型使用\u003c/td>\n\u003ctd>资料、检索与利用分别怎样检查？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结构化输出\u003c/td>\n\u003ctd>按约定字段和类型返回信息，便于程序处理\u003c/td>\n\u003ctd>字段怎样从原始内容形成，后续怎样使用？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>多模态\u003c/td>\n\u003ctd>处理文字、图像、声音等多种形式\u003c/td>\n\u003ctd>输入范围、识别误差与专业判断怎样接续？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>API\u003c/td>\n\u003ctd>系统供程序调用的操作入口\u003c/td>\n\u003ctd>当前身份能读写什么，能否核实结果？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MCP\u003c/td>\n\u003ctd>连接模型应用与外部工具、资源等能力的协议\u003c/td>\n\u003ctd>它连接了哪些能力，采用什么身份执行？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工作流\u003c/td>\n\u003ctd>预先规定主要步骤与分支的安排\u003c/td>\n\u003ctd>哪些必须固定，哪些需要动态判断？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Agent\u003c/td>\n\u003ctd>在限定目标与能力范围内，根据反馈选择下一步的执行安排\u003c/td>\n\u003ctd>允许它选择什么，何时停下或交人？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Skill\u003c/td>\n\u003ctd>供AI使用的任务方法、资源与可能工具的组合\u003c/td>\n\u003ctd>是否有适用条件、真实依赖与验证？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Harness\u003c/td>\n\u003ctd>支持模型持续执行的工具、环境、状态、检查与恢复安排\u003c/td>\n\u003ctd>中断、变化与外部副作用怎样处理？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>幂等\u003c/td>\n\u003ctd>对同一意图重复提交，在实际接收端约束下不重复产生相应影响\u003c/td>\n\u003ctd>接收系统是否真正支持，超时怎样核实？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>评测、回归、验收\u003c/td>\n\u003ctd>分别检查任务表现、改动是否破坏旧行为，以及业务能否在约定范围接手\u003c/td>\n\u003ctd>这轮检查支持什么采用决定，下一轮观察什么？\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>讨论方案时，可以把术语对应到实际输入、处理过程和结果，沿这些具体内容确定需要采用的能力。\u003c/p>\n","text":"# 关键观点与术语索引\n\n本页汇总全书观点，并按当前问题提供阅读入口。每条观点可回到相应章节查看机制、例子与实施方法。\n\n## 从当前问题找到入口\n\n| 当前问题 | 阅读入口 |\n| --- | --- |\n| 不清楚AI化要改变什么 | [第1章](01-企业AI化改变的究竟是什么.md)、[第2章](02-FDE的价值与企业主的责任.md) |\n| 想了解模型怎样工作、为何会出错 | [第3章](03-模型能力是怎样形成和发挥的.md) |\n| 想识别语言、推理、研究、视觉、分析、创作与编程机会 | [第4章](04-语言理解让非标准信息进入业务.md)至[第10章](10-AI编程怎样改变企业软件供给.md) |\n| 已有工具，但AI常拿错资料或忘记条件 | [第11章](11-上下文是AI工作的现场条件.md)、[第12章](12-知识库RAG与业务数据怎样配合.md)、[第13章](13-经验记忆Skill与企业学习.md) |\n| 需要让AI执行、持续完成多步工作 | [第14章](14-工具API浏览器与MCP怎样让AI行动.md)、[第15章](15-工作流Agent与多Agent怎样选择.md)、[第16章](16-长任务Harness与执行可靠性.md) |\n| 想选模型与核对能力 | [第17章](17-怎样评估能力并选择模型.md) |\n| 不知先改哪里、怎样推动试点 | [第18章](18-从经营结果诊断改造机会.md)、[第19章](19-怎样选择场景并管理试点组合.md)、[第28章](28-企业主的行动路线与阶段决定.md) |\n| 跨部门与系统接续困难 | [第20章](20-重设计流程分工与授权.md)、[第21章](21-系统集成数据与共同事实.md)、[第24章](24-岗位重构负责人和激励.md) |\n| 想判断是否可用、是否值得 | [第22章](22-原型评测与业务验收.md)、[第23章](23-投入回报与合作采购.md) |\n| 已经运行，需要维护与扩大 | [第25章](25-持续运行风险与变更治理.md)、[第26章](26-把项目经验变为组织能力资产.md)、[第27章](27-从局部改进走向企业能力与新服务.md) |\n| 要把讨论落成工作约定 | [第29章](29-工作文件与经营判断工具.md) |\n\n## 关键观点：从能力到企业改造\n\n| 观点 | 如何落到工作中 | 论证位置 |\n| --- | --- | --- |\n| AI化从一类工作的完成方式入手 | 信息加工成本下降，为流程重组和服务扩展创造机会。 | [第1章](01-企业AI化改变的究竟是什么.md) |\n| FDE把业务发现与工程实现放在同一轮推进 | 用真实输入构建，用使用结果修改，企业及时提供判断和资源。 | [第2章](02-FDE的价值与企业主的责任.md) |\n| 通用模型可以组成企业专属能力 | 知识、方法、工具与任务组织共同决定实际表现。 | [第3章](03-模型能力是怎样形成和发挥的.md) |\n| 自然语言成为新的业务入口 | 把多样表达转成带状态的信息，减少消息与系统之间的人工搬运。 | [第4章](04-语言理解让非标准信息进入业务.md) |\n| 推理帮助企业组织选择与调查 | 展开条件和后果，找出最值得取得的事实。 | [第5章](05-推理能力怎样帮助经营判断.md) |\n| 研究围绕经营决定持续积累 | 先明确证据需要，再调查、比较并形成下一步。 | [第6章](06-检索研究怎样成为可靠情报.md) |\n| 现场信息可以更直接地参与工作 | 照片、声音和文件经过提取、核对，进入专业判断。 | [第7章](07-多模态能力怎样读取业务现场.md) |\n| 自然语言问数应接到实际计算 | 统一业务定义，执行查询，再检验原因解释。 | [第8章](08-数据分析怎样从问数走向解释.md) |\n| 内容生产可以从重复制作走向方法复用 | 组织简报、结构、素材与使用反馈，服务不同读者。 | [第9章](09-创作能力怎样进入内容生产.md) |\n| 编程成本下降让小范围改造更值得尝试 | 用有限实现连接现有工作，再按实际用途持续修改。 | [第10章](10-AI编程怎样改变企业软件供给.md) |\n| 按任务提供信息，是建设能力的直接手段 | 稳定说明、当前事实与按需查询共同形成上下文。 | [第11章](11-上下文是AI工作的现场条件.md) |\n| 知识与业务系统共同供给企业事实 | 资料保存稳定方法，查询取得当前状态，按需组合。 | [第12章](12-知识库RAG与业务数据怎样配合.md) |\n| 企业学习要改变下一次工作的条件 | 将有效修正转成方法、知识或程序，并通过使用继续完善。 | [第13章](13-经验记忆Skill与企业学习.md) |\n| 工具调用把理解接到实际操作 | 模型提出请求，应用执行，结果交回业务继续。 | [第14章](14-工具API浏览器与MCP怎样让AI行动.md) |\n| 固定流程和动态判断可以组合 | 稳定要求交给规则，多变路径交给模型，按收益决定分工。 | [第15章](15-工作流Agent与多Agent怎样选择.md) |\n| 长期工作通过状态保存与恢复接续 | 保留任务、证据和动作进展，中断后从事实继续。 | [第16章](16-长任务Harness与执行可靠性.md) |\n| 模型组合以企业任务为选择单位 | 同时比较质量、成本、响应时间与维护。 | [第17章](17-怎样评估能力并选择模型.md) |\n| 诊断把经营结果追到可改变的原因 | 查看处理、等待和返工，再选择具体改法。 | [第18章](18-从经营结果诊断改造机会.md) |\n| 试点要交出可使用的结果 | 限定有价值的范围，让下一岗位能够接手。 | [第19章](19-怎样选择场景并管理试点组合.md) |\n| 流程改造要重新分工并撤去重复工作 | 围绕交出物组织人、模型和程序。 | [第20章](20-重设计流程分工与授权.md) |\n| 共同事实依赖清楚的对象与权威记录 | 按稳定标识关联不同系统，各自维护负责的数据。 | [第21章](21-系统集成数据与共同事实.md) |\n| 验证为每个阶段的采用决定提供依据 | 按可行性、任务质量、实际采用和运行接手逐步检查。 | [第22章](22-原型评测与业务验收.md) |\n| 省出的时间需要明确的经营去处 | 减少现金支出、扩大交付和改善质量分别核算。 | [第23章](23-投入回报与合作采购.md) |\n| 岗位变化需要时间、权责和利益安排 | 为专业判断、方法维护和跨岗协作留出真实资源。 | [第24章](24-岗位重构负责人和激励.md) |\n| 持续治理让成熟能力能够放心交给团队 | 更新有负责人，变化有检查，异常有接手。 | [第25章](25-持续运行风险与变更治理.md) |\n| 下一次工作检验资产的复用价值 | 知识、方法和工具减少重复准备，维护按实际收益安排。 | [第26章](26-把项目经验变为组织能力资产.md) |\n| 已有能力可以支持新的经营供给 | 从客户需要出发试验新服务，观察使用与履约经济性。 | [第27章](27-从局部改进走向企业能力与新服务.md) |\n| 一轮改造留下结果，也留下继续改造的能力 | 以诊断、实现、试用和接手形成持续推进。 | [第28章](28-企业主的行动路线与阶段决定.md) |\n\n## 常见术语：理解到足以参与讨论\n\n| 术语 | 本书中的意思 | 决策时应问什么 |\n| --- | --- | --- |\n| FDE | 深入业务现场，把问题定义、工程实现与使用反馈紧密结合的工作方式与角色 | 谁负责结果，企业需要提供哪些决定与资源？ |\n| 模型与应用 | 模型执行理解、推理和生成，应用负责界面、资料、工具及保存 | 这项能力来自哪里，结果怎样进入实际工作？ |\n| 提示词 | 交给模型的任务要求与处理说明 | 目标、输入、输出与检查要求是否清楚？ |\n| 大模型 | 通过训练形成广泛信息处理能力、运行时依据输入生成结果的模型 | 当前任务采用哪些能力，提供哪些材料与工具？ |\n| 参数、训练、微调 | 参数参与模型计算；训练更新参数；微调是在已有模型上进一步训练 | 问题真的需要训练，还是缺资料、方法或工具？ |\n| Token | 模型处理文字等内容时使用的编码单位 | 输入、输出和额外计算怎样影响成本与时延？ |\n| 上下文 | 模型这次能够使用的指令、资料、历史与工具结果 | 当前资料是否真的进入，版本是否适用？ |\n| Embedding、向量检索 | 将内容转换为数值表示，并按相近关系寻找候选资料 | 相似材料是否满足权限与适用条件？ |\n| RAG | 先检索资料，再把相关内容提供给模型使用 | 资料、检索与利用分别怎样检查？ |\n| 结构化输出 | 按约定字段和类型返回信息，便于程序处理 | 字段怎样从原始内容形成，后续怎样使用？ |\n| 多模态 | 处理文字、图像、声音等多种形式 | 输入范围、识别误差与专业判断怎样接续？ |\n| API | 系统供程序调用的操作入口 | 当前身份能读写什么，能否核实结果？ |\n| MCP | 连接模型应用与外部工具、资源等能力的协议 | 它连接了哪些能力，采用什么身份执行？ |\n| 工作流 | 预先规定主要步骤与分支的安排 | 哪些必须固定，哪些需要动态判断？ |\n| Agent | 在限定目标与能力范围内，根据反馈选择下一步的执行安排 | 允许它选择什么，何时停下或交人？ |\n| Skill | 供AI使用的任务方法、资源与可能工具的组合 | 是否有适用条件、真实依赖与验证？ |\n| Harness | 支持模型持续执行的工具、环境、状态、检查与恢复安排 | 中断、变化与外部副作用怎样处理？ |\n| 幂等 | 对同一意图重复提交，在实际接收端约束下不重复产生相应影响 | 接收系统是否真正支持，超时怎样核实？ |\n| 评测、回归、验收 | 分别检查任务表现、改动是否破坏旧行为，以及业务能否在约定范围接手 | 这轮检查支持什么采用决定，下一轮观察什么？ |\n\n讨论方案时，可以把术语对应到实际输入、处理过程和结果，沿这些具体内容确定需要采用的能力。"}];
const $=id=>document.getElementById(id);const groups={  "00": "阅读入口",  "01": "一、企业价值与FDE",  "03": "二、理解AI的工作能力",  "11": "三、把能力变成企业系统",  "18": "四、组织一轮业务改造",  "24": "五、运行与组织能力建设",  "29": "工作文件与索引"};
$('toc-list').innerHTML=pages.map(p=>(groups[p.id.slice(1)]?'<p class="toc-group">'+groups[p.id.slice(1)]+'</p>':'')+'<a href="#'+p.id+'">'+p.title.replace(/第.+?章｜/,'')+'</a>').join('');
$('print-all').innerHTML=pages.map(p=>'<section>'+p.html+'</section>').join('');
function go(){let id=location.hash.slice(1)||'c00';let idx=pages.findIndex(p=>p.id===id);if(idx<0)idx=0;const p=pages[idx];$('article').innerHTML=p.html;document.title=p.title+' · GAIDN';$('home-actions').innerHTML=p.id==='c00'?'<a class="primary" href="#c01">开始阅读</a><a href="#c03">AI能力篇</a><a href="#c19">选择改造场景</a><a href="#c29">工作文件</a>':'';$('page-nav').innerHTML=(idx?'<a href="#'+pages[idx-1].id+'">← '+pages[idx-1].title+'</a>':'<span></span>')+(idx<pages.length-1?'<a href="#'+pages[idx+1].id+'">'+pages[idx+1].title+' →</a>':'<a href="#c00">返回导读</a>');document.querySelectorAll('#toc-list a').forEach(a=>{if(a.getAttribute('href')==='#'+p.id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});$('toc').classList.remove('mobile-open');$('menu').setAttribute('aria-expanded','false');try{localStorage.setItem('gaidn-fde-depth-bookmark',p.id)}catch{}window.scrollTo(0,0);$('search-dialog').close();}
const renderPage=go;go=function(){const controls=$('home-actions');if(controls)$('article').after(controls);renderPage();const p=document.querySelector('#article p');if(location.hash==='#c00'||!location.hash){if(p)p.after($('home-actions'))}else{$('article').after($('home-actions'))}};window.addEventListener('hashchange',go);function checkTables(){document.querySelectorAll('.table-shell').forEach(shell=>{const table=shell.querySelector('table');if(table.rows[0]?.cells.length===2)table.classList.add('cols-2');const box=shell.querySelector('.table-wrap');shell.querySelector('.table-hint').hidden=box.scrollWidth<=box.clientWidth+1;});}const beforeLayout=go;go=function(){beforeLayout();requestAnimationFrame(checkTables);};window.removeEventListener('hashchange',beforeLayout);window.addEventListener('hashchange',go);window.addEventListener('resize',()=>requestAnimationFrame(checkTables));$('article').addEventListener('click',e=>{const button=e.target.closest('.enlarge');if(!button)return;const img=button.closest('figure').querySelector('img');$('figure-large').src=img.src;$('figure-large').alt=img.alt;$('figure-dialog').showModal();});$('figure-close').onclick=()=>$('figure-dialog').close();$('menu').onclick=()=>{const open=$('toc').classList.toggle('mobile-open');$('chapters').open=true;$('menu').setAttribute('aria-expanded',String(open))};$('search-open').onclick=()=>{$('search-dialog').showModal();$('search-input').focus();search()};$('search-close').onclick=()=>$('search-dialog').close();$('search-input').oninput=search;$('print').onclick=()=>window.print();
function search(){const q=$('search-input').value.trim().toLowerCase();const hits=q?pages.filter(p=>p.text.toLowerCase().includes(q)):[];$('results').replaceChildren();if(!q){$('results').textContent='输入关键词，查找全书内容。';return}if(!hits.length){$('results').textContent='没有找到相关内容，可以换一个说法，例如“交接”“复核”或“成本”。';return}for(const p of hits){const a=document.createElement('a');a.href='#'+p.id;const title=document.createElement('strong');title.textContent=p.title;const sn=document.createElement('span');sn.className='snippet';const i=p.text.toLowerCase().indexOf(q);sn.textContent=p.text.slice(Math.max(0,i-24),i+90).replace(/[#*|]/g,' ');a.append(title,sn);a.onclick=()=>$('search-dialog').close();$('results').append(a)}}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();$('search-open').click()}});go();
try{const b=localStorage.getItem('gaidn-fde-depth-last');if(b&&pages.some(p=>p.id===b)&&!location.hash)location.hash=b}catch{}window.addEventListener('pagehide',()=>{try{localStorage.setItem('gaidn-fde-depth-last',location.hash.slice(1)||'c00')}catch{}});
</script></body></html>
