jEzNDJmIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXdlaWdodD0iNDAwIj7miafooYw8L3RleHQ+PHBhdGggZD0iTTI5OCAzOTNMMjk4IDQyNiIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMTY1ZDUyIiBzdHJva2Utd2lkdGg9IjIiLz48cGF0aCBkPSJNNjIgNDI2SDI5OCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMTY1ZDUyIiBzdHJva2Utd2lkdGg9IjIiLz48cGF0aCBkPSJNMTgwIDQyNkgxNFYyMTJINTgiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzE2NWQ1MiIgc3Ryb2tlLXdpZHRoPSIyIiBtYXJrZXItZW5kPSJ1cmwoI2Fycm93KSIvPjx0ZXh0IHg9IjE4MCIgeT0iNDY2IiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyMTM0MmYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSI0MDAiPue7k+aenOi/lOWbnu+8jOS/ruiuouaWueazlTwvdGV4dD48L3N2Zz4=)\n\n这张图应从中间的实际任务来读：左边的方法帮助人员作出判断，右边的结果再回来修订方法。若只有左向右的传播，没有结果回来，企业只能越来越熟练地重复过去的认识。\n\n## 使用范围越大，越需要接住反例\n\n原专家熟悉的客户和设备可能相对集中。AI进入更多销售和产品线后，会遇到新工况、新供应商和新的客户要求。一条过去有效的方法，可能在这些条件下失效。\n\n员工应能够说明“这个建议为什么不适用”，并将实际修改关联到原任务。专业人员据此判断是资料错误、方法范围需要收窄，还是出现了值得发展的新经验。FDE再使修订进入后续调用，避免其他人继续取得旧答案。\n\n动态能力研究强调组织在变化中重新安排资源、保持能力相关性的必要性。[原始研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf) 对企业来说，放大不只是让更多人复制旧办法，也包括让更多现场帮助改进共同办法。\n\n## 下一笔投入应当补在哪一段\n\n若销售仍频繁拿错材料，先改善资料和判断；若方案已经可靠，却大量等采购确认，就把资源用于履约衔接；若新场景不断产生错误，又没有人处理反馈，就先补纠错和方法维护。\n\n这三种情况都可能表现为“AI项目没有带来增长”，但需要的投入不同。把传播、执行和更新分别看清，再观察它们怎样连成客户结果，企业才不会只在最容易展示的生成环节不断加功能。\n","text":"# 第13章｜放大企业优势，为什么要同时改变判断、执行和纠错\n\n一家工业品经销商依赖资深工程师处理复杂询价。工程师看到旧零件照片，会先问使用环境；听到客户说“急用”，会继续确认最晚到货时间。经验较少的销售则可能直接寻找外形相近的型号，等报价快完成时，才发现适配或交期不成立。\n\n企业希望用AI传播专家经验，这是一个有价值的方向。但如果只把专家过去给过的型号整理成问答，新人仍不知道什么时候不能照用；如果所有AI建议最后都堆给专家确认，他也可能比以前更忙。怎样扩大能力，需要把后面的执行和纠错一起考虑。\n\n## 先传播判断所依赖的条件\n\n在工业品报价教学案例中，专家真正有用的经验包括：先确认什么、怎样比较候选、哪些差别需要供应商或客户补充。把这些过程留下，AI在新询价里才能提示销售先补关键条件，而不只是返回一个历史型号。\n\n例如，客户要求三天内取得替代品。系统找到一个技术上合适、十天后才到货的型号时，应把交期冲突显示出来，让销售继续找其他路线。这样，原来只有专家经常注意的条件，开始进入更多人的日常判断。\n\n一项2025年发表的客服研究提供了经验扩散的实证参照。研究观察5172名客服分批取得AI辅助后的工作，每小时解决问题量平均提高约15%，不同经验群体的作用并不相同。研究原文 它提示AI辅助可能使有效做法被更多人员使用，但不能把这一比例直接当作工业品经销商的订单增长预测。\n\n企业要在自己的任务中观察：销售是否更早发现缺项，补问是否减少，面对不同条件时能否调整。打开资料的次数和生成建议的数量，都不足以回答这些问题。\n\n## 好判断要经过履约，才会成为客户价值\n\n假设团队现在能形成更多可成交方案，采购和库存却没有相应准备，新增机会就可能卡在交付。更快给出承诺还可能占用原本服务老客户的资源，反而损害企业信誉。\n\n因此，放大判断能力以后，要继续看方案被谁采用，库存是否真实可用，供应商是否确认，客户最终有没有按期收到。工业品客户需要的是能用的零件按时到手，销售更懂方案只是其中一个必要环节。\n\n烘焙案例也有同样关系。知道X店可能多卖，并不使销量自动增长；工坊要能生产，配送要赶得上，门店要能接货、上架并继续获取需求。原来某个人的好判断，只有与这些条件配合，才可能扩大成企业的交付能力。\n\n \n\n这张图应从中间的实际任务来读：左边的方法帮助人员作出判断，右边的结果再回来修订方法。若只有左向右的传播，没有结果回来，企业只能越来越熟练地重复过去的认识。\n\n## 使用范围越大，越需要接住反例\n\n原专家熟悉的客户和设备可能相对集中。AI进入更多销售和产品线后，会遇到新工况、新供应商和新的客户要求。一条过去有效的方法，可能在这些条件下失效。\n\n员工应能够说明“这个建议为什么不适用”，并将实际修改关联到原任务。专业人员据此判断是资料错误、方法范围需要收窄，还是出现了值得发展的新经验。FDE再使修订进入后续调用，避免其他人继续取得旧答案。\n\n动态能力研究强调组织在变化中重新安排资源、保持能力相关性的必要性。原始研究 对企业来说，放大不只是让更多人复制旧办法，也包括让更多现场帮助改进共同办法。\n\n## 下一笔投入应当补在哪一段\n\n若销售仍频繁拿错材料，先改善资料和判断；若方案已经可靠，却大量等采购确认，就把资源用于履约衔接；若新场景不断产生错误，又没有人处理反馈，就先补纠错和方法维护。\n\n这三种情况都可能表现为“AI项目没有带来增长”，但需要的投入不同。把传播、执行和更新分别看清，再观察它们怎样连成客户结果，企业才不会只在最容易展示的生成环节不断加功能。\n"},{"file":"14-FDE的企业侧角色.md","id":"lesson-14","number":14,"role":"核心课","part":2,"title":"第14章｜FDE在企业里，究竟应该推动什么改变","md":"# 第14章｜FDE在企业里，究竟应该推动什么改变\n\n一家经销商提出需求：“做一个一键报价助手，最好输入客户材料就能生成报价。”如果只按这句话开发，团队可以很快做出整齐的报价文档。但真实客户可能仍然等不到可用方案，因为产品能否适配、供应商能否按时交付、谁有权确认价格，都还没有解决。\n\n[工业品报价教学案例](案例B-智能资源成本.md)提醒我们，功能愿望经常只是问题在某个岗位上的表现。FDE需要把愿望放回完整业务，理解企业怎样创造价值，再推动真正影响结果的改变。\n\n## 靠近现场，为什么需要工程能力\n\nFDE是Forward Deployed Engineer，通常译为前线部署工程师。不同机构的具体职责不同，共同特征是靠近实际问题和使用者，既能理解模糊需求，也能做原型、开发、连接系统并排查实际运行问题。\n\nPalantir对FDSE的官方职责描述涉及模糊问题、原型、代码和集成；AWS的共建安排也把生产系统与客户能力联系起来。这些是机构对自身岗位和服务的说明，不是一套适用于所有企业的统一标准。[Palantir](https://jobs.lever.co/palantir/84131e3f-455e-47fc-9c11-898d95f09048)、[AWS](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)\n\n对企业而言，关键不在于工程师是否每天坐在办公室，而在于现场认识能否直接进入实现。发现客户期限丢失后，能够修改当前工作入口；看到系统用旧价格报价后，能够连接有效价格来源；改完之后，还能追踪人员有没有采用、结果有没有改善。\n\n## 一笔询价可以怎样改变工程方向\n\nFDE可以先跟着销售处理一笔真实询价。客户要求三天内到货，销售收到照片和图纸，工程师提出候选，采购返回供货信息。逐步看下来，团队发现最耗时的并不是排版，而是大家反复寻找和补充同一组条件。\n\n第一版改造因此可以很小：让这笔询价有一个共同的材料入口，保留客户原要求，把候选与技术依据、当前库存、采购确认放在一起。AI协助整理冲突和缺项，人员确认关键事实后，再形成正式报价。\n\n使用中继续观察。如果专家仍反复找同一份产品说明，就改善资料组织；如果旧报价被当作现价，就修正事实来源与版本；如果报价发出后没人知道客户是否采用，就连接后续反馈。每一项改变都由实际业务断点引出，而不是为了把平台功能做全。\n\n## 发现问题不等于拥有所有决定权\n\nFDE可能发现，技术上可行的方案只有加急采购才能满足期限。这时可以把成本、交期和可选路线讲清楚，但是否承担加急成本、是否向客户收费，应由有权负责经营结果的人决定。\n\n工程师负责把决定实现，使工具能够查询、提示、记录和接续；专业人员负责适配等判断；业务负责人负责客户价值、资源和承诺。责任清楚，现场工程才能推进。若企业只让FDE接触资料，却不给业务人员时间，也没人处理跨岗位选择，项目很容易停在建议层面。\n\n![FDE使现场发现进入原型和集成，再由真实采用、动作与结果修订认识；企业负责人持续提供价值判断和资源。](assets/14-FDE现场循环.svg)\n\n图中的循环不是“不断增加功能”。它从一个具体解释出发，做出改变，让真实工作检验，再决定保留、修订或放弃。企业提供的判断和资源贯穿其中。\n\n## 更短的往返，怎样产生经营意义\n\n如果现场发现要经过多次需求转述、文档整理和长时间排期，原来为什么这样改的理由可能丢失，业务条件也可能变化。FDE能够在认识仍清楚时做出可用原型，再及时接回使用反馈，减少发现与实现之间的损耗。\n\n但速度应体现在有效的学习上。功能上线很快，却没有人使用，不能说明企业能力增长；使用很多次，却不知道客户结果，也无法判断是否值得继续。企业应能说清最近一轮改造使哪项判断更可靠、哪段工作更顺畅、什么认识因结果而改变。\n\n成熟软件已经覆盖的明确需求，可以常规实施；内部工程团队也可以承担同样的现场能力。FDE的价值不会由职位名称自动产生。值得企业长期保留的，是把自身有价值的差异理解清楚、做进生产，并持续改进的工程力量。\n","html":"\u003ch1>第14章｜FDE在企业里，究竟应该推动什么改变\u003c/h1>\n\u003cp>一家经销商提出需求：“做一个一键报价助手，最好输入客户材料就能生成报价。”如果只按这句话开发，团队可以很快做出整齐的报价文档。但真实客户可能仍然等不到可用方案，因为产品能否适配、供应商能否按时交付、谁有权确认价格，都还没有解决。\u003c/p>\n\u003cp>\u003ca href=\"#case-b\">工业品报价教学案例\u003c/a>提醒我们，功能愿望经常只是问题在某个岗位上的表现。FDE需要把愿望放回完整业务，理解企业怎样创造价值，再推动真正影响结果的改变。\u003c/p>\n\u003ch2 id=\"lesson-14-section-1\">靠近现场，为什么需要工程能力\u003c/h2>\n\u003cp>FDE是Forward Deployed Engineer，通常译为前线部署工程师。不同机构的具体职责不同，共同特征是靠近实际问题和使用者，既能理解模糊需求，也能做原型、开发、连接系统并排查实际运行问题。\u003c/p>\n\u003cp>Palantir对FDSE的官方职责描述涉及模糊问题、原型、代码和集成；AWS的共建安排也把生产系统与客户能力联系起来。这些是机构对自身岗位和服务的说明，不是一套适用于所有企业的统一标准。\u003ca href=\"https://jobs.lever.co/palantir/84131e3f-455e-47fc-9c11-898d95f09048\" target=\"_blank\" rel=\"noopener noreferrer\">Palantir\u003c/a>、\u003ca href=\"https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers\" target=\"_blank\" rel=\"noopener noreferrer\">AWS\u003c/a>\u003c/p>\n\u003cp>对企业而言，关键不在于工程师是否每天坐在办公室，而在于现场认识能否直接进入实现。发现客户期限丢失后，能够修改当前工作入口；看到系统用旧价格报价后，能够连接有效价格来源；改完之后，还能追踪人员有没有采用、结果有没有改善。\u003c/p>\n\u003ch2 id=\"lesson-14-section-2\">一笔询价可以怎样改变工程方向\u003c/h2>\n\u003cp>FDE可以先跟着销售处理一笔真实询价。客户要求三天内到货，销售收到照片和图纸，工程师提出候选，采购返回供货信息。逐步看下来，团队发现最耗时的并不是排版，而是大家反复寻找和补充同一组条件。\u003c/p>\n\u003cp>第一版改造因此可以很小：让这笔询价有一个共同的材料入口，保留客户原要求，把候选与技术依据、当前库存、采购确认放在一起。AI协助整理冲突和缺项，人员确认关键事实后，再形成正式报价。\u003c/p>\n\u003cp>使用中继续观察。如果专家仍反复找同一份产品说明，就改善资料组织；如果旧报价被当作现价，就修正事实来源与版本；如果报价发出后没人知道客户是否采用，就连接后续反馈。每一项改变都由实际业务断点引出，而不是为了把平台功能做全。\u003c/p>\n\u003ch2 id=\"lesson-14-section-3\">发现问题不等于拥有所有决定权\u003c/h2>\n\u003cp>FDE可能发现，技术上可行的方案只有加急采购才能满足期限。这时可以把成本、交期和可选路线讲清楚，但是否承担加急成本、是否向客户收费，应由有权负责经营结果的人决定。\u003c/p>\n\u003cp>工程师负责把决定实现，使工具能够查询、提示、记录和接续；专业人员负责适配等判断；业务负责人负责客户价值、资源和承诺。责任清楚，现场工程才能推进。若企业只让FDE接触资料，却不给业务人员时间，也没人处理跨岗位选择，项目很容易停在建议层面。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTkwIiB2aWV3Qm94PSIwIDAgMzYwIDU5MCIgcm9sZT0iaW1nIj48dGl0bGU+546w5Zy65LiO5bel56iL5oyB57ut5b6A6L+UPC90aXRsZT48ZGVzYz7njrDlnLrlj5HnjrDjgIHlj6/nlKjlrp7njrDjgIHnnJ/lrp7ph4fnlKjlkoznu5Pmnpzlj43ppojnm7jkupLov57mjqXvvIzkvIHkuJrmj5Dkvpvku7flgLzkuI7otYTmupDlronmjpLjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjU5MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7njrDlnLrkuI7lt6XnqIvmjIHnu63lvoDov5Q8L3RleHQ+PHJlY3QgeD0iMzIiIHk9Ijg2IiB3aWR0aD0iMjE4IiBoZWlnaHQ9Ijc0IiByeD0iNiIgZmlsbD0iI2VkZjNlZCIgc3Ryb2tlPSIjNjA3MzZjIiBzdHJva2Utd2lkdGg9IjEuNSIvPjx0ZXh0IHg9IjE0MS4wIiB5PSIxMTYuNSIgZm9udC1mYW1pbHk9IlBpbmdGYW5nIFNDLE1pY3Jvc29mdCBZYUhlaSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmaWxsPSIjMjEzNDJmIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXdlaWdodD0iNDAwIj7njrDlnLrlj5HnjrA8L3RleHQ+PHRleHQgeD0 :"# 第14章｜FDE在企业里，究竟应该推动什么改变\n\n一家经销商提出需求：“做一个一键报价助手，最好输入客户材料就能生成报价。”如果只按这句话开发，团队可以很快做出整齐的报价文档。但真实客户可能仍然等不到可用方案，因为产品能否适配、供应商能否按时交付、谁有权确认价格，都还没有解决。\n\n[工业品报价教学案例](#case-b)提醒我们，功能愿望经常只是问题在某个岗位上的表现。FDE需要把愿望放回完整业务，理解企业怎样创造价值，再推动真正影响结果的改变。\n\n## 靠近现场，为什么需要工程能力\n\nFDE是Forward Deployed Engineer，通常译为前线部署工程师。不同机构的具体职责不同，共同特征是靠近实际问题和使用者，既能理解模糊需求，也能做原型、开发、连接系统并排查实际运行问题。\n\nPalantir对FDSE的官方职责描述涉及模糊问题、原型、代码和集成；AWS的共建安排也把生产系统与客户能力联系起来。这些是机构对自身岗位和服务的说明，不是一套适用于所有企业的统一标准。[Palantir](https://jobs.lever.co/palantir/84131e3f-455e-47fc-9c11-898d95f09048)、[AWS](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)\n\n对企业而言，关键不在于工程师是否每天坐在办公室，而在于现场认识能否直接进入实现。发现客户期限丢失后，能够修改当前工作入口；看到系统用旧价格报价后，能够连接有效价格来源；改完之后，还能追踪人员有没有采用、结果有没有改善。\n\n## 一笔询价可以怎样改变工程方向\n\nFDE可以先跟着销售处理一笔真实询价。客户要求三天内到货，销售收到照片和图纸，工程师提出候选，采购返回供货信息。逐步看下来，团队发现最耗时的并不是排版，而是大家反复寻找和补充同一组条件。\n\n第一版改造因此可以很小：让这笔询价有一个共同的材料入口，保留客户原要求，把候选与技术依据、当前库存、采购确认放在一起。AI协助整理冲突和缺项，人员确认关键事实后，再形成正式报价。\n\n使用中继续观察。如果专家仍反复找同一份产品说明，就改善资料组织；如果旧报价被当作现价，就修正事实来源与版本；如果报价发出后没人知道客户是否采用，就连接后续反馈。每一项改变都由实际业务断点引出，而不是为了把平台功能做全。\n\n## 发现问题不等于拥有所有决定权\n\nFDE可能发现，技术上可行的方案只有加急采购才能满足期限。这时可以把成本、交期和可选路线讲清楚，但是否承担加急成本、是否向客户收费，应由有权负责经营结果的人决定。\n\n工程师负责把决定实现，使工具能够查询、提示、记录和接续；专业人员负责适配等判断；业务负责人负责客户价值、资源和承诺。责任清楚，现场工程才能推进。若企业只让FDE接触资料，却不给业务人员时间，也没人处理跨岗位选择，项目很容易停在建议层面。\n\n![FDE使现场发现进入原型和集成，再由真实采用、动作与结果修订认识；企业负责人持续提供价值判断和资源。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTkwIiB2aWV3Qm94PSIwIDAgMzYwIDU5MCIgcm9sZT0iaW1nIj48dGl0bGU+546w5Zy65LiO5bel56iL5oyB57ut5b6A6L+UPC90aXRsZT48ZGVzYz7njrDlnLrlj5HnjrDjgIHlj6/nlKjlrp7njrDjgIHnnJ/lrp7ph4fnlKjlkoznu5Pmnpzlj43ppojnm7jkupLov57mjqXvvIzkvIHkuJrmj5Dkvpvku7flgLzkuI7otYTmupDlronmjpLjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaG Tmlq3kuI7otYTmupA8L3RleHQ+PC9zdmc+)\n\n图中的循环不是“不断增加功能”。它从一个具体解释出发，做出改变，让真实工作检验，再决定保留、修订或放弃。企业提供的判断和资源贯穿其中。\n\n## 更短的往返，怎样产生经营意义\n\n如果现场发现要经过多次需求转述、文档整理和长时间排期，原来为什么这样改的理由可能丢失，业务条件也可能变化。FDE能够在认识仍清楚时做出可用原型，再及时接回使用反馈，减少发现与实现之间的损耗。\n\n但速度应体现在有效的学习上。功能上线很快，却没有人使用，不能说明企业能力增长；使用很多次，却不知道客户结果，也无法判断是否值得继续。企业应能说清最近一轮改造使哪项判断更可靠、哪段工作更顺畅、什么认识因结果而改变。\n\n成熟软件已经覆盖的明确需求，可以常规实施；内部工程团队也可以承担同样的现场能力。FDE的价值不会由职位名称自动产生。值得企业长期保留的，是把自身有价值的差异理解清楚、做进生产，并持续改进的工程力量。\n","exportSingleMd":"# 第14章｜FDE在企业里，究竟应该推动什么改变\n\n一家经销商提出需求：“做一个一键报价助手，最好输入客户材料就能生成报价。”如果只按这句话开发，团队可以很快做出整齐的报价文档。但真实客户可能仍然等不到可用方案，因为产品能否适配、供应商能否按时交付、谁有权确认价格，都还没有解决。\n\n[工业品报价教学案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-b)提醒我们，功能愿望经常只是问题在某个岗位上的表现。FDE需要把愿望放回完整业务，理解企业怎样创造价值，再推动真正影响结果的改变。\n\n## 靠近现场，为什么需要工程能力\n\nFDE是Forward Deployed Engineer，通常译为前线部署工程师。不同机构的具体职责不同，共同特征是靠近实际问题和使用者，既能理解模糊需求，也能做原型、开发、连接系统并排查实际运行问题。\n\nPalantir对FDSE的官方职责描述涉及模糊问题、原型、代码和集成；AWS的共建安排也把生产系统与客户能力联系起来。这些是机构对自身岗位和服务的说明，不是一套适用于所有企业的统一标准。[Palantir](https://jobs.lever.co/palantir/84131e3f-455e-47fc-9c11-898d95f09048)、[AWS](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)\n\n对企业而言，关键不在于工程师是否每天坐在办公室，而在于现场认识能否直接进入实现。发现客户期限丢失后，能够修改当前工作入口；看到系统用旧价格报价后，能够连接有效价格来源；改完之后，还能追踪人员有没有采用、结果有没有改善。\n\n## 一笔询价可以怎样改变工程方向\n\nFDE可以先跟着销售处理一笔真实询价。客户要求三天内到货，销售收到照片和图纸，工程师提出候选，采购返回供货信息。逐步看下来，团队发现最耗时的并不是排版，而是大家反复寻找和补充同一组条件。\n\n第一版改造因此可以很小：让这笔询价有一个共同的材料入口，保留客户原要求，把候选与技术依据、当前库存、采购确认放在一起。AI协助整理冲突和缺项，人员确认关键事实后，再形成正式报价。\n\n使用中继续观察。如果专家仍反复找同一份产品说明，就改善资料组织；如果旧报价被当作现价，就修正事实来源与版本；如果报价发出后没人知道客户是否采用，就连接后续反馈。每一项改变都由实际业务断点引出，而不是为了把平台功能做全。\n\n## 发现问题不等于拥有所有决定权\n\nFDE可能发现，技术上可行的方案只有加急采购才能满足期限。这时可以把成本、交期和可选路线讲清楚，但是否承担加急成本、是否向客户收费，应由有权负责经营结果的人决定。\n\n工程师负责把决定实现，使工具能够查询、提示、记录和接续；专业人员负责适配等判断；业务负责人负责客户价值、资源和承诺。责任清楚，现场工程才能推进。若企业只让FDE接触资料，却不给业务人员时间，也没人处理跨岗位选择，项目很容易停在建议层面。\n\n![FDE使现场发现进入原型和集成，再由真实采用、动作与结果修订认识；企业负责人持续提供价值判断和资源。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTkwIiB2aWV3Qm94PSIwIDAgMzYwIDU5MCIgcm 判断；业务负责人负责客户价值、资源和承诺。责任清楚，现场工程才能推进。若企业只让FDE接触资料，却不给业务人员时间，也没人处理跨岗位选择，项目很容易停在建议层面。\n\n \n\n图中的循环不是“不断增加功能”。它从一个具体解释出发，做出改变，让真实工作检验，再决定保留、修订或放弃。企业提供的判断和资源贯穿其中。\n\n## 更短的往返，怎样产生经营意义\n\n如果现场发现要经过多次需求转述、文档整理和长时间排期，原来为什么这样改的理由可能丢失，业务条件也可能变化。FDE能够在认识仍清楚时做出可用原型，再及时接回使用反馈，减少发现与实现之间的损耗。\n\n但速度应体现在有效的学习上。功能上线很快，却没有人使用，不能说明企业能力增长；使用很多次，却不知道客户结果，也无法判断是否值得继续。企业应能说清最近一轮改造使哪项判断更可靠、哪段工作更顺畅、什么认识因结果而改变。\n\n成熟软件已经覆盖的明确需求，可以常规实施；内部工程团队也可以承担同样的现场能力。FDE的价值不会由职位名称自动产生。值得企业长期保留的，是把自身有价值的差异理解清楚、做进生产，并持续改进的工程力量。\n"},{"file":"15-现场工作方法.md","id":"lesson-15","number":15,"role":"核心课","part":2,"title":"第15章｜原型怎样把问题暴露出来，而不只把演示做顺","md":"# 第15章｜原型怎样把问题暴露出来，而不只把演示做顺\n\n一家为工业品牌制作内容的团队试用AI写作原型。演示时，文章结构完整、语气专业，看上去已经可以替编辑分担很多工作。技术专家换用自己的产品材料后，却发现文章把一个型号的性能写到了另一个型号上。\n\n团队可以当场改掉这句话，使演示继续顺利进行。也可以沿着错误追查：正确资料有没有进入？两个型号为什么混在一起？以后如何避免同类错误继续流入客户稿件？后面这些问题，决定原型是否真正帮助企业认识工作。\n\n## 原型应检验一项具体改进设想\n\n在[工业品牌内容教学案例](案例D-专业服务.md)中，客户购买的是准确、可发布的产品材料。原流程包括找依据、写作、专家核验、修改和客户采用。即使初稿很快，后面若需要从头查错，最终交付仍可能没有改善。\n\n因此，一项有意义的原型设想可以是：把现行产品资料与草稿中的重要事实对应起来，使专家更少寻找依据、减少重复改写，同时保持最终质量。这个设想说明了要改变哪段工作，也说明了不能牺牲什么。\n\n原型应让专家用没有为演示预先整理好的材料，实际完成从准备到保存正式稿的过程。观察他在哪里停下来、去找什么、为什么另开旧工具，比只展示一次生成更能暴露缺口。\n\n## 同一个错误，可能需要完全不同的修复\n\n以型号性能混用为例。如果正确说明书根本没进入，首先需要改善资料取得；如果两个版本都进入了，却没有标明哪份有效，就要修正版本关系和呈现；如果资料清楚、模型仍用错，则需要调整任务、检查方式或使用范围。\n\n还有一种情况：专家已经在界面里改对，但系统保存到共享资料库的仍是旧草稿。下次生成再次引用旧稿，错误就会重新出现。这时修复一句话没有修复工作，修改必须进入正式保存和后续调用。\n\n这些区别不能仅凭错误结果猜测。FDE需要回到当次实际输入、输出和操作，确认问题在哪一步发生，再用相应的新任务检查修复。否则，每次都加一句“请注意准确”，可能只使提示词越来越长。\n\n## 顺畅的使用感，不等于完整任务更省力\n\n专家可能觉得起草很快，但之后花更多时间核实细节。编辑也可能更喜欢新界面，却仍在旧工具里完成关键工作。有关真实工作与主观省时的研究提醒我们，应把感受与完整任务表现分别观察。[任务研究](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)\n\n可以将同类材料的原工作过程保留为比较：原来怎样找资料、怎样核验、有哪些常见错误，新安排减少了哪些动作，又新增了什么。现成模板或资料整理本来能够改善的部分，也应如实认识。企业需要选择整体更好的工作安排，不必把每项收益都归给模型。\n\n如果专家从逐句重写变为只确认少数重要差别，才有理由进一步研究能否增加交付量。如果专家仍从头重做，下一步可能应缩小生成范围，或先改善资料，而不是立即推广给所有人。\n\n## 一次修改，要沿着工作继续走下去\n\n当团队确定某份产品资料过时，相关草稿、正式材料和后续检索都可能受影响。FDE应让旧版本不再作为默认依据，同时保留必要历史，使已经交付的内容能够追查。代表性任务也应包含这类版本差别，防止下一次换模型后错误回来。\n\n原型由此成为一种现场认识方法。最初以为问题是“写得慢”，使用后发现主要时间花在资料和核验，这不一定偏离目标。只要仍然围绕准确、及时的客户交付，问题认识变得更具体，下一轮投入就更有依据。\n\n一次原型结束，企业应能带走两类成果：一部分已经可用的工作改善，以及一部分被事实修正的认识。前者服务当前生产，后者帮助避免把尚未想清的问题过早固化成大系统。\n","html":"\u003ch1>第15章｜原型怎样把问题暴露出来，而不只把演示做顺\u003c/h1>\n\u003cp>一家为工业品牌制作内容的团队试用AI写作原型。演示时，文章结构完整、语气专业，看上去已经可以替编辑分担很多工作。技术专家换用自己的产品材料后，却发现文章把一个型号的性能写到了另一个型号上。\u003c/p>\n\u003cp>团队可以当场改掉这句话，使演示继续顺利进行。也可以沿着错误追查：正确资料有没有进入？两个型号为什么混在一起？以后如何避免同类错误继续流入客户稿件？后面这些问题，决定原型是否真正帮助企业认识工作。\u003c/p>\n\u003ch2 id=\"lesson-15-section-1\">原型应检验一项具体改进设想\u003c/h2>\n\u003cp>在\u003ca href=\"#case-d\">工业品牌内容教学案例\u003c/a>中，客户购买的是准确、可发布的产品材料。原流程包括找依据、写作、专家核验、修改和客户采用。即使初稿很快，后面若需要从头查错，最终交付仍可能没有改善。\u003c/p>\n\u003cp>因此，一项有意义的原型设想可以是：把现行产品资料与草稿中的重要事实对应起来，使专家更少寻找依据、减少重复改写，同时保持最终质量。这个设想说明了要改变哪段工作，也说明了不能牺牲什么。\u003c/p>\n\u003cp>原型应让专家用没有为演示预先整理好的材料，实际完成从准备到保存正式稿的过程。观察他在哪里停下来、去找什么、为什么另开旧工具，比只展示一次生成更能暴露缺口。\u003c/p>\n\u003ch2 id=\"lesson-15-section-2\">同一个错误，可能需要完全不同的修复\u003c/h2>\n\u003cp>以型号性能混用为例。如果正确说明书根本没进入，首先需要改善资料取得；如果两个版本都进入了，却没有标明哪份有效，就要修正版本关系和呈现；如果资料清楚、模型仍用错，则需要调整任务、检查方式或使用范围。\u003c/p>\n\u003cp>还有一种情况：专家已经在界面里改对，但系统保存到共享资料库的仍是旧草稿。下次生成再次引用旧稿，错误就会重新出现。这时修复一句话没有修复工作，修改必须进入正式保存和后续调用。\u003c/p>\n\u003cp>这些区别不能仅凭错误结果猜测。FDE需要回到当次实际输入、输出和操作，确认问题在哪一步发生，再用相应的新任务检查修复。否则，每次都加一句“请注意准确”，可能只使提示词越来越长。\u003c/p>\n\u003ch2 id=\"lesson-15-section-3\">顺畅的使用感，不等于完整任务更省力\u003c/h2>\n\u003cp>专家可能觉得起草很快，但之后花更多时间核实细节。编辑也可能更喜欢新界面，却仍在旧工具里完成关键工作。有关真实工作与主观省时的研究提醒我们，应把感受与完整任务表现分别观察。\u003ca href=\"https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">任务研究\u003c/a>\u003c/p>\n\u003cp>可以将同类材料的原工作过程保留为比较：原来怎样找资料、怎样核验、有哪些常见错误，新安排减少了哪些动作，又新增了什么。现成模板或资料整理本来能够改善的部分，也应如实认识。企业需要选择整体更好的工作安排，不必把每项收益都归给模型。\u003c/p>\n\u003cp>如果专家从逐句重写变为只确认少数重要差别，才有理由进一步研究能否增加交付量。如果专家仍从头重做，下一步可能应缩小生成范围，或先改善资料，而不是立即推广给所有人。\u003c/p>\n\u003ch2 id=\"lesson-15-section-4\">一次修改，要沿着工作继续走下去\u003c/h2>\n\u003cp>当团队确定某份产品资料过时，相关草稿、正式材料和后续检索都可能受影响。FDE应让旧版本不再作为默认依据，同时保留必要历史，使已经交付的内容能够追查。代表性任务也应包含这类版本差别，防止下一次换模型后错误回来。\u003c/p>\n\u003cp>原型由此成为一种现场认识方法。最初以为问题是“写得慢”，使用后发现主要时间花在资料和核验，这不一定偏离目标。只要仍然围绕准确、及时的客户交付，问题认识变得更具体，下一轮投入就更有依据。\u003c/p>\n\u003cp>一次原型结束，企业应能带走两类成果：一部分已经可用的工作改善，以及一部分被事实修正的认识。前者服务当前生产，后者帮助避免把尚未想清的问题过早固化成大系统。\u003c/p>\n","headings":[{"id":"lesson-15-section-1","label":"原型应检验一项具体改进设想"},{"id":"lesson-15-section-2","label":"同一个错误，可能需要完全不同的修复"},{"id":"lesson-15-section-3","label":"顺畅的使用感，不等于完整任务更省力"},{"id":"lesson-15-section-4","label":"一次修改，要沿着工作继续走下去"}],"exportMd":"# 第15章｜原型怎样把问题暴露出来，而不只把演示做顺\n\n一家为工业品牌制作内容的团队试用AI写作原型。演示时，文章结构完整、语气专业，看上去已经可以替编辑分担很多工作。技术专家换用自己的产品材料后，却发现文章把一个型号的性能写到了另一个型号上。\n\n团队可以当场改掉这句话，使演示继续顺利进行。也可以沿着错误追查：正确资料有没有进入？两个型号为什么混在一起？以后如何避免同类错误继续流入客户稿件？后面这些问题，决定原型是否真正帮助企业认识工作。\n\n## 原型应检验一项具体改进设想\n\n在[工业品牌内容教学案例](#case-d)中，客户购买的是准确、可发布的产品材料。原流程包括找依据、写作、专家核验、修改和客户采用。即使初稿很快，后面若需要从头查错，最终交付仍可能没有改善。\n\n因此，一项有意义的原型设想可以是：把现行产品资料与草稿中的重要事实对应起来，使专家更少寻找依据、减少重复改写，同时保持最终质量。这个设想说明了要改变哪段工作，也说明了不能牺牲什么。\n\n原型应让专家用没有为演示预先整理好的材料，实际完成从准备到保存正式稿的过程。观察他在哪里停下来、去找什么、为什么另开旧工具，比只展示一次生成更能暴露缺口。\n\n## 同一个错误，可能需要完全不同的修复\n\n以型号性能混用为例。如果正确说明书根本没进入，首先需要改善资料取得；如果两个版本都进入了，却没有标明哪份有效，就要修正版本关系和呈现；如果资料清楚、模型仍用错，则需要调整任务、检查方式或使用范围。\n\n还有一种情况：专家已经在界面里改对，但系统保存到共享资料库的仍是旧草稿。下次生成再次引用旧稿，错误就会重新出现。这时修复一句话没有修复工作，修改必须进入正式保存和后续调用。\n\n这些区别不能仅凭错误结果猜测。FDE需要回到当次实际输入、输出和操作，确认问题在哪一步发生，再用相应的新任务检查修复。否则，每次都加一句“请注意准确”，可能只使提示词越来越长。\n\n## 顺畅的使用感，不等于完整任务更省力\n\n专家可能觉得起草很快，但之后花更多时间核实细节。编辑也可能更喜欢新界面，却仍在旧工具里完成关键工作。有关真实工作与主观省时的研究提醒我们，应把感受与完整任务表现分别观察。[任务研究](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)\n\n可以将同类材料的原工作过程保留为比较：原来怎样找资料、怎样核验、有哪些常见错误，新安排减少了哪些动作，又新增了什么。现成模板或资料整理本来能够改善的部分，也应如实认识。企业需要选择整体更好的工作安排，不必把每项收益都归给模型。\n\n如果专家从逐句重写变为只确认少数重要差别，才有理由进一步研究能否增加交付量。如果专家仍从头重做，下一步可能应缩小生成范围，或先改善资料，而不是立即推广给所有人。\n\n## 一次修改，要沿着工作继续走下去\n\n当团队确定某份产品资料过时，相关草稿、正式材料和后续检索都可能受影响。FDE应让旧版本不再作为默认依据，同时保留必要历史，使已经交付的内容能够追查。代表性任务也应包含这类版本差别，防止下一次换模型后错误回来。\n\n原型由此成为一种现场认识方法。最初以为问题是“写得慢”，使用后发现主要时间花在资料和核验，这不一定偏离目标。只要仍然围绕准确、及时的客户交付，问题认识变得更具体，下一轮投入就更有依据。\n\n一次原型结束，企业应能带走两类成果：一部分已经可用的工作改善，以及一部分被事实修正的认识。前者服务当前生产，后者帮助避免把尚未想清的问题过早固化成大系统。\n","exportSingleMd":"# 第15章｜原型怎样把问题暴露出来，而不只把演示做顺\n\n一家为工业品牌制作内容的团队 果，否则一个销售数字仍可能掩盖不同原因。\n\n这两家店还共用生产和配送资源。X店增加销售是否以挤占Y店或其他商品为代价，也需要一起观察。把原来属于其他业务的销售搬到试点里，不能当作企业净增长。\n\n## 试点结果应当改变后续行动\n\n如果实际购买不足以覆盖新增成本，企业可以保留较简单的重新分配方案。如果需求存在、配送却频繁错过时段，下一步应改履约安排。如果需求、品质和执行都有依据，再考虑更多日期和门店，研究方法能否由其他人员接续。\n\n自动日报可能同样值得做，但它的价值应按节省的整理劳动和提高的信息可用性评价，不能假装已经回答了补货投资。全网自主排产也可能是后续方向，只是起步太大时，许多变量同时变化，团队更难知道哪里有效。\n\n试点范围应小到能够认真执行，又大到能接触决定价值的关系。只测模型预测、不让商品真正到店，就没有测到这项经营选择；一下改变全网，又可能付出过高成本才发现基础假设不成立。\n\n## 学习的价值，需要落实为更好的决定\n\n开始前应约定本轮投入、负责人和复查时点，并说明哪些结果会支持扩大，哪些结果会导致修改或停止。这样，结束时才能判断是否减少了关键未知，而不是无论结果怎样都说“有收获”。\n\n探索与利用研究讨论了尝试新办法和改善现有办法之间的资源竞争。[原始研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf) 企业既需要争取新机会，也需要限制无止境试验对当前经营的占用。\n\n对这家连锁，一个有价值的结论可以是扩产值得，也可以是只改分配更合算，或者配送才是下一步应投的地方。只要结论来自实际观察，并改变后续资源安排，试点就完成了它应承担的学习工作。\n","html":"\u003ch1>第16章｜先试什么，才会改变下一笔投资\u003c/h1>\n\u003cp>一家烘焙连锁已经发现，交通枢纽附近的门店提前卖完主打点心，工坊在相关时段又有生产余量。团队提出了几个项目：自动整理销售日报、试行下午补货，或者直接建设覆盖全部门店的智能排产。\u003c/p>\n\u003cp>这几个项目都与问题有关，却回答不同的问题。日报主要减少整理劳动；补货可以帮助判断未满足需求是否值得争取；全网排产则涉及更多商品、门店和资源。选择试点时，需要先知道哪项未知最影响下一笔投入。\u003c/p>\n\u003ch2 id=\"lesson-16-section-1\">先把要作出的选择说清楚\u003c/h2>\n\u003cp>在\u003ca href=\"#case-a\">连锁烘焙教学案例\u003c/a>中，X店原来配80份、卖完80份，Y店配80份、卖出60份。企业至少有两种改善选择：把总产量160份重新分成X100、Y60；或者把总产量提高到220份，X160、Y60，并增加补货安排。\u003c/p>\n\u003cp>第一种主要修正两店分配，不要求增加总产量。第二种争取更多增长，但需要多生产60份，并支付新增配送和AI整理费用。第二种是否更好，取决于多出来的商品到底能卖多少，而不是取决于系统能否给出一个更大的预测数。\u003c/p>\n\u003cp>案例假设每份生产变动成本4元、售价12元，第二种方案另增加80元日常支出。因此，相对第一种方案，多生产60份先增加240元成本，加上80元，共增加320元。每多卖一份取得12元收入，至少多卖27份，新增收入才会超过320元。也就是说，X店总销量至少达到127份，扩产补货才优于只改分配。\u003c/p>\n\u003cp>这个推导把“可能有增长”变成了可判断的问题：当前只知道X卖到80份就没货了，还不知道它能否卖到127份以上。案例中用于比较的160份需求，是教学算账条件，不是仅凭售罄就已经证实的需求。\u003c/p>\n\u003ch2 id=\"lesson-16-section-2\">试点应让关键条件真正发生\u003c/h2>\n\u003cp>先核实工坊是否确有可用时间、原料和人员，下午制作的品质能否保持，配送能否赶上销售时段。如果这些条件不成立，即使顾客愿意买，扩产方案也不能按设想执行。\u003c/p>\n\u003cp>在可承受范围内尝试追加供给时，再记录实际到店、上架、推介、预订和成交。若增加的商品直到营业快结束才到店，销售少不一定说明需求不足；若货到得及时却仍大量剩余，就需要重新考察需求和商品选择。过程记录帮助解释结果，否则一个销售数字仍可能掩盖不同原因。\u003c/p>\n\u003cp>这两家店还共用生产和配送资源。X店增加销售是否以挤占Y店或其他商品为代价，也需要一起观察。把原来属于其他业务的销售搬到试点里，不能当作企业净增长。\u003c/p>\n\u003ch2 id=\"lesson-16-section-3\">试点结果应当改变后续行动\u003c/h2>\n\u003cp>如果实际购买不足以覆盖新增成本，企业可以保留较简单的重新分配方案。如果需求存在、配送却频繁错过时段，下一步应改履约安排。如果需求、品质和执行都有依据，再考虑更多日期和门店，研究方法能否由其他人员接续。\u003c/p>\n\u003cp>自动日报可能同样值得做，但它的价值应按节省的整理劳动和提高的信息可用性评价，不能假装已经回答了补货投资。全网自主排产也可能是后续方向，只是起步太大时，许多变量同时变化，团队更难知道哪里有效。\u003c/p>\n\u003cp>试点范围应小到能够认真执行，又大到能接触决定价值的关系。只测模型预测、不让商品真正到店，就没有测到这项经营选择；一下改变全网，又可能付出过高成本才发现基础假设不成立。\u003c/p>\n\u003ch2 id=\"lesson-16-section-4\">学习的价值，需要落实为更好的决定\u003c/h2>\n\u003cp>开始前应约定本轮投入、负责人和复查时点，并说明哪些结果会支持扩大，哪些结果会导致修改或停止。这样，结束时才能判断是否减少了关键未知，而不是无论结果怎样都说“有收获”。\u003c/p>\n\u003cp>探索与利用研究讨论了尝试新办法和改善现有办法之间的资源竞争。\u003ca href=\"https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a> 企业既需要争取新机会，也需要限制无止境试验对当前经营的占用。\u003c/p>\n\u003cp>对这家连锁，一个有价值的结论可以是扩产值得，也可以是只改分配更合算，或者配送才是下一步应投的地方。只要结论来自实际观察，并改变后续资源安排，试点就完成了它应承担的学习工作。\u003c/p>\n","headings":[{"id":"lesson-16-section-1","label":"先把要作出的选择说清楚"},{"id":"lesson-16-section-2","label":"试点应让关键条件真正发生"},{"id":"lesson-16-section-3","label":"试点结果应当改变后续行动"},{"id":"lesson-16-section-4","label":"学习的价值，需要落实为更好的决定"}],"exportMd":"# 第16章｜先试什么，才会改变下一笔投资\n\n一家烘焙连锁已经发现，交通枢纽附近的门店提前卖完主打点心，工坊在相关时段又有生产余量。团队提出了几个项目：自动整理销售日报、试行下午补货，或者直接建设覆盖全部门店的智能排产。\n\n这几个项目都与问题有关，却回答不同的问题。日报主要减少整理劳动；补货可以帮助判断未满足需求是否值得争取；全网排产则涉及更多商品、门店和资源。选择试点时，需要先知道哪项未知最影响下一笔投入。\n\n## 先把要作出的选择说清楚\n\n在[连锁烘焙教学案例](#case-a)中，X店原来配80份、卖完80份，Y店配80份、卖出60份。企业至少有两种改善选择：把总产量160份重新分成X100、Y60；或者把总产量提高到220份，X160、Y60，并增加补货安排。\n\n第一种主要修正两店分配，不要求增加总产量。第二种争取更多增长，但需要多生产60份，并支付新增配送和AI整理费用。第二种是否更好，取决于多出来的商品到底能卖多少，而不是取决于系统能否给出一个更大的预测数。\n\n案例假设每份生产变动成本4元、售价12元，第二种方案另增加80元日常支出。因此，相对第一种方案，多生产60份先增加240元成本，加上80元，共增加320元。每多卖一份取得12元收入，至少多卖27份，新增收入才会超过320元。也就是说，X店总销量至少达到127份，扩产补货才优于只改分配。\n\n这个推导把“可能有增长”变成了可判断的问题：当前只知道X卖到80份就没货了，还不知道它能否卖到127份以上。案例中用于比较的160份需求，是教学算账条件，不是仅凭售罄就已经证实的需求。\n\n## 试点应让关键条件真正发生\n\n先核实工坊是否确有可用时间、原料和人员，下午制作的品质能否保持，配送能否赶上销售时段。如果这些条件不成立，即使顾客愿意买，扩产方案也不能按设想执行。\n\n在可承受范围内尝试追加供给时，再记录实际到店、上架、推介、预订和成交。若增加的商品直到营业快结束才到店，销售少不一定说明需求不足；若货到得及时却仍大量剩余，就需要重新考察需求和商品选择。过程记录帮助解释结果，否则一个销售数字仍可能掩盖不同原因。\n\n这两家店还共用生产和配送资源。X店增加销售是否以挤占Y店或其他商品为代价，也需要一起观察。把原来属于其他业务的销售搬到试点里，不能当作企业净增长。\n\n## 试点结果应当改变后续行动\n\n如果实际购买不足以覆盖新增成本，企业可以保留较简单的重新分配方案。如果需求存在、配送却频繁错过时段，下一步应改履约安排。如果需求、品质和执行都有依据，再考虑更多日期和门店，研究方法能否由其他人员接续。\n\n自动日报可能同样值得做，但它的价值应按节省的整理劳动和提高的信息可用性评价，不能假装已经回答了补货投资。全网自主排产也可能是后续方向，只是起步太大时，许多变量同时变化，团队更难知道哪里有效。\n\n试点范围应小到能够认真执行，又大到能接触决定价值的关系。只测模型预测、不让商品真正到店，就没有测到这项经营选择；一下改变全网，又可能付出过高成本才发现基础假设不成立。\n\n## 学习的价值，需要落实为更好的决定\n\n开始前应约定本轮投入、负责人和复查时点，并说明哪些结果会支持扩大，哪些结果会导致修改或停止。这样，结束时才能判断是否减少了关键未知，而不是无论结果怎样都说“有收获”。\n\n探索与利用研究讨论了尝试新办法和改善现有办法之间的资源竞争。[原始研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf) 企业既需要争取新机会，也需要限制无止境试验对当前经营的占用。\n\n对这家连锁，一个有价值的结论可以是扩产值得，也可以是只改分配更合算，或者配送才是下一步应投的地方。只要结论来自实际观察，并改变后续资源安排，试点就完成了它应承担的学习工作。\n","exportSingleMd":"# 第16章｜先试什么，才会改变下一笔投资\n\n一家烘焙连锁已经发现，交通枢纽附近的门店提前卖完主打点心，工坊在相关时段又有生产余量。团队提出了几个项目：自动整理销售日报、试行下午补货，或者直接建设覆盖全部门店的智能排产。\n\n这几个项目都与问题有关，却回答不同的问题。日报主要减少整理劳动；补货可以帮助判断未满足需求是否值得争取；全网排产则涉及更多商品、门店和资源。选择试点时，需要先知道哪项未知最影响下一笔投入。\n\n## 先把要作出的选择说清楚\n\n在[连锁烘焙教学案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-a)中，X店原来配80份、卖完80份，Y店配80份、卖出60份。企业至少有两种改善选择：把总产量160份重新分成X100、Y60；或者把总产量提高到220份，X160、Y60，并增加补货安排。\n\n第一种主要修正两店分配，不要求增加总产量。第二种争取更多增长，但需要多生产60份，并支付新增配送和AI整理费用。第二种是否更好，取决于多出来的商品到底能卖多少，而不是取决于系统能否给出一个更大的预测数。\n\n案例假设每份生产变动成本4元、售价12元，第二种方案另增加80元日常支出。因此，相对第一种方案，多生产60份先增加240元成本，加上80元，共增加320元。每多卖一份取得12元收入，至少多卖27份，新增收入才会超过320元。也就是说，X店总销量至少达到127份，扩产补货才优于只改分配。\n\n这个推导把“可能有增长”变成了可判断的问题：当前只知道X卖到80份就没货了，还不知道它能否卖到127份以上。案例中用于比较的160份需求，是教学算账条件，不是仅凭售罄就已经证实的需求。\n\n## 试点应让关键条件真正发生\n\n先核实工坊是否确有可用时间、原料和人员，下午制作的品质能否保持，配送能否赶上销售时段。如果这些条件不成立，即使顾客愿意买，扩产方案也不能按设想执行。\n\n在可承受范围内尝试追加供给时，再记录实际到店、上架、推介、预订和成交。若增加的商品直到营业快结束才到店，销售少不一定说明需求不足；若货到得及时却仍大量剩余，就需要重新考察需求和商品选择。过程记录帮助解释结果，否则一个销售数字仍可能掩盖不同原因。\n\n这两家店还共用生产和配送资源。X店增加销售是否以挤占Y店或其他商品为代价，也需要一起观察。把原来属于其他业务的销售搬到试点里，不能当作企业净增长。\n\n## 试点结果应当改变后续行动\n\n如果实际购买不足以覆盖新增成本，企业可以保留较简单的重新分配方案。如果需求存在、配送却频繁错过时段，下一步应改履约安排。如果需求、品质和执行都有依据，再考虑更多日期和门店，研究方法能否由其他人员接续。\n\n自动日报可能同样值得做，但它的价值应按节省的整理劳动和提高的信息可用性评价，不能假装已经回答了补货投资。全网自主排产也可能是后续方向，只是起步太大时，许多变量同时变化，团队更难知道哪里有效。\n\n试点范围应小到能够认真执行，又大到能接触决定价值的关系。只测模型预测、不让商品真正到店，就没有测到这项经营选择；一下改变全网，又可能付出过高成本才发现基础假设不成立。\n\n## 学习的价值，需要落实为更好的决定\n\n开始前应约定本轮投入、负责人和复查时点，并说明哪些结果会支持扩大，哪些结果会导致修改或停止。这样，结束时才能判断是否减少了关键未知，而不是无论结果怎样都说“有收获”。\n\n探索与利用研究讨论了尝试新办法和改善现有办法之间的资源竞争。[原始研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf) 企业既需要争取新机会，也需要限制无止境试验对当前经营的占用。\n\n对这家连锁，一个有价值的结论可以是扩产值得，也可以是只改分配更合算，或者配送才是下一步应投的地方。只要结论来自实际观察，并改变后续资源安排，试点就完成了它应承担的学习工作。\n","text":"# 第16章｜先试什么，才会改变下一笔投资\n\n一家烘焙连锁已经发现，交通枢纽附近的门店提前卖完主打点心，工坊在相关时段又有生产余量。团队提出了几个项目：自动整理销售日报、试行下午补货，或者直接建设覆盖全部门店的智能排产。\n\n这几个项目都与问题有关，却回答不同的问题。日报主要减少整理劳动；补货可以帮助判断未满足需求是否值得争取；全网排产则涉及更多商品、门店和资源。选择试点时，需要先知道哪项未知最影响下一笔投入。\n\n## 先把要作出的选择说清楚\n\n在连锁烘焙教学案例中，X店原来配80份、卖完80份，Y店配80份、卖出60份。企业至少有两种改善选择：把总产量160份重新分成X100、Y60；或者把总产量提高到220份，X160、Y60，并增加补货安排。\n\n第一种主要修正两店分配，不要求增加总产量。第二种争取更多增长，但需要多生产60份，并支付新增配送和AI整理费用。第二种是否更好，取决于多出来的商品到底能卖多少，而不是取决于系统能否给出一个更大的预测数。\n\n案例假设每份生产变动成本4元、售价12元，第二种方案另增加80元日常支出。因此，相对第一种方案，多生产60份先增加240元成本，加上80元，共增加320元。每多卖一份取得12元收入，至少多卖27份，新增收入才会超过320元。也就是说，X店总销量至少达到127份，扩产补货才优于只改分配。\n\n这个推导把“可能有增长”变成了可判断的问题：当前只知道X卖到80份就没货了，还不知道它能否卖到127份以上。案例中用于比较的160份需求，是教学算账条件，不是仅凭售罄就已经证实的需求。\n\n## 试点应让关键条件真正发生\n\n先核实工坊是否确有可用时间、原料和人员，下午制作的品质能否保持，配送能否赶上销售时段。如果这些条件不成立，即使顾客愿意买，扩产方案也不能按设想执行。\n\n在可承受范围内尝试追加供给时，再记录实际到店、上架、推介、预订和成交。若增加的商品直到营业快结束才到店，销售少不一定说明需求不足；若货到得及时却仍大量剩余，就需要重新考察需求和商品选择。过程记录帮助解释结果，否则一个销售数字仍可能掩盖不同原因。\n\n这两家店还共用生产和配送资源。X店增加销售是否以挤占Y店或其他商品为代价，也需要一起观察。把原来属于其他业务的销售搬到试点里，不能当作企业净增长。\n\n## 试点结果应当改变后续行动\n\n如果实际购买不足以覆盖新增成本，企业可以保留较简单的重新分配方案。如果需求存在、配送却频繁错过时段，下一步应改履约安排。如果需求、品质和执行都有依据，再考虑更多日期和门店，研究方法能否由其他人员接续。\n\n自动日报可能同样值得做，但它的价值应按节省的整理劳动和提高的信息可用性评价，不能假装已经回答了补货投资。全网自主排产也可能是后续方向，只是起步太大时，许多变量同时变化，团队更难知道哪里有效。\n\n试点范围应小到能够认真执行，又大到能接触决定价值的关系。只测模型预测、不让商品真正到店，就没有测到这项经营选择；一下改变全网，又可能付出过高成本才发现基础假设不成立。\n\n## 学习的价值，需要落实为更好的决定\n\n开始前应约定本轮投入、负责人和复查时点，并说明哪些结果会支持扩大，哪些结果会导致修改或停止。这样，结束时才能判断是否减少了关键未知，而不是无论结果怎样都说“有收获”。\n\n探索与利用研究讨论了尝试新办法和改善现有办法之间的资源竞争。原始研究 企业既需要争取新机会，也需要限制无止境试验对当前经营的占用。\n\n对这家连锁，一个有价值的结论可以是扩产值得，也可以是只改分配更合算，或者配送才是下一步应投的地方。只要结论来自实际观察，并改变后续资源安排，试点就完成了它应承担的学习工作。\n"},{"file":"17-智能伙伴的持续职责.md","id":"lesson-17","number":17,"role":"核心课","part":3,"title":"第17章｜AI怎样从回答一次，变成接续一项工作","md":"# 第17章｜AI怎样从回答一次，变成接续一项工作\n\n客户上午发来设备故障描述，技术员下午补充现场操作，第二天客户又报告问题复发。如果每条消息都重新交给AI，员工就要反复解释同一台设备、同一次问题和已经做过什么。AI即使每次都答得不错，企业仍承担着把这些回答拼成工作过程的劳动。\n\n把AI作为智能伙伴，首先意味着它能够在明确范围内接续同一项工作。这里的“伙伴”不是给聊天机器人取一个名字，而是让它取得当前事实，记住未完成事项，在新情况出现时继续推进。\n\n## 先给它一项能够判断完成与否的职责\n\n在[设备售后教学案例](案例C-设备售后.md)中，可以从“准备派工前材料”开始。使用者是派工人员和技术员，所需成果是一份能支持出发决定的材料：哪台设备、什么版本、客户描述、过去处理、缺少哪些关键条件，以及需要带什么或向谁确认。\n\n收到报修以后，AI查找同一设备的历史记录。如果发现过去的工单没有说明实际动作，就提出补问；如果设备版本与旧方法不同，就将差异交给专业人员。新材料回来后，它更新当前准备情况，使派工人员知道还缺什么，而不是再次从头读一遍聊天。\n\n这项职责比“负责售后”小得多，但已经有实际价值。它减少重复解释，也让下一位同事能够在较完整的条件下行动。是否扩大到跟进派工和复访，可以等这一段表现稳定后再决定。\n\n## 一次对话结束以后，工作靠什么继续\n\n模型本身不会因为说了“我会持续跟进”，就自动在第二天醒来检查。持续工作需要系统提供几项条件：同一工单有稳定身份，已有经过保存下来，新消息或约定检查可以触发下一轮，AI能够使用相应查询和记录工具。\n\n例如，客户补来新照片时，系统识别它属于原工单，把当前材料和未完成事项一并交给AI。AI据此判断是否补齐了版本信息，更新记录，然后把仍需专家确认的问题交出去。等待期间不必保持一段永不停歇的对话；下一次有新情况时，再从已保存状态继续。\n\n![同一工单保持身份与经过，当前事实和相关经验支持下一步判断，行动结果返回任务；记录持久不等于模型参数自动学习。](assets/17-智能伙伴.svg)\n\n图中的返回箭头表示任务结果进入下一次工作。它不是说模型每处理一张工单就自动改变自身训练参数。企业的连续经验通常先体现在可保存、可调用和可修订的材料与方法里。\n\n## 能主动做什么，应与业务责任相配\n\nAI可以整理缺项、查询资料、提醒等待、起草派工材料；是否可以直接创建派工、修改客户承诺，则需要企业明确授权和条件。范围不清楚时，系统可能把建议当成决定，也可能每一步都等待人工，失去接续价值。\n\n人的参与应有具体作用。例如专家确认版本差异，负责人决定特殊成本，技术员回报现场结果。只是把所有输出都加一个“确认”按钮，并没有说明确认者要核什么，也不保证有人真正承担判断。\n\nAgent工程通常将模型、工具与环境反馈组织成连续工作。[工程材料](https://www.anthropic.com/research/building-effective-agents) 企业需要做的是把这种机制落实到真实对象和职责，使每次动作都能知道作用于哪项任务、发生了什么、下一步由谁继续。\n\n## 持续接续，也可以帮助企业产生新认识\n\n当AI能够把一台设备的多次报修连起来，就可能发现原来的“成功维修”后来反复出现问题。它可以将不同版本、操作和结果整理供人员比较，提出需要核实的差别。专业人员安排观察，后续结果再改变共同方法。\n\n这样，AI既协助当前服务，也参与企业对自身业务的持续理解。它能否成为有用伙伴，应看未完成事项是否被接住，变化是否影响下一步，其他岗位是否取得更可用的材料，以及实际结果有没有回来。\n\n企业从一项小而完整的职责开始，逐步扩大可靠的委派范围，才有机会形成长期协作。持续性由工作是否接得上来证明，而不是由回答是否显得像一个人在思考来证明。\n","html":"\u003ch1>第17章｜AI怎样从回答一次，变成接续一项工作\u003c/h1>\n\u003cp>客户上午发来设备故障描述，技术员下午补充现场操作，第二天客户又报告问题复发。如果每条消息都重新交给AI，员工就要反复解释同一台设备、同一次问题和已经做过什么。AI即使每次都答得不错，企业仍承担着把这些回答拼成工作过程的劳动。\u003c/p>\n\u003cp>把AI作为智能伙伴，首先意味着它能够在明确范围内接续同一项工作。这里的“伙伴”不是给聊天机器人取一个名字，而是让它取得当前事实，记住未完成事项，在新情况出现时继续推进。\u003c/p>\n\u003ch2 id=\"lesson-17-section-1\">先给它一项能够判断完成与否的职责\u003c/h2>\n\u003cp>在\u003ca href=\"#case-c\">设备售后教学案例\u003c/a>中，可以从“准备派工前材料”开始。使用者是派工人员和技术员，所需成果是一份能支持出发决定的材料：哪台设备、什么版本、客户描述、过去处理、缺少哪些关键条件，以及需要带什么或向谁确认。\u003c/p>\n\u003cp>收到报修以后，AI查找同一设备的历史记录。如果发现过去的工单没有说明实际动作，就提出补问；如果设备版本与旧方法不同，就将差异交给专业人员。新材料回来后，它更新当前准备情况，使派工人员知道还缺什么，而不是再次从头读一遍聊天。\u003c/p>\n\u003cp>这项职责比“负责售后”小得多，但已经有实际价值。它减少重复解释，也让下一位同事能够在较完整的条件下行动。是否扩大到跟进派工和复访，可以等这一段表现稳定后再决定。\u003c/p>\n\u003ch2 id=\"lesson-17-section-2\">一次对话结束以后，工作靠什么继续\u003c/h2>\n\u003cp>模型本身不会因为说了“我会持续跟进”，就自动在第二天醒来检查。持续工作需要系统提供几项条件：同一工单有稳定身份，已有经过保存下来，新消息或约定检查可以触发下一轮，AI能够使用相应查询和记录工具。\u003c/p>\n\u003cp>例如，客户补来新照片时，系统识别它属于原工单，把当前材料和未完成事项一并交给AI。AI据此判断是否补齐了版本信息，更新记录，然后把仍需专家确认的问题交出去。等待期间不必保持一段永不停歇的对话；下一次有新情况时，再从已保存状态继续。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTAwIiB2aWV3Qm94PSIwIDAgMzYwIDUwMCIgcm9sZT0iaW1nIj48dGl0bGU+5oyB57ut5bel5L2c5Zu057uV5ZCM5LiA5Lu75YqhPC90aXRsZT48ZGVzYz7lvZPliY3lt6XljZXkv53mjIHouqvku73kuI7nu4/ov4fvvJvkv6Hmga/jgIHliqjkvZzjgIHnu5Pmnpzov5vlhaXlkIzkuIDmjIHnu63ku7vliqHvvIznu5Pmnpzlj43ppojmlLnlj5jkuIvkuIDmraXjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmV 工，失去接续价值。\u003c/p>\n\u003cp>人的参与应有具体作用。例如专家确认版本差异，负责人决定特殊成本，技术员回报现场结果。只是把所有输出都加一个“确认”按钮，并没有说明确认者要核什么，也不保证有人真正承担判断。\u003c/p>\n\u003cp>Agent工程通常将模型、工具与环境反馈组织成连续工作。\u003ca href=\"https://www.anthropic.com/research/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">工程材料\u003c/a> 企业需要做的是把这种机制落实到真实对象和职责，使每次动作都能知道作用于哪项任务、发生了什么、下一步由谁继续。\u003c/p>\n\u003ch2 id=\"lesson-17-section-4\">持续接续，也可以帮助企业产生新认识\u003c/h2>\n\u003cp>当AI能够把一台设备的多次报修连起来，就可能发现原来的“成功维修”后来反复出现问题。它可以将不同版本、操作和结果整理供人员比较，提出需要核实的差别。专业人员安排观察，后续结果再改变共同方法。\u003c/p>\n\u003cp>这样，AI既协助当前服务，也参与企业对自身业务的持续理解。它能否成为有用伙伴，应看未完成事项是否被接住，变化是否影响下一步，其他岗位是否取得更可用的材料，以及实际结果有没有回来。\u003c/p>\n\u003cp>企业从一项小而完整的职责开始，逐步扩大可靠的委派范围，才有机会形成长期协作。持续性由工作是否接得上来证明，而不是由回答是否显得像一个人在思考来证明。\u003c/p>\n","headings":[{"id":"lesson-17-section-1","label":"先给它一项能够判断完成与否的职责"},{"id":"lesson-17-section-2","label":"一次对话结束以后，工作靠什么继续"},{"id":"lesson-17-section-3","label":"能主动做什么，应与业务责任相配"},{"id":"lesson-17-section-4","label":"持续接续，也可以帮助企业产生新认识"}],"exportMd":"# 第17章｜AI怎样从回答一次，变成接续一项工作\n\n客户上午发来设备故障描述，技术员下午补充现场操作，第二天客户又报告问题复发。如果每条消息都重新交给AI，员工就要反复解释同一台设备、同一次问题和已经做过什么。AI即使每次都答得不错，企业仍承担着把这些回答拼成工作过程的劳动。\n\n把AI作为智能伙伴，首先意味着它能够在明确范围内接续同一项工作。这里的“伙伴”不是给聊天机器人取一个名字，而是让它取得当前事实，记住未完成事项，在新情况出现时继续推进。\n\n## 先给它一项能够判断完成与否的职责\n\n在[设备售后教学案例](#case-c)中，可以从“准备派工前材料”开始。使用者是派工人员和技术员，所需成果是一份能支持出发决定的材料：哪台设备、什么版本、客户描述、过去处理、缺少哪些关键条件，以及需要带什么或向谁确认。\n\n收到报修以后，AI查找同一设备的历史记录。如果发现过去的工单没有说明实际动作，就提出补问；如果设备版本与旧方法不同，就将差异交给专业人员。新材料回来后，它更新当前准备情况，使派工人员知道还缺什么，而不是再次从头读一遍聊天。\n\n这项职责比“负责售后”小得多，但已经有实际价值。它减少重复解释，也让下一位同事能够在较完整的条件下行动。是否扩大到跟进派工和复访，可以等这一段表现稳定后再决定。\n\n## 一次对话结束以后，工作靠什么继续\n\n模型本身不会因为说了“我会持续跟进”，就自动在第二天醒来检查。持续工作需要系统提供几项条件：同一工单有稳定身份，已有经过保存下来，新消息或约定检查可以触发下一轮，AI能够使用相应查询和记录工具。\n\n例如，客户补来新照片时，系统识别它属于原工单，把当前材料和未完成事项一并交给AI。AI据此判断是否补齐了版本信息，更新记录，然后把仍需专家确认的问题交出去。等待期间不必保持一段永不停歇的对话；下一次有新情况时，再从已保存状态继续。\n\n![同一工单保持身份与经过，当前事实和相关经验支持下一步判断，行动结果返回任务；记录持久不等于模型参数自动学习。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTAwIiB2aWV3Qm94PSIwIDAgMzYwI 状态继续。\n\n![同一工单保持身份与经过，当前事实和相关经验支持下一步判断，行动结果返回任务；记录持久不等于模型参数自动学习。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTAwIiB2aWV3Qm94PSIwIDAgMzYwIDUwMCIgcm9sZT0iaW1nIj48dGl0bGU+5oyB57ut5bel5L2c5Zu057uV5ZCM5LiA5Lu75YqhPC90aXRsZT48ZGVzYz7lvZPliY3lt6XljZXkv53mjIHouqvku73kuI7nu4/ov4fvvJvkv6Hmga/jgIHliqjkvZzjgIHnu5Pmnpzov5vlhaXlkIzkuIDmjIHnu63ku7vliqHvvIznu5Pmnpzlj43ppojmlLnlj5jkuIvkuIDmraXjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjUwMCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7mjIHnu63lt6XkvZzlm7Tnu5XlkIzkuIDku7vliqE8L3RleHQ+PHJlY3QgeD0iMjUiIHk9Ijc2IiB3aWR0aD0iMzEwIiBoZWlnaHQ9IjM3OSIgcng9IjYiIGZpbGw9IiNlZGYzZWQiIHN0cm9rZT0iIzE2NWQ1MiIgc3Ryb2tlLXdpZHRoPSIxLjUiLz48dGV4dCB4PSI0NiIgeT0iMTA4IiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMjAiIGZpbGw9IiMyMTM0MmYiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjYwMCI+5bel5Y2VTTEgwrcg5oyB57ut6IGM6LSjPC90ZXh0PjxwYXRoIGQ9Ik00OCAxMzJIMTM2TDE1MiAxNDhWMTk4SDQ4WiIgZmlsbD0id2hpdGUiIHN0cm9rZT0iIzYwNzM2YyIgc3Ryb2tlLXdpZHRoPSIxLjUiLz48cGF0aCBkPSJNMTM2IDEzMlYxNDhIMTUyIiBmaWxsPSJub25lIiBzdHJva2U9IiM2MDczNmMiIHN0cm9rZS13aWR0aD0iMS41Ii8+PHRleHQgeD0iMTAwLjAiIHk9IjE3MS4wIiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyMTM0MmYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSI vbmUiIHN0cm9rZT0iIzE2NWQ1MiIgc3Ryb2tlLXdpZHRoPSIyIiBtYXJrZXItZW5kPSJ1cmwoI2Fycm93KSIvPjx0ZXh0IHg9IjEzMCIgeT0iNDIwIiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyMTM0MmYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSI0MDAiPuaWsOS/oeaBr+WbnuWIsOS7u+WKoTwvdGV4dD48dGV4dCB4PSIyNSIgeT0iNDg1IiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyMTM0MmYiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjQwMCI+6K6w5b2V5oyB5LmF77yM5LiN562J5LqO5qih5Z6L5Y+C5pWw5bey5pu05pawPC90ZXh0Pjwvc3ZnPg==)\n\n图中的返回箭头表示任务结果进入下一次工作。它不是说模型每处理一张工单就自动改变自身训练参数。企业的连续经验通常先体现在可保存、可调用和可修订的材料与方法里。\n\n## 能主动做什么，应与业务责任相配\n\nAI可以整理缺项、查询资料、提醒等待、起草派工材料；是否可以直接创建派工、修改客户承诺，则需要企业明确授权和条件。范围不清楚时，系统可能把建议当成决定，也可能每一步都等待人工，失去接续价值。\n\n人的参与应有具体作用。例如专家确认版本差异，负责人决定特殊成本，技术员回报现场结果。只是把所有输出都加一个“确认”按钮，并没有说明确认者要核什么，也不保证有人真正承担判断。\n\nAgent工程通常将模型、工具与环境反馈组织成连续工作。[工程材料](https://www.anthropic.com/research/building-effective-agents) 企业需要做的是把这种机制落实到真实对象和职责，使每次动作都能知道作用于哪项任务、发生了什么、下一步由谁继续。\n\n## 持续接续，也可以帮助企业产生新认识\n\n当AI能够把一台设备的多次报修连起来，就可能发现原来的“成功维修”后来反复出现问题。它可以将不同版本、操作和结果整理供人员比较，提出需要核实的差别。专业人员安排观察，后续结果再改变共同方法。\n\n这样，AI既协助当前服务，也参与企业对自身业务的持续理解。它能否成为有用伙伴，应看未完成事项是否被接住，变化是否影响下一步，其他岗位是否取得更可用的材料，以及实际结果有没有回来。\n\n企业从一项小而完整的职责开始，逐步扩大可靠的委派范围，才有机会形成长期协作。持续性由工作是否接得上来证明，而不是由回答是否显得像一个人在思考来证明。\n","text":"# 第17章｜AI怎样从回答一次，变成接续一项工作\n\n客户上午发来设备故障描述，技术员下午补充现场操作，第二天客户又报告问题复发。如果每条消息都重新交给AI，员工就要反复解释同一台设备、同一次问题和已经做过什么。AI即使每次都答得不错，企业仍承担着把这些回答拼成工作过程的劳动。\n\n把AI作为智能伙伴，首先意味着它能够在明确范围内接续同一项工作。这里的“伙伴”不是给聊天机器人取一个名字，而是让它取得当前事实，记住未完成事项，在新情况出现时继续推进。\n\n## 先给它一项能够判断完成与否的职责\n\n在设备售后教学案例中，可以从“准备派工前材料”开始。使用者是派工人员和技术员，所需成果是一份能支持出发决定的材料：哪台设备、什么版本、客户描述、过去处理、缺少哪些关键条件，以及需要带什么或向谁确认。\n\n收到报修以后，AI查找同一设备的历史记录。如果发现过去的工单没有说明实际动作，就提出补问；如果设备版本与旧方法不同，就将差异交给专业人员。新材料回来后，它更新当前准备情况，使派工人员知道还缺什么，而不是再次从头读一遍聊天。\n\n这项职责比“负责售后”小得多，但已经有实际价值。它减少重复解释，也让下一位同事能够在较完整的条件下行动。是否扩大到跟进派工和复访，可以等这一段表现稳定后再决定。\n\n## 一次对话结束以后，工作靠什么继续\n\n模型本身不会因为说了“我会持续跟进”，就自动在第二天醒来检查。持续工作需要系统提供几项条件：同一工单有稳定身份，已有经过保存下来，新消息或约定检查可以触发下一轮，AI能够使用相应查询和记录工具。\n\n例如，客户补来新照片时，系统识别它属于原工单，把当前材料和未完成事项一并交给AI。AI据此判断是否补齐了版本信息，更新记录，然后把仍需专家确认的问题交出去。等待期间不必保持一段永不停歇的对话；下一次有新情况时，再从已保存状态继续。\n\n \n\n图中的返回箭头表示任务结果进入下一次工作。它不是说模型每处理一张工单就自动改变自身训练参数。企业的连续经验通常先体现在可保存、可调用和可修订的材料与方法里。\n\n## 能主动做什么，应与业务责任相配\n\nAI可以整理缺项、查询资料、提醒等待、起草派工材料；是否可以直接创建派工、修改客户承诺，则需要企业明确授权和条件。范围不清楚时，系统可能把建议当成决定，也可能每一步都等待人工，失去接续价值。\n\n人的参与应有具体作用。例如专家确认版本差异，负责人决定特殊成本，技术员回报现场结果。只是把所有输出都加一个“确认”按钮，并没有说明确认者要核什么，也不保证有人真正承担判断。\n\nAgent工程通常将模型、工具与环境反馈组织成连续工作。工程材料 企业需要做的是把这种机制落实到真实对象和职责，使每次动作都能知道作用于哪项任务、发生了什么、下一步由谁继续。\n\n## 持续接续，也可以帮助企业产生新认识\n\n当AI能够把一台设备的多次报修连起来，就可能发现原来的“成功维修”后来反复出现问题。它可以将不同版本、操作和结果整理供人员比较，提出需要核实的差别。专业人员安排观察，后续结果再改变共同方法。\n\n这样，AI既协助当前服务，也参与企业对自身业务的持续理解。它能否成为有用伙伴，应看未完成事项是否被接住，变化是否影响下一步，其他岗位是否取得更可用的材料，以及实际结果有没有回来。\n\n企业从一项小而完整的职责开始，逐步扩大可靠的委派范围，才有机会形成长期协作。持续性由工作是否接得上来证明，而不是由回答是否显得像一个人在思考来证明。\n"},{"file":"18-人机分工.md","id":"lesson-18","number":18,"role":"核心课","part":3,"title":"第18章｜AI提出更多候选以后，谁来选，怎样才选得好","md":"# 第18章｜AI提出更多候选以后，谁来选，怎样才选得好\n\n一家工业品牌内容团队用AI起草以后，编辑很快拿到大量文章。技术专家却发现自己更忙了：每篇都要找产品依据、检查型号、判断角度，再决定是否值得修改和发布。生成环节的效率提升，把更多工作送到了最稀缺的人面前。\n\n“最后让人确认”听起来稳妥，却没有回答确认需要多少时间、人是否能够识别错误、是否存在更好的分工。人机协作应当放回完整任务，分别看资料、生成、选择和交付。\n\n## 同一篇文章里，包含不同性质的工作\n\n在[工业品牌内容教学案例](案例D-专业服务.md)中，客户需要准确、可发布的产品材料。整理产品说明需要忠实保留事实；提出文章角度需要理解采购者问题；选择角度需要判断价值；最后核验则需要产品专业知识。这几项能力不能简单归为同一种“写作”。\n\nAI可能擅长快速提出候选，却容易混用型号；专家擅长技术核验，却不应把大部分时间花在寻找已存在的说明书。一个有希望的安排是，AI先组织现行资料、标出重要事实和冲突，再让专家处理真正需要判断的差别。\n\n它是否有效仍需观察。如果资料整理错误，专家可能花更多时间回查；如果呈现清楚，专家可能较快完成核验。分工应随实际表现调整，而不是预先规定所有选择永远由某一方完成。\n\n## 候选变好，与选得更好是两回事\n\n宝洁创新实验将候选生成、组内选择和最终质量分开观察，提供了一个有用的研究视角。[研究原文](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702) 企业若只看最终交付，可能不知道改善来自候选整体提高，还是来自更准确的选择。\n\n用一个独立的教学算例说明：原来有两个方案，质量评分为70和80，团队选中80；新安排产生92和98，团队选中92。虽然新安排没有选到自身最好的98，最终92仍比原来的80好。这些分数只用于解释，不是该研究的测量数据。\n\n| 比较 | 原安排 | 新安排 |\n|---|---:|---:|\n| 候选质量 | 70、80 | 92、98 |\n| 最后选中 | 80 | 92 |\n| 候选中最好的未被选中吗 | 否 | 是 |\n\n如果只看“是否选到最优”，会忽视新候选整体变好；如果只看最终92，又会忽视选择环节仍有改进机会。下一笔投入到底用于生成更好的角度，还是用于比较和核验，应由这种拆分决定。\n\n## 人工复核本身，也需要改造\n\n专家每次都从头读说明书、重新搜索证据，再逐句比对，意味着前面的系统没有减去这部分劳动。AI若能把草稿中重要的性能描述对应到现行资料，并集中显示缺项和冲突，专家才可能少做重复查找。\n\n内容案例假设，原来每篇核验30分钟，专家每天有两小时，最多核4篇。改进后若每篇降到20分钟，且最终质量保持，才可能提高到6篇。这10分钟必须来自实际工作减少，例如寻找依据和反复修改变少；不能仅因加了引用链接，就宣布节省已经实现。\n\n还要计算筛选工作。如果专家必须先从很多草稿中挑出6篇，这段时间也占用同样的两小时。把筛选时间藏到核验之外，会高估新增能力。\n\n## 委派范围应随任务证据发展\n\n常规、依据清楚且容易核验的内容，可以逐步增加AI承担的部分；新型号、资料冲突和后果较大的判断，则需要相应专业支持。经验较少的员工可能需要更多提示，资深人员则可能更需要快速看见差异和证据。\n\n每一种组合都应同时观察最终质量、总投入和返工。人员独立完成、AI辅助、AI承担更多步骤，都是可以比较的安排。企业要争取的是以可持续成本得到合格交付，而不是证明人或AI在抽象意义上更聪明。\n\n对这支团队，最先值得弄清的，是专家时间究竟花在哪里。把这一点讲清楚，分工才会从一句“人机协同”变成真正可执行的工作安排。\n","html":"\u003ch1>第18章｜AI提出更多候选以后，谁来选，怎样才选得好\u003c/h1>\n\u003cp>一家工业品牌内容团队用AI起草以后，编辑很快拿到大量文章。技术专家却发现自己更忙了：每篇都要找产品依据、检查型号、判断角度，再决定是否值得修改和发布。生成环节的效率提升，把更多工作送到了最稀缺的人面前。\u003c/p>\n\u003cp>“最后让人确认”听起来稳妥，却没有回答确认需要多少时间、人是否能够识别错误、是否存在更好的分工。人机协作应当放回完整任务，分别看资料、生成、选择和交付。\u003c/p>\n\u003ch2 id=\"lesson-18-section-1\">同一篇文章里，包含不同性质的工作\u003c/h2>\n\u003cp>在\u003ca href=\"#case-d\">工业品牌内容教学案例\u003c/a>中，客户需要准确、可发布的产品材料。整理产品说明需要忠实保留事实；提出文章角度需要理解采购者问题；选择角度需要判断价值；最后核验则需要产品专业知识。这几项能力不能简单归为同一种“写作”。\u003c/p>\n\u003cp>AI可能擅长快速提出候选，却容易混用型号；专家擅长技术核验，却不应把大部分时间花在寻找已存在的说明书。一个有希望的安排是，AI先组织现行资料、标出重要事实和冲突，再让专家处理真正需要判断的差别。\u003c/p>\n\u003cp>它是否有效仍需观察。如果资料整理错误，专家可能花更多时间回查；如果呈现清楚，专家可能较快完成核验。分工应随实际表现调整，而不是预先规定所有选择永远由某一方完成。\u003c/p>\n\u003ch2 id=\"lesson-18-section-2\">候选变好，与选得更好是两回事\u003c/h2>\n\u003cp>宝洁创新实验将候选生成、组内选择和最终质量分开观察，提供了一个有用的研究视角。\u003ca href=\"https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702\" target=\"_blank\" rel=\"noopener noreferrer\">研究原文\u003c/a> 企业若只看最终交付，可能不知道改善来自候选整体提高，还是来自更准确的选择。\u003c/p>\n\u003cp>用一个独立的教学算例说明：原来有两个方案，质量评分为70和80，团队选中80；新安排产生92和98，团队选中92。虽然新安排没有选到自身最好的98，最终92仍比原来的80好。这些分数只用于解释，不是该研究的测量数据。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>比较\u003c/th>\n\u003cth align=\"right\">原安排\u003c/th>\n\u003cth align=\"right\">新安排\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>候选质量\u003c/td>\n\u003ctd align=\"right\">70、80\u003c/td>\n\u003ctd align=\"right\">92、98\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>最后选中\u003c/td>\n\u003ctd align=\"right\">80\u003c/td>\n\u003ctd align=\"right\">92\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>候选中最好的未被选中吗\u003c/td>\n\u003ctd align=\"right\">否\u003c/td>\n\u003ctd align=\"right\">是\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>如果只看“是否选到最优”，会忽视新候选整体变好；如果只看最终92，又会忽视选择环节仍有改进机会。下一笔投入到底用于生成更好的角度，还是用于比较和核验，应由这种拆分决定。\u003c/p>\n\u003ch2 id=\"lesson-18-section-3\">人工复核本身，也需要改造\u003c/h2>\n\u003cp>专家每次都从头读说明书、重新搜索证据，再逐句比对，意味着前面的系统没有减去这部分劳动。AI若能把草稿中重要的性能描述对应到现行资料，并集中显示缺项和冲突，专家才可能少做重复查找。\u003c/p>\n\u003cp>内容案例假设，原来每篇核验30分钟，专家每天有两小时，最多核4篇。改进后若每篇降到20分钟，且最终质量保持，才可能提高到6篇。这10分钟必须来自实际工作减少，例如寻找依据和反复修改变少；不能仅因加了引用链接，就宣布节省已经实现。\u003c/p>\n\u003cp>还要计算筛选工作。如果专家必须先从很多草稿中挑出6篇，这段时间也占用同样的两小时。把筛选时间藏到核验之外，会高估新增能力。\u003c/p>\n\u003ch2 id=\"lesson-18-section-4\">委派范围应随任务证据发展\u003c/h2>\n\u003cp>常规、依据清楚且容易核验的内容，可以逐步增加AI承担的部分；新型号、资料冲突和后果较大的判断，则需要相应专业支持。经验较少的员工可能需要更多提示，资深人员则可能更需要快速看见差异和证据。\u003c/p>\n\u003cp>每一种组合都应同时观察最终质量、总投入和返工。人员独立完成、AI辅助、AI承担更多步骤，都是可以比较的安排。企业要争取的是以可持续成本得到合格交付，而不是证明人或AI在抽象意义上更聪明。\u003c/p>\n\u003cp>对这支团队，最先值得弄清的，是专家时间究竟花在哪里。把这一点讲清楚，分工才会从一句“人机协同”变成真正可执行的工作安排。\u003c/p>\n","headings":[{"id":"lesson-18-section-1","label":"同一篇文章里，包含不同性质的工作"},{"id":"lesson-18-section-2","label":"候选变好，与选得更好是两回事"},{"id":"lesson-18-section-3","label":"人工复核本身，也需要改造"},{"id":"lesson-18-section-4","label":"委派范围应随任务证据发展"}],"exportMd":"# 第18章｜AI提出更多候选以后，谁来选，怎样才选得好\n\n一家工业品牌内容团队用AI起草以后，编辑很快拿到大量文章。技术专家却发现自己更忙了：每篇都要找产品依据、检查型号、判断角度，再决定是否值得修改和发布。生成环节的效率提升，把更多工作送到了最稀缺的人面前。\n\n“最后让人确认”听起来稳妥，却没有回答确认需要多少时间、人是否能够识别错误、是否存在更好的分工。人机协作应当放回完整任务，分别看资料、生成、选择和交付。\n\n## 同一篇文章里，包含不同性质的工作\n\n在[工业品牌内容教学案例](#case-d)中，客户需要准确、可发布的产品材料。整理产品说明需要忠实保留事实；提出文章角度需要理解采购者问题；选择角度需要判断价值；最后核验则需要产品专业知识。这几项能力不能简单归为同一种“写作”。\n\nAI可能擅长快速提出候选，却容易混用型号；专家擅长技术核验，却不应把大部分时间花在寻找已存在的说明书。一个有希望的安排是，AI先组织现行资料、标出重要事实和冲突，再让专家处理真正需要判断的差别。\n\n它是否有效仍需观察。如果资料整理错误，专家可能花更多时间回查；如果呈现清楚，专家可能较快完成核验。分工应随实际表现调整，而不是预先规定所有选择永远由某一方完成。\n\n## 候选变好，与选得更好是两回事\n\n宝洁创新实验将候选生成、组内选择和最终质量分开观察，提供了一个有用的研究视角。[研究原文](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702) 企业若只看最终交付，可能不知道改善来自候选整体提高，还是来自更准确的选择。\n\n用一个独立的教学算例说明：原来有两个方案，质量评分为70和80，团队选中80；新安排产生92和98，团队选中92。虽然新安排没有选到自身最好的98，最终92仍比原来的80好。这些分数只用于解释，不是该研究的测量数据。\n\n| 比较 | 原安排 | 新安排 |\n|---|---:|---:|\n| 候选质量 | 70、80 | 92、98 |\n| 最后选中 | 80 | 92 |\n| 候选中最好的未被选中吗 | 否 | 是 |\n\n如果只看“是否选到最优”，会忽视新候选整体变好；如果只看最终92，又会忽视选择环节仍有改进机会。下一笔投入到底用于生成更好的角度，还是用于比较和核验，应由这种拆分决定。\n\n## 人工复核本身，也需要改造\n\n专家每次都从头读说明书、重新搜索证据，再逐句比对，意味着前面的系统没有减去这部分劳动。AI若能把草稿中重要的性能描述对应到现行资料，并集中显示缺项和冲突，专家才可能少做重复查找。\n\n内容案例假设，原来每篇核验30分钟，专家每天有两小时，最多核4篇。改进后若每篇降到20分钟，且最终质量保持，才可能提高到6篇。这10分钟必须来自实际工作减少，例如寻找依据和反复修改变少；不能仅因加了引用链接，就宣布节省已经实现。\n\n还要计算筛选工作。如果专家必须先从很多草稿中挑出6篇，这段时间也占用同样的两小时。把筛选时间藏到核验之外，会高估新增能力。\n\n## 委派范围应随任务证据发展\n\n常规、依据清楚且容易核验的内容，可以逐步增加AI承担的部分；新型号、资料冲突和后果较大的判断，则需要相应专业支持。经验较少的员工可能需要更多提示，资深人员则可能更需要快速看见差异和证据。\n\n每一种组合都应同时观察最终质量、总投入和返工。人员独立完成、AI辅助、AI承担更多步骤，都是可以比较的安排。企业要争取的是以可持续成本得到合格交付，而不是证明人或AI在抽象意义上更聪明。\n\n对这支团队，最先值得弄清的，是专家时间究竟花在哪里。把这一点讲清楚，分工才会从一句“人机协同”变成真正可执行的工作安排。\n","exportSingleMd":"# 第18章｜AI提出更多候选以后，谁来选，怎样才选得好\n\n一家工业品牌内容团队用AI起草以后，编辑很快拿到大量文章。技术专家却发现自己更忙了：每篇都要找产品依据、检查型号、判断角度，再决定是否值得修改和发布。生成环节的效率提升，把更多工作送到了最稀缺的人面前。\n\n“最后让人确认”听起来稳妥，却没有回答确认需要多少时间、人是否能够识别错误、是否存在更好的分工。人机协作应当放回完整任务，分别看资料、生成、选择和交付。\n\n## 同一篇文章里，包含不同性质的工作\n\n在[工业品牌内容教学案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-d)中，客户需要准确、可发布的产品材料。整理产品说明需要忠实保留事实；提出文章角度需要理解采购者问题；选择角度需要判断价值；最后核验则需要产品专业知识。这几项能力不能简单归为同一种“写作”。\n\nAI可能擅长快速提出候选，却容易混用型号；专家擅长技术核验，却不应把大部分时间花在寻找已存在的说明书。一个有希望的安排是，AI先组织现行资料、标出重要事实和冲突，再让专家处理真正需要判断的差别。\n\n它是否有效仍需观察。如果资料整理错误，专家可能花更多时间回查；如果呈现清楚，专家可能较快完成核验。分工应随实际表现调整，而不是预先规定所有选择永远由某一方完成。\n\n## 候选变好，与选得更好是两回事\n\n宝洁创新实验将候选生成、组内选择和最终质量分开观察，提供了一个有用的研究视角。[研究原文](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702) 企业若只看最终交付，可能不知道改善来自候选整体提高，还是来自更准确的选择。\n\n用一个独立的教学算例说明：原来有两个方案，质量评分为70和80，团队选中80；新安排产生92和98，团队选中92。虽然新安排没有选到自身最好的98，最终92仍比原来的80好。这些分数只用于解释，不是该研究的测量数据。\n\n| 比较 | 原安排 | 新安排 |\n|---|---:|---:|\n| 候选质量 | 70、80 | 92、98 |\n| 最后选中 | 80 | 92 |\n| 候选中最好的未被选中吗 | 否 | 是 |\n\n如果只看“是否选到最优”，会忽视新候选整体变好；如果只看最终92，又会忽视选择环节仍有改进机会。下一笔投入到底用于生成更好的角度，还是用于比较和核验，应由这种拆分决定。\n\n## 人工复核本身，也需要改造\n\n专家每次都从头读说明书、重新搜索证据，再逐句比对，意味着前面的系统没有减去这部分劳动。AI若能把草稿中重要的性能描述对应到现行资料，并集中显示缺项和冲突，专家才可能少做重复查找。\n\n内容案例假设，原来每篇核验30分钟，专家每天有两小时，最多核4篇。改进后若每篇降到20分钟，且最终质量保持，才可能提高到6篇。这10分钟必须来自实际工作减少，例如寻找依据和反复修改变少；不能仅因加了引用链接，就宣布节省已经实现。\n\n还要计算筛选工作。如果专家必须先从很多草稿中挑出6篇，这段时间也占用同样的两小时。把筛选时间藏到核验之外，会高估新增能力。\n\n## 委派范围应随任务证据发展\n\n常规、依据清楚且容易核验的内容，可以逐步增加AI承担的部分；新型号、资料冲突和后果较大的判断，则需要相应专业支持。经验较少的员工可能需要更多提示，资深人员则可能更需要快速看见差异和证据。\n\n每一种组合都应同时观察最终质量、总投入和返工。人员独立完成、AI辅助、AI承担更多步骤，都是可以比较的安排。企业要争取的是以可持续成本得到合格交付，而不是证明人或AI在抽象意义上更聪明。\n\n对这支团队，最先值得弄清的，是专家时间究竟花在哪里。把这一点讲清楚，分工才会从一句“人机协同”变成真正可执行的工作安排。\n","text":"# 第18章｜AI提出更多候选以后，谁来选，怎样才选得好\n\n一家工业品牌内容团队用AI起草以后，编辑很快拿到大量文章。技术专家却发现自己更忙了：每篇都要找产品依据、检查型号、判断角度，再决定是否值得修改和发布。生成环节的效率提升，把更多工作送到了最稀缺的人面前。\n\n“最后让人确认”听起来稳妥，却没有回答确认需要多少时间、人是否能够识别错误、是否存在更好的分工。人机协作应当放回完整任务，分别看资料、生成、选择和交付。\n\n## 同一篇文章里，包含不同性质的工作\n\n在工业品牌内容教学案例中，客户需要准确、可发布的产品材料。整理产品说明需要忠实保留事实；提出文章角度需要理解采购者问题；选择角度需要判断价值；最后核验则需要产品专业知识。这几项能力不能简单归为同一种“写作”。\n\nAI可能擅长快速提出候选，却容易混用型号；专家擅长技术核验，却不应把大部分时间花在寻找已存在的说明书。一个有希望的安排是，AI先组织现行资料、标出重要事实和冲突，再让专家处理真正需要判断的差别。\n\n它是否有效仍需观察。如果资料整理错误，专家可能花更多时间回查；如果呈现清楚，专家可能较快完成核验。分工应随实际表现调整，而不是预先规定所有选择永远由某一方完成。\n\n## 候选变好，与选得更好是两回事\n\n宝洁创新实验将候选生成、组内选择和最终质量分开观察，提供了一个有用的研究视角。研究原文 企业若只看最终交付，可能不知道改善来自候选整体提高，还是来自更准确的选择。\n\n用一个独立的教学算例说明：原来有两个方案，质量评分为70和80，团队选中80；新安排产生92和98，团队选中92。虽然新安排没有选到自身最好的98，最终92仍比原来的80好。这些分数只用于解释，不是该研究的测量数据。\n\n| 比较 | 原安排 | 新安排 |\n|---|---:|---:|\n| 候选质量 | 70、80 | 92、98 |\n| 最后选中 | 80 | 92 |\n| 候选中最好的未被选中吗 | 否 | 是 |\n\n如果只看“是否选到最优”，会忽视新候选整体变好；如果只看最终92，又会忽视选择环节仍有改进机会。下一笔投入到底用于生成更好的角度，还是用于比较和核验，应由这种拆分决定。\n\n## 人工复核本身，也需要改造\n\n专家每次都从头读说明书、重新搜索证据，再逐句比对，意味着前面的系统没有减去这部分劳动。AI若能把草稿中重要的性能描述对应到现行资料，并集中显示缺项和冲突，专家才可能少做重复查找。\n\n内容案例假设，原来每篇核验30分钟，专家每天有两小时，最多核4篇。改进后若每篇降到20分钟，且最终质量保持，才可能提高到6篇。这10分钟必须来自实际工作减少，例如寻找依据和反复修改变少；不能仅因加了引用链接，就宣布节省已经实现。\n\n还要计算筛选工作。如果专家必须先从很多草稿中挑出6篇，这段时间也占用同样的两小时。把筛选时间藏到核验之外，会高估新增能力。\n\n## 委派范围应随任务证据发展\n\n常规、依据清楚且容易核验的内容，可以逐步增加AI承担的部分；新型号、资料冲突和后果较大的判断，则需要相应专业支持。经验较少的员工可能需要更多提示，资深人员则可能更需要快速看见差异和证据。\n\n每一种组合都应同时观察最终质量、总投入和返工。人员独立完成、AI辅助、AI承担更多步骤，都是可以比较的安排。企业要争取的是以可持续成本得到合格交付，而不是证明人或AI在抽象意义上更聪明。\n\n对这支团队，最先值得弄清的，是专家时间究竟花在哪里。把这一点讲清楚，分工才会从一句“人机协同”变成真正可执行的工作安排。\n"},{"file":"19-工作流与Agent.md","id":"lesson-19","number":19,"role":"核心课","part":3,"title":"第19章｜怎样决定哪些路径预设，哪些行动交给Agent","md":"# 第19章｜怎样决定哪些路径预设，哪些行动交给Agent\n\n设备服务中的一些动作很明确：查询设备编号，按现行规则判断保修，登记工单。另一些动作却随情况变化：客户描述不完整时先问什么，历史记录互相矛盾时先查哪里，资料是否足够支持派工。\n\n这些工作可以出现在同一个系统里，但不必使用同一种实现方式。理解工作流和Agent的区别，可以帮助企业避免为稳定动作增加不必要的复杂度，也避免把变化多的工作硬塞进一条固定路径。\n\n## 预先安排的工作流，能做什么\n\n设想一条报修流程：先查设备身份，再检查必填材料；缺少版本就请客户补充，齐全后登记工单。流程可以有分支，也可以重复补问。只要这些路径由程序预先规定，整体仍是一套预设工作流。\n\n其中可以调用模型。例如客户用一段话描述问题，模型负责提取症状，但提取完以后该走哪一步，仍由程序按规定判断。使用了AI，并不会自动使整套流程成为Agent。\n\n对规则明确、经常重复的工作，这种安排有明显好处。企业容易知道系统会做什么，出错时容易定位，中断后也较容易恢复。固定并不意味着落后，而是表示任务已经可以用稳定方式完成。\n\n## Agent将部分行动选择留到实际运行时\n\n现在把目标改为“将这张工单的派工前材料准备到可用”。系统给AI查询历史、核对设备、提出补问等工具，并限定可做范围。AI根据当前资料判断先使用哪一种工具，再根据返回结果决定下一步。\n\n例如它先查到历史记录，却发现记录里的设备版本与客户照片不同，于是优先核对当前版本。版本确认后，又发现原方法可能不适用，便准备一份给专业人员的差异说明。在另一张工单里，资料完整，它可能直接组织派工材料，不必重复同样步骤。\n\n这里的关键是，部分行动顺序由模型结合目标和实际结果选择。企业仍需要规定工具范围、决定权限和完成条件。模型能够选择先查什么，不等于它可以自行决定所有维修操作或客户承诺。\n\nAnthropic的工程材料以预设代码路径和模型动态选择区分这两种组织方式，并强调复杂度应与任务相配。[工程原文](https://www.anthropic.com/research/building-effective-agents)\n\n![上方程序预设查询、分支与登记，下方模型在目标和工具范围内选择所需行动，工具结果返回本轮判断，再决定交付或等待。](assets/19-固定与动态.svg)\n\n读图时，可以比较谁决定下一步。上方分支由程序预设，下方则将部分选择交给模型。两者都可能调用工具、保存记录和等待人员，不能仅凭有无循环箭头区分。\n\n## 同一条业务，通常适合组合使用\n\n设备身份、正式工单状态和保修规则可以继续由成熟系统管理。AI处理客户的非标准说明，寻找相关案例，并在允许范围内选择补问。人员确认后的派工动作，再回到业务系统执行和记录。\n\n这种组合使外围事实和责任保持清楚，同时给需要判断的部分留出空间。若让模型每次重新规划所有稳定步骤，会增加调用和核对负担；若要求程序提前列完所有现场例外，又可能导致大量工作继续在系统外靠人处理。\n\n## 更灵活，也会带来新的成本\n\n动态选择可能减少预先穷举，但也可能重复查同一资料、走无效路径，或者不知道什么时候该停止。出了问题，还要分辨是资料不全、工具失败、选择错误，还是目标本身不清楚。系统依赖和维护会形成长期负担。[技术债研究](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n可以拿一张常规工单和一张有缺项的工单，分别比较原方法、固定工作流和动态安排。观察它们怎样取得资料、何时认为完成、中断后能否识别已发生的动作，以及人员总共需要补救多少工作。\n\n如果固定方法已经可靠，就保留它；如果动态选择确实改善了难以预设的任务，再扩大相应范围。企业需要的是合适的工作机制，Agent数量本身并不是能力水平的证明。\n","html":"\u003ch1>第19章｜怎样决定哪些路径预设，哪些行动交给Agent\u003c/h1>\n\u003cp>设备服务中的一些动作很明确：查询设备编号，按现行规则判断保修，登记工单。另一些动作却随情况变化：客户描述不完整时先问什么，历史记录互相矛盾时先查哪里，资料是否足够支持派工。\u003c/p>\n\u003cp>这些工作可以出现在同一个系统里，但不必使用同一种实现方式。理解工作流和Agent的区别，可以帮助企业避免为稳定动作增加不必要的复杂度，也避免把变化多的工作硬塞进一条固定路径。\u003c/p>\n\u003ch2 id=\"lesson-19-section-1\">预先安排的工作流，能做什么\u003c/h2>\n\u003cp>设想一条报修流程：先查设备身份，再检查必填材料；缺少版本就请客户补充，齐全后登记工单。流程可以有分支，也可以重复补问。只要这些路径由程序预先规定，整体仍是一套预设工作流。\u003c/p>\n\u003cp>其中可以调用模型。例如客户用一段话描述问题，模型负责提取症状，但提取完以后该走哪一步，仍由程序按规定判断。使用了AI，并不会自动使整套流程成为Agent。\u003c/p>\n\u003cp>对规则明确、经常重复的工作，这种安排有明显好处。企业容易知道系统会做什么，出错时容易定位，中断后也较容易恢复。固定并不意味着落后，而是表示任务已经可以用稳定方式完成。\u003c/p>\n\u003ch2 id=\"lesson-19-section-2\">Agent将部分行动选择留到实际运行时\u003c/h2>\n\u003cp>现在把目标改为“将这张工单的派工前材料准备到可用”。系统给AI查询历史、核对设备、提出补问等工具，并限定可做范围。AI根据当前资料判断先使用哪一种工具，再根据返回结果决定下一步。\u003c/p>\n\u003cp>例如它先查到历史记录，却发现记录里的设备版本与客户照片不同，于是优先核对当前版本。版本确认后，又发现原方法可能不适用，便准备一份给专业人员的差异说明。在另一张工单里，资料完整，它可能直接组织派工材料，不必重复同样步骤。\u003c/p>\n\u003cp>这里的关键是，部分行动顺序由模型结合目标和实际结果选择。企业仍需要规定工具范围、决定权限和完成条件。模型能够选择先查什么，不等于它可以自行决定所有维修操作或客户承诺。\u003c/p>\n\u003cp>Anthropic的工程材料以预设代码路径和模型动态选择区分这两种组织方式，并强调复杂度应与任务相配。\u003ca href=\"https://www.anthropic.com/research/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">工程原文\u003c/a>\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNzYwIiB2aWV3Qm94PSIwIDAgMzYwIDc2MCIgcm9sZT0iaW1nIj48dGl0bGU+6LCB5p2l5Yaz5a6a5LiL5LiA5q2lPC90aXRsZT48ZGVzYz7lt6XkvZzmtYHnmoTliIbmlK/lkozlvqrnjq/kuZ/lj6/nlLHnqIvluo/pooTorr7vvJtBZ2VudOeUseaooeWei+e7k+WQiOebruagh+WSjOinguWvn+mAieaLqeW3peWFt++8jOe7k+aenOi/lOWbnuWQjue7p+e7reWIpOaWreaIluS6pOS7mOOAgjwvZGVzYz48ZGVmcz48bWFya2VyIGlkPSJhcnJvdyIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8tc3RhcnQtcmV2ZXJzZSI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTB6IiBmaWxsPSIjMTY1ZDUyIi8+PC9tYXJrZXI+PHBhdHRlcm4gaWQ f7dcfd896fcaf2674f757a2463eba-Paper.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">技术债研究\u003c/a>\u003c/p>\n\u003cp>可以拿一张常规工单和一张有缺项的工单，分别比较原方法、固定工作流和动态安排。观察它们怎样取得资料、何时认为完成、中断后能否识别已发生的动作，以及人员总共需要补救多少工作。\u003c/p>\n\u003cp>如果固定方法已经可靠，就保留它；如果动态选择确实改善了难以预设的任务，再扩大相应范围。企业需要的是合适的工作机制，Agent数量本身并不是能力水平的证明。\u003c/p>\n","headings":[{"id":"lesson-19-section-1","label":"预先安排的工作流，能做什么"},{"id":"lesson-19-section-2","label":"Agent将部分行动选择留到实际运行时"},{"id":"lesson-19-section-3","label":"同一条业务，通常适合组合使用"},{"id":"lesson-19-section-4","label":"更灵活，也会带来新的成本"}],"exportMd":"# 第19章｜怎样决定哪些路径预设，哪些行动交给Agent\n\n设备服务中的一些动作很明确：查询设备编号，按现行规则判断保修，登记工单。另一些动作却随情况变化：客户描述不完整时先问什么，历史记录互相矛盾时先查哪里，资料是否足够支持派工。\n\n这些工作可以出现在同一个系统里，但不必使用同一种实现方式。理解工作流和Agent的区别，可以帮助企业避免为稳定动作增加不必要的复杂度，也避免把变化多的工作硬塞进一条固定路径。\n\n## 预先安排的工作流，能做什么\n\n设想一条报修流程：先查设备身份，再检查必填材料；缺少版本就请客户补充，齐全后登记工单。流程可以有分支，也可以重复补问。只要这些路径由程序预先规定，整体仍是一套预设工作流。\n\n其中可以调用模型。例如客户用一段话描述问题，模型负责提取症状，但提取完以后该走哪一步，仍由程序按规定判断。使用了AI，并不会自动使整套流程成为Agent。\n\n对规则明确、经常重复的工作，这种安排有明显好处。企业容易知道系统会做什么，出错时容易定位，中断后也较容易恢复。固定并不意味着落后，而是表示任务已经可以用稳定方式完成。\n\n## Agent将部分行动选择留到实际运行时\n\n现在把目标改为“将这张工单的派工前材料准备到可用”。系统给AI查询历史、核对设备、提出补问等工具，并限定可做范围。AI根据当前资料判断先使用哪一种工具，再根据返回结果决定下一步。\n\n例如它先查到历史记录，却发现记录里的设备版本与客户照片不同，于是优先核对当前版本。版本确认后，又发现原方法可能不适用，便准备一份给专业人员的差异说明。在另一张工单里，资料完整，它可能直接组织派工材料，不必重复同样步骤。\n\n这里的关键是，部分行动顺序由模型结合目标和实际结果选择。企业仍需要规定工具范围、决定权限和完成条件。模型能够选择先查什么，不等于它可以自行决定所有维修操作或客户承诺。\n\nAnthropic的工程材料以预设代码路径和模型动态选择区分这两种组织方式，并强调复杂度应与任务相配。[工程原文](https://www.anthropic.com/research/building-effective-agents)\n\n![上方程序预设查询、分支与登记，下方模型在目标和工具范围内选择所需行动，工具结果返回本轮判断，再决定交付或等待。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNzYwIiB2aWV3Qm94PSIwIDAgMzYwIDc2MCIgcm9sZT0iaW1nIj48dGl0bGU+6LCB5p2l5Yaz5a6a5LiL5LiA5q2lPC90aXRsZT48ZGVzYz7lt6XkvZzmtYHnmoTliIbmlK/lkozlvqrnjq/kuZ/lj6/nlLHnqIvluo/pooTorr7vvJtBZ2VudOeUseaooeWei+e7k+WQiOebruagh+WSjOinguWvn+mAieaLqeW3peWFt++8jOe7k+aenOi/lOWbnuWQjue7p+e7reWIpOaWreaIluS6pOS7mOOAgjwvZGVzYz48ZGVmcz48bWFya2VyIGlkPSJhcnJvdyIgdmlld0Jv 6fcaf2674f757a2463eba-Paper.pdf)\n\n可以拿一张常规工单和一张有缺项的工单，分别比较原方法、固定工作流和动态安排。观察它们怎样取得资料、何时认为完成、中断后能否识别已发生的动作，以及人员总共需要补救多少工作。\n\n如果固定方法已经可靠，就保留它；如果动态选择确实改善了难以预设的任务，再扩大相应范围。企业需要的是合适的工作机制，Agent数量本身并不是能力水平的证明。\n","exportSingleMd":"# 第19章｜怎样决定哪些路径预设，哪些行动交给Agent\n\n设备服务中的一些动作很明确：查询设备编号，按现行规则判断保修，登记工单。另一些动作却随情况变化：客户描述不完整时先问什么，历史记录互相矛盾时先查哪里，资料是否足够支持派工。\n\n这些工作可以出现在同一个系统里，但不必使用同一种实现方式。理解工作流和Agent的区别，可以帮助企业避免为稳定动作增加不必要的复杂度，也避免把变化多的工作硬塞进一条固定路径。\n\n## 预先安排的工作流，能做什么\n\n设想一条报修流程：先查设备身份，再检查必填材料；缺少版本就请客户补充，齐全后登记工单。流程可以有分支，也可以重复补问。只要这些路径由程序预先规定，整体仍是一套预设工作流。\n\n其中可以调用模型。例如客户用一段话描述问题，模型负责提取症状，但提取完以后该走哪一步，仍由程序按规定判断。使用了AI，并不会自动使整套流程成为Agent。\n\n对规则明确、经常重复的工作，这种安排有明显好处。企业容易知道系统会做什么，出错时容易定位，中断后也较容易恢复。固定并不意味着落后，而是表示任务已经可以用稳定方式完成。\n\n## Agent将部分行动选择留到实际运行时\n\n现在把目标改为“将这张工单的派工前材料准备到可用”。系统给AI查询历史、核对设备、提出补问等工具，并限定可做范围。AI根据当前资料判断先使用哪一种工具，再根据返回结果决定下一步。\n\n例如它先查到历史记录，却发现记录里的设备版本与客户照片不同，于是优先核对当前版本。版本确认后，又发现原方法可能不适用，便准备一份给专业人员的差异说明。在另一张工单里，资料完整，它可能直接组织派工材料，不必重复同样步骤。\n\n这里的关键是，部分行动顺序由模型结合目标和实际结果选择。企业仍需要规定工具范围、决定权限和完成条件。模型能够选择先查什么，不等于它可以自行决定所有维修操作或客户承诺。\n\nAnthropic的工程材料以预设代码路径和模型动态选择区分这两种组织方式，并强调复杂度应与任务相配。[工程原文](https://www.anthropic.com/research/building-effective-agents)\n\n![上方程序预设查询、分支与登记，下方模型在目标和工具范围内选择所需行动，工具结果返回本轮判断，再决定交付或等待。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNzYwIiB2aWV3Qm94PSIwIDAgMzYwIDc2MCIgcm9sZT0iaW1nIj48dGl0bGU+6LCB5p2l5Yaz5a6a5LiL5LiA5q2lPC90aXRsZT48ZGVzYz7lt6XkvZzmtYHnmoTliIbmlK/lkozlvqrnjq/kuZ/lj6/nlLHnqIvluo/pooTorr7vvJtBZ2VudOeUseaooeWei+e7k+WQiOebruagh+WSjOinguWvn+mAieaLqeW3peWFt++8jOe7k+aenOi/lOWbnuWQjue7p+e7reWIpOaWreaIluS6pOS7mOOAgjwvZGVzYz48ZGVmcz48bWFya2VyIGlkPSJhcnJvdyIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8tc3RhcnQtcmV2ZXJzZSI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTB6IiBmaWxsPSIjMTY1ZDUyIi8+PC9tYXJrZXI+PHBhdHRlcm4gaWQ9InVua25vd24iIHdpZHRoPSI4IiBoZWlnaHQ9IjgiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPjxwYXRoIGQ9Ik0tMiAyTDIgLTJNMCA4TDggME02IDEwTD n\n这些工作可以出现在同一个系统里，但不必使用同一种实现方式。理解工作流和Agent的区别，可以帮助企业避免为稳定动作增加不必要的复杂度，也避免把变化多的工作硬塞进一条固定路径。\n\n## 预先安排的工作流，能做什么\n\n设想一条报修流程：先查设备身份，再检查必填材料；缺少版本就请客户补充，齐全后登记工单。流程可以有分支，也可以重复补问。只要这些路径由程序预先规定，整体仍是一套预设工作流。\n\n其中可以调用模型。例如客户用一段话描述问题，模型负责提取症状，但提取完以后该走哪一步，仍由程序按规定判断。使用了AI，并不会自动使整套流程成为Agent。\n\n对规则明确、经常重复的工作，这种安排有明显好处。企业容易知道系统会做什么，出错时容易定位，中断后也较容易恢复。固定并不意味着落后，而是表示任务已经可以用稳定方式完成。\n\n## Agent将部分行动选择留到实际运行时\n\n现在把目标改为“将这张工单的派工前材料准备到可用”。系统给AI查询历史、核对设备、提出补问等工具，并限定可做范围。AI根据当前资料判断先使用哪一种工具，再根据返回结果决定下一步。\n\n例如它先查到历史记录，却发现记录里的设备版本与客户照片不同，于是优先核对当前版本。版本确认后，又发现原方法可能不适用，便准备一份给专业人员的差异说明。在另一张工单里，资料完整，它可能直接组织派工材料，不必重复同样步骤。\n\n这里的关键是，部分行动顺序由模型结合目标和实际结果选择。企业仍需要规定工具范围、决定权限和完成条件。模型能够选择先查什么，不等于它可以自行决定所有维修操作或客户承诺。\n\nAnthropic的工程材料以预设代码路径和模型动态选择区分这两种组织方式，并强调复杂度应与任务相配。工程原文\n\n \n\n读图时，可以比较谁决定下一步。上方分支由程序预设，下方则将部分选择交给模型。两者都可能调用工具、保存记录和等待人员，不能仅凭有无循环箭头区分。\n\n## 同一条业务，通常适合组合使用\n\n设备身份、正式工单状态和保修规则可以继续由成熟系统管理。AI处理客户的非标准说明，寻找相关案例，并在允许范围内选择补问。人员确认后的派工动作，再回到业务系统执行和记录。\n\n这种组合使外围事实和责任保持清楚，同时给需要判断的部分留出空间。若让模型每次重新规划所有稳定步骤，会增加调用和核对负担；若要求程序提前列完所有现场例外，又可能导致大量工作继续在系统外靠人处理。\n\n## 更灵活，也会带来新的成本\n\n动态选择可能减少预先穷举，但也可能重复查同一资料、走无效路径，或者不知道什么时候该停止。出了问题，还要分辨是资料不全、工具失败、选择错误，还是目标本身不清楚。系统依赖和维护会形成长期负担。技术债研究\n\n可以拿一张常规工单和一张有缺项的工单，分别比较原方法、固定工作流和动态安排。观察它们怎样取得资料、何时认为完成、中断后能否识别已发生的动作，以及人员总共需要补救多少工作。\n\n如果固定方法已经可靠，就保留它；如果动态选择确实改善了难以预设的任务，再扩大相应范围。企业需要的是合适的工作机制，Agent数量本身并不是能力水平的证明。\n"},{"file":"20-上下文与检索.md","id":"lesson-20","number":20,"role":"核心课","part":3,"title":"第20章｜旧报价找到了，为什么还不能直接拿来用","md":"# 第20章｜旧报价找到了，为什么还不能直接拿来用\n\n客户发来的产品描述，与一笔历史询价很相似。AI迅速找到旧报价：型号接近、数量相仿，过去也确实交付过。销售可能因此觉得已经找到答案。但本次客户只接受三天到货，旧客户允许十天；旧价格和库存也可能已经失效。\n\n这正是[工业品报价教学案例](案例B-智能资源成本.md)需要分清的两件事：找到相关经验，能够帮助团队更快理解问题；决定今天可以承诺什么，还要依靠今天的事实。\n\n## 企业保存的资料，不会自动全部进入一次判断\n\n企业可能有产品手册、历史报价、供应商回复、正式规则和人员修订。它们分散存放，并不意味着模型回答时已经看见了全部重要内容。每次工作都需要选择并取得相关材料，这些实际进入当前判断的材料，通常称为“上下文”。\n\n上下文不仅包括客户刚输入的一句话，也可以包括当前目标、有效规则、相关历史、查询结果和未完成事项。选得不全，模型可能缺少关键条件；全部塞入，又可能让旧版本与新版本混在一起，增加阅读和调用负担。\n\n上下文工程关注怎样为当前任务组织合适信息。[工程材料](https://www.anthropic.com/research/effective-context-engineering-for-ai-agents) 对企业读者来说，最需要理解的是：知识库负责保存，当前任务负责选择和使用，二者之间还有一项具体工作。\n\n## 同样被找到的材料，作用并不相同\n\n客户本次的三天期限，用于判断方案是否满足目标。现行价格和确认过的库存，用于判断当前能否履约。历史报价则帮助团队理解曾经怎样比较、遇到什么问题。正式规则说明哪些承诺可以作出，反例提醒哪些条件容易被忽略。\n\n若把这些材料都当成同等有效的事实，模型可能拿历史交期覆盖当前期限，或者拿过去成交价替代今天的报价依据。材料“相似”只能说明值得比较，不能证明仍然适用。\n\n| 材料 | 对当前任务的作用 |\n|---|---|\n| 本次客户要求 | 确定用途、数量、期限与限制 |\n| 当前价格、库存和供货确认 | 判断今天可以承诺什么 |\n| 历史报价与适配过程 | 提供路线与需要核对的条件 |\n| 有效规则及反例 | 确定采用边界，避免已知错误 |\n\n例如旧案选择某型号，是因为当时有现货。本次若已经缺货，旧案仍能提示适配检查，却不能证明交期成立。这个区别应当体现在建议里，而不是只在资料库中保留一个更新时间。\n\n![历史案例、规则与反例经条件和版本检查进入本次任务，当前事实另行进入；相似材料不能覆盖已经变化的条件。](assets/20-当前上下文.svg)\n\n图中历史材料需要经过条件检查再进入任务，当前事实则需要单独取得。两者汇合后，团队才能比较“过去怎么做”与“今天能怎么做”。\n\n## 一次建议出错，应当回到实际材料定位\n\n如果现行价格存在，却没有进入这次回答，问题可能在关联或筛选。如果新旧价格都进入，模型仍选了旧的，就需要改善材料地位、版本呈现或任务检查。如果所谓现行表本身已经过时，则首先要修复事实来源。\n\n这三种情况都可能表现为“AI报错价格”，但解决方法不同。仅要求模型更谨慎，并不能替代定位。FDE应查看当次实际取得了什么、输出怎样使用了它，以及人员怎样核验，而不只听模型事后给出的解释。\n\n## 好的资料选择，应由当前决定支配\n\n一个确定的价格查询，通常只需要当前有效记录和适用条件，没有必要加载全部历史报价。复杂替代判断则需要多个候选、过去的否决理由和重要反例。材料多少应随任务变化。\n\n企业积累越多，选择能力越重要。否则知识库越大，员工和AI越难分辨哪些内容仍然可用。有效的组织方式使旧经验帮助团队更快找到问题，使当前事实约束实际承诺。到了这一步，资料才真正成为生产条件，而不只是存储空间里越来越多的文件。\n","html":"\u003ch1>第20章｜旧报价找到了，为什么还不能直接拿来用\u003c/h1>\n\u003cp>客户发来的产品描述，与一笔历史询价很相似。AI迅速找到旧报价：型号接近、数量相仿，过去也确实交付过。销售可能因此觉得已经找到答案。但本次客户只接受三天到货，旧客户允许十天；旧价格和库存也可能已经失效。\u003c/p>\n\u003cp>这正是\u003ca href=\"#case-b\">工业品报价教学案例\u003c/a>需要分清的两件事：找到相关经验，能够帮助团队更快理解问题；决定今天可以承诺什么，还要依靠今天的事实。\u003c/p>\n\u003ch2 id=\"lesson-20-section-1\">企业保存的资料，不会自动全部进入一次判断\u003c/h2>\n\u003cp>企业可能有产品手册、历史报价、供应商回复、正式规则和人员修订。它们分散存放，并不意味着模型回答时已经看见了全部重要内容。每次工作都需要选择并取得相关材料，这些实际进入当前判断的材料，通常称为“上下文”。\u003c/p>\n\u003cp>上下文不仅包括客户刚输入的一句话，也可以包括当前目标、有效规则、相关历史、查询结果和未完成事项。选得不全，模型可能缺少关键条件；全部塞入，又可能让旧版本与新版本混在一起，增加阅读和调用负担。\u003c/p>\n\u003cp>上下文工程关注怎样为当前任务组织合适信息。\u003ca href=\"https://www.anthropic.com/research/effective-context-engineering-for-ai-agents\" target=\"_blank\" rel=\"noopener noreferrer\">工程材料\u003c/a> 对企业读者来说，最需要理解的是：知识库负责保存，当前任务负责选择和使用，二者之间还有一项具体工作。\u003c/p>\n\u003ch2 id=\"lesson-20-section-2\">同样被找到的材料，作用并不相同\u003c/h2>\n\u003cp>客户本次的三天期限，用于判断方案是否满足目标。现行价格和确认过的库存，用于判断当前能否履约。历史报价则帮助团队理解曾经怎样比较、遇到什么问题。正式规则说明哪些承诺可以作出，反例提醒哪些条件容易被忽略。\u003c/p>\n\u003cp>若把这些材料都当成同等有效的事实，模型可能拿历史交期覆盖当前期限，或者拿过去成交价替代今天的报价依据。材料“相似”只能说明值得比较，不能证明仍然适用。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>材料\u003c/th>\n\u003cth>对当前任务的作用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>本次客户要求\u003c/td>\n\u003ctd>确定用途、数量、期限与限制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>当前价格、库存和供货确认\u003c/td>\n\u003ctd>判断今天可以承诺什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>历史报价与适配过程\u003c/td>\n\u003ctd>提供路线与需要核对的条件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>有效规则及反例\u003c/td>\n\u003ctd>确定采用边界，避免已知错误\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>例如旧案选择某型号，是因为当时有现货。本次若已经缺货，旧案仍能提示适配检查，却不能证明交期成立。这个区别应当体现在建议里，而不是只在资料库中保留一个更新时间。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTUwIiB2aWV3Qm94PSIwIDAgMzYwIDU1MCIgcm9sZT0iaW1nIj48dGl0bGU+5oqK6YCC55So5p2Q5paZ5bim6L+b5b2T5YmN5Lu75YqhPC90aXRsZT48ZGVzYz7ljoblj7LmoYjkvovjgIHmraPlvI/op4TliJnlkozlj43kvovnu4/ov4fmnaHku7bkuI7niYjmnKzmo4Dmn6XvvIzlkozlvZPliY3kuovlrp7lhbHlkIzmlK/mjIHmnKzmrKHlt6XkvZzjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjU1MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iN 及人员怎样核验，而不只听模型事后给出的解释。\u003c/p>\n\u003ch2 id=\"lesson-20-section-4\">好的资料选择，应由当前决定支配\u003c/h2>\n\u003cp>一个确定的价格查询，通常只需要当前有效记录和适用条件，没有必要加载全部历史报价。复杂替代判断则需要多个候选、过去的否决理由和重要反例。材料多少应随任务变化。\u003c/p>\n\u003cp>企业积累越多，选择能力越重要。否则知识库越大，员工和AI越难分辨哪些内容仍然可用。有效的组织方式使旧经验帮助团队更快找到问题，使当前事实约束实际承诺。到了这一步，资料才真正成为生产条件，而不只是存储空间里越来越多的文件。\u003c/p>\n","headings":[{"id":"lesson-20-section-1","label":"企业保存的资料，不会自动全部进入一次判断"},{"id":"lesson-20-section-2","label":"同样被找到的材料，作用并不相同"},{"id":"lesson-20-section-3","label":"一次建议出错，应当回到实际材料定位"},{"id":"lesson-20-section-4","label":"好的资料选择，应由当前决定支配"}],"exportMd":"# 第20章｜旧报价找到了，为什么还不能直接拿来用\n\n客户发来的产品描述，与一笔历史询价很相似。AI迅速找到旧报价：型号接近、数量相仿，过去也确实交付过。销售可能因此觉得已经找到答案。但本次客户只接受三天到货，旧客户允许十天；旧价格和库存也可能已经失效。\n\n这正是[工业品报价教学案例](#case-b)需要分清的两件事：找到相关经验，能够帮助团队更快理解问题；决定今天可以承诺什么，还要依靠今天的事实。\n\n## 企业保存的资料，不会自动全部进入一次判断\n\n企业可能有产品手册、历史报价、供应商回复、正式规则和人员修订。它们分散存放，并不意味着模型回答时已经看见了全部重要内容。每次工作都需要选择并取得相关材料，这些实际进入当前判断的材料，通常称为“上下文”。\n\n上下文不仅包括客户刚输入的一句话，也可以包括当前目标、有效规则、相关历史、查询结果和未完成事项。选得不全，模型可能缺少关键条件；全部塞入，又可能让旧版本与新版本混在一起，增加阅读和调用负担。\n\n上下文工程关注怎样为当前任务组织合适信息。[工程材料](https://www.anthropic.com/research/effective-context-engineering-for-ai-agents) 对企业读者来说，最需要理解的是：知识库负责保存，当前任务负责选择和使用，二者之间还有一项具体工作。\n\n## 同样被找到的材料，作用并不相同\n\n客户本次的三天期限，用于判断方案是否满足目标。现行价格和确认过的库存，用于判断当前能否履约。历史报价则帮助团队理解曾经怎样比较、遇到什么问题。正式规则说明哪些承诺可以作出，反例提醒哪些条件容易被忽略。\n\n若把这些材料都当成同等有效的事实，模型可能拿历史交期覆盖当前期限，或者拿过去成交价替代今天的报价依据。材料“相似”只能说明值得比较，不能证明仍然适用。\n\n| 材料 | 对当前任务的作用 |\n|---|---|\n| 本次客户要求 | 确定用途、数量、期限与限制 |\n| 当前价格、库存和供货确认 | 判断今天可以承诺什么 |\n| 历史报价与适配过程 | 提供路线与需要核对的条件 |\n| 有效规则及反例 | 确定采用边界，避免已知错误 |\n\n例如旧案选择某型号，是因为当时有现货。本次若已经缺货，旧案仍能提示适配检查，却不能证明交期成立。这个区别应当体现在建议里，而不是只在资料库中保留一个更新时间。\n\n![历史案例、规则与反例经条件和版本检查进入本次任务，当前事实另行进入；相似材料不能覆盖已经变化的条件。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTUwIiB2aWV3Qm94PSIwIDAgMzYwIDU1MCIgcm9sZT0iaW1nIj48dGl0bGU+5oqK6YCC55So5p2Q5paZ5bim6L+b5b2T5YmN5Lu75YqhPC90aXRsZT48ZGVzYz7ljoblj7LmoYjkvovjgIHmraPlvI/op4TliJnlkozlj43kvovnu4/ov4fmnaHku7bkuI7niYjmnKzmo4Dmn6XvvIzlkozlvZPliY3k 认 | 判断今天可以承诺什么 |\n| 历史报价与适配过程 | 提供路线与需要核对的条件 |\n| 有效规则及反例 | 确定采用边界，避免已知错误 |\n\n例如旧案选择某型号，是因为当时有现货。本次若已经缺货，旧案仍能提示适配检查，却不能证明交期成立。这个区别应当体现在建议里，而不是只在资料库中保留一个更新时间。\n\n \n\n图中历史材料需要经过条件检查再进入任务，当前事实则需要单独取得。两者汇合后，团队才能比较“过去怎么做”与“今天能怎么做”。\n\n## 一次建议出错，应当回到实际材料定位\n\n如果现行价格存在，却没有进入这次回答，问题可能在关联或筛选。如果新旧价格都进入，模型仍选了旧的，就需要改善材料地位、版本呈现或任务检查。如果所谓现行表本身已经过时，则首先要修复事实来源。\n\n这三种情况都可能表现为“AI报错价格”，但解决方法不同。仅要求模型更谨慎，并不能替代定位。FDE应查看当次实际取得了什么、输出怎样使用了它，以及人员怎样核验，而不只听模型事后给出的解释。\n\n## 好的资料选择，应由当前决定支配\n\n一个确定的价格查询，通常只需要当前有效记录和适用条件，没有必要加载全部历史报价。复杂替代判断则需要多个候选、过去的否决理由和重要反例。材料多少应随任务变化。\n\n企业积累越多，选择能力越重要。否则知识库越大，员工和AI越难分辨哪些内容仍然可用。有效的组织方式使旧经验帮助团队更快找到问题，使当前事实约束实际承诺。到了这一步，资料才真正成为生产条件，而不只是存储空间里越来越多的文件。\n"},{"file":"21-建议与真实执行.md","id":"lesson-21","number":21,"role":"核心课","part":3,"title":"第21章｜AI说“已经安排”，业务究竟发生到了哪一步","md":"# 第21章｜AI说“已经安排”，业务究竟发生到了哪一步\n\n客户仍在等待技术员上门，调度员却看到AI回复“已经安排”。这句话可能对应几种完全不同的情况：AI只是写好了派工建议；调度员已经批准，但尚未提交；派工系统已经接受，只是网络中断，没有把结果返回。\n\n如果不分清就再提交一次，第一种情况仍需完成审批，第三种情况却可能重复占用人员。企业把AI接进真实生产时，必须让“做到了哪一步”能够由实际记录证明。\n\n## 同一张工单，会经过几种不同的完成\n\n在[设备售后教学案例](案例C-设备售后.md)中，AI准备好设备历史和建议人员，只表示材料完成。调度员决定采用，表示作出了派工选择。派工系统接受，表示形成了正式任务。技术员到场、设备恢复、后续没有复发，则分别是更后面的事实。\n\n这些状态之所以要区分，是因为下一位同事要据此行动。建议尚未采用时，不能通知客户已经有人出发；系统接受以后，应跟进到场，而不是再次派工；设备恢复以后，还可能需要观察复发，不能把内部关闭工单当成长期解决。\n\n![建议、采用、系统接受、到场与恢复代表不同事实；无回显时先查同一次提交，才能决定续接还是重试。](assets/21-业务状态.svg)\n\n图中每一步都需要相应证据。例如系统任务编号可以证明接受，技术员反馈可以证明到场，客户或设备状态可以支持恢复判断。AI自然语言说得多确定，不会改变这些证据是否存在。\n\n## 工具接入，实际改变了什么\n\n模型能够调用工具，意味着它可以通过指定方式查询或操作业务系统。例如查询工单、检查人员安排、创建派工。企业不需要管理者记住接口参数，但应能说明：作用于哪张工单，以什么身份执行，哪些动作可以直接完成，哪些需要谁决定，完成后到哪里查结果。\n\n对象不清，可能把同名客户的设备混淆；权限不清，可能把一个建议直接变成客户承诺；返回结果不清，人员就不知道应该继续等待还是重新操作。这些都直接影响交付，而不只是技术细节。[Agent工程材料](https://www.anthropic.com/research/building-effective-agents)\n\nFDE应把工具含义翻译成业务能够核对的动作。比如“准备派工”和“正式创建派工”是两个不同操作，不能因为界面上只有一个按钮就合并责任。\n\n## 网络中断以后，怎样接着做\n\n假设系统提交派工后没有回显。此时需要查询的是这一次提交，而不是泛泛地查“这张工单有没有派过人”。同一设备可能以前已经服务过，查到旧派工记录，并不能证明本次成功。\n\n因此，提交前应保留本次请求与工单的对应关系。恢复后，用它确认本次是否已被接受：已接受，就继续跟进；明确未接受，再按当前安排重试；仍无法确认，则保留待核状态，交给相应处理。这样既避免重复，也避免把未知当成失败后漏掉已经发生的动作。\n\n这是让AI能够可靠接续工作的基础。若没有这种记录，再强的模型也只能根据不完整的文字猜测，无法从现实中恢复事实。\n\n## 人工确认应当承担什么作用\n\n资源分配、特殊成本和客户承诺需要相应决定者判断。稳定且可核验的记录或查询，则可以由系统完成并提供证据。把每一步都设成“人点一下”，不一定更可靠；如果确认者不知道该核什么，增加的只是操作。\n\n验收时，可以沿一笔真实工作看：建议怎样形成，谁决定采用，系统怎样接受，下一岗位看到了什么，客户结果怎样回来。也应看中断和异常时能否接续，而不是只测顺利的一次提交。\n\n当每一步完成都有清楚含义，企业才能逐渐扩大AI的职责。智能参与生产的可靠性，最终体现在实际动作和业务结果之间能够追得通。\n","html":"\u003ch1>第21章｜AI说“已经安排”，业务究竟发生到了哪一步\u003c/h1>\n\u003cp>客户仍在等待技术员上门，调度员却看到AI回复“已经安排”。这句话可能对应几种完全不同的情况：AI只是写好了派工建议；调度员已经批准，但尚未提交；派工系统已经接受，只是网络中断，没有把结果返回。\u003c/p>\n\u003cp>如果不分清就再提交一次，第一种情况仍需完成审批，第三种情况却可能重复占用人员。企业把AI接进真实生产时，必须让“做到了哪一步”能够由实际记录证明。\u003c/p>\n\u003ch2 id=\"lesson-21-section-1\">同一张工单，会经过几种不同的完成\u003c/h2>\n\u003cp>在\u003ca href=\"#case-c\">设备售后教学案例\u003c/a>中，AI准备好设备历史和建议人员，只表示材料完成。调度员决定采用，表示作出了派工选择。派工系统接受，表示形成了正式任务。技术员到场、设备恢复、后续没有复发，则分别是更后面的事实。\u003c/p>\n\u003cp>这些状态之所以要区分，是因为下一位同事要据此行动。建议尚未采用时，不能通知客户已经有人出发；系统接受以后，应跟进到场，而不是再次派工；设备恢复以后，还可能需要观察复发，不能把内部关闭工单当成长期解决。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTc1IiB2aWV3Qm94PSIwIDAgMzYwIDU3NSIgcm9sZT0iaW1nIj48dGl0bGU+5q+P5Liq54q25oCB6YO95piv5LiN5ZCM5LqL5a6ePC90aXRsZT48ZGVzYz7lu7rorq7jgIHph4fnlKjjgIHns7vnu5/mjqXlj5fjgIHliLDlnLrlkozmgaLlpI3kuI3og73nm7jkupLmm7/ku6PvvJvml6Dlm57mmL7ml7blhYjmn6Xlrp7pmYXnirbmgIHjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjU3NSIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob CIgZm9udC1mYW1pbHk9IlBpbmdGYW5nIFNDLE1pY3Jvc29mdCBZYUhlaSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmaWxsPSIjODc1ZDIyIiB0ZXh0LWFuY2hvcj0ic3RhcnQiIGZvbnQtd2VpZ2h0PSI0MDAiPuaPkOS6pOaXoOWbnuaYvu+8muWFiOafpeaYr+WQpuW3suaOpeWPlzwvdGV4dD48dGV4dCB4PSIyNCIgeT0iNTU0IiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM4NzVkMjIiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjQwMCI+5YaN5Yaz5a6a57ut5o6l77yM6YG/5YWN6YeN5aSN5rS+5belPC90ZXh0Pjwvc3ZnPg==\" alt=\"建议、采用、系统接受、到场与恢复代表不同事实；无回显时先查同一次提交，才能决定续接还是重试。\">\u003c/p>\n\u003cp>图中每一步都需要相应证据。例如系统任务编号可以证明接受，技术员反馈可以证明到场，客户或设备状态可以支持恢复判断。AI自然语言说得多确定，不会改变这些证据是否存在。\u003c/p>\n\u003ch2 id=\"lesson-21-section-2\">工具接入，实际改变了什么\u003c/h2>\n\u003cp>模型能够调用工具，意味着它可以通过指定方式查询或操作业务系统。例如查询工单、检查人员安排、创建派工。企业不需要管理者记住接口参数，但应能说明：作用于哪张工单，以什么身份执行，哪些动作可以直接完成，哪些需要谁决定，完成后到哪里查结果。\u003c/p>\n\u003cp>对象不清，可能把同名客户的设备混淆；权限不清，可能把一个建议直接变成客户承诺；返回结果不清，人员就不知道应该继续等待还是重新操作。这些都直接影响交付，而不只是技术细节。\u003ca href=\"https://www.anthropic.com/research/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">Agent工程材料\u003c/a>\u003c/p>\n\u003cp>FDE应把工具含义翻译成业务能够核对的动作。比如“准备派工”和“正式创建派工”是两个不同操作，不能因为界面上只有一个按钮就合并责任。\u003c/p>\n\u003ch2 id=\"lesson-21-section-3\">网络中断以后，怎样接着做\u003c/h2>\n\u003cp>假设系统提交派工后没有回显。此时需要查询的是这一次提交，而不是泛泛地查“这张工单有没有派过人”。同一设备可能以前已经服务过，查到旧派工记录，并不能证明本次成功。\u003c/p>\n\u003cp>因此，提交前应保留本次请求与工单的对应关系。恢复后，用它确认本次是否已被接受：已接受，就继续跟进；明确未接受，再按当前安排重试；仍无法确认，则保留待核状态，交给相应处理。这样既避免重复，也避免把未知当成失败后漏掉已经发生的动作。\u003c/p>\n\u003cp>这是让AI能够可靠接续工作的基础。若没有这种记录，再强的模型也只能根据不完整的文字猜测，无法从现实中恢复事实。\u003c/p>\n\u003ch2 id=\"lesson-21-section-4\">人工确认应当承担什么作用\u003c/h2>\n\u003cp>资源分配、特殊成本和客户承诺需要相应决定者判断。稳定且可核验的记录或查询，则可以由系统完成并提供证据。把每一步都设成“人点一下”，不一定更可靠；如果确认者不知道该核什么，增加的只是操作。\u003c/p>\n\u003cp>验收时，可以沿一笔真实工作看：建议怎样形成，谁决定采用，系统怎样接受，下一岗位看到了什么，客户结果怎样回来。也应看中断和异常时能否接续，而不是只测顺利的一次提交。\u003c/p>\n\u003cp>当每一步完成都有清楚含义，企业才能逐渐扩大AI的职责。智能参与生产的可靠性，最终体现在实际动作和业务结果之间能够追得通。\u003c/p>\n","headings":[{"id":"lesson-21-section-1","label":"同一张工单，会经过几种不同的完成"},{"id":"lesson-21-section-2","label":"工具接入，实际改变了什么"},{"id":"lesson-21-section-3","label":"网络中断以后，怎样接着做"},{"id":"lesson-21-section-4","label":"人工确认应当承担什么作用"}],"exportMd":"# 第21章｜AI说“已经安排”，业务究竟发生到了哪一步\n\n客户仍在等待技术员上门，调度员却看到AI回复“已经安排”。这句话可能对应几种完全不同的情况：AI只是写好了派工建议；调度员已经批准，但尚未提交；派工系统已经接受，只是网络中断，没有把结果返回。\n\n如果不分清就再提交一次，第一种情况仍需完成审批，第三种情况却可能重复占用人员。企业把AI接进真实生产时，必须让“做到了哪一步”能够由实际记录证明。\n\n## 同一张工单，会经过几种不同的完成\n\n在[设备售后教学案例](#case-c)中，AI准备好设备历史和建议人员，只表示材料完成。调度员决定采用，表示作出了派工选择。派工系统接受，表示形成了正式任务。技术员到场、设备恢复、后续没有复发，则分别是更后面的事实。\n\n这些状态之所以要区分，是因为下一位同事要据此行动。建议尚未采用时，不能通知客户已经有人出发；系统接受以后，应跟进到场，而不是再次派工；设备恢复以后，还可能需要观察复发，不能把内部关闭工单当成长期解决。\n\n![建议、采用、系统接受、到场与恢复代表不同事实；无回显时先查同一次提交，才能决定续接还是重试。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTc1IiB2aWV3Qm94PSIwIDAgMzYwIDU3NSIgcm9sZT0iaW1nIj48dGl0bGU+5q+P5Liq54q25oCB6YO95piv5LiN5ZCM5LqL5a6ePC90aXRsZT48ZGVzYz7lu7rorq7jgIHph4fnlKjjgIHns7vnu5/mjqXlj5fjgIHliLDlnLrlkozmgaLlpI3kuI3og73nm7jkupLmm7/ku6PvvJvml6Dlm57mmL7ml7blhYjmn6Xlrp7pmYXnirbmgIHjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjU3NSIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7mr4/kuKrnirbmgIHpg73mmK/kuI3lkIzkuovlrp48L3RleHQ+PGNpcmNsZSBjeD0iMzUiIGN5PSIxMDMiIHI9IjE3IiBmaWxsPSIjZWRmM2VkIiBzdHJva2U9IiMxNjVkNTIiIHN0cm9rZS13aWR0aD0iMiIvPjx0ZXh0IHg9IjM1IiB5PSIxMTAiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxOCIgZmlsbD YiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiM4NzVkMjIiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjQwMCI+5YaN5Yaz5a6a57ut5o6l77yM6YG/5YWN6YeN5aSN5rS+5belPC90ZXh0Pjwvc3ZnPg==)\n\n图中每一步都需要相应证据。例如系统任务编号可以证明接受，技术员反馈可以证明到场，客户或设备状态可以支持恢复判断。AI自然语言说得多确定，不会改变这些证据是否存在。\n\n## 工具接入，实际改变了什么\n\n模型能够调用工具，意味着它可以通过指定方式查询或操作业务系统。例如查询工单、检查人员安排、创建派工。企业不需要管理者记住接口参数，但应能说明：作用于哪张工单，以什么身份执行，哪些动作可以直接完成，哪些需要谁决定，完成后到哪里查结果。\n\n对象不清，可能把同名客户的设备混淆；权限不清，可能把一个建议直接变成客户承诺；返回结果不清，人员就不知道应该继续等待还是重新操作。这些都直接影响交付，而不只是技术细节。[Agent工程材料](https://www.anthropic.com/research/building-effective-agents)\n\nFDE应把工具含义翻译成业务能够核对的动作。比如“准备派工”和“正式创建派工”是两个不同操作，不能因为界面上只有一个按钮就合并责任。\n\n## 网络中断以后，怎样接着做\n\n假设系统提交派工后没有回显。此时需要查询的是这一次提交，而不是泛泛地查“这张工单有没有派过人”。同一设备可能以前已经服务过，查到旧派工记录，并不能证明本次成功。\n\n因此，提交前应保留本次请求与工单的对应关系。恢复后，用它确认本次是否已被接受：已接受，就继续跟进；明确未接受，再按当前安排重试；仍无法确认，则保留待核状态，交给相应处理。这样既避免重复，也避免把未知当成失败后漏掉已经发生的动作。\n\n这是让AI能够可靠接续工作的基础。若没有这种记录，再强的模型也只能根据不完整的文字猜测，无法从现实中恢复事实。\n\n## 人工确认应当承担什么作用\n\n资源分配、特殊成本和客户承诺需要相应决定者判断。稳定且可核验的记录或查询，则可以由系统完成并提供证据。把每一步都设成“人点一下”，不一定更可靠；如果确认者不知道该核什么，增加的只是操作。\n\n验收时，可以沿一笔真实工作看：建议怎样形成，谁决定采用，系统怎样接受，下一岗位看到了什么，客户结果怎样回来。也应看中断和异常时能否接续，而不是只测顺利的一次提交。\n\n当每一步完成都有清楚含义，企业才能逐渐扩大AI的职责。智能参与生产的可靠性，最终体现在实际动作和业务结果之间能够追得通。\n","exportSingleMd":"# 第21章｜AI说“已经安排”，业务究竟发生到了哪一步\n\n客户仍在等待技术员上门，调度员却看到AI回复“已经安排”。这句话可能对应几种完全不同的情况：AI只是写好了派工建议；调度员已经批准，但尚未提交；派工系统已经接受，只是网络中断，没有把结果返回。\n\n如果不分清就再提交一次，第一种情况仍需完成审批，第三种情况却可能重复占用人员。企业把AI接进真实生产时，必须让“做到了哪一步”能够由实际记录证明。\n\n## 同一张工单，会经过几种不同的完成\n\n在[设备售后教学案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-c)中，AI准备好设备历史和建议人员，只表示材料完成。调度员决定采用，表示作出了派工选择。派工系统接受，表示形成了正式任务。技术员到场、设备恢复、后续没有复发，则分别是更后面的事实。\n\n这些状态之所以要区分，是因为下一位同事要据此行动。建议尚未采用时，不能通知客户已经有人出发；系统接受以后，应跟进到场，而不是再次派工；设备恢复以后，还可能需要观察复发，不能把内部关闭工单当成长期解决。\n\n![建议、采用、系统接受、到场与恢复代表不同事实；无回显时先查同一次提交，才能决定续接还是重试。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTc1IiB2aWV3Qm94PSIwIDAgMzYwIDU3NSIgcm9sZT0iaW1nIj48dGl0bGU+5q+P5Liq54q25oCB6YO95piv5LiN5ZCM5LqL5a6ePC90aXRsZT48ZGVzYz7lu7rorq7jgIHph4fnlKjjgIHns7vnu5/mjqXlj5fjg
