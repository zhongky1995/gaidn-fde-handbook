一起，问题开始变大。\n\n| 材料 | 看到什么 | 原来没有被一起讨论的关系 |\n|---|---|---|\n| X店销量与消息 | 售出80，18点售罄，之后有人问 | 销量被库存封顶，不能看见全部需求 |\n| 工坊排产 | 这两店只排160份 | 在其他6店订单已安排后，对应窗口仍可做320份 |\n| 配送安排 | 原路线只有一次到店 | 下午补货需要增加一趟，费用50元 |\n| 门店工作 | 该商品售罄后停止社群推介，不再持续登记预订 | 供给不足也改变了员工获取需求的动作 |\n| 总部日报 | 只保留销量80与剩余0 | 没有售罄时点，也看不到停止推介以后失去的线索 |\n\n这里的产能和员工动作是给定的现场观察，不能只凭“卖完了”就推断出来。320份是在当前人员、原料与设备条件下为两店可用的生产窗口；增加补货可利用下午时段，17点到店的方案还要核品质与接待。工坊窗口利用率是160÷320=50%，并不等于整个工厂只有一半利用率；员工仍在销售其他商品，问题是围绕这款商品的增长动作提前停止。\n\n原来每个部门都能解释自己：工坊按已成交数量排产，配送按原路线执行，门店没货便不再推广。组合起来，却形成一条自我限制的链：少排产使商品早卖完，早卖完使推介和预订停止，系统只留下受限销量，下一轮继续按这个销量安排。\n\n## AI要找的，是这些材料之间的关系\n\nFDE先把营业日、商品、门店和实际批次对应起来，让AI能够比较销售记录、店长说明、排产窗口、配送和推广记录。AI提出的有用问题会变得具体：X店售罄后还有多少可购买需求？工坊的空档能否用于这一款？晚间补货能否保持品质？门店如果恢复推介，接待与交付是否跟得上？\n\n这些问题指向不同动作。原始询问可以整理成需求线索；排产需要核对人员、原料和其他订单；配送需要实际路线；顾客是否会买，需要通过补货、预订或跟踪观察取得证据。AI帮助把分散事实组织成系统解释，并比较改法，FDE把需要的信息和动作接进生产，负责人决定资源。\n\n因此，项目从“自动整理日报”转成了“恢复被供给和工作安排共同压住的增长”。值得留下的know-how，也包括什么信号触发补货、怎样协调工坊、何时恢复推介，以及结果怎样反过来修改下一轮安排。\n\n## 先比较三个方案，再谈增长幅度\n\n为使账可核对，下面给定一个正常日：X店有160份可购买需求，Y店60份；单价12元，每份实际生产变动成本4元，未售无残值，没有替代购买或调价。原有工资、租金等在本次选择中不变。扩大方案新增补货50元、按量AI及外部整理服务30元，合计80元/日；一次性接入6000元另列。只改分配可用现有方式完成，不新增这80元。\n\n| 方案 | 原安排 | 只改分配 | 扩产并补货 |\n|---|---:|---:|---:|\n| X/Y供货 | 80/80 | 100/60 | 160/60 |\n| 实际生产 | 160 | 160 | 220 |\n| 实际售出 | 140 | 160 | 220 |\n| 营业收入 | 1680元 | 1920元 | 2640元 |\n| 全部生产变动成本 | 640元 | 640元 | 880元 |\n| 新增日常支出 | 0 | 0 | 80元 |\n| 列示贡献 | 1040元 | 1280元 | 1680元 |\n\n原安排的20份剩余也付出了生产成本。只改分配多240元贡献；再扩大供给，多出的不仅是调走余货，而是使用原来没用上的生产窗口，扩产方案相对原安排多640元，相对只改分配多400元。\n\n在这组条件下，X店这款商品从卖80份变为160份，销量和收入都翻倍；两店合计销量从140变220，增加约57.1%。它们不是同一个增长口径，更不能据此说整家企业收入翻倍。生产窗口利用率则从50%提高到68.75%。\n\n如果相同条件持续20个营业日，相对原安排增加的列示贡献是12800元，扣一次性接入6000元后为6800元。真实项目必须用实际需求、成本和持续时间替换这些条件。\n\n## 到底要多卖多少，扩产才值得\n\n管理者并不需要先相信X店一定能卖160份。先问：新增投入需要多少新增销售来覆盖？\n\n与已经改成100/60的方案相比，再生产60份需要240元，加日常新增支出80元，共320元。单价12元，至少多卖27份，才超过这320元。也就是在Y店需求仍为60的给定条件下，X店卖到至少127份，扩产才优于只改分配。\n\n| X实际可购买需求 | 扩产方案售出总数 | 扩产方案贡献 | 与原安排1040元相比 |\n|---|---:|---:|---:|\n| 90份 | 150 | 840元 | 少200元 |\n| 120份 | 180 | 1200元 | 多160元 |\n| 160份 | 220 | 1680元 | 多640元 |\n\n需求120时，扩产比原安排好，却仍不及只改分配的1280元。这个差别会改变项目选择：企业应比较最合理的替代，而不只与原来的差做法比较。\n\n## 怎样试，才能发现真正的增长来源\n\n先核对产能与配送，再在可承受范围内补货、保留当时顾客询问、推介和预订、真实到店数量与售罄情况。供给增加和推广恢复如果同时发生，要记录两者；结果好时才知道下一步该扩大哪个部分。\n\n试点既要看X，也要看Y和其他受影响门店。若新增排产挤占别的高价值商品，机会成本要算；若多销售以牺牲品质换来，短期贡献也不是全部结果。关于缺货后的询问，记录的是线索，不直接把一次询问算成一次购买。\n\n再改变一个条件：交通入口关闭，需求变为X50、Y90，其他价格和费用不变。原80/80贡献920元，100/60贡献680元，仍扩到160/60只剩360元，比原安排少560元。企业要复用的是识别条件、调动资源和及时改法的能力，而非永久记住“X店配160”。\n\n案例的经营机会来自重新连接本来分开的事情。它可能打开远大于日报省时的增长空间，也需要用需求、产能和成本把这个空间变成可选择的投资。\n","html":"\u003ch1>案例A｜畅销商品卖完了，生意为什么没有继续长\u003c/h1>\n\u003cp>本案例由教学条件构成。前半给出经营现场，后半用相同口径比较几种选择；收益是条件推演，不是客户实绩。\u003c/p>\n\u003ch2 id=\"case-a-section-1\">两张报表都没错，合在一起却有问题\u003c/h2>\n\u003cp>一家区域烘焙连锁有8家门店和中央工坊。X店在交通节点附近，Y店服务周边社区。我们只看一种售价12元的主打点心，不把它当作两店全部生意。\u003c/p>\n\u003cp>某个营业日，两店各配80份，原路线上午一次到店，门店营业至20点。X店18点卖完，通勤客流还没结束，之后仍有人询问；Y店卖出60份，剩20份。总部看到的是一店售罄、一店有剩余，于是准备把Y店的20份转给X店。这个调整有道理，但还没有回答：X店究竟少了多少生意，为什么中央工坊没有多做，以及门店为什么没有继续寻找需求。\u003c/p>\n\u003cp>把几份现场材料摆在一起，问题开始变大。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>材料\u003c/th>\n\u003cth>看到什么\u003c/th>\n\u003cth>原来没有被一起讨论的关系\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>X店销量与消息\u003c/td>\n\u003ctd>售出80，18点售罄，之后有人问\u003c/td>\n\u003ctd>销量被库存封顶，不能看见全部需求\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工坊排产\u003c/td>\n\u003ctd>这两店只排160份\u003c/td>\n\u003ctd>在其他6店订单已安排后，对应窗口仍可做320份\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>配送安排\u003c/td>\n\u003ctd>原路线只有一次到店\u003c/td>\n\u003ctd>下午补货需要增加一趟，费用50元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>门店工作\u003c/td>\n\u003ctd>该商品售罄后停止社群推介，不再持续登记预订\u003c/td>\n\u003ctd>供给不足也改变了员工获取需求的动作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>总部日报\u003c/td>\n\u003ctd>只保留销量80与剩余0\u003c/td>\n\u003ctd>没有售罄时点，也看不到停止推介以后失去的线索\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>这里的产能和员工动作是给定的现场观察，不能只凭“卖完了”就推断出来。320份是在当前人员、原料与设备条件下为两店可用的生产窗口；增加补货可利用下午时段，17点到店的方案还要核品质与接待。工坊窗口利用率是160÷320=50%，并不等于整个工厂只有一半利用率；员工仍在销售其他商品，问题是围绕这款商品的增长动作提前停止。\u003c/p>\n\u003cp>原来每个部门都能解释自己：工坊按已成交数量排产，配送按原路线执行，门店没货便不再推广。组合起来，却形成一条自我限制的链：少排产使商品早卖完，早卖完使推介和预订停止，系统只留下受限销量，下一轮继续按这个销量安排。\u003c/p>\n\u003ch2 id=\"case-a-section-2\">AI要找的，是这些材料之间的关系\u003c/h2>\n\u003cp>FDE先把营业日、商品、门店和实际批次对应起来，让AI能够比较销售记录、店长说明、排产窗口、配送和推广记录。AI提出的有用问题会变得具体：X店售罄后还有多少可购买需求？工坊的空档能否用于这一款？晚间补货能否保持品质？门店如果恢复推介，接待与交付是否跟得上？\u003c/p>\n\u003cp>这些问题指向不同动作。原始询问可以整理成需求线索；排产需要核对人员、原料和其他订单；配送需要实际路线；顾客是否会买，需要通过补货、预订或跟踪观察取得证据。AI帮助把分散事实组织成系统解释，并比较改法，FDE把需要的信息和动作接进生产，负责人决定资源。\u003c/p>\n\u003cp>因此，项目从“自动整理日报”转成了“恢复被供给和工作安排共同压住的增长”。值得留下的know-how，也包括什么信号触发补货、怎样协调工坊、何时恢复推介，以及结果怎样反过来修改下一轮安排。\u003c/p>\n\u003ch2 id=\"case-a-section-3\">先比较三个方案，再谈增长幅度\u003c/h2>\n\u003cp>为使账可核对，下面给定一个正常日：X店有160份可购买需求，Y店60份；单价12元，每份实际生产变动成本4元，未售无残值，没有替代购买或调价。原有工资、租金等在本次选择中不变。扩大方案新增补货50元、按量AI及外部整理服务30元，合计80元/日；一次性接入6000元另列。只改分配可用现有方式完成，不新增这80元。\u003c/p>\n\u003cdiv class=\"table-scroll table-wide\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方案\u003c/th>\n\u003cth align=\"right\">原安排\u003c/th>\n\u003cth align=\"right\">只改分配\u003c/th>\n\u003cth align=\"right\">扩产并补货\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>X/Y供货\u003c/td>\n\u003ctd align=\"right\">80/80\u003c/td>\n\u003ctd align=\"right\">100/60\u003c/td>\n\u003ctd align=\"right\">160/60\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>实际生产\u003c/td>\n\u003ctd align=\"right\">160\u003c/td>\n\u003ctd align=\"right\">160\u003c/td>\n\u003ctd align=\"right\">220\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>实际售出\u003c/td>\n\u003ctd align=\"right\">140\u003c/td>\n\u003ctd align=\"right\">160\u003c/td>\n\u003ctd align=\"right\">220\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>营业收入\u003c/td>\n\u003ctd align=\"right\">1680元\u003c/td>\n\u003ctd align=\"right\">1920元\u003c/td>\n\u003ctd align=\"right\">2640元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>全部生产变动成本\u003c/td>\n\u003ctd align=\"right\">640元\u003c/td>\n\u003ctd align=\"right\">640元\u003c/td>\n\u003ctd align=\"right\">880元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新增日常支出\u003c/td>\n\u003ctd align=\"right\">0\u003c/td>\n\u003ctd align=\"right\">0\u003c/td>\n\u003ctd align=\"right\">80元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>列示贡献\u003c/td>\n\u003ctd align=\"right\">1040元\u003c/td>\n\u003ctd align=\"right\">1280元\u003c/td>\n\u003ctd align=\"right\">1680元\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"table-hint\">表格可左右滑动查看\u003c/p>\n\u003cp>原安排的20份剩余也付出了生产成本。只改分配多240元贡献；再扩大供给，多出的不仅是调走余货，而是使用原来没用上的生产窗口，扩产方案相对原安排多640元，相对只改分配多400元。\u003c/p>\n\u003cp>在这组条件下，X店这款商品从卖80份变为160份，销量和收入都翻倍；两店合计销量从140变220，增加约57.1%。它们不是同一个增长口径，更不能据此说整家企业收入翻倍。生产窗口利用率则从50%提高到68.75%。\u003c/p>\n\u003cp>如果相同条件持续20个营业日，相对原安排增加的列示贡献是12800元，扣一次性接入6000元后为6800元。真实项目必须用实际需求、成本和持续时间替换这些条件。\u003c/p>\n\u003ch2 id=\"case-a-section-4\">到底要多卖多少，扩产才值得\u003c/h2>\n\u003cp>管理者并不需要先相信X店一定能卖160份。先问：新增投入需要多少新增销售来覆盖？\u003c/p>\n\u003cp>与已经改成100/60的方案相比，再生产60份需要240元，加日常新增支出80元，共320元。单价12元，至少多卖27份，才超过这320元。也就是在Y店需求仍为60的给定条件下，X店卖到至少127份，扩产才优于只改分配。\u003c/p>\n\u003cdiv class=\"table-scroll table-wide\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>X实际可购买需求\u003c/th>\n\u003cth align=\"right\">扩产方案售出总数\u003c/th>\n\u003cth align=\"right\">扩产方案贡献\u003c/th>\n\u003cth align=\"right\">与原安排1040元相比\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>90份\u003c/td>\n\u003ctd align=\"right\">150\u003c/td>\n\u003ctd align=\"right\">840元\u003c/td>\n\u003ctd align=\"right\">少200元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>120份\u003c/td>\n\u003ctd align=\"right\">180\u003c/td>\n\u003ctd align=\"right\">1200元\u003c/td>\n\u003ctd align=\"right\">多160元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>160份\u003c/td>\n\u003ctd align=\"right\">220\u003c/td>\n\u003ctd align=\"right\">1680元\u003c/td>\n\u003ctd align=\"right\">多640元\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"table-hint\">表格可左右滑动查看\u003c/p>\n\u003cp>需求120时，扩产比原安排好，却仍不及只改分配的1280元。这个差别会改变项目选择：企业应比较最合理的替代，而不只与原来的差做法比较。\u003c/p>\n\u003ch2 id=\"case-a-section-5\">怎样试，才能发现真正的增长来源\u003c/h2>\n\u003cp>先核对产能与配送，再在可承受范围内补货、保留当时顾客询问、推介和预订、真实到店数量与售罄情况。供给增加和推广恢复如果同时发生，要记录两者；结果好时才知道下一步该扩大哪个部分。\u003c/p>\n\u003cp>试点既要看X，也要看Y和其他受影响门店。若新增排产挤占别的高价值商品，机会成本要算；若多销售以牺牲品质换来，短期贡献也不是全部结果。关于缺货后的询问，记录的是线索，不直接把一次询问算成一次购买。\u003c/p>\n\u003cp>再改变一个条件：交通入口关闭，需求变为X50、Y90，其他价格和费用不变。原80/80贡献920元，100/60贡献680元，仍扩到160/60只剩360元，比原安排少560元。企业要复用的是识别条件、调动资源和及时改法的能力，而非永久记住“X店配160”。\u003c/p>\n\u003cp>案例的经营机会来自重新连接本来分开的事情。它可能打开远大于日报省时的增长空间，也需要用需求、产能和成本把这个空间变成可选择的投资。\u003c/p>\n","headings":[{"id":"case-a-section-1","label":"两张报表都没错，合在一起却有问题"},{"id":"case-a-section-2","label":"AI要找的，是这些材料之间的关系"},{"id":"case-a-section-3","label":"先比较三个方案，再谈增长幅度"},{"id":"case-a-section-4","label":"到底要多卖多少，扩产才值得"},{"id":"case-a-section-5","label":"怎样试，才能发现真正的增长来源"}],"exportMd":"# 案例A｜畅销商品卖完了，生意为什么没有继续长\n\n本案例由教学条件构成。前半给出经营现场，后半用相同口径比较几种选择；收益是条件推演，不是客户实绩。\n\n## 两张报表都没错，合在一起却有问题\n\n一家区域烘焙连锁有8家门店和中央工坊。X店在交通节点附近，Y店服务周边社区。我们只看一种售价12元的主打点心，不把它当作两店全部生意。\n\n某个营业日，两店各配80份，原路线上午一次到店，门店营业至20点。X店18点卖完，通勤客流还没结束，之后仍有人询问；Y店卖出60份，剩20份。总部看到的是一店售罄、一店有剩余，于是准备把Y店的20份转给X店。这个调整有道理，但还没有回答：X店究竟少了多少生意，为什么中央工坊没有多做，以及门店为什么没有继续寻找需求。\n\n把几份现场材料摆在一起，问题开始变大。\n\n| 材料 | 看到什么 | 原来没有被一起讨论的关系 |\n|---|---|---|\n| X店销量与消息 | 售出80，18点售罄，之后有人问 | 销量被库存封顶，不能看见全部需求 |\n| 工坊排产 | 这两店只排160份 | 在其他6店订单已安排后，对应窗口仍可做320份 |\n| 配送安排 | 原路线只有一次到店 | 下午补货需要增加一趟，费用50元 |\n| 门店工作 | 该商品售罄后停止社群推介，不再持续登记预订 | 供给不足也改变了员工获取需求的动作 |\n| 总部日报 | 只保留销量80与剩余0 | 没有售罄时点，也看不到停止推介以后失去的线索 |\n\n这里的产能和员工动作是给定的现场观察，不能只凭“卖完了”就推断出来。320份是在当前人员、原料与设备条件下为两店可用的生产窗口；增加补货可利用下午时段，17点到店的方案还要核品质与接待。工坊窗口利用率是160÷320=50%，并不等于整个工厂只有一半利用率；员工仍在销售其他商品，问题是围绕这款商品的增长动作提前停止。\n\n原来每个部门都能解释自己：工坊按已成交数量排产，配送按原路线执行，门店没货便不再推广。组合起来，却形成一条自我限制的链：少排产使商品早卖完，早卖完使推介和预订停止，系统只留下受限销量，下一轮继续按这个销量安排。\n\n## AI要找的，是这些材料之间的关系\n\nFDE先把营业日、商品、门店和实际批次对应起来，让AI能够比较销售记录、店长说明、排产窗口、配送和推广记录。AI提出的有用问题会变得具体：X店售罄后还有多少可购买需求？工坊的空档能否用于这一款？晚间补货能否保持品质？门店如果恢复推介，接待与交付是否跟得上？\n\n这些问题指向不同动作。原始询问可以整理成需求线索；排产需要核对人员、原料和其他订单；配送需要实际路线；顾客是否会买，需要通过补货、预订或跟踪观察取得证据。AI帮助把分散事实组织成系统解释，并比较改法，FDE把需要的信息和动作接进生产，负责人决定资源。\n\n因此，项目从“自动整理日报”转成了“恢复被供给和工作安排共同压住的增长”。值得留下的know-how，也包括什么信号触发补货、怎样协调工坊、何时恢复推介，以及结果怎样反过来修改下一轮安排。\n\n## 先比较三个方案，再谈增长幅度\n\n为使账可核对，下面给定一个正常日：X店有160份可购买需求，Y店60份；单价12元，每份实际生产变动成本4元，未售无残值，没有替代购买或调价。原有工资、租金等在本次选择中不变。扩大方案新增补货50元、按量AI及外部整理服务30元，合计80元/日；一次性接入6000元另列。只改分配可用现有方式完成，不新增这80元。\n\n| 方案 | 原安排 | 只改分配 | 扩产并补货 |\n|---|---:|---:|---:|\n| X/Y供货 | 80/80 | 100/60 | 160/60 |\n| 实际生产 | 160 | 160 | 220 |\n| 实际售出 | 140 | 160 | 220 |\n| 营业收入 | 1680元 | 1920元 | 2640元 |\n| 全部生产变动成本 | 640元 | 640元 | 880元 |\n| 新增日常支出 | 0 | 0 | 80元 |\n| 列示贡献 | 1040元 | 1280元 | 1680元 |\n\n原安排的20份剩余也付出了生产成本。只改分配多240元贡献；再扩大供给，多出的不仅是调走余货，而是使用原来没用上的生产窗口，扩产方案相对原安排多640元，相对只改分配多400元。\n\n在这组条件下，X店这款商品从卖80份变为160份，销量和收入都翻倍；两店合计销量从140变220，增加约57.1%。它们不是同一个增长口径，更不能据此说整家企业收入翻倍。生产窗口利用率则从50%提高到68.75%。\n\n如果相同条件持续20个营业日，相对原安排增加的列示贡献是12800元，扣一次性接入6000元后为6800元。真实项目必须用实际需求、成本和持续时间替换这些条件。\n\n## 到底要多卖多少，扩产才值得\n\n管理者并不需要先相信X店一定能卖160份。先问：新增投入需要多少新增销售来覆盖？\n\n与已经改成100/60的方案相比，再生产60份需要240元，加日常新增支出80元，共320元。单价12元，至少多卖27份，才超过这320元。也就是在Y店需求仍为60的给定条件下，X店卖到至少127份，扩产才优于只改分配。\n\n| X实际可购买需求 | 扩产方案售出总数 | 扩产方案贡献 | 与原安排1040元相比 |\n|---|---:|---:|---:|\n| 90份 | 150 | 840元 | 少200元 |\n| 120份 | 180 | 1200元 | 多160元 |\n| 160份 | 220 | 1680元 | 多640元 |\n\n需求120时，扩产比原安排好，却仍不及只改分配的1280元。这个差别会改变项目选择：企业应比较最合理的替代，而不只与原来的差做法比较。\n\n## 怎样试，才能发现真正的增长来源\n\n先核对产能与配送，再在可承受范围内补货、保留当时顾客询问、推介和预订、真实到店数量与售罄情况。供给增加和推广恢复如果同时发生，要记录两者；结果好时才知道下一步该扩大哪个部分。\n\n试点既要看X，也要看Y和其他受影响门店。若新增排产挤占别的高价值商品，机会成本要算；若多销售以牺牲品质换来，短期贡献也不是全部结果。关于缺货后的询问，记录的是线索，不直接把一次询问算成一次购买。\n\n再改变一个条件：交通入口关闭，需求变为X50、Y90，其他价格和费用不变。原80/80贡献920元，100/60贡献680元，仍扩到160/60只剩360元，比原安排少560元。企业要复用的是识别条件、调动资源和及时改法的能力，而非永久记住“X店配160”。\n\n案例的经营机会来自重新连接本来分开的事情。它可能打开远大于日报省时的增长空间，也需要用需求、产能和成本把这个空间变成可选择的投资。\n","exportSingleMd":"# 案例A｜畅销商品卖完了，生意为什么没有继续长\n\n本案例由教学条件构成。前半给出经营现场，后半用相同口径比较几种选择；收益是条件推演，不是客户实绩。\n\n## 两张报表都没错，合在一起却有问题\n\n一家区域烘焙连锁有8家门店和中央工坊。X店在交通节点附近，Y店服务周边社区。我们只看一种售价12元的主打点心，不把它当作两店全部生意。\n\n某个营业日，两店各配80份，原路线上午一次到店，门店营业至20点。X 27份，扩产才优于只改分配。\n\n| X实际可购买需求 | 扩产方案售出总数 | 扩产方案贡献 | 与原安排1040元相比 |\n|---|---:|---:|---:|\n| 90份 | 150 | 840元 | 少200元 |\n| 120份 | 180 | 1200元 | 多160元 |\n| 160份 | 220 | 1680元 | 多640元 |\n\n需求120时，扩产比原安排好，却仍不及只改分配的1280元。这个差别会改变项目选择：企业应比较最合理的替代，而不只与原来的差做法比较。\n\n## 怎样试，才能发现真正的增长来源\n\n先核对产能与配送，再在可承受范围内补货、保留当时顾客询问、推介和预订、真实到店数量与售罄情况。供给增加和推广恢复如果同时发生，要记录两者；结果好时才知道下一步该扩大哪个部分。\n\n试点既要看X，也要看Y和其他受影响门店。若新增排产挤占别的高价值商品，机会成本要算；若多销售以牺牲品质换来，短期贡献也不是全部结果。关于缺货后的询问，记录的是线索，不直接把一次询问算成一次购买。\n\n再改变一个条件：交通入口关闭，需求变为X50、Y90，其他价格和费用不变。原80/80贡献920元，100/60贡献680元，仍扩到160/60只剩360元，比原安排少560元。企业要复用的是识别条件、调动资源和及时改法的能力，而非永久记住“X店配160”。\n\n案例的经营机会来自重新连接本来分开的事情。它可能打开远大于日报省时的增长空间，也需要用需求、产能和成本把这个空间变成可选择的投资。\n","text":"# 案例A｜畅销商品卖完了，生意为什么没有继续长\n\n本案例由教学条件构成。前半给出经营现场，后半用相同口径比较几种选择；收益是条件推演，不是客户实绩。\n\n## 两张报表都没错，合在一起却有问题\n\n一家区域烘焙连锁有8家门店和中央工坊。X店在交通节点附近，Y店服务周边社区。我们只看一种售价12元的主打点心，不把它当作两店全部生意。\n\n某个营业日，两店各配80份，原路线上午一次到店，门店营业至20点。X店18点卖完，通勤客流还没结束，之后仍有人询问；Y店卖出60份，剩20份。总部看到的是一店售罄、一店有剩余，于是准备把Y店的20份转给X店。这个调整有道理，但还没有回答：X店究竟少了多少生意，为什么中央工坊没有多做，以及门店为什么没有继续寻找需求。\n\n把几份现场材料摆在一起，问题开始变大。\n\n| 材料 | 看到什么 | 原来没有被一起讨论的关系 |\n|---|---|---|\n| X店销量与消息 | 售出80，18点售罄，之后有人问 | 销量被库存封顶，不能看见全部需求 |\n| 工坊排产 | 这两店只排160份 | 在其他6店订单已安排后，对应窗口仍可做320份 |\n| 配送安排 | 原路线只有一次到店 | 下午补货需要增加一趟，费用50元 |\n| 门店工作 | 该商品售罄后停止社群推介，不再持续登记预订 | 供给不足也改变了员工获取需求的动作 |\n| 总部日报 | 只保留销量80与剩余0 | 没有售罄时点，也看不到停止推介以后失去的线索 |\n\n这里的产能和员工动作是给定的现场观察，不能只凭“卖完了”就推断出来。320份是在当前人员、原料与设备条件下为两店可用的生产窗口；增加补货可利用下午时段，17点到店的方案还要核品质与接待。工坊窗口利用率是160÷320=50%，并不等于整个工厂只有一半利用率；员工仍在销售其他商品，问题是围绕这款商品的增长动作提前停止。\n\n原来每个部门都能解释自己：工坊按已成交数量排产，配送按原路线执行，门店没货便不再推广。组合起来，却形成一条自我限制的链：少排产使商品早卖完，早卖完使推介和预订停止，系统只留下受限销量，下一轮继续按这个销量安排。\n\n## AI要找的，是这些材料之间的关系\n\nFDE先把营业日、商品、门店和实际批次对应起来，让AI能够比较销售记录、店长说明、排产窗口、配送和推广记录。AI提出的有用问题会变得具体：X店售罄后还有多少可购买需求？工坊的空档能否用于这一款？晚间补货能否保持品质？门店如果恢复推介，接待与交付是否跟得上？\n\n这些问题指向不同动作。原始询问可以整理成需求线索；排产需要核对人员、原料和其他订单；配送需要实际路线；顾客是否会买，需要通过补货、预订或跟踪观察取得证据。AI帮助把分散事实组织成系统解释，并比较改法，FDE把需要的信息和动作接进生产，负责人决定资源。\n\n因此，项目从“自动整理日报”转成了“恢复被供给和工作安排共同压住的增长”。值得留下的know-how，也包括什么信号触发补货、怎样协调工坊、何时恢复推介，以及结果怎样反过来修改下一轮安排。\n\n## 先比较三个方案，再谈增长幅度\n\n为使账可核对，下面给定一个正常日：X店有160份可购买需求，Y店60份；单价12元，每份实际生产变动成本4元，未售无残值，没有替代购买或调价。原有工资、租金等在本次选择中不变。扩大方案新增补货50元、按量AI及外部整理服务30元，合计80元/日；一次性接入6000元另列。只改分配可用现有方式完成，不新增这80元。\n\n| 方案 | 原安排 | 只改分配 | 扩产并补货 |\n|---|---:|---:|---:|\n| X/Y供货 | 80/80 | 100/60 | 160/60 |\n| 实际生产 | 160 | 160 | 220 |\n| 实际售出 | 140 | 160 | 220 |\n| 营业收入 | 1680元 | 1920元 | 2640元 |\n| 全部生产变动成本 | 640元 | 640元 | 880元 |\n| 新增日常支出 | 0 | 0 | 80元 |\n| 列示贡献 | 1040元 | 1280元 | 1680元 |\n\n原安排的20份剩余也付出了生产成本。只改分配多240元贡献；再扩大供给，多出的不仅是调走余货，而是使用原来没用上的生产窗口，扩产方案相对原安排多640元，相对只改分配多400元。\n\n在这组条件下，X店这款商品从卖80份变为160份，销量和收入都翻倍；两店合计销量从140变220，增加约57.1%。它们不是同一个增长口径，更不能据此说整家企业收入翻倍。生产窗口利用率则从50%提高到68.75%。\n\n如果相同条件持续20个营业日，相对原安排增加的列示贡献是12800元，扣一次性接入6000元后为6800元。真实项目必须用实际需求、成本和持续时间替换这些条件。\n\n## 到底要多卖多少，扩产才值得\n\n管理者并不需要先相信X店一定能卖160份。先问：新增投入需要多少新增销售来覆盖？\n\n与已经改成100/60的方案相比，再生产60份需要240元，加日常新增支出80元，共320元。单价12元，至少多卖27份，才超过这320元。也就是在Y店需求仍为60的给定条件下，X店卖到至少127份，扩产才优于只改分配。\n\n| X实际可购买需求 | 扩产方案售出总数 | 扩产方案贡献 | 与原安排1040元相比 |\n|---|---:|---:|---:|\n| 90份 | 150 | 840元 | 少200元 |\n| 120份 | 180 | 1200元 | 多160元 |\n| 160份 | 220 | 1680元 | 多640元 |\n\n需求120时，扩产比原安排好，却仍不及只改分配的1280元。这个差别会改变项目选择：企业应比较最合理的替代，而不只与原来的差做法比较。\n\n## 怎样试，才能发现真正的增长来源\n\n先核对产能与配送，再在可承受范围内补货、保留当时顾客询问、推介和预订、真实到店数量与售罄情况。供给增加和推广恢复如果同时发生，要记录两者；结果好时才知道下一步该扩大哪个部分。\n\n试点既要看X，也要看Y和其他受影响门店。若新增排产挤占别的高价值商品，机会成本要算；若多销售以牺牲品质换来，短期贡献也不是全部结果。关于缺货后的询问，记录的是线索，不直接把一次询问算成一次购买。\n\n再改变一个条件：交通入口关闭，需求变为X50、Y90，其他价格和费用不变。原80/80贡献920元，100/60贡献680元，仍扩到160/60只剩360元，比原安排少560元。企业要复用的是识别条件、调动资源和及时改法的能力，而非永久记住“X店配160”。\n\n案例的经营机会来自重新连接本来分开的事情。它可能打开远大于日报省时的增长空间，也需要用需求、产能和成本把这个空间变成可选择的投资。\n"},{"file":"案例B-智能资源成本.md","id":"case-b","number":null,"role":"案例","part":-1,"title":"案例B｜工业品报价：少等一天，怎样影响订单与毛利","md":"# 案例B｜工业品报价：少等一天，怎样影响订单与毛利\n\n本案例为教学构造。月度订单和成本用于条件比较，不是测得的AI销售效果；技术草稿的资源比较另列，不能重复计入月度收益。\n\n## 客户要的不是一张更快写出的报价单\n\n一家工业连接器经销商有销售、售前工程、采购与仓储。客户发来旧件照片和一页图纸，希望三天内取得可用替代。销售找到外形相似的现货，工程师却需要确认工况；另一款满足条件，供应商说十天才能到。还有一个适配方案，需要进一步确认配套件和成本。\n\n如果团队只追求快速出报价，可能先报一个不能用的型号，随后再解释；如果每笔都等工程师从头整理，又可能错过客户采购窗口。企业真正有价值的能力，是在条件不完整时问对问题，找到可履约的替代，并保持合理毛利。\n\n旧工作里，销售把“三天内”压成“客户很急”，工程师收到“找替代”，采购只查价格。客户首日上午发来的材料，直到第二日下午才形成一组可讨论候选，留给确认与交付的时间很少。三方分别补问，最后文档完成了，原客户期限却没有进入比较。这里损失的是决策条件和时间，不只是录入工时。\n\n## 把一笔询价做成能继续推进的工作\n\n新的安排先保留客户原件、明确期限和仍未知的工况。AI比较图纸、产品资料与历史适配，列出冲突，再调用当前库存和供应信息。输出不是一句“建议用某型号”，而是可由销售与工程一起判断的几条路线。\n\n| 候选 | 当前可取之处 | 还差什么才能报价 |\n|---|---|---|\n| 外形接近的现货 | 可以较快发出 | 兼容和工况依据尚未齐备 |\n| 已符合要求的另一型号 | 技术依据较完整 | 十天供货与三天需求冲突 |\n| 配套适配方案 | 可能同时解决使用与交付 | 工程确认、供应承诺和成本 |\n\nFDE发现这类企业的亮点，可能正是资深工程师怎样处理这些取舍。它需要进入材料整理、比较、采购确认和正式报价，才可帮助更多销售；只把老报价放进知识库，容易把过去有效的价格或承诺带到今天。\n\n最终选择有对应版本，客户改了数量或交期就重新检查。正式报价被客户收到、客户接受、形成订单和实际交付分别保留。成交或未成交的理由再回到后续询价，企业才能逐渐知道自己的优势发生在哪一段。\n\n## 每月多成交多少，才值得持续投入\n\n给定月1000笔同等有效询价，原成交200笔，每单扣采购和变动履约后贡献500元。新安排每月增加FDE共建9000元、模型1200元、工具800元，共11000元。原有固定岗位工资在这次比较中不变。\n\n| 月度情景 | 订单数与单均贡献 | 扣新增费用后的贡献 | 相对原安排 |\n|---|---|---:|---:|\n| 原安排 | 200单×500元 | 100000元 | — |\n| 只多成交20单 | 220单×500元，减11000元 | 99000元 | 少1000元 |\n| 多成交50单 | 250单×500元，减11000元 | 114000元 | 多14000元 |\n| 成交增加但压低毛利 | 250单×400元，减11000元 | 89000元 | 少11000元 |\n\n单均贡献保持500元时，多22单只能持平，超过22单才有正增量；对应成交率至少跨过22.2%。从20%到25%的变化有价值，但若靠降价使全部新订单的单均贡献变400元，更多订单仍可能使企业少赚钱。\n\n250单也要求采购、库存、交付与售后能接住。报价提速提供一种作用路径，不会自动创造客户、供货容量或付款。实际比较需保留询价来源、难度、人员和同期价格，再追到客户选择。\n\n## 模型费用怎样进入同一条账\n\n另取同一组1000份询价技术草稿，比较两个AI安排。以下给定所有草稿均复核，失败全部发现并返工到同等质量，人工按60元/小时估价。\n\n| 条件 | A | B |\n|---|---:|---:|\n| 每份模型费 | 0.4元 | 1.2元 |\n| 常规复核 | 4分钟 | 2分钟 |\n| 额外返工比例 | 20% | 5% |\n| 每份额外返工 | 10分钟 | 10分钟 |\n\nA为模型400元、复核估价4000元、返工估价2000元，合6400元、100小时。B为模型1200元、复核2000元、返工500元，合3700元、约41.67小时。多花800元模型费，释放约58.33小时，列示成本少2700元。这里的复核是技术草稿环节，客户、供应商和内部交接等待另计，不能把几分钟直接当作整笔询价周期。\n\n如果其中20小时外包确实取消，少付1200元，扣新增模型费800元，现金改善400元。其余时间用于什么，要另看实际安排。上面的月度经营账已列模型与共建费用，不能再把这2700元全部加进去，重复取得收益。\n\n这个局部比较解释如何选择智能供给；月度账解释整条业务是否值得改。两张账之间，是材料、决策、客户、履约和毛利。企业要掌握的正是这些转换。\n","html":"\u003ch1>案例B｜工业品报价：少等一天，怎样影响订单与毛利\u003c/h1>\n\u003cp>本案例为教学构造。月度订单和成本用于条件比较，不是测得的AI销售效果；技术草稿的资源比较另列，不能重复计入月度收益。\u003c/p>\n\u003ch2 id=\"case-b-section-1\">客户要的不是一张更快写出的报价单\u003c/h2>\n\u003cp>一家工业连接器经销商有销售、售前工程、采购与仓储。客户发来旧件照片和一页图纸，希望三天内取得可用替代。销售找到外形相似的现货，工程师却需要确认工况；另一款满足条件，供应商说十天才能到。还有一个适配方案，需要进一步确认配套件和成本。\u003c/p>\n\u003cp>如果团队只追求快速出报价，可能先报一个不能用的型号，随后再解释；如果每笔都等工程师从头整理，又可能错过客户采购窗口。企业真正有价值的能力，是在条件不完整时问对问题，找到可履约的替代，并保持合理毛利。\u003c/p>\n\u003cp>旧工作里，销售把“三天内”压成“客户很急”，工程师收到“找替代”，采购只查价格。客户首日上午发来的材料，直到第二日下午才形成一组可讨论候选，留给确认与交付的时间很少。三方分别补问，最后文档完成了，原客户期限却没有进入比较。这里损失的是决策条件和时间，不只是录入工时。\u003c/p>\n\u003ch2 id=\"case-b-section-2\">把一笔询价做成能继续推进的工作\u003c/h2>\n\u003cp>新的安排先保留客户原件、明确期限和仍未知的工况。AI比较图纸、产品资料与历史适配，列出冲突，再调用当前库存和供应信息。输出不是一句“建议用某型号”，而是可由销售与工程一起判断的几条路线。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>候选\u003c/th>\n\u003cth>当前可取之处\u003c/th>\n\u003cth>还差什么才能报价\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>外形接近的现货\u003c/td>\n\u003ctd>可以较快发出\u003c/td>\n\u003ctd>兼容和工况依据尚未齐备\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已符合要求的另一型号\u003c/td>\n\u003ctd>技术依据较完整\u003c/td>\n\u003ctd>十天供货与三天需求冲突\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>配套适配方案\u003c/td>\n\u003ctd>可能同时解决使用与交付\u003c/td>\n\u003ctd>工程确认、供应承诺和成本\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>FDE发现这类企业的亮点，可能正是资深工程师怎样处理这些取舍。它需要进入材料整理、比较、采购确认和正式报价，才可帮助更多销售；只把老报价放进知识库，容易把过去有效的价格或承诺带到今天。\u003c/p>\n\u003cp>最终选择有对应版本，客户改了数量或交期就重新检查。正式报价被客户收到、客户接受、形成订单和实际交付分别保留。成交或未成交的理由再回到后续询价，企业才能逐渐知道自己的优势发生在哪一段。\u003c/p>\n\u003ch2 id=\"case-b-section-3\">每月多成交多少，才值得持续投入\u003c/h2>\n\u003cp>给定月1000笔同等有效询价，原成交200笔，每单扣采购和变动履约后贡献500元。新安排每月增加FDE共建9000元、模型1200元、工具800元，共11000元。原有固定岗位工资在这次比较中不变。\u003c/p>\n\u003cdiv class=\"table-scroll table-wide\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>月度情景\u003c/th>\n\u003cth>订单数与单均贡献\u003c/th>\n\u003cth align=\"right\">扣新增费用后的贡献\u003c/th>\n\u003cth align=\"right\">相对原安排\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>原安排\u003c/td>\n\u003ctd>200单×500元\u003c/td>\n\u003ctd align=\"right\">100000元\u003c/td>\n\u003ctd align=\"right\">—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>只多成交20单\u003c/td>\n\u003ctd>220单×500元，减11000元\u003c/td>\n\u003ctd align=\"right\">99000元\u003c/td>\n\u003ctd align=\"right\">少1000元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>多成交50单\u003c/td>\n\u003ctd>250单×500元，减11000元\u003c/td>\n\u003ctd align=\"right\">114000元\u003c/td>\n\u003ctd align=\"right\">多14000元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>成交增加但压低毛利\u003c/td>\n\u003ctd>250单×400元，减11000元\u003c/td>\n\u003ctd align=\"right\">89000元\u003c/td>\n\u003ctd align=\"right\">少11000元\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"table-hint\">表格可左右滑动查看\u003c/p>\n\u003cp>单均贡献保持500元时，多22单只能持平，超过22单才有正增量；对应成交率至少跨过22.2%。从20%到25%的变化有价值，但若靠降价使全部新订单的单均贡献变400元，更多订单仍可能使企业少赚钱。\u003c/p>\n\u003cp>250单也要求采购、库存、交付与售后能接住。报价提速提供一种作用路径，不会自动创造客户、供货容量或付款。实际比较需保留询价来源、难度、人员和同期价格，再追到客户选择。\u003c/p>\n\u003ch2 id=\"case-b-section-4\">模型费用怎样进入同一条账\u003c/h2>\n\u003cp>另取同一组1000份询价技术草稿，比较两个AI安排。以下给定所有草稿均复核，失败全部发现并返工到同等质量，人工按60元/小时估价。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>条件\u003c/th>\n\u003cth align=\"right\">A\u003c/th>\n\u003cth align=\"right\">B\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>每份模型费\u003c/td>\n\u003ctd align=\"right\">0.4元\u003c/td>\n\u003ctd align=\"right\">1.2元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>常规复核\u003c/td>\n\u003ctd align=\"right\">4分钟\u003c/td>\n\u003ctd align=\"right\">2分钟\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>额外返工比例\u003c/td>\n\u003ctd align=\"right\">20%\u003c/td>\n\u003ctd align=\"right\">5%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>每份额外返工\u003c/td>\n\u003ctd align=\"right\">10分钟\u003c/td>\n\u003ctd align=\"right\">10分钟\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A为模型400元、复核估价4000元、返工估价2000元，合6400元、100小时。B为模型1200元、复核2000元、返工500元，合3700元、约41.67小时。多花800元模型费，释放约58.33小时，列示成本少2700元。这里的复核是技术草稿环节，客户、供应商和内部交接等待另计，不能把几分钟直接当作整笔询价周期。\u003c/p>\n\u003cp>如果其中20小时外包确实取消，少付1200元，扣新增模型费800元，现金改善400元。其余时间用于什么，要另看实际安排。上面的月度经营账已列模型与共建费用，不能再把这2700元全部加进去，重复取得收益。\u003c/p>\n\u003cp>这个局部比较解释如何选择智能供给；月度账解释整条业务是否值得改。两张账之间，是材料、决策、客户、履约和毛利。企业要掌握的正是这些转换。\u003c/p>\n","headings":[{"id":"case-b-section-1","label":"客户要的不是一张更快写出的报价单"},{"id":"case-b-section-2","label":"把一笔询价做成能继续推进的工作"},{"id":"case-b-section-3","label":"每月多成交多少，才值得持续投入"},{"id":"case-b-section-4","label":"模型费用怎样进入同一条账"}],"exportMd":"# 案例B｜工业品报价：少等一天，怎样影响订单与毛利\n\n本案例为教学构造。月度订单和成本用于条件比较，不是测得的AI销售效果；技术草稿的资源比较另列，不能重复计入月度收益。\n\n## 客户要的不是一张更快写出的报价单\n\n一家工业连接器经销商有销售、售前工程、采购与仓储。客户发来旧件照片和一页图纸，希望三天内取得可用替代。销售找到外形相似的现货，工程师却需要确认工况；另一款满足条件，供应商说十天才能到。还有一个适配方案，需要进一步确认配套件和成本。\n\n如果团队只追求快速出报价，可能先报一个不能用的型号，随后再解释；如果每笔都等工程师从头整理，又可能错过客户采购窗口。企业真正有价值的能力，是在条件不完整时问对问题，找到可履约的替代，并保持合理毛利。\n\n旧工作里，销售把“三天内”压成“客户很急”，工程师收到“找替代”，采购只查价格。客户首日上午发来的材料，直到第二日下午才形成一组可讨论候选，留给确认与交付的时间很少。三方分别补问，最后文档完成了，原客户期限却没有进入比较。这里损失的是决策条件和时间，不只是录入工时。\n\n## 把一笔询价做成能继续推进的工作\n\n新的安排先保留客户原件、明确期限和仍未知的工况。AI比较图纸、产品资料与历史适配，列出冲突，再调用当前库存和供应信息。输出不是一句“建议用某型号”，而是可由销售与工程一起判断的几条路线。\n\n| 候选 | 当前可取之处 | 还差什么才能报价 |\n|---|---|---|\n| 外形接近的现货 | 可以较快发出 | 兼容和工况依据尚未齐备 |\n| 已符合要求的另一型号 | 技术依据较完整 | 十天供货与三天需求冲突 |\n| 配套适配方案 | 可能同时解决使用与交付 | 工程确认、供应承诺和成本 |\n\nFDE发现这类企业的亮点，可能正是资深工程师怎样处理这些取舍。它需要进入材料整理、比较、采购确认和正式报价，才可帮助更多销售；只把老报价放进知识库，容易把过去有效的价格或承诺带到今天。\n\n最终选择有对应版本，客户改了数量或交期就重新检查。正式报价被客户收到、客户接受、形成订单和实际交付分别保留。成交或未成交的理由再回到后续询价，企业才能逐渐知道自己的优势发生在哪一段。\n\n## 每月多成交多少，才值得持续投入\n\n给定月1000笔同等有效询价，原成交200笔，每单扣采购和变动履约后贡献500元。新安排每月增加FDE共建9000元、模型1200元、工具800元，共11000元。原有固定岗位工资在这次比较中不变。\n\n| 月度情景 | 订单数与单均贡献 | 扣新增费用后的贡献 | 相对原安排 |\n|---|---|---:|---:|\n| 原安排 | 200单×500元 | 100000元 | — |\n| 只多成交20单 | 220单×500元，减11000元 | 99000元 | 少1000元 |\n| 多成交50单 | 250单×500元，减11000元 | 114000元 | 多14000元 |\n| 成交增加但压低毛利 | 250单×400元，减11000元 | 89000元 | 少11000元 |\n\n单均贡献保持500元时，多22单只能持平，超过22单才有正增量；对应成交率至少跨过22.2%。从20%到25%的变化有价值，但若靠降价使全部新订单的单均贡献变400元，更多订单仍可能使企业少赚钱。\n\n250单也要求采购、库存、交付与售后能接住。报价提速提供一种作用路径，不会自动创造客户、供货容量或付款。实际比较需保留询价来源、难度、人员和同期价格，再追到客户选择。\n\n## 模型费用怎样进入同一条账\n\n另取同一组1000份询价技术草稿，比较两个AI安排。以下给定所有草稿均复核，失败全部发现并返工到同等质量，人工按60元/小时估价。\n\n| 条件 | A | B |\n|---|---:|---:|\n| 每份模型费 | 0.4元 | 1.2元 |\n| 常规复核 | 4分钟 | 2分钟 |\n| 额外返工比例 | 20% | 5% |\n| 每份额外返工 | 10分钟 | 10分钟 |\n\nA为模型400元、复核估价4000元、返工估价2000元，合6400元、100小时。B为模型1200元、复核2000元、返工500元，合3700元、约41.67小时。多花800元模型费，释放约58.33小时，列示成本少2700元。这里的复核是技术草稿环节，客户、供应商和内部交接等待另计，不能把几分钟直接当作整笔询价周期。\n\n如果其中20小时外包确实取消，少付1200元，扣新增模型费800元，现金改善400元。其余时间用于什么，要另看实际安排。上面的月度经营账已列模型与共建费用，不能再把这2700元全部加进去，重复取得收益。\n\n这个局部比较解释如何选择智能供给；月度账解释整条业务是否值得改。两张账之间，是材料、决策、客户、履约和毛利。企业要掌握的正是这些转换。\n","exportSingleMd":"# 案例B｜工业品报价：少等一天，怎样影响订单与毛利\n\n本案例为教学构造。月度订单和成本用于条件比较，不是测得的AI销售效果；技术草稿的资源比较另列，不能重复计入月度收益。\n\n## 客户要的不是一张更快写出的报价单\n\n一家工业连接器经销商有销售、售前工程、采购与仓储。客户发来旧件照片和一页图纸，希望三天内取得可用替代。销售找到外形相似的现货，工程师却需要确认工况；另一款满足条件，供应商说十天才能到。还有一个适配方案，需要进一步确认配套件和成本。\n\n如果团队只追求快速出报价，可能先报一个不能用的型号，随后再解释；如果每笔都等工程师从头整理，又可能错过客户采购窗口。企业真正有价值的能力，是在条件不完整时问对问题，找到可履约的替代，并保持合理毛利。\n\n旧工作里，销售把“三天内”压成“客户很急”，工程师收到“找替代”，采购只查价格。客户首日上午发来的材料，直到第二日下午才形成一组可讨论候选，留给确认与交付的时间很少。三方分别补问，最后文档完成了，原客户期限却没有进入比较。这里损失的是决策条件和时间，不只是录入工时。\n\n## 把一笔询价做成能继续推进的工作\n\n新的安排先保留客户原件、明确期限和仍未知的工况。AI比较图纸、产品资料与历史适配，列出冲突，再调用当前库存和供应信息。输出不是一句“建议用某型号”，而是可由销售与工程一起判断的几条路线。\n\n| 候选 | 当前可取之处 | 还差什么才能报价 |\n|---|---|---|\n| 外形接近的现货 | 可以较快发出 | 兼容和工况依据尚未齐备 |\n| 已符合要求的另一型号 | 技术依据较完整 | 十天供货与三天需求冲突 |\n| 配套适配方案 | 可能同时解决使用与交付 | 工程确认、供应承诺和成本 |\n\nFDE发现这类企业的亮点，可能正是资深工程师怎样处理这些取舍。它需要进入材料整理、比较、采购确认和正式报价，才可帮助更多销售；只把老报价放进知识库，容易把过去有效的价格或承诺带到今天。\n\n最终选择有对应版本，客户改了数量或交期就重新检查。正式报价被客户收到、客户接受、形成订单和实际交付分别保留。成交或未成交的理由再回到后续询价，企业才能逐渐知道自己的优势发生在哪一段。\n\n## 每月多成交多少，才值得持续投入\n\n给定月1000笔同等有效询价，原成交200笔，每单扣采购和变动履约后贡献500元。新安排每月增加FDE共建9000元、模型1200元、工具800元，共11000元。原有固定岗位工资在这次比较中不变。\n\n| 月度情景 | 订单数与单均贡献 | 扣新增费用后的贡献 | 相对原安排 |\n|---|---|---:|---:|\n| 原安排 | 200单×500元 | 100000元 | — |\n| 只多成交20单 | 220单×500元，减11000元 | 99000元 | 少1000元 |\n| 多成交50单 | 250单×500元，减11000元 | 114000元 | 多14000元 |\n| 成交增加但压低毛利 | 250单×400元，减11000元 | 89000元 | 少11000元 |\n\n单均贡献保持500元时，多22单只能持平，超过22单才有正增量；对应成交率至少跨过22.2%。从20%到25%的变化有价值，但若靠降价使全部新订单的单均贡献变400元，更多订单仍可能使企业少赚钱。\n\n250单也要求采购、库存、交付与售后能接住。报价提速提供一种作用路径，不会自动创造客户、供货容量或付款。实际比较需保留询价来源、难度、人员和同期价格，再追到客户选择。\n\n## 模型费用怎样进入同一条账\n\n另取同一组1000份询价技术草稿，比较两个AI安排。以下给定所有草稿均复核，失败全部发现并返工到同等质量，人工按60元/小时估价。\n\n| 条件 | A | B |\n|---|---:|---:|\n| 每份模型费 | 0.4元 | 1.2元 |\n| 常规复核 | 4分钟 | 2分钟 |\n| 额外返工比例 | 20% | 5% |\n| 每份额外返工 | 10分钟 | 10分钟 |\n\nA为模型400元、复核估价4000元、返工估价2000元，合6400元、100小时。B为模型1200元、复核2000元、返工500元，合3700元、约41.67小时。多花800元模型费，释放约58.33小时，列示成本少2700元。这里的复核是技术草稿环节，客户、供应商和内部交接等待另计，不能把几分钟直接当作整笔询价周期。\n\n如果其中20小时外包确实取消，少付1200元，扣新增模型费800元，现金改善400元。其余时间用于什么，要另看实际安排。上面的月度经营账已列模型与共建费用，不能再把这2700元全部加进去，重复取得收益。\n\n这个局部比较解释如何选择智能供给；月度账解释整条业务是否值得改。两张账之间，是材料、决策、客户、履约和毛利。企业要掌握的正是这些转换。\n","text":"# 案例B｜工业品报价：少等一天，怎样影响订单与毛利\n\n本案例为教学构造。月度订单和成本用于条件比较，不是测得的AI销售效果；技术草稿的资源比较另列，不能重复计入月度收益。\n\n## 客户要的不是一张更快写出的报价单\n\n一家工业连接器经销商有销售、售前工程、采购与仓储。客户发来旧件照片和一页图纸，希望三天内取得可用替代。销售找到外形相似的现货，工程师却需要确认工况；另一款满足条件，供应商说十天才能到。还有一个适配方案，需要进一步确认配套件和成本。\n\n如果团队只追求快速出报价，可能先报一个不能用的型号，随后再解释；如果每笔都等工程师从头整理，又可能错过客户采购窗口。企业真正有价值的能力，是在条件不完整时问对问题，找到可履约的替代，并保持合理毛利。\n\n旧工作里，销售把“三天内”压成“客户很急”，工程师收到“找替代”，采购只查价格。客户首日上午发来的材料，直到第二日下午才形成一组可讨论候选，留给确认与交付的时间很少。三方分别补问，最后文档完成了，原客户期限却没有进入比较。这里损失的是决策条件和时间，不只是录入工时。\n\n## 把一笔询价做成能继续推进的工作\n\n新的安排先保留客户原件、明确期限和仍未知的工况。AI比较图纸、产品资料与历史适配，列出冲突，再调用当前库存和供应信息。输出不是一句“建议用某型号”，而是可由销售与工程一起判断的几条路线。\n\n| 候选 | 当前可取之处 | 还差什么才能报价 |\n|---|---|---|\n| 外形接近的现货 | 可以较快发出 | 兼容和工况依据尚未齐备 |\n| 已符合要求的另一型号 | 技术依据较完整 | 十天供货与三天需求冲突 |\n| 配套适配方案 | 可能同时解决使用与交付 | 工程确认、供应承诺和成本 |\n\nFDE发现这类企业的亮点，可能正是资深工程师怎样处理这些取舍。它需要进入材料整理、比较、采购确认和正式报价，才可帮助更多销售；只把老报价放进知识库，容易把过去有效的价格或承诺带到今天。\n\n最终选择有对应版本，客户改了数量或交期就重新检查。正式报价被客户收到、客户接受、形成订单和实际交付分别保留。成交或未成交的理由再回到后续询价，企业才能逐渐知道自己的优势发生在哪一段。\n\n## 每月多成交多少，才值得持续投入\n\n给定月1000笔同等有效询价，原成交200笔，每单扣采购和变动履约后贡献500元。新安排每月增加FDE共建9000元、模型1200元、工具800元，共11000元。原有固定岗位工资在这次比较中不变。\n\n| 月度情景 | 订单数与单均贡献 | 扣新增费用后的贡献 | 相对原安排 |\n|---|---|---:|---:|\n| 原安排 | 200单×500元 | 100000元 | — |\n| 只多成交20单 | 220单×500元，减11000元 | 99000元 | 少1000元 |\n| 多成交50单 | 250单×500元，减11000元 | 114000元 | 多14000元 |\n| 成交增加但压低毛利 | 250单×400元，减11000元 | 89000元 | 少11000元 |\n\n单均贡献保持500元时，多22单只能持平，超过22单才有正增量；对应成交率至少跨过22.2%。从20%到25%的变化有价值，但若靠降价使全部新订单的单均贡献变400元，更多订单仍可能使企业少赚钱。\n\n250单也要求采购、库存、交付与售后能接住。报价提速提供一种作用路径，不会自动创造客户、供货容量或付款。实际比较需保留询价来源、难度、人员和同期价格，再追到客户选择。\n\n## 模型费用怎样进入同一条账\n\n另取同一组1000份询价技术草稿，比较两个AI安排。以下给定所有草稿均复核，失败全部发现并返工到同等质量，人工按60元/小时估价。\n\n| 条件 | A | B |\n|---|---:|---:|\n| 每份模型费 | 0.4元 | 1.2元 |\n| 常规复核 | 4分钟 | 2分钟 |\n| 额外返工比例 | 20% | 5% |\n| 每份额外返工 | 10分钟 | 10分钟 |\n\nA为模型400元、复核估价4000元、返工估价2000元，合6400元、100小时。B为模型1200元、复核2000元、返工500元，合3700元、约41.67小时。多花800元模型费，释放约58.33小时，列示成本少2700元。这里的复核是技术草稿环节，客户、供应商和内部交接等待另计，不能把几分钟直接当作整笔询价周期。\n\n如果其中20小时外包确实取消，少付1200元，扣新增模型费800元，现金改善400元。其余时间用于什么，要另看实际安排。上面的月度经营账已列模型与共建费用，不能再把这2700元全部加进去，重复取得收益。\n\n这个局部比较解释如何选择智能供给；月度账解释整条业务是否值得改。两张账之间，是材料、决策、客户、履约和毛利。企业要掌握的正是这些转换。\n"},{"file":"案例C-设备售后.md","id":"case-c","number":null,"role":"案例","part":-1,"title":"案例C｜设备售后：怎样把老师傅的经验变成少跑一趟","md":"# 案例C｜设备售后：怎样把老师傅的经验变成少跑一趟\n\n以下设备、工单和费用均为教学设定，不对应实际产品，不提供维修操作指令。\n\n## 服务单关了，客户的问题还在\n\n一家设备服务企业由客服接报修、调度派工、现场技术员处理，复杂问题再问资深工程师。同一台设备重复报修时，系统可能又建一张新单。客服看到关闭快，财务看到外协费用增加，客户感受到的是反复停机与等待。\n\n资深工程师的优势不一定是知道一个神奇答案。他可能在出发前先确认版本和运行条件，追问实际做过什么，再判断需要远程支持、什么人员和哪些配套件。新技术员只拿到“调整后恢复”，就学不到这些前置取舍。\n\nFDE因此不能只整理故障答案。需要把设备身份、原始描述、咨询经过、实际动作、备件、到场和后续复发接起来，找出重复上门发生在哪个环节。AI适合跨这些材料比较，提出需要核对的关系；缺件、判断不适用、客户条件变化和现场执行，应当有不同改法。\n\n## 四张“恢复”工单，留下了多少真正的认识\n\nM1客户说“促销时段间歇停机”，系统知道设备V1，负载不完整。技术员记“调整并重启，未换件”，AI却写成“更换部件后恢复”。这是一项需要纠正的事实错误，原因要回到模型当时取得的输入检查。\n\n| 工单 | 已知版本和动作 | 观察结果 |\n|---|---|---|\n| M1 | V1，调整并重启，未换件 | 当次恢复，记录到次日 |\n| M2 | V1，调整并重启 | 当次恢复，记录到次日 |\n| M3 | V2，调整，未记录重启 | 一小时后报告恢复 |\n| M4 | V1，仅记录重启 | 当次恢复，记录到次日 |\n\nAI可以把共同处、差异和空白摆出来。M4让“只有调整才会恢复”受到挑战，M3提示版本和中间变化；但未记录不等于没发生，这四张单并没有区分调整、重启和运行条件的作用。\n\n可用经验由此分成两种。一种是尚待确认的技术解释，用于提出补问；另一种是已经清楚的工作要求，例如保留完整动作、出发前核对版本、把恢复与复发接到同一设备。企业可以先改进后一种，不必等所有故障原因都被证明。\n\n## 让经验进入下一次派工\n\n下一张相似工单到来，AI先查当前设备，带回案例差别，提示尚缺事实；需要专业判断时把依据交给专家，而不是只发“请看一下”。派工前确认合适人员、必要配套和客户时段，执行后核对实际到场与恢复。\n\n某次恢复又复发，系统保留为同一问题的后续，而非仅用新关单数覆盖。专业人员据此修改适用条件，工程把修订放回采用入口。接任者要能找到并用对这些条件，老师傅原来承担的部分能力才开始留在组织。\n\n## 减少多少次复访，账才划算\n\n独立给定一个月100张服务单，原来有30次额外复访，共130次出车。回看这些复访，12次涉及配套不符、到现场才确认版本，8次涉及关键材料或客户条件未准备，另外10次本就需要分阶段服务。前20次构成候选改进空间，不意味着都能被AI消除。\n\n每次外协派单按500元结算，取消就实际少付。新AI与FDE维护增加6000元/月，正常上门及原固定工资不变。下面只比较这几项，不从四张工单估计复访概率。\n\n| 改造后的情景 | 少付外协费 | 减新增维护后 | 经营含义 |\n|---|---:|---:|---|\n| 减少10次复访 | 5000元 | 少1000元 | 仅靠列示支出尚不合算 |\n| 减少12次复访 | 6000元 | 持平 | 达到这项成本的覆盖点 |\n| 减少20次复访 | 10000元 | 多4000元 | 列示支出产生正改善 |\n\n本案候选空间20次，成本覆盖点12次，意味着要消除相当一部分可改进复访才有现金正增量。减少20次属于将这部分机会全部兑现的情景。若把必要的10次分阶段服务也当成可省，项目会被高估；若实际可影响范围比20次更小，负责人应重新选择投入强度。\n\n客户少停机、续约更稳定、专家少被重复咨询，都可能有价值，但不是同一笔钱。客户停机损失属于客户，服务商是否取得收益要看合同与客户选择；专家时间首先是容量，不能再按同样小时凭空加一笔现金。\n\n这使长期共建有了清楚对象：先让记录可信，再识别复访结构，改进准备和派工，最后用新任务与客户结果检验。能持续少走弯路、接住新设备并形成新方法，才是值得经营的服务能力。\n","html":"\u003ch1>案例C｜设备售后：怎样把老师傅的经验变成少跑一趟\u003c/h1>\n\u003cp>以下设备、工单和费用均为教学设定，不对应实际产品，不提供维修操作指令。\u003c/p>\n\u003ch2 id=\"case-c-section-1\">服务单关了，客户的问题还在\u003c/h2>\n\u003cp>一家设备服务企业由客服接报修、调度派工、现场技术员处理，复杂问题再问资深工程师。同一台设备重复报修时，系统可能又建一张新单。客服看到关闭快，财务看到外协费用增加，客户感受到的是反复停机与等待。\u003c/p>\n\u003cp>资深工程师的优势不一定是知道一个神奇答案。他可能在出发前先确认版本和运行条件，追问实际做过什么，再判断需要远程支持、什么人员和哪些配套件。新技术员只拿到“调整后恢复”，就学不到这些前置取舍。\u003c/p>\n\u003cp>FDE因此不能只整理故障答案。需要把设备身份、原始描述、咨询经过、实际动作、备件、到场和后续复发接起来，找出重复上门发生在哪个环节。AI适合跨这些材料比较，提出需要核对的关系；缺件、判断不适用、客户条件变化和现场执行，应当有不同改法。\u003c/p>\n\u003ch2 id=\"case-c-section-2\">四张“恢复”工单，留下了多少真正的认识\u003c/h2>\n\u003cp>M1客户说“促销时段间歇停机”，系统知道设备V1，负载不完整。技术员记“调整并重启，未换件”，AI却写成“更换部件后恢复”。这是一项需要纠正的事实错误，原因要回到模型当时取得的输入检查。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>工单\u003c/th>\n\u003cth>已知版本和动作\u003c/th>\n\u003cth>观察结果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>M1\u003c/td>\n\u003ctd>V1，调整并重启，未换件\u003c/td>\n\u003ctd>当次恢复，记录到次日\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M2\u003c/td>\n\u003ctd>V1，调整并重启\u003c/td>\n\u003ctd>当次恢复，记录到次日\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M3\u003c/td>\n\u003ctd>V2，调整，未记录重启\u003c/td>\n\u003ctd>一小时后报告恢复\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M4\u003c/td>\n\u003ctd>V1，仅记录重启\u003c/td>\n\u003ctd>当次恢复，记录到次日\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>AI可以把共同处、差异和空白摆出来。M4让“只有调整才会恢复”受到挑战，M3提示版本和中间变化；但未记录不等于没发生，这四张单并没有区分调整、重启和运行条件的作用。\u003c/p>\n\u003cp>可用经验由此分成两种。一种是尚待确认的技术解释，用于提出补问；另一种是已经清楚的工作要求，例如保留完整动作、出发前核对版本、把恢复与复发接到同一设备。企业可以先改进后一种，不必等所有故障原因都被证明。\u003c/p>\n\u003ch2 id=\"case-c-section-3\">让经验进入下一次派工\u003c/h2>\n\u003cp>下一张相似工单到来，AI先查当前设备，带回案例差别，提示尚缺事实；需要专业判断时把依据交给专家，而不是只发“请看一下”。派工前确认合适人员、必要配套和客户时段，执行后核对实际到场与恢复。\u003c/p>\n\u003cp>某次恢复又复发，系统保留为同一问题的后续，而非仅用新关单数覆盖。专业人员据此修改适用条件，工程把修订放回采用入口。接任者要能找到并用对这些条件，老师傅原来承担的部分能力才开始留在组织。\u003c/p>\n\u003ch2 id=\"case-c-section-4\">减少多少次复访，账才划算\u003c/h2>\n\u003cp>独立给定一个月100张服务单，原来有30次额外复访，共130次出车。回看这些复访，12次涉及配套不符、到现场才确认版本，8次涉及关键材料或客户条件未准备，另外10次本就需要分阶段服务。前20次构成候选改进空间，不意味着都能被AI消除。\u003c/p>\n\u003cp>每次外协派单按500元结算，取消就实际少付。新AI与FDE维护增加6000元/月，正常上门及原固定工资不变。下面只比较这几项，不从四张工单估计复访概率。\u003c/p>\n\u003cdiv class=\"table-scroll table-wide\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>改造后的情景\u003c/th>\n\u003cth align=\"right\">少付外协费\u003c/th>\n\u003cth align=\"right\">减新增维护后\u003c/th>\n\u003cth>经营含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>减少10次复访\u003c/td>\n\u003ctd align=\"right\">5000元\u003c/td>\n\u003ctd align=\"right\">少1000元\u003c/td>\n\u003ctd>仅靠列示支出尚不合算\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>减少12次复访\u003c/td>\n\u003ctd align=\"right\">6000元\u003c/td>\n\u003ctd align=\"right\">持平\u003c/td>\n\u003ctd>达到这项成本的覆盖点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>减少20次复访\u003c/td>\n\u003ctd align=\"right\">10000元\u003c/td>\n\u003ctd align=\"right\">多4000元\u003c/td>\n\u003ctd>列示支出产生正改善\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"table-hint\">表格可左右滑动查看\u003c/p>\n\u003cp>本案候选空间20次，成本覆盖点12次，意味着要消除相当一部分可改进复访才有现金正增量。减少20次属于将这部分机会全部兑现的情景。若把必要的10次分阶段服务也当成可省，项目会被高估；若实际可影响范围比20次更小，负责人应重新选择投入强度。\u003c/p>\n\u003cp>客户少停机、续约更稳定、专家少被重复咨询，都可能有价值，但不是同一笔钱。客户停机损失属于客户，服务商是否取得收益要看合同与客户选择；专家时间首先是容量，不能再按同样小时凭空加一笔现金。\u003c/p>\n\u003cp>这使长期共建有了清楚对象：先让记录可信，再识别复访结构，改进准备和派工，最后用新任务与客户结果检验。能持续少走弯路、接住新设备并形成新方法，才是值得经营的服务能力。\u003c/p>\n","headings":[{"id":"case-c-section-1","label":"服务单关了，客户的问题还在"},{"id":"case-c-section-2","label":"四张“恢复”工单，留下了多少真正的认识"},{"id":"case-c-section-3","label":"让经验进入下一次派工"},{"id":"case-c-section-4","label":"减少多少次复访，账才划算"}],"exportMd":"# 案例C｜设备售后：怎样把老师傅的经验变成少跑一趟\n\n以下设备、工单和费用均为教学设定，不对应实际产品，不提供维修操作指令。\n\n## 服务单关了，客户的问题还在\n\n一家设备服务企业由客服接报修、调度派工、现场技术员处理，复杂问题再问资深工程师。同一台设备重复报修时，系统可能又建一张新单。客服看到关闭快，财务看到外协费用增加，客户感受到的是反复停机与等待。\n\n资深工程师的优势不一定是知道一个神奇答案。他可能在出发前先确认版本和运行条件，追问实际做过什么，再判断需要远程支持、什么人员和哪些配套件。新技术员只拿到“调整后恢复”，就学不到这些前置取舍。\n\nFDE因此不能只整理故障答案。需要把设备身份、原始描述、咨询经过、实际动作、备件、到场和后续复发接起来，找出重复上门发生在哪个环节。AI适合跨这些材料比较，提出需要核对的关系；缺件、判断不适用、客户条件变化和现场执行，应当有不同改法。\n\n## 四张“恢复”工单，留下了多少真正的认识\n\nM1客户说“促销时段间歇停机”，系统知道设备V1，负载不完整。技术员记“调整并重启，未换件”，AI却写成“更换部件后恢复”。这是一项需要纠正的事实错误，原因要回到模型当时取得的输入检查。\n\n| 工单 | 已知版本和动作 | 观察结果 |\n|---|---|---|\n| M1 | V1，调整并重启，未换件 | 当次恢复，记录到次日 |\n| M2 | V1，调整并重启 | 当次恢复，记录到次日 |\n| M3 | V2，调整，未记录重启 | 一小时后报告恢复 |\n| M4 | V1，仅记录重启 | 当次恢复，记录到次日 |\n\nAI可以把共同处、差异和空白摆出来。M4让“只有调整才会恢复”受到挑战，M3提示版本和中间变化；但未记录不等于没发生，这四张单并没有区分调整、重启和运行条件的作用。\n\n可用经验由此分成两种。一种是尚待确认的技术解释，用于提出补问；另一种是已经清楚的工作要求，例如保留完整动作、出发前核对版本、把恢复与复发接到同一设备。企业可以先改进后一种，不必等所有故障原因都被证明。\n\n## 让经验进入下一次派工\n\n下一张相似工单到来，AI先查当前设备，带回案例差别，提示尚缺事实；需要专业判断时把依据交给专家，而不是只发“请看一下”。派工前确认合适人员、必要配套和客户时段，执行后核对实际到场与恢复。\n\n某次恢复又复发，系统保留为同一问题的后续，而非仅用新关单数覆盖。专业人员据此修改适用条件，工程把修订放回采用入口。接任者要能找到并用对这些条件，老师傅原来承担的部分能力才开始留在组织。\n\n## 减少多少次复访，账才划算\n\n独立给定一个月100张服务单，原来有30次额外复访，共130次出车。回看这些复访，12次涉及配套不符、到现场才确认版本，8次涉及关键材料或客户条件未准备，另外10次本就需要分阶段服务。前20次构成候选改进空间，不意味着都能被AI消除。\n\n每次外协派单按500元结算，取消就实际少付。新AI与FDE维护增加6000元/月，正常上门及原固定工资不变。下面只比较这几项，不从四张工单估计复访概率。\n\n| 改造后的情景 | 少付外协费 | 减新增维护后 | 经营含义 |\n|---|---:|---:|---|\n| 减少10次复访 | 5000元 | 少1000元 | 仅靠列示支出尚不合算 |\n| 减少12次复访 | 6000元 | 持平 | 达到这项成本的覆盖点 |\n| 减少20次复访 | 10000元 | 多4000元 | 列示支出产生正改善 |\n\n本案候选空间20次，成本覆盖点12次，意味着要消除相当一部分可改进复访才有现金正增量。减少20次属于将这部分机会全部兑现的情景。若把必要的10次分阶段服务也当成可省，项目会被高估；若实际可影响范围比20次更小，负责人应重新选择投入强度。\n\n客户少停机、续约更稳定、专家少被重复咨询，都可能有价值，但不是同一笔钱。客户停机损失属于客户，服务商是否取得收益要看合同与客户选择；专家时间首先是容量，不能再按同样小时凭空加一笔现金。\n\n这使长期共建有了清楚对象：先让记录可信，再识别复访结构，改进准备和派工，最后用新任务与客户结果检验。能持续少走弯路、接住新设备并形成新方法，才是值得经营的服务能力。\n","exportSingleMd":"# 案例C｜设备售后：怎样把老师傅的经验变成少跑一趟\n\n以下设备、工单和费用均为教学设定，不对应实际产品，不提供维修操作指令。\n\n## 服务单关了，客户的问题还在\n\n一家设备服务企业由客服接报修、调度派工、现场技术员处理，复杂问题再问资深工程师。同一台设备重复报修时，系统可能又建一张新单。客服看到关闭快，财务看到外协费用增加，客户感受到的是反复停机与等待。\n\n资深工程师的优势不一定是知道一个神奇答案。他可能在出发前先确认版本和运行条件，追问实际做过什么，再判断需要远程支持、什么人员和哪些配套件。新技术员只拿到“调整后恢复”，就学不到这些前置取舍。\n\nFDE因此不能只整理故障答案。需要把设备身份、原始描述、咨询经过、实际动作、备件、到场和后续复发接起来，找出重复上门发生在哪个环节。AI适合跨这些材料比较，提出需要核对的关系；缺件、判断不适用、客户条件变化和现场执行，应当有不同改法。\n\n## 四张“恢复”工单，留下了多少真正的认识\n\nM1客户说“促销时段间歇停机”，系统知道设备V1，负载不完整。技术员记“调整并重启，未换件”，AI却写成“更换部件后恢复”。这是一项需要纠正的事实错误，原因要回到模型当时取得的输入检查。\n\n| 工单 | 已知版本和动作 | 观察结果 |\n|---|---|---|\n| M1 | V1，调整并重启，未换件 | 当次恢复，记录到次日 |\n| M2 | V1，调整并重启 | 当次恢复，记录到次日 |\n| M3 | V2，调整，未记录重启 | 一小时后报告恢复 |\n| M4 | V1，仅记录重启 | 当次恢复，记录到次日 |\n\nAI可以把共同处、差异和空白摆出来。M4让“只有调整才会恢复”受到挑战，M3提示版本和中间变化；但未记录不等于没发生，这四张单并没有区分调整、重启和运行条件的作用。\n\n可用经验由此分成两种。一种是尚待确认的技术解释，用于提出补问；另一种是已经清楚的工作要求，例如保留完整动作、出发前核对版本、把恢复与复发接到同一设备。企业可以先改进后一种，不必等所有故障原因都被证明。\n\n## 让经验进入下一次派工\n\n下一张相似工单到来，AI先查当前设备，带回案例差别，提示尚缺事实；需要专业判断时把依据交给专家，而不是只发“请看一下”。派工前确认合适人员、必要配套和客户时段，执行后核对实际到场与恢复。\n\n某次恢复又复发，系统保留为同一问题的后续，而非仅用新关单数覆盖。专业人员据此修改适用条件，工程把修订放回采用入口。接任者要能找到并用对这些条件，老师傅原来承担的部分能力才开始留在组织。\n\n## 减少多少次复访，账才划算\n\n独立给定一个月100张服务单，原来有30次额外复访，共130次出车。回看这些复访，12次涉及配套不符、到现场才确认版本，8次涉及关键材料或客户条件未准备，另外10次本就需要分阶段服务。前20次构成候选改进空间，不意味着都能被AI消除。\n\n每次外协派单按500元结算，取消就实际少付。新AI与FDE维护增加6000元/月，正常上门及原固定工资不变。下面只比较这几项，不从四张工单估计复访概率。\n\n| 改造后的情景 | 少付外协费 | 减新增维护后 | 经营含义 |\n|---|---:|---:|---|\n| 减少10次复访 | 5000元 | 少1000元 | 仅靠列示支出尚不合算 |\n| 减少12次复访 | 6000元 | 持平 | 达到这项成本的覆盖点 |\n| 减少20次复访 | 10000元 | 多4000元 | 列示支出产生正改善 |\n\n本案候选空间20次，成本覆盖点12次，意味着要消除相当一部分可改进复访才有现金正增量。减少20次属于将这部分机会全部兑现的情景。若把必要的10次分阶段服务也当成可省，项目会被高估；若实际可影响范围比20次更小，负责人应重新选择投入强度。\n\n客户少停机、续约更稳定、专家少被重复咨询，都可能有价值，但不是同一笔钱。客户停机损失属于客户，服务商是否取得收益要看合同与客户选择；专家时间首先是容量，不能再按同样小时凭空加一笔现金。\n\n这使长期共建有了清楚对象：先让记录可信，再识别复访结构，改进准备和派工，最后用新任务与客户结果检验。能持续少走弯路、接住新设备并形成新方法，才是值得经营的服务能力。\n","text":"# 案例C｜设备售后：怎样把老师傅的经验变成少跑一趟\n\n以下设备、工单和费用均为教学设定，不对应实际产品，不提供维修操作指令。\n\n## 服务单关了，客户的问题还在\n\n一家设备服务企业由客服接报修、调度派工、现场 稿，技术专家每天为此提供2小时，每篇核验30分钟，只能核4篇。一次看似流畅的文章，把一种型号的性能写到了另一型号上；另一篇适用场景宽泛，销售拿去回应询价仍要重写。稿件多了，专业核验、客户确认、配图和发布没有同步改变。\n\n若起初没有待核材料，每天20进、4出，没有取消、返工或丢失，第一天积16份，第二天32份，第五天80份。待核稿又可能因产品版本和客户需求变化而过时。生成量增加，先增加的是库存和筛选劳动。\n\n## 两种改法，改变不同的限制\n\n第一种是继续加模型并行，把初稿扩成每天40份。专家仍核4篇，交付上限不变。\n\n第二种由FDE追查专家究竟在核什么：反复找产品规格、确认型号、检查措辞是否超出材料，以及判断是否回答客户的真实问题。新的安排先提供客户对象、现行产品资料和可核依据，AI标出草稿中的事实、引用与待确认项；专家集中处理重要差别，修改返回下一轮。\n\n若这一改法能在相同最终质量下，把单篇核验从30分钟减到20分钟，同样2小时便可核6篇；而每天只需8份有针对性的初稿，资源便从无效扩量转向可交付工作。少掉的10分钟应来自实际减少的查找和重做，6篇是待验证假设，不由增加一个来源链接自动取得。\n\n新安排还改变进入核验的节奏：编辑在原有排题工时内，从8份候选选6份送审，另外2份明确终止，不再作为待核交付积压。若筛选本身需要专家参与，就要计入同一段2小时，六篇产能随之重算。减少上游进入量和改善专业核验，是两项相互配合的改变。\n\n## 用20个工作日把账算完整\n\n每篇客户接受并付费的交付收入800元，后续配图、编辑与发布外部变动成本300元；每份初稿模型费2元。原固定团队工资不变，改善资料与核验的方案另增FDE费用8000元/月。假设客户有120篇合格付费需求，后续环节有相应容量。\n\n| 月度安排 | 原安排 | 只扩大生成 | 改资料与核验 |\n|---|---:|---:|---:|\n| 每日初稿/审核 | 20/4 | 40/4 | 8/6 |\n| 月初稿 | 400 | 800 | 160 |\n| 月付费交付 | 80 | 80 | 120 |\n| 收入 | 64000元 | 64000元 | 96000元 |\n| 后续变动成本 | 24000元 | 24000元 | 36000元 |\n| 模型费 | 800元 | 1600元 | 320元 |\n| 新增FDE费 | 0 | 0 | 8000元 |\n| 列示贡献 | 39200元 | 38400元 | 51680元 |\n\n只扩生成少了800元贡献；改变真正瓶颈的方案多12480元。起作用的不是“产出文字更多”，而是相同质量下可核、可接受、可付费的工作增加，同时无用初稿减少。\n\n再改一个条件：客户实际上只愿付80篇。仍按新方案160份初稿和8000元费用安排，只交付80篇，贡献变31680元，反而比原来少7520元。省出专家容量不等于有生意来填；按本例成本，至少增加16篇付费交付，才取得正增量。\n\n## 好候选、好选择与好生意要分别成立\n\n同一项内容工作中，AI可能擅长构思，专家可能擅长辨别工况，客户则决定采用。最终交付质量还受组合影响，不能固定成“AI只写、人永远能选对”。\n\n一个独立分数算例是：旧方案池70、80，选80；新池92、98，选92。新安排没选到自己最好的一项，最终仍高于旧安排。它只说明生成质量与选择能力可以分开，不是宝洁研究的数据。\n\n客户随后可能希望把内容服务扩成持续获客支持。这会要求连接产品问题、受众、询价质量、销售跟进与成交，而非只按月发文章。能不能取得客户后续记录、专业与销售是否能行动、收费能否覆盖责任，决定新产品是否成立。\n\n还可以讨论一个独立稳定系统：日均完成4份、均停留3天，平均在制12份。这与前面的持续20进4出不同，不能把增长积压代入稳定公式算等待。\n\n这个案例让智能资源经营回到一条完整交付链。模型可以很快增加供给，企业需要找到被限制的能力，并确认客户愿意为解开限制后的结果付费。\n","html":"\u003ch1>案例D｜工业品牌内容服务：初稿翻倍，交付为什么没有增加\u003c/h1>\n\u003cp>以下团队、价格和产能为教学条件。新增审核能力和客户需求是方案成立的假设，需要实际验证。\u003c/p>\n\u003ch2 id=\"case-d-section-1\">客户付费的东西，在生成之后\u003c/h2>\n\u003cp>一家服务制造企业的内容团队，为客户制作产品介绍、应用文章和销售材料。客户希望内容能准确说明产品，适合目标采购者，并且可公开使用。\u003c/p>\n\u003cp>AI每天能产生20份初稿，技术专家每天为此提供2小时，每篇核验30分钟，只能核4篇。一次看似流畅的文章，把一种型号的性能写到了另一型号上；另一篇适用场景宽泛，销售拿去回应询价仍要重写。稿件多了，专业核验、客户确认、配图和发布没有同步改变。\u003c/p>\n\u003cp>若起初没有待核材料，每天20进、4出，没有取消、返工或丢失，第一天积16份，第二天32份，第五天80份。待核稿又可能因产品版本和客户需求变化而过时。生成量增加，先增加的是库存和筛选劳动。\u003c/p>\n\u003ch2 id=\"case-d-section-2\">两种改法，改变不同的限制\u003c/h2>\n\u003cp>第一种是继续加模型并行，把初稿扩成每天40份。专家仍核4篇，交付上限不变。\u003c/p>\n\u003cp>第二种由FDE追查专家究竟在核什么：反复找产品规格、确认型号、检查措辞是否超出材料，以及判断是否回答客户的真实问题。新的安排先提供客户对象、现行产品资料和可核依据，AI标出草稿中的事实、引用与待确认项；专家集中处理重要差别，修改返回下一轮。\u003c/p>\n\u003cp>若这一改法能在相同最终质量下，把单篇核验从30分钟减到20分钟，同样2小时便可核6篇；而每天只需8份有针对性的初稿，资源便从无效扩量转向可交付工作。少掉的10分钟应来自实际减少的查找和重做，6篇是待验证假设，不由增加一个来源链接自动取得。\u003c/p>\n\u003cp>新安排还改变进入核验的节奏：编辑在原有排题工时内，从8份候选选6份送审，另外2份明确终止，不再作为待核交付积压。若筛选本身需要专家参与，就要计入同一段2小时，六篇产能随之重算。减少上游进入量和改善专业核验，是两项相互配合的改变。\u003c/p>\n\u003ch2 id=\"case-d-section-3\">用20个工作日把账算完整\u003c/h2>\n\u003cp>每篇客户接受并付费的交付收入800元，后续配图、编辑与发布外部变动成本300元；每份初稿模型费2元。原固定团队工资不变，改善资料与核验的方案另增FDE费用8000元/月。假设客户有120篇合格付费需求，后续环节有相应容量。\u003c/p>\n\u003cdiv class=\"table-scroll table-wide\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>月度安排\u003c/th>\n\u003cth align=\"right\">原安排\u003c/th>\n\u003cth align=\"right\">只扩大生成\u003c/th>\n\u003cth align=\"right\">改资料与核验\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>每日初稿/审核\u003c/td>\n\u003ctd align=\"right\">20/4\u003c/td>\n\u003ctd align=\"right\">40/4\u003c/td>\n\u003ctd align=\"right\">8/6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>月初稿\u003c/td>\n\u003ctd align=\"right\">400\u003c/td>\n\u003ctd align=\"right\">800\u003c/td>\n\u003ctd align=\"right\">160\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>月付费交付\u003c/td>\n\u003ctd align=\"right\">80\u003c/td>\n\u003ctd align=\"right\">80\u003c/td>\n\u003ctd align=\"right\">120\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>收入\u003c/td>\n\u003ctd align=\"right\">64000元\u003c/td>\n\u003ctd align=\"right\">64000元\u003c/td>\n\u003ctd align=\"right\">96000元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>后续变动成本\u003c/td>\n\u003ctd align=\"right\">24000元\u003c/td>\n\u003ctd align=\"right\">24000元\u003c/td>\n\u003ctd align=\"right\">36000元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型费\u003c/td>\n\u003ctd align=\"right\">800元\u003c/td>\n\u003ctd align=\"right\">1600元\u003c/td>\n\u003ctd align=\"right\">320元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新增FDE费\u003c/td>\n\u003ctd align=\"right\">0\u003c/td>\n\u003ctd align=\"right\">0\u003c/td>\n\u003ctd align=\"right\">8000元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>列示贡献\u003c/td>\n\u003ctd align=\"right\">39200元\u003c/td>\n\u003ctd align=\"right\">38400元\u003c/td>\n\u003ctd align=\"right\">51680元\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"table-hint\">表格可左右滑动查看\u003c/p>\n\u003cp>只扩生成少了800元贡献；改变真正瓶颈的方案多12480元。起作用的不是“产出文字更多”，而是相同质量下可核、可接受、可付费的工作增加，同时无用初稿减少。\u003c/p>\n\u003cp>再改一个条件：客户实际上只愿付80篇。仍按新方案160份初稿和8000元费用安排，只交付80篇，贡献变31680元，反而比原来少7520元。省出专家容量不等于有生意来填；按本例成本，至少增加16篇付费交付，才取得正增量。\u003c/p>\n\u003ch2 id=\"case-d-section-4\">好候选、好选择与好生意要分别成立\u003c/h2>\n\u003cp>同一项内容工作中，AI可能擅长构思，专家可能擅长辨别工况，客户则决定采用。最终交付质量还受组合影响，不能固定成“AI只写、人永远能选对”。\u003c/p>\n\u003cp>一个独立分数算例是：旧方案池70、80，选80；新池92、98，选92。新安排没选到自己最好的一项，最终仍高于旧安排。它只说明生成质量与选择能力可以分开，不是宝洁研究的数据。\u003c/p>\n\u003cp>客户随后可能希望把内容服务扩成持续获客支持。这会要求连接产品问题、受众、询价质量、销售跟进与成交，而非只按月发文章。能不能取得客户后续记录、专业与销售是否能行动、收费能否覆盖责任，决定新产品是否成立。\u003c/p>\n\u003cp>还可以讨论一个独立稳定系统：日均完成4份、均停留3天，平均在制12份。这与前面的持续20进4出不同，不能把增长积压代入稳定公式算等待。\u003c/p>\n\u003cp>这个案例让智能资源经营回到一条完整交付链。模型可以很快增加供给，企业需要找到被限制的能力，并确认客户愿意为解开限制后的结果付费。\u003c/p>\n","headings":[{"id":"case-d-section-1","label":"客户付费的东西，在生成之后"},{"id":"case-d-section-2","label":"两种改法，改变不同的限制"},{"id":"case-d-section-3","label":"用20个工作日把账算完整"},{"id":"case-d-section-4","label":"好候选、好选择与好生意要分别成立"}],"exportMd":"# 案例D｜工业品牌内容服务：初稿翻倍，交付为什么没有增加\n\n以下团队、价格和产能为教学条件。新增审核能力和客户需求是方案成立的假设，需要实际验证。\n\n## 客户付费的东西，在生成之后\n\n一家服务制造企业的内容团队，为客户制作产品介绍、应用文章和销售材料。客户希望内容能准确说明产品，适合目标采购者，并且可公开使用。\n\nAI每天能产生20份初稿，技术专家每天为此提供2小时，每篇核验30分钟，只能核4篇。一次看似流畅的文章，把一种型号的性能写到了另一型号上；另一篇适用场景宽泛，销售拿去回应询价仍要重写。稿件多了，专业核验、客户确认、配图和发布没有同步改变。\n\n若起初没有待核材料，每天20进、4出，没有取消、返工或丢失，第一天积16份，第二天32份，第五天80份。待核稿又可能因产品版本和客户需求变化而过时。生成量增加，先增加的是库存和筛选劳动。\n\n## 两种改法，改变不同的限制\n\n第一种是继续加模型并行，把初稿扩成每天40份。专家仍核4篇，交付上限不变。\n\n第二种由FDE追查专家究竟在核什么：反复找产品规格、确认型号、检查措辞是否超出材料，以及判断是否回答客户的真实问题。新的安排先提供客户对象、现行产品资料和可核依据，AI标出草稿中的事实、引用与待确认项；专家集中处理重要差别，修改返回下一轮。\n\n若这一改法能在相同最终质量下，把单篇核验从30分钟减到20分钟，同样2小时便可核6篇；而每天只需8份有针对性的初稿，资源便从无效扩量转向可交付工作。少掉的10分钟应来自实际减少的查找和重做，6篇是待验证假设，不由增加一个来源链接自动取得。\n\n新安排还改变进入核验的节奏：编辑在原有排题工时内，从8份候选选6份送审，另外2份明确终止，不再作为待核交付积压。若筛选本身需要专家参与，就要计入同一段2小时，六篇产能随之重算。减少上游进入量和改善专业核验，是两项相互配合的改变。\n\n## 用20个工作日把账算完整\n\n每篇客户接受并付费的交付收入800元，后续配图、编辑与发布外部变动成本300元；每份初稿模型费2元。原固定团队工资不变，改善资料与核验的方案另增FDE费用8000元/月。假设客户有120篇合格付费需求，后续环节有相应容量。\n\n| 月度安排 | 原安排 | 只扩大生成 | 改资料与核验 |\n|---|---:|---:|---:|\n| 每日初稿/审核 | 20/4 | 40/4 | 8/6 |\n| 月初稿 | 400 | 800 | 160 |\n| 月付费交付 | 80 | 80 | 120 |\n| 收入 | 64000元 | 64000元 | 96000元 |\n| 后续变动成本 | 24000元 | 24000元 | 36000元 |\n| 模型费 | 800元 | 1600元 | 320元 |\n| 新增FDE费 | 0 | 0 | 8000元 |\n| 列示贡献 | 39200元 | 38400元 | 51680元 |\n\n只扩生成少了800元贡献；改变真正瓶颈的方案多12480元。起作用的不是“产出文字更多”，而是相同质量下可核、可接受、可付费的工作增加，同时无用初稿减少。\n\n再改一个条件：客户实际上只愿付80篇。仍按新方案160份初稿和8000元费用安排，只交付80篇，贡献变31680元，反而比原来少7520元。省出专家容量不等于有生意来填；按本例成本，至少增加16篇付费交付，才取得正增量。\n\n## 好候选、好选择与好生意要分别成立\n\n同一项内容工作中，AI可能擅长构思，专家可能擅长辨别工况，客户则决定采用。最终交付质量还受组合影响，不能固定成“AI只写、人永远能选对”。\n\n一个独立分数算例是：旧方案池70、80，选80；新池92、98，选92。新安排没选到自己最好的一项，最终仍高于旧安排。它只说明生成质量与选择能力可以分开，不是宝洁研究的数据。\n\n客户随后可能希望把内容服务扩成持续获客支持。这会要求连接产品问题、受众、询价质量、销售跟进与成交，而非只按月发文章。能不能取得客户后续记录、专业与销售是否能行动、收费能否覆盖责任，决定新产品是否成立。\n\n还可以讨论一个独立稳定系统：日均完成4份、均停留3天，平均在制12份。这与前面的持续20进4出不同，不能把增长积压代入稳定公式算等待。\n\n这个案例让智能资源经营回到一条完整交付链。模型可以很快增加供给，企业需要找到被限制的能力，并确认客户愿意为解开限制后的结果付费。\n","exportSingleMd":"# 案例D｜工业品牌内容服务：初稿翻倍，交付为什么没有增加\n\n以下团队、价格和产能为教学条件。新增审核能力和客户需求是方案成立的假设，需要实际验证。\n\n## 客户付费的东西，在生成之后\n\n一家服务制造企业的内容团队，为客户制作产品介绍、应用文章和销售材料。客户希望内容能准确说明产品，适合目标采购者，并且可公开使用。\n\nAI每天能产生20份初稿，技术专家每天为此提供2小时，每篇核验30分钟，只能核4篇。一次看似流畅的文章，把一种型号的性能写到了另一型号上；另一篇适用场景宽泛，销售拿去回应询价仍要重写。稿件多了，专业核验、客户确认、配图和发布没有同步改变。\n\n若起初没有待核材料，每天20进、4出，没有取消、返工或丢失，第一天积16份，第二天32份，第五天80份。待核稿又可能因产品版本和客户需求变化而过时。生成量增加，先增加的是库存和筛选劳动。\n\n## 两种改法，改变不 专业、渠道或履约条件 | [第3章](03-产业重构.md) |\n| 优势生成机制 | 条件怎样经判断、协作和资源形成客户结果 | [第12章](12-优势的生成机制.md) |\n| FDE | 靠近现场，把认识、工程和反馈连续连接的专业力量 | [第14章](14-FDE的企业侧角色.md) |\n| 试点学习价值 | 取得会改变下一笔选择的证据 | [第16章](16-试点与学习价值.md) |\n| 智能伙伴 | 有持续职责、任务记忆、行动与反馈的AI参与者 | [第17章](17-智能伙伴的持续职责.md) |\n| 工作流 | 主要路径由预设程序组织，可含模型、分支与循环 | [第19章](19-工作流与Agent.md) |\n| Agent | 模型在目标与工具范围内，动态选择部分下一步 | [第19章](19-工作流与Agent.md) |\n| 上下文与检索 | 为当前工作取得相关、适用的信息，不照搬旧答案 | [第20章](20-上下文与检索.md) |\n| 业务状态 | 建议、采用、接受、实际完成与客户结果等不同事实 | [第21章](21-建议与真实执行.md) |\n| 互补投入 | 技术作用所需的流程、人员、组织和工具建设 | [第22章](22-持续运行与系统演化.md) |\n| token | 模型输入输出的计量单位，不是价值单位 | [第23章](23-token与智能资源.md) |\n| 有效利用 | 智能投入形成合格工作的过程 | [第23章](23-token与智能资源.md) |\n| 价值转换 | 工作经采用、执行和客户选择进入经营 | [第26章](26-完整成本与兑现.md) |\n| 产能瓶颈 | 限制整条交付的环节，上游扩量可能只增加等待 | [第25章](25-产能与瓶颈.md) |\n| 能力留存 | 本轮工作对后续任务、接任或迁移的作用 | [第27章](27-能力留存.md) |\n| 探索与利用 | 研究新可能与改善已有能力的资源取舍 | [第28章](28-投入组合.md) |\n| 留出任务 | 不用于调方案，用来观察新材料表现的任务 | [第29章](29-任务质量.md) |\n| 列示贡献 | 收入减本例已列相关成本，不冒充完整公司净利 | [第30章](30-业务效果与因果.md) |\n| 因果与比较 | 区分方法作用、选择差异和同期变化 | [第30章](30-业务效果与因果.md) |\n| 组织学习 | 后续工作因经验改变，且能有条件地接任与迁移 | [第31章](31-组织学习的验证.md) |\n| 反馈循环 | 行动改变未来可见数据，可能改进也可能强化偏差 | [第32章](32-纠错与遗忘.md) |\n| 动态能力 | 使资源和能力持续适应、重组并保持相关 | [第37章](37-阶段发展路线.md) |\n| 商业模式 | 客户价值、交付与价值获取的经营关系 | [第38章](38-新产品与服务.md) |\n\n这些解释服务课程判断。具体选择仍要回到相应情境、条件与证据。\n","html":"\u003ch1>概念回查｜把词放回经营问题\u003c/h1>\n\u003cp>遇到概念时，先看它解释什么，再回正文。这里用于查询，不要求先背术语。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>在本课中的用途\u003c/th>\n\u003cth>正文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>基础模型\u003c/td>\n\u003ctd>先取得可适配多类任务的通用能力，再补企业条件\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-01\">第1章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>吸收能力\u003c/td>\n\u003ctd>企业怎样识别、理解并应用新知识\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-04\">第4章\u003c/a>、\u003ca href=\"#lesson-35\">第35章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>kn 值获取的经营关系 | [第38章](#lesson-38) |\n\n这些解释服务课程判断。具体选择仍要回到相应情境、条件与证据。\n","exportSingleMd":"# 概念回查｜把词放回经营问题\n\n遇到概念时，先看它解释什么，再回正文。这里用于查询，不要求先背术语。\n\n| 概念 | 在本课中的用途 | 正文 |\n|---|---|---|\n| 基础模型 | 先取得可适配多类任务的通用能力，再补企业条件 | [第1章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-01) |\n| 吸收能力 | 企业怎样识别、理解并应用新知识 | [第4章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-04)、[第35章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-35) |\n| know-how | 在条件下组织判断、行动与调整的知识 | [第5章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-05) |\n| 候选经验 | 有待进一步区分的解释，先用于补问与观察 | [第8章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-08) |\n| 组织记忆 | 跨人、跨任务仍能找到、理解、采用和更新经验的条件 | [第9章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-09) |\n| 标准化 | 让事实和协作含义可共同理解，方法随证据稳定 | [第10章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-10) |\n| 差异化 | 与客户选择和可持续交付有关的能力组合 | [第11章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-11) |\n| 互补能力 | 与智能共同产生结果的客户、专业、渠道或履约条件 | [第3章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-03) |\n| 优势生成机制 | 条件怎样经判断、协作和资源形成客户结果 | [第12章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-12) |\n| FDE | 靠近现场，把认识、工程和反馈连续连接的专业力量 | [第14章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-14) |\n| 试点学习价值 | 取得会改变下一笔选择的证据 | [第16章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-16) |\n| 智能伙伴 | 有持续职责、任务记忆、行动与反馈的AI参与者 | [第17章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-17) |\n| 工作流 | 主要路径由预设程序组织，可含模型、分支与循环 | [第19章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-19) |\n| Agent | 模型在目标与工具范围内，动态选择部分下一步 | [第19章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-19) |\n| 上下文与检索 | 为当前工作取得相关、适用的信息，不照搬旧答案 | [第20章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-20) |\n| 业务状态 | 建议、采用、接受、实际完成与客户结果等不同事实 | [第21章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-21) |\n| 互补投入 | 技术作用所需的流程、人员、组织和工具建设 | [第22章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-22) |\n| token | 模型输入输出的计量单位，不是价值单位 | [第23章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-23) |\n| 有效利用 | 智能投入形成合格工作的过程 | [第23章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-23) |\n| 价值转换 | 工作经采用、执行和客户选择进入经营 | [第26章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-26) |\n| 产能瓶颈 | 限制整条交付的环节，上游扩量可能只增加等待 | [第25章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-25) |\n| 能力留存 | 本轮工作对后续任务、接任或迁移的作用 | [第27章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-27) |\n| 探索与利用 | 研究新可能与改善已有能力的资源取舍 | [第28章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-28) |\n| 留出任务 | 不用于调方案，用来观察新材料表现的任务 | [第29章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-29) |\n| 列示贡献 | 收入减本例已列相关成本，不冒充完整公司净利 | [第30章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-30) |\n| 因果与比较 | 区分方法作用、选择差异和同期变化 | [第30章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-30) |\n| 组织学习 | 后续工作因经验改变，且能有条件地接任与迁移 | [第31章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-31) |\n| 反馈循环 | 行动改变未来可见数据，可能改进也可能强化偏差 | [第32章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-32) |\n| 动态能力 | 使资源和能力持续适应、重组并保持相关 | [第37章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-37) |\n| 商业模式 | 客户价值、交付与价值获取的经营关系 | [第38章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-38) |\n\n这些解释服务课程判断。具体选择仍要回到相应情境、条件与证据。\n","text":"# 概念回查｜把词放回经营问题\n\n遇到概念时，先看它解释什么，再回正文。这里用于查询，不要求先背术语。\n\n| 概念 | 在本课中的用途 | 正文 |\n|---|---|---|\n| 基础模型 | 先取得可适配多类任务的通用能力，再补企业条件 | 第1章 |\n| 吸收能力 | 企业怎样识别、理解并应用新知识 | 第4章、第35章 |\n| know-how | 在条件下组织判断、行动与调整的知识 | 第5章 |\n| 候选经验 | 有待进一步区分的解释，先用于补问与观察 | 第8章 |\n| 组织记忆 | 跨人、跨任务仍能找到、理解、采用和更新经验的条件 | 第9章 |\n| 标准化 | 让事实和协作含义可共同理解，方法随证据稳定 | 第10章 |\n| 差异化 | 与客户选择和可持续交付有关的能力组合 | 第11章 |\n| 互补能力 | 与智能共同产生结果的客户、专业、渠道或履约条件 | 第3章 |\n| 优势生成机制 | 条件怎样经判断、协作和资源形成客户结果 | 第12章 |\n| FDE | 靠近现场，把认识、工程和反馈连续连接的专业力量 | 第14章 |\n| 试点学习价值 | 取得会改变下一笔选择的证据 | 第16章 |\n| 智能伙伴 | 有持续职责、任务记忆、行动与反馈的AI参与者 | 第17章 |\n| 工作流 | 主要路径由预设程序组织，可含模型、分支与循环 | 第19章 |\n| Agent | 模型在目标与工具范围内，动态选择部分下一步 | 第19章 |\n| 上下文与检索 | 为当前工作取得相关、适用的信息，不照搬旧答案 | 第20章 |\n| 业务状态 | 建议、采用、接受、实际完成与客户结果等不同事实 | 第21章 |\n| 互补投入 | 技术作用所需的流程、人员、组织和工具建设 | 第22章 |\n| token | 模型输入输出的计量单位，不是价值单位 | 第23章 |\n| 有效利用 | 智能投入形成合格工作的过程 | 第23章 |\n| 价值转换 | 工作经采用、执行和客户选择进入经营 | 第26章 |\n| 产能瓶颈 | 限制整条交付的环节，上游扩量可能只增加等待 | 第25章 |\n| 能力留存 | 本轮工作对后续任务、接任或迁移的作用 | 第27章 |\n| 探索与利用 | 研究新可能与改善已有能力的资源取舍 | 第28章 |\n| 留出任务 | 不用于调方案，用来观察新材料表现的任务 | 第29章 |\n| 列示贡献 | 收入减本例已列相关成本，不冒充完整公司净利 | 第30章 |\n| 因果与比较 | 区分方法作用、选择差异和同期变化 | 第30章 |\n| 组织学习 | 后续工作因经验改变，且能有条件地接任与迁移 | 第31章 |\n| 反馈循环 | 行动改变未来可见数据，可能改进也可能强化偏差 | 第32章 |\n| 动态能力 | 使资源和能力持续适应、重组并保持相关 | 第37章 |\n| 商业模式 | 客户价值、交付与价值获取的经营关系 | 第38章 |\n\n这些解释服务课程判断。具体选择仍要回到相应情境、条件与证据。\n"},{"file":"延伸阅读.md","id":"reading","number":null,"role":"参考","part":-1,"title":"研究与延伸阅读","md":"# 研究与延伸阅读\n\n课程把理论、实际研究、工程经验和机构自述用于不同问题。它们共同支持机制推导，不构成一个适用于所有企业的提效数字。教学案例与业务算例全部是独立设定。\n\n## 理解知识、能力与持续发展\n\n**Nonaka，1994，组织知识创造。** [原始论文的大学存档](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)。用于理解实践、表达、个人与组织之间的知识发展。本课主要采用可核原文片段；扫描件读取受限。它不证明所有隐性技能都能被语言或AI完整提取。\n\n**Cohen与Levinthal，1990，吸收能力。** [原始论文](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)。采用摘要、引言与相关知识讨论，解释企业为何需要自己的认识与组织条件。它不是AI或FDE长期效果研究。\n\n**Teece，2007，动态能力。** [机构原文](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)。采用引言与框架段落，理解能力如何持续适应与重组。框架不能替企业判断具体优势，也不估计生存率。\n\n**March，1991，探索与利用。** [原始论文](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)。采用摘要与开篇机制，讨论资源竞争与回报节奏。没有导出固定预算比例。\n\n**Brynjolfsson、Rock、Syverson，生产率J曲线。** [NBER研究记录](https://www.nber.org/papers/w25148)，期刊版2021。用于互补投入与测量关系；宏观J曲线不是单项目现金回本承诺。\n\n## 比较真实工作中的AI作用\n\n**Generative AI at Work，2025期刊版。** [作者提供的原文](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)。企业软件客服的分批上线研究，员工可以采用、修改或忽略建议。用于讨论经验差异、传播与学习，不推成全行业利润。本课重读摘要、引言与上线安排，并核对2025版本5172名客服、每小时解决量平均提高15%的定义；这是分批上线的单企业研究，不能当成本课其他行业的提升率。\n\n**The Cybernetic Teammate，2026期刊版。** [期刊原文](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)。采用宝洁创新实验的设计与阶段结果，分清生成、组内选择与最终质量。最终方案改善不代表商业实施成功；不能据组内选择结果推断AI一般不擅判断，也未确认参与者在选择时均使用AI。\n\n**Shifting Work Patterns with Generative AI。** [实际采用页面](https://arxiv.org/html/2504.11436v4)。跨企业随机获得办公AI使用权，利用软件活动观察时间与任务。采用摘要、设计及观测限制。页面版本元信息与正文日期存在差异；不把软件活动直接解释成完整质量或利润。\n\n**METR开发任务研究，早期2025。** [原始论文](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)及[2026方法更新](https://metr.org/blog/2026-02-24-uplift-update/)。用于主观感受、总任务时间、选择与并行测量。旧工具和特定开发者结果不作当前AI编程通用结论。\n\n**Caro与Gallien，2010，Zara分配。** [作者机构原文](https://web.mit.edu/people/jgallien/ZaraOR2010.pdf)。本轮重读现场流程、试点设计和结果段落：关键尺码、展示、分配与激励相互作用；10款试点与匹配商品的比较支持作者估计的销售改善约3%—4%。它是运筹与数字化案例，不是生成式AI/FDE项目；全年财务影响包含推算，本课不把它写成实测AI收益，也未复算原始数据。\n\n## 理解模型与工程条件\n\n**CRFM基础模型报告，2021/2022版本。** [原始摘要](https://arxiv.org/abs/2108.07258v3)。用于广泛训练、下游适配与共同依赖；未全文采用长报告，也不证明每项任务经济可行。\n\n**Anthropic，Building effective agents，2024。** [原文](https://www.anthropic.com/research/building-effective-agents)。用于固定工作流、动态工具选择与复杂度取舍。属于工程经验，不是长期经营实验。\n\n**Anthropic，上下文工程，2025。** [原文](https://www.anthropic.com/research/effective-context-engineering-for-ai-agents)。用于当前信息、持久记录与调用。记忆工程不能保证业务经验正确。\n\n**Sculley等，2015，Hidden Technical Debt in Machine Learning Systems。** [原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)。采用摘要、反馈循环与系统依赖讨论。早期ML经验不能直接量化当前Agent成本。\n\n**Snell等，2024，测试时计算配置。** [原始预印本摘要](https://arxiv.org/abs/2408.03314)。用于资源、策略与任务难度关系；没有把数学实验倍数转成企业投资回报。\n\n## 理解人员、长期合作与经营机制\n\n**Holmström与Milgrom，1991，多任务激励。** [作者存档](https://web.stanford.edu/~milgrom/publishedarticles/Multitask%20Principal%20Agent.pdf)。采用可核引言片段，扫描全文读取受限。解释评价怎样改变注意力，不给出统一奖金规则。\n\n**Baker、Gibbons、Murphy，2002，关系合作。** [原始论文](https://faculty.washington.edu/mfan/is582/articles/Baker2002.pdf)。采用摘要与开篇关于重复合作、难以事前完整约定的结果。它不证明长期外部合同必然更优。\n\n**Palantir FDSE岗位。** [官方说明](https://jobs.lever.co/palantir/84131e3f-455e-47fc-9c11-898d95f09048)。用于模糊问题、原型、代码、集成和反馈等实际职责。属于机构自述，不是统一行业定义。\n\n**AWS FDE共建安排。** [官方材料](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)。用于生产共建与客户接续目标；机构主张不等于独立效果证明。\n\n**Little，1961，排队公式。** [原始摘要](https://pubsonline.informs.org/doi/abs/10.1287/opre.9.3.383)。仅读取摘要与成立条件。课程持续超负荷算例使用数量守恒，不套平稳平均等待公式。\n\n**Teece，2010，商业模式、战略与创新。** [原始出版页](https://www.sciencedirect.com/science/article/pii/S002463010900051X)。直接入口受限，采用出版页检索返回的摘要、引言与部分段落。用于价值创造、交付与获取，不证明当前AI新产品需求。\n\n**Teece，1988，技术创新的价值获取。** [原始出版摘要](https://pubsonline.informs.org/doi/abs/10.1287/inte.18.3.46)。本轮读取摘要，采用制造、分销等互补能力影响创新收益归属的关系；没有采用全文案例，也不由旧产业研究预测某家AI企业的利润。\n\n## 怎样把研究带回决定\n\n先看研究处理何种工作、比较什么、观察什么，再判断它与自己的场景哪些相同、哪些不同。一个平均效果不应抹掉经验与阶段差异，一项反向结果也不应冻结后续技术判断。\n\n课程中关于长期FDE、能力留存与竞争节奏的立场，是在这些依据上作出的机制推导，仍需要真实企业持续观察。可以据此主动建设，同时保留被证据改变的空间。\n","html":"\u003ch1>研究与延伸阅读\u003c/h1>\n\u003cp>课程把理论、实际研究、工程经验和机构自述用于不同问题。它们共同支持机制推导，不构成一个适用于所有企业的提效数字。教学案例与业务算例全部是独立设定。\u003c/p>\n\u003ch2 id=\"reading-section-1\">理解知识、能力与持续发展\u003c/h2>\n\u003cp>\u003cstrong>Nonaka，1994，组织知识创造。\u003c/strong> \u003ca href=\"https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始论文的大学存档\u003c/a>。用于理解实践、表达、个人与组织之间的知识发展。本课主要采用可核原文片段；扫描件读取受限。它不证明所有隐性技能都能被语言或AI完整提取。\u003c/p>\n\u003cp>\u003cstrong>Cohen与Levinthal，1990，吸收能力。\u003c/strong> \u003ca href=\"https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始论文\u003c/a>。采用摘要、引言与相关知识讨论，解释企业为何需要自己的认识与组织条件。它不是AI或FDE长期效果研究。\u003c/p>\n\u003cp>\u003cstrong>Teece，2007，动态能力。\u003c/strong> \u003ca href=\"https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">机构原文\u003c/a>。采用引言与框架段落，理解能力如何持续适应与重组。框架不能替企业判断具体优势，也不估计生存率。\u003c/p>\n\u003cp>\u003cstrong>March，1991，探索与利用。\u003c/strong> \u003ca href=\"https://hiveresearchlab.org/wp-content/uploads/2013/12 合作、难以事前完整约定的结果。它不证明长期外部合同必然更优。\u003c/p>\n\u003cp>\u003cstrong>Palantir FDSE岗位。\u003c/strong> \u003ca href=\"https://jobs.lever.co/palantir/84131e3f-455e-47fc-9c11-898d95f09048\" target=\"_blank\" rel=\"noopener noreferrer\">官方说明\u003c/a>。用于模糊问题、原型、代码、集成和反馈等实际职责。属于机构自述，不是统一行业定义。\u003c/p>\n\u003cp>\u003cstrong>AWS FDE共建安排。\u003c/strong> \u003ca href=\"https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers\" target=\"_blank\" rel=\"noopener noreferrer\">官方材料\u003c/a>。用于生产共建与客户接续目标；机构主张不等于独立效果证明。\u003c/p>\n\u003cp>\u003cstrong>Little，1961，排队公式。\u003c/strong> \u003ca href=\"https://pubsonline.informs.org/doi/abs/10.1287/opre.9.3.383\" target=\"_blank\" rel=\"noopener noreferrer\">原始摘要\u003c/a>。仅读取摘要与成立条件。课程持续超负荷算例使用数量守恒，不套平稳平均等待公式。\u003c/p>\n\u003cp>\u003cstrong>Teece，2010，商业模式、战略与创新。\u003c/strong> \u003ca href=\"https://www.sciencedirect.com/science/article/pii/S002463010900051X\" target=\"_blank\" rel=\"noopener noreferrer\">原始出版页\u003c/a>。直接入口受限，采用出版页检索返回的摘要、引言与部分段落。用于价值创造、交付与获取，不证明当前AI新产品需求。\u003c/p>\n\u003cp>\u003cstrong>Teece，1988，技术创新的价值获取。\u003c/strong> \u003ca href=\"https://pubsonline.informs.org/doi/abs/10.1287/inte.18.3.46\" target=\"_blank\" rel=\"noopener noreferrer\">原始出版摘要\u003c/a>。本轮读取摘要，采用制造、分销等互补能力影响创新收益归属的关系；没有采用全文案例，也不由旧产业研究预测某家AI企业的利润。\u003c/p>\n\u003ch2 id=\"reading-section-5\">怎样把研究带回决定\u003c/h2>\n\u003cp>先看研究处理何种工作、比较什么、观察什么，再判断它与自己的场景哪些相同、哪些不同。一个平均效果不应抹掉经验与阶段差异，一项反向结果也不应冻结后续技术判断。\u003c/p>\n\u003cp>课程中关于长期FDE、能力留存与竞争节奏的立场，是在这些依据上作出的机制推导，仍需要真实企业持续观察。可以据此主动建设，同时保留被证据改变的空间。\u003c/p>\n","headings":[{"id":"reading-section-1","label":"理解知识、能力与持续发展"},{"id":"reading-section-2","label":"比较真实工作中的AI作用"},{"id":"reading-section-3","label":"理解模型与工程条件"},{"id":"reading-section-4","label":"理解人员、长期合作与经营机制"},{"id":"reading-section-5","label":"怎样把研究带回决定"}],"exportMd":"# 研究与延伸阅读\n\n课程把理论、实际研究、工程经验和机构自述用于不同问题。它们共同支持机制推导，不构成一个适用于所有企业的提效数字。教学案例与业务算例全部是独立设定。\n\n## 理解知识、能力与持续发展\n\n**Nonaka，1994，组织知识创造。** [原始论文的大学存档](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)。用于理解实践、表达、个人与组织之间的知识发展。本课主要采用可核原文片段；扫描件读取受限。它不证明所有隐性技能都能被语言或AI完整提取。\n\n**Cohen与Levinthal，1990，吸收能力。** [原始论文](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)。采用摘要、引言与相关知识讨论，解释企业为何需要自己的认识与组织条件。它不是AI或FDE长期效果研究。\n\n**Teece，2007，动态能力。** [机构原文](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)。采用引言与框架段落，理解能力如何持续适应与重组。框架不能替企业判断具体优势，也不估计生存率。\n\n**March，1991，探索与利用。** [原始论文](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)。采用摘要与开篇机制，讨论资源竞争与回报节奏。没有导出固定预算比例。\n\n**Brynjolfsson、Rock、Syverson，生产率J曲线。** [NBER研究记录](https://www.nber.org/papers/w25148)，期刊版2021。用于互补投入与测量关系；宏观J曲线不是单项目现金回本承诺。\n\n## 比较真实工作中的AI作用\n\n**Generative AI at Work，2025期刊版。** [作者提供的原文](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)。企业软件客服的分批上线研究，员工可以采用、修改或忽略建议。用于讨论经验差异、传播与学习，不推成全行业利润。本课重读摘要、引言与上线安排，并核对2025版本5172名客服、每小时解决量平均提高15%的定义；这是分批上线的单企业研究，不能当成本课其他行业的提升率。\n\n**The Cybernetic Teammate，2026期刊版。** [期刊原文](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)。采用宝洁创新实验的设计与阶段结果，分清生成、组内选择与最终质量。最终方案改善不代表商业实施成功；不能据组内选择结果推断AI一般不擅判断，也未确认参与者在选择时均使用AI。\n\n**Shifting Work Patterns with Generative AI。** [实际采用页面](https://arxiv.org/html/2504.11436v4)。跨企业随机获得办公AI使用权，利用软件活动观察时间与任务。采用摘要、设计及观测限制。页面版本元信息与正文日期存在差异；不把软件活动直接解释成完整质量或利润。\n\n**METR开发任务研究，早期2025。** [原始论文](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)及[2026方法更新](https://metr.org/blog/2026-02-24-uplift-update/)。用于主观感受、总任务时间、选择与并行测量。旧工具和特定开发者结果不作当前AI编程通用结论。\n\n**Caro与Gallien，2010，Zara分配。** [作者机构原文](https://web.mit.edu/people/jgallien/ZaraOR2010.pdf)。本轮重读现场流程、试点设计和结果段落：关键尺码、展示、分配与激励相互作用；10款试点与匹配商品的比较支持作者估计的销售改善约3%—4%。它是运筹与数字化案例，不是生成式AI/FDE项目；全年财务影响包含推算，本课不把它写成实测AI收益，也未复算原始数据。\n\n## 理解模型与工程条件\n\n**CRFM基础模型报告，2021/2022版本。** [原始摘要](https://arxiv.org/abs/2108.07258v3)。用于广泛训练、下游适配与共同依赖；未全文采用长报告，也不证明每项任务经济可行。\n\n**Anthropic，Building effective agents，2024。** [原文](https://www.anthropic.com/research/building-effective-agents)。用于固定工作流、动态工具选择与复杂度取舍。属于工程经验，不是长期经营实验。\n\n**Anthropic，上下文工程，2025。** [原文](https://www.anthropic.com/research/effective-context-engineering-for-ai-agents)。用于当前信息、持久记录与调用。记忆工程不能保证业务经验正确。\n\n**Sculley等，2015，Hidden Technical Debt in Machine Learning Systems。** [原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)。采用摘要、反馈循环与系统依赖讨论。早期ML经验不能直接量化当前Agent成本。\n\n**Snell等，2024，测试时计算配置。** [原始预印本摘要](https://arxiv.org/abs/2408.03314)。用于资源、策略与任务难度关系；没有把数学实验倍数转成企业投资回报。\n\n## 理解人员、长期合作与经营机制\n\n**Holmström与Milgrom，1991，多任务激励。** [作者存档](https://web.stanford.edu/~milgrom/publishedarticles/Multitask%20Principal%20Agent.pdf)。采用可核引言片段，扫描全文读取受限。解释评价怎样改变注意力，不给出统一奖金规则。\n\n**Baker、Gibbons、Murphy，2002，关系合作。** [原始论文](https://faculty.washington.edu/mfan/is582/articles/Baker2002.pdf)。采用摘要与开篇关于重复合作、难以事前完整约定的结果。它不证明长期外部合同必然更优。\n\n**Palantir FDSE岗位。** [官方说明](https://jobs.lever.co/palantir/84131e3f-455e-47fc-9c11-898d95f09048)。用于模糊问题、原型、代码、集成和反馈等实际职责。属于机构自述，不是统一行业定义。\n\n**AWS FDE共建安排。** [官方材料](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)。用于生产共建与客户接续目标；机构主张不等于独立效果证明。\n\n**Little，1961，排队公式。** [原始摘要](https://pubsonline.informs.org/doi/abs/10.1287/opre.9.3.383)。仅读取摘要与成立条件。课程持续超负荷算例使用数量守恒，不套平稳平均等待公式。\n\n**Teece，2010，商业模式、战略与创新。** [原始出版页](https://www.sciencedirect.com/science/article/pii/S002463010900051X)。直接入口受限，采用出版页检索返回的摘要、引言与部分段落。用于价值创造、交付与获取，不证明当前AI新产品需求。\n\n**Teece，1988，技术创新的价值获取。** [原始出版摘要](https://pubsonline.informs.org/doi/abs/10.1287/inte.18.3.46)。本轮读取摘要，采用制造、分销等互补能力影响创新收益归属的关系；没有采用全文案例，也不由旧产业研究预测某家AI企业的利润。\n\n## 怎样把研究带回决定\n\n先看研究处理何种工作、比较什么、观察什么，再判断它与自己的场景哪些相同、哪些不同。一个平均效果不应抹掉经验与阶段差异，一项反向结果也不应冻结后续技术判断。\n\n课程中关于长期FDE、能力留存与竞争节奏的立场，是在这些依据上作出的机制推导，仍需要真实企业持续观察。可以据此主动建设，同时保留被证据改变的空间。\n","exportSingleMd":"# 研究与延伸阅读\n\n课程把理论、实际研究、工程经验和机构自述用于不同问题。它们共同支持机制推导，不构成一个适用于所有企业的提效数字。教学案例与业务算例全部是独立设定。\n\n## 理解知识、能力与持续发展\n\n**Nonaka 教学案例与业务算例全部是独立设定。\n\n## 理解知识、能力与持续发展\n\n**Nonaka，1994，组织知识创造。** 原始论文的大学存档。用于理解实践、表达、个人与组织之间的知识发展。本课主要采用可核原文片段；扫描件读取受限。它不证明所有隐性技能都能被语言或AI完整提取。\n\n**Cohen与Levinthal，1990，吸收能力。** 原始论文。采用摘要、引言与相关知识讨论，解释企业为何需要自己的认识与组织条件。它不是AI或FDE长期效果研究。\n\n**Teece，2007，动态能力。** 机构原文。采用引言与框架段落，理解能力如何持续适应与重组。框架不能替企业判断具体优势，也不估计生存率。\n\n**March，1991，探索与利用。** 原始论文。采用摘要与开篇机制，讨论资源竞争与回报节奏。没有导出固定预算比例。\n\n**Brynjolfsson、Rock、Syverson，生产率J曲线。** NBER研究记录，期刊版2021。用于互补投入与测量关系；宏观J曲线不是单项目现金回本承诺。\n\n## 比较真实工作中的AI作用\n\n**Generative AI at Work，2025期刊版。** 作者提供的原文。企业软件客服的分批上线研究，员工可以采用、修改或忽略建议。用于讨论经验差异、传播与学习，不推成全行业利润。本课重读摘要、引言与上线安排，并核对2025版本5172名客服、每小时解决量平均提高15%的定义；这是分批上线的单企业研究，不能当成本课其他行业的提升率。\n\n**The Cybernetic Teammate，2026期刊版。** 期刊原文。采用宝洁创新实验的设计与阶段结果，分清生成、组内选择与最终质量。最终方案改善不代表商业实施成功；不能据组内选择结果推断AI一般不擅判断，也未确认参与者在选择时均使用AI。\n\n**Shifting Work Patterns with Generative AI。** 实际采用页面。跨企业随机获得办公AI使用权，利用软件活动观察时间与任务。采用摘要、设计及观测限制。页面版本元信息与正文日期存在差异；不把软件活动直接解释成完整质量或利润。\n\n**METR开发任务研究，早期2025。** 原始论文及2026方法更新。用于主观感受、总任务时间、选择与并行测量。旧工具和特定开发者结果不作当前AI编程通用结论。\n\n**Caro与Gallien，2010，Zara分配。** 作者机构原文。本轮重读现场流程、试点设计和结果段落：关键尺码、展示、分配与激励相互作用；10款试点与匹配商品的比较支持作者估计的销售改善约3%—4%。它是运筹与数字化案例，不是生成式AI/FDE项目；全年财务影响包含推算，本课不把它写成实测AI收益，也未复算原始数据。\n\n## 理解模型与工程条件\n\n**CRFM基础模型报告，2021/2022版本。** 原始摘要。用于广泛训练、下游适配与共同依赖；未全文采用长报告，也不证明每项任务经济可行。\n\n**Anthropic，Building effective agents，2024。** 原文。用于固定工作流、动态工具选择与复杂度取舍。属于工程经验，不是长期经营实验。\n\n**Anthropic，上下文工程，2025。** 原文。用于当前信息、持久记录与调用。记忆工程不能保证业务经验正确。\n\n**Sculley等，2015，Hidden Technical Debt in Machine Learning Systems。** 原始论文。采用摘要、反馈循环与系统依赖讨论。早期ML经验不能直接量化当前Agent成本。\n\n**Snell等，2024，测试时计算配置。** 原始预印本摘要。用于资源、策略与任务难度关系；没有把数学实验倍数转成企业投资回报。\n\n## 理解人员、长期合作与经营机制\n\n**Holmström与Milgrom，1991，多任务激励。** 作者存档。采用可核引言片段，扫描全文读取受限。解释评价怎样改变注意力，不给出统一奖金规则。\n\n**Baker、Gibbons、Murphy，2002，关系合作。** 原始论文。采用摘要与开篇关于重复合作、难以事前完整约定的结果。它不证明长期外部合同必然更优。\n\n**Palantir FDSE岗位。** 官方说明。用于模糊问题、原型、代码、集成和反馈等实际职责。属于机构自述，不是统一行业定义。\n\n**AWS FDE共建安排。** 官方材料。用于生产共建与客户接续目标；机构主张不等于独立效果证明。\n\n**Little，1961，排队公式。** 原始摘要。仅读取摘要与成立条件。课程持续超负荷算例使用数量守恒，不套平稳平均等待公式。\n\n**Teece，2010，商业模式、战略与创新。** 原始出版页。直接入口受限，采用出版页检索返回的摘要、引言与部分段落。用于价值创造、交付与获取，不证明当前AI新产品需求。\n\n**Teece，1988，技术创新的价值获取。** 原始出版摘要。本轮读取摘要，采用制造、分销等互补能力影响创新收益归属的关系；没有采用全文案例，也不由旧产业研究预测某家AI企业的利润。\n\n## 怎样把研究带回决定\n\n先看研究处理何种工作、比较什么、观察什么，再判断它与自己的场景哪些相同、哪些不同。一个平均效果不应抹掉经验与阶段差异，一项反向结果也不应冻结后续技术判断。\n\n课程中关于长期FDE、能力留存与竞争节奏的立场，是在这些依据上作出的机制推导，仍需要真实企业持续观察。可以据此主动建设，同时保留被证据改变的空间。\n"},{"file":"工作簿-改造提案.md","id":"workbook","number":null,"role":"工作簿","part":-1,"title":"工作簿｜把一条业务写成可以讨论和决定的改造提案","md":"# 工作簿｜把一条业务写成可以讨论和决定的改造提案\n\n可以复制或下载后编辑，也可以先用四组教学案例练习。不必填满所有格子；要让不在前几次会议里的人，也能理解这项投入为什么值得。\n\n## 先写完整背景，再给项目起名\n\n说清客户在什么处境下需要什么，原工作怎样完成，当前事实与矛盾在哪里。避免只写“效率低、知识没沉淀”。\n\n连锁案例可以这样开头：“X店18点卖完80份主打点心，晚间仍有人问；Y配80售60。两店可用生产窗口320份，目前只排160，原路线上午一次，售罄后停止该商品推介与持续预订。我们需要核对受限销量、供给和销售动作是否共同压住有效需求。”\n\n这段背景给出了角色、事实与相互关系，也保留了尚需检验的解释。自己的材料应有可追溯出处，不把故事细节补成事实。\n\n| 要交代的背景 | 自己的材料 |\n|---|---|\n| 客户或使用者、所需结果 | 待填写 |\n| 原工作与相关人员、系统 | 待填写 |\n| 关键观察、时间与出处 | 待填写 |\n| 想解释的差别与其他可能原因 | 待填写 |\n\n## 把几种可实施选择放在同一口径下\n\n至少保留一个合理的普通改进或现成方案，再提出AI参与的安排。说明各自改变什么，依赖哪些条件，而非让新方案只与最差旧流程比较。\n\n| 选择 | 机制与实际动作 | 条件、成本与未知 |\n|---|---|---|\n| 原工作或改进人工/SOP | 待填写 | 待填写 |\n| 成熟软件或较简单方法 | 待填写 | 待填写 |\n| AI与工程共同改造 | 待填写 | 待填写 |\n\n在A中，改100/60与扩160/60是不同选择；在B中，准确技术草稿和真实订单是不同阶段；在C中，必要分阶段服务与可避免复访要分开；在D中，更多初稿和更多付费交付不等价。\n\n## 沿一笔工作写出改变如何发生\n\n从自然输入出发，写谁取得什么、怎样比较、谁采用、怎样执行、结果返回哪里，以及哪部分会帮助下一次。重要未知要有名字。\n\n例如工业品询价：客户原件与三天期限进入同一任务，AI比较工况、候选和当前供应，工程与采购确认，正式报价留版本，客户选择和交付再回到下一轮。不能把“生成了报价”直接写成“增加了订单”。\n\n| 关键连接 | 对象、动作与承担者 |\n|---|---|\n| 当前目标、事实与相关经验 | 待填写 |\n| AI、人和现有系统的分工 | 待填写 |\n| 正式决定与实际动作 | 待填写 |\n| 客户结果、未采用与反例 | 待填写 |\n| 下一次可使用的方法与入口 | 待填写 |\n\n## 写一张收益账，也写出它的成立条件\n\n使用相同需求、任务、质量与时期。收入、变动成本、新支出、工时与一次建设分别列，未来能力说明用途，不任意标价补回本。\n\n| 项目 | 当前依据 | 如何进入比较 |\n|---|---|---|\n| 需求、销量或付费交付 | 待填写 | 待填写 |\n| 价格、单均贡献及履约成本 | 待填写 | 待填写 |\n| 模型、工具与持续共建 | 待填写 | 待填写 |\n| 核验、返工与瓶颈容量 | 待填写 | 待填写 |\n| 实际可取消支出 | 待填写 | 待填写 |\n| 一次性建设和维护 | 待填写 | 待填写 |\n| 留下的能力与再用检验 | 待填写 | 待填写 |\n\n固定工资下释放时间，先是容量；实际取消外协或新增付费交付后，再说明现金路径。同一小时或同一费用不重复计算，局部模型比较也不要再加到已包含它的项目账。\n\n## 让试点围绕一项会改变选择的未知\n\n在A里，扩大方案相对已改分配多240元生产成本和80元日支出，需要新增销售至少27份。试点可以围绕新增有效需求、品质、补货与推介共同取得证据，而非泛问“AI能否促进增长”。\n\n分别设计三层观察：任务有没有用对事实，实际业务相对替代是否改善，后续人员或新场景能否用对积累。共享库存、同期活动、人员和价格变化应进入比较条件。\n\n| 观察与比较 | 取得什么证据 | 哪种结果使采用范围改变 |\n|---|---|---|\n| 任务合格 | 待填写 | 待填写 |\n| 业务效果 | 待填写 | 待填写 |\n| 接任或迁移 | 待填写 | 待填写 |\n\n## 给持续工作安排真实资源\n\n业务负责人承担价值和取舍，专业人员判断方法，FDE实现与改进，内部成员接住资料、运行和评价。岗位激励、时间与决定权也写进安排。\n\n内容专家每天2小时，若按20分钟核6篇，就不能又拿其中40分钟做验证而仍承诺6篇。阶段交付、探索和维护应放在共同容量下选择。\n\n写明本轮可投入范围、实际承担者与复查时点，以及继续、改法和停止的条件。未知预算和负责人是开工前要确定的事项，不能用模板替真实企业决定。\n\n## 变一个条件，检查自己是否会判断\n\n仍用A，售价12元、额外生产60份成本240元不变，新增日常支出从80变120元。扩产相对100/60，要多卖多少份才更好？正常日需求X160/Y60时，扩产的贡献又是多少？\n\n先写计算与选择，再看参考：新增投入240＋120=360元，卖30份恰好覆盖，至少31份才更好；正常日扩产贡献2640−880−120=1640元，比只改分配1280元多360元。原来的“至少27份”不能直接沿用。\n\n再用B思考：订单增至250但单均贡献降到400，为什么仍可能比原来差？参考是250×400与200×500相等，新费用11000元还没有被覆盖。\n\n## 把表格重新连成一段提案\n\n最后应能用连续文字说明：为什么选这个客户结果，问题如何发生，什么改变会起作用，为什么优于替代，怎样证明、谁承担、下一步怎样调整。表格帮助核对，完整论证让人作决定。\n\n对应完整条件：[案例A](案例A-连锁备货.md)、[案例B](案例B-智能资源成本.md)、[案例C](案例C-设备售后.md)、[案例D](案例D-专业服务.md)；综合示范见[第40章](40-完整改造提案.md)。\n","html":"\u003ch1>工作簿｜把一条业务写成可以讨论和决定的改造提案\u003c/h1>\n\u003cp>可以复制或下载后编辑，也可以先用四组教学案例练习。不必填满所有格子；要让不在前几次会议里的人，也能理解这项投入为什么值得。\u003c/p>\n\u003ch2 id=\"workbook-section-1\">先写完整背景，再给项目起名\u003c/h2>\n\u003cp>说清客户在什么处境下需要什么，原工作怎样完成，当前事实与矛盾在哪里。避免只写“效率低、知识没沉淀”。\u003c/p>\n\u003cp>连锁案例可以这样开头：“X店18点卖完80份主打点心，晚间仍有人问；Y配80售60。两店可用生产窗口320份，目前只排160，原路线上午一次，售罄后停止该商品推介与持续预订。我们需要核对受限销量、供给和销售动作是否共同压住有效需求。”\u003c/p>\n\u003cp>这段背景给出了角色、事实与相互关系，也保留了尚需检验的解释。自己的材料应有可追溯出处，不把故事细节补成事实。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>要交代的背景\u003c/th>\n\u003cth>自己的材料\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>客户或使用者、所需结果\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>原工作与相关人员、系统\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>关键观察、时间与出处\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>想解释的差别与其他可能原因\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"workbook-section-2\">把几种可实施选择放在同一口径下\u003c/h2>\n\u003cp>至少保留一个合理的普通改进或现成方案，再提出AI参与的安排。说明各自改变什么，依赖哪些条件，而非让新方案只与最差旧流程比较。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>选择\u003c/th>\n\u003cth>机制与实际动作\u003c/th>\n\u003cth>条件、成本与未知\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>原工作或改进人工/SOP\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>成熟软件或较简单方法\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AI与工程共同改造\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>在A中，改100/60与扩160/60是不同选择；在B中，准确技术草稿和真实订单是不同阶段；在C中，必要分阶段服务与可避免复访要分开；在D中，更多初稿和更多付费交付不等价。\u003c/p>\n\u003ch2 id=\"workbook-section-3\">沿一笔工作写出改变如何发生\u003c/h2>\n\u003cp>从自然输入出发，写谁取得什么、怎样比较、谁采用、怎样执行、结果返回哪里，以及哪部分会帮助下一次。重要未知要有名字。\u003c/p>\n\u003cp>例如工业品询价：客户原件与三天期限进入同一任务，AI比较工况、候选和当前供应，工程与采购确认，正式报价留版本，客户选择和交付再回到下一轮。不能把“生成了报价”直接写成“增加了订单”。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>关键连接\u003c/th>\n\u003cth>对象、动作与承担者\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>当前目标、事实与相关经验\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AI、人和现有系统的分工\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>正式决定与实际动作\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>客户结果、未采用与反例\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>下一次可使用的方法与入口\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"workbook-section-4\">写一张收益账，也写出它的成立条件\u003c/h2>\n\u003cp>使用相同需求、任务、质量与时期。收入、变动成本、新支出、工时与一次建设分别列，未来能力说明用途，不任意标价补回本。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项目\u003c/th>\n\u003cth>当前依据\u003c/th>\n\u003cth>如何进入比较\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>需求、销量或付费交付\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>价格、单均贡献及履约成本\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型、工具与持续共建\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>核验、返工与瓶颈容量\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>实际可取消支出\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>一次性建设和维护\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>留下的能力与再用检验\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>固定工资下释放时间，先是容量；实际取消外协或新增付费交付后，再说明现金路径。同一小时或同一费用不重复计算，局部模型比较也不要再加到已包含它的项目账。\u003c/p>\n\u003ch2 id=\"workbook-section-5\">让试点围绕一项会改变选择的未知\u003c/h2>\n\u003cp>在A里，扩大方案相对已改分配多240元生产成本和80元日支出，需要新增销售至少27份。试点可以围绕新增有效需求、品质、补货与推介共同取得证据，而非泛问“AI能否促进增长”。\u003c/p>\n\u003cp>分别设计三层观察：任务有没有用对事实，实际业务相对替代是否改善，后续人员或新场景能否用对积累。共享库存、同期活动、人员和价格变化应进入比较条件。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>观察与比较\u003c/th>\n\u003cth>取得什么证据\u003c/th>\n\u003cth>哪种结果使采用范围改变\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>任务合格\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>业务效果\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接任或迁移\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"workbook-section-6\">给持续工作安排真实资源\u003c/h2>\n\u003cp>业务负责人承担价值和取舍，专业人员判断方法，FDE实现与改进，内部成员接住资料、运行和评价。岗位激励、时间与决定权也写进安排。\u003c/p>\n\u003cp>内容专家每天2小时，若按20分钟核6篇，就不能又拿其中40分钟做验证而仍承诺6篇。阶段交付、探索和维护应放在共同容量下选择。\u003c/p>\n\u003cp>写明本轮可投入范围、实际承担者与复查时点，以及继续、改法和停止的条件。未知预算和负责人是开工前要确定的事项，不能用模板替真实企业决定。\u003c/p>\n\u003ch2 id=\"workbook-section-7\">变一个条件，检查自己是否会判断\u003c/h2>\n\u003cp>仍用A，售价12元、额外生产60份成本240元不变，新增日常支出从80变120元。扩产相对100/60，要多卖多少份才更好？正常日需求X160/Y60时，扩产的贡献又是多少？\u003c/p>\n\u003cp>先写计算与选择，再看参考：新增投入240＋120=360元，卖30份恰好覆盖，至少31份才更好；正常日扩产贡献2640−880−120=1640元，比只改分配1280元多360元。原来的“至少27份”不能直接沿用。\u003c/p>\n\u003cp>再用B思考：订单增至250但单均贡献降到400，为什么仍可能比原来差？参考是250×400与200×500相等，新费用11000元还没有被覆盖。\u003c/p>\n\u003ch2 id=\"workbook-section-8\">把表格重新连成一段提案\u003c/h2>\n\u003cp>最后应能用连续文字说明：为什么选这个客户结果，问题如何发生，什么改变会起作用，为什么优于替代，怎样证明、谁承担、下一步怎样调整。表格帮助核对，完整论证让人作决定。\u003c/p>\n\u003cp>对应完整条件：\u003ca href=\"#case-a\">案例A\u003c/a>、\u003ca href=\"#case-b\">案例B\u003c/a>、\u003ca href=\"#case-c\">案例C\u003c/a>、\u003ca href=\"#case-d\">案例D\u003c/a>；综合示范见\u003ca href=\"#lesson-40\">第40章\u003c/a>。\u003c/p>\n","headings":[{"id":"workbook-section-1","label":"先写完整背景，再给项目起名"},{"id":"workbook-section-2","label":"把几种可实施选择放在同一口径下"},{"id":"workbook-section-3","label":"沿一笔工作写出改变如何发生"},{"id":"workbook-section-4","label":"写一张收益账，也写出它的成立条件"},{"id":"workbook-section-5","label":"让试点围绕一项会改变选择的未知"},{"id":"workbook-section-6","label":"给持续工作安排真实资源"},{"id":"workbook-section-7","label":"变一个条件，检查自己是否会判断"},{"id":"workbook-section-8","label":"把表格重新连成一段提案"}],"exportMd":"# 工作簿｜把一条业务写成可以讨论和决定的改造提案\n\n可以复制或下载后编辑，也可以先用四组教学案例练习。不必填满所有格子；要让不在前几次会议里的人，也能理解这项投入为什么值得。\n\n## 先写完整背景，再给项目起名\n\n说清客户在什么处境下需要什么，原工作怎样完成，当前事实与矛盾在哪里。避免只写“效率低、知识没沉淀”。\n\n连锁案例可以这样开头：“X店18点卖完80份主打点心，晚间仍有人问；Y配80售60。两店可用生产窗口320份，目前只排160，原路线上午一次，售罄后停止该商品推介与持续预订。我们需要核对受限销量、供给和销售动作是否共同压住有效需求。”\n\n这段背景给出了角色、事实与相互关系，也保留了尚需检验的解释。自己的材料应有可追溯出处，不把故事细节补成事实。\n\n| 要交代的背景 | 自己的材料 |\n|---|---|\n| 客户或使用者、所需结果 | 待填写 |\n| 原工作与相关人员、系统 | 待填写 |\n| 关键观察、时间与出处 | 待填写 |\n| 想解释的差别与其他可能原因 | 待填写 |\n\n## 把几种可实施选择放在同一口径下\n\n至少保留一个合理的普通改进或现成方案，再提出AI参与的安排。说明各自改变什么，依赖哪些条件，而非让新方案只与最差旧流程比较。\n\n| 选择 | 机制与实际动作 | 条件、成本与未知 |\n|---|---|---|\n| 原工作或改进人工/SOP | 待填写 | 待填写 |\n| 成熟软件或较简单方法 | 待填写 | 待填写 |\n| AI与工程共同改造 | 待填写 | 待填写 |\n\n在A中，改100/60与扩160/60是不同选择；在B中，准确技术草稿和真实订单是不同阶段；在C中，必要分阶段服务与可避免复访要分开；在D中，更多初稿和更多付费交付不等价。\n\n## 沿一笔工作写出改变如何发生\n\n从自然输入出发，写谁取得什么、怎样比较、谁采用、怎样执行、结果返回哪里，以及哪部分会帮助下一次。重要未知要有名字。\n\n例如工业品询价：客户原件与三天期限进入同一任务，AI比较工况、候选和当前供应，工程与采购确认，正式报价留版本，客户选择和交付再回到下一轮。不能把“生成了报价”直接写成“增加了订单”。\n\n| 关键连接 | 对象、动作与承担者 |\n|---|---|\n| 当前目标、事实与相关经验 | 待填写 |\n| AI、人和现有系统的分工 | 待填写 |\n| 正式决定与实际动作 | 待填写 |\n| 客户结果、未采用与反例 | 待填写 |\n| 下一次可使用的方法与入口 | 待填写 |\n\n## 写一张收益账，也写出它的成立条件\n\n使用相同需求、任务、质量与时期。收入、变动成本、新支出、工时与一次建设分别列，未来能力说明用途，不任意标价补回本。\n\n| 项目 | 当前依据 | 如何进入比较 |\n|---|---|---|\n| 需求、销量或付费交付 | 待填写 | 待填写 |\n| 价格、单均贡献及履约成本 | 待填写 | 待填写 |\n| 模型、工具与持续共建 | 待填写 | 待填写 |\n| 核验、返工与瓶颈容量 | 待填写 | 待填写 |\n| 实际可取消支出 | 待填写 | 待填写 |\n| 一次性建设和维护 | 待填写 | 待填写 |\n| 留下的能力与再用检验 | 待填写 | 待填写 |\n\n固定工资下释放时间，先是容量；实际取消外协或新增付费交付后，再说明现金路径。同一小时或同一费用不重复计算，局部模型比较也不要再加到已包含它的项目账。\n\n## 让试点围绕一项会改变选择的未知\n\n在A里，扩大方案相对已改分配多240元生产成本和80元日支出，需要新增销售至少27份。试点可以围绕新增有效需求、品质、补货与推介共同取得证据，而非泛问“AI能否促进增长”。\n\n分别设计三层观察：任务有没有用对事实，实际业务相对替代是否改善，后续人员或新场景能否用对积累。共享库存、同期活动、人员和价格变化应进入比较条件。\n\n| 观察与比较 | 取得什么证据 | 哪种结果使采用范围改变 |\n|---|---|---|\n| 任务合格 | 待填写 | 待填写 |\n| 业务效果 | 待填写 | 待填写 |\n| 接任或迁移 | 待填写 | 待填写 |\n\n## 给持续工作安排真实资源\n\n业务负责人承担价值和取舍，专业人员判断方法，FDE实现与改进，内部成员接住资料、运行和评价。岗位激励、时间与决定权也写进安排。\n\n内容专家每天2小时，若按20分钟核6篇，就不能又拿其中40分钟做验证而仍承诺6篇。阶段交付、探索和维护应放在共同容量下选择。\n\n写明本轮可投入范围、实际承担者与复查时点，以及继续、改法和停止的条件。未知预算和负责人是开工前要确定的事项，不能用模板替真实企业决定。\n\n## 变一个条件，检查自己是否会判断\n\n仍用A，售价12元、额外生产60份成本240元不变，新增日常支出从80变120元。扩产相对100/60，要多卖多少份才更好？正常日需求X160/Y60时，扩产的贡献又是多少？\n\n先写计算与选择，再看参考：新增投入240＋120=360元，卖30份恰好覆盖，至少31份才更好；正常日扩产贡献2640−880−120=1640元，比只改分配1280元多360元。原来的“至少27份”不能直接沿用。\n\n再用B思考：订单增至250但单均贡献降到400，为什么仍可能比原来差？参考是250×400与200×500相等，新费用11000元还没有被覆盖。\n\n## 把表格重新连成一段提案\n\n最后应能用连续文字说明：为什么选这个客户结果，问题如何发生，什么改变会起作用，为什么优于替代，怎样证明、谁承担、下一步怎样调整。表格帮助核对，完整论证让人作决定。\n\n对应完整条件：[案例A](#case-a)、[案例B](#case-b)、[案例C](#case-c)、[案例D](#case-d)；综合示范见[第40章](#lesson-40)。\n","exportSingleMd":"# 工作簿｜把一条业务写成可以讨论和决定的改造提案\n\n可以复制或下载后编辑，也可以先用四组教学案例练习。不必填满所有格子；要让不在前几次会议里的人，也能理解这项投入为什么值得。\n\n## 先写完整背景，再给项目起名\ const {pages,parts}=COURSE;
const pageMap=Object.fromEntries(pages.map(p=>[p.id,p]));
const storeKey='gaidn-fde-course-40-20261025';
let active='home',restorePosition=false,scrollTimer=null;
const main=document.getElementById('main'),sidebar=document.getElementById('sidebar'),overlay=document.getElementById('overlay');
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function readState(){try{const d=JSON.parse(localStorage.getItem(storeKey));return d&&pageMap[d.id]?d:null}catch{return null}}
function saveState(){if(!pageMap[active])return;try{localStorage.setItem(storeKey,JSON.stringify({id:active,y:Math.max(0,window.scrollY),at:Date.now()}))}catch{}}
function menu(open){const wasOpen=sidebar.classList.contains('open');sidebar.classList.toggle('open',open);overlay.classList.toggle('open',open);document.getElementById('menu-toggle').setAttribute('aria-expanded',String(open));if(open)sidebar.querySelector('input').focus();else if(wasOpen)document.getElementById('menu-toggle').focus()}
document.getElementById('menu-toggle').onclick=()=>menu(!sidebar.classList.contains('open'));
document.getElementById('menu-close').onclick=()=>menu(false);overlay.onclick=()=>menu(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape')menu(false)});
function renderCatalog(){document.getElementById('catalog').innerHTML=`<a href="#home">课程首页</a><a href="#intro">导学 · 从这里开始</a><h2>八部分 · 40章</h2>`+parts.map((p,i)=>`<details data-part="${i}" ${i===0?'open':''}><summary>${['一','二','三','四','五','六','七','八'][i]} · ${p.title}</summary>${pages.filter(x=>x.part===i).map(x=>`<a href="#${x.id}">${esc(x.title.replace(/^第\d+章｜/,''))}</a>`).join('')}</details>`).join('')+`<h2>案例、工作与回查</h2>`+['case-a','case-b','case-c','case-d','workbook','glossary','reading'].map(id=>`<a href="#${id}">${esc(pageMap[id].title)}</a>`).join('');}
renderCatalog();
