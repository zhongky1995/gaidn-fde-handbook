</style></head><body><header class="bar"><a class="brand" href="#c00">GAIDN / FDE</a><span class="bar-title">企业级 FDE 手册</span><button id="menu" aria-expanded="false" aria-controls="toc">目录</button><button id="search-open">搜索</button><button id="print">打印全书</button></header><div class="layout"><aside class="toc" id="toc"><details id="chapters"><summary>全书目录</summary><nav id="toc-list" aria-label="全书目录"></nav></details></aside><main class="reading"><p class="kicker" id="kicker">组织 AI 化 · 经营与管理实践</p><article id="article"></article><div class="home-actions" id="home-actions"></div><nav class="page-nav" id="page-nav" aria-label="章节导航"></nav><footer class="book-foot">GAIDN · 企业级 FDE 手册</footer></main></div><dialog class="search-box" id="search-dialog"><div class="search-head"><strong>全书搜索</strong><button id="search-close" aria-label="关闭搜索">×</button></div><input type="search" id="search-input" placeholder="搜索问题、概念或工作表" aria-label="搜索全书"><div class="results" id="results" aria-live="polite"></div></dialog><dialog class="figure-dialog" id="figure-dialog"><div class="search-head"><strong>配图详情</strong><button id="figure-close" aria-label="关闭配图">×</button></div><div class="figure-view"><img id="figure-large" alt=""></div></dialog><div class="print-all" id="print-all"></div><script>const pages=[{"id":"c00","file":"00-导读.md","title":"企业级 FDE 手册","html":"\u003ch1>企业级 FDE 手册\u003c/h1>\n\u003ch2>从 FDE 视角看企业 AI 化转型\u003c/h2>\n\u003cp>创业者和管理者需要回答的 AI 问题，正在从“这个工具有什么用”变成“我的企业应该怎样工作”。阅读材料、分析问题、制作内容、编写软件，越来越多原本依靠人逐件完成的工作，可以由人和 AI 共同承担。随之而来的选择涉及产品、服务、岗位、管理方式和投入方向。\u003c/p>\n\u003cp>如果你只听说过 AI，可以先从一次使用认识它：在聊天窗口输入“把这条客户消息整理成待办”，软件把要求和消息交给模型，模型生成整理结果，再显示在窗口里。本书主要讨论这种能够处理文字、图片等材料并生成结果的 AI。\u003c/p>\n\u003cp>其中，\u003cstrong>模型\u003c/strong>是执行理解、推理和生成的计算系统；\u003cstrong>应用\u003c/strong>是你实际使用的软件，它提供界面、准备资料，并决定结果怎样保存或使用。交给模型的任务要求通常叫\u003cstrong>提示词\u003c/strong>；让应用查订单、计算或保存记录的程序功能，称为\u003cstrong>工具\u003c/strong>。一次使用可以只生成文字，也可以在连接相应工具后继续处理业务。第3章会解释模型怎样获得这些能力。\u003c/p>\n\u003cp>\u003cstrong>本书的主张是：企业 AI 化，应从重新设计一类工作的完成方式入手，把有效的改进逐步积累为组织能力。\u003c/strong> 企业熟悉自己的客户与业务，AI 提供新的信息处理和执行能力，FDE 则把二者接到实际工作里。三者结合，才有机会改变企业能够提供什么、以多大成本提供，以及怎样持续做好。\u003c/p>\n\u003cp>FDE 是 Forward Deployed Engineer 的缩写，常译为前线部署工程师。它强调深入业务现场，参与问题定义，亲手实现方案，再根据使用反馈修改。从经营和管理的角度来看，这种工作方式尤其值得借鉴：许多改造方向需要在实际使用中逐步弄清，业务判断和工程实现必须能够及时相互修正。\u003c/p>\n\u003cp>本书面向懂经营、尚不熟悉 AI 的创业者和管理者，也适合经营一人公司（OPC）的创业者。你可以带着一项熟悉的工作阅读：它为什么费时，依赖谁的经验，信息从哪里来，最后怎样给客户或同事带来价值。概念会沿这些问题展开，技术解释服务于经营判断。团队中的分工，在 OPC 中可能由你一人承担：确定目标、运用专业判断、组织 AI 完成工作，再检查交付结果。\u003c/p>\n\u003ch3>全书沿一条线展开\u003c/h3>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>阅读部分\u003c/th>\n\u003cth>要弄清的事\u003c/th>\n\u003cth>与下一部分的关系\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第1—2章：企业价值与FDE\u003c/td>\n\u003ctd>AI为什么会改变企业的工作方式，谁来推动\u003c/td>\n\u003ctd>确定观察能力的经营视角\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第3—10章：AI的工作能力\u003c/td>\n\u003ctd>模型怎样工作，语言、推理、研究、感知、分析、创作和编程分别能做什么\u003c/td>\n\u003ctd>看见具体可改的动作与新的服务机会\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第11—17章：企业AI系统\u003c/td>\n\u003ctd>怎样给AI提供知识、方法和工具，让它完成持续的工作\u003c/td>\n\u003ctd>把一般能力组合成企业可用的能力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第18—23章：一轮业务改造\u003c/td>\n\u003ctd>怎样诊断、选择场景、安排分工、连接系统、检验和算账\u003c/td>\n\u003ctd>做出有依据的投入与采用决定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第24—28章：组织能力建设\u003c/td>\n\u003ctd>怎样调整岗位、维护运行、复用经验并发展新服务\u003c/td>\n\u003ctd>让一次改进帮助企业更好地开展下一次改进\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>其中，能力篇帮助你发现机会，系统篇帮助你理解实现条件，改造篇和组织篇帮助你推动工作。它们也可以按当前问题单独查阅。需要开项目会时，可直接取用工作文件；需要查一个词时，可从术语索引返回对应解释。\u003c/p>\n\u003ch3>读懂一项改造，要看四层关系\u003c/h3>\n\u003cp>可以先想一家餐厅怎样完成一份订单：客人说“和上次一样，少放辣”，服务员确认菜品并写成订单，厨房按订单制作，出餐后服务员核对桌号送到客人面前。原话、订单和出餐记录在不同环节发挥作用。企业里说的“信息流转”，也是把某件事的要求、判断或结果交给接下来要使用它的人或系统；“流程”则说明这些参与者先后做什么、遇到不同情况怎样继续。\u003c/p>\n\u003cp>放进 AI 应用后，模型可以帮助读懂客户原话、整理要求；应用负责提供相关资料、调用工具并保存结果；工作流程安排人员核对、决定和交接；经营结果体现为成本、速度、质量与服务能力的变化。后文会说明每一段具体怎样工作。\u003c/p>\n\u003cp>例如，模型能从客户消息中提取需求，应用把需求关联到正确客户，专业人员据此确定服务方案，销售再交给客户选择。企业得到的改善可能是少一次追问、更快出方案，也可能是能够为更多客户提供定制服务。后面各章会逐层解释这里发生了什么、怎样实现、怎样判断值得。\u003c/p>\n\u003cp>书中的业务片段用于说明工作方法，数字算例会标明假设。你可以把相同分析方式用于自己的业务，再用实际任务和成本作决定。\u003c/p>\n\u003cp>想先把全貌接起来，可读第1—3章，再读第15、18、24、27章。准备开始一轮改造时，从第18章进入，回查相应能力和系统章节。阅读位置会保存在本机，方便随时继续。\u003c/p>\n","text":"# 企业级 FDE 手册\n\n## 从 FDE 视角看企业 AI 化转型\n\n创业者和管理者需要回答的 AI 问题，正在从“这个工具有什么用”变成“我的企业应该怎样工作”。阅读材料、分析问题、制作内容、编写软件，越来越多原本依靠人逐件完成的工作，可以由人和 AI 共同承担。随之而来的选择涉及产品、服务、岗位、管理方式和投入方向。\n\n如果你只听说过 AI，可以先从一次使用认识它：在聊天窗口输入“把这条客户消息整理成待办”，软件把要求和消息交给模型，模型生成整理结果，再显示在窗口里。本书主要讨论这种能够处理文字、图片等材料并生成结果的 AI。\n\n其中，**模型**是执行理解、推理和生成的计算系统；**应用**是你实际使用的软件，它提供界面、准备资料，并决定结果怎样保存或使用。交给模型的任务要求通常叫**提示词**；让应用查订单、计算或保存记录的程序功能，称为**工具**。一次使用可以只生成文字，也可以在连接相应工具后继续处理业务。第3章会解释模型怎样获得这些能力。\n\n**本书的主张是：企业 AI 化，应从重新设计一类工作的完成方式入手，把有效的改进逐步积累为组织能力。** 企业熟悉自己的客户与业务，AI 提供新的信息处理和执行能力，FDE 则把二者接到实际工作里。三者结合，才有机会改变企业能够提供什么、以多大成本提供，以及怎样持续做好。\n\nFDE 是 Forward Deployed Engineer 的缩写，常译为前线部署工程师。它强调深入业务现场，参与问题定义，亲手实现方案，再根据使用反馈修改。从经营和管理的角度来看，这种工作方式尤其值得借鉴：许多改造方向需要在实际使用中逐步弄清，业务判断和工程实现必须能够及时相互修正。\n\n本书面向懂经营、尚不熟悉 AI 的创业者和管理者，也适合经营一人公司（OPC）的创业者。你可以带着一项熟悉的工作阅读：它为什么费时，依赖谁的经验，信息从哪里来，最后怎样给客户或同事带来价值。概念会沿这些问题展开，技术解释服务于经营判断。团队中的分工，在 OPC 中可能由你一人承担：确定目标、运用专业判断、组织 AI 完成工作，再检查交付结果。\n\n### 全书沿一条线展开\n\n| 阅读部分 | 要弄清的事 | 与下一部分的关系 |\n| --- | --- | --- |\n| 第1—2章：企业价值与FDE | AI为什么会改变企业的工作方式，谁来推动 | 确定观察能力的经营视角 |\n| 第3—10章：AI的工作能力 | 模型怎样工作，语言、推理、研究、感知、分析、创作和编程分别能做什么 | 看见具体可改的动作与新的服务机会 |\n| 第11—17章：企业AI系统 | 怎样给AI提供知识、方法和工具，让它完成持续的工作 | 把一般能力组合成企业可用的能力 |\n| 第18—23章：一轮业务改造 | 怎样诊断、选择场景、安排分工、连接系统、检验和算账 | 做出有依据的投入与采用决定 |\n| 第24—28章：组织能力建设 | 怎样调整岗位、维护运行、复用经验并发展新服务 | 让一次改进帮助企业更好地开展下一次改进 |\n\n其中，能力篇帮助你发现机会，系统篇帮助你理解实现条件，改造篇和组织篇帮助你推动工作。它们也可以按当前问题单独查阅。需要开项目会时，可直接取用工作文件；需要查一个词时，可从术语索引返回对应解释。\n\n### 读懂一项改造，要看四层关系\n\n可以先想一家餐厅怎样完成一份订单：客人说“和上次一样，少放辣”，服务员确认菜品并写成订单，厨房按订单制作，出餐后服务员核对桌号送到客人面前。原话、订单和出餐记录在不同环节发挥作用。企业里说的“信息流转”，也是把某件事的要求、判断或结果交给接下来要使用它的人或系统；“流程”则说明这些参与者先后做什么、遇到不同情况怎样继续。\n\n放进 AI 应用后，模型可以帮助读懂客户原话、整理要求；应用负责提供相关资料、调用工具并保存结果；工作流程安排人员核对、决定和交接；经营结果体现为成本、速度、质量与服务能力的变化。后文会说明每一段具体怎样工作。\n\n例如，模型能从客户消息中提取需求，应用把需求关联到正确客户，专业人员据此确定服务方案，销售再交给客户选择。企业得到的改善可能是少一次追问、更快出方案，也可能是能够为更多客户提供定制服务。后面各章会逐层解释这里发生了什么、怎样实现、怎样判断值得。\n\n书中的业务片段用于说明工作方法，数字算例会标明假设。你可以把相同分析方式用于自己的业务，再用实际任务和成本作决定。\n\n想先把全貌接起来，可读第1—3章，再读第15、18、24、27章。准备开始一轮改造时，从第18章进入，回查相应能力和系统章节。阅读位置会保存在本机，方便随时继续。\n"},{"id":"c01","file":"01-企业AI化改变的究竟是什么.md","title":"第1章｜企业 AI 化改变的究竟是什么","html":"\u003ch1>第1章｜企业 AI 化改变的究竟是什么\u003c/h1>\n\u003cp>\u003cstrong>AI 使更多依赖阅读、理解、判断和制作的工作，可以被组织成可重复使用的能力。企业 AI 化要抓住的机会，是由此重新安排一类工作，并扩大企业能为客户创造的价值。\u003c/strong>\u003c/p>\n\u003cp>客户发来一句要求，销售读懂后追问，专业人员调用经验，制作人员形成方案，管理者决定资源。许多企业的日常运营，都靠这类信息加工把各个岗位连接起来。它们影响了响应速度、服务质量，也决定企业能够同时服务多少客户。\u003c/p>\n\u003ch2>信息加工成本下降，会改变什么\u003c/h2>\n\u003cp>传统软件擅长处理预先定义好的填写项目和规则，例如订单上的产品、数量与金额。这些分开保存的项目通常叫“字段”。计算金额、管理库存、保存订单，都可以建立明确的操作。客户的原话、散乱的文件和模糊的需求，则通常先由员工解释，再录入系统。大量人力消耗在把现实情况翻译成软件能够处理的内容上。\u003c/p>\n\u003cp>模型让这段工作有了新做法。它可以阅读不同表达、提取条件、比较材料、起草方案，再把结果交给程序和人员继续处理。企业能够保留一套共同的方法，每次给它不同的客户材料，反复完成相似工作。第3—10章会解释这些能力怎样发挥作用。\u003c/p>\n\u003cp>这里有一个重要的成本变化：过去主要为每次人工处理付费，现在可以先投入资料、方法、连接和检查，再在多次任务中使用。对于高频、方法较稳定的工作，这种安排有机会降低每项任务的成本。若输入差异大、专业核对很重，则应把这些工作量一起计算。经济性取决于一项完整工作的资源消耗。\u003c/p>\n\u003cp>这也改变了服务覆盖。假设一家设备服务企业原来只为重点客户制作使用分析，因为每份都要查资料、整理记录、写说明。AI若能完成资料整理与初稿，专业人员便可以把时间用于判断异常和建议。企业由此可以试着服务更多客户，或提高分析频率。它获得的是一种新的供给选择：过去太贵而少做的工作，现在值得重新计算。\u003c/p>\n\u003ch2>把技术收益转成经营收益，需要接续的安排\u003c/h2>\n\u003cp>沿用这项服务设想，第一步是把客户记录变成可分析材料，第二步是识别值得关注的变化，第三步是专业人员形成建议，最后是客户据此安排维护。每一步都有自己的交出物和接手者。\u003c/p>\n\u003cp>AI整理出材料以后，专业人员要能直接找到关键记录和需要判断的问题。建议完成后，客户经理要知道何时交给客户、帮助客户作什么决定。客户的使用反馈又应回到下一次分析。这样，生成速度的变化才有机会传递为响应和服务质量的变化。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"01\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iMTAwMSIgdmlld0JveD0iMCAwIDM2MCAxMDAxIiByb2xlPSJpbWciPjx0aXRsZT7orr7lpIfmnI3liqHnmoTkuIDnp43mlLnpgKDmlrnlvI88L3RpdGxlPjxkZXNjPuacjeWKoeadkOaWmee7j0FJ5pW055CG5LiO5Li >包含复核、返工和维护的总投入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>速度\u003c/td>\n\u003ctd>工作更早到达可以使用的状态\u003c/td>\n\u003ctd>从收到任务到接手完成的周期\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>质量\u003c/td>\n\u003ctd>必要信息更完整，判断更一致，差错更早发现\u003c/td>\n\u003ctd>合格结果、退回原因和使用反馈\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>服务能力\u003c/td>\n\u003ctd>扩大覆盖、增加频次或提供过去做不起的服务\u003c/td>\n\u003ctd>客户使用、交付能力和服务经济性\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>四种价值需要不同的安排。想提高速度，要看等待和交接；想提高质量，要把专业标准带进处理过程；想扩大服务，要找到愿意使用结果的客户，并安排后续履约。管理者先确定这一轮最想改善什么，团队才知道应该优化哪里。\u003c/p>\n\u003cp>同一项改造也可能有取舍。更深入的分析需要更多检查，却能支撑更有价值的服务。更快形成大量候选方案，可能增加选择时间。判断取舍时，应回到客户或下一岗位究竟需要怎样的结果。\u003c/p>\n\u003ch2>企业自己的优势，怎样进入AI工作\u003c/h2>\n\u003cp>通用模型可以被多家企业采用。更能形成差异的，是企业掌握的客户需求、产品细节、行业经验，以及使用这些知识的判断方法。\u003c/p>\n\u003cp>一位经验丰富的工程师，可能知道哪几个条件会改变选型，哪些异常值得提前提醒。这些知识经常隐藏在追问、修改和取舍中。把它们整理成问题、规则、实例和检查方法，再接入真实资料，团队就有机会借助AI沿用这套方法。\u003c/p>\n\u003cp>把原来靠经验掌握的知识说明白以后，企业还能比较不同人的做法，发现原有规则的冲突，决定哪些值得统一。业务骨干参与这个过程，是为了把专业判断转成更多人可使用的方法。第13章和第26章会继续讲这种积累。\u003c/p>\n\u003ch2>从个人使用走向组织能力\u003c/h2>\n\u003cp>个人使用阶段，员工寻找适合自己的工具与做法；团队改造阶段，把有效方法接到共同任务上，重新安排交接；组织积累阶段，企业有能力维护资料、调整规则、培养人员，并把已形成的方法用于下一项工作。\u003c/p>\n\u003cp>这三种活动可以同时开展。个人探索提供新发现，具体项目检验哪些做法有效，共用资产让下一轮实施少走一段路。管理者应建立这样的往返关系，让日常使用中的经验有机会改变工作制度，也让制度为有价值的尝试提供时间和资源。\u003c/p>\n\u003cp>因此，企业 AI 化的起点可以很小，目标却应看得更远：先改善一类工作，再学会持续改造自己的工作。FDE的价值，正是在现场把这种学习推进为可以使用的结果。\u003c/p>\n","text":"# 第1章｜企业 AI 化改变的究竟是什么\n\n**AI 使更多依赖阅读、理解、判断和制作的工作，可以被组织成可重复使用的能力。企业 AI 化要抓住的机会，是由此重新安排一类工作，并扩大企业能为客户创造的价值。**\n\n客户发来一句要求，销售读懂后追问，专业人员调用经验，制作人员形成方案，管理者决定资源。许多企业的日常运营，都靠这类信息加工把各个岗位连接起来。它们影响了响应速度、服务质量，也决定企业能够同时服务多少客户。\n\n## 信息加工成本下降，会改变什么\n\n传统软件擅长处理预先定义好的填写项目和规则，例如订单上的产品、数量与金额。这些分开保存的项目通常叫“字段”。计算金额、管理库存、保存订单，都可以建立明确的操作。客户的原话、散乱的文件和模糊的需求，则通常先由员工解释，再录入系统。大量人力消耗在把现实情况翻译成软件能够处理的内容上。\n\n模型让这段工作有了新做法。它可以阅读不同表达、提取条件、比较材料、起草方案，再把结果交给程序和人员继续处理。企业能够保留一套共同的方法，每次给它不同的客户材料，反复完成相似工作。第3—10章会解释这些能力怎样发挥作用。\n\n这里有一个重要的成本变化：过去主要为每次人工处理付费，现在可以先投入资料、方法、连接和检查，再在多次任务中使用。对于高频、方法较稳定的工作，这种安排有机会降低每项任务的成本。若输入差异大、专业核对很重，则应把这些工作量一起计算。经济性取决于一项完整工作的资源消耗。\n\n这也改变了服务覆盖。假设一家设备服务企业原来只为重点客户制作使用分析，因为每份都要查资料、整理记录、写说明。AI若能完成资料整理与初稿，专业人员便可以把时间用于判断异常和建议。企业由此可以试着服务更多客户，或提高分析频率。它获得的是一种新的供给选择：过去太贵而少做的工作，现在值得重新计算。\n\n## 把技术收益转成经营收益，需要接续的安排\n\n沿用这项服务设想，第一步是把客户记录变成可分析材料，第二步是识别值得关注的变化，第三步是专业人员形成建议，最后是客户据此安排维护。每一步都有自己的交出物和接手者。\n\nAI整理出材料以后，专业人员要能直接找到关键记录和需要判断的问题。建议完成后，客户经理要知道何时交给客户、帮助客户作什么决定。客户的使用反馈又应回到下一次分析。这样，生成速度的变化才有机会传递为响应和服务质量的变化。\n\n![信息进入、加工、行动和结果相互连接，企业知识与分工支持完整工作。](assets/01.svg)\n\n本书把围绕一种结果形成的信息、判断、动作、交接和责任安排，称为工作系统。它包括软件，也包括岗位如何合作。改造可以从其中一个小环节开始，但设计时需要知道结果送给谁、对方如何继续，以及哪些旧动作可以省去。\n\n## 企业应该争取哪一种价值\n\n| 价值方向 | 具体改善 | 应观察的结果 |\n| --- | --- | --- |\n| 成本 | 阅读、整理、制作或协调所需资源减少 | 包含复核、返工和维护的总投入 |\n| 速度 | 工作更早到达可以使用的状态 | 从收到任务到接手完成的周期 |\n| 质量 | 必要信息更完整，判断更一致，差错更早发现 | 合格结果、退回原因和使用反馈 |\n| 服务能力 | 扩大覆盖、增加频次或提供过去做不起的服务 | 客户使用、交付能力和服务经济性 |\n\n四种价值需要不同的安排。想提高速度，要看等待和交接；想提高质量，要把专业标准带进处理过程；想扩大服务，要找到愿意使用结果的客户，并安排后续履约。管理者先确定这一轮最想改善什么，团队才知道应该优化哪里。\n\n同一项改造也可能有取舍。更深入的分析需要更多检查，却能支撑更有价值的服务。更快形成大量候选方案，可能增加选择时间。判断取舍时，应回到客户或下一岗位究竟需要怎样的结果。\n\n## 企业自己的优势，怎样进入AI工作\n\n通用模型可以被多家企业采用。更能形成差异的，是企业掌握的客户需求、产品细节、行业经验，以及使用这些知识的判断方法。\n\n一位经验丰富的工程师，可能知道哪几个条件会改变选型，哪些异常值得提前提醒。这些知识经常隐藏在追问、修改和取舍中。把它们整理成问题、规则、实例和检查方法，再接入真实资料，团队就有机会借助AI沿用这套方法。\n\n把原来靠经验掌握的知识说明白以后，企业还能比较不同人的做法，发现原有规则的冲突，决定哪些值得统一。业务骨干参与这个过程，是为了把专业判断转成更多人可使用的方法。第13章和第26章会继续讲这种积累。\n\n## 从个人使用走向组织能力\n\n个人使用阶段，员工寻找适合自己的工具与做法；团队改造阶段，把有效方法接到共同任务上，重新安排交接；组织积累阶段，企业有能力维护资料、调整规则、培养人员，并把已形成的方法用于下一项工作。\n\n这三种活动可以同时开展。个人探索提供新发现，具体项目检验哪些做法有效，共用资产让下一轮实施少走一段路。管理者应建立这样的往返关系，让日常使用中的经验有机会改变工作制度，也让制度为有价值的尝试提供时间和资源。\n\n因此，企业 AI 化的起点可以很小，目标却应看得更远：先改善一类工作，再学会持续改造自己的工作。FDE的价值，正是在现场把这种学习推进为可以使用的结果。\n"},{"id":"c02","file":"02-FDE的价值与企业主的责任.md","title":"第2章｜FDE 的价值与管理者的责任","html":"\u003ch1>第2章｜FDE 的价值与管理者的责任\u003c/h1>\n\u003cp>\u003cstrong>FDE 式工作把业务判断、工程实现和实际使用放在同一轮推进中。它特别适合AI改造：先把最值得解决的问题做具体，再通过实际结果修正方案。\u003c/strong>\u003c/p>\n\u003cp>FDE 是 Forward Deployed Engineer 的缩写，常译为前线部署工程师。这里的“前线”可以是客户业务现场，也可以是企业内部的一条实际工作流程。实施者需要接触原始任务、参与设计、动手构建，并跟随使用者处理问题。\u003c/p>\n\u003cp>企业采用这种方法，可以组织内部人员，也可以与外部团队合作。关键是把现场发现与实现能力放到一起，让发现问题的人能够推动修改，让负责实现的人能够看见工作的实际后果。\u003c/p>\n\u003ch2>AI项目为什么需要边做边理解\u003c/h2>\n\u003cp>购买成熟软件时，企业通常能够比较清楚地选择已有功能。AI改造面对的情况更复杂：模型可以处理什么，要放到本企业的材料中试；业务骨干怎样判断，往往要在处理任务时才能讲完整；同事是否愿意采用，还与原有分工和考核有关。\u003c/p>\n\u003cp>以“自动写周报”为例，负责人最初可能只是希望减少制作时间。沿一份真实周报往前查，会发现有人从三处复制数据，有人花时间解释口径，有人拿到报告后还要追问异常原因。团队由此得到三个不同切口：从约定的记录取数、固定指标定义、解释异常变化。生成文字只是其中一段。\u003c/p>\n\u003cp>FDE先做一个能够检验关键切口的实现。例如，让系统从已确认的记录形成同口径比较，再由主管查看是否足以决定下一步。主管的追问暴露缺少的维度，实施者补上相应资料与分析，下一轮又能判断是否有必要加入通知或派工。问题理解因此越来越具体，功能也围绕实际用途生长。\u003c/p>\n\u003cp>这种往返需要明确的每轮目标。团队应知道这次采用哪些材料、交出什么、请谁使用、看什么结果。结果出来以后，才能有依据地决定下一轮。\u003c/p>\n\u003cp>首轮做出的有限版本常叫“原型”。例如先让一位主管用它查看一份周报，看看能否回答最重要的异常问题，再决定是否扩大到更多部门。原型的用途是检验一个关键设想，企业据此安排下一笔投入。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"02\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iODI1IiB2aWV3Qm94PSIwIDAgMzYwIDgyNSIgcm9sZT0iaW1nIj48dGl0bGU+5rK/5LiA5Lu95ZGo5oql5o6o6L+b5pS56YCgPC90aXRsZT48ZGVzYz5GREXmn6XnnIvlkajmiqXnmoTlj5bmlbDlkozkvb/nlKjvvIzlgZrlh7rliIbmnpDlkI7kuqTkuLvnrqHkvb/nlKjvvIzlho3moLnmja7ov73pl67kv67mlLnjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYSIgbWFya2VyV2lkdGg9IjgiIG1hcmtlckhlaWdodD0iOCIgcmVmWD0iNyIgcmVmWT0iNCIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwIEw4IDQgTDAgOCBaIiBmaWxsPSIjMjQ2YTU1Ii8+PC9tYXJrZXI+PC9kZWZzPjxyZWN0IHdpZHRoPSIzNjAiIGhlaWdodD0iODI1IiBmaWxsPSJ3aGl0ZSIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiI+PHRleHQgeD0iMjQiIHk9IjM4IiBmb250LXNpemU9IjI0IiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNjAwIj7msr/kuIDku73lkajmiqXmjqjov5vmlLnpgKA8L3RleHQ+PHJlY3QgeD0iMjQiIHk9IjgyIiB3aWR0aD0iMzEyIiBoZWlnaHQ9IjE0MiIgcng9IjgiIGZpbGw9IiNlZGY0ZWYiIHN0cm9rZT0iI2Q1ZTBkYSIgc3Ryb2tlLXdpZHRoPSIxLjQiLz48dGV4dCB4PSI0MCIgeT0iMTEyIiBmb250LXNpemU9IjIxIiBmaWxsPSIjMjQ2YTU1IiBmb250LXdlaWdodD0iNjAwIj7nnIvlrp7pmYXlkajmiqU8L3RleHQ+PHBhdGggZD0iTTQwIDEzNCBIMzIwIiBzdHJva2U9IiNkNWUwZGEiIHN0cm9rZS13aWR0aD0iMiIgZmlsbD0ibm9uZSIvPjx0ZXh0IHg9I rap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>推进阶段\u003c/th>\n\u003cth>团队在做什么\u003c/th>\n\u003cth>企业用结果决定什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>现场诊断\u003c/td>\n\u003ctd>查看任务、等待、返工，核对主要原因\u003c/td>\n\u003ctd>首先改善哪一段，投入是否值得\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>有限原型\u003c/td>\n\u003ctd>用真实输入试关键能力和交接方式\u003c/td>\n\u003ctd>采用哪种实现，哪些条件需补齐\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>日常试用\u003c/td>\n\u003ctd>让员工实际使用，记录质量和负担\u003c/td>\n\u003ctd>正式采用的范围、分工和持续费用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>运行与交接\u003c/td>\n\u003ctd>完善入口、资料、方法和维护安排\u003c/td>\n\u003ctd>谁接手，下一项改造从哪里开始\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>这套安排允许企业逐步增加投入。权限条件可以在原型前核实，关键能力可以先独立试验，正式使用范围则依据试用结果确定。每轮投入都在帮助企业解决一个更具体的问题。\u003c/p>\n\u003ch2>怎样选择合适的实施伙伴\u003c/h2>\n\u003cp>可以请对方围绕一项实际工作说明三件事：他会查看什么材料，准备先实现什么，出现错误后怎样定位。这个过程能看出对方是否理解业务链条，能否亲手实现，也能看出是否愿意根据事实修改最初方案。\u003c/p>\n\u003cp>行业经验有助于找到关键问题，工程能力决定能否把方法做出来，持续跟进则使两者接受使用检验。企业可根据自身缺项配置合作：业务方法清楚但实现不足，就补工程；技术团队已有，但专业规则散落，就加强现场梳理与业务参与。\u003c/p>\n\u003cp>合作成果还应包含企业可以继续使用的方法与条件。一个有效项目会让企业更清楚自己的流程、资料和判断，也让后续改造更容易展开。这是FDE经验应当沉淀的部分。\u003c/p>\n\u003ch2>管理者该把精力放在哪里\u003c/h2>\n\u003cp>项目早期，亲自看几笔原始任务，理解问题发生在哪里。原型阶段，关注关键假设能否成立。试用阶段，听实际使用者讲哪些工作减少、哪些增加。准备扩大时，再决定人员、授权、费用和维护方式。\u003c/p>\n\u003cp>管理者不必逐一审查提示词和技术组件，但要持续追问这项改造怎样服务经营目标，并为必要的组织变化作决定。当工程团队能及时获得业务判断，业务团队能及时看到实现结果，FDE式推进才会形成效率。\u003c/p>\n","text":"# 第2章｜FDE 的价值与管理者的责任\n\n**FDE 式工作把业务判断、工程实现和实际使用放在同一轮推进中。它特别适合AI改造：先把最值得解决的问题做具体，再通过实际结果修正方案。**\n\nFDE 是 Forward Deployed Engineer 的缩写，常译为前线部署工程师。这里的“前线”可以是客户业务现场，也可以是企业内部的一条实际工作流程。实施者需要接触原始任务、参与设计、动手构建，并跟随使用者处理问题。\n\n企业采用这种方法，可以组织内部人员，也可以与外部团队合作。关键是把现场发现与实现能力放到一起，让发现问题的人能够推动修改，让负责实现的人能够看见工作的实际后果。\n\n## AI项目为什么需要边做边理解\n\n购买成熟软件时，企业通常能够比较清楚地选择已有功能。AI改造面对的情况更复杂：模型可以处理什么，要放到本企业的材料中试；业务骨干怎样判断，往往要在处理任务时才能讲完整；同事是否愿意采用，还与原有分工和考核有关。\n\n以“自动写周报”为例，负责人最初可能只是希望减少制作时间。沿一份真实周报往前查，会发现有人从三处复制数据，有人花时间解释口径，有人拿到报告后还要追问异常原因。团队由此得到三个不同切口：从约定的记录取数、固定指标定义、解释异常变化。生成文字只是其中一段。\n\nFDE先做一个能够检验关键切口的实现。例如，让系统从已确认的记录形成同口径比较，再由主管查看是否足以决定下一步。主管的追问暴露缺少的维度，实施者补上相应资料与分析，下一轮又能判断是否有必要加入通知或派工。问题理解因此越来越具体，功能也围绕实际用途生长。\n\n这种往返需要明确的每轮目标。团队应知道这次采用哪些材料、交出什么、请谁使用、看什么结果。结果出来以后，才能有依据地决定下一轮。\n\n首轮做出的有限版本常叫“原型”。例如先让一位主管用它查看一份周报，看看能否回答最重要的异常问题，再决定是否扩大到更多部门。原型的用途是检验一个关键设想，企业据此安排下一笔投入。\n\n![现场材料支持有限实现，使用反馈再修改问题与方案，企业负责目标、标准和投入。](assets/02.svg)\n\n## 决策者、业务负责人和FDE怎样合作\n\n决策者负责确定优先级、投入资源、处理跨部门取舍。比如销售希望快速承诺，交付希望条件齐全，双方争论的背后可能是加急费用由谁承担。这个决定需要经营判断。\n\n业务负责人提供判断标准，并对一类工作的结果负责。他组织真实材料，解释专业条件，安排使用反馈，决定哪些规则成为日常做法。项目期间需要给他留出时间，因为这些判断本来就构成企业的专业能力。\n\nFDE负责把方法变成可运行的实现：选择合适模型，组织资料，连接工具，设计界面与状态，检验过程，并帮助企业接手。出现问题时，沿原始输入和实际操作定位原因，再修改对应部分。\n\n小企业可以由一个人兼任多个角色。外部伙伴也可以同时具备行业与技术能力。企业需要明确每项责任由谁承担，尤其是专业标准、资源决定和日常维护。\n\n## 怎样组织一轮有产出的推进\n\n| 推进阶段 | 团队在做什么 | 企业用结果决定什么 |\n| --- | --- | --- |\n| 现场诊断 | 查看任务、等待、返工，核对主要原因 | 首先改善哪一段，投入是否值得 |\n| 有限原型 | 用真实输入试关键能力和交接方式 | 采用哪种实现，哪些条件需补齐 |\n| 日常试用 | 让员工实际使用，记录质量和负担 | 正式采用的范围、分工和持续费用 |\n| 运行与交接 | 完善入口、资料、方法和维护安排 | 谁接手，下一项改造从哪里开始 |\n\n这套安排允许企业逐步增加投入。权限条件可以在原型前核实，关键能力可以先独立试验，正式使用范围则依据试用结果确定。每轮投入都在帮助企业解决一个更具体的问题。\n\n## 怎样选择合适的实施伙伴\n\n可以请对方围绕一项实际工作说明三件事：他会查看什么材料，准备先实现什么，出现错误后怎样定位。这个过程能看出对方是否理解业务链条，能否亲手实现，也能看出是否愿意根据事实修改最初方案。\n\n行业经验有助于找到关键问题，工程能力决定能否把方法做出来，持续跟进则使两者接受使用检验。企业可根据自身缺项配置合作：业务方法清楚但实现不足，就补工程；技术团队已有，但专业规则散落，就加强现场梳理与业务参与。\n\n合作成果还应包含企业可以继续使用的方法与条件。一个有效项目会让企业更清楚自己的流程、资料和判断，也让后续改造更容易展开。这是FDE经验应当沉淀的部分。\n\n## 管理者该把精力放在哪里\n\n项目早期，亲自看几笔原始任务，理解问题发生在哪里。原型阶段，关注关键假设能否成立。试用阶段，听实际使用者讲哪些工作减少、哪些增加。准备扩大时，再决定人员、授权、费用和维护方式。\n\n管理者不必逐一审查提示词和技术组件，但要持续追问这项改造怎样服务经营目标，并为必要的组织变化作决定。当工程团队能及时获得业务判断，业务团队能及时看到实现结果，FDE式推进才会形成效率。\n"},{"id":"c03","file":"03-模型能力是怎样形成和发挥的.md","title":"第3章｜模型能力是怎样形成和发挥的","html":"\u003ch1>第3章｜模型能力是怎样形成和发挥的\u003c/h1>\n\u003cp>\u003cstrong>模型通过训练获得一般能力，使用时把这些能力用于当前材料。企业可以通过提供知识、组织任务和连接工具，让通用模型完成具有本企业特色的工作。\u003c/strong> 理解训练与运行的关系，有助于判断一项能力应该怎样建设、投入放在哪里。\u003c/p>\n\u003ch2>训练改变能力，运行提供当前条件\u003c/h2>\n\u003cp>可以用学习做饭与照着订单做一顿饭来区分这两件事。长期练习让厨师更会处理食材；今天收到“四人份、其中一人不吃辣”的订单，则告诉他这顿饭怎么做。模型训练改变一般处理能力，企业每次交给它的任务和资料则提供当前条件。这里借用的是“已学会的能力”与“本次需要的信息”这个区别，模型实际依靠下面的数值计算工作。\u003c/p>\n\u003cp>模型内部有大量参与计算的数值，称为参数。训练时，程序让模型预测或完成任务，将结果与相应训练目标比较，再调整参数。经过大量这样的过程，模型学到可在新输入上使用的关系。它并非只保存一组供原样查找的答案。\u003c/p>\n\u003cp>预训练建立广泛的语言与信息处理基础。后训练利用示范、偏好或可验证结果等反馈，进一步改善遵循指令、回答方式和解决问题的表现。具体训练安排因模型而异，这里关注它们共同改变的部分：模型处理新输入时所依据的能力与倾向。\u003c/p>\n\u003cp>正式使用时，企业通常没有重新训练。应用把请求、资料与历史等内容送给模型，模型进行计算，生成文本或动作请求。你补充一份制度，往往改变的是这次能用的材料；只有另行进行训练，才是在改变相应模型的参数。\u003c/p>\n\u003cp>在已有模型上用一批专门样例继续训练，通常叫“微调”。它会更新相应模型参数。例如企业希望稳定某类文书格式，可能用合适样例评估这种办法。聊天中临时纠正一次、应用保存一条偏好、企业更新资料库与另行微调模型，改变的是不同位置，更新和检查的方法也不同。\u003c/p>\n\u003ch2>连续生成怎样形成复杂结果\u003c/h2>\n\u003cp>文字通常先被编码成较小的单位，叫Token，可能是词、字的一部分或符号组合。常见语言模型会利用当前输入和已经生成的内容，计算接下来可以生成什么，再依次继续，直到结束。这种逐步利用前文生成后文的方式叫“自回归”。\u003c/p>\n\u003cp>连续生成之所以能形成论证、表格和程序，是因为训练得到的关系包含语言结构、知识联系和解决任务的模式。对于一道多步骤问题，模型可以先形成中间结果，再利用这些结果继续处理。额外的推理计算也给它更多机会分解问题、比较方案和修正。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"03\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iMTQ1NiIgdmlld0JveD0iMCAwIDM2MCAxNDU2IiByb2xlPSJpbWciPjx0aXRsZT7orq3nu4PkuI7ov5DooYzmlLnlj5jkuI3lkIzpg6jliIY8L3RpdGxlPjxkZXNjPuiuree7g+abtOaWsOWPguaVsO+8m+i/kOihjOWIqeeUqOW9k+WJjei+k+WFpeiuoeeul++8jOWklumDqOW3peWFt+e7k+aenOWPr+S7peaIkOS4uuS4i+S4gOi9rui+k+WFpeOAgjwvZGVzYz48ZGVmcz48bWFya2VyIGlkPSJhIiBtYXJrZXJXaWR0aD0iOCIgbWFya2VySGVpZ2h0PSI4IiByZWZYPSI3IiByZWZZPSI0IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDAgTDggNCBMMCA4IFoiIGZpbGw9IiMyNDZhNTUiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjM2MCIgaGVpZ2h0PSIxNDU2IiBmaWxsPSJ3aGl0ZSIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiI+PHRleHQgeD0iMjQiIHk9IjM4IiBmb250LXNpemU9IjI0IiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNjAwIj7orq3nu4PkuI7ov5DooYzmlLnlj5jkuI3lkIzpg6jliIY8L3RleHQ+PHRleHQgeD0iMjQiIHk9IjgwIiBmb250LXNpemU9IjIwIiBmaWxsPSIjMzY1ZTg2IiBmb250LXdlaWdodD0iNjAwIj7orq3nu4PvvJrmlLnlj5jlj4LmlbDkuI7kuIDoiKzog73lips8L3RleHQ+PHJlY3QgeD0iMjQiIHk9IjEwNCIgd2lkdGg9IjMxMiIgaGVpZ2h0PSIxNDIiIHJ4PSI4IiBmaWxsPSIjZWRmNGVmI 户消息，价格来自哪个有效版本，查询实际返回了什么。模型生成与外部事实核对因此承担不同工作。这个区别解释了为什么流畅回答里仍可能包含错误，也说明企业应用应怎样补足。\u003c/p>\n\u003ch2>为什么同一个模型，表现能差很多\u003c/h2>\n\u003cp>让模型“分析销售下降”时，如果只给一个总额，它可能提出许多通用解释。提供产品、渠道、客户类型、时间口径和近期经营变化后，它才有条件检查哪些解释符合数据。若再连接查询和计算工具，可以进一步核实假设。\u003c/p>\n\u003cp>补充材料使可用证据变多，连接工具使模型能够主动取得信息和执行计算，更强的模型则可能更善于利用这些条件。三类改进可以配合。销售下降的具体原因来自企业记录与调查，模型帮助组织和检验解释。\u003c/p>\n\u003cp>模型的能力分布也有差异：写作、复杂表格理解、推理和工具选择，可能各有擅长的配置。企业可以用同类任务比较候选，观察不同材料与条件下的表现，再决定哪些工作共用模型、哪些需要专门配置。\u003c/p>\n\u003ch2>推理时的计算也影响表现\u003c/h2>\n\u003cp>部分模型能够在给出最终结果前或行动之间使用额外计算，尝试分解问题、比较路径或利用工具反馈。对复杂问题，这种方式可能改善表现；它通常也需要更多时间和资源。简单字段提取未必值得使用同样的配置。\u003c/p>\n\u003cp>推理说明有助于人理解建议。检验任务时，应用还应提供实际使用的输入、查询和计算结果。例如销售分析应能找到数据范围和运行结果，接手者据此核对结论。第8章将具体说明这条分析路径。\u003c/p>\n\u003ch2>把能力、信息、行动和结果分开\u003c/h2>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>层次\u003c/th>\n\u003cth>需要回答的问题\u003c/th>\n\u003cth>业务中的检查方式\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>能力\u003c/td>\n\u003ctd>在什么任务上能做到怎样的质量\u003c/td>\n\u003ctd>换材料、换条件的任务评测\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>信息\u003c/td>\n\u003ctd>这次知道哪些事实和规则\u003c/td>\n\u003ctd>查看实际输入、查询结果与缺口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>行动\u003c/td>\n\u003ctd>是否连接并获准执行相应操作\u003c/td>\n\u003ctd>核账号、工具、参数与系统记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结果\u003c/td>\n\u003ctd>任务与经营目标是否实现\u003c/td>\n\u003ctd>核完整交付、采用、负担与业务影响\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>这张表也给出错误排查顺序。资料过期先修资料，读取不到先修连接，程序归错对象先修关联，信息和任务设计已经合理而处理仍不足时，再比较模型、拆任务或考虑专门训练。若经营目标本身选错，就要回到业务判断。\u003c/p>\n\u003ch2>企业专属能力怎样形成\u003c/h2>\n\u003cp>企业专属能力可以来自有效知识、判断标准、示例、工具、流程和检查的组合。例如，一个服务助手采用企业自己的产品资料，查询当前订单，再按企业的方法形成处理建议；即使使用通用模型，它完成的也是专属工作。企业维护这些组成，就能够持续调整能力，并在需要时比较或更换模型。\u003c/p>\n\u003cp>当稳定高频任务有足够授权数据、现有办法确实存在能力缺口时，可以比较微调或专门模型与其他实现。训练有数据、验证和维护成本，应证明它改善了真正需要的行为。\u003c/p>\n\u003cp>从管理者角度，最有用的追问是：“这个改善来自更强模型、更多有效信息、更好的工具，还是更合理的任务？”把它们分清，才能知道下一笔投入应该落在哪里。\u003c/p>\n","text":"# 第3章｜模型能力是怎样形成和发挥的\n\n**模型通过训练获得一般能力，使用时把这些能力用于当前材料。企业可以通过提供知识、组织任务和连接工具，让通用模型完成具有本企业特色的工作。** 理解训练与运行的关系，有助于判断一项能力应该怎样建设、投入放在哪里。\n\n## 训练改变能力，运行提供当前条件\n\n可以用学习做饭与照着订单做一顿饭来区分这两件事。长期练习让厨师更会处理食材；今天收到“四人份、其中一人不吃辣”的订单，则告诉他这顿饭怎么做。模型训练改变一般处理能力，企业每次交给它的任务和资料则提供当前条件。这里借用的是“已学会的能力”与“本次需要的信息”这个区别，模型实际依靠下面的数值计算工作。\n\n模型内部有大量参与计算的数值，称为参数。训练时，程序让模型预测或完成任务，将结果与相应训练目标比较，再调整参数。经过大量这样的过程，模型学到可在新输入上使用的关系。它并非只保存一组供原样查找的答案。\n\n预训练建立广泛的语言与信息处理基础。后训练利用示范、偏好或可验证结果等反馈，进一步改善遵循指令、回答方式和解决问题的表现。具体训练安排因模型而异，这里关注它们共同改变的部分：模型处理新输入时所依据的能力与倾向。\n\n正式使用时，企业通常没有重新训练。应用把请求、资料与历史等内容送给模型，模型进行计算，生成文本或动作请求。你补充一份制度，往往改变的是这次能用的材料；只有另行进行训练，才是在改变相应模型的参数。\n\n在已有模型上用一批专门样例继续训练，通常叫“微调”。它会更新相应模型参数。例如企业希望稳定某类文书格式，可能用合适样例评估这种办法。聊天中临时纠正一次、应用保存一条偏好、企业更新资料库与另行微调模型，改变的是不同位置，更新和检查的方法也不同。\n\n## 连续生成怎样形成复杂结果\n\n文字通常先被编码成较小的单位，叫Token，可能是词、字的一部分或符号组合。常见语言模型会利用当前输入和已经生成的内容，计算接下来可以生成什么，再依次继续，直到结束。这种逐步利用前文生成后文的方式叫“自回归”。\n\n连续生成之所以能形成论证、表格和程序，是因为训练得到的关系包含语言结构、知识联系和解决任务的模式。对于一道多步骤问题，模型可以先形成中间结果，再利用这些结果继续处理。额外的推理计算也给它更多机会分解问题、比较方案和修正。\n\n![训练更新参数，运行使用当前资料与工具反馈生成结果；更新企业资料不自动等于重新训练。](assets/03.svg)\n\n训练使模型倾向于产生符合当前语境的结果。企业任务还需要把结果接回具体事实：数量对应哪条客户消息，价格来自哪个有效版本，查询实际返回了什么。模型生成与外部事实核对因此承担不同工作。这个区别解释了为什么流畅回答里仍可能包含错误，也说明企业应用应怎样补足。\n\n## 为什么同一个模型，表现能差很多\n\n让模型“分析销售下降”时，如果只给一个总额，它可能提出许多通用解释。提供产品、渠道、客户类型、时间口径和近期经营变化后，它才有条件检查哪些解释符合数据。若再连接查询和计算工具，可以进一步核实假设。\n\n补充材料使可用证据变多，连接工具使模型能够主动取得信息和执行计算，更强的模型则可能更善于利用这些条件。三类改进可以配合。销售下降的具体原因来自企业记录与调查，模型帮助组织和检验解释。\n\n模型的能力分布也有差异：写作、复杂表格理解、推理和工具选择，可能各有擅长的配置。企业可以用同类任务比较候选，观察不同材料与条件下的表现，再决定哪些工作共用模型、哪些需要专门配置。\n\n## 推理时的计算也影响表现\n\n部分模型能够在给出最终结果前或行动之间使用额外计算，尝试分解问题、比较路径或利用工具反馈。对复杂问题，这种方式可能改善表现；它通常也需要更多时间和资源。简单字段提取未必值得使用同样的配置。\n\n推理说明有助于人理解建议。检验任务时，应用还应提供实际使用的输入、查询和计算结果。例如销售分析应能找到数据范围和运行结果，接手者据此核对结论。第8章将具体说明这条分析路径。\n\n## 把能力、信息、行动和结果分开\n\n| 层次 | 需要回答的问题 | 业务中的检查方式 |\n| --- | --- | --- |\n| 能力 | 在什么任务上能做到怎样的质量 | 换材料、换条件的任务评测 |\n| 信息 | 这次知道哪些事实和规则 | 查看实际输入、查询结果与缺口 |\n| 行动 | 是否连接并获准执行相应操作 | 核账号、工具、参数与系统记录 |\n| 结果 | 任务与经营目标是否实现 | 核完整交付、采用、负担与业务影响 |\n\n这张表也给出错误排查顺序。资料过期先修资料，读取不到先修连接，程序归错对象先修关联，信息和任务设计已经合理而处理仍不足时，再比较模型、拆任务或考虑专门训练。若经营目标本身选错，就要回到业务判断。\n\n## 企业专属能力怎样形成\n\n企业专属能力可以来自有效知识、判断标准、示例、工具、流程和检查的组合。例如，一个服务助手采用企业自己的产品资料，查询当前订单，再按企业的方法形成处理建议；即使使用通用模型，它完成的也是专属工作。企业维护这些组成，就能够持续调整能力，并在需要时比较或更换模型。\n\n当稳定高频任务有足够授权数据、现有办法确实存在能力缺口时，可以比较微调或专门模型与其他实现。训练有数据、验证和维护成本，应证明它改善了真正需要的行为。\n\n从管理者角度，最有用的追问是：“这个改善来自更强模型、更多有效信息、更好的工具，还是更合理的任务？”把它们分清，才能知道下一笔投入应该落在哪里。\n"},{"id":"c04","file":"04-语言理解让非标准信息进入业务.md","title":"第4章｜语言理解让非标准信息进入业务","html":"\u003ch1>第4章｜语言理解让非标准信息进入业务\u003c/h1>\n\u003cp>一家提供设备销售与售后服务的公司，每天会从聊天、电话记录和邮件中收到客户要求。客户按自己的习惯说话：有人只说“还是照上次的”，有人把本次采购和明年打算放在同一句里，还有人先抱怨“用不了”，再慢慢说出具体情况。销售和客服要先读懂这些话，才能查订单、安排处理或请专业人员判断。\u003c/p>\n\u003cp>过去，这段整理主要靠人完成：读消息，追问，抄进表格，再转给同事。\u003cstrong>语言能力的一个重要用途，就是帮助完成这段从“客户怎么说”到“同事接下来怎么做”的转换。\u003c/strong> 模型可以先提取、分类和归纳，员工集中核对会影响数量、费用和承诺的内容。\u003c/p>\n\u003cp>这里说的“信息处理”并不神秘。它包括把一句话拆成几件事、保留每件事的意思，再按用途整理。生活中接到一张家人写的购物便条，你也会分清“今天买两盒牛奶”和“下周可能要请客”：前者进入今天的购物清单，后者先留下提醒。企业处理客户需求时，需要作相似的区分。\u003c/p>\n\u003ch2>一条客户消息，怎样变成几项可以继续的工作\u003c/h2>\n\u003cp>假设销售正在给老客户准备本次订货单。客户发来：“这次先要两套，颜色沿用上次的，安装等场地好了再定；明年可能再加一套。”销售要把这条消息交给负责备货和安装的同事。若直接转发原话，对方还得重新阅读、找历史记录、询问日期；若压缩成“三套、老颜色、待安装”，又会把明年的意向混进本次订单。\u003c/p>\n\u003cp>可以先让模型填写一张需求记录。表里每个单独填写的项目，在软件里通常叫“字段”，例如本次数量、颜色、安装时间。字段的作用，是让接手者快速找到自己要看的部分。\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>要整理的项目\u003c/th>\n\u003cth>客户原话说明了什么\u003c/th>\n\u003cth>销售接下来做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>本次数量\u003c/td>\n\u003ctd>“这次先要两套”\u003c/td>\n\u003ctd>核对产品与单位，再交备货人员\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>颜色\u003c/td>\n\u003ctd>“沿用上次的”，当前消息没有颜色名称\u003c/td>\n\u003ctd>查这位客户的上次订单，取得颜色后确认\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>安装时间\u003c/td>\n\u003ctd>要等场地准备好，目前未定\u003c/td>\n\u003ctd>向客户了解准备进度，暂不占用安装时段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>明年追加\u003c/td>\n\u003ctd>“可能再加一套”，是未来意向\u003c/td>\n\u003ctd>保存为跟进提醒，不加入本次数量\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>模型在这里识别的是文字之间的关系：“这次”和“明年”分开了时间，“等”提出条件，“可能”保留了不确定性。应用把这些整理结果显示在对应项目旁，并附上原话。销售查看后，就知道哪些可以交给同事，哪些需要补问。负责安装的人拿到的也不再只是“待安装”，而是“日期未定，等待客户确认场地准备时间”。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"04\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iMTAyMCIgdmlld0JveD0iMCAwIDM2MCAxMDIwIiByb2xlPSJpbWciPjx0aXRsZT7kuIDlj6Xor53vvIzmi4bmiJDlm5vpobnlkI7nu63lt6XkvZw8L3RpdGxlPjxkZXNjPuWQjOS4gOadoea2iOaBr+aLhuaIkOaVsOmHj+OAgeminOiJsuW8leeUqOOAgeWuieijheadoeS7tuWSjOacquadpeaEj+WQke+8jOWIhuWIq+aUr+aMgeWkh+i0p+OAgeWOhuWPsuaguOWvueOAgei/vemXruWSjOi3n+i/m+OAgjwvZGVzYz48ZGVmcz48bWFya2VyIGlkPSJhIiBtYXJrZXJXaWR0aD0iOCIgbWFya2VySGVpZ2h0PSI4IiByZWZYPSI3IiByZWZZPSI0IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDAgTDggNCBMMCA4IFoiIGZpbGw9IiMyNDZhNTUiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjM2MCIgaGVpZ2h0PSIxMDIwIiBmaWxsPSJ3aGl0ZSIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiI+PHRleHQgeD0iMjQiIHk9IjM4IiBmb250LXNpemU9IjI0IiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNjAwIj7kuIDlj6Xor53vvIzmi4bmiJDlm5vpobnlkI7nu63lt6XkvZw8L3RleHQ+PHRleHQgeD0iMjQiIHk9IjcxIiBmb250LXNpemU9IjE4IiBmaWxsPSIjNjE3MTZiIiBmb250LXdlaWdodD0iNDAwIj7npLrmhI/vvJrplIDllK7mlLbliLDogIHlrqLmiLforqLotKfmtojmga88L3RleHQ+PHJlY3QgeD0iMjQiIHk9IjEyNCIgd2lkdGg9IjMxMiIgaGVpZ2h0PSIxNzEiIHJ4PSI4IiBmaWxsPSIjZWRmMmY4IiBzdHJva2U9IiNkNWUwZGEiIHN0cm9rZS13aWR0aD0iMS40Ii8+PHRleHQgeD0iNDAiIHk9IjE1NCIgZm9udC1zaXplPSIyMSIgZmlsbD0iIzI0NmE1NSIgZm9udC13ZWlnaHQ9IjYwMCI+5a6i5oi35Y6f6K+dPC90ZXh0PjxwYXRoIGQ9Ik00MCAxNzYgSDMyMCIgc3Ryb2tlPSIjZDVlMGRhIiBzdHJva2Utd2lkdGg9IjIiIGZpbGw9Im5vbmUiLz48dGV4dCB4PSI0MCIgeT0iMjA4IiBmb250LXNpemU9IjIwIiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNDAwIj7ov5nmrKHlhYjopoHkuKTlpZfvvIzpopzoibLmsr/nlKjkuIrmrKHvvJs8L3RleHQ+PHRleHQgeD0iNDAiIHk9IjIzNyIgZm9udC1zaXplPSIyMCIgZmlsbD0iIzIwM2YzOCIgZm9udC13ZWlnaHQ9Ij 户家门钥匙转不动，可能需要安排锁具检查；小区门禁不识别住户卡，则要查门禁登记。物业会先问是哪扇门、出现什么现象，再派给相应人员。只把两件事都记作“打不开”，并不能帮助维修。\u003c/p>\n\u003cp>回到软件客服，前两条消息都涉及验证码没有及时到达，可以先进入验证码收发排查；第三条已经给出“无权访问”的提示，应先查账号的访问资格。这里的分类决定\u003cstrong>先查哪条路径\u003c/strong>，具体原因要由后续查询确认。它还没有证明短信服务故障，也没有证明客户没有购买资格。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"31\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iMTA1OSIgdmlld0JveD0iMCAwIDM2MCAxMDU5IiByb2xlPSJpbWciPjx0aXRsZT7pg73or7Tov5vkuI3ljrvvvIzmjqXmiYvot6/lvoTkuI3lkIw8L3RpdGxlPjxkZXNjPuS4pOenjemqjOivgeeggeaKseaAqOWFseeUqOS4gOadoeaOkuafpei3r+W+hO+8jOaXoOadg+mZkOaPkOekuui/m+WFpeWPpuS4gOadoei3r+W+hO+8m+WkhOeQhue7k+aenOWbnuWIsOWQhOiHquWOn+iusOW9leS+m+WuouacjeWbnuWkjeOAgjwvZGVzYz48ZGVmcz48bWFya2VyIGlkPSJhIiBtYXJrZXJXaWR0aD0iOCIgbWFya2VySGVpZ2h0PSI4IiByZWZYPSI3IiByZWZZPSI0IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDAgTDggNCBMMCA4IFoiIGZpbGw9IiMyNDZhNTUiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjM2MCIgaGVpZ2h0PSIxMDU5IiBmaWxsPSJ3aGl0ZSIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiI+PHRleHQgeD0iMjQiIHk9IjM4IiBmb250LXNpemU9IjI0IiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNjAwIj7pg73or7Tov5vkuI3ljrvvvIzmjqXmiYvot6/lvoTkuI3lkIw8L3RleHQ+PHRleHQgeD0iMjQiIHk9IjcxIiBmb250LXNpemU9IjE4IiBmaWxsPSIjNjE3MTZiIiBmb250LXdlaWdodD0iNDAwIj7npLrmhI/vvJrmjInnjrDosaHliIbmtYHvvIzlho3mn6Xljp/lm6A8L3RleHQ+PHJlY3QgeD0iMjQiIHk9IjEyNCIgd2lkdGg9IjMxMiIgaGVpZ2h0PSIxNDIiIHJ4PSI4IiBmaWxsPSIjZWRmMmY4IiBzdHJva2U9IiNkNWUwZGEiIHN0cm9rZS13aWR0aD0iMS40Ii8+PHRleHQgeD0iNDAiIHk9IjE1NCIgZm9udC1zaXplPSIyMSIgZmlsbD0iIzI0NmE1NSIgZm9udC13ZWlnaHQ9IjYwMCI+5raI5oGv55Sy44CB5LmZPC90ZXh0PjxwYXRoIGQ9Ik00MCAxNzYgSDMyMCIgc3Ryb2tlPSIjZDVlMGRhIiBzdHJva2Utd2lkdGg9IjIiIGZpbGw9Im5vbmUiLz48dGV4dCB4PSI0MCIgeT0iMjA4IiBmb250LXNpemU9IjIwIiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNDAwIj7igJzpqozor4HnoIHkuIDnm7TkuI3liLDigJ08L3RleHQ+PHRleHQgeD0iNDAiIHk9IjIzNyIgZm9udC1zaXplPSIyMCIgZmlsbD0iIzI 分对的消息和这次新情况检查，确认新方法既能识别变化，也保留原来的判断。这样，模型整理的内容才会随着实际工作改善。\u003c/p>\n\u003ch2>摘要怎样帮助交接\u003c/h2>\n\u003cp>一天工作结束，接班同事通常没有时间重读所有聊天。他需要知道已经发生什么、还等什么、自己要做什么。摘要的用途，是让接手者从正确的位置继续。\u003c/p>\n\u003cp>假设销售在会议中提出“最好下周发货”，交付负责人回答“先查库存，明天再确认”。会后需要交给跟单人员的内容可以是：\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>接手者要知道的事\u003c/th>\n\u003cth>摘要怎样写\u003c/th>\n\u003cth>后续动作\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>客户或销售的期望\u003c/td>\n\u003ctd>希望下周发货\u003c/td>\n\u003ctd>保留期望，供交付评估\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>当前已作的决定\u003c/td>\n\u003ctd>先查库存，发货日期尚未确认\u003c/td>\n\u003ctd>暂不向客户承诺下周发货\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>谁继续处理\u003c/td>\n\u003ctd>交付负责人明天确认库存与安排\u003c/td>\n\u003ctd>跟单人员取得答复后更新计划\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>如果压缩成“计划下周发货”，接手人可能据此通知客户或安排运输。保留“未确认”和“谁来确认”，反而让摘要更有用。整理会议、客户记录或合同讨论时，都应按接手者的任务选择保留内容，而不只追求字数更少。\u003c/p>\n\u003ch2>从一张表到程序可以使用的信息\u003c/h2>\n\u003cp>纸质登记表把姓名、电话、地址分开填写，便于不同的人找到所需内容。软件也需要类似的约定。“结构化输出”就是要求模型按约定项目返回内容，例如数量是一项数值，状态选“已明确”“待确认”或“意向”。程序可以据此读取数量进行计算，把待确认事项放进追问清单。\u003c/p>\n\u003cp>格式检查与业务核对各负责一段。程序可以发现数量一栏填了无法计算的文字，或缺少客户编号；销售则对照原话，确认“两套”有没有被误写成“三套”，客户和产品有没有归错。两段检查完成后，下一岗位才拿到既能被软件读取、又符合本次业务的信息。\u003c/p>\n\u003cp>首轮改造可选一类高频输入，把接手者真正需要的项目列清楚，用正常、含糊、否定和变更的消息试一轮。比较人工整理与 AI 整理的遗漏、改动及核对时间，还要请接手同事实际处理。若对方仍需重新读全篇、重新问所有问题，就要继续改整理方式。\u003c/p>\n\u003cp>语言能力的价值，最终落在这段交接里：客户可以按熟悉的方式表达，销售和客服减少抄录与归纳，专业人员得到足以开始工作的材料。企业把“读懂一句话”接成了“继续完成一项工作”。\u003c/p>\n","text":"# 第4章｜语言理解让非标准信息进入业务\n\n一家提供设备销售与售后服务的公司，每天会从聊天、电话记录和邮件中收到客户要求。客户按自己的习惯说话：有人只说“还是照上次的”，有人把本次采购和明年打算放在同一句里，还有人先抱怨“用不了”，再慢慢说出具体情况。销售和客服要先读懂这些话，才能查订单、安排处理或请专业人员判断。\n\n过去，这段整理主要靠人完成：读消息，追问，抄进表格，再转给同事。**语言能力的一个重要用途，就是帮助完成这段从“客户怎么说”到“同事接下来怎么做”的转换。** 模型可以先提取、分类和归纳，员工集中核对会影响数量、费用和承诺的内容。\n\n这里说的“信息处理”并不神秘。它包括把一句话拆成几件事、保留每件事的意思，再按用途整理。生活中接到一张家人写的购物便条，你也会分清“今天买两盒牛奶”和“下周可能要请客”：前者进入今天的购物清单，后者先留下提醒。企业处理客户需求时，需要作相似的区分。\n\n## 一条客户消息，怎样变成几项可以继续的工作\n\n假设销售正在给老客户准备本次订货单。客户发来：“这次先要两套，颜色沿用上次的，安装等场地好了再定；明年可能再加一套。”销售要把这条消息交给负责备货和安装的同事。若直接转发原话，对方还得重新阅读、找历史记录、询问日期；若压缩成“三套、老颜色、待安装”，又会把明年的意向混进本次订单。\n\n可以先让模型填写一张需求记录。表里每个单独填写的项目，在软件里通常叫“字段”，例如本次数量、颜色、安装时间。字段的作用，是让接手者快速找到自己要看的部分。\n\n| 要整理的项目 | 客户原话说明了什么 | 销售接下来做什么 |\n| --- | --- | --- |\n| 本次数量 | “这次先要两套” | 核对产品与单位，再交备货人员 |\n| 颜色 | “沿用上次的”，当前消息没有颜色名称 | 查这位客户的上次订单，取得颜色后确认 |\n| 安装时间 | 要等场地准备好，目前未定 | 向客户了解准备进度，暂不占用安装时段 |\n| 明年追加 | “可能再加一套”，是未来意向 | 保存为跟进提醒，不加入本次数量 |\n\n模型在这里识别的是文字之间的关系：“这次”和“明年”分开了时间，“等”提出条件，“可能”保留了不确定性。应用把这些整理结果显示在对应项目旁，并附上原话。销售查看后，就知道哪些可以交给同事，哪些需要补问。负责安装的人拿到的也不再只是“待安装”，而是“日期未定，等待客户确认场地准备时间”。\n\n![客户原话拆成当前数量、历史颜色、未定安装与未来意向，分别交给备货核对、历史查询、客户追问和后续跟进。](assets/04.svg)\n\n“沿用上次”尤其能说明语言理解与查资料怎样配合。模型可以指出这句话引用了历史，却没有凭这句话获知颜色。应用需要按当前客户查到对应订单，把颜色送回本次需求记录。销售确认引用的是正确订单后，备货人员才得到可用信息。\n\n## 相似的抱怨，为什么要交给不同的人\n\n客服是直接接触客户的一线部门。假设一家软件公司的客服接连收到三条消息：“验证码一直不到”“短信过期才来”“账号显示无权访问”。三位客户都觉得自己“进不去”，客服却需要知道下一步该查什么、交给谁。\n\n这和物业接到“门打不开”的报修很像。住户家门钥匙转不动，可能需要安排锁具检查；小区门禁不识别住户卡，则要查门禁登记。物业会先问是哪扇门、出现什么现象，再派给相应人员。只把两件事都记作“打不开”，并不能帮助维修。\n\n回到软件客服，前两条消息都涉及验证码没有及时到达，可以先进入验证码收发排查；第三条已经给出“无权访问”的提示，应先查账号的访问资格。这里的分类决定**先查哪条路径**，具体原因要由后续查询确认。它还没有证明短信服务故障，也没有证明客户没有购买资格。\n\n![两种验证码抱怨进入收发排查，无权访问进入账号资格核查；原话与提示保留在各自记录，排查后再更新处理结果。](assets/31.svg)\n\n为了让模型这样整理，业务负责人先提供已有的处理类别、各类别对应的现象和接手团队，以及几条容易混淆的例子。应用把客户本次对话一起交给模型，模型提出分类、对应原句和仍缺的信息。比如客户只说“进不去”，客服就先追问是否收到验证码、页面显示什么，再决定去向。\n\n客服确认后，应用把问题记录交到相应团队的待办入口。记录包括客户、发生时间、原话、页面提示和已经问过的问题。接手人员据此查发送记录或账号资格，把排查结果写回。客服能看到进展，继续回复原来的客户；客户也不必向每个接手人从头复述一遍。\n\n## 同一条反馈，怎样同时帮助客服和产品改进\n\n一条“短信过期才来”的反馈，可以有几种用途。客服关心谁来处理，产品团队关心哪个使用步骤使客户受阻，负责人关心影响了多少人、是否正在扩大。为了回答这些不同问题，同一条记录可以填写多个项目，这些项目的简短取值通常叫“标签”。\n\n| 谁要使用 | 从同一条反馈中保留什么 | 用来继续哪项工作 |\n| --- | --- | --- |\n| 客服与技术支持 | 初步类别：验证码收发待排查；收到时间、过期提示与原话 | 查发送和接收情况，回复本次客户 |\n| 产品团队 | 受阻步骤：验证码登录；具体困扰：到达时已失效 | 汇总同类反馈，检查登录体验 |\n| 运行负责人 | 发生时间、受影响客户，以及是否反复出现 | 判断是否需要扩大调查、协调处理 |\n\n这些整理沿用同一条原始记录。一次消息说了三件事，可以记多个标签；反复转发的同一条投诉，也要识别为同一次反馈，避免重复计数。若客户后来说“验证码已经收到，但还是提示无权限”，记录就增加权限排查，并保留前面已经处理的情况。\n\n业务人员修正一次分类后，还可以把原话、正确去向和修改理由补进分类说明。再用以前分对的消息和这次新情况检查，确认新方法既能识别变化，也保留原来的判断。这样，模型整理的内容才会随着实际工作改善。\n\n## 摘要怎样帮助交接\n\n一天工作结束，接班同事通常没有时间重读所有聊天。他需要知道已经发生什么、还等什么、自己要做什么。摘要的用途，是让接手者从正确的位置继续。\n\n假设销售在会议中提出“最好下周发货”，交付负责人回答“先查库存，明天再确认”。会后需要交给跟单人员的内容可以是：\n\n| 接手者要知道的事 | 摘要怎样写 | 后续动作 |\n| --- | --- | --- |\n| 客户或销售的期望 | 希望下周发货 | 保留期望，供交付评估 |\n| 当前已作的决定 | 先查库存，发货日期尚未确认 | 暂不向客户承诺下周发货 |\n| 谁继续处理 | 交付负责人明天确认库存与安排 | 跟单人员取得答复后更新计划 |\n\n如果压缩成“计划下周发货”，接手人可能据此通知客户或安排运输。保留“未确认”和“谁来确认”，反而让摘要更有用。整理会议、客户记录或合同讨论时，都应按接手者的任务选择保留内容，而不只追求字数更少。\n\n## 从一张表到程序可以使用的信息\n\n纸质登记表把姓名、电话、地址分开填写，便于不同的人找到所需内容。软件也需要类似的约定。“结构化输出”就是要求模型按约定项目返回内容，例如数量是一项数值，状态选“已明确”“待确认”或“意向”。程序可以据此读取数量进行计算，把待确认事项放进追问清单。\n\n格式检查与业务核对各负责一段。程序可以发现数量一栏填了无法计算的文字，或缺少客户编号；销售则对照原话，确认“两套”有没有被误写成“三套”，客户和产品有没有归错。两段检查完成后，下一岗位才拿到既能被软件读取、又符合本次业务的信息。\n\n首轮改造可选一类高频输入，把接手者真正需要的项目列清楚，用正常、含糊、否定和变更的消息试一轮。比较人工整理与 AI 整理的遗漏、改动及核对时间，还要请接手同事实际处理。若对方仍需重新读全篇、重新问所有问题，就要继续改整理方式。\n\n语言能力的价值，最终落在这段交接里：客户可以按熟悉的方式表达，销售和客服减少抄录与归纳，专业人员得到足以开始工作的材料。企业把“读懂一句话”接成了“继续完成一项工作”。\n"},{"id":"c05","file":"05-推理能力怎样帮助经营判断.md","title":"第5章｜推理能力怎样帮助经营判断","html":"\u003ch1>第5章｜推理能力怎样帮助经营判断\u003c/h1>\n\u003cp>\u003cstrong>AI 推理可以把一个含混的经营难题，展开成条件、选择和后果，让企业更快找到真正需要决定和调查的部分。\u003c/strong>\u003c/p>\n\u003cp>管理者每天都在处理没有标准答案的问题：要不要接一笔低毛利订单，某项服务是否应该外包，渠道销量增长是否值得继续投入。这些问题通常混合着三种东西：已经发生的事实、对未来的判断，以及不同利益之间的取舍。把它们混在一起，AI 很容易给出一份顺畅而无助于决策的分析。\u003c/p>\n\u003ch2>推理怎样发挥作用\u003c/h2>\n\u003cp>模型可以将复杂任务拆成子问题，在给定约束下寻找方案，比较多个选择的后果，检查某个结论是否与条件冲突。经过相应训练、具备推理能力的模型，还可能在回答前花费更多计算，尝试不同路径并修正部分错误。这使它能够参与多步骤问题，而不只是改写现成文字。\u003c/p>\n\u003cp>推理与调查可以交替进行。比较外包方案时，模型根据现有条件推导成本与时间；遇到供应商产能未知，就列出要确认的问题；取得回复后，再更新方案。这个往返让分析始终围绕实际选择推进。\u003c/p>\n\u003cp>可以把 AI 的工作分成四步：重述问题，列出约束，构造选择，寻找会改变结论的证据。第四步尤其值得保留，因为企业决策经常缺少的不是另一个方案，而是对不确定性的认识。\u003c/p>\n\u003ch2>把交付延期问题拆开\u003c/h2>\n\u003cp>设想一项订单临近交付，还有部分生产工作未完成。企业在加班、自有生产加部分外包、与客户协商延期之间选择。这里不必先让 AI 打分，应该先把三条路径写清楚。\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>选择\u003c/th>\n\u003cth>必须确认的条件\u003c/th>\n\u003cth>主要代价\u003c/th>\n\u003cth>可能推翻选择的事实\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>加班完成\u003c/td>\n\u003ctd>关键设备可用，员工能承担，质量检查来得及\u003c/td>\n\u003ctd>加班费用、疲劳和其他订单挤占\u003c/td>\n\u003ctd>瓶颈其实在等待原料，加班不能缩短等待\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>部分外包\u003c/td>\n\u003ctd>对方确有产能，工艺和验收一致，往返运输可控\u003c/td>\n\u003ctd>外包与协调费用，质量和保密安排\u003c/td>\n\u003ctd>样件不能通过，或交付日期没有实际确认\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>协商延期\u003c/td>\n\u003ctd>客户能调整后续计划，双方接受新的安排\u003c/td>\n\u003ctd>客户关系、补偿及后续收入影响\u003c/td>\n\u003ctd>客户下游有不可移动的时间要求\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>AI 可以先根据已有资料整理这张比较表，再追问缺口。它也可以发现：若关键原料三天后才到厂，加班和外包都没有直接解决原料等待。此时决策应回到替代材料、分批交付或客户安排。这就是推理对经营的贡献：暴露原先问题定义里的遗漏。\u003c/p>\n\u003cp>对于尚未取得的报价或产能，可以先算选择发生变化的条件。例如先确定企业可接受的外包成本上限，再询价；或者先列出样件和日期要求，再请供应商确认。模型由此帮助企业把“还不知道”转化成有目的的调查。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"05\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iODE4IiB2aWV3Qm94PSIwIDAgMzYwIDgxOCIgcm9sZT0iaW1nIj48dGl0bGU+5p2h5Lu25oCO5qC35pS55Y+Y57uP6JCl6YCJ5oupPC90aXRsZT48ZGVzYz7lu7bmnJ/pl67popjlhYjmn6XpmZDliLbvvJvljp/mlpnmnKrliLDkuI7lt7LpvZDlr7nlupTkuI3lkIzmlrnmoYjvvIzmqKHlnovluK7liqnlsZXlvIDmnaHku7bkuI7pgInmi6njgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYSIgbWFya2VyV2lkdGg9IjgiIG1hcmtlckhlaWdodD0iOCIgcmVmWD0iNyIgcmVmWT0iNCIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwIEw4IDQgTDAgOCBaIiBmaWxsPSIjMjQ2YTU1Ii8+PC9tYXJrZXI+PC9kZWZzPjxyZWN0IHdpZHRoPSIzNjAiIGhlaWdodD0iODE4IiBmaWxsPSJ3aGl0ZSIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiI+PHRleHQgeD0iMjQiIHk9IjM4IiBmb250LXNpemU9IjI0IiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNjAwIj7mnaHku7bmgI7moLfmlLnlj5jnu4/okKXpgInmi6k8L3RleHQ+PHJlY3QgeD0iMjQiIHk9IjgyIiB3aWR0aD0iMzEyIiBoZWlnaHQ9IjExMyIgcng9IjgiIGZpbGw9IiNlZGYyZjgiIHN0c MDAiPuWQjOS4gOS4quW7tuacn+mXrumimO+8jOWOn+WboOS4jeWQjO+8jOWAvOW+l+avlOi+g+eahOaWueahiOmaj+S5i+aUueWPmOOAgjwvdGV4dD48L2c+PC9zdmc+\" alt=\"同一个延期问题先查原因；原料未到与原料已齐时，需要比较的方案不同。\">\u003c/picture>\u003cfigcaption>\u003cspan>图 5-1\u003c/span>\u003cbutton type=\"button\" class=\"enlarge\" aria-label=\"放大查看图5-1\">放大查看\u003c/button>\u003c/figcaption>\u003c/figure>\n\u003ch2>用竞争解释找到值得调查的事实\u003c/h2>\n\u003cp>经营讨论经常从一个熟悉的解释开始。准备增加销售人员，可能是因为团队觉得现有人员覆盖不过来。AI可以帮助展开其他解释：线索质量、报价速度、产品适配是否也在限制成交。不同解释会指向不同投入。\u003c/p>\n\u003cp>接下来让每个解释对应可检查的记录。若流失主要发生在无人跟进，应看分配和人员负荷；若客户已经沟通充分，却等不到可用报价，应看报价所需信息和专业确认。抽取流失线索沿过程检查，就能够缩小争议。\u003c/p>\n\u003cp>推理在这里发挥的是组织调查的作用：先提出几种有业务依据的解释，再说明什么事实支持哪一种。它使下一场会议有更具体的材料，也让企业知道新增人员、改流程或改产品分别准备解决什么。\u003c/p>\n\u003ch2>方案排序藏着企业的价值取舍\u003c/h2>\n\u003cp>成本、交期和风险经常需要取舍。模型可以把不同选择的代价与后果列在一起，企业据此确定优先级。某个重要客户值得投入多少额外资源，现金紧张时怎样安排账期，这些经营政策会直接改变方案排序。\u003c/p>\n\u003cp>因此，给 AI 一个决策任务时，应明确硬约束和可协商条件。硬约束先筛掉不可行方案，例如必要质量要求；可协商条件用于比较剩余方案，例如批次和交付方式。模型先按这两层处理，企业看到的就是一组可讨论的选择。\u003c/p>\n\u003cp>决定形成后，把采用的事实、推导依据和企业取舍一起保存。以后供应商价格改变或客户允许分批，团队可以找到受影响的条件，重新判断方案。涉及专业责任的结论由相应人员确认。\u003c/p>\n\u003ch2>企业可以怎样使用这项能力\u003c/h2>\n\u003cp>推理尤其适合进入经营会议之前：整理材料、预演方案、找出争议点，让参与者带着明确的问题开会。它也适合会议之后：把决定还原成理由、前提和后续验证，便于条件变化时重看。\u003c/p>\n\u003cp>企业可以观察重大遗漏是否更早被发现、争论是否更快转成调查、关键决定能否找到理由。更进一步，团队能够在相似条件下沿用同样的判断方法，管理者也能把一部分分析准备交给团队完成。\u003c/p>\n","text":"# 第5章｜推理能力怎样帮助经营判断\n\n**AI 推理可以把一个含混的经营难题，展开成条件、选择和后果，让企业更快找到真正需要决定和调查的部分。**\n\n管理者每天都在处理没有标准答案的问题：要不要接一笔低毛利订单，某项服务是否应该外包，渠道销量增长是否值得继续投入。这些问题通常混合着三种东西：已经发生的事实、对未来的判断，以及不同利益之间的取舍。把它们混在一起，AI 很容易给出一份顺畅而无助于决策的分析。\n\n## 推理怎样发挥作用\n\n模型可以将复杂任务拆成子问题，在给定约束下寻找方案，比较多个选择的后果，检查某个结论是否与条件冲突。经过相应训练、具备推理能力的模型，还可能在回答前花费更多计算，尝试不同路径并修正部分错误。这使它能够参与多步骤问题，而不只是改写现成文字。\n\n推理与调查可以交替进行。比较外包方案时，模型根据现有条件推导成本与时间；遇到供应商产能未知，就列出要确认的问题；取得回复后，再更新方案。这个往返让分析始终围绕实际选择推进。\n\n可以把 AI 的工作分成四步：重述问题，列出约束，构造选择，寻找会改变结论的证据。第四步尤其值得保留，因为企业决策经常缺少的不是另一个方案，而是对不确定性的认识。\n\n## 把交付延期问题拆开\n\n设想一项订单临近交付，还有部分生产工作未完成。企业在加班、自有生产加部分外包、与客户协商延期之间选择。这里不必先让 AI 打分，应该先把三条路径写清楚。\n\n| 选择 | 必须确认的条件 | 主要代价 | 可能推翻选择的事实 |\n| --- | --- | --- | --- |\n| 加班完成 | 关键设备可用，员工能承担，质量检查来得及 | 加班费用、疲劳和其他订单挤占 | 瓶颈其实在等待原料，加班不能缩短等待 |\n| 部分外包 | 对方确有产能，工艺和验收一致，往返运输可控 | 外包与协调费用，质量和保密安排 | 样件不能通过，或交付日期没有实际确认 |\n| 协商延期 | 客户能调整后续计划，双方接受新的安排 | 客户关系、补偿及后续收入影响 | 客户下游有不可移动的时间要求 |\n\nAI 可以先根据已有资料整理这张比较表，再追问缺口。它也可以发现：若关键原料三天后才到厂，加班和外包都没有直接解决原料等待。此时决策应回到替代材料、分批交付或客户安排。这就是推理对经营的贡献：暴露原先问题定义里的遗漏。\n\n对于尚未取得的报价或产能，可以先算选择发生变化的条件。例如先确定企业可接受的外包成本上限，再询价；或者先列出样件和日期要求，再请供应商确认。模型由此帮助企业把“还不知道”转化成有目的的调查。\n\n![同一个延期问题先查原因；原料未到与原料已齐时，需要比较的方案不同。](assets/05.svg)\n\n## 用竞争解释找到值得调查的事实\n\n经营讨论经常从一个熟悉的解释开始。准备增加销售人员，可能是因为团队觉得现有人员覆盖不过来。AI可以帮助展开其他解释：线索质量、报价速度、产品适配是否也在限制成交。不同解释会指向不同投入。\n\n接下来让每个解释对应可检查的记录。若流失主要发生在无人跟进，应看分配和人员负荷；若客户已经沟通充分，却等不到可用报价，应看报价所需信息和专业确认。抽取流失线索沿过程检查，就能够缩小争议。\n\n推理在这里发挥的是组织调查的作用：先提出几种有业务依据的解释，再说明什么事实支持哪一种。它使下一场会议有更具体的材料，也让企业知道新增人员、改流程或改产品分别准备解决什么。\n\n## 方案排序藏着企业的价值取舍\n\n成本、交期和风险经常需要取舍。模型可以把不同选择的代价与后果列在一起，企业据此确定优先级。某个重要客户值得投入多少额外资源，现金紧张时怎样安排账期，这些经营政策会直接改变方案排序。\n\n因此，给 AI 一个决策任务时，应明确硬约束和可协商条件。硬约束先筛掉不可行方案，例如必要质量要求；可协商条件用于比较剩余方案，例如批次和交付方式。模型先按这两层处理，企业看到的就是一组可讨论的选择。\n\n决定形成后，把采用的事实、推导依据和企业取舍一起保存。以后供应商价格改变或客户允许分批，团队可以找到受影响的条件，重新判断方案。涉及专业责任的结论由相应人员确认。\n\n## 企业可以怎样使用这项能力\n\n推理尤其适合进入经营会议之前：整理材料、预演方案、找出争议点，让参与者带着明确的问题开会。它也适合会议之后：把决定还原成理由、前提和后续验证，便于条件变化时重看。\n\n企业可以观察重大遗漏是否更早被发现、争论是否更快转成调查、关键决定能否找到理由。更进一步，团队能够在相似条件下沿用同样的判断方法，管理者也能把一部分分析准备交给团队完成。"},{"id":"c06","file":"06-检索研究怎样成为可靠情报.md","title":"第6章｜检索研究怎样成为可靠情报","html":"\u003ch1>第6章｜检索研究怎样成为可靠情报\u003c/h1>\n\u003cp>\u003cstrong>AI把收集、阅读和对照资料的成本降下来，使企业能够更频繁地带着证据作决定。研究工作的关键，是把一个经营问题转成需要调查的事实，再把事实组织成可采用的建议。\u003c/strong>\u003c/p>\n\u003cp>搜索工具可以取回新资料，模型可以读材料、比较观点、整理时间线。这几种能力结合后，竞争研究、客户准备、技术选型和行业跟踪都更容易开展。过去只有重要项目才值得做的资料工作，现在可能成为日常经营能力。\u003c/p>\n\u003cp>日常选家电也会经历类似过程。想给小厨房买冰箱，先量可放尺寸，再查产品尺寸和开门空间；评论里说“很大”不够，还要对照具体规格，最后决定买哪款或去店里确认。企业研究同样先明确要作什么决定，再找能改变这个决定的材料。搜集到的每条信息，都应知道准备用来回答哪个问题。\u003c/p>\n\u003ch2>先把经营问题改写成证据需要\u003c/h2>\n\u003cp>“帮我研究一下这个行业”范围过大。AI 往往会交出规模、趋势、竞争格局和建议，看起来齐全，却无法决定下一步。若真实问题是“我们是否应该进入某区域提供设备维护服务”，至少要拆成需求、购买者、竞争供给、履约条件和经济性几个方面。\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>待判断问题\u003c/th>\n\u003cth>可以公开调查\u003c/th>\n\u003cth>需要结合本地业务取得\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>当地是否有需求\u003c/td>\n\u003ctd>设备类型、企业分布、公开采购信息\u003c/td>\n\u003ctd>客户故障、维护频率与实际需求\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>谁会购买\u003c/td>\n\u003ctd>企业结构、采购流程与现有供应商线索\u003c/td>\n\u003ctd>决策者、预算与更换条件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>我们能否交付\u003c/td>\n\u003ctd>地理范围、同行服务方式、相关产品\u003c/td>\n\u003ctd>人员技能、备件与响应安排\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>是否值得经营\u003c/td>\n\u003ctd>竞争价格、服务组合与行业特点\u003c/td>\n\u003ctd>可达客户、履约成本与收款条件\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>AI 可以据此形成检索计划：哪些问题能够公开查询，哪些只能通过访谈或企业自身记录回答。公开研究无法代替客户验证，但可以减少没有准备的拜访，并使访谈问题更具体。\u003c/p>\n\u003ch2>从材料到结论，中间要做哪些核对\u003c/h2>\n\u003cp>首先查找原始发布者。产品功能尽量查官方说明，企业经营信息区分公告和媒体推测，调查数据查看调查对象及方法。十篇文章转载同一份报告，仍可能只有一个证据来源。AI 应帮助识别引用链，而不是把转载次数当成可信程度。\u003c/p>\n\u003cp>其次对齐时间与口径。某个产品三个月前没有的功能，今天可能已经上线；某项行业数字可能统计的是出货量，另一项统计的是销售额。将两者排在同一张表里并不会让它们可比。研究表应保留发布日期、事件发生时间、统计范围和单位，遇到不一致时明确说明。\u003c/p>\n\u003cp>再次处理相互冲突的信息。一家公司声称服务覆盖全国，客户评论却抱怨某地响应很慢，两条信息未必互相否定：前者可能指可以接单，后者描述实际交付。应区分声明、观察和推断，并追问什么证据能够确认当前任务关心的能力。\u003c/p>\n\u003cp>最后，将结论与证据范围对齐。少量公开案例可以帮助识别使用方式，进一步判断普及程度则需要更广的资料。若决定最依赖的事实尚未取得，研究应把下一轮访谈或测试的问题列清楚。\u003c/p>\n\u003ch2>一份可用的竞争情报应该怎样写\u003c/h2>\n\u003cp>假定企业准备比较三种客户服务软件。先写当前工作：谁接客户请求，哪些请求必须查内部订单，哪些回复需要批准，最终记录回到哪里。由此形成一条共同任务，再逐一比较产品怎样完成。\u003c/p>\n\u003cp>接着按同样的任务比较产品。某软件能生成回复，却不能读取本企业订单；另一软件提供程序读取订单的入口，通常叫“接口”，但当前购买版本不开放；第三种看似功能较少，却能在现有平台完成所需操作。这些差异会改变实际选择，而不只是页面上的功能数量。\u003c/p>\n\u003cp>研究结论可以直接形成试用安排：方案甲作为订单查询候选，技术人员先确认能否使用只查询、不修改订单的接口；方案乙作为人工衔接候选，业务人员测一次查单和回复所需时间。如果还希望软件处理退款，就另试一笔退款任务：谁批准、款项怎样处理、结果是否写回订单，都要逐项核对。这样，功能比较就进入了企业可以推进的下一步。\u003c/p>\n\u003cp>这项工作交给 AI 时，负责人先提供当前客服怎样查订单、员工使用什么账号、准备解决哪种请求。模型据此列出调查问题，搜索工具取回产品说明，模型再摘出相关内容并标明产品版本。技术人员核实本企业账号是否能够接入，客服拿同一笔任务试用。最终交出的比较表，应能让采购负责人决定谁进入下一轮试用。\u003c/p>\n 值。\u003c/p>\n\u003cp>跟踪也需要成本控制。明确触发条件、检索范围和通知门槛，避免每次更新都被包装成重要趋势。AI 对公开材料的解释应与销售一线、客户服务和实际交易数据相互校正。\u003c/p>\n\u003cp>企业建立研究能力，目的在于提高决定的依据质量。能查到的信息越来越便宜，能够提出正确问题、识别适用条件，并愿意根据证据改变决定，才决定这些信息是否产生经营价值。\u003c/p>\n","text":"# 第6章｜检索研究怎样成为可靠情报\n\n**AI把收集、阅读和对照资料的成本降下来，使企业能够更频繁地带着证据作决定。研究工作的关键，是把一个经营问题转成需要调查的事实，再把事实组织成可采用的建议。**\n\n搜索工具可以取回新资料，模型可以读材料、比较观点、整理时间线。这几种能力结合后，竞争研究、客户准备、技术选型和行业跟踪都更容易开展。过去只有重要项目才值得做的资料工作，现在可能成为日常经营能力。\n\n日常选家电也会经历类似过程。想给小厨房买冰箱，先量可放尺寸，再查产品尺寸和开门空间；评论里说“很大”不够，还要对照具体规格，最后决定买哪款或去店里确认。企业研究同样先明确要作什么决定，再找能改变这个决定的材料。搜集到的每条信息，都应知道准备用来回答哪个问题。\n\n## 先把经营问题改写成证据需要\n\n“帮我研究一下这个行业”范围过大。AI 往往会交出规模、趋势、竞争格局和建议，看起来齐全，却无法决定下一步。若真实问题是“我们是否应该进入某区域提供设备维护服务”，至少要拆成需求、购买者、竞争供给、履约条件和经济性几个方面。\n\n| 待判断问题 | 可以公开调查 | 需要结合本地业务取得 |\n| --- | --- | --- |\n| 当地是否有需求 | 设备类型、企业分布、公开采购信息 | 客户故障、维护频率与实际需求 |\n| 谁会购买 | 企业结构、采购流程与现有供应商线索 | 决策者、预算与更换条件 |\n| 我们能否交付 | 地理范围、同行服务方式、相关产品 | 人员技能、备件与响应安排 |\n| 是否值得经营 | 竞争价格、服务组合与行业特点 | 可达客户、履约成本与收款条件 |\n\nAI 可以据此形成检索计划：哪些问题能够公开查询，哪些只能通过访谈或企业自身记录回答。公开研究无法代替客户验证，但可以减少没有准备的拜访，并使访谈问题更具体。\n\n## 从材料到结论，中间要做哪些核对\n\n首先查找原始发布者。产品功能尽量查官方说明，企业经营信息区分公告和媒体推测，调查数据查看调查对象及方法。十篇文章转载同一份报告，仍可能只有一个证据来源。AI 应帮助识别引用链，而不是把转载次数当成可信程度。\n\n其次对齐时间与口径。某个产品三个月前没有的功能，今天可能已经上线；某项行业数字可能统计的是出货量，另一项统计的是销售额。将两者排在同一张表里并不会让它们可比。研究表应保留发布日期、事件发生时间、统计范围和单位，遇到不一致时明确说明。\n\n再次处理相互冲突的信息。一家公司声称服务覆盖全国，客户评论却抱怨某地响应很慢，两条信息未必互相否定：前者可能指可以接单，后者描述实际交付。应区分声明、观察和推断，并追问什么证据能够确认当前任务关心的能力。\n\n最后，将结论与证据范围对齐。少量公开案例可以帮助识别使用方式，进一步判断普及程度则需要更广的资料。若决定最依赖的事实尚未取得，研究应把下一轮访谈或测试的问题列清楚。\n\n## 一份可用的竞争情报应该怎样写\n\n假定企业准备比较三种客户服务软件。先写当前工作：谁接客户请求，哪些请求必须查内部订单，哪些回复需要批准，最终记录回到哪里。由此形成一条共同任务，再逐一比较产品怎样完成。\n\n接着按同样的任务比较产品。某软件能生成回复，却不能读取本企业订单；另一软件提供程序读取订单的入口，通常叫“接口”，但当前购买版本不开放；第三种看似功能较少，却能在现有平台完成所需操作。这些差异会改变实际选择，而不只是页面上的功能数量。\n\n研究结论可以直接形成试用安排：方案甲作为订单查询候选，技术人员先确认能否使用只查询、不修改订单的接口；方案乙作为人工衔接候选，业务人员测一次查单和回复所需时间。如果还希望软件处理退款，就另试一笔退款任务：谁批准、款项怎样处理、结果是否写回订单，都要逐项核对。这样，功能比较就进入了企业可以推进的下一步。\n\n这项工作交给 AI 时，负责人先提供当前客服怎样查订单、员工使用什么账号、准备解决哪种请求。模型据此列出调查问题，搜索工具取回产品说明，模型再摘出相关内容并标明产品版本。技术人员核实本企业账号是否能够接入，客服拿同一笔任务试用。最终交出的比较表，应能让采购负责人决定谁进入下一轮试用。\n\n![从客服查单需求出发，公开说明与实际账号核实汇合到共同任务试用，再形成采购的下一步。](assets/06.svg)\n\n研究底稿保留页面、时间、关键摘录与采用理由。资料变化后，负责人可以沿这些位置更新受影响的判断；新同事也能理解当时为何选择这个方向。\n\n## 哪些工作适合持续交给 AI\n\n稳定的问题适合做持续跟踪：核心供应商的产品变更、重要客户的公开动态、竞争者的新服务、与业务相关的技术进展。每次运行比较“相对上次发生了什么，以及是否影响原决定”，比不断生成新的行业综述更有价值。\n\n跟踪也需要成本控制。明确触发条件、检索范围和通知门槛，避免每次更新都被包装成重要趋势。AI 对公开材料的解释应与销售一线、客户服务和实际交易数据相互校正。\n\n企业建立研究能力，目的在于提高决定的依据质量。能查到的信息越来越便宜，能够提出正确问题、识别适用条件，并愿意根据证据改变决定，才决定这些信息是否产生经营价值。\n"},{"id":"c07","file":"07-多模态能力怎样读取业务现场.md","title":"第7章｜多模态能力怎样读取业务现场","html":"\u003ch1>第7章｜多模态能力怎样读取业务现场\u003c/h1>\n\u003cp>\u003cstrong>多模态能力让照片、声音、视频和扫描文件直接参与业务处理。它减少了现场信息进入系统之前的人工转录，使企业能更及时地理解和利用原本分散的材料。\u003c/strong>\u003c/p>\n\u003cp>“多模态”指系统能够处理不止一种信息形式。例如从图片中识别文字和物体，从录音中转写对话，结合图纸与说明理解要求，或者分析视频中的一段动作。不同任务可采用通用模型、专门识别工具或二者配合，具体选择取决于输入与精度要求。\u003c/p>\n\u003cp>它对企业的意义在于，许多工作原本就不以标准表格存在：客户发来的现场照片、员工口述、纸质记录、设备视频、带批注的方案。过去要先由人逐一整理，现在部分整理工作可以提前交给 AI。\u003c/p>\n\u003ch2>从现场材料中取得什么\u003c/h2>\n\u003cp>报修时，客户常常直接拍一张设备照片发来。客服需要先知道是哪台设备、哪里出现异常，维修人员才能准备工具和安排检查。如果只把照片转到维修群里，每位接手者又要问一遍型号和故障发生时间。\u003c/p>\n\u003cp>AI 可以先读取照片中清晰的型号，再结合客户描述填写报修记录，并把型号对应的照片区域附在旁边。客服核对设备，补问故障时间后交给维修人员。这个过程类似把一张购物小票整理成家庭账本：先看清每行内容，再把金额归到正确项目；文字看清了，还要确认没有抄到相邻的一行。\u003c/p>\n\u003cp>可以把工作分成发现、提取和判断。报修照片先帮助识别设备与明显现象，铭牌区域提供型号，维修记录补充历史；专业人员据此决定进一步检查什么。每一步都在减少后续需要重新收集的信息。\u003c/p>\n\u003cp>提取要求决定采集方式。读取铭牌，可以要求拍清型号区域；分析复杂表格，需要保留足够分辨率和完整行列；需要精确尺寸时，则采用相应测量工具。遮挡、视角和输入质量会影响识别，采集规范与模型选择需要一起设计。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"07\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iODg1IiB2aWV3Qm94PSIwIDAgMzYwIDg4NSIgcm9sZT0iaW1nIj48dGl0bGU+546w5Zy65L+h5oGv5oCO5qC35oiQ5Li65L6d5o2uPC90aXRsZT48ZGVzYz7nhafniYfkuI7lvZXpn7Pnu4/mj5Dlj5blvaLmiJDlgJnpgInkuovlrp7vvIzkv53nlZnkvY3nva7kvr/kuo7moLjlr7nvvIzlho3kuqTnu5nnm7jlupTku7vliqHlpITnkIbjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYSIgbWFya2VyV2lkdGg9IjgiIG1hcmtlckhlaWdodD0iOCIgcmVmWD0iNyIgcmVmWT0iNCIgb3JpZW50PSJhdXRvIj48cGF0aC 3cth>应留下什么\u003c/th>\n\u003cth>主要错误\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>确认接收范围\u003c/td>\n\u003ctd>文件名、页数、缺页和不可读页\u003c/td>\n\u003ctd>只读预览页却声称已读全文\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>识别文字与区域\u003c/td>\n\u003ctd>原页、区域位置和候选文本\u003c/td>\n\u003ctd>小字、旋转、印章与手写混淆\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>还原关系\u003c/td>\n\u003ctd>表格行列、标题归属、批注对应项\u003c/td>\n\u003ctd>把相邻产品或条件串错\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>形成业务信息\u003c/td>\n\u003ctd>字段、依据位置、待确认项\u003c/td>\n\u003ctd>把看不清的数字补成确定值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接续工作\u003c/td>\n\u003ctd>人员核对后进入相应记录\u003c/td>\n\u003ctd>候选结果未经确认直接触发承诺\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>关键字段保留原页或相应区域，复核者便能直接跳到要检查的位置。看不清的项目集中列出，请提交者重拍、补页或确认。一份结构化结果加上少量待确认位置，可以把从头阅读变成有目标的核对。\u003c/p>\n\u003ch2>语音转写也会改变事实\u003c/h2>\n\u003cp>录音里的“先别下单，等财务确认”如果漏掉一个“别”字，后续工作会完全不同。多人同时说话、口音、专业名称和背景噪声都可能影响转写。即使文字准确，谁说的、说的是提议还是正式决定，也需要区分。\u003c/p>\n\u003cp>会议处理可以先得到可回听的转写，再提取议题、决定、负责人和未决项。记录中保留相关时间片段，负责人集中确认会改变生产或客户安排的决定，其余人员据此接续工作。建议和正式决定的区别，可沿用第4章的信息状态设计。\u003c/p>\n\u003cp>原先从头回听、记录和分派的过程，由此变成检查关键片段与确认行动。实际节省多少时间，可以同时记录转写、核对和补充工作来判断。\u003c/p>\n\u003ch2>把不同形式的信息连起来\u003c/h2>\n\u003cp>多模态的进一步价值来自互相补充。一张照片显示设备状态，一段描述说明发生时间，系统记录显示型号和维修历史。单独看照片可能只能提出几个候选原因，结合这些材料才能安排更有针对性的检查。\u003c/p>\n\u003cp>综合结果可以明确列出照片观察、系统历史和分析判断。维修人员既看到候选原因，也能追到原始依据，在新增检测结果后继续缩小原因范围。\u003c/p>\n\u003cp>对于高精度计量、专业检测等任务，应判断是否需要专门传感器、算法或合格人员。通用模型可以帮助解释检测结果和整理资料，未必适合替代测量本身。最合适的方案可能是专业设备产出可靠数据，AI 负责接续说明与任务组织。\u003c/p>\n\u003ch2>管理者怎样判断一个视觉演示\u003c/h2>\n\u003cp>可以请提供方用本企业真实但已妥善处理的材料试一次：清晰材料、模糊材料、相似型号、多页表格各选一些。观察它是否主动暴露不可读部分，能否定位原始依据，以及错误发生后有没有可行的补正方式。\u003c/p>\n\u003cp>根据试用结果确定拍摄规范、字段核对和异常接手，再逐步增加材料范围。多模态的可用性来自模型与现场采集方式的配合；企业在采集端做好一点工作，往往能减少后面大量辨认与纠错。\u003c/p>\n","text":"# 第7章｜多模态能力怎样读取业务现场\n\n**多模态能力让照片、声音、视频和扫描文件直接参与业务处理。它减少了现场信息进入系统之前的人工转录，使企业能更及时地理解和利用原本分散的材料。**\n\n“多模态”指系统能够处理不止一种信息形式。例如从图片中识别文字和物体，从录音中转写对话，结合图纸与说明理解要求，或者分析视频中的一段动作。不同任务可采用通用模型、专门识别工具或二者配合，具体选择取决于输入与精度要求。\n\n它对企业的意义在于，许多工作原本就不以标准表格存在：客户发来的现场照片、员工口述、纸质记录、设备视频、带批注的方案。过去要先由人逐一整理，现在部分整理工作可以提前交给 AI。\n\n## 从现场材料中取得什么\n\n报修时，客户常常直接拍一张设备照片发来。客服需要先知道是哪台设备、哪里出现异常，维修人员才能准备工具和安排检查。如果只把照片转到维修群里，每位接手者又要问一遍型号和故障发生时间。\n\nAI 可以先读取照片中清晰的型号，再结合客户描述填写报修记录，并把型号对应的照片区域附在旁边。客服核对设备，补问故障时间后交给维修人员。这个过程类似把一张购物小票整理成家庭账本：先看清每行内容，再把金额归到正确项目；文字看清了，还要确认没有抄到相邻的一行。\n\n可以把工作分成发现、提取和判断。报修照片先帮助识别设备与明显现象，铭牌区域提供型号，维修记录补充历史；专业人员据此决定进一步检查什么。每一步都在减少后续需要重新收集的信息。\n\n提取要求决定采集方式。读取铭牌，可以要求拍清型号区域；分析复杂表格，需要保留足够分辨率和完整行列；需要精确尺寸时，则采用相应测量工具。遮挡、视角和输入质量会影响识别，采集规范与模型选择需要一起设计。\n\n![现场材料保留原始位置，提取信息并进入核对与业务处理。](assets/07.svg)\n\n## 处理一份复杂文件，难点通常在哪里\n\n设想客户提交了一份扫描文件：上方是产品型号，中间是不同配置的表格，底部有手写修改。AI 可能读对每个字，却把第二行的价格配给第一行产品。文字识别正确和关系理解正确是两次判断。\n\n| 处理步骤 | 应留下什么 | 主要错误 |\n| --- | --- | --- |\n| 确认接收范围 | 文件名、页数、缺页和不可读页 | 只读预览页却声称已读全文 |\n| 识别文字与区域 | 原页、区域位置和候选文本 | 小字、旋转、印章与手写混淆 |\n| 还原关系 | 表格行列、标题归属、批注对应项 | 把相邻产品或条件串错 |\n| 形成业务信息 | 字段、依据位置、待确认项 | 把看不清的数字补成确定值 |\n| 接续工作 | 人员核对后进入相应记录 | 候选结果未经确认直接触发承诺 |\n\n关键字段保留原页或相应区域，复核者便能直接跳到要检查的位置。看不清的项目集中列出，请提交者重拍、补页或确认。一份结构化结果加上少量待确认位置，可以把从头阅读变成有目标的核对。\n\n## 语音转写也会改变事实\n\n录音里的“先别下单，等财务确认”如果漏掉一个“别”字，后续工作会完全不同。多人同时说话、口音、专业名称和背景噪声都可能影响转写。即使文字准确，谁说的、说的是提议还是正式决定，也需要区分。\n\n会议处理可以先得到可回听的转写，再提取议题、决定、负责人和未决项。记录中保留相关时间片段，负责人集中确认会改变生产或客户安排的决定，其余人员据此接续工作。建议和正式决定的区别，可沿用第4章的信息状态设计。\n\n原先从头回听、记录和分派的过程，由此变成检查关键片段与确认行动。实际节省多少时间，可以同时记录转写、核对和补充工作来判断。\n\n## 把不同形式的信息连起来\n\n多模态的进一步价值来自互相补充。一张照片显示设备状态，一段描述说明发生时间，系统记录显示型号和维修历史。单独看照片可能只能提出几个候选原因，结合这些材料才能安排更有针对性的检查。\n\n综合结果可以明确列出照片观察、系统历史和分析判断。维修人员既看到候选原因，也能追到原始依据，在新增检测结果后继续缩小原因范围。\n\n对于高精度计量、专业检测等任务，应判断是否需要专门传感器、算法或合格人员。通用模型可以帮助解释检测结果和整理资料，未必适合替代测量本身。最合适的方案可能是专业设备产出可靠数据，AI 负责接续说明与任务组织。\n\n## 管理者怎样判断一个视觉演示\n\n可以请提供方用本企业真实但已妥善处理的材料试一次：清晰材料、模糊材料、相似型号、多页表格各选一些。观察它是否主动暴露不可读部分，能否定位原始依据，以及错误发生后有没有可行的补正方式。\n\n根据试用结果确定拍摄规范、字段核对和异常接手，再逐步增加材料范围。多模态的可用性来自模型与现场采集方式的配合；企业在采集端做好一点工作，往往能减少后面大量辨认与纠错。"},{"id":"c08","file":"08-数据分析怎样从问数走向解释.md","title":"第8章｜数据分析怎样从问数走向解释","html":"\u003ch1>第8章｜数据分析怎样从问数走向解释\u003c/h1>\n\u003cp>\u003cstrong>AI让业务人员能用自己的问题启动查询、计算和绘图，缩短经营疑问与数据分析之间的距离。要用好这项能力，需要把业务定义、实际计算和原因分析连成一个过程。\u003c/strong>\u003c/p>\n\u003cp>过去，业务人员想了解一项变化，常要请人取数、整理表格、写查询，再反复解释需求。具备工具能力的 AI 可以把自然语言转成查询或程序，执行计算，检查部分错误并绘图。这会缩短业务问题与数据分析之间的距离，也使一些临时问题值得被认真调查。\u003c/p>\n\u003cp>首先需要把业务语言与数据含义对应起来。订单、客户、收入和线索在不同系统中可能采用不同定义，企业应明确哪些记录回答哪个问题。定义固定以后，AI可以帮助更多人调用同一套分析方法。\u003c/p>\n\u003ch2>一次分析要经过哪些环节\u003c/h2>\n\u003cp>设想一家门店的管理者在月会上问：“本月新客户比上月多了多少？”负责统计的同事先问清，“新客户”是本月第一次留电话的人，还是第一次付款的人。确认按首次付款计算后，再从订单记录里找到这两个月各自首次付款的客户，分别计数，把差额交给管理者。这几步确定了问题的真正含义。\u003c/p>\n\u003cp>由 AI 协助时，业务负责人把“按客户首次付款计算”的口径提供给应用，模型据此提出查询要求，已连接的工具到订单系统取记录并计算。结果返回后，模型再说明两个月的人数和差额。负责人可以抽看几位客户的首单，确认没有把同一个人的复购重复计为新客户。这里的“查询”，就是让程序按指定条件从记录中找出需要的部分。\u003c/p>\n\u003cp>这与算家庭买菜支出很接近：先确定只算食品，再把两个月的小票按同样规则归类、相加，最后比较。家人把同一张小票拍照发了两次，不能因此算两笔。企业分析同样需要明确哪些记录是一回事、哪些应分别计算。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"08\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iODc1IiB2aWV3Qm94PSIwIDAgMzYwIDg3NSIgcm9sZT0iaW1nIj48dGl0bGU+5paw5a6i5oi35Lq65pWw5oCO5qC35p+l5Ye65p2lPC90aXRsZT48ZGVzYz7pl67popjnu4/kuJrliqHlrprkuYnovazmiJDorqLljZXmn6Xor6LkuI7lrp7pmYXorqHnrpfvvIzmoLjlr7npppbljZXlkozojIPlm7TlkI7lkYjnjrDmr5TovoPjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYSIgbWFya2VyV2lkdGg9IjgiIG1hcmtlckhlaWdodD0iOCIgcmVmWD0iNyIgcmVmWT0iNCIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwIEw4IDQgTDAgOCBaIiBmaWxsPSIjMjQ2YTU1Ii8+PC9tYXJrZXI+PC9kZWZzPjxyZWN0IHdpZHRoPSIzNjAiIGhlaWdodD0iODc1IiBmaWxsPSJ3aGl0ZSIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiI+PHRleHQgeD0iMjQiIHk9IjM4IiBmb250LXNpemU9IjI0IiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNjAwIj7mlrDlrqLmiLfkurrmlbDmgI7moLfmn6Xlh7rmnaU8L3RleHQ+PHRleHQgeD0iMjQiIHk9IjcxIiBmb250LXNpemU9IjE4IiBmaWxsPSIjNjE3MTZiIiBmb250LXdlaWdodD0iNDAwIj7npLrmhI/vvJrmjInpppbmrKHku5jmrL7or4bliKvmlrDlrqLmiLc8L3RleHQ+PHJlY3QgeD0iMjQiIHk9IjEyNCIgd2lkdGg9IjMxMiIgaGVpZ2h0PSIxMTMiIHJ4PSI4IiBmaWxsPSIjZWRmMmY4IiBzdHJva2U9IiNkNWUwZGEiIHN0cm9rZS13aWR0aD0iMS40Ii8+PHRleHQgeD0iNDAiIHk9 /td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>这些线索中最终成交\u003c/td>\n\u003ctd>200条\u003c/td>\n\u003ctd>300条\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>转化率\u003c/td>\n\u003ctd>20%\u003c/td>\n\u003ctd>15%\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>成交增加了100条，转化率下降了5个百分点。两句话都成立。若老板只问“销售是不是做得更好了”，AI 不能仅凭成交增长作肯定回答。可能是投放扩大带来了更多低意向线索，也可能是销售跟进能力没有同步增加，或者本月线索尚未走完正常成交周期。\u003c/p>\n\u003cp>要判断转化变化，可以先按来源、客户类型和跟进阶段拆分，再对齐观察窗口。例如上月线索已观察60天、本月只观察10天时，可以先比较两批线索在前10天的阶段推进，待本月走完周期再比较最终成交。问题被定义得更具体，数据才有可比意义。\u003c/p>\n\u003cp>这里还有一个常用表达区别：从20%到15%，是下降5个百分点，相对降幅为25%。报告选用哪种表达，就把对应分母写清楚。\u003c/p>\n\u003ch2>为什么相关变化不能直接说明原因\u003c/h2>\n\u003cp>假设培训后成交率上升。培训可能有效，也可能刚好遇到旺季、价格调整或更高质量的线索。仅靠时间先后，无法确认改善由培训造成。\u003c/p>\n\u003cp>AI 可以提出竞争解释，再帮助寻找证据：受训与未受训团队是否面对相似客户；培训前趋势是否一致；是否同时改变了分配规则；样本是否足够。条件允许时，可以设计小范围对照或分批实施。条件不允许时，应承认结论只是观察关联，并把后续验证写清楚。\u003c/p>\n\u003cp>经营往往需要在调查尚未完成时行动。此时可以选择投入较小、容易观察和调整的做法，同时记录采用的解释。后续数据回来，团队便知道应该扩大、修正还是换一种方案。\u003c/p>\n\u003ch2>让分析可以复查\u003c/h2>\n\u003cp>一份经营分析至少要保留问题、数据范围、指标定义、实际查询或程序、运行时间和结果。关键指标应能抽取少量原始记录核对，确认没有重复连接、漏项或错误过滤。\u003c/p>\n\u003cp>例如，一家客户公司有两位联系人，但只下了一笔1万元订单。若查询时把两位联系人各配上这笔订单，再合计金额，就会得到2万元。应按同一笔订单只计一次，而不是按联系人数累加。抽查这样一位客户，把查询结果与原订单对照，就能发现问题。程序是否报错与统计关系是否符合业务，是两项都需要核对的事。\u003c/p>\n\u003cp>图表也要服务于判断。绝对数量与比例可以分开展示，截短坐标、缺失月份和样本变化应说明。AI 能生成多种图，并不意味着每一种都值得放进报告。\u003c/p>\n\u003ch2>从一次问数到企业分析能力\u003c/h2>\n\u003cp>有反复使用价值的指标，应把定义与取数方式固定下来，由业务负责人确认，再开放给团队。临时探索则保留灵活性，但明确标记尚未成为正式口径。这样既不必每个问题都从零开始，也不会把一次临时分析变成未经确认的经营事实。\u003c/p>\n\u003cp>经营分析的终点，是让某个决定更具体：该调查哪类客户，该改哪个步骤，该如何安排一次验证。企业把常用定义和分析方法积累下来，临时问数就能逐步发展为日常判断能力。\u003c/p>\n","text":"# 第8章｜数据分析怎样从问数走向解释\n\n**AI让业务人员能用自己的问题启动查询、计算和绘图，缩短经营疑问与数据分析之间的距离。要用好这项能力，需要把业务定义、实际计算和原因分析连成一个过程。**\n\n过去，业务人员想了解一项变化，常要请人取数、整理表格、写查询，再反复解释需求。具备工具能力的 AI 可以把自然语言转成查询或程序，执行计算，检查部分错误并绘图。这会缩短业务问题与数据分析之间的距离，也使一些临时问题值得被认真调查。\n\n首先需要把业务语言与数据含义对应起来。订单、客户、收入和线索在不同系统中可能采用不同定义，企业应明确哪些记录回答哪个问题。定义固定以后，AI可以帮助更多人调用同一套分析方法。\n\n## 一次分析要经过哪些环节\n\n设想一家门店的管理者在月会上问：“本月新客户比上月多了多少？”负责统计的同事先问清，“新客户”是本月第一次留电话的人，还是第一次付款的人。确认按首次付款计算后，再从订单记录里找到这两个月各自首次付款的客户，分别计数，把差额交给管理者。这几步确定了问题的真正含义。\n\n由 AI 协助时，业务负责人把“按客户首次付款计算”的口径提供给应用，模型据此提出查询要求，已连接的工具到订单系统取记录并计算。结果返回后，模型再说明两个月的人数和差额。负责人可以抽看几位客户的首单，确认没有把同一个人的复购重复计为新客户。这里的“查询”，就是让程序按指定条件从记录中找出需要的部分。\n\n这与算家庭买菜支出很接近：先确定只算食品，再把两个月的小票按同样规则归类、相加，最后比较。家人把同一张小票拍照发了两次，不能因此算两笔。企业分析同样需要明确哪些记录是一回事、哪些应分别计算。\n\n![管理者提出新客户问题，业务负责人确认首次付款口径，工具查订单并计数，核对后交回比较结果。](assets/08.svg)\n\n例如，“今年客户增长多少”需要确认：客户按联系人还是企业去重；只有成交才算客户，还是录入就算；退单如何处理；比较完整年度还是截至同一天。没有这些定义，一张精美图表可能只是在准确展示另一个问题。\n\n## 同一组数字可以说明不同事情\n\n再看另一种经营问题：咨询增多以后，成交是否也相应变好？销售常把可能带来交易的咨询或客户登记叫“线索”，符合企业跟进标准的称为“有效线索”。下面的转化率，是这批有效线索中最终成交的数量除以线索总量。它与前面按首次付款统计“新客户”的问题不同，要分别取数。\n\n下面是专为解释而设的假设数字，不代表任何企业的经营结果：\n\n| 指标 | 上月 | 本月 |\n| --- | --- | --- |\n| 同口径有效线索 | 1,000条 | 2,000条 |\n| 这些线索中最终成交 | 200条 | 300条 |\n| 转化率 | 20% | 15% |\n\n成交增加了100条，转化率下降了5个百分点。两句话都成立。若老板只问“销售是不是做得更好了”，AI 不能仅凭成交增长作肯定回答。可能是投放扩大带来了更多低意向线索，也可能是销售跟进能力没有同步增加，或者本月线索尚未走完正常成交周期。\n\n要判断转化变化，可以先按来源、客户类型和跟进阶段拆分，再对齐观察窗口。例如上月线索已观察60天、本月只观察10天时，可以先比较两批线索在前10天的阶段推进，待本月走完周期再比较最终成交。问题被定义得更具体，数据才有可比意义。\n\n这里还有一个常用表达区别：从20%到15%，是下降5个百分点，相对降幅为25%。报告选用哪种表达，就把对应分母写清楚。\n\n## 为什么相关变化不能直接说明原因\n\n假设培训后成交率上升。培训可能有效，也可能刚好遇到旺季、价格调整或更高质量的线索。仅靠时间先后，无法确认改善由培训造成。\n\nAI 可以提出竞争解释，再帮助寻找证据：受训与未受训团队是否面对相似客户；培训前趋势是否一致；是否同时改变了分配规则；样本是否足够。条件允许时，可以设计小范围对照或分批实施。条件不允许时，应承认结论只是观察关联，并把后续验证写清楚。\n\n经营往往需要在调查尚未完成时行动。此时可以选择投入较小、容易观察和调整的做法，同时记录采用的解释。后续数据回来，团队便知道应该扩大、修正还是换一种方案。\n\n## 让分析可以复查\n\n一份经营分析至少要保留问题、数据范围、指标定义、实际查询或程序、运行时间和结果。关键指标应能抽取少量原始记录核对，确认没有重复连接、漏项或错误过滤。\n\n例如，一家客户公司有两位联系人，但只下了一笔1万元订单。若查询时把两位联系人各配上这笔订单，再合计金额，就会得到2万元。应按同一笔订单只计一次，而不是按联系人数累加。抽查这样一位客户，把查询结果与原订单对照，就能发现问题。程序是否报错与统计关系是否符合业务，是两项都需要核对的事。\n\n图表也要服务于判断。绝对数量与比例可以分开展示，截短坐标、缺失月份和样本变化应说明。AI 能生成多种图，并不意味着每一种都值得放进报告。\n\n## 从一次问数到企业分析能力\n\n有反复使用价值的指标，应把定义与取数方式固定下来，由业务负责人确认，再开放给团队。临时探索则保留灵活性，但明确标记尚未成为正式口径。这样既不必每个问题都从零开始，也不会把一次临时分析变成未经确认的经营事实。\n\n经营分析的终点，是让某个决定更具体：该调查哪类客户，该改哪个步骤，该如何安排一次验证。企业把常用定义和分析方法积累下来，临时问数就能逐步发展为日常判断能力。"},{"id":"c09","file":"09-创作能力怎样进入内容生产.md","title":"第9章｜创作能力怎样进入内容生产","html":"\u003ch1>第9章｜创作能力怎样进入内容生产\u003c/h1>\n\u003cp>\u003cstrong>AI 降低了生成候选内容的成本，企业更需要明确内容为谁解决什么问题，并管理从想法到可用成品的过程。\u003c/strong>\u003c/p>\n\u003cp>文字、图像、音频和视频生成，使企业能够以更低成本尝试不同表达。产品说明可以按客户类型调整，培训材料可以随流程变化更新，服务方案可以更快形成初稿。创作能力的经营价值，既可能是缩短制作时间，也可能是让过去不值得单独制作的内容变得可行。\u003c/p>\n\u003cp>生成成本下降后，企业可以先比较几种结构、表达或视觉方案，再集中精力完善适合用途的一种。制作过程需要为这种选择留出位置，才能把更多候选转化成更好的成品。\u003c/p>\n\u003ch2>好看之外，内容要完成什么\u003c/h2>\n\u003cp>先确定内容的使用场合。销售拜访前的简报，应该帮助理解客户和找到讨论入口；正式方案要让决策者看懂问题、选择和投入；操作说明要让员工完成任务。三者可能使用同一套产品资料，却不能用同一种表达。\u003c/p>\n\u003cp>创作简报至少需要说明读者、使用时刻、读者已有知识、希望发生的变化、必须准确的信息以及媒介限制。这里的“变化”可以很具体：让客户知道三种服务的差别，或者让新员工能够识别两类异常并知道交给谁。\u003c/p>\n\u003cp>例如面对管理者，方案应说明改造哪项工作、谁来配合、会怎样影响经营；面对操作人员，则需要清楚说明输入、操作和异常处理。同一产品资料在不同场合承担不同解释任务，创作简报就是把这种差异交给AI。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"09\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iMTA1MCIgdmlld0JveD0iMCAwIDM2MCAxMDUwIiByb2xlPSJpbWciPjx0aXRsZT7liJvkvZzpnIDopoHnu5PmnoTkuI7miJDlk4HmoLjpqow8L3RpdGxlPjxkZXNjPueugOaKpee6puadn+S4remXtOe7k+aehOWSjOWAmemAie+8jOacgOe7iOS9v+eUqOajgOafpeaIkOWTge+8m+S4iua4uOWPmOWMluS9v+ebuOWFs+S4i+a4uOe7k+aenOmcgOimgemHjeaguOOAgjwvZGVzYz48ZGVmcz48bWFya2VyIGlkPSJhIiBtYXJrZXJXaWR0aD0iOCIgbWFya2VySGVpZ2h0PSI4IiByZWZYPSI3IiByZWZZPSI0IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDAgTDggNCBMMCA4IFoiIGZpbGw9IiMyNDZhNTUiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjM2MCIgaGVpZ2h0PSIxMDUwIiBmaWxsPSJ3aGl0ZSIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiI+PHRleHQgeD0iMjQiIHk9IjM4IiBmb250LXNpemU9IjI0IiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNjAwIj7liJvkvZzpnIDopoHnu5PmnoTkuI7miJDlk4HmoLjpqow8L3RleHQ+PHJlY3QgeD0iMjQiIHk9IjgyIiB3aWR0aD0iMzEyIiBoZWlnaHQ9IjE0MiIgcng9IjgiIGZpbGw9IiNlZGY0ZWYiIHN0cm9rZT0iI2Q1ZTBkYSIgc3Ryb2tlLXdpZHRoPSIxLjQiLz48dGV4dCB4PSI0MCIgeT0iMTEyIiBmb250LXNpemU9IjIxIiBmaWxsPSIjMjQ2YTU1IiBmb250LXdlaWdodD0iNjAwIj7nroDmiqU8L3RleHQ+PHBhdGggZD0iTTQwIDEzNCBIMzIwIiBzdHJva2U9IiNkNWUwZGEiIHN0cm9rZS13aWR0aD0iMiIgZmlsb span>\u003cbutton type=\"button\" class=\"enlarge\" aria-label=\"放大查看图9-1\">放大查看\u003c/button>\u003c/figcaption>\u003c/figure>\n\u003ch2>为什么需要中间结构\u003c/h2>\n\u003cp>准备一张婚礼请柬时，通常先确认邀请谁、时间地点和回复方式，再选择文字与版式。若宴会时间尚未确定就先印好，改一个时间也要重新制作。企业内容生产也是这样：先确认受众要据此做什么，再把信息排成便于理解的顺序，最后制作成文件。\u003c/p>\n\u003cp>例如培训新客服处理退款，业务负责人先确认退款条件和需升级的情况，制作人员把它们排成“收到请求—查哪条记录—能否处理—交给谁”的说明，再让 AI 生成初稿。新员工按初稿处理一笔示例，卡住的位置就是下一次需要补充的内容。\u003c/p>\n\u003cp>直接从一句需求生成完整演示文稿，最容易在后期发现方向不对。更稳妥的过程是先确定论点、证据和顺序，再生成各部分表达；先确定视频脚本和镜头关系，再制作画面；先确定文章要回答的问题，再组织段落。\u003c/p>\n\u003cp>这些中间结构使错误更早被发现。比如方案开头承诺降低售后成本，后面却只展示聊天机器人界面，缺少如何减少重复故障和返工的解释。若先审查内容结构，这种缺口可以在制作大量图片前修正。\u003c/p>\n\u003cp>中间结构也方便局部修改。客户改变了服务范围，应该能找到受影响的说明、价格和实施部分，再更新成品。若只能重新生成全部内容，已确认的细节可能在下一次生成中丢失。\u003c/p>\n\u003ch2>把不同素材做成可使用的内容\u003c/h2>\n\u003cp>文字生成擅长组织表达，但要核对事实、承诺和专业含义。图片生成适合探索视觉方案、构图和氛围；需要严格文字、尺寸、图纸精度或品牌细节时，应判断是否由设计与排版工具完成。视频和音频还涉及时长、镜头连续性、配音和实际播放效果。\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>内容环节\u003c/th>\n\u003cth>主要工作\u003c/th>\n\u003cth>留下的结果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>事实准备\u003c/td>\n\u003ctd>确认产品、价格、数据和适用条件\u003c/td>\n\u003ctd>当前可采用的资料\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结构设计\u003c/td>\n\u003ctd>安排问题、论点、证据和顺序\u003c/td>\n\u003ctd>可供讨论的内容结构\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图文制作\u003c/td>\n\u003ctd>把结构落实为文字、图片或音视频\u003c/td>\n\u003ctd>可以修改的初稿\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>成品检查\u003c/td>\n\u003ctd>在实际设备打开文件，查看字体、链接与播放\u003c/td>\n\u003ctd>可交付版本和使用入口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>使用反馈\u003c/td>\n\u003ctd>收集读者追问和实际使用情况\u003c/td>\n\u003ctd>下一次修订的具体依据\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>内容在初稿、专业确认和正式使用几个阶段间推进。关键修改发生后，按依赖更新相关图文和导出文件，再打开最终版本核对。这样，一次确认可以服务后续制作，局部变化也有明确的处理范围。\u003c/p>\n\u003ch2>怎样把经验沉淀成可复用能力\u003c/h2>\n\u003cp>企业可以积累稳定的内容要求与有效范例：客户常问的问题、专业事实的解释方法、帮助选择的比较结构，以及最终成品的检查办法。提示词负责把这些要求组织给模型，范例帮助它理解企业希望达到的表达质量。\u003c/p>\n\u003cp>沉淀范例时，把读者与用途一起保存。技术人员需要的细节与管理者关心的经营关系不同；在新场合使用时，先调整解释重点，再沿用有效结构。企业因此积累的是组织内容的方法，而非固定句式。\u003c/p>\n\u003cp>记录修改集中在哪些地方、读者是否更容易完成目标、同一问题是否仍被反复追问，可以决定下一步改资料、改结构还是改表达。制作与使用由此形成持续反馈。\u003c/p>\n\u003cp>当结构、专业资料与制作方法可以复用，企业就能够以合理成本持续更新内容，服务更多细分读者。内容生产的组织能力，体现在能够及时交出适合当前用途的材料。\u003c/p>\n","text":"# 第9章｜创作能力怎样进入内容生产\n\n**AI 降低了生成候选内容的成本，企业更需要明确内容为谁解决什么问题，并管理从想法到可用成品的过程。**\n\n文字、图像、音频和视频生成，使企业能够以更低成本尝试不同表达。产品说明可以按客户类型调整，培训材料可以随流程变化更新，服务方案可以更快形成初稿。创作能力的经营价值，既可能是缩短制作时间，也可能是让过去不值得单独制作的内容变得可行。\n\n生成成本下降后，企业可以先比较几种结构、表达或视觉方案，再集中精力完善适合用途的一种。制作过程需要为这种选择留出位置，才能把更多候选转化成更好的成品。\n\n## 好看之外，内容要完成什么\n\n先确定内容的使用场合。销售拜访前的简报，应该帮助理解客户和找到讨论入口；正式方案要让决策者看懂问题、选择和投入；操作说明要让员工完成任务。三者可能使用同一套产品资料，却不能用同一种表达。\n\n创作简报至少需要说明读者、使用时刻、读者已有知识、希望发生的变化、必须准确的信息以及媒介限制。这里的“变化”可以很具体：让客户知道三种服务的差别，或者让新员工能够识别两类异常并知道交给谁。\n\n例如面对管理者，方案应说明改造哪项工作、谁来配合、会怎样影响经营；面对操作人员，则需要清楚说明输入、操作和异常处理。同一产品资料在不同场合承担不同解释任务，创作简报就是把这种差异交给AI。\n\n![从创作简报到实际使用的内容生产过程](assets/09.svg)\n\n## 为什么需要中间结构\n\n准备一张婚礼请柬时，通常先确认邀请谁、时间地点和回复方式，再选择文字与版式。若宴会时间尚未确定就先印好，改一个时间也要重新制作。企业内容生产也是这样：先确认受众要据此做什么，再把信息排成便于理解的顺序，最后制作成文件。\n\n例如培训新客服处理退款，业务负责人先确认退款条件和需升级的情况，制作人员把它们排成“收到请求—查哪条记录—能否处理—交给谁”的说明，再让 AI 生成初稿。新员工按初稿处理一笔示例，卡住的位置就是下一次需要补充的内容。\n\n直接从一句需求生成完整演示文稿，最容易在后期发现方向不对。更稳妥的过程是先确定论点、证据和顺序，再生成各部分表达；先确定视频脚本和镜头关系，再制作画面；先确定文章要回答的问题，再组织段落。\n\n这些中间结构使错误更早被发现。比如方案开头承诺降低售后成本，后面却只展示聊天机器人界面，缺少如何减少重复故障和返工的解释。若先审查内容结构，这种缺口可以在制作大量图片前修正。\n\n中间结构也方便局部修改。客户改变了服务范围，应该能找到受影响的说明、价格和实施部分，再更新成品。若只能重新生成全部内容，已确认的细节可能在下一次生成中丢失。\n\n## 把不同素材做成可使用的内容\n\n文字生成擅长组织表达，但要核对事实、承诺和专业含义。图片生成适合探索视觉方案、构图和氛围；需要严格文字、尺寸、图纸精度或品牌细节时，应判断是否由设计与排版工具完成。视频和音频还涉及时长、镜头连续性、配音和实际播放效果。\n\n| 内容环节 | 主要工作 | 留下的结果 |\n| --- | --- | --- |\n| 事实准备 | 确认产品、价格、数据和适用条件 | 当前可采用的资料 |\n| 结构设计 | 安排问题、论点、证据和顺序 | 可供讨论的内容结构 |\n| 图文制作 | 把结构落实为文字、图片或音视频 | 可以修改的初稿 |\n| 成品检查 | 在实际设备打开文件，查看字体、链接与播放 | 可交付版本和使用入口 |\n| 使用反馈 | 收集读者追问和实际使用情况 | 下一次修订的具体依据 |\n\n内容在初稿、专业确认和正式使用几个阶段间推进。关键修改发生后，按依赖更新相关图文和导出文件，再打开最终版本核对。这样，一次确认可以服务后续制作，局部变化也有明确的处理范围。\n\n## 怎样把经验沉淀成可复用能力\n\n企业可以积累稳定的内容要求与有效范例：客户常问的问题、专业事实的解释方法、帮助选择的比较结构，以及最终成品的检查办法。提示词负责把这些要求组织给模型，范例帮助它理解企业希望达到的表达质量。\n\n沉淀范例时，把读者与用途一起保存。技术人员需要的细节与管理者关心的经营关系不同；在新场合使用时，先调整解释重点，再沿用有效结构。企业因此积累的是组织内容的方法，而非固定句式。\n\n记录修改集中在哪些地方、读者是否更容易完成目标、同一问题是否仍被反复追问，可以决定下一步改资料、改结构还是改表达。制作与使用由此形成持续反馈。\n\n当结构、专业资料与制作方法可以复用，企业就能够以合理成本持续更新内容，服务更多细分读者。内容生产的组织能力，体现在能够及时交出适合当前用途的材料。"},{"id":"c10","file":"10-AI编程怎样改变企业软件供给.md","title":"第10章｜AI编程怎样改变企业软件供给","html":"\u003ch1>第10章｜AI编程怎样改变企业软件供给\u003c/h1>\n\u003cp>\u003cstrong>AI 编程使更多细小、专属的工作值得被做成软件。企业要重新计算的是实现、集成和持续运行的总成本，而不只是写代码的价格。\u003c/strong>\u003c/p>\n\u003cp>许多企业工作长期停留在表格、聊天和手工搬运中，并非完全不值得改进，而是原先的软件建设成本太高。为一项小流程写需求、安排开发、把相连的系统放在一起试运行，再持续维护，可能比它短期节省的人工还贵。AI 能帮助写程序、理解既有代码、生成界面和修复部分问题，从而改变其中一些成本。\u003c/p>\n\u003cp>这为小工具、内部工作台、系统连接和快速试验创造了机会。完整建设仍包括需求、集成、验证和运行，AI编程降低其中的实现成本，也让团队更早做出可操作版本来讨论其他条件。\u003c/p>\n\u003ch2>从一句要求到可运行功能，中间发生什么\u003c/h2>\n\u003cp>把一台家电送到维修店，前台通常先登记联系方式、设备和故障，再把维修单交给相应师傅。你手里的受理凭条与师傅手里的维修单对应同一件东西；日后查询时，双方才知道在谈哪次维修。企业售后软件要完成的也是这样的交接。\u003c/p>\n\u003cp>假定一家服务企业希望客户填写申请后，自动交给对应区域的维修团队。开发者可以让 AI 协助生成表单、保存申请的程序和分配规则。客户点击提交后，程序把内容存入售后系统，取得申请编号，再按区域规则把记录加入相应团队的待办列表。维修人员打开待办，看到联系方式、设备和问题，确认接手后更新状态。\u003c/p>\n\u003cp>完整功能还需要确认申请保存位置、客户与设备标识、当前人员和区域规则、通知渠道、重复提交处理，以及团队怎样接收和变更状态。AI 编程可以协助实现这些连接，但前提是所需系统确实提供接口或其他可用操作，且企业具备相应权限。\u003c/p>\n\u003cp>开发者可以先用模拟数据验证界面与步骤，再连接实际记录。业务负责人参与时，可以先判断操作是否符合工作习惯，接通后再查看真实创建的申请和接收团队的入口。两次查看解决不同问题，能够让修改发生得更早。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"10\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iOTA0IiB2aWV3Qm94PSIwIDAgMzYwIDkwNCIgcm9sZT0iaW1nIj48dGl0bGU+5oql5L+u6KGo5oCO5qC35Yiw6L6+57u05L+u5Lq65ZGY5omL5LitPC90aXRsZT48ZGVzYz7ooajljZXmj5DkuqTlkI7kv53lrZjorrDlvZXlubbliIbmtL7vvIznu7Tkv67kurrlkZjmjInlkIzkuIDnvJblj7fmjqXmiYvvvIzlrqLmiLfmn6Xor6Lmm7TmlrDlkI7nmoTnirbmgIHjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYSIgbWFya2VyV2lkdGg9IjgiIG1hcmtlckhlaWdodD0iOCIgcmVmWD0iNyIgcmVmWT0iNCIgb3JpZW50PSJhdXRvIj48cGF0 \u003cspan>图 10-1\u003c/span>\u003cbutton type=\"button\" class=\"enlarge\" aria-label=\"放大查看图10-1\">放大查看\u003c/button>\u003c/figcaption>\u003c/figure>\n\u003ch2>哪些工作因此更值得尝试\u003c/h2>\n\u003cp>一种机会是填补标准软件之间的缝隙。例如，把已批准的服务要求转换为下游系统所需格式，或在提交前检查缺项。另一种是把企业独有的判断步骤变成可执行工具，如根据设备条件和已批准规则检查服务范围。还有一种是快速检验新服务：先用有限功能验证用户是否需要，再决定是否扩大建设。\u003c/p>\n\u003cp>小范围实现可以先围绕稳定业务对象建设，例如客户、申请和处理状态。以现有软件为基础补上必要连接，能够缩短实现路径。多个场景逐渐使用同一能力后，再比较统一维护的收益。\u003c/p>\n\u003cp>AI 也能帮助企业理解原有软件：查找某条规则写在哪里、解释错误可能来自哪个环节、评估改动影响。结果仍须结合真实环境验证，尤其是历史代码、文档与线上行为不一致时。\u003c/p>\n\u003ch2>写得快，会怎样改变风险\u003c/h2>\n\u003cp>代码更容易生成，企业也更容易同时拥有许多无人维护的小应用。功能之间可能复制不同规则，权限配置各不相同，业务负责人不知道哪个版本在运行。建设成本下降后，管理这些软件的成本反而更值得重视。\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>决定\u003c/th>\n\u003cth>需要核对的内容\u003c/th>\n\u003cth>对经营的影响\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>自建还是购买\u003c/td>\n\u003ctd>标准产品覆盖程度、专属差异、可集成性\u003c/td>\n\u003ctd>避免为通用功能承担长期开发负担\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>原型是否继续\u003c/td>\n\u003ctd>实际任务能否完成，用户是否需要\u003c/td>\n\u003ctd>防止因为已经做出界面而继续投入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>谁负责运行\u003c/td>\n\u003ctd>账号、配置、源文件、部署与问题响应\u003c/td>\n\u003ctd>决定企业能否独立使用与交接\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>怎样修改\u003c/td>\n\u003ctd>规则归属、版本、受影响流程与验证\u003c/td>\n\u003ctd>防止局部修复破坏其他工作\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>验证可以沿软件的实际使用展开：能否启动，业务规则是否正确，真实接口能否读写，角色能否访问相应记录，异常后怎样接续。程序测试提供基础检查，实际岗位的任务操作补上专业标准和接手体验。\u003c/p>\n\u003cp>这里的“部署”，是把程序放到实际使用的电脑或服务器上，并设置好账号、连接地址等运行条件；这些设置通常称为“配置”。可继续修改的程序文件称为“源文件”或“源代码”。如果企业希望以后自行调整工具，交接就需要同时考虑这些文件、运行条件和相应使用权。\u003c/p>\n\u003ch2>用原任务确认修改的效果\u003c/h2>\n\u003cp>软件问题可能来自程序、配置、平台权限或业务规则。先把失败过程重现出来，再沿输入和操作查原因，可以避免反复修改无关部分。比如申请保存失败，可能是必填字段缺少，也可能是账号没有写入权限，两者需要不同处理。\u003c/p>\n\u003cp>修改后，用相同角色在实际环境重做原任务，再看接收方能否继续。技术人员据此说明原因、改动和结果，业务人员确认工作是否恢复。这个办法也适用于AI参与开发的软件：每次修改都回到它要服务的任务。\u003c/p>\n\u003ch2>企业应拥有怎样的交接条件\u003c/h2>\n\u003cp>采购定制软件或采用 AI 生成工具时，要明确企业能够取得什么：使用权、业务数据、必要的源文件、运行配置说明、管理账号和后续维护安排。不同合作形式可以不同，关键在于与企业希望承担的责任一致。\u003c/p>\n\u003cp>内部接手者可以独立完成日常任务和一次常见异常处理，检查交接是否足够。若选择由服务方长期维护，则明确双方响应、改动和费用安排。企业可以购买持续服务，也可以建设自有运行能力，选择取决于内部资源与长期使用方式。\u003c/p>\n\u003cp>AI 编程的长期价值，可能是使软件更贴近工作变化。要实现这一点，企业需要把需求定义、业务验证和运行责任同时建立起来。实现越容易，越应该把注意力放在究竟值得实现什么。\u003c/p>\n","text":"# 第10章｜AI编程怎样改变企业软件供给\n\n**AI 编程使更多细小、专属的工作值得被做成软件。企业要重新计算的是实现、集成和持续运行的总成本，而不只是写代码的价格。**\n\n许多企业工作长期停留在表格、聊天和手工搬运中，并非完全不值得改进，而是原先的软件建设成本太高。为一项小流程写需求、安排开发、把相连的系统放在一起试运行，再持续维护，可能比它短期节省的人工还贵。AI 能帮助写程序、理解既有代码、生成界面和修复部分问题，从而改变其中一些成本。\n\n这为小工具、内部工作台、系统连接和快速试验创造了机会。完整建设仍包括需求、集成、验证和运行，AI编程降低其中的实现成本，也让团队更早做出可操作版本来讨论其他条件。\n\n## 从一句要求到可运行功能，中间发生什么\n\n把一台家电送到维修店，前台通常先登记联系方式、设备和故障，再把维修单交给相应师傅。你手里的受理凭条与师傅手里的维修单对应同一件东西；日后查询时，双方才知道在谈哪次维修。企业售后软件要完成的也是这样的交接。\n\n假定一家服务企业希望客户填写申请后，自动交给对应区域的维修团队。开发者可以让 AI 协助生成表单、保存申请的程序和分配规则。客户点击提交后，程序把内容存入售后系统，取得申请编号，再按区域规则把记录加入相应团队的待办列表。维修人员打开待办，看到联系方式、设备和问题，确认接手后更新状态。\n\n完整功能还需要确认申请保存位置、客户与设备标识、当前人员和区域规则、通知渠道、重复提交处理，以及团队怎样接收和变更状态。AI 编程可以协助实现这些连接，但前提是所需系统确实提供接口或其他可用操作，且企业具备相应权限。\n\n开发者可以先用模拟数据验证界面与步骤，再连接实际记录。业务负责人参与时，可以先判断操作是否符合工作习惯，接通后再查看真实创建的申请和接收团队的入口。两次查看解决不同问题，能够让修改发生得更早。\n\n![客户填写报修，系统保存编号并按区域加入维修待办，维修人员打开同一申请后更新接手状态，客户能够查询进展。](assets/10.svg)\n\n## 哪些工作因此更值得尝试\n\n一种机会是填补标准软件之间的缝隙。例如，把已批准的服务要求转换为下游系统所需格式，或在提交前检查缺项。另一种是把企业独有的判断步骤变成可执行工具，如根据设备条件和已批准规则检查服务范围。还有一种是快速检验新服务：先用有限功能验证用户是否需要，再决定是否扩大建设。\n\n小范围实现可以先围绕稳定业务对象建设，例如客户、申请和处理状态。以现有软件为基础补上必要连接，能够缩短实现路径。多个场景逐渐使用同一能力后，再比较统一维护的收益。\n\nAI 也能帮助企业理解原有软件：查找某条规则写在哪里、解释错误可能来自哪个环节、评估改动影响。结果仍须结合真实环境验证，尤其是历史代码、文档与线上行为不一致时。\n\n## 写得快，会怎样改变风险\n\n代码更容易生成，企业也更容易同时拥有许多无人维护的小应用。功能之间可能复制不同规则，权限配置各不相同，业务负责人不知道哪个版本在运行。建设成本下降后，管理这些软件的成本反而更值得重视。\n\n| 决定 | 需要核对的内容 | 对经营的影响 |\n| --- | --- | --- |\n| 自建还是购买 | 标准产品覆盖程度、专属差异、可集成性 | 避免为通用功能承担长期开发负担 |\n| 原型是否继续 | 实际任务能否完成，用户是否需要 | 防止因为已经做出界面而继续投入 |\n| 谁负责运行 | 账号、配置、源文件、部署与问题响应 | 决定企业能否独立使用与交接 |\n| 怎样修改 | 规则归属、版本、受影响流程与验证 | 防止局部修复破坏其他工作 |\n\n验证可以沿软件的实际使用展开：能否启动，业务规则是否正确，真实接口能否读写，角色能否访问相应记录，异常后怎样接续。程序测试提供基础检查，实际岗位的任务操作补上专业标准和接手体验。\n\n这里的“部署”，是把程序放到实际使用的电脑或服务器上，并设置好账号、连接地址等运行条件；这些设置通常称为“配置”。可继续修改的程序文件称为“源文件”或“源代码”。如果企业希望以后自行调整工具，交接就需要同时考虑这些文件、运行条件和相应使用权。\n\n## 用原任务确认修改的效果\n\n软件问题可能来自程序、配置、平台权限或业务规则。先把失败过程重现出来，再沿输入和操作查原因，可以避免反复修改无关部分。比如申请保存失败，可能是必填字段缺少，也可能是账号没有写入权限，两者需要不同处理。\n\n修改后，用相同角色在实际环境重做原任务，再看接收方能否继续。技术人员据此说明原因、改动和结果，业务人员确认工作是否恢复。这个办法也适用于AI参与开发的软件：每次修改都回到它要服务的任务。\n\n## 企业应拥有怎样的交接条件\n\n采购定制软件或采用 AI 生成工具时，要明确企业能够取得什么：使用权、业务数据、必要的源文件、运行配置说明、管理账号和后续维护安排。不同合作形式可以不同，关键在于与企业希望承担的责任一致。\n\n内部接手者可以独立完成日常任务和一次常见异常处理，检查交接是否足够。若选择由服务方长期维护，则明确双方响应、改动和费用安排。企业可以购买持续服务，也可以建设自有运行能力，选择取决于内部资源与长期使用方式。\n\nAI 编程的长期价值，可能是使软件更贴近工作变化。要实现这一点，企业需要把需求定义、业务验证和运行责任同时建立起来。实现越容易，越应该把注意力放在究竟值得实现什么。\n"},{"id":"c11","file":"11-上下文是AI工作的现场条件.md","title":"第11章｜上下文是AI工作的现场条件","html":"\u003ch1>第11章｜上下文是AI工作的现场条件\u003c/h1>\n\u003cp>\u003cstrong>上下文是AI在当前任务中可以使用的信息。把目标、事实、方法和工具结果及时组织给模型，是让通用能力适应企业工作的直接办法。\u003c/strong>\u003c/p>\n\u003cp>上下文可以包含指令、对话、文档片段、工具说明和工具返回结果。应用负责把企业保存的信息取出来，按当前任务需要送入模型。企业保存资料的地方，与模型这次实际看到的内容，是通过这段供给过程联系起来的。\u003c/p>\n\u003cp>因此，设计AI工作时要关注两个问题：当前决定需要哪些信息，应用怎样取得并组织它们。这项安排常被称为上下文工程。它既影响质量，也影响响应时间和每次运行成本。\u003c/p>\n\u003ch2>一项工作需要怎样的现场资料\u003c/h2>\n\u003cp>出门办事前，会按当天任务把证件、地址和预约记录放进随身包里。家里保存着很多资料，但真正到柜台前能用的是带来的那一份；预约改了，包里的旧确认单也要换。可以借这个熟悉的过程理解“上下文”：企业存有很多信息，应用要把当前任务需要的那部分取出来，交给模型。\u003c/p>\n\u003cp>例如销售已替客户拟好两套设备的方案，客户随后发来“改成三套，安装还是等通知”。销售希望 AI 帮忙更新需求，而不是重新猜客户是谁。应用先按当前订单取得原需求，加入这条变更消息，再取得是否已备货、安装日期是否已确认等记录。模型这次收到的材料，就能支持它指出“数量改为三套，安装仍未定”，并列出数量变化影响的计算与确认。\u003c/p>\n\u003cp>销售核对后，应用把新数量保存到这笔订单的当前需求中，后续计算读取三套。原消息与旧版本保留作查证。若客户只说“按新的来”，却找不到此前讨论的新方案，应用应把相关对话取回，或让销售追问明确指哪一版，再继续修改。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"11\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iMTA4MiIgdmlld0JveD0iMCAwIDM2MCAxMDgyIiByb2xlPSJpbWciPjx0aXRsZT7ov5nmrKHmqKHlnovmi7/liLDlk6rkupvmnZDmlpk8L3RpdGxlPjxkZXNjPuWOn+iusOW9leWSjOWPmOabtOa2iOaBr+e7hOaIkOW \u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>信息\u003c/th>\n\u003cth>应回答的问题\u003c/th>\n\u003cth>缺失后的影响\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>目标与完成条件\u003c/td>\n\u003ctd>当前要交出什么，怎样算完成\u003c/td>\n\u003ctd>模型可能只写建议，没有推进实际任务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>当前事实\u003c/td>\n\u003ctd>对象、版本和状态是什么\u003c/td>\n\u003ctd>可能对已完成动作重复操作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>适用规则\u003c/td>\n\u003ctd>哪些约束生效，例外谁决定\u003c/td>\n\u003ctd>可能把一般惯例当企业政策\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可用工具与权限\u003c/td>\n\u003ctd>可以查什么、做什么\u003c/td>\n\u003ctd>可能提出当前系统无法执行的动作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已作决定与缺口\u003c/td>\n\u003ctd>什么已经确认，什么仍未知\u003c/td>\n\u003ctd>可能推翻已确认条件或补造答案\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>这份资料不必每次由员工手写。系统可以从业务记录、知识检索和任务状态中取得，但要明确各类信息的权威位置与更新时间。\u003c/p>\n\u003ch2>为什么资料越多不一定越好\u003c/h2>\n\u003cp>输入容量有限。即使产品支持很长的输入，模型也未必能够同等有效地使用所有内容。多份相似文件、历史讨论和未生效建议一起进入，会增加找错规则或混淆状态的机会，还会带来成本与延迟。\u003c/p>\n\u003cp>可以把信息分为稳定说明、当前任务资料和按需查询资料。稳定说明保持简洁；当前任务只保留影响本次决定的事实；大体量文件和历史记录按需要取回。工作到了报价环节才查询对应价目，到了安排环节才查询资源，不必一开始塞入所有资料。\u003c/p>\n\u003cp>工作变化后，相应上下文及时更新。客户改变数量，应用提供当前采用值，同时保留原始变更记录供追查。后续计算就能沿新条件继续。\u003c/p>\n\u003ch2>长任务中的压缩与恢复\u003c/h2>\n\u003cp>任务进行很久后，系统可能压缩对话，保留目标、决定、已完成动作和下一步。压缩可以使工作继续，但摘要也可能丢掉决定成立的条件。\u003c/p>\n\u003cp>例如，原决定是“仅对已确认标准型号自动形成草稿”，摘要若写成“自动形成报价”，就扩大了范围。因此，交接记录不能只记结论，还应记适用范围、关键依据、未决项及原记录位置。涉及外部动作时，还要保留实际执行状态，避免把“准备提交”压缩成“已提交”。\u003c/p>\n\u003cp>恢复任务时，应用从保存的任务记录读取当前状态，核对外部动作后再组织下一轮输入。模型据此知道从哪里继续；业务记录则保存已经发生的事实，供不同人员和多次运行共同使用。\u003c/p>\n\u003ch2>怎样改善一次不合用的回答\u003c/h2>\n\u003cp>可以沿着信息路径检查：模型收到的任务是否明确；关键资料是否真的进入；版本是否适用；事实与建议是否区分；工具结果是否完整。只有这些条件基本成立后，才更有根据地比较模型能力或修改推理方法。\u003c/p>\n\u003cp>如果价格错了，可能是没拿到价目表，也可能拿到了旧表，或表中条件难以匹配。这三种原因分别需要补供给、改版本筛选、改结构和核对方法。统一用“提示词写清楚一点”处理，往往无法稳定解决。\u003c/p>\n\u003cp>企业应积累任务所需的信息结构，而不只是保存成功对话。一套能让不同员工、不同运行都取得正确资料的安排，比某个人的一段优秀提示词更接近组织能力。\u003c/p>\n","text":"# 第11章｜上下文是AI工作的现场条件\n\n**上下文是AI在当前任务中可以使用的信息。把目标、事实、方法和工具结果及时组织给模型，是让通用能力适应企业工作的直接办法。**\n\n上下文可以包含指令、对话、文档片段、工具说明和工具返回结果。应用负责把企业保存的信息取出来，按当前任务需要送入模型。企业保存资料的地方，与模型这次实际看到的内容，是通过这段供给过程联系起来的。\n\n因此，设计AI工作时要关注两个问题：当前决定需要哪些信息，应用怎样取得并组织它们。这项安排常被称为上下文工程。它既影响质量，也影响响应时间和每次运行成本。\n\n## 一项工作需要怎样的现场资料\n\n出门办事前，会按当天任务把证件、地址和预约记录放进随身包里。家里保存着很多资料，但真正到柜台前能用的是带来的那一份；预约改了，包里的旧确认单也要换。可以借这个熟悉的过程理解“上下文”：企业存有很多信息，应用要把当前任务需要的那部分取出来，交给模型。\n\n例如销售已替客户拟好两套设备的方案，客户随后发来“改成三套，安装还是等通知”。销售希望 AI 帮忙更新需求，而不是重新猜客户是谁。应用先按当前订单取得原需求，加入这条变更消息，再取得是否已备货、安装日期是否已确认等记录。模型这次收到的材料，就能支持它指出“数量改为三套，安装仍未定”，并列出数量变化影响的计算与确认。\n\n销售核对后，应用把新数量保存到这笔订单的当前需求中，后续计算读取三套。原消息与旧版本保留作查证。若客户只说“按新的来”，却找不到此前讨论的新方案，应用应把相关对话取回，或让销售追问明确指哪一版，再继续修改。\n\n![原订单两套、客户改为三套的消息和当前安装状态一起进入本次任务；核对后更新需求，后续计算读取新数量。](assets/11.svg)\n\n| 信息 | 应回答的问题 | 缺失后的影响 |\n| --- | --- | --- |\n| 目标与完成条件 | 当前要交出什么，怎样算完成 | 模型可能只写建议，没有推进实际任务 |\n| 当前事实 | 对象、版本和状态是什么 | 可能对已完成动作重复操作 |\n| 适用规则 | 哪些约束生效，例外谁决定 | 可能把一般惯例当企业政策 |\n| 可用工具与权限 | 可以查什么、做什么 | 可能提出当前系统无法执行的动作 |\n| 已作决定与缺口 | 什么已经确认，什么仍未知 | 可能推翻已确认条件或补造答案 |\n\n这份资料不必每次由员工手写。系统可以从业务记录、知识检索和任务状态中取得，但要明确各类信息的权威位置与更新时间。\n\n## 为什么资料越多不一定越好\n\n输入容量有限。即使产品支持很长的输入，模型也未必能够同等有效地使用所有内容。多份相似文件、历史讨论和未生效建议一起进入，会增加找错规则或混淆状态的机会，还会带来成本与延迟。\n\n可以把信息分为稳定说明、当前任务资料和按需查询资料。稳定说明保持简洁；当前任务只保留影响本次决定的事实；大体量文件和历史记录按需要取回。工作到了报价环节才查询对应价目，到了安排环节才查询资源，不必一开始塞入所有资料。\n\n工作变化后，相应上下文及时更新。客户改变数量，应用提供当前采用值，同时保留原始变更记录供追查。后续计算就能沿新条件继续。\n\n## 长任务中的压缩与恢复\n\n任务进行很久后，系统可能压缩对话，保留目标、决定、已完成动作和下一步。压缩可以使工作继续，但摘要也可能丢掉决定成立的条件。\n\n例如，原决定是“仅对已确认标准型号自动形成草稿”，摘要若写成“自动形成报价”，就扩大了范围。因此，交接记录不能只记结论，还应记适用范围、关键依据、未决项及原记录位置。涉及外部动作时，还要保留实际执行状态，避免把“准备提交”压缩成“已提交”。\n\n恢复任务时，应用从保存的任务记录读取当前状态，核对外部动作后再组织下一轮输入。模型据此知道从哪里继续；业务记录则保存已经发生的事实，供不同人员和多次运行共同使用。\n\n## 怎样改善一次不合用的回答\n\n可以沿着信息路径检查：模型收到的任务是否明确；关键资料是否真的进入；版本是否适用；事实与建议是否区分；工具结果是否完整。只有这些条件基本成立后，才更有根据地比较模型能力或修改推理方法。\n\n如果价格错了，可能是没拿到价目表，也可能拿到了旧表，或表中条件难以匹配。这三种原因分别需要补供给、改版本筛选、改结构和核对方法。统一用“提示词写清楚一点”处理，往往无法稳定解决。\n\n企业应积累任务所需的信息结构，而不只是保存成功对话。一套能让不同员工、不同运行都取得正确资料的安排，比某个人的一段优秀提示词更接近组织能力。\n"},{"id":"c12","file":"12-知识库RAG与业务数据怎样配合.md","title":"第12章｜知识库、RAG与业务数据怎样配合","html":"\u003ch1>第12章｜知识库、RAG与业务数据怎样配合\u003c/h1>\n\u003cp>\u003cstrong>知识库让稳定知识得到积累，RAG让相关知识在需要时进入模型，业务系统查询提供当前事实。三者配合，AI才能既按企业的方法工作，又跟上正在发生的业务。\u003c/strong>\u003c/p>\n\u003cp>企业常希望“把所有资料交给 AI，让它懂公司”。这里至少包含三个不同目标：了解稳定知识，查询当前状态，以及遵循企业的工作方法。它们需要的技术和维护方式不同。\u003c/p>\n\u003cp>知识库通常保存制度、产品说明、操作经验和参考材料。RAG 是“检索增强生成”：先找出相关资料，再把这些资料交给模型用于回答或任务。业务数据查询则从订单、库存、客户等系统取得当前记录。训练或微调模型会改变参数，通常不适合作为每日更新业务事实的首选方式。\u003c/p>\n\u003ch2>检索究竟怎样工作\u003c/h2>\n\u003cp>在第一次查询之前，企业要先准备可查的资料。规则负责人选出正式服务手册，标明适用型号、地区和生效日期；实施者把文档按内容整理成可查的段落，保存每段来自哪份文件、哪一页。系统再建立便于查找的记录，这些查找记录称为“索引”。规则更新后，负责人替换有效版本，相关索引也要更新。\u003c/p>\n\u003cp>先看生活中的一种查资料过程。准备照菜谱做晚饭，菜谱说明怎样做，冰箱里的食材决定今天能做多少。查到了菜谱，还要打开冰箱看看当前有什么。企业服务也有两类信息：服务手册写适用条件，排班系统记录今天还能安排谁。\u003c/p>\n\u003cp>假设客服接到“这台设备坏了，明天能不能上门”的消息。应用先根据客户记录确定设备型号和服务地区，再到企业知识库查该型号的服务规则。用户说“坏了找谁”，文档标题却是“售后服务申请”，系统仍可能找到相关段落：除了按字词查找，还可以把文字转换成数值表示，比较含义接近的内容。这种表示常叫向量或 Embedding，对应的查找方式叫语义检索。\u003c/p>\n\u003cp>找到候选段落以后，应用把适用的规则原文与本次问题一同交给模型。模型根据这些材料说明能提供什么服务。这个“先找资料，再带着资料回答”的过程，就是 RAG。\u003c/p>\n\u003cp>检索通常还要利用产品、地区、客户类型、生效日期和权限等信息筛选候选。例如两个产品都有“售后更换”，当前任务先确定产品，再选择有效规则。含义匹配帮助找到资料，条件筛选帮助选对资料。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"12\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iMTA0MSIgdmlld0JveD0iMCAwIDM2MCAxMDQxIiByb2xlPSJpbWciPjx0aXRsZT7op4TliJnkuI7mjpLnj63vvIzliIbliKvmn6XmuIXmpZo8L3RpdGxlPjxkZXNjPuacjeWKoeinhOWImeWSjOW9k+WJjeaOkuePreWIhuWIq+afpeivou+8jOWuouacjeW9ouaIkOWuieaOku+8jOWuouaIt+ehruiupOWQjuaPkOS6pOmihOe6puW5tuWPluW+l+e7k+aenOOAgjwvZGVzYz48ZGVmcz48bWFya2VyIGlkPSJhIiBtYXJrZXJXaWR0aD0iOCIgbWFya2VySGVpZ2h0PSI4IiByZWZYPSI3IiByZWZZPSI0IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDAgTDggNCBMMCA4IFoiIGZpbGw9IiMyNDZhNTUiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjM2MCIgaGVpZ2h0PSIxMDQxIiBmaWxsPSJ3aGl0ZSIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZX
