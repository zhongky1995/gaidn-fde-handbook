特客户理解、渠道或履约资源形成组合，企业又可能发展新的价值。\n\n价值创造后能否保留，仍取决于竞争与商业模式。把所有改善让渡为降价，或主要由平台取得收益，技术领先也未必转为企业优势。商业模式研究\n\n| 教学业务 | 主要可改变部分 | 仍需配合的条件 | 可能优先的FDE工作 |\n|---|---|---|---|\n| 连锁备货 | 情境信息与分配判断 | 生产、配送、门店执行 | 现场记录与实际反馈 |\n| 设备售后 | 资料理解、经验调用与跟进 | 专业判断、工具与到场 | 真实动作、接任与服务链 |\n| 专业服务 | 材料、构思、持续支持 | 核验、客户协作与行动 | 阶段分工、容量与产品探索 |\n\n这张表是案例分析，不是行业成熟度排名。\n\n## 为什么公开研究不能合成一个通用结论\n\n客服研究观察真实对话与员工表现，宝洁研究观察创新方案，办公研究观察软件活动，开发实验观察特定任务耗时。它们的工作、时期、工具与结果不同。\n\n将其平均成“AI普遍提高多少效率”，会抹掉企业最需要理解的条件。反向结果也不能独自否定整个技术方向。专业依据的作用，是帮助定位可能机制与判断边界。\n\n课程的研究与延伸阅读保留这些来源的具体用途，便于回到原始研究。企业自己的关键决定仍需自己的任务与客户证据。\n\n## 把紧迫感变成建设选择\n\n可以说明：竞争者若取得类似智能供给，会改变哪项客户选择；本企业当前哪项学习或履约条件最薄弱；若持续不建设，差距可能怎样扩大；眼下什么投入能够改善这条路径。\n\n这比统一倒计时更有行动内容，也不削弱主动转型的必要性。企业不必等产业答案形成，才能建设自己的吸收、工程和学习能力；但应知道自己为何开始、如何判断和怎样调整。\n\n最后，需要把这些关系写成一份完整提案，让经营、业务与工程能够围绕同一条论证合作。\n"},{"file":"40-完整改造提案.md","id":"lesson-40","number":40,"role":"核心课","part":7,"title":"第40章｜把整门课连成一份可以讨论的改造提案","md":"# 第40章｜把整门课连成一份可以讨论的改造提案\n\n“建设企业AI知识库，提升效率，形成壁垒”表达了愿望，却仍无法安排工作。业务人员不知道先改哪里，工程人员不知道哪些条件重要，负责人也难以判断投入与结果。\n\n一份完整提案，需要把客户价值、生产机制、智能资源和持续能力连起来。\n\n**提案应解释为何值得、怎样实现、凭何判断、谁持续承担，以及证据怎样改变下一步。** 它不是系统清单，也不是一次性终局蓝图。\n\n## 先看一份贯穿案例的候选提案\n\n以下仍为教学方案。区域烘焙连锁有8家门店和中央生产配送，已保存销量与库存，却没有持续保留售罄时点、未满足请求和当地事件。\n\n候选方向是：改善晚间新鲜商品可得性，同时控制剩余，把有效判断留在组织。顾客是否真的因此选择企业，当前仍需核实；位置、价格与商品本身也可能解释购买。\n\n这句话同时给出价值方向与未知，没有把企业自述优势写成事实。\n\n## 从价值追到可改造机制\n\nX店18点卖完80个，后面仍有人询问；总部日报只保留销量80。下一次分配因此可能缺少判断条件。\n\n本轮假设是：让必要现场信息进入分配，并把建议、正式安排、实际到店和营业结果关联起来，可能改善决定与经验再用。AI增量主要落在组织非标准材料、提示缺项与调用经验；分配数学本身不能全部算作生成式AI。\n\n合理替代包括改进人工/SOP、使用成熟预测分配程序。若替代成本更低、效果相当，应采用合适方案。\n\n## 把能力实现拆成相连工作\n\n门店提供自然发生的事件与售罄信息；AI组织相关材料，区分事实、解释与候选；中央团队按总量和配送条件形成正式安排；实际到店与营业结果返回。\n\nFDE负责关联、工具、工作入口和评价，业务负责人决定价值取舍与跨店资源，内部人员逐步维护资料和运行。已验证常规工作可以扩大委派，新情况需要相应判断支持。\n\n这不是新增一套总结表，而是使一次生产同时留下下一轮可用材料。额外负担仍需观察，不能只因记录自动生成就认为成本下降。\n\n## 分别写出三类证据\n\n| 要证明什么 | 可以怎样观察 | 不能用什么替代 |\n|---|---|---|\n| 任务合格 | 事实、条件与建议准确，状态能对应 | 日报更流畅 |\n| 业务有效 | 与合理替代比较全网结果和相关成本 | 一店销量上涨 |\n| 组织学会 | 接任、留出任务与新店迁移能用对经验 | 文档和调用增长 |\n\n共享库存会造成相互影响，潜在需求也不完全可见。试点可以先识别流程断点和关键差别，再逐步取得更强业务证据。\n\n## 把成本与能力作用并列\n\n给定需求X95、Y60的算例中，改配100/60比80/80多180元列示贡献。这只证明方法在给定条件下如何影响结果，没有证明AI预测，也未计入全部建设维护。\n\n智能费用、核验、返工、集成、持续维护和业务配合都应进入相关成本。节省工时先释放容量，现金要有实际取消支出或新增结果的路径。\n\n本轮留下的案例、工具与共同结构，预期用于接任和第九店；它们的未来作用需再使用检验，不任意估值补成回本。\n\n## 说明如何纠错与继续发展\n\n交通入口关闭时，旧分配可能失效；新的现场事实应进入当前任务，方法状态和代表样例随之更新。员工愿意报告例外，需要工作安排支持，而不能因报告坏结果受惩罚。\n\n阶段选择也要开放：继续改善现有店，验证新店迁移，研究配送，或探索预订服务，都可能合理。决定应由客户、能力与资源证据支持。\n\n长期FDE在这里承担连续工程，使发现不断进入实现；内部团队接住关键判断与运行，使合作留下企业能力。阶段强度可调整，不用依赖年限证明价值。\n\n## 换一种业务，检查论证是否还成立\n\n把对象换成设备售后，客户结果可能是可靠恢复和少复发；现场事实是版本、动作与后续观察；实物约束是专业人员和到场。不能只把“门店”替换成“设备”。\n\n换成专业服务，重点可能转向资料、构思、选择、客户行动与专家瓶颈，新服务还需重新检验需求、交付和收益。迁移要求重新认识关键关系。\n\n这正是课程的综合能力：用共同思考框架，理解不同企业，而不是把所有问题装进同一模板。\n\n## 一份提案最终需要让人看懂什么\n\n读者应能沿材料追到主张，沿主张理解行动，沿行动看到结果与成本，再理解留下的能力和下一步选择。关键未知应有具体名字，不能只写“存在风险”。\n\n吸收能力、动态能力、探索与利用、互补投入和商业模式研究，为这些判断提供专业内核；局部实地研究与实际业务则不断检验它们。没有一种理论替企业预先填写最终答案。\n\n课程提供的是能够主动建设、共同讨论并持续更新的判断能力。配套[改造提案工作簿](工作簿-改造提案.md)将这些关系转成可编辑材料，供经营、业务与工程一起使用。\n","html":"\u003ch1>第40章｜把整门课连成一份可以讨论的改造提案\u003c/h1>\n\u003cp>“建设企业AI知识库，提升效率，形成壁垒”表达了愿望，却仍无法安排工作。业务人员不知道先改哪里，工程人员不知道哪些条件重要，负责人也难以判断投入与结果。\u003c/p>\n\u003cp>一份完整提案，需要把客户价值、生产机制、智能资源和持续能力连起来。\u003c/p>\n\u003cp>\u003cstrong>提案应解释为何值得、怎样实现、凭何判断、谁持续承担，以及证据怎样改变下一步。\u003c/strong> 它不是系统清单，也不是一次性终局蓝图。\u003c/p>\n\u003ch2 id=\"lesson-40-section-1\">先看一份贯穿案例的候选提案\u003c/h2>\n\u003cp>以下仍为教学方案。区域烘焙连锁有8家门店和中央生产配送，已保存销量与库存，却没有持续保留售罄时点、未满足请求和当地事件。\u003c/p>\n\u003cp>候选方向是：改善晚间新鲜商品可得性，同时控制剩余，把有效判断留在组织。顾客是否真的因此选择企业，当前仍需核实；位置、价格与商品本身也可能解释购买。\u003c/p>\n\u003cp>这句话同时给出价值方向与未知，没有把企业自述优势写成事实。\u003c/p>\n\u003ch2 id=\"lesson-40-section-2\">从价值追到可改造机制\u003c/h2>\n\u003cp>X店18点卖完80个，后面仍有人询问；总部日报只保留销量80。下一次分配因此可能缺少判断条件。\u003c/p>\n\u003cp>本轮假设是：让必要现场信息进入分配，并把建议、正式安排、实际到店和营业结果关联起来，可能改善决定与经验再用。AI增量主要落在组织非标准材料、提示缺项与调用经验；分配数学本身不能全部算作生成式AI。\u003c/p>\n\u003cp>合理替代包括改进人工/SOP、使用成熟预测分配程序。若替代成本更低、效果相当，应采用合适方案。\u003c/p>\n\u003ch2 id=\"lesson-40-section-3\">把能力实现拆成相连工作\u003c/h2>\n\u003cp>门店提供自然发生的事件与售罄信息；AI组织相关材料，区分事实、解释与候选；中央团队按总量和配送条件形成正式安排；实际到店与营业结果返回。\u003c/p>\n\u003cp>FDE负责关联、工具、工作入口和评价，业务负责人决定价值取舍与跨店资源，内部人员逐步维护资料和运行。已验证常规工作可以扩大委派，新情况需要相应判断支持。\u003c/p>\n\u003cp>这不是新增一套总结表，而是使一次生产同时留下下一轮可用材料。额外负担仍需观察，不能只因记录自动生成就认为成本下降。\u003c/p>\n\u003ch2 id=\"lesson-40-section-4\">分别写出三类证据\u003c/h2>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>要证明什么\u003c/th>\n\u003cth>可以怎样观察\u003c/th>\n\u003cth>不能用什么替代\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>任务合格\u003c/td>\n\u003ctd>事实、条件与建议准确，状态能对应\u003c/td>\n\u003ctd>日报更流畅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>业务有效\u003c/td>\n\u003ctd>与合理替代比较全网结果和相关成本\u003c/td>\n\u003ctd>一店销量上涨\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>组织学会\u003c/td>\n\u003ctd>接任、留出任务与新店迁移能用对经验\u003c/td>\n\u003ctd>文档和调用增长\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>共享库存会造成相互影响，潜在需求也不完全可见。试点可以先识别流程断点和关键差别，再逐步取得更强业务证据。\u003c/p>\n\u003ch2 id=\"lesson-40-section-5\">把成本与能力作用并列\u003c/h2>\n\u003cp>给定需求X95、Y60的算例中，改配100/60比80/80多180元列示贡献。这只证明方法在给定条件下如何影响结果，没有证明AI预测，也未计入全部建设维护。\u003c/p>\n\u003cp>智能费用、核验、返工、集成、持续维护和业务配合都应进入相关成本。节省工时先释放容量，现金要有实际取消支出或新增结果的路径。\u003c/p>\n\u003cp>本轮留下的案例、工具与共同结构，预期用于接任和第九店；它们的未来作用需再使用检验，不任意估值补成回本。\u003c/p>\n\u003ch2 id=\"lesson-40-section-6\">说明如何纠错与继续发展\u003c/h2>\n\u003cp>交通入口关闭时，旧分配可能失效；新的现场事实应进入当前任务，方法状态和代表样例随之更新。员工愿意报告例外，需要工作安排支持，而不能因报告坏结果受惩罚。\u003c/p>\n\u003cp>阶段选择也要开放：继续改善现有店，验证新店迁移，研究配送，或探索预订服务，都可能合理。决定应由客户、能力与资源证据支持。\u003c/p>\n\u003cp>长期FDE在这里承担连续工程，使发现不断进入实现；内部团队接住关键判断与运行，使合作留下企业能力。阶段强度可调整，不用依赖年限证明价值。\u003c/p>\n\u003ch2 id=\"lesson-40-section-7\">换一种业务，检查论证是否还成立\u003c/h2>\n\u003cp>把对象换成设备售后，客户结果可能是可靠恢复和少复发；现场事实是版本、动作与后续观察；实物约束是专业人员和到场。不能只把“门店”替换成“设备”。\u003c/p>\n\u003cp>换成专业服务，重点可能转向资料、构思、选择、客户行动与专家瓶颈，新服务还需重新检验需求、交付和收益。迁移要求重新认识关键关系。\u003c/p>\n\u003cp>这正是课程的综合能力：用共同思考框架，理解不同企业，而不是把所有问题装进同一模板。\u003c/p>\n\u003ch2 id=\"lesson-40-section-8\">一份提案最终需要让人看懂什么\u003c/h2>\n\u003cp>读者应能沿材料追到主张，沿主张理解行动，沿行动看到结果与成本，再理解留下的能力和下一步选择。关键未知应有具体名字，不能只写“存在风险”。\u003c/p>\n\u003cp>吸收能力、动态能力、探索与利用、互补投入和商业模式研究，为这些判断提供专业内核；局部实地研究与实际业务则不断检验它们。没有一种理论替企业预先填写最终答案。\u003c/p>\n\u003cp>课程提供的是能够主动建设、共同讨论并持续更新的判断能力。配套\u003ca href=\"#workbook\">改造提案工作簿\u003c/a>将这些关系转成可编辑材料，供经营、业务与工程一起使用。\u003c/p>\n","headings":[{"id":"lesson-40-section-1","label":"先看一份贯穿案例的候选提案"},{"id":"lesson-40-section-2","label":"从价值追到可改造机制"},{"id":"lesson-40-section-3","label":"把能力实现拆成相连工作"},{"id":"lesson-40-section-4","label":"分别写出三类证据"},{"id":"lesson-40-section-5","label":"把成本与能力作用并列"},{"id":"lesson-40-section-6","label":"说明如何纠错与继续发展"},{"id":"lesson-40-section-7","label":"换一种业务，检查论证是否还成立"},{"id":"lesson-40-section-8","label":"一份提案最终需要让人看懂什么"}],"exportMd":"# 第40章｜把整门课连成一份可以讨论的改造提案\n\n“建设企业AI知识库，提升效率，形成壁垒”表达了愿望，却仍无法安排工作。业务人员不知道先改哪里，工程人员不知道哪些条件重要，负责人也难以判断投入与结果。\n\n一份完整提案，需要把客户价值、生产机制、智能资源和持续能力连起来。\n\n**提案应解释为何值得、怎样实现、凭何判断、谁持续承担，以及证据怎样改变下一步。** 它不是系统清单，也不是一次性终局蓝图。\n\n## 先看一份贯穿案例的候选提案\n\n以下仍为教学方案。区域烘焙连锁有8家门店和中央生产配送，已保存销量与库存，却没有持续保留售罄时点、未满足请求和当地事件。\n\n候选方向是：改善晚间新鲜商品可得性，同时控制剩余，把有效判断留在组织。顾客是否真的因此选择企业，当前仍需核实；位置、价格与商品本身也可能解释购买。\n\n这句话同时给出价值方向与未知，没有把企业自述优势写成事实。\n\n## 从价值追到可改造机制\n\nX店18点卖完80个，后面仍有人询问；总部日报只保留销量80。下一次分配因此可能缺少判断条件。\n\n本轮假设是：让必要现场信息进入分配，并把建议、正式安排、实际到店和营业结果关联起来，可能改善决定与经验再用。AI增量主要落在组织非标准材料、提示缺项与调用经验；分配数学本身不能全部算作生成式AI。\n\n合理替代包括改进人工/SOP、使用成熟预测分配程序。若替代成本更低、效果相当，应采用合适方案。\n\n## 把能力实现拆成相连工作\n\n门店提供自然发生的事件与售罄信息；AI组织相关材料，区分事实、解释与候选；中央团队按总量和配送条件形成正式安排；实际到店与营业结果返回。\n\nFDE负责关联、工具、工作入口和评价，业务负责人决定价值取舍与跨店资源，内部人员逐步维护资料和运行。已验证常规工作可以扩大委派，新情况需要相应判断支持。\n\n这不是新增一套总结表，而是使一次生产同时留下下一轮可用材料。额外负担仍需观察，不能只因记录自动生成就认为成本下降。\n\n## 分别写出三类证据\n\n| 要证明什么 | 可以怎样观察 | 不能用什么替代 |\n|---|---|---|\n| 任务合格 | 事实、条件与建议准确，状态能对应 | 日报更流畅 |\n| 业务有效 | 与合理替代比较全网结果和相关成本 | 一店销量上涨 |\n| 组织学会 | 接任、留出任务与新店迁移能用对经验 | 文档和调用增长 |\n\n共享库存会造成相互影响，潜在需求也不完全可见。试点可以先识别流程断点和关键差别，再逐步取得更强业务证据。\n\n## 把成本与能力作用并列\n\n给定需求X95、Y60的算例中，改配100/60比80/80多180元列示贡献。这只证明方法在给定条件下如何影响结果，没有证明AI预测，也未计入全部建设维护。\n\n智能费用、核验、返工、集成、持续维护和业务配合都应进入相关成本。节省工时先释放容量，现金要有实际取消支出或新增结果的路径。\n\n本轮留下的案例、工具与共同结构，预期用于接任和第九店；它们的未来作用需再使用检验，不任意估值补成回本。\n\n## 说明如何纠错与继续发展\n\n交通入口关闭时，旧分配可能失效；新的现场事实应进入当前任务，方法状态和代表样例随之更新。员工愿意报告例外，需要工作安排支持，而不能因报告坏结果受惩罚。\n\n阶段选择也要开放：继续改善现有店，验证新店迁移，研究配送，或探索预订服务，都可能合理。决定应由客户、能力与资源证据支持。\n\n长期FDE在这里承担连续工程，使发现不断进入实现；内部团队接住关键判断与运行，使合作留下企业能力。阶段强度可调整，不用依赖年限证明价值。\n\n## 换一种业务，检查论证是否还成立\n\n把对象换成设备售后，客户结果可能是可靠恢复和少复发；现场事实是版本、动作与后续观察；实物约束是专业人员和到场。不能只把“门店”替换成“设备”。\n\n换成专业服务，重点可能转向资料、构思、选择、客户行动与专家瓶颈，新服务还需重新检验需求、交付和收益。迁移要求重新认识关键关系。\n\n这正是课程的综合能力：用共同思考框架，理解不同企业，而不是把所有问题装进同一模板。\n\n## 一份提案最终需要让人看懂什么\n\n读者应能沿材料追到主张，沿主张理解行动，沿行动看到结果与成本，再理解留下的能力和下一步选择。关键未知应有具体名字，不能只写“存在风险”。\n\n吸收能力、动态能力、探索与利用、互补投入和商业模式研究，为这些判断提供专业内核；局部实地研究与实际业务则不断检验它们。没有一种理论替企业预先填写最终答案。\n\n课程提供的是能够主动建设、共同讨论并持续更新的判断能力。配套[改造提案工作簿](#workbook)将这些关系转成可编辑材料，供经营、业务与工程一起使用。\n","exportSingleMd":"# 第40章｜把整门课连成一份可以讨论的改造提案\n\n“建设企业AI知识库，提升效率，形成壁垒”表达了愿望，却仍无法安排工作。业务人员不知道先改哪里，工程人员不知道哪些条件重要，负责人也难以判断投入与结果。\n\n一份完整提案，需要把客户价值、生产机制、智能资源和持续能力连起来。\n\n**提案应解释为何值得、怎样实现、凭何判断、谁持续承担，以及证据怎样改变下一步。** 它不是系统清单，也不是一次性终局蓝图。\n\n## 先看一份贯穿案例的候选提案\n\n以下仍为教学方案。区域烘焙连锁有8家门店和中央生产配送，已保存销量与库存，却没有持续保留售罄时点、未满足请求和当地事件。\n\n候选方向是：改善晚间新鲜商品可得性，同时控制剩余，把有效判断留在组织。顾客是否真的因此选择企业，当前仍需核实；位置、价格与商品本身也可能解释购买。\n\n这句话同时给出价值方向与未知，没有把企业自述优势写成事实。\n\n## 从价值追到可改造机制\n\nX店18点卖完80个，后面仍有人询问；总部日报只保留销量80。下一次分配因此可能缺少判断条件。\n\n本轮假设是：让必要现场信息进入分配，并把建议、正式安排、实际到店和营业结果关联起来，可能改善决定与经验再用。AI增量主要落在组织非标准材料、提示缺项与调用经验；分配数学本身不能全部算作生成式AI。\n\n合理替代包括改进人工/SOP、使用成熟预测分配程序。若替代成本更低、效果相当，应采用合适方案。\n\n## 把能力实现拆成相连工作\n\n门店提供自然发生的事件与售罄信息；AI组织相关材料，区分事实、解释与候选；中央团队按总量和配送条件形成正式安排；实际到店与营业结果返回。\n\nFDE负责关联、工具、工作入口和评价，业务负责人决定价值取舍与跨店资源，内部人员逐步维护资料和运行。已验证常规工作可以扩大委派，新情况需要相应判断支持。\n\n这不是新增一套总结表，而是使一次生产同时留下下一轮可用材料。额外负担仍需观察，不能只因记录自动生成就认为成本下降。\n\n## 分别写出三类证据\n\n| 要证明什么 | 可以怎样观察 | 不能用什么替代 |\n|---|---|---|\n| 任务合格 | 事实、条件与建议准确，状态能对应 | 日报更流畅 |\n| 业务有效 | 与合理替代比较全网结果和相关成本 | 一店销量上涨 |\n| 组织学会 | 接任、留出任务与新店迁移能用对经验 | 文档和调用增长 |\n\n共享库存会造成相互影响，潜在需求也不完全可见。试点可以先识别流程断点和关键差别，再逐步取得更强业务证据。\n\n## 把成本与能力作用并列\n\n给定需求X95、Y60的算例中，改配100/60比80/80多180元列示贡献。这只证明方法在给定条件下如何影响结果，没有证明AI预测，也未计入全部建设维护。\n\n智能费用、核验、返工、集成、持续维护和业务配合都应进入相关成本。节省工时先释放容量，现金要有实际取消支出或新增结果的路径。\n\n本轮留下的案例、工具与共同结构，预期用于接任和第九店；它们的未来作用需再使用检验，不任意估值补成回本。\n\n## 说明如何纠错与继续发展\n\n交通入口关闭时，旧分配可能失效；新的现场事实应进入当前任务，方法状态和代表样例随之更新。员工愿意报告例外，需要工作安排支持，而不能因报告坏结果受惩罚。\n\n阶段选择也要开放：继续改善现有店，验证新店迁移，研究配送，或探索预订服务，都可能合理。决定应由客户、能力与资源证据支持。\n\n长期FDE在这里承担连续工程，使发现不断进入实现；内部团队接住关键判断与运行，使合作留下企业能力。阶段强度可调整，不用依赖年限证明价值。\n\n## 换一种业务，检查论证是否还成立\n\n把对象换成设备售后，客户结果可能是可靠恢复和少复发；现场事实是版本、动作与后续观察；实物约束是专业人员和到场。不能只把“门店”替换成“设备”。\n\n换成专业服务，重点可能转向资料、构思、选择、客户行动与专家瓶颈，新服务还需重新检验需求、交付和收益。迁移要求重新认识关键关系。\n\n这正是课程的综合能力：用共同思考框架，理解不同企业，而不是把所有问题装进同一模板。\n\n## 一份提案最终需要让人看懂什么\n\n读者应能沿材料追到主张，沿主张理解行动，沿行动看到结果与成本，再理解留下的能力和下一步选择。关键未知应有具体名字，不能只写“存在风险”。\n\n吸收能力、动态能力、探索与利用、互补投入和商业模式研究，为这些判断提供专业内核；局部实地研究与实际业务则不断检验它们。没有一种理论替企业预先填写最终答案。\n\n课程提供的是能够主动建设、共同讨论并持续更新的判断能力。配套[改造提案工作簿](https://zhongky1995.github.io/gaidn-fde-handbook/#workbook)将这些关系转成可编辑材料，供经营、业务与工程一起使用。\n","text":"# 第40章｜把整门课连成一份可以讨论的改造提案\n\n“建设企业AI知识库，提升效率，形成壁垒”表达了愿望，却仍无法安排工作。业务人员不知道先改哪里，工程人员不知道哪些条件重要，负责人也难以判断投入与结果。\n\n一份完整提案，需要把客户价值、生产机制、智能资源和持续能力连起来。\n\n**提案应解释为何值得、怎样实现、凭何判断、谁持续承担，以及证据怎样改变下一步。** 它不是系统清单，也不是一次性终局蓝图。\n\n## 先看一份贯穿案例的候选提案\n\n以下仍为教学方案。区域烘焙连锁有8家门店和中央生产配送，已保存销量与库存，却没有持续保留售罄时点、未满足请求和当地事件。\n\n候选方向是：改善晚间新鲜商品可得性，同时控制剩余，把有效判断留在组织。顾客是否真的因此选择企业，当前仍需核实；位置、价格与商品本身也可能解释购买。\n\n这句话同时给出价值方向与未知，没有把企业自述优势写成事实。\n\n## 从价值追到可改造机制\n\nX店18点卖完80个，后面仍有人询问；总部日报只保留销量80。下一次分配因此可能缺少判断条件。\n\n本轮假设是：让必要现场信息进入分配，并把建议、正式安排、实际到店和营业结果关联起来，可能改善决定与经验再用。AI增量主要落在组织非标准材料、提示缺项与调用经验；分配数学本身不能全部算作生成式AI。\n\n合理替代包括改进人工/SOP、使用成熟预测分配程序。若替代成本更低、效果相当，应采用合适方案。\n\n## 把能力实现拆成相连工作\n\n门店提供自然发生的事件与售罄信息；AI组织相关材料，区分事实、解释与候选；中央团队按总量和配送条件形成正式安排；实际到店与营业结果返回。\n\nFDE负责关联、工具、工作入口和评价，业务负责人决定价值取舍与跨店资源，内部人员逐步维护资料和运行。已验证常规工作可以扩大委派，新情况需要相应判断支持。\n\n这不是新增一套总结表，而是使一次生产同时留下下一轮可用材料。额外负担仍需观察，不能只因记录自动生成就认为成本下降。\n\n## 分别写出三类证据\n\n| 要证明什么 | 可以怎样观察 | 不能用什么替代 |\n|---|---|---|\n| 任务合格 | 事实、条件与建议准确，状态能对应 | 日报更流畅 |\n| 业务有效 | 与合理替代比较全网结果和相关成本 | 一店销量上涨 |\n| 组织学会 | 接任、留出任务与新店迁移能用对经验 | 文档和调用增长 |\n\n共享库存会造成相互影响，潜在需求也不完全可见。试点可以先识别流程断点和关键差别，再逐步取得更强业务证据。\n\n## 把成本与能力作用并列\n\n给定需求X95、Y60的算例中，改配100/60比80/80多180元列示贡献。这只证明方法在给定条件下如何影响结果，没有证明AI预测，也未计入全部建设维护。\n\n智能费用、核验、返工、集成、持续维护和业务配合都应进入相关成本。节省工时先释放容量，现金要有实际取消支出或新增结果的路径。\n\n本轮留下的案例、工具与共同结构，预期用于接任和第九店；它们的未来作用需再使用检验，不任意估值补成回本。\n\n## 说明如何纠错与继续发展\n\n交通入口关闭时，旧分配可能失效；新的现场事实应进入当前任务，方法状态和代表样例随之更新。员工愿意报告例外，需要工作安排支持，而不能因报告坏结果受惩罚。\n\n阶段选择也要开放：继续改善现有店，验证新店迁移，研究配送，或探索预订服务，都可能合理。决定应由客户、能力与资源证据支持。\n\n长期FDE在这里承担连续工程，使发现不断进入实现；内部团队接住关键判断与运行，使合作留下企业能力。阶段强度可调整，不用依赖年限证明价值。\n\n## 换一种业务，检查论证是否还成立\n\n把对象换成设备售后，客户结果可能是可靠恢复和少复发；现场事实是版本、动作与后续观察；实物约束是专业人员和到场。不能只把“门店”替换成“设备”。\n\n换成专业服务，重点可能转向资料、构思、选择、客户行动与专家瓶颈，新服务还需重新检验需求、交付和收益。迁移要求重新认识关键关系。\n\n这正是课程的综合能力：用共同思考框架，理解不同企业，而不是把所有问题装进同一模板。\n\n## 一份提案最终需要让人看懂什么\n\n读者应能沿材料追到主张，沿主张理解行动，沿行动看到结果与成本，再理解留下的能力和下一步选择。关键未知应有具体名字，不能只写“存在风险”。\n\n吸收能力、动态能力、探索与利用、互补投入和商业模式研究，为这些判断提供专业内核；局部实地研究与实际业务则不断检验它们。没有一种理论替企业预先填写最终答案。\n\n课程提供的是能够主动建设、共同讨论并持续更新的判断能力。配套改造提案工作簿将这些关系转成可编辑材料，供经营、业务与工程一起使用。\n"},{"file":"案例A-连锁备货.md","id":"case-a","number":null,"role":"案例","part":-1,"title":"案例A｜连锁备货：从销量记录到可更新的方法","md":"# 案例A｜连锁备货：从销量记录到可更新的方法\n\n以下企业、记录、价格和结果均为教学设定，不对应实际客户。案例用于推导，不是AI业绩证明。\n\n## 企业已经有什么，尚缺什么\n\n区域烘焙连锁有8家门店、中央生产和配送团队，已经有收银、库存和每日销售记录。负责人认为自己的强项是小批量及时供应、熟悉本地客流，希望扩大晚间新鲜商品可得性，同时控制剩余。\n\n强项目前只是企业自述。需要观察顾客选择、未买到后的行为、时段与复购，排查位置、价格和商品本身的影响。\n\n店长知道当地活动、临时交通和顾客询问，但这些信息常在聊天里。总部汇总后容易只剩销量。原店长离开，接任者难以重建判断条件。\n\n## 材料一：两店同日记录\n\n| 项目 | X店：交通节点附近 | Y店：社区附近 |\n|---|---:|---:|\n| 分配到店 | 80个 | 80个 |\n| 售出 | 80个 | 60个 |\n| 剩余 | 0个 | 20个 |\n| 现场情况 | 18点售罄，后来仍有人询问 | 正常营业至20点 |\n\nX销量80不代表需求只有80，未满足需求仍未知。询问也不能直接换算为确定购买量。\n\n店长原消息为“18点卖光，后来仍有人问，明天请多配”；总部日报只写“X销量80”。丢失的是后续判断可能需要的条件，而非数字本身错误。\n\n## 材料二：候选工作安排\n\n在安排生产前，门店保留事件与依据；AI组织近期销售、售罄和现场说明，提出候选；店长修改，中央团队按总量和配送条件形成正式安排。实际到店与营业反馈再返回。\n\n候选、修改、正式安排和实际执行分别保存。未表达的心理过程不假装已采集，事后解释不升级为当时事实。\n\n比较三种安排：改善人工记录与SOP，采用成熟预测分配方法，增加AI整理非标准信息与调用经验。AI增量需相对合理替代识别。\n\n## 材料三：给定需求下的分配算例\n\n与材料一不同，这里为了算账事先给定需求X95、Y60，总产量160，每个售价12元、生产变动成本4元，未售无残值。商品可在销售前自由分配，无替代购买、调价或时段差异。\n\n| 方案 | X/Y | 售出 | 剩余 | 收入 | 生产变动成本 | 列示贡献 |\n|---|---|---:|---:|---:|---:|---:|\n| 等量 | 80/80 | 140 | 20 | 1680元 | 640元 | 1040元 |\n| 改配 | 100/60 | 155 | 5 | 1860元 | 640元 | 1220元 |\n\n差额180元。它说明给定条件下的方法作用，不证明AI能预测需求，也未计入系统、人工和配送等全部成本。\n\n## 材料四：条件改变\n\n独立假设：X附近交通入口关闭，需求变为X50、Y90，其他算账条件不变。\n\n| 方案 | 售出 | 剩余 | 收入 | 列示贡献 |\n|---|---:|---:|---:|---:|\n| 80/80 | 130 | 30 | 1560元 | 920元 |\n| 100/60 | 110 | 50 | 1320元 | 680元 |\n\n照搬旧方案少240元。若交通在决定前已知却未使用，属于调用或工作设计问题；若决定后才出现，则需调整，不能用事后信息否定全部事前判断。\n\n## 材料五：扩张与组织\n\n第九店客群与配送不同。可以共享身份、事件、建议与正式行动区分、结果反馈和评价方式，需求与具体数量仍需重新学习。适配和维护成本必须计入。\n\n只按剩余考核可能鼓励少配，只用新增记录追责可能减少异常反馈。FDE实现工程与验证，业务负责人承担价值与资源取舍，内部成员逐步维护运行。\n\n## 推演时应保留的关键判断\n\n完整提案需要说明客户价值仍有哪些未知，资料怎样进入实际决定，AI比替代多做什么，经营与学习分别怎样验证。共享库存可能把销量从其他门店转移，需看全网结果。\n\n可能的下一步包括改善原店、验证新店、调整配送或探索预订服务。没有预定最优答案；每种选择都应能说明需要何种新证据。\n\n对应阅读：[经验与能力](05-从经验到能力.md)、[业务效果](30-业务效果与因果.md)、[完整提案](40-完整改造提案.md)。\n","html":"\u003ch1>案例A｜连锁备货：从销量记录到可更新的方法\u003c/h1>\n\u003cp>以下企业、记录、价格和结果均为教学设定，不对应实际客户。案例用于推导，不是AI业绩证明。\u003c/p>\n\u003ch2 id=\"case-a-section-1\">企业已经有什么，尚缺什么\u003c/h2>\n\u003cp>区域烘焙连锁有8家门店、中央生产和配送团队，已经有收银、库存和每日销售记录。负责人认为自己的强项是小批量及时供应、熟悉本地客流，希望扩大晚间新鲜商品可得性，同时控制剩余。\u003c/p>\n\u003cp>强项目前只是企业自述。需要观察顾客选择、未买到后的行为、时段与复购，排查位置、价格和商品本身的影响。\u003c/p>\n\u003cp>店长知道当地活动、临时交通和顾客询问，但这些信息常在聊天里。总部汇总后容易只剩销量。原店长离开，接任者难以重建判断条件。\u003c/p>\n\u003ch2 id=\"case-a-section-2\">材料一：两店同日记录\u003c/h2>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项目\u003c/th>\n\u003cth align=\"right\">X店：交通节点附近\u003c/th>\n\u003cth align=\"right\">Y店：社区附近\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>分配到店\u003c/td>\n\u003ctd align=\"right\">80个\u003c/td>\n\u003ctd align=\"right\">80个\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>售出\u003c/td>\n\u003ctd align=\"right\">80个\u003c/td>\n\u003ctd align=\"right\">60个\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>剩余\u003c/td>\n\u003ctd align=\"right\">0个\u003c/td>\n\u003ctd align=\"right\">20个\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>现场情况\u003c/td>\n\u003ctd align=\"right\">18点售罄，后来仍有人询问\u003c/td>\n\u003ctd align=\"right\">正常营业至20点\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>X销量80不代表需求只有80，未满足需求仍未知。询问也不能直接换算为确定购买量。\u003c/p>\n\u003cp>店长原消息为“18点卖光，后来仍有人问，明天请多配”；总部日报只写“X销量80”。丢失的是后续判断可能需要的条件，而非数字本身错误。\u003c/p>\n\u003ch2 id=\"case-a-section-3\">材料二：候选工作安排\u003c/h2>\n\u003cp>在安排生产前，门店保留事件与依据；AI组织近期销售、售罄和现场说明，提出候选；店长修改，中央团队按总量和配送条件形成正式安排。实际到店与营业反馈再返回。\u003c/p>\n\u003cp>候选、修改、正式安排和实际执行分别保存。未表达的心理过程不假装已采集，事后解释不升级为当时事实。\u003c/p>\n\u003cp>比较三种安排：改善人工记录与SOP，采用成熟预测分配方法，增加AI整理非标准信息与调用经验。AI增量需相对合理替代识别。\u003c/p>\n\u003ch2 id=\"case-a-section-4\">材料三：给定需求下的分配算例\u003c/h2>\n\u003cp>与材料一不同，这里为了算账事先给定需求X95、Y60，总产量160，每个售价12元、生产变动成本4元，未售无残值。商品可在销售前自由分配，无替代购买、调价或时段差异。\u003c/p>\n\u003cdiv class=\"table-scroll table-wide\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方案\u003c/th>\n\u003cth>X/Y\u003c/th>\n\u003cth align=\"right\">售出\u003c/th>\n\u003cth align=\"right\">剩余\u003c/th>\n\u003cth align=\"right\">收入\u003c/th>\n\u003cth align=\"right\">生产变动成本\u003c/th>\n\u003cth align=\"right\">列示贡献\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>等量\u003c/td>\n\u003ctd>80/80\u003c/td>\n\u003ctd align=\"right\">140\u003c/td>\n\u003ctd align=\"right\">20\u003c/td>\n\u003ctd align=\"right\">1680元\u003c/td>\n\u003ctd align=\"right\">640元\u003c/td>\n\u003ctd align=\"right\">1040元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>改配\u003c/td>\n\u003ctd>100/60\u003c/td>\n\u003ctd align=\"right\">155\u003c/td>\n\u003ctd align=\"right\">5\u003c/td>\n\u003ctd align=\"right\">1860元\u003c/td>\n\u003ctd align=\"right\">640元\u003c/td>\n\u003ctd align=\"right\">1220元\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"table-hint\">表格可左右滑动查看\u003c/p>\n\u003cp>差额180元。它说明给定条件下的方法作用，不证明AI能预测需求，也未计入系统、人工和配送等全部成本。\u003c/p>\n\u003ch2 id=\"case-a-section-5\">材料四：条件改变\u003c/h2>\n\u003cp>独立假设：X附近交通入口关闭，需求变为X50、Y90，其他算账条件不变。\u003c/p>\n\u003cdiv class=\"table-scroll table-wide\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方案\u003c/th>\n\u003cth align=\"right\">售出\u003c/th>\n\u003cth align=\"right\">剩余\u003c/th>\n\u003cth align=\"right\">收入\u003c/th>\n\u003cth align=\"right\">列示贡献\u003c/th>\n |\n| 剩余 | 0个 | 20个 |\n| 现场情况 | 18点售罄，后来仍有人询问 | 正常营业至20点 |\n\nX销量80不代表需求只有80，未满足需求仍未知。询问也不能直接换算为确定购买量。\n\n店长原消息为“18点卖光，后来仍有人问，明天请多配”；总部日报只写“X销量80”。丢失的是后续判断可能需要的条件，而非数字本身错误。\n\n## 材料二：候选工作安排\n\n在安排生产前，门店保留事件与依据；AI组织近期销售、售罄和现场说明，提出候选；店长修改，中央团队按总量和配送条件形成正式安排。实际到店与营业反馈再返回。\n\n候选、修改、正式安排和实际执行分别保存。未表达的心理过程不假装已采集，事后解释不升级为当时事实。\n\n比较三种安排：改善人工记录与SOP，采用成熟预测分配方法，增加AI整理非标准信息与调用经验。AI增量需相对合理替代识别。\n\n## 材料三：给定需求下的分配算例\n\n与材料一不同，这里为了算账事先给定需求X95、Y60，总产量160，每个售价12元、生产变动成本4元，未售无残值。商品可在销售前自由分配，无替代购买、调价或时段差异。\n\n| 方案 | X/Y | 售出 | 剩余 | 收入 | 生产变动成本 | 列示贡献 |\n|---|---|---:|---:|---:|---:|---:|\n| 等量 | 80/80 | 140 | 20 | 1680元 | 640元 | 1040元 |\n| 改配 | 100/60 | 155 | 5 | 1860元 | 640元 | 1220元 |\n\n差额180元。它说明给定条件下的方法作用，不证明AI能预测需求，也未计入系统、人工和配送等全部成本。\n\n## 材料四：条件改变\n\n独立假设：X附近交通入口关闭，需求变为X50、Y90，其他算账条件不变。\n\n| 方案 | 售出 | 剩余 | 收入 | 列示贡献 |\n|---|---:|---:|---:|---:|\n| 80/80 | 130 | 30 | 1560元 | 920元 |\n| 100/60 | 110 | 50 | 1320元 | 680元 |\n\n照搬旧方案少240元。若交通在决定前已知却未使用，属于调用或工作设计问题；若决定后才出现，则需调整，不能用事后信息否定全部事前判断。\n\n## 材料五：扩张与组织\n\n第九店客群与配送不同。可以共享身份、事件、建议与正式行动区分、结果反馈和评价方式，需求与具体数量仍需重新学习。适配和维护成本必须计入。\n\n只按剩余考核可能鼓励少配，只用新增记录追责可能减少异常反馈。FDE实现工程与验证，业务负责人承担价值与资源取舍，内部成员逐步维护运行。\n\n## 推演时应保留的关键判断\n\n完整提案需要说明客户价值仍有哪些未知，资料怎样进入实际决定，AI比替代多做什么，经营与学习分别怎样验证。共享库存可能把销量从其他门店转移，需看全网结果。\n\n可能的下一步包括改善原店、验证新店、调整配送或探索预订服务。没有预定最优答案；每种选择都应能说明需要何种新证据。\n\n对应阅读：[经验与能力](#lesson-05)、[业务效果](#lesson-30)、[完整提案](#lesson-40)。\n","exportSingleMd":"# 案例A｜连锁备货：从销量记录到可更新的方法\n\n以下企业、记录、价格和结果均为教学设定，不对应实际客户。案例用于推导，不是AI业绩证明。\n\n## 企业已经有什么，尚缺什么\n\n区域烘焙连锁有8家门店、中央生产和配送团队，已经有收银、库存和每日销售记录。负责人认为自己的强项是小批量及时供应、熟悉本地客流，希望扩大晚间新鲜商品可得性，同时控制剩余。\n\n强项目前只是企业自述。需要观察顾客选择、未买到后的行为、时段与复购，排查位置、价格和商品本身的影响。\n\n店长知道当地活动、临时交通和顾客询问，但这些信息常在聊天里。总部汇总后容易只剩销量。原店长离开，接任者难以重建判断条件。\n\n## 材料一：两店同日记录\n\n| 项目 | X店：交通节点附近 | Y店：社区附近 |\n|---|---:|---:|\n| 分配到店 | 80个 | 80个 |\n| 售出 | 80个 | 60个 |\n| 剩余 | 0个 | 20个 |\n| 现场情况 | 18点售罄，后来仍有人询问 | 正常营业至20点 |\n\nX销量80不代表需求只有80，未满足需求仍未知。询问也不能直接换算为确定购买量。\n\n店长原消息为“18点卖光，后来仍有人问，明天请多配”；总部日报只写“X销量80”。丢失的是后续判断可能需要的条件，而非数字本身错误。\n\n## 材料二：候选工作安排\n\n在安排生产前，门店保留 n\n候选、修改、正式安排和实际执行分别保存。未表达的心理过程不假装已采集，事后解释不升级为当时事实。\n\n比较三种安排：改善人工记录与SOP，采用成熟预测分配方法，增加AI整理非标准信息与调用经验。AI增量需相对合理替代识别。\n\n## 材料三：给定需求下的分配算例\n\n与材料一不同，这里为了算账事先给定需求X95、Y60，总产量160，每个售价12元、生产变动成本4元，未售无残值。商品可在销售前自由分配，无替代购买、调价或时段差异。\n\n| 方案 | X/Y | 售出 | 剩余 | 收入 | 生产变动成本 | 列示贡献 |\n|---|---|---:|---:|---:|---:|---:|\n| 等量 | 80/80 | 140 | 20 | 1680元 | 640元 | 1040元 |\n| 改配 | 100/60 | 155 | 5 | 1860元 | 640元 | 1220元 |\n\n差额180元。它说明给定条件下的方法作用，不证明AI能预测需求，也未计入系统、人工和配送等全部成本。\n\n## 材料四：条件改变\n\n独立假设：X附近交通入口关闭，需求变为X50、Y90，其他算账条件不变。\n\n| 方案 | 售出 | 剩余 | 收入 | 列示贡献 |\n|---|---:|---:|---:|---:|\n| 80/80 | 130 | 30 | 1560元 | 920元 |\n| 100/60 | 110 | 50 | 1320元 | 680元 |\n\n照搬旧方案少240元。若交通在决定前已知却未使用，属于调用或工作设计问题；若决定后才出现，则需调整，不能用事后信息否定全部事前判断。\n\n## 材料五：扩张与组织\n\n第九店客群与配送不同。可以共享身份、事件、建议与正式行动区分、结果反馈和评价方式，需求与具体数量仍需重新学习。适配和维护成本必须计入。\n\n只按剩余考核可能鼓励少配，只用新增记录追责可能减少异常反馈。FDE实现工程与验证，业务负责人承担价值与资源取舍，内部成员逐步维护运行。\n\n## 推演时应保留的关键判断\n\n完整提案需要说明客户价值仍有哪些未知，资料怎样进入实际决定，AI比替代多做什么，经营与学习分别怎样验证。共享库存可能把销量从其他门店转移，需看全网结果。\n\n可能的下一步包括改善原店、验证新店、调整配送或探索预订服务。没有预定最优答案；每种选择都应能说明需要何种新证据。\n\n对应阅读：经验与能力、业务效果、完整提案。\n"},{"file":"案例B-智能资源成本.md","id":"case-b","number":null,"role":"案例","part":-1,"title":"案例B｜同等合格任务，成本与现金怎样分开","md":"# 案例B｜同等合格任务，成本与现金怎样分开\n\n以下为独立教学条件，并非当前模型报价、实际测评或客户收益。\n\n## 比较前提\n\nA与B处理同一组1000项任务。全部输出都经复核，失败项全部被发现，额外返工后达到相同质量。人工每小时按60元估价。只计算列明项目。\n\n| 条件 | A | B |\n|---|---:|---:|\n| 单项模型费 | 0.4元 | 1.2元 |\n| 常规复核 | 4分钟 | 2分钟 |\n| 额外返工比例 | 20% | 5% |\n| 每项额外返工 | 10分钟 | 10分钟 |\n\n## 逐项计算\n\nA模型费400元。常规复核4000分钟，按估价计4000元；返工200项×10分钟，计2000元。列示成本6400元，人工100小时。\n\nB模型费1200元。常规复核2000分钟，计2000元；返工50项×10分钟，计500元。列示成本3700元，人工约41.67小时。\n\n因此B模型多800元，少占约58.33小时，列示成本少2700元。\n\n## 现金发生了什么\n\n如果薪酬固定，少占工时首先释放容量，没有自动少发工资。另给条件：其中20小时外包确实被取消，现金少支出1200元，再扣新增模型费800元，列示现金改善400元。\n\n剩余释放时间可以用于其他交付、质量或减负，但尚无实际结果时不能全部货币化。也不能同时把同一小时当作取消支出和新增业务，重复计入收益。\n\n## 比较还缺什么\n\n建设、平台、持续维护和业务配合没有进入该局部算例。若两方案不同，应补相关成本后再作项目选择。\n\n等质量是给定前提，真实测量必须验证。若B漏检错误，或者任务更容易，结果不可直接比较。若复核由原专家额外照看，也应保留实际工时与条件。\n\n## 从选择延伸到能力\n\n若企业还愿意投入建立可复用方法，应说明未来用途、维护与再用检验。不要给知识任意估值后加入收益，也不必要求所有当期交付都形成长期资产。\n\n对应阅读：[完整成本](26-完整成本与兑现.md)、[能力留存](27-能力留存.md)、[阶段投入](28-投入组合.md)。\n","html":"\u003ch1>案例B｜同等合格任务，成本与现金怎样分开\u003c/h1>\n\u003cp>以下为独立教学条件，并非当前模型报价、实际测评或客户收益。\u003c/p>\n\u003ch2 id=\"case-b-section-1\">比较前提\u003c/h2>\n\u003cp>A与B处理同一组1000项任务。全部输出都经复核，失败项全部被发现，额外返工后达到相同质量。人工每小时按60元估价。只计算列明项目。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>条件\u003c/th>\n\u003cth align=\"right\">A\u003c/th>\n\u003cth align=\"right\">B\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>单项模型费\u003c/td>\n\u003ctd align=\"right\">0.4元\u003c/td>\n\u003ctd align=\"right\">1.2元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>常规复核\u003c/td>\n\u003ctd align=\"right\">4分钟\u003c/td>\n\u003ctd align=\"right\">2分钟\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>额外返工比例\u003c/td>\n\u003ctd align=\"right\">20%\u003c/td>\n\u003ctd align=\"right\">5%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>每项额外返工\u003c/td>\n\u003ctd align=\"right\">10分钟\u003c/td>\n\u003ctd align=\"right\">10分钟\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"case-b-section-2\">逐项计算\u003c/h2>\n\u003cp>A模型费400元。常规复核4000分钟，按估价计4000元；返工200项×10分钟，计2000元。列示成本6400元，人工100小时。\u003c/p>\n\u003cp>B模型费1200元。常规复核2000分钟，计2000元；返工50项×10分钟，计500元。列示成本3700元，人工约41.67小时。\u003c/p>\n\u003cp>因此B模型多800元，少占约58.33小时，列示成本少2700元。\u003c/p>\n\u003ch2 id=\"case-b-section-3\">现金发生了什么\u003c/h2>\n\u003cp>如果薪酬固定，少占工时首先释放容量，没有自动少发工资。另给条件：其中20小时外包确实被取消，现金少支出1200元，再扣新增模型费800元，列示现金改善400元。\u003c/p>\n\u003cp>剩余释放时间可以用于其他交付、质量或减负，但尚无实际结果时不能全部货币化。也不能同时把同一小时当作取消支出和新增业务，重复计入收益。\u003c/p>\n\u003ch2 id=\"case-b-section-4\">比较还缺什么\u003c/h2>\n\u003cp>建设、平台、持续维护和业务配合没有进入该局部算例。若两方案不同，应补相关成本后再作项目选择。\u003c/p>\n\u003cp>等质量是给定前提，真实测量必须验证。若B漏检错误，或者任务更容易，结果不可直接比较。若复核由原专家额外照看，也应保留实际工时与条件。\u003c/p>\n\u003ch2 id=\"case-b-section-5\">从选择延伸到能力\u003c/h2>\n\u003cp>若企业还愿意投入建立可复用方法，应说明未来用途、维护与再用检验。不要给知识任意估值后加入收益，也不必要求所有当期交付都形成长期资产。\u003c/p>\n\u003cp>对应阅读：\u003 选解释与补问方向，不能宣布统一方法有效或无效。\n\n## 接任任务\n\n原技术员请假，接任者处理版本不同、未参与整理的新工单。他需要看到原材料、纠正、候选解释与适用状态。观察其能否识别差别、补关键事实并选择下一步，不预定其成功。\n\n还应检查工具与专业支持是否可得。资料完整但资源只在原技术员手里，组织仍不能接续。\n\n## 派工与真实结果\n\nAI建议、调度采用、系统接受、到场、客户恢复与后续复发分开。提交无回显时先查实际状态，不能凭最后一句话决定重复派单。\n\n另对照两笔同日关闭工单：一笔客户恢复且后续稳定，另一笔先关闭、次日重新报修。只看关闭率，会错判价值并可能扭曲人员行为。\n\n## 长期发展\n\nFDE可先使记录与状态可信，再共同研究复发、专业支持与派工。内部负责人逐步掌握资料、评价和接续。若探索持续设备服务，还需重新验证客户需要、现场容量与收费安排。\n\n对应阅读：[生产采集](07-生产中的采集.md)、[经验可信度](08-经验的可信度.md)、[接任检验](31-组织学习的验证.md)、[长期共建](34-长期FDE共建.md)。\n","html":"\u003ch1>案例C｜设备售后：记录、原因与接任\u003c/h1>\n\u003cp>以下企业、设备代号与工单均为教学设定，不对应真实产品，不提供维修操作建议。\u003c/p>\n\u003ch2 id=\"case-c-section-1\">企业处境\u003c/h2>\n\u003cp>企业销售设备并提供售后，有客服、调度、现场技术员与专业支持。负责人认为资深技术员善于抓关键，现有系统却主要记录报修、派工和关闭。实际动作、版本与后续复发没有总是关联。\u003c/p>\n\u003cp>待验证的客户价值是可靠恢复、减少重复处理。关闭更快只是一个中间状态。\u003c/p>\n\u003ch2 id=\"case-c-section-2\">原始材料与草稿\u003c/h2>\n\u003cp>客户M1描述：“促销时段间歇停机。”系统知道版本V1，负载记录不完整。技术员说明“调整设置并重启，未更换部件”。AI草稿误写“更换部件后恢复”，被纠正。\u003c/p>\n\u003cp>客户描述是报告，技术员说明是动作记录，AI草稿是候选。各自需要必要核对，不因句子流畅就具有事实地位。纠正要进入最终工单与后续经验。\u003c/p>\n\u003ch2 id=\"case-c-section-3\">四条恢复记录\u003c/h2>\n\u003cdiv class=\"table-scroll table-wide\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>工单\u003c/th>\n\u003cth>版本\u003c/th>\n\u003cth>已记录动作\u003c/th>\n\u003cth>恢复与观察\u003c/th>\n\u003cth>尚缺\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>M1\u003c/td>\n\u003ctd>V1\u003c/td>\n\u003ctd>调整并重启，未换件\u003c/td>\n\u003ctd>当次恢复，记录到次日\u003c/td>\n\u003ctd>负载、长期是否复发\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M2\u003c/td>\n\u003ctd>V1\u003c/td>\n\u003ctd>调整并重启\u003c/td>\n\u003ctd>当次恢复，记录到次日\u003c/td>\n\u003ctd>条件是否与M1一致\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M3\u003c/td>\n\u003ctd>V2\u003c/td>\n\u003ctd>调整，未记录重启\u003c/td>\n\u003ctd>一小时后报告恢复\u003c/td>\n\u003ctd>中间变化与完整动作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M4\u003c/td>\n\u003ctd>V1\u003c/td>\n\u003ctd>仅记录重启\u003c/td>\n\u003ctd>当次恢复，记录到次日\u003c/td>\n\u003ctd>是否属于相同问题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"table-hint\">表格可左右滑动查看\u003c/p>\n\u003cp>这些材料无法区分调整、重启、版本和运行条件的作用。可以形成候选解释与补问方向，不能宣布统一方法有效或无效。\u003c/p>\n\u003ch2 id=\"case-c-section-4\">接任任务\u003c/h2>\n\u003cp>原技术员请假，接任者处理版本不同、未参与整理的新工单。他需要看到原材料、纠正、候选解释与适用状态。观察其能否识别差别、补关键事实并选择下一步，不预定其成功。\u003c/p>\n\u003cp>还应检查工具与专业支持是否可得。资料完整但资源只在原技术员手里，组织仍不能接续。\u003c/p>\n\u003ch2 id=\"case-c-section-5\">派工与真实结果\u003c/h2>\n\u003cp>AI建议、调度采用、系统接受、到场、客户恢复与后续复发分开。提交无回显时先查实际状态，不能凭最后一句话决定重复派单。\u003c/p>\n\u003cp>另对照两笔同日关闭工单：一笔客户恢复且后续稳定，另一笔先关闭、次日重新报修。只看关闭率，会错判价值并可能扭曲人员行为。\u003c/p>\n\u003ch2 id=\"case-c-section-6\">长期发展\u003c/h2>\n\u003cp>FDE可先使记录与状态可信，再共同研究复发、专业支持与派工。内部负责人逐步掌握资料、评价和接续。若探索持续设备服务，还需重新验证客户需要、现场容量与收费安排。\u003c/p>\n\u003cp>对应阅读：\u003ca href=\"#lesson-07\">生产采集\u003c/a>、\u003ca href=\"#lesson-08\">经验可信度\u003c/a>、\u003ca href=\"#lesson-31\">接任检验\u003c/a>、\u003ca href=\"#lesson-34\">长期共建\u003c/a>。\u003c/p>\n","headings":[{"id":"case-c-section-1","label":"企业处境"},{"id":"case-c-section-2","label":"原始材料与草稿"},{"id":"case-c-section-3","label":"四条恢复记录"},{"id":"case-c-section-4","label":"接任任务"},{"id":"case-c-section-5","label":"派工与真实结果"},{"id":"case-c-section-6","label":"长期发展"}],"exportMd":"# 案例C｜设备售后：记录、原因与接任\n\n以下企业、设备代号与工单均为教学设定，不对应真实产品，不提供维修操作建议。\n\n## 企业处境\n\n企业销售设备并提供售后，有客服、调度、现场技术员与专业支持。负责人认为资深技术员善于抓关键，现有系统却主要记录报修、派工和关闭。实际动作、版本与后续复发没有总是关联。\n\n待验证的客户价值是可靠恢复、减少重复处理。关闭更快只是一个中间状态。\n\n## 原始材料与草稿\n\n客户M1描述：“促销时段间歇停机。”系统知道版本V1，负载记录不完整。技术员说明“调整设置并重启，未更换部件”。AI草稿误写“更换部件后恢复”，被纠正。\n\n客户描述是报告，技术员说明是动作记录，AI草稿是候选。各自需要必要核对，不因句子流畅就具有事实地位。纠正要进入最终工单与后续经验。\n\n## 四条恢复记录\n\n| 工单 | 版本 | 已记录动作 | 恢复与观察 | 尚缺 |\n|---|---|---|---|---|\n| M1 | V1 | 调整并重启，未换件 | 当次恢复，记录到次日 | 负载、长期是否复发 |\n| M2 | V1 | 调整并重启 | 当次恢复，记录到次日 | 条件是否与M1一致 |\n| M3 | V2 | 调整，未记录重启 | 一小时后报告恢复 | 中间变化与完整动作 |\n| M4 | V1 | 仅记录重启 | 当次恢复，记录到次日 | 是否属于相同问题 |\n\n这些材料无法区分调整、重启、版本和运行条件的作用。可以形成候选解释与补问方向，不能宣布统一方法有效或无效。\n\n## 接任任务\n\n原技术员请假，接任者处理版本不同、未参与整理的新工单。他需要看到原材料、纠正、候选解释与适用状态。观察其能否识别差别、补关键事实并选择下一步，不预定其成功。\n\n还应检查工具与专业支持是否可得。资料完整但资源只在原技术员手里，组织仍不能接续。\n\n## 派工与真实结果\n\nAI建议、调度采用、系统接受、到场、客户恢复与后续复发分开。提交无回显时先查实际状态，不能凭最后一句话决定重复派单。\n\n另对照两笔同日关闭工单：一笔客户恢复且后续稳定，另一笔先关闭、次日重新报修。只看关闭率，会错判价值并可能扭曲人员行为。\n\n## 长期发展\n\nFDE可先使记录与状态可信，再共同研究复发、专业支持与派工。内部负责人逐步掌握资料、评价和接续。若探索持续设备服务，还需重新验证客户需要、现场容量与收费安排。\n\n对应阅读：[生产采集](#lesson-07)、[经验可信度](#lesson-08)、[接任检验](#lesson-31)、[长期共建](#lesson-34)。\n","exportSingleMd":"# 案例C｜设备售后：记录、原因与接任\n\n以下企业、设备代号与工单均为教学设定，不对应真实产品，不提供维修操作建议。\n\n## 企业处境\n\n企业销售设备并提供售后，有客服、调度、现场技术员与专业支持。负责人认为资深技术员善于抓关键，现有系统却主要记录报修、派工和关闭。实际动作、版本与后续复发没有总是关联。\n\n待验证的客户价值是可靠恢复、减少重复处理。关闭更快只是一个中间状态。\n\n## 原始材料与草稿\n\n客户M1描述：“促销时段间歇停机。”系统知道版本V1，负载记录不完整。技术员说明“调整设置并重启，未更换部件”。AI草稿误写“更换部件后恢复”，被纠正。\n\n客户描述是报告，技术员说明是动作记录，AI草稿是候选。各自需要必要核对，不因句子流畅就具有事实地位。纠正要进入最终工单与后续经验。\n\n## 四条恢复记录\n\n| 工单 | 版本 | 已记录动作 | 恢复与观察 | 尚缺 |\n|---|---|---|---|---|\n| M1 | V1 | 调整并重启，未换件 | 当次恢复，记录到次日 | 负载、长期是否复发 |\n| M2 | V1 | 调整并重启 | 当次恢复，记录到次日 | 条件是否与M1一致 |\n| M3 | V2 | 调整，未记录重启 | 一小时后报告恢复 | 中间变化与完整动作 |\n| M4 | V1 | 仅记录重启 | 当次恢复，记录到次日 | 是否属于相同问题 |\n\n这些材料无法区分调整、重启、版本和运行条件的作用。可以形成候选解释与补问方向，不能宣布统一方法有效或无效。\n\n## 接任任务\n\n原技术员请假，接任者处理版本不同、未参与整理的新工单。他需要看到原材料、纠正、候选解释与适用状态。观察其能否识别差别、补关键事实并选择下一步，不预定其成功。\n\n还应检查工具与专业支持是否可得。资料完整但资源只在原技术员手里，组织仍不能接续。\n\n## 派工与真实结果\n\nAI建议、调度采用、系统接受、到场、客户恢复与后续复发分开。提交无回显时先查实际状态，不能凭最后一句话决定重复派单。\n\n另对照两笔同日关闭工单：一笔客户恢复且后续稳定，另一笔先关闭、次日重新报修。只看关闭率，会错判价值并可能扭曲人员行为。\n\n## 长期发展\n\nFDE可先使记录与状态可信，再共同研究复发、专业支持与派工。内部负责人逐步掌握资料、评价和接续。若探索持续设备服务，还需重新验证客户需要、现场容量与收费安排。\n\n对应阅读：[生产采集](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-07)、[经验可信度](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-08)、[接任检验](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-31)、[长期共建](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-34)。\n","text":"# 案例C｜设备售后：记录、原因与接任\n\n以下企业、设备代号与工单均为教学设定，不对应真实产品，不提供维修操作建议。\n\n## 企业处境\n\n企业销售设备并提供售后，有客服、调度、现场技术员与专业支持。负责人认为资深技术员善于抓关键，现有系统却主要记录报修、派工和关闭。实际动作、版本与后续复发没有总是关联。\n\n待验证的客户价值是可靠恢复、减少重复处理。关闭更快只是一个中间状态。\n\n## 原始材料与草稿\n\n客户M1描述：“促销时段间歇停机。”系统知道版本V1，负载记录不完整。技术员说明“调整设置并重启，未更换部件”。AI草稿误写“更换部件后恢复”，被纠正。\n\n客户描述是报告，技术员说明是动作记录，AI草稿是候选。各自需要必要核对，不因句子流畅就具有事实地位。纠正要进入最终工单与后续经验。\n\n## 四条恢复记录\n\n| 工单 | 版本 | 已记录动作 | 恢复与观察 | 尚缺 |\n|---|---|---|---|---|\n| M1 | V1 | 调整并重启，未换件 | 当次恢复，记录到次日 | 负载、长期是否复发 |\n| M2 | V1 | 调整并重启 | 当次恢复，记录到次日 | 条件是否与M1一致 |\n| M3 | V2 | 调整，未记录重启 | 一小时后报告恢复 | 中间变化与完整动作 |\n| M4 | V1 | 仅记录重启 | 当次恢复，记录到次日 | 是否属于相同问题 |\n\n这些材料无法区分调整、重启、版本和运行条件的作用。可以形成候选解释与补问方向，不能宣布统一方法有效或无效。\n\n## 接任任务\n\n原技术员请假，接任者处理版本不同、未参与整理的新工单。他需要看到原材料、纠正、候选解释与适用状态。观察其能否识别差别、补关键事实并选择下一步，不预定其成功。\n\n还应检查工具与专业支持是否可得。资料完整但资源只在原技术员手里，组织仍不能接续。\n\n## 派工与真实结果\n\nAI建议、调度采用、系统接受、到场、客户恢复与后续复发分开。提交无回显时先查实际状态，不能凭最后一句话决定重复派单。\n\n另对照两笔同日关闭工单：一笔客户恢复且后续稳定，另一笔先关闭、次日重新报修。只看关闭率，会错判价值并可能扭曲人员行为。\n\n## 长期发展\n\nFDE可先使记录与状态可信，再共同研究复发、专业支持与派工。内部负责人逐步掌握资料、评价和接续。若探索持续设备服务，还需重新验证客户需要、现场容量与收费安排。\n\n对应阅读：生产采集、经验可信度、接任检验、长期共建。\n"},{"file":"案例D-专业服务.md","id":"case-d","number":null,"role":"案例","part":-1,"title":"案例D｜专业服务：扩产、选择与新产品","md":"# 案例D｜专业服务：扩产、选择与新产品\n\n以下为独立教学设定，不是实际机构数据。AI参与资料、构思与起草，人机分工可以依据证据变化。\n\n## 生成与核验容量\n\n初始无待核任务，每日进入20份，专家每日完成4份核验。没有取消、返工、丢失和优先级差异。\n\n| 日末 | 累计进入 | 累计核验 | 待核 |\n|---|---:|---:|---:|\n| 1 | 20 | 4 | 16 |\n| 2 | 40 | 8 | 32 |\n| 5 | 100 | 20 | 80 |\n\n这里只按流入减处理计算增长积压，不使用平稳平均等待公式，也不把核验等同收入。\n\n另设一个已稳定系统，平均每日完成4份，平均停留3天，则按适用队列关系，平均在制12份。这组条件独立于上面的持续超负荷情境。\n\n## 候选与选择\n\n另用一组分数说明逻辑，不对应宝洁研究数据：原方案池70、80，选中80；新池92、98，选中92。新安排没有选出自身最好项，但最终92仍高于原80。\n\n它区分候选质量、组内选择和最终质量。真实研究事实应回到[延伸阅读](延伸阅读.md)，不能把教学分数当作实测。\n\n## 可能怎样改变工作\n\n可以减少无用进入、改善材料和候选可核验性、调整选择支持、委派经验证的常规工作或增加真正瓶颈资源。每种改法都需比较合格交付与总负担，不能预定少生成就保持相同质量。\n\n## 探索持续行动支持\n\n机构考虑从一次性报告转为持续发现变化、推进决定与跟踪执行。需要重新检查客户是否需要、资料能否持续取得、谁行动、专家容量如何安排，以及收费能否支持交付。\n\n按次、按期或其他方式都只是候选。AI能持续工作，不证明客户愿持续付费，也不证明订阅更好。\n\n新know-how来自提出假设、实际试做、结果返回与修订。AI可以帮助发现线索，FDE把安排实现，专业与业务人员共同判断。\n\n对应阅读：[人机分工](18-人机分工.md)、[产能瓶颈](25-产能与瓶颈.md)、[新服务](38-新产品与服务.md)。\n","html":"\u003ch1>案例D｜专业服务：扩产、选择与新产品\u003c/h1>\n\u003cp>以下为独立教学设定，不是实际机构数据。AI参与资料、构思与起草，人机分工可以依据证据变化。\u003c/p>\n\u003ch2 id=\"case-d-section-1\">生成与核验容量\u003c/h2>\n\u003cp>初始无待核任务，每日进入20份，专家每日完成4份核验。没有取消、返工、丢失和优先级差异。\u003c/p>\n\u003cdiv class=\"table-scro 续行动支持"}],"exportMd":"# 案例D｜专业服务：扩产、选择与新产品\n\n以下为独立教学设定，不是实际机构数据。AI参与资料、构思与起草，人机分工可以依据证据变化。\n\n## 生成与核验容量\n\n初始无待核任务，每日进入20份，专家每日完成4份核验。没有取消、返工、丢失和优先级差异。\n\n| 日末 | 累计进入 | 累计核验 | 待核 |\n|---|---:|---:|---:|\n| 1 | 20 | 4 | 16 |\n| 2 | 40 | 8 | 32 |\n| 5 | 100 | 20 | 80 |\n\n这里只按流入减处理计算增长积压，不使用平稳平均等待公式，也不把核验等同收入。\n\n另设一个已稳定系统，平均每日完成4份，平均停留3天，则按适用队列关系，平均在制12份。这组条件独立于上面的持续超负荷情境。\n\n## 候选与选择\n\n另用一组分数说明逻辑，不对应宝洁研究数据：原方案池70、80，选中80；新池92、98，选中92。新安排没有选出自身最好项，但最终92仍高于原80。\n\n它区分候选质量、组内选择和最终质量。真实研究事实应回到[延伸阅读](#reading)，不能把教学分数当作实测。\n\n## 可能怎样改变工作\n\n可以减少无用进入、改善材料和候选可核验性、调整选择支持、委派经验证的常规工作或增加真正瓶颈资源。每种改法都需比较合格交付与总负担，不能预定少生成就保持相同质量。\n\n## 探索持续行动支持\n\n机构考虑从一次性报告转为持续发现变化、推进决定与跟踪执行。需要重新检查客户是否需要、资料能否持续取得、谁行动、专家容量如何安排，以及收费能否支持交付。\n\n按次、按期或其他方式都只是候选。AI能持续工作，不证明客户愿持续付费，也不证明订阅更好。\n\n新know-how来自提出假设、实际试做、结果返回与修订。AI可以帮助发现线索，FDE把安排实现，专业与业务人员共同判断。\n\n对应阅读：[人机分工](#lesson-18)、[产能瓶颈](#lesson-25)、[新服务](#lesson-38)。\n","exportSingleMd":"# 案例D｜专业服务：扩产、选择与新产品\n\n以下为独立教学设定，不是实际机构数据。AI参与资料、构思与起草，人机分工可以依据证据变化。\n\n## 生成与核验容量\n\n初始无待核任务，每日进入20份，专家每日完成4份核验。没有取消、返工、丢失和优先级差异。\n\n| 日末 | 累计进入 | 累计核验 | 待核 |\n|---|---:|---:|---:|\n| 1 | 20 | 4 | 16 |\n| 2 | 40 | 8 | 32 |\n| 5 | 100 | 20 | 80 |\n\n这里只按流入减处理计算增长积压，不使用平稳平均等待公式，也不把核验等同收入。\n\n另设一个已稳定系统，平均每日完成4份，平均停留3天，则按适用队列关系，平均在制12份。这组条件独立于上面的持续超负荷情境。\n\n## 候选与选择\n\n另用一组分数说明逻辑，不对应宝洁研究数据：原方案池70、80，选中80；新池92、98，选中92。新安排没有选出自身最好项，但最终92仍高于原80。\n\n它区分候选质量、组内选择和最终质量。真实研究事实应回到[延伸阅读](https://zhongky1995.github.io/gaidn-fde-handbook/#reading)，不能把教学分数当作实测。\n\n## 可能怎样改变工作\n\n可以减少无用进入、改善材料和候选可核验性、调整选择支持、委派经验证的常规工作或增加真正瓶颈资源。每种改法都需比较合格交付与总负担，不能预定少生成就保持相同质量。\n\n## 探索持续行动支持\n\n机构考虑从一次性报告转为持续发现变化、推进决定与跟踪执行。需要重新检查客户是否需要、资料能否持续取得、谁行动、专家容量如何安排，以及收费能否支持交付。\n\n按次、按期或其他方式都只是候选。AI能持续工作，不证明客户愿持续付费，也不证明订阅更好。\n\n新know-how来自提出假设、实际试做、结果返回与修订。AI可以帮助发现线索，FDE把安排实现，专业与业务人员共同判断。\n\n对应阅读：[人机分工](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-18)、[产能瓶颈](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-25)、[新服务](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-38)。\n","text": 受、实际完成与结果等不同事实 | [第21章](21-建议与真实执行.md) |\n| 互补投入 | 为使技术发挥作用而发生的流程、人员、组织与产品建设 | [第22章](22-持续运行与系统演化.md) |\n| token | 模型处理输入与输出的计量单位，不是企业价值或能力单位 | [第23章](23-token与智能资源.md) |\n| 有效利用 | 智能投入怎样形成合格工作 | [第23章](23-token与智能资源.md) |\n| 价值转换 | 合格工作怎样经采用、执行和客户结果进入经营 | [第26章](26-完整成本与兑现.md) |\n| 产能瓶颈 | 整条交付中限制完成的环节，增加上游可能只增加积压 | [第25章](25-产能与瓶颈.md) |\n| 能力留存 | 本轮工作对后续任务、接任或迁移的可验证作用 | [第27章](27-能力留存.md) |\n| 探索与利用 | 研究新可能与改善已有能力之间的资源张力 | [第28章](28-投入组合.md) |\n| 留出任务 | 不参与调试，用来观察新材料表现的任务 | [第29章](29-任务质量.md) |\n| 因果与比较 | 区分AI作用与任务选择、同期变化和其他改造 | [第30章](30-业务效果与因果.md) |\n| 组织学习 | 后续工作因经验而改变，且能在一定范围中接任与迁移 | [第31章](31-组织学习的验证.md) |\n| 反馈循环 | 行动改变未来可见数据，可能支持改进，也可能强化偏差 | [第32章](32-纠错与遗忘.md) |\n| 动态能力 | 使资源和能力持续适应、重组并保持相关的本领 | [第37章](37-阶段发展路线.md) |\n| 商业模式 | 客户价值、交付安排与价值获取之间的经营逻辑 | [第38章](38-新产品与服务.md) |\n\n这些解释服务于课程判断，不取代各专业领域的完整定义。遇到具体决定，回到正文的情境、条件与证据。\n","html":"\u003ch1>概念回查｜把词放回企业问题\u003c/h1>\n\u003cp>这里用于查回正文，不建议先背术语。每个概念的意义来自它帮助解释的工作。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>在课程中的含义\u003c/th>\n\u003cth>进一步阅读\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>基础模型\u003c/td>\n\u003ctd>在广泛材料上形成、可适配多类任务的能力供给\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-01\">第1章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>吸收能力\u003c/td>\n\u003ctd>识别、理解并应用外部知识的组织能力，依赖相关积累与内部配合\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-04\">第4章\u003c/a>、\u003ca href=\"#lesson-35\">第35章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>know-how\u003c/td>\n\u003ctd>在一定条件下组织行动、产生结果并调整的知识，分布于人员、材料、工具与协作\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-05\">第5章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>候选经验\u003c/td>\n\u003ctd>对事件原因或方法的暂时解释，可帮助继续研究，尚非确定规则\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-08\">第8章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>组织记忆\u003c/td>\n\u003ctd>人员与任务变化后仍能找到、理解、采用并更新经验的条件组合\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-09\">第9章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>标准化\u003c/td>\n\u003ctd>让必要事实、规则与协作含义一致，方法可在证据中逐步稳定\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-10\">第10章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>差异化\u003c/td>\n\u003ctd>与客户认可的结果及可持续交付相关的不同，不能只由企业自述决定\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-11\">第11章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>优势生成机制\u003c/td>\n\u003ctd>信息、判断、协作和资源怎样共同产生好结果\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-12\">第12章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FDE\u003c/td>\n\u003ctd>靠近现场，把认识与工程相互连接的专业力量；机构岗位范围不同\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-14\">第14章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>试点的学习价值\u003c/td>\n\u003ctd>取得能改变下一步选择的证据，而非事后给所有结果冠以收获\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-16\">第16章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>智能伙伴\u003c/td>\n\u003ctd>在持续任务中具备相关信息、行动与反馈条件的AI参与者\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-17\">第17章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工作流\u003c/td>\n\u003ctd>主要路径事先确定，模型可以承担其中部分步骤\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-19\">第19章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Agent\u003c/td>\n\u003ctd>根据当前信息选择部分下一步与工具的工作形式\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-19\">第19章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>上下文\u003c/td>\n\u003ctd>当前任务实际使用的事实、目标、相关经验与约束\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-20\">第20章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>检索\u003c/td>\n\u003ctd>从长期资料取得候选材料，还需判断适用性与可信度\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-20\">第20章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>业务状态\u003c/td>\n\u003ctd>建议、采用、系统接受、实际完成与结果等不同事实\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-21\">第21章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>互补投入\u003c/td>\n\u003ctd>为使技术发挥作用而发生的流程、人员、组织与产品建设\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-22\">第22章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>token\u003c/td>\n\u003ctd>模型处理输入与输出的计量单位，不是企业价值或能力单位\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-23\">第23章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>有效利用\u003c/td>\n\u003ctd>智能投入怎样形成合格工作\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-23\">第23章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>价值转换\u003c/td>\n\u003ctd>合格工作怎样经采用、执行和客户结果进入经营\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-26\">第26章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>产能瓶颈\u003c/td>\n\u003ctd>整条交付中限制完成的环节，增加上游可能只增加积压\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-25\">第25章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>能力留存\u003c/td>\n\u003ctd>本轮工作对后续任务、接任或迁移的可验证作用\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-27\">第27章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>探索与利用\u003c/td>\n\u003ctd>研究新可能与改善已有能力之间的资源张力\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-28\">第28章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>留出任务\u003c/td>\n\u003ctd>不参与调试，用来观察新材料表现的任务\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-29\">第29章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>因果与比较\u003c/td>\n\u003ctd>区分AI作用与任务选择、同期变化和其他改造\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-30\">第30章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>组织学习\u003c/td>\n\u003ctd>后续工作因经验而改变，且能在一定范围中接任与迁移\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-31\">第31章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>反馈循环\u003c/td>\n\u003ctd>行动改变未来可见数据，可能支持改进，也可能强化偏差\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-32\">第32章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>动态能力\u003c/td>\n\u003ctd>使资源和能力持续适应、重组并保持相关的本领\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-37\">第37章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>商业模式\u003c/td>\n\u003ctd>客户价值、交付安排与价值获取之间的经营逻辑\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-38\">第38章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>这些解释服务于课程判断，不取代各专业领域的完整定义。遇到具体决定，回到正文的情境、条件与证据。\u003c/p>\n","headings":[],"exportMd":"# 概念回查｜把词放回企业问题\n\n这里用于查回正文，不建议先背术语。每个概念的意义来自它帮助解释的工作。\n\n| 概念 | 在课程中的含义 | 进一步阅读 |\n|---|---|---|\n| 基础模型 | 在广泛材料上形成、可适配多类任务的能力供给 | [第1章](#lesson-01) |\n| 吸收能力 | 识别、理解并应用外部知识的组织能力，依赖相关积累与内部配合 | [第4章](#lesson-04)、[第35章](#lesson-35) |\n| know-how | 在一定条件下组织行动、产生结果并调整的知识，分布于人员、材料、工具与协作 | [第5章](#lesson-05) |\n| 候选经验 | 对事件原因或方法的暂时解释，可帮助继续研究，尚非确定规则 | [第8章](#lesson-08) |\n| 组织记忆 | 人员与任务变化后仍能找到、理解、采用并更新经验的条件组合 | [第9章](#lesson-09) |\n| 标准化 | 让必要事实、规则与协作含义一致，方法可在证据中逐步稳定 | [第10章](#lesson-10) |\n| 差异化 | 与客户认可的结果及可持续交付相关的不同，不能只由企业自述决定 | [第11章](#lesson-11) |\n| 优势生成机制 | 信息、判断、协作和资源怎样共同产生好结果 | [第12章](#lesson-12) |\n| FDE | 靠近现场，把认识与工程相互连接的专业力量；机构岗位范围不同 | [第14章](#lesson-14) |\n| 试点的学习价值 | 取得能改变下一步选择的证据，而非事后给所有结果冠以收获 | [第16章](#lesson-16) |\n| 智能伙伴 | 在持续任务中具备相关信息、行动与反馈条件的AI参与者 | [第17章](#lesson-17) |\n| 工作流 | 主要路径事先确定，模型可以承担其中部分步骤 | [第19章](#lesson-19) |\n| Agent | 根据当前信息选择部分下一步与工具的工作形式 | [第19章](#lesson-19) |\n| 上下文 | 当前任务实际使用的事实、目标、相关经验与约束 | [第20章](#lesson-20) |\n| 检索 | 从长期资料取得候选材料，还需判断适用性与可信度 | [第20章](#lesson-20) |\n| 业务状态 | 建议、采用、系统接受、实际完成与结果等不同事实 | [第21章](#lesson-21) |\n| 互补投入 | 为使技术发挥作用而发生的流程、人员、组织与产品建设 | [第22章](#lesson-22) |\n| token | 模型处理输入与输出的计量单位，不是企业价值或能力单位 | [第23章](#lesson-23) |\n| 有效利用 | 智能投入怎样形成合格工作 | [第23章](#lesson-23) |\n| 价值转换 | 合格工作怎样经采用、执行和客户结果进入经营 | [第26章](#lesson-26) |\n| 产能瓶颈 | 整条交付中限制完成的环节，增加上游可能只增加积压 | [第25章](#lesson-25) |\n| 能力留存 | 本轮工作对后续任务、接任或迁移的可验证作用 | [第27章](#lesson-27) |\n| 探索与利用 | 研究新可能与改善已有能力之间的资源张力 | [第28章](#lesson-28) |\n| 留出任务 | 不参与调试，用来观察新材料表现的任务 | [第29章](#lesson-29) |\n| 因果与比较 | 区分AI作用与任务选择、同期变化和其他改造 | [第30章](#lesson-30) |\n| 组织学习 | 后续工作因经验而改变，且能在一定范围中接任与迁移 | [第31章](#lesson-31) |\n| 反馈循环 | 行动改变未来可见数据，可能支持改进，也可能强化偏差 | [第32章](#lesson-32) |\n| 动态能力 | 使资源和能力持续适应、重组并保持相关的本领 | [第37章](#lesson-37) |\n| 商业模式 | 客户价值、交付安排与价值获取之间的经营逻辑 | [第38章](#lesson-38) |\n\n这些解释服务于课程判断，不取代各专业领域的完整定义。遇到具体决定，回到正文的情境、条件与证据。\n","exportSingleMd":"# 概念回查｜把词放回企业问题\n\n这里用于查回正文，不建议先背术语。每个概念的意义来自它帮助解释的工作。\n\n| 概念 | 在课程中的含义 | 进一步阅读 |\n|---|---|---|\n| 基础模型 | 在广泛材料上形成、可适配多类任务的能力供给 | [第1章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-01) |\n| 吸收能力 | 识别、理解并应用外部知识的组织能力，依赖相关积累与内部配合 | [第4章](https://zhongky1995.github.io/gaidn-fde-hand fde-handbook/#lesson-26) |\n| 产能瓶颈 | 整条交付中限制完成的环节，增加上游可能只增加积压 | [第25章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-25) |\n| 能力留存 | 本轮工作对后续任务、接任或迁移的可验证作用 | [第27章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-27) |\n| 探索与利用 | 研究新可能与改善已有能力之间的资源张力 | [第28章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-28) |\n| 留出任务 | 不参与调试，用来观察新材料表现的任务 | [第29章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-29) |\n| 因果与比较 | 区分AI作用与任务选择、同期变化和其他改造 | [第30章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-30) |\n| 组织学习 | 后续工作因经验而改变，且能在一定范围中接任与迁移 | [第31章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-31) |\n| 反馈循环 | 行动改变未来可见数据，可能支持改进，也可能强化偏差 | [第32章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-32) |\n| 动态能力 | 使资源和能力持续适应、重组并保持相关的本领 | [第37章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-37) |\n| 商业模式 | 客户价值、交付安排与价值获取之间的经营逻辑 | [第38章](https://zhongky1995.github.io/gaidn-fde-handbook/#lesson-38) |\n\n这些解释服务于课程判断，不取代各专业领域的完整定义。遇到具体决定，回到正文的情境、条件与证据。\n","text":"# 概念回查｜把词放回企业问题\n\n这里用于查回正文，不建议先背术语。每个概念的意义来自它帮助解释的工作。\n\n| 概念 | 在课程中的含义 | 进一步阅读 |\n|---|---|---|\n| 基础模型 | 在广泛材料上形成、可适配多类任务的能力供给 | 第1章 |\n| 吸收能力 | 识别、理解并应用外部知识的组织能力，依赖相关积累与内部配合 | 第4章、第35章 |\n| know-how | 在一定条件下组织行动、产生结果并调整的知识，分布于人员、材料、工具与协作 | 第5章 |\n| 候选经验 | 对事件原因或方法的暂时解释，可帮助继续研究，尚非确定规则 | 第8章 |\n| 组织记忆 | 人员与任务变化后仍能找到、理解、采用并更新经验的条件组合 | 第9章 |\n| 标准化 | 让必要事实、规则与协作含义一致，方法可在证据中逐步稳定 | 第10章 |\n| 差异化 | 与客户认可的结果及可持续交付相关的不同，不能只由企业自述决定 | 第11章 |\n| 优势生成机制 | 信息、判断、协作和资源怎样共同产生好结果 | 第12章 |\n| FDE | 靠近现场，把认识与工程相互连接的专业力量；机构岗位范围不同 | 第14章 |\n| 试点的学习价值 | 取得能改变下一步选择的证据，而非事后给所有结果冠以收获 | 第16章 |\n| 智能伙伴 | 在持续任务中具备相关信息、行动与反馈条件的AI参与者 | 第17章 |\n| 工作流 | 主要路径事先确定，模型可以承担其中部分步骤 | 第19章 |\n| Agent | 根据当前信息选择部分下一步与工具的工作形式 | 第19章 |\n| 上下文 | 当前任务实际使用的事实、目标、相关经验与约束 | 第20章 |\n| 检索 | 从长期资料取得候选材料，还需判断适用性与可信度 | 第20章 |\n| 业务状态 | 建议、采用、系统接受、实际完成与结果等不同事实 | 第21章 |\n| 互补投入 | 为使技术发挥作用而发生的流程、人员、组织与产品建设 | 第22章 |\n| token | 模型处理输入与输出的计量单位，不是企业价值或能力单位 | 第23章 |\n| 有效利用 | 智能投入怎样形成合格工作 | 第23章 |\n| 价值转换 | 合格工作怎样经采用、执行和客户结果进入经营 | 第26章 |\n| 产能瓶颈 | 整条交付中限制完成的环节，增加上游可能只增加积压 | 第25章 |\n| 能力留存 | 本轮工作对后续任务、接任或迁移的可验证作用 | 第27章 |\n| 探索与利用 | 研究新可能与改善已有能力之间的资源张力 | 第28章 |\n| 留出任务 | 不参与调试，用来观察新材料表现的任务 | 第29章 |\n| 因果与比较 | 区分AI作用与任务选择、同期变化和其他改造 | 第30章 |\n| 组织学习 | 后续工作因经验而改变，且能在一定范围中接任与迁移 | 第31章 |\n| 反馈循环 | 行动改变未来可见数据，可能支持改进，也可能强化偏差 | 第32章 |\n| 动态能力 | 使资源和能力持续适应、重组并保持相关的本领 | 第37章 |\n| 商业模式 | 客户价值、交付安排与价值获取之间的经营逻辑 | 第38章 |\n\n这些解释服务于课程判断，不取代各专业领域的完整定义。遇到具体决定，回到正文的情境、条件与证据。\n"},{"file":"延伸阅读.md","id":"reading","number":null,"role":"参考","part":-1,"title":"研究与延伸阅读","md":"# 研究与延伸阅读\n\n课程把理论、实际研究、工程经验和机构自述用于不同问题。它们共同支持机制推导，不构成一个适用于所有企业的提效数字。教学案例与业务算例全部是独立设定。\n\n## 理解知识、能力与持续发展\n\n**Nonaka，1994，组织知识创造。** [原始论文的大学存档](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)。用于理解实践、表达、个人与组织之间的知识发展。本课主要采用可核原文片段；扫描件读取受限。它不证明所有隐性技能都能被语言或AI完整提取。\n\n**Cohen与Levinthal，1990，吸收能力。** [原始论文](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)。采用摘要、引言与相关知识讨论，解释企业为何需要自己的认识与组织条件。它不是AI或FDE长期效果研究。\n\n**Teece，2007，动态能力。** [机构原文](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)。采用引言与框架段落，理解能力如何持续适应与重组。框架不能替企业判断具体优势，也不估计生存率。\n\n**March，1991，探索与利用。** [原始论文](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)。采用摘要与开篇机制，讨论资源竞争与回报节奏。没有导出固定预算比例。\n\n**Brynjolfsson、Rock、Syverson，生产率J曲线。** [NBER研究记录](https://www.nber.org/papers/w25148)，期刊版2021。用于互补投入与测量关系；宏观J曲线不是单项目现金回本承诺。\n\n## 比较真实工作中的AI作用\n\n**Generative AI at Work，2025期刊版。** [作者提供的原文](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)。企业软件客服的分批上线研究，员工可以采用、修改或忽略建议。用于讨论经验差异、传播与学习，不推成全行业利润。本课重读摘要、引言与上线安排。\n\n**The Cybernetic Teammate，2026期刊版。** [期刊原文](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)。采用宝洁创新实验的设计与阶段结果，分清生成、组内选择与最终质量。最终方案改善不代表商业实施成功；不能据组内选择结果推断AI一般不擅判断，也未确认参与者在选择时均使用AI。\n\n**Shifting Work Patterns with Generative AI。** [实际采用页面](https://arxiv.org/html/2504.11436v4)。跨企业随机获得办公AI使用权，利用软件活动观察时间与任务。采用摘要、设计及观测限制。页面版本元信息与正文日期存在差异；不把软件活动直接解释成完整质量或利润。\n\n**METR开发任务研究，早期2025。** [原始论文](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)及[2026方法更新](https://metr.org/blog/2026-02-24-uplift-update/)。用于主观感受、总任务时间、选择与并行测量。旧工具和特定开发者结果不作当前AI编程通用结论。\n\n**Caro与Gallien，2010，Zara分配。** [作者机构原文](https://web.mit.edu/people/jgallien/ZaraOR2010.pdf)。采用现场规则、流程与实施段落，说明尺码与展示机制怎样改变工程。它是运筹与数字化案例，不是生成式AI/FDE项目，课程未复算模型与原始数据。\n\n## 理解模型与工程条件\n\n**CRFM基础模型报告，2021/2022版本。** [原始摘要](https://arxiv.org/abs/2108.07258v3)。用于广泛训练、下游适配与共同依赖；未全文采用长报告，也不证明每项任务经济可行。\n\n**Anthropic，Building effective agents，2024。** [原文](https://www.anthropic.com/research/building-effective-agents)。用于固定工作流、动态工具选择与复杂度取舍。属于工程经验，不是长期经营实验。\n\n**Anthropic，上下文工程，2025。** [原文](https://www.anthropic.com/research/effective-context-engineering-for-ai-agents)。用于当前信息、持久记录与调用。记忆工程不能保证业务经验正确。\n\n**Sculley等，2015，Hidden Technical Debt in Machine Learning Systems。** [原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)。采用摘要、反馈循环与系统依赖讨论。早期ML经验不能直接量化当前Agent成本。\n\n**Snell等，2024，测试时计算配置。** [原始预印本摘要](https://arxiv.org/abs/2408.03314)。用于资源、策略与任务难度关系；没有把数学实验倍数转成企业投资回报。\n\n## 理解人员、长期合作与经营机制\n\n**Holmström与Milgrom，1991，多任务激励。** [作者存档](https://web.stanford.edu/~milgrom/publishedarticles/Multitask%20Principal%20Agent.pdf)。采用可核引言片段，扫描全文读取受限。解释评价怎样改变注意力，不给出统一奖金规则。\n\n**Baker、Gibbons、Murphy，2002，关系合作。** [原始论文](https://faculty.washington.edu/mfan/is582/articles/Baker2002.pdf)。采用摘要与开篇关于重复合作、难以事前完整约定的结果。它不证明长期外部合同必然更优。\n\n**Palantir FDSE岗位。** [官方说明](https://jobs.lever.co/palantir/84131e3f-455e-47fc-9c11-898d95f09048)。用于模糊问题、原型、代码、集成和反馈等实际职责。属于机构自述，不是统一行业定义。\n\n**AWS FDE共建安排。** [官方材料](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)。用于生产共建与客户接续目标；机构主张不等于独立效果证明。\n\n**Little，1961，排队公式。** [原始摘要](https://pubsonline.informs.org/doi/abs/10.1287/opre.9.3.383)。仅读取摘要与成立条件。课程持续超负荷算例使用数量守恒，不套平稳平均等待公式。\n\n**Teece，2010，商业模式、战略与创新。** [原始出版页](https://www.sciencedirect.com/science/article/pii/S002463010900051X)。直接入口受限，采用出版页检索返回的摘要、引言与部分段落。用于价值创造、交付与获取，不证明当前AI新产品需求。\n\n## 怎样把研究带回决定\n\n先看研究处理何种工作、比较什么、观察什么，再判断它与自己的场景哪些相同、哪些不同。一个平均效果不应抹掉经验与阶段差异，一项反向结果也不应冻结后续技术判断。\n\n课程中关于长期FDE、能力留存与竞争节奏的立场，是在这些依据上作出的机制推导，仍需要真实企业持续观察。可以据此主动建设，同时保留被证据改变的空间。\n","html":"\u003ch1>研究与延伸阅读\u003c/h1>\n\u003cp>课程把理论、实际研究、工程经验和机构自述用于不同问题。它们共同支持机制推导，不构成一个适用于所有企业的提效数字。教学案例与业务算例全部是独立设定。\u003c/p>\n\u003ch2 id=\"reading-section-1\">理解知识、能力与持续发展\u003c/h2>\n\u003cp>\u003cstrong>Nonaka，1994，组织知识创造。\u003c/strong> \u003ca href=\"https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始论文的大学存档\u003c/a>。用于理解实践、表达、个人与组织之间的知识发展。本课主要采用可核原文片段；扫描件读取受限。它不证明所有隐性技能都能被语言或AI完整提取。\u003c/p>\n\u003cp>\u003cstrong>Cohen与Levinthal，1990，吸收能力。\u003c/strong> \u003ca href=\"https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始论文\u003c/a>。采用摘要、引言与相关知识讨论，解释企业为何需要自己的认识与组织条件。它不是AI或FDE长期效果研究。\u003c/p>\n\u003cp>\u003cstrong>Teece，2007，动态能力。\u003c/strong> \u003ca href=\"https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">机构原文\u003c/a>。采用引言与框架段落，理解能力如何持续适应与重组。框架不能替企业判断具体优势，也不估计生存率。\u003c/p>\n\u003cp>\u003cstrong>March，1991，探索与利用。\u003c/strong> \u003ca href=\"https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始论文\u003c/a>。采用摘要与开篇机制，讨论资源竞争与回报节奏。没有导出固定预算比例。\u003c/p>\n\u003cp>\u003cstrong>Brynjolfsson、Rock、Syverson，生产率J曲线。\u003c/strong> \u003ca href=\"https://www.nber.org/papers/w25148\" target=\"_blank\" rel=\"noopener noreferrer\">NBER研究记录\u003c/a>，期刊版2021。用于互补投入与测量关系；宏观J曲线不是单项目现金回本承诺。\u003c/p>\n\u003ch2 id=\"reading-section-2\">比较真实工作中的AI作用\u003c/h2>\n\u003cp>\u003cstrong>Generative AI at Work，2025期刊版。\u003c/strong> \u003ca href=\"https://danielle.li/assets/docs/GenerativeAIatWork.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">作者提供的原文\u003c/a>。企业软件客服的分批上线研究，员工可以采用、修改或忽略建议。用于讨论经验差异、传播与学习，不推成全行业利润。本课重读摘要、引言与上线安排。\u003c/p>\n\u003cp>\u003cstrong>The Cybernetic Teammate，2026期刊版。\u003c/strong> \u003ca href=\"https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702\" target=\"_blank\" rel=\"noopener noreferrer\">期刊原文\u003c/a>。采用宝洁创新实验的设计与阶段结果，分清生成、组内选择与最终质量。最终方案改善不代表商业实施成功；不能据组内选择结果推断AI一般不擅判断，也未确认参与者在选择时均使用AI。\u003c/p>\n\u003cp>\u003cstrong>Shifting Work Patterns with Generative AI。\u003c/strong> \u003ca href=\"https://arxiv.org/html/2504.11436v4\" target=\"_blank\" rel=\"noopener noreferrer\">实际采用页面\u003c/a>。跨企业随机获得办公AI使用权，利用软件活动观察时间与任务。采用摘要、设计及观测限制。页面版本元信息与正文日期存在差异；不把软件活动直接解释成完整质量或利润。\u003c/p>\n\u003cp>\u003cstrong>METR开发任务研究，早期2025。\u003c/strong> \u003ca href=\"https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始论文\u003c/a>及\u003ca href=\"https://metr.org/blog/2026-02-24-uplift-update/\" target=\"_blank\" rel=\"noopener noreferrer\">2026方法更新\u003c/a>。用于主观感受、总任务时间、选择与并行测量。旧工具和特定开发者结果不作当前AI编程通用结论。\u003c/p>\n\u003cp>\u003cstrong>Caro与Gallien，2010，Zara分配。\u003c/strong> \u003ca href=\"https://web.mit.edu/people/jgallien/ZaraOR2010.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">作者机构原文\u003c/a>。采用现场规则、流程与实施段落，说明尺码与展示机制怎样改变工程。它是运筹与数字化案例，不是生成式AI/FDE项目，课程未复算模型与原始数据。\u003c/p>\n\u003ch2 id=\"reading-section-3\">理解模型与工程条件\u003c/h2>\n\u003cp>\u003cstrong>CRFM基础模型报告，2021/2022版本。\u003c/strong> \u003ca href=\"https://arxiv.org/abs/2108.07258v3\" target=\"_blank\" rel=\"noopener noreferrer\">原始摘要\u003c/a>。用于广泛训练、下游适配与共同依赖；未全文采用长报告，也不证明每项任务经济可行。\u003c/p>\n\u003cp>\u003cstrong>Anthropic，Building effective agents，2024。\u003c/strong> \u003ca href=\"https://www.anthropic.com/research/building-effective-agents\" target=\"_blank\" rel=\"noopener noreferrer\">原文\u003c/a>。用于固定工作流、动态工具选择与复杂度取舍。属于工程经验，不是长期经营实验。\u003c/p>\n\u003cp>\u003cstrong>Anthropic，上下文工程，2025。\u003c/strong> \u003ca href=\"https://www.anthropic.com/research/effective-context-engineering-for-ai-agents\" target=\"_blank\" rel=\"noopener noreferrer\">原文\u003c/a>。用于当前信息、持久记录与调用。记忆工程不能保证业务经验正确。\u003c/p>\n\u003cp>\u003cstrong>Sculley等，2015，Hidden Technical Debt in Machine Learning Systems。\u003c/strong> \u003ca href=\"https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始论文\u003c/a>。采用摘要、反馈循环与系统依赖讨论。早期ML经验不能直接量化当前Agent成本。\u003c/p>\n\u003cp>\u003cstrong>Snell等，2024，测试时计算配置。\u003c/strong> \u003ca href=\"https://arxiv.org/abs/2408.03314\" target=\"_blank\" rel=\"noopener noreferrer\">原始预印本摘要\u003c/a>。用于资源、策略与任务难度关系；没有把数学实验倍数转成企业投资回报。\u003c/p>\n\u003ch2 id=\"reading-section-4\">理解人员、长期合作与经营机制\u003c/h2>\n\u003cp>\u003cstrong>Holmström与Milgrom，1991，多任务激励。\u003c/strong> \u003ca href=\"https://web.stanford.edu/~milgrom/publishedarticles/Multitask%20Principal%20Agent.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">作者存档\u003c/a>。采用可核引言片段，扫描全文读取受限。解释评价怎样改变注意力，不给出统一奖金规则。\u003c/p>\n\u003cp>\u003cstrong>Baker、Gibbons、Murphy，2002，关系合作。\u003c/strong> \u003ca href=\"https://faculty.washington.edu/mfan/is582/articles/Baker2002.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始论文\u003c/a>。采用摘要与开篇关于重复合作、难以事前完整约定的结果。它不证明长期外部合同必然更优。\u003c/p>\n\u003cp>\u003cstrong>Palantir FDSE岗位。\u003c/strong> \u003ca href=\"https://jobs.lever.co/palantir/84131e3f-455e-47fc-9c11-898d95f09048\" target=\"_blank\" rel=\"noopener noreferrer\">官方说明\u003c/a>。用于模糊问题、原型、代码、集成和反馈等实际职责。属于机构自述，不是统一行业定义。\u003c/p>\n\u003cp>\u003cstrong>AWS FDE共建安排。\u003c/strong> \u003ca href=\"https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers\" target=\"_blank\" rel=\"noopener noreferrer\">官方材料\u003c/a>。用于生产共建与客户接续目标；机构主张不等于独立效果证明。\u003c/p>\n\u003cp>\u003cstrong>Little，1961，排队公式。\u003c/strong> \u003ca href=\"https://pubsonline.informs.org/doi/abs/10.1287/opre.9.3.383\" target=\"_blank\" rel=\"noopener noreferrer\">原始摘要\u003c/a>。仅读取摘要与成立条件。课程持续超负荷算例使用数量守恒，不套平稳平均等待公式。\u003c/p>\n\u003cp>\u003cstrong>Teece，2010，商业模式、战略与创新。\u003c/strong> \u003ca href=\"https://www.sciencedirect.com/science/article/pii/S002463010900051X\" target=\"_blank\" rel=\"noopener noreferrer\">原始出版页\u003c/a>。直接入口受限，采用出版页检索返回的摘要、引言与部分段落。用于价值创造、交付与获取，不证明当前AI新产品需求。\u003c/p>\n\u003ch2 id=\"reading-section-5\">怎样把研究带回决定\u003c/h2>\n\u003cp>先看研究处理何种工作、比较什么、观察什么，再判断它与自己的场景哪些相同、哪些不同。一个平均效果不应抹掉经验与阶段差异，一项反向结果也不应冻结后续技术判断。\u003c/p>\n\u003cp>课程中关于长期FDE、能力留存与竞争节奏的立场，是在这些依据上作出的机制推导，仍需要真实企业持续观察。可以据此主动建设，同时保留被证据改变的空间。\u003c/p>\n","headings":[{"id":"reading-section-1","label":"理解知识、能力与持续发展"},{"id":"reading-section-2","label":"比较真实工作中的AI作用"},{"id":"reading-section-3","label":"理解模型与工程条件"},{"id":"reading-section-4","label":"理解人员、长期合作与经营机制"},{"id":"reading-section-5","label":"怎样把研究带回决定"}],"exportMd":"# 研究与延伸阅读\n\n课程把理论、实际研究、工程经验和机构自述用于不同问题。它们共同支持机制推导，不构成一个适用于所有企业的提效数字。教学案例与业务算例全部是独立设定。\n\n## 理解知识、能力与持续发展\n\n**Nonaka，1994，组织知识创造。** [原始论文的大学存档](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)。用于理解实践、表达、个人与组织之间的知识发展。本课主要采用可核原文片段；扫描件读取受限。它不证明所有隐性技能都能被语言或AI完整提取。\n\n**Cohen与Levinthal，1990，吸收能力。** [原始论文](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)。采用摘要、引言与相关知识讨论，解释企业为何需要自己的认识与组织条件。它不是AI或FDE长期效果研究。\n\n**Teece，2007，动态能力。** [机构原文](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)。采用引言与框架段落，理解能力如何持续适应与重组。框架不能替企业判断具体优势，也不估计生存率。\n\n**March，1991，探索与利用。** [原始论文](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)。采用摘要与开篇机制，讨论资源竞争与回报节奏。没有导出固定预算比例。\n\n**Brynjolfsson、Rock、Syverson，生产率J曲线。** [NBER研究记录](https://www.nber.org/papers/w25148)，期刊版2021。用于互补投入与测量关系；宏观J曲线不是单项目现金回本承诺。\n\n## 比较真实工作中的AI作用\n\n**Generative AI at Work，2025期刊版。** [作者提供的原文](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)。企业软件客服的分批上线研究，员工可以采用、修改或忽略建议。用于讨论经验差异、传播与学习，不推成全行业利润。本课重读摘要、引言与上线安排。\n\n**The Cybernetic Teammate，2026期刊版。** [期刊原文](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)。采用宝洁创新实验的设计与阶段结果，分清生成、组内选择与最终质量。最终方案改善不代表商业实施成功；不能据组内选择结果推断AI一般不擅判断，也未确认参与者在选择时均使用AI。\n\n**Shifting Work Patterns with Generative AI。** [实际采用页面](https://arxiv.org/html/2504.11436v4)。跨企业随机获得办公AI使用权，利用软件活动观察时间与任务。采用摘要、设计及观测限制。页面版本元信息与正文日期存在差异；不把软件活动直接解释成完整质量或利润。\n\n**METR开发任务研究，早期2025。** [原始论文](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf)及[2026方法更新](https://metr.org/blog/2026-02-24-uplift-update/)。用于主观感受、总任务时间、选择与并行测量。旧工具和特定开发者结果不作当前AI编程通用结论。\n\n**Caro与Gallien，2010，Zara分配。** [作者机构原文](https://web.mit.edu/people/jgallien/ZaraOR2010.pdf)。采用现场规则、流程与实施段落，说明尺码与展示机制怎样改变工程。它是运筹与数字化案例，不是生成式AI/FDE项目，课程未复算模型与原始数据。\n\n## 理解模型与工程条件\n\n**CRFM基础模型报告，2021/2022版本。** [原始摘要](https://arxiv.org/abs/2108.07258v3)。用于广泛训练、下游适配与共同依赖；未全文采用长报告，也不证明每项任务经济可行。\n\n**Anthropic，Building effective agents，2024。** [原文](https://www.anthropic.com/research/building-effective-agents)。用于固定工作流、动态工具选择与复杂度取舍。属于工程经验，不是长期经营实验。\n\n**Anthropic，上下文工程，2025。** [原文](https://www.anthropic.com/research/effective-context-engineering-for-ai-agents)。用于当前信息、持久记录与调用。记忆工程不能保证业务经验正确。\n\n**Sculley等，2015，Hidden Technical Debt in Machine Learning Systems。** [原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)。采用摘要、反馈循环与系统依赖讨论。早期ML经验不能直接量化当前Agent成本。\n\n**Snell等，2024，测试时计算配置。** [原始预印本摘要](https://arxiv.org/abs/2408.03314)。用于资源、策略与任务难度关系；没有把数学实验倍数转成企业投资回报。\n\n## 理解人员、长期合作与经营机制\n\n**Holmström与Milgrom，1991，多任务激励。** [作者存档](https://web.stanford.edu/~milgrom/publishedarticles/Multitask%20Principal%20Agent.pdf)。采用可核引言片段，扫描全文读取受限。解释评价怎样改变注意力，不给出统一奖金规则。\n\n**Baker、Gibbons、Murphy，2002，关系合作。** [原始论文](https://faculty.washington.edu/mfan/is582/articles/Baker2002.pdf)。采用摘要与开篇关于重复合作、难以事前完整约定的结果。它不证明长期外部合同必然更优。\n\n**Palantir FDSE岗位。** [官方说明](https://jobs.lever.co/palantir/84131e3f-455e-47fc-9c11-898d95f09048)。用于模糊问题、原型、代码、集成和反馈等实际职责。属于机构自述，不是统一行业定义。\n\n**AWS FDE共建安排。** [官方材料](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)。用于生产共建与客户接续目标；机构主张不等于独立效果证明。\n\n**Little，1961，排队公式。** [原始摘要](https://pubsonline.informs.org/doi/abs/10.1287/opre.9.3.383)。仅读取摘要与成立条件。课程持续超负荷算例使用数量守恒，不套平稳平均等待公式。\n\n**Teece，2010，商业模式、战略与创新。** [原始出版页](https://www.sciencedirect.com/science/article/pii/S002463010900051X)。直接入口受限，采用出版页检索返回的摘要、引言与部分段落。用于价值创造、交付与获取，不证明当前AI新产品需求。\n\n## 怎样把研究带回决定\n\n先看研究处理何种工作、比较什么、观察什么，再判断它与自己的场景哪些相同、哪些不同。一个平均效果不应抹掉经验与阶段差异，一项反向结果也不应冻结后续技术判断。\n\n课程中关于长期FDE、能力留存与竞争节奏的立场，是在这些依据上作出的机制推导，仍需要真实企业持续观察。可以据此主动建设，同时保留被证据改变的空间。\n","exportSingleMd":"# 研究与延伸阅读\n\n课程把理论、实际研究、工程经验和机构自述用于不同问题。它们共同支持机制推导，不构成一个适用于所有企业的提效数字。教学案例与业务算例全部是独立设定。\n\n## 理解知识、能力与持续发展\n\n**Nonaka，1994，组织知识创造。** [原始论文的大学存档](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)。用于理解实践、表达、个人与组织之间的知识发展。本课主要采用可核原文片段；扫描件读取受限。它不证明所有隐性技能都能被语言或AI完整提取。\n\n**Cohen与Levinthal，1990，吸收能力。** [原始论文](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)。采用摘要、引言与相关知识讨论，解释企业为何需要自己的认识与组织条件。它不是AI或FDE长期效果研究。\n\n**Teece，2007，动态能力。** [机构原文](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)。采用引言与框架段落，理解能力如何持续适应与重组。框架不能替企业判断具体优势，也不估计生存率。\n\n**March，1991，探索与利用。** [原始论文](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf)。采用摘要与开篇机制，讨论资源竞争与回报节奏。没有导出固定预算比例。\n\n**Brynjolfsson、Rock、Syverson，生产率J曲线。** [NBER研究记录](https://www.nber.org/papers/w25148)，期刊版2021。用于互补投入与测量关系；宏观J曲线不是单项目现金回本承诺。\n\n## 比较真实工作中的AI作用\n\n**Generative AI at Work，2025期刊版。** [作者提供的原文](https://danielle.li/assets/docs/GenerativeAIatWork.pdf)。企业软件客服的分批上线研究，员工可以采用、修改或忽略建议。用于讨论经验差异、传播与学习，不推成全行业利润。本课重读摘要、引言与上线安排。\n\n**The Cybernetic Teammate，2026期刊版。** [期刊原文](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)。采用宝洁创新实验的设计与阶段结果，分清生成、组 tle，1961，排队公式。** [原始摘要](https://pubsonline.informs.org/doi/abs/10.1287/opre.9.3.383)。仅读取摘要与成立条件。课程持续超负荷算例使用数量守恒，不套平稳平均等待公式。\n\n**Teece，2010，商业模式、战略与创新。** [原始出版页](https://www.sciencedirect.com/science/article/pii/S002463010900051X)。直接入口受限，采用出版页检索返回的摘要、引言与部分段落。用于价值创造、交付与获取，不证明当前AI新产品需求。\n\n## 怎样把研究带回决定\n\n先看研究处理何种工作、比较什么、观察什么，再判断它与自己的场景哪些相同、哪些不同。一个平均效果不应抹掉经验与阶段差异，一项反向结果也不应冻结后续技术判断。\n\n课程中关于长期FDE、能力留存与竞争节奏的立场，是在这些依据上作出的机制推导，仍需要真实企业持续观察。可以据此主动建设，同时保留被证据改变的空间。\n","text":"# 研究与延伸阅读\n\n课程把理论、实际研究、工程经验和机构自述用于不同问题。它们共同支持机制推导，不构成一个适用于所有企业的提效数字。教学案例与业务算例全部是独立设定。\n\n## 理解知识、能力与持续发展\n\n**Nonaka，1994，组织知识创造。** 原始论文的大学存档。用于理解实践、表达、个人与组织之间的知识发展。本课主要采用可核原文片段；扫描件读取受限。它不证明所有隐性技能都能被语言或AI完整提取。\n\n**Cohen与Levinthal，1990，吸收能力。** 原始论文。采用摘要、引言与相关知识讨论，解释企业为何需要自己的认识与组织条件。它不是AI或FDE长期效果研究。\n\n**Teece，2007，动态能力。** 机构原文。采用引言与框架段落，理解能力如何持续适应与重组。框架不能替企业判断具体优势，也不估计生存率。\n\n**March，1991，探索与利用。** 原始论文。采用摘要与开篇机制，讨论资源竞争与回报节奏。没有导出固定预算比例。\n\n**Brynjolfsson、Rock、Syverson，生产率J曲线。** NBER研究记录，期刊版2021。用于互补投入与测量关系；宏观J曲线不是单项目现金回本承诺。\n\n## 比较真实工作中的AI作用\n\n**Generative AI at Work，2025期刊版。** 作者提供的原文。企业软件客服的分批上线研究，员工可以采用、修改或忽略建议。用于讨论经验差异、传播与学习，不推成全行业利润。本课重读摘要、引言与上线安排。\n\n**The Cybernetic Teammate，2026期刊版。** 期刊原文。采用宝洁创新实验的设计与阶段结果，分清生成、组内选择与最终质量。最终方案改善不代表商业实施成功；不能据组内选择结果推断AI一般不擅判断，也未确认参与者在选择时均使用AI。\n\n**Shifting Work Patterns with Generative AI。** 实际采用页面。跨企业随机获得办公AI使用权，利用软件活动观察时间与任务。采用摘要、设计及观测限制。页面版本元信息与正文日期存在差异；不把软件活动直接解释成完整质量或利润。\n\n**METR开发任务研究，早期2025。** 原始论文及2026方法更新。用于主观感受、总任务时间、选择与并行测量。旧工具和特定开发者结果不作当前AI编程通用结论。\n\n**Caro与Gallien，2010，Zara分配。** 作者机构原文。采用现场规则、流程与实施段落，说明尺码与展示机制怎样改变工程。它是运筹与数字化案例，不是生成式AI/FDE项目，课程未复算模型与原始数据。\n\n## 理解模型与工程条件\n\n**CRFM基础模型报告，2021/2022版本。** 原始摘要。用于广泛训练、下游适配与共同依赖；未全文采用长报告，也不证明每项任务经济可行。\n\n**Anthropic，Building effective agents，2024。** 原文。用于固定工作流、动态工具选择与复杂度取舍。属于工程经验，不是长期经营实验。\n\n**Anthropic，上下文工程，2025。** 原文。用于当前信息、持久记录与调用。记忆工程不能保证业务经验正确。\n\n**Sculley等，2015，Hidden Technical Debt in Machine Learning Systems。** 原始论文。采用摘要、反馈循环与系统依赖讨论。早期ML经验不能直接量化当前Agent成本。\n\n**Snell等，2024，测试时计算配置。** 原始预印本摘要。用于资源、策略与任务难度关系；没有把数学实验倍数转成企业投资回报。\n\n## 理解人员、长期合作与经营机制\n\n**Holmström与Milgrom，1991，多任务激励。** 作者存档。采用可核引言片段，扫描全文读取受限。解释评价怎样改变注意力，不给出统一奖金规则。\n\n**Baker、Gibbons、Murphy，2002，关系合作。** 原始论文。采用摘要与开篇关于重复合作、难以事前完整约定的结果。它不证明长期外部合同必然更优。\n\n**Palantir FDSE岗位。** 官方说明。用于模糊问题、原型、代码、集成和反馈等实际职责。属于机构自述，不是统一行业定义。\n\n**AWS FDE共建安排。** 官方材料。用于生产共建与客户接续目标；机构主张不等于独立效果证明。\n\n**Little，1961，排队公式。** 原始摘要。仅读取摘要与成立条件。课程持续超负荷算例使用数量守恒，不套平稳平均等待公式。\n\n**Teece，2010，商业模式、战略与创新。** 原始出版页。直接入口受限，采用出版页检索返回的摘要、引言与部分段落。用于价值创造、交付与获取，不证明当前AI新产品需求。\n\n## 怎样把研究带回决定\n\n先看研究处理何种工作、比较什么、观察什么，再判断它与自己的场景哪些相同、哪些不同。一个平均效果不应抹掉经验与阶段差异，一项反向结果也不应冻结后续技术判断。\n\n课程中关于长期FDE、能力留存与竞争节奏的立场，是在这些依据上作出的机制推导，仍需要真实企业持续观察。可以据此主动建设，同时保留被证据改变的空间。\n"},{"file":"工作簿-改造提案.md","id":"workbook","number":null,"role":"工作簿","part":-1,"title":"工作簿｜形成一份有证据、能继续发展的改造提案","md":"# 工作簿｜形成一份有证据、能继续发展的改造提案\n\n这份工作簿用于把课程判断带回一条业务。可以复制或下载后编辑，也可以先用四组教学案例练习。填写不是继续阅读的前提。\n\n不要用“提升效率、沉淀知识、形成壁垒”替代具体内容。未知可以保留为未知，但要说清怎样取得会改变选择的证据。\n\n## 一、先界定客户结果与当前处境\n\n写一段完整背景：客户是谁、在什么情况下需要什么结果、现有方式怎样工作，以及为什么现在值得研究。\n\n| 内容 | 填写 |\n|---|---|\n| 客户或内部使用者的具体处境 | 待填写 |\n| 希望改变的结果，含起点与终点 | 待填写 |\n| 已有系统、人员与方法 | 待填写 |\n| 当前已知材料与出处 | 待填写 |\n| 价值的其他解释，如位置、价格或任务难度 | 待填写 |\n\n检查：别人是否能根据这段背景，理解你为何选这项工作，而无须参加前面的会议？\n\n## 二、提出优势与工作机制假设\n\n用一段因果说明连接条件、判断、动作与结果。不要只列痛点。\n\n可以采用：“我们怀疑某项经验或协作，使某类任务更容易取得某结果；它依赖这些事实和资源。目前限制复现的环节是……另一个可能解释是……”\n\n| 需要追查 | 当前证据 | 尚缺的区分材料 |\n|---|---|---|\n| 信息与判断 | 待填写 | 待填写 |\n| 交接与实际动作 | 待填写 | 待填写 |\n| 资源与评价安排 | 待填写 | 待填写 |\n\n## 三、说明AI相对替代增加什么\n\n| 安排 | 能完成什么 | 主要负担与限制 |\n|---|---|---|\n| 改善人工与SOP | 待填写 | 待填写 |\n| 成熟程序或现成软件 | 待填写 | 待填写 |\n| 增加AI的安排 | 待填写 | 待填写 |\n\n写清新增作用落在材料处理、判断、持续协作、工具行动还是经验再用。若普通方案相当，应保留选择它的可能。\n\n## 四、设计一次生产与经验的连接\n\n沿一笔任务说明自然输入、AI候选、人员修改、正式决定、实际执行和结果怎样对应。区分原始报告、已核事实与解释，不补造当时心理过程。\n\n| 连接 | 内容与承担者 |\n|---|---|\n| 当前目标与使用者 | 待填写 |\n| 必要事实与相关经验 | 待填写 |\n| AI与人的阶段分工 | 待填写 |\n| 工具、决定范围与确认 | 待填写 |\n| 结果与未采用原因 | 待填写 |\n| 下一次使用入口 | 待填写 |\n\n检查：增加记录的负担是什么？它会帮助下一次什么决定？\n\n## 五、分别验证任务、业务与学习\n\n| 层次 | 标准与比较 | 何种结果会改变采用范围 |\n|---|---|---|\n| 任务质量 | 待填写 | 待填写 |\n| 业务效果 | 待填写 | 待填写 |\n| 接任或迁移 | 待填写 | 待填写 |\n\n说明哪些材料留出不用来调试，谁能核验，观察多久，是否存在共享资源干扰。小样本可以发现问题，不自动支持普遍提升率。\n\n## 六、把成本、容量和兑现分开\n\n| 项目 | 已知条件或未知 | 变化如何进入经营 |\n|---|---|---|\n| 智能使用与平台 | 待填写 | 待填写 |\n| 人工核验与返工 | 待填写 | 待填写 |\n| 建设、维护与业务配合 | 待填写 | 待填写 |\n| 关键环节容量与积压 | 待填写 | 待填写 |\n| 确实取消的支出 | 待填写 | 待填写 |\n| 释放容量的具体用途 | 待填写 | 待填写 |\n| 未来能力的再用检验 | 待填写 | 待填写 |\n\n固定工资下少占时间不自动成为现金。新增收入要有客户采用和交付成本，未来资产不任意估值，也不重复计算同一项作用。\n\n## 七、安排持续责任与共建\n\n写清业务负责人、专业人员、FDE与内部接续者分别承担什么。把新系统如何改变岗位负担、评价和真实反馈也写进去。\n\n| 持续工作 | 负责与支持 | 如何检验接续 |\n|---|---|---|\n| 价值与资源取舍 | 待填写 | 待填写 |\n| 方法、反例与修订 | 待填写 | 待填写 |\n| 系统运行和工具 | 待填写 | 待填写 |\n| 阶段评价与下一步 | 待填写 | 待填写 |\n\n## 八、提出有条件的阶段路线\n\n每阶段写清可用产物、关键假设、投入范围、复查时点，以及继续、改法或停止的依据。不要只写技术名称和上线日期。\n\n阶段之间应能接上：“取得这项证据后，我们才更有依据选择……”\n\n## 用案例检查是否真的理解\n\n选择[连锁备货](案例A-连锁备货.md)时，至少解释三个问题：销量80为什么不等于需求80；180元差额为什么不证明AI收益；交通变化后，应该修订什么而非照搬什么。\n\n参考推导：销量受供给限制，未满足需求未知；180元来自事先给定需求与局部成本的算例，真实预测、执行和全网结果未验证；交通变化要求更新当前事实与方法适用范围，而非仅保留历史数量。\n\n再换[设备售后](案例C-设备售后.md)或[专业服务](案例D-专业服务.md)。如果只是替换业务名称，说明还没有重新解释客户价值、履约约束与证据。迁移应改变这些关键关系。\n\n## 提交讨论前，完整读一遍\n\n读者应能从材料理解主张，从主张理解行动，从行动理解结果、成本与能力，再看到下一步为何如此。重要概念有解释，未知有具体名字，案例与结论使用相同条件。\n\n如果一段只剩价值口号，补机制；如果一段全是工具，补任务与采用；如果结论超出材料，缩小结论或补证据。工作簿的价值在于形成可继续讨论的认识，不在于填满所有格子。\n","html":"\u003ch1>工作簿｜形成一份有证据、能继续发展的改造提案\u003c/h1>\n\u003cp>这份工作簿用于把课程判断带回一条业务。可以复制或下载后编辑，也可以先用四组教学案例练习。填写不是继续阅读的前提。\u003c/p>\n\u003cp>不要用“提升效率、沉淀知识、形成壁垒”替代具体内容。未知可以保留为未知，但要说清怎样取得会改变选择的证据。\u003c/p>\n\u003ch2 id=\"workbook-section-1\">一、先界定客户结果与当前处境\u003c/h2>\n\u003cp>写一段完整背景：客户是谁、在什么情况下需要什么结果、现有方式怎样工作，以及为什么现在值得研究。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>内容\u003c/th>\n\u003cth>填写\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>客户或内部使用者的具体处境\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>希望改变的结果，含起点与终点\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已有系统、人员与方法\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>当前已知材料与出处\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>价值的其他解释，如位置、价格或任务难度\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>检查：别人是否能根据这段背景，理解你为何选这项工作，而无须参加前面的会议？\u003c/p>\n\u003ch2 id=\"workbook-section-2\">二、提出优势与工作机制假设\u003c/h2>\n\u003cp>用一段因果说明连接条件、判断、动作与结果。不要只列痛点。\u003c/p>\n\u003cp>可以采用：“我们怀疑某项经验或协作，使某类任务更容易取得某结果；它依赖这些事实和资源。目前限制复现的环节是……另一个可能解释是……”\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>需要追查\u003c/th>\n\u003cth>当前证据\u003c/th>\n\u003cth>尚缺的区分材料\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>信息与判断\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>交接与实际动作\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>资源与评价安排\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"workbook-section-3\">三、说明AI相对替代增加什么\u003c/h2>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>安排\u003c/th>\n\u003cth>能完成什么\u003c/th>\n\u003cth>主要负担与限制\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>改善人工与SOP\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>成熟程序或现成软件\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>增加AI的安排\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>写清新增作用落在材料处理、判断、持续协作、工具行动还是经验再用。若普通方案相当，应保留选择它的可能。\u003c/p>\n\u003ch2 id=\"workbook-section-4\">四、设计一次生产与经验的连接\u003c/h2>\n\u003cp>沿一笔任务说明自然输入、AI候选、人员修改、正式决定、实际执行和结果怎样对应。区分原始报告、已核事实与解释，不补造当时心理过程。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>连接\u003c/th>\n\u003cth>内容与承担者\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>当前目标与使用者\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>必要事实与相关经验\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AI与人的阶段分工\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工具、决定范围与确认\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结果与未采用原因\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>下一次使用入口\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>检查：增加记录的负担是什么？它会帮助下一次什么决定？\u003c/p>\n\u003ch2 id=\"workbook-section-5\">五、分别验证任务、业务与学习\u003c/h2>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>层次\u003c/th>\n\u003cth>标准与比较\u003c/th>\n\u003cth>何种结果会改变采用范围\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>任务质量\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>业务效果\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接任或迁移\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>说明哪些材料留出不用来调试，谁能核验，观察多久，是否存在共享资源干扰。小样本可以发现问题，不自动支持普遍提升率。\u003c/p>\n\u003ch2 id=\"workbook-section-6\">六、把成本、容量和兑现分开\u003c/h2>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项目\u003c/th>\n\u003cth>已知条件或未知\u003c/th>\n\u003cth>变化如何进入经营\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>智能使用与平台\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>人工核验与返工\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>建设、维护与业务配合\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>关键环节容量与积压\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>确实取消的支出\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>释放容量的具体用途\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>未来能力的再用检验\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>固定工资下少占时间不自动成为现金。新增收入要有客户采用和交付成本，未来资产不任意估值，也不重复计算同一项作用。\u003c/p>\n\u003ch2 id=\"workbook-section-7\">七、安排持续责任与共建\u003c/h2>\n\u003cp>写清业务负责人、专业人员、FDE与内部接续者分别承担什么。把新系统如何改变岗位负担、评价和真实反馈也写进去。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>持续工作\u003c/th>\n\u003cth>负责与支持\u003c/th>\n\u003cth>如何检验接续\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>价值与资源取舍\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>方法、反例与修订\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>系统运行和工具\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>阶段评价与下一步\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003ctd>待填写\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"workbook-section-8\">八、提出有条件的阶段路线\u003c/h2>\n\u003cp>每阶段写清可用产物、关键假设、投入范围、复查时点，以及继续、改法或停止的依据。不要只写技术名称和上线日期。\u003c/p>\n\u003cp>阶段之间应能接上：“取得这项证据后，我们才更有依据选择……”\u003c/p>\n\u003ch2 id=\"workbook-section-9\">用案例检查是否真的理解\u003c/h2>\n\u003cp>选择\u003ca href=\"#case-a\">连锁备货\u003c/a>时，至少解释三个问题：销量80为什么不等于需求80；180元差额为什么不证明AI收益；交通变化后，应该修订什么而非照搬什么。\u003c/p>\n\u003cp>参考推导：销量受供给限制，未满足需求未知；180元来自事先给定需求与局部成本的算例，真实预测、执行和全网结果未验证；交通变化要求更新当前事实与方法适用范围，而非仅保留历史数量。\u003c/p>\n\u003cp>再换\u003ca href=\"#case-c\">设备售后\u003c/a>或\u003ca href=\"#case-d\">专业服务\u003c/a>。如果只是替换业务名称，说明还没有重新解释客户价值、履约约束与证据。迁移应改变这些关键关系。\u003c/p>\n\u003ch2 id=\"workbook-section-10\">提交讨论前，完整读一遍\u003c/h2>\n\u003cp>读者应能从材料理解主张，从主张理解行动，从行动理解结果、成本与能力，再看到下一步为何如此。重要概念有解释，未知有具体名字，案例与结论使用相同条件。\u003c/p>\n\u003cp>如果一段只剩价值口号，补机制；如果一段全是工具，补任务与采用；如果结论超出材料，缩小结论或补证据。工作簿的价值在于形成可继续讨论的认识，不在于填满所有格子。\u003c/p>\n","headings":[{"id":"workbook-section-1","label":"一、先界定客户结果与当前处境"},{"id":"workbook-section-2","label":"二、提出优势与工作机制假设"},{"id":"workbook-section-3","label":"三、说明AI相对替代增加什么"},{"id":"workbook-section-4","label":"四、设计一次生产与经验的连接"},{"id":"workbook-section-5","label":"五、分别验证任务、业务与学习"},{"id":"workbook-section-6","label":"六、把成本、容量和兑现分开"},{"id":"workbook-section-7","label":"七、安排持续责任与共建"},{"id":"workbook-section-8","label":"八、提出有条件的阶段路线"},{"id":"workbook-section-9","label":"用案例检查是否真的理解"},{"id":"workbook-section-10","label":"提交讨论前，完整读一遍"}],"exportMd":"# 工作簿｜形成一份有证据、能继续发展的改造提案\n\n这份工作簿用于把课程判断带回一条业务。可以复制或下载后编辑，也可以先用四组教学案例练习。填写不是继续阅读的前提。\n\n不要用“提升效率、沉淀知识、形成壁垒”替代具体内容。未知可以保留为未知，但要说清怎样取得会改变选择的证据。\n\n## 一、先界定客户结果与当前处境\n\n写一段完整背景：客户是谁、在什么情况下需要什么结果、现有方式怎样工作，以及为什么现在值得研究。\n\n| 内容 | 填写 |\n|---|---|\n| 客户或内部使用者的具体处境 | 待填写 |\n| 希望改变的结果，含起点与终点 | 待填写 |\n| 已有系统、人员与方法 | 待填写 |\n| 当前已知材料与出处 | 待填写 |\n| 价值的其他解释，如位置、价格或任务难度 | 待填写 |\n\n检查：别人是否能根据这段背景，理解你为何选这项工作，而无须参加前面的会议？\n\n## 二、提出优势与工作机制假设\n\n用一段因果说明连接条件、判断、动作与结果。不要只列痛点。\n\n可以采用：“我们怀疑某项经验或协作，使某类任务更容易取得某结果；它依赖这些事实和资源。目前限制复现的环节是……另一个可能解释是……”\n\n| 需要追查 | 当前证据 | 尚缺的区分材料 |\n|---|---|---|\n| 信息与判断 | 待填写 | 待填写 |\n| 交接与实际动作 | 待填写 | 待填写 |\n| 资源与评价安排 | 待填写 | 待填写 |\n\n## 三、说明AI相对替代增加什么\n\n| 安排 | 能完成什么 | 主要负担与限制 |\n|---|---|---|\n| 改善人工与SOP | 待填写 | 待填写 |\n| 成熟程序或现成软件 | 待填写 | 待填写 |\n| 增加AI的安排 | 待填写 | 待填写 |\n\n写清新增作用落在材料处理、判断、持续协作、工具行动还是经验再用。若普通方案相当，应保留选择它的可能。\n\n## 四、设计一次生产与经验的连接\n\n沿一笔任务说明自然输入、AI候选、人员修改、正式决定、实际执行和结果怎样对应。区分原始报告、已核事实与解释，不补造当时心理过程。\n\n| 连接 | 内容与承担者 |\n|---|---|\n| 当前目标与使用者 | 待填写 |\n| 必要事实与相关经验 | 待填写 |\n| AI与人的阶段分工 | 待填写 |\n| 工具、决定范围与确认 | 待填写 |\n| 结果与未采用原因 | 待填写 |\n| 下一次使用入口 | 待填写 |\n\n检查：增加记录的负担是什么？它会帮助下一次什么决定？\n\n## 五、分别验证任务、业务与学习\n\n| 层次 | 标准与比较 | 何种结果会改变采用范围 |\n|---|---|---|\n| 任务质量 | 待填写 | 待填写 |\n| 业务效果 | 待填写 | 待填写 |\n| 接任或迁移 | 待填写 | 待填写 |\n\n说明哪些材料留出不用来调试，谁能核验，观察多久，是否存在共享资源干扰。小样本可以发现问题，不自动支持普遍提升率。\n\n## 六、把成本、容量和兑现分开\n\n| 项目 | 已知条件或未知 | 变化如何进入经营 |\n|---|---|---|\n| 智能使用与平台 | 待填写 | 待填写 |\n| 人工核验与返工 | 待填写 | 待填写 |\n| 建设、维护与业务配合 | 待填写 | 待填写 |\n| 关键环节容量与积压 | 待填写 | 待填写 |\n| 确实取消的支出 | 待填写 | 待填写 |\n| 释放容量的具体用途 | 待填写 | 待填写 |\n| 未来能力的再用检验 | 待填写 | 待填写 |\n\n固定工资下少占时间不自动成为现金。新增收入要有客户采用和交付成本，未来资产不任意估值，也不重复计算同一项作用。\n\n## 七、安排持续责任与共建\n\n写清业务负责人、专业人员、FDE与内部接续者分别承担什么。把新系统如何改变岗位负担、评价和真实反馈也写进去。\n\n| 持续工作 | 负责与支持 | 如何检验接续 |\n|---|---|---|\n| 价值与资源取舍 | 待填写 | 待填写 |\n| 方法、反例与修订 | 待填写 | 待填写 |\n| 系统运行和工具 | 待填写 | 待填写 |\n| 阶段评价与下一步 | 待填写 | 待填写 |\n\n## 八、提出有条件的阶段路线\n\n每阶段写清可用产物、关键假设、投入范围、复查时点，以及继续、改法或停止的依据。不要只写技术名称和上线日期。\n\n阶段之间应能接上：“取得这项证据后，我们才更有依据选择……”\n\n## 用案例检查是否真的理解\n\n选择[连锁备货](#case-a)时，至少解释三个问题：销量80为什么不等于需求80；180元差额为什么不证明AI收益；交通变化后，应该修订什么而非照搬什么。\n\n参考推导：销量受供给限制，未满足需求未知；180元来自事先给定需求与局部成本的算例，真实预测、执行和全网结果未验证；交通变化要求更新当前事实与方法适用范围，而非仅保留历史数量。\n\n再换[设备售后](#case-c)或[专业服务](#case-d)。如果只是替换业务名称，说明还没有重新解释客户价值、履约约束与证据。迁移应改变这些关键关系。\n\n## 提交讨论前，完整读一遍\n\n读者应能从材料理解主张，从主张理解行动，从行动理解结果、成本与能力，再看到下一步为何如此。重要概念有解释，未知有具体名字，案例与结论使用相同条件。\n\n如果一段只剩价值口号，补机制；如果一段全是工具，补任务与采用；如果结论超出材料，缩小结论或补证据。工作簿的价值在于形成可继续讨论的认识，不在于填满所有格子。\n","exportSingleMd":"# 工作簿｜形成一份有证据、能继续发展的改造提案\n\n这份工作簿用于把课程判断带回一条业务。可以复制或下载后编辑，也可以先用四组教学案例练习。填写不是继续阅读的前提。\n\n不要用“提升效率、沉淀知识、形成壁垒”替代具体内容。未知可以保留为未知，但要说清怎样取得会改变选择的证据。\n\n## 一、先界定客户结果与当前处境\n\n写一段完整背景：客户是谁、在什么情况下需要什么结果、现有方式怎样工作，以及为什么现在值得研究。\n\n| 内容 | 填写 |\n|---|---|\n| 客户或内部使用者的具体处境 | 待填写 |\n| 希望改变的结果，含起点与终点 | 待填写 |\n| 已有系统、人员与方法 | 待填写 |\n| 当前已知材料与出处 | 待填写 |\n| 价值的其他解释，如位置、价格或任务难度 | 待填写 |\n\n检查：别人是否能根据这段背景，理解你为何选这项工作，而无须参加前面的会议？\n\n## 二、提出优势与工作机制假设\n\n用一段因果说明连接条件、判断、动作与结果。不要只列痛点。\n\n可以采用：“我们怀疑某项经验或协作，使某类任务更容易取得某结果；它依赖这些事实和资源。目前限制复现的环节是……另一个可能解释是……”\n\n| 需要追查 | 当前证据 | 尚缺的区分材料 |\n|---|---|---|\n| 信息与判断 | 待填写 | 待填写 |\n| 交接与实际动作 | 待填写 | 待填写 |\n| 资源与评价安排 | 待填写 | 待填写 |\n\n## 三、说明AI相对替代增加什么\n\n| 安排 | 能完成什么 | 主要负担与限制 |\n|---|---|---|\n| 改善人工与SOP | 待填写 | 待填写 |\n| 成熟程序或现成软件 | 待填写 | 待填写 |\n| 增加AI的安排 | 待填写 | 待填写 |\n\n写清新增作用落在材料处理、判断、持续协作、工具行动还是经验再用。若普通方案相当，应保留选择它的可能。\n\n## 四、设计一次生产与经验的连接\n\n沿一笔任务说明自然输入、AI候选、人员修改、正式决定、实际执行和结果怎样对应。区分原始报告、已核事实与解释，不补造当时心理过程。\n\n| 连接 | 内容与承担者 |\n|---|---|\n| 当前目标与使用者
