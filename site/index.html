3c/p>\n\u003cp>直接从一句需求生成完整演示文稿，最容易在后期发现方向不对。更稳妥的过程是先确定论点、证据和顺序，再生成各部分表达；先确定视频脚本和镜头关系，再制作画面；先确定文章要回答的问题，再组织段落。\u003c/p>\n\u003cp>这些中间结构使错误更早被发现。比如方案开头承诺降低售后成本，后面却只展示聊天机器人界面，缺少如何减少重复故障和返工的解释。若先审查内容结构，这种缺口可以在制作大量图片前修正。\u003c/p>\n\u003cp>中间结构也方便局部修改。客户改变了服务范围，应该能找到受影响的说明、价格和实施部分，再更新成品。若只能重新生成全部内容，已确认的细节可能在下一次生成中丢失。\u003c/p>\n\u003ch2>把不同素材做成可使用的内容\u003c/h2>\n\u003cp>文字生成擅长组织表达，但要核对事实、承诺和专业含义。图片生成适合探索视觉方案、构图和氛围；需要严格文字、尺寸、图纸精度或品牌细节时，应判断是否由设计与排版工具完成。视频和音频还涉及时长、镜头连续性、配音和实际播放效果。\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>内容环节\u003c/th>\n\u003cth>主要工作\u003c/th>\n\u003cth>留下的结果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>事实准备\u003c/td>\n\u003ctd>确认产品、价格、数据和适用条件\u003c/td>\n\u003ctd>当前可采用的资料\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结构设计\u003c/td>\n\u003ctd>安排问题、论点、证据和顺序\u003c/td>\n\u003ctd>可供讨论的内容结构\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图文制作\u003c/td>\n\u003ctd>把结构落实为文字、图片或音视频\u003c/td>\n\u003ctd>可以修改的初稿\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>成品检查\u003c/td>\n\u003ctd>在实际设备打开文件，查看字体、链接与播放\u003c/td>\n\u003ctd>可交付版本和使用入口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>使用反馈\u003c/td>\n\u003ctd>收集读者追问和实际使用情况\u003c/td>\n\u003ctd>下一次修订的具体依据\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>内容在初稿、专业确认和正式使用几个阶段间推进。关键修改发生后，按依赖更新相关图文和导出文件，再打开最终版本核对。这样，一次确认可以服务后续制作，局部变化也有明确的处理范围。\u003c/p>\n\u003ch2>怎样把经验沉淀成可复用能力\u003c/h2>\n\u003cp>企业可以积累稳定的内容要求与有效范例：客户常问的问题、专业事实的解释方法、帮助选择的比较结构，以及最终成品的检查办法。提示词负责把这些要求组织给模型，范例帮助它理解企业希望达到的表达质量。\u003c/p>\n\u003cp>沉淀范例时，把读者与用途一起保存。技术人员需要的细节与管理者关心的经营关系不同；在新场合使用时，先调整解释重点，再沿用有效结构。企业因此积累的是组织内容的方法，而非固定句式。\u003c/p>\n\u003cp>记录修改集中在哪些地方、读者是否更容易完成目标、同一问题是否仍被反复追问，可以决定下一步改资料、改结构还是改表达。制作与使用由此形成持续反馈。\u003c/p>\n\u003cp>当结构、专业资料与制作方法可以复用，企业就能够以合理成本持续更新内容，服务更多细分读者。内容生产的组织能力，体现在能够及时交出适合当前用途的材料。\u003c/p>\n\u003cp>\u003ca id=\"do-09\">\u003c/a>\u003c/p>\n\u003ch2>做一份新员工真的能用的操作说明\u003c/h2>\n\u003cp>先选一项具体任务，例如新客服登记报修。把企业已经采用的字段、接手岗位和缺项处理办法整理出来。下面先用虚构规则演示：记录客户、设备、现象；不知道设备型号就请客户补照片；材料齐备后交维修待办，接手人员确认受理。\u003c/p>\n\u003cdiv class=\"copy-block\">\u003cdiv class=\"copy-tools\">\u003cbutton type=\"button\" class=\"copy-text\">复制内容\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-text\">本次教学规则：登记客户、设备和故障现象；不知道设备型号时请客户补照片；材料齐备后交维修待办，由接手人员确认受理。\n请根据这些规则，给第一次做报修登记的新同事写操作说明。\n先列出他要拿到的材料和应完成的结果，再给出按顺序可做的步骤。\n每步说明填什么、看见什么才继续、缺材料找谁补。\n只采用提供的规则。先给步骤结构，等我核对后再展开正文。\n\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>你先检查结构能否从收到报修走到维修人员接手，再请AI展开。完成后让一位未参与制作的同事拿一条报修材料照着做，标出他需要追问或猜测的位置。修正这些位置，打开最终文件复查，才将其放到实际受理入口。\u003c/p>\n\u003cp>留下的成品是可使用的说明、对应规则和使用反馈。若新员工只是读懂了，却仍找不到登记入口或接手人，先把入口与职责补进说明，再讨论文字润色。\u003c/p>\n","text":"# 第9章｜创作能力怎样进入内容生产\n\n**AI 降低了生成候选内容的成本，企业更需要明确内容为谁解决什么问题，并管理从想法到可用成品的过程。**\n\n[本章做法：做一份新员工真的能用的操作说明](#do-09)\n\n文字、图像、音频和视频生成，使企业能够以更低成本尝试不同表达。产品说明可以按客户类型调整，培训材料可以随流程变化更新，服务方案可以更快形成初稿。创作能力的经营价值，既可能是缩短制作时间，也可能是让过去不值得单独制作的内容变得可行。\n\n生成成本下降后，企业可以先比较几种结构、表达或视觉方案，再集中精力完善适合用途的一种。制作过程需要为这种选择留出位置，才能把更多候选转化成更好的成品。\n\n## 好看之外，内容要完成什么\n\n先确定内容的使用场合。销售拜访前的简报，应该帮助理解客户和找到讨论入口；正式方案要让决策者看懂问题、选择和投入；操作说明要让员工完成任务。三者可能使用同一套产品资料，却不能用同一种表达。\n\n创作简报至少需要说明读者、使用时刻、读者已有知识、希望发生的变化、必须准确的信息以及媒介限制。这里的“变化”可以很具体：让客户知道三种服务的差别，或者让新员工能够识别两类异常并知道交给谁。\n\n例如面对管理者，方案应说明改造哪项工作、谁来配合、会怎样影响经营；面对操作人员，则需要清楚说明输入、操作和异常处理。同一产品资料在不同场合承担不同解释任务，创作简报就是把这种差异交给AI。\n\n![从创作简报到实际使用的内容生产过程](assets/09.svg)\n\n## 为什么需要中间结构\n\n准备一张婚礼请柬时，通常先确认邀请谁、时间地点和回复方式，再选择文字与版式。若宴会时间尚未确定就先印好，改一个时间也要重新制作。企业内容生产也是这样：先确认受众要据此做什么，再把信息排成便于理解的顺序，最后制作成文件。\n\n例如培训新客服处理退款，业务负责人先确认退款条件和需升级的情况，制作人员把它们排成“收到请求—查哪条记录—能否处理—交给谁”的说明，再让 AI 生成初稿。新员工按初稿处理一笔示例，卡住的位置就是下一次需要补充的内容。\n\n直接从一句需求生成完整演示文稿，最容易在后期发现方向不对。更稳妥的过程是先确定论点、证据和顺序，再生成各部分表达；先确定视频脚本和镜头关系，再制作画面；先确定文章要回答的问题，再组织段落。\n\n这些中间结构使错误更早被发现。比如方案开头承诺降低售后成本，后面却只展示聊天机器人界面，缺少如何减少重复故障和返工的解释。若先审查内容结构，这种缺口可以在制作大量图片前修正。\n\n中间结构也方便局部修改。客户改变了服务范围，应该能找到受影响的说明、价格和实施部分，再更新成品。若只能重新生成全部内容，已确认的细节可能在下一次生成中丢失。\n\n## 把不同素材做成可使用的内容\n\n文字生成擅长组织表达，但要核对事实、承诺和专业含义。图片生成适合探索视觉方案、构图和氛围；需要严格文字、尺寸、图纸精度或品牌细节时，应判断是否由设计与排版工具完成。视频和音频还涉及时长、镜头连续性、配音和实际播放效果。\n\n| 内容环节 | 主要工作 | 留下的结果 |\n| --- | --- | --- |\n| 事实准备 | 确认产品、价格、数据和适用条件 | 当前可采用的资料 |\n| 结构设计 | 安排问题、论点、证据和顺序 | 可供讨论的内容结构 |\n| 图文制作 | 把结构落实为文字、图片或音视频 | 可以修改的初稿 |\n| 成品检查 | 在实际设备打开文件，查看字体、链接与播放 | 可交付版本和使用入口 |\n| 使用反馈 | 收集读者追问和实际使用情况 | 下一次修订的具体依据 |\n\n内容在初稿、专业确认和正式使用几个阶段间推进。关键修改发生后，按依赖更新相关图文和导出文件，再打开最终版本核对。这样，一次确认可以服务后续制作，局部变化也有明确的处理范围。\n\n## 怎样把经验沉淀成可复用能力\n\n企业可以积累稳定的内容要求与有效范例：客户常问的问题、专业事实的解释方法、帮助选择的比较结构，以及最终成品的检查办法。提示词负责把这些要求组织给模型，范例帮助它理解企业希望达到的表达质量。\n\n沉淀范例时，把读者与用途一起保存。技术人员需要的细节与管理者关心的经营关系不同；在新场合使用时，先调整解释重点，再沿用有效结构。企业因此积累的是组织内容的方法，而非固定句式。\n\n记录修改集中在哪些地方、读者是否更容易完成目标、同一问题是否仍被反复追问，可以决定下一步改资料、改结构还是改表达。制作与使用由此形成持续反馈。\n\n当结构、专业资料与制作方法可以复用，企业就能够以合理成本持续更新内容，服务更多细分读者。内容生产的组织能力，体现在能够及时交出适合当前用途的材料。\n\n\u003ca id=\"do-09\">\u003c/a>\n\n## 做一份新员工真的能用的操作说明\n\n先选一项具体任务，例如新客服登记报修。把企业已经采用的字段、接手岗位和缺项处理办法整理出来。下面先用虚构规则演示：记录客户、设备、现象；不知道设备型号就请客户补照片；材料齐备后交维修待办，接手人员确认受理。\n\n```text\n本次教学规则：登记客户、设备和故障现象；不知道设备型号时请客户补照片；材料齐备后交维修待办，由接手人员确认受理。\n请根据这些规则，给第一次做报修登记的新同事写操作说明。\n先列出他要拿到的材料和应完成的结果，再给出按顺序可做的步骤。\n每步说明填什么、看见什么才继续、缺材料找谁补。\n只采用提供的规则。先给步骤结构，等我核对后再展开正文。\n```\n\n你先检查结构能否从收到报修走到维修人员接手，再请AI展开。完成后让一位未参与制作的同事拿一条报修材料照着做，标出他需要追问或猜测的位置。修正这些位置，打开最终文件复查，才将其放到实际受理入口。\n\n留下的成品是可使用的说明、对应规则和使用反馈。若新员工只是读懂了，却仍找不到登记入口或接手人，先把入口与职责补进说明，再讨论文字润色。\n"},{"id":"c10","file":"10-AI编程怎样改变企业软件供给.md","title":"第10章｜AI编程怎样改变企业软件供给","html":"\u003ch1>第10章｜AI编程怎样改变企业软件供给\u003c/h1>\n\u003cp>\u003cstrong>AI 编程使更多细小、专属的工作值得被做成软件。企业要重新计算的是实现、集成和持续运行的总成本，而不只是写代码的价格。\u003c/strong>\u003c/p>\n\u003cp>\u003ca href=\"#c10/do-10\">本章做法：把一个小工具需求交给实施者，并验收一笔任务\u003c/a>\u003c/p>\n\u003cp>许多企业工作长期停留在表格、聊天和手工搬运中，并非完全不值得改进，而是原先的软件建设成本太高。为一项小流程写需求、安排开发、把相连的系统放在一起试运行，再持续维护，可能比它短期节省的人工还贵。AI 能帮助写程序、理解既有代码、生成界面和修复部分问题，从而改变其中一些成本。\u003c/p>\n\u003cp>这为小工具、内部工作台、系统连接和快速试验创造了机会。完整建设仍包括需求、集成、验证和运行，AI编程降低其中的实现成本，也让团队更早做出可操作版本来讨论其他条件。\u003c/p>\n\u003ch2>从一句要求到可运行功能，中间发生什么\u003c/h2>\n\u003cp>把一台家电送到维修店，前台通常先登记联系方式、设备和故障，再把维修单交给相应师傅。你手里的受理凭条与师傅手里的维修单对应同一件东西；日后查询时，双方才知道在谈哪次维修。企业售后软件要完成的也是这样的交接。\u003c/p>\n\u003cp>假定一家服务企业希望客户填写申请后，自动交给对应区域的维修团队。开发者可以让 AI 协助生成表单、保存申请的程序和分配规则。客户点击提交后，程序把内容存入售后系统，取得申请编号，再按区域规则把记录加入相应团队的待办列表。维修人员打开待办，看到联系方式、设备和问题，确认接手后更新状态。\u003c/p>\n\u003cp>完整功能还需要确认申请保存位置、客户与设备标识、当前人员和区域规则、通知渠道、重复提交处理，以及团队怎样接收和变更状态。AI 编程可以协助实现这些连接，但前提是所需系统确实提供接口或其他可用操作，且企业具备相应权限。\u003c/p>\n\u003cp>开发者可以先用模拟数据验证界面与步骤，再连接实际记录。业务负责人参与时，可以先判断操作是否符合工作习惯，接通后再查看真实创建的申请和接收团队的入口。两次查看解决不同问题，能够让修改发生得更早。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"10\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iOTA0IiB2aWV3Qm94PSIwIDAgMzYwIDkwNCIgcm9sZT0iaW1nIj48dGl0bGU+5oql5L+u6KGo5oCO5qC35Yiw6L6+57u05L+u5Lq65ZGY5omL5LitPC90aXRsZT48ZGVzYz7ooajljZXmj5DkuqTlkI7kv53lrZjorrDlvZXlubbliIbmtL7vvIznu7Tkv67kurrlkZjmjInlkIzkuIDnvJblj7fmjqXmiYvvvIzlrqLmiLfmn6Xor6Lmm7TmlrDlkI7nmoTnirbmgIHjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYSIgbWFya2VyV2lkdGg9IjgiIG1hcmtlckhlaWdodD0iOCIgcmVmWD0iNyIgcmVmWT0iNCIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwIEw4IDQgTDAgOCBaIiBmaWxsPSIjMjQ2YTU1Ii8+PC9tYXJrZXI+PC9kZWZzPjxyZWN0IHdpZHRoPSIzNjAiIGhlaWdodD0iOTA0IiBmaWxsPSJ3aGl0ZSIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiI+PHRleHQgeD0iMjQiIHk9IjM4IiBmb250LXNpemU9IjI0IiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNjAwIj7miqXkv67ooajmgI7moLfliLDovr7nu7Tkv67kurrlkZjmiYvkuK08L3RleHQ+PHRleHQgeD0iMjQiIHk9IjcxIiBmb250LXNpemU9IjE4IiBmaWxsPSIjNjE3MTZiIiBmb250LXdlaWdodD0iNDAwIj7npLrmhI/vvJrkuIDnrJTnlLPor7fku47mj5DkuqTliLDmjqXmiYs8L3RleHQ+PHJlY3QgeD0iMjQiIHk9IjEyNCIgd2lkdGg9IjMxMiIgaGVpZ2h0PSIxNDIiIHJ4PSI4IiBmaWxsPSIjZWRmMmY4IiBzdHJva2U9IiNkNWUwZGEiIHN0cm9rZS13aWR0aD0iMS40Ii8+PHRleHQgeD0iNDAiIHk9IjE1NCIgZm9udC1zaXplPSIyMSIgZmlsbD0iIzI0NmE1NSIgZm9udC13ZWlnaHQ9IjYwMCI+5a6i5oi35aGr5YaZ5oql5L+u6KGoPC90ZXh0PjxwYXRoIGQ9Ik00MCAxNzYgSDMyMCIgc3Ryb2tlPSIjZDVlMGRhIiBzdHJva2Utd2lkdGg9IjIiIGZpbGw9Im5vbmUiLz48dGV4dCB4PSI0MCIgeT0iMjA4IiBmb250LXNpemU9IjIwIiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNDA dy>\u003ctr>\n\u003ctd>自建还是购买\u003c/td>\n\u003ctd>标准产品覆盖程度、专属差异、可集成性\u003c/td>\n\u003ctd>避免为通用功能承担长期开发负担\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>原型是否继续\u003c/td>\n\u003ctd>实际任务能否完成，用户是否需要\u003c/td>\n\u003ctd>防止因为已经做出界面而继续投入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>谁负责运行\u003c/td>\n\u003ctd>账号、配置、源文件、部署与问题响应\u003c/td>\n\u003ctd>决定企业能否独立使用与交接\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>怎样修改\u003c/td>\n\u003ctd>规则归属、版本、受影响流程与验证\u003c/td>\n\u003ctd>防止局部修复破坏其他工作\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>验证可以沿软件的实际使用展开：能否启动，业务规则是否正确，真实接口能否读写，角色能否访问相应记录，异常后怎样接续。程序测试提供基础检查，实际岗位的任务操作补上专业标准和接手体验。\u003c/p>\n\u003cp>这里的“部署”，是把程序放到实际使用的电脑或服务器上，并设置好账号、连接地址等运行条件；这些设置通常称为“配置”。可继续修改的程序文件称为“源文件”或“源代码”。如果企业希望以后自行调整工具，交接就需要同时考虑这些文件、运行条件和相应使用权。\u003c/p>\n\u003ch2>用原任务确认修改的效果\u003c/h2>\n\u003cp>软件问题可能来自程序、配置、平台权限或业务规则。先把失败过程重现出来，再沿输入和操作查原因，可以避免反复修改无关部分。比如申请保存失败，可能是必填字段缺少，也可能是账号没有写入权限，两者需要不同处理。\u003c/p>\n\u003cp>修改后，用相同角色在实际环境重做原任务，再看接收方能否继续。技术人员据此说明原因、改动和结果，业务人员确认工作是否恢复。这个办法也适用于AI参与开发的软件：每次修改都回到它要服务的任务。\u003c/p>\n\u003ch2>企业应拥有怎样的交接条件\u003c/h2>\n\u003cp>采购定制软件或采用 AI 生成工具时，要明确企业能够取得什么：使用权、业务数据、必要的源文件、运行配置说明、管理账号和后续维护安排。不同合作形式可以不同，关键在于与企业希望承担的责任一致。\u003c/p>\n\u003cp>内部接手者可以独立完成日常任务和一次常见异常处理，检查交接是否足够。若选择由服务方长期维护，则明确双方响应、改动和费用安排。企业可以购买持续服务，也可以建设自有运行能力，选择取决于内部资源与长期使用方式。\u003c/p>\n\u003cp>AI 编程的长期价值，可能是使软件更贴近工作变化。要实现这一点，企业需要把需求定义、业务验证和运行责任同时建立起来。实现越容易，越应该把注意力放在究竟值得实现什么。\u003c/p>\n\u003cp>\u003ca id=\"do-10\">\u003c/a>\u003c/p>\n\u003ch2>把一个小工具需求交给实施者，并验收一笔任务\u003c/h2>\n\u003cp>从原来使用的表格或聊天中选一项工作，例如“报修提交后加入对应维修团队的待办”。在\u003ca href=\"#download\" data-download=\"03-试点范围与任务说明.docx\">试点范围与任务说明\u003c/a>写清：由谁发起、填哪些值、保存到哪里、按什么规则分派、谁接手，以及需要保留的编号和状态。\u003c/p>\n\u003cp>请实施者先说明哪些可以直接利用现有系统，哪些需要新程序或连接。第一次查看版本时，自己扮演发起者填一笔示例，再由维修团队的人打开待办，核对客户、设备和内容，确认接手。\u003c/p>\n\u003cp>接着重试一笔缺设备信息的申请和一次重复提交。看缺项能否提示、重复如何处理、最终留下几条记录。将实际结果与约定逐项写入\u003ca href=\"#download\" data-download=\"05-试用与验收记录.docx\">试用与验收记录\u003c/a>。只有界面能填而接手方找不到记录，就把“保存与接手”列为当前未完成项，要求修复这条路径后再检查。\u003c/p>\n\u003cp>这样你参与的是业务定义与实际验收，技术实现由有相应能力的人负责。后续是否继续自建或购买，再比较实际使用、维护条件与完整成本。\u003c/p>\n","text":"# 第10章｜AI编程怎样改变企业软件供给\n\n**AI 编程使更多细小、专属的工作值得被做成软件。企业要重新计算的是实现、集成和持续运行的总成本，而不只是写代码的价格。**\n\n[本章做法：把一个小工具需求交给实施者，并验收一笔任务](#do-10)\n\n许多企业工作长期停留在表格、聊天和手工搬运中，并非完全不值得改进，而是原先的软件建设成本太高。为一项小流程写需求、安排开发、把相连的系统放在一起试运行，再持续维护，可能比它短期节省的人工还贵。AI 能帮助写程序、理解既有代码、生成界面和修复部分问题，从而改变其中一些成本。\n\n这为小工具、内部工作台、系统连接和快速试验创造了机会。完整建设仍包括需求、集成、验证和运行，AI编程降低其中的实现成本，也让团队更早做出可操作版本来讨论其他条件。\n\n## 从一句要求到可运行功能，中间发生什么\n\n把一台家电送到维修店，前台通常先登记联系方式、设备和故障，再把维修单交给相应师傅。你手里的受理凭条与师傅手里的维修单对应同一件东西；日后查询时，双方才知道在谈哪次维修。企业售后软件要完成的也是这样的交接。\n\n假定一家服务企业希望客户填写申请后，自动交给对应区域的维修团队。开发者可以让 AI 协助生成表单、保存申请的程序和分配规则。客户点击提交后，程序把内容存入售后系统，取得申请编号，再按区域规则把记录加入相应团队的待办列表。维修人员打开待办，看到联系方式、设备和问题，确认接手后更新状态。\n\n完整功能还需要确认申请保存位置、客户与设备标识、当前人员和区域规则、通知渠道、重复提交处理，以及团队怎样接收和变更状态。AI 编程可以协助实现这些连接，但前提是所需系统确实提供接口或其他可用操作，且企业具备相应权限。\n\n开发者可以先用模拟数据验证界面与步骤，再连接实际记录。业务负责人参与时，可以先判断操作是否符合工作习惯，接通后再查看真实创建的申请和接收团队的入口。两次查看解决不同问题，能够让修改发生得更早。\n\n![客户填写报修，系统保存编号并按区域加入维修待办，维修人员打开同一申请后更新接手状态，客户能够查询进展。](assets/10.svg)\n\n## 哪些工作因此更值得尝试\n\n一种机会是填补标准软件之间的缝隙。例如，把已批准的服务要求转换为下游系统所需格式，或在提交前检查缺项。另一种是把企业独有的判断步骤变成可执行工具，如根据设备条件和已批准规则检查服务范围。还有一种是快速检验新服务：先用有限功能验证用户是否需要，再决定是否扩大建设。\n\n小范围实现可以先围绕稳定业务对象建设，例如客户、申请和处理状态。以现有软件为基础补上必要连接，能够缩短实现路径。多个场景逐渐使用同一能力后，再比较统一维护的收益。\n\nAI 也能帮助企业理解原有软件：查找某条规则写在哪里、解释错误可能来自哪个环节、评估改动影响。结果仍须结合真实环境验证，尤其是历史代码、文档与线上行为不一致时。\n\n## 写得快，会怎样改变风险\n\n代码更容易生成，企业也更容易同时拥有许多无人维护的小应用。功能之间可能复制不同规则，权限配置各不相同，业务负责人不知道哪个版本在运行。建设成本下降后，管理这些软件的成本反而更值得重视。\n\n| 决定 | 需要核对的内容 | 对经营的影响 |\n| --- | --- | --- |\n| 自建还是购买 | 标准产品覆盖程度、专属差异、可集成性 | 避免为通用功能承担长期开发负担 |\n| 原型是否继续 | 实际任务能否完成，用户是否需要 | 防止因为已经做出界面而继续投入 |\n| 谁负责运行 | 账号、配置、源文件、部署与问题响应 | 决定企业能否独立使用与交接 |\n| 怎样修改 | 规则归属、版本、受影响流程与验证 | 防止局部修复破坏其他工作 |\n\n验证可以沿软件的实际使用展开：能否启动，业务规则是否正确，真实接口能否读写，角色能否访问相应记录，异常后怎样接续。程序测试提供基础检查，实际岗位的任务操作补上专业标准和接手体验。\n\n这里的“部署”，是把程序放到实际使用的电脑或服务器上，并设置好账号、连接地址等运行条件；这些设置通常称为“配置”。可继续修改的程序文件称为“源文件”或“源代码”。如果企业希望以后自行调整工具，交接就需要同时考虑这些文件、运行条件和相应使用权。\n\n## 用原任务确认修改的效果\n\n软件问题可能来自程序、配置、平台权限或业务规则。先把失败过程重现出来，再沿输入和操作查原因，可以避免反复修改无关部分。比如申请保存失败，可能是必填字段缺少，也可能是账号没有写入权限，两者需要不同处理。\n\n修改后，用相同角色在实际环境重做原任务，再看接收方能否继续。技术人员据此说明原因、改动和结果，业务人员确认工作是否恢复。这个办法也适用于AI参与开发的软件：每次修改都回到它要服务的任务。\n\n## 企业应拥有怎样的交接条件\n\n采购定制软件或采用 AI 生成工具时，要明确企业能够取得什么：使用权、业务数据、必要的源文件、运行配置说明、管理账号和后续维护安排。不同合作形式可以不同，关键在于与企业希望承担的责任一致。\n\n内部接手者可以独立完成日常任务和一次常见异常处理，检查交接是否足够。若选择由服务方长期维护，则明确双方响应、改动和费用安排。企业可以购买持续服务，也可以建设自有运行能力，选择取决于内部资源与长期使用方式。\n\nAI 编程的长期价值，可能是使软件更贴近工作变化。要实现这一点，企业需要把需求定义、业务验证和运行责任同时建立起来。实现越容易，越应该把注意力放在究竟值得实现什么。\n\n\n\u003ca id=\"do-10\">\u003c/a>\n\n## 把一个小工具需求交给实施者，并验收一笔任务\n\n从原来使用的表格或聊天中选一项工作，例如“报修提交后加入对应维修团队的待办”。在[试点范围与任务说明](toolkit/03-试点范围与任务说明.docx)写清：由谁发起、填哪些值、保存到哪里、按什么规则分派、谁接手，以及需要保留的编号和状态。\n\n请实施者先说明哪些可以直接利用现有系统，哪些需要新程序或连接。第一次查看版本时，自己扮演发起者填一笔示例，再由维修团队的人打开待办，核对客户、设备和内容，确认接手。\n\n接着重试一笔缺设备信息的申请和一次重复提交。看缺项能否提示、重复如何处理、最终留下几条记录。将实际结果与约定逐项写入[试用与验收记录](toolkit/05-试用与验收记录.docx)。只有界面能填而接手方找不到记录，就把“保存与接手”列为当前未完成项，要求修复这条路径后再检查。\n\n这样你参与的是业务定义与实际验收，技术实现由有相应能力的人负责。后续是否继续自建或购买，再比较实际使用、维护条件与完整成本。\n"},{"id":"c11","file":"11-上下文是AI工作的现场条件.md","title":"第11章｜上下文是AI工作的现场条件","html":"\u003ch1>第11章｜上下文是AI工作的现场条件\u003c/h1>\n\u003cp>\u003cstrong>上下文是AI在当前任务中可以使用的信息。把目标、事实、方法和工具结果及时组织给模型，是让通用能力适应企业工作的直接办法。\u003c/strong>\u003c/p>\n\u003cp>\u003ca href=\"#c11/do-11\">本章做法：给AI准备一份当前任务资料包\u003c/a>\u003c/p>\n\u003cp>上下文可以包含指令、对话、文档片段、工具说明和工具返回结果。应用负责把企业保存的信息取出来，按当前任务需要送入模型。企业保存资料的地方，与模型这次实际看到的内容，是通过这段供给过程联系起来的。\u003c/p>\n\u003cp>因此，设计AI工作时要关注两个问题：当前决定需要哪些信息，应用怎样取得并组织它们。这项安排常被称为上下文工程。它既影响质量，也影响响应时间和每次运行成本。\u003c/p>\n\u003ch2>一项工作需要怎样的现场资料\u003c/h2>\n\u003cp>出门办事前，会按当天任务把证件、地址和预约记录放进随身包里。家里保存着很多资料，但真正到柜台前能用的是带来的那一份；预约改了，包里的旧确认单也要换。可以借这个熟悉的过程理解“上下文”：企业存有很多信息，应用要把当前任务需要的那部分取出来，交给模型。\u003c/p>\n\u003cp>例如销售已替客户拟好两套设备的方案，客户随后发来“改成三套，安装还是等通知”。销售希望 AI 帮忙更新需求，而不是重新猜客户是谁。应用先按当前订单取得原需求，加入这条变更消息，再取得是否已备货、安装日期是否已确认等记录。模型这次收到的材料，就能支持它指出“数量改为三套，安装仍未定”，并列出数量变化影响的计算与确认。\u003c/p>\n\u003cp>销售核对后，应用把新数量保存到这笔订单的当前需求中，后续计算读取三套。原消息与旧版本保留作查证。若客户只说“按新的来”，却找不到此前讨论的新方案，应用应把相关对话取回，或让销售追问明确指哪一版，再继续修改。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"11\">\u003cpicture>\u003csource media=\"screen and (m uehruiupOeahOaWsOiusOW9leOAgjwvdGV4dD48L2c+PC9zdmc+\" alt=\"原订单两套、客户改为三套的消息和当前安装状态一起进入本次任务；核对后更新需求，后续计算读取新数量。\">\u003c/picture>\u003cfigcaption>\u003cspan>图 11-1\u003c/span>\u003cbutton type=\"button\" class=\"enlarge\" aria-label=\"放大查看图11-1\">放大查看\u003c/button>\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>信息\u003c/th>\n\u003cth>应回答的问题\u003c/th>\n\u003cth>缺失后的影响\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>目标与完成条件\u003c/td>\n\u003ctd>当前要交出什么，怎样算完成\u003c/td>\n\u003ctd>模型可能只写建议，没有推进实际任务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>当前事实\u003c/td>\n\u003ctd>对象、版本和状态是什么\u003c/td>\n\u003ctd>可能对已完成动作重复操作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>适用规则\u003c/td>\n\u003ctd>哪些约束生效，例外谁决定\u003c/td>\n\u003ctd>可能把一般惯例当企业政策\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可用工具与权限\u003c/td>\n\u003ctd>可以查什么、做什么\u003c/td>\n\u003ctd>可能提出当前系统无法执行的动作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已作决定与缺口\u003c/td>\n\u003ctd>什么已经确认，什么仍未知\u003c/td>\n\u003ctd>可能推翻已确认条件或补造答案\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>这份资料不必每次由员工手写。系统可以从业务记录、知识检索和任务状态中取得，但要明确各类信息的权威位置与更新时间。\u003c/p>\n\u003ch2>为什么资料越多不一定越好\u003c/h2>\n\u003cp>输入容量有限。即使产品支持很长的输入，模型也未必能够同等有效地使用所有内容。多份相似文件、历史讨论和未生效建议一起进入，会增加找错规则或混淆状态的机会，还会带来成本与延迟。\u003c/p>\n\u003cp>可以把信息分为稳定说明、当前任务资料和按需查询资料。稳定说明保持简洁；当前任务只保留影响本次决定的事实；大体量文件和历史记录按需要取回。工作到了报价环节才查询对应价目，到了安排环节才查询资源，不必一开始塞入所有资料。\u003c/p>\n\u003cp>工作变化后，相应上下文及时更新。客户改变数量，应用提供当前采用值，同时保留原始变更记录供追查。后续计算就能沿新条件继续。\u003c/p>\n\u003ch2>长任务中的压缩与恢复\u003c/h2>\n\u003cp>任务进行很久后，系统可能压缩对话，保留目标、决定、已完成动作和下一步。压缩可以使工作继续，但摘要也可能丢掉决定成立的条件。\u003c/p>\n\u003cp>例如，原决定是“仅对已确认标准型号自动形成草稿”，摘要若写成“自动形成报价”，就扩大了范围。因此，交接记录不能只记结论，还应记适用范围、关键依据、未决项及原记录位置。涉及外部动作时，还要保留实际执行状态，避免把“准备提交”压缩成“已提交”。\u003c/p>\n\u003cp>恢复任务时，应用从保存的任务记录读取当前状态，核对外部动作后再组织下一轮输入。模型据此知道从哪里继续；业务记录则保存已经发生的事实，供不同人员和多次运行共同使用。\u003c/p>\n\u003ch2>怎样改善一次不合用的回答\u003c/h2>\n\u003cp>可以沿着信息路径检查：模型收到的任务是否明确；关键资料是否真的进入；版本是否适用；事实与建议是否区分；工具结果是否完整。只有这些条件基本成立后，才更有根据地比较模型能力或修改推理方法。\u003c/p>\n\u003cp>如果价格错了，可能是没拿到价目表，也可能拿到了旧表，或表中条件难以匹配。这三种原因分别需要补供给、改版本筛选、改结构和核对方法。统一用“提示词写清楚一点”处理，往往无法稳定解决。\u003c/p>\n\u003cp>企业应积累任务所需的信息结构，而不只是保存成功对话。一套能让不同员工、不同运行都取得正确资料的安排，比某个人的一段优秀提示词更接近组织能力。\u003c/p>\n\u003cp>\u003ca id=\"do-11\">\u003c/a>\u003c/p>\n\u003ch2>给AI准备一份当前任务资料包\u003c/h2>\n\u003cp>拿一笔正在整理的需求，先在\u003ca href=\"#download\" data-download=\"03-试点范围与任务说明.docx\">试点范围与任务说明\u003c/a>写当前目标，再分开放入三组材料：原来采用的记录、最新变更、需要遵守的方法或规则。\u003c/p>\n\u003cp>用本章例子时可以这样提交：\u003c/p>\n\u003cdiv class=\"copy-block\">\u003cdiv class=\"copy-tools\">\u003cbutton type=\"button\" class=\"copy-text\">复制内容\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-text\">目标：更新本次需求，交销售核对，不直接发送客户。\n原记录：A型两套，安装日期未定。\n新消息：改成三套，安装还是等通知。\n处理要求：分开当前采用值、变化、仍待确认事项；引用相应材料。\n请先给更新对照表，再列出后续需要重算或确认的内容。\n\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>核对“当前数量三套、安装未定”是否出现，以及是否保留了本次目标。销售确认后，再保存当前记录，供后续计算使用。\u003c/p>\n\u003cp>若下一次回答仍用旧数量，不要只加一句“认真一点”。先查这轮实际输入中是否还把两套当作当前值、最新消息有没有提供。手工试做时重新发清楚的资料包；需要团队持续使用时，再请实施者将同样的信息取得过程接到应用中。\u003c/p>\n","text":"# 第11章｜上下文是AI工作的现场条件\n\n**上下文是AI在当前任务中可以使用的信息。把目标、事实、方法和工具结果及时组织给模型，是让通用能力适应企业工作的直接办法。**\n\n[本章做法：给AI准备一份当前任务资料包](#do-11)\n\n上下文可以包含指令、对话、文档片段、工具说明和工具返回结果。应用负责把企业保存的信息取出来，按当前任务需要送入模型。企业保存资料的地方，与模型这次实际看到的内容，是通过这段供给过程联系起来的。\n\n因此，设计AI工作时要关注两个问题：当前决定需要哪些信息，应用怎样取得并组织它们。这项安排常被称为上下文工程。它既影响质量，也影响响应时间和每次运行成本。\n\n## 一项工作需要怎样的现场资料\n\n出门办事前，会按当天任务把证件、地址和预约记录放进随身包里。家里保存着很多资料，但真正到柜台前能用的是带来的那一份；预约改了，包里的旧确认单也要换。可以借这个熟悉的过程理解“上下文”：企业存有很多信息，应用要把当前任务需要的那部分取出来，交给模型。\n\n例如销售已替客户拟好两套设备的方案，客户随后发来“改成三套，安装还是等通知”。销售希望 AI 帮忙更新需求，而不是重新猜客户是谁。应用先按当前订单取得原需求，加入这条变更消息，再取得是否已备货、安装日期是否已确认等记录。模型这次收到的材料，就能支持它指出“数量改为三套，安装仍未定”，并列出数量变化影响的计算与确认。\n\n销售核对后，应用把新数量保存到这笔订单的当前需求中，后续计算读取三套。原消息与旧版本保留作查证。若客户只说“按新的来”，却找不到此前讨论的新方案，应用应把相关对话取回，或让销售追问明确指哪一版，再继续修改。\n\n![原订单两套、客户改为三套的消息和当前安装状态一起进入本次任务；核对后更新需求，后续计算读取新数量。](assets/11.svg)\n\n| 信息 | 应回答的问题 | 缺失后的影响 |\n| --- | --- | --- |\n| 目标与完成条件 | 当前要交出什么，怎样算完成 | 模型可能只写建议，没有推进实际任务 |\n| 当前事实 | 对象、版本和状态是什么 | 可能对已完成动作重复操作 |\n| 适用规则 | 哪些约束生效，例外谁决定 | 可能把一般惯例当企业政策 |\n| 可用工具与权限 | 可以查什么、做什么 | 可能提出当前系统无法执行的动作 |\n| 已作决定与缺口 | 什么已经确认，什么仍未知 | 可能推翻已确认条件或补造答案 |\n\n这份资料不必每次由员工手写。系统可以从业务记录、知识检索和任务状态中取得，但要明确各类信息的权威位置与更新时间。\n\n## 为什么资料越多不一定越好\n\n输入容量有限。即使产品支持很长的输入，模型也未必能够同等有效地使用所有内容。多份相似文件、历史讨论和未生效建议一起进入，会增加找错规则或混淆状态的机会，还会带来成本与延迟。\n\n可以把信息分为稳定说明、当前任务资料和按需查询资料。稳定说明保持简洁；当前任务只保留影响本次决定的事实；大体量文件和历史记录按需要取回。工作到了报价环节才查询对应价目，到了安排环节才查询资源，不必一开始塞入所有资料。\n\n工作变化后，相应上下文及时更新。客户改变数量，应用提供当前采用值，同时保留原始变更记录供追查。后续计算就能沿新条件继续。\n\n## 长任务中的压缩与恢复\n\n任务进行很久后，系统可能压缩对话，保留目标、决定、已完成动作和下一步。压缩可以使工作继续，但摘要也可能丢掉决定成立的条件。\n\n例如，原决定是“仅对已确认标准型号自动形成草稿”，摘要若写成“自动形成报价”，就扩大了范围。因此，交接记录不能只记结论，还应记适用范围、关键依据、未决项及原记录位置。涉及外部动作时，还要保留实际执行状态，避免把“准备提交”压缩成“已提交”。\n\n恢复任务时，应用从保存的任务记录读取当前状态，核对外部动作后再组织下一轮输入。模型据此知道从哪里继续；业务记录则保存已经发生的事实，供不同人员和多次运行共同使用。\n\n## 怎样改善一次不合用的回答\n\n可以沿着信息路径检查：模型收到的任务是否明确；关键资料是否真的进入；版本是否适用；事实与建议是否区分；工具结果是否完整。只有这些条件基本成立后，才更有根据地比较模型能力或修改推理方法。\n\n如果价格错了，可能是没拿到价目表，也可能拿到了旧表，或表中条件难以匹配。这三种原因分别需要补供给、改版本筛选、改结构和核对方法。统一用“提示词写清楚一点”处理，往往无法稳定解决。\n\n企业应积累任务所需的信息结构，而不只是保存成功对话。一套能让不同员工、不同运行都取得正确资料的安排，比某个人的一段优秀提示词更接近组织能力。\n\n\n\u003ca id=\"do-11\">\u003c/a>\n\n## 给AI准备一份当前任务资料包\n\n拿一笔正在整理的需求，先在[试点范围与任务说明](toolkit/03-试点范围与任务说明.docx)写当前目标，再分开放入三组材料：原来采用的记录、最新变更、需要遵守的方法或规则。\n\n用本章例子时可以这样提交：\n\n```text\n目标：更新本次需求，交销售核对，不直接发送客户。\n原记录：A型两套，安装日期未定。\n新消息：改成三套，安装还是等通知。\n处理要求：分开当前采用值、变化、仍待确认事项；引用相应材料。\n请先给更新对照表，再列出后续需要重算或确认的内容。\n```\n\n核对“当前数量三套、安装未定”是否出现，以及是否保留了本次目标。销售确认后，再保存当前记录，供后续计算使用。\n\n若下一次回答仍用旧数量，不要只加一句“认真一点”。先查这轮实际输入中是否还把两套当作当前值、最新消息有没有提供。手工试做时重新发清楚的资料包；需要团队持续使用时，再请实施者将同样的信息取得过程接到应用中。\n"},{"id":"c12","file":"12-知识库RAG与业务数据怎样配合.md","title":"第12章｜知识库、RAG与业务数据怎样配合","html":"\u003ch1>第12章｜知识库、RAG与业务数据怎样配合\u003c/h1>\n\u003cp>\u003cstrong>知识库让稳定知识得到积累，RAG让相关知识在需要时进入模型，业务系统查询提供当前事实。三者配合，AI才能既按企业的方法工作，又跟上正在发生的业务。\u003c/strong>\u003c/p>\n\u003cp>\u003ca href=\"#c12/do-12\">本章做法：先做一份小知识包，再决定怎样自动检索\u003c/a>\u003c/p>\n\u003cp>企业常希望“把所有资料交给 AI，让它懂公司”。这里至少包含三个不同目标：了解稳定知识，查询当前状态，以及遵循企业的工作方法。它们需要的技术和维护方式不同。\u003c/p>\n\u003cp>知识库通常保存制度、产品说明、操作经验和参考材料。RAG 是“检索增强生成”：先找出相关资料，再把这些资料交给模型用于回答或任务。业务数据查询则从订单、库存、客户等系统取得当前记录。训练或微调模型会改变参数，通常不适合作为每日更新业务事实的首选方式。\u003c/p>\n\u003ch2>检索究竟怎样工作\u003c/h2>\n\u003cp>在第一次查询之前，企业要先准备可查的资料。规则负责人选出正式服务手册，标明适用型号、地区和生效日期；实施者把文档按内容整理成可查的段落，保存每段来自哪份文件、哪一页。系统再建立便于查找的记录，这些查找记录称为“索引”。规则更新后，负责人替换有效版本，相关索引也要更新。\u003c/p>\n\u003cp>先看生活中的一种查资料过程。准备照菜谱做晚饭，菜谱说明怎样做，冰箱里的食材决定今天能做多少。查到了菜谱，还要打开冰箱看看当前有什么。企业服务也有两类信息：服务手册写适用条件，排班系统记录今天还能安排谁。\u003c/p>\n\u003cp>假设客服接到“这台设备坏了，明天能不能上门”的消息。应用先根据客户记录确定设备型号和服务地区，再到企业知识库查该型号的服务规则。用户说“坏了找谁”，文档标题却是“售后服务申请”，系统仍可能找到相关段落：除了按字词查找，还可以把文字转换成数值表示，比较含义接近的内容。这种表示常叫向量或 Embedding，对应的查找方式叫语义检索。\u003c/p>\n\u003cp>找到候选段落以后，应用把适用的规则原文与本次问题一同交给模型。模型根据这些材料说明能提供什么服务。这个“先找资料，再带着资料回答”的过程，就是 RAG。\u003c/p>\n\u003cp>检索通常还要利用产品、地区、客户类型、生效日期和权限等信息筛选候选。例如两个产品都有“售后更换”，当前任务先确定产品，再选择有效规则。含义匹配帮助找到资料，条件筛选帮助选对资料。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"12\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iMTA0MSIgdmlld0JveD0iMCAwIDM2MCAxMDQxIiByb2xlPSJpbWciPjx0aXRsZT7op4TliJnkuI7mjpLnj63vvIzliIbliKvmn6XmuIXmpZo8L3RpdGxlPjxkZXNjPuacjeWKoeinhOWImeWSjOW9k+WJjeaOkuePreWIhuWIq+afpeivou+8jOWuouacjeW9ouaIkOWuieaOku+8jOWuouaIt+ehruiupOWQjuaPkOS6pOmihOe6puW5tuWPluW+l+e7k+aenOOAgjwvZGVzYz48ZGVmcz48bWFya2VyIGlkPSJhIiBtYXJrZXJXaWR0aD0iOCIgbWFya2VySGVpZ2h0PSI4IiByZWZYPSI3IiByZWZZPSI0IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDAgTDggNCBMMCA4IFoiIGZpbGw9IiMyNDZhNTUiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjM2MCIgaGVpZ2h0PSIxMDQxIiBmaWxsPSJ3aGl0ZSIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiI+PHRleHQgeD0iMjQiIHk9IjM4IiBmb250LXNpemU9IjI0IiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNjAwIj7op4TliJnkuI7mjpLnj63vvIzliIbliKvmn6XmuIXmpZo8L3RleHQ+PHRleHQgeD0iMjQiIHk9IjcxIiBmb250LXNpemU9IjE4IiBmaWxsPSIjNjE3MTZiIiBmb250LXdlaWdodD0iNDAwIj7lrqLmiLfpl67vvJrigJzov5nlj7Dorr7lpIfmmI7lpKnog73kuIrpl6jlkJfvvJ/igJ08L3Rl \u003ctd>当前可用资源\u003c/td>\n\u003ctd>排班或库存等权威记录\u003c/td>\n\u003ctd>资源管理人员\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已作承诺及变更\u003c/td>\n\u003ctd>绑定业务对象的正式记录\u003c/td>\n\u003ctd>作出决定与执行的责任人\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>每天上传一份当时的排班副本，适合只需要了解近期安排的任务；需要当场预约，则应查询当前可用时段，并在预约提交时检查时段是否仍空闲。实时性要求由业务动作决定，也决定连接应该做到哪一步。\u003c/p>\n\u003ch2>知识库失败时，怎样定位原因\u003c/h2>\n\u003cp>一个错误回答可能来自四处：资料本身错或缺；检索没有找到适用材料；取回片段缺少关键条件；模型没有正确利用已提供材料。分别检查原文、检索结果和最终输入，才知道该改哪一层。\u003c/p>\n\u003cp>按这四处逐一查看，就能选择改进办法：补写缺少的规则；调整索引和筛选；连同前后条件取回完整片段；或改善任务拆分与模型配置。诊断从一条具体回答展开，改进才有明确位置。\u003c/p>\n\u003cp>维护也不应只靠“员工发现错误再说”。对经常影响承诺的知识，指定负责人定期检查；变更发生时，确认相关入口、暂存的资料副本和工作方法是否同步更新。知识库是企业运行资产，需要持续治理。\u003c/p>\n\u003ch2>企业何时才值得讨论训练\u003c/h2>\n\u003cp>当企业拥有质量足够、具有代表性的任务样例，希望稳定某种格式、风格或专门行为时，可以评估微调等方式。但应先确认问题不是资料供给、检索或流程设计造成的，并比较维护与验证成本。\u003c/p>\n\u003cp>稳定行为可以通过训练改善，频繁变化的规则和业务状态则通过资料与系统持续供给。企业据此把更新放到合适的位置，既保持工作方法，又能及时适应变化。\u003c/p>\n\u003cp>\u003ca id=\"do-12\">\u003c/a>\u003c/p>\n\u003ch2>先做一份小知识包，再决定怎样自动检索\u003c/h2>\n\u003cp>先选一类高频问题，找出当前正式规则，写明适用范围与负责人。可以先用下面的虚构规则测试资料是否足以回答：\u003c/p>\n\u003cdiv class=\"copy-block\">\u003cdiv class=\"copy-tools\">\u003cbutton type=\"button\" class=\"copy-text\">复制内容\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-text\">规则R1，当前有效：A型设备在本市可申请上门服务；具体时间须查排班并完成预约。\n规则R2，已停用：A型设备只支持到店服务。\n客户问题：我的A型设备坏了，明天能上门吗？\n请按当前有效规则回答，列出适用依据与下一步需查的信息。\n\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>核对回答应采用R1，说明可申请上门，但明天是否有时段仍需查排班，不能当场编出预约结果。若用了R2，先改版本标记与选取；若直接答“明天可以”，就把需要查询和预约的步骤补回任务要求。\u003c/p>\n\u003cp>这次手工提供资料，是先检查规则能否支持当前问题。接着将一小组正式资料交实施者，按本章的建库方法保存范围、日期、原文位置和负责人，再用同一批问题查询，查看实际取回哪些段落。只有手工供给材料可用、自动查询也能取对，才逐步增加资料范围。\u003c/p>\n","text":"# 第12章｜知识库、RAG与业务数据怎样配合\n\n**知识库让稳定知识得到积累，RAG让相关知识在需要时进入模型，业务系统查询提供当前事实。三者配合，AI才能既按企业的方法工作，又跟上正在发生的业务。**\n\n[本章做法：先做一份小知识包，再决定怎样自动检索](#do-12)\n\n企业常希望“把所有资料交给 AI，让它懂公司”。这里至少包含三个不同目标：了解稳定知识，查询当前状态，以及遵循企业的工作方法。它们需要的技术和维护方式不同。\n\n知识库通常保存制度、产品说明、操作经验和参考材料。RAG 是“检索增强生成”：先找出相关资料，再把这些资料交给模型用于回答或任务。业务数据查询则从订单、库存、客户等系统取得当前记录。训练或微调模型会改变参数，通常不适合作为每日更新业务事实的首选方式。\n\n## 检索究竟怎样工作\n\n在第一次查询之前，企业要先准备可查的资料。规则负责人选出正式服务手册，标明适用型号、地区和生效日期；实施者把文档按内容整理成可查的段落，保存每段来自哪份文件、哪一页。系统再建立便于查找的记录，这些查找记录称为“索引”。规则更新后，负责人替换有效版本，相关索引也要更新。\n\n先看生活中的一种查资料过程。准备照菜谱做晚饭，菜谱说明怎样做，冰箱里的食材决定今天能做多少。查到了菜谱，还要打开冰箱看看当前有什么。企业服务也有两类信息：服务手册写适用条件，排班系统记录今天还能安排谁。\n\n假设客服接到“这台设备坏了，明天能不能上门”的消息。应用先根据客户记录确定设备型号和服务地区，再到企业知识库查该型号的服务规则。用户说“坏了找谁”，文档标题却是“售后服务申请”，系统仍可能找到相关段落：除了按字词查找，还可以把文字转换成数值表示，比较含义接近的内容。这种表示常叫向量或 Embedding，对应的查找方式叫语义检索。\n\n找到候选段落以后，应用把适用的规则原文与本次问题一同交给模型。模型根据这些材料说明能提供什么服务。这个“先找资料，再带着资料回答”的过程，就是 RAG。\n\n检索通常还要利用产品、地区、客户类型、生效日期和权限等信息筛选候选。例如两个产品都有“售后更换”，当前任务先确定产品，再选择有效规则。含义匹配帮助找到资料，条件筛选帮助选对资料。\n\n![客户询问明日上门，知识库提供该型号服务条件，排班系统提供当前时段；客服据两类信息形成答复，确认后再提交预约。](assets/12.svg)\n\n## 一份制度为什么需要比正文更多的信息\n\n假定企业调整了某项服务规则。旧版仍在历史文件夹，新版已经生效，另有一份培训演示稿使用简化说法。如果只按文字相似程度检索，三份都有可能进入回答。\n\n规则负责人维护有效版本、生效范围和替代关系。应用查询时优先使用符合当前任务的正式版本，历史文件留给追溯。多个有效规则出现冲突，就把冲突内容交负责人处理，再更新共用入口。\n\n拆分长文档也要保留关系。某条优惠条件在前文，排除条件在后文；若只把前半段取给模型，答案可能扩大承诺。分块和索引的设计应考虑完整规则，而不只是让每块长度均匀。\n\n## 知识与当前事实怎样接力\n\n客户问能否安排下周服务，知识库可以提供服务范围和安排规则，但下周人员是否有空需要查排班；客户是否具备服务资格需要查相应记录；最终是否占用时段还需要执行预约。\n\n| 所需信息 | 更合适的取得方式 | 维护责任 |\n| --- | --- | --- |\n| 服务适用条件 | 有版本的知识资料 | 业务规则负责人 |\n| 当前客户和订单状态 | 业务系统查询 | 相应系统与数据负责人 |\n| 当前可用资源 | 排班或库存等权威记录 | 资源管理人员 |\n| 已作承诺及变更 | 绑定业务对象的正式记录 | 作出决定与执行的责任人 |\n\n每天上传一份当时的排班副本，适合只需要了解近期安排的任务；需要当场预约，则应查询当前可用时段，并在预约提交时检查时段是否仍空闲。实时性要求由业务动作决定，也决定连接应该做到哪一步。\n\n## 知识库失败时，怎样定位原因\n\n一个错误回答可能来自四处：资料本身错或缺；检索没有找到适用材料；取回片段缺少关键条件；模型没有正确利用已提供材料。分别检查原文、检索结果和最终输入，才知道该改哪一层。\n\n按这四处逐一查看，就能选择改进办法：补写缺少的规则；调整索引和筛选；连同前后条件取回完整片段；或改善任务拆分与模型配置。诊断从一条具体回答展开，改进才有明确位置。\n\n维护也不应只靠“员工发现错误再说”。对经常影响承诺的知识，指定负责人定期检查；变更发生时，确认相关入口、暂存的资料副本和工作方法是否同步更新。知识库是企业运行资产，需要持续治理。\n\n## 企业何时才值得讨论训练\n\n当企业拥有质量足够、具有代表性的任务样例，希望稳定某种格式、风格或专门行为时，可以评估微调等方式。但应先确认问题不是资料供给、检索或流程设计造成的，并比较维护与验证成本。\n\n稳定行为可以通过训练改善，频繁变化的规则和业务状态则通过资料与系统持续供给。企业据此把更新放到合适的位置，既保持工作方法，又能及时适应变化。\n\n\u003ca id=\"do-12\">\u003c/a>\n\n## 先做一份小知识包，再决定怎样自动检索\n\n先选一类高频问题，找出当前正式规则，写明适用范围与负责人。可以先用下面的虚构规则测试资料是否足以回答：\n\n```text\n规则R1，当前有效：A型设备在本市可申请上门服务；具体时间须查排班并完成预约。\n规则R2，已停用：A型设备只支持到店服务。\n客户问题：我的A型设备坏了，明天能上门吗？\n请按当前有效规则回答，列出适用依据与下一步需查的信息。\n```\n\n核对回答应采用R1，说明可申请上门，但明天是否有时段仍需查排班，不能当场编出预约结果。若用了R2，先改版本标记与选取；若直接答“明天可以”，就把需要查询和预约的步骤补回任务要求。\n\n这次手工提供资料，是先检查规则能否支持当前问题。接着将一小组正式资料交实施者，按本章的建库方法保存范围、日期、原文位置和负责人，再用同一批问题查询，查看实际取回哪些段落。只有手工供给材料可用、自动查询也能取对，才逐步增加资料范围。\n"},{"id":"c13","file":"13-经验记忆Skill与企业学习.md","title":"第13章｜经验、记忆、Skill与企业学习","html":"\u003ch1>第13章｜经验、记忆、Skill与企业学习\u003c/h1>\n\u003cp>\u003cstrong>企业学习，是把工作中得到的经验写进下一次工作的资料、方法和系统，让更多人能够沿用，并继续修正。AI可以参与提取和整理，业务人员把其中有效的判断确认下来。\u003c/strong>\u003c/p>\n\u003cp>\u003ca href=\"#c13/do-13\">本章做法：把一次有效修正写成下一次可用的方法\u003c/a>\u003c/p>\n\u003cp>企业希望系统越用越懂业务，这个愿望需要拆开。系统可以保存当前任务进度，可以记住某位用户的偏好，可以积累企业知识，也可以维护经过验证的工作方法。它们都可能被产品称作“记忆”，但作用和责任不同。\u003c/p>\n\u003cp>这些记忆应按用途保存。个人表达偏好跟随用户，本次特别安排跟随任务，共用政策进入企业规则。应用按当前身份和任务调用相应内容，经验才会在合适的地方发挥作用。\u003c/p>\n\u003ch2>一次成功里，什么值得留下\u003c/h2>\n\u003cp>某位员工用 AI 做出一份合格方案，可能因为他提供了好资料，也可能因为他在多轮修改里补上了没有写出的专业判断。若只保存最后的提示词，下一位员工仍可能失败。\u003c/p>\n\u003cp>应回看过程：输入是什么，哪些地方原来出错，员工根据什么发现，修改了哪个条件，最后如何确认可用。由此提取的经验，可能是一个必要问题、一条适用规则、一种核对方法，也可能是某种情况下应停止自动处理。\u003c/p>\n\u003cp>回看成功与失败时，尤其要找到起作用的条件：是哪份资料补全了事实，哪种比较帮助判断，哪项检查发现了错误。把条件与方法一起保留，再换材料检验，就能分辨哪些经验值得沿用。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"13\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iODUzIiB2aWV3Qm94PSIwIDAgMzYwIDg1MyIgcm9sZT0iaW1nIj48dGl0bGU+5LiA5p2h57uP6aqM77yM5oCO5qC35Y+Y5oiQ5YWx55So5pa55rOVPC90aXRsZT48ZGVzYz7mnJ/mnJvor6/kvZzmib/or7rlkI7vvIzljLrliIbml6XmnJ/nirbmgIHvvIznlKjlt7Lmibnlh4bmnKrmibnlh4blkozlj5jmm7TmoLfkvovmo4Dmn6XvvIzlho3phY3nva7nu5nlhbHnlKjku7vliqHlubbnu7TmiqTjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYSIgbWFya2VyV2lkdGg9IjgiIG1hcmtlckhlaWdodD0iOCIgcmVmWD0iNyIgcmVmWT0iNCIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwIEw4IDQgTDAgOCBaIiBmaWxsPSIjMjQ2YTU1Ii8+PC9tYXJrZXI+PC9kZWZzPjxyZWN0IHdpZHRoPSIzNjAiIGhlaWdodD0iODUzIiBmaWxsPSJ3aGl0ZSIvPjxnIGZvbnQtZmFtaWx5PSJQ 客户反复变更时，要能找到当前版本；原话模糊时，应保持待确认。新规则若使所有日期都无法流转，也没有解决问题。\u003c/p>\n\u003cp>验证后才把它发布为共用方法，说明适用范围、负责人和版本。原始错误记录保留，便于将来理解为何这样设计。下次若规则仍失败，再判断是方法不完整、资料不足，还是程序没有真正执行要求。\u003c/p>\n\u003ch2>Skill在企业里可以是什么\u003c/h2>\n\u003cp>家里留下“一次做得很好的菜”的照片，还不足以让别人复做；写出材料用量、先后步骤和火候判断，再让家人试做，才开始形成可沿用的菜谱。企业保留一份成功方案也一样：还要留下它采用了什么材料、在哪些条件下作了哪些判断。\u003c/p>\n\u003cp>Skill可以理解为一套供AI使用的任务说明和资源组合，包括适用条件、步骤、范例、检查方式，以及相关脚本或工具。不同产品的实现有所差异，企业可以先把它理解为“把怎样完成一类工作写给AI，并提供需要的资源”。\u003c/p>\n\u003cp>企业可以把稳定方法组织成Skill，例如收到一类需求后先检查什么，怎样组织材料，遇到什么条件交给人，交出物怎样验收。它比一句提示更完整，也比“岗位智能体”这样的名称更容易检查。\u003c/p>\n\u003cp>方法包还要与实际运行环境连接。比如方案制作Skill写明先查产品资料，再读取客户记录，应用就需要提供这些查询能力。使用前检查资料和工具是否齐备，运行中按约定处理返回结果，方法才能被真正执行。\u003c/p>\n\u003cp>例如负责人将“整理订货需求”的方法保存到共用入口，里面说明怎样区分本次购买与未来意向，并附上原话范例。实施者把这项方法配置给对应任务：应用开始整理订货消息时，先读取这份说明，再连同客户材料交给模型。负责人修改共用说明后，后续任务取得新版本。这段读取与更新安排，使经验能被下一次工作真正用到。\u003c/p>\n\u003ch2>出错以后，应该改哪一层\u003c/h2>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>问题\u003c/th>\n\u003cth>优先改进的位置\u003c/th>\n\u003cth>改进如何发挥作用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>规则已经变更\u003c/td>\n\u003ctd>权威知识及生效范围\u003c/td>\n\u003ctd>让新任务取得当前规则\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>重要信息没有进入\u003c/td>\n\u003ctd>资料供给与上下文\u003c/td>\n\u003ctd>让模型获得判断所需事实\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>判断步骤不完整\u003c/td>\n\u003ctd>方法、样例与适用条件\u003c/td>\n\u003ctd>补足遗漏的比较与检查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>某项约束需严格执行\u003c/td>\n\u003ctd>系统写入或操作处\u003c/td>\n\u003ctd>在实际动作发生时核对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>信息方法合理仍持续不足\u003c/td>\n\u003ctd>模型配置、任务拆分或训练\u003c/td>\n\u003ctd>改善相应处理能力\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>通常应先改能够直接解决问题、影响范围又清楚的部分。每日变化的库存适合查系统；稳定的表达偏好适合任务配置；不能重复付款这样的约束需要执行系统支持。把所有问题都变成“再写一条提醒”，会使说明越来越长而保障越来越弱。\u003c/p>\n\u003ch2>企业学习也需要维护和淘汰\u003c/h2>\n\u003cp>共用方法应有负责人，重大修改要用新旧样例回查。适用条件变化后，旧经验可能需要退役。方法数量越来越多，若没有检索入口和版本管理，反而增加选错的机会。\u003c/p>\n\u003cp>记录下一项工作使用了哪部分方法、减少了什么准备、作了哪些调整，就能了解复用效果。有效方法值得安排维护；持续产生额外负担的方法则应修改或退出默认入口。企业学习由此有了具体的反馈。\u003c/p>\n\u003cp>经验沉淀的重点，是使企业更会判断和执行。AI 可以参与整理、比较和发现模式，组织仍需要对哪些经验值得沿用作出负责的决定。\u003c/p>\n\u003cp>\u003ca id=\"do-13\">\u003c/a>\u003c/p>\n\u003ch2>把一次有效修正写成下一次可用的方法\u003c/h2>\n\u003cp>选一条实际出过错、后来改对的任务。先保存原输入、错误结果、你根据什么判断及修正后的结果，再按下面的简短方法稿整理。这里沿用本章的日期示意：\u003c/p>\n\u003cdiv class=\"copy-block\">\u003cdiv class=\"copy-tools\">\u003cbutton type=\"button\" class=\"copy-text\">复制内容\u003c/button>\u003c/div>\u003cpre>\u003ccode class=\"language-text\">方法名称：区分客户期望与企业确认日期\n使用时机：整理客户需求、方案或交期记录时。\n输入：客户原话、当前订单、已有确认记录。\n做法：先找到日期相关原话；区分期望与确认；有确认时记录确认者与依据；缺依据时留待确认。\n输出：期望日期、已确认日期、依据、待追问事项。\n检查：不能把“希望月底”当作承诺；已有有效确认的日期仍应保留；变更后核当前版本。\n维护人：填写本企业负责维护该方法的人。\n\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>先拿“已确认、未确认、发生变更”各一条材料重做。检查修正既挡住原错误，也没有把正常确认全部退回。把结果记到\u003ca href=\"#download\" data-download=\"08-经验复用卡.docx\">经验复用卡\u003c/a>。\u003c/p>\n\u003cp>验证后，把方法存到团队共用入口；手工使用时附在任务前，应用使用时请实施者配置读取。下一次任务开始，核它实际取得了哪一版。若只存下一段说明却没人或程序会去读取，就先安排这个使用入口。\u003c/p>\n","text":"# 第13章｜经验、记忆、Skill与企业学习\n\n**企业学习，是把工作中得到的经验写进下一次工作的资料、方法和系统，让更多人能够沿用，并继续修正。AI可以参与提取和整理，业务人员把其中有效的判断确认下来。**\n\n[本章做法：把一次有效修正写成下一次可用的方法](#do-13)\n\n企业希望系统越用越懂业务，这个愿望需要拆开。系统可以保存当前任务进度，可以记住某位用户的偏好，可以积累企业知识，也可以维护经过验证的工作方法。它们都可能被产品称作“记忆”，但作用和责任不同。\n\n这些记忆应按用途保存。个人表达偏好跟随用户，本次特别安排跟随任务，共用政策进入企业规则。应用按当前身份和任务调用相应内容，经验才会在合适的地方发挥作用。\n\n## 一次成功里，什么值得留下\n\n某位员工用 AI 做出一份合格方案，可能因为他提供了好资料，也可能因为他在多轮修改里补上了没有写出的专业判断。若只保存最后的提示词，下一位员工仍可能失败。\n\n应回看过程：输入是什么，哪些地方原来出错，员工根据什么发现，修改了哪个条件，最后如何确认可用。由此提取的经验，可能是一个必要问题、一条适用规则、一种核对方法，也可能是某种情况下应停止自动处理。\n\n回看成功与失败时，尤其要找到起作用的条件：是哪份资料补全了事实，哪种比较帮助判断，哪项检查发现了错误。把条件与方法一起保留，再换材料检验，就能分辨哪些经验值得沿用。\n\n![运行记录转成经过检验的企业方法](assets/13.svg)\n\n## 从记录到方法，需要一轮验证\n\n设想系统曾把“客户提出的交付日期”写成“企业已确认日期”。团队发现后形成候选教训：将期望与承诺分开，并记录承诺的确认者及依据。\n\n接着要看正常任务：已经有明确批准的日期，仍应允许采用；客户反复变更时，要能找到当前版本；原话模糊时，应保持待确认。新规则若使所有日期都无法流转，也没有解决问题。\n\n验证后才把它发布为共用方法，说明适用范围、负责人和版本。原始错误记录保留，便于将来理解为何这样设计。下次若规则仍失败，再判断是方法不完整、资料不足，还是程序没有真正执行要求。\n\n## Skill在企业里可以是什么\n\n家里留下“一次做得很好的菜”的照片，还不足以让别人复做；写出材料用量、先后步骤和火候判断，再让家人试做，才开始形成可沿用的菜谱。企业保留一份成功方案也一样：还要留下它采用了什么材料、在哪些条件下作了哪些判断。\n\nSkill可以理解为一套供AI使用的任务说明和资源组合，包括适用条件、步骤、范例、检查方式，以及相关脚本或工具。不同产品的实现有所差异，企业可以先把它理解为“把怎样完成一类工作写给AI，并提供需要的资源”。\n\n企业可以把稳定方法组织成Skill，例如收到一类需求后先检查什么，怎样组织材料，遇到什么条件交给人，交出物怎样验收。它比一句提示更完整，也比“岗位智能体”这样的名称更容易检查。\n\n方法包还要与实际运行环境连接。比如方案制作Skill写明先查产品资料，再读取客户记录，应用就需要提供这些查询能力。使用前检查资料和工具是否齐备，运行中按约定处理返回结果，方法才能被真正执行。\n\n例如负责人将“整理订货需求”的方法保存到共用入口，里面说明怎样区分本次购买与未来意向，并附上原话范例。实施者把这项方法配置给对应任务：应用开始整理订货消息时，先读取这份说明，再连同客户材料交给模型。负责人修改共用说明后，后续任务取得新版本。这段读取与更新安排，使经验能被下一次工作真正用到。\n\n## 出错以后，应该改哪一层\n\n| 问题 | 优先改进的位置 | 改进如何发挥作用 |\n| --- | --- | --- |\n| 规则已经变更 | 权威知识及生效范围 | 让新任务取得当前规则 |\n| 重要信息没有进入 | 资料供给与上下文 | 让模型获得判断所需事实 |\n| 判断步骤不完整 | 方法、样例与适用条件 | 补足遗漏的比较与检查 |\n| 某项约束需严格执行 | 系统写入或操作处 | 在实际动作发生时核对 |\n| 信息方法合理仍持续不足 | 模型配置、任务拆分或训练 | 改善相应处理能力 |\n\n通常应先改能够直接解决问题、影响范围又清楚的部分。每日变化的库存适合查系统；稳定的表达偏好适合任务配置；不能重复付款这样的约束需要执行系统支持。把所有问题都变成“再写一条提醒”，会使说明越来越长而保障越来越弱。\n\n## 企业学习也需要维护和淘汰\n\n共用方法应有负责人，重大修改要用新旧样例回查。适用条件变化后，旧经验可能需要退役。方法数量越来越多，若没有检索入口和版本管理，反而增加选错的机会。\n\n记录下一项工作使用了哪部分方法、减少了什么准备、作了哪些调整，就能了解复用效果。有效方法值得安排维护；持续产生额外负担的方法则应修改或退出默认入口。企业学习由此有了具体的反馈。\n\n经验沉淀的重点，是使企业更会判断和执行。AI 可以参与整理、比较和发现模式，组织仍需要对哪些经验值得沿用作出负责的决定。\n\n\n\u003ca id=\"do-13\">\u003c/a>\n\n## 把一次有效修正写成下一次可用的方法\n\n选一条实际出过错、后来改对的任务。先保存原输入、错误结果、你根据什么判断及修正后的结果，再按下面的简短方法稿整理。这里沿用本章的日期示意：\n\n```text\n方法名称：区分客户期望与企业确认日期\n使用时机：整理客户需求、方案或交期记录时。\n输入：客户原话、当前订单、已有确认记录。\n做法：先找到日期相关原话；区分期望与确认；有确认时记录确认者与依据；缺依据时留待确认。\n输出：期望日期、已确认日期、依据、待追问事项。\n检查：不能把“希望月底”当作承诺；已有有效确认的日期仍应保留；变更后核当前版本。\n维护人：填写本企业负责维护该方法的人。\n```\n\n先拿“已确认、未确认、发生变更”各一条材料重做。检查修正既挡住原错误，也没有把正常确认全部退回。把结果记到[经验复用卡](toolkit/08-经验复用卡.docx)。\n\n验证后，把方法存到团队共用入口；手工使用时附在任务前，应用使用时请实施者配置读取。下一次任务开始，核它实际取得了哪一版。若只存下一段说明却没人或程序会去读取，就先安排这个使用入口。\n"},{"id":"c14","file":"14-工具API浏览器与MCP怎样让AI行动.md","title":"第14章｜工具、API、浏览器与MCP怎样让AI行动","html":"\u003ch1>第14章｜工具、API、浏览器与MCP怎样让AI行动\u003c/h1>\n\u003cp>\u003cstrong>工具调用把AI的理解和规划接到实际操作上。模型根据任务提出动作，应用执行查询、计算或写入，再把结果交回后续工作。\u003c/strong>\u003c/p>\n\u003cp>\u003ca href=\"#c14/do-14\">本章做法：请实施者把一条查询接通，再核对一次写入\u003c/a>\u003c/p>\n\u003cp>只产生文字的 AI，可以建议“为客户建立服务申请”。能够调用工具的应用，则可能真的创建记录、查询库存、发送通知或运行程序。这是从辅助表达走向业务执行的重要变化，也使企业必须明确动作由谁授权、写到哪里、失败怎样处理。\u003c/p>\n\u003ch2>一次工具调用如何发生\u003c/h2>\n\u003cp>餐厅服务员把点单交给厨房，厨房接单后制作，再把菜与桌号交给出餐人员。服务员说“已经帮你下单”，背后需要厨房确实收到并登记。工具调用也有这样的来回：模型提出需要做的操作，已连接的程序去执行，再带回实际结果。\u003c/p>\n\u003cp>在客户服务应用里，实施者预先接好“查询订单”和“创建服务申请”等操作，并配置使用账号。应用告诉模型这些操作可以做什么、需要填哪些信息。这里的“参数”，就是执行这次操作必须提供的具体值，例如客户编号、设备编号、故障描述。模型填好这些项目，提出请求；应用检查后，把请求送到售后系统。\u003c/p>\n\u003cp>售后系统保存申请，返回申请编号和处理状态。应用把结果交回模型，模型便可以告诉用户“申请已建立”，并提供可打开的记录。图中去程传的是创建要求，回程传的是保存结果；下一次查询进度时，还使用这笔申请的编号。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"14\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iOTAwIiB2aWV3Qm94PSIwIDAgMzYwIDkwMCIgcm9sZT0iaW1nIj48dGl0bGU+55Sz6K+35oCO5qC35o+Q5Lqk77yM57uT5p6c5oCO5qC35Zue5p2lPC90aXRsZT48ZGVzYz7mqKHlnovmj5Dlh7rlj4LmlbDvvIzlupTnlKjmo4Dmn6Xlubblj5HpgIHvvIzllK7lkI7ns7vnu5/kv53lrZjov5Tlm57nvJblj7flkoznirbmgIHvvIzlupTnlKjmja7mraTlsZXnpLrlkozkuqTmjqXjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYSIgbWFya2VyV2lkdGg9IjgiIG1hcmtlckhlaWdodD0iOCIgcmVmWD0iNyIgcmVmWT0iNCIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwIEw4IDQgTDAgOCBaIiBmaWxsPSIjMjQ2YTU1Ii8+PC9tYXJrZXI+PC9kZWZzPjxyZWN0IHdpZHRoPSIzNjAiIGhlaWdodD0iOTAwIiBmaWxsPSJ3aGl0ZSIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiI+PHRleHQgeD0iMjQiIHk9IjM4IiBmb250LXNpemU9IjI0IiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNjAwIj7nlLPor7fmgI7moLfmj5DkuqTvvIznu5PmnpzmgI7moLflm57mnaU8L3RleHQ+PHRleHQgeD0iMjQiIHk9IjcxIiBmb250LXNpemU9IjE4IiBmaWxsPSIjNjE3MTZiIiBmb250LXdlaWdodD0iNDAwIj7npLrmhI/vvJpBSeWKqeaJi+WIm+W7uuS4gOeslOWUruWQjueUs+ivtzwvdGV4dD48cmVjdCB4PSIyNCIgeT0iMTI0IiB3aWR0aD0iMzEyIiBoZWlnaHQ9IjExMyIgcng9IjgiIGZpbGw9IiNlZGYyZjgiIHN0cm9rZT0iI2Q1ZTBkYSIgc3Ryb2tlLXdpZHRoPSIxLjQiLz48dGV4dCB4PSI0MCIgeT0iMTU0IiBmb250LXNpemU9IjIxIiBmaWxsPSIjMjQ2YTU1IiBmb250LXdlaWdodD0iNjAwIj7ikaAg5qih5Z6L 和附件里可能包含要求系统忽略规则、泄露资料或执行操作的文字。这些文字是待处理材料，不是企业授权。系统应区分可信任务指令与外部内容，工具端仍核对身份、范围和批准。\u003c/p>\n\u003cp>落实时，应用区分任务指令与待处理材料，工具端按身份和允许范围检查请求。例如研究任务提供只读工具，即使网页夹带发送要求，它也没有发送入口；需要对外发送的任务，则另设内容确认与执行步骤。\u003c/p>\n\u003ch2>把动作结果交还业务\u003c/h2>\n\u003cp>每个外部动作都应绑定发起时的工作对象。用户切到另一位客户后，迟到的返回结果仍属于原客户，不能随当前页面归档。超时则可能意味着没有执行，也可能已经完成但没有收到响应，应先核实，不能随意重复提交。\u003c/p>\n\u003cp>可靠执行的终点，是相应人员能查到正确记录、知道当前状态并继续工作。工具越丰富，越需要把这一终点保持清楚。\u003c/p>\n\u003cp>\u003ca id=\"do-14\">\u003c/a>\u003c/p>\n\u003ch2>请实施者把一条查询接通，再核对一次写入\u003c/h2>\n\u003cp>先选不会改变业务记录的查询，例如销售查看自己负责客户的订单状态。把客户与订单编号、当前用户身份、应能看到的记录、不能看到的范围写入\u003ca href=\"#download\" data-download=\"03-试点范围与任务说明.docx\">试点范围与任务说明\u003c/a>，交实施者核实当前账号与平台条件。\u003c/p>\n\u003cp>演示时按顺序看三件事：你提出的客户是谁；工具实际返回哪笔记录；界面显示的状态是否与正式订单一致。再换一个无权访问的对象，看实际返回是否受限。\u003c/p>\n\u003cp>若下一步需要建立服务申请，再用一笔测试任务提交，记下返回编号，请接手团队从正式入口打开。只出现“已接受请求”时继续查状态，确认保存后再记为完成；超时且结果未知时，按\u003ca href=\"#c16\">第16章\u003c/a>先核实际记录。\u003c/p>\n\u003cp>你要保留的是本次身份、请求对象、实际返回和接手结果，而不是一句“API已经接好”。这份核对记录会决定能否进入真实试用。\u003c/p>\n","text":"# 第14章｜工具、API、浏览器与MCP怎样让AI行动\n\n**工具调用把AI的理解和规划接到实际操作上。模型根据任务提出动作，应用执行查询、计算或写入，再把结果交回后续工作。**\n\n[本章做法：请实施者把一条查询接通，再核对一次写入](#do-14)\n\n只产生文字的 AI，可以建议“为客户建立服务申请”。能够调用工具的应用，则可能真的创建记录、查询库存、发送通知或运行程序。这是从辅助表达走向业务执行的重要变化，也使企业必须明确动作由谁授权、写到哪里、失败怎样处理。\n\n## 一次工具调用如何发生\n\n餐厅服务员把点单交给厨房，厨房接单后制作，再把菜与桌号交给出餐人员。服务员说“已经帮你下单”，背后需要厨房确实收到并登记。工具调用也有这样的来回：模型提出需要做的操作，已连接的程序去执行，再带回实际结果。\n\n在客户服务应用里，实施者预先接好“查询订单”和“创建服务申请”等操作，并配置使用账号。应用告诉模型这些操作可以做什么、需要填哪些信息。这里的“参数”，就是执行这次操作必须提供的具体值，例如客户编号、设备编号、故障描述。模型填好这些项目，提出请求；应用检查后，把请求送到售后系统。\n\n售后系统保存申请，返回申请编号和处理状态。应用把结果交回模型，模型便可以告诉用户“申请已建立”，并提供可打开的记录。图中去程传的是创建要求，回程传的是保存结果；下一次查询进度时，还使用这笔申请的编号。\n\n![模型组织客户、设备和故障信息，应用把创建请求交给售后系统；系统保存并返回编号，应用据此展示申请并交给服务团队。](assets/14.svg)\n\n以建立服务申请为例，模型可以整理客户、设备和问题描述，提出创建请求。应用检查当前用户能否为该客户建单、必要字段是否齐全、是否已有重复申请，再向业务系统写入。成功后取得申请编号，并读回记录或核对保存结果，用户才有可以继续处理的对象。\n\n申请创建后，接收团队可以按编号打开记录、安排处理。若接口先返回“请求已接受”，应用继续查询处理状态，取得保存结果再通知接手者。完整反馈让发起者知道工作推进到了哪里。\n\n## 几种连接方式各解决什么\n\nAPI 是系统开放给程序的操作入口，通常适合稳定、明确的数据读取和动作。浏览器操作模拟人在界面上的工作，适用于没有合适接口但允许通过界面处理的任务；它更容易受页面变化、登录状态和加载延迟影响。\n\n仍以报修为例：人可以打开网页，在客户、设备、故障三栏中填写，再点击提交；程序也可以把这些值按系统约定的格式直接提交到创建申请的 API。两条路都要经过接收系统的权限和内容检查，最终保存到相应申请记录。浏览器操作是在使用人看到的界面，API 调用则是使用系统专门开放给程序的入口。\n\nMCP是连接模型应用与外部能力的一种协议，帮助应用用共同方式发现工具、读取资源和发起调用。例如一套订单工具可以通过协议向兼容应用提供说明，减少为每个应用单独设计连接方式的工作。账号授权与业务校验仍由连接服务和接收系统执行。\n\n“协议”就是双方约定怎样介绍能力、怎样提出请求、怎样返回结果。比如企业把查单能力做成一个 MCP 服务，两个支持这种约定的 AI 应用就可以用相同方式了解和请求它；服务收到请求后，再通过订单系统的 API 去查询。MCP统一应用与工具服务之间的沟通方式，订单的实际读取仍由后面的连接与业务系统完成。\n\n选择时不必按技术名称排高低。先看目标操作有哪些已授权接入，能否清楚定位对象、检查权限、获得结果，再比较稳定性与维护成本。已有可靠接口时，通常没必要绕界面重复点击；界面是唯一合适入口时，也应如实计算维护与异常处理。\n\n## 身份与权限会改变实际能力\n\n同一个操作，在管理员账号能成功，在普通销售账号可能失败；企业开通了某项高级功能，也不代表当前购买版本支持按记录限制访问。应用里写“仅看本人客户”，若底层查询仍返回全部客户，界面上的说明不能代替权限控制。\n\n验证应使用实际角色和实际平台条件。确认数据在哪个层面被过滤，写入时是否再次检查，以及权限变化后旧会话是否仍能访问。需要严格限制的范围，应尽量由接收系统或受控服务执行。\n\n决策者可以和实施者明确：任务采用谁的身份，读取哪些记录，改变哪些内容，哪些动作先交人决定。按实际需要配置工具，能让日常动作顺利执行，也让职责易于理解。\n\n## 外部材料为什么不能成为执行命令\n\n客户邮件、网页和附件里可能包含要求系统忽略规则、泄露资料或执行操作的文字。这些文字是待处理材料，不是企业授权。系统应区分可信任务指令与外部内容，工具端仍核对身份、范围和批准。\n\n落实时，应用区分任务指令与待处理材料，工具端按身份和允许范围检查请求。例如研究任务提供只读工具，即使网页夹带发送要求，它也没有发送入口；需要对外发送的任务，则另设内容确认与执行步骤。\n\n## 把动作结果交还业务\n\n每个外部动作都应绑定发起时的工作对象。用户切到另一位客户后，迟到的返回结果仍属于原客户，不能随当前页面归档。超时则可能意味着没有执行，也可能已经完成但没有收到响应，应先核实，不能随意重复提交。\n\n可靠执行的终点，是相应人员能查到正确记录、知道当前状态并继续工作。工具越丰富，越需要把这一终点保持清楚。\n\n\n\u003ca id=\"do-14\">\u003c/a>\n\n## 请实施者把一条查询接通，再核对一次写入\n\n先选不会改变业务记录的查询，例如销售查看自己负责客户的订单状态。把客户与订单编号、当前用户身份、应能看到的记录、不能看到的范围写入[试点范围与任务说明](toolkit/03-试点范围与任务说明.docx)，交实施者核实当前账号与平台条件。\n\n演示时按顺序看三件事：你提出的客户是谁；工具实际返回哪笔记录；界面显示的状态是否与正式订单一致。再换一个无权访问的对象，看实际返回是否受限。\n\n若下一步需要建立服务申请，再用一笔测试任务提交，记下返回编号，请接手团队从正式入口打开。只出现“已接受请求”时继续查状态，确认保存后再记为完成；超时且结果未知时，按[第16章](16-长任务Harness与执行可靠性.md)先核实际记录。\n\n你要保留的是本次身份、请求对象、实际返回和接手结果，而不是一句“API已经接好”。这份核对记录会决定能否进入真实试用。\n"},{"id":"c15","file":"15-工作流Agent与多Agent怎样选择.md","title":"第15章｜工作流、Agent与多Agent怎样选择","html":"\u003ch1>第15章｜工作流、Agent与多Agent怎样选择\u003c/h1>\n\u003cp>\u003cstrong>固定步骤与动态判断可以组合使用。选择依据是任务路径有多不确定、动作后果有多大，以及协调成本是否值得。\u003c/strong>\u003c/p>\n\u003cp>\u003ca href=\"#c15/do-15\">本章做法：根据一类实际任务，选工作流还是Agent\u003c/a>\u003c/p>\n\u003cp>工作流通常由人预先规定主要步骤与分支，例如收集资料、检查字段、计算、审批、保存。Agent 通常译为“智能体”，它允许模型在一定范围内，根据目标和反馈选择下一步，如决定还需查哪些资料、使用什么工具或怎样调整计划。不同产品使用这些名称的方式不完全一致，应看实际控制方式。\u003c/p>\n\u003cp>两者可以在同一项工作中组合。流程规定必须经过的环节，模型在其中处理变化的材料、提出判断或选择查询路径。企业据此把稳定要求与灵活处理放在各自合适的位置。\u003c/p>\n\u003ch2>哪些部分值得固定\u003c/h2>\n\u003cp>照着家人的晚餐安排做饭，有些要求事先就确定了：几个人吃、谁有明确忌口、几点开饭；冰箱里缺了一种配菜时，做饭的人可以查看现有食材，选择替代搭配。企业流程也可以同时包含这两类安排：确定必须遵守的步骤，让模型在需要判断的部分选择办法。\u003c/p>\n\u003cp>例如处理售后申请，客户和设备必须先确认，提交前必须有故障描述；在这些环节中，客户发照片就先辨认型号，只有含糊描述就先追问，提供过维修记录就补查历史。这些中间动作由已有材料决定。材料够用后，仍回到同一个出口：保存申请并交给维修团队。\u003c/p>\n\u003cp>金额计算、必填字段、身份权限、批准与写入关系等，往往需要明确规则。将这些部分固定，可以减少遗漏，并让错误更容易定位。模型适合处理表达多变、材料形态不同或需要综合判断的部分。\u003c/p>\n\u003cp>例如研究竞争产品时，检索路径可能变化，适合让模型根据已有证据决定下一项查询；最终采购批准仍应走企业既有授权。处理标准服务申请时，主要步骤固定，模型可以解释客户原话和识别缺项，没必要让它每次重新发明整个流程。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"15\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iODQ4IiB2aWV3Qm94PSIwIDAgMzYwIDg0OCIgcm9sZT0iaW1nIj48dGl0bGU+5oyJ5p2Q5paZ6YCJ5q2l6aqk77yM57uf5LiA5Lqk5o6lPC90aXRsZT48ZGVzYz7lm7rlrprlhaXlj6Plh7rlj6PlhoXvvIzmoLnmja7mnZDmlpnpgInmi6novqjorqTjgIHov73pl67miJbmn6Xljoblj7LvvJvnvLrlhbPplK7pobnnu6fnu63ooaXlhYXvvIzotrPlpJ/lj5fnkIblkI7kv53lrZjjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYSIgbWFya2VyV2lkdGg9IjgiIG1hcmtlckhlaWdodD0iOCIgcmVmWD0iNyIgcmVmWT0iNCIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwIEw4IDQgTDAgOCBaIiBmaWxsPSIjMjQ2YTU1Ii8+PC9tYXJrZXI+PC9kZWZzPjxyZWN0IHdpZHRoPSIzNjAiIGhlaWdodD0iODQ4IiBmaWxsPSJ3aGl0ZSIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiI+PHRleHQgeD0iMjQiIHk9IjM4IiBmb250LXNpemU9IjI0IiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNjAwIj7mjInmnZDmlpnpgInmraXpqqTvvIznu5/kuIDkuqTmjqU8L3RleHQ+PHRleHQgeD0iMjQiIHk9IjcxIiBmb250LXNpemU9IjE4IiBmaWxsPSIjNjE3MTZiIiBmb250LXdlaWdodD0iNDAwIj7npLrmhI/vvJrmlbTnkIbkuIDnrJTllK7lkI7nlLPor7c8L3RleHQ+PHJlY3QgeD0iMjQiIHk9IjEyNCIgd2lkdGg9IjMxMiIgaGVpZ2h0PSIxMTMiIHJ4PSI4IiBmaWxsPSIjZWRmMmY4IiBzdHJva2U9IiNkNWUwZ bel=\"放大查看图15-1\">放大查看\u003c/button>\u003c/figcaption>\u003c/figure>\n\u003ch2>自主性不只是一个开关\u003c/h2>\n\u003cp>企业应分别决定几种自由：模型能看到哪些资料，能自行选择哪些方法，能调整什么顺序，能执行哪些外部动作，以及何时必须交给人。\u003c/p>\n\u003cp>可以允许它自由查内部公开产品资料，却只允许生成客户回复草稿；也可以允许它自动更新低影响标签，但涉及价格承诺必须批准。这种分解比笼统地说“让Agent自动干活”更容易讨论。\u003c/p>\n\u003cp>应用据此提供相应工具，并在执行处检查条件。例如允许自动更新标签，工具就只开放标签字段；价格修改需要批准，写入时就核对批准对应的内容。自主范围因此成为可以实现的分工。\u003c/p>\n\u003ch2>多Agent在什么时候有帮助\u003c/h2>\n\u003cp>多Agent可以把工作分给多个模型任务，例如分别研究几个互相独立的主题，或由一个任务生成候选、另一个按明确标准检查。它的价值来自并行、职责分离或不同工具能力，而不是角色名称丰富。\u003c/p>\n\u003cp>多Agent的分工需要实质差异。研究任务可以分别取得不同来源，检查任务可以使用明确标准和另一组验证材料，合并者负责处理冲突。同一材料和相似方法可能产生相关错误，设计时应关注每个任务究竟增加了哪种信息或检查。\u003c/p>\n\u003cp>比如比较三种客服软件，可以把同一份任务要求交给三个研究任务，分别查甲、乙、丙的官方功能与接入条件。每个任务交回产品版本、相关原文和未确认问题，再由合并者按相同栏目整理。若甲只查了基础版、乙查的是高级版，合并时先补齐版本条件，才比较价格。这和家人分别查机票、住宿再汇总旅行预算相似：可以分头查，但日期、人数和包含费用必须一致。\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>情况\u003c/th>\n\u003cth>可以考虑的安排\u003c/th>\n\u003cth>需要额外承担\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>多项互不依赖的信息收集\u003c/td>\n\u003ctd>并行研究后合并\u003c/td>\n\u003ctd>去重、口径对齐与出处核查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同一任务需要生成与挑战\u003c/td>\n\u003ctd>分开提出与检查\u003c/td>\n\u003ctd>检查标准及独立证据，避免只是换口吻\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>后续步骤依赖前一步结论\u003c/td>\n\u003ctd>顺序执行或局部并行\u003c/td>\n\u003ctd>状态交接和错误传播管理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>任务很短且路径明确\u003c/td>\n\u003ctd>单流程或单Agent\u003c/td>\n\u003ctd>多方协调通常可能得不偿失\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003ch2>协调成本怎样吃掉收益\u003c/h2>\n\u003cp>任务拆得过细，每个Agent都需要重复理解背景，产生大量中间文件；合并时还要解决同一对象不同名称、互相矛盾的假设和遗漏。并行节约的时间可能被协调消耗。\u003c/p>\n\u003cp>因此应先证明单个任务方法有效，再决定是否拆分。比较时计算整个任务的质量、费用、耗时和人工整理，而不只看各子任务完成得多快。对复杂任务，还应观察某个子任务失败时，是否能只重做受影响部分。\u003c/p>\n\u003ch2>企业怎样审查一个Agent方案\u003c/h2>\n\u003cp>请提供方演示一个未预先准备的正常任务、一个缺信息任务和一个工具失败任务。观察它怎样选择下一步、什么时候停下、如何说明未完成，以及接手者能否看懂当前状态。\u003c/p>\n\u003cp>观察过程中，重点看它是否利用查询和工具反馈改变下一步：缺少材料时补查，发现冲突时比较，完成动作后取得结果。这样的演示能帮助企业确定哪些步骤适合动态处理，以及哪些地方保留固定安排。\u003c/p>\n\u003cp>\u003ca id=\"do-15\">\u003c/a>\u003c/p>\n\u003ch2>根据一类实际任务，选工作流还是Agent\u003c/h2>\n\u003cp>在纸上写出任务从哪里开始、到哪里结束，把每一步标成“必须照规则走”或“要根据材料决定下一步”。先用三类工作对照：\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>具体任务\u003c/th>\n\u003cth>优先考虑的做法\u003c/th>\n\u003cth>为什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>按已确认数量与单价算金额，再交批准\u003c/td>\n\u003ctd>固定工作流与程序计算\u003c/td>\n\u003ctd>数值和批准条件已有明确规则\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>客户报修材料不一，需要看照片、追问或查历史\u003c/td>\n\u003ctd>固定受理与保存步骤，中间采用动态判断\u003c/td>\n\u003ctd>需要补的资料由本次输入决定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同时研究三个候选产品，再对齐版本比较\u003c/td>\n\u003ctd>方法先在单个候选上验证，再考虑分头研究\u003c/td>\n\u003ctd>分头收益要大于重复理解与合并成本\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>把自己的标记交给实施者，请他用一笔普通任务、一笔缺项任务和一次查询失败演示。记录每一步是程序按规则推进，还是模型根据反馈选择；同时看何时交人、怎样留下结果。\u003c/p>\n\u003cp>如果对方只是说“由多个专家Agent协作”，就回到这张任务路径，逐个问清每个任务拿什么、交什么、谁合并。先把单一路径做到可用，再比较增加分工后的总费用、时间和人工整理。\u003c/p>\n","text":"# 第15章｜工作流、Agent与多Agent怎样选择\n\n**固定步骤与动态判断可以组合使用。选择依据是任务路径有多不确定、动作后果有多大，以及协调成本是否值得。**\n\n[本章做法：根据一类实际任务，选工作流还是Agent](#do-15)\n\n工作流通常由人预先规定主要步骤与分支，例如收集资料、检查字段、计算、审批、保存。Agent 通常译为“智能体”，它允许模型在一定范围内，根据目标和反馈选择下一步，如决定还需查哪些资料、使用什么工具或怎样调整计划。不同产品使用这些名称的方式不完全一致，应看实际控制方式。\n\n两者可以在同一项工作中组合。流程规定必须经过的环节，模型在其中处理变化的材料、提出判断或选择查询路径。企业据此把稳定要求与灵活处理放在各自合适的位置。\n\n## 哪些部分值得固定\n\n照着家人的晚餐安排做饭，有些要求事先就确定了：几个人吃、谁有明确忌口、几点开饭；冰箱里缺了一种配菜时，做饭的人可以查看现有食材，选择替代搭配。企业流程也可以同时包含这两类安排：确定必须遵守的步骤，让模型在需要判断的部分选择办法。\n\n例如处理售后申请，客户和设备必须先确认，提交前必须有故障描述；在这些环节中，客户发照片就先辨认型号，只有含糊描述就先追问，提供过维修记录就补查历史。这些中间动作由已有材料决定。材料够用后，仍回到同一个出口：保存申请并交给维修团队。\n\n金额计算、必填字段、身份权限、批准与写入关系等，往往需要明确规则。将这些部分固定，可以减少遗漏，并让错误更容易定位。模型适合处理表达多变、材料形态不同或需要综合判断的部分。\n\n例如研究竞争产品时，检索路径可能变化，适合让模型根据已有证据决定下一项查询；最终采购批准仍应走企业既有授权。处理标准服务申请时，主要步骤固定，模型可以解释客户原话和识别缺项，没必要让它每次重新发明整个流程。\n\n![售后申请保留确认对象、整理故障和保存接手的固定路径；其中材料不同时，模型选择看照片、追问或查历史，再回到共同出口。](assets/15.svg)\n\n## 自主性不只是一个开关\n\n企业应分别决定几种自由：模型能看到哪些资料，能自行选择哪些方法，能调整什么顺序，能执行哪些外部动作，以及何时必须交给人。\n\n可以允许它自由查内部公开产品资料，却只允许生成客户回复草稿；也可以允许它自动更新低影响标签，但涉及价格承诺必须批准。这种分解比笼统地说“让Agent自动干活”更容易讨论。\n\n应用据此提供相应工具，并在执行处检查条件。例如允许自动更新标签，工具就只开放标签字段；价格修改需要批准，写入时就核对批准对应的内容。自主范围因此成为可以实现的分工。\n\n## 多Agent在什么时候有帮助\n\n多Agent可以把工作分给多个模型任务，例如分别研究几个互相独立的主题，或由一个任务生成候选、另一个按明确标准检查。它的价值来自并行、职责分离或不同工具能力，而不是角色名称丰富。\n\n多Agent的分工需要实质差异。研究任务可以分别取得不同来源，检查任务可以使用明确标准和另一组验证材料，合并者负责处理冲突。同一材料和相似方法可能产生相关错误，设计时应关注每个任务究竟增加了哪种信息或检查。\n\n比如比较三种客服软件，可以把同一份任务要求交给三个研究任务，分别查甲、乙、丙的官方功能与接入条件。每个任务交回产品版本、相关原文和未确认问题，再由合并者按相同栏目整理。若甲只查了基础版、乙查的是高级版，合并时先补齐版本条件，才比较价格。这和家人分别查机票、住宿再汇总旅行预算相似：可以分头查，但日期、人数和包含费用必须一致。\n\n| 情况 | 可以考虑的安排 | 需要额外承担 |\n| --- | --- | --- |\n| 多项互不依赖的信息收集 | 并行研究后合并 | 去重、口径对齐与出处核查 |\n| 同一任务需要生成与挑战 | 分开提出与检查 | 检查标准及独立证据，避免只是换口吻 |\n| 后续步骤依赖前一步结论 | 顺序执行或局部并行 | 状态交接和错误传播管理 |\n| 任务很短且路径明确 | 单流程或单Agent | 多方协调通常可能得不偿失 |\n\n## 协调成本怎样吃掉收益\n\n任务拆得过细，每个Agent都需要重复理解背景，产生大量中间文件；合并时还要解决同一对象不同名称、互相矛盾的假设和遗漏。并行节约的时间可能被协调消耗。\n\n因此应先证明单个任务方法有效，再决定是否拆分。比较时计算整个任务的质量、费用、耗时和人工整理，而不只看各子任务完成得多快。对复杂任务，还应观察某个子任务失败时，是否能只重做受影响部分。\n\n## 企业怎样审查一个Agent方案\n\n请提供方演示一个未预先准备的正常任务、一个缺信息任务和一个工具失败任务。观察它怎样选择下一步、什么时候停下、如何说明未完成，以及接手者能否看懂当前状态。\n\n观察过程中，重点看它是否利用查询和工具反馈改变下一步：缺少材料时补查，发现冲突时比较，完成动作后取得结果。这样的演示能帮助企业确定哪些步骤适合动态处理，以及哪些地方保留固定安排。\n\n\u003ca id=\"do-15\">\u003c/a>\n\n## 根据一类实际任务，选工作流还是Agent\n\n在纸上写出任务从哪里开始、到哪里结束，把每一步标成“必须照规则走”或“要根据材料决定下一步”。先用三类工作对照：\n\n| 具体任务 | 优先考虑的做法 | 为什么 |\n| --- | --- | --- |\n| 按已确认数量与单价算金额，再交批准 | 固定工作流与程序计算 | 数值和批准条件已有明确规则 |\n| 客户报修材料不一，需要看照片、追问或查历史 | 固定受理与保存步骤，中间采用动态判断 | 需要补的资料由本次输入决定 |\n| 同时研究三个候选产品，再对齐版本比较 | 方法先在单个候选上验证，再考虑分头研究 | 分头收益要大于重复理解与合并成本 |\n\n把自己的标记交给实施者，请他用一笔普通任务、一笔缺项任务和一次查询失败演示。记录每一步是程序按规则推进，还是模型根据反馈选择；同时看何时交人、怎样留下结果。\n\n如果对方只是说“由多个专家Agent协作”，就回到这张任务路径，逐个问清每个任务拿什么、交什么、谁合并。先把单一路径做到可用，再比较增加分工后的总费用、时间和人工整理。\n"},{"id":"c16","file":"16-长任务Harness与执行可靠性.md","title":"第16章｜长任务、Harness与执行可靠性","html":"\u003ch1>第16章｜长任务、Harness与执行可靠性\u003c/h1>\n\u003cp>\u003cstrong>Harness是支持AI持续工作的执行安排，包括工具、任务状态、运行环境、检查与恢复。它让多步工作能够保存进展、利用反馈，并在中断后继续。\u003c/strong>\u003c/p>\n\u003cp>\u003ca href=\"#c16/do-16\">本章做法：做一次暂停与恢复检查\u003c/a>\u003c/p>\n\u003cp>整理大量材料、连续修改方案、开发并部署工具，都可能跨越多轮对话与多次工具调用。每一轮的结果需要成为下一轮的条件，中途还会遇到信息增加、工具失败和要求改变。Harness负责组织这种连续性。\u003c/p>\n\u003cp>对于管理者，理解它最直接的方式，是看一项工作如何保存已经取得的材料与结果，以及接手时怎样知道下一步。\u003c/p>\n\u003ch2>为什么单步不错，整项任务仍会失败\u003c/h2>\n\u003cp>一项工作可能需要读取、提取、核对、计算、写入和通知。前一步的错误会进入后一步；某一步失败后盲目继续，最终产物可能更难发现问题。\u003c/p>\n\u003cp>可以用一个假设算例理解为什么要安排检查与恢复：若10个步骤相互独立，每步成功概率都是95%，前两步都成功的概率是95%×95%，继续把10步相乘，就得到约60%。实际步骤通常存在依赖，因此这里仅说明累积关系。系统若能发现失败并重做受影响部分，就有机会提高整项任务的完成率。\u003c/p>\n\u003cp>增加检查、重试和恢复能够改善部分失败，但也会增加成本与时间。应按实际任务测量最终结果，而不是不断堆叠步骤。\u003c/p>\n\u003ch2>至少保存三类连续性\u003c/h2>\n\u003cp>任务连续性说明目标、范围和完成条件是否仍清楚。证据连续性说明当前结论采用哪些资料、版本和确认。动作连续性说明哪些操作未开始、进行中、已经完成或结果未知。\u003c/p>\n\u003cp>交接记录应把三类内容分别记清：目标与完成条件，采用的资料和版本，已经发生的动作与当前状态。恢复时按这些信息定位可复用结果，核对必要事实，再执行下一步。原始文件和系统记录保留可找回的位置。\u003c/p>\n\u003cp>例如下午整理完一批报修材料，还没建立申请就中断了。应用把已整理的文件位置、哪些材料已核对、哪些仍缺型号，以及“尚未创建申请”保存到任务记录。第二天继续时，先打开这份记录，找到已保存的整理结果，补问缺项，然后创建申请。若中断发生在提交以后，就先查询有没有生成申请，再决定从哪里继续。两种中断留下的事实不同，恢复动作也不同。\u003c/p>\n\u003cp>条件改变时，还要知道哪些旧结果失效。例如需求修改后，原计算和批准可能都需要重做；已经取得的通用资料则未必需要重新检索。清楚的依赖关系能避免全盘重来，也避免沿用已失效产物。\u003c/p>\n\u003ch2>超时为什么特别危险\u003c/h2>\n\u003cp>网上寄件时，点击提交后页面一直转圈，你可能会先打开“我的寄件”看看有没有生成运单。因为转圈只说明你尚未看到结果：平台可能没收到请求，也可能已经生成运单，只是回执没有到达页面。再点一次之前，先查记录，能减少重复下单。\u003c/p>\n\u003cp>AI应用创建服务申请后等待过久，也会遇到同样的问题。“超时”是等待结果超过了设定时间，并不能单独说明保存是否发生。恢复处理先按原客户、设备和这次请求查记录：已经有申请就沿已有记录继续；接收系统明确未执行后才重新提交；无法判断时让接手人员核实。\u003c/p>\n\u003cp>“幂等”在这里指同一次创建请求重复送达，也只产生一笔申请。接收系统支持这种操作时，应用为同一次提交保留固定请求标识。接收端记录这个标识及对应结果，再收到相同请求就返回已有结果，从而避免重复创建。没有接收端支持时，应用先按业务对象查询是否已创建，无法确定则交人核实。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"16\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iODU2IiB2aWV3Qm94PSIwIDAgMzYwIDg1NiIgcm9sZT0iaW1nIj48dGl0bGU+5LiA55u06L2s5Zy >\n\u003c/tr>\n\u003ctr>\n\u003ctd>已有材料与产物\u003c/td>\n\u003ctd>需求整理稿位置，已核型号和客户\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已执行动作\u003c/td>\n\u003ctd>尚未创建申请\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>未完成项\u003c/td>\n\u003ctd>补问故障时间，核齐后提交\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>继续前需核实\u003c/td>\n\u003ctd>原需求是否变更、已有产物是否仍适用\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>让接手者只凭这些记录继续，并打开最终申请核对。提交后结果未知的那次，先查询是否已有申请，查到就沿原编号继续；不能确定则交人核实。发现暂停后只能从头问用户所有问题，或重复建了两单，就记录这条失败，请实施者修恢复路径后重做同一任务。\u003c/p>\n\u003cp>即使目前只用普通聊天，也可以先保存这份交接记录并在新对话中提供。它帮助你理解需要保留什么；团队系统能否自动保存、核实和恢复，则要按上述演示确认。\u003c/p>\n","text":"# 第16章｜长任务、Harness与执行可靠性\n\n**Harness是支持AI持续工作的执行安排，包括工具、任务状态、运行环境、检查与恢复。它让多步工作能够保存进展、利用反馈，并在中断后继续。**\n\n[本章做法：做一次暂停与恢复检查](#do-16)\n\n整理大量材料、连续修改方案、开发并部署工具，都可能跨越多轮对话与多次工具调用。每一轮的结果需要成为下一轮的条件，中途还会遇到信息增加、工具失败和要求改变。Harness负责组织这种连续性。\n\n对于管理者，理解它最直接的方式，是看一项工作如何保存已经取得的材料与结果，以及接手时怎样知道下一步。\n\n## 为什么单步不错，整项任务仍会失败\n\n一项工作可能需要读取、提取、核对、计算、写入和通知。前一步的错误会进入后一步；某一步失败后盲目继续，最终产物可能更难发现问题。\n\n可以用一个假设算例理解为什么要安排检查与恢复：若10个步骤相互独立，每步成功概率都是95%，前两步都成功的概率是95%×95%，继续把10步相乘，就得到约60%。实际步骤通常存在依赖，因此这里仅说明累积关系。系统若能发现失败并重做受影响部分，就有机会提高整项任务的完成率。\n\n增加检查、重试和恢复能够改善部分失败，但也会增加成本与时间。应按实际任务测量最终结果，而不是不断堆叠步骤。\n\n## 至少保存三类连续性\n\n任务连续性说明目标、范围和完成条件是否仍清楚。证据连续性说明当前结论采用哪些资料、版本和确认。动作连续性说明哪些操作未开始、进行中、已经完成或结果未知。\n\n交接记录应把三类内容分别记清：目标与完成条件，采用的资料和版本，已经发生的动作与当前状态。恢复时按这些信息定位可复用结果，核对必要事实，再执行下一步。原始文件和系统记录保留可找回的位置。\n\n例如下午整理完一批报修材料，还没建立申请就中断了。应用把已整理的文件位置、哪些材料已核对、哪些仍缺型号，以及“尚未创建申请”保存到任务记录。第二天继续时，先打开这份记录，找到已保存的整理结果，补问缺项，然后创建申请。若中断发生在提交以后，就先查询有没有生成申请，再决定从哪里继续。两种中断留下的事实不同，恢复动作也不同。\n\n条件改变时，还要知道哪些旧结果失效。例如需求修改后，原计算和批准可能都需要重做；已经取得的通用资料则未必需要重新检索。清楚的依赖关系能避免全盘重来，也避免沿用已失效产物。\n\n## 超时为什么特别危险\n\n网上寄件时，点击提交后页面一直转圈，你可能会先打开“我的寄件”看看有没有生成运单。因为转圈只说明你尚未看到结果：平台可能没收到请求，也可能已经生成运单，只是回执没有到达页面。再点一次之前，先查记录，能减少重复下单。\n\nAI应用创建服务申请后等待过久，也会遇到同样的问题。“超时”是等待结果超过了设定时间，并不能单独说明保存是否发生。恢复处理先按原客户、设备和这次请求查记录：已经有申请就沿已有记录继续；接收系统明确未执行后才重新提交；无法判断时让接手人员核实。\n\n“幂等”在这里指同一次创建请求重复送达，也只产生一笔申请。接收系统支持这种操作时，应用为同一次提交保留固定请求标识。接收端记录这个标识及对应结果，再收到相同请求就返回已有结果，从而避免重复创建。没有接收端支持时，应用先按业务对象查询是否已创建，无法确定则交人核实。\n\n![保存申请后未收到回执，恢复先查原请求；已保存则沿原编号继续，确认未执行才重试，结果仍未知则交人核实。](assets/16.svg)\n\n付款、通知和订单等动作，分别按业务后果设计恢复方法。读取可以重做，已经送出的通知则需要核对实际接收情况；这种区别会直接影响恢复路径。\n\n## 恢复应该从事实继续\n\n模型会话中断后，恢复过程先读取保存的任务状态和实际产物，核对外部动作，再继续未完成部分。不要只让模型猜上次做到哪里。工具失败也应反馈明确：是无权限、输入不适用、服务不可达，还是结果未知。\n\n对可以安全重复的读取，可以重试；对会产生外部影响的写入，需要先核实；对资料缺失或目标冲突，重复调用通常没有帮助。区分这些情况，比设置统一“失败重试三次”更重要。\n\n## 管理者应该要求什么演示\n\n可以请实施者在一项长任务进行中暂停，再恢复；在保存请求超时后查看如何处理；修改一项已确认条件，观察哪些结果被标记需要重做。接手者还应能看懂状态并选择人工完成，而不是只有原开发者知道如何继续。\n\n运行记录应帮助定位，而不只是显示“执行成功”。至少能看到读取范围、所用版本、关键动作结果、未完成项和人工接手。模型写出的过程说明，可以辅助理解，却不能替代这些实际证据。\n\n长任务的成熟，表现为出错后仍能有序继续，且企业知道哪些已经发生。可靠性来自模型能力与执行安排共同建设。\n\n\n\u003ca id=\"do-16\">\u003c/a>\n\n## 做一次暂停与恢复检查\n\n先在允许试用的环境选一项多步任务，例如整理报修材料后建立申请。请实施者安排一次在提交前暂停，再恢复的演示；另一次在提交后结果未明时暂停。检查应使用低影响的试用任务。\n\n暂停时，应能看到下面这些具体记录：\n\n| 要查的内容 | 提交前暂停的示例 |\n| --- | --- |\n| 当前目标 | 建立可由维修团队接手的申请 |\n| 已有材料与产物 | 需求整理稿位置，已核型号和客户 |\n| 已执行动作 | 尚未创建申请 |\n| 未完成项 | 补问故障时间，核齐后提交 |\n| 继续前需核实 | 原需求是否变更、已有产物是否仍适用 |\n\n让接手者只凭这些记录继续，并打开最终申请核对。提交后结果未知的那次，先查询是否已有申请，查到就沿原编号继续；不能确定则交人核实。发现暂停后只能从头问用户所有问题，或重复建了两单，就记录这条失败，请实施者修恢复路径后重做同一任务。\n\n即使目前只用普通聊天，也可以先保存这份交接记录并在新对话中提供。它帮助你理解需要保留什么；团队系统能否自动保存、核实和恢复，则要按上述演示确认。\n"},{"id":"c17","file":"17-怎样评估能力并选择模型.md","title":"第17章｜怎样评估能力并选择模型","html":"\u003ch1>第17章｜怎样评估能力并选择模型\u003c/h1>\n\u003cp>\u003cstrong>企业应按任务选择模型组合，比较合格结果、完整成本、响应时间和维护条件。先明确工作需要，再用相同材料比较候选，就能把模型变化转成可管理的选择。\u003c/strong>\u003c/p>\n\u003cp>\u003ca href=\"#c17/do-17\">本章做法：把比较结果变成一个采用决定\u003c/a>\u003c/p>\n\u003cp>模型和产品变化很快。企业若围绕某个名称组织全部方案，很容易在升级时重新争论。更稳定的做法是先定义任务和判断标准，再用相同材料比较候选，并保留重新评估的能力。\u003c/p>\n\u003ch2>先判断正在比较什么\u003c/h2>\n\u003cp>一个产品可能同时包含模型、检索、工具和界面。某次表现改善，可能来自更强模型，也可能因为资料更完整、工具接通或流程更合理。比较时应尽量保持条件一致；若比较的是整套产品，就明确评价整套方案，不把成绩全部归给模型。\u003c/p>\n\u003cp>任务还需要分类。文字整理、复杂推理、图像识别、程序生成和工具选择，错误方式不同。没有必要期待一个配置在所有任务里最优。\u003c/p>\n\u003ch2>建立小而有代表性的任务集\u003c/h2>\n\u003cp>假设企业准备选择整理订货消息的模型，可以先把“怎样才算整理正确”写在消息旁边，再让候选模型处理同样材料：\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>客户消息示意\u003c/th>\n\u003cth>正确结果应保留什么\u003c/th>\n\u003cth>怎样判断\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>“这次两套，明年可能再加一套”\u003c/td>\n\u003ctd>本次两套，明年一套列意向\u003c/td>\n\u003ctd>检查是否把未来意向加进本单\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>“颜色沿用上次”\u003c/td>\n\u003ctd>需要查对应历史，当前颜色待确认\u003c/td>\n\u003ctd>检查是否编出颜色或引用错客户\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>“先别下单，等我确认”\u003c/td>\n\u003ctd>暂不下单，等待客户确认\u003c/td>\n\u003ctd>检查是否保留否定与条件\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>对照结果后，再记录每种配置的处理时间、人工修改和费用。这样，选择依据就落在同一类真实工作上。模型名称和演示印象可以帮助提出候选，采用决定则由这些比较结果支持。\u003c/p>\n\u003cp>从实际工作选取标准输入、缺项、歧义、否定、变更和异常。保留原始材料、预期结果与判断依据。涉及客户或员工资料时按企业相应规则处理，避免为测试随意扩大数据范围。\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>任务类别\u003c/th>\n\u003cth>评价重点\u003c/th>\n\u003cth>检查办法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>字段提取\u003c/td>\n\u003ctd>关键字段、否定和状态\u003c/td>\n\u003ctd>对照原始片段与采用规则\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>研究与分析\u003c/td>\n\u003ctd>依据、口径和推导\u003c/td>\n\u003ctd>查回材料，复算，比较其他解释\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>内容创作\u003c/td>\n\u003ctd>事实、用途与连贯\u003c/td>\n\u003ctd>按实际读者任务打开成品检查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工具执行\u003c/td>\n\u003ctd>对象、参数与执行结果\u003c/td>\n\u003ctd>读回记录，由接收方继续\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>长任务\u003c/td>\n\u003ctd>完整结果与恢复\u003c/td>\n\u003ctd>暂停后继续，修改条件后重做受影响部分\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>样本不只覆盖最常见情况，也要包含后果严重的错误。但人为挑选的小集合，不适合直接当总体成功率。它帮助发现缺陷并比较候选，后续还需要受控试用观察日常分布。\u003c/p>\n\u003ch2>不同错误不能简单平均\u003c/h2>\n\u003cp>把客户意向写成承诺，比内部标签略有偏差后果更大。总分相同的两个配置，可能一个偶尔措辞不佳，另一个偶尔归错客户。企业应先规定不可接受的错误和必须交人的情况，再比较一般质量。\u003c/p>\n\u003cp>质量判断可以组合几种依据：关键字段对照原材料，计算由程序重算，执行核对系统记录，专业结论由对应人员评价。模型自评可作辅助信息，最终采用上述可检查的结果。\u003c/p>\n\u003ch2>算完整任务成本\u003c/h2>\n\u003cp>单次调用便宜，不代表整项工作便宜。重试、检索、代码执行、子任务、人工复核和维护都应计入。响应较慢也未必坏，复杂经营分析可以等待，客户现场操作则可能需要更快反馈。\u003c/p>\n\u003cp>可以采用分层配置：简单整理使用适当的轻量能力，遇到复杂推理再升级；确定性计算交给程序，知识查询按需进行。升级条件应能观察，例如资料冲突、必要字段缺失或任务类型变化，不能只靠模型自己说“这题很难”。\u003c/p>\n\u003ch2>版本更新怎样管理\u003c/h2>\n\u003cp>模型、提示、工具和资料任何一项变化，都可能改变表现。更新前复测核心任务和历史失败，受控观察后再扩大。记录当时使用的配置，才能在问题发生时还原条件。\u003c/p>\n\u003cp>企业不需要为每次小改做庞大测试，但涉及关键承诺、权限或写入的变化，应有相应验证。选择的目标是获得适合企业的能力组合，并知道何时需要重新判断。\u003c/p>\n\u003cp>\u003ca id=\"do-17\">\u003c/a>\u003c/p>\n\u003ch2>把比较结果变成一个采用决定\u003c/h2>\n\u003cp>先确认你在比较整套产品还是同条件下的模型。使用本章的订货消息与预期，给每个候选相同材料、资料和允许动作，保留实际输出，不让候选只用自己总结的成绩回答。\u003c/p>\n\u003cp>将结果逐项记到\u003ca href=\"#download\" data-download=\"02-AI试做与核对记录.docx\">AI试做与核对记录\u003c/a>：数量与状态是否对、哪些地方需要人工修改、完成耗时、费用怎样取得。对严重错误单独列出，例如编造交期、归错客户，不与一般措辞问题平均掉。\u003c/p>\n\u003cp>接着写一项可执行的选择：\u003cstrong>“先用于需求初稿，关键数量与日期仍核对；暂不自动写正式订单；由销售负责人组织限定试用，观察核对与返工。”\u003c/strong> 这是选择范围的示意，要按你取得的结果修改。\u003c/p>\n\u003cp>若没有候选达到当前用途，先判断缺的是资料、方法还是处理能力，改一处后用原材料重测。若有合格候选，再比较完整任务的成本和接手条件，按\u003ca href=\"#c22/do-22\">第22章\u003c/a>组织试用，而不是把一次小样比较当作全面采用。\u003c/p>\n","text":"# 第17章｜怎样评估能力并选择模型\n\n**企业应按任务选择模型组合，比较合格结果、完整成本、响应时间和维护条件。先明确工作需要，再用相同材料比较候选，就能把模型变化转成可管理的选择。**\n\n[本章做法：把比较结果变成一个采用决定](#do-17)\n\n模型和产品变化很快。企业若围绕某个名称组织全部方案，很容易在升级时重新争论。更稳定的做法是先定义任务和判断标准，再用相同材料比较候选，并保留重新评估的能力。\n\n## 先判断正在比较什么\n\n一个产品可能同时包含模型、检索、工具和界面。某次表现改善，可能来自更强模型，也可能因为资料更完整、工具接通或流程更合理。比较时应尽量保持条件一致；若比较的是整套产品，就明确评价整套方案，不把成绩全部归给模型。\n\n任务还需要分类。文字整理、复杂推理、图像识别、程序生成和工具选择，错误方式不同。没有必要期待一个配置在所有任务里最优。\n\n## 建立小而有代表性的任务集\n\n假设企业准备选择整理订货消息的模型，可以先把“怎样才算整理正确”写在消息旁边，再让候选模型处理同样材料：\n\n| 客户消息示意 | 正确结果应保留什么 | 怎样判断 |\n| --- | --- | --- |\n| “这次两套，明年可能再加一套” | 本次两套，明年一套列意向 | 检查是否把未来意向加进本单 |\n| “颜色沿用上次” | 需要查对应历史，当前颜色待确认 | 检查是否编出颜色或引用错客户 |\n| “先别下单，等我确认” | 暂不下单，等待客户确认 | 检查是否保留否定与条件 |\n\n对照结果后，再记录每种配置的处理时间、人工修改和费用。这样，选择依据就落在同一类真实工作上。模型名称和演示印象可以帮助提出候选，采用决定则由这些比较结果支持。\n\n从实际工作选取标准输入、缺项、歧义、否定、变更和异常。保留原始材料、预期结果与判断依据。涉及客户或员工资料时按企业相应规则处理，避免为测试随意扩大数据范围。\n\n| 任务类别 | 评价重点 | 检查办法 |\n| --- | --- | --- |\n| 字段提取 | 关键字段、否定和状态 | 对照原始片段与采用规则 |\n| 研究与分析 | 依据、口径和推导 | 查回材料，复算，比较其他解释 |\n| 内容创作 | 事实、用途与连贯 | 按实际读者任务打开成品检查 |\n| 工具执行 | 对象、参数与执行结果 | 读回记录，由接收方继续 |\n| 长任务 | 完整结果与恢复 | 暂停后继续，修改条件后重做受影响部分 |\n\n样本不只覆盖最常见情况，也要包含后果严重的错误。但人为挑选的小集合，不适合直接当总体成功率。它帮助发现缺陷并比较候选，后续还需要受控试用观察日常分布。\n\n## 不同错误不能简单平均\n\n把客户意向写成承诺，比内部标签略有偏差后果更大。总分相同的两个配置，可能一个偶尔措辞不佳，另一个偶尔归错客户。企业应先规定不可接受的错误和必须交人的情况，再比较一般质量。\n\n质量判断可以组合几种依据：关键字段对照原材料，计算由程序重算，执行核对系统记录，专业结论由对应人员评价。模型自评可作辅助信息，最终采用上述可检查的结果。\n\n## 算完整任务成本\n\n单次调用便宜，不代表整项工作便宜。重试、检索、代码执行、子任务、人工复核和维护都应计入。响应较慢也未必坏，复杂经营分析可以等待，客户现场操作则可能需要更快反馈。\n\n可以采用分层配置：简单整理使用适当的轻量能力，遇到复杂推理再升级；确定性计算交给程序，知识查询按需进行。升级条件应能观察，例如资料冲突、必要字段缺失或任务类型变化，不能只靠模型自己说“这题很难”。\n\n## 版本更新怎样管理\n\n模型、提示、工具和资料任何一项变化，都可能改变表现。更新前复测核心任务和历史失败，受控观察后再扩大。记录当时使用的配置，才能在问题发生时还原条件。\n\n企业不需要为每次小改做庞大测试，但涉及关键承诺、权限或写入的变化，应有相应验证。选择的目标是获得适合企业的能力组合，并知道何时需要重新判断。\n\n\n\u003ca id=\"do-17\">\u003c/a>\n\n## 把比较结果变成一个采用决定\n\n先确认你在比较整套产品还是同条件下的模型。使用本章的订货消息与预期，给每个候选相同材料、资料和允许动作，保留实际输出，不让候选只用自己总结的成绩回答。\n\n将结果逐项记到[AI试做与核对记录](toolkit/02-AI试做与核对记录.docx)：数量与状态是否对、哪些地方需要人工修改、完成耗时、费用怎样取得。对严重错误单独列出，例如编造交期、归错客户，不与一般措辞问题平均掉。\n\n接着写一项可执行的选择：**“先用于需求初稿，关键数量与日期仍核对；暂不自动写正式订单；由销售负责人组织限定试用，观察核对与返工。”** 这是选择范围的示意，要按你取得的结果修改。\n\n若没有候选达到当前用途，先判断缺的是资料、方法还是处理能力，改一处后用原材料重测。若有合格候选，再比较完整任务的成本和接手条件，按[第22章](22-原型评测与业务验收.md#do-22)组织试用，而不是把一次小样比较当作全面采用。\n"},{"id":"c18","file":"18-从经营结果诊断改造机会.md","title":"第18章｜从经营结果诊断改造机会","html":"\u003ch1>第18章｜从经营结果诊断改造机会\u003c/h1>\n\u003cp>\u003cstrong>诊断从经营结果追到具体原因，再选择能够改变原因的做法。它把“想用AI”的方向，变成一项可以投入、实施和检验的改造。\u003c/strong>\u003c/p>\n\u003cp>\u003ca href=\"#c18/do-18\">本章做法：照着一笔原任务，完成第一轮诊断\u003c/a>\u003c/p>\n\u003cp>企业可能说“销售效率低”“员工不会用知识”“方案制作太慢”。这些描述包含真实困扰，但还不足以决定建设什么。需要沿经营结果、业务路径、能力条件和组织安排逐层查下去。\u003c/p>\n\u003cp>例如销售响应慢，可能是写回复慢，也可能是价格不统一、客户条件不全、技术确认排队，或者企业根本没有可交付资源。这些原因可以同时存在，解决方式却不同。\u003c/p>\n\u003ch2>从一笔任务看见实际过程\u003c/h2>\n\u003cp>挑选几笔近期任务，包含正常完成、返工和没有完成的。查看原始输入、处理记录、等待和交接，不只听负责人概括。访谈可以解释做法，实际记录帮助发现遗漏与不一致。\u003c/p>\n\u003cp>以客户询问一项定制服务为例，销售先整理要求，技术人员确认是否能做，销售补问遗漏条件，再请负责人批准特殊价格，最后形成方案。假设这笔工作的教学记录如下：整理材料20分钟，等待专业确认3小时，补充信息30分钟，等待批准2小时，形成最终文件10分钟。全程6小时，实际处理1小时，等待5小时。将最后10分钟压缩到2分钟，周期只减少8分钟，不能解释为整体效率提升80%。\u003c/p>\n\u003cp>这组时间说明，优先查看等待可能更有价值。若等待来自资料缺项，就改善收集与识别；若完整资料仍排队，就看确认责任和资源；若批准反复使用同样规则，可以讨论把部分决定交给业务负责人。不同原因对应不同改法。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"18\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iODY2IiB2aWV3Qm94PSIwIDAgMzYwIDg2NiIgcm9sZT0iaW1nIj48dGl0bGU+5LuO5a6M5pW05ZGo5pyf5om+5Yiw5pS56YCg6YeN54K5PC90aXRsZT48ZGVzYz7mlZnlrabml7bpl7TmjInmr5TkvovlsZXnpLrvvJrlpITnkIY2MOWIhumSn+OAgeetieW+hTMwMOWIhumSn++8m+e8qeefreacq+atpTjliIbpkp/kvb/lhajnqIvnlLEzNjDlj5gzNTLjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYSIgbWFya2VyV2lkdGg9IjgiIG1hcmtlckhlaWdodD0iOCIgcmVmWD0iNyIgcmVmWT0iNCIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwIEw4IDQgTDAgOCBaIiBmaWxsPSIjMjQ2YTU1Ii8+PC9tYXJrZXI+PC9kZWZzPjxyZWN0IHdpZHRoPSIzNjAiIGhlaWdodD0iODY2IiBmaWxsPSJ3aGl0ZSIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiI+PHRleHQgeD0iMjQiIHk9IjM4IiBmb250LXNpemU9IjI0IiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNjAwIj7ku47lrozmlbTlkajmnJ/mib7liLDmlLnpgKDph43ngrk8L3RleHQ+PHRleHQgeD0iMjQiIHk9IjgyIiBmb250LXNpemU9IjIwIiBmaWxsPSIjNjE3MTZiIiBmb250LXdlaWdodD0iNDAwIj7lgYforr7kuIDpobnlt6XkvZzvvJrlhajnqIszNjDliIbpkp88L3RleHQ+PHRleHQgeD0iMjQiIHk9IjEyNiIgZm9udC1zaXplPSIyMCIgZmlsbD0iIzIwM2YzOCIgZm9udC13ZWlnaHQ9IjYwMCI+5pW055CG5p2Q5paZICAyMOWIhumSnzwvdGV4dD48cmVjdCB4PSIyNCIgeT0iMTQxIiB3aWR0aD0iMTcuMzMzMzMzMzMzMzMzMzMyIiBoZWlnaHQ9IjE4IiByeD0iMiIgZmlsbD0iIzM2NWU4NiIgc3Ryb2tlPSIjMzY1ZTg2IiBzdHJva2Utd2lkdGg9IjEuNCIvPjx0ZXh0IHg9IjI0IiB5PSIxOTUiIGZvbnQtc2l6ZT0iMjAiIGZpbGw9IiMyMDNmMzgiIGZvbnQtd2VpZ2h0PSI2MDAiPuetieW+heS4k+S4muehruiupCAgMTgw5YiG6ZKfPC90ZXh0PjxyZWN0IHg9IjI0IiB5PSIyMTAiIHdpZHRoPSIxNTYuMCIgaGVpZ2h0PSIxOCIgcng9IjIiIGZpbGw9IiM5MzYzMjkiIHN0cm9rZT0iIzkzNjMyOSIgc3Ryb2tlLXdpZHRoPSIxLjQiLz48dGV4dCB4PSIyNCIgeT0iMjY0IiBmb250LXNpemU9IjIwIiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdo 9IjQwMCI+5aSE55CG5LiO562J5b6F5Z2H5oyJMzYw5YiG6ZKf5q+U5L6L5pi+56S6PC90ZXh0PjwvZz48L3N2Zz4=\" alt=\"假设工作全程360分钟，其中等待300分钟；文件生成减少8分钟，使全程变为352分钟。\">\u003c/picture>\u003cfigcaption>\u003cspan>图 18-1\u003c/span>\u003cbutton type=\"button\" class=\"enlarge\" aria-label=\"放大查看图18-1\">放大查看\u003c/button>\u003c/figcaption>\u003c/figure>\n\u003ch2>四层诊断怎样连起来\u003c/h2>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>层次\u003c/th>\n\u003cth>主要问题\u003c/th>\n\u003cth>值得看的证据\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>经营结果\u003c/td>\n\u003ctd>哪项结果不理想，影响多大\u003c/td>\n\u003ctd>周期、质量、成本、收入与客户后果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>业务路径\u003c/td>\n\u003ctd>结果经过哪些处理和交接\u003c/td>\n\u003ctd>原始任务、实际动作、等待、返工\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>能力条件\u003c/td>\n\u003ctd>缺信息、方法、工具还是资源\u003c/td>\n\u003ctd>输入质量、规则、实际系统能力与操作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>组织安排\u003c/td>\n\u003ctd>谁负责、有无时间和授权\u003c/td>\n\u003ctd>接收方式、考核、例外决定与维护责任\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>四层解释应当连起来。例如缩短客户响应，需要减少专业确认前的退回；退回源于现场条件缺失；解决办法是在需求进入时提示缺项，由专业负责人维护必要条件。经营目标、工作变化、AI能力与责任安排，由此形成同一个方案。\u003c/p>\n\u003ch2>区分观察、解释与建议\u003c/h2>\n\u003cp>“抽取的任务中，多次因缺少现场条件退回”是观察。“缺少前置检查导致返工”是解释。“增加 AI 缺项识别”是建议。三者应分别写，否则团队容易把建议当成已经被证明的原因。\u003c/p>\n\u003cp>解释还需要竞争版本。退回可能因为上游不知道要什么，也可能因为下游每次要求不同，或客户暂时无法提供。如果主要原因是规则不一致，单纯要求上游填更多字段可能只会扩大负担。\u003c/p>\n\u003cp>可以先明确必要材料并提供缺项提示，观察同类任务退回是否减少，再看资料齐备后的等待。若退回减少、周期仍长，说明下一步应处理确认排队。诊断在试验后继续更新，逐步找到最值得改变的环节。\u003c/p>\n\u003ch2>识别AI适配的原因\u003c/h2>\n\u003cp>AI较可能改善的环节，包括非标准信息理解、资料关联、候选分析、内容与程序生成。固定计算和字段校验通常更适合程序；物理产能、资金、客户真实需求和利益冲突则需要相应经营安排。\u003c/p>\n\u003cp>某项改造可以混合这些方式。统一规则靠业务决定，整理杂乱输入靠模型，金额计算靠程序，资源承诺由有权人员确认。判断改造价值时，不必要求所有价值都来自AI，重要的是用合理方式改善结果。\u003c/p>\n\u003cp>专业工作也可以这样拆开。专家用于搜索资料、比较案例、初步分析和表达结论的时间，可能由AI协助减少；专家集中处理影响结果的关键差异。沿实际任务逐项试，就能找到既发挥专业经验、又扩大服务能力的组合。\u003c/p>\n\u003ch2>一份诊断应该交出什么\u003c/h2>\n\u003cp>有用的诊断应明确目标结果、当前路径、主要限制及证据、仍有争议的解释、可选办法和首轮验证。对未知数量、成本和原因写明未知，安排最小核实，不用整齐数字填空。\u003c/p>\n\u003cp>决策者据此决定为什么先做这里、安排谁参与、第一轮投入验证什么。诊断的交付物应把原因、备选办法和首轮工作放在一起，使团队可以从解释进入行动。\u003c/p>\n\u003cp>\u003ca id=\"do-18\">\u003c/a>\u003c/p>\n\u003ch2>照着一笔原任务，完成第一轮诊断\u003c/h2>\n\u003cp>准备一笔已经完成但有返工的任务，打开原消息、处理稿、退回记录和最终结果。请实际操作者与下游接手者一起还原；若只有你自己，就按时间顺序回看这些记录。\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>写起点和终点。\u003c/strong> 例如从收到安装询价，到销售取得经必要确认、可发送的方案。不要在“AI已生成文字”处提前结束计时。\u003c/li>\n\u003cli>\u003cstrong>按实际记录写过程。\u003c/strong> 谁收到什么，处理了多久，等谁，为什么退回。不能确定的时间注明待补，不先估一个漂亮数字。\u003c/li>\n\u003cli>\u003cstrong>把原因变成可核的问题。\u003c/strong> 缺现场条件，是销售不知道要问、专业人员标准不一，还是客户暂时拿不到？找到一笔退回材料，向双方分别核实。\u003c/li>\n\u003cli>\u003cstrong>选一个首轮改变。\u003c/strong> 若双方确认必要条件一直缺失，就先统一条件说明，再试AI提取和缺项提示；若资料齐备仍排队，就先处理受理与资源，不能只加快生成。\u003c/li>\n\u003c/ol>\n\u003cp>\u003ca href=\"#download\" data-download=\"01-改造机会与现状记录.docx\">改造机会与现状记录\u003c/a>可以这样填写：\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项目\u003c/th>\n\u003cth>本章示意填写\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>原任务\u003c/td>\n\u003ctd>客户询问安装服务，销售准备可发送方案\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>观察\u003c/td>\n\u003ctd>一笔任务因缺地点与现场条件被退回\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>当前解释\u003c/td>\n\u003ctd>上游不知道专业确认必需的条件，需用其他任务核实\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>先做的改变\u003c/td>\n\u003ctd>专业人员列必需项，销售补问，AI先整理并提示缺项\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>谁配合\u003c/td>\n\u003ctd>销售提供原话，专业人员核条件，实施者制作有限版本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>怎样检查\u003c/td>\n\u003ctd>下游是否能开始判断，退回原因是否改变，整段处理与等待怎样变化\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>把这张记录交给参与者核对。若大家对原因仍不同意，写明要看哪份材料、由谁查，再继续核实。原因与首轮改变能够连起来时，转到\u003ca href=\"#c19/do-19\">第19章\u003c/a>确定范围。\u003c/p>\n","text":"# 第18章｜从经营结果诊断改造机会\n\n**诊断从经营结果追到具体原因，再选择能够改变原因的做法。它把“想用AI”的方向，变成一项可以投入、实施和检验的改造。**\n\n[本章做法：照着一笔原任务，完成第一轮诊断](#do-18)\n\n企业可能说“销售效率低”“员工不会用知识”“方案制作太慢”。这些描述包含真实困扰，但还不足以决定建设什么。需要沿经营结果、业务路径、能力条件和组织安排逐层查下去。\n\n例如销售响应慢，可能是写回复慢，也可能是价格不统一、客户条件不全、技术确认排队，或者企业根本没有可交付资源。这些原因可以同时存在，解决方式却不同。\n\n## 从一笔任务看见实际过程\n\n挑选几笔近期任务，包含正常完成、返工和没有完成的。查看原始输入、处理记录、等待和交接，不只听负责人概括。访谈可以解释做法，实际记录帮助发现遗漏与不一致。\n\n以客户询问一项定制服务为例，销售先整理要求，技术人员确认是否能做，销售补问遗漏条件，再请负责人批准特殊价格，最后形成方案。假设这笔工作的教学记录如下：整理材料20分钟，等待专业确认3小时，补充信息30分钟，等待批准2小时，形成最终文件10分钟。全程6小时，实际处理1小时，等待5小时。将最后10分钟压缩到2分钟，周期只减少8分钟，不能解释为整体效率提升80%。\n\n这组时间说明，优先查看等待可能更有价值。若等待来自资料缺项，就改善收集与识别；若完整资料仍排队，就看确认责任和资源；若批准反复使用同样规则，可以讨论把部分决定交给业务负责人。不同原因对应不同改法。\n\n![假设工作全程360分钟，其中等待300分钟；文件生成减少8分钟，使全程变为352分钟。](assets/18.svg)\n\n## 四层诊断怎样连起来\n\n| 层次 | 主要问题 | 值得看的证据 |\n| --- | --- | --- |\n| 经营结果 | 哪项结果不理想，影响多大 | 周期、质量、成本、收入与客户后果 |\n| 业务路径 | 结果经过哪些处理和交接 | 原始任务、实际动作、等待、返工 |\n| 能力条件 | 缺信息、方法、工具还是资源 | 输入质量、规则、实际系统能力与操作 |\n| 组织安排 | 谁负责、有无时间和授权 | 接收方式、考核、例外决定与维护责任 |\n\n四层解释应当连起来。例如缩短客户响应，需要减少专业确认前的退回；退回源于现场条件缺失；解决办法是在需求进入时提示缺项，由专业负责人维护必要条件。经营目标、工作变化、AI能力与责任安排，由此形成同一个方案。\n\n## 区分观察、解释与建议\n\n“抽取的任务中，多次因缺少现场条件退回”是观察。“缺少前置检查导致返工”是解释。“增加 AI 缺项识别”是建议。三者应分别写，否则团队容易把建议当成已经被证明的原因。\n\n解释还需要竞争版本。退回可能因为上游不知道要什么，也可能因为下游每次要求不同，或客户暂时无法提供。如果主要原因是规则不一致，单纯要求上游填更多字段可能只会扩大负担。\n\n可以先明确必要材料并提供缺项提示，观察同类任务退回是否减少，再看资料齐备后的等待。若退回减少、周期仍长，说明下一步应处理确认排队。诊断在试验后继续更新，逐步找到最值得改变的环节。\n\n## 识别AI适配的原因\n\nAI较可能改善的环节，包括非标准信息理解、资料关联、候选分析、内容与程序生成。固定计算和字段校验通常更适合程序；物理产能、资金、客户真实需求和利益冲突则需要相应经营安排。\n\n某项改造可以混合这些方式。统一规则靠业务决定，整理杂乱输入靠模型，金额计算靠程序，资源承诺由有权人员确认。判断改造价值时，不必要求所有价值都来自AI，重要的是用合理方式改善结果。\n\n专业工作也可以这样拆开。专家用于搜索资料、比较案例、初步分析和表达结论的时间，可能由AI协助减少；专家集中处理影响结果的关键差异。沿实际任务逐项试，就能找到既发挥专业经验、又扩大服务能力的组合。\n\n## 一份诊断应该交出什么\n\n有用的诊断应明确目标结果、当前路径、主要限制及证据、仍有争议的解释、可选办法和首轮验证。对未知数量、成本和原因写明未知，安排最小核实，不用整齐数字填空。\n\n决策者据此决定为什么先做这里、安排谁参与、第一轮投入验证什么。诊断的交付物应把原因、备选办法和首轮工作放在一起，使团队可以从解释进入行动。\n\n\u003ca id=\"do-18\">\u003c/a>\n\n## 照着一笔原任务，完成第一轮诊断\n\n准备一笔已经完成但有返工的任务，打开原消息、处理稿、退回记录和最终结果。请实际操作者与下游接手者一起还原；若只有你自己，就按时间顺序回看这些记录。\n\n1. **写起点和终点。** 例如从收到安装询价，到销售取得经必要确认、可发送的方案。不要在“AI已生成文字”处提前结束计时。\n2. **按实际记录写过程。** 谁收到什么，处理了多久，等谁，为什么退回。不能确定的时间注明待补，不先估一个漂亮数字。\n3. **把原因变成可核的问题。** 缺现场条件，是销售不知道要问、专业人员标准不一，还是客户暂时拿不到？找到一笔退回材料，向双方分别核实。\n4. **选一个首轮改变。** 若双方确认必要条件一直缺失，就先统一条件说明，再试AI提取和缺项提示；若资料齐备仍排队，就先处理受理与资源，不能只加快生成。\n\n[改造机会与现状记录](toolkit/01-改造机会与现状记录.docx)可以这样填写：\n\n| 项目 | 本章示意填写 |\n| --- | --- |\n| 原任务 | 客户询问安装服务，销售准备可发送方案 |\n| 观察 | 一笔任务因缺地点与现场条件被退回 |\n| 当前解释 | 上游不知道专业确认必需的条件，需用其他任务核实 |\n| 先做的改变 | 专业人员列必需项，销售补问，AI先整理并提示缺项 |\n| 谁配合 | 销售提供原话，专业人员核条件，实施者制作有限版本 |\n| 怎样检查 | 下游是否能开始判断，退回原因是否改变，整段处理与等待怎样变化 |\n\n把这张记录交给参与者核对。若大家对原因仍不同意，写明要看哪份材料、由谁查，再继续核实。原因与首轮改变能够连起来时，转到[第19章](19-怎样选择场景并管理试点组合.md#do-19)确定范围。\n"},{"id":"c19","file":"19-怎样选择场景并管理试点组合.md","title":"第19章｜怎样选择场景并管理试点组合","html":"\u003ch1>第19章｜怎样选择场景并管理试点组合\u003c/h1>\n\u003cp>\u003cstrong>首个场景宜选择重要、能形成有用结果、又能在当前条件下检验的一类工作。范围确定得好，企业既能得到实际改善，也能看清下一轮该投入什么。\u003c/strong>\u003c/p>\n\u003cp>\u003ca href=\"#c19/do-19\">本章做法：把一个候选改造写成可启动的试点\u003c/a>\u003c/p>\n\u003cp>企业常在两种极端之间摇摆：一开始就希望重做全部业务，或者挑一个无关紧要的小工具快速展示。前者难以定位失败，后者即使成功也无法支持经营决定。试点需要在价值与可验证性之间取得合适范围。\u003c/p>\n\u003ch2>先把场景写成一次工作\u003c/h2>\n\u003cp>“AI销售”是方向，“客户提出需求后，形成经过必要确认、可由销售发送的方案”才开始成为场景。它说明触发、输入、终点和使用者。进一步要限定客户类型、产品范围、输入形式和例外，才能确定首轮建设。\u003c/p>\n\u003cp>小范围可以只覆盖标准服务，但应做到一个明确交出点：专业人员收到足以判断的材料，或销售拿到经过必要确认的方案。后续发送、签约和履约继续由既有岗位承担。这样，首轮范围虽小，仍能被真正使用。\u003c/p>\n\u003ch2>用五类问题比较机会\u003c/h2>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>比较维度\u003c/th>\n\u003cth>需要回答的问题\u003c/th>\n\u003cth>对选择的影响\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>经营重要性\u003c/td>\n\u003ctd>影响哪项结果，改善是否被需要\u003c/td>\n\u003ctd>决定投入优先级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>主要原因\u003c/td>\n\u003ctd>哪段工作限制结果，有什么依据\u003c/td>\n\u003ctd>决定改造位置\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AI适配\u003c/td>\n\u003ctd>哪项能力能够改变该步骤\u003c/td>\n\u003ctd>决定采用模型、程序或人员\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>当前条件\u003c/td>\n\u003ctd>资料、权限、人员和系统怎样取得\u003c/td>\n\u003ctd>决定先补什么、怎样实现\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>检验成本\u003c/td>\n\u003ctd>多久能获得可用结果，怎样检查\u003c/td>\n\u003ctd>决定首轮范围和资源\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>评分可以帮助会议讨论，但分值只是把假设显式化，并非成功概率。若两个场景分数接近，应该看差异来自什么未知，能否先花很小成本核实，而不是争论小数点。\u003c/p>\n\u003ch2>一个候选工作可以有多种方案\u003c/h2>\n\u003cp>以服务需求整理为例，可以先统一表单与规则，也可以在表单上加入AI处理自由表达，还可以进一步接入业务系统完成后续分配。三种方案的价值、成本和依赖不同。\u003c/p>\n\u003cp>如果客户输入本来就能标准化，表单已解决主要缺项，加入AI反而增加核对，第一种就可能足够。若输入来自多种消息，模型整理能明显减少人工搬运，第二种值得试。只有下游确实需要自动接续、且连接条件成立，才进一步评估第三种。\u003c/p>\n\u003cp>比较这些路径，能看出每增加一层建设，换来什么额外价值。企业可以先选最值得的组合，保留将来扩展的接口与方法，再根据使用结果增加能力。\u003c/p>\n\u003ch2>怎样安排试点组合\u003c/h2>\n\u003cp>企业可以把候选分成近期可试、需先补条件和暂不投入。近期试点不宜过多，因为业务骨干、技术和管理注意力常是同一批资源。每项都启动，可能使每项都得不到足够反馈。\u003c/p>\n\u003cp>组合里可以有改善现有工作的项目，也可以有探索新服务的项目。前者以当前成本和质量为基线，后者先看客户是否使用、交付是否成立。分别设置评价问题，能使不同项目得到适合的管理，而共同争取的业务骨干与实施资源仍需统一安排。\u003c/p>\n\u003cp>共用资料与组件可以降低成本，但复用最多的场景不一定最重要。如果当前主要问题是获客不足，即使售后最容易接入已有系统，也不应仅为复用而优先投入。经营瓶颈仍是选择依据。\u003c/p>\n\u003ch2>提前说明扩大、调整与停止条件\u003c/h2>\n\u003cp>试点开始时可以约定几种后续决定：交出物合格、下游能接续，就进入日常试用；资料规则需要补齐，就先组织业务确认；平台条件限制实现，就换连接方式或缩小范围；服务被采用且经济性成立，再投入下一阶段。这些决定使阶段成果有明确去处。\u003c/p>\n\u003cp>停止并不意味着所有投入归零。有效知识、失败样例和已确认接口条件都可以留下，供后续工作使用。但这些资产是否值得继续维护，也要另作判断，不能仅因已经投入就继续扩建。\u003c/p>\n\u003cp>试点的成果应是一项更清楚的经营决定：继续投什么、为什么，以及还要承担哪些未知。\u003c/p>\n\u003cp>\u003ca id=\"do-19\">\u003c/a>\u003c/p>\n\u003ch2>把一个候选改造写成可启动的试点\u003c/h2>\n\u003cp>拿第18章的现状记录，先列出两种可做的办法，再比较每增加一段建设究竟换来什么。以安装需求为例：\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可做办法\u003c/th>\n\u003cth>先查什么\u003c/th>\n\u003cth>什么结果支持采用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>统一表单与字段提示\u003c/td>\n\u003ctd>客户和销售能否按统一格式提供材料\u003c/td>\n\u003ctd>已能显著减少缺项，操作负担可接受\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>在原始消息后加AI整理与缺项提示\u003c/td>\n\u003ctd>输入是否多样，整理是否确实耗时\u003c/td>\n\u003ctd>整理结果可核对，接手者能用，总负担有改善\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>继续连接专业确认与正式记录\u003c/td>\n\u003ctd>下游是否需要自动接续，平台能否读写\u003c/td>\n\u003ctd>能按权限保存到正确对象，下游从正式入口接手\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>先找最影响选择的未知。例如不知道统一表单是否足够，就先请销售拿几笔旧任务试填，不必先开发完整应用。得到材料后，在\u003ca href=\"#download\" data-download=\"03-试点范围与任务说明.docx\">试点范围与任务说明\u003c/a>写清本轮约定：\u003c/p>\n\u003cblockquote>\n\u003cp>只试标准安装服务；输入为客户原消息与当前必要条件说明；输出为带原话依据的需求字段和待补问题；销售核对后交专业人员；本轮先不自动承诺价格或日期。\u003c/p>\n\u003c/blockquote>\n\u003cp>再填写谁供材料、谁实现、谁判断结果、下一次查看哪笔实际任务。首轮若能交出可接手的材料，就进入限定试用；若字段标准不清，先让业务负责人确认；若AI整理每笔都需要重做，就缩小范围或比较更轻的做法。\u003c/p>\n\u003cp>如果手上还有其他候选，把它们放在同一张安排表里，再核是否争用同一批业务骨干与实施者。以下是排序示意：\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>候选工作\u003c/th>\n\u003cth>当前最关键条件\u003c/th>\n\u003cth>先放哪一类\u003c/th>\n\u003cth>下一步安排\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>安装需求整理\u003c/td>\n\u003ctd>原消息可取得，专业人员可确认必要条件\u003c/td>\n\u003ctd>近期可试\u003c/td>\n\u003ctd>先完成有限版本与实际交接\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>自动预约上门\u003c/td>\n\u003ctd>当前账号能否查写排班仍未核实\u003c/td>\n\u003ctd>先补条件\u003c/td>\n\u003ctd>指定实施者核账号与一次预约，不同时许诺完整建设\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>客户设备使用分析\u003c/td>\n\u003ctd>愿意使用结果的客户、专业复核资源仍未找到\u003c/td>\n\u003ctd>保留候选\u003c/td>\n\u003ctd>先由业务人员核服务用途与配合资源\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>分别写每项需要谁参与、何时提供什么材料。若第一项已经占满某位骨干的配合时间，发起人就决定其他项先补条件或延后；不要让同一人同时承诺互相冲突的任务。每轮结果回来，更新状态和下一步，原先暂缓的项目也据新条件重排。\u003c/p>\n\u003cp>可启动的终点，是参与者知道要做哪件事、下一次拿什么来看、哪种结果支持继续。每项都能说清这些内容、共享资源也安排得过来，组合才有实际推进顺序。\u003c/p>\n","text":"# 第19章｜怎样选择场景并管理试点组合\n\n**首个场景宜选择重要、能形成有用结果、又能在当前条件下检验的一类工作。范围确定得好，企业既能得到实际改善，也能看清下一轮该投入什么。**\n\n[本章做法：把一个候选改造写成可启动的试点](#do-19)\n\n企业常在两种极端之间摇摆：一开始就希望重做全部业务，或者挑一个无关紧要的小工具快速展示。前者难以定位失败，后者即使成功也无法支持经营决定。试点需要在价值与可验证性之间取得合适范围。\n\n## 先把场景写成一次工作\n\n“AI销售”是方向，“客户提出需求后，形成经过必要确认、可由销售发送的方案”才开始成为场景。它说明触发、输入、终点和使用者。进一步要限定客户类型、产品范围、输入形式和例外，才能确定首轮建设。\n\n小范围可以只覆盖标准服务，但应做到一个明确交出点：专业人员收到足以判断的材料，或销售拿到经过必要确认的方案。后续发送、签约和履约继续由既有岗位承担。这样，首轮范围虽小，仍能被真正使用。\n\n## 用五类问题比较机会\n\n| 比较维度 | 需要回答的问题 | 对选择的影响 |\n| --- | --- | --- |\n| 经营重要性 | 影响哪项结果，改善是否被需要 | 决定投入优先级 |\n| 主要原因 | 哪段工作限制结果，有什么依据 | 决定改造位置 |\n| AI适配 | 哪项能力能够改变该步骤 | 决定采用模型、程序或人员 |\n| 当前条件 | 资料、权限、人员和系统怎样取得 | 决定先补什么、怎样实现 |\n| 检验成本 | 多久能获得可用结果，怎样检查 | 决定首轮范围和资源 |\n\n评分可以帮助会议讨论，但分值只是把假设显式化，并非成功概率。若两个场景分数接近，应该看差异来自什么未知，能否先花很小成本核实，而不是争论小数点。\n\n## 一个候选工作可以有多种方案\n\n以服务需求整理为例，可以先统一表单与规则，也可以在表单上加入AI处理自由表达，还可以进一步接入业务系统完成后续分配。三种方案的价值、成本和依赖不同。\n\n如果客户输入本来就能标准化，表单已解决主要缺项，加入AI反而增加核对，第一种就可能足够。若输入来自多种消息，模型整理能明显减少人工搬运，第二种值得试。只有下游确实需要自动接续、且连接条件成立，才进一步评估第三种。\n\n比较这些路径，能看出每增加一层建设，换来什么额外价值。企业可以先选最值得的组合，保留将来扩展的接口与方法，再根据使用结果增加能力。\n\n## 怎样安排试点组合\n\n企业可以把候选分成近期可试、需先补条件和暂不投入。近期试点不宜过多，因为业务骨干、技术和管理注意力常是同一批资源。每项都启动，可能使每项都得不到足够反馈。\n\n组合里可以有改善现有工作的项目，也可以有探索新服务的项目。前者以当前成本和质量为基线，后者先看客户是否使用、交付是否成立。分别设置评价问题，能使不同项目得到适合的管理，而共同争取的业务骨干与实施资源仍需统一安排。\n\n共用资料与组件可以降低成本，但复用最多的场景不一定最重要。如果当前主要问题是获客不足，即使售后最容易接入已有系统，也不应仅为复用而优先投入。经营瓶颈仍是选择依据。\n\n## 提前说明扩大、调整与停止条件\n\n试点开始时可以约定几种后续决定：交出物合格、下游能接续，就进入日常试用；资料规则需要补齐，就先组织业务确认；平台条件限制实现，就换连接方式或缩小范围；服务被采用且经济性成立，再投入下一阶段。这些决定使阶段成果有明确去处。\n\n停止并不意味着所有投入归零。有效知识、失败样例和已确认接口条件都可以留下，供后续工作使用。但这些资产是否值得继续维护，也要另作判断，不能仅因已经投入就继续扩建。\n\n试点的成果应是一项更清楚的经营决定：继续投什么、为什么，以及还要承担哪些未知。\n\n\n\u003ca id=\"do-19\">\u003c/a>\n\n## 把一个候选改造写成可启动的试点\n\n拿第18章的现状记录，先列出两种可做的办法，再比较每增加一段建设究竟换来什么。以安装需求为例：\n\n| 可做办法 | 先查什么 | 什么结果支持采用 |\n| --- | --- | --- |\n| 统一表单与字段提示 | 客户和销售能否按统一格式提供材料 | 已能显著减少缺项，操作负担可接受 |\n| 在原始消息后加AI整理与缺项提示 | 输入是否多样，整理是否确实耗时 | 整理结果可核对，接手者能用，总负担有改善 |\n| 继续连接专业确认与正式记录 | 下游是否需要自动接续，平台能否读写 | 能按权限保存到正确对象，下游从正式入口接手 |\n\n先找最影响选择的未知。例如不知道统一表单是否足够，就先请销售拿几笔旧任务试填，不必先开发完整应用。得到材料后，在[试点范围与任务说明](toolkit/03-试点范围与任务说明.docx)写清本轮约定：\n\n> 只试标准安装服务；输入为客户原消息与当前必要条件说明；输出为带原话依据的需求字段和待补问题；销售核对后交专业人员；本轮先不自动承诺价格或日期。\n\n再填写谁供材料、谁实现、谁判断结果、下一次查看哪笔实际任务。首轮若能交出可接手的材料，就进入限定试用；若字段标准不清，先让业务负责人确认；若AI整理每笔都需要重做，就缩小范围或比较更轻的做法。\n\n如果手上还有其他候选，把它们放在同一张安排表里，再核是否争用同一批业务骨干与实施者。以下是排序示意：\n\n| 候选工作 | 当前最关键条件 | 先放哪一类 | 下一步安排 |\n| --- | --- | --- | --- |\n| 安装需求整理 | 原消息可取得，专业人员可确认必要条件 | 近期可试 | 先完成有限版本与实际交接 |\n| 自动预约上门 | 当前账号能否查写排班仍未核实 | 先补条件 | 指定实施者核账号与一次预约，不同时许诺完整建设 |\n| 客户设备使用分析 | 愿意使用结果的客户、专业复核资源仍未找到 | 保留候选 | 先由业务人员核服务用途与配合资源 |\n\n分别写每项需要谁参与、何时提供什么材料。若第一项已经占满某位骨干的配合时间，发起人就决定其他项先补条件或延后；不要让同一人同时承诺互相冲突的任务。每轮结果回来，更新状态和下一步，原先暂缓的项目也据新条件重排。\n\n可启动的终点，是参与者知道要做哪件事、下一次拿什么来看、哪种结果支持继续。每项都能说清这些内容、共享资源也安排得过来，组合才有实际推进顺序。\n"},{"id":"c20","file":"20-重设计流程分工与授权.md","title":"第20章｜重设计流程、分工与授权","html":"\u003ch1>第20章｜重设计流程、分工与授权\u003c/h1>\n\u003cp>\u003cstrong>AI进入流程后，应把各项判断与动作重新分配给人、模型和程序，让下一岗位更容易接手，并撤去已被替代的旧工作。\u003c/strong>\u003c/p>\n\u003cp>\u003ca href=\"#c20/do-20\">本章做法：给一次交接写清接收条件与批准范围\u003c/a>\u003c/p>\n\u003cp>原有工作中，熟练员工常把信息收集、专业判断、计算、协调和表达混在一起完成。AI可以承担其中部分动作，但拆开以后必须重新连接，否则容易出现“每一步都有人做，整件事却没人负责”。\u003c/p>\n\u003ch2>从交出物反推责任\u003c/h2>\n\u003cp>先明确下一位接手者需要什么。专业人员确认服务范围，需要客户要求、设备条件和未决项；批准人需要最终内容、计算依据与特殊安排。设计交接时，把这些信息组织在一起，让对方能直接开始自己的判断。\u003c/p>\n\u003cp>可以把它与给家人订一桌饭作对照。负责联系餐厅的人先问清人数和忌口，把菜单与价格交给付款的人确认，再通知餐厅准备。传递“已经同意”时，要带上同意的是哪份菜单；后来增加一道菜，需要重新确认变化的费用。每次交接都有具体内容，对方才能继续。\u003c/p>\n\u003cp>企业安排设备安装也一样。销售交出客户、设备和现场条件；AI帮助整理并标出缺项；专业人员确认能否安装；程序按已确认的项目计算费用；有权负责人查看这份具体方案，决定是否采用特殊安排。销售发送后，把客户答复记回同一项工作，排班人员据已确认条件安排人员。每一位接手者都应看到前一步确认了什么、还留下什么问题。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"20\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iOTA0IiB2aWV3Qm94PSIwIDAgMzYwIDkwNCIgcm9sZT0iaW1nIj48dGl0bGU+5a6J6KOF5pa55qGI5oCO5qC36YCQ5q2l5a6M5oiQPC90aXRsZT48ZGVzYz7pnIDmsYLjgIHkuJPkuJrliKTmlq3jgIHotLnnlKjlkozmibnlh4blvaLmiJDlj6/lj5HpgIHmlrnmoYjvvIzlrqLmiLfnoa7orqTlkI7mjpLnj63nu6fnu63vvJvkuqTmjqXluKblhbfkvZPlhoXlrrnjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYSIgbWFya2VyV2lkdGg9IjgiIG1hcmtlckhlaWdodD0iOCIgcmVmWD0iNyIgcmVmWT0iNCIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwIEw4IDQgTDAgOCBaIiBmaWxsPSIjMjQ2YTU1Ii8+PC9tYXJrZXI+PC9kZWZzPjxyZWN0IHdpZHRoPSIzNjAiIGhlaWdodD0iOTA0IiBmaWxsPSJ3aGl0ZSI
