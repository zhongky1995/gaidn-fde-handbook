003c/span>\u003cbutton type=\"button\" class=\"enlarge\" aria-label=\"放大查看图20-1\">放大查看\u003c/button>\u003c/figcaption>\u003c/figure>\n\u003ch2>人机分工为什么要按后果区分\u003c/h2>\n\u003cp>AI可以帮助解释非标准输入、提出追问、比较方案和起草内容。固定规则检查与计算适合程序执行；专业事实和特殊例外则由对应责任人判断。某些低影响动作可自动完成，另一些涉及客户承诺、资源占用或费用，应按企业授权处理。\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>决策或动作\u003c/th>\n\u003cth>可考虑的承担方式\u003c/th>\n\u003cth>必须明确的条件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>输入整理与主题归类\u003c/td>\n\u003ctd>模型处理，按风险抽查或复核\u003c/td>\n\u003ctd>原始依据、未知与纠错入口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>固定金额计算\u003c/td>\n\u003ctd>程序\u003c/td>\n\u003ctd>当前规则、参数与舍入方式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>专业适配判断\u003c/td>\n\u003ctd>具备能力的人员，AI协助\u003c/td>\n\u003ctd>材料充分、判断标准与责任\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>常规低影响更新\u003c/td>\n\u003ctd>在受限条件下自动执行\u003c/td>\n\u003ctd>身份、范围、可追查及异常接手\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>重要承诺和例外\u003c/td>\n\u003ctd>有权负责人决定\u003c/td>\n\u003ctd>最终内容、版本、影响与批准记录\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>分工可以随着能力和经验变化调整。先让AI整理材料、人员逐项核对，经过足够同类任务观察后，可以把稳定低影响部分转为抽查，让专业人员集中处理差异与例外。调整时同步改变工具范围、检查方法和接手安排。\u003c/p>\n\u003ch2>人工复核怎样才有作用\u003c/h2>\n\u003cp>复核人需要有能力、依据和时间。让员工一天批准大量看不见原始资料的结果，人工参与很可能退化为机械点击。应突出真正需要判断的差异、依据与未决项，减少重复阅读。\u003c/p>\n\u003cp>不同错误需要不同检查。数量与身份可以对照原始记录，金额可由程序重算，专业结论需要专业依据。复核也应能退回并指出原因，让错误进入方法改进，而不是由每个人私下修好后消失。\u003c/p>\n\u003cp>复核负担高时，先查看核对方式是否合适。若员工每次都要翻完整原文，可以让结果直接关联依据位置；若每个字段都要求同样强度审查，可以集中处理影响数量、费用和承诺的关键项。仍需大量专业重做的部分，则保留人工主导。\u003c/p>\n\u003ch2>批准必须对应具体内容\u003c/h2>\n\u003cp>批准了一个草稿，之后数量、价格或履约条件改变，原批准是否仍有效，需要明确规则。重要改动通常应重新检查受影响部分，而不是只保留一个“已批准”状态。\u003c/p>\n\u003cp>写入或发送时，系统把待提交的内容版本与批准记录核对。版本相同即可继续；内容改变则重新检查受影响部分。这样，批准人的判断与最终执行保持对应，也能处理批准后他人修改的情况。\u003c/p>\n\u003ch2>例外应该去哪儿\u003c/h2>\n\u003cp>流程要为资料缺失、规则冲突、工具失败和结果未知安排不同路径。能补资料的由相应人员补；需要政策决定的升级负责人；系统故障时采用既定人工方式，并标记以后补录；执行结果未知时先核实，避免重复动作。\u003c/p>\n\u003cp>运行时记录例外原因，可以继续改进流程。同类缺项反复发生，就改输入说明；某条规则频繁引起争议，就交负责人澄清；故障接手耗时，就改善状态展示。例外路径也成为组织学习的入口。\u003c/p>\n\u003ch2>删除旧工作，才可能释放时间\u003c/h2>\n\u003cp>新系统如果要求员工先填新表、再发原来的聊天消息、最后维护旧报表，AI节省的几分钟可能被新增管理消耗。上线前应逐项明确哪些旧动作停止，什么记录成为正式入口，谁负责与上下游一致。\u003c/p>\n\u003cp>评价时沿完整工作计算。上游与下游的处理、等待和核对都进入同一本账，团队才有动力共同优化交接。业务负责人负责维护这条完整路径，下一章将进一步解释不同系统怎样支持它。\u003c/p>\n\u003cp>\u003ca id=\"do-20\">\u003c/a>\u003c/p>\n\u003ch2>给一次交接写清接收条件与批准范围\u003c/h2>\n\u003cp>先选最容易退回的一次交接，例如销售把安装需求交给专业人员。双方拿同一笔原材料，在\u003ca href=\"#download\" data-download=\"04-分工授权与岗位调整表.docx\">分工授权与岗位调整表\u003c/a>一起填写：\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>交接要素\u003c/th>\n\u003cth>示意填写\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>上游交什么\u003c/td>\n\u003ctd>客户与设备、地点、必要现场条件、原话与仍未确定项\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>下游先检查什么\u003c/td>\n\u003ctd>是否能确定适用服务，关键现场条件是否足以开始判断\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>不满足时怎样办\u003c/td>\n\u003ctd>写明缺项退给销售补问；原任务保留当前状态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>满足时怎样继续\u003c/td>\n\u003ctd>专业人员给出可安装范围与限制，程序按确认项目算费用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>谁可批准\u003c/td>\n\u003ctd>有权负责人批准当前版本的内容与特殊安排\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>变化怎样处理\u003c/td>\n\u003ctd>数量或条件变更后，重核受影响内容与批准\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>让上游按这张表交一次，下游实际打开并继续处理，不由原作者替他口头补齐所有背景。随后故意换一项条件，例如把两套改成三套，检查旧费用和批准是否仍被沿用。若仍能直接发送旧方案，先修复这条内容与批准的对应，再重复原任务。\u003c/p>\n\u003cp>最后写下哪一个旧动作可以停止。例如正式需求记录已能被专业人员查看，就不再要求销售重新抄一份聊天摘要。把停止旧动作、维护新入口和例外上报交给具体责任人。\u003c/p>\n","text":"# 第20章｜重设计流程、分工与授权\n\n**AI进入流程后，应把各项判断与动作重新分配给人、模型和程序，让下一岗位更容易接手，并撤去已被替代的旧工作。**\n\n[本章做法：给一次交接写清接收条件与批准范围](#do-20)\n\n原有工作中，熟练员工常把信息收集、专业判断、计算、协调和表达混在一起完成。AI可以承担其中部分动作，但拆开以后必须重新连接，否则容易出现“每一步都有人做，整件事却没人负责”。\n\n## 从交出物反推责任\n\n先明确下一位接手者需要什么。专业人员确认服务范围，需要客户要求、设备条件和未决项；批准人需要最终内容、计算依据与特殊安排。设计交接时，把这些信息组织在一起，让对方能直接开始自己的判断。\n\n可以把它与给家人订一桌饭作对照。负责联系餐厅的人先问清人数和忌口，把菜单与价格交给付款的人确认，再通知餐厅准备。传递“已经同意”时，要带上同意的是哪份菜单；后来增加一道菜，需要重新确认变化的费用。每次交接都有具体内容，对方才能继续。\n\n企业安排设备安装也一样。销售交出客户、设备和现场条件；AI帮助整理并标出缺项；专业人员确认能否安装；程序按已确认的项目计算费用；有权负责人查看这份具体方案，决定是否采用特殊安排。销售发送后，把客户答复记回同一项工作，排班人员据已确认条件安排人员。每一位接手者都应看到前一步确认了什么、还留下什么问题。\n\n![安装要求经过销售与AI整理、专业确认、程序计算和负责人批准，成为可发送的方案；客户答复回到原工作，供排班继续。](assets/20.svg)\n\n## 人机分工为什么要按后果区分\n\nAI可以帮助解释非标准输入、提出追问、比较方案和起草内容。固定规则检查与计算适合程序执行；专业事实和特殊例外则由对应责任人判断。某些低影响动作可自动完成，另一些涉及客户承诺、资源占用或费用，应按企业授权处理。\n\n| 决策或动作 | 可考虑的承担方式 | 必须明确的条件 |\n| --- | --- | --- |\n| 输入整理与主题归类 | 模型处理，按风险抽查或复核 | 原始依据、未知与纠错入口 |\n| 固定金额计算 | 程序 | 当前规则、参数与舍入方式 |\n| 专业适配判断 | 具备能力的人员，AI协助 | 材料充分、判断标准与责任 |\n| 常规低影响更新 | 在受限条件下自动执行 | 身份、范围、可追查及异常接手 |\n| 重要承诺和例外 | 有权负责人决定 | 最终内容、版本、影响与批准记录 |\n\n分工可以随着能力和经验变化调整。先让AI整理材料、人员逐项核对，经过足够同类任务观察后，可以把稳定低影响部分转为抽查，让专业人员集中处理差异与例外。调整时同步改变工具范围、检查方法和接手安排。\n\n## 人工复核怎样才有作用\n\n复核人需要有能力、依据和时间。让员工一天批准大量看不见原始资料的结果，人工参与很可能退化为机械点击。应突出真正需要判断的差异、依据与未决项，减少重复阅读。\n\n不同错误需要不同检查。数量与身份可以对照原始记录，金额可由程序重算，专业结论需要专业依据。复核也应能退回并指出原因，让错误进入方法改进，而不是由每个人私下修好后消失。\n\n复核负担高时，先查看核对方式是否合适。若员工每次都要翻完整原文，可以让结果直接关联依据位置；若每个字段都要求同样强度审查，可以集中处理影响数量、费用和承诺的关键项。仍需大量专业重做的部分，则保留人工主导。\n\n## 批准必须对应具体内容\n\n批准了一个草稿，之后数量、价格或履约条件改变，原批准是否仍有效，需要明确规则。重要改动通常应重新检查受影响部分，而不是只保留一个“已批准”状态。\n\n写入或发送时，系统把待提交的内容版本与批准记录核对。版本相同即可继续；内容改变则重新检查受影响部分。这样，批准人的判断与最终执行保持对应，也能处理批准后他人修改的情况。\n\n## 例外应该去哪儿\n\n流程要为资料缺失、规则冲突、工具失败和结果未知安排不同路径。能补资料的由相应人员补；需要政策决定的升级负责人；系统故障时采用既定人工方式，并标记以后补录；执行结果未知时先核实，避免重复动作。\n\n运行时记录例外原因，可以继续改进流程。同类缺项反复发生，就改输入说明；某条规则频繁引起争议，就交负责人澄清；故障接手耗时，就改善状态展示。例外路径也成为组织学习的入口。\n\n## 删除旧工作，才可能释放时间\n\n新系统如果要求员工先填新表、再发原来的聊天消息、最后维护旧报表，AI节省的几分钟可能被新增管理消耗。上线前应逐项明确哪些旧动作停止，什么记录成为正式入口，谁负责与上下游一致。\n\n评价时沿完整工作计算。上游与下游的处理、等待和核对都进入同一本账，团队才有动力共同优化交接。业务负责人负责维护这条完整路径，下一章将进一步解释不同系统怎样支持它。\n\n\u003ca id=\"do-20\">\u003c/a>\n\n## 给一次交接写清接收条件与批准范围\n\n先选最容易退回的一次交接，例如销售把安装需求交给专业人员。双方拿同一笔原材料，在[分工授权与岗位调整表](toolkit/04-分工授权与岗位调整表.docx)一起填写：\n\n| 交接要素 | 示意填写 |\n| --- | --- |\n| 上游交什么 | 客户与设备、地点、必要现场条件、原话与仍未确定项 |\n| 下游先检查什么 | 是否能确定适用服务，关键现场条件是否足以开始判断 |\n| 不满足时怎样办 | 写明缺项退给销售补问；原任务保留当前状态 |\n| 满足时怎样继续 | 专业人员给出可安装范围与限制，程序按确认项目算费用 |\n| 谁可批准 | 有权负责人批准当前版本的内容与特殊安排 |\n| 变化怎样处理 | 数量或条件变更后，重核受影响内容与批准 |\n\n让上游按这张表交一次，下游实际打开并继续处理，不由原作者替他口头补齐所有背景。随后故意换一项条件，例如把两套改成三套，检查旧费用和批准是否仍被沿用。若仍能直接发送旧方案，先修复这条内容与批准的对应，再重复原任务。\n\n最后写下哪一个旧动作可以停止。例如正式需求记录已能被专业人员查看，就不再要求销售重新抄一份聊天摘要。把停止旧动作、维护新入口和例外上报交给具体责任人。\n"},{"id":"c21","file":"21-系统集成数据与共同事实.md","title":"第21章｜系统集成、数据与共同事实","html":"\u003ch1>第21章｜系统集成、数据与共同事实\u003c/h1>\n\u003cp>\u003cstrong>系统集成让不同岗位围绕同一个客户、订单或任务使用一致的信息。AI能够查到业务事实、写回处理结果，工作就能从一个入口接续到另一个入口。\u003c/strong>\u003c/p>\n\u003cp>\u003ca href=\"#c21/do-21\">本章做法：与实施者一起核一张读写对应表\u003c/a>\u003c/p>\n\u003cp>企业通常已经有客户、订单、财务、排班或协作系统。AI应用进入后，应明确哪些数据从哪里读，哪些动作写回哪里，哪些系统继续作为正式记录。否则一个新工作台可能让信息更加分散。\u003c/p>\n\u003ch2>同一对象怎样被识别\u003c/h2>\n\u003cp>客户名称可能重复，联系人可能更换，一位客户可能拥有多台设备。仅按名字或手机号关联，容易把记录归错。应尽量采用稳定标识，并保存系统之间的对应关系。\u003c/p>\n\u003cp>寄给同一个人的两件包裹，收件姓名相同，运单号却不同。查物流时按运单号查，才知道哪一件已经签收、哪一件仍在途中。企业客户也可能有多笔订单和多台设备，需要分清当前到底处理哪一笔。\u003c/p>\n\u003cp>例如同一客户买了设备甲和设备乙，本次报修的是乙。受理人员先核对乙的设备序列号，或企业分配的唯一设备编号；服务系统建立申请时，保存这个设备编号。企业维护的对应记录说明乙属于哪笔订单、这笔订单属于哪个客户。应用沿这些对应关系查订单、服务资格和维修历史，才会取得乙的材料。界面仍显示客户名称和设备名称，编号在记录之间帮助保持对应。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"21\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iMTAxNSIgdmlld0JveD0iMCAwIDM2MCAxMDE1IiByb2xlPSJpbWciPjx0aXRsZT7lkIzkuIDlrqLmiLfnmoTkuKTlj7Dorr7lpIc8L3RpdGxlPjxkZXNjPuWuouaIt+aLpeacieeUsuS5meS4pOWPsOiuvuWkh++8jOacrOasoeeUs+ivt+S/neWtmOS5meeahOagh+ivhuW5tuafpeivouS5meeahOiuouWNleWSjOe7tOS/ruWOhuWPsu+8jOmBv+WFjea3t+eUqOeUsueahOiusOW9leOAgjwvZGVzYz48ZGVmcz48bWFya2VyIGlkPSJhIiBtYXJrZXJXaWR0aD0iOCIgbWFya2VySGVpZ2h0PSI4IiByZWZYPSI3IiByZWZZPSI0IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDAgTDggNCBMMCA4IFoiIGZpbGw9IiMyNDZhNTUiLz48L21hcmtlcj48L2RlZnM+PHJlY3Qgd2lkdGg9IjM2MCIgaGVpZ2h0PSIxMDE1IiBmaWxsPSJ3aGl0ZSIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJ AiPue7tOS/ruS6uuWRmOWkhOeQhuS5meeahOaVhemanDwvdGV4dD48dGV4dCB4PSIyNCIgeT0iNzc3IiBmb250LXNpemU9IjE4IiBmaWxsPSIjNjE3MTZiIiBmb250LXdlaWdodD0iNDAwIj7lg4/mjInov5DljZXlj7fmn6XlkIzkuIDmlLbku7bkurrnmoTkuI3lkIzljIXoo7nvvIzlkI3np7Dnm7jlkIzkuZ/og73liIbmuIXmmK/lk6rkuIDku7bjgII8L3RleHQ+PC9nPjwvc3ZnPg==\" alt=\"同一客户拥有设备甲和设备乙，本次申请明确指向乙；应用沿设备乙对应的订单和维修记录查询，避免把甲的记录混入。\">\u003c/picture>\u003cfigcaption>\u003cspan>图 21-1\u003c/span>\u003cbutton type=\"button\" class=\"enlarge\" aria-label=\"放大查看图21-1\">放大查看\u003c/button>\u003c/figcaption>\u003c/figure>\n\u003cp>各类数据可以继续保存在负责它的系统中：订单系统管理订单状态，服务系统管理处理记录，应用根据稳定标识关联查询。权威位置清楚，就能减少在多个地方重复维护同一事实。\u003c/p>\n\u003cp>这里的“权威位置”是企业约定以哪处记录为准。例如交付状态以订单系统为准，客服笔记只是补充说明。两个系统的编号不同，就保留一份对应表：设备乙在售后系统的编号，对应订单系统中的哪台设备和哪笔订单。这类对应表通常叫“映射表”。\u003c/p>\n\u003ch2>技术接通前要核对的现实条件\u003c/h2>\n\u003cp>先确认企业当前账号、购买版本、接口范围和权限条件，再使用小范围记录实际读写。这些条件决定数据怎样取得、结果怎样保存，也帮助团队及早确定方案中哪些可以直接采用、哪些需要额外安排。\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>核对对象\u003c/th>\n\u003cth>实际操作\u003c/th>\n\u003cth>取得的结果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>身份\u003c/td>\n\u003ctd>用最终使用者角色登录与查询\u003c/td>\n\u003ctd>确定使用身份与操作范围\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数据\u003c/td>\n\u003ctd>查询允许和不允许访问的记录\u003c/td>\n\u003ctd>明确读写条件与限制位置\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>写入\u003c/td>\n\u003ctd>创建后读回，再由接收方打开\u003c/td>\n\u003ctd>确认保存与接手路径\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>平台条件\u003c/td>\n\u003ctd>核当前版本、配置和接口\u003c/td>\n\u003ctd>明确可直接采用的能力\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>完整任务\u003c/td>\n\u003ctd>从输入推进到下一岗位继续\u003c/td>\n\u003ctd>确定各项连接如何共同工作\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>这些核实应尽早进行，尤其是它们可能决定方案能否成立时。可以先用低影响测试记录验证，不必等完整界面做完再发现关键权限缺失。\u003c/p>\n\u003ch2>数据变更怎样传播\u003c/h2>\n\u003cp>一个系统更新了客户资料，其他应用可能持有旧副本。需要明确哪些字段实时查、哪些允许缓存，以及同步失败怎样发现。并非每项数据都需要实时一致，但业务使用者应知道延迟限制。\u003c/p>\n\u003cp>“缓存”可以理解为留一份副本方便再用。你把电影院座位图截下来，过一会儿再看截图，画面仍是原来的空位；真正订票要回到售票系统查。企业工作台也可能暂存一份排班，方便展示，但要承诺预约时，需要回到负责排班的系统确认。\u003c/p>\n\u003cp>例如客户改了收货地址，客服先在约定的客户资料系统保存；应用准备生成发货单时，从该系统读取新地址。如果另一个工作台保存了地址副本，实施者需要安排它收到变更通知或定期重新读取，并记录最近更新时间。更新失败时把这份副本标为待更新，发货人员回到正式记录核对，再出单。企业据此明确哪些场合可以用稍旧的副本，哪些动作必须取得当前记录。\u003c/p>\n\u003cp>资源预约可以说明执行时检查的作用。查询时有空位，另一个人可能先完成预约；因此提交时由资源系统再次检查并占用，成功后返回预约记录。内容批准同理：写入端检查当前版本，再接受对应动作。这类保证需要接收系统支持，接入前应确认其能力。\u003c/p>\n\u003cp>例如客服上午查到明天下午有一个时段，正在等客户答复；另一位客服先为别的客户预约成功。第一位客服随后提交时，排班系统发现时段已占用，返回不能预约。应用据此重新查询可选时段，再请客户选择。查看空位只是取得当时的信息，保存成功的预约记录才表明这个时段已经分配给当前客户。\u003c/p>\n\u003ch2>按当前任务整理数据\u003c/h2>\n\u003cp>系统连接会暴露原有数据差异：同一客户有多条记录，字段采用不同含义，旧规则仍在部分入口使用。处理时先确定当前任务依赖哪些对象和字段，再由对应负责人整理。\u003c/p>\n\u003cp>例如先为一个产品范围建立客户、设备和服务申请的关联，明确哪些记录合并、哪些保持分开。试点期间可以采用有维护人的映射表；重复使用增多后，再把稳定关系纳入系统。这样既能推进当前工作，也能让临时安排逐渐转为长期资产。\u003c/p>\n\u003cp>数据治理因此有了业务优先级。先处理影响实际判断和交接的部分，积累方法，再随新场景扩大。\u003c/p>\n\u003ch2>判断集成完成的终点\u003c/h2>\n\u003cp>让实际角色从真实输入开始，完成读取、处理、批准和写入，随后由接手方打开正式记录继续。再试一次无权限、重复提交和内容变更。这样的验证，比“已经接了几个接口”更接近企业需要的结果。\u003c/p>\n\u003cp>集成建设的价值，是让AI可以利用企业事实并在受控条件下行动。它同时要求业务对象清楚、平台条件真实、执行约束有效，以及接手路径存在。\u003c/p>\n\u003cp>\u003ca id=\"do-21\">\u003c/a>\u003c/p>\n\u003ch2>与实施者一起核一张读写对应表\u003c/h2>\n\u003cp>先不要从要接多少系统开始。选一笔具体任务，列出本次必须读取和保存的内容，在\u003ca href=\"#download\" data-download=\"03-试点范围与任务说明.docx\">试点范围与任务说明\u003c/a>补下面这张表：\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>本次内容\u003c/th>\n\u003cth>从哪里取得或保存\u003c/th>\n\u003cth>对应对象及核对人\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>当前设备\u003c/td>\n\u003ctd>设备记录或企业维护的对应表\u003c/td>\n\u003ctd>唯一设备编号；受理人员核对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>所属客户与订单\u003c/td>\n\u003ctd>正式客户、订单记录\u003c/td>\n\u003ctd>设备对应的客户与订单编号\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>服务适用条件\u003c/td>\n\u003ctd>当前正式服务资料\u003c/td>\n\u003ctd>型号、地区与生效版本；业务负责人核对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>处理结果\u003c/td>\n\u003ctd>服务系统中的申请\u003c/td>\n\u003ctd>申请关联正确设备；接手团队打开确认\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>请实施者用最终使用者的账号查一条允许读取的记录，对照原系统核值；再试一条不允许访问的记录。接着创建一笔低影响申请，记下编号，退出当前页面后重新打开，并请接手团队核对。\u003c/p>\n\u003cp>若设备在两个系统中编号不同，先确认对应关系，不让名称相似直接代替。若写入成功但接手团队看不到，就查记录位置、可见范围和入口；处理好后再从原申请重走一遍。所有核实记录在\u003ca href=\"#download\" data-download=\"05-试用与验收记录.docx\">试用与验收记录\u003c/a>。\u003c/p>\n\u003cp>你最终要能指出哪项事实以哪里为准、什么身份能读取或修改、结果由谁从哪里接手。这三件事明确后，才算当前这条业务连接可用。\u003c/p>\n","text":"# 第21章｜系统集成、数据与共同事实\n\n**系统集成让不同岗位围绕同一个客户、订单或任务使用一致的信息。AI能够查到业务事实、写回处理结果，工作就能从一个入口接续到另一个入口。**\n\n[本章做法：与实施者一起核一张读写对应表](#do-21)\n\n企业通常已经有客户、订单、财务、排班或协作系统。AI应用进入后，应明确哪些数据从哪里读，哪些动作写回哪里，哪些系统继续作为正式记录。否则一个新工作台可能让信息更加分散。\n\n## 同一对象怎样被识别\n\n客户名称可能重复，联系人可能更换，一位客户可能拥有多台设备。仅按名字或手机号关联，容易把记录归错。应尽量采用稳定标识，并保存系统之间的对应关系。\n\n寄给同一个人的两件包裹，收件姓名相同，运单号却不同。查物流时按运单号查，才知道哪一件已经签收、哪一件仍在途中。企业客户也可能有多笔订单和多台设备，需要分清当前到底处理哪一笔。\n\n例如同一客户买了设备甲和设备乙，本次报修的是乙。受理人员先核对乙的设备序列号，或企业分配的唯一设备编号；服务系统建立申请时，保存这个设备编号。企业维护的对应记录说明乙属于哪笔订单、这笔订单属于哪个客户。应用沿这些对应关系查订单、服务资格和维修历史，才会取得乙的材料。界面仍显示客户名称和设备名称，编号在记录之间帮助保持对应。\n\n![同一客户拥有设备甲和设备乙，本次申请明确指向乙；应用沿设备乙对应的订单和维修记录查询，避免把甲的记录混入。](assets/21.svg)\n\n各类数据可以继续保存在负责它的系统中：订单系统管理订单状态，服务系统管理处理记录，应用根据稳定标识关联查询。权威位置清楚，就能减少在多个地方重复维护同一事实。\n\n这里的“权威位置”是企业约定以哪处记录为准。例如交付状态以订单系统为准，客服笔记只是补充说明。两个系统的编号不同，就保留一份对应表：设备乙在售后系统的编号，对应订单系统中的哪台设备和哪笔订单。这类对应表通常叫“映射表”。\n\n## 技术接通前要核对的现实条件\n\n先确认企业当前账号、购买版本、接口范围和权限条件，再使用小范围记录实际读写。这些条件决定数据怎样取得、结果怎样保存，也帮助团队及早确定方案中哪些可以直接采用、哪些需要额外安排。\n\n| 核对对象 | 实际操作 | 取得的结果 |\n| --- | --- | --- |\n| 身份 | 用最终使用者角色登录与查询 | 确定使用身份与操作范围 |\n| 数据 | 查询允许和不允许访问的记录 | 明确读写条件与限制位置 |\n| 写入 | 创建后读回，再由接收方打开 | 确认保存与接手路径 |\n| 平台条件 | 核当前版本、配置和接口 | 明确可直接采用的能力 |\n| 完整任务 | 从输入推进到下一岗位继续 | 确定各项连接如何共同工作 |\n\n这些核实应尽早进行，尤其是它们可能决定方案能否成立时。可以先用低影响测试记录验证，不必等完整界面做完再发现关键权限缺失。\n\n## 数据变更怎样传播\n\n一个系统更新了客户资料，其他应用可能持有旧副本。需要明确哪些字段实时查、哪些允许缓存，以及同步失败怎样发现。并非每项数据都需要实时一致，但业务使用者应知道延迟限制。\n\n“缓存”可以理解为留一份副本方便再用。你把电影院座位图截下来，过一会儿再看截图，画面仍是原来的空位；真正订票要回到售票系统查。企业工作台也可能暂存一份排班，方便展示，但要承诺预约时，需要回到负责排班的系统确认。\n\n例如客户改了收货地址，客服先在约定的客户资料系统保存；应用准备生成发货单时，从该系统读取新地址。如果另一个工作台保存了地址副本，实施者需要安排它收到变更通知或定期重新读取，并记录最近更新时间。更新失败时把这份副本标为待更新，发货人员回到正式记录核对，再出单。企业据此明确哪些场合可以用稍旧的副本，哪些动作必须取得当前记录。\n\n资源预约可以说明执行时检查的作用。查询时有空位，另一个人可能先完成预约；因此提交时由资源系统再次检查并占用，成功后返回预约记录。内容批准同理：写入端检查当前版本，再接受对应动作。这类保证需要接收系统支持，接入前应确认其能力。\n\n例如客服上午查到明天下午有一个时段，正在等客户答复；另一位客服先为别的客户预约成功。第一位客服随后提交时，排班系统发现时段已占用，返回不能预约。应用据此重新查询可选时段，再请客户选择。查看空位只是取得当时的信息，保存成功的预约记录才表明这个时段已经分配给当前客户。\n\n## 按当前任务整理数据\n\n系统连接会暴露原有数据差异：同一客户有多条记录，字段采用不同含义，旧规则仍在部分入口使用。处理时先确定当前任务依赖哪些对象和字段，再由对应负责人整理。\n\n例如先为一个产品范围建立客户、设备和服务申请的关联，明确哪些记录合并、哪些保持分开。试点期间可以采用有维护人的映射表；重复使用增多后，再把稳定关系纳入系统。这样既能推进当前工作，也能让临时安排逐渐转为长期资产。\n\n数据治理因此有了业务优先级。先处理影响实际判断和交接的部分，积累方法，再随新场景扩大。\n\n## 判断集成完成的终点\n\n让实际角色从真实输入开始，完成读取、处理、批准和写入，随后由接手方打开正式记录继续。再试一次无权限、重复提交和内容变更。这样的验证，比“已经接了几个接口”更接近企业需要的结果。\n\n集成建设的价值，是让AI可以利用企业事实并在受控条件下行动。它同时要求业务对象清楚、平台条件真实、执行约束有效，以及接手路径存在。\n\n\n\u003ca id=\"do-21\">\u003c/a>\n\n## 与实施者一起核一张读写对应表\n\n先不要从要接多少系统开始。选一笔具体任务，列出本次必须读取和保存的内容，在[试点范围与任务说明](toolkit/03-试点范围与任务说明.docx)补下面这张表：\n\n| 本次内容 | 从哪里取得或保存 | 对应对象及核对人 |\n| --- | --- | --- |\n| 当前设备 | 设备记录或企业维护的对应表 | 唯一设备编号；受理人员核对 |\n| 所属客户与订单 | 正式客户、订单记录 | 设备对应的客户与订单编号 |\n| 服务适用条件 | 当前正式服务资料 | 型号、地区与生效版本；业务负责人核对 |\n| 处理结果 | 服务系统中的申请 | 申请关联正确设备；接手团队打开确认 |\n\n请实施者用最终使用者的账号查一条允许读取的记录，对照原系统核值；再试一条不允许访问的记录。接着创建一笔低影响申请，记下编号，退出当前页面后重新打开，并请接手团队核对。\n\n若设备在两个系统中编号不同，先确认对应关系，不让名称相似直接代替。若写入成功但接手团队看不到，就查记录位置、可见范围和入口；处理好后再从原申请重走一遍。所有核实记录在[试用与验收记录](toolkit/05-试用与验收记录.docx)。\n\n你最终要能指出哪项事实以哪里为准、什么身份能读取或修改、结果由谁从哪里接手。这三件事明确后，才算当前这条业务连接可用。\n"},{"id":"c22","file":"22-原型评测与业务验收.md","title":"第22章｜原型、评测与业务验收","html":"\u003ch1>第22章｜原型、评测与业务验收\u003c/h1>\n\u003cp>\u003cstrong>验证帮助企业逐步作出采用决定：原型检查关键设想，评测改进任务表现，试用观察日常工作，验收把运行交给企业。\u003c/strong>\u003c/p>\n\u003cp>\u003ca href=\"#c22/do-22\">本章做法：自己组织一次有依据的业务验收\u003c/a>\u003c/p>\n\u003cp>这些工作回答不同问题。识别是否准确，可以先用材料检验；实际岗位能否接续，要放到流程里操作；投入是否划算，则需要观察时间、质量和维护。按当前最关键的问题安排验证，团队就能把精力用在下一项决定需要的证据上。\u003c/p>\n\u003ch2>原型该证明什么\u003c/h2>\n\u003cp>以客服整理报修为例，首轮先把几条客户消息交给有限版本，看它能否分清设备、现象和缺项；这就是原型。随后换一批消息，逐条对照预期结果，检查缺项、否定和变更怎样处理，这叫评测。再让客服在限定范围内实际使用，记录是否减少整理、是否增加核对，是试用。最后由企业人员独立完成受理与异常接手，明确维护责任，才进入验收。\u003c/p>\n\u003cp>这四种检查围绕同一类工作，逐步回答“关键设想成立吗”“换材料还行吗”“日常是否好用”“企业能接手吗”。\u003c/p>\n\u003cp>首轮可以只验证模型能否从杂乱材料提取必要条件，或新的交接是否让专业人员更容易判断。部分步骤由人完成也可以，但应明确标记，不把后台人工当成自动能力。\u003c/p>\n\u003cp>如果关键问题是识别质量，没必要先建完整平台；如果关键问题是实际权限，不能只做离线演示。原型的范围应由风险和未知决定，而不是由最容易展示的界面决定。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"22\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iODI0IiB2aWV3Qm94PSIwIDAgMzYwIDgyNCIgcm9sZT0iaW1nIj48dGl0bGU+5ZCM5LiA57G75oql5L+u77yM5YiG6Zi25q615qOA5p+lPC90aXRsZT48ZGVzYz7ljp/lnovlhYjor5XlhbPplK7or4bliKvvvIzor4TmtYvmjaLmnZDmlpnmo4Dmn6XvvIzor5XnlKjop4Llr5/ml6XluLjotJ/mi4XvvIzpqozmlLbnoa7orqTkvIHkuJrni6znq4vlj5fnkIblkozlvILluLjmjqXmiYvjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYSIgbWFya2VyV2lkdGg9IjgiIG1hcmtlckhlaWdodD0iOCIgcmVmWD0iNyIgcmVmWT0iNCIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwIEw4IDQgTDAgOCBaIiBmaWxsPSIjMjQ2YTU1Ii8+PC9tYXJrZXI+PC9kZWZzPjxyZWN0IHdpZHRoPSIzNjAiIGhlaWdodD0iODI0IiBmaWxsPSJ3aGl0ZSIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiI+PHRleHQgeD0iMjQiIHk9IjM4IiBmb250LXNpemU9IjI0IiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNjAwIj7lkIzkuIDnsbvmiqXkv67vvIzliIbpmLbmrrXmo4Dmn6U8L3RleHQ+PHRleHQgeD0iMjQiIHk9IjcxIiBmb250LXNpemU9IjE4IiBmaWxsPSIjNjE3MTZiIiBmb250LXdlaWdodD0iNDAwIj7ku47lhbPplK7orr7mg7PliLDkvIHkuJrlrp7pmYXmjqXmiYs8L3RleHQ+PHJlY3QgeD0iMjQiIHk9IjEyNCIgd2lkdGg9IjMxMiIgaGVpZ2h0PSIxNDIiIHJ4PSI4IiBmaWxsPSIjZWRmMmY4IiBzdHJva2U9IiNkNWUwZGEiIHN0cm9rZS13aWR0aD0iMS40Ii8+PHRleHQgeD0iNDAiIHk9IjE1NCIgZm9udC1zaXplPSIyMSIgZmlsbD0iIzI0NmE1NSIgZm9udC13ZWlnaHQ9IjYwMCI+5Y6f5Z6L77ya5YWz6ZSu6K6+5oOz5piv5ZCm5oiQ56uLPC90ZXh0PjxwYXRoIGQ9Ik00MCAxNzYgSDMyMCIgc3Ryb2tlPSIjZDVlMGRhIiBzdHJva2Utd2lkdGg9IjIiIGZpbGw9Im5vbmUiLz48dGV4dCB4PSI0MCIgeT0iMjA4IiBmb250LXNpemU9IjIwIiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNDAwIj7nlKjlrqLmiLfmtojmga/or5Xorr7lpIfkuI7njrDos /p>\n\u003cp>这称为回归检查：修一个问题时，确认没有破坏原来正确行为。范围按影响选择，不必每次全部重测，也不能只看一张修复后的截图。\u003c/p>\n\u003cp>模型错误也应分类：资料没进入、检索错误、理解错误、规则缺失、工具失败或对象关联错误。分类的作用是决定下一步改哪里，而不是为了让报表更精细。\u003c/p>\n\u003ch2>受控试用怎样安排\u003c/h2>\n\u003cp>限定参与者、任务类型、允许动作和时间范围，保留人工接手。记录完整任务，包括失败、等待、重试和最终没有采用的结果。只统计成功完成的任务，会使系统看起来比实际更好。\u003c/p>\n\u003cp>比较前后时，按任务类型和复杂度分组，并使用相近观察周期。标准输入与复杂输入分别记录，可以看出改进适合哪部分工作。试用材料较少时，先用结果决定下一轮范围，随着实际使用增加再估计整体效果。\u003c/p>\n\u003cp>严重错误即使少见，也应先限制相关能力。是否暂停要看后果、可发现性和补救条件，而不是只看总成功率。\u003c/p>\n\u003ch2>验收意味着企业能接手\u003c/h2>\n\u003cp>业务验收应由相应责任人判断任务能否完成，实施方提供过程和证据。技术人员不能替业务确定专业标准，业务也不能只凭界面感觉评价底层约束。\u003c/p>\n\u003cp>可以安排一名未参与开发的实际使用者独立完成正常任务和常见异常，查看手册、状态和接手是否足够。然后核对企业是否掌握必要入口、数据、配置与维护安排。\u003c/p>\n\u003cp>验收确定当前正式使用的范围、责任和维护方式。团队在这个基础上持续运行，经营者也有了比较下一轮扩展成本与收益的起点。\u003c/p>\n\u003cp>\u003ca id=\"do-22\">\u003c/a>\u003c/p>\n\u003ch2>自己组织一次有依据的业务验收\u003c/h2>\n\u003cp>拿当前试点范围，先把“正确结果”写在测试材料旁边，再让系统处理。下面两项检查需求整理，另两项检查整理之后的方案与访问。按本轮约定选择相应任务；若本轮只生成草稿，就先验草稿，接通批准或共享以后再验相应动作。示例预期如下：\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>测试材料\u003c/th>\n\u003cth>预期行为\u003c/th>\n\u003cth>要核对的证据\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>本次两套，明年可能再加一套\u003c/td>\n\u003ctd>本次两套，追加列意向\u003c/td>\n\u003ctd>原话与实际字段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>颜色沿用上次\u003c/td>\n\u003ctd>查对应历史或标待确认\u003c/td>\n\u003ctd>实际取得的历史记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>改成三套，原方案已有批准\u003c/td>\n\u003ctd>更新数量并重新检查受影响的计算和批准\u003c/td>\n\u003ctd>当前内容、版本、实际保存状态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>另一位无权人员打开记录\u003c/td>\n\u003ctd>不取得不允许访问的内容\u003c/td>\n\u003ctd>该身份实际看到的结果\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>然后按顺序做：\u003c/p>\n\u003col>\n\u003cli>业务负责人确认这些预期符合当前规则，实施者准备可试的入口与账号。\u003c/li>\n\u003cli>由实际使用者独立操作，把实际结果、原记录位置与失败现象填入\u003ca href=\"#download\" data-download=\"05-试用与验收记录.docx\">试用与验收记录\u003c/a>。有人在后台代做的步骤如实记录。\u003c/li>\n\u003cli>失败时先定位资料、方法、程序或权限问题，说明改哪一处；修改后重做原失败，并核相关正常任务没有被破坏。\u003c/li>\n\u003cli>请下游打开正式产物继续，再让内部接手者处理一次常见缺项或失败；把缺少的说明与权限补齐。\u003c/li>\n\u003cli>最后决定正式采用范围、保留的人工步骤、维护责任和下一次回顾，而不只签一句“演示通过”。\u003c/li>\n\u003c/ol>\n\u003cp>若当前只能完成草稿整理，就把采用范围写到草稿为止；若涉及客户承诺的状态仍错误，先限制这部分动作，修好再验。验收结论应让参与者知道从明天开始按哪种方式工作。\u003c/p>\n","text":"# 第22章｜原型、评测与业务验收\n\n**验证帮助企业逐步作出采用决定：原型检查关键设想，评测改进任务表现，试用观察日常工作，验收把运行交给企业。**\n\n[本章做法：自己组织一次有依据的业务验收](#do-22)\n\n这些工作回答不同问题。识别是否准确，可以先用材料检验；实际岗位能否接续，要放到流程里操作；投入是否划算，则需要观察时间、质量和维护。按当前最关键的问题安排验证，团队就能把精力用在下一项决定需要的证据上。\n\n## 原型该证明什么\n\n以客服整理报修为例，首轮先把几条客户消息交给有限版本，看它能否分清设备、现象和缺项；这就是原型。随后换一批消息，逐条对照预期结果，检查缺项、否定和变更怎样处理，这叫评测。再让客服在限定范围内实际使用，记录是否减少整理、是否增加核对，是试用。最后由企业人员独立完成受理与异常接手，明确维护责任，才进入验收。\n\n这四种检查围绕同一类工作，逐步回答“关键设想成立吗”“换材料还行吗”“日常是否好用”“企业能接手吗”。\n\n首轮可以只验证模型能否从杂乱材料提取必要条件，或新的交接是否让专业人员更容易判断。部分步骤由人完成也可以，但应明确标记，不把后台人工当成自动能力。\n\n如果关键问题是识别质量，没必要先建完整平台；如果关键问题是实际权限，不能只做离线演示。原型的范围应由风险和未知决定，而不是由最容易展示的界面决定。\n\n![从能力可行到真实运行的逐层验证](assets/22.svg)\n\n## 评测要覆盖怎样的错误\n\n准备具有代表性的正常、缺项、否定、歧义、变更与异常任务，写明预期结果和依据。不要只用开发时反复调好的材料；也要保留未参与调整的材料，观察方法是否能够迁移。\n\n| 层次 | 应检验什么 | 典型失败 |\n| --- | --- | --- |\n| 产物 | 字段、内容、计算与专业要求 | 格式对但把意向变成确认 |\n| 任务 | 完整路径、对象、权限和状态 | 金额更新了，旧批准却仍有效 |\n| 采用 | 人能否理解、接手并处理例外 | 实施者不在，员工无法继续 |\n| 价值 | 全链负担、质量与经营用途 | 生成快了，但复核与返工增加 |\n\n每项检查确定一个可观察终点：字段与原文一致，保存后读回正确对象，实际角色完成操作，下游人员打开记录继续处理。检查记录保留输入、当时条件和结果，便于修改后复查。\n\n## 一项修改要怎样复测\n\n假设原测试发现需求变更后仍可沿用旧批准。修复时将批准绑定内容版本。复测先重现原失败，确认修改后会要求重新检查；再测试正常批准仍可使用，以及其他角色不能绕过限制。\n\n这称为回归检查：修一个问题时，确认没有破坏原来正确行为。范围按影响选择，不必每次全部重测，也不能只看一张修复后的截图。\n\n模型错误也应分类：资料没进入、检索错误、理解错误、规则缺失、工具失败或对象关联错误。分类的作用是决定下一步改哪里，而不是为了让报表更精细。\n\n## 受控试用怎样安排\n\n限定参与者、任务类型、允许动作和时间范围，保留人工接手。记录完整任务，包括失败、等待、重试和最终没有采用的结果。只统计成功完成的任务，会使系统看起来比实际更好。\n\n比较前后时，按任务类型和复杂度分组，并使用相近观察周期。标准输入与复杂输入分别记录，可以看出改进适合哪部分工作。试用材料较少时，先用结果决定下一轮范围，随着实际使用增加再估计整体效果。\n\n严重错误即使少见，也应先限制相关能力。是否暂停要看后果、可发现性和补救条件，而不是只看总成功率。\n\n## 验收意味着企业能接手\n\n业务验收应由相应责任人判断任务能否完成，实施方提供过程和证据。技术人员不能替业务确定专业标准，业务也不能只凭界面感觉评价底层约束。\n\n可以安排一名未参与开发的实际使用者独立完成正常任务和常见异常，查看手册、状态和接手是否足够。然后核对企业是否掌握必要入口、数据、配置与维护安排。\n\n验收确定当前正式使用的范围、责任和维护方式。团队在这个基础上持续运行，经营者也有了比较下一轮扩展成本与收益的起点。\n\n\u003ca id=\"do-22\">\u003c/a>\n\n## 自己组织一次有依据的业务验收\n\n拿当前试点范围，先把“正确结果”写在测试材料旁边，再让系统处理。下面两项检查需求整理，另两项检查整理之后的方案与访问。按本轮约定选择相应任务；若本轮只生成草稿，就先验草稿，接通批准或共享以后再验相应动作。示例预期如下：\n\n| 测试材料 | 预期行为 | 要核对的证据 |\n| --- | --- | --- |\n| 本次两套，明年可能再加一套 | 本次两套，追加列意向 | 原话与实际字段 |\n| 颜色沿用上次 | 查对应历史或标待确认 | 实际取得的历史记录 |\n| 改成三套，原方案已有批准 | 更新数量并重新检查受影响的计算和批准 | 当前内容、版本、实际保存状态 |\n| 另一位无权人员打开记录 | 不取得不允许访问的内容 | 该身份实际看到的结果 |\n\n然后按顺序做：\n\n1. 业务负责人确认这些预期符合当前规则，实施者准备可试的入口与账号。\n2. 由实际使用者独立操作，把实际结果、原记录位置与失败现象填入[试用与验收记录](toolkit/05-试用与验收记录.docx)。有人在后台代做的步骤如实记录。\n3. 失败时先定位资料、方法、程序或权限问题，说明改哪一处；修改后重做原失败，并核相关正常任务没有被破坏。\n4. 请下游打开正式产物继续，再让内部接手者处理一次常见缺项或失败；把缺少的说明与权限补齐。\n5. 最后决定正式采用范围、保留的人工步骤、维护责任和下一次回顾，而不只签一句“演示通过”。\n\n若当前只能完成草稿整理，就把采用范围写到草稿为止；若涉及客户承诺的状态仍错误，先限制这部分动作，修好再验。验收结论应让参与者知道从明天开始按哪种方式工作。\n"},{"id":"c23","file":"23-投入回报与合作采购.md","title":"第23章｜投入回报与合作采购","html":"\u003ch1>第23章｜投入回报与合作采购\u003c/h1>\n\u003cp>\u003cstrong>AI改造的经济性，要按完整任务和整个使用周期计算。释放时间、减少现金支出、改善质量与创造新收入，应分别记账。\u003c/strong>\u003c/p>\n\u003cp>\u003ca href=\"#c23/do-23\">本章做法：填一笔真实工时账，再拿同一范围比较报价\u003c/a>\u003c/p>\n\u003cp>省出的时间有几种去处：减少加班、承接更多任务、让专业人员处理复杂问题，或改善响应速度。企业应提前选择希望实现哪一种，并在试用中观察时间是否真的转化成相应结果。\u003c/p>\n\u003ch2>一笔可复查的教学账\u003c/h2>\n\u003cp>以下是假设计算，用于说明方法：每月200项同类任务，原来每项全链处理30分钟，改后包含复核与返工平均18分钟。\u003c/p>\n\u003cp>原工时为200×30÷60＝100小时，新工时为200×18÷60＝60小时，两者相减少用40小时，这里称为“毛释放”。扣除每月维护规则、检查运行等8小时，净释放32小时。若按每小时80元估算劳动价值，对应2,560元的可用工时价值，也称为“容量价值”，表示释放出来的工作时间按此单价折算值。企业接着需要决定这32小时用在哪里。\u003c/p>\n\u003cp>若另有每月1,200元模型和服务费用，且32小时可以替代同价外部工作，月度经营改善可按2,560−1,200＝1,360元估算，再考虑一次性建设投入。若原员工工资固定，则先记录容量增加，进一步看它是否带来更多交付、较少加班或更好质量。建设、数据准备、培训和交接另计一次性成本。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"23\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNzMzIiB2aWV3Qm94PSIwIDAgMzYwIDczMyIgcm9sZT0iaW1nIj48dGl0bGU+5a6M5pW05oiQ5pys5Yaz5a6a57uP5rWO5oCnPC90aXRsZT48ZGVzYz4xMD XNpemU9IjIwIiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNDAwIj7lirPliqjku7flgLwyLDU2MOWFgzwvdGV4dD48dGV4dCB4PSI0MCIgeT0iNTkwIiBmb250LXNpemU9IjIwIiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNDAwIj7lj6borqHmnIjmnI3liqHotLkxLDIwMOWFgzwvdGV4dD48dGV4dCB4PSIyNCIgeT0iNjUxIiBmb250LXNpemU9IjE4IiBmaWxsPSIjNjE3MTZiIiBmb250LXdlaWdodD0iNDAwIj4zMuWwj+aXtuWPr+eUqOS6juWinuWKoOS6pOS7mOOAgeWHj+WwkeWKoOePreaIluWkluWMheOAgjwvdGV4dD48L2c+PC9zdmc+\" alt=\"全链工时、持续成本与价值分别计算\">\u003c/picture>\u003cfigcaption>\u003cspan>图 23-1\u003c/span>\u003cbutton type=\"button\" class=\"enlarge\" aria-label=\"放大查看图23-1\">放大查看\u003c/button>\u003c/figcaption>\u003c/figure>\n\u003ch2>改变一个条件，结论会怎样变化\u003c/h2>\n\u003cp>如果任务量降到每月50项，同样每项少12分钟，毛释放只有10小时。固定维护仍为8小时，净释放2小时。按80元估算仅160元，已经不足以覆盖上述1,200元月费用。高频场景和低频场景，经济性可能完全不同。\u003c/p>\n\u003cp>如果仍有200项，但复核加重，使新工时变成每项25分钟，毛释放约16.7小时，扣8小时后约8.7小时，劳动价值约693元。原本看似不错的方案，也可能不再合算。\u003c/p>\n\u003cp>两次重算显示，任务量和复核时间会显著改变经济性。试用时应优先测准这两项，并观察固定维护是否能够随其他场景复用。企业可以因此决定提高使用频率、改善核对方式，或选择更轻的方案。\u003c/p>\n\u003ch2>质量和增长怎样入账\u003c/h2>\n\u003cp>减少漏项、避免错误承诺、缩短客户等待，都可能比单纯省时更重要。可以记录原错误频率、后果及改后观察，但不要把尚未发生的所有潜在损失都算成确定收益。\u003c/p>\n\u003cp>新增收入更要分清。AI使企业能更低成本提供初步分析，不代表客户愿意付费；若分析促进成交，还要区分市场、销售和产品等其他变化。可先检验客户需求与履约成本，再逐步估计贡献。\u003c/p>\n\u003cp>如果释放的时间用于新增服务，就按新增服务的贡献计算，并扣除相应履约成本；如果用于减少外包，就按实际少付的费用计算。同一份时间选择一种转化路径入账，便能保持收益口径清楚。\u003c/p>\n\u003ch2>两份报价怎样比较\u003c/h2>\n\u003cp>一份便宜方案可能只提供个人助手，另一份包含资料治理、系统连接、权限、验收和交接。只有范围相同，才适合直接比较价格。若企业只需个人辅助，轻量方案可能已经足够；若需要跨岗任务接续，则要补算缺少环节的人工和建设成本。\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>比较项\u003c/th>\n\u003cth>需要写清\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>结果范围\u003c/td>\n\u003ctd>从什么输入开始，交到哪里，谁继续\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>真实能力\u003c/td>\n\u003ctd>哪些已接通，哪些人工或模拟，受什么平台条件限制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>交付责任\u003c/td>\n\u003ctd>资料、规则、连接、验证、培训分别由谁承担\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>持续成本\u003c/td>\n\u003ctd>模型、平台、维护、改动、复核和内部配合\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>退出与迁移\u003c/td>\n\u003ctd>数据、配置、必要文件及后续运行怎样处理\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>采购约定宜围绕完整工作：处理哪些输入，按什么标准形成结果，谁能够接手，以及后续怎样维护。模型、智能体和知识条目可以作为实现清单，验收则依据这些工作结果。\u003c/p>\n\u003ch2>付款与阶段投入怎样对应\u003c/h2>\n\u003cp>可以按待证明问题分段投入：诊断查原因，原型验证核心能力与连接，试用检验实际负担，运行阶段完成交接。每一段结束后，企业有权根据新证据调整下一段范围。\u003c/p>\n\u003cp>已经花的钱属于历史投入，下一段仍应按新增成本与预期价值判断。若试点发现轻量工具足够，停止复杂集成可能是合理结果。良好的采购安排应允许事实改变方案，而不是迫使双方维持最初叙事。\u003c/p>\n\u003cp>企业要购买的是能够持续发挥作用的能力与责任安排。价格讨论只有回到这个对象，才有真正可比的基础。\u003c/p>\n\u003cp>\u003ca id=\"do-23\">\u003c/a>\u003c/p>\n\u003ch2>填一笔真实工时账，再拿同一范围比较报价\u003c/h2>\n\u003cp>先选同类型任务，把“从收到材料到下游可用”经过的实际人工处理都列出：整理、核对、补问、返工，以及维护规则的固定时间。等待时没有占用人员工作的时段，可以作为周期单独记录，不直接等同人工工时。\u003c/p>\n\u003cp>在\u003ca href=\"#download\" data-download=\"06-投入与收益计算表.docx\">投入与收益计算表\u003c/a>填写任务量、原平均人工时间、改后包含核对返工的平均时间、月固定维护工时和持续费用。照本章示例先算一次：\u003c/p>\n\u003cblockquote>\n\u003cp>200项 ×（30−18）分钟 ÷ 60＝40小时；扣维护8小时，净释放32小时。若这些时间实际替代每小时80元的外部工作，折算少付2,560元；再扣每月1,200元服务费为1,360元，建设和培训另计。\u003c/p>\n\u003c/blockquote>\n\u003cp>再把任务量改成50项，按同一公式得到净释放2小时。两次重算后，问清这份时间真的安排到哪里。固定工资暂未改变、也未增加交付时，就先记录可用时间，不把它直接填成现金节省。\u003c/p>\n\u003cp>采购比较使用同一份\u003ca href=\"#download\" data-download=\"03-试点范围与任务说明.docx\">试点范围与任务说明\u003c/a>。请各方分别写明材料整理、系统连接、权限、业务验收、交接和后续维护包含什么、由谁做、何时取得实际结果。把缺少项需要的内部工时与持续费用补上，再比较总投入。\u003c/p>\n\u003cp>最后形成一项具体决定：采用哪一范围，先投入什么，下一阶段由哪份试用结果决定。若任务量、核对成本或使用需求尚不清楚，先测最影响选择的一项，再谈扩大建设。\u003c/p>\n","text":"# 第23章｜投入回报与合作采购\n\n**AI改造的经济性，要按完整任务和整个使用周期计算。释放时间、减少现金支出、改善质量与创造新收入，应分别记账。**\n\n[本章做法：填一笔真实工时账，再拿同一范围比较报价](#do-23)\n\n省出的时间有几种去处：减少加班、承接更多任务、让专业人员处理复杂问题，或改善响应速度。企业应提前选择希望实现哪一种，并在试用中观察时间是否真的转化成相应结果。\n\n## 一笔可复查的教学账\n\n以下是假设计算，用于说明方法：每月200项同类任务，原来每项全链处理30分钟，改后包含复核与返工平均18分钟。\n\n原工时为200×30÷60＝100小时，新工时为200×18÷60＝60小时，两者相减少用40小时，这里称为“毛释放”。扣除每月维护规则、检查运行等8小时，净释放32小时。若按每小时80元估算劳动价值，对应2,560元的可用工时价值，也称为“容量价值”，表示释放出来的工作时间按此单价折算值。企业接着需要决定这32小时用在哪里。\n\n若另有每月1,200元模型和服务费用，且32小时可以替代同价外部工作，月度经营改善可按2,560−1,200＝1,360元估算，再考虑一次性建设投入。若原员工工资固定，则先记录容量增加，进一步看它是否带来更多交付、较少加班或更好质量。建设、数据准备、培训和交接另计一次性成本。\n\n![全链工时、持续成本与价值分别计算](assets/23.svg)\n\n## 改变一个条件，结论会怎样变化\n\n如果任务量降到每月50项，同样每项少12分钟，毛释放只有10小时。固定维护仍为8小时，净释放2小时。按80元估算仅160元，已经不足以覆盖上述1,200元月费用。高频场景和低频场景，经济性可能完全不同。\n\n如果仍有200项，但复核加重，使新工时变成每项25分钟，毛释放约16.7小时，扣8小时后约8.7小时，劳动价值约693元。原本看似不错的方案，也可能不再合算。\n\n两次重算显示，任务量和复核时间会显著改变经济性。试用时应优先测准这两项，并观察固定维护是否能够随其他场景复用。企业可以因此决定提高使用频率、改善核对方式，或选择更轻的方案。\n\n## 质量和增长怎样入账\n\n减少漏项、避免错误承诺、缩短客户等待，都可能比单纯省时更重要。可以记录原错误频率、后果及改后观察，但不要把尚未发生的所有潜在损失都算成确定收益。\n\n新增收入更要分清。AI使企业能更低成本提供初步分析，不代表客户愿意付费；若分析促进成交，还要区分市场、销售和产品等其他变化。可先检验客户需求与履约成本，再逐步估计贡献。\n\n如果释放的时间用于新增服务，就按新增服务的贡献计算，并扣除相应履约成本；如果用于减少外包，就按实际少付的费用计算。同一份时间选择一种转化路径入账，便能保持收益口径清楚。\n\n## 两份报价怎样比较\n\n一份便宜方案可能只提供个人助手，另一份包含资料治理、系统连接、权限、验收和交接。只有范围相同，才适合直接比较价格。若企业只需个人辅助，轻量方案可能已经足够；若需要跨岗任务接续，则要补算缺少环节的人工和建设成本。\n\n| 比较项 | 需要写清 |\n| --- | --- |\n| 结果范围 | 从什么输入开始，交到哪里，谁继续 |\n| 真实能力 | 哪些已接通，哪些人工或模拟，受什么平台条件限制 |\n| 交付责任 | 资料、规则、连接、验证、培训分别由谁承担 |\n| 持续成本 | 模型、平台、维护、改动、复核和内部配合 |\n| 退出与迁移 | 数据、配置、必要文件及后续运行怎样处理 |\n\n采购约定宜围绕完整工作：处理哪些输入，按什么标准形成结果，谁能够接手，以及后续怎样维护。模型、智能体和知识条目可以作为实现清单，验收则依据这些工作结果。\n\n## 付款与阶段投入怎样对应\n\n可以按待证明问题分段投入：诊断查原因，原型验证核心能力与连接，试用检验实际负担，运行阶段完成交接。每一段结束后，企业有权根据新证据调整下一段范围。\n\n已经花的钱属于历史投入，下一段仍应按新增成本与预期价值判断。若试点发现轻量工具足够，停止复杂集成可能是合理结果。良好的采购安排应允许事实改变方案，而不是迫使双方维持最初叙事。\n\n企业要购买的是能够持续发挥作用的能力与责任安排。价格讨论只有回到这个对象，才有真正可比的基础。\n\n\n\u003ca id=\"do-23\">\u003c/a>\n\n## 填一笔真实工时账，再拿同一范围比较报价\n\n先选同类型任务，把“从收到材料到下游可用”经过的实际人工处理都列出：整理、核对、补问、返工，以及维护规则的固定时间。等待时没有占用人员工作的时段，可以作为周期单独记录，不直接等同人工工时。\n\n在[投入与收益计算表](toolkit/06-投入与收益计算表.docx)填写任务量、原平均人工时间、改后包含核对返工的平均时间、月固定维护工时和持续费用。照本章示例先算一次：\n\n> 200项 ×（30−18）分钟 ÷ 60＝40小时；扣维护8小时，净释放32小时。若这些时间实际替代每小时80元的外部工作，折算少付2,560元；再扣每月1,200元服务费为1,360元，建设和培训另计。\n\n再把任务量改成50项，按同一公式得到净释放2小时。两次重算后，问清这份时间真的安排到哪里。固定工资暂未改变、也未增加交付时，就先记录可用时间，不把它直接填成现金节省。\n\n采购比较使用同一份[试点范围与任务说明](toolkit/03-试点范围与任务说明.docx)。请各方分别写明材料整理、系统连接、权限、业务验收、交接和后续维护包含什么、由谁做、何时取得实际结果。把缺少项需要的内部工时与持续费用补上，再比较总投入。\n\n最后形成一项具体决定：采用哪一范围，先投入什么，下一阶段由哪份试用结果决定。若任务量、核对成本或使用需求尚不清楚，先测最影响选择的一项，再谈扩大建设。\n"},{"id":"c24","file":"24-岗位重构负责人和激励.md","title":"第24章｜岗位重构、负责人和激励","html":"\u003ch1>第24章｜岗位重构、负责人和激励\u003c/h1>\n\u003cp>销售用 AI 整理客户需求后，过去需要逐条抄录的内容很快就有了初稿。但专业人员收到的材料增加了，仍然缺现场条件的任务也被一起转来；销售觉得自己提效了，专业人员却每天在退回、补问。此时需要调整的是整条工作的分工。\u003c/p>\n\u003cp>\u003ca href=\"#c24/do-24\">本章做法：完成岗位、负责人和激励的调整约定\u003c/a>\u003c/p>\n\u003cp>本章用这类需求整理作示范，带你形成一份\u003cstrong>岗位与协作调整约定\u003c/strong>：选定一个业务负责人，写清每个岗位接什么、交什么、能决定什么，安排被省下和新增的工作，再用一轮实际任务检验。下面的人员安排为方法示例，可以直接换成自己的业务。\u003c/p>\n\u003cp>\u003ca href=\"#download\" data-download=\"04-分工授权与岗位调整表.docx\">下载分工授权与岗位调整表\u003c/a>，先看填写示例，再在空表中记录本企业的约定。\u003c/p>\n\u003cp>\u003ca id=\"do-24\">\u003c/a>\u003c/p>\n\u003ch2>先选一类工作，把现在的分工摆出来\u003c/h2>\n\u003cp>先不要从整张组织架构图开始。拿一笔最近完成的客户询价，请销售和接手的专业人员一起打开原消息、整理稿、退回记录及最终方案。沿这笔任务问：哪一步是谁做的，为什么退回，下一位真正需要什么。\u003c/p>\n\u003cp>把回答写成以下四行，就能看到 AI 改变了哪部分。示例中的“专业确认”，指判断客户条件是否适合当前服务。\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>当前任务\u003c/th>\n\u003cth>原先怎么做\u003c/th>\n\u003cth>加入AI后实际发生什么\u003c/th>\n\u003cth>需要重新安排什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>读消息、填需求\u003c/td>\n\u003ctd>销售阅读并抄表\u003c/td>\n\u003ctd>AI形成初稿，销售核对\u003c/td>\n\u003ctd>销售仍核客户、数量、日期状态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>补现场条件\u003c/td>\n\u003ctd>专业人员退回后销售补问\u003c/td>\n\u003ctd>初稿生成快，缺项仍可能转来\u003c/td>\n\u003ctd>缺项先留在销售待补，齐备后才进入专业确认\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>判断能否服务\u003c/td>\n\u003ctd>专业人员逐件处理\u003c/td>\n\u003ctd>专业确认成为排队处\u003c/td>\n\u003ctd>标准件按已定规则处理，特殊件集中决定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>维护专业方法\u003c/td>\n\u003ctd>骨干在聊天里临时解释\u003c/td>\n\u003ctd>需要形成共用说明与范例\u003c/td>\n\u003ctd>给骨干留维护时间，说明由谁批准更新\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>这张表完成后，先圈出两种变化：被减少的旧动作，以及新增加的核对、维护和协调。两类都进入后面的人员安排。只删掉抄录时间而不计新增工作，会高估能够释放的时间。\u003c/p>\n\u003ch2>怎样选负责人，并给他足够的决定权\u003c/h2>\n\u003cp>先选能对这类工作作业务判断、也能组织上下游的人。可以是现有销售运营负责人、服务负责人或直接管理这条流程的人；岗位名称本身不是选择依据。\u003c/p>\n\u003cp>请候选人拿同一笔询价现场说明：为什么缺条件还被转交、哪些标准件能够直接处理、遇到加急需要谁决定。然后核实他能否找到上下游人员、安排实际参与时间。如果只能解释技术故障，却不能决定需求是否齐备，就由技术人员负责实现，另选业务负责人。\u003c/p>\n\u003cp>选定后，由项目发起人与他一起写清授权。不能只写“负责协调”，要写出能作什么决定。示例约定如下：\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>责任人\u003c/th>\n\u003cth>本轮可以决定\u003c/th>\n\u003cth>需要交谁决定\u003c/th>\n\u003cth>必须得到的支持\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>业务负责人\u003c/td>\n\u003ctd>按已确认标准要求补材料，调整标准件的受理顺序\u003c/td>\n\u003ctd>新服务、额外费用、超现有资源的承诺交发起人\u003c/td>\n\u003ctd>能查看相关任务；上下游参加复盘；有维护时段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>销售\u003c/td>\n\u003ctd>核对原话、向客户追问、修正需求记录\u003c/td>\n\u003ctd>专业适配交专业人员；特殊价格交有权负责人\u003c/td>\n\u003ctd>明确的必需条件和追问示例\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>专业骨干\u003c/td>\n\u003ctd>按专业标准确认适配，提出规则与范例修订\u003c/td>\n\u003ctd>政策或服务范围改变交业务负责人及有权决定者\u003c/td>\n\u003ctd>使用原记录；可退回缺项；维护工作计入安排\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>技术或实施者\u003c/td>\n\u003ctd>按已定范围配置工具，定位并修复程序问题\u003c/td>\n\u003ctd>业务规则冲突交业务负责人\u003c/td>\n\u003ctd>测试材料、系统访问条件、明确接手人\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>发起人把超出这些权限的争议接过来处理。若业务负责人没有时间修改入口、不能要求补材料，也无法获得专业骨干参与，那么应先调整这些条件，再要求他为整体结果负责。\u003c/p>\n\u003ch2>把新分工写到每天发生的动作里\u003c/h2>\n\u003cp>有了授权，再确定工作怎样进入、怎样交接。可以先采用下面的受理安排：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>销售收到消息\u003c/strong>，将原话与对应客户放进同一笔需求记录，AI整理字段和缺项。\u003c/li>\n\u003cli>\u003cstrong>销售核对并补问\u003c/strong>。客户身份、当前数量和承诺状态核清；缺项留在“待补材料”，写明问了谁、还等什么。\u003c/li>\n\u003cli>\u003cstrong>专业人员接齐备材料\u003c/strong>。按既定规则处理标准件，特殊件写明争议和可选办法，交业务负责人组织决定。\u003c/li>\n\u003cli>\u003cstrong>确认结果回到原记录\u003c/strong>。销售据已确认内容制作或发送方案，后续人员直接读这份记录；原先重复抄同一信息的旧表停止维护。\u003c/li>\n\u003c/ol>\n\u003cp>这里的“齐备”要由专业人员写出实际必需条件。例如上门安装至少要知道设备、地点和必要现场条件。若只是把“资料齐全”写进流程，销售仍不知道缺什么。先用原来被退回的任务试填这些条件，再请专业人员说明是否足以开始判断。\u003c/p>\n\u003cfigur c/td>\n\u003ctd>作为正式工作留时间，在复盘与评价中确认贡献\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>团队减少完整任务负担\u003c/td>\n\u003ctd>整理、等待、核对和返工的共同记录\u003c/td>\n\u003ctd>以共同结果评估，避免一岗省时另一岗加负担\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>例如销售原来只按提交量评价，就应同时检查需求能否被接手、为何退回；骨干原来只按亲自处理量评价，就要将方法被团队采用、减少重复答疑的贡献纳入记录。试用后由负责人和岗位本人一起复核：新增工作是否得到时间支持，评价是否仍在鼓励旧做法，再提交正式调整。\u003c/p>\n\u003cp>负责人可以这样开讨论：“这次要把哪些旧动作停掉？你新增哪项工作？需要留多少时间？怎样证明这项贡献？如果发现工作量增加，由谁在什么时候调整？”讨论后把答案写回分工表，并约定下一次回顾时点。涉及既有岗位职责与评价方式的正式调整，由相应有权管理者作出决定。\u003c/p>\n\u003ch2>怎样教员工按新方式处理一笔任务\u003c/h2>\n\u003cp>用一条完整材料培训，比先介绍工具功能更直接。下面是可用于演练的虚构消息：\u003c/p>\n\u003cblockquote>\n\u003cp>这次先要两套，颜色沿用上次的，安装等场地好了再定；明年可能再加一套。\u003c/p>\n\u003c/blockquote>\n\u003cp>让销售先借助 AI 整理，再独立检查：本次是两套；颜色需要查对应历史；安装日期未定；明年追加只列意向。请他把待补问题交给客户，把已确认信息交给专业人员。然后由专业人员实际打开记录，说明可以开始判断什么、还缺什么。\u003c/p>\n\u003cp>如果员工把明年意向加进本单，就回到原话修正；如果专业人员仍要从头读聊天才能工作，就调整字段和交接说明；如果找不到记录，就先修入口和权限。培训结束的依据是员工能完成这笔任务并处理一个缺项，而不只是听过讲解。\u003c/p>\n\u003ch2>试一轮以后，怎样决定保留还是调整\u003c/h2>\n\u003cp>选出会正常完成、缺材料和需要特殊决定的任务，各走一次。保留每笔的输入、退回原因、各岗位处理与等待时间，以及最终能否接手。任务量增加后，再按同类型比较原有做法与新做法。\u003c/p>\n\u003cp>复盘时按观察到的情况作决定：\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>实际情况\u003c/th>\n\u003cth>下一步怎样处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>缺项在销售处被发现，专业人员能接手，整体负担可接受\u003c/td>\n\u003ctd>保留分工，继续观察同类任务，再考虑扩大\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>销售整理更快，专业确认排队更长\u003c/td>\n\u003ctd>查标准件是否能按规则分流、人员是否有处理时间，再调整受理与授权\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>骨干反复被临时追问，维护工作没有发生\u003c/td>\n\u003ctd>把高频问题收入方法，落实维护时段与评价，减少重复口头答疑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>员工仍在新旧两处填表\u003c/td>\n\u003ctd>指定正式记录，补齐下游访问，停止已被替代的旧动作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>每份AI初稿都要专业人员重做\u003c/td>\n\u003ctd>收缩AI负责范围或改材料与方法，先保住完整任务的质量与时间\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>回顾结束，更新的应是那份日常正在使用的分工表：责任人、受理条件、决定权、维护时间、旧工作退出和下次检查日期。下一笔任务按它运行，岗位调整才真正发生。\u003c/p>\n\u003cp>如果是 OPC，这些职责可能由你一人承担。仍可以把“整理材料、专业判断、最终承诺、维护方法”分开记；给 AI 的是具体可委托动作，专业判断由自己或合作专业人员完成。先看哪类任务占时间、哪些结果值得留下，再安排自己的时间与外部协作，无需先建立多人岗位架构。\u003c/p>\n","text":"# 第24章｜岗位重构、负责人和激励\n\n销售用 AI 整理客户需求后，过去需要逐条抄录的内容很快就有了初稿。但专业人员收到的材料增加了，仍然缺现场条件的任务也被一起转来；销售觉得自己提效了，专业人员却每天在退回、补问。此时需要调整的是整条工作的分工。\n\n[本章做法：完成岗位、负责人和激励的调整约定](#do-24)\n\n本章用这类需求整理作示范，带你形成一份**岗位与协作调整约定**：选定一个业务负责人，写清每个岗位接什么、交什么、能决定什么，安排被省下和新增的工作，再用一轮实际任务检验。下面的人员安排为方法示例，可以直接换成自己的业务。\n\n[下载分工授权与岗位调整表](toolkit/04-分工授权与岗位调整表.docx)，先看填写示例，再在空表中记录本企业的约定。\n\n\u003ca id=\"do-24\">\u003c/a>\n\n## 先选一类工作，把现在的分工摆出来\n\n先不要从整张组织架构图开始。拿一笔最近完成的客户询价，请销售和接手的专业人员一起打开原消息、整理稿、退回记录及最终方案。沿这笔任务问：哪一步是谁做的，为什么退回，下一位真正需要什么。\n\n把回答写成以下四行，就能看到 AI 改变了哪部分。示例中的“专业确认”，指判断客户条件是否适合当前服务。\n\n| 当前任务 | 原先怎么做 | 加入AI后实际发生什么 | 需要重新安排什么 |\n| --- | --- | --- | --- |\n| 读消息、填需求 | 销售阅读并抄表 | AI形成初稿，销售核对 | 销售仍核客户、数量、日期状态 |\n| 补现场条件 | 专业人员退回后销售补问 | 初稿生成快，缺项仍可能转来 | 缺项先留在销售待补，齐备后才进入专业确认 |\n| 判断能否服务 | 专业人员逐件处理 | 专业确认成为排队处 | 标准件按已定规则处理，特殊件集中决定 |\n| 维护专业方法 | 骨干在聊天里临时解释 | 需要形成共用说明与范例 | 给骨干留维护时间，说明由谁批准更新 |\n\n这张表完成后，先圈出两种变化：被减少的旧动作，以及新增加的核对、维护和协调。两类都进入后面的人员安排。只删掉抄录时间而不计新增工作，会高估能够释放的时间。\n\n## 怎样选负责人，并给他足够的决定权\n\n先选能对这类工作作业务判断、也能组织上下游的人。可以是现有销售运营负责人、服务负责人或直接管理这条流程的人；岗位名称本身不是选择依据。\n\n请候选人拿同一笔询价现场说明：为什么缺条件还被转交、哪些标准件能够直接处理、遇到加急需要谁决定。然后核实他能否找到上下游人员、安排实际参与时间。如果只能解释技术故障，却不能决定需求是否齐备，就由技术人员负责实现，另选业务负责人。\n\n选定后，由项目发起人与他一起写清授权。不能只写“负责协调”，要写出能作什么决定。示例约定如下：\n\n| 责任人 | 本轮可以决定 | 需要交谁决定 | 必须得到的支持 |\n| --- | --- | --- | --- |\n| 业务负责人 | 按已确认标准要求补材料，调整标准件的受理顺序 | 新服务、额外费用、超现有资源的承诺交发起人 | 能查看相关任务；上下游参加复盘；有维护时段 |\n| 销售 | 核对原话、向客户追问、修正需求记录 | 专业适配交专业人员；特殊价格交有权负责人 | 明确的必需条件和追问示例 |\n| 专业骨干 | 按专业标准确认适配，提出规则与范例修订 | 政策或服务范围改变交业务负责人及有权决定者 | 使用原记录；可退回缺项；维护工作计入安排 |\n| 技术或实施者 | 按已定范围配置工具，定位并修复程序问题 | 业务规则冲突交业务负责人 | 测试材料、系统访问条件、明确接手人 |\n\n发起人把超出这些权限的争议接过来处理。若业务负责人没有时间修改入口、不能要求补材料，也无法获得专业骨干参与，那么应先调整这些条件，再要求他为整体结果负责。\n\n## 把新分工写到每天发生的动作里\n\n有了授权，再确定工作怎样进入、怎样交接。可以先采用下面的受理安排：\n\n1. **销售收到消息**，将原话与对应客户放进同一笔需求记录，AI整理字段和缺项。\n2. **销售核对并补问**。客户身份、当前数量和承诺状态核清；缺项留在“待补材料”，写明问了谁、还等什么。\n3. **专业人员接齐备材料**。按既定规则处理标准件，特殊件写明争议和可选办法，交业务负责人组织决定。\n4. **确认结果回到原记录**。销售据已确认内容制作或发送方案，后续人员直接读这份记录；原先重复抄同一信息的旧表停止维护。\n\n这里的“齐备”要由专业人员写出实际必需条件。例如上门安装至少要知道设备、地点和必要现场条件。若只是把“资料齐全”写进流程，销售仍不知道缺什么。先用原来被退回的任务试填这些条件，再请专业人员说明是否足以开始判断。\n\n![客户消息进入同一需求记录，缺项留销售补问，齐备后进入专业确认，特殊件交负责人决定，确认结果回到原记录供后续接手。](assets/24.svg)\n\n把这段安排贴在实际受理入口，并指定一个维护位置。员工处理任务时能找到当前条件，才会按新分工工作；会议纪要里的一份约定不足以替代日常入口。\n\n## 时间怎么重分，激励怎么谈\n\n先记录每个岗位在几笔同类任务上的实际时间：整理、核对、补问、专业判断、方法维护分别占多少。再与岗位本人商量省下的时间具体转到哪里，同时从旧工作中移走相应负担。\n\n例如销售少抄录后，可以安排客户回访；但要同时明确回访哪些客户、了解什么、结果记在哪里。专业骨干新增了方法维护，就从其原任务中留出对应时间，不能在原产量要求完全不变时，再默认为他追加一份工作。\n\n谈激励时，把希望员工持续做的工作写进评价。先确定贡献及其记录，再由有权管理者结合现有薪酬与考核安排确定认可或奖励方式：\n\n| 要鼓励的贡献 | 留什么可检查的记录 | 怎样纳入岗位安排 |\n| --- | --- | --- |\n| 销售把条件问清，减少退回 | 齐备交接记录、退回原因与后续结果 | 同时看交接质量与响应，不只看提交数量 |\n| 专业骨干把判断教给团队 | 修订的方法、采用的范例、修订后任务表现 | 作为正式工作留时间，在复盘与评价中确认贡献 |\n| 团队减少完整任务负担 | 整理、等待、核对和返工的共同记录 | 以共同结果评估，避免一岗省时另一岗加负担 |\n\n例如销售原来只按提交量评价，就应同时检查需求能否被接手、为何退回；骨干原来只按亲自处理量评价，就要将方法被团队采用、减少重复答疑的贡献纳入记录。试用后由负责人和岗位本人一起复核：新增工作是否得到时间支持，评价是否仍在鼓励旧做法，再提交正式调整。\n\n负责人可以这样开讨论：“这次要把哪些旧动作停掉？你新增哪项工作？需要留多少时间？怎样证明这项贡献？如果发现工作量增加，由谁在什么时候调整？”讨论后把答案写回分工表，并约定下一次回顾时点。涉及既有岗位职责与评价方式的正式调整，由相应有权管理者作出决定。\n\n## 怎样教员工按新方式处理一笔任务\n\n用一条完整材料培训，比先介绍工具功能更直接。下面是可用于演练的虚构消息：\n\n> 这次先要两套，颜色沿用上次的，安装等场地好了再定；明年可能再加一套。\n\n让销售先借助 AI 整理，再独立检查：本次是两套；颜色需要查对应历史；安装日期未定；明年追加只列意向。请他把待补问题交给客户，把已确认信息交给专业人员。然后由专业人员实际打开记录，说明可以开始判断什么、还缺什么。\n\n如果员工把明年意向加进本单，就回到原话修正；如果专业人员仍要从头读聊天才能工作，就调整字段和交接说明；如果找不到记录，就先修入口和权限。培训结束的依据是员工能完成这笔任务并处理一个缺项，而不只是听过讲解。\n\n## 试一轮以后，怎样决定保留还是调整\n\n选出会正常完成、缺材料和需要特殊决定的任务，各走一次。保留每笔的输入、退回原因、各岗位处理与等待时间，以及最终能否接手。任务量增加后，再按同类型比较原有做法与新做法。\n\n复盘时按观察到的情况作决定：\n\n| 实际情况 | 下一步怎样处理 |\n| --- | --- |\n| 缺项在销售处被发现，专业人员能接手，整体负担可接受 | 保留分工，继续观察同类任务，再考虑扩大 |\n| 销售整理更快，专业确认排队更长 | 查标准件是否能按规则分流、人员是否有处理时间，再调整受理与授权 |\n| 骨干反复被临时追问，维护工作没有发生 | 把高频问题收入方法，落实维护时段与评价，减少重复口头答疑 |\n| 员工仍在新旧两处填表 | 指定正式记录，补齐下游访问，停止已被替代的旧动作 |\n| 每份AI初稿都要专业人员重做 | 收缩AI负责范围或改材料与方法，先保住完整任务的质量与时间 |\n\n回顾结束，更新的应是那份日常正在使用的分工表：责任人、受理条件、决定权、维护时间、旧工作退出和下次检查日期。下一笔任务按它运行，岗位调整才真正发生。\n\n如果是 OPC，这些职责可能由你一人承担。仍可以把“整理材料、专业判断、最终承诺、维护方法”分开记；给 AI 的是具体可委托动作，专业判断由自己或合作专业人员完成。先看哪类任务占时间、哪些结果值得留下，再安排自己的时间与外部协作，无需先建立多人岗位架构。\n"},{"id":"c25","file":"25-持续运行风险与变更治理.md","title":"第25章｜持续运行、风险与变更治理","html":"\u003ch1>第25章｜持续运行、风险与变更治理\u003c/h1>\n\u003cp>\u003cstrong>持续运行要让AI能力跟着业务变化更新。企业需要明确谁维护资料与方法，谁处理系统问题，以及变化发生后怎样保持工作接续。\u003c/strong>\u003c/p>\n\u003cp>\u003ca href=\"#c25/do-25\">本章做法：建立一份实际会被使用的运行与接手安排\u003c/a>\u003c/p>\n\u003cp>AI系统可能依赖外部模型、知识资料、接口、账号和业务规则。任何一项变化，都可能改变原先验证过的行为。持续可用需要企业知道由谁发现变化、怎样判断影响，以及出问题时谁继续工作。\u003c/p>\n\u003ch2>按后果决定控制强度\u003c/h2>\n\u003cp>内部草稿写得不合适，与对外发出错误承诺，后果不同。只读查询与修改正式记录，也不能采用完全相同控制。应按数据范围、动作后果、可发现性和可补救程度确定权限与核对。\u003c/p>\n\u003cp>权限可以按用途配置：研究读取相关资料，内容起草生成待用文件，分析调用查询和计算工具；需要改变正式记录的任务，再配置相应写入和确认步骤。这样的分工使日常操作明确，也缩小出错时的影响范围。\u003c/p>\n\u003cp>选择部署方式时，沿实际数据路径查看资料在哪里处理、谁可以访问、怎样保存和删除，再结合合同与内部管理要求作决定。无论采用哪种方式，权限、规则更新和运行责任都要落实到具体系统与人员。\u003c/p>\n\u003ch2>哪些变化值得重新验证\u003c/h2>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>变化\u003c/th>\n\u003cth>可能影响\u003c/th>\n\u003cth>相应检查\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>规则与知识更新\u003c/td>\n\u003ctd>答案适用范围和承诺\u003c/td>\n\u003ctd>新旧任务、边界与历史记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型或任务说明更新\u003c/td>\n\u003ctd>理解、格式、工具选择\u003c/td>\n\u003ctd>核心任务与历史失败\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>平台和接口变化\u003c/td>\n\u003ctd>读取、写入、状态\u003c/td>\n\u003ctd>实际账号与完整路径\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>岗位与权限变化\u003c/td>\n\u003ctd>可见范围和批准\u003c/td>\n\u003ctd>新旧身份及未授权操作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>业务量和任务分布变化\u003c/td>\n\u003ctd>成本、等待和错误\u003c/td>\n\u003ctd>复杂度、负担与异常接手\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>检查范围可以随变化确定：改一条规则，检查受影响任务；换模型，复测核心能力和历史错误；调整身份，重查数据范围。保存当前运行版本，便于出问题时还原当时条件。\u003c/p>\n\u003ch2>监测要看业务，而不只看程序\u003c/h2>\n\u003cp>程序运行率和接口错误有用，但还应观察任务积压、人工改动、退回、结果未采用和客户追问。模型没有报错，也可能持续生成不合用内容；工具调用成功，也可能把记录写错对象。\u003c/p>\n\u003cp>运行日志应让有权人员还原必要过程，同时控制敏感信息范围。并非为了排错就保存所有原文、全部聊天和个人资料。保存什么、谁可看、保留多久，应与企业实际用途一致。\u003c/p>\n\u003cp>问题记录需要归类并分配负责人。资料问题交知识维护，业务冲突交业务负责人，接口与程序问题交技术。避免所有错误都堆到一个“AI不稳定”类别。\u003c/p>\n\u003ch2>降级、回滚与补救各是什么\u003c/h2>\n\u003cp>降级是在能力不可用时继续必要业务，例如人工登记并明确接手，恢复后核对补录。回滚是恢复程序或配置的旧版本。补救则处理已经发生的外部影响，如错误通知、重复申请或不准确承诺。\u003c/p>\n\u003cp>餐厅点单设备暂时不可用，服务员可以改用纸单，把桌号、菜品和是否出餐记清。设备恢复后，已经出过的菜只补登记，不再让厨房重新做。这里临时换一种办法维持营业，就是降级；补回记录，是为了让后面的人知道实际做到哪里。\u003c/p>\n\u003cp>换到企业通知流程，假设一项更新造成重复提醒：业务负责人先暂停这项自动通知，技术人员检查发送记录和更新内容，客服查清哪些客户收到重复消息并处理必要说明。期间需要发出的通知由指定人员接手，逐项记下对象、内容和实际发送时间。技术修复后，先用少量任务验证，再按记录跳过已发送项、继续剩余通知。\u003c/p>\n\u003cp>若采用恢复旧配置的办法，那一步叫回滚；已经发出的重复通知仍需要业务人员处理。程序回到旧版本与客户收到怎样的消息，是两件都要照顾的事。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"25\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iODYzIiB2aWV3Qm94PSIwIDAgMzYwIDg2MyIgcm9sZT0iaW1nIj48dGl0bGU+6YCa55+l5Ye66ZSZ5ZCO5oCO5qC357un57utPC90aXRsZT48ZGVzYz7mmoLlgZzplJnor6/liqjkvZzlkI7kuJrliqHkurrlt6XmjqXmiYvlubbnmbvorrDvvIzmioDmnK/kv67lpI3pqozor4HvvJvmgaLlpI3ml7bmjInlrp7pmYXorrDlvZXot7Pov4flt7Llj5HpobnjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYSIgbWFya2VyV2lkdGg9IjgiIG1hcmtlckhlaWdodD0iOCIgcmVmWD0iNyIgcmVmWT0iNCIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwIEw4IDQgTDAgOCBaIiBmaWxsPSIjMjQ2YTU1Ii8+PC9tYXJrZXI+PC9kZWZzPjxyZWN0IHdpZHRoPSIzNjAiIGhlaWdodD0iODYzIiBmaWxsPSJ3aGl0ZSIvPjxnIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiI+PHRleHQgeD0iMjQiIHk9IjM4IiBmb250LXNpemU9IjI0IiBmaWxsPSIjMjAzZjM4IiBmb250LXdlaWdodD0iNjAwIj7pgJrnn6Xlh7rplJnlkI7mgI7moLfnu6fnu608L3RleHQ+PHRleHQgeD0iMjQiIHk9IjcxIiBmb250LXNpemU9IjE4IiBmaWxsPSIjNjE3MTZiIiBmb250LXdlaWdodD0iNDAwIj7npLrmhI/vvJrmm7TmlrDlkI7lh7rnjrDph43lpI3mj5DphpI8L3RleHQ+PHJlY3QgeD0iMjQiIHk9IjEyNCIgd2lkdGg9IjMxMiIgaGVpZ2h0PSIxMTMiIHJ4PSI4IiBmaWxsPSIjZmNmMmU1IiBzdHJva2U9IiNkNWUwZGEiIHN0cm9rZS13aWR0aD0iMS40Ii8+PHRleHQgeD0iNDAiIHk9Ij 已发和未发。请接手者实际指出记录位置，而不是只说“有问题找技术”。\u003c/p>\n\u003cp>再选一项规则变更走一次：业务负责人提供新规则和生效范围，实施者更新相应资料与入口，用受影响任务和原正常任务验证，确认采用后记下版本与时间。发现结果不合用，先恢复必要业务并处理外部影响，再定位技术原因。\u003c/p>\n\u003cp>之后按企业约定节奏回看积压、人工修改和持续成本。每次问题要留下处理人、实际结果与下一次检查；如果总在同一处人工补救，就将该问题带回方法或实现改造。\u003c/p>\n","text":"# 第25章｜持续运行、风险与变更治理\n\n**持续运行要让AI能力跟着业务变化更新。企业需要明确谁维护资料与方法，谁处理系统问题，以及变化发生后怎样保持工作接续。**\n\n[本章做法：建立一份实际会被使用的运行与接手安排](#do-25)\n\nAI系统可能依赖外部模型、知识资料、接口、账号和业务规则。任何一项变化，都可能改变原先验证过的行为。持续可用需要企业知道由谁发现变化、怎样判断影响，以及出问题时谁继续工作。\n\n## 按后果决定控制强度\n\n内部草稿写得不合适，与对外发出错误承诺，后果不同。只读查询与修改正式记录，也不能采用完全相同控制。应按数据范围、动作后果、可发现性和可补救程度确定权限与核对。\n\n权限可以按用途配置：研究读取相关资料，内容起草生成待用文件，分析调用查询和计算工具；需要改变正式记录的任务，再配置相应写入和确认步骤。这样的分工使日常操作明确，也缩小出错时的影响范围。\n\n选择部署方式时，沿实际数据路径查看资料在哪里处理、谁可以访问、怎样保存和删除，再结合合同与内部管理要求作决定。无论采用哪种方式，权限、规则更新和运行责任都要落实到具体系统与人员。\n\n## 哪些变化值得重新验证\n\n| 变化 | 可能影响 | 相应检查 |\n| --- | --- | --- |\n| 规则与知识更新 | 答案适用范围和承诺 | 新旧任务、边界与历史记录 |\n| 模型或任务说明更新 | 理解、格式、工具选择 | 核心任务与历史失败 |\n| 平台和接口变化 | 读取、写入、状态 | 实际账号与完整路径 |\n| 岗位与权限变化 | 可见范围和批准 | 新旧身份及未授权操作 |\n| 业务量和任务分布变化 | 成本、等待和错误 | 复杂度、负担与异常接手 |\n\n检查范围可以随变化确定：改一条规则，检查受影响任务；换模型，复测核心能力和历史错误；调整身份，重查数据范围。保存当前运行版本，便于出问题时还原当时条件。\n\n## 监测要看业务，而不只看程序\n\n程序运行率和接口错误有用，但还应观察任务积压、人工改动、退回、结果未采用和客户追问。模型没有报错，也可能持续生成不合用内容；工具调用成功，也可能把记录写错对象。\n\n运行日志应让有权人员还原必要过程，同时控制敏感信息范围。并非为了排错就保存所有原文、全部聊天和个人资料。保存什么、谁可看、保留多久，应与企业实际用途一致。\n\n问题记录需要归类并分配负责人。资料问题交知识维护，业务冲突交业务负责人，接口与程序问题交技术。避免所有错误都堆到一个“AI不稳定”类别。\n\n## 降级、回滚与补救各是什么\n\n降级是在能力不可用时继续必要业务，例如人工登记并明确接手，恢复后核对补录。回滚是恢复程序或配置的旧版本。补救则处理已经发生的外部影响，如错误通知、重复申请或不准确承诺。\n\n餐厅点单设备暂时不可用，服务员可以改用纸单，把桌号、菜品和是否出餐记清。设备恢复后，已经出过的菜只补登记，不再让厨房重新做。这里临时换一种办法维持营业，就是降级；补回记录，是为了让后面的人知道实际做到哪里。\n\n换到企业通知流程，假设一项更新造成重复提醒：业务负责人先暂停这项自动通知，技术人员检查发送记录和更新内容，客服查清哪些客户收到重复消息并处理必要说明。期间需要发出的通知由指定人员接手，逐项记下对象、内容和实际发送时间。技术修复后，先用少量任务验证，再按记录跳过已发送项、继续剩余通知。\n\n若采用恢复旧配置的办法，那一步叫回滚；已经发出的重复通知仍需要业务人员处理。程序回到旧版本与客户收到怎样的消息，是两件都要照顾的事。\n\n![自动通知异常后暂停发送，业务人员按发送记录接手并登记；技术修复验证后，系统核对已发项，只继续未发任务。](assets/25.svg)\n\n保存超时时，先查询业务记录，确认结果后再继续。人工接手也记录对象和已完成动作，技术恢复时据此跳过已处理部分。这样可以减少恢复阶段再次产生重复。\n\n## 企业怎样保持可控\n\n为关键能力指定业务和技术责任人，明确常见异常、响应与接手方式，定期查看运行价值。若一项能力很少使用、维护成本不断增加，应允许简化或退役。\n\n治理支持企业把成熟动作交给系统，把重要例外交给有权人员。规则、状态和接手清楚以后，决策者可以减少逐项介入，把注意力放在需要调整的经营选择上。\n\n\u003ca id=\"do-25\">\u003c/a>\n\n## 建立一份实际会被使用的运行与接手安排\n\n打开[运行交接与问题记录](toolkit/07-运行交接与问题记录.docx)，先只登记已经在用的一项能力，例如客服需求整理或自动通知，写出：\n\n- 谁处理业务判断，谁处理程序与连接问题；双方从哪里看到问题。\n- 当前入口、规则与配置版本在哪里；谁有权修改。\n- 出错时暂停哪项动作，业务改从哪里继续，已做事项怎样记。\n- 哪些变化要重新核对，核对用哪笔原任务和什么正常任务。\n\n用本章的通知示例演练：先在允许试用的环境模拟异常，业务人员沿发送记录判断哪些已处理，技术人员说明如何暂停与修复，恢复前双方合并核对已发和未发。请接手者实际指出记录位置，而不是只说“有问题找技术”。\n\n再选一项规则变更走一次：业务负责人提供新规则和生效范围，实施者更新相应资料与入口，用受影响任务和原正常任务验证，确认采用后记下版本与时间。发现结果不合用，先恢复必要业务并处理外部影响，再定位技术原因。\n\n之后按企业约定节奏回看积压、人工修改和持续成本。每次问题要留下处理人、实际结果与下一次检查；如果总在同一处人工补救，就将该问题带回方法或实现改造。\n"},{"id":"c26","file":"26-把项目经验变为组织能力资产.md","title":"第26章｜把项目经验变为组织能力资产","html":"\u003ch1>第26章｜把项目经验变为组织能力资产\u003c/h1>\n\u003cp>\u003cstrong>一项改造值得留下两类成果：当前工作得到改善，下一次同类工作也更容易做好。后者来自能够找到、使用和维护的知识、方法与工具。\u003c/strong>\u003c/p>\n\u003cp>\u003ca href=\"#c26/do-26\">本章做法：完成一张经验卡，并让下一次任务使用它\u003c/a>\u003c/p>\n\u003cp>企业可以在项目结束时整理经验，更有效的做法是在工作中持续提取：哪份资料经常使用，哪种判断反复出现，哪项检查曾发现关键错误，哪段工具连接值得共用。这样，沉淀对象来自实际需要。\u003c/p>\n\u003ch2>从一次修正提取可沿用的方法\u003c/h2>\n\u003cp>设想一份AI生成方案中出现交期错误。沿过程查看，发现它把客户希望的日期当成企业确认日期。团队据此把“期望日期”和“已确认日期”分成两个字段，并要求后者记录确认依据。\u003c/p>\n\u003cp>这项改动可以成为一套方法：从原话识别日期含义，查询是否已有确认，分别保存状态，再根据状态安排追问或继续处理。用已确认、尚未确认和反复变更几类材料检验，确认方法能支持工作后，供其他相关任务使用。\u003c/p>\n\u003cp>迁移到采购时，同样可以区分供应商预计到货与已确认到货，但具体确认规则由采购负责人确定。复用的是区分状态、保存依据的办法，专业内容在新任务中重新明确。经验因此既保持价值，也能适应不同业务。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"26\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iODQ0IiB2aWV3Qm94PSIwIDAgMzYwIDg0NCIgcm9sZT0iaW1nIj48dGl0bGU+5LiA5qyh5L+u5q2j5oCO5qC35oiQ5Li65YWx55So5pa55rOVPC90aXRsZT48ZGVzYz7ml6XmnJ/nirbmgIHplJnor6/lvJXlh7rlrZfmrrXkuI7kvp3mja7orr7orqHvvIznu4/kuI3lkIzmoLfkvovmo4Dmn6XlkI7nlKjkuo7ph4fotK3lnLrmma/jgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYSIgbWFya2VyV2lkdGg9IjgiIG1hcmtlckhlaWdodD0iOCIgcmVmWD0iNyIgcmVmWT0iNCIg 例如服务方案同时使用产品知识、选型方法、价格计算和客户记录。企业需要知道每一部分在哪里，由谁维护；一项规则改变时，就能找到受影响的使用者。\u003c/p>\n\u003ch2>让资产真正进入日常工作\u003c/h2>\n\u003cp>可以把方法放进新人真正接到任务的地方。新销售打开“整理客户需求”入口时，同时得到字段说明、容易混淆的原话示例和可查询的历史订单；AI应用启动同类任务时，也按任务配置取得这份方法。使用中发现“期望日期”被写错，反馈就回到维护这份方法的负责人。这样，改一次能影响后续同类任务，而不是每个人各自保存一份旧笔记。\u003c/p>\n\u003cp>一份方法说明应写清解决什么问题、需要什么输入、怎样得出结果，以及如何检查。工具组件则说明参数、输出、权限和异常处理。配上有效样例与已知失败，使用者更容易判断何时采用。\u003c/p>\n\u003cp>资产应放在使用者能够找到的入口。AI任务可以按用途读取相应方法，员工可以沿业务问题找到资料，开发者可以查看可调用工具。版本和负责人跟随资产保存，反馈也回到这个位置。\u003c/p>\n\u003cp>每次复用记录实际变化：减少了哪些准备，修改了哪些部分，增加多少维护。由此决定继续完善、保持现状或退役。企业投入的是后续工作能力，维护资源应流向实际有用的部分。\u003c/p>\n\u003ch2>怎样从项目经验形成企业观点\u003c/h2>\n\u003cp>经验经过比较，可以沉淀成解释和判断原则。比如，系统集成总要核对实际角色与平台条件，原因是同一功能在不同账号和版本下可能有不同能力；技术修改后要重做原任务，原因是业务恢复还依赖资料、权限和接手；内容交付要打开最终文件，原因是制作与实际使用经过了不同环节。\u003c/p>\n\u003cp>把原则与其原因一起说明，再提供一套可执行做法，就能帮助团队在新场景作判断。原项目的客户姓名和过程细节可以留在受控记录，方法则以适合共用的形式进入组织知识。\u003c/p>\n\u003cp>这样的观点会随使用继续完善。遇到不同条件，先解释为什么需要改变做法，再更新适用方法。企业的专业理解因此能够积累，也能被讨论和修正。\u003c/p>\n\u003ch2>平台建设应从共用需求中生长\u003c/h2>\n\u003cp>当多个场景反复读取同一客户、维护同样身份和状态，各自实现开始产生重复成本，就可以比较建设共用能力。计算包括一次建设、迁移、持续维护和每个场景的接入，也包括继续分开维护的成本。\u003c/p>\n\u003cp>共用层首先服务已经存在的工作。可以先统一客户标识和权限，再逐步增加任务状态、运行记录等。业务场景保留自己的专业规则，统一部分则由明确负责人维护。这样，平台建设与实际收益之间有可检查的关系。\u003c/p>\n\u003cp>企业可以用下一次项目来评价沉淀：诊断是否更快，关键条件是否更早确认，实现是否减少重复，接手是否更容易。一次改造能改善下一次改造，组织才开始形成持续积累。\u003c/p>\n\u003cp>\u003ca id=\"do-26\">\u003c/a>\u003c/p>\n\u003ch2>完成一张经验卡，并让下一次任务使用它\u003c/h2>\n\u003cp>先找一次已经核清原因的修正，例如“客户希望月底”曾被写成“企业确认月底交付”。在\u003ca href=\"#download\" data-download=\"08-经验复用卡.docx\">经验复用卡\u003c/a>记录：\u003c/p>\n\u003cdiv class=\"table-shell\">\u003cp class=\"table-hint\" hidden>左右滑动查看完整表格\u003c/p>\u003cdiv class=\"table-wrap\" tabindex=\"0\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>要留下的内容\u003c/th>\n\u003cth>日期示例\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>原错误及原因\u003c/td>\n\u003ctd>没区分期望与承诺，缺少确认依据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可沿用的方法\u003c/td>\n\u003ctd>从原话区分状态；只有取得相应确认才填已确认日期\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>运行需要什么\u003c/td>\n\u003ctd>原消息、当前任务、正式确认记录及查询入口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>怎样检查\u003c/td>\n\u003ctd>已确认、尚未确认、发生变更的材料都能正确继续\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>谁维护、存在哪里\u003c/td>\n\u003ctd>填写团队实际负责人和共用方法入口\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\u003cp>把方法附在下一次任务材料前，或请实施者配置应用读取，再使用一条新材料。检查它是否减少了准备、挡住原错误，以及有没有新增不必要退回。若只能在原来那条对话里成功，就查哪些未写出的资料或判断还依赖原作者。\u003c/p>\n\u003cp>最后在卡上写下新任务采用了哪版、修改了什么、谁确认有效。把没有实际使用价值的内容保留作历史记录即可；值得复用的方法才进入默认入口并安排维护。\u003c/p>\n","text":"# 第26章｜把项目经验变为组织能力资产\n\n**一项改造值得留下两类成果：当前工作得到改善，下一次同类工作也更容易做好。后者来自能够找到、使用和维护的知识、方法与工具。**\n\n[本章做法：完成一张经验卡，并让下一次任务使用它](#do-26)\n\n企业可以在项目结束时整理经验，更有效的做法是在工作中持续提取：哪份资料经常使用，哪种判断反复出现，哪项检查曾发现关键错误，哪段工具连接值得共用。这样，沉淀对象来自实际需要。\n\n## 从一次修正提取可沿用的方法\n\n设想一份AI生成方案中出现交期错误。沿过程查看，发现它把客户希望的日期当成企业确认日期。团队据此把“期望日期”和“已确认日期”分成两个字段，并要求后者记录确认依据。\n\n这项改动可以成为一套方法：从原话识别日期含义，查询是否已有确认，分别保存状态，再根据状态安排追问或继续处理。用已确认、尚未确认和反复变更几类材料检验，确认方法能支持工作后，供其他相关任务使用。\n\n迁移到采购时，同样可以区分供应商预计到货与已确认到货，但具体确认规则由采购负责人确定。复用的是区分状态、保存依据的办法，专业内容在新任务中重新明确。经验因此既保持价值，也能适应不同业务。\n\n![工作中的错误与修正形成候选方法，经样例检查后进入共用入口。](assets/26.svg)\n\n## 哪种经验保存在哪种资产里\n\n| 重复出现的需要 | 适合积累的资产 | 使用方式 |\n| --- | --- | --- |\n| 需要知道产品、规则或业务事实 | 有版本的知识资料 | 检索并提供给当前任务 |\n| 需要沿同样步骤判断 | 方法说明、范例或Skill | 组织输入、步骤与检查 |\n| 需要稳定计算或执行相同动作 | 程序、接口与工具组件 | 由应用调用并返回结果 |\n| 多个场景共享身份、对象和状态 | 共用系统能力 | 统一维护，再供各场景接入 |\n\n这些资产可以配合。例如服务方案同时使用产品知识、选型方法、价格计算和客户记录。企业需要知道每一部分在哪里，由谁维护；一项规则改变时，就能找到受影响的使用者。\n\n## 让资产真正进入日常工作\n\n可以把方法放进新人真正接到任务的地方。新销售打开“整理客户需求”入口时，同时得到字段说明、容易混淆的原话示例和可查询的历史订单；AI应用启动同类任务时，也按任务配置取得这份方法。使用中发现“期望日期”被写错，反馈就回到维护这份方法的负责人。这样，改一次能影响后续同类任务，而不是每个人各自保存一份旧笔记。\n\n一份方法说明应写清解决什么问题、需要什么输入、怎样得出结果，以及如何检查。工具组件则说明参数、输出、权限和异常处理。配上有效样例与已知失败，使用者更容易判断何时采用。\n\n资产应放在使用者能够找到的入口。AI任务可以按用途读取相应方法，员工可以沿业务问题找到资料，开发者可以查看可调用工具。版本和负责人跟随资产保存，反馈也回到这个位置。\n\n每次复用记录实际变化：减少了哪些准备，修改了哪些部分，增加多少维护。由此决定继续完善、保持现状或退役。企业投入的是后续工作能力，维护资源应流向实际有用的部分。\n\n## 怎样从项目经验形成企业观点\n\n经验经过比较，可以沉淀成解释和判断原则。比如，系统集成总要核对实际角色与平台条件，原因是同一功能在不同账号和版本下可能有不同能力；技术修改后要重做原任务，原因是业务恢复还依赖资料、权限和接手；内容交付要打开最终文件，原因是制作与实际使用经过了不同环节。\n\n把原则与其原因一起说明，再提供一套可执行做法，就能帮助团队在新场景作判断。原项目的客户姓名和过程细节可以留在受控记录，方法则以适合共用的形式进入组织知识。\n\n这样的观点会随使用继续完善。遇到不同条件，先解释为什么需要改变做法，再更新适用方法。企业的专业理解因此能够积累，也能被讨论和修正。\n\n## 平台建设应从共用需求中生长\n\n当多个场景反复读取同一客户、维护同样身份和状态，各自实现开始产生重复成本，就可以比较建设共用能力。计算包括一次建设、迁移、持续维护和每个场景的接入，也包括继续分开维护的成本。\n\n共用层首先服务已经存在的工作。可以先统一客户标识和权限，再逐步增加任务状态、运行记录等。业务场景保留自己的专业规则，统一部分则由明确负责人维护。这样，平台建设与实际收益之间有可检查的关系。\n\n企业可以用下一次项目来评价沉淀：诊断是否更快，关键条件是否更早确认，实现是否减少重复，接手是否更容易。一次改造能改善下一次改造，组织才开始形成持续积累。\n\n\n\u003ca id=\"do-26\">\u003c/a>\n\n## 完成一张经验卡，并让下一次任务使用它\n\n先找一次已经核清原因的修正，例如“客户希望月底”曾被写成“企业确认月底交付”。在[经验复用卡](toolkit/08-经验复用卡.docx)记录：\n\n| 要留下的内容 | 日期示例 |\n| --- | --- |\n| 原错误及原因 | 没区分期望与承诺，缺少确认依据 |\n| 可沿用的方法 | 从原话区分状态；只有取得相应确认才填已确认日期 |\n| 运行需要什么 | 原消息、当前任务、正式确认记录及查询入口 |\n| 怎样检查 | 已确认、尚未确认、发生变更的材料都能正确继续 |\n| 谁维护、存在哪里 | 填写团队实际负责人和共用方法入口 |\n\n把方法附在下一次任务材料前，或请实施者配置应用读取，再使用一条新材料。检查它是否减少了准备、挡住原错误，以及有没有新增不必要退回。若只能在原来那条对话里成功，就查哪些未写出的资料或判断还依赖原作者。\n\n最后在卡上写下新任务采用了哪版、修改了什么、谁确认有效。把没有实际使用价值的内容保留作历史记录即可；值得复用的方法才进入默认入口并安排维护。\n"},{"id":"c27","file":"27-从局部改进走向企业能力与新服务.md","title":"第27章｜从局部改进走向企业能力与新服务","html":"\u003ch1>第27章｜从局部改进走向企业能力与新服务\u003c/h1>\n\u003cp>\u003cstrong>企业AI化有两种相互支持的增长：把已有工作做得更好，以及利用降低的信息处理成本提供新的服务。扩展时，把经营需要与已经形成的能力放在一起考虑。\u003c/strong>\u003c/p>\n\u003cp>\u003ca href=\"#c27/do-27\">本章做法：把一个新服务想法变成有限试用\u003c/a>\u003c/p>\n\u003cp>一项试点完成后，企业更清楚模型适合处理什么，也积累了一些资料、方法、工具和协作经验。下一项投入可以因此少做一部分准备，但仍要回应当前业务最值得解决的问题。\u003c/p>\n\u003ch2>局部改善以后，限制会移动\u003c/h2>\n\u003cp>材料整理加快，专业确认可能开始排队；确认加快，资源安排可能成为限制；交付稳定以后，企业可能更需要新的客户。这些变化说明原有改善正在改变工作条件，也提示了新的投入方向。\u003c/p>\n\u003cp>可以沿同一项结果持续观察。若目标是缩短客户响应，就继续看从收到需求到形成可用答复的整段时间。若目标是服务更多客户，就看专业人员负荷和履约容量。团队据此判断下一步是改善相邻环节、增加资源，还是转向新的经营问题。\u003c/p>\n\u003cfigure class=\"explainer\" data-figure=\"27\">\u003cpicture>\u003csource media=\"screen and (max-width: 720px)\" srcset=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iODQ4IiB2aWV3Qm94PSIwIDAgMzYwIDg0OCIgcm9sZT0iaW1nIj48dGl0bGU+57uP6JCl5pa55ZCR5LiO6IO95Yqb5YWx5ZCM6YCJ6LevPC90aXRsZT48ZGVzYz7nu4/okKXpmZDliLbkuI7lt7LmnInog73li
