Levinthal%20%281990%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">吸收能力研究\u003c/a>、\u003ca href=\"https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">动态能力研究\u003c/a> 它们支持重视持续学习，而不是仅等待一个最终成熟产品。\u003c/p>\n\u003ch2 id=\"lesson-39-section-4\">怎样使用研究，而不把平均效果当预算\u003c/h2>\n\u003cp>客服、创新、办公和开发研究涉及不同任务、人员、工具和时期。它们提供的是在特定条件下发生了什么，以及哪些机制值得研究，不能平均成一个通用的效率提升比例。\u003ca href=\"#reading\">研究与延伸阅读\u003c/a>\u003c/p>\n\u003cp>阅读时应先看原任务是什么、与什么比较、人员承担哪些补救、结果量的是时间还是质量，再判断与本企业有哪些相似条件。反向结果也不意味着技术永远无效，而是帮助发现在哪些安排下额外工作抵消了收益。\u003c/p>\n\u003cp>由此形成的紧迫感可以很具体：客户的购买方式正在改变，企业哪种能力还没形成，哪段工程和学习能够缩短差距。主动转型不必依靠一个确定的行业终局，而可以从这些已经能够观察和改变的关系开始。\u003c/p>\n","headings":[{"id":"lesson-39-section-1","label":"不同业务，技术先改变的环节不同"},{"id":"lesson-39-section-2","label":"客户怎样改变购买，比工具热度更值得追踪"},{"id":"lesson-39-section-3","label":"形成能力的速度，也决定什么时候开始"},{"id":"lesson-39-section-4","label":"怎样使用研究，而不把平均效果当预算"}],"exportMd":"# 第39章｜同一种AI，为什么会以不同速度改变企业\n\n内容团队几分钟就能生成一篇文章，设备企业却不可能几分钟完成所有上门维修。看上去前者受到AI影响更快，后者似乎可以等待。但若另一家服务商已经利用AI改善准备、少跑一次现场、让客户更早恢复生产，竞争也可能已经开始变化。\n\n判断紧迫性，要看智能能力沿着哪条路径影响客户选择，以及本企业形成相应能力需要多久。行业名称和数字化程度只能提供部分线索。\n\n## 不同业务，技术先改变的环节不同\n\n内容服务中，起草成本可能较快下降，客户可以自行完成一部分工作，也可能重新议价。工业品业务中，材料理解和候选比较变快，但供货、价格与工程确认仍需兑现。连锁企业需要把需求判断接到生产、配送和门店；设备服务则需要把经验调用接到专业支持和现场动作。\n\n| 业务 | 智能可能先改变的工作 | 客户价值还需经过 |\n|---|---|---|\n| 内容服务 | 构思、资料整理、核验辅助 | 采用、发布、询价与跟进 |\n| 工业品 | 理解要求、比较适配、组织方案 | 供货、价格确认和交付 |\n| 连锁经营 | 连接需求线索、比较排产 | 品质、生产、配送和门店销售 |\n| 设备服务 | 调用经验、准备材料、持续跟进 | 专业判断、备件和现场恢复 |\n\n表中的后半段不会因为模型进步自动消失，却可能因智能介入而重新组织。实物环节多，只是改变作用方式，不意味着竞争者无法取得优势。\n\n## 客户怎样改变购买，比工具热度更值得追踪\n\n当一般起草更容易取得，客户可能自己做初稿，只付费购买专业核验；当报价更快成为普遍能力，客户可能转而看谁能可靠履约；当设备服务能提供更连续的支持，客户也可能重新评价一次维修的价格和长期合同。\n\n企业需要观察真实询价、未成交理由、采购范围和价格变化。某项技术很热门，并不证明本企业客户马上改变；客户已经开始拆分采购，也不能因行业整体尚慢就继续沿用原有收费逻辑。\n\n通用能力普及后，一部分改善还可能通过降价让给客户，或流向掌握入口的平台。课程报价算例中，订单从200增加到250，单均贡献却从500降到400，新增费用前的总贡献仍为100000元。规模扩大并不会自动保护利润。\n\n## 形成能力的速度，也决定什么时候开始\n\n外部产品以后可以买到，但企业自己的客户理解、资料关联、工作方法和协作习惯，需要在任务中形成。反馈越慢、业务越复杂，可能越需要提前建立学习条件。\n\n例如设备服务要知道一种方法是否减少复发，可能需要跟踪后续；新门店要了解当地客流，也需要经历实际经营。等竞争压力已经很大时再开始，企业不仅要采购工具，还要同时补这些认识。\n\n吸收能力和动态能力研究分别关注相关知识如何帮助应用新知识，以及组织如何在变化中重新组合能力。[吸收能力研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)、[动态能力研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf) 它们支持重视持续学习，而不是仅等待一个最终成熟产品。\n\n## 怎样使用研究，而不把平均效果当预算\n\n客服、创新、办公和开发研究涉及不同任务、人员、工具和时期。它们提供的是在特定条件下发生了什么，以及哪些机制值得研究，不能平均成一个通用的效率提升比例。[研究与延伸阅读](#reading)\n\n阅读时应先看原任务是什么、与什么比较、人员承担哪些补救、结果量的是时间还是质量，再判断与本企业有哪些相似条件。反向结果也不意味着技术永远无效，而是帮助发现在哪些安排下额外工作抵消了收益。\n\n由此形成的紧迫感可以很具体：客户的购买方式正在改变，企业哪种能力还没形成，哪段工程和学习能够缩短差距。主动转型不必依靠一个确定的行业终局，而可以从这些已经能够观察和改变的关系开始。\n","exportSingleMd":"# 第39章｜同一种AI，为什么会以不同速度改变企业\n\n内容团队几分钟就能生成一篇文章，设备企业却不可能几分钟完成所有上门维修。看上去前者受到AI影响更快，后者似乎可以等待。但若另一家服务商已经利用AI改善准备、少跑一次现场、让客户更早恢复生产，竞争也可能已经开始变化。\n\n判断紧迫性，要看智能能力沿着哪条路径影响客户选择，以及本企业形成相应能力需要多久。行业名称和数字化程度只能提供部分线索。\n\n## 不同业务，技术先改变的环节不同\n\n内容服务中，起草成本可能较快下降，客户可以自行完成一部分工作，也可能重新议价。工业品业务中，材料理解和候选比较变快，但供货、价格与工程确认仍需兑现。连锁企业需要把需求判断接到生产、配送和门店；设备服务则需要把经验调用接到专业支持和现场动作。\n\n| 业务 | 智能可能先改变的工作 | 客户价值还需经过 |\n|---|---|---|\n| 内容服务 | 构思、资料整理、核验辅助 | 采用、发布、询价与跟进 |\n| 工业品 | 理解要求、比较适配、组织方案 | 供货、价格确认和交付 |\n| 连锁经营 | 连接需求线索、比较排产 | 品质、生产、配送和门店销售 |\n| 设备服务 | 调用经验、准备材料、持续跟进 | 专业判断、备件和现场恢复 |\n\n表中的后半段不会因为模型进步自动消失，却可能因智能介入而重新组织。实物环节多，只是改变作用方式，不意味着竞争者无法取得优势。\n\n## 客户怎样改变购买，比工具热度更值得追踪\n\n当一般起草更容易取得，客户可能自己做初稿，只付费购买专业核验；当报价更快成为普遍能力，客户可能转而看谁能可靠履约；当设备服务能提供更连续的支持，客户也可能重新评价一次维修的价格和长期合同。\n\n企业需要观察真实询价、未成交理由、采购范围和价格变化。某项技术很热门，并不证明本企业客户马上改变；客户已经开始拆分采购，也不能因行业整体尚慢就继续沿用原有收费逻辑。\n\n通用能力普及后，一部分改善还可能通过降价让给客户，或流向掌握入口的平台。课程报价算例中，订单从200增加到250，单均贡献却从500降到400，新增费用前的总贡献仍为100000元。规模扩大并不会自动保护利润。\n\n## 形成能力的速度，也决定什么时候开始\n\n外部产品以后可以买到，但企业自己的客户理解、资料关联、工作方法和协作习惯，需要在任务中形成。反馈越慢、业务越复杂，可能越需要提前建立学习条件。\n\n例如设备服务要知道一种方法是否减少复发，可能需要跟踪后续；新门店要了解当地客流，也需要经历实际经营。等竞争压力已经很大时再开始，企业不仅要采购工具，还要同时补这些认识。\n\n吸收能力和动态能力研究分别关注相关知识如何帮助应用新知识，以及组织如何在变化中重新组合能力。[吸收能力研究](https://josephmahoney.web.illinois.edu/BA545_Fall%202022/Cohen%20and%20Levinthal%20%281990%29.pdf)、[动态能力研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf) 它们支持重视持续学习，而不是仅等待一个最终成熟产品。\n\n## 怎样使用研究，而不把平均效果当预算\n\n客服、创新、办公和开发研究涉及不同任务、人员、工具和时期。它们提供的是在特定条件下发生了什么，以及哪些机制值得研究，不能平均成一个通用的效率提升比例。[研究与延伸阅读](https://zhongky1995.github.io/gaidn-fde-handbook/#reading)\n\n阅读时应先看原任务是什么、与什么比较、人员承担哪些补救、结果量的是时间还是质量，再判断与本企业有哪些相似条件。反向结果也不意味着技术永远无效，而是帮助发现在哪些安排下额外工作抵消了收益。\n\n由此形成的紧迫感可以很具体：客户的购买方式正在改变，企业哪种能力还没形成，哪段工程和学习能够缩短差距。主动转型不必依靠一个确定的行业终局，而可以从这些已经能够观察和改变的关系开始。\n","text":"# 第39章｜同一种AI，为什么会以不同速度改变企业\n\n内容团队几分钟就能生成一篇文章，设备企业却不可能几分钟完成所有上门维修。看上去前者受到AI影响更快，后者似乎可以等待。但若另一家服务商已经利用AI改善准备、少跑一次现场、让客户更早恢复生产，竞争也可能已经开始变化。\n\n判断紧迫性，要看智能能力沿着哪条路径影响客户选择，以及本企业形成相应能力需要多久。行业名称和数字化程度只能提供部分线索。\n\n## 不同业务，技术先改变的环节不同\n\n内容服务中，起草成本可能较快下降，客户可以自行完成一部分工作，也可能重新议价。工业品业务中，材料理解和候选比较变快，但供货、价格与工程确认仍需兑现。连锁企业需要把需求判断接到生产、配送和门店；设备服务则需要把经验调用接到专业支持和现场动作。\n\n| 业务 | 智能可能先改变的工作 | 客户价值还需经过 |\n|---|---|---|\n| 内容服务 | 构思、资料整理、核验辅助 | 采用、发布、询价与跟进 |\n| 工业品 | 理解要求、比较适配、组织方案 | 供货、价格确认和交付 |\n| 连锁经营 | 连接需求线索、比较排产 | 品质、生产、配送和门店销售 |\n| 设备服务 | 调用经验、准备材料、持续跟进 | 专业判断、备件和现场恢复 |\n\n表中的后半段不会因为模型进步自动消失，却可能因智能介入而重新组织。实物环节多，只是改变作用方式，不意味着竞争者无法取得优势。\n\n## 客户怎样改变购买，比工具热度更值得追踪\n\n当一般起草更容易取得，客户可能自己做初稿，只付费购买专业核验；当报价更快成为普遍能力，客户可能转而看谁能可靠履约；当设备服务能提供更连续的支持，客户也可能重新评价一次维修的价格和长期合同。\n\n企业需要观察真实询价、未成交理由、采购范围和价格变化。某项技术很热门，并不证明本企业客户马上改变；客户已经开始拆分采购，也不能因行业整体尚慢就继续沿用原有收费逻辑。\n\n通用能力普及后，一部分改善还可能通过降价让给客户，或流向掌握入口的平台。课程报价算例中，订单从200增加到250，单均贡献却从500降到400，新增费用前的总贡献仍为100000元。规模扩大并不会自动保护利润。\n\n## 形成能力的速度，也决定什么时候开始\n\n外部产品以后可以买到，但企业自己的客户理解、资料关联、工作方法和协作习惯，需要在任务中形成。反馈越慢、业务越复杂，可能越需要提前建立学习条件。\n\n例如设备服务要知道一种方法是否减少复发，可能需要跟踪后续；新门店要了解当地客流，也需要经历实际经营。等竞争压力已经很大时再开始，企业不仅要采购工具，还要同时补这些认识。\n\n吸收能力和动态能力研究分别关注相关知识如何帮助应用新知识，以及组织如何在变化中重新组合能力。吸收能力研究、动态能力研究 它们支持重视持续学习，而不是仅等待一个最终成熟产品。\n\n## 怎样使用研究，而不把平均效果当预算\n\n客服、创新、办公和开发研究涉及不同任务、人员、工具和时期。它们提供的是在特定条件下发生了什么，以及哪些机制值得研究，不能平均成一个通用的效率提升比例。研究与延伸阅读\n\n阅读时应先看原任务是什么、与什么比较、人员承担哪些补救、结果量的是时间还是质量，再判断与本企业有哪些相似条件。反向结果也不意味着技术永远无效，而是帮助发现在哪些安排下额外工作抵消了收益。\n\n由此形成的紧迫感可以很具体：客户的购买方式正在改变，企业哪种能力还没形成，哪段工程和学习能够缩短差距。主动转型不必依靠一个确定的行业终局，而可以从这些已经能够观察和改变的关系开始。\n"},{"file":"40-完整改造提案.md","id":"lesson-40","number":40,"role":"核心课","part":7,"title":"第40章｜把案例推导成一份真正可以决定投入的提案","md":"# 第40章｜把案例推导成一份真正可以决定投入的提案\n\n“建设知识库、提升效率、形成壁垒”可以出现在很多提案里，却无法让经营、业务和工程对同一件事作决定。负责人不知道收益怎样发生，员工不知道工作怎样改变，工程师也只能自行猜测功能。\n\n一份完整提案应当把背景、机会、作用过程、可执行方案、收益和未知连起来。下面用[连锁烘焙教学案例](案例A-连锁备货.md)写出一项候选改造的主要推导。它是练习材料，真实企业的负责人、日期和预算仍需根据实际情况填写。\n\n## 先把值得投入的经营问题讲清楚\n\n企业有八家门店和中央工坊，主打点心每天早晨统一配送。交通枢纽附近的X店收到80份，18点卖完后仍有人询问；居民区的Y店也收到80份，却只卖出60份。只看日报，总部可以把Y的20份转给X，但还不知道X未满足的需求有多大。\n\n进一步核对发现，在其他六店订单已经安排以后，工坊可用于这两店的生产时段最多能做320份，目前只排160份。下午追加生产需要新的配送；门店售罄以后，也停止这款商品的推介和持续预订记录。\n\n这些事实使问题从“分货不均”延伸为一组相互影响的安排：供给限制销量和需求获取，较少的需求线索又影响下一轮排产。目标因此是更可靠地满足有价值的需求，同时控制剩余，并留下以后可用的判断方法。目标不是单纯让日报更快生成。\n\n## 说明准备怎样改变工作，为什么会有作用\n\nAI可以协助关联销售时段、店长说明、排产和推广材料，指出值得核实的关系。FDE把原材料、候选安排、批准决定、实际到店和最终销售对应起来，让负责人能够比较不同改法。\n\n若决定试补货，工坊确认可用产能与品质，配送确认时段，门店安排接货、上架和需求记录。实际结果返回以后，再判断新增供给是否卖出、推介是否有效、哪些原假设需要修正。\n\n作用路径因此是：更完整地理解需求与限制，形成可执行安排，实际改变供给与门店工作，再根据结果更新。AI参与信息组织和判断支持，人员与生产资源共同使变化发生。企业既争取当期贡献，也积累带条件和结果的方法。\n\n## 把收益与最合理的替代放在一起\n\n为看清增长空间，先假设正常日X有160份、Y有60份可成交需求，每份售价12元、生产变动成本4元，未售无残值，原固定费用不变。扩产方案另增加80元日常配送与AI整理支出。\n\n| 方案 | 当天生产与销售 | 扣列示支出后的贡献 |\n|---|---|---:|\n| 原80/80 | 生产160，售出140 | 1040元 |\n| 只改100/60 | 生产160，售出160 | 1280元 |\n| 扩产补货160/60 | 生产220，售出220 | 1680元 |\n\n第三种比原来多640元，比简单改分配多400元。X这款商品销量可以翻倍，两店合计增加约57.1%，但不能据此宣称整店收入或公司利润翻倍。\n\n进一步看门槛：扩产相对只改分配，多生产60份，成本240元，加80元新增支出，共320元。每多卖一份收入12元，至少多卖27份才超过这笔成本。一次接入6000元另计；若同样正常条件持续20天，相对原安排增加12800元，扣接入后为6800元。这些是条件推演，需求和执行必须通过实际工作核实。\n\n提案首先比较完整可行安排，不必在行动前把每一元收益精确归给某项技术。但普通改配本来能取得的240元，也不能全部称为AI贡献。后续决定继续升级模型还是改善配送时，再围绕这项选择研究各自增量。\n\n## 第一阶段，应取得能够改变决定的证据\n\n先核实生产、品质和补货条件，再在有限范围增加供给，并记录售罄后的需求、实际到店、推介、成交和剩余。确定谁执行、投入多少时间、什么时候复查，让观察有机会进入下一次决定。\n\n若新增销售不足以优于简单分配，就保留简单方案；若需求存在而配送迟到，先修履约；若建议和实际动作对应不上，先修记录与采用过程。效果有依据以后，再看其他日期、接任人员和新店能否使用，避免把一次正常日当作永久规律。\n\n两店共享资源，还要观察是否挤占其他门店或商品。局部增长如果只是转移需求或产能，企业总收益可能不同。\n\n## 责任和纠错应当写进同一项安排\n\n门店确认现场事实并执行销售动作，中央负责人决定产量和跨店资源，专业人员确认品质与方法，FDE实现材料、工具和反馈，内部承担者逐步维护与接任。不能把所有跨部门取舍都留给工程团队，也不能让员工对无权改变的供给负责。\n\n若交通变化使X需求降到50、Y升到90，继续扩产的贡献只有360元，低于原安排920元，少560元。新事实应进入当前决定，原方法需要调整；历史依据仍可保留，用来说明为什么改变。报告这种反例，应成为学习材料，而不是使员工不敢反馈的理由。\n\n## 换一种业务，检查方法是否真正掌握\n\n工业品业务需要从适配、期限和供货推到订单贡献，不能把“门店”简单换成“客户”；设备服务需要分清可避免复访与必要分阶段工作，并区分客户停机损失和服务商现金；内容服务则需要把生成、核验、真实付费需求和后续行动连起来。\n\n相同的提案逻辑进入不同业务，具体事实、资源和收益会变化。能够根据自身材料重新完成推导，才说明课程开始转化为经营判断。\n\n配套[工作簿](工作簿-改造提案.md)用于把这些内容写成可讨论的决定。提案可以有未知，但每个重要未知都应说明怎样取得依据，以及答案不同会怎样改变下一步。这样，读者才能理解为什么现在值得做、准备怎样做，以及什么时候应当改法。\n","html":"\u003ch1>第40章｜把案例推导成一份真正可以决定投入的提案\u003c/h1>\n\u003cp>“建设知识库、提升效率、形成壁垒”可以出现在很多提案里，却无法让经营、业务和工程对同一件事作决定。负责人不知道收益怎样发生，员工不知道工作怎样改变，工程师也只能自行猜测功能。\u003c/p>\n\u003cp>一份完整提案应当把背景、机会、作用过程、可执行方案、收益和未知连起来。下面用\u003ca href=\"#case-a\">连锁烘焙教学案例\u003c/a>写出一项候选改造的主要推导。它是练习材料，真实企业的负责人、日期和预算仍需根据实际情况填写。\u003c/p>\n\u003ch2 id=\"lesson-40-section-1\">先把值得投入的经营问题讲清楚\u003c/h2>\n\u003cp>企业有八家门店和中央工坊，主打点心每天早晨统一配送。交通枢纽附近的X店收到80份，18点卖完后仍有人询问；居民区的Y店也收到80份，却只卖出60份。只看日报，总部可以把Y的20份转给X，但还不知道X未满足的需求有多大。\u003c/p>\n\u003cp>进一步核对发现，在其他六店订单已经安排以后，工坊可用于这两店的生产时段最多能做320份，目前只排160份。下午追加生产需要新的配送；门店售罄以后，也停止这款商品的推介和持续预订记录。\u003c/p>\n\u003cp>这些事实使问题从“分货不均”延伸为一组相互影响的安排：供给限制销量和需求获取，较少的需求线索又影响下一轮排产。目标因此是更可靠地满足有价值的需求，同时控制剩余，并留下以后可用的判断方法。目标不是单纯让日报更快生成。\u003c/p>\n\u003ch2 id=\"lesson-40-section-2\">说明准备怎样改变工作，为什么会有作用\u003c/h2>\n\u003cp>AI可以协助关联销售时段、店长说明、排产和推广材料，指出值得核实的关系。FDE把原材料、候选安排、批准决定、实际到店和最终销售对应起来，让负责人能够比较不同改法。\u003c/p>\n\u003cp>若决定试补货，工坊确认可用产能与品质，配送确认时段，门店安排接货、上架和需求记录。实际结果返回以后，再判断新增供给是否卖出、推介是否有效、哪些原假设需要修正。\u003c/p>\n\u003cp>作用路径因此是：更完整地理解需求与限制，形成可执行安排，实际改变供给与门店工作，再根据结果更新。AI参与信息组织和判断支持，人员与生产资源共同使变化发生。企业既争取当期贡献，也积累带条件和结果的方法。\u003c/p>\n\u003ch2 id=\"lesson-40-section-3\">把收益与最合理的替代放在一起\u003c/h2>\n\u003cp>为看清增长空间，先假设正常日X有160份、Y有60份可成交需求，每份售价12元、生产变动成本4元，未售无残值，原固定费用不变。扩产方案另增加80元日常配送与AI整理支出。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方案\u003c/th>\n\u003cth>当天生产与销售\u003c/th>\n\u003cth align=\"right\">扣列示支出后的贡献\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>原80/80\u003c/td>\n\u003ctd>生产160，售出140\u003c/td>\n\u003ctd align=\"right\">1040元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>只改100/60\u003c/td>\n\u003ctd>生产160，售出160\u003c/td>\n\u003ctd align=\"right\">1280元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>扩产补货160/60\u003c/td>\n\u003ctd>生产220，售出220\u003c/td>\n\u003ctd align=\"right\">1680元\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>第三种比原来多640元，比简单改分配多400元。X这款商品销量可以翻倍，两店合计增加约57.1%，但不能据此宣称整店收入或公司利润翻倍。\u003c/p>\n\u003cp>进一步看门槛：扩产相对只改分配，多生产60份，成本240元，加80元新增支出，共320元。每多卖一份收入12元，至少多卖27份才超过这笔成本。一次接入6000元另计；若同样正常条件持续20天，相对原安排增加12800元，扣接入后为6800元。这些是条件推演，需求和执行必须通过实际工作核实。\u003c/p>\n\u003cp>提案首先比较完整可行安排，不必在行动前把每一元收益精确归给某项技术。但普通改配本来能取得的240元，也不能全部称为AI贡献。后续决定继续升级模型还是改善配送时，再围绕这项选择研究各自增量。\u003c/p>\n\u003ch2 id=\"lesson-40-section-4\">第一阶段，应取得能够改变决定的证据\u003c/h2>\n\u003cp>先核实生产、品质和补货条件，再在有限范围增加供给，并记录售罄后的需求、实际到店、推介、成交和剩余。确定谁执行、投入多少时间、什么时候复查，让观察有机会进入下一次决定。\u003c/p>\n\u003cp>若新增销售不足以优于简单分配，就保留简单方案；若需求存在而配送迟到，先修履约；若建议和实际动作对应不上，先修记录与采用过程。效果有依据以后，再看其他日期、接任人员和新店能否使用，避免把一次正常日当作永久规律。\u003c/p>\n\u003cp>两店共享资源，还要观察是否挤占其他门店或商品。局部增长如果只是转移需求或产能，企业总收益可能不同。\u003c/p>\n\u003ch2 id=\"lesson-40-section-5\">责任和纠错应当写进同一项安排\u003c/h2>\n\u003cp>门店确认现场事实并执行销售动作，中央负责人决定产量和跨店资源，专业人员确认品质与方法，FDE实现材料、工具和反馈，内部承担者逐步维护与接任。不能把所有跨部门取舍都留给工程团队，也不能让员工对无权改变的供给负责。\u003c/p>\n\u003cp>若交通变化使X需求降到50、Y升到90，继续扩产的贡献只有360元，低于原安排920元，少560元。新事实应进入当前决定，原方法需要调整；历史依据仍可保留，用来说明为什么改变。报告这种反例，应成为学习材料，而不是使员工不敢反馈的理由。\u003c/p>\n\u003ch2 id=\"lesson-40-section-6\">换一种业务，检查方法是否真正掌握\u003c/h2>\n\u003cp>工业品业务需要从适配、期限和供货推到订单贡献，不能把“门店”简单换成“客户”；设备服务需要分清可避免复访与必要分阶段工作，并区分客户停机损失和服务商现金；内容服务则需要把生成、核验、真实付费需求和后续行动连起来。\u003c/p>\n\u003cp>相同的提案逻辑进入不同业务，具体事实、资源和收益会变化。能够根据自身材料重新完成推导，才说明课程开始转化为经营判断。\u003c/p>\n\u003cp>配套\u003ca href=\"#workbook\">工作簿\u003c/a>用于把这些内容写成可讨论的决定。提案可以有未知，但每个重要未知都应说明怎样取得依据，以及答案不同会怎样改变下一步。这样，读者才能理解为什么现在值得做、准备怎样做，以及什么时候应当改法。\u003c/p>\n","headings":[{"id":"lesson-40-section-1","label":"先把值得投入的经营问题讲清楚"},{"id":"lesson-40-section-2","label":"说明准备怎样改变工作，为什么会有作用"},{"id":"lesson-40-section-3","label":"把收益与最合理的替代放在一起"},{"id":"lesson-40-section-4","label":"第一阶段，应取得能够改变决定的证据"},{"id":"lesson-40-section-5","label":"责任和纠错应当写进同一项安排"},{"id":"lesson-40-section-6","label":"换一种业务，检查方法是否真正掌握"}],"exportMd":"# 第40章｜把案例推导成一份真正可以决定投入的提案\n\n“建设知识库、提升效率、形成壁垒”可以出现在很多提案里，却无法让经营、业务和工程对同一件事作决定。负责人不知道收益怎样发生，员工不知道工作怎样改变，工程师也只能自行猜测功能。\n\n一份完整提案应当把背景、机会、作用过程、可执行方案、收益和未知连起来。下面用[连锁烘焙教学案例](#case-a)写出一项候选改造的主要推导。它是练习材料，真实企业的负责人、日期和预算仍需根据实际情况填写。\n\n## 先把值得投入的经营问题讲清楚\n\n企业有八家门店和中央工坊，主打点心每天早晨统一配送。交通枢纽附近的X店收到80份，18点卖完后仍有人询问；居民区的Y店也收到80份，却只卖出60份。只看日报，总部可以把Y的20份转给X，但还不知道X未满足的需求有多大。\n\n进一步核对发现，在其他六店订单已经安排以后，工坊可用于这两店的生产时段最多能做320份，目前只排160份。下午追加生产需要新的配送；门店售罄以后，也停止这款商品的推介和持续预订记录。\n\n这些事实使问题从“分货不均”延伸为一组相互影响的安排：供给限制销量和需求获取，较少的需求线索又影响下一轮排产。目标因此是更可靠地满足有价值的需求，同时控制剩余，并留下以后可用的判断方法。目标不是单纯让日报更快生成。\n\n## 说明准备怎样改变工作，为什么会有作用\n\nAI可以协助关联销售时段、店长说明、排产和推广材料，指出值得核实的关系。FDE把原材料、候选安排、批准决定、实际到店和最终销售对应起来，让负责人能够比较不同改法。\n\n若决定试补货，工坊确认可用产能与品质，配送确认时段，门店安排接货、上架和需求记录。实际结果返回以后，再判断新增供给是否卖出、推介是否有效、哪些原假设需要修正。\n\n作用路径因此是：更完整地理解需求与限制，形成可执行安排，实际改变供给与门店工作，再根据结果更新。AI参与信息组织和判断支持，人员与生产资源共同使变化发生。企业既争取当期贡献，也积累带条件和结果的方法。\n\n## 把收益与最合理的替代放在一起\n\n为看清增长空间，先假设正常日X有160份、Y有60份可成交需求，每份售价12元、生产变动成本4元，未售无残值，原固定费用不变。扩产方案另增加80元日常配送与AI整理支出。\n\n| 方案 | 当天生产与销售 | 扣列示支出后的贡献 |\n|---|---|---:|\n| 原80/80 | 生产160，售出140 | 1040元 |\n| 只改100/60 | 生产160，售出160 | 1280元 |\n| 扩产补货160/60 | 生产220，售出220 | 1680元 |\n\n第三种比原来多640元，比简单改分配多400元。X这款商品销量可以翻倍，两店合计增加约57.1%，但不能据此宣称整店收入或公司利润翻倍。\n\n进一步看门槛：扩产相对只改分配，多生产60份，成本240元，加80元新增支出，共320元。每多卖一份收入12元，至少多卖27份才超过这笔成本。一次接入6000元另计；若同样正常条件持续20天，相对原安排增加12800元，扣接入后为6800元。这些是条件推演，需求和执行必须通过实际工作核实。\n\n提案首先比较完整可行安排，不必在行动前把每一元收益精确归给某项技术。但普通改配本来能取得的240元，也不能全部称为AI贡献。后续决定继续升级模型还是改善配送时，再围绕这项选择研究各自增量。\n\n## 第一阶段，应取得能够改变决定的证据\n\n先核实生产、品质和补货条件，再在有限范围增加供给，并记录售罄后的需求、实际到店、推介、成交和剩余。确定谁执行、投入多少时间、什么时候复查，让观察有机会进入下一次决定。\n\n若新增销售不足以优于简单分配，就保留简单方案；若需求存在而配送迟到，先修履约；若建议和实际动作对应不上，先修记录与采用过程。效果有依据以后，再看其他日期、接任人员和新店能否使用，避免把一次正常日当作永久规律。\n\n两店共享资源，还要观察是否挤占其他门店或商品。局部增长如果只是转移需求或产能，企业总收益可能不同。\n\n## 责任和纠错应当写进同一项安排\n\n门店确认现场事实并执行销售动作，中央负责人决定产量和跨店资源，专业人员确认品质与方法，FDE实现材料、工具和反馈，内部承担者逐步维护与接任。不能把所有跨部门取舍都留给工程团队，也不能让员工对无权改变的供给负责。\n\n若交通变化使X需求降到50、Y升到90，继续扩产的贡献只有360元，低于原安排920元，少560元。新事实应进入当前决定，原方法需要调整；历史依据仍可保留，用来说明为什么改变。报告这种反例，应成为学习材料，而不是使员工不敢反馈的理由。\n\n## 换一种业务，检查方法是否真正掌握\n\n工业品业务需要从适配、期限和供货推到订单贡献，不能把“门店”简单换成“客户”；设备服务需要分清可避免复访与必要分阶段工作，并区分客户停机损失和服务商现金；内容服务则需要把生成、核验、真实付费需求和后续行动连起来。\n\n相同的提案逻辑进入不同业务，具体事实、资源和收益会变化。能够根据自身材料重新完成推导，才说明课程开始转化为经营判断。\n\n配套[工作簿](#workbook)用于把这些内容写成可讨论的决定。提案可以有未知，但每个重要未知都应说明怎样取得依据，以及答案不同会怎样改变下一步。这样，读者才能理解为什么现在值得做、准备怎样做，以及什么时候应当改法。\n","exportSingleMd":"# 第40章｜把案例推导成一份真正可以决定投入的提案\n\n“建设知识库、提升效率、形成壁垒”可以出现在很多提案里，却无法让经营、业务和工程对同一件事作决定。负责人不知道收益怎样发生，员工不知道工作怎样改变，工程师也只能自行猜测功能。\n\n一份完整提案应当把背景、机会、作用过程、可执行方案、收益和未知连起来。下面用[连锁烘焙教学案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-a)写出一项候选改造的主要推导。它是练习材料，真实企业的负责人、日期和预算仍需根据实际情况填写。\n\n## 先把值得投入的经营问题讲清楚\n\n企业有八家门店和中央工坊，主打点心每天早晨统一配送。交通枢纽附近的X店收到80份，18点卖完后仍有人询问；居民区的Y店也收到80份，却只卖出60份。只看日报，总部可以把Y的20份转给X，但还不知道X未满足的需求有多大。\n\n进一步核对发现，在其他六店订单已经安排以后，工坊可用于这两店的生产时段最多能做320份，目前只排160份。下午追加生产需要新的配送；门店售罄以后，也停止这款商品的推介和持续预订记录。\n\n这些事实使问题从“分货不均”延伸为一组相互影响的安排：供给限制销量和需求获取，较少的需求线索又影响下一轮排产。目标因此是更可靠地满足有价值的需求，同时控制剩余，并留下以后可用的判断方法。目标不是单纯让日报更快生成。\n\n## 说明准备怎样改变工作，为什么会有作用\n\nAI可以协助关联销售时段、店长说明、排产和推广材料，指出值得核实的关系。FDE把原材料、候选安排、批准决定、实际到店和最终销售对应起来，让负责人能够比较不同改法。\n\n若决定试补货，工坊确认可用产能与品质，配送确认时段，门店安排接货、上架和需求记录。实际结果返回以后，再判断新增供给是否卖出、推介是否有效、哪些原假设需要修正。\n\n作用路径因此是：更完整地理解需求与限制，形成可执行安排，实际改变供给与门店工作，再根据结果更新。AI参与信息组织和判断支持，人员与生产资源共同使变化发生。企业既争取当期贡献，也积累带条件和结果的方法。\n\n## 把收益与最合理的替代放在一起\n\n为看清增长空间，先假设正常日X有160份、Y有60份可成交需求，每份售价12元、生产变动成本4元，未售无残值，原固定费用不变。扩产方案另增加80元日常配送与AI整理支出。\n\n| 方案 | 当天生产与销售 | 扣列示支出后的贡献 |\n|---|---|---:|\n| 原80/80 | 生产160，售出140 | 1040元 |\n| 只改100/60 | 生产160，售出160 | 1280元 |\n| 扩产补货160/60 | 生产220，售出220 | 1680元 |\n\n第三种比原来多640元，比简单改分配多400元。X这款商品销量可以翻倍，两店合计增加约57.1%，但不能据此宣称整店收入或公司利润翻倍。\n\n进一步看门槛：扩产相对只改分配，多生产60份，成本240元，加80元新增支出，共320元。每多卖一份收入12元，至少多卖27份才超过这笔成本。一次接入6000元另计；若同样正常条件持续20天，相对原安排增加12800元，扣接入后为6800元。这些是条件推演，需求和执行必须通过实际工作核实。\n\n提案首先比较完整可行安排，不必在行动前把每一元收益精确归给某项技术。但普通改配本来能取得的240元，也不能全部称为AI贡献。后续决定继续升级模型还是改善配送时，再围绕这项选择研究各自增量。\n\n## 第一阶段，应取得能够改变决定的证据\n\n先核实生产、品质和补货条件，再在有限范围增加供给，并记录售罄后的需求、实际到店、推介、成交和剩余。确定谁执行、投入多少时间、什么时候复查，让观察有机会进入下一次决定。\n\n若新增销售不足以优于简单分配，就保留简单方案；若需求存在而配送迟到，先修履约；若建议和实际动作对应不上，先修记录与采用过程。效果有依据以后，再看其他日期、接任人员和新店能否使用，避免把一次正常日当作永久规律。\n\n两店共享资源，还要观察是否挤占其他门店或商品。局部增长如果只是转移需求或产能，企业总收益可能不同。\n\n## 责任和纠错应当写进同一项安排\n\n门店确认现场事实并执行销售动作，中央负责人决定产量和跨店资源，专业人员确认品质与方法，FDE实现材料、工具和反馈，内部承担者逐步维护与接任。不能把所有跨部门取舍都留给工程团队，也不能让员工对无权改变的供给负责。\n\n若交通变化使X需求降到50、Y升到90，继续扩产的贡献只有360元，低于原安排920元，少560元。新事实应进入当前决定，原方法需要调整；历史依据仍可保留，用来说明为什么改变。报告这种反例，应成为学习材料，而不是使员工不敢反馈的理由。\n\n## 换一种业务，检查方法是否真正掌握\n\n工业品业务需要从适配、期限和供货推到订单贡献，不能把“门店”简单换成“客户”；设备服务需要分清可避免复访与必要分阶段工作，并区分客户停机损失和服务商现金；内容服务则需要把生成、核验、真实付费需求和后续行动连起来。\n\n相同的提案逻辑进入不同业务，具体事实、资源和收益会变化。能够根据自身材料重新完成推导，才说明课程开始转化为经营判断。\n\n配套[工作簿](https://zhongky1995.github.io/gaidn-fde-handbook/#workbook)用于把这些内容写成可讨论的决定。提案可以有未知，但每个重要未知都应说明怎样取得依据，以及答案不同会怎样改变下一步。这样，读者才能理解为什么现在值得做、准备怎样做，以及什么时候应当改法。\n","text":"# 第40章｜把案例推导成一份真正可以决定投入的提案\n\n“建设知识库、提升效率、形成壁垒”可以出现在很多提案里，却无法让经营、业务和工程对同一件事作决定。负责人不知道收益怎样发生，员工不知道工作怎样改变，工程师也只能自行猜测功能。\n\n一份完整提案应当把背景、机会、作用过程、可执行方案、收益和未知连起来。下面用连锁烘焙教学案例写出一项候选改造的主要推导。它是练习材料，真实企业的负责人、日期和预算仍需根据实际情况填写。\n\n## 先把值得投入的经营问题讲清楚\n\n企业有八家门店和中央工坊，主打点心每天早晨统一配送。交通枢纽附近的X店收到80份，18点卖完后仍有人询问；居民区的Y店也收到80份，却只卖出60份。只看日报，总部可以把Y的20份转给X，但还不知道X未满足的需求有多大。\n\n进一步核对发现，在其他六店订单已经安排以后，工坊可用于这两店的生产时段最多能做320份，目前只排160份。下午追加生产需要新的配送；门店售罄以后，也停止这款商品的推介和持续预订记录。\n\n这些事实使问题从“分货不均”延伸为一组相互影响的安排：供给限制销量和需求获取，较少的需求线索又影响下一轮排产。目标因此是更可靠地满足有价值的需求，同时控制剩余，并留下以后可用的判断方法。目标不是单纯让日报更快生成。\n\n## 说明准备怎样改变工作，为什么会有作用\n\nAI可以协助关联销售时段、店长说明、排产和推广材料，指出值得核实的关系。FDE把原材料、候选安排、批准决定、实际到店和最终销售对应起来，让负责人能够比较不同改法。\n\n若决定试补货，工坊确认可用产能与品质，配送确认时段，门店安排接货、上架和需求记录。实际结果返回以后，再判断新增供给是否卖出、推介是否有效、哪些原假设需要修正。\n\n作用路径因此是：更完整地理解需求与限制，形成可执行安排，实际改变供给与门店工作，再根据结果更新。AI参与信息组织和判断支持，人员与生产资源共同使变化发生。企业既争取当期贡献，也积累带条件和结果的方法。\n\n## 把收益与最合理的替代放在一起\n\n为看清增长空间，先假设正常日X有160份、Y有60份可成交需求，每份售价12元、生产变动成本4元，未售无残值，原固定费用不变。扩产方案另增加80元日常配送与AI整理支出。\n\n| 方案 | 当天生产与销售 | 扣列示支出后的贡献 |\n|---|---|---:|\n| 原80/80 | 生产160，售出140 | 1040元 |\n| 只改100/60 | 生产160，售出160 | 1280元 |\n| 扩产补货160/60 | 生产220，售出220 | 1680元 |\n\n第三种比原来多640元，比简单改分配多400元。X这款商品销量可以翻倍，两店合计增加约57.1%，但不能据此宣称整店收入或公司利润翻倍。\n\n进一步看门槛：扩产相对只改分配，多生产60份，成本240元，加80元新增支出，共320元。每多卖一份收入12元，至少多卖27份才超过这笔成本。一次接入6000元另计；若同样正常条件持续20天，相对原安排增加12800元，扣接入后为6800元。这些是条件推演，需求和执行必须通过实际工作核实。\n\n提案首先比较完整可行安排，不必在行动前把每一元收益精确归给某项技术。但普通改配本来能取得的240元，也不能全部称为AI贡献。后续决定继续升级模型还是改善配送时，再围绕这项选择研究各自增量。\n\n## 第一阶段，应取得能够改变决定的证据\n\n先核实生产、品质和补货条件，再在有限范围增加供给，并记录售罄后的需求、实际到店、推介、成交和剩余。确定谁执行、投入多少时间、什么时候复查，让观察有机会进入下一次决定。\n\n若新增销售不足以优于简单分配，就保留简单方案；若需求存在而配送迟到，先修履约；若建议和实际动作对应不上，先修记录与采用过程。效果有依据以后，再看其他日期、接任人员和新店能否使用，避免把一次正常日当作永久规律。\n\n两店共享资源，还要观察是否挤占其他门店或商品。局部增长如果只是转移需求或产能，企业总收益可能不同。\n\n## 责任和纠错应当写进同一项安排\n\n门店确认现场事实并执行销售动作，中央负责人决定产量和跨店资源，专业人员确认品质与方法，FDE实现材料、工具和反馈，内部承担者逐步维护与接任。不能把所有跨部门取舍都留给工程团队，也不能让员工对无权改变的供给负责。\n\n若交通变化使X需求降到50、Y升到90，继续扩产的贡献只有360元，低于原安排920元，少560元。新事实应进入当前决定，原方法需要调整；历史依据仍可保留，用来说明为什么改变。报告这种反例，应成为学习材料，而不是使员工不敢反馈的理由。\n\n## 换一种业务，检查方法是否真正掌握\n\n工业品业务需要从适配、期限和供货推到订单贡献，不能把“门店”简单换成“客户”；设备服务需要分清可避免复访与必要分阶段工作，并区分客户停机损失和服务商现金；内容服务则需要把生成、核验、真实付费需求和后续行动连起来。\n\n相同的提案逻辑进入不同业务，具体事实、资源和收益会变化。能够根据自身材料重新完成推导，才说明课程开始转化为经营判断。\n\n配套工作簿用于把这些内容写成可讨论的决定。提案可以有未知，但每个重要未知都应说明怎样取得依据，以及答案不同会怎样改变下一步。这样，读者才能理解为什么现在值得做、准备怎样做，以及什么时候应当改法。\n"},{"file":"案例A-连锁备货.md","id":"case-a","number":null,"role":"案例","part":-1,"title":"案例A｜畅销商品卖完了，生意为什么没有继续长","md":"# 案例A｜畅销商品卖完了，生意为什么没有继续长\n\n本案例由教学条件构成。前半给出经营现场，后半用相同口径比较几种选择；收益是条件推演，不是客户实绩。\n\n## 两张报表都没错，合在一起却有问题\n\n一家区域烘焙连锁有8家门店和中央工坊。X店在交通节点附近，Y店服务周边社区。我们只看一种售价12元的主打点心，不把它当作两店全部生意。\n\n某个营业日，两店各配80份，原路线上午一次到店，门店营业至20点。X店18点卖完，通勤客流还没结束，之后仍有人询问；Y店卖出60份，剩20份。总部看到的是一店售罄、一店有剩余，于是准备把Y店的20份转给X店。这个调整有道理，但还没有回答：X店究竟少了多少生意，为什么中央工坊没有多做，以及门店为什么没有继续寻找需求。\n\n把几份现场材料摆在一起，问题开始变大。\n\n| 材料 | 看到什么 | 原来没有被一起讨论的关系 |\n|---|---|---|\n| X店销量与消息 | 售出80，18点售罄，之后有人问 | 销量被库存封顶，不能看见全部需求 |\n| 工坊排产 | 这两店只排160份 | 在其他6店订单已安排后，对应窗口仍可做320份 |\n| 配送安排 | 原路线只有一次到店 | 下午补货需要增加一趟，费用50元 |\n| 门店工作 | 该商品售罄后停止社群推介，不再持续登记预订 | 供给不足也改变了员工获取需求的动作 |\n| 总部日报 | 只保留销量80与剩余0 | 没有售罄时点，也看不到停止推介以后失去的线索 |\n\n这里的产能和员工动作是给定的现场观察，不能只凭“卖完了”就推断出来。320份是在当前人员、原料与设备条件下为两店可用的生产窗口；增加补货可利用下午时段，17点到店的方案还要核品质与接待。工坊窗口利用率是160÷320=50%，并不等于整个工厂只有一半利用率；员工仍在销售其他商品，问题是围绕这款商品的增长动作提前停止。\n\n这几项事实需要分别核对后，才能连成解释。工坊不是看见有人询问就自动增加生产，它需要可执行的订单和配送安排；门店也不能在明知无货时持续作出购买承诺。若这些岗位只按各自已有信息行动，企业就可能一直在较低供给水平上运转。\n\n原来每个部门都能解释自己：工坊按已成交数量排产，配送按原路线执行，门店没货便不再推广。组合起来，却形成一条自我限制的链：少排产使商品早卖完，早卖完使推介和预订停止，系统只留下受限销量，下一轮继续按这个销量安排。\n\n## AI要找的，是这些材料之间的关系\n\nFDE先把营业日、商品、门店和实际批次对应起来，让AI能够比较销售记录、店长说明、排产窗口、配送和推广记录。AI提出的有用问题会变得具体：X店售罄后还有多少可购买需求？工坊的空档能否用于这一款？晚间补货能否保持品质？门店如果恢复推介，接待与交付是否跟得上？\n\n这些问题指向不同动作。原始询问可以整理成需求线索；排产需要核对人员、原料和其他订单；配送需要实际路线；顾客是否会买，需要通过补货、预订或跟踪观察取得证据。AI帮助把分散事实组织成系统解释，并比较改法，FDE把需要的信息和动作接进生产，负责人决定资源。\n\n因此，项目从“自动整理日报”转成了“恢复被供给和工作安排共同压住的增长”。值得留下的know-how，也包括什么信号触发补货、怎样协调工坊、何时恢复推介，以及结果怎样反过来修改下一轮安排。\n\n## 先比较三个方案，再谈增长幅度\n\n为使账可核对，下面给定一个正常日：X店有160份可购买需求，Y店60份；单价12元，每份实际生产变动成本4元，未售无残值，没有替代购买或调价。原有工资、租金等在本次选择中不变。扩大方案新增补货50元、按量AI及外部整理服务30元，合计80元/日；一次性接入6000元另列。只改分配可用现有方式完成，不新增这80元。\n\n| 方案 | 原安排 | 只改分配 | 扩产并补货 |\n|---|---:|---:|---:|\n| X/Y供货 | 80/80 | 100/60 | 160/60 |\n| 实际生产 | 160 | 160 | 220 |\n| 实际售出 | 140 | 160 | 220 |\n| 营业收入 | 1680元 | 1920元 | 2640元 |\n| 全部生产变动成本 | 640元 | 640元 | 880元 |\n| 新增日常支出 | 0 | 0 | 80元 |\n| 列示贡献 | 1040元 | 1280元 | 1680元 |\n\n表中“列示贡献”是为了比较三种安排，将销售收入减去已经列出的生产和新增支出。原有工资、租金等固定费用尚未扣除，因此不能将它当作企业净利润。\n\n逐项看，原安排卖出140份，收入140×12＝1680元；但实际做了160份，成本应为160×4＝640元，留下1040元。重新分配后卖出160份，收入1920元，生产成本仍是640元，留下1280元。扩产后220份全部售出，收入2640元，扣880元生产成本及80元新增费用，留下1680元。\n\n原安排的20份剩余也付出了生产成本。只改分配多240元贡献；再扩大供给，多出的不仅是调走余货，而是使用原来没用上的生产窗口，扩产方案相对原安排多640元，相对只改分配多400元。\n\n在这组条件下，X店这款商品从卖80份变为160份，销量和收入都翻倍；两店合计销量从140变220，增加约57.1%。它们不是同一个增长口径，更不能据此说整家企业收入翻倍。生产窗口利用率则从50%提高到68.75%。\n\n如果相同条件持续20个营业日，相对原安排增加的列示贡献是12800元，扣一次性接入6000元后为6800元。真实项目必须用实际需求、成本和持续时间替换这些条件。\n\n## 到底要多卖多少，扩产才值得\n\n管理者并不需要先相信X店一定能卖160份。先问：新增投入需要多少新增销售来覆盖？\n\n与已经改成100/60的方案相比，再生产60份需要240元，加日常新增支出80元，共320元。单价12元，至少多卖27份，才超过这320元。也就是在Y店需求仍为60的给定条件下，X店卖到至少127份，扩产才优于只改分配。\n\n| X实际可购买需求 | 扩产方案售出总数 | 扩产方案贡献 | 与原安排1040元相比 |\n|---|---:|---:|---:|\n| 90份 | 150 | 840元 | 少200元 |\n| 120份 | 180 | 1200元 | 多160元 |\n| 160份 | 220 | 1680元 | 多640元 |\n\n需求120时，扩产比原安排好，却仍不及只改分配的1280元。这个差别会改变项目选择：企业应比较最合理的替代，而不只与原来的差做法比较。\n\n## 怎样试，才能发现真正的增长来源\n\n先核对产能与配送，再在可承受范围内补货、保留当时顾客询问、推介和预订、真实到店数量与售罄情况。供给增加和推广恢复如果同时发生，要记录两者；结果好时才知道下一步该扩大哪个部分。\n\n试点既要看X，也要看Y和其他受影响门店。若新增排产挤占别的高价值商品，机会成本要算；若多销售以牺牲品质换来，短期贡献也不是全部结果。关于缺货后的询问，记录的是线索，不直接把一次询问算成一次购买。\n\n再改变一个条件：交通入口关闭，需求变为X50、Y90，其他价格和费用不变。原80/80贡献920元，100/60贡献680元，仍扩到160/60只剩360元，比原安排少560元。企业要复用的是识别条件、调动资源和及时改法的能力，而非永久记住“X店配160”。\n\n案例的经营机会来自重新连接本来分开的事情。它可能打开远大于日报省时的增长空间，也需要用需求、产能和成本把这个空间变成可选择的投资。\n","html":"\u003ch1>案例A｜畅销商品卖完了，生意为什么没有继续长\u003c/h1>\n\u003cp>本案例由教学条件构成。前半给出经营现场，后半用相同口径比较几种选择；收益是条件推演，不是客户实绩。\u003c/p>\n\u003ch2 id=\"case-a-section-1\">两张报表都没错，合在一起却有问题\u003c/h2>\n\u003cp>一家区域烘焙连锁有8家门店和中央工坊。X店在交通节点附近，Y店服务周边社区。我们只看一种售价12元的主打点心，不把它当作两店全部生意。\u003c/p>\n\u003cp>某个营业日，两店各配80份，原路线上午一次到店，门店营业至20点。X店18点卖完，通勤客流还没结束，之后仍有人询问；Y店卖出60份，剩20份。总部看到的是一店售罄、一店有剩余，于是准备把Y店的20份转给X店。这个调整有道理，但还没有回答：X店究竟少了多少生意，为什么中央工坊没有多做，以及门店为什么没有继续寻找需求。\u003c/p>\n\u003cp>把几份现场材料摆在一起，问题开始变大。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>材料\u003c/th>\n\u003cth>看到什么\u003c/th>\n\u003cth>原来没有被一起讨论的关系\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>X店销量与消息\u003c/td>\n\u003ctd>售出80，18点售罄，之后有人问\u003c/td>\n\u003ctd>销量被库存封顶，不能看见全部需求\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工坊排产\u003c/td>\n\u003ctd>这两店只排160份\u003c/td>\n\u003ctd>在其他6店订单已安排后，对应窗口仍可做320份\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>配送安排\u003c/td>\n\u003ctd>原路线只有一次到店\u003c/td>\n\u003ctd>下午补货需要增加一趟，费用50元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>门店工作\u003c/td>\n\u003ctd>该商品售罄后停止社群推介，不再持续登记预订\u003c/td>\n\u003ctd>供给不足也改变了员工获取需求的动作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>总部日报\u003c/td>\n\u003ctd>只保留销量80与剩余0\u003c/td>\n\u003ctd>没有售罄时点，也看不到停止推介以后失去的线索\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>这里的产能和员工动作是给定的现场观察，不能只凭“卖完了”就推断出来。320份是在当前人员、原料与设备条件下为两店可用的生产窗口；增加补货可利用下午时段，17点到店的方案还要核品质与接待。工坊窗口利用率是160÷320=50%，并不等于整个工厂只有一半利用率；员工仍在销售其他商品，问题是围绕这款商品的增长动作提前停止。\u003c/p>\n\u003cp>这几项事实需要分别核对后，才能连成解释。工坊不是看见有人询问就自动增加生产，它需要可执行的订单和配送安排；门店也不能在明知无货时持续作出购买承诺。若这些岗位只按各自已有信息行动，企业就可能一直在较低供给水平上运转。\u003c/p>\n\u003cp>原来每个部门都能解释自己：工坊按已成交数量排产，配送按原路线执行，门店没货便不再推广。组合起来，却形成一条自我限制的链：少排产使商品早卖完，早卖完使推介和预订停止，系统只留下受限销量，下一轮继续按这个销量安排。\u003c/p>\n\u003ch2 id=\"case-a-section-2\">AI要找的，是这些材料之间的关系\u003c/h2>\n\u003cp>FDE先把营业日、商品、门店和实际批次对应起来，让AI能够比较销售记录、店长说明、排产窗口、配送和推广记录。AI提出的有用问题会变得具体：X店售罄后还有多少可购买需求？工坊的空档能否用于这一款？晚间补货能否保持品质？门店如果恢复推介，接待与交付是否跟得上？\u003c/p>\n\u003cp>这些问题指向不同动作。原始询问可以整理成需求线索；排产需要核对人员、原料和其他订单；配送需要实际路线；顾客是否会买，需要通过补货、预订或跟踪观察取得证据。AI帮助把分散事实组织成系统解释，并比较改法，FDE把需要的信息和动作接进生产，负责人决定资源。\u003c/p>\n\u003cp>因此，项目从“自动整理日报”转成了“恢复被供给和工作安排共同压住的增长”。值得留下的know-how，也包括什么信号触发补货、怎样协调工坊、何时恢复推介，以及结果怎样反过来修改下一轮安排。\u003c/p>\n\u003ch2 id=\"case-a-section-3\">先比较三个方案，再谈增长幅度\u003c/h2>\n\u003cp>为使账可核对，下面给定一个正常日：X店有160份可购买需求，Y店60份；单价12元，每份实际生产变动成本4元，未售无残值，没有替代购买或调价。原有工资、租金等在本次选择中不变。扩大方案新增补货50元、按量AI及外部整理服务30元，合计80元/日；一次性接入6000元另列。只改分配可用现有方式完成，不新增这80元。\u003c/p>\n\u003cdiv class=\"table-scroll table-wide\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方案\u003c/th>\n\u003cth align=\"right\">原安排\u003c/th>\n\u003cth align=\"right\">只改分配\u003c/th>\n\u003cth align=\"right\">扩产并补货\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>X/Y供货\u003c/td>\n\u003ctd align=\"right\">80/80\u003c/td>\n\u003ctd align=\"right\">100/60\u003c/td>\n\u003ctd align=\"right\">160/60\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>实际生产\u003c/td>\n\u003ctd align=\"right\">160\u003c/td>\n\u003ctd align=\"right\">160\u003c/td>\n\u003ctd align=\"right\">220\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>实际售出\u003c/td>\n\u003ctd align=\"right\">140\u003c/td>\n\u003ctd align=\"right\">160\u003c/td>\n\u003ctd align=\"right\">220\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>营业收入\u003c/td>\n\u003ctd align=\"right\">1680元\u003c/td>\n\u003ctd align=\"right\">1920元\u003c/td>\n\u003ctd align=\"right\">2640元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>全部生产变动成本\u003c/td>\n\u003ctd align=\"right\">640元\u003c/td>\n\u003ctd align=\"right\">640元\u003c/td>\n\u003ctd align=\"right\">880元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新增日常支出\u003c/td>\n\u003ctd align=\"right\">0\u003c/td>\n\u003ctd align=\"right\">0\u003c/td>\n\u003ctd align=\"right\">80元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>列示贡献\u003c/td>\n\u003ctd align=\"right\">1040元\u003c/td>\n\u003ctd align=\"right\">1280元\u003c/td>\n\u003ctd align=\"right\">1680元\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"table-hint\">表格可左右滑动查看\u003c/p>\n\u003cp>表中“列示贡献”是为了比较三种安排，将销售收入减去已经列出的生产和新增支出。原有工资、租金等固定费用尚未扣除，因此不能将它当作企业净利润。\u003c/p>\n\u003cp>逐项看，原安排卖出140份，收入140×12＝1680元；但实际做了160份，成本应为160×4＝640元，留下1040元。重新分配后卖出160份，收入1920元，生产成本仍是640元，留下1280元。扩产后220份全部售出，收入2640元，扣880元生产成本及80元新增费用，留下1680元。\u003c/p>\n\u003cp>原安排的20份剩余也付出了生产成本。只改分配多240元贡献；再扩大供给，多出的不仅是调走余货，而是使用原来没用上的生产窗口，扩产方案相对原安排多640元，相对只改分配多400元。\u003c/p>\n\u003cp>在这组条件下，X店这款商品从卖80份变为160份，销量和收入都翻倍；两店合计销量从140变220，增加约57.1%。它们不是同一个增长口径，更不能据此说整家企业收入翻倍。生产窗口利用率则从50%提高到68.75%。\u003c/p>\n\u003cp>如果相同条件持续20个营业日，相对原安排增加的列示贡献是12800元，扣一次性接入6000元后为6800元。真实项目必须用实际需求、成本和持续时间替换这些条件。\u003c/p>\n\u003ch2 id=\"case-a-section-4\">到底要多卖多少，扩产才值得\u003c/h2>\n\u003cp>管理者并不需要先相信X店一定能卖160份。先问：新增投入需要多少新增销售来覆盖？\u003c/p>\n\u003cp>与已经改成100/60的方案相比，再生产60份需要240元，加日常新增支出80元，共320元。单价12元，至少多卖27份，才超过这320元。也就是在Y店需求仍为60的给定条件下，X店卖到至少127份，扩产才优于只改分配。\u003c/p>\n\u003cdiv class=\"table-scroll table-wide\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>X实际可购买需求\u003c/th>\n\u003cth align=\"right\">扩产方案售出总数\u003c/th>\n\u003cth align=\"right\">扩产方案贡献\u003c/th>\n\u003cth align=\"right\">与原安排1040元相比\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>90份\u003c/td>\n\u003ctd align=\"right\">150\u003c/td>\n\u003ctd align=\"right\">840元\u003c/td>\n\u003ctd align=\"right\">少200元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>120份\u003c/td>\n\u003ctd align=\"right\">180\u003c/td>\n\u003ctd align=\"right\">1200元\u003c/td>\n\u003ctd align=\"right\">多160元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>160份\u003c/td>\n\u003ctd align=\"right\">220\u003c/td>\n\u003ctd align=\"right\">1680元\u003c/td>\n\u003ctd align=\"right\">多640元\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"table-hint\">表格可左右滑动查看\u003c/p>\n\u003cp>需求120时，扩产比原安排好，却仍不及只改分配的1280元。这个差别会改变项目选择：企业应比较最合理的替代，而不只与原来的差做法比较。\u003c/p>\n\u003ch2 id=\"case-a-section-5\">怎样试，才能发现真正的增长来源\u003c/h2>\n\u003cp>先核对产能与配送，再在可承受范围内补货、保留当时顾客询问、推介和预订、真实到店数量与售罄情况。供给增加和推广恢复如果同时发生，要记录两者；结果好时才知道下一步该扩大哪个部分。\u003c/p>\n\u003cp>试点既要看X，也要看Y和其他受影响门店。若新增排产挤占别的高价值商品，机会成本要算；若多销售以牺牲品质换来，短期贡献也不是全部结果。关于缺货后的询问，记录的是线索，不直接把一次询问算成一次购买。\u003c/p>\n\u003cp>再改变一个条件：交通入口关闭，需求变为X50、Y90，其他价格和费用不变。原80/80贡献920元，100/60贡献680元，仍扩到160/60只剩360元，比原安排少560元。企业要复用的是识别条件、调动资源和及时改法的能力，而非永久记住“X店配160”。\u003c/p>\n\u003cp>案例的经营机会来自重新连接本来分开的事情。它可能打开远大于日报省时的增长空间，也需要用需求、产能和成本把这个空间变成可选择的投资。\u003c/p>\n","headings":[{"id":"case-a-section-1","label":"两张报表都没错，合在一起却有问题"},{"id":"case-a-section-2","label":"AI要找的，是这些材料之间的关系"},{"id":"case-a-section-3","label":"先比较三个方案，再谈增长幅度"},{"id":"case-a-section-4","label":"到底要多卖多少，扩产才值得"},{"id":"case-a-section-5","label":"怎样试，才能发现真正的增长来源"}],"exportMd":"# 案例A｜畅销商品卖完了，生意为什么没有继续长\n\n本案例由教学条件构成。前半给出经营现场，后半用相同口径比较几种选择；收益是条件推演，不是客户实绩。\n\n## 两张报表都没错，合在一起却有问题\n\n一家区域烘焙连锁有8家门店和中央工坊。X店在交通节点附近，Y店服务周边社区。我们只看一种售价12元的主打点心，不把它当作两店全部生意。\n\n某个营业日，两店各配80份，原路线上午一次到店，门店营业至20点。X店18点卖完，通勤客流还没结束，之后仍有人询问；Y店卖出60份，剩20份。总部看到的是一店售罄、一店有剩余，于是准备把Y店的20份转给X店。这个调整有道理，但还没有回答：X店究竟少了多少生意，为什么中央工坊没有多做，以及门店为什么没有继续寻找需求。\n\n把几份现场材料摆在一起，问题开始变大。\n\n| 材料 | 看到什么 | 原来没有被一起讨论的关系 |\n|---|---|---|\n| X店销量与消息 | 售出80，18点售罄，之后有人问 | 销量被库存封顶，不能看见全部需求 |\n| 工坊排产 | 这两店只排160份 | 在其他6店订单已安排后，对应窗口仍可做320份 |\n| 配送安排 | 原路线只有一次到店 | 下午补货需要增加一趟，费用50元 |\n| 门店工作 | 该商品售罄后停止社群推介，不再持续登记预订 | 供给不足也改变了员工获取需求的动作 |\n| 总部日报 | 只保留销量80与剩余0 | 没有售罄时点，也看不到停止推介以后失去的线索 |\n\n这里的产能和员工动作是给定的现场观察，不能只凭“卖完了”就推断出来。320份是在当前人员、原料与设备条件下为两店可用的生产窗口；增加补货可利用下午时段，17点到店的方案还要核品质与接待。工坊窗口利用率是160÷320=50%，并不等于整个工厂只有一半利用率；员工仍在销售其他商品，问题是围绕这款商品的增长动作提前停止。\n\n这几项事实需要分别核对后，才能连成解释。工坊不是看见有人询问就自动增加生产，它需要可执行的订单和配送安排；门店也不能在明知无货时持续作出购买承诺。若这些岗位只按各自已有信息行动，企业就可能一直在较低供给水平上运转。\n\n原来每个部门都能解释自己：工坊按已成交数量排产，配送按原路线执行，门店没货便不再推广。组合起来，却形成一条自我限制的链：少排产使商品早卖完，早卖完使推介和预订停止，系统只留下受限销量，下一轮继续按这个销量安排。\n\n## AI要找的，是这些材料之间的关系\n\nFDE先把营业日、商品、门店和实际批次对应起来，让AI能够比较销售记录、店长说明、排产窗口、配送和推广记录。AI提出的有用问题会变得具体：X店售罄后还有多少可购买需求？工坊的空档能否用于这一款？晚间补货能否保持品质？门店如果恢复推介，接待与交付是否跟得上？\n\n这些问题指向不同动作。原始询问可以整理成需求线索；排产需要核对人员、原料和其他订单；配送需要实际路线；顾客是否会买，需要通过补货、预订或跟踪观察取得证据。AI帮助把分散事实组织成系统解释，并比较改法，FDE把需要的信息和动作接进生产，负责人决定资源。\n\n因此，项目从“自动整理日报”转成了“恢复被供给和工作安排共同压住的增长”。值得留下的know-how，也包括什么信号触发补货、怎样协调工坊、何时恢复推介，以及结果怎样反过来修改下一轮安排。\n\n## 先比较三个方案，再谈增长幅度\n\n为使账可核对，下面给定一个正常日：X店有160份可购买需求，Y店60份；单价12元，每份实际生产变动成本4元，未售无残值，没有替代购买或调价。原有工资、租金等在本次选择中不变。扩大方案新增补货50元、按量AI及外部整理服务30元，合计80元/日；一次性接入6000元另列。只改分配可用现有方式完成，不新增这80元。\n\n| 方案 | 原安排 | 只改分配 | 扩产并补货 |\n|---|---:|---:|---:|\n| X/Y供货 | 80/80 | 100/60 | 160/60 |\n| 实际生产 | 160 | 160 | 220 |\n| 实际售出 | 140 | 160 | 220 |\n| 营业收入 | 1680元 | 1920元 | 2640元 |\n| 全部生产变动成本 | 640元 | 640元 | 880元 |\n| 新增日常支出 | 0 | 0 | 80元 |\n| 列示贡献 | 1040元 | 1280元 | 1680元 |\n\n表中“列示贡献”是为了比较三种安排，将销售收入减去已经列出的生产和新增支出。原有工资、租金等固定费用尚未扣除，因此不能将它当作企业净利润。\n\n逐项看，原安排卖出140份，收入140×12＝1680元；但实际做了160份，成本应为160×4＝640元，留下1040元。重新分配后卖出160份，收入1920元，生产成本仍是640元，留下1280元。扩产后220份全部售出，收入2640元，扣880元生产成本及80元新增费用，留下1680元。\n\n原安排的20份剩余也付出了生产成本。只改分配多240元贡献；再扩大供给，多出的不仅是调走余货，而是使用原来没用上的生产窗口，扩产方案相对原安排多640元，相对只改分配多400元。\n\n在这组条件下，X店这款商品从卖80份变为160份，销量和收入都翻倍；两店合计销量从140变220，增加约57.1%。它们不是同一个增长口径，更不能据此说整家企业收入翻倍。生产窗口利用率则从50%提高到68.75%。\n\n如果相同条件持续20个营业日，相对原安排增加的列示贡献是12800元，扣一次性接入6000元后为6800元。真实项目必须用实际需求、成本和持续时间替换这些条件。\n\n## 到底要多卖多少，扩产才值得\n\n管理者并不需要先相信X店一定能卖160份。先问：新增投入需要多少新增销售来覆盖？\n\n与已经改成100/60的方案相比，再生产60份需要240元，加日常新增支出80元，共320元。单价12元，至少多卖27份，才超过这320元。也就是在Y店需求仍为60的给定条件下，X店卖到至少127份，扩产才优于只改分配。\n\n| X实际可购买需求 | 扩产方案售出总数 | 扩产方案贡献 | 与原安排1040元相比 |\n|---|---:|---:|---:|\n| 90份 | 150 | 840元 | 少200元 |\n| 120份 | 180 | 1200元 | 多160元 |\n| 160份 | 220 | 1680元 | 多640元 |\n\n需求120时，扩产比原安排好，却仍不及只改分配的1280元。这个差别会改变项目选择：企业应比较最合理的替代，而不只与原来的差做法比较。\n\n## 怎样试，才能发现真正的增长来源\n\n先核对产能与配送，再在可承受范围内补货、保留当时顾客询问、推介和预订、真实到店数量与售罄情况。供给增加和推广恢复如果同时发生，要记录两者；结果好时才知道下一步该扩大哪个部分。\n\n试点既要看X，也要看Y和其他受影响门店。若新增排产挤占别的高价值商品，机会成本要算；若多销售以牺牲品质换来，短期贡献也不是全部结果。关于缺货后的询问，记录的是线索，不直接把一次询问算成一次购买。\n\n再改变一个条件：交通入口关闭，需求变为X50、Y90，其他价格和费用不变。原80/80贡献920元，100/60贡献680元，仍扩到160/60只剩360元，比原安排少560元。企业要复用的是识别条件、调动资源和及时改法的能力，而非永久记住“X店配160”。\n\n案例的经营机会来自重新连接本来分开的事情。它可能打开远大于日报省时的增长空间，也需要用需求、产能和成本把这个空间变成可选择的投资。\n","exportSingleMd":"# 案例A｜畅销商品卖完了，生意为什么没有继续长\n\n本案例由教学条件构成。前半给出经营现场，后半用相同口径比较几种选择；收益是条件推演，不是客户实绩。\n\n## 两张报表都没错，合在一起却有问题\n\n一家区域烘焙连锁有8家门店和中央工坊。X店在交通节点附近，Y店服务周边社区。我们只看一种售价12元的主打点心，不把它当作两店全部生意。\n\n某个营业日，两店各配80份，原路线上午一次到店，门店营业至20点。X店18点卖完，通勤客流还没结束，之后仍有人询问；Y店卖出60份，剩20份。总部看到的是一店售罄、一店有剩余，于是准备把Y店的20份转给X店。这个调整有道理，但还没有回答：X店究竟少了多少生意，为什么中央工坊没有多做，以及门店为什么没有继续寻找需求。\n\n把几份现场材料摆在一起，问题开始变大。\n\n| 材料 | 看到什么 | 原来没有被一起讨论的关系 |\n|---|---|---|\n| X店销量与消息 | 售出80，18点售罄，之后有人问 | 销量被库存封顶，不能看见全部需求 |\n| 工坊排产 | 这两店只排160份 | 在其他6店订单已安排后，对应窗口仍可做320份 |\n| 配送安排 | 原路线只有一次到店 | 下午补货需要增加一趟，费用50元 |\n| 门店工作 | 该商品售罄后停止社群推介，不再持续登记预订 | 供给不足也改变了员工获取需求的动作 |\n| 总部日报 | 只保留销量80与剩余0 | 没有售罄时点，也看不到停止推介以后失去的线索 |\n\n这里的产能和员工动作是给定的现场观察，不能只凭“卖完了”就推断出来。320份是在当前人员、原料与设备条件下为两店可用的生产窗口；增加补货可利用下午时段，17点到店的方案还要核品质与接待。工坊窗口利用率是160÷320=50%，并不等于整个工厂只有一半利用率；员工仍在销售其他商品，问题是围绕这款商品的增长动作提前停止。\n\n这几项事实需要分别核对后，才能连成解释。工坊不是看见有人询问就自动增加生产，它需要可执行的订单和配送安排；门店也不能在明知无货时持续作出购买承诺。若这些岗位只按各自已有信息行动，企业就可能一直在较低供给水平上运转。\n\n原来每个部门都能解释自己：工坊按已成交数量排产，配送按原路线执行，门店没货便不再推广。组合起来，却形成一条自我限制的链：少排产使商品早卖完，早卖完使推介和预订停止，系统只留下受限销量，下一轮继续按这个销量安排。\n\n## AI要找的，是这些材料之间的关系\n\nFDE先把营业日、商品、门店和实际批次对应起来，让AI能够比较销售记录、店长说明、排产窗口、配送和推广记录。AI提出的有用问题会变得具体：X店售罄后还有多少可购买需求？工坊的空档能否用于这一款？晚间补货能否保持品质？门店如果恢复推介，接待与交付是否跟得上？\n\n这些问题指向不同动作。原始询问可以整理成需求线索；排产需要核对人员、原料和其他订单；配送需要实际路线；顾客是否会买，需要通过补货、预订或跟踪观察取得证据。AI帮助把分散事实组织成系统解释，并比较改法，FDE把需要的信息和动作接进生产，负责人决定资源。\n\n因此，项目从“自动整理日报”转成了“恢复被供给和工作安排共同压住的增长”。值得留下的know-how，也包括什么信号触发补货、怎样协调工坊、何时恢复推介，以及结果怎样反过来修改下一轮安排。\n\n## 先比较三个方案，再谈增长幅度\n\n为使账可核对，下面给定一个正常日：X店有160份可购买需求，Y店60份；单价12元，每份实际生产变动成本4元，未售无残值，没有替代购买或调价。原有工资、租金等在本次选择中不变。扩大方案新增补货50元、按量AI及外部整理服务30元，合计80元/日；一次性接入6000元另列。只改分配可用现有方式完成，不新增这80元。\n\n| 方案 | 原安排 | 只改分配 | 扩产并补货 |\n|---|---:|---:|---:|\n| X/Y供货 | 80/80 | 100/60 | 160/60 |\n| 实际生产 | 160 | 160 | 220 |\n| 实际售出 | 140 | 160 | 220 |\n| 营业收入 | 1680元 | 1920元 | 2640元 |\n| 全部生产变动成本 | 640元 | 640元 | 880元 |\n| 新增日常支出 | 0 | 0 | 80元 |\n| 列示贡献 | 1040元 | 1280元 | 1680元 |\n\n表中“列示贡献”是为了比较三种安排，将销售收入减去已经列出的生产和新增支出。原有工资、租金等固定费用尚未扣除，因此不能将它当作企业净利润。\n\n逐项看，原安排卖出140份，收入140×12＝1680元；但实际做了160份，成本应为160×4＝640元，留下1040元。重新分配后卖出160份，收入1920元，生产成本仍是640元，留下1280元。扩产后220份全部售出，收入2640元，扣880元生产成本及80元新增费用，留下1680元。\n\n原安排的20份剩余也付出了生产成本。只改分配多240元贡献；再扩大供给，多出的不仅是调走余货，而是使用原来没用上的生产窗口，扩产方案相对原安排多640元，相对只改分配多400元。\n\n在这组条件下，X店这款商品从卖80份变为160份，销量和收入都翻倍；两店合计销量从140变220，增加约57.1%。它们不是同一个增长口径，更不能据此说整家企业收入翻倍。生产窗口利用率则从50%提高到68.75%。\n\n如果相同条件持续20个营业日，相对原安排增加的列示贡献是12800元，扣一次性接入6000元后为6800元。真实项目必须用实际需求、成本和持续时间替换这些条件。\n\n## 到底要多卖多少，扩产才值得\n\n管理者并不需要先相信X店一定能卖160份。先问：新增投入需要多少新增销售来覆盖？\n\n与已经改成100/60的方案相比，再生产60份需要240元，加日常新增支出80元，共320元。单价12元，至少多卖27份，才超过这320元。也就是在Y店需求仍为60的给定条件下，X店卖到至少127份，扩产才优于只改分配。\n\n| X实际可购买需求 | 扩产方案售出总数 | 扩产方案贡献 | 与原安排1040元相比 |\n|---|---:|---:|---:|\n| 90份 | 150 | 840元 | 少200元 |\n| 120份 | 180 | 1200元 | 多160元 |\n| 160份 | 220 | 1680元 | 多640元 |\n\n需求120时，扩产比原安排好，却仍不及只改分配的1280元。这个差别会改变项目选择：企业应比较最合理的替代，而不只与原来的差做法比较。\n\n## 怎样试，才能发现真正的增长来源\n\n先核对产能与配送，再在可承受范围内补货、保留当时顾客询问、推介和预订、真实到店数量与售罄情况。供给增加和推广恢复如果同时发生，要记录两者；结果好时才知道下一步该扩大哪个部分。\n\n试点既要看X，也要看Y和其他受影响门店。若新增排产挤占别的高价值商品，机会成本要算；若多销售以牺牲品质换来，短期贡献也不是全部结果。关于缺货后的询问，记录的是线索，不直接把一次询问算成一次购买。\n\n再改变一个条件：交通入口关闭，需求变为X50、Y90，其他价格和费用不变。原80/80贡献920元，100/60贡献680元，仍扩到160/60只剩360元，比原安排少560元。企业要复用的是识别条件、调动资源和及时改法的能力，而非永久记住“X店配160”。\n\n案例的经营机会来自重新连接本来分开的事情。它可能打开远大于日报省时的增长空间，也需要用需求、产能和成本把这个空间变成可选择的投资。\n","text":"# 案例A｜畅销商品卖完了，生意为什么没有继续长\n\n本案例由教学条件构成。前半给出经营现场，后半用相同口径比较几种选择；收益是条件推演，不是客户实绩。\n\n## 两张报表都没错，合在一起却有问题\n\n一家区域烘焙连锁有8家门店和中央工坊。X店在交通节点附近，Y店服务周边社区。我们只看一种售价12元的主打点心，不把它当作两店全部生意。\n\n某个营业日，两店各配80份，原路线上午一次到店，门店营业至20点。X店18点卖完，通勤客流还没结束，之后仍有人询问；Y店卖出60份，剩20份。总部看到的是一店售罄、一店有剩余，于是准备把Y店的20份转给X店。这个调整有道理，但还没有回答：X店究竟少了多少生意，为什么中央工坊没有多做，以及门店为什么没有继续寻找需求。\n\n把几份现场材料摆在一起，问题开始变大。\n\n| 材料 | 看到什么 | 原来没有被一起讨论的关系 |\n|---|---|---|\n| X店销量与消息 | 售出80 60份。先问：新增投入需要多少新增销售来覆盖？\n\n与已经改成100/60的方案相比，再生产60份需要240元，加日常新增支出80元，共320元。单价12元，至少多卖27份，才超过这320元。也就是在Y店需求仍为60的给定条件下，X店卖到至少127份，扩产才优于只改分配。\n\n| X实际可购买需求 | 扩产方案售出总数 | 扩产方案贡献 | 与原安排1040元相比 |\n|---|---:|---:|---:|\n| 90份 | 150 | 840元 | 少200元 |\n| 120份 | 180 | 1200元 | 多160元 |\n| 160份 | 220 | 1680元 | 多640元 |\n\n需求120时，扩产比原安排好，却仍不及只改分配的1280元。这个差别会改变项目选择：企业应比较最合理的替代，而不只与原来的差做法比较。\n\n## 怎样试，才能发现真正的增长来源\n\n先核对产能与配送，再在可承受范围内补货、保留当时顾客询问、推介和预订、真实到店数量与售罄情况。供给增加和推广恢复如果同时发生，要记录两者；结果好时才知道下一步该扩大哪个部分。\n\n试点既要看X，也要看Y和其他受影响门店。若新增排产挤占别的高价值商品，机会成本要算；若多销售以牺牲品质换来，短期贡献也不是全部结果。关于缺货后的询问，记录的是线索，不直接把一次询问算成一次购买。\n\n再改变一个条件：交通入口关闭，需求变为X50、Y90，其他价格和费用不变。原80/80贡献920元，100/60贡献680元，仍扩到160/60只剩360元，比原安排少560元。企业要复用的是识别条件、调动资源和及时改法的能力，而非永久记住“X店配160”。\n\n案例的经营机会来自重新连接本来分开的事情。它可能打开远大于日报省时的增长空间，也需要用需求、产能和成本把这个空间变成可选择的投资。\n"},{"file":"案例B-智能资源成本.md","id":"case-b","number":null,"role":"案例","part":-1,"title":"案例B｜工业品报价：少等一天，怎样影响订单与毛利","md":"# 案例B｜工业品报价：少等一天，怎样影响订单与毛利\n\n本案例为教学构造。月度订单和成本用于条件比较，不是测得的AI销售效果；技术草稿的资源比较另列，不能重复计入月度收益。\n\n## 客户要的不是一张更快写出的报价单\n\n一家工业连接器经销商有销售、售前工程、采购与仓储。客户发来旧件照片和一页图纸，希望三天内取得可用替代。销售找到外形相似的现货，工程师却需要确认工况；另一款满足条件，供应商说十天才能到。还有一个适配方案，需要进一步确认配套件和成本。\n\n如果团队只追求快速出报价，可能先报一个不能用的型号，随后再解释；如果每笔都等工程师从头整理，又可能错过客户采购窗口。企业真正有价值的能力，是在条件不完整时问对问题，找到可履约的替代，并保持合理毛利。\n\n旧工作里，销售把“三天内”压成“客户很急”，工程师收到“找替代”，采购只查价格。客户首日上午发来的材料，直到第二日下午才形成一组可讨论候选，留给确认与交付的时间很少。三方分别补问，最后文档完成了，原客户期限却没有进入比较。这里损失的是决策条件和时间，不只是录入工时。\n\n## 把一笔询价做成能继续推进的工作\n\n新的安排先保留客户原件、明确期限和仍未知的工况。AI比较图纸、产品资料与历史适配，列出冲突，再调用当前库存和供应信息。输出不是一句“建议用某型号”，而是可由销售与工程一起判断的几条路线。\n\n| 候选 | 当前可取之处 | 还差什么才能报价 |\n|---|---|---|\n| 外形接近的现货 | 可以较快发出 | 兼容和工况依据尚未齐备 |\n| 已符合要求的另一型号 | 技术依据较完整 | 十天供货与三天需求冲突 |\n| 配套适配方案 | 可能同时解决使用与交付 | 工程确认、供应承诺和成本 |\n\n读这张表时，应把每一行看成尚需完成的路线，而不是已经可以发给客户的承诺。第一行需要回答“能不能用”，第二行已经遇到交期冲突，第三行还要确认配套和成本。团队据此把待办交给能核实的人，取得新事实后再比较。这样，AI的整理才减少了下一岗位从头理解的劳动。\n\nFDE发现这类企业的亮点，可能正是资深工程师怎样处理这些取舍。它需要进入材料整理、比较、采购确认和正式报价，才可帮助更多销售；只把老报价放进知识库，容易把过去有效的价格或承诺带到今天。\n\n最终选择有对应版本，客户改了数量或交期就重新检查。正式报价被客户收到、客户接受、形成订单和实际交付分别保留。成交或未成交的理由再回到后续询价，企业才能逐渐知道自己的优势发生在哪一段。\n\n## 每月多成交多少，才值得持续投入\n\n给定月1000笔同等有效询价，原成交200笔，每单扣采购和变动履约后贡献500元。新安排每月增加FDE共建9000元、模型1200元、工具800元，共11000元。原有固定岗位工资在这次比较中不变。\n\n| 月度情景 | 订单数与单均贡献 | 扣新增费用后的贡献 | 相对原安排 |\n|---|---|---:|---:|\n| 原安排 | 200单×500元 | 100000元 | — |\n| 只多成交20单 | 220单×500元，减11000元 | 99000元 | 少1000元 |\n| 多成交50单 | 250单×500元，减11000元 | 114000元 | 多14000元 |\n| 成交增加但压低毛利 | 250单×400元，减11000元 | 89000元 | 少11000元 |\n\n表中的贡献已经扣了采购和随订单增加的履约成本，仍需覆盖原有固定费用。原来200单留下100000元；新安排若增加50单，每单仍留下500元，就多25000元，再扣11000元新增费用，才得到14000元增量。若增加的订单依靠降价取得，应重新计算全部相应订单的单均贡献，而不能只报订单增长。\n\n单均贡献保持500元时，多22单只能持平，超过22单才有正增量；对应成交率至少跨过22.2%。从20%到25%的变化有价值，但若靠降价使全部新订单的单均贡献变400元，更多订单仍可能使企业少赚钱。\n\n250单也要求采购、库存、交付与售后能接住。报价提速提供一种作用路径，不会自动创造客户、供货容量或付款。实际比较需保留询价来源、难度、人员和同期价格，再追到客户选择。\n\n## 模型费用怎样进入同一条账\n\n另取同一组1000份询价技术草稿，比较两个AI安排。以下给定所有草稿均复核，失败全部发现并返工到同等质量，人工按60元/小时估价。\n\n| 条件 | A | B |\n|---|---:|---:|\n| 每份模型费 | 0.4元 | 1.2元 |\n| 常规复核 | 4分钟 | 2分钟 |\n| 额外返工比例 | 20% | 5% |\n| 每份额外返工 | 10分钟 | 10分钟 |\n\nA为模型400元、复核估价4000元、返工估价2000元，合6400元、100小时。B为模型1200元、复核2000元、返工500元，合3700元、约41.67小时。多花800元模型费，释放约58.33小时，列示成本少2700元。这里的复核是技术草稿环节，客户、供应商和内部交接等待另计，不能把几分钟直接当作整笔询价周期。\n\n如果其中20小时外包确实取消，少付1200元，扣新增模型费800元，现金改善400元。其余时间用于什么，要另看实际安排。上面的月度经营账已列模型与共建费用，不能再把这2700元全部加进去，重复取得收益。\n\n这个局部比较解释如何选择智能供给；月度账解释整条业务是否值得改。两张账之间，是材料、决策、客户、履约和毛利。企业要掌握的正是这些转换。\n","html":"\u003ch1>案例B｜工业品报价：少等一天，怎样影响订单与毛利\u003c/h1>\n\u003cp>本案例为教学构造。月度订单和成本用于条件比较，不是测得的AI销售效果；技术草稿的资源比较另列，不能重复计入月度收益。\u003c/p>\n\u003ch2 id=\"case-b-section-1\">客户要的不是一张更快写出的报价单\u003c/h2>\n\u003cp>一家工业连接器经销商有销售、售前工程、采购与仓储。客户发来旧件照片和一页图纸，希望三天内取得可用替代。销售找到外形相似的现货，工程师却需要确认工况；另一款满足条件，供应商说十天才能到。还有一个适配方案，需要进一步确认配套件和成本。\u003c/p>\n\u003cp>如果团队只追求快速出报价，可能先报一个不能用的型号，随后再解释；如果每笔都等工程师从头整理，又可能错过客户采购窗口。企业真正有价值的能力，是在条件不完整时问对问题，找到可履约的替代，并保持合理毛利。\u003c/p>\n\u003cp>旧工作里，销售把“三天内”压成“客户很急”，工程师收到“找替代”，采购只查价格。客户首日上午发来的材料，直到第二日下午才形成一组可讨论候选，留给确认与交付的时间很少。三方分别补问，最后文档完成了，原客户期限却没有进入比较。这里损失的是决策条件和时间，不只是录入工时。\u003c/p>\n\u003ch2 id=\"case-b-section-2\">把一笔询价做成能继续推进的工作\u003c/h2>\n\u003cp>新的安排先保留客户原件、明确期限和仍未知的工况。AI比较图纸、产品资料与历史适配，列出冲突，再调用当前库存和供应信息。输出不是一句“建议用某型号”，而是可由销售与工程一起判断的几条路线。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>候选\u003c/th>\n\u003cth>当前可取之处\u003c/th>\n\u003cth>还差什么才能报价\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>外形接近的现货\u003c/td>\n\u003ctd>可以较快发出\u003c/td>\n\u003ctd>兼容和工况依据尚未齐备\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已符合要求的另一型号\u003c/td>\n\u003ctd>技术依据较完整\u003c/td>\n\u003ctd>十天供货与三天需求冲突\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>配套适配方案\u003c/td>\n\u003ctd>可能同时解决使用与交付\u003c/td>\n\u003ctd>工程确认、供应承诺和成本\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>读这张表时，应把每一行看成尚需完成的路线，而不是已经可以发给客户的承诺。第一行需要回答“能不能用”，第二行已经遇到交期冲突，第三行还要确认配套和成本。团队据此把待办交给能核实的人，取得新事实后再比较。这样，AI的整理才减少了下一岗位从头理解的劳动。\u003c/p>\n\u003cp>FDE发现这类企业的亮点，可能正是资深工程师怎样处理这些取舍。它需要进入材料整理、比较、采购确认和正式报价，才可帮助更多销售；只把老报价放进知识库，容易把过去有效的价格或承诺带到今天。\u003c/p>\n\u003cp>最终选择有对应版本，客户改了数量或交期就重新检查。正式报价被客户收到、客户接受、形成订单和实际交付分别保留。成交或未成交的理由再回到后续询价，企业才能逐渐知道自己的优势发生在哪一段。\u003c/p>\n\u003ch2 id=\"case-b-section-3\">每月多成交多少，才值得持续投入\u003c/h2>\n\u003cp>给定月1000笔同等有效询价，原成交200笔，每单扣采购和变动履约后贡献500元。新安排每月增加FDE共建9000元、模型1200元、工具800元，共11000元。原有固定岗位工资在这次比较中不变。\u003c/p>\n\u003cdiv class=\"table-scroll table-wide\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>月度情景\u003c/th>\n\u003cth>订单数与单均贡献\u003c/th>\n\u003cth align=\"right\">扣新增费用后的贡献\u003c/th>\n\u003cth align=\"right\">相对原安排\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>原安排\u003c/td>\n\u003ctd>200单×500元\u003c/td>\n\u003ctd align=\"right\">100000元\u003c/td>\n\u003ctd align=\"right\">—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>只多成交20单\u003c/td>\n\u003ctd>220单×500元，减11000元\u003c/td>\n\u003ctd align=\"right\">99000元\u003c/td>\n\u003ctd align=\"right\">少1000元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>多成交50单\u003c/td>\n\u003ctd>250单×500元，减11000元\u003c/td>\n\u003ctd align=\"right\">114000元\u003c/td>\n\u003ctd align=\"right\">多14000元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>成交增加但压低毛利\u003c/td>\n\u003ctd>250单×400元，减11000元\u003c/td>\n\u003ctd align=\"right\">89000元\u003c/td>\n\u003ctd align=\"right\">少11000元\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"table-hint\">表格可左右滑动查看\u003c/p>\n\u003cp>表中的贡献已经扣了采购和随订单增加的履约成本，仍需覆盖原有固定费用。原来200单留下100000元；新安排若增加50单，每单仍留下500元，就多25000元，再扣11000元新增费用，才得到14000元增量。若增加的订单依靠降价取得，应重新计算全部相应订单的单均贡献，而不能只报订单增长。\u003c/p>\n\u003cp>单均贡献保持500元时，多22单只能持平，超过22单才有正增量；对应成交率至少跨过22.2%。从20%到25%的变化有价值，但若靠降价使全部新订单的单均贡献变400元，更多订单仍可能使企业少赚钱。\u003c/p>\n\u003cp>250单也要求采购、库存、交付与售后能接住。报价提速提供一种作用路径，不会自动创造客户、供货容量或付款。实际比较需保留询价来源、难度、人员和同期价格，再追到客户选择。\u003c/p>\n\u003ch2 id=\"case-b-section-4\">模型费用怎样进入同一条账\u003c/h2>\n\u003cp>另取同一组1000份询价技术草稿，比较两个AI安排。以下给定所有草稿均复核，失败全部发现并返工到同等质量，人工按60元/小时估价。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>条件\u003c/th>\n\u003cth align=\"right\">A\u003c/th>\n\u003cth align=\"right\">B\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>每份模型费\u003c/td>\n\u003ctd align=\"right\">0.4元\u003c/td>\n\u003ctd align=\"right\">1.2元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>常规复核\u003c/td>\n\u003ctd align=\"right\">4分钟\u003c/td>\n\u003ctd align=\"right\">2分钟\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>额外返工比例\u003c/td>\n\u003ctd align=\"right\">20%\u003c/td>\n\u003ctd align=\"right\">5%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>每份额外返工\u003c/td>\n\u003ctd align=\"right\">10分钟\u003c/td>\n\u003ctd align=\"right\">10分钟\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A为模型400元、复核估价4000元、返工估价2000元，合6400元、100小时。B为模型1200元、复核2000元、返工500元，合3700元、约41.67小时。多花800元模型费，释放约58.33小时，列示成本少2700元。这里的复核是技术草稿环节，客户、供应商和内部交接等待另计，不能把几分钟直接当作整笔询价周期。\u003c/p>\n\u003cp>如果其中20小时外包确实取消，少付1200元，扣新增模型费800元，现金改善400元。其余时间用于什么，要另看实际安排。上面的月度经营账已列模型与共建费用，不能再把这2700元全部加进去，重复取得收益。\u003c/p>\n\u003cp>这个局部比较解释如何选择智能供给；月度账解释整条业务是否值得改。两张账之间，是材料、决策、客户、履约和毛利。企业要掌握的正是这些转换。\u003c/p>\n","headings":[{"id":"case-b-section-1","label":"客户要的不是一张更快写出的报价单"},{"id":"case-b-section-2","label":"把一笔询价做成能继续推进的工作"},{"id":"case-b-section-3","label":"每月多成交多少，才值得持续投入"},{"id":"case-b-section-4","label":"模型费用怎样进入同一条账"}],"exportMd":"# 案例B｜工业品报价：少等一天，怎样影响订单与毛利\n\n本案例为教学构造。月度订单和成本用于条件比较，不是测得的AI销售效果；技术草稿的资源比较另列，不能重复计入月度收益。\n\n## 客户要的不是一张更快写出的报价单\n\n一家工业连接器经销商有销售、售前工程、采购与仓储。客户发来旧件照片和一页图纸，希望三天内取得可用替代。销售找到外形相似的现货，工程师却需要确认工况；另一款满足条件，供应商说十天才能到。还有一个适配方案，需要进一步确认配套件和成本。\n\n如果团队只追求快速出报价，可能先报一个不能用的型号，随后再解释；如果每笔都等工程师从头整理，又可能错过客户采购窗口。企业真正有价值的能力，是在条件不完整时问对问题，找到可履约的替代，并保持合理毛利。\n\n旧工作里，销售把“三天内”压成“客户很急”，工程师收到“找替代”，采购只查价格。客户首日上午发来的材料，直到第二日下午才形成一组可讨论候选，留给确认与交付的时间很少。三方分别补问，最后文档完成了，原客户期限却没有进入比较。这里损失的是决策条件和时间，不只是录入工时。\n\n## 把一笔询价做成能继续推进的工作\n\n新的安排先保留客户原件、明确期限和仍未知的工况。AI比较图纸、产品资料与历史适配，列出冲突，再调用当前库存和供应信息。输出不是一句“建议用某型号”，而是可由销售与工程一起判断的几条路线。\n\n| 候选 | 当前可取之处 | 还差什么才能报价 |\n|---|---|---|\n| 外形接近的现货 | 可以较快发出 | 兼容和工况依据尚未齐备 |\n| 已符合要求的另一型号 | 技术依据较完整 | 十天供货与三天需求冲突 |\n| 配套适配方案 | 可能同时解决使用与交付 | 工程确认、供应承诺和成本 |\n\n读这张表时，应把每一行看成尚需完成的路线，而不是已经可以发给客户的承诺。第一行需要回答“能不能用”，第二行已经遇到交期冲突，第三行还要确认配套和成本。团队据此把待办交给能核实的人，取得新事实后再比较。这样，AI的整理才减少了下一岗位从头理解的劳动。\n\nFDE发现这类企业的亮点，可能正是资深工程师怎样处理这些取舍。它需要进入材料整理、比较、采购确认和正式报价，才可帮助更多销售；只把老报价放进知识库，容易把过去有效的价格或承诺带到今天。\n\n最终选择有对应版本，客户改了数量或交期就重新检查。正式报价被客户收到、客户接受、形成订单和实际交付分别保留。成交或未成交的理由再回到后续询价，企业才能逐渐知道自己的优势发生在哪一段。\n\n## 每月多成交多少，才值得持续投入\n\n给定月1000笔同等有效询价，原成交200笔，每单扣采购和变动履约后贡献500元。新安排每月增加FDE共建9000元、模型1200元、工具800元，共11000元。原有固定岗位工资在这次比较中不变。\n\n| 月度情景 | 订单数与单均贡献 | 扣新增费用后的贡献 | 相对原安排 |\n|---|---|---:|---:|\n| 原安排 | 200单×500元 | 100000元 | — |\n| 只多成交20单 | 220单×500元，减11000元 | 99000元 | 少1000元 |\n| 多成交50单 | 250单×500元，减11000元 | 114000元 | 多14000元 |\n| 成交增加但压低毛利 | 250单×400元，减11000元 | 89000元 | 少11000元 |\n\n表中的贡献已经扣了采购和随订单增加的履约成本，仍需覆盖原有固定费用。原来200单留下100000元；新安排若增加50单，每单仍留下500元，就多25000元，再扣11000元新增费用，才得到14000元增量。若增加的订单依靠降价取得，应重新计算全部相应订单的单均贡献，而不能只报订单增长。\n\n单均贡献保持500元时，多22单只能持平，超过22单才有正增量；对应成交率至少跨过22.2%。从20%到25%的变化有价值，但若靠降价使全部新订单的单均贡献变400元，更多订单仍可能使企业少赚钱。\n\n250单也要求采购、库存、交付与售后能接住。报价提速提供一种作用路径，不会自动创造客户、供货容量或付款。实际比较需保留询价来源、难度、人员和同期价格，再追到客户选择。\n\n## 模型费用怎样进入同一条账\n\n另取同一组1000份询价技术草稿，比较两个AI安排。以下给定所有草稿均复核，失败全部发现并返工到同等质量，人工按60元/小时估价。\n\n| 条件 | A | B |\n|---|---:|---:|\n| 每份模型费 | 0.4元 | 1.2元 |\n| 常规复核 | 4分钟 | 2分钟 |\n| 额外返工比例 | 20% | 5% |\n| 每份额外返工 | 10分钟 | 10分钟 |\n\nA为模型400元、复核估价4000元、返工估价2000元，合6400元、100小时。B为模型1200元、复核2000元、返工500元，合3700元、约41.67小时。多花800元模型费，释放约58.33小时，列示成本少2700元。这里的复核是技术草稿环节，客户、供应商和内部交接等待另计，不能把几分钟直接当作整笔询价周期。\n\n如果其中20小时外包确实取消，少付1200元，扣新增模型费800元，现金改善400元。其余时间用于什么，要另看实际安排。上面的月度经营账已列模型与共建费用，不能再把这2700元全部加进去，重复取得收益。\n\n这个局部比较解释如何选择智能供给；月度账解释整条业务是否值得改。两张账之间，是材料、决策、客户、履约和毛利。企业要掌握的正是这些转换。\n","exportSingleMd":"# 案例B｜工业品报价：少等一天，怎样影响订单与毛利\n\n本案例为教学构造。月度订单和成本用于条件比较，不是测得的AI销售效果；技术草稿的资源比较另列，不能重复计入月度收益。\n\n## 客户要的不是一张更快写出的报价单\n\n一家工业连接器经销商有销售、售前工程、采购与仓储。客户发来旧件照片和一页图纸，希望三天内取得可用替代。销售找到外形相似的现货，工程师却需要确认工况；另一款满足条件，供应商说十天才能到。还有一个适配方案，需要进一步确认配套件和成本。\n\n如果团队只追求快速出报价，可能先报一个不能用的型号，随后再解释；如果每笔都等工程师从头整理，又可能错过客户采购窗口。企业真正有价值的能力，是在条件不完整时问对问题，找到可履约的替代，并保持合理毛利。\n\n旧工作里，销售把“三天内”压成“客户很急”，工程师收到“找替代”，采购只查价格。客户首日上午发来的材料，直到第二日下午才形成一组可讨论候选，留给确认与交付的时间很少。三方分别补问，最后文档完成了，原客户期限却没有进入比较。这里损失的是决策条件和时间，不只是录入工时。\n\n## 把一笔询价做成能继续推进的工作\n\n新的安排先保留客户原件、明确期限和仍未知的工况。AI比较图纸、产品资料与历史适配，列出冲突，再调用当前库存和供应信息。输出不是一句“建议用某型号”，而是可由销售与工程一起判断的几条路线。\n\n| 候选 | 当前可取之处 | 还差什么才能报价 |\n|---|---|---|\n| 外形接近的现货 | 可以较快发出 | 兼容和工况依据尚未齐备 |\n| 已符合要求的另一型号 | 技术依据较完整 | 十天供货与三天需求冲突 |\n| 配套适配方案 | 可能同时解决使用与交付 | 工程确认、供应承诺和成本 |\n\n读这张表时，应把每一行看成尚需完成的路线，而不是已经可以发给客户的承诺。第一行需要回答“能不能用”，第二行已经遇到交期冲突，第三行还要确认配套和成本。团队据此把待办交给能核实的人，取得新事实后再比较。这样，AI的整理才减少了下一岗位从头理解的劳动。\n\nFDE发现这类企业的亮点，可能正是资深工程师怎样处理这些取舍。它需要进入材料整理、比较、采购确认和正式报价，才可帮助更多销售；只把老报价放进知识库，容易把过去有效的价格或承诺带到今天。\n\n最终选择有对应版本，客户改了数量或交期就重新检查。正式报价被客户收到、客户接受、形成订单和实际交付分别保留。成交或未成交的理由再回到后续询价，企业才能逐渐知道自己的优势发生在哪一段。\n\n## 每月多成交多少，才值得持续投入\n\n给定月1000笔同等有效询价，原成交200笔，每单扣采购和变动履约后贡献500元。新安排每月增加FDE共建9000元、模型1200元、工具800元，共11000元。原有固定岗位工资在这次比较中不变。\n\n| 月度情景 | 订单数与单均贡献 | 扣新增费用后的贡献 | 相对原安排 |\n|---|---|---:|---:|\n| 原安排 | 200单×500元 | 100000元 | — |\n| 只多成交20单 | 220单×500元，减11000元 | 99000元 | 少1000元 |\n| 多成交50单 | 250单×500元，减11000元 | 114000元 | 多14000元 |\n| 成交增加但压低毛利 | 250单×400元，减11000元 | 89000元 | 少11000元 |\n\n表中的贡献已经扣了采购和随订单增加的履约成本，仍需覆盖原有固定费用。原来200单留下100000元；新安排若增加50单，每单仍留下500元，就多25000元，再扣11000元新增费用，才得到14000元增量。若增加的订单依靠降价取得，应重新计算全部相应订单的单均贡献，而不能只报订单增长。\n\n单均贡献保持500元时，多22单只能持平，超过22单才有正增量；对应成交率至少跨过22.2%。从20%到25%的变化有价值，但若靠降价使全部新订单的单均贡献变400元，更多订单仍可能使企业少赚钱。\n\n250单也要求采购、库存、交付与售后能接住。报价提速提供一种作用路径，不会自动创造客户、供货容量或付款。实际比较需保留询价来源、难度、人员和同期价格，再追到客户选择。\n\n## 模型费用怎样进入同一条账\n\n另取同一组1000份询价技术草稿，比较两个AI安排。以下给定所有草稿均复核，失败全部发现并返工到同等质量，人工按60元/小时估价。\n\n| 条件 | A | B |\n|---|---:|---:|\n| 每份模型费 | 0.4元 | 1.2元 |\n| 常规复核 | 4分钟 | 2分钟 |\n| 额外返工比例 | 20% | 5% |\n| 每份额外返工 | 10分钟 | 10分钟 |\n\nA为模型400元、复核估价4000元、返工估价2000元，合6400元、100小时。B为模型1200元、复核2000元、返工500元，合3700元、约41.67小时。多花800元模型费，释放约58.33小时，列示成本少2700元。这里的复核是技术草稿环节，客户、供应商和内部交接等待另计，不能把几分钟直接当作整笔询价周期。\n\n如果其中20小时外包确实取消，少付1200元，扣新增模型费800元，现金改善400元。其余时间用于什么，要另看实际安排。上面的月度经营账已列模型与共建费用，不能再把这2700元全部加进去，重复取得收益。\n\n这个局部比较解释如何选择智能供给；月度账解释整条业务是否值得改。两张账之间，是材料、决策、客户、履约和毛利。企业要掌握的正是这些转换。\n","text":"# 案例B｜工业品报价：少等一天，怎样影响订单与毛利\n\n本案例为教学构造。月度订单和成本用于条件比较，不是测得的AI销售效果；技术草稿的资源比较另列，不能重复计入月度收益。\n\n## 客户要的不是一张更快写出的报价单\n\n一家工业连接器经销商有销售、售前工程、采购与仓储。客户发来旧件照片和一页图纸，希望三天内取得可用替代。销售找到外形相似的现货，工程师却需要确认工况；另一款满足条件，供应商说十天才能到。还有一个适配方案，需要进一步确认配套件和成本。\n\n如果团队只追求快速出报价，可能先报一个不能用的型号，随后再解释；如果每笔都等工程师从头整理，又可能错过客户采购窗口。企业真正有价值的能力，是在条件不完整时问对问题，找到可履约的替代，并保持合理毛利。\n\n旧工作里，销售把“三天内”压成“客户很急”，工程师收到“找替代”，采购只查价格。客户首日上午发来的材料，直到第二日下午才形成一组可讨论候选，留给确认与交付的时间很少。三方分别补问，最后文档完成了，原客户期限却没有进入比较。这里损失的是决策条件和时间，不只是录入工时。\n\n## 把一笔询价做成能继续推进的工作\n\n新的安排先保留客户原件、明确期限和仍未知的工况。AI比较图纸、产品资料与历史适配，列出冲突，再调用当前库存和供应信息。输出不是一句“建议用某型号”，而是可由销售与工程一起判断的几条路线。\n\n| 候选 | 当前可取之处 | 还差什么才能报价 |\n|---|---|---|\n| 外形接近的现货 | 可以较快发出 | 兼容和工况依据尚未齐备 |\n| 已符合要求的另一型号 | 技术依据较完整 | 十天供货与三天需求冲突 |\n| 配套适配方案 | 可能同时解决使用与交付 | 工程确认、供应承诺和成本 |\n\n读这张表时，应把每一行看成尚需完成的路线，而不是已经可以发给客户的承诺。第一行需要回答“能不能用”，第二行已经遇到交期冲突，第三行还要确认配套和成本。团队据此把待办交给能核实的人，取得新事实后再比较。这样，AI的整理才减少了下一岗位从头理解的劳动。\n\nFDE发现这类企业的亮点，可能正是资深工程师怎样处理这些取舍。它需要进入材料整理、比较、采购确认和正式报价，才可帮助更多销售；只把老报价放进知识库，容易把过去有效的价格或承诺带到今天。\n\n最终选择有对应版本，客户改了数量或交期就重新检查。正式报价被客户收到、客户接受、形成订单和实际交付分别保留。成交或未成交的理由再回到后续询价，企业才能逐渐知道自己的优势发生在哪一段。\n\n## 每月多成交多少，才值得持续投入\n\n给定月1000笔同等有效询价，原成交200笔，每单扣采购和变动履约后贡献500元。新安排每月增加FDE共建9000元、模型1200元、工具800元，共11000元。原有固定岗位工资在这次比较中不变。\n\n| 月度情景 | 订单数与单均贡献 | 扣新增费用后的贡献 | 相对原安排 |\n|---|---|---:|---:|\n| 原安排 | 200单×500元 | 100000元 | — |\n| 只多成交20单 | 220单×500元，减11000元 | 99000元 | 少1000元 |\n| 多成交50单 | 250单×500元，减11000元 | 114000元 | 多14000元 |\n| 成交增加但压低毛利 | 250单×400元，减11000元 | 89000元 | 少11000元 |\n\n表中的贡献已经扣了采购和随订单增加的履约成本，仍需覆盖原有固定费用。原来200单留下100000元；新安排若增加50单，每单仍留下500元，就多25000元，再扣11000元新增费用，才得到14000元增量。若增加的订单依靠降价取得，应重新计算全部相应订单的单均贡献，而不能只报订单增长。\n\n单均贡献保持500元时，多22单只能持平，超过22单才有正增量；对应成交率至少跨过22.2%。从20%到25%的变化有价值，但若靠降价使全部新订单的单均贡献变400元，更多订单仍可能使企业少赚钱。\n\n250单也要求采购、库存、交付与售后能接住。报价提速提供一种作用路径，不会自动创造客户、供货容量或付款。实际比较需保留询价来源、难度、人员和同期价格，再追到客户选择。\n\n## 模型费用怎样进入同一条账\n\n另取同一组1000份询价技术草稿，比较两个AI安排。以下给定所有草稿均复核，失败全部发现并返工到同等质量，人工按60元/小时估价。\n\n| 条件 | A | B |\n|---|---:|---:|\n| 每份模型费 | 0.4元 | 1.2元 |\n| 常规复核 | 4分钟 | 2分钟 |\n| 额外返工比例 | 20% | 5% |\n| 每份额外返工 | 10分钟 | 10分钟 |\n\nA为模型400元、复核估价4000元、返工估价2000元，合6400元、100小时。B为模型1200元、复核2000元、返工500元，合3700元、约41.67小时。多花800元模型费，释放约58.33小时，列示成本少2700元。这里的复核是技术草稿环节，客户、供应商和内部交接等待另计，不能把几分钟直接当作整笔询价周期。\n\n如果其中20小时外包确实取消，少付1200元，扣新增模型费800元，现金改善400元。其余时间用于什么，要另看实际安排。上面的月度经营账已列模型与共建费用，不能再把这2700元全部加进去，重复取得收益。\n\n这个局部比较解释如何选择智能供给；月度账解释整条业务是否值得改。两张账之间，是材料、决策、客户、履约和毛利。企业要掌握的正是这些转换。\n"},{"file":"案例C-设备售后.md","id":"case-c","number":null,"role":"案例","part":-1,"title":"案例C｜设备售后：怎样把老师傅的经验变成少跑一趟","md":"# 案例C｜设备售后：怎样把老师傅的经验变成少跑一趟\n\n以下设备、工单和费用均为教学设定，不对应实际产品，不提供维修操作指令。\n\n## 服务单关了，客户的问题还在\n\n一家设备服务企业由客服接报修、调度派工、现场技术员处理，复杂问题再问资深工程师。同一台设备重复报修时，系统可能又建一张新单。客服看到关闭快，财务看到外协费用增加，客户感受到的是反复停机与等待。\n\n资深工程师的优势不一定是知道一个神奇答案。他可能在出发前先确认版本和运行条件，追问实际做过什么，再判断需要远程支持、什么人员和哪些配套件。新技术员只拿到“调整后恢复”，就学不到这些前置取舍。\n\nFDE因此不能只整理故障答案。需要把设备身份、原始描述、咨询经过、实际动作、备件、到场和后续复发接起来，找出重复上门发生在哪个环节。AI适合跨这些材料比较，提出需要核对的关系；缺件、判断不适用、客户条件变化和现场执行，应当有不同改法。\n\n## 四张“恢复”工单，留下了多少真正的认识\n\nM1客户说“促销时段间歇停机”，系统知道设备V1，负载不完整。技术员记“调整并重启，未换件”，AI却写成“更换部件后恢复”。这是一项需要纠正的事实错误，原因要回到模型当时取得的输入检查。\n\n| 工单 | 已知版本和动作 | 观察结果 |\n|---|---|---|\n| M1 | V1，调整并重启，未换件 | 当次恢复，记录到次日 |\n| M2 | V1，调整并重启 | 当次恢复，记录到次日 |\n| M3 | V2，调整，未记录重启 | 一小时后报告恢复 |\n| M4 | V1，仅记录重启 | 当次恢复，记录到次日 |\n\nAI可以把共同处、差异和空白摆出来。M4让“只有调整才会恢复”受到挑战，M3提示版本和中间变化；但未记录不等于没发生，这四张单并没有区分调整、重启和运行条件的作用。\n\n可用经验由此分成两种。一种是尚待确认的技术解释，用于提出补问；另一种是已经清楚的工作要求，例如保留完整动作、出发前核对版本、把恢复与复发接到同一设备。企业可以先改进后一种，不必等所有故障原因都被证明。\n\n## 让经验进入下一次派工\n\n假设接任技术员此前没有处理过这台设备，他首先需要知道过去的记录是否属于同一对象、当前版本有没有改变、原操作做到了哪一步。仅给他一个“曾经恢复”的答案，他仍要逐人追问；把这些条件组织好，他才能判断哪些准备可以直接做，哪些必须请专家进一步确认。\n\n下一张相似工单到来，AI先查当前设备，带回案例差别，提示尚缺事实；需要专业判断时把依据交给专家，而不是只发“请看一下”。派工前确认合适人员、必要配套和客户时段，执行后核对实际到场与恢复。\n\n某次恢复又复发，系统保留为同一问题的后续，而非仅用新关单数覆盖。专业人员据此修改适用条件，工程把修订放回采用入口。接任者要能找到并用对这些条件，老师傅原来承担的部分能力才开始留在组织。\n\n## 减少多少次复访，账才划算\n\n独立给定一个月100张服务单，原来有30次额外复访，共130次出车。回看这些复访，12次涉及配套不符、到现场才确认版本，8次涉及关键材料或客户条件未准备，另外10次本就需要分阶段服务。前20次构成候选改进空间，不意味着都能被AI消除。\n\n每次外协派单按500元结算，取消就实际少付。新AI与FDE维护增加6000元/月，正常上门及原固定工资不变。下面只比较这几项，不从四张工单估计复访概率。\n\n| 改造后的情景 | 少付外协费 | 减新增维护后 | 经营含义 |\n|---|---:|---:|---|\n| 减少10次复访 | 5000元 | 少1000元 | 仅靠列示支出尚不合算 |\n| 减少12次复访 | 6000元 | 持平 | 达到这项成本的覆盖点 |\n| 减少20次复访 | 10000元 | 多4000元 | 列示支出产生正改善 |\n\n这张账只计算能够实际取消的外协支出。减少一次，确实少付500元；每月新增服务固定支出6000元，因此6000÷500＝12次是持平点。如果技术员工资照发，只是少跑了一趟，则应先记作释放时间，不能直接使用同样的现金算法。\n\n本案候选空间20次，成本覆盖点12次，意味着要消除相当一部分可改进复访才有现金正增量。减少20次属于将这部分机会全部兑现的情景。若把必要的10次分阶段服务也当成可省，项目会被高估；若实际可影响范围比20次更小，负责人应重新选择投入强度。\n\n客户少停机、续约更稳定、专家少被重复咨询，都可能有价值，但不是同一笔钱。客户停机损失属于客户，服务商是否取得收益要看合同与客户选择；专家时间首先是容量，不能再按同样小时凭空加一笔现金。\n\n这使长期共建有了清楚对象：先让记录可信，再识别复访结构，改进准备和派工，最后用新任务与客户结果检验。能持续少走弯路、接住新设备并形成新方法，才是值得经营的服务能力。\n","html":"\u003ch1>案例C｜设备售后：怎样把老师傅的经验变成少跑一趟\u003c/h1>\n\u003cp>以下设备、工单和费用均为教学设定，不对应实际产品，不提供维修操作指令。\u003c/p>\n\u003ch2 id=\"case-c-section-1\">服务单关了，客户的问题还在\u003c/h2>\n\u003cp>一家设备服务企业由客服接报修、调度派工、现场技术员处理，复杂问题再问资深工程师。同一台设备重复报修时，系统可能又建一张新单。客服看到关闭快，财务看到外协费用增加，客户感受到的是反复停机与等待。\u003c/p>\n\u003cp>资深工程师的优势不一定是知道一个神奇答案。他可能在出发前先确认版本和运行条件，追问实际做过什么，再判断需要远程支持、什么人员和哪些配套件。新技术员只拿到“调整后恢复”，就学不到这些前置取舍。\u003c/p>\n\u003cp>FDE因此不能只整理故障答案。需要把设备身份、原始描述、咨询经过、实际动作、备件、到场和后续复发接起来，找出重复上门发生在哪个环节。AI适合跨这些材料比较，提出需要核对的关系；缺件、判断不适用、客户条件变化和现场执行，应当有不同改法。\u003c/p>\n\u003ch2 id=\"case-c-section-2\">四张“恢复”工单，留下了多少真正的认识\u003c/h2>\n\u003cp>M1客户说“促销时段间歇停机”，系统知道设备V1，负载不完整。技术员记“调整并重启，未换件”，AI却写成“更换部件后恢复”。这是一项需要纠正的事实错误，原因要回到模型当时取得的输入检查。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>工单\u003c/th>\n\u003cth>已知版本和动作\u003c/th>\n\u003cth>观察结果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>M1\u003c/td>\n\u003ctd>V1，调整并重启，未换件\u003c/td>\n\u003ctd>当次恢复，记录到次日\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M2\u003c/td>\n\u003ctd>V1，调整并重启\u003c/td>\n\u003ctd>当次恢复，记录到次日\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M3\u003c/td>\n\u003ctd>V2，调整，未记录重启\u003c/td>\n\u003ctd>一小时后报告恢复\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M4\u003c/td>\n\u003ctd>V1，仅记录重启\u003c/td>\n\u003ctd>当次恢复，记录到次日\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>AI可以把共同处、差异和空白摆出来。M4让“只有调整才会恢复”受到挑战，M3提示版本和中间变化；但未记录不等于没发生，这四张单并没有区分调整、重启和运行条件的作用。\u003c/p>\n\u003cp>可用经验由此分成两种。一种是尚待确认的技术解释，用于提出补问；另一种是已经清楚的工作要求，例如保留完整动作、出发前核对版本、把恢复与复发接到同一设备。企业可以先改进后一种，不必等所有故障原因都被证明。\u003c/p>\n\u003ch2 id=\"case-c-section-3\">让经验进入下一次派工\u003c/h2>\n\u003cp>假设接任技术员此前没有处理过这台设备，他首先需要知道过去的记录是否属于同一对象、当前版本有没有改变、原操作做到了哪一步。仅给他一个“曾经恢复”的答案，他仍要逐人追问；把这些条件组织好，他才能判断哪些准备可以直接做，哪些必须请专家进一步确认。\u003c/p>\n\u003cp>下一张相似工单到来，AI先查当前设备，带回案例差别，提示尚缺事实；需要专业判断时把依据交给专家，而不是只发“请看一下”。派工前确认合适人员、必要配套和客户时段，执行后核对实际到场与恢复。\u003c/p>\n\u003cp>某次恢复又复发，系统保留为同一问题的后续，而非仅用新关单数覆盖。专业人员据此修改适用条件，工程把修订放回采用入口。接任者要能找到并用对这些条件，老师傅原来承担的部分能力才开始留在组织。\u003c/p>\n\u003ch2 id=\"case-c-section-4\">减少多少次复访，账才划算\u003c/h2>\n\u003cp>独立给定一个月100张服务单，原来有30次额外复访，共130次出车。回看这些复访，12次涉及配套不符、到现场才确认版本，8次涉及关键材料或客户条件未准备，另外10次本就需要分阶段服务。前20次构成候选改进空间，不意味着都能被AI消除。\u003c/p>\n\u003cp>每次外协派单按500元结算，取消就实际少付。新AI与FDE维护增加6000元/月，正常上门及原固定工资不变。下面只比较这几项，不从四张工单估计复访概率。\u003c/p>\n\u003cdiv class=\"table-scroll table-wide\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>改造后的情景\u003c/th>\n\u003cth align=\"right\">少付外协费\u003c/th>\n\u003cth align=\"right\">减新增维护后\u003c/th>\n\u003cth>经营含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>减少10次复访\u003c/td>\n\u003ctd align=\"right\">5000元\u003c/td>\n\u003ctd align=\"right\">少1000元\u003c/td>\n\u003ctd>仅靠列示支出尚不合算\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>减少12次复访\u003c/td>\n\u003ctd align=\"right\">6000元\u003c/td>\n\u003ctd align=\"right\">持平\u003c/td>\n\u003ctd>达到这项成本的覆盖点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>减少20次复访\u003c/td>\n\u003ctd align=\"right\">10000元\u003c/td>\n\u003ctd align=\"right\">多4000元\u003c/td>\n\u003ctd>列示支出产生正改善\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"table-hint\">表格可左右滑动查看\u003c/p>\n\u003cp>这张账只计算能够实际取消的外协支出。减少一次，确实少付500元；每月新增服务固定支出6000元，因此6000÷500＝12次是持平点。如果技术员工资照发，只是少跑了一趟，则应先记作释放时间，不能直接使用同样的现金算法。\u003c/p>\n\u003cp>本案候选空间20次，成本覆盖点12次，意味着要消除相当一部分可改进复访才有现金正增量。减少20次属于将这部分机会全部兑现的情景。若把必要的10次分阶段服务也当成可省，项目会被高估；若实际可影响范围比20次更小，负责人应重新选择投入强度。\u003c/p>\n\u003cp>客户少停机、续约更稳定、专家少被重复咨询，都可能有价值，但不是同一笔钱。客户停机损失属于客户，服务商是否取得收益要看合同与客户选择；专家时间首先是容量，不能再按同样小时凭空加一笔现金。\u003c/p>\n\u003cp>这使长期共建有了清楚对象：先让记录可信，再识别复访结构，改进准备和派工，最后用新任务与客户结果检验。能持续少走弯路、接住新设备并形成新方法，才是值得经营的服务能力。\u003c/p>\n","headings":[{"id":"case-c-section-1","label":"服务单关了，客户的问题还在"},{"id":"case-c-section-2","label":"四张“恢复”工单，留下了多少真正的认识"},{"id":"case-c-section-3","label":"让经验进入下一次派工"},{"id":"case-c-section-4","label":"减少多少次复访，账才划算"}],"exportMd":"# 案例C｜设备售后：怎样把老师傅的经验变成少跑一趟\n\n以下设备、工单和费用均为教学设定，不对应实际产品，不提供维修操作指令。\n\n## 服务单关了，客户的问题还在\n\n一家设备服务企业由客服接报修、调度派工、现场技术员处理，复杂问题再问资深工程师。同一台设备重复报修时，系统可能又建一张新单。客服看到关闭快，财务看到外协费用增加，客户感受到的是反复停机与等待。\n\n资深工程师的优势不一定是知道一个神奇答案。他可能在出发前先确认版本和运行条件，追问实际做过什么，再判断需要远程支持、什么人员和哪些配套件。新技术员只拿到“调整后恢复”，就学不到这些前置取舍。\n\nFDE因此不能只整理故障答案。需要把设备身份、原始描述、咨询经过、实际动作、备件、到场和后续复发接起来，找出重复上门发生在哪个环节。AI适合跨这些材料比较，提出需要核对的关系；缺件、判断不适用、客户条件变化和现场执行，应当有不同改法。\n\n## 四张“恢复”工单，留下了多少真正的认识\n\nM1客户说“促销时段间歇停机”，系统知道设备V1，负载不完整。技术员记“调整并重启，未换件”，AI却写成“更换部件后恢复”。这是一项需要纠正的事实错误，原因要回到模型当时取得的输入检查。\n\n| 工单 | 已知版本和动作 | 观察结果 |\n|---|---|---|\n| M1 | V1，调整并重启，未换件 | 当次恢复，记录到次日 |\n| M2 | V1，调整并重启 | 当次恢复，记录到次日 |\n| M3 | V2，调整，未记录重启 | 一小时后报告恢复 |\n| M4 | V1，仅记录重启 | 当次恢复，记录到次日 |\n\nAI可以把共同处、差异和空白摆出来。M4让“只有调整才会恢复”受到挑战，M3提示版本和中间变化；但未记录不等于没发生，这四张单并没有区分调整、重启和运行条件的作用。\n\n可用经验由此分成两种。一种是尚待确认的技术解释，用于提出补问；另一种是已经清楚的工作要求，例如保留完整动作、出发前核对版本、把恢复与复发接到同一设备。企业可以先改进后一种，不必等所有故障原因都被证明。\n\n## 让经验进入下一次派工\n\n假设接任技术员此前没有处理过这台设备，他首先需要知道过去的记录是否属于同一对象、当前版本有没有改变、原操作做到了哪一步。仅给他一个“曾经恢复”的答案，他仍要逐人追问；把这些条件组织好，他才能判断哪些准备可以直接做，哪些必须请专家进一步确认。\n\n下一张相似工单到来，AI先查当前设备，带回案例差别，提示尚缺事实；需要专业判断时把依据交给专家，而不是只发“请看一下”。派工前确认合适人员、必要配套和客户时段，执行后核对实际到场与恢复。\n\n某次恢复又复发，系统保留为同一问题的后续，而非仅用新关单数覆盖。专业人员据此修改适用条件，工程把修订放回采用入口。接任者要能找到并用对这些条件，老师傅原来承担的部分能力才开始留在组织。\n\n## 减少多少次复访，账才划算\n\n独立给定一个月100张服务单，原来有30次额外复访，共130次出车。回看这些复访，12次涉及配套不符、到现场才确认版本，8次涉及关键材料或客户条件未准备，另外10次本就需要分阶段服务。前20次构成候选改进空间，不意味着都能被AI消除。\n\n每次外协派单按500元结算，取消就实际少付。新AI与FDE维护增加6000元/月，正常上门及原固定工资不变。下面只比较这几项，不从四张工单估计复访概率。\n\n| 改造后的情景 | 少付外协费 | 减新增维护后 | 经营含义 |\n|---|---:|---:|---|\n| 减少10次复访 | 5000元 | 少1000元 | 仅靠列示支出尚不合算 |\n| 减少12次复访 | 6000元 | 持平 | 达到这项成本的覆盖点 |\n| 减少20次复访 | 10000元 | 多4000元 | 列示支出产生正改善 |\n\n这张账只计算能够实际取消的外协支出。减少一次，确实少付500元；每月新增服务固定支出6000元，因此6000÷500＝12次是持平点。如果技术员工资照发，只是少跑了一趟，则应先记作释放时间，不能直接使用同样的现金算法。\n\n本案候选空间20次，成本覆盖点12次，意味着要消除相当一部分可改进复访才有现金正增量。减少20次属于将这部分机会全部兑现的情景。若把必要的10次分阶段服务也当成可省，项目会被高估；若实际可影响范围比20次更小，负责人应重新选择投入强度。\n\n客户少停机、续约更稳定、专家少被重复咨询，都可能有价值，但不是同一笔钱。客户停机损失属于客户，服务商是否取得收益要看合同与客户选择；专家时间首先是容量，不能再按同样小时凭空加一笔现金。\n\n这使长期共建有了清楚对象：先让记录可信，再识别复访结构，改进准备和派工，最后用新任务与客户结果检验。能持续少走弯路、接住新设备并形成新方法，才是值得经营的服务能力。\n","exportSingleMd":"# 案例C｜设备售后：怎样把老师傅的经验变成少跑一趟\n\n以下设备、工单和费用均为教学设定，不对应实际产品，不提供维修操作指令。\n\n## 服务单关了，客户的问题还在\n\n一家设备服务企业由客服接报修、调度派工、现场技术员处理，复杂问题再问资深工程师。同一台设备重复报修时，系统可能又建一张新单。客服看到关闭快，财务看到外协费用增加，客户感受到的是反复停机与等待。\n\n资深工程师的优势不一定是知道一个神奇答案。他可能在出发前先确认版本和运行条件，追问实际做过什么，再判断需要远程支持、什么人员和哪些配套件。新技术员只拿到“调整后恢复”，就学不到这些前置取舍。\n\nFDE因此不能只整理故障答案。需要把设备身份、原始描述、咨询经过、实际动作、备件、到场和后续复发接起来，找出重复上门发生在哪个环节。AI适合跨这些材料比较，提出需要核对的关系；缺件、判断不适用、客户条件变化和现场执行，应当有不同改法。\n\n## 四张“恢复”工单，留下了多少真正的认识\n\nM1客户说“促销时段间歇停机”，系统知道设备V1，负载不完整。技术员记“调整并重启，未换件”，AI却写成“更换部件后恢复”。这是一项需要纠正的事实错误，原因要回到模型当时取得的输入检查。\n\n| 工单 | 已知版本和动作 | 观察结果 |\n|---|---|---|\n| M1 | V1，调整并重启，未换件 | 当次恢复，记录到次日 |\n| M2 | V1，调整并重启 | 当次恢复，记录到次日 |\n| M3 | V2，调整，未记录重启 | 一小时后报告恢复 |\n| M4 | V1，仅记录重启 | 当次恢复，记录到次日 |\n\nAI可以把共同处、差异和空白摆出来。M4让“只有调整才会恢复”受到挑战，M3提示版本和中间变化；但未记录不等于没发生，这四张单并没有区分调整、重启和运行条件的作用。\n\n可用经验由此分成两种。一种是尚待确认的技术解释，用于提出补问；另一种是已经清楚的工作要求，例如保留完整动作、出发前核对版本、把恢复与复发接到同一设备。企业可以先改进后一种，不必等所有故障原因都被证明。\n\n## 让经验进入下一次派工\n\n假设接任技术员此前没有处理过这台设备，他首先需要知道过去的记录是否属于同一对象、当前版本有没有改变、原操作做到了哪一步。仅给他一个“曾经恢复”的答案，他仍要逐人追问；把这些条件组织好，他才能判断哪些准备可以直接做，哪些必须请专家进一步确认。\n\n下一张相似工单到来，AI先查当前设备，带回案例差别，提示尚缺事实；需要专业判断时把依据交给专家，而不是只发“请看一下”。派工前确认合适人员、必要配套和客户时段，执行后核对实际到场与恢复。\n\n某次恢复又复发，系统保留为同一问题的后续，而非仅用新关单数覆盖。专业人员据此修改适用条件，工程把修订放回采用入口。接任者要能找到并用对这些条件，老师傅原来承担的部分能力才开始留在组织。\n\n## 减少多少次复访，账才划算\n\n独立给定一个月100张服务单，原来有30次额外复访，共130次出车。回看这些复访，12次涉及配套不符、到现场才确认版本，8次涉及关键材料或客户条件未准备，另外10次本就需要分阶段服务。前20次构成候选改进空间，不意味着都能被AI消除。\n\n每次外协派单按500元结算，取消就实际少付。新AI与FDE维护增加6000元/月，正常上门及原固定工资不变。下面只比较这几项，不从四张工单估计复访概率。\n\n| 改造后的情景 | 少付外协费 | 减新增维护后 | 经营含义 |\n|---|---:|---:|---|\n| 减少10次复访 | 5000元 | 少1000元 | 仅靠列示支出尚不合算 |\n| 减少12次复访 | 6000元 | 持平 | 达到这项成本的覆盖点 |\n| 减少20次复访 | 10000元 | 多4000元 | 列示支出产生正改善 |\n\n这张账只计算能够实际取消的外协支出。减少一次，确实少付500元；每月新增服务固定支出6000元，因此6000÷500＝12次是持平点。如果技术员工资照发，只是少跑了一趟，则应先记作释放时间，不能直接使用同样的现金算法。\n\n本案候选空间20次，成本覆盖点12次，意味着要消除相当一部分可改进复访才有现金正增量。减少20次属于将这部分机会全部兑现的情景。若把必要的10次分阶段服务也当成可省，项目会被高估；若实际可影响范围比20次更小，负责人应重新选择投入强度。\n\n客户少停机、续约更稳定、专家少被重复咨询，都可能有价值，但不是同一笔钱。客户停机损失属于客户，服务商是否取得收益要看合同与客户选择；专家时间首先是容量，不能再按同样小时凭空加一笔现金。\n\n这使长期共建有了清楚对象：先让记录可信，再识别复访结构，改进准备和派工，最后用新任务与客户结果检验。能持续少走弯路、接住新设备并形成新方法，才是值得经营的服务能力。\n","text":"# 案例C｜设备售后：怎样把老师傅的经验变成少跑一趟\n\n以下设备、工单和费用均为教学设定，不对应实际产品，不提供维修操作指令。\n\n## 服务单关了，客户的问题还在\n\n一家设备服务企业由客服接报修、调度派工、现场技术员处理，复杂问题再问资深工程师。同一台设备重复报修时，系统可能又建一张新单。客服看到关闭快，财务看到外协费用增加，客户感受到的是反复停机与等待。\n\n资深工程师的优势不一定是知道一个神奇答案。他可能在出发前先确认版本和运行条件，追问实际做过什么，再判断需要远程支持、什么人员和哪些配套件。新技术员只拿到“调整后恢复”，就学不到这些前置取舍。\n\nFDE因此不能只整理故障答案。需要把设备身份、原始描述、咨询经过、实际动作、备件、到场和后续复发接起来，找出重复上门发生在哪个环节。AI适合跨这些材料比较，提出需要核对的关系；缺件、判断不适用、客户条件变化和现场执行，应当有不同改法。\n\n## 四张“恢复”工单，留下了多少真正的认识\n\nM1客户说“促销时段间歇停机”，系统知道设备V1，负载不完整。技术员记“调整并重启，未换件”，AI却写成“更换部件后恢复”。这是一项需要纠正的事实错误，原因要回到模型当时取得的输入检查。\n\n| 工单 | 已知版本和动作 | 观察结果 |\n|---|---|---|\n| M1 | V1，调整并重启，未换件 | 当次恢复，记录到次日 |\n| M2 | V1，调整并重启 | 当次恢复，记录到次日 |\n| M3 | V2，调整，未记录重启 | 一小时后报告恢复 |\n| M4 | V1，仅记录重启 | 当次恢复，记录到次日 |\n\nAI可以把共同处、差异和空白摆出来。M4让“只有调整才会恢复”受到挑战，M3提示版本和中间变化；但未记录不等于没发生，这四张单并没有区分调整、重启和运行条件的作用。\n\n可用经验由此分成两种。一种是尚待确认的技术解释，用于提出补问；另一种是已经清楚的工作要求，例如保留完整动作、出发前核对版本、把恢复与复发接到同一设备。企业可以先改进后一种，不必等所有故障原因都被证明。\n\n## 让经验进入下一次派工\n\n假设接任技术员此前没有处理过这台设备，他首先需要知道过去的记录是否属于同一对象、当前版本有没有改变、原操作做到了哪一步。仅给他一个“曾经恢复”的答案，他仍要逐人追问；把这些条件组织好，他才能判断哪些准备可以直接做，哪些必须请专家进一步确认。\n\n下一张相似工单到来，AI先查当前设备，带回案例差别，提示尚缺事实；需要专业判断时把依据交给专家，而不是只发“请看一下”。派工前确认合适人员、必要配套和客户时段，执行后核对实际到场与恢复。\n\n某次恢复又复发，系统保留为同一问题的后续，而非仅用新关单数覆盖。专业人员据此修改适用条件，工程把修订放回采用入口。接任者要能找到并用对这些条件，老师傅原来承担的部分能力才开始留在组织。\n\n## 减少多少次复访，账才划算\n\n独立给定一个月100张服务单，原来有30次额外复访，共130次出车。回看这些复访，12次涉及配套不符、到现场才确认版本，8次涉及关键材料或客户条件未准备，另外10次本就需要分阶段服务。前20次构成候选改进空间，不意味着都能被AI消除。\n\n每次外协派单按500元结算，取消就实际少付。新AI与FDE维护增加6000元/月，正常上门及原固定工资不变。下面只比较这几项，不从四张工单估计复访概率。\n\n| 改造后的情景 | 少付外协费 | 减新增维护后 | 经营含义 |\n|---|---:|---:|---|\n| 减少10次复访 | 5000元 | 少1000元 | 仅靠列示支出尚不合算 |\n| 减少12次复访 | 6000元 | 持平 | 达到这项成本的覆盖点 |\n| 减少20次复访 | 10000元 | 多4000元 | 列示支出产生正改善 |\n\n这张账只计算能够实际取消的外协支出。减少一次，确实少付500元；每月新增服务固定支出6000元，因此6000÷500＝12次是持平点。如果技术员工资照发，只是少跑了一趟，则应先记作释放时间，不能直接使用同样的现金算法。\n\n本案候选空间20次，成本覆盖点12次，意味着要消除相当一部分可改进复访才有现金正增量。减少20次属于将这部分机会全部兑现的情景。若把必要的10次分阶段服务也当成可省，项目会被高估；若实际可影响范围比20次更小，负责人应重新选择投入强度。\n\n客户少停机、续约更稳定、专家少被重复咨询，都可能有价值，但不是同一笔钱。客户停机损失属于客户，服务商是否取得收益要看合同与客户选择；专家时间首先是容量，不能再按同样小时凭空加一笔现金。\n\n这使长期共建有了清楚对象：先让记录可信，再识别复访结构，改进准备和派工，最后用新任务与客户结果检验。能持续少走弯路、接住新设备并形成新方法，才是值得经营的服务能力。\n"},{"file":"案例D-专业服务.md","id":"case-d","number":null,"role":"案例","part":-1,"title":"案例D｜工业品牌内容服务：初稿翻倍，交付为什么没有增加","md":"# 案例D｜工业品牌内容服务：初稿翻倍，交付为什么没有增加\n\n以下团队、价格和产能为教学条件。新增审核能力和客户需求是方案成立的假设，需要实际验证。\n\n## 客户付费的东西，在生成之后\n\n一家服务制造企业的内容团队，为客户制作产品介绍、应用文章和销售材料。客户希望内容能准确说明产品，适合目标采购者，并且可公开使用。\n\nAI每天能产生20份初稿，技术专家每天为此提供2小时，每篇核验30分钟，只能核4篇。一次看似流畅的文章，把一种型号的性能写到了另一型号上；另一篇适用场景宽泛，销售拿去回应询价仍要重写。稿件多了，专业核验、客户确认、配图和发布没有同步改变。\n\n若起初没有待核材料，每天20进、4出，没有取消、返工或丢失，第一天积16份，第二天32份，第五天80份。待核稿又可能因产品版本和客户需求变化而过时。生成量增加，先增加的是库存和筛选劳动。\n\n## 两种改法，改变不同的限制\n\n第一种是继续加模型并行，把初稿扩成每天40份。专家仍核4篇，交付上限不变。\n\n第二种由FDE追查专家究竟在核什么：反复找产品规格、确认型号、检查措辞是否超出材料，以及判断是否回答客户的真实问题。新的安排先提供客户对象、现行产品资料和可核依据，AI标出草稿中的事实、引用与待确认项；专家集中处理重要差别，修改返回下一轮。\n\n若这一改法能在相同最终质量下，把单篇核验从30分钟减到20分钟，同样2小时便可核6篇；而每天只需8份有针对性的初稿，资源便从无效扩量转向可交付工作。少掉的10分钟应来自实际减少的查找和重做，6篇是待验证假设，不由增加一个来源链接自动取得。\n\n新安排还改变进入核验的节奏：编辑在原有排题工时内，从8份候选选6份送审，另外2份明确终止，不再作为待核交付积压。若筛选本身需要专家参与，就要计入同一段2小时，六篇产能随之重算。减少上游进入量和改善专业核验，是两项相互配合的改变。\n\n## 用20个工作日把账算完整\n\n每篇客户接受并付费的交付收入800元，后续配图、编辑与发布外部变动成本300元；每份初稿模型费2元。原固定团队工资不变，改善资料与核验的方案另增FDE费用8000元/月。假设客户有120篇合格付费需求，后续环节有相应容量。\n\n| 月度安排 | 原安排 | 只扩大生成 | 改资料与核验 |\n|---|---:|---:|---:|\n| 每日初稿/审核 | 20/4 | 40/4 | 8/6 |\n| 月初稿 | 400 | 800 | 160 |\n| 月付费交付 | 80 | 80 | 120 |\n| 收入 | 64000元 | 64000元 | 96000元 |\n| 后续变动成本 | 24000元 | 24000元 | 36000元 |\n| 模型费 | 800元 | 1600元 | 320元 |\n| 新增FDE费 | 0 | 0 | 8000元 |\n| 列示贡献 | 39200元 | 38400元 | 51680元 |\n\n先读原安排这一列：每月80篇付费交付，每篇800元，收入64000元；每篇后续支出300元，共24000元；400份初稿每份模型费2元，共800元。相减后留下39200元，还没有扣原有固定工资等公司费用。改善方案按同一方式计算，再扣新增8000元FDE费，才能与它比较。\n\n只扩生成少了800元贡献；改变真正瓶颈的方案多12480元。起作用的不是“产出文字更多”，而是相同质量下可核、可接受、可付费的工作增加，同时无用初稿减少。\n\n再改一个条件：客户实际上只愿付80篇。仍按新方案160份初稿和8000元费用安排，只交付80篇，贡献变31680元，反而比原来少7520元。省出专家容量不等于有生意来填；按本例成本，至少增加16篇付费交付，才取得正增量。\n\n## 好候选、好选择与好生意要分别成立\n\n同一项内容工作中，AI可能擅长构思，专家可能擅长辨别工况，客户则决定采用。最终交付质量还受组合影响，不能固定成“AI只写、人永远能选对”。\n\n一个独立分数算例是：旧方案池70、80，选80；新池92、98，选92。新安排没选到自己最好的一项，最终仍高于旧安排。它只说明生成质量与选择能力可以分开，不是宝洁研究的数据。\n\n客户随后可能希望把内容服务扩成持续获客支持。这会要求连接产品问题、受众、询价质量、销售跟进与成交，而非只按月发文章。能不能取得客户后续记录、专业与销售是否能行动、收费能否覆盖责任，决定新产品是否成立。\n\n还可以讨论一个独立稳定系统：日均完成4份、均停留3天，平均在制12份。这与前面的持续20进4出不同，不能把增长积压代入稳定公式算等待。\n\n这个案例让智能资源经营回到一条完整交付链。模型可以很快增加供给，企业需要找到被限制的能力，并确认客户愿意为解开限制后的结果付费。\n","html":"\u003ch1>案例D｜工业品牌内容服务：初稿翻倍，交付为什么没有增加\u003c/h1>\n\u003cp>以下团队、价格和产能为教学条件。新增审核能力和客户需求是方案成立的假设，需要实际验证。\u003c/p>\n\u003ch2 id=\"case-d-section-1\">客户付费的东西，在生成之后\u003c/h2>\n\u003cp>一家服务制造企业的内容团队，为客户制作产品介绍、应用文章和销售材料。客户希望内容能准确说明产品，适合目标采购者，并且可公开使用。\u003c/p>\n\u003cp>AI每天能产生20份初稿，技术专家每天为此提供2小时，每篇核验30分钟，只能核4篇。一次看似流畅的文章，把一种型号的性能写到了另一型号上；另一篇适用场景宽泛，销售拿去回应询价仍要重写。稿件多了，专业核验、客户确认、配图和发布没有同步改变。\u003c/p>\n\u003cp>若起初没有待核材料，每天20进、4出，没有取消、返工或丢失，第一天积16份，第二天32份，第五天80份。待核稿又可能因产品版本和客户需求变化而过时。生成量增加，先增加的是库存和筛选劳动。\u003c/p>\n\u003ch2 id=\"case-d-section-2\">两种改法，改变不同的限制\u003c/h2>\n\u003cp>第一种是继续加模型并行，把初稿扩成每天40份。专家仍核4篇，交付上限不变。\u003c/p>\n\u003cp>第二种由FDE追查专家究竟在核什么：反复找产品规格、确认型号、检查措辞是否超出材料，以及判断是否回答客户的真实问题。新的安排先提供客户对象、现行产品资料和可核依据，AI标出草稿中的事实、引用与待确认项；专家集中处理重要差别，修改返回下一轮。\u003c/p>\n\u003cp>若这一改法能在相同最终质量下，把单篇核验从30分钟减到20分钟，同样2小时便可核6篇；而每天只需8份有针对性的初稿，资源便从无效扩量转向可交付工作。少掉的10分钟应来自实际减少的查找和重做，6篇是待验证假设，不由增加一个来源链接自动取得。\u003c/p>\n\u003cp>新安排还改变进入核验的节奏：编辑在原有排题工时内，从8份候选选6份送审，另外2份明确终止，不再作为待核交付积压。若筛选本身需要专家参与，就要计入同一段2小时，六篇产能随之重算。减少上游进入量和改善专业核验，是两项相互配合的改变。\u003c/p>\n\u003ch2 id=\"case-d-section-3\">用20个工作日把账算完整\u003c/h2>\n\u003cp>每篇客户接受并付费的交付收入800元，后续配图、编辑与发布外部变动成本300元；每份初稿模型费2元。原固定团队工资不变，改善资料与核验的方案另增FDE费用8000元/月。假设客户有120篇合格付费需求，后续环节有相应容量。\u003c/p>\n\u003cdiv class=\"table-scroll table-wide\" tabindex=\"0\" aria-label=\"可横向滚动的数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>月度安排\u003c/th>\n\u003cth align=\"right\">原安排\u003c/th>\n\u003cth align=\"right\">只扩大生成\u003c/th>\n\u003cth align=\"right\">改资料与核验\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>每日初稿/审核\u003c/td>\n\u003ctd align=\"right\">20/4\u003c/td>\n\u003ctd align=\"right\">40/4\u003c/td>\n\u003ctd align=\"right\">8/6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>月初稿\u003c/td>\n\u003ctd align=\"right\">400\u003c/td>\n\u003ctd align=\"right\">800\u003c/td>\n\u003ctd align=\"right\">160\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>月付费交付\u003c/td>\n\u003ctd align=\"right\">80\u003c/td>\n\u003ctd align=\"right\">80\u003c/td>\n\u003ctd align=\"right\">120\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>收入\u003c/td>\n\u003ctd align=\"right\">64000元\u003c/td>\n\u003ctd align=\"right\">64000元\u003c/td>\n\u003ctd align=\"right\">96000元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>后续变动成本\u003c/td>\n\u003ctd align=\"right\">24000元\u003c/td>\n\u003ctd align=\"right\">24000元\u003c/td>\n\u003ctd align=\"right\">36000元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模型费\u003c/td>\n\u003ctd align=\"right\">800元\u003c/td>\n\u003ctd align=\"right\">1600元\u003c/td>\n\u003ctd align=\"right\">320元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新增FDE费\u003c/td>\n\u003ctd align=\"right\">0\u003c/td>\n\u003ctd align=\"right\">0\u003c/td>\n\u003ctd align=\"right\">8000元\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>列示贡献\u003c/td>\n\u003ctd align=\"right\">39200元\u003c/td>\n\u003ctd align=\"right\">38400元\u003c/td>\n\u003ctd align=\"right\">51680元\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"table-hint\">表格可左右滑动查看\u003c/p>\n\u003cp>先读原安排这一列：每月80篇付费交付，每篇800元，收入64000元；每篇后续支出300元，共24000元；400份初稿每份模型费2元，共800元。相减后留下39200元，还没有扣原有固定工资等公司费用。改善方案按同一方式计算，再扣新增8000元FDE费，才能与它比较。\u003c/p>\n\u003cp>只扩生成少了800元贡献；改变真正瓶颈的方案多12480元。起作用的不是“产出文字更多”，而是相同质量下可核、可接受、可付费的工作增加，同时无用初稿减少。\u003c/p>\n\u003cp>再改一个条件：客户实际上只愿付80篇。仍按新方案160份初稿和8000元费用安排，只交付80篇，贡献变31680元，反而比原来少7520元。省出专家容量不等于有生意来填；按本例成本，至少增加16篇付费交付，才取得正增量。\u003c/p>\n\u003ch2 id=\"case-d-section-4\">好候选、好选择与好生意要分别成立\u003c/h2>\n\u003cp>同一项内容工作中，AI可能擅长构思，专家可能擅长辨别工况，客户则决定采用。最终交付质量还受组合影响，不能固定成“AI只写、人永远能选对”。\u003c/p>\n\u003cp>一个独立分数算例是：旧方案池70、80，选80；新池92、98，选92。新安排没选到自己最好的一项，最终仍高于旧安排。它只说明生成质量与选择能力可以分开，不是宝洁研究的数据。\u003c/p>\n\u003cp>客户随后可能希望把内容服务扩成持续获客支持。这会要求连接产品问题、受众、询价质量、销售跟进与成交，而非只按月发文章。能不能取得客户后续记录、专业与销售是否能行动、收费能否覆盖责任，决定新产品是否成立。\u003c/p>\n\u003cp>还可以讨论一个独立稳定系统：日均完成4份、均停留3天，平均在制12份。这与前面的持续20进4出不同，不能把增长积压代入稳定公式算等待。\u003c/p>\n\u003cp>这个案例让智能资源经营回到一条完整交付链。模型可以很快增加供给，企业需要找到被限制的能力，并确认客户愿意为解开限制后的结果付费。\u003c/p>\n","headings":[{"id":"case-d-section-1","label":"客户付费的东西，在生成之后"},{"id":"case-d-section-2","label":"两种改法，改变不同的限制"},{"id":"case-d-section-3","label":"用20个工作日把账算完整"},{"id":"case-d-section-4","label":"好候选、好选择与好生意要分别成立"}],"exportMd":"# 案例D｜工业品牌内容服务：初稿翻倍，交付为什么没有增加\n\n以下团队、价格和产能为教学条件。新增审核能力和客户需求是方案成立的假设，需要实际验证。\n\n## 客户付费的东西，在生成之后\n\n一家服务制造企业的内容团队，为客户制作产品介绍、应用文章和销售材料。客户希望内容能准确说明产品，适合目标采购者，并且可公开使用。\n\nAI每天能产生20份初稿，技术专家每天为此提供2小时，每篇核验30分钟，只能核4篇。一次看似流畅的文章，把一种型号的性能写到了另一型号上；另一篇适用场景宽泛，销售拿去回应询价仍要重写。稿件多了，专业核验、客户确认、配图和发布没有同步改变。\n\n若起初没有待核材料，每天20进、4出，没有取消、返工或丢失，第一天积16份，第二天32份，第五天80份。待核稿又可能因产品版本和客户需求变化而过时。生成量增加，先增加的是库存和筛选劳动。\n\n## 两种改法，改变不同的限制\n\n第一种是继续加模型并行，把初稿扩成每天40份。专家仍核4篇，交付上限不变。\n\n第二种由FDE追查专家究竟在核什么：反复找产品规格、确认型号、检查措辞是否超出材料，以及判断是否回答客户的真实问题。新的安排先提供客户对象、现行产品资料和可核依据，AI标出草稿中的事实、引用与待确认项；专家集中处理重要差别，修改返回下一轮。\n\n若这一改法能在相同最终质量下，把单篇核验从30分钟减到20分钟，同样2小时便可核6篇；而每天只需8份有针对性的初稿，资源便从无效扩量转向可交付工作。少掉的10分钟应来自实际减少的查找和重做，6篇是待验证假设，不由增加一个来源链接自动取得。\n\n新安排还改变进入核验的节奏：编辑在原有排题工时内，从8份候选选6份送审，另外2份明确终止，不再作为待核交付积压。若筛选本身需要专家参与，就要计入同一段2小时，六篇产能随之重算。减少上游进入量和改善专业核验，是两项相互配合的改变。\n\n## 用20个工作日把账算完整\n\n每篇客户接受并付费的交付收入800元，后续配图、编辑与发布外部变动成本300元；每份初稿模型费2元。原固定团队工资不变，改善资料与核验的方案另增FDE费用8000元/月。假设客户有120篇合格付费需求，后续环节有相应容量。\n\n| 月度安排 | 原安排 | 只扩大生成 | 改资料与核验 |\n|---|---:|---:|---:|\n| 每日初稿/审核 | 20/4 | 40/4 | 8/6 |\n| 月初稿 | 400 | 800 | 160 |\n| 月付费交付 | 80 | 80 | 120 |\n| 收入 | 64000元 | 64000元 | 96000元 |\n| 后续变动成本 | 24000元 | 24000元 | 36000元 |\n| 模型费 | 800元 | 1600元 | 320元 |\n| 新增FDE费 | 0 | 0 | 8000元 |\n| 列示贡献 | 39200元 | 38400元 | 51680元 |\n\n先读原安排这一列：每月80篇付费交付，每篇800元，收入64000元；每篇后续支出300元，共24000元；400份初稿每份模型费2元，共800元。相减后留下39200元，还没有扣原有固定工资等公司费用。改善方案按同一方式计算，再扣新增8000元FDE费，才能与它比较。\n\n只扩生成少了800元贡献；改变真正瓶颈的方案多12480元。起作用的不是“产出文字更多”，而是相同质量下可核、可接受、可付费的工作增加，同时无用初稿减少。\n\n再改一个条件：客户实际上只愿付80篇。仍按新方案160份初稿和8000元费用安排，只交付80篇，贡献变31680元，反而比原来少7520元。省出专家容量不等于有生意来填；按本例成本，至少增加16篇付费交付，才取得正增量。\n\n## 好候选、好选择与好生意要分别成立\n\n同一项内容工作中，AI可能擅长构思，专家可能擅长辨别工况，客户则决定采用。最终交付质量还受组合影响，不能固定成“AI只写、人永远能选对”。\n\n一个独立分数算例是：旧方案池70、80，选80；新池92、98，选92。新安排没选到自己最好的一项，最终仍高于旧安排。它只说明生成质量与选择能力可以分开，不是宝洁研究的数据。\n\n客户随后可能希望把内容服务扩成持续获客支持。这会要求连接产品问题、受众、询价质量、销售跟进与成交，而非只按月发文章。能不能取得客户后续记录、专业与销售是否能行动、收费能否覆盖责任，决定新产品是否成立。\n\n还可以讨论一个独立稳定系统：日均完成4份、均停留3天，平均在制12份。这与前面的持续20进4出不同，不能把增长积压代入稳定公式算等待。\n\n这个案例让智能资源经营回到一条完整交付链。模型可以很快增加供给，企业需要找到被限制的能力，并确认客户愿意为解开限制后的结果付费。\n","exportSingleMd":"# 案例D｜工业品牌内容服务：初稿翻倍，交付为什么没有增加\n\n以下团队、价格和产能为教学条件。新增审核能力和客户需求是方案成立的假设，需要实际验证。\n\n## 客户付费的东西，在生成之后\n\n一家服务制造企业的内容团队，为客户制作产品介绍、应用文章和销售材料。客户希望内容能准确说明产品，适合目标采购者，并且可公开使用。\n\nAI每天能产生20份初稿，技术专家每天为此提供2小时，每篇核验30分钟，只能核4篇。一次看似流畅的文章，把一种型号的性能写到了另一型号上；另一篇适用场景宽泛，销售拿去回应询价仍要重写。稿件多了，专业核验、客户确认、配图和发布没有同步改变。\n\n若起初没有待核材料，每天20进、4出，没有取消、返工或丢失，第一天积16份，第二天32份，第五天80份。待核稿又可能因产品版本和客户需求变化而过时。生成量增加，先增加的是库存和筛选劳动。\n\n## 两种改法，改变不同的限制\n\n第一种是继续加模型并行，把初稿扩成每天40份。专家仍核4篇，交付上限不变。\n\n第二种由FDE追查专家究竟在核什么：反复找产品规格、确认型号、检查措辞是否超出材料，以及判断是否回答客户的真实问题。新的安排先提供客户对象、现行产品资料和可核依据，AI标出草稿中的事实、引用与待确认项；专家集中处理重要差别，修改返回下一轮。\n\n若这一改法能在相同最终质量下，把单篇核验从30分钟减到20分钟，同样2小时便可核6篇；而每天只需8份有针对性的初稿，资源便从无效扩量转向可交付工作。少掉的10分钟应来自实际减少的查找和重做，6篇是待验证假设，不由增加一个来源链接自动取得。\n\n新安排还改变进入核验的节奏：编辑在原有排题工时内，从8份候选选6份送审，另外2份明确终止，不再作为待核交付积压。若筛选本身需要专家参与，就要计入同一段2小时，六篇产能随之重算。减少上游进入量和改善专业核验，是两项相互配合的改变。\n\n## 用20个工作日把账算完整\n\n每篇客户接受并付费的交付收入800元，后续配图、编辑与发布外部变动成本300元；每份初稿模型费2元。原固定团队工资不变，改善资料与核验的方案另增FDE费用8000元/月。假设客户有120篇合格付费需求，后续环节有相应容量。\n\n| 月度安排 | 原安排 | 只扩大生成 | 改资料与核验 |\n|---|---:|---:|---:|\n| 每日初稿/审核 | 20/4 | 40/4 | 8/6 |\n| 月初稿 | 400 | 800 | 160 |\n| 月付费交付 | 80 | 80 | 120 |\n| 收入 | 64000元 | 64000元 | 96000元 |\n| 后续变动成本 | 24000元 | 24000元 | 36000元 |\n| 模型费 | 800元 | 1600元 | 320元 |\n| 新增FDE费 | 0 | 0 | 8000元 |\n| 列示贡献 | 39200元 | 38400元 | 51680元 |\n\n先读原安排这一列：每月80篇付费交付，每篇800元，收入64000元；每篇后续支出300元，共24000元；400份初稿每份模型费2元，共800元。相减后留下39200元，还没有扣原有固定工资等公司费用。改善方案按同一方式计算，再扣新增8000元FDE费，才能与它比较。\n\n只扩生成少了800元贡献；改变真正瓶颈的方案多12480元。起作用的不是“产出文字更多”，而是相同质量下可核、可接受、可付费的工作增加，同时无用初稿减少。\n\n再改一个条件：客户实际上只愿付80篇。仍按新方案160份初稿和8000元费用安排，只交付80篇，贡献变31680元，反而比原来少7520元。省出专家容量不等于有生意来填；按本例成本，至少增加16篇付费交付，才取得正增量。\n\n## 好候选、好选择与好生意要分别成立\n\n同一项内容工作中，AI可能擅长构思，专家可能擅长辨别工况，客户则决定采用。最终交付质量还受组合影响，不能固定成“AI只写、人永远能选对”。\n\n一个独立分数算例是：旧方案池70、80，选80；新池92、98，选92。新安排没选到自己最好的一项，最终仍高于旧安排。它只说明生成质量与选择能力可以分开，不是宝洁研究的数据。\n\n客户随后可能希望把内容服务扩成持续获客支持。这会要求连接产品问题、受众、询价质量、销售跟进与成交，而非只按月发文章。能不能取得客户后续记录、专业与销售是否能行动、收费能否覆盖责任，决定新产品是否成立。\n\n还可以讨论一个独立稳定系统：日均完成4份、均停留3天，平均在制12份。这与前面的持续20进4出不同，不能把增长积压代入稳定公式算等待。\n\n这个案例让智能资源经营回到一条完整交付链。模型可以很快增加供给，企业需要找到被限制的能力，并确认客户愿意为解开限制后的结果付费。\n","text":"# 案例D｜工业品牌内容服务：初稿翻倍，交付为什么没有增加\n\n以下团队、价格和产能为教学条件。新增审核能力和客户需求是方案成立的假设，需要实际验 "role":"参考","part":-1,"title":"概念回查｜把词放回经营问题","md":"# 概念回查｜把词放回经营问题\n\n遇到概念时，先看它解释什么，再回正文。这里用于查询，不要求先背术语。\n\n| 概念 | 在本课中的用途 | 正文 |\n|---|---|---|\n| 基础模型 | 先取得可适配多类任务的通用能力，再补企业条件 | [第1章](01-智能供给.md) |\n| 吸收能力 | 企业怎样识别、理解并应用新知识 | [第4章](04-共同发展.md)、[第35章](35-内部吸收与接续.md) |\n| know-how | 做一类工作时，知道先看什么、怎样判断、如何行动，以及条件变化后怎样调整的经验和方法 | [第5章](05-从经验到能力.md) |\n| 候选经验 | 有待进一步区分的解释，先用于补问与观察 | [第8章](08-经验的可信度.md) |\n| 组织记忆 | 跨人、跨任务仍能找到、理解、采用和更新经验的条件 | [第9章](09-组织记忆.md) |\n| 标准化 | 让事实和协作含义可共同理解，方法随证据稳定 | [第10章](10-标准与情境.md) |\n| 差异化 | 与客户选择和可持续交付有关的能力组合 | [第11章](11-客户认可的价值.md) |\n| 互补能力 | 与智能共同产生结果的客户、专业、渠道或履约条件 | [第3章](03-产业重构.md) |\n| 优势生成机制 | 条件怎样经判断、协作和资源形成客户结果 | [第12章](12-优势的生成机制.md) |\n| FDE | 靠近现场，把认识、工程和反馈连续连接的专业力量 | [第14章](14-FDE的企业侧角色.md) |\n| 试点学习价值 | 取得会改变下一笔选择的证据 | [第16章](16-试点与学习价值.md) |\n| 智能伙伴 | 有持续职责、任务记忆、行动与反馈的AI参与者 | [第17章](17-智能伙伴的持续职责.md) |\n| 工作流 | 主要路径由预设程序组织，可含模型、分支与循环 | [第19章](19-工作流与Agent.md) |\n| Agent | 模型在目标与工具范围内，动态选择部分下一步 | [第19章](19-工作流与Agent.md) |\n| 上下文与检索 | 上下文是本次实际交给模型使用的目标、事实、规则等材料；检索帮助从保存的资料中找到相关部分，使用前还要判断是否适用 | [第20章](20-上下文与检索.md) |\n| 业务状态 | 建议、采用、接受、实际完成与客户结果等不同事实 | [第21章](21-建议与真实执行.md) |\n| 互补投入 | 技术作用所需的流程、人员、组织和工具建设 | [第22章](22-持续运行与系统演化.md) |\n| token | 模型输入输出的计量单位，不是价值单位 | [第23章](23-token与智能资源.md) |\n| 有效利用 | 智能投入形成合格工作的过程 | [第23章](23-token与智能资源.md) |\n| 价值转换 | 工作经采用、执行和客户选择进入经营 | [第26章](26-完整成本与兑现.md) |\n| 产能瓶颈 | 限制整条交付的环节，上游扩量可能只增加等待 | [第25章](25-产能与瓶颈.md) |\n| 能力留存 | 本轮工作对后续任务、接任或迁移的作用 | [第27章](27-能力留存.md) |\n| 探索与利用 | 研究新可能与改善已有能力的资源取舍 | [第28章](28-投入组合.md) |\n| 留出任务 | 不用于调方案，用来观察新材料表现的任务 | [第29章](29-任务质量.md) |\n| 列示贡献 | 为比较方案，用收入扣除案例中列出的生产、模型等相关支出后剩下的金额；未扣全部固定费用，因此不是公司净利润 | [第30章](30-业务效果与因果.md) |\n| 因果与比较 | 区分方法作用、选择差异和同期变化 | [第30章](30-业务效果与因果.md) |\n| 组织学习 | 后续工作因经验改变，且能有条件地接任与迁移 | [第31章](31-组织学习的验证.md) |\n| 反馈循环 | 行动改变未来可见数据，可能改进也可能强化偏差 | [第32章](32-纠错与遗忘.md) |\n| 动态能力 | 使资源和能力持续适应、重组并保持相关 | [第37章](37-阶段发展路线.md) |\n| 商业模式 | 客户价值、交付与价值获取的经营关系 | [第38章](38-新产品与服务.md) |\n\n这些解释服务课程判断。具体选择仍要回到相应情境、条件与证据。\n","html":"\u003ch1>概念回查｜把词放回经营问题\u003c/h1>\n\u003cp>遇到概念时，先看它解释什么，再回正文。这里用于查询，不要求先背术语。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>在本课中的用途\u003c/th>\n\u003cth>正文\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>基础模型\u003c/td>\n\u003ctd>先取得可适配多类任务的通用能力，再补企业条件\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-01\">第1章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>吸收能力\u003c/td>\n\u003ctd>企业怎样识别、理解并应用新知识\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-04\">第4章\u003c/a>、\u003ca href=\"#lesson-35\">第35章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>know-how\u003c/td>\n\u003ctd>做一类工作时，知道先看什么、怎样判断、如何行动，以及条件变化后怎样调整的经验和方法\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-05\">第5章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>候选经验\u003c/td>\n\u003ctd>有待进一步区分的解释，先用于补问与观察\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-08\">第8章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>组织记忆\u003c/td>\n\u003ctd>跨人、跨任务仍能找到、理解、采用和更新经验的条件\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-09\">第9章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>标准化\u003c/td>\n\u003ctd>让事实和协作含义可共同理解，方法随证据稳定\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-10\">第10章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>差异化\u003c/td>\n\u003ctd>与客户选择和可持续交付有关的能力组合\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-11\">第11章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>互补能力\u003c/td>\n\u003ctd>与智能共同产生结果的客户、专业、渠道或履约条件\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-03\">第3章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>优势生成机制\u003c/td>\n\u003ctd>条件怎样经判断、协作和资源形成客户结果\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-12\">第12章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FDE\u003c/td>\n\u003ctd>靠近现场，把认识、工程和反馈连续连接的专业力量\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-14\">第14章\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>试点学习价值\u003c/td>\n\u003ctd>取得会改变下一笔选择的证据\u003c/td>\n\u003ctd>\u003ca href=\"#lesson-16\">第16章\u003c/a>\u003c
