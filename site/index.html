照。\n\n这不是要宣布方法无效，而是把能够指导下一步的问题找出来。\n\n## 让不同解释产生不同观察要求\n\n若调整起主要作用，应能在相近条件下看见与其他处置的差别；若负载变化起作用，就要补运行条件；若表面症状其实包含多类问题，先需要更好的分类。\n\nAI可以帮助找缺项、对照失败和成功、提出候选解释。专业人员据此选择可行观察，资源和客户条件决定能做到哪一步。文本上的合理原因要经过外部事实约束，才会逐渐成为可用认识。\n\n## 证据不足时，仍然可以改工作\n\n企业不必等到唯一技术原因被证明，才核对版本、记录完整动作、准备正确配套、追踪复发。这些工作条件已经能解释为什么某些经验无法接任，也帮助下一轮进一步分辨原因。\n\n采用强度可以分开：候选经验用于补问，经过检验的常规方法承担更多工作，新版本与相反事实进入专业支持。对一项方法，写清什么观察会让团队改法，比一句笼统“谨慎使用”更可操作。\n\n## 只留成功，会怎样影响下一次\n\n失败单可能迟迟未关闭，停止联系的客户可能不再反馈，未采用方案的理由也可能被丢掉。经验库于是天然偏向顺利故事。系统还会改变后续所见材料，例如长期少配的门店只留下受限销量。\n\n机器学习系统研究把这种行动与数据相互影响视为重要维护问题。[原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf) 企业应给反例一个正常入口，使新的事实有机会改变旧认识。\n\n一份可接续的经验，可以明确说：目前观察到恢复，几个原因尚未区分，现阶段先用它确定补问与检查，下次补哪些结果。它不如一个确定答案好展示，却让接任者知道团队已经走到哪里，并能继续向前。\n","exportSingleMd":"# 第8章｜经验越整理越像规律，怎样判断它是否真的可靠\n\n同一种症状，四张工单都写“恢复”。如果把成功结案放在一起，AI很容易组织出一个完整故事。服务负责人需要的却是：下一次按这个故事做，会减少复访，还是把错误重复得更整齐？\n\n## 从四张记录里，究竟能够看见什么\n\n[设备售后案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-c)保留了以下经过，设备代号只用于教学。\n\n| 工单 | 版本与已记录动作 | 结果 |\n|---|---|---|\n| M1 | V1，调整并重启，未换件 | 当次恢复，记录到次日 |\n| M2 | V1，调整并重启 | 当次恢复，记录到次日 |\n| M3 | V2，调整，未记录重启 | 一小时后报告恢复 |\n| M4 | V1，仅记录重启 | 当次恢复，记录到次日 |\n\n只看M1和M2，可以提出“调整可能有用”；看到M4，还需要研究重启、问题类型或运行条件。M3又提醒团队版本与中间经过不同。未记录重启不等于没重启，表格空白不能被整理成一个动作未发生的对照。\n\n这不是要宣布方法无效，而是把能够指导下一步的问题找出来。\n\n## 让不同解释产生不同观察要求\n\n若调整起主要作用，应能在相近条件下看见与其他处置的差别；若负载变化起作用，就要补运行条件；若表面症状其实包含多类问题，先需要更好的分类。\n\nAI可以帮助找缺项、对照失败和成功、提出候选解释。专业人员据此选择可行观察，资源和客户条件决定能做到哪一步。文本上的合理原因要经过外部事实约束，才会逐渐成为可用认识。\n\n## 证据不足时，仍然可以改工作\n\n企业不必等到唯一技术原因被证明，才核对版本、记录完整动作、准备正确配套、追踪复发。这些工作条件已经能解释为什么某些经验无法接任，也帮助下一轮进一步分辨原因。\n\n采用强度可以分开：候选经验用于补问，经过检验的常规方法承担更多工作，新版本与相反事实进入专业支持。对一项方法，写清什么观察会让团队改法，比一句笼统“谨慎使用”更可操作。\n\n## 只留成功，会怎样影响下一次\n\n失败单可能迟迟未关闭，停止联系的客户可能不再反馈，未采用方案的理由也可能被丢掉。经验库于是天然偏向顺利故事。系统还会改变后续所见材料，例如长期少配的门店只留下受限销量。\n\n机器学习系统研究把这种行动与数据相互影响视为重要维护问题。[原始论文](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf) 企业应给反例一个正常入口，使新的事实有机会改变旧认识。\n\n一份可接续的经验，可以明确说：目前观察到恢复，几个原因尚未区分，现阶段先用它确定补问与检查，下次补哪些结果。它不如一个确定答案好展示，却让接任者知道团队已经走到哪里，并能继续向前。\n","text":"# 第8章｜经验越整理越像规律，怎样判断它是否真的可靠\n\n同一种症状，四张工单都写“恢复”。如果把成功结案放在一起，AI很容易组织出一个完整故事。服务负责人需要的却是：下一次按这个故事做，会减少复访，还是把错误重复得更整齐？\n\n## 从四张记录里，究竟能够看见什么\n\n设备售后案例保留了以下经过，设备代号只用于教学。\n\n| 工单 | 版本与已记录动作 | 结果 |\n|---|---|---|\n| M1 | V1，调整并重启，未换件 | 当次恢复，记录到次日 |\n| M2 | V1，调整并重启 | 当次恢复，记录到次日 |\n| M3 | V2，调整，未记录重启 | 一小时后报告恢复 |\n| M4 | V1，仅记录重启 | 当次恢复，记录到次日 |\n\n只看M1和M2，可以提出“调整可能有用”；看到M4，还需要研究重启、问题类型或运行条件。M3又提醒团队版本与中间经过不同。未记录重启不等于没重启，表格空白不能被整理成一个动作未发生的对照。\n\n这不是要宣布方法无效，而是把能够指导下一步的问题找出来。\n\n## 让不同解释产生不同观察要求\n\n若调整起主要作用，应能在相近条件下看见与其他处置的差别；若负载变化起作用，就要补运行条件；若表面症状其实包含多类问题，先需要更好的分类。\n\nAI可以帮助找缺项、对照失败和成功、提出候选解释。专业人员据此选择可行观察，资源和客户条件决定能做到哪一步。文本上的合理原因要经过外部事实约束，才会逐渐成为可用认识。\n\n## 证据不足时，仍然可以改工作\n\n企业不必等到唯一技术原因被证明，才核对版本、记录完整动作、准备正确配套、追踪复发。这些工作条件已经能解释为什么某些经验无法接任，也帮助下一轮进一步分辨原因。\n\n采用强度可以分开：候选经验用于补问，经过检验的常规方法承担更多工作，新版本与相反事实进入专业支持。对一项方法，写清什么观察会让团队改法，比一句笼统“谨慎使用”更可操作。\n\n## 只留成功，会怎样影响下一次\n\n失败单可能迟迟未关闭，停止联系的客户可能不再反馈，未采用方案的理由也可能被丢掉。经验库于是天然偏向顺利故事。系统还会改变后续所见材料，例如长期少配的门店只留下受限销量。\n\n机器学习系统研究把这种行动与数据相互影响视为重要维护问题。原始论文 企业应给反例一个正常入口，使新的事实有机会改变旧认识。\n\n一份可接续的经验，可以明确说：目前观察到恢复，几个原因尚未区分，现阶段先用它确定补问与检查，下次补哪些结果。它不如一个确定答案好展示，却让接任者知道团队已经走到哪里，并能继续向前。\n"},{"file":"09-组织记忆.md","id":"lesson-09","number":9,"role":"核心课","part":1,"title":"第9章｜人离开以后，企业留下的经验还能不能工作","md":"# 第9章｜人离开以后，企业留下的经验还能不能工作\n\n服务企业交接了一整个文件夹，接任者却不知道哪份方法仍有效、为什么适用、工具在哪里，也不知道遇到新版本该找谁。文件没有丢，能力仍然可能断。\n\n组织记忆要承担的，是让企业在人员和任务变化后继续找到、理解、使用并更新相关经验。\n\n## 同一设备为什么被反复“第一次处理”\n\n在[设备售后案例](案例C-设备售后.md)中，报修、派工与关闭都有记录，但复发可能变成一张新单。接任者看到几条相似总结，未必知道它们属于同一台设备的连续经过。\n\n当设备身份、原始材料、实际动作和后续联系对应起来，问题就改变了：这是一个新故障，还是前次问题没有解决？原方法是否适合当前版本？上次缺的配套是否已经补齐？\n\nAI可以按当前问题组织这些材料，减少新人先知道文件名的要求。但它需要读到真实关联和有效状态，不能从一批流畅总结中自动补出历史。\n\n## 记忆存在于哪些地方\n\n| 需要接住的东西 | 只交文件时容易遗漏什么 |\n|---|---|\n| 事实与原始依据 | 设备、任务、修改与结果的关联 |\n| 解释与方法 | 适用范围、竞争解释和已知反例 |\n| 工具与工作入口 | 身份、资源和实际使用方式 |\n| 专业支持与协作 | 谁能判断、谁能调动、怎样求助 |\n| 更新 | 旧方法怎样停用，新状态怎样进入当前任务 |\n\n这几项共同支持工作。组织知识研究把实践与表达联系起来，说明带教、示范和共同任务对某些经验仍然重要。[原始研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)\n\n## 用接任者的一次新任务看断点\n\n让未参与原整理、具备相应专业基础的人处理一张新版本工单。观察他能否发现条件不同，找到所需依据，取得支持，选择合适的下一步，再把结果接回。\n\n若找不到，改入口；若误以为旧结论适用，改解释与案例；若知道该做什么却无工具或协调权，改工作条件。用这种方式，企业能判断缺口在哪，而不是把全部困难归为新人能力不足。\n\n## 记忆需要有不同的载体\n\n正式规则适合清楚版本与负责者；候选经验需要背景和不同解释；现场熟练技能可能需要带教；一次性材料保留可追溯原件即可。不必把它们全部压成同一种知识卡。\n\n企业也需要选择备份什么。低频普通工作可以依赖外部专业，关键服务能力则可能需要多人接任。合理目标是把重要依赖变得可见并可安排，使专家的价值扩展到组织，而非要求组织摆脱所有专家。\n\n当原技术员休假，新的任务仍能沿正确条件推进，经验才从“有人记得”变成“企业能够继续做”。\n","html":"\u003ch1>第9章｜人离开以后，企业留下的经验还能不能工作\u003c/h1>\n\u003cp>服务企业交接了一整个文件夹，接任者却不知道哪份方法仍有效、为什么适用、工具在哪里，也不知道遇到新版本该找谁。文件没有丢，能力仍然可能断。\u003c/p>\n\u003cp>组织记忆要承担的，是让企业在人员和任务变化后继续找到、理解、使用并更新相关经验。\u003c/p>\n\u003ch2 id=\"lesson-09-section-1\">同一设备为什么被反复“第一次处理”\u003c/h2>\n\u003cp>在\u003ca href=\"#case-c\">设备售后案例\u003c/a>中，报修、派工与关闭都有记录，但复发可能变成一张新单。接任者看到几条相似总结，未必知道它们属于同一台设备的连续经过。\u003c/p>\n\u003cp>当设备身份、原始材料、实际动作和后续联系对应起来，问题就改变了：这是一个新故障，还是前次问题没有解决？原方法是否适合当前版本？上次缺的配套是否已经补齐？\u003c/p>\n\u003cp>AI可以按当前问题组织这些材料，减少新人先知道文件名的要求。但它需要读到真实关联和有效状态，不能从一批流畅总结中自动补出历史。\u003c/p>\n\u003ch2 id=\"lesson-09-section-2\">记忆存在于哪些地方\u003c/h2>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>需要接住的东西\u003c/th>\n\u003cth>只交文件时容易遗漏什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>事实与原始依据\u003c/td>\n\u003ctd>设备、任务、修改与结果的关联\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>解释与方法\u003c/td>\n\u003ctd>适用范围、竞争解释和已知反例\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工具与工作入口\u003c/td>\n\u003ctd>身份、资源和实际使用方式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>专业支持与协作\u003c/td>\n\u003ctd>谁能判断、谁能调动、怎样求助\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>更新\u003c/td>\n\u003ctd>旧方法怎样停用，新状态怎样进入当前任务\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>这几项共同支持工作。组织知识研究把实践与表达联系起来，说明带教、示范和共同任务对某些经验仍然重要。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-09-section-3\">用接任者的一次新任务看断点\u003c/h2>\n\u003cp>让未参与原整理、具备相应专业基础的人处理一张新版本工单。观察他能否发现条件不同，找到所需依据，取得支持，选择合适的下一步，再把结果接回。\u003c/p>\n\u003cp>若找不到，改入口；若误以为旧结论适用，改解释与案例；若知道该做什么却无工具或协调权，改工作条件。用这种方式，企业能判断缺口在哪，而不是把全部困难归为新人能力不足。\u003c/p>\n\u003ch2 id=\"lesson-09-section-4\">记忆需要有不同的载体\u003c/h2>\n\u003cp>正式规则适合清楚版本与负责者；候选经验需要背景和不同解释；现场熟练技能可能需要带教；一次性材料保留可追溯原件即可。不必把它们全部压成同一种知识卡。\u003c/p>\n\u003cp>企业也需要选择备份什么。低频普通工作可以依赖外部专业，关键服务能力则可能需要多人接任。合理目标是把重要依赖变得可见并可安排，使专家的价值扩展到组织，而非要求组织摆脱所有专家。\u003c/p>\n\u003cp>当原技术员休假，新的任务仍能沿正确条件推进，经验才从“有人记得”变成“企业能够继续做”。\u003c/p>\n","headings":[{"id":"lesson-09-section-1","label":"同一设备为什么被反复“第一次处理”"},{"id":"lesson-09-section-2","label":"记忆存在于哪些地方"},{"id":"lesson-09-section-3","label":"用接任者的一次新任务看断点"},{"id":"lesson-09-section-4","label":"记忆需要有不同的载体"}],"exportMd":"# 第9章｜人离开以后，企业留下的经验还能不能工作\n\n服务企业交接了一整个文件夹，接任者却不知道哪份方法仍有效、为什么适用、工具在哪里，也不知道遇到新版本该找谁。文件没有丢，能力仍然可能断。\n\n组织记忆要承担的，是让企业在人员和任务变化后继续找到、理解、使用并更新相关经验。\n\n## 同一设备为什么被反复“第一次处理”\n\n在[设备售后案例](#case-c)中，报修、派工与关闭都有记录，但复发可能变成一张新单。接任者看到几条相似总结，未必知道它们属于同一台设备的连续经过。\n\n当设备身份、原始材料、实际动作和后续联系对应起来，问题就改变了：这是一个新故障，还是前次问题没有解决？原方法是否适合当前版本？上次缺的配套是否已经补齐？\n\nAI可以按当前问题组织这些材料，减少新人先知道文件名的要求。但它需要读到真实关联和有效状态，不能从一批流畅总结中自动补出历史。\n\n## 记忆存在于哪些地方\n\n| 需要接住的东西 | 只交文件时容易遗漏什么 |\n|---|---|\n| 事实与原始依据 | 设备、任务、修改与结果的关联 |\n| 解释与方法 | 适用范围、竞争解释和已知反例 |\n| 工具与工作入口 | 身份、资源和实际使用方式 |\n| 专业支持与协作 | 谁能判断、谁能调动、怎样求助 |\n| 更新 | 旧方法怎样停用，新状态怎样进入当前任务 |\n\n这几项共同支持工作。组织知识研究把实践与表达联系起来，说明带教、示范和共同任务对某些经验仍然重要。[原始研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)\n\n## 用接任者的一次新任务看断点\n\n让未参与原整理、具备相应专业基础的人处理一张新版本工单。观察他能否发现条件不同，找到所需依据，取得支持，选择合适的下一步，再把结果接回。\n\n若找不到，改入口；若误以为旧结论适用，改解释与案例；若知道该做什么却无工具或协调权，改工作条件。用这种方式，企业能判断缺口在哪，而不是把全部困难归为新人能力不足。\n\n## 记忆需要有不同的载体\n\n正式规则适合清楚版本与负责者；候选经验需要背景和不同解释；现场熟练技能可能需要带教；一次性材料保留可追溯原件即可。不必把它们全部压成同一种知识卡。\n\n企业也需要选择备份什么。低频普通工作可以依赖外部专业，关键服务能力则可能需要多人接任。合理目标是把重要依赖变得可见并可安排，使专家的价值扩展到组织，而非要求组织摆脱所有专家。\n\n当原技术员休假，新的任务仍能沿正确条件推进，经验才从“有人记得”变成“企业能够继续做”。\n","exportSingleMd":"# 第9章｜人离开以后，企业留下的经验还能不能工作\n\n服务企业交接了一整个文件夹，接任者却不知道哪份方法仍有效、为什么适用、工具在哪里，也不知道遇到新版本该找谁。文件没有丢，能力仍然可能断。\n\n组织记忆要承担的，是让企业在人员和任务变化后继续找到、理解、使用并更新相关经验。\n\n## 同一设备为什么被反复“第一次处理”\n\n在[设备售后案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-c)中，报修、派工与关闭都有记录，但复发可能变成一张新单。接任者看到几条相似总结，未必知道它们属于同一台设备的连续经过。\n\n当设备身份、原始材料、实际动作和后续联系对应起来，问题就改变了：这是一个新故障，还是前次问题没有解决？原方法是否适合当前版本？上次缺的配套是否已经补齐？\n\nAI可以按当前问题组织这些材料，减少新人先知道文件名的要求。但它需要读到真实关联和有效状态，不能从一批流畅总结中自动补出历史。\n\n## 记忆存在于哪些地方\n\n| 需要接住的东西 | 只交文件时容易遗漏什么 |\n|---|---|\n| 事实与原始依据 | 设备、任务、修改与结果的关联 |\n| 解释与方法 | 适用范围、竞争解释和已知反例 |\n| 工具与工作入口 | 身份、资源和实际使用方式 |\n| 专业支持与协作 | 谁能判断、谁能调动、怎样求助 |\n| 更新 | 旧方法怎样停用，新状态怎样进入当前任务 |\n\n这几项共同支持工作。组织知识研究把实践与表达联系起来，说明带教、示范和共同任务对某些经验仍然重要。[原始研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)\n\n## 用接任者的一次新任务看断点\n\n让未参与原整理、具备相应专业基础的人处理一张新版本工单。观察他能否发现条件不同，找到所需依据，取得支持，选择合适的下一步，再把结果接回。\n\n若找不到，改入口；若误以为旧结论适用，改解释与案例；若知道该做什么却无工具或协调权，改工作条件。用这种方式，企业能判断缺口在哪，而不是把全部困难归为新人能力不足。\n\n## 记忆需要有不同的载体\n\n正式规则适合清楚版本与负责者；候选经验需要背景和不同解释；现场熟练技能可能需要带教；一次性材料保留可追溯原件即可。不必把它们全部压成同一种知识卡。\n\n企业也需要选择备份什么。低频普通工作可以依赖外部专业，关键服务能力则可能需要多人接任。合理目标是把重要依赖变得可见并可安排，使专家的价值扩展到组织，而非要求组织摆脱所有专家。\n\n当原技术员休假，新的任务仍能沿正确条件推进，经验才从“有人记得”变成“企业能够继续做”。\n","text":"# 第9章｜人离开以后，企业留下的经验还能不能工作\n\n服务企业交接了一整个文件夹，接任者却不知道哪份方法仍有效、为什么适用、工具在哪里，也不知道遇到新版本该找谁。文件没有丢，能力仍然可能断。\n\n组织记忆要承担的，是让企业在人员和任务变化后继续找到、理解、使用并更新相关经验。\n\n## 同一设备为什么被反复“第一次处理”\n\n在设备售后案例中，报修、派工与关闭都有记录，但复发可能变成一张新单。接任者看到几条相似总结，未必知道它们属于同一台设备的连续经过。\n\n当设备身份、原始材料、实际动作和后续联系对应起来，问题就改变了：这是一个新故障，还是前次问题没有解决？原方法是否适合当前版本？上次缺的配套是否已经补齐？\n\nAI可以按当前问题组织这些材料，减少新人先知道文件名的要求。但它需要读到真实关联和有效状态，不能从一批流畅总结中自动补出历史。\n\n## 记忆存在于哪些地方\n\n| 需要接住的东西 | 只交文件时容易遗漏什么 |\n|---|---|\n| 事实与原始依据 | 设备、任务、修改与结果的关联 |\n| 解释与方法 | 适用范围、竞争解释和已知反例 |\n| 工具与工作入口 | 身份、资源和实际使用方式 |\n| 专业支持与协作 | 谁能判断、谁能调动、怎样求助 |\n| 更新 | 旧方法怎样停用，新状态怎样进入当前任务 |\n\n这几项共同支持工作。组织知识研究把实践与表达联系起来，说明带教、示范和共同任务对某些经验仍然重要。原始研究\n\n## 用接任者的一次新任务看断点\n\n让未参与原整理、具备相应专业基础的人处理一张新版本工单。观察他能否发现条件不同，找到所需依据，取得支持，选择合适的下一步，再把结果接回。\n\n若找不到，改入口；若误以为旧结论适用，改解释与案例；若知道该做什么却无工具或协调权，改工作条件。用这种方式，企业能判断缺口在哪，而不是把全部困难归为新人能力不足。\n\n## 记忆需要有不同的载体\n\n正式规则适合清楚版本与负责者；候选经验需要背景和不同解释；现场熟练技能可能需要带教；一次性材料保留可追溯原件即可。不必把它们全部压成同一种知识卡。\n\n企业也需要选择备份什么。低频普通工作可以依赖外部专业，关键服务能力则可能需要多人接任。合理目标是把重要依赖变得可见并可安排，使专家的价值扩展到组织，而非要求组织摆脱所有专家。\n\n当原技术员休假，新的任务仍能沿正确条件推进，经验才从“有人记得”变成“企业能够继续做”。\n"},{"file":"10-标准与情境.md","id":"lesson-10","number":10,"role":"核心课","part":1,"title":"第10章｜先统一哪些东西，才能让经验复用而不压平差异","md":"# 第10章｜先统一哪些东西，才能让经验复用而不压平差异\n\nX店把“卖完时间”填成18点，Y店把“库存归零时间”填成20点，另一家店把暂时下架也叫售罄。表格整齐，不代表几条记录可以比较。\n\n而如果总部因此要求所有店永远按相同数量备货，通勤店、社区店和新店的差异又会被抹掉。标准化的问题，在于统一什么、保留什么，以及何时让规则变化。\n\n## 共同事实比共同答案更适合先行\n\n在[连锁案例](案例A-连锁备货.md)中，商品、营业日、售罄含义、正式分配与实际到店需要一致。否则建议配160与真收到160会混成同一件事，结果就可能对应错动作。\n\n这些共同含义让经验可比较，也减少交接反复解释。它们没有要求每个店长对需求作同样判断。\n\n| 宜先统一 | 需要保留的当地条件 |\n|---|---|\n| 事实、时间和状态的含义 | 客群、营业时段和事件 |\n| 原件、修改与结果的对应 | 需求线索和当前未知 |\n| 正式规则与决定范围 | 现场例外与资源取舍 |\n| 如何记录方法变化 | 新认识怎样挑战原做法 |\n\n## 一次成功为什么不宜直接写成统一配额\n\n给定正常需求时，把X/Y改为160/60，可能利用闲置生产窗口并提高贡献。但交通改变为X50、Y90时，同样的安排会生产220份、只售110份。变化的是适用条件，不是表格格式。\n\n值得统一的方法是怎样识别供给封顶、取得现场事件、核对产能与配送、比较候选并接回结果。具体数量则由当期事实决定。\n\nAI可以在相关案例中带回条件和差别，让未完全规则化的经验先被共同理解；经过多次采用，再形成较稳定方法。[知识研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)、[上下文工程](https://www.anthropic.com/research/effective-context-engineering-for-ai-agents)\n\n## 例外怎样变成学习，而不是各行其是\n\n现场偏离原安排时，保留当时知道什么、采取什么动作和后续结果。交通在决定前已知却被忽略，与决定后才突变，需要不同评价。把这个差别留下，员工才更愿意报告真实条件。\n\n成熟且必须遵守的质量、财务和安全规则，继续按正式要求执行；尚在探索的方法，则允许在清楚范围内检验和修订。稳定工作不必每次重新推理，变化工作也不必假装已经有完整SOP。\n\n这使企业可以从一条业务逐步进入数字化和标准化：先共同理解事实，让经验有入口，再把经过检验的部分稳定下来。秩序在真实使用中形成，标准也因能容纳有依据的变化而更可靠。\n","html":"\u003ch1>第10章｜先统一哪些东西，才能让经验复用而不压平差异\u003c/h1>\n\u003cp>X店把“卖完时间”填成18点，Y店把“库存归零时间”填成20点，另一家店把暂时下架也叫售罄。表格整齐，不代表几条记录可以比较。\u003c/p>\n\u003cp>而如果总部因此要求所有店永远按相同数量备货，通勤店、社区店和新店的差异又会被抹掉。标准化的问题，在于统一什么、保留什么，以及何时让规则变化。\u003c/p>\n\u003ch2 id=\"lesson-10-section-1\">共同事实比共同答案更适合先行\u003c/h2>\n\u003cp>在\u003ca href=\"#case-a\">连锁案例\u003c/a>中，商品、营业日、售罄含义、正式分配与实际到店需要一致。否则建议配160与真收到160会混成同一件事，结果就可能对应错动作。\u003c/p>\n\u003cp>这些共同含义让经验可比较，也减少交接反复解释。它们没有要求每个店长对需求作同样判断。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>宜先统一\u003c/th>\n\u003cth>需要保留的当地条件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>事实、时间和状态的含义\u003c/td>\n\u003ctd>客群、营业时段和事件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>原件、修改与结果的对应\u003c/td>\n\u003ctd>需求线索和当前未知\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>正式规则与决定范围\u003c/td>\n\u003ctd>现场例外与资源取舍\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>如何记录方法变化\u003c/td>\n\u003ctd>新认识怎样挑战原做法\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"lesson-10-section-2\">一次成功为什么不宜直接写成统一配额\u003c/h2>\n\u003cp>给定正常需求时，把X/Y改为160/60，可能利用闲置生产窗口并提高贡献。但交通改变为X50、Y90时，同样的安排会生产220份、只售110份。变化的是适用条件，不是表格格式。\u003c/p>\n\u003cp>值得统一的方法是怎样识别供给封顶、取得现场事件、核对产能与配送、比较候选并接回结果。具体数量则由当期事实决定。\u003c/p>\n\u003cp>AI可以在相关案例中带回条件和差别，让未完全规则化的经验先被共同理解；经过多次采用，再形成较稳定方法。\u003ca href=\"https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">知识研究\u003c/a>、\u003ca href=\"https://www.anthropic.com/research/effective-context-engineering-for-ai-agents\" target=\"_blank\" rel=\"noopener noreferrer\">上下文工程\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-10-section-3\">例外怎样变成学习，而不是各行其是\u003c/h2>\n\u003cp>现场偏离原安排时，保留当时知道什么、采取什么动作和后续结果。交通在决定前已知却被忽略，与决定后才突变，需要不同评价。把这个差别留下，员工才更愿意报告真实条件。\u003c/p>\n\u003cp>成熟且必须遵守的质量、财务和安全规则，继续按正式要求执行；尚在探索的方法，则允许在清楚范围内检验和修订。稳定工作不必每次重新推理，变化工作也不必假装已经有完整SOP。\u003c/p>\n\u003cp>这使企业可以从一条业务逐步进入数字化和标准化：先共同理解事实，让经验有入口，再把经过检验的部分稳定下来。秩序在真实使用中形成，标准也因能容纳有依据的变化而更可靠。\u003c/p>\n","headings":[{"id":"lesson-10-section-1","label":"共同事实比共同答案更适合先行"},{"id":"lesson-10-section-2","label":"一次成功为什么不宜直接写成统一配额"},{"id":"lesson-10-section-3","label":"例外怎样变成学习，而不是各行其是"}],"exportMd":"# 第10章｜先统一哪些东西，才能让经验复用而不压平差异\n\nX店把“卖完时间”填成18点，Y店把“库存归零时间”填成20点，另一家店把暂时下架也叫售罄。表格整齐，不代表几条记录可以比较。\n\n而如果总部因此要求所有店永远按相同数量备货，通勤店、社区店和新店的差异又会被抹掉。标准化的问题，在于统一什么、保留什么，以及何时让规则变化。\n\n## 共同事实比共同答案更适合先行\n\n在[连锁案例](#case-a)中，商品、营业日、售罄含义、正式分配与实际到店需要一致。否则建议配160与真收到160会混成同一件事，结果就可能对应错动作。\n\n这些共同含义让经验可比较，也减少交接反复解释。它们没有要求每个店长对需求作同样判断。\n\n| 宜先统一 | 需要保留的当地条件 |\n|---|---|\n| 事实、时间和状态的含义 | 客群、营业时段和事件 |\n| 原件、修改与结果的对应 | 需求线索和当前未知 |\n| 正式规则与决定范围 | 现场例外与资源取舍 |\n| 如何记录方法变化 | 新认识怎样挑战原做法 |\n\n## 一次成功为什么不宜直接写成统一配额\n\n给定正常需求时，把X/Y改为160/60，可能利用闲置生产窗口并提高贡献。但交通改变为X50、Y90时，同样的安排会生产220份、只售110份。变化的是适用条件，不是表格格式。\n\n值得统一的方法是怎样识别供给封顶、取得现场事件、核对产能与配送、比较候选并接回结果。具体数量则由当期事实决定。\n\nAI可以在相关案例中带回条件和差别，让未完全规则化的经验先被共同理解；经过多次采用，再形成较稳定方法。[知识研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)、[上下文工程](https://www.anthropic.com/research/effective-context-engineering-for-ai-agents)\n\n## 例外怎样变成学习，而不是各行其是\n\n现场偏离原安排时，保留当时知道什么、采取什么动作和后续结果。交通在决定前已知却被忽略，与决定后才突变，需要不同评价。把这个差别留下，员工才更愿意报告真实条件。\n\n成熟且必须遵守的质量、财务和安全规则，继续按正式要求执行；尚在探索的方法，则允许在清楚范围内检验和修订。稳定工作不必每次重新推理，变化工作也不必假装已经有完整SOP。\n\n这使企业可以从一条业务逐步进入数字化和标准化：先共同理解事实，让经验有入口，再把经过检验的部分稳定下来。秩序在真实使用中形成，标准也因能容纳有依据的变化而更可靠。\n","exportSingleMd":"# 第10章｜先统一哪些东西，才能让经验复用而不压平差异\n\nX店把“卖完时间”填成18点，Y店把“库存归零时间”填成20点，另一家店把暂时下架也叫售罄。表格整齐，不代表几条记录可以比较。\n\n而如果总部因此要求所有店永远按相同数量备货，通勤店、社区店和新店的差异又会被抹掉。标准化的问题，在于统一什么、保留什么，以及何时让规则变化。\n\n## 共同事实比共同答案更适合先行\n\n在[连锁案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-a)中，商品、营业日、售罄含义、正式分配与实际到店需要一致。否则建议配160与真收到160会混成同一件事，结果就可能对应错动作。\n\n这些共同含义让经验可比较，也减少交接反复解释。它们没有要求每个店长对需求作同样判断。\n\n| 宜先统一 | 需要保留的当地条件 |\n|---|---|\n| 事实、时间和状态的含义 | 客群、营业时段和事件 |\n| 原件、修改与结果的对应 | 需求线索和当前未知 |\n| 正式规则与决定范围 | 现场例外与资源取舍 |\n| 如何记录方法变化 | 新认识怎样挑战原做法 |\n\n## 一次成功为什么不宜直接写成统一配额\n\n给定正常需求时，把X/Y改为160/60，可能利用闲置生产窗口并提高贡献。但交通改变为X50、Y90时，同样的安排会生产220份、只售110份。变化的是适用条件，不是表格格式。\n\n值得统一的方法是怎样识别供给封顶、取得现场事件、核对产能与配送、比较候选并接回结果。具体数量则由当期事实决定。\n\nAI可以在相关案例中带回条件和差别，让未完全规则化的经验先被共同理解；经过多次采用，再形成较稳定方法。[知识研究](https://josephmahoney.web.illinois.edu/BA504_Fall%202008/Uploaded%20in%20Nov%202007/Nonaka%20%281994%29.pdf)、[上下文工程](https://www.anthropic.com/research/effective-context-engineering-for-ai-agents)\n\n## 例外怎样变成学习，而不是各行其是\n\n现场偏离原安排时，保留当时知道什么、采取什么动作和后续结果。交通在决定前已知却被忽略，与决定后才突变，需要不同评价。把这个差别留下，员工才更愿意报告真实条件。\n\n成熟且必须遵守的质量、财务和安全规则，继续按正式要求执行；尚在探索的方法，则允许在清楚范围内检验和修订。稳定工作不必每次重新推理，变化工作也不必假装已经有完整SOP。\n\n这使企业可以从一条业务逐步进入数字化和标准化：先共同理解事实，让经验有入口，再把经过检验的部分稳定下来。秩序在真实使用中形成，标准也因能容纳有依据的变化而更可靠。\n","text":"# 第10章｜先统一哪些东西，才能让经验复用而不压平差异\n\nX店把“卖完时间”填成18点，Y店把“库存归零时间”填成20点，另一家店把暂时下架也叫售罄。表格整齐，不代表几条记录可以比较。\n\n而如果总部因此要求所有店永远按相同数量备货，通勤店、社区店和新店的差异又会被抹掉。标准化的问题，在于统一什么、保留什么，以及何时让规则变化。\n\n## 共同事实比共同答案更适合先行\n\n在连锁案例中，商品、营业日、售罄含义、正式分配与实际到店需要一致。否则建议配160与真收到160会混成同一件事，结果就可能对应错动作。\n\n这些共同含义让经验可比较，也减少交接反复解释。它们没有要求每个店长对需求作同样判断。\n\n| 宜先统一 | 需要保留的当地条件 |\n|---|---|\n| 事实、时间和状态的含义 | 客群、营业时段和事件 |\n| 原件、修改与结果的对应 | 需求线索和当前未知 |\n| 正式规则与决定范围 | 现场例外与资源取舍 |\n| 如何记录方法变化 | 新认识怎样挑战原做法 |\n\n## 一次成功为什么不宜直接写成统一配额\n\n给定正常需求时，把X/Y改为160/60，可能利用闲置生产窗口并提高贡献。但交通改变为X50、Y90时，同样的安排会生产220份、只售110份。变化的是适用条件，不是表格格式。\n\n值得统一的方法是怎样识别供给封顶、取得现场事件、核对产能与配送、比较候选并接回结果。具体数量则由当期事实决定。\n\nAI可以在相关案例中带回条件和差别，让未完全规则化的经验先被共同理解；经过多次采用，再形成较稳定方法。知识研究、上下文工程\n\n## 例外怎样变成学习，而不是各行其是\n\n现场偏离原安排时，保留当时知道什么、采取什么动作和后续结果。交通在决定前已知却被忽略，与决定后才突变，需要不同评价。把这个差别留下，员工才更愿意报告真实条件。\n\n成熟且必须遵守的质量、财务和安全规则，继续按正式要求执行；尚在探索的方法，则允许在清楚范围内检验和修订。稳定工作不必每次重新推理，变化工作也不必假装已经有完整SOP。\n\n这使企业可以从一条业务逐步进入数字化和标准化：先共同理解事实，让经验有入口，再把经过检验的部分稳定下来。秩序在真实使用中形成，标准也因能容纳有依据的变化而更可靠。\n"},{"file":"11-客户认可的价值.md","id":"lesson-11","number":11,"role":"核心课","part":2,"title":"第11章｜企业的独特做法，什么时候值得用AI放大","md":"# 第11章｜企业的独特做法，什么时候值得用AI放大\n\n工业品经销商说自己的强项是“工程师经验丰富”，内容团队说“我们能定制”，设备服务企业说“老师傅反应快”。这些描述还没有告诉我们客户为什么选择他们。\n\n同样是报价，客户可能在意低价，也可能更需要三天内拿到能用的替代；同样是维修，客户可能接受一次响应，却无法接受反复停机。找到真正影响选择的差别，才能判断AI该放大什么。\n\n## 从客户处境理解内部优势\n\n[报价案例](案例B-智能资源成本.md)里，企业有价值的能力不是发出更多文档，而是在材料不全时识别关键条件、提出可履约路线，并让客户及时作出采购决定。AI若能帮助更多销售取得这套认识，才有机会扩大原来的能力。\n\n[连锁案例](案例A-连锁备货.md)里的“小批量、新鲜、懂客流”，也应落到顾客是否在需要时买得到。X店售罄可以是畅销证据，同时可能是未满足需求；顾客以后是否再来，则要继续观察。\n\n| 内部表述 | 客户可能认可的结果 | 需要区分的其他原因 |\n|---|---|---|\n| 工程经验丰富 | 更早取得能用且能交付的替代 | 价格、渠道或任务本来容易 |\n| 服务反应快 | 少等待、少重复停机 | 只回得快，现场并未解决 |\n| 内容定制多 | 规格准确、回应采购者问题 | 文件更多，客户仍无法采用 |\n| 熟悉本地客流 | 更可靠买到合适商品 | 位置、促销或商品自身受欢迎 |\n\n这些问题帮助把企业自述变成可追查解释。客户访谈、实际选择与未成交理由，可以与业务经过相互核对。\n\n## 基础能力与差异化能力，投入理由不同\n\n报价事实准确、派工状态清楚，是可靠经营的基础，即使客户不会单独为它付费，也值得建设。特定客户特别需要的替代判断、响应与履约组合，才可能形成选择理由。\n\n因此，企业可以先补影响可靠性的基础，再集中发展有客户依据的差异。没有必要把每个内部流程都定制成独有软件，也无需要求每项基础改进都证明市场壁垒。\n\nTeece关于动态能力和商业模式的研究，将资源的相关性、客户价值与交付安排联系起来。[动态能力](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)、[商业模式](https://www.sciencedirect.com/science/article/pii/S002463010900051X) 它提供的判断是：独特只有进入客户需要和可持续交付，才具有经营意义。\n\n## 还要看优势能否扩展\n\n一位专家每天救火，可以产生好结果，却不一定支撑更多客户。AI若只让更多任务涌向他，反而可能降低响应。应追查其中哪些判断可以传播，哪些依赖现场与稀缺资源，怎样让常规准备少占专家时间。\n\n对经销商，一项有用的改造主张可以写成：“让更多销售在承诺前看清客户条件与可履约路线，减少补问并保住单均贡献。”它明确了对象、价值和取舍，比“建设智能报价平台”更能指导现场工作。\n","html":"\u003ch1>第11章｜企业的独特做法，什么时候值得用AI放大\u003c/h1>\n\u003cp>工业品经销商说自己的强项是“工程师经验丰富”，内容团队说“我们能定制”，设备服务企业说“老师傅反应快”。这些描述还没有告诉我们客户为什么选择他们。\u003c/p>\n\u003cp>同样是报价，客户可能在意低价，也可能更需要三天内拿到能用的替代；同样是维修，客户可能接受一次响应，却无法接受反复停机。找到真正影响选择的差别，才能判断AI该放大什么。\u003c/p>\n\u003ch2 id=\"lesson-11-section-1\">从客户处境理解内部优势\u003c/h2>\n\u003cp>\u003ca href=\"#case-b\">报价案例\u003c/a>里，企业有价值的能力不是发出更多文档，而是在材料不全时识别关键条件、提出可履约路线，并让客户及时作出采购决定。AI若能帮助更多销售取得这套认识，才有机会扩大原来的能力。\u003c/p>\n\u003cp>\u003ca href=\"#case-a\">连锁案例\u003c/a>里的“小批量、新鲜、懂客流”，也应落到顾客是否在需要时买得到。X店售罄可以是畅销证据，同时可能是未满足需求；顾客以后是否再来，则要继续观察。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>内部表述\u003c/th>\n\u003cth>客户可能认可的结果\u003c/th>\n\u003cth>需要区分的其他原因\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>工程经验丰富\u003c/td>\n\u003ctd>更早取得能用且能交付的替代\u003c/td>\n\u003ctd>价格、渠道或任务本来容易\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>服务反应快\u003c/td>\n\u003ctd>少等待、少重复停机\u003c/td>\n\u003ctd>只回得快，现场并未解决\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>内容定制多\u003c/td>\n\u003ctd>规格准确、回应采购者问题\u003c/td>\n\u003ctd>文件更多，客户仍无法采用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>熟悉本地客流\u003c/td>\n\u003ctd>更可靠买到合适商品\u003c/td>\n\u003ctd>位置、促销或商品自身受欢迎\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>这些问题帮助把企业自述变成可追查解释。客户访谈、实际选择与未成交理由，可以与业务经过相互核对。\u003c/p>\n\u003ch2 id=\"lesson-11-section-2\">基础能力与差异化能力，投入理由不同\u003c/h2>\n\u003cp>报价事实准确、派工状态清楚，是可靠经营的基础，即使客户不会单独为它付费，也值得建设。特定客户特别需要的替代判断、响应与履约组合，才可能形成选择理由。\u003c/p>\n\u003cp>因此，企业可以先补影响可靠性的基础，再集中发展有客户依据的差异。没有必要把每个内部流程都定制成独有软件，也无需要求每项基础改进都证明市场壁垒。\u003c/p>\n\u003cp>Teece关于动态能力和商业模式的研究，将资源的相关性、客户价值与交付安排联系起来。\u003ca href=\"https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">动态能力\u003c/a>、\u003ca href=\"https://www.sciencedirect.com/science/article/pii/S002463010900051X\" target=\"_blank\" rel=\"noopener noreferrer\">商业模式\u003c/a> 它提供的判断是：独特只有进入客户需要和可持续交付，才具有经营意义。\u003c/p>\n\u003ch2 id=\"lesson-11-section-3\">还要看优势能否扩展\u003c/h2>\n\u003cp>一位专家每天救火，可以产生好结果，却不一定支撑更多客户。AI若只让更多任务涌向他，反而可能降低响应。应追查其中哪些判断可以传播，哪些依赖现场与稀缺资源，怎样让常规准备少占专家时间。\u003c/p>\n\u003cp>对经销商，一项有用的改造主张可以写成：“让更多销售在承诺前看清客户条件与可履约路线，减少补问并保住单均贡献。”它明确了对象、价值和取舍，比“建设智能报价平台”更能指导现场工作。\u003c/p>\n","headings":[{"id":"lesson-11-section-1","label":"从客户处境理解内部优势"},{"id":"lesson-11-section-2","label":"基础能力与差异化能力，投入理由不同"},{"id":"lesson-11-section-3","label":"还要看优势能否扩展"}],"exportMd":"# 第11章｜企业的独特做法，什么时候值得用AI放大\n\n工业品经销商说自己的强项是“工程师经验丰富”，内容团队说“我们能定制”，设备服务企业说“老师傅反应快”。这些描述还没有告诉我们客户为什么选择他们。\n\n同样是报价，客户可能在意低价，也可能更需要三天内拿到能用的替代；同样是维修，客户可能接受一次响应，却无法接受反复停机。找到真正影响选择的差别，才能判断AI该放大什么。\n\n## 从客户处境理解内部优势\n\n[报价案例](#case-b)里，企业有价值的能力不是发出更多文档，而是在材料不全时识别关键条件、提出可履约路线，并让客户及时作出采购决定。AI若能帮助更多销售取得这套认识，才有机会扩大原来的能力。\n\n[连锁案例](#case-a)里的“小批量、新鲜、懂客流”，也应落到顾客是否在需要时买得到。X店售罄可以是畅销证据，同时可能是未满足需求；顾客以后是否再来，则要继续观察。\n\n| 内部表述 | 客户可能认可的结果 | 需要区分的其他原因 |\n|---|---|---|\n| 工程经验丰富 | 更早取得能用且能交付的替代 | 价格、渠道或任务本来容易 |\n| 服务反应快 | 少等待、少重复停机 | 只回得快，现场并未解决 |\n| 内容定制多 | 规格准确、回应采购者问题 | 文件更多，客户仍无法采用 |\n| 熟悉本地客流 | 更可靠买到合适商品 | 位置、促销或商品自身受欢迎 |\n\n这些问题帮助把企业自述变成可追查解释。客户访谈、实际选择与未成交理由，可以与业务经过相互核对。\n\n## 基础能力与差异化能力，投入理由不同\n\n报价事实准确、派工状态清楚，是可靠经营的基础，即使客户不会单独为它付费，也值得建设。特定客户特别需要的替代判断、响应与履约组合，才可能形成选择理由。\n\n因此，企业可以先补影响可靠性的基础，再集中发展有客户依据的差异。没有必要把每个内部流程都定制成独有软件，也无需要求每项基础改进都证明市场壁垒。\n\nTeece关于动态能力和商业模式的研究，将资源的相关性、客户价值与交付安排联系起来。[动态能力](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)、[商业模式](https://www.sciencedirect.com/science/article/pii/S002463010900051X) 它提供的判断是：独特只有进入客户需要和可持续交付，才具有经营意义。\n\n## 还要看优势能否扩展\n\n一位专家每天救火，可以产生好结果，却不一定支撑更多客户。AI若只让更多任务涌向他，反而可能降低响应。应追查其中哪些判断可以传播，哪些依赖现场与稀缺资源，怎样让常规准备少占专家时间。\n\n对经销商，一项有用的改造主张可以写成：“让更多销售在承诺前看清客户条件与可履约路线，减少补问并保住单均贡献。”它明确了对象、价值和取舍，比“建设智能报价平台”更能指导现场工作。\n","exportSingleMd":"# 第11章｜企业的独特做法，什么时候值得用AI放大\n\n工业品经销商说自己的强项是“工程师经验丰富”，内容团队说“我们能定制”，设备服务企业说“老师傅反应快”。这些描述还没有告诉我们客户为什么选择他们。\n\n同样是报价，客户可能在意低价，也可能更需要三天内拿到能用的替代；同样是维修，客户可能接受一次响应，却无法接受反复停机。找到真正影响选择的差别，才能判断AI该放大什么。\n\n## 从客户处境理解内部优势\n\n[报价案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-b)里，企业有价值的能力不是发出更多文档，而是在材料不全时识别关键条件、提出可履约路线，并让客户及时作出采购决定。AI若能帮助更多销售取得这套认识，才有机会扩大原来的能力。\n\n[连锁案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-a)里的“小批量、新鲜、懂客流”，也应落到顾客是否在需要时买得到。X店售罄可以是畅销证据，同时可能是未满足需求；顾客以后是否再来，则要继续观察。\n\n| 内部表述 | 客户可能认可的结果 | 需要区分的其他原因 |\n|---|---|---|\n| 工程经验丰富 | 更早取得能用且能交付的替代 | 价格、渠道或任务本来容易 |\n| 服务反应快 | 少等待、少重复停机 | 只回得快，现场并未解决 |\n| 内容定制多 | 规格准确、回应采购者问题 | 文件更多，客户仍无法采用 |\n| 熟悉本地客流 | 更可靠买到合适商品 | 位置、促销或商品自身受欢迎 |\n\n这些问题帮助把企业自述变成可追查解释。客户访谈、实际选择与未成交理由，可以与业务经过相互核对。\n\n## 基础能力与差异化能力，投入理由不同\n\n报价事实准确、派工状态清楚，是可靠经营的基础，即使客户不会单独为它付费，也值得建设。特定客户特别需要的替代判断、响应与履约组合，才可能形成选择理由。\n\n因此，企业可以先补影响可靠性的基础，再集中发展有客户依据的差异。没有必要把每个内部流程都定制成独有软件，也无需要求每项基础改进都证明市场壁垒。\n\nTeece关于动态能力和商业模式的研究，将资源的相关性、客户价值与交付安排联系起来。[动态能力](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf)、[商业模式](https://www.sciencedirect.com/science/article/pii/S002463010900051X) 它提供的判断是：独特只有进入客户需要和可持续交付，才具有经营意义。\n\n## 还要看优势能否扩展\n\n一位专家每天救火，可以产生好结果，却不一定支撑更多客户。AI若只让更多任务涌向他，反而可能降低响应。应追查其中哪些判断可以传播，哪些依赖现场与稀缺资源，怎样让常规准备少占专家时间。\n\n对经销商，一项有用的改造主张可以写成：“让更多销售在承诺前看清客户条件与可履约路线，减少补问并保住单均贡献。”它明确了对象、价值和取舍，比“建设智能报价平台”更能指导现场工作。\n","text":"# 第11章｜企业的独特做法，什么时候值得用AI放大\n\n工业品经销商说自己的强项是“工程师经验丰富”，内容团队说“我们能定制”，设备服务企业说“老师傅反应快”。这些描述还没有告诉我们客户为什么选择他们。\n\n同样是报价，客户可能在意低价，也可能更需要三天内拿到能用的替代；同样是维修，客户可能接受一次响应，却无法接受反复停机。找到真正影响选择的差别，才能判断AI该放大什么。\n\n## 从客户处境理解内部优势\n\n报价案例里，企业有价值的能力不是发出更多文档，而是在材料不全时识别关键条件、提出可履约路线，并让客户及时作出采购决定。AI若能帮助更多销售取得这套认识，才有机会扩大原来的能力。\n\n连锁案例里的“小批量、新鲜、懂客流”，也应落到顾客是否在需要时买得到。X店售罄可以是畅销证据，同时可能是未满足需求；顾客以后是否再来，则要继续观察。\n\n| 内部表述 | 客户可能认可的结果 | 需要区分的其他原因 |\n|---|---|---|\n| 工程经验丰富 | 更早取得能用且能交付的替代 | 价格、渠道或任务本来容易 |\n| 服务反应快 | 少等待、少重复停机 | 只回得快，现场并未解决 |\n| 内容定制多 | 规格准确、回应采购者问题 | 文件更多，客户仍无法采用 |\n| 熟悉本地客流 | 更可靠买到合适商品 | 位置、促销或商品自身受欢迎 |\n\n这些问题帮助把企业自述变成可追查解释。客户访谈、实际选择与未成交理由，可以与业务经过相互核对。\n\n## 基础能力与差异化能力，投入理由不同\n\n报价事实准确、派工状态清楚，是可靠经营的基础，即使客户不会单独为它付费，也值得建设。特定客户特别需要的替代判断、响应与履约组合，才可能形成选择理由。\n\n因此，企业可以先补影响可靠性的基础，再集中发展有客户依据的差异。没有必要把每个内部流程都定制成独有软件，也无需要求每项基础改进都证明市场壁垒。\n\nTeece关于动态能力和商业模式的研究，将资源的相关性、客户价值与交付安排联系起来。动态能力、商业模式 它提供的判断是：独特只有进入客户需要和可持续交付，才具有经营意义。\n\n## 还要看优势能否扩展\n\n一位专家每天救火，可以产生好结果，却不一定支撑更多客户。AI若只让更多任务涌向他，反而可能降低响应。应追查其中哪些判断可以传播，哪些依赖现场与稀缺资源，怎样让常规准备少占专家时间。\n\n对经销商，一项有用的改造主张可以写成：“让更多销售在承诺前看清客户条件与可履约路线，减少补问并保住单均贡献。”它明确了对象、价值和取舍，比“建设智能报价平台”更能指导现场工作。\n"},{"file":"12-优势的生成机制.md","id":"lesson-12","number":12,"role":"核心课","part":2,"title":"第12章｜从一个好结果，追到真正产生优势的地方","md":"# 第12章｜从一个好结果，追到真正产生优势的地方\n\nX店卖完了，总部可能认为店长判断好；服务单当天关闭，负责人可能认为响应快。同一个数字，却可能来自完全不同的路径。做AI改造前，要追到差别怎样发生。\n\n## 现场机制会改变工程问题本身\n\nZara的真实分配研究发现，关键尺码缺货会使整款撤下展示，影响的不只是缺货尺码。研究把尺码组合、需求和门店规则纳入分配。2006年试点以10款商品作匹配比较，作者估计销售改善约3%—4%。这是运筹与数字化项目，不是生成式AI实验。[原始论文](https://web.mit.edu/people/jgallien/ZaraOR2010.pdf)\n\n这一材料说明为什么先问“库存怎么优化”还不够：若商品能否被顾客看见由尺码组合决定，只按剩余件数分配，就漏掉了重要关系。模型更精细，也无法自动补回被错误定义的问题。\n\n## 回到连锁，追查增长被哪里挡住\n\n本课[烘焙案例](案例A-连锁备货.md)里，X店售罄、工坊窗口未充分使用、门店停止推介，是需要共同解释的观察。可能的机制是供给上限限制销量和需求获取，受限销量又影响下一轮排产。\n\n也可能另有约束：商品无法保鲜到晚间，补货成本太高，或者顾客询问并不转化为购买。若这些情况成立，扩大生产就不是同样的好选择。\n\n| 竞争解释 | 需要看什么 | 会影响哪种改法 |\n|---|---|---|\n| 供给压住有效需求 | 售罄后行为、预订、追加供给后的销售 | 排产与补货 |\n| 产品或时段不合适 | 顾客选择、品质和退换反馈 | 商品、价格或服务方式 |\n| 配送与接待受限 | 实际路线、到店、等待与人员 | 履约和工作安排 |\n| 只看销量造成重复低估 | 当时预测、供给上限和后续结果 | 数据与更新方法 |\n\nAI可以帮助跨材料发现这些关系、提出不同预测；FDE要取得关键事实，把可试的安排实现。哪种解释站得住，决定技术应该改在哪里。\n\n## 诊断应当产生一个可改变的认识\n\n“员工效率低”“信息不通”把太多原因装在一起。更有用的是：“客户三天期限未进入采购比较，合规候选十天才能到，反复补问因此发生。”这说明要保留什么条件、在哪个决定前检查，而不是直接购买一个更强模型。\n\n设备服务也一样。复访可能来自缺件、适用判断错误或必要多次服务；只有可避免的部分，才是减少返工的机会。把所有复访都当失败，会让经济估计和人员评价一起失真。\n\n一项好的现场诊断使团队知道当前最有依据的解释、其他可能、下一项区分观察和相应动作。它可以不完整，但必须足以让某种工程选择比另一种更有理由。\n","html":"\u003ch1>第12章｜从一个好结果，追到真正产生优势的地方\u003c/h1>\n\u003cp>X店卖完了，总部可能认为店长判断好；服务单当天关闭，负责人可能认为响应快。同一个数字，却可能来自完全不同的路径。做AI改造前，要追到差别怎样发生。\u003c/p>\n\u003ch2 id=\"lesson-12-section-1\">现场机制会改变工程问题本身\u003c/h2>\n\u003cp>Zara的真实分配研究发现，关键尺码缺货会使整款撤下展示，影响的不只是缺货尺码。研究把尺码组合、需求和门店规则纳入分配。2006年试点以10款商品作匹配比较，作者估计销售改善约3%—4%。这是运筹与数字化项目，不是生成式AI实验。\u003ca href=\"https://web.mit.edu/people/jgallien/ZaraOR2010.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始论文\u003c/a>\u003c/p>\n\u003cp>这一材料说明为什么先问“库存怎么优化”还不够：若商品能否被顾客看见由尺码组合决定，只按剩余件数分配，就漏掉了重要关系。模型更精细，也无法自动补回被错误定义的问题。\u003c/p>\n\u003ch2 id=\"lesson-12-section-2\">回到连锁，追查增长被哪里挡住\u003c/h2>\n\u003cp>本课\u003ca href=\"#case-a\">烘焙案例\u003c/a>里，X店售罄、工坊窗口未充分使用、门店停止推介，是需要共同解释的观察。可能的机制是供给上限限制销量和需求获取，受限销量又影响下一轮排产。\u003c/p>\n\u003cp>也可能另有约束：商品无法保鲜到晚间，补货成本太高，或者顾客询问并不转化为购买。若这些情况成立，扩大生产就不是同样的好选择。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>竞争解释\u003c/th>\n\u003cth>需要看什么\u003c/th>\n\u003cth>会影响哪种改法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>供给压住有效需求\u003c/td>\n\u003ctd>售罄后行为、预订、追加供给后的销售\u003c/td>\n\u003ctd>排产与补货\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>产品或时段不合适\u003c/td>\n\u003ctd>顾客选择、品质和退换反馈\u003c/td>\n\u003ctd>商品、价格或服务方式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>配送与接待受限\u003c/td>\n\u003ctd>实际路线、到店、等待与人员\u003c/td>\n\u003ctd>履约和工作安排\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>只看销量造成重复低估\u003c/td>\n\u003ctd>当时预测、供给上限和后续结果\u003c/td>\n\u003ctd>数据与更新方法\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>AI可以帮助跨材料发现这些关系、提出不同预测；FDE要取得关键事实，把可试的安排实现。哪种解释站得住，决定技术应该改在哪里。\u003c/p>\n\u003ch2 id=\"lesson-12-section-3\">诊断应当产生一个可改变的认识\u003c/h2>\n\u003cp>“员工效率低”“信息不通”把太多原因装在一起。更有用的是：“客户三天期限未进入采购比较，合规候选十天才能到，反复补问因此发生。”这说明要保留什么条件、在哪个决定前检查，而不是直接购买一个更强模型。\u003c/p>\n\u003cp>设备服务也一样。复访可能来自缺件、适用判断错误或必要多次服务；只有可避免的部分，才是减少返工的机会。把所有复访都当失败，会让经济估计和人员评价一起失真。\u003c/p>\n\u003cp>一项好的现场诊断使团队知道当前最有依据的解释、其他可能、下一项区分观察和相应动作。它可以不完整，但必须足以让某种工程选择比另一种更有理由。\u003c/p>\n","headings":[{"id":"lesson-12-section-1","label":"现场机制会改变工程问题本身"},{"id":"lesson-12-section-2","label":"回到连锁，追查增长被哪里挡住"},{"id":"lesson-12-section-3","label":"诊断应当产生一个可改变的认识"}],"exportMd":"# 第12章｜从一个好结果，追到真正产生优势的地方\n\nX店卖完了，总部可能认为店长判断好；服务单当天关闭，负责人可能认为响应快。同一个数字，却可能来自完全不同的路径。做AI改造前，要追到差别怎样发生。\n\n## 现场机制会改变工程问题本身\n\nZara的真实分配研究发现，关键尺码缺货会使整款撤下展示，影响的不只是缺货尺码。研究把尺码组合、需求和门店规则纳入分配。2006年试点以10款商品作匹配比较，作者估计销售改善约3%—4%。这是运筹与数字化项目，不是生成式AI实验。[原始论文](https://web.mit.edu/people/jgallien/ZaraOR2010.pdf)\n\n这一材料说明为什么先问“库存怎么优化”还不够：若商品能否被顾客看见由尺码组合决定，只按剩余件数分配，就漏掉了重要关系。模型更精细，也无法自动补回被错误定义的问题。\n\n## 回到连锁，追查增长被哪里挡住\n\n本课[烘焙案例](#case-a)里，X店售罄、工坊窗口未充分使用、门店停止推介，是需要共同解释的观察。可能的机制是供给上限限制销量和需求获取，受限销量又影响下一轮排产。\n\n也可能另有约束：商品无法保鲜到晚间，补货成本太高，或者顾客询问并不转化为购买。若这些情况成立，扩大生产就不是同样的好选择。\n\n| 竞争解释 | 需要看什么 | 会影响哪种改法 |\n|---|---|---|\n| 供给压住有效需求 | 售罄后行为、预订、追加供给后的销售 | 排产与补货 |\n| 产品或时段不合适 | 顾客选择、品质和退换反馈 | 商品、价格或服务方式 |\n| 配送与接待受限 | 实际路线、到店、等待与人员 | 履约和工作安排 |\n| 只看销量造成重复低估 | 当时预测、供给上限和后续结果 | 数据与更新方法 |\n\nAI可以帮助跨材料发现这些关系、提出不同预测；FDE要取得关键事实，把可试的安排实现。哪种解释站得住，决定技术应该改在哪里。\n\n## 诊断应当产生一个可改变的认识\n\n“员工效率低”“信息不通”把太多原因装在一起。更有用的是：“客户三天期限未进入采购比较，合规候选十天才能到，反复补问因此发生。”这说明要保留什么条件、在哪个决定前检查，而不是直接购买一个更强模型。\n\n设备服务也一样。复访可能来自缺件、适用判断错误或必要多次服务；只有可避免的部分，才是减少返工的机会。把所有复访都当失败，会让经济估计和人员评价一起失真。\n\n一项好的现场诊断使团队知道当前最有依据的解释、其他可能、下一项区分观察和相应动作。它可以不完整，但必须足以让某种工程选择比另一种更有理由。\n","exportSingleMd":"# 第12章｜从一个好结果，追到真正产生优势的地方\n\nX店卖完了，总部可能认为店长判断好；服务单当天关闭，负责人可能认为响应快。同一个数字，却可能来自完全不同的路径。做AI改造前，要追到差别怎样发生。\n\n## 现场机制会改变工程问题本身\n\nZara的真实分配研究发现，关键尺码缺货会使整款撤下展示，影响的不只是缺货尺码。研究把尺码组合、需求和门店规则纳入分配。2006年试点以10款商品作匹配比较，作者估计销售改善约3%—4%。这是运筹与数字化项目，不是生成式AI实验。[原始论文](https://web.mit.edu/people/jgallien/ZaraOR2010.pdf)\n\n这一材料说明为什么先问“库存怎么优化”还不够：若商品能否被顾客看见由尺码组合决定，只按剩余件数分配，就漏掉了重要关系。模型更精细，也无法自动补回被错误定义的问题。\n\n## 回到连锁，追查增长被哪里挡住\n\n本课[烘焙案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-a)里，X店售罄、工坊窗口未充分使用、门店停止推介，是需要共同解释的观察。可能的机制是供给上限限制销量和需求获取，受限销量又影响下一轮排产。\n\n也可能另有约束：商品无法保鲜到晚间，补货成本太高，或者顾客询问并不转化为购买。若这些情况成立，扩大生产就不是同样的好选择。\n\n| 竞争解释 | 需要看什么 | 会影响哪种改法 |\n|---|---|---|\n| 供给压住有效需求 | 售罄后行为、预订、追加供给后的销售 | 排产与补货 |\n| 产品或时段不合适 | 顾客选择、品质和退换反馈 | 商品、价格或服务方式 |\n| 配送与接待受限 | 实际路线、到店、等待与人员 | 履约和工作安排 |\n| 只看销量造成重复低估 | 当时预测、供给上限和后续结果 | 数据与更新方法 |\n\nAI可以帮助跨材料发现这些关系、提出不同预测；FDE要取得关键事实，把可试的安排实现。哪种解释站得住，决定技术应该改在哪里。\n\n## 诊断应当产生一个可改变的认识\n\n“员工效率低”“信息不通”把太多原因装在一起。更有用的是：“客户三天期限未进入采购比较，合规候选十天才能到，反复补问因此发生。”这说明要保留什么条件、在哪个决定前检查，而不是直接购买一个更强模型。\n\n设备服务也一样。复访可能来自缺件、适用判断错误或必要多次服务；只有可避免的部分，才是减少返工的机会。把所有复访都当失败，会让经济估计和人员评价一起失真。\n\n一项好的现场诊断使团队知道当前最有依据的解释、其他可能、下一项区分观察和相应动作。它可以不完整，但必须足以让某种工程选择比另一种更有理由。\n","text":"# 第12章｜从一个好结果，追到真正产生优势的地方\n\nX店卖完了，总部可能认为店长判断好；服务单当天关闭，负责人可能认为响应快。同一个数字，却可能来自完全不同的路径。做AI改造前，要追到差别怎样发生。\n\n## 现场机制会改变工程问题本身\n\nZara的真实分配研究发现，关键尺码缺货会使整款撤下展示，影响的不只是缺货尺码。研究把尺码组合、需求和门店规则纳入分配。2006年试点以10款商品作匹配比较，作者估计销售改善约3%—4%。这是运筹与数字化项目，不是生成式AI实验。原始论文\n\n这一材料说明为什么先问“库存怎么优化”还不够：若商品能否被顾客看见由尺码组合决定，只按剩余件数分配，就漏掉了重要关系。模型更精细，也无法自动补回被错误定义的问题。\n\n## 回到连锁，追查增长被哪里挡住\n\n本课烘焙案例里，X店售罄、工坊窗口未充分使用、门店停止推介，是需要共同解释的观察。可能的机制是供给上限限制销量和需求获取，受限销量又影响下一轮排产。\n\n也可能另有约束：商品无法保鲜到晚间，补货成本太高，或者顾客询问并不转化为购买。若这些情况成立，扩大生产就不是同样的好选择。\n\n| 竞争解释 | 需要看什么 | 会影响哪种改法 |\n|---|---|---|\n| 供给压住有效需求 | 售罄后行为、预订、追加供给后的销售 | 排产与补货 |\n| 产品或时段不合适 | 顾客选择、品质和退换反馈 | 商品、价格或服务方式 |\n| 配送与接待受限 | 实际路线、到店、等待与人员 | 履约和工作安排 |\n| 只看销量造成重复低估 | 当时预测、供给上限和后续结果 | 数据与更新方法 |\n\nAI可以帮助跨材料发现这些关系、提出不同预测；FDE要取得关键事实，把可试的安排实现。哪种解释站得住，决定技术应该改在哪里。\n\n## 诊断应当产生一个可改变的认识\n\n“员工效率低”“信息不通”把太多原因装在一起。更有用的是：“客户三天期限未进入采购比较，合规候选十天才能到，反复补问因此发生。”这说明要保留什么条件、在哪个决定前检查，而不是直接购买一个更强模型。\n\n设备服务也一样。复访可能来自缺件、适用判断错误或必要多次服务；只有可避免的部分，才是减少返工的机会。把所有复访都当失败，会让经济估计和人员评价一起失真。\n\n一项好的现场诊断使团队知道当前最有依据的解释、其他可能、下一项区分观察和相应动作。它可以不完整，但必须足以让某种工程选择比另一种更有理由。\n"},{"file":"13-系统化放大优势.md","id":"lesson-13","number":13,"role":"核心课","part":2,"title":"第13章｜放大企业优势，为什么要同时改变判断、执行和纠错","md":"# 第13章｜放大企业优势，为什么要同时改变判断、执行和纠错\n\n资深工程师可以从一张旧件照片里注意到风险，也能追问客户真正的交付限制。销售学到他的最终型号，却未必学到判断过程；所有询价都转给他，他又会成为瓶颈。\n\n在[工业品案例](案例B-智能资源成本.md)中，放大的对象应是有效判断及其进入交付的方式，而不只是专家答案。\n\n## 经验怎样进入更多人的工作\n\n先把专家使用的条件、比较和反例保留下来。下一笔询价到来，AI按当前材料带回相关认识，提示还缺工况、交期或供应确认，让销售知道先问什么。\n\n真实客服研究提供一个参照：2025年发表的研究观察5172名客服的分批上线，AI辅助使每小时解决问题量平均提高约15%，不同经验群体作用不同。[研究原文](https://danielle.li/assets/docs/GenerativeAIatWork.pdf) 它支持研究经验扩散，不能直接替工业品公司填写订单增量。\n\n企业应检验的是：新使用者有没有更早识别重要条件，是否少做重复补问，是否能在新情况中正确调整，而不是只统计打开了多少次资料。\n\n## 判断放大之后，还要交得出去\n\nAI帮助形成250个可成交订单的机会，如果采购、库存和跟单仍只能完成200单，新增判断不会自动变成收入。甚至可能因承诺过多损害原有客户。\n\n同理，主打点心从80份卖到160份，需要产能、补货、品质和销售动作共同配合。企业要扩大的是一个价值生成系统，专业方法只在其中一段。\n\n![共同方法进入标准、适配与新类型任务，每项任务仍需条件和执行，结果回流修订方法；传播、交付与更新共同支持能力扩大。](assets/13-放大优势.svg)\n\n## 更多使用，也意味着更多反例\n\n一个专家熟悉的场景较窄，系统进入更多人和任务后，会遇到新工况、供货变化和客户目标。统一入口若只传播旧答案，会把局部失效扩大。\n\n因此，员工应能指出不适用、记录修改，专业人员能改变方法状态，工程能把变化放回当前调用。共同方法既减少重复准备，也帮助每个现场更快认识自己的差别。\n\n动态能力研究强调资源的重组与持续相关性。[原始研究](https://escholarship.org/content/qt2k86c3mf/qt2k86c3mf.pdf) 放大优势因而包含复制，也包含在新条件下更新。\n\n## 下一笔投入应放在最薄弱的一段\n\n判断尚不可靠，先扩大传播会扩散错误；判断已经可用而执行不足，继续生成只会积压；方法进入更多场景，纠错又必须跟上。\n\n企业可以分别看三项证据：谁在采用有效方法，客户结果和成本怎样变化，新事实能否改变后续行为。三者连接起来，专家经验才可能从个人长处发展为更稳定的企业能力。\n","html":"\u003ch1>第13章｜放大企业优势，为什么要同时改变判断、执行和纠错\u003c/h1>\n\u003cp>资深工程师可以从一张旧件照片里注意到风险，也能追问客户真正的交付限制。销售学到他的最终型号，却未必学到判断过程；所有询价都转给他，他又会成为瓶颈。\u003c/p>\n\u003cp>在\u003ca href=\"#case-b\">工业品案例\u003c/a>中，放大的对象应是有效判断及其进入交付的方式，而不只是专家答案。\u003c/p>\n\u003ch2 id=\"lesson-13-section-1\">经验怎样进入更多人的工作\u003c/h2>\n\u003cp>先把专家使用的条件、比较和反例保留下来。下一笔询价到来，AI按当前材料带回相关认识，提示还缺工况、交期或供应确认，让销售知道先问什么。\u003c/p>\n\u003cp>真实客服研究提供一个参照：2025年发表的研究观察5172名客服的分批上线，AI辅助使每小时解决问题量平均提高约15%，不同经验群体作用不同。\u003ca href=\"https://danielle.li/assets/docs/GenerativeAIatWork.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">研究原文\u003c/a> 它支持研究经验扩散，不能直接替工业品公司填写订单增量。\u003c/p>\n\u003cp>企业应检验的是：新使用者有没有更早识别重要条件，是否少做重复补问，是否能在新情况中正确调整，而不是只统计打开了多少次资料。\u003c/p>\n\u003ch2 id=\"lesson-13-section-2\">判断放大之后，还要交得出去\u003c/h2>\n\u003cp>AI帮助形成250个可成交订单的机会，如果采购、库存和跟单仍只能完成200单，新增判断不会自动变成收入。甚至可能因承诺过多损害原有客户。\u003c/p>\n\u003cp>同理，主打点心从80份卖到160份，需要产能、补货、品质和销售动作共同配合。企业要扩大的是一个价值生成系统，专业方法只在其中一段。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data c3mf/qt2k86c3mf.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a> 放大优势因而包含复制，也包含在新条件下更新。\u003c/p>\n\u003ch2 id=\"lesson-13-section-4\">下一笔投入应放在最薄弱的一段\u003c/h2>\n\u003cp>判断尚不可靠，先扩大传播会扩散错误；判断已经可用而执行不足，继续生成只会积压；方法进入更多场景，纠错又必须跟上。\u003c/p>\n\u003cp>企业可以分别看三项证据：谁在采用有效方法，客户结果和成本怎样变化，新事实能否改变后续行为。三者连接起来，专家经验才可能从个人长处发展为更稳定的企业能力。\u003c/p>\n","headings":[{"id":"lesson-13-section-1","label":"经验怎样进入更多人的工作"},{"id":"lesson-13-section-2","label":"判断放大之后，还要交得出去"},{"id":"lesson-13-section-3","label":"更多使用，也意味着更多反例"},{"id":"lesson-13-section-4","label":"下一笔投入应放在最薄弱的一段"}],"exportMd":"# 第13章｜放大企业优势，为什么要同时改变判断、执行和纠错\n\n资深工程师可以从一张旧件照片里注意到风险，也能追问客户真正的交付限制。销售学到他的最终型号，却未必学到判断过程；所有询价都转给他，他又会成为瓶颈。\n\n在[工业品案例](#case-b)中，放大的对象应是有效判断及其进入交付的方式，而不只是专家答案。\n\n## 经验怎样进入更多人的工作\n\n先把专家使用的条件、比较和反例保留下来。下一笔询价到来，AI按当前材料带回相关认识，提示还缺工况、交期或供应确认，让销售知道先问什么。\n\n真实客服研究提供一个参照：2025年发表的研究观察5172名客服的分批上线，AI辅助使每小时解决问题量平均提高约15%，不同经验群体作用不同。[研究原文](https://danielle.li/assets/docs/GenerativeAIatWork.pdf) 它支持研究经验扩散，不能直接替工业品公司填写订单增量。\n\n企业应检验的是：新使用者有没有更早识别重要条件，是否少做重复补问，是否能在新情况中正确调整，而不是只统计打开了多少次资料。\n\n## 判断放大之后，还要交得出去\n\nAI帮助形成250个可成交订单的机会，如果采购、库存和跟单仍只能完成200单，新增判断不会自动变成收入。甚至可能因承诺过多损害原有客户。\n\n同理，主打点心从80份卖到160份，需要产能、补货、品质和销售动作共同配合。企业要扩大的是一个价值生成系统，专业方法只在其中一段。\n\n![共同方法进入标准、适配与新类型任务，每项任务仍需条件和执行，结果回流修订方法；传播、交付与更新共同支持能力扩大。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTEwIiB2aWV3Qm94PSIwIDAgMzYwIDUxMCIgcm9sZT0iaW1nIj48dGl0bGU+5pS+5aSn5LiN5Y+q5Lyg5pKt562U5qGIPC90aXRsZT48ZGVzYz7lhbHlkIzpgInlnovmlrnms5Xov5vlhaXmoIflh4bjgIHpgILphY3lkozmlrDlnovor6Lku7fvvIzku43pnIDliKTmlq3mnaHku7blkozmiafooYzotYTmupDvvJvnu5Pmnpzlm57mtYHkv67orqLlhbHlkIzmlrnms5XjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJ 0份，需要产能、补货、品质和销售动作共同配合。企业要扩大的是一个价值生成系统，专业方法只在其中一段。\n\n![共同方法进入标准、适配与新类型任务，每项任务仍需条件和执行，结果回流修订方法；传播、交付与更新共同支持能力扩大。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTEwIiB2aWV3Qm94PSIwIDAgMzYwIDUxMCIgcm9sZT0iaW1nIj48dGl0bGU+5pS+5aSn5LiN5Y+q5Lyg5pKt562U5qGIPC90aXRsZT48ZGVzYz7lhbHlkIzpgInlnovmlrnms5Xov5vlhaXmoIflh4bjgIHpgILphY3lkozmlrDlnovor6Lku7fvvIzku43pnIDliKTmlq3mnaHku7blkozmiafooYzotYTmupDvvJvnu5Pmnpzlm57mtYHkv67orqLlhbHlkIzmlrnms5XjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjUxMCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7mlL7lpKfkuI3lj6rkvKDmkq3nrZTmoYg8L3RleHQ+PGNpcmNsZSBjeD0iMTgwIiBjeT0iOTIiIHI9IjIwIiBmaWxsPSIjZWRmM2VkIiBzdHJva2U9IiMxNjVkNTIiIHN0cm9rZS13aWR0aD0iMiIvPjxwYXRoIGQ9Ik0xNTAgMTQxVjEzMVExODAgMTA2IDIxMCAxMzFWMTQxIiBmaWxsPSJub25lIiBzdHJva2U9IiMxNjVkNTIiIHN0cm9rZS13aWR0aD0iMiIvPjx0ZXh0IHg9IjIzNSIgeT0iMTAzIiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMyMTM0MmYiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjQwMCI+546w5Zy657uP6aqMPC90ZXh0PjxwYXRoIGQ9Ik0xODAgMTQ2TDE4MCAxNzYiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzE2NWQ1MiIgc3Ryb2tlLXdpZHRoPSIyIiBtYXJrZXItZW5kPSJ1cmwoI2Fycm93KSIvPjxyZWN0IHg9IjU4IiB5PSIxNzgiIHdpZHRoPSIyNDQiIGhlaWdodD0iNjciIHJ4PSI2IiBmaWxsPSIjZWRmM2VkIiBzdHJva2U9IiM2MDczNmMiIHN0cm9rZS13aWR0aD0iMS41Ii8+PHRleHQgeD0iMTgwLjAi \n\n## 下一笔投入应放在最薄弱的一段\n\n判断尚不可靠，先扩大传播会扩散错误；判断已经可用而执行不足，继续生成只会积压；方法进入更多场景，纠错又必须跟上。\n\n企业可以分别看三项证据：谁在采用有效方法，客户结果和成本怎样变化，新事实能否改变后续行为。三者连接起来，专家经验才可能从个人长处发展为更稳定的企业能力。\n","text":"# 第13章｜放大企业优势，为什么要同时改变判断、执行和纠错\n\n资深工程师可以从一张旧件照片里注意到风险，也能追问客户真正的交付限制。销售学到他的最终型号，却未必学到判断过程；所有询价都转给他，他又会成为瓶颈。\n\n在工业品案例中，放大的对象应是有效判断及其进入交付的方式，而不只是专家答案。\n\n## 经验怎样进入更多人的工作\n\n先把专家使用的条件、比较和反例保留下来。下一笔询价到来，AI按当前材料带回相关认识，提示还缺工况、交期或供应确认，让销售知道先问什么。\n\n真实客服研究提供一个参照：2025年发表的研究观察5172名客服的分批上线，AI辅助使每小时解决问题量平均提高约15%，不同经验群体作用不同。研究原文 它支持研究经验扩散，不能直接替工业品公司填写订单增量。\n\n企业应检验的是：新使用者有没有更早识别重要条件，是否少做重复补问，是否能在新情况中正确调整，而不是只统计打开了多少次资料。\n\n## 判断放大之后，还要交得出去\n\nAI帮助形成250个可成交订单的机会，如果采购、库存和跟单仍只能完成200单，新增判断不会自动变成收入。甚至可能因承诺过多损害原有客户。\n\n同理，主打点心从80份卖到160份，需要产能、补货、品质和销售动作共同配合。企业要扩大的是一个价值生成系统，专业方法只在其中一段。\n\n \n\n## 更多使用，也意味着更多反例\n\n一个专家熟悉的场景较窄，系统进入更多人和任务后，会遇到新工况、供货变化和客户目标。统一入口若只传播旧答案，会把局部失效扩大。\n\n因此，员工应能指出不适用、记录修改，专业人员能改变方法状态，工程能把变化放回当前调用。共同方法既减少重复准备，也帮助每个现场更快认识自己的差别。\n\n动态能力研究强调资源的重组与持续相关性。原始研究 放大优势因而包含复制，也包含在新条件下更新。\n\n## 下一笔投入应放在最薄弱的一段\n\n判断尚不可靠，先扩大传播会扩散错误；判断已经可用而执行不足，继续生成只会积压；方法进入更多场景，纠错又必须跟上。\n\n企业可以分别看三项证据：谁在采用有效方法，客户结果和成本怎样变化，新事实能否改变后续行为。三者连接起来，专家经验才可能从个人长处发展为更稳定的企业能力。\n"},{"file":"14-FDE的企业侧角色.md","id":"lesson-14","number":14,"role":"核心课","part":2,"title":"第14章｜FDE在企业里，究竟应该推动什么改变","md":"# 第14章｜FDE在企业里，究竟应该推动什么改变\n\n经销商最初提出“做一个一键报价助手”，想减少文档劳动。现场追一笔询价，却发现技术判断、供货承诺和客户期限没有在同一个任务里相遇。即使报价单生成只要几秒，客户仍可能等不到可用方案。\n\n这正是[报价案例](案例B-智能资源成本.md)给FDE的工作：把企业真正创造价值的方式看清楚，再把发现做成生产中能用的改变。\n\n## 为什么需要靠近现场的工程力量\n\nFDE是Forward Deployed Engineer，通常译为前线部署工程师。它需要靠近实际问题和使用者，能做原型、开发与集成，排查问题并接回采用结果。前线不只表示驻场，工程也不只表示按功能清单编码。\n\nPalantir的官方FDSE职责包括模糊问题、原型、代码和集成；AWS的共建安排也连接生产系统和客户能力。这些是机构对岗位与服务的自述，范围并不完全相同。[Palantir](https://jobs.lever.co/palantir/84131e3f-455e-47fc-9c11-898d95f09048)、[AWS](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)\n\n## 从功能愿望，走到一条可验证改法\n\nFDE可以先让一笔询价保留原要求，关联工程候选与采购确认，再使正式报价和订单结果对应。使用中观察：哪些补问减少，哪些判断仍依赖专家，候选为什么没被采用，承诺是否真实履行。\n\n| 现场发现 | 可能的工程与工作改变 |\n|---|---|\n| 客户期限在转述中消失 | 原件和当前要求进入候选比较 |\n| 旧报价被当现价 | 连接现行价格、库存与版本 |\n| 专家反复查同样依据 | 组织可核材料，减少重复准备 |\n| 报价发出却无人追结果 | 接入客户采用与订单反馈 |\n| 判断正确但供应不足 | 与负责人改变供给或服务承诺 |\n\n最后一项不是工程师独自能够决定的事。业务负责人要承担价值与资源取舍，专业人员判断方法，FDE把相应安排实现并验证。\n\n![FDE使现场发现进入原型和集成，再由真实采用、动作与结果修订认识；企业负责人持续提供价值判断和资源。](assets/14-FDE现场循环.svg)\n\n## 更短的往返，为什么有经营意义\n\n现场认识若经过多次转述和排期才实现，重要理由可能丢失，原条件也可能改变。能够在认识仍鲜明时做出可用原型，再由真实工作迅速挑战，可以减少这类损耗。\n\n速度要体现在有质量的循环：提出解释、做出改变、取得结果、修正解释。连续加功能而无采用与结果，不会因为迭代快就取得同样价值。\n\n企业评价FDE时，应看哪项有价值的假设被验证、哪次现场发现改变了系统、什么经验和内部能力留下。成熟软件已解决的清晰需求可常规实施，内部团队也可承担同样能力；职位名称不替代实际工作。\n\n当通用智能越来越容易取得，企业仍需要一股能把自身差异变成可用生产能力的力量。FDE值得发展的部分，正是这种持续认识与实现。\n","html":"\u003ch1>第14章｜FDE在企业里，究竟应该推动什么改变\u003c/h1>\n\u003cp>经销商最初提出“做一个一键报价助手”，想减少文档劳动。现场追一笔询价，却发现技术判断、供货承诺和客户期限没有在同一个任务里相遇。即使报价单生成只要几秒，客户仍可能等不到可用方案。\u003c/p>\n\u003cp>这正是\u003ca href=\"#case-b\">报价案例\u003c/a>给FDE的工作：把企业真正创造价值的方式看清楚，再把发现做成生产中能用的改变。\u003c/p>\n\u003ch2 id=\"lesson-14-section-1\">为什么需要靠近现场的工程力量\u003c/h2>\n\u003cp>FDE是Forward Deployed Engineer，通常译为前线部署工程师。它需要靠近实际问题和使用者，能做原型、开发与集成，排查问题并接回采用结果。前线不只表示驻场，工程也不只表示按功能清单编码。\u003c/p>\n\u003cp>Palantir的官方FDSE职责包括模糊问题、原型、代码和集成；AWS的共建安排也连接生产系统和客户能力。这些是机构对岗位与服务的自述，范围并不完全相同。\u003ca href=\"https://jobs.lever.co/palantir/84131e3f-455e-47fc-9c11-898d95f09048\" target=\"_blank\" rel=\"noopener noreferrer\">Palantir\u003c/a>、\u003ca href=\"https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers\" target=\"_blank\" rel=\"noopener noreferrer\">AWS\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-14-section-2\">从功能愿望，走到一条可验证改法\u003c/h2>\n\u003cp>FDE可以先让一笔询价保留原要求，关联工程候选与采购确认，再使正式报价和订单结果对应。使用中观察：哪些补问减少，哪些判断仍依赖专家，候选为什么没被采用，承诺是否真实履行。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现场发现\u003c/th>\n\u003cth>可能的工程与工作改变\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>客户期限在转述中消失\u003c/td>\n\u003ctd>原件和当前要求进入候选比较\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>旧报价被当现价\u003c/td>\n\u003ctd>连接现行价格、库存与版本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>专家反复查同样依据\u003c/td>\n\u003ctd>组织可核材料，减少重复准备\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>报价发出却无人追结果\u003c/td>\n\u003ctd>接入客户采用与订单反馈\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>判断正确但供应不足\u003c/td>\n\u003ctd>与负责人改变供给或服务承诺\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>最后一项不是工程师独自能够决定的事。业务负责人要承担价值与资源取舍，专业人员判断方法，FDE把相应安排实现并验证。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTkwIiB2aWV3Qm94PSIwIDAgMzYwIDU5MCIgcm9sZT0iaW1nIj48dGl0bGU+546w5Zy65LiO5bel56iL5oyB57ut5b6A6L+UPC90aXRsZT48ZGVzYz7njrDlnLrlj5HnjrDjgIHlj6/nlKjlrp7njrDjgIHnnJ/lrp7ph4fnlKjlkoznu5Pmnpzlj43ppojnm7jkupLov57mjqXvvIzkvIHkuJrmj5Dkvpvku7flgLzkuI7otYTmupDlronmjpLjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjU5MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7njrDlnLrkuI7lt6XnqIvmjIHnu63lvoDov5Q8L3RleHQ+PHJlY3QgeD0iMzIiIHk9Ijg2IiB3aWR0aD0iMjE4IiBoZWlnaHQ9Ijc0IiByeD0iNiIgZmlsbD0iI2VkZjNlZCIgc3Ryb2tlPSIjNjA3MzZjIiBzdHJva2Utd2lkdGg9IjEuNSIvPjx0ZXh0IHg9IjE0MS4wIiB5PSIxMTYuNSIgZm9udC1mYW1pbHk9IlBpbmdGYW5nIFNDLE1pY3Jvc29mdCBZYUhlaSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmaWxsPSIjMjEzNDJmIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXdlaWdodD0iNDAwIj7njrDlnLrlj5HnjrA8L3RleHQ+PHRleHQgeD0iMTQxLjAiIHk9IjE0MS41IiBmb250LWZhbWlseT0iUGluZ0ZhbmcgU0MsTWljcm9zb2Z0IFlhSGVpLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0 工程师。它需要靠近实际问题和使用者，能做原型、开发与集成，排查问题并接回采用结果。前线不只表示驻场，工程也不只表示按功能清单编码。\n\nPalantir的官方FDSE职责包括模糊问题、原型、代码和集成；AWS的共建安排也连接生产系统和客户能力。这些是机构对岗位与服务的自述，范围并不完全相同。[Palantir](https://jobs.lever.co/palantir/84131e3f-455e-47fc-9c11-898d95f09048)、[AWS](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)\n\n## 从功能愿望，走到一条可验证改法\n\nFDE可以先让一笔询价保留原要求，关联工程候选与采购确认，再使正式报价和订单结果对应。使用中观察：哪些补问减少，哪些判断仍依赖专家，候选为什么没被采用，承诺是否真实履行。\n\n| 现场发现 | 可能的工程与工作改变 |\n|---|---|\n| 客户期限在转述中消失 | 原件和当前要求进入候选比较 |\n| 旧报价被当现价 | 连接现行价格、库存与版本 |\n| 专家反复查同样依据 | 组织可核材料，减少重复准备 |\n| 报价发出却无人追结果 | 接入客户采用与订单反馈 |\n| 判断正确但供应不足 | 与负责人改变供给或服务承诺 |\n\n最后一项不是工程师独自能够决定的事。业务负责人要承担价值与资源取舍，专业人员判断方法，FDE把相应安排实现并验证。\n\n![FDE使现场发现进入原型和集成，再由真实采用、动作与结果修订认识；企业负责人持续提供价值判断和资源。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTkwIiB2aWV3Qm94PSIwIDAgMzYwIDU5MCIgcm9sZT0iaW1nIj48dGl0bGU+546w5Zy65LiO5bel56iL5oyB57ut5b6A6L+UPC90aXRsZT48ZGVzYz7njrDlnLrlj5HnjrDjgIHlj6/nlKjlrp7njrDjgIHnnJ/lrp7ph4fnlKjlkoznu5Pmnpzlj43ppojnm7jkupLov57mjqXvvIzkvIHkuJrmj5Dkvpvku7flgLzkuI7otYTmupDlronmjpLjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjU5MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7njrDlnLrkuI7lt6XnqIvmjIHnu63lvoDov5Q8L3RleHQ+PHJlY3QgeD0iMzIiIHk9Ijg2IiB3aWR0aD0iMjE4IiBoZWlnaHQ9Ijc0IiByeD0iNiIgZmlsbD0iI2VkZjNlZCIgc3Ryb2tlPSIjNjA3MzZjIiBzdHJva2Utd2lkdGg9IjEuNS 需要靠近现场的工程力量\n\nFDE是Forward Deployed Engineer，通常译为前线部署工程师。它需要靠近实际问题和使用者，能做原型、开发与集成，排查问题并接回采用结果。前线不只表示驻场，工程也不只表示按功能清单编码。\n\nPalantir的官方FDSE职责包括模糊问题、原型、代码和集成；AWS的共建安排也连接生产系统和客户能力。这些是机构对岗位与服务的自述，范围并不完全相同。[Palantir](https://jobs.lever.co/palantir/84131e3f-455e-47fc-9c11-898d95f09048)、[AWS](https://www.aboutamazon.com/news/aws/aws-1-billion-forward-deployed-ai-engineers)\n\n## 从功能愿望，走到一条可验证改法\n\nFDE可以先让一笔询价保留原要求，关联工程候选与采购确认，再使正式报价和订单结果对应。使用中观察：哪些补问减少，哪些判断仍依赖专家，候选为什么没被采用，承诺是否真实履行。\n\n| 现场发现 | 可能的工程与工作改变 |\n|---|---|\n| 客户期限在转述中消失 | 原件和当前要求进入候选比较 |\n| 旧报价被当现价 | 连接现行价格、库存与版本 |\n| 专家反复查同样依据 | 组织可核材料，减少重复准备 |\n| 报价发出却无人追结果 | 接入客户采用与订单反馈 |\n| 判断正确但供应不足 | 与负责人改变供给或服务承诺 |\n\n最后一项不是工程师独自能够决定的事。业务负责人要承担价值与资源取舍，专业人员判断方法，FDE把相应安排实现并验证。\n\n![FDE使现场发现进入原型和集成，再由真实采用、动作与结果修订认识；企业负责人持续提供价值判断和资源。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTkwIiB2aWV3Qm94PSIwIDAgMzYwIDU5MCIgcm9sZT0iaW1nIj48dGl0bGU+546w5Zy65LiO5bel56iL5oyB57ut5b6A6L+UPC90aXRsZT48ZGVzYz7njrDlnLrlj5HnjrDjgIHlj6/nlKjlrp7njrDjgIHnnJ/lrp7ph4fnlKjlkoznu5Pmnpzlj43ppojnm7jkupLov57mjqXvvIzkvIHkuJrmj5Dkvpvku7flgLzkuI7otYTmupDlronmjpLjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjU5MCIgcng9IjgiIGZpbGw9IiNmNmY4ZjMiLz48dGV4dCB4PSIyNCIgeT0iMzkiIGZvbnQtZmFtaWx5PSJQaW5nRmFuZyBTQyxNaWNyb3NvZnQgWWFIZWksc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNCIgZmlsbD0iIzIxMzQyZiIgdGV4dC1hbmNob3I9InN0YXJ0IiBmb250LXdlaWdodD0iNDAwIj7njrDlnLrkuI7lt6XnqIvmjIHnu63lvoDov5Q8L3RleHQ+PHJlY3QgeD0iMzIiIHk9Ijg2IiB3aWR0aD0iMjE4IiBoZWlnaHQ9Ijc0IiByeD0iNiIgZmlsbD0iI2VkZ E是Forward Deployed Engineer，通常译为前线部署工程师。它需要靠近实际问题和使用者，能做原型、开发与集成，排查问题并接回采用结果。前线不只表示驻场，工程也不只表示按功能清单编码。\n\nPalantir的官方FDSE职责包括模糊问题、原型、代码和集成；AWS的共建安排也连接生产系统和客户能力。这些是机构对岗位与服务的自述，范围并不完全相同。Palantir、AWS\n\n## 从功能愿望，走到一条可验证改法\n\nFDE可以先让一笔询价保留原要求，关联工程候选与采购确认，再使正式报价和订单结果对应。使用中观察：哪些补问减少，哪些判断仍依赖专家，候选为什么没被采用，承诺是否真实履行。\n\n| 现场发现 | 可能的工程与工作改变 |\n|---|---|\n| 客户期限在转述中消失 | 原件和当前要求进入候选比较 |\n| 旧报价被当现价 | 连接现行价格、库存与版本 |\n| 专家反复查同样依据 | 组织可核材料，减少重复准备 |\n| 报价发出却无人追结果 | 接入客户采用与订单反馈 |\n| 判断正确但供应不足 | 与负责人改变供给或服务承诺 |\n\n最后一项不是工程师独自能够决定的事。业务负责人要承担价值与资源取舍，专业人员判断方法，FDE把相应安排实现并验证。\n\n \n\n## 更短的往返，为什么有经营意义\n\n现场认识若经过多次转述和排期才实现，重要理由可能丢失，原条件也可能改变。能够在认识仍鲜明时做出可用原型，再由真实工作迅速挑战，可以减少这类损耗。\n\n速度要体现在有质量的循环：提出解释、做出改变、取得结果、修正解释。连续加功能而无采用与结果，不会因为迭代快就取得同样价值。\n\n企业评价FDE时，应看哪项有价值的假设被验证、哪次现场发现改变了系统、什么经验和内部能力留下。成熟软件已解决的清晰需求可常规实施，内部团队也可承担同样能力；职位名称不替代实际工作。\n\n当通用智能越来越容易取得，企业仍需要一股能把自身差异变成可用生产能力的力量。FDE值得发展的部分，正是这种持续认识与实现。\n"},{"file":"15-现场工作方法.md","id":"lesson-15","number":15,"role":"核心课","part":2,"title":"第15章｜原型怎样把问题暴露出来，而不只把演示做顺","md":"# 第15章｜原型怎样把问题暴露出来，而不只把演示做顺\n\n内容团队的AI原型能生成一篇完整产品文章，格式清楚、语气专业。技术专家用自己的材料一试，发现它把一种型号的性能写到了另一种上。\n\n如果只把那句话改掉，演示可以继续。若沿着这次错误追查，团队却可能发现产品资料、型号版本和核验工作还没有真正进入生成。这是[内容服务案例](案例D-专业服务.md)中原型更有价值的用途。\n\n## 先看原工作怎样完成\n\n专家平时要找哪些资料、比较什么、在哪里重复核对？客户实际接受的材料是什么？从原件到可发布交付经过哪些人工补救？这些事实决定原型该检验什么。\n\n合理基线也要保留。资料整理和现成模板本来就能解决的部分，不应全部算成模型能力；原工作也有错误，比较要看新安排减少了什么、又新增什么。\n\n## 把一个假设做成能亲手使用的安排\n\n例如本轮假设是：“先关联现行产品资料，让草稿中的重要事实可核，能够减少专家查找与改写，而不降低最终质量。”\n\n原型就应让专家拿未预先整理好的实际材料，完成找依据、生成、核对、修改和保存。只有演示者知道答案的顺畅流程，无法暴露后续人员要承担多少工作。\n\n一次事实错误至少要查三件事：正确材料有没有进入；模型有没有处理其中关键条件；修订是否进入最终交付和后续使用。错误结果本身不能直接证明原因。\n\n## 修改要沿着影响传播\n\n某句话在界面改对，旧草稿却仍进入共享案例，下一位人员会重复碰到同一错误。修复应同时检查原任务、正式材料、知识调用与代表任务，确定变化会改变后续行为。\n\n| 使用中观察 | 需要区分的问题 |\n|---|---|\n| 专家逐句重写 | 输入不适合，还是任务范围太宽 |\n| 经常另开旧工具 | 新入口缺能力，还是增加负担 |\n| 资料完整仍用错型号 | 检索、版本或理解发生什么 |\n| 输出准确却未发布 | 客户采用、责任或后续容量缺什么 |\n\n这使原型既检验实现，也检验业务认识。若最有价值的问题由写作转成资料和核验，并不必然跑偏；要能说明它如何服务原来的交付目标。\n\n关于真实工作与主观省时的研究提醒我们，感觉顺畅与总任务改善需要分开观察。[任务研究](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf) 最后应看合格交付、实际核验与返工，而不只问使用者喜不喜欢界面。\n\n一次原型结束，除了可用功能，还应留下被改变的认识：哪种事实重要，哪个环节才是瓶颈，原假设哪里不成立。这样下一次投入才会比重复做一个演示更有依据。\n","html":"\u003ch1>第15章｜原型怎样把问题暴露出来，而不只把演示做顺\u003c/h1>\n\u003cp>内容团队的AI原型能生成一篇完整产品文章，格式清楚、语气专业。技术专家用自己的材料一试，发现它把一种型号的性能写到了另一种上。\u003c/p>\n\u003cp>如果只把那句话改掉，演示可以继续。若沿着这次错误追查，团队却可能发现产品资料、型号版本和核验工作还没有真正进入生成。这是\u003ca href=\"#case-d\">内容服务案例\u003c/a>中原型更有价值的用途。\u003c/p>\n\u003ch2 id=\"lesson-15-section-1\">先看原工作怎样完成\u003c/h2>\n\u003cp>专家平时要找哪些资料、比较什么、在哪里重复核对？客户实际接受的材料是什么？从原件到可发布交付经过哪些人工补救？这些事实决定原型该检验什么。\u003c/p>\n\u003cp>合理基线也要保留。资料整理和现成模板本来就能解决的部分，不应全部算成模型能力；原工作也有错误，比较要看新安排减少了什么、又新增什么。\u003c/p>\n\u003ch2 id=\"lesson-15-section-2\">把一个假设做成能亲手使用的安排\u003c/h2>\n\u003cp>例如本轮假设是：“先关联现行产品资料，让草稿中的重要事实可核，能够减少专家查找与改写，而不降低最终质量。”\u003c/p>\n\u003cp>原型就应让专家拿未预先整理好的实际材料，完成找依据、生成、核对、修改和保存。只有演示者知道答案的顺畅流程，无法暴露后续人员要承担多少工作。\u003c/p>\n\u003cp>一次事实错误至少要查三件事：正确材料有没有进入；模型有没有处理其中关键条件；修订是否进入最终交付和后续使用。错误结果本身不能直接证明原因。\u003c/p>\n\u003ch2 id=\"lesson-15-section-3\">修改要沿着影响传播\u003c/h2>\n\u003cp>某句话在界面改对，旧草稿却仍进入共享案例，下一位人员会重复碰到同一错误。修复应同时检查原任务、正式材料、知识调用与代表任务，确定变化会改变后续行为。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>使用中观察\u003c/th>\n\u003cth>需要区分的问题\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>专家逐句重写\u003c/td>\n\u003ctd>输入不适合，还是任务范围太宽\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>经常另开旧工具\u003c/td>\n\u003ctd>新入口缺能力，还是增加负担\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>资料完整仍用错型号\u003c/td>\n\u003ctd>检索、版本或理解发生什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>输出准确却未发布\u003c/td>\n\u003ctd>客户采用、责任或后续容量缺什么\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>这使原型既检验实现，也检验业务认识。若最有价值的问题由写作转成资料和核验，并不必然跑偏；要能说明它如何服务原来的交付目标。\u003c/p>\n\u003cp>关于真实工作与主观省时的研究提醒我们，感觉顺畅与总任务改善需要分开观察。\u003ca href=\"https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">任务研究\u003c/a> 最后应看合格交付、实际核验与返工，而不只问使用者喜不喜欢界面。\u003c/p>\n\u003cp>一次原型结束，除了可用功能，还应留下被改变的认识：哪种事实重要，哪个环节才是瓶颈，原假设哪里不成立。这样下一次投入才会比重复做一个演示更有依据。\u003c/p>\n","headings":[{"id":"lesson-15-section-1","label":"先看原工作怎样完成"},{"id":"lesson-15-section-2","label":"把一个假设做成能亲手使用的安排"},{"id":"lesson-15-section-3","label":"修改要沿着影响传播"}],"exportMd":"# 第15章｜原型怎样把问题暴露出来，而不只把演示做顺\n\n内容团队的AI原型能生成一篇完整产品文章，格式清楚、语气专业。技术专家用自己的材料一试，发现它把一种型号的性能写到了另一种上。\n\n如果只把那句话改掉，演示可以继续。若沿着这次错误追查，团队却可能发现产品资料、型号版本和核验工作还没有真正进入生成。这是[内容服务案例](#case-d)中原型更有价值的用途。\n\n## 先看原工作怎样完成\n\n专家平时要找哪些资料、比较什么、在哪里重复核对？客户实际接受的材料是什么？从原件到可发布交付经过哪些人工补救？这些事实决定原型该检验什么。\n\n合理基线也要保留。资料整理和现成模板本来就能解决的部分，不应全部算成模型能力；原工作也有错误，比较要看新安排减少了什么、又新增什么。\n\n## 把一个假设做成能亲手使用的安排\n\n例如本轮假设是：“先关联现行产品资料，让草稿中的重要事实可核，能够减少专家查找与改写，而不降低最终质量。”\n\n原型就应让专家拿未预先整理好的实际材料，完成找依据、生成、核对、修改和保存。只有演示者知道答案的顺畅流程，无法暴露后续人员要承担多少工作。\n\n一次事实错误至少要查三件事：正确材料有没有进入；模型有没有处理其中关键条件；修订是否进入最终交付和后续使用。错误结果本身不能直接证明原因。\n\n## 修改要沿着影响传播\n\n某句话在界面改对，旧草稿却仍进入共享案例，下一位人员会重复碰到同一错误。修复应同时检查原任务、正式材料、知识调用与代表任务，确定变化会改变后续行为。\n\n| 使用中观察 | 需要区分的问题 |\n|---|---|\n| 专家逐句重写 | 输入不适合，还是任务范围太宽 |\n| 经常另开旧工具 | 新入口缺能力，还是增加负担 |\n| 资料完整仍用错型号 | 检索、版本或理解发生什么 |\n| 输出准确却未发布 | 客户采用、责任或后续容量缺什么 |\n\n这使原型既检验实现，也检验业务认识。若最有价值的问题由写作转成资料和核验，并不必然跑偏；要能说明它如何服务原来的交付目标。\n\n关于真实工作与主观省时的研究提醒我们，感觉顺畅与总任务改善需要分开观察。[任务研究](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf) 最后应看合格交付、实际核验与返工，而不只问使用者喜不喜欢界面。\n\n一次原型结束，除了可用功能，还应留下被改变的认识：哪种事实重要，哪个环节才是瓶颈，原假设哪里不成立。这样下一次投入才会比重复做一个演示更有依据。\n","exportSingleMd":"# 第15章｜原型怎样把问题暴露出来，而不只把演示做顺\n\n内容团队的AI原型能生成一篇完整产品文章，格式清楚、语气专业。技术专家用自己的材料一试，发现它把一种型号的性能写到了另一种上。\n\n如果只把那句话改掉，演示可以继续。若沿着这次错误追查，团队却可能发现产品资料、型号版本和核验工作还没有真正进入生成。这是[内容服务案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-d)中原型更有价值的用途。\n\n## 先看原工作怎样完成\n\n专家平时要找哪些资料、比较什么、在哪里重复核对？客户实际接受的材料是什么？从原件到可发布交付经过哪些人工补救？这些事实决定原型该检验什么。\n\n合理基线也要保留。资料整理和现成模板本来就能解决的部分，不应全部算成模型能力；原工作也有错误，比较要看新安排减少了什么、又新增什么。\n\n## 把一个假设做成能亲手使用的安排\n\n例如本轮假设是：“先关联现行产品资料，让草稿中的重要事实可核，能够减少专家查找与改写，而不降低最终质量。”\n\n原型就应让专家拿未预先整理好的实际材料，完成找依据、生成、核对、修改和保存。只有演示者知道答案的顺畅流程，无法暴露后续人员要承担多少工作。\n\n一次事实错误至少要查三件事：正确材料有没有进入；模型有没有处理其中关键条件；修订是否进入最终交付和后续使用。错误结果本身不能直接证明原因。\n\n## 修改要沿着影响传播\n\n某句话在界面改对，旧草稿却仍进入共享案例，下一位人员会重复碰到同一错误。修复应同时检查原任务、正式材料、知识调用与代表任务，确定变化会改变后续行为。\n\n| 使用中观察 | 需要区分的问题 |\n|---|---|\n| 专家逐句重写 | 输入不适合，还是任务范围太宽 |\n| 经常另开旧工具 | 新入口缺能力，还是增加负担 |\n| 资料完整仍用错型号 | 检索、版本或理解发生什么 |\n| 输出准确却未发布 | 客户采用、责任或后续容量缺什么 |\n\n这使原型既检验实现，也检验业务认识。若最有价值的问题由写作转成资料和核验，并不必然跑偏；要能说明它如何服务原来的交付目标。\n\n关于真实工作与主观省时的研究提醒我们，感觉顺畅与总任务改善需要分开观察。[任务研究](https://metr.org/Early_2025_AI_Experienced_OS_Devs_Study-paper.pdf) 最后应看合格交付、实际核验与返工，而不只问使用者喜不喜欢界面。\n\n一次原型结束，除了可用功能，还应留下被改变的认识：哪种事实重要，哪个环节才是瓶颈，原假设哪里不成立。这样下一次投入才会比重复做一个演示更有依据。\n","text":"# 第15章｜原型怎样把问题暴露出来，而不只把演示做顺\n\n内容团队的AI原型能生成一篇完整产品文章，格式清楚、语气专业。技术专家用自己的材料一试，发现它把一种型号的性能写到了另一种上。\n\n如果只把那句话改掉，演示可以继续。若沿着这次错误追查，团队却可能发现产品资料、型号版本和核验工作还没有真正进入生成。这是内容服务案例中原型更有价值的用途。\n\n## 先看原工作怎样完成\n\n专家平时要找哪些资料、比较什么、在哪里重复核对？客户实际接受的材料是什么？从原件到可发布交付经过哪些人工补救？这些事实决定原型该检验什么。\n\n合理基线也要保留。资料整理和现成模板本来就能解决的部分，不应全部算成模型能力；原工作也有错误，比较要看新安排减少了什么、又新增什么。\n\n## 把一个假设做成能亲手使用的安排\n\n例如本轮假设是：“先关联现行产品资料，让草稿中的重要事实可核，能够减少专家查找与改写，而不降低最终质量。”\n\n原型就应让专家拿未预先整理好的实际材料，完成找依据、生成、核对、修改和保存。只有演示者知道答案的顺畅流程，无法暴露后续人员要承担多少工作。\n\n一次事实错误至少要查三件事：正确材料有没有进入；模型有没有处理其中关键条件；修订是否进入最终交付和后续使用。错误结果本身不能直接证明原因。\n\n## 修改要沿着影响传播\n\n某句话在界面改对，旧草稿却仍进入共享案例，下一位人员会重复碰到同一错误。修复应同时检查原任务、正式材料、知识调用与代表任务，确定变化会改变后续行为。\n\n| 使用中观察 | 需要区分的问题 |\n|---|---|\n| 专家逐句重写 | 输入不适合，还是任务范围太宽 |\n| 经常另开旧工具 | 新入口缺能力，还是增加负担 |\n| 资料完整仍用错型号 | 检索、版本或理解发生什么 |\n| 输出准确却未发布 | 客户采用、责任或后续容量缺什么 |\n\n这使原型既检验实现，也检验业务认识。若最有价值的问题由写作转成资料和核验，并不必然跑偏；要能说明它如何服务原来的交付目标。\n\n关于真实工作与主观省时的研究提醒我们，感觉顺畅与总任务改善需要分开观察。任务研究 最后应看合格交付、实际核验与返工，而不只问使用者喜不喜欢界面。\n\n一次原型结束，除了可用功能，还应留下被改变的认识：哪种事实重要，哪个环节才是瓶颈，原假设哪里不成立。这样下一次投入才会比重复做一个演示更有依据。\n"},{"file":"16-试点与学习价值.md","id":"lesson-16","number":16,"role":"核心课","part":2,"title":"第16章｜先试什么，才会改变下一笔投资","md":"# 第16章｜先试什么，才会改变下一笔投资\n\n连锁可以先做自动日报，也可以试补货，或者直接上全网自主排产。容易展示、想象空间大、值得先做，是三种不同评价。\n\n选择试点时，要把经营机会与需要减少的未知放在一起。结束以后，企业应更清楚继续哪种改法。\n\n## 把“大概有机会”变成一个具体选择\n\n[烘焙案例](案例A-连锁备货.md)的正常需求算账显示：原安排日贡献1040元，只改分配1280元，扩产补货1680元。160份需求是算账条件，现场起初只知道X售出80并提前卖完。\n\n扩产相对只改分配，多生产60份，成本240元，再加80元日常支出；至少多卖27份才更好。因此，一项关键未知是：在品质、配送和销售动作能够支持时，X有没有足够新增有效需求。\n\n这比“AI能不能帮企业增长”具体得多，也能解释为什么先取得什么信息。\n\n## 试点要让不同结果指向不同动作\n\n可以先核对生产窗口和补货路线，再在可承受范围内追加供给、记录推介与预订、实际到店和销售。保持其他条件清楚，才能逐步辨认新增供给、推广和当地事件的作用。\n\n| 观察 | 会改变的选择 |\n|---|---|\n| 有询问，但少有实际购买 | 回看商品、时段和需求假设 |\n| 有需求，但品质或配送不支持 | 先改履约，不继续只扩模型 |\n| 新增销售不足以覆盖最好替代 | 保留较简单的改分配方案 |\n| 采用、执行与贡献均有依据 | 再检验更多日期、接任和扩店 |\n\n自动日报可以单独省整理时间，却未必回答这项投资选择。全网自主排产范围很大，又可能同时引入太多变化。好的起点，是小到可执行、大到足以暴露关键关系。\n\n## 学习也要有边界\n\n试点开始前，说明本轮可用业务与工程资源、负责人、复查时点，以及何种证据会增加、减少或停止投入。如果任何结果最后都被叫“有收获”，学习就无法检验。\n\n探索与利用研究解释了试新办法与改善已有方法的资源竞争。[原始研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf) 学习成果可以是停止一个方向，但要指出哪项观察改变了决定。\n\n这两店共用生产和配送，X增加也可能挤占Y或其他商品。试点应看相应网络结果，不能把转移来的销量当净增长。\n\n对这家连锁，第一阶段最有价值的成果可能不是“系统成功”，而是有依据地知道扩产值得、只改配更好，或配送才是真正需要投入的地方。三种结果都能帮助企业少走下一步弯路。\n","html":"\u003ch1>第16章｜先试什么，才会改变下一笔投资\u003c/h1>\n\u003cp>连锁可以先做自动日报，也可以试补货，或者直接上全网自主排产。容易展示、想象空间大、值得先做，是三种不同评价。\u003c/p>\n\u003cp>选择试点时，要把经营机会与需要减少的未知放在一起。结束以后，企业应更清楚继续哪种改法。\u003c/p>\n\u003ch2 id=\"lesson-16-section-1\">把“大概有机会”变成一个具体选择\u003c/h2>\n\u003cp>\u003ca href=\"#case-a\">烘焙案例\u003c/a>的正常需求算账显示：原安排日贡献1040元，只改分配1280元，扩产补货1680元。160份需求是算账条件，现场起初只知道X售出80并提前卖完。\u003c/p>\n\u003cp>扩产相对只改分配，多生产60份，成本240元，再加80元日常支出；至少多卖27份才更好。因此，一项关键未知是：在品质、配送和销售动作能够支持时，X有没有足够新增有效需求。\u003c/p>\n\u003cp>这比“AI能不能帮企业增长”具体得多，也能解释为什么先取得什么信息。\u003c/p>\n\u003ch2 id=\"lesson-16-section-2\">试点要让不同结果指向不同动作\u003c/h2>\n\u003cp>可以先核对生产窗口和补货路线，再在可承受范围内追加供给、记录推介与预订、实际到店和销售。保持其他条件清楚，才能逐步辨认新增供给、推广和当地事件的作用。\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>观察\u003c/th>\n\u003cth>会改变的选择\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>有询问，但少有实际购买\u003c/td>\n\u003ctd>回看商品、时段和需求假设\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>有需求，但品质或配送不支持\u003c/td>\n\u003ctd>先改履约，不继续只扩模型\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新增销售不足以覆盖最好替代\u003c/td>\n\u003ctd>保留较简单的改分配方案\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>采用、执行与贡献均有依据\u003c/td>\n\u003ctd>再检验更多日期、接任和扩店\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>自动日报可以单独省整理时间，却未必回答这项投资选择。全网自主排产范围很大，又可能同时引入太多变化。好的起点，是小到可执行、大到足以暴露关键关系。\u003c/p>\n\u003ch2 id=\"lesson-16-section-3\">学习也要有边界\u003c/h2>\n\u003cp>试点开始前，说明本轮可用业务与工程资源、负责人、复查时点，以及何种证据会增加、减少或停止投入。如果任何结果最后都被叫“有收获”，学习就无法检验。\u003c/p>\n\u003cp>探索与利用研究解释了试新办法与改善已有方法的资源竞争。\u003ca href=\"https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">原始研究\u003c/a> 学习成果可以是停止一个方向，但要指出哪项观察改变了决定。\u003c/p>\n\u003cp>这两店共用生产和配送，X增加也可能挤占Y或其他商品。试点应看相应网络结果，不能把转移来的销量当净增长。\u003c/p>\n\u003cp>对这家连锁，第一阶段最有价值的成果可能不是“系统成功”，而是有依据地知道扩产值得、只改配更好，或配送才是真正需要投入的地方。三种结果都能帮助企业少走下一步弯路。\u003c/p>\n","headings":[{"id":"lesson-16-section-1","label":"把“大概有机会”变成一个具体选择"},{"id":"lesson-16-section-2","label":"试点要让不同结果指向不同动作"},{"id":"lesson-16-section-3","label":"学习也要有边界"}],"exportMd":"# 第16章｜先试什么，才会改变下一笔投资\n\n连锁可以先做自动日报，也可以试补货，或者直接上全网自主排产。容易展示、想象空间大、值得先做，是三种不同评价。\n\n选择试点时，要把经营机会与需要减少的未知放在一起。结束以后，企业应更清楚继续哪种改法。\n\n## 把“大概有机会”变成一个具体选择\n\n[烘焙案例](#case-a)的正常需求算账显示：原安排日贡献1040元，只改分配1280元，扩产补货1680元。160份需求是算账条件，现场起初只知道X售出80并提前卖完。\n\n扩产相对只改分配，多生产60份，成本240元，再加80元日常支出；至少多卖27份才更好。因此，一项关键未知是：在品质、配送和销售动作能够支持时，X有没有足够新增有效需求。\n\n这比“AI能不能帮企业增长”具体得多，也能解释为什么先取得什么信息。\n\n## 试点要让不同结果指向不同动作\n\n可以先核对生产窗口和补货路线，再在可承受范围内追加供给、记录推介与预订、实际到店和销售。保持其他条件清楚，才能逐步辨认新增供给、推广和当地事件的作用。\n\n| 观察 | 会改变的选择 |\n|---|---|\n| 有询问，但少有实际购买 | 回看商品、时段和需求假设 |\n| 有需求，但品质或配送不支持 | 先改履约，不继续只扩模型 |\n| 新增销售不足以覆盖最好替代 | 保留较简单的改分配方案 |\n| 采用、执行与贡献均有依据 | 再检验更多日期、接任和扩店 |\n\n自动日报可以单独省整理时间，却未必回答这项投资选择。全网自主排产范围很大，又可能同时引入太多变化。好的起点，是小到可执行、大到足以暴露关键关系。\n\n## 学习也要有边界\n\n试点开始前，说明本轮可用业务与工程资源、负责人、复查时点，以及何种证据会增加、减少或停止投入。如果任何结果最后都被叫“有收获”，学习就无法检验。\n\n探索与利用研究解释了试新办法与改善已有方法的资源竞争。[原始研究](https://hiveresearchlab.org/wp-content/uploads/2013/12/march_1991_exploration_and_exploitation_in_organizational_learning.pdf) 学习成果可以是停止一个方向，但要指出哪项观察改变了决定。\n\n这两店共用生产和配送，X增加也可能挤占Y或其他商品。试点应看相应网络结果 关键关系。\n\n## 学习也要有边界\n\n试点开始前，说明本轮可用业务与工程资源、负责人、复查时点，以及何种证据会增加、减少或停止投入。如果任何结果最后都被叫“有收获”，学习就无法检验。\n\n探索与利用研究解释了试新办法与改善已有方法的资源竞争。原始研究 学习成果可以是停止一个方向，但要指出哪项观察改变了决定。\n\n这两店共用生产和配送，X增加也可能挤占Y或其他商品。试点应看相应网络结果，不能把转移来的销量当净增长。\n\n对这家连锁，第一阶段最有价值的成果可能不是“系统成功”，而是有依据地知道扩产值得、只改配更好，或配送才是真正需要投入的地方。三种结果都能帮助企业少走下一步弯路。\n"},{"file":"17-智能伙伴的持续职责.md","id":"lesson-17","number":17,"role":"核心课","part":3,"title":"第17章｜AI怎样从回答一次，变成接续一项工作","md":"# 第17章｜AI怎样从回答一次，变成接续一项工作\n\n客户补来一段设备运行描述，技术员稍后更新现场动作，第二天又收到复发消息。如果每次都重新问AI，企业得到的是几次回答；若系统能识别这是同一项服务、接着原有经过推进，工作关系就不同了。\n\n把AI当作智能伙伴，实际需要给它一项可持续接续的职责，而非一个拟人化名字。\n\n## 一张工单可以怎样被接住\n\n在[设备案例](案例C-设备售后.md)中，AI可以准备派工前资料：识别当前设备，取得历史，发现版本或动作缺项，组织补问。资料回来后重新比较，需要时交给专业支持。\n\n派工以后，职责也可以包括检查是否被系统接受、人员是否到场、客户是否恢复，以及复发是否接回同一设备。每一步的完成范围都应清楚，不能把写好说明当作服务完成。\n\n![同一工单保持身份与经过，当前事实和相关经验支持下一步判断，行动结果返回任务；记录持久不等于模型参数自动学习。](assets/17-智能伙伴.svg)\n\n## 持续不是一直保持对话\n\n客户新消息、状态变化或约定检查到来时，业务系统把同一任务及已有经过交给AI；AI取得所需材料、决定本轮动作，写回结果与未完成事项；需要等别人时，本轮可以结束。下一次触发再继续。\n\n因此，一句“我会跟进”并不会自动产生后台工作。触发、持久记录、工具与恢复，需要产品和工程提供。模型当前知道什么，也取决于本轮实际取得了什么。\n\n## 职责的边界，决定它能够主动到哪里\n\n“负责售后”过大，“把派工前材料准备到可采用”则有对象、使用者和结果。起步可以小，随着质量、执行和异常处理证据增加，再扩大范围。\n\n持续伙伴还可以帮助产生新认识：四张恢复记录里的动作混杂，AI指出差别，提出可区分的观察，专业人员安排核对，结果再改变方法。它不只扩散旧答案，也能参与发展新的know-how。\n\nAgent工程把模型、工具与环境反馈组织在连续工作中。[工程材料](https://www.anthropic.com/research/building-effective-agents) 企业要做的是让这些能力取得真实条件，并给出适合的决定范围。\n\n判断伙伴是否有用，可以看它有没有减少重复解释，是否记得未完成事项，情况变化后能否改法，以及下一岗位是否得到更可用的材料。委派范围由这些表现发展，人的参与也应解决具体问题，而非只多加一个确认按钮。\n","html":"\u003ch1>第17章｜AI怎样从回答一次，变成接续一项工作\u003c/h1>\n\u003cp>客户补来一段设备运行描述，技术员稍后更新现场动作，第二天又收到复发消息。如果每次都重新问AI，企业得到的是几次回答；若系统能识别这是同一项服务、接着原有经过推进，工作关系就不同了。\u003c/p>\n\u003cp>把AI当作智能伙伴，实际需要给它一项可持续接续的职责，而非一个拟人化名字。\u003c/p>\n\u003ch2 id=\"lesson-17-section-1\">一张工单可以怎样被接住\u003c/h2>\n\u003cp>在\u003ca href=\"#case-c\">设备案例\u003c/a>中，AI可以准备派工前资料：识别当前设备，取得历史，发现版本或动作缺项，组织补问。资料回来后重新比较，需要时交给专业支持。\u003c/p>\n\u003cp>派工以后，职责也可以包括检查是否被系统接受、人员是否到场、客户是否恢复，以及复发是否接回同一设备。每一步的完成范围都应清楚，不能把写好说明当作服务完成。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base 3ZWlnaHQ9IjQwMCI+6K6w5b2V5oyB5LmF77yM5LiN562J5LqO5qih5Z6L5Y+C5pWw5bey5pu05pawPC90ZXh0Pjwvc3ZnPg==)\n\n## 持续不是一直保持对话\n\n客户新消息、状态变化或约定检查到来时，业务系统把同一任务及已有经过交给AI；AI取得所需材料、决定本轮动作，写回结果与未完成事项；需要等别人时，本轮可以结束。下一次触发再继续。\n\n因此，一句“我会跟进”并不会自动产生后台工作。触发、持久记录、工具与恢复，需要产品和工程提供。模型当前知道什么，也取决于本轮实际取得了什么。\n\n## 职责的边界，决定它能够主动到哪里\n\n“负责售后”过大，“把派工前材料准备到可采用”则有对象、使用者和结果。起步可以小，随着质量、执行和异常处理证据增加，再扩大范围。\n\n持续伙伴还可以帮助产生新认识：四张恢复记录里的动作混杂，AI指出差别，提出可区分的观察，专业人员安排核对，结果再改变方法。它不只扩散旧答案，也能参与发展新的know-how。\n\nAgent工程把模型、工具与环境反馈组织在连续工作中。[工程材料](https://www.anthropic.com/research/building-effective-agents) 企业要做的是让这些能力取得真实条件，并给出适合的决定范围。\n\n判断伙伴是否有用，可以看它有没有减少重复解释，是否记得未完成事项，情况变化后能否改法，以及下一岗位是否得到更可用的材料。委派范围由这些表现发展，人的参与也应解决具体问题，而非只多加一个确认按钮。\n","text":"# 第17章｜AI怎样从回答一次，变成接续一项工作\n\n客户补来一段设备运行描述，技术员稍后更新现场动作，第二天又收到复发消息。如果每次都重新问AI，企业得到的是几次回答；若系统能识别这是同一项服务、接着原有经过推进，工作关系就不同了。\n\n把AI当作智能伙伴，实际需要给它一项可持续接续的职责，而非一个拟人化名字。\n\n## 一张工单可以怎样被接住\n\n在设备案例中，AI可以准备派工前资料：识别当前设备，取得历史，发现版本或动作缺项，组织补问。资料回来后重新比较，需要时交给专业支持。\n\n派工以后，职责也可以包括检查是否被系统接受、人员是否到场、客户是否恢复，以及复发是否接回同一设备。每一步的完成范围都应清楚，不能把写好说明当作服务完成。\n\n \n\n## 持续不是一直保持对话\n\n客户新消息、状态变化或约定检查到来时，业务系统把同一任务及已有经过交给AI；AI取得所需材料、决定本轮动作，写回结果与未完成事项；需要等别人时，本轮可以结束。下一次触发再继续。\n\n因此，一句“我会跟进”并不会自动产生后台工作。触发、持久记录、工具与恢复，需要产品和工程提供。模型当前知道什么，也取决于本轮实际取得了什么。\n\n## 职责的边界，决定它能够主动到哪里\n\n“负责售后”过大，“把派工前材料准备到可采用”则有对象、使用者和结果。起步可以小，随着质量、执行和异常处理证据增加，再扩大范围。\n\n持续伙伴还可以帮助产生新认识：四张恢复记录里的动作混杂，AI指出差别，提出可区分的观察，专业人员安排核对，结果再改变方法。它不只扩散旧答案，也能参与发展新的know-how。\n\nAgent工程把模型、工具与环境反馈组织在连续工作中。工程材料 企业要做的是让这些能力取得真实条件，并给出适合的决定范围。\n\n判断伙伴是否有用，可以看它有没有减少重复解释，是否记得未完成事项，情况变化后能否改法，以及下一岗位是否得到更可用的材料。委派范围由这些表现发展，人的参与也应解决具体问题，而非只多加一个确认按钮。\n"},{"file":"18-人机分工.md","id":"lesson-18","number":18,"role":"核心课","part":3,"title":"第18章｜AI提出更多候选以后，谁来选，怎样才选得好","md":"# 第18章｜AI提出更多候选以后，谁来选，怎样才选得好\n\n工业品牌内容团队的初稿变多，专家却更忙了。专家既要找产品依据，也要筛选角度、改错误、判断能否发布。把“最后由人确认”当作固定答案，可能只是把新工作量转给最稀缺的人。\n\n人机分工需要拆到任务阶段，再看组合后的真实表现。\n\n## 同一项工作，包含几种不同能力\n\n资料整理要忠实，构思需要有用候选，选择要识别重要差别，正式交付还需要客户接受与实际行动。擅长生成，不等于擅长选择；选对了，也不等于交付链已经具备容量。\n\n在[内容服务案例](案例D-专业服务.md)中，AI可以先组织现行产品材料和待确认项，让专家处理真正需要专业判断的地方。它也可能参与筛选，但应与人员独立表现和其他组合比较，而不是预先认定某方永远擅长最终判断。\n\n## 最终质量变好，选择能力仍可能有缺口\n\n宝洁创新实验把候选生成、组内选择和最终质量分开观察；最终方案改善，并不意味着每个环节都同步成熟。[研究原文](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n用一个独立教学算例看这个区别：\n\n| 安排 | 方案池 | 选中 |\n|---|---|---:|\n| 原安排 | 70、80 | 80 |\n| 新安排 | 92、98 | 92 |\n\n新安排没选到自身最好的98，最终92仍超过原来的80。分数不是该研究数据。它说明企业若只看最终质量，可能不知道该改构思还是选择；只看有没有选到最优，又可能忽视候选整体已经改善。\n\n## 复核怎样才有经济意义\n\n若专家必须从原件重做一遍，系统并未省去那段劳动。若AI把依据、冲突和修改集中呈现，专家只处理重要差别，组合才可能更有效。需要同时看质量、核验时间和返工，而非只看模型输出。\n\n内容案例的方案假设，从每天核4篇提高到6篇，靠的是改变核验工作；这要用同等最终质量验证。专家多点几个确认按钮，并不构成这项能力变化。\n\n## 按实际条件发展委派\n\n常规、易核验且反复稳定的任务，可以考虑更多自动完成；新型号、信息冲突和高后果差别，则提供相应专业支持。不同经验人员也可能需要不同辅助。\n\n分工最终服务于可接受的工作。对这支团队，先查清专家在反复做什么，比立刻讨论AI是否能够“替代审核岗位”更能找到可用改法。随着证据和任务变化，分工也应能够更新。\n","html":"\u003ch1>第18章｜AI提出更多候选以后，谁来选，怎样才选得好\u003c/h1>\n\u003cp>工业品牌内容团队的初稿变多，专家却更忙了。专家既要找产品依据，也要筛选角度、改错误、判断能否发布。把“最后由人确认”当作固定答案，可能只是把新工作量转给最稀缺的人。\u003c/p>\n\u003cp>人机分工需要拆到任务阶段，再看组合后的真实表现。\u003c/p>\n\u003ch2 id=\"lesson-18-section-1\">同一项工作，包含几种不同能力\u003c/h2>\n\u003cp>资料整理要忠实，构思需要有用候选，选择要识别重要差别，正式交付还需要客户接受与实际行动。擅长生成，不等于擅长选择；选对了，也不等于交付链已经具备容量。\u003c/p>\n\u003cp>在\u003ca href=\"#case-d\">内容服务案例\u003c/a>中，AI可以先组织现行产品材料和待确认项，让专家处理真正需要专业判断的地方。它也可能参与筛选，但应与人员独立表现和其他组合比较，而不是预先认定某方永远擅长最终判断。\u003c/p>\n\u003ch2 id=\"lesson-18-section-2\">最终质量变好，选择能力仍可能有缺口\u003c/h2>\n\u003cp>宝洁创新实验把候选生成、组内选择和最终质量分开观察；最终方案改善，并不意味着每个环节都同步成熟。\u003ca href=\"https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702\" target=\"_blank\" rel=\"noopener noreferrer\">研究原文\u003c/a>\u003c/p>\n\u003cp>用一个独立教学算例看这个区别：\u003c/p>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>安排\u003c/th>\n\u003cth>方案池\u003c/th>\n\u003cth align=\"right\">选中\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>原安排\u003c/td>\n\u003ctd>70、80\u003c/td>\n\u003ctd align=\"right\">80\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新安排\u003c/td>\n\u003ctd>92、98\u003c/td>\n\u003ctd align=\"right\">92\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>新安排没选到自身最好的98，最终92仍超过原来的80。分数不是该研究数据。它说明企业若只看最终质量，可能不知道该改构思还是选择；只看有没有选到最优，又可能忽视候选整体已经改善。\u003c/p>\n\u003ch2 id=\"lesson-18-section-3\">复核怎样才有经济意义\u003c/h2>\n\u003cp>若专家必须从原件重做一遍，系统并未省去那段劳动。若AI把依据、冲突和修改集中呈现，专家只处理重要差别，组合才可能更有效。需要同时看质量、核验时间和返工，而非只看模型输出。\u003c/p>\n\u003cp>内容案例的方案假设，从每天核4篇提高到6篇，靠的是改变核验工作；这要用同等最终质量验证。专家多点几个确认按钮，并不构成这项能力变化。\u003c/p>\n\u003ch2 id=\"lesson-18-section-4\">按实际条件发展委派\u003c/h2>\n\u003cp>常规、易核验且反复稳定的任务，可以考虑更多自动完成；新型号、信息冲突和高后果差别，则提供相应专业支持。不同经验人员也可能需要不同辅助。\u003c/p>\n\u003cp>分工最终服务于可接受的工作。对这支团队，先查清专家在反复做什么，比立刻讨论AI是否能够“替代审核岗位”更能找到可用改法。随着证据和任务变化，分工也应能够更新。\u003c/p>\n","headings":[{"id":"lesson-18-section-1","label":"同一项工作，包含几种不同能力"},{"id":"lesson-18-section-2","label":"最终质量变好，选择能力仍可能有缺口"},{"id":"lesson-18-section-3","label":"复核怎样才有经济意义"},{"id":"lesson-18-section-4","label":"按实际条件发展委派"}],"exportMd":"# 第18章｜AI提出更多候选以后，谁来选，怎样才选得好\n\n工业品牌内容团队的初稿变多，专家却更忙了。专家既要找产品依据，也要筛选角度、改错误、判断能否发布。把“最后由人确认”当作固定答案，可能只是把新工作量转给最稀缺的人。\n\n人机分工需要拆到任务阶段，再看组合后的真实表现。\n\n## 同一项工作，包含几种不同能力\n\n资料整理要忠实，构思需要有用候选，选择要识别重要差别，正式交付还需要客户接受与实际行动。擅长生成，不等于擅长选择；选对了，也不等于交付链已经具备容量。\n\n在[内容服务案例](#case-d)中，AI可以先组织现行产品材料和待确认项，让专家处理真正需要专业判断的地方。它也可能参与筛选，但应与人员独立表现和其他组合比较，而不是预先认定某方永远擅长最终判断。\n\n## 最终质量变好，选择能力仍可能有缺口\n\n宝洁创新实验把候选生成、组内选择和最终质量分开观察；最终方案改善，并不意味着每个环节都同步成熟。[研究原文](https://pubsonline.informs.org/doi/pdf/10.1287/orsc.2025.20702)\n\n用一个独立教学算例看这个区别：\n\n| 安排 | 方案池 | 选中 |\n|---|---|---:|\n| 原安排 | 70、80 | 80 |\n| 新安排 | 92、98 | 92 |\n\n新安排没选到自身最好的98，最终92仍超过原来的80。分数不是该研究数据。它说明企业若只看最终质量，可能不知道该改构思还是选择；只看有没有选到最优，又可能忽视候选整体已经改善。\n\n## 复核怎样才有经济意义\n\n若专家必须从原件重做一遍，系统并未省去那段劳动。若AI把依据、冲突和修改集中呈现，专家只处理重要差别，组合才可能更有效。需要同时看质量、核验时间和返工，而非只看模型输出。\n\n内容案例的方案假设，从每天核4篇提高到6篇，靠的是改变核验工作；这要用同等最终质量验证。专家多点几个确认按钮，并不构成这项能力变化。\n\n## 按实际条件发展委派\n\n常规、易核验且反复稳定的任务，可以考虑更多自动完成；新型号、信息冲突和高后果差别，则提供相应专业支持。不同经验人员也可能需要不同辅助。\n\n分工最终服务于可接受的工作。对这支团队，先查清专家在反复做什么，比立刻讨论AI是否能够“替代审核岗位”更能找到可用改法。随着证据和任务变化，分工也应能够更新。\n","exportSingleMd":"# 第18章｜AI提出更多候选以后，谁来选，怎样才选得好\n\n工业品牌内容团队的初稿变多，专家却更忙了。专家既要找产品依据，也要筛选角度、改错误、判断能否发布。把“ sson-19","number":19,"role":"核心课","part":3,"title":"第19章｜怎样决定哪些路径预设，哪些行动交给Agent","md":"# 第19章｜怎样决定哪些路径预设，哪些行动交给Agent\n\n设备服务同时包含查保修、登记工单、比较历史、选择补问和跟进结果。把它们放进同一界面，并不要求它们使用同一种机制。\n\n明确且可预设的路径交给程序，确有价值的行动选择再留给模型。决定依据是任务，而非自主程度。\n\n## 工作流可以有模型，也可以有分支\n\n查询设备、按现行规则计算日期、缺字段则补问，这些顺序和分支可以预先安排。模型可以负责其中一步，例如整理客户说明，但整体路径仍由程序决定。\n\n所以“资料不足就补问、齐全就登记”不因有菱形或循环箭头就成为Agent。稳定工作写成清楚流程，通常更便于核对、恢复和控制负担。\n\n## Agent把部分选择留在运行中\n\n假设目标是把派工前材料准备到可用。AI看到客户新描述，可以选择查历史、核设备或问客户；发现版本冲突后先核当前版本，取得结果后再选下一步，资料足够时交付，需等待时保存状态。\n\n这条次序是教学示意。其特点是模型结合目标、工具结果和限制选择部分行动，而非逐项填好预设步骤。工具范围、业务决定权和何时结束仍需要安排。\n\nAnthropic采用预设代码路径与模型动态选择来区分两类实现，并强调复杂度应与任务相配。[工程原文](https://www.anthropic.com/research/building-effective-agents)\n\n![上方程序预设查询、分支与登记，下方模型在目标和工具范围内选择所需行动，工具结果返回本轮判断，再决定交付或等待。](assets/19-固定与动态.svg)\n\n## 同一业务通常需要组合\n\n设备身份、登记与正式状态可以由成熟系统管理；非标准说明、相关案例选择和补问可以用模型；采用后的实际动作再回到业务系统。\n\n外围对象、状态和责任清楚，内部保留必要判断空间，才能避免稳定工作反复规划，也避免现场例外全部在系统外处理。\n\n## 自主的收益要能覆盖新增负担\n\n动态选择可能减少预先穷举，也增加多轮调用、重复查询和错误路径。排查时要分清资料、工具、选择与停止条件。系统依赖与维护会形成长期负担。[技术债研究](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n拿一张常规工单与一张有缺项的工单比较，观察系统为什么选下一步、何时认为完成、中断后能否辨认已发生动作。若固定方法已经可靠，保留即可；若动态选择确实改善难以预设的工作，再给它相应空间。\n\n成熟的实现可以很简单。它需要能够解释为什么这样组织工作，也能在条件变化后调整，而无需用Agent数量显示先进程度。\n","html":"\u003ch1>第19章｜怎样决定哪些路径预设，哪些行动交给Agent\u003c/h1>\n\u003cp>设备服务同时包含查保修、登记工单、比较历史、选择补问和跟进结果。把它们放进同一界面，并不要求它们使用同一种机制。\u003c/p>\n\u003cp>明确且可预设的路径交给程序，确有价值的行动选择再留给模型。决定依据是任务，而非自主程度。\u003c/p>\n\u003ch2 id=\"lesson-19-section-1\">工作流可以有模型，也可以有分支\u003c/h2>\n\u003cp>查询设备、按现行规则计算日期、缺字段则补问，这些顺序和分支可以预先安排。模型可以负责其中一步，例如整理客户说明，但整体路径仍由程序决定。\u003c/p>\n\u003cp>所以“资料不足就补问、齐全就登记”不因有菱形或循环箭头就成为Agent。稳定工作写成清楚流程，通常更便于核对、恢复和控制负担。\u003c/p>\n\u003ch2 id=\"lesson-19-section-2\">Agent把部分选择留在运行中\u003c/h2>\n\u003cp>假设目标是把派工前材料准备到可用。AI看到客户新描述，可以选择查历史、核设备或问客户；发现版本冲突后先核当前版本，取得结果后再选下一步，资料足够时交付，需等待时保存状态。\u003c/p>\n\u003cp>这条次序是教学示意。其特点是模型结合目标、工具结果和限制选择部分行动，而非逐项填好预设步骤。工具范围、业务决定权和何时结束仍需要安排。\u003c/p>\n\u003cp>Anthropic采用预设代码路径与模型动态选择来区分两类实现，并强调复杂度应与任务相配。\u00 也增加多轮调用、重复查询和错误路径。排查时要分清资料、工具、选择与停止条件。系统依赖与维护会形成长期负担。[技术债研究](https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf)\n\n拿一张常规工单与一张有缺项的工单比较，观察系统为什么选下一步、何时认为完成、中断后能否辨认已发生动作。若固定方法已经可靠，保留即可；若动态选择确实改善难以预设的工作，再给它相应空间。\n\n成熟的实现可以很简单。它需要能够解释为什么这样组织工作，也能在条件变化后调整，而无需用Agent数量显示先进程度。\n","exportSingleMd":"# 第19章｜怎样决定哪些路径预设，哪些行动交给Agent\n\n设备服务同时包含查保修、登记工单、比较历史、选择补问和跟进结果。把它们放进同一界面，并不要求它们使用同一种机制。\n\n明确且可预设的路径交给程序，确有价值的行动选择再留给模型。决定依据是任务，而非自主程度。\n\n## 工作流可以有模型，也可以有分支\n\n查询设备、按现行规则计算日期、缺字段则补问，这些顺序和分支可以预先安排。模型可以负责其中一步，例如整理客户说明，但整体路径仍由程序决定。\n\n所以“资料不足就补问、齐全就登记”不因有菱形或循环箭头就成为Agent。稳定工作写成清楚流程，通常更便于核对、恢复和控制负担。\n\n## Agent把部分选择留在运行中\n\n假设目标是把派工前材料准备到可用。AI看到客户新描述，可以选择查历史、核设备或问客户；发现版本冲突后先核当前版本，取得结果后再选下一步，资料足够时交付，需等待时保存状态。\n\n这条次序是教学示意。其特点是模型结合目标、工具结果和限制选择部分行动，而非逐项填好预设步骤。工具范围、业务决定权和何时结束仍需要安排。\n\nAnthropic采用预设代码路径与模型动态选择来区分两类实现，并强调复杂度应与任务相配。[工程原文](https://www.anthropic.com/research/building-effective-agents)\n\n![上方程序预设查询、分支与登记，下方模型在目标和工具范围内选择所需行动，工具结果返回本轮判断，再决定交付或等待。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNzYwIiB2aWV3Qm94PSIwIDAgMzYwIDc2MCIgcm9sZT0iaW1nIj48dGl0bGU+6LCB5p2l5Yaz5a6a5LiL5LiA5q2lPC90aXRsZT48ZGVzYz7lt6XkvZzmtYHnmoTliIbmlK/lkozlvqrnjq/kuZ/lj6/nlLHnqIvluo/pooTorr7vvJtBZ2VudOeUseaooeWei+e7k+WQiOebruagh+WSjOinguWvn+mAieaLqeW3peWFt++8jOe7k+aenOi/lOWbnuWQjue7p+e7reWIpOaWreaIluS6pOS7mOOAgjwvZGVzYz48ZGVmcz48bWFya2VyIGlkPSJhcnJvdyIgdmlld0JveD0iMCAwIDEwIDEwIiByZWZYPSI5IiByZWZZPSI1IiBtYXJrZXJXaWR0aD0iNyIgbWFya2VySGVpZ2h0PSI3IiBvcmllbnQ9ImF1dG8tc3RhcnQtcmV2ZXJzZSI+PHBhdGggZD0iTTAgMEwxMCA1TDAgMTB6IiBmaWxsPSIjMTY1ZDUyIi8+PC9tYXJrZXI+PHBhdHRlcm4gaWQ9InVua25vd24iIHdpZHRoPSI4IiBoZWlnaHQ9IjgiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPjxwYXRoIGQ9Ik0tMiAyTDIgLTJNMCA4TDggME02IDEwTDEwIDYiIHN0cm9rZT0iIzg3NWQyMiIgc3Ryb2tlLXdpZHRoPSIxLjUiLz48L3BhdHRlcm4+PC9kZWZzPjxyZWN0IHdpZHRoPSIzNjAiIGhlaWdodD0iNzYwIiByeD0iOCIgZmlsbD0iI2Y2ZjhmMyIvPjx0ZXh0IHg9IjI0IiB5PSIzOSIgZm9udC1mYW1pbHk9IlBpbmdGYW5nIFNDLE1pY 与任务相配。工程原文\n\n \n\n## 同一业务通常需要组合\n\n设备身份、登记与正式状态可以由成熟系统管理；非标准说明、相关案例选择和补问可以用模型；采用后的实际动作再回到业务系统。\n\n外围对象、状态和责任清楚，内部保留必要判断空间，才能避免稳定工作反复规划，也避免现场例外全部在系统外处理。\n\n## 自主的收益要能覆盖新增负担\n\n动态选择可能减少预先穷举，也增加多轮调用、重复查询和错误路径。排查时要分清资料、工具、选择与停止条件。系统依赖与维护会形成长期负担。技术债研究\n\n拿一张常规工单与一张有缺项的工单比较，观察系统为什么选下一步、何时认为完成、中断后能否辨认已发生动作。若固定方法已经可靠，保留即可；若动态选择确实改善难以预设的工作，再给它相应空间。\n\n成熟的实现可以很简单。它需要能够解释为什么这样组织工作，也能在条件变化后调整，而无需用Agent数量显示先进程度。\n"},{"file":"20-上下文与检索.md","id":"lesson-20","number":20,"role":"核心课","part":3,"title":"第20章｜旧报价找到了，为什么还不能直接拿来用","md":"# 第20章｜旧报价找到了，为什么还不能直接拿来用\n\n客户的产品描述与一笔旧询价很像，AI迅速找到历史报价。型号相近、数量接近、方案也成功交过。可是价格已经变化，客户本次只接受三天交货，旧案却允许十天。\n\n在[工业品案例](案例B-智能资源成本.md)中，检索成功只解决了“找到可比较材料”。当前能不能采用，需要再看关键条件。\n\n## 长期保存与本次使用是两项工作\n\n企业可以保存原件、方法、反例和历史版本。本次任务只需要相关部分，再加当前目标、事实和可用资源。模型不会因为企业拥有这些资料，就自动读到所有重要内容。\n\n材料越多，还可能带来冲突、费用与注意力负担。上下文工程关心怎样让当前工作取得合适信息，外部记忆和检索提供机制，业务知识是否正确仍需维护。[工程材料](https://www.anthropic.com/research/effective-context-engineering-for-ai-agents)\n\n## 材料的地位需要不同\n\n| 取得的材料 | 本次怎样用 |\n|---|---|\n| 客户当前要求 | 界定目标、期限与限制 |\n| 现行价格、库存与供货确认 | 判断当前可履约路线 |\n| 历史报价与适配案例 | 提供线索，比较过去条件 |\n| 正式规则与方法状态 | 约束可以采用什么 |\n| 反例与修订 | 避免重复旧错误 |\n\n旧报价可以帮助理解怎样取舍，不能覆盖现行价格；一次成功的适配可以提示核什么，不能填满当前未知工况。它们都出现在材料包里，并不因此具有同等事实地位。\n\n![历史案例、规则与反例经条件和版本检查进入本次任务，当前事实另行进入；相似材料不能覆盖已经变化的条件。](assets/20-当前上下文.svg)\n\n## 看一次建议是否真的用对了材料\n\n检查它引用了什么，是否保留当前期限，是否把历史供应承诺当作今天可用，是否识别了适配差异。不要只读AI事后解释，还应回到实际取得的材料与输出。\n\n若正确资料存在却没进入，改关联或筛选；若进入后仍混用，改呈现、任务或核验；若资料自己已经过时，先改知识状态。单纯要求模型更谨慎，往往没有定位问题。\n\n## 用少一些材料，也可以得到更好的工作\n\n确定价格查询只需当前有效记录，没必要把全部历史方案都带进来；复杂替代判断则需要多个候选和重要反例。材料选择应由本次要完成的决定支配。\n\n这家经销商的积累价值，最终要在当前客户面前体现：旧经验帮助团队更快找准问题，当前事实决定实际能承诺什么。两者各就其位，知识库才从存储空间变成生产条件。\n","html":"\u003ch1>第20章｜旧报价找到了，为什么还不能直接拿来用\u003c/h1>\n\u003cp>客户的产品描述与一笔旧询价很像，AI迅速找到历史报价。型号相近、数量接近、方案也成功交过。可是价格已经变化，客户本次只接受三天交货，旧案却允许十天。\u003c/p>\n\u003cp>在\u003ca href=\"#case-b\">工业品案例\u003c/a>中，检索成功只解决了“找到可比较材料”。当前能不能采用，需要再看关键条件。\u003c/p>\n\u003ch2 id=\"lesson-20-section-1\">长期保存与本次使用是两项工作\u003c/h2>\n\u003cp>企业可以保存原件、方法、反例和历史版本。本次任务只需要相关部分，再加当前目标、事实和可用资源。模型不会因为企业拥有这些资料，就自动读到所有重要内容。\u003c/p>\n\u003cp>材料越多，还可能带来冲突、费用与注意力负担。上下文工程关心怎样让当前工作取得合适信息，外部记忆和检索提供机制，业务知识是否正确仍需维护。\u003ca href=\"https://www.anthropic.com/research/effective-context-engineering-for-ai-agents\" target=\"_blank\" rel=\"noopener noreferrer\">工程材料\u003c/a>\u003c/p>\n\u003ch2 id=\"lesson-20-section-2\">材料的地位需要不同\u003c/h2>\n\u003cdiv class=\"table-scroll table-fit\" tabindex=\"0\" aria-label=\"数据表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>取得的材料\u003c/th>\n\u003cth>本次怎样用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>客户当前要求\u003c/td>\n\u003ctd>界定目标、期限与限制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>现行价格、库存与供货确认\u003c/td>\n\u003ctd>判断当前可履约路线\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>历史报价与适配案例\u003c/td>\n\u003ctd>提供线索，比较过去条件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>正式规则与方法状态\u003c/td>\n\u003ctd>约束可以采用什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>反例与修订\u003c/td>\n\u003ctd>避免重复旧错误\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>旧报价可以帮助理解怎样取舍，不能覆盖现行价格；一次成功的适配可以提示核什么，不能填满当前未知工况。它们都出现在材料包里，并不因此具有同等事实地位。\u003c/p>\n\u003cp>\u003cimg class=\"mechanism\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTUwIiB2aWV3Qm94PSIwIDAgMzYwIDU1MCIgcm9sZT0iaW1nIj48dGl0bGU+5oqK6YCC55So5p2Q5paZ5bim6L+b5b2T5YmN5Lu75YqhPC90aXRsZT48ZGVzYz7ljoblj7LmoYjkvovjgIHmraPlvI/op4TliJnlkozlj43kvovnu4/ov4fmnaHku7bkuI7niYjmnKzmo4Dmn6XvvIzlkozlvZPliY3kuovlrp7lhbHlkIzmlK/mjIHmnKzmrKHlt6XkvZzjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMzYwIiBoZWlnaHQ9IjU1MCIgcng9I 到实际取得的材料与输出。\u003c/p>\n\u003cp>若正确资料存在却没进入，改关联或筛选；若进入后仍混用，改呈现、任务或核验；若资料自己已经过时，先改知识状态。单纯要求模型更谨慎，往往没有定位问题。\u003c/p>\n\u003ch2 id=\"lesson-20-section-4\">用少一些材料，也可以得到更好的工作\u003c/h2>\n\u003cp>确定价格查询只需当前有效记录，没必要把全部历史方案都带进来；复杂替代判断则需要多个候选和重要反例。材料选择应由本次要完成的决定支配。\u003c/p>\n\u003cp>这家经销商的积累价值，最终要在当前客户面前体现：旧经验帮助团队更快找准问题，当前事实决定实际能承诺什么。两者各就其位，知识库才从存储空间变成生产条件。\u003c/p>\n","headings":[{"id":"lesson-20-section-1","label":"长期保存与本次使用是两项工作"},{"id":"lesson-20-section-2","label":"材料的地位需要不同"},{"id":"lesson-20-section-3","label":"看一次建议是否真的用对了材料"},{"id":"lesson-20-section-4","label":"用少一些材料，也可以得到更好的工作"}],"exportMd":"# 第20章｜旧报价找到了，为什么还不能直接拿来用\n\n客户的产品描述与一笔旧询价很像，AI迅速找到历史报价。型号相近、数量接近、方案也成功交过。可是价格已经变化，客户本次只接受三天交货，旧案却允许十天。\n\n在[工业品案例](#case-b)中，检索成功只解决了“找到可比较材料”。当前能不能采用，需要再看关键条件。\n\n## 长期保存与本次使用是两项工作\n\n企业可以保存原件、方法、反例和历史版本。本次任务只需要相关部分，再加当前目标、事实和可用资源。模型不会因为企业拥有这些资料，就自动读到所有重要内容。\n\n材料越多，还可能带来冲突、费用与注意力负担。上下文工程关心怎样让当前工作取得合适信息，外部记忆和检索提供机制，业务知识是否正确仍需维护。[工程材料](https://www.anthropic.com/research/effective-context-engineering-for-ai-agents)\n\n## 材料的地位需要不同\n\n| 取得的材料 | 本次怎样用 |\n|---|---|\n| 客户当前要求 | 界定目标、期限与限制 |\n| 现行价格、库存与供货确认 | 判断当前可履约路线 |\n| 历史报价与适配案例 | 提供线索，比较过去条件 |\n| 正式规则与方法状态 | 约束可以采用什么 |\n| 反例与修订 | 避免重复旧错误 |\n\n旧报价可以帮助理解怎样取舍，不能覆盖现行价格；一次成功的适配可以提示核什么，不能填满当前未知工况。它们都出现在材料包里，并不因此具有同等事实地位。\n\n![历史案例、规则与反例经条件和版本检查进入本次任务，当前事实另行进入；相似材料不能覆盖已经变化的条件。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTUwIiB2aWV3Qm94PSIwIDAgMzYwIDU1MCIgcm9sZT0iaW1nIj48dGl0bGU+5oqK6YCC55So5p2Q5paZ5bim6L+b5b2T5YmN5Lu75YqhPC90aXRsZT48ZGVzYz7ljoblj7LmoYjkvovjgIHmraPlvI/op4TliJnlkozlj43kvovnu4/ov4fmnaHku7bkuI7niYjmnKzmo4Dmn6XvvIzlkozlvZPliY3kuovlrp7lhbHlkIzmlK/mjIHmnKzmrKHlt6XkvZzjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PS h0Pjwvc3ZnPg==)\n\n## 看一次建议是否真的用对了材料\n\n检查它引用了什么，是否保留当前期限，是否把历史供应承诺当作今天可用，是否识别了适配差异。不要只读AI事后解释，还应回到实际取得的材料与输出。\n\n若正确资料存在却没进入，改关联或筛选；若进入后仍混用，改呈现、任务或核验；若资料自己已经过时，先改知识状态。单纯要求模型更谨慎，往往没有定位问题。\n\n## 用少一些材料，也可以得到更好的工作\n\n确定价格查询只需当前有效记录，没必要把全部历史方案都带进来；复杂替代判断则需要多个候选和重要反例。材料选择应由本次要完成的决定支配。\n\n这家经销商的积累价值，最终要在当前客户面前体现：旧经验帮助团队更快找准问题，当前事实决定实际能承诺什么。两者各就其位，知识库才从存储空间变成生产条件。\n","exportSingleMd":"# 第20章｜旧报价找到了，为什么还不能直接拿来用\n\n客户的产品描述与一笔旧询价很像，AI迅速找到历史报价。型号相近、数量接近、方案也成功交过。可是价格已经变化，客户本次只接受三天交货，旧案却允许十天。\n\n在[工业品案例](https://zhongky1995.github.io/gaidn-fde-handbook/#case-b)中，检索成功只解决了“找到可比较材料”。当前能不能采用，需要再看关键条件。\n\n## 长期保存与本次使用是两项工作\n\n企业可以保存原件、方法、反例和历史版本。本次任务只需要相关部分，再加当前目标、事实和可用资源。模型不会因为企业拥有这些资料，就自动读到所有重要内容。\n\n材料越多，还可能带来冲突、费用与注意力负担。上下文工程关心怎样让当前工作取得合适信息，外部记忆和检索提供机制，业务知识是否正确仍需维护。[工程材料](https://www.anthropic.com/research/effective-context-engineering-for-ai-agents)\n\n## 材料的地位需要不同\n\n| 取得的材料 | 本次怎样用 |\n|---|---|\n| 客户当前要求 | 界定目标、期限与限制 |\n| 现行价格、库存与供货确认 | 判断当前可履约路线 |\n| 历史报价与适配案例 | 提供线索，比较过去条件 |\n| 正式规则与方法状态 | 约束可以采用什么 |\n| 反例与修订 | 避免重复旧错误 |\n\n旧报价可以帮助理解怎样取舍，不能覆盖现行价格；一次成功的适配可以提示核什么，不能填满当前未知工况。它们都出现在材料包里，并不因此具有同等事实地位。\n\n![历史案例、规则与反例经条件和版本检查进入本次任务，当前事实另行进入；相似材料不能覆盖已经变化的条件。](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzNjAiIGhlaWdodD0iNTUwIiB2aWV3Qm94PSIwIDAgMzYwIDU1MCIgcm9sZT0iaW1nIj48dGl0bGU+5oqK6YCC55So5p2Q5paZ5bim6L+b5b2T5YmN5Lu75YqhPC90aXRsZT48ZGVzYz7ljoblj7LmoYjkvovjgIHmraPlvI/op4TliJnlkozlj43kvovnu4/ov4fmnaHku7bkuI7niYjmnKzmo4Dmn6XvvIzlkozlvZPliY3kuovlrp7lhbHlkIzmlK/mjIHmnKzmrKHlt6XkvZzjgII8L2Rlc2M+PGRlZnM+PG1hcmtlciBpZD0iYXJyb3ciIHZpZXdCb3g9IjAgMCAxMCAxMCIgcmVmWD0iOSIgcmVmWT0iNSIgbWFya2VyV2lkdGg9IjciIG1hcmtlckhlaWdodD0iNyIgb3JpZW50PSJhdXRvLXN0YXJ0LXJldmVyc2UiPjxwYXRoIGQ9Ik0wIDBMMTAgNUwwIDEweiIgZmlsbD0iIzE2NWQ1MiIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJ1bmtub3duIiB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIj48cGF0aCBkPSJNLTIgMkwyIC0yTTAgOEw4IDBNNiAxMEwxMCA2IiBzdHJva2U9IiM4NzVkMjIiIHN0cm9rZS13aWR0aD0iMS41Ii8+PC9wYXR0ZXJuPjwvZGVmcz4
